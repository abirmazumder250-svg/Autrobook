<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Profile Status - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --blue:#1877f2; --brand:#4caf50; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);text-align:center;} 
.header{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);} 
.header b{flex:1;text-align:center;font-size:18px;} 
.profile-pic{width:100px;height:100px;border-radius:50%;margin:20px auto;position:relative;} 
.profile-pic img{width:100%;height:100%;border-radius:50%;object-fit:cover;} 
.blue-dot{position:absolute;bottom:5px;right:5px;width:25px;height:25px;background:var(--blue);border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;color:white;font-size:14px;} 
.section{padding:16px;text-align:left;} 
.section h2{font-size:18px;margin:16px 0 8px;} 
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;} 
.item:hover{background:#2e2f30;} 
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);} 
.item .gray{width:10px;height:10px;border-radius:50%;background:#555;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Profile status</b>
<span>👤</span>
</div>

<div class="profile-pic">
<img id="profilePic" src="https://via.placeholder.com/100/555/fff">
<div class="blue-dot">✓</div>
</div>
<h2 id="profileName">User Name</h2>

<div class="section">
<h2>Features</h2>
<div class="item">
<span>⭐</span>
<div><b>Recommendations</b><div style="font-size:12px"><span class="dot"></span> Active</div></div>
<span style="margin-left:auto">›</span>
</div>
<div class="item">
<span>$</span>
<div><b>Monetization</b><div style="font-size:12px"><span class="gray"></span> Not Available Now</div></div>
<span style="margin-left:auto">›</span>
</div>
<div class="item">
<span>🏪</span>
<div><b>Marketplace</b><div style="font-size:12px"><span class="dot"></span> Active</div></div>
<span style="margin-left:auto">›</span>
</div>
</div>

<div class="section">
<h2>Get help</h2>
<div class="item" onclick="window.location.href='autro-ai.html'"><span>✨</span> Autro AI Assistant <span style="margin-left:auto">›</span></div>
<div class="item"><span>❤️</span> Support <span style="margin-left:auto">›</span></div>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {};
document.getElementById('profileName').innerText = currentUser.name || 'User';
document.getElementById('profilePic').src = currentUser.profilePic || 'https://via.placeholder.com/100/555/fff';
</script>
</body> </html>
