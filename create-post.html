<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Post</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg-page: #000000;
      --bg-surface: #111111;
      --bg-card: #161616;
      --bg-chip: #222222;
      --bg-chip-hover: #2e2e2e;
      --text-primary: #ffffff;
      --text-secondary: #b8b8b8;
      --border-color: rgba(255, 255, 255, 0.16);
      --accent-invert-bg: #ffffff;
      --accent-invert-fg: #000000;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f6f6f6;
        --bg-chip: #efefef;
        --bg-chip-hover: #e2e2e2;
        --text-primary: #000000;
        --text-secondary: #4a4a4a;
        --border-color: rgba(0, 0, 0, 0.14);
        --accent-invert-bg: #000000;
        --accent-invert-fg: #ffffff;
        --shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 105px;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .composer-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .header-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-chip);
      color: var(--text-primary);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }

    .header-close-btn:hover {
      background: var(--bg-chip-hover);
    }

    .header-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
      min-width: 0;
      min-height: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-done-btn {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .header-done-btn:hover:not(:disabled) {
      opacity: 0.88;
    }

    .header-done-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .header-done-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* MAIN CONTAINER */
    .composer-body {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    /* PROFILE ROW */
    .author-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1.5px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .author-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .author-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      min-height: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audience-select {
      width: fit-content;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* CHIPS + 'B' ROW */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 14px;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .action-chip:hover {
      background: var(--bg-chip-hover);
    }

    .action-chip.active {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border-color: var(--accent-invert-bg);
    }

    .action-chip i {
      font-size: 13px;
    }

    .bold-chip-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-size: 14.5px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .bold-chip-btn:hover {
      background: var(--bg-chip-hover);
    }

    .bold-chip-btn.active {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border-color: var(--accent-invert-bg);
    }

    /* EDITOR CARD */
    .editor-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .caption-field {
      width: 100%;
      min-height: 140px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 19px;
      line-height: 1.48;
      resize: none;
      outline: none;
    }

    .caption-field::placeholder {
      color: var(--text-secondary);
      opacity: 0.78;
    }

    .caption-field.is-bold {
      font-weight: 700;
    }

    .meta-badges-box {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .meta-badges-box.show {
      display: flex;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .meta-pill button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      padding: 0 2px;
    }

    /* PREVIEW BOX */
    .preview-box {
      display: none;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .preview-box.active {
      display: block;
    }

    .preview-box img,
    .preview-box video {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      display: block;
      background: var(--bg-page);
    }

    .remove-preview-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* PROGRESS */
    .progress-box {
      display: none;
      margin-bottom: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .progress-box.active {
      display: block;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--bg-chip);
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-invert-bg);
      transition: width 0.25s ease;
    }

    /* BOTTOM SINGLE GALLERY BAR */
    .bottom-gallery-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      z-index: 60;
      pointer-events: none;
    }

    .gallery-only-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .gallery-only-btn:hover {
      opacity: 0.9;
    }

    .gallery-only-btn:active {
      transform: scale(0.97);
    }

    /* FEELINGS MODAL */
    .feeling-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 120;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .feeling-modal-backdrop.open {
      display: flex;
    }

    .feeling-modal-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 78vh;
      background: var(--bg-surface);
      color: var(--text-primary);
      border-top: 1px solid var(--border-color);
      border-radius: 22px 22px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .feeling-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feeling-modal-title {
      font-size: 16.5px;
      font-weight: 800;
    }

    .feeling-close-btn {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 6px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .feeling-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      overflow-y: auto;
      padding-bottom: 8px;
    }

    .feeling-option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .feeling-option-btn:hover,
    .feeling-option-btn.selected {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border-color: var(--accent-invert-bg);
    }

    .feeling-emoji {
      font-size: 19px;
      line-height: 1;
    }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      display: none;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="composer-header">
    <a href="index.html" class="header-close-btn" title="Back">
      <i class="fas fa-xmark"></i>
    </a>
    <div id="headerUserName" class="header-title"></div>
    <button type="button" id="doneBtn" class="header-done-btn" onclick="handleDonePost()">Done</button>
  </header>

  <main class="composer-body">
    <!-- PROFILE ROW -->
    <div class="author-line">
      <div id="profileAvatarBox" class="author-avatar"></div>
      <div class="author-info">
        <div id="profileNameBox" class="author-name"></div>
        <select id="postAudience" class="audience-select" aria-label="Audience">
          <option value="public">Public</option>
          <option value="followers">Followers</option>
          <option value="only_me">Only Me</option>
        </select>
      </div>
    </div>

    <!-- ACTION CHIPS + 'B' RIGHT BESIDE FEELINGS -->
    <div class="chips-row">
      <button type="button" id="musicChipBtn" class="action-chip" onclick="openPhoneMusicFiles()">
        <i class="fas fa-music"></i>
        <span id="musicChipLabel">Music</span>
      </button>

      <button type="button" id="peopleChipBtn" class="action-chip" onclick="openPeopleFriendsPage()">
        <i class="fas fa-user-group"></i>
        <span id="peopleChipLabel">People</span>
      </button>

      <button type="button" id="locationChipBtn" class="action-chip" onclick="fetchLiveLocation()">
        <i class="fas fa-location-dot"></i>
        <span id="locationChipLabel">Location</span>
      </button>

      <button type="button" id="feelingsChipBtn" class="action-chip" onclick="openFeelingsModal()">
        <i class="far fa-face-smile"></i>
        <span id="feelingsChipLabel">Feelings</span>
      </button>

      <button type="button" id="boldBtn" class="bold-chip-btn" onclick="toggleCaptionBold()" title="Bold">
        B
      </button>
    </div>

    <!-- CAPTION EDITOR CARD -->
    <section class="editor-card">
      <textarea
        id="captionInput"
        class="caption-field"
        maxlength="2000"
        placeholder="What's on your mind?"
      ></textarea>
      <div id="metaBadgesBox" class="meta-badges-box"></div>
    </section>

    <!-- UPLOAD PROGRESS -->
    <div id="progressBox" class="progress-box">
      <div id="progressText" style="font-size:12.5px;color:var(--text-secondary);">Publishing...</div>
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- MEDIA PREVIEW -->
    <div id="previewBox" class="preview-box">
      <button type="button" class="remove-preview-btn" onclick="clearGalleryMedia()" title="Remove">
        <i class="fas fa-xmark"></i>
      </button>
      <div id="previewContent"></div>
    </div>
  </main>

  <!-- BOTTOM SINGLE GALLERY OPTION -->
  <div class="bottom-gallery-wrap">
    <button type="button" class="gallery-only-btn" onclick="openPhoneGallery()">
      <i class="far fa-images"></i>
      <span>Gallery</span>
    </button>
  </div>

  <!-- HIDDEN FILE INPUTS -->
  <input type="file" id="phoneGalleryInput" accept="image/*,video/*" style="display:none;" onchange="handleGalleryPicked(event)">
  <input type="file" id="phoneMusicInput" accept="audio/*" style="display:none;" onchange="handleMusicPicked(event)">

  <!-- FEELINGS MODAL (16 Emotions in English) -->
  <div id="feelingsModalBackdrop" class="feeling-modal-backdrop" onclick="closeFeelingsModal(event)">
    <div class="feeling-modal-sheet" onclick="event.stopPropagation()">
      <div class="feeling-modal-header">
        <span class="feeling-modal-title">How are you feeling?</span>
        <button type="button" class="feeling-close-btn" onclick="closeFeelingsModal()">Close</button>
      </div>
      <div id="feelingsGrid" class="feeling-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const EMOTIONS_LIST = [
      { label: 'Sad', emoji: '😢' },
      { label: 'Enjoyful', emoji: '😍' },
      { label: 'Alas', emoji: '😰' },
      { label: 'Angry', emoji: '😠' },
      { label: 'Cry', emoji: '😭' },
      { label: 'Funny', emoji: '😂' },
      { label: 'Happy', emoji: '😊' },
      { label: 'Excited', emoji: '🤩' },
      { label: 'Loved', emoji: '🥰' },
      { label: 'Blessed', emoji: '🙏' },
      { label: 'Tired', emoji: '😴' },
      { label: 'Confused', emoji: '🤔' },
      { label: 'Cool', emoji: '😎' },
      { label: 'Grateful', emoji: '🤗' },
      { label: 'Surprised', emoji: '😮' },
      { label: 'Motivated', emoji: '💪' }
    ];

    let currentUser = null;
    let currentProfile = null;
    let galleryFile = null;
    let galleryMediaType = null;
    let musicFile = null;
    let selectedMusicName = '';
    let selectedPeople = '';
    let selectedLocation = '';
    let selectedFeeling = null;
    let isBoldText = false;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._cpToastTimer);
      window._cpToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
    }

    function sanitizeSavedName(val) {
      const clean = String(val || '').trim();
      if (!clean) return '';
      if (/^test\s*user$/i.test(clean) || /^tu$/i.test(clean)) return '';
      return clean;
    }

    function resolveMediaUrl(url) {
      const raw = String(url || '').trim();
      if (!raw) return '';
      if (raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('data:') || raw.startsWith('blob:')) {
        return raw;
      }
      if (sb) {
        return sb.storage.from('media').getPublicUrl(raw.replace(/^\/+/, '')).data.publicUrl || '';
      }
      return '';
    }

    function applyAccountIdentity(name, avatarUrl, userId = null) {
      const cleanName = sanitizeSavedName(name);
      const safeAvatar = resolveMediaUrl(avatarUrl || '');

      currentProfile = {
        id: userId || currentUser?.id || null,
        full_name: cleanName,
        avatar_url: safeAvatar
      };

      document.getElementById('headerUserName').textContent = cleanName;
      document.getElementById('profileNameBox').textContent = cleanName;
      document.title = cleanName ? `${cleanName} · Create Post` : 'Create Post';

      const avatarBox = document.getElementById('profileAvatarBox');
      avatarBox.innerHTML = '';
      if (safeAvatar) {
        const img = document.createElement('img');
        img.src = safeAvatar;
        img.alt = cleanName;
        img.onerror = () => {
          img.remove();
        };
        avatarBox.appendChild(img);
      }
    }

    async function loadSupabaseAccount() {
      applyAccountIdentity('', '', null);
      if (!sb) return;

      try {
        const { data: { session } } = await sb.auth.getSession();
        currentUser = session?.user || null;

        if (currentUser) {
          const { data: prof } = await sb
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .maybeSingle();

          const meta = currentUser.user_metadata || {};
          const savedName =
            prof?.full_name ||
            prof?.name ||
            prof?.display_name ||
            prof?.username ||
            meta.full_name ||
            meta.name ||
            meta.display_name ||
            '';

          const savedAvatar =
            prof?.avatar_url ||
            prof?.avatar ||
            prof?.photo_url ||
            meta.avatar_url ||
            meta.avatar ||
            meta.picture ||
            '';

          applyAccountIdentity(savedName, savedAvatar, currentUser.id);
          return;
        }

        const { data: profilesList } = await sb
          .from('profiles')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1);

        if (profilesList && profilesList.length) {
          const p = profilesList[0];
          const savedName = p.full_name || p.name || p.display_name || p.username || '';
          const savedAvatar = p.avatar_url || p.avatar || p.photo_url || '';
          applyAccountIdentity(savedName, savedAvatar, p.id || null);
        }
      } catch (_) {
        applyAccountIdentity('', '', null);
      }
    }

    // 1. Phone Gallery
    function openPhoneGallery() {
      document.getElementById('phoneGalleryInput').click();
    }

    function handleGalleryPicked(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      galleryFile = file;
      galleryMediaType = file.type.startsWith('video/') ? 'video' : 'image';
      const url = URL.createObjectURL(file);
      const box = document.getElementById('previewBox');
      const content = document.getElementById('previewContent');
      content.innerHTML = galleryMediaType === 'video'
        ? `<video src="${url}" controls playsinline></video>`
        : `<img src="${url}" alt="Gallery media">`;
      box.classList.add('active');
    }

    function clearGalleryMedia() {
      galleryFile = null;
      galleryMediaType = null;
      document.getElementById('phoneGalleryInput').value = '';
      document.getElementById('previewContent').innerHTML = '';
      document.getElementById('previewBox').classList.remove('active');
    }

    // 2. Music -> Phone Files
    function openPhoneMusicFiles() {
      document.getElementById('phoneMusicInput').click();
    }

    function handleMusicPicked(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      musicFile = file;
      selectedMusicName = file.name.replace(/\.[^/.]+$/, '');
      document.getElementById('musicChipBtn').classList.add('active');
      document.getElementById('musicChipLabel').textContent = selectedMusicName;
      renderMetaBadges();
      showToast(`Music selected: ${selectedMusicName}`);
    }

    // 3. People -> id-friends.html
    function openPeopleFriendsPage() {
      const draft = {
        caption: document.getElementById('captionInput').value,
        audience: document.getElementById('postAudience').value,
        musicName: selectedMusicName,
        location: selectedLocation,
        feeling: selectedFeeling,
        people: selectedPeople,
        bold: isBoldText
      };
      sessionStorage.setItem('autro_create_post_draft', JSON.stringify(draft));
      window.location.href = 'id-friends.html?from=create-post';
    }

    function restoreDraftAndFriends() {
      try {
        const raw = sessionStorage.getItem('autro_create_post_draft');
        if (raw) {
          const d = JSON.parse(raw);
          sessionStorage.removeItem('autro_create_post_draft');
          if (d.caption) document.getElementById('captionInput').value = d.caption;
          if (d.audience) document.getElementById('postAudience').value = d.audience;
          if (d.bold) {
            isBoldText = true;
            document.getElementById('captionInput').classList.add('is-bold');
            document.getElementById('boldBtn').classList.add('active');
          }
          if (d.musicName) {
            selectedMusicName = d.musicName;
            document.getElementById('musicChipBtn').classList.add('active');
            document.getElementById('musicChipLabel').textContent = selectedMusicName;
          }
          if (d.location) {
            selectedLocation = d.location;
            document.getElementById('locationChipBtn').classList.add('active');
            document.getElementById('locationChipLabel').textContent = selectedLocation;
          }
          if (d.feeling) {
            selectedFeeling = d.feeling;
            document.getElementById('feelingsChipBtn').classList.add('active');
            document.getElementById('feelingsChipLabel').textContent = `${selectedFeeling.label} ${selectedFeeling.emoji}`;
          }
          if (d.people) {
            selectedPeople = d.people;
          }
        }

        const pickedFriends = sessionStorage.getItem('autro_selected_friends');
        if (pickedFriends) {
          sessionStorage.removeItem('autro_selected_friends');
          const parsed = JSON.parse(pickedFriends);
          selectedPeople = Array.isArray(parsed) ? parsed.join(', ') : String(parsed || '');
        }

        if (selectedPeople) {
          document.getElementById('peopleChipBtn').classList.add('active');
          document.getElementById('peopleChipLabel').textContent = selectedPeople;
        }
        renderMetaBadges();
      } catch (_) {}
    }

    // 4. Live Location
    function fetchLiveLocation() {
      if (!navigator.geolocation) {
        return showToast('Geolocation is not supported on this device.');
      }

      const btn = document.getElementById('locationChipBtn');
      const labelEl = document.getElementById('locationChipLabel');
      labelEl.textContent = 'Locating...';

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          let placeName = `${lat}, ${lon}`;

          try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
            if (resp.ok) {
              const geo = await resp.json();
              const addr = geo.address || {};
              const area = addr.suburb || addr.neighbourhood || addr.city_district || addr.town || addr.city || addr.state || '';
              const country = addr.country || '';
              placeName = [area, country].filter(Boolean).join(', ') || geo.display_name?.split(',').slice(0, 2).join(',') || placeName;
            }
          } catch (_) {}

          selectedLocation = placeName;
          btn.classList.add('active');
          labelEl.textContent = selectedLocation;
          renderMetaBadges();
          showToast(`Location added: ${selectedLocation}`);
        },
        () => {
          labelEl.textContent = selectedLocation || 'Location';
          showToast('Unable to get live location. Please enable GPS.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // 5. Feelings Modal (16 emotions)
    function renderFeelingsGrid() {
      const grid = document.getElementById('feelingsGrid');
      grid.innerHTML = '';
      EMOTIONS_LIST.forEach(item => {
        const isSel = selectedFeeling?.label === item.label;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `feeling-option-btn ${isSel ? 'selected' : ''}`;
        btn.innerHTML = `<span class="feeling-emoji">${item.emoji}</span><span>${item.label}</span>`;
        btn.onclick = () => {
          selectedFeeling = item;
          document.getElementById('feelingsChipBtn').classList.add('active');
          document.getElementById('feelingsChipLabel').textContent = `${item.label} ${item.emoji}`;
          renderMetaBadges();
          closeFeelingsModal();
        };
        grid.appendChild(btn);
      });
    }

    function openFeelingsModal() {
      renderFeelingsGrid();
      document.getElementById('feelingsModalBackdrop').classList.add('open');
    }

    function closeFeelingsModal() {
      document.getElementById('feelingsModalBackdrop').classList.remove('open');
    }

    // 'B' Button right beside Feelings
    function toggleCaptionBold() {
      isBoldText = !isBoldText;
      document.getElementById('captionInput').classList.toggle('is-bold', isBoldText);
      document.getElementById('boldBtn').classList.toggle('active', isBoldText);
      showToast(isBoldText ? 'Bold text ON' : 'Bold text OFF');
    }

    function renderMetaBadges() {
      const box = document.getElementById('metaBadgesBox');
      box.innerHTML = '';
      const chips = [];

      if (selectedFeeling) {
        chips.push({
          text: `Feeling ${selectedFeeling.label} ${selectedFeeling.emoji}`,
          onClear: () => {
            selectedFeeling = null;
            document.getElementById('feelingsChipBtn').classList.remove('active');
            document.getElementById('feelingsChipLabel').textContent = 'Feelings';
            renderMetaBadges();
          }
        });
      }
      if (selectedPeople) {
        chips.push({
          text: `with ${selectedPeople}`,
          onClear: () => {
            selectedPeople = '';
            document.getElementById('peopleChipBtn').classList.remove('active');
            document.getElementById('peopleChipLabel').textContent = 'People';
            renderMetaBadges();
          }
        });
      }
      if (selectedLocation) {
        chips.push({
          text: `at ${selectedLocation}`,
          onClear: () => {
            selectedLocation = '';
            document.getElementById('locationChipBtn').classList.remove('active');
            document.getElementById('locationChipLabel').textContent = 'Location';
            renderMetaBadges();
          }
        });
      }
      if (selectedMusicName) {
        chips.push({
          text: `Music: ${selectedMusicName}`,
          onClear: () => {
            musicFile = null;
            selectedMusicName = '';
            document.getElementById('phoneMusicInput').value = '';
            document.getElementById('musicChipBtn').classList.remove('active');
            document.getElementById('musicChipLabel').textContent = 'Music';
            renderMetaBadges();
          }
        });
      }

      if (!chips.length) {
        box.classList.remove('show');
        return;
      }

      box.classList.add('show');
      chips.forEach(c => {
        const pill = document.createElement('span');
        pill.className = 'meta-pill';
        const txt = document.createElement('span');
        txt.textContent = c.text;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.innerHTML = '<i class="fas fa-xmark"></i>';
        rm.onclick = c.onClear;
        pill.appendChild(txt);
        pill.appendChild(rm);
        box.appendChild(pill);
      });
    }

    function setProgress(pct, msg) {
      const box = document.getElementById('progressBox');
      box.classList.add('active');
      document.getElementById('progressFill').style.width = `${pct}%`;
      if (msg) document.getElementById('progressText').textContent = msg;
    }

    async function uploadToStorage(file, folder) {
      if (!sb || !file) return '';
      const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
      const path = `posts/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await sb.storage.from('media').upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data } = sb.storage.from('media').getPublicUrl(path);
      return data?.publicUrl || '';
    }

    function buildFullCaption() {
      const base = document.getElementById('captionInput').value.trim();
      const parts = [];
      if (selectedFeeling) parts.push(`Feeling ${selectedFeeling.label} ${selectedFeeling.emoji}`);
      if (selectedPeople) parts.push(`with ${selectedPeople}`);
      if (selectedLocation) parts.push(`at ${selectedLocation}`);
      if (selectedMusicName) parts.push(`♪ ${selectedMusicName}`);

      if (parts.length && base) return `${base} — ${parts.join(' · ')}`;
      if (parts.length) return parts.join(' · ');
      return base;
    }

    async function handleDonePost() {
      const caption = buildFullCaption();
      const audience = document.getElementById('postAudience').value;

      if (!caption && !galleryFile && !musicFile) {
        return showToast('Write something or select media first.');
      }

      const btn = document.getElementById('doneBtn');
      btn.disabled = true;
      setProgress(15, 'Preparing post...');

      try {
        let mediaUrl = '';
        if (galleryFile) {
          setProgress(40, 'Uploading media...');
          mediaUrl = await uploadToStorage(galleryFile, galleryMediaType === 'video' ? 'videos' : 'images');
        }

        let musicUrl = '';
        if (musicFile) {
          setProgress(65, 'Uploading music...');
          musicUrl = await uploadToStorage(musicFile, 'music');
        }

        const authorName = currentProfile?.full_name || '';
        const authorAvatar = currentProfile?.avatar_url || '';
        const authorId = currentUser?.id || currentProfile?.id || null;
        const createdAt = new Date().toISOString();

        let savedRow = null;
        if (sb) {
          setProgress(85, 'Saving to Supabase...');
          const { data, error } = await sb
            .from('posts')
            .insert({
              user_id: authorId,
              caption,
              media_url: mediaUrl || musicUrl || null,
              media_type: galleryMediaType ? `${galleryMediaType}/*` : (musicFile ? 'audio/*' : 'text'),
              audience,
              created_at: createdAt
            })
            .select()
            .single();
          if (!error && data) savedRow = data;
        }

        const postPayload = {
          id: savedRow?.id || `post-${Date.now()}`,
          user_id: authorId,
          author_name: authorName,
          avatar: authorAvatar,
          posted_at: createdAt,
          quality: '1080p',
          is_bold: isBoldText,
          is_video: galleryMediaType === 'video',
          media_url: mediaUrl || (galleryFile ? URL.createObjectURL(galleryFile) : ''),
          music_url: musicUrl || (musicFile ? URL.createObjectURL(musicFile) : ''),
          music_name: selectedMusicName || '',
          poster_url: galleryMediaType === 'image' ? (mediaUrl || '') : authorAvatar,
          caption,
          audience,
          reactions: 0,
          views: 0,
          comments: 0,
          shares: 0
        };

        const feedQueue = JSON.parse(localStorage.getItem('autro_instant_feed_posts') || '[]');
        feedQueue.unshift(postPayload);
        localStorage.setItem('autro_instant_feed_posts', JSON.stringify(feedQueue.slice(0, 30)));

        const profilePosts = JSON.parse(localStorage.getItem('autro_profile_posts') || '[]');
        profilePosts.unshift(postPayload);
        localStorage.setItem('autro_profile_posts', JSON.stringify(profilePosts.slice(0, 50)));

        setProgress(100, 'Posted to Feed & Profile!');
        showToast('Post published!');

        const goTarget = sessionStorage.getItem('autro_post_return_target');
        sessionStorage.removeItem('autro_post_return_target');

        setTimeout(() => {
          window.location.href = goTarget === 'profile' ? 'profile.html' : 'index.html';
        }, 450);
      } catch (err) {
        btn.disabled = false;
        document.getElementById('progressBox').classList.remove('active');
        showToast(err?.message || 'Could not publish post.');
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadSupabaseAccount();
      restoreDraftAndFriends();
    });
  </script>
