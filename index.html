<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook</title>
<style>
body {
    margin:0; 
    background:#0a1a0f; 
    color:#e4e6eb; 
    font-family:Arial;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}
.logo {
    width:100px;
    height:100px;
    border-radius:20px;
    animation: fadeIn 1s ease-in;
}
.tagline {
    margin-top:15px;
    font-size:14px;
    color:#4caf50;
    animation: fadeIn 1.5s ease-in;
}
.footer {
    position:absolute;
    bottom:30px;
    font-size:12px;
    color:#556b5e;
}
@keyframes fadeIn {
    from {opacity:0; transform: scale(0.8);}
    to {opacity:1; transform: scale(1);}
}
</style>
</head>
<body>

<img src="logo.png" class="logo">
<div class="tagline">18+ Free Social Media Platform</div>
<div class="footer">from Autrobook</div>

<script>
// Redirect to login.html after 3 seconds
setTimeout(function(){
    window.location.href = "login.html";
}, 3000);
</script>

</body>
</html>
