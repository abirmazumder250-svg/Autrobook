<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #000000;
      --bg-surface: #121212;
      --bg-card: #18191a;
      --bg-pill: #242526;
      --bg-pill-hover: #303234;
      --text-primary: #e4e6eb;
      --text-secondary: #b0b3b8;
      --border-subtle: rgba(255, 255, 255, 0.14);
      --invert-bg: #ffffff;
      --invert-fg: #000000;
      --accent-green: #0a7d3b;
      --accent-green-dark: #0B3D20;
      --accent-mint: #10b981;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #f0f2f5;
        --bg-surface: #ffffff;
        --bg-card: #ffffff;
        --bg-pill: #f0f2f5;
        --bg-pill-hover: #e4e6eb;
        --text-primary: #050505;
        --text-secondary: #65676b;
        --border-subtle: rgba(0, 0, 0, 0.12);
        --invert-bg: #050505;
        --invert-fg: #ffffff;
        --accent-green: #0a7d3b;
        --accent-green-dark: #0B3D20;
        --accent-mint: #10b981;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 74px;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .icon-circle-btn:hover {
      background: var(--bg-pill-hover);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .top-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .autro-a-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 1px solid var(--border-subtle);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .autro-a-btn:hover {
      opacity: 0.88;
    }

    /* PLUS DROPDOWN MENU */
    .plus-menu-popover {
      position: fixed;
      top: 56px;
      right: 54px;
      z-index: 120;
      width: 220px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .plus-menu-popover.open {
      display: flex;
    }

    .plus-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--text-primary);
      border: none;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      text-align: left;
    }

    .plus-menu-item:hover {
      background: var(--bg-pill);
    }

    .plus-menu-item-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .live-lock-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    /* COMPOSER BAR */
    .composer-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }

    .avatar-slot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-primary);
    }

    .avatar-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mind-trigger-btn {
      flex: 1;
      text-align: left;
      background: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14.5px;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mind-trigger-btn:hover {
      background: var(--bg-pill-hover);
      color: var(--text-primary);
    }

    .gallery-trigger-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: transparent;
      color: var(--accent-green);
      border: 1px solid var(--border-subtle);
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .gallery-trigger-btn:hover {
      background: var(--bg-pill);
    }

    /* STORY STRIP */
    .story-strip {
      padding: 12px 14px;
      border-bottom: 8px solid var(--bg-pill);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story-card-box {
      position: relative;
      width: 112px;
      height: 170px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      cursor: pointer;
    }

    .story-card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .story-card-top-label {
      position: relative;
      z-index: 2;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .story-card-bottom {
      position: relative;
      z-index: 2;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 16px 6px 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .story-plus-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 2px solid var(--bg-surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    /* UNIFIED POST-CARD FEED STREAM (FACEBOOK STYLE) */
    .feed-section {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .fb-post {
      background: var(--bg-surface);
      border-bottom: 8px solid var(--bg-pill);
      padding-bottom: 6px;
    }

    .fb-post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
      gap: 10px;
    }

    .fb-author-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .fb-post-avatar-link {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1.5px solid var(--accent-mint);
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .fb-post-avatar-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fb-author-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .fb-author-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      min-height: 18px;
      word-break: break-word;
    }

    .fb-author-name:hover {
      text-decoration: underline;
    }

    .fb-live-time {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fb-views-right {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .fb-caption {
      padding: 2px 14px 10px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fb-caption.bold-text {
      font-weight: 700;
    }

    .fb-media {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .fb-counts-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }

    .fb-reaction-summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .fb-counts-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }

    .fb-action-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin: 0 8px;
      padding: 3px 0;
    }

    .fb-action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 9px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      user-select: none;
      touch-action: manipulation;
      text-decoration: none;
    }

    .fb-action-btn:hover {
      background: var(--bg-pill);
      color: var(--text-primary);
    }

    .fb-action-btn.active {
      color: var(--accent-mint);
      font-weight: 800;
    }

    /* COMMENTS & REPLIES PANEL */
    .comments-panel {
      border-top: 1px solid var(--border-subtle);
      padding: 10px 14px 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .comments-panel.open {
      display: flex;
    }

    .composer-line {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text-pill-input {
      flex: 1;
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 8px 13px;
      font-size: 13.5px;
      outline: none;
    }

    .text-pill-input::placeholder {
      color: var(--text-secondary);
    }

    .pill-btn {
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .pill-btn:hover {
      background: var(--bg-pill-hover);
    }

    .pill-btn.solid {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .comment-row {
      background: var(--bg-pill);
      border-radius: 12px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comment-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .comment-author-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
    }

    .comment-author:hover {
      text-decoration: underline;
    }

    .comment-time {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .comment-body {
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--text-primary);
      word-break: break-word;
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .c-chip-btn {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .c-chip-btn.active {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .replies-list {
      margin-left: 12px;
      padding-left: 10px;
      border-left: 2px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reply-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .reply-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .reply-author {
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
    }

    .reply-time {
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* REACTION POPUP, SHARE MENU, DOTS MENU, REPORT MODAL */
    .reaction-popup {
      position: fixed;
      z-index: 260;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 7px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      user-select: none;
      max-width: calc(100vw - 16px);
    }

    .reaction-popup.open {
      display: flex;
    }

    .reaction-emoji-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .reaction-emoji-btn:hover,
    .reaction-emoji-btn:active {
      background: var(--bg-pill);
      transform: scale(1.22);
    }

    .share-menu,
    .dots-menu {
      position: fixed;
      z-index: 260;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 150px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .share-menu.open,
    .dots-menu.open {
      display: flex;
    }

    .share-menu-btn,
    .dots-menu-btn {
      background: transparent;
      color: var(--text-primary);
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .share-menu-btn:hover,
    .dots-menu-btn:hover {
      background: var(--bg-pill);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 320;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      max-width: 410px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reason-option {
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .reason-option.selected {
      background: var(--invert-bg);
      color: var(--invert-fg);
      font-weight: 700;
    }

    /* BOTTOM NAVIGATION BAR */
    .bottom-nav-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      height: 58px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      padding: 0 4px;
    }

    .bottom-nav-item {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 20px;
      position: relative;
    }

    .bottom-nav-item:hover,
    .bottom-nav-item.active {
      color: var(--text-primary);
    }

    .bottom-nav-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .toast-banner {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 1px solid var(--border-subtle);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 420;
      display: none;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-header">
    <div class="brand-left">
      <a href="shortcut.html" class="icon-circle-btn" id="shortcutMenuBtn" title="Shortcuts">
        <i class="fas fa-bars"></i>
      </a>
      <a href="index.html" class="brand-title">Autrobook</a>
    </div>

    <div class="top-right-actions">
      <button type="button" class="icon-circle-btn" id="plusMenuBtn" title="Create">
        <i class="fas fa-plus"></i>
      </button>
      <a href="search-bar.html" class="icon-circle-btn" id="searchBarBtn" title="Search">
        <i class="fas fa-magnifying-glass"></i>
      </a>
      <a href="autro-chat.html" class="autro-a-btn" id="autroChatBtn" title="Autro Chat">A</a>
    </div>
  </header>

  <!-- PLUS MENU POPOVER -->
  <div id="plusMenuPopover" class="plus-menu-popover">
    <a href="create-post.html" class="plus-menu-item">
      <span class="plus-menu-item-left"><i class="far fa-pen-to-square"></i><span>Post</span></span>
    </a>
    <a href="create-post.html?type=reel" class="plus-menu-item">
      <span class="plus-menu-item-left"><i class="fas fa-clapperboard"></i><span>Reels</span></span>
    </a>
    <a href="story-card.html" class="plus-menu-item">
      <span class="plus-menu-item-left"><i class="far fa-square-plus"></i><span>Story</span></span>
    </a>
    <button type="button" class="plus-menu-item" id="liveOptionBtn">
      <span class="plus-menu-item-left"><i class="fas fa-tower-broadcast"></i><span>Live</span></span>
      <span class="live-lock-tag" id="liveLockBadge"></span>
    </button>
  </div>

  <!-- WHAT'S ON YOUR MIND + SMALL LEFT PROFILE CIRCLE + GALLERY -->
  <section class="composer-strip">

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      el.textContent = msg;

      window._idxToast = setTimeout(() => { el.style.display = 'none'; }, 2400);

    function playReactionSound() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(560, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (_) {}
    }

    function formatLiveElapsed(createdAtStr) {
      if (!createdAtStr) return '0s';
      const createdMs = new Date(createdAtStr).getTime();
      if (Number.isNaN(createdMs)) return '0s';
      const diffSec = Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}d`;
    }

    function readLocalReactionState() {
      return JSON.parse(localStorage.getItem('autro_post_reactions_local') || '{}');
    }

    function writeLocalReactionState(postId, data) {
      const all = readLocalReactionState();
      all[postId] = data;
      localStorage.setItem('autro_post_reactions_local', JSON.stringify(all));
    }

    function readSharedPostsSet() {
      return JSON.parse(localStorage.getItem('autro_shared_posts_set') || '{}');
    }

    function markPostSharedLocal(postId, countVal) {
      const setObj = readSharedPostsSet();
      setObj[postId] = Number(countVal || 0);
      localStorage.setItem('autro_shared_posts_set', JSON.stringify(setObj));
    }

    function readLocalComments(postId) {
      const all = JSON.parse(localStorage.getItem('autro_comments_store') || '{}');
      return Array.isArray(all[postId]) ? all[postId] : [];
    }

    function writeLocalComments(postId, arr) {
      const all = JSON.parse(localStorage.getItem('autro_comments_store') || '{}');
      all[postId] = arr;
      localStorage.setItem('autro_comments_store', JSON.stringify(all));
    }

    function resolveSavedAvatarUrl(raw) {
      const val = String(raw || '').trim();
      if (!val) return '';
      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:') || val.startsWith('blob:')) {
        return val;
      }
      if (sb) {
        return sb.storage.from('avatars').getPublicUrl(val.replace(/^\/+/, '')).data.publicUrl || '';
      }
      return '';
    }

    function buildProfileHref(userId) {
      if (userId) {
        return `profile.html?user=${encodeURIComponent(userId)}`;
      }
      return 'profile.html';
    }

    function renderSavedAvatarsOnly(avatarUrl) {
      const cleanUrl = resolveSavedAvatarUrl(avatarUrl || '');
      const sideLink = document.getElementById('storySideAvatarLink');
      const storyBg = document.getElementById('storyCardBgPhoto');
      const bottomBox = document.getElementById('bottomProfileAvatarBox');

      sideLink.innerHTML = '';
      bottomBox.innerHTML = '';
      storyBg.style.display = 'none';
      storyBg.removeAttribute('src');

      if (!cleanUrl) return;

      const img1 = document.createElement('img');
      img1.src = cleanUrl;
      img1.alt = '';
      img1.onerror = () => img1.remove();
      sideLink.appendChild(img1);

      const img2 = document.createElement('img');
      img2.src = cleanUrl;
      img2.alt = '';
      img2.onerror = () => img2.remove();
      bottomBox.appendChild(img2);

      storyBg.src = cleanUrl;
      storyBg.style.display = 'block';
      storyBg.onerror = () => {
        storyBg.style.display = 'none';
        storyBg.removeAttribute('src');
      };
    }

    function isAccountLiveUnlocked(userObj) {
      const createdRaw = userObj?.created_at || localStorage.getItem('autro_account_created_at');
      if (!createdRaw) return false;
      const createdTime = new Date(createdRaw).getTime();
      if (Number.isNaN(createdTime)) return false;
      return (Date.now() - createdTime) >= TWO_MONTHS_MS;
    }

    function refreshLiveLockBadge() {
      const badge = document.getElementById('liveLockBadge');
      const unlocked = isAccountLiveUnlocked(activeUser);
      badge.textContent = unlocked ? `Live (${liveCount})` : `2M Lock · ${liveCount}`;
    }

    async function loadSupabaseSessionProfile() {
      renderSavedAvatarsOnly('');
      activeProfileName = String(localStorage.getItem('autro_profile_name') || '').trim();

      if (!sb) {
        refreshLiveLockBadge();
        return;
      }

      try {
        const { data: { session } } = await sb.auth.getSession();
        activeUser = session?.user || null;

        if (activeUser) {
          if (activeUser.created_at) {
            localStorage.setItem('autro_account_created_at', activeUser.created_at);
          }

          const { data: prof } = await sb
            .from('profiles')
            .select('full_name, avatar_url')
            .eq('id', activeUser.id)
            .maybeSingle();

          const resolvedName = String(
            prof?.full_name ||
            activeUser.user_metadata?.full_name ||
            activeUser.user_metadata?.name ||
            activeProfileName ||
            ''
          ).trim();

          if (resolvedName) {
            activeProfileName = resolvedName;
            localStorage.setItem('autro_profile_name', resolvedName);
          }

          activeAvatarUrl =
            prof?.avatar_url ||
            activeUser.user_metadata?.avatar_url ||
            activeUser.user_metadata?.avatar ||
            activeUser.user_metadata?.picture ||
            '';

          renderSavedAvatarsOnly(activeAvatarUrl);
        }
      } catch (_) {
        renderSavedAvatarsOnly('');
      }

      refreshLiveLockBadge();
    }

    async function loadLiveSessionCount() {
      if (!sb) {
        refreshLiveLockBadge();
        return;
      }
      try {
        const { count, error } = await sb
          .from('live_sessions')
          .select('*', { count: 'exact', head: true });
        if (!error && typeof count === 'number') {
          liveCount = count;
          localStorage.setItem('autro_live_count', String(liveCount));

      refreshLiveLockBadge();

    async function syncPostReactionCount(postId, nextCount) {
      if (!sb || !postId || String(postId).startsWith('local-')) return;
      try {
        await sb
          .from('posts')
          .update({ reaction_count: Math.max(0, Number(nextCount || 0)) })
          .eq('id', postId);
      } catch (_) {}
    }

    async function applyReaction(target, emoji) {
      if (!target) return;

      if (target.type === 'post') {
        const postObj = feedPosts.find(p => p.id === target.postId);
        if (!postObj) return;

        if (postObj.userReaction === emoji) {
          postObj.userReaction = null;
          postObj.reaction_count = Math.max(0, Number(postObj.reaction_count || 0) - 1);
          writeLocalReactionState(postObj.id, { emoji: null, count: postObj.reaction_count });
          renderFeedCards();
          showToast('Reaction undone');

          if (activeUser && sb && !String(postObj.id).startsWith('local-')) {
            try {
              await sb.from('post_reactions').delete().eq('post_id', postObj.id).eq('user_id', activeUser.id);
              await syncPostReactionCount(postObj.id, postObj.reaction_count);
            } catch (_) {}
          }
          return;
        }

        if (!postObj.userReaction) {
          postObj.reaction_count = Number(postObj.reaction_count || 0) + 1;
        }
        postObj.userReaction = emoji;
        writeLocalReactionState(postObj.id, { emoji: postObj.userReaction, count: postObj.reaction_count });
        renderFeedCards();

        if (activeUser && sb && !String(postObj.id).startsWith('local-')) {
          try {
            await sb.from('post_reactions').upsert(
              { post_id: postObj.id, user_id: activeUser.id, reaction_emoji: emoji },
              { onConflict: 'post_id,user_id' }
            );
            await syncPostReactionCount(postObj.id, postObj.reaction_count);
          } catch (_) {}
        }
      } else if (target.type === 'comment') {
        const list = commentsByPost.get(target.postId) || readLocalComments(target.postId);
        const cmt = list.find(c => c.id === target.commentId);
        if (!cmt) return;

        if (cmt.userReaction === emoji) {
          cmt.userReaction = null;
          cmt.like_count = Math.max(0, Number(cmt.like_count || 0) - 1);
          commentsByPost.set(target.postId, list);
          writeLocalComments(target.postId, list);
          renderFeedCards();
          showToast('Reaction undone');
          return;
        }

        if (!cmt.userReaction) {
          cmt.like_count = Number(cmt.like_count || 0) + 1;
        }
        cmt.userReaction = emoji;
        commentsByPost.set(target.postId, list);
        writeLocalComments(target.postId, list);
        renderFeedCards();
      }
    }

    function openReactionPopup(anchorEl, target) {
      activeReactionTarget = target;
      ignoreNextDocumentClick = true;
      const popup = document.getElementById('reactionPopup');
      popup.innerHTML = '';

      REACTIONS.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'reaction-emoji-btn';
        btn.textContent = emoji;
        btn.addEventListener('pointerdown', (e) => e.stopPropagation());
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          applyReaction(activeReactionTarget, emoji);
          closeReactionPopup();
        });
        popup.appendChild(btn);
      });

      const rect = anchorEl.getBoundingClientRect();
      popup.classList.add('open');
      const pRect = popup.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2 - pRect.width / 2;
      const left = Math.min(window.innerWidth - pRect.width - 8, Math.max(8, centerX));
      const top = Math.max(8, rect.top - pRect.height - 8);
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      playReactionSound();
    }

    function closeReactionPopup() {
      document.getElementById('reactionPopup').classList.remove('open');

    function bindReactionButton(btnEl, target, fallbackEmoji) {
      let pressTimer = null;
      let wasLongPress = false;

      const startPress = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        wasLongPress = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          wasLongPress = true;
          openReactionPopup(btnEl, target);
        }, 360);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      btnEl.addEventListener('pointerdown', startPress);
      btnEl.addEventListener('pointerup', cancelPress);
      btnEl.addEventListener('pointerleave', cancelPress);
      btnEl.addEventListener('pointercancel', cancelPress);
      btnEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        wasLongPress = true;
        openReactionPopup(btnEl, target);
      });

      btnEl.addEventListener('click', (e) => {
        if (wasLongPress) {
          e.preventDefault();
          wasLongPress = false;
          return;
        }
        if (target.type === 'post') {
          const p = feedPosts.find(x => x.id === target.postId);
          if (!p) return;
          applyReaction(target, p.userReaction || fallbackEmoji);
        } else if (target.type === 'comment') {
          const list = commentsByPost.get(target.postId) || readLocalComments(target.postId);
          const c = list.find(x => x.id === target.commentId);
          if (!c) return;
          applyReaction(target, c.userReaction || fallbackEmoji);
        }
      });
    }

    function bindShareBtn(btnEl, postObj) {
      let pressTimer = null;
      let wasLongPress = false;

      const startPress = () => {
        wasLongPress = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          wasLongPress = true;
          openShareMenu(btnEl, postObj);
        }, 380);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      btnEl.addEventListener('pointerdown', startPress);
      btnEl.addEventListener('pointerup', cancelPress);
      btnEl.addEventListener('pointerleave', cancelPress);
      btnEl.addEventListener('pointercancel', cancelPress);
      btnEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        wasLongPress = true;
        openShareMenu(btnEl, postObj);
      });

      btnEl.addEventListener('click', async (e) => {
        if (wasLongPress) {
          e.preventDefault();
          wasLongPress = false;
          return;
        }
        const sharedSet = readSharedPostsSet();
        if (postObj._sharedOnce || Object.prototype.hasOwnProperty.call(sharedSet, postObj.id)) {
          showToast('Already shared');
          return;
        }
        postObj._sharedOnce = true;
        postObj.share_count = Number(postObj.share_count || 0) + 1;
        markPostSharedLocal(postObj.id, postObj.share_count);
        renderFeedCards();
        showToast('Shared');

        if (sb && activeUser && postObj.id && !String(postObj.id).startsWith('local-')) {
          try {
            await sb.from('post_shares').upsert(
              { post_id: postObj.id, user_id: activeUser.id },
              { onConflict: 'post_id,user_id' }
            );
            const { data: freshPost } = await sb
              .from('posts')
              .select('share_count')
              .eq('id', postObj.id)
              .maybeSingle();
            if (freshPost && typeof freshPost.share_count === 'number') {
              postObj.share_count = Math.max(Number(postObj.share_count || 0), freshPost.share_count);
              markPostSharedLocal(postObj.id, postObj.share_count);
              renderFeedCards();
            }
          } catch (_) {}
        }
      });
    }

    async function toggleVoiceRecord(postId, recordBtn, statusLabel, clearBtn) {
      if (!isRecording) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          showToast('Voice recording is not supported on this browser.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceChunks = [];
          recordedVoiceUrl = '';
          recordedVoiceSec = 0;
          recordingPostId = postId;
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) voiceChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(voiceTimer);
            isRecording = false;
            recordBtn.textContent = '30s Voice';
            const blob = new Blob(voiceChunks, { type: 'audio/webm' });
            recordedVoiceUrl = URL.createObjectURL(blob);
            statusLabel.textContent = `Voice ready (${recordedVoiceSec}s)`;
            clearBtn.style.display = 'inline-block';
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.textContent = 'Stop';
          clearBtn.style.display = 'none';
          statusLabel.textContent = '0s / 30s';

          voiceTimer = setInterval(() => {
            recordedVoiceSec += 1;
            statusLabel.textContent = `${recordedVoiceSec}s / 30s`;
            if (recordedVoiceSec >= 30 && mediaRecorder && mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          }, 1000);
        } catch (_) {
          showToast('Microphone access is required for voice comment.');
        }
      } else if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

    function openReportModal() {
      closeDotsMenu();
      selectedReason = REPORT_REASONS[0];
      const box = document.getElementById('reportReasonsList');
      box.innerHTML = '';

      REPORT_REASONS.forEach((reasonText, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `reason-option ${idx === 0 ? 'selected' : ''}`;
        btn.textContent = `${idx + 1}. ${reasonText}`;
        btn.onclick = () => {
          selectedReason = reasonText;
          box.querySelectorAll('.reason-option').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        };
        box.appendChild(btn);
      });

      document.getElementById('reportModal').classList.add('open');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.remove('open');
    }

    async function submitReportAction(actionType) {
      if (!activeCommentMenuData) return;
      const payload = {
        comment_id: activeCommentMenuData.comment.id,
        post_id: activeCommentMenuData.postId,
        reason: selectedReason,
        action_taken: actionType,
        created_at: new Date().toISOString()
      };

      const savedReports = JSON.parse(localStorage.getItem('autro_comment_reports') || '[]');
      savedReports.unshift(payload);
      localStorage.setItem('autro_comment_reports', JSON.stringify(savedReports));

      if (sb && activeUser && !String(payload.comment_id).startsWith('cmt-')) {
        try {
          await sb.from('comment_reports').insert({
            comment_id: payload.comment_id,
            reporter_id: activeUser.id,
            reason: selectedReason,
            action_taken: actionType
          });
        } catch (_) {}
      }

      closeReportModal();
      showToast(`Report ${actionType} sent`);
    }

    function hasMeaningfulPostContent(item) {
      if (!item) return false;
      const author = String(item.author_name || '').trim();
      const caption = String(item.caption || '').trim();
      const media = String(item.media_url || '').trim();
      return Boolean(author || caption || media);
    }

    function renderFeedCards() {
      const container = document.getElementById('homeFeedList');
      container.innerHTML = '';

      feedPosts.slice(0, 15).forEach(post => {
        if (!hasMeaningfulPostContent(post)) return;

        const comments = commentsByPost.get(post.id) || readLocalComments(post.id);
        commentsByPost.set(post.id, comments);

        const displayAuthor = String(
          (activeUser && post.user_id && post.user_id === activeUser.id ? activeProfileName : '') ||
          post.author_name ||
          activeProfileName ||
          'Autrobook User'
        ).trim();

        const resolvedPostAvatar = resolveSavedAvatarUrl(
          (activeUser && post.user_id && post.user_id === activeUser.id ? activeAvatarUrl : '') ||
          post.author_avatar ||
          ''
        );

        const article = document.createElement('article');
        article.className = 'fb-post';

        const head = document.createElement('div');
        head.className = 'fb-post-head';

        const authorLeft = document.createElement('div');
        authorLeft.className = 'fb-author-left';

        const avatarLink = document.createElement('a');
        avatarLink.href = buildProfileHref(post.user_id || activeUser?.id || '');
        avatarLink.className = 'fb-post-avatar-link';
        avatarLink.title = displayAuthor;
        if (resolvedPostAvatar) {
          const avImg = document.createElement('img');
          avImg.src = resolvedPostAvatar;
          avImg.alt = displayAuthor;
          avImg.onerror = () => { avImg.remove(); avatarLink.innerHTML = '<i class="fas fa-user"></i>'; };
          avatarLink.appendChild(avImg);
        } else {
          avatarLink.innerHTML = '<i class="fas fa-user"></i>';
        }

        const authorCol = document.createElement('div');
        authorCol.className = 'fb-author-col';

        const authorLink = document.createElement('a');
        authorLink.href = buildProfileHref(post.user_id || activeUser?.id || '');
        authorLink.className = 'fb-author-name';
        authorLink.textContent = displayAuthor;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'fb-live-time';
        timeDiv.dataset.createdAt = post.created_at || '';
        timeDiv.innerHTML = `<span>${formatLiveElapsed(post.created_at)}</span><span>·</span><i class="fas fa-globe-americas" style="font-size:11px;"></i>`;

        authorCol.appendChild(authorLink);
        authorCol.appendChild(timeDiv);
        authorLeft.appendChild(avatarLink);
        authorLeft.appendChild(authorCol);

        const viewsRight = document.createElement('div');
        viewsRight.className = 'fb-views-right';

        head.appendChild(viewsRight);

        if (post.caption) {

        }

        if (post.media_url) {

            vid.className = 'fb-media';

            vid.playsInline = true;

        const cmtCount = Math.max(Number(post.comment_count || 0), comments.length);
        const countsDiv = document.createElement('div');

          <span class="fb-reaction-summary"><span>${post.userReaction || '👍'}</span><span>${Number(post.reaction_count || 0)}</span></span>
          <span class="fb-counts-right"><span>${cmtCount} comments</span><span>·</span><span>${Number(post.share_count || 0)} shares</span></span>
        `;

        const actionBar = document.createElement('div');
        actionBar.className = 'fb-action-bar';

        cmtBtn.type = 'button';

        const line1 = document.createElement('div');
        line1.className = 'composer-line';

        const commentInput = document.createElement('input');
        commentInput.type = 'text';
        commentInput.className = 'text-pill-input';

          recordedVoiceSec = 0;
          voiceStatus.textContent = '';
          clearVoiceBtn.style.display = 'none';
        };

        sendBtn.onclick = async () => {
          const textVal = commentInput.value.trim();
          const hasVoice = recordingPostId === post.id && Boolean(recordedVoiceUrl);
          if (!textVal && !hasVoice) return;

          const newComment = {
            id: `cmt-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            user_id: activeUser?.id || null,
            author: activeProfileName || 'Autrobook User',
            text: textVal,
            voiceUrl: hasVoice ? recordedVoiceUrl : '',
            voiceSec: hasVoice ? recordedVoiceSec : 0,
            created_at: new Date().toISOString(),
            like_count: 0,
            dislike_count: 0,
            userReaction: null,
            disliked: false,
            replies: []
          };

          const updated = [...comments, newComment];
          commentsByPost.set(post.id, updated);
          writeLocalComments(post.id, updated);
          post.comment_count = Math.max(Number(post.comment_count || 0) + 1, updated.length);

          if (sb && activeUser && !String(post.id).startsWith('local-')) {
            try {
              const { data: inserted } = await sb
                .from('post_comments')
                .insert({

                  user_id: activeUser.id,

              }
              await sb.from('posts').update({ comment_count: updated.length }).eq('id', post.id);

          if (hasVoice) {

            recordedVoiceSec = 0;

        line1.appendChild(sendBtn);
        line2.appendChild(voiceBtn);

        composerBox.appendChild(line2);
        commentsPanel.appendChild(composerBox);

          cAuth.textContent = cmt.author || 'Autrobook User';

          cTime.className = 'comment-time fb-live-time';
          cTime.dataset.createdAt = cmt.created_at || '';
          cTime.textContent = formatLiveElapsed(cmt.created_at);

            openDotsMenu(dotsBtn, post.id, cmt);

          cTop.appendChild(dotsBtn);

          if (cmt.text) {

          const cActions = document.createElement('div');

          const cLikeBtn = document.createElement('button');
          cLikeBtn.type = 'button';

          cLikeBtn.textContent = cmt.userReaction
            ? `${cmt.userReaction} ${Number(cmt.like_count || 0)}`

            commentsByPost.set(post.id, comments);
            writeLocalComments(post.id, comments);
            renderFeedCards();
          };

          const replyBtn = document.createElement('button');
          replyBtn.type = 'button';
          replyBtn.className = 'c-chip-btn';
          replyBtn.textContent = `Reply ${Array.isArray(cmt.replies) && cmt.replies.length ? `(${cmt.replies.length})` : ''}`.trim();

          cActions.appendChild(replyBtn);
          cRow.appendChild(cActions);

          const replyComposer = document.createElement('div');
          replyComposer.className = 'composer-line';
          replyComposer.style.display = 'none';

          replyInput.type = 'text';
          replyInput.className = 'text-pill-input';
          replyInput.placeholder = 'Write a reply...';

          const replySendBtn = document.createElement('button');
          replySendBtn.type = 'button';
          replySendBtn.className = 'pill-btn solid';
          replySendBtn.textContent = 'Send';

          replySendBtn.onclick = async () => {
            const rVal = replyInput.value.trim();
            if (!rVal) return;
            cmt.replies = Array.isArray(cmt.replies) ? cmt.replies : [];
            cmt.replies.push({
              id: `rep-${Date.now()}`,
              user_id: activeUser?.id || null,
              author: activeProfileName || 'Autrobook User',
              text: rVal,
              created_at: new Date().toISOString()
            });
            commentsByPost.set(post.id, comments);
            writeLocalComments(post.id, comments);

            if (sb && activeUser && !String(post.id).startsWith('local-') && !String(cmt.id).startsWith('cmt-')) {
              try {
                await sb.from('post_comments').insert({
                  post_id: post.id,
                  user_id: activeUser.id,
                  parent_id: cmt.id,
                  author_name: activeProfileName || 'Autrobook User',
                  comment_text: rVal
                });
              } catch (_) {}
            }
            renderFeedCards();
          };

          replyBtn.onclick = () => {
            replyComposer.style.display = replyComposer.style.display === 'none' ? 'flex' : 'none';
          };

          replyComposer.appendChild(replyInput);
          replyComposer.appendChild(replySendBtn);
          cRow.appendChild(replyComposer);

          if (Array.isArray(cmt.replies) && cmt.replies.length > 0) {
            const repList = document.createElement('div');
            repList.className = 'replies-list';
            cmt.replies.forEach(rep => {
              const rCard = document.createElement('div');
              rCard.className = 'reply-card';
              rCard.innerHTML = `<div class="reply-head"><a href="${buildProfileHref(rep.user_id || '')}" class="reply-author">${rep.author || 'Autrobook User'}</a><span class="reply-time fb-live-time" data-created-at="${rep.created_at || ''}">${formatLiveElapsed(rep.created_at)}</span></div><div>${rep.text}</div>`;
              repList.appendChild(rCard);
            });
            cRow.appendChild(repList);
          }

          commentsPanel.appendChild(cRow);
        });

        article.appendChild(commentsPanel);
        container.appendChild(article);
      });
    }

    async function loadHomeFeedPosts() {
      const localReactions = readLocalReactionState();
      const sharedSet = readSharedPostsSet();
      const map = new Map();
      const profilesMap = new Map();

      if (sb) {
        try {
          const { data: profs } = await sb.from('profiles').select('id, full_name, avatar_url');
          if (Array.isArray(profs)) {
            profs.forEach(pr => profilesMap.set(pr.id, pr));
          }
        } catch (_) {}

        try {
          const { data: rows, error } = await sb
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

          if (!error && Array.isArray(rows)) {
            rows.forEach(r => {
              const locR = localReactions[r.id];
              const resolvedCount = Math.max(Number(r.reaction_count || 0), Number(locR?.count || 0));
              const resolvedShare = Math.max(Number(r.share_count || 0), Number(sharedSet[r.id] || 0));
              const ownerId = r.user_id || r.author_id || '';
              const ownerProf = ownerId ? profilesMap.get(ownerId) : null;
              const resolvedName = String(
                ownerProf?.full_name ||
                r.author_name ||
                activeProfileName ||
                ''
              ).trim();

              const normalized = {
                id: r.id,
                user_id: ownerId,
                author_name: resolvedName,
                author_avatar: ownerProf?.avatar_url || '',
                caption: String(r.caption || r.content || '').trim(),
                is_bold: Boolean(r.is_bold),
                media_url: String(r.media_url || r.image_url || '').trim(),
                is_video: String(r.media_type || '').startsWith('video'),
                reaction_count: resolvedCount,
                comment_count: Number(r.comment_count || 0),
                share_count: resolvedShare,
                view_count: Number(r.view_count || 0),
                created_at: r.created_at || new Date().toISOString(),
                userReaction: locR?.emoji || null,
                _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, r.id),
                _commentsOpen: false
              };
              if (hasMeaningfulPostContent(normalized)) {
                map.set(r.id, normalized);
              }
            });
          }

          if (map.size > 0) {
            const ids = Array.from(map.keys());
            const { data: shareRows } = await sb.from('post_shares').select('post_id').in('post_id', ids);
            if (Array.isArray(shareRows)) {
              const sMap = new Map();
              shareRows.forEach(sr => sMap.set(sr.post_id, (sMap.get(sr.post_id) || 0) + 1));
              sMap.forEach((cnt, pid) => {
                const p = map.get(pid);
                if (p) p.share_count = Math.max(Number(p.share_count || 0), cnt);
              });
            }

            if (activeUser) {
              const { data: myReacts } = await sb
                .from('post_reactions')
                .select('post_id, reaction_emoji')
                .eq('user_id', activeUser.id)
                .in('post_id', ids);

              (myReacts || []).forEach(mr => {
                const p = map.get(mr.post_id);
                if (p) {
                  p.userReaction = mr.reaction_emoji;
                  writeLocalReactionState(p.id, { emoji: p.userReaction, count: p.reaction_count });
                }
              });
            }
          }
        } catch (_) {}
      }

      if (map.size === 0) {
        const q1 = JSON.parse(localStorage.getItem('autro_instant_feed_posts') || '[]');
        const q2 = JSON.parse(localStorage.getItem('autro_post_cards') || '[]');
        [...q1, ...q2].forEach(item => {
          if (item && item.id) {
            const locR = localReactions[item.id];
            const baseCount = Number(item.reaction_count ?? item.reactions ?? 0);
            const baseShare = Number(item.share_count ?? item.shares ?? 0);

            const normalized = {
              id: item.id,
              user_id: item.user_id || activeUser?.id || '',
              author_name: String(item.author_name || activeProfileName || '').trim(),
              author_avatar: activeAvatarUrl || '',
              caption: String(item.caption || item.content || '').trim(),
              is_bold: Boolean(item.is_bold),
              media_url: String(item.media_url || item.image_url || '').trim(),
              is_video: Boolean(item.is_video),
              reaction_count: Math.max(baseCount, Number(locR?.count || 0)),
              comment_count: Number(item.comment_count ?? item.comments ?? 0),
              share_count: Math.max(baseShare, Number(sharedSet[item.id] || 0)),
              view_count: Number(item.view_count ?? item.views ?? 0),
              created_at: item.posted_at || item.created_at || new Date().toISOString(),
              userReaction: locR?.emoji || null,
              _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, item.id),
              _commentsOpen: false
            };
            if (hasMeaningfulPostContent(normalized)) {
              map.set(item.id, normalized);
            }
          }
        });
      }

      feedPosts = Array.from(map.values());
      renderFeedCards();
    }

        type: file.type
      }));
      window.location.href = 'create-post.html?from=gallery';
    });

    document.addEventListener('click', (e) => {
      if (ignoreNextDocumentClick) {
        ignoreNextDocumentClick = false;
        return;
      }
      const pop = document.getElementById('plusMenuPopover');
      const btn = document.getElementById('plusMenuBtn');
      if (pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)) {
        pop.classList.remove('open');
      }
      const popup = document.getElementById('reactionPopup');
      if (popup.classList.contains('open') && !popup.contains(e.target)) {
        closeReactionPopup();
      }
      const sMenu = document.getElementById('shareMenu');
      if (sMenu.classList.contains('open') && !sMenu.contains(e.target)) {
        closeShareMenu();
      }
      const dMenu = document.getElementById('dotsMenu');
      if (dMenu.classList.contains('open') && !dMenu.contains(e.target)) {
        closeDotsMenu();
      }
    });

    setInterval(refreshFeedTimersOnly, 1000);

    window.addEventListener('DOMContentLoaded', async () => {
      await loadSupabaseSessionProfile();
      await loadLiveSessionCount();
      await loadHomeFeedPosts();
    });
  </script>
</body>
  </html>
