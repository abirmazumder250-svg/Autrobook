<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook</title>
<style>
body {margin:0; font-family:Arial; background:#18191a; color:#e4e6eb;}
.header {background:#242526; padding:10px 20px; display:flex; justify-content:space-between; align-items:center;}
.logo {display:flex; align-items:center; gap:10px; font-size:24px; font-weight:bold;}
.logo img {width:40px; height:40px; border-radius:8px;}
.logo span:first-child {color:#1877f2;}
.btn {background:#1877f2; color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:bold;}
.landing {text-align:center; padding:40px 20px;}
.landing img {width:120px; height:120px; border-radius:20px; object-fit:cover;}
.landing h2 {color:#b0b3b8; font-size:14px; font-weight:400; margin-top:8px;}
.feed {max-width:600px; margin:0 auto; padding:20px;}
.post-box {background:#242526; padding:15px; border-radius:8px; margin-bottom:15px;}
input {width:100%; padding:10px; background:#3a3b3c; border:none; border-radius:20px; color:white; outline:none; box-sizing:border-box;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <img src="logo.png">
    <span>Autro</span><span>book</span>
  </div>
  <button class="btn">Login</button>
</div>

<div class="landing">
  <img src="logo.png">
  <h2>18+ Free Social Media Platform | AI Moderated & Safe</h2>
</div>

<div class="feed">
  <div class="post-box">
    <input placeholder="What's on your mind?">
    <input placeholder="📍 Location (e.g. Tongi, Dhaka)" style="margin-top:10px;">
    <button class="btn" style="width:100%; margin-top:10px;">Post</button>
  </div>
  <div class="post-box" style="text-align:center;">No posts yet. Create the first post!</div>
</div>
</body>
</html>
