<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg-page: #000000;
      --bg-surface: #121212;
      --bg-card: #18191a;
      --bg-pill: #242526;
      --bg-pill-hover: #303234;
      --text-primary: #ffffff;
      --text-secondary: #b0b3b8;
      --border-subtle: rgba(255, 255, 255, 0.14);
      --invert-bg: #ffffff;
      --invert-fg: #000000;
      --accent-green: #0a7d3b;
      --accent-green-dark: #0B3D20;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f6f7f9;
        --bg-pill: #eef0f3;
        --bg-pill-hover: #e2e5ea;
        --text-primary: #000000;
        --text-secondary: #4b5563;
        --border-subtle: rgba(0, 0, 0, 0.14);
        --invert-bg: #000000;
        --invert-fg: #ffffff;
        --accent-green: #0a7d3b;
        --accent-green-dark: #0B3D20;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 72px;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .icon-circle-btn:hover {
      background: var(--bg-pill-hover);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .top-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Small 'A' button in system default colors linked to autro-chat.html */
    .autro-a-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 1px solid var(--border-subtle);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .autro-a-btn:hover {
      opacity: 0.88;
    }

    /* PLUS DROPDOWN MENU */
    .plus-menu-popover {
      position: fixed;
      top: 56px;
      right: 54px;
      z-index: 120;
      width: 220px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .plus-menu-popover.open {
      display: flex;
    }

    .plus-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--text-primary);
      border: none;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      text-align: left;
    }

    .plus-menu-item:hover {
      background: var(--bg-pill);
    }

    .plus-menu-item-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .live-lock-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    /* COMPOSER BAR */
    .composer-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }

    .avatar-slot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-primary);
    }

    .avatar-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mind-trigger-btn {
      flex: 1;
      text-align: left;
      background: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14.5px;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mind-trigger-btn:hover {
      background: var(--bg-pill-hover);
      color: var(--text-primary);
    }

    .gallery-trigger-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: transparent;
      color: var(--accent-green);
      border: 1px solid var(--border-subtle);
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .gallery-trigger-btn:hover {
      background: var(--bg-pill);
    }

    /* STORY STRIP */
    .story-strip {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story-card-box {
      position: relative;
      width: 112px;
      height: 170px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      cursor: pointer;
    }

    .story-card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .story-card-top-label {
      position: relative;
      z-index: 2;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .story-card-bottom {
      position: relative;
      z-index: 2;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 16px 6px 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .story-plus-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 2px solid var(--bg-surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    /* FEED BRIDGE & POSTS */
    .feed-section {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feed-links-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .feed-link-chip {
      text-decoration: none;
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .feed-link-chip:hover {
      background: var(--bg-pill-hover);
    }

    .feed-post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feed-post-author {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
      min-height: 18px;
    }

    .feed-post-caption {
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .feed-post-media {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .feed-post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-secondary);
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
    }

    .open-card-link {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 700;
    }

    /* BOTTOM NAVIGATION BAR */
    .bottom-nav-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      height: 58px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      padding: 0 4px;
    }

    .bottom-nav-item {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 20px;
      position: relative;
    }

    .bottom-nav-item:hover,
    .bottom-nav-item.active {
      color: var(--text-primary);
    }

    .bottom-nav-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .toast-banner {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 1px solid var(--border-subtle);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 200;
      display: none;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-header">
    <div class="brand-left">
      <a href="shortcut.html" class="icon-circle-btn" id="shortcutMenuBtn" title="Shortcuts">
        <i class="fas fa-bars"></i>
      </a>
      <a href="index.html" class="brand-title">Autrobook</a>
    </div>

    <div class="top-right-actions">
      <button type="button" class="icon-circle-btn" id="plusMenuBtn" title="Create">
        <i class="fas fa-plus"></i>
      </button>
      <a href="search-bar.html" class="icon-circle-btn" id="searchBarBtn" title="Search">
        <i class="fas fa-magnifying-glass"></i>
      </a>
      <a href="autro-chat.html" class="autro-a-btn" id="autroChatBtn" title="Autro Chat">A</a>
    </div>
  </header>

  <!-- PLUS MENU POPOVER -->
  <div id="plusMenuPopover" class="plus-menu-popover">
    <a href="create-post.html" class="plus-menu-item">
      <span class="plus-menu-item-left"><i class="far fa-pen-to-square"></i><span>Post</span></span>
    </a>
    <a href="create-post.html?type=reel" class="plus-menu-item">
      <span class="plus-menu-item-left"><i class="fas fa-clapperboard"></i><span>Reels</span></span>
    </a>
    <a href="story-card.html" class="plus-menu-item">
      <span class="plus-menu-item-left"><i class="far fa-square-plus"></i><span>Story</span></span>
    </a>
    <button type="button" class="plus-menu-item" id="liveOptionBtn">
      <span class="plus-menu-item-left"><i class="fas fa-tower-broadcast"></i><span>Live</span></span>
      <span class="live-lock-tag" id="liveLockBadge"></span>
    </button>
  </div>

  <!-- WHAT'S ON YOUR MIND + SMALL LEFT PROFILE CIRCLE + GALLERY -->
  <section class="composer-strip">
    <a href="profile.html" class="avatar-slot" id="storySideAvatarLink" title="Profile"></a>
    <a href="create-post.html" class="mind-trigger-btn" id="whatsOnMindLink">What's on your mind?</a>
    <button type="button" class="gallery-trigger-btn" id="phoneGalleryTriggerBtn" title="Gallery">
      <i class="far fa-images"></i>
    </button>
    <input type="file" id="phoneGalleryFileInput" accept="image/*,video/*" style="display:none;">
  </section>

  <!-- STORY CARD (story-card.html) -->
  <section class="story-strip">
    <a href="story-card.html" class="story-card-box" id="storyCardLink">
      <img id="storyCardBgPhoto" class="story-card-photo" alt="" style="display:none;">
      <div class="story-card-top-label">Create Story</div>
      <div class="story-card-bottom">
        <span class="story-plus-badge"><i class="fas fa-plus"></i></span>
        <span>Create story</span>
      </div>
    </a>
  </section>

  <!-- FEED CONNECTED WITH post-card.html AND create-post.html -->
  <main class="feed-section">
    <div class="feed-links-bar">
      <a href="create-post.html" class="feed-link-chip">
        <i class="fas fa-plus"></i>
        <span>create-post.html</span>
      </a>
      <a href="post-card.html" class="feed-link-chip">
        <i class="far fa-id-card"></i>
        <span>post-card.html</span>
      </a>
    </div>
    <div id="homeFeedList"></div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav-bar" aria-label="Primary Navigation">
    <a href="reels.html" class="bottom-nav-item" id="navReelsBtn" title="Reels">
      <i class="fas fa-clapperboard"></i>
    </a>
    <a href="index.html" class="bottom-nav-item active" id="navHomeBtn" title="Home">
      <i class="fas fa-house"></i>
    </a>
    <a href="friends.html" class="bottom-nav-item" id="navFriendsBtn" title="Friends">
      <i class="fas fa-user-group"></i>
    </a>
    <a href="games.html" class="bottom-nav-item" id="navGamesBtn" title="Games">
      <i class="fas fa-gamepad"></i>
    </a>
    <a href="groups.html" class="bottom-nav-item" id="navGroupsBtn" title="Groups">
      <i class="fas fa-users"></i>
    </a>
    <a href="notifications.html" class="bottom-nav-item" id="navNotificationsBtn" title="Notifications">
      <i class="far fa-bell"></i>
    </a>
    <a href="profile.html" class="bottom-nav-item" id="navProfileBtn" title="Profile">
      <span class="bottom-nav-avatar" id="bottomProfileAvatarBox"></span>
    </a>
  </nav>

  <div id="toastBanner" class="toast-banner"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const LIVEKIT_URL = 'wss://autrobook-aij9raun.livekit.cloud';
    const TWO_MONTHS_MS = 60 * 24 * 60 * 60 * 1000;

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    let activeUser = null;
    let activeProfileName = '';
    let activeAvatarUrl = '';
    let liveCount = Number(localStorage.getItem('autro_live_count') || '0');

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._idxToast);
      window._idxToast = setTimeout(() => { el.style.display = 'none'; }, 2600);
    }

    function resolveSavedAvatarUrl(raw) {
      const val = String(raw || '').trim();
      if (!val) return '';
      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:') || val.startsWith('blob:')) {
        return val;
      }
      if (sb) {
        return sb.storage.from('media').getPublicUrl(val.replace(/^\/+/, '')).data.publicUrl || '';
      }
      return '';
    }

    // Only Supabase saved account avatar; if none exists, keep completely blank
    function renderSavedAvatarsOnly(avatarUrl) {
      const cleanUrl = resolveSavedAvatarUrl(avatarUrl || '');
      const sideLink = document.getElementById('storySideAvatarLink');
      const storyBg = document.getElementById('storyCardBgPhoto');
      const bottomBox = document.getElementById('bottomProfileAvatarBox');

      sideLink.innerHTML = '';
      bottomBox.innerHTML = '';
      storyBg.style.display = 'none';
      storyBg.removeAttribute('src');

      if (!cleanUrl) return;

      const img1 = document.createElement('img');
      img1.src = cleanUrl;
      img1.alt = '';
      img1.onerror = () => img1.remove();
      sideLink.appendChild(img1);

      const img2 = document.createElement('img');
      img2.src = cleanUrl;
      img2.alt = '';
      img2.onerror = () => img2.remove();
      bottomBox.appendChild(img2);

      storyBg.src = cleanUrl;
      storyBg.style.display = 'block';
      storyBg.onerror = () => {
        storyBg.style.display = 'none';
        storyBg.removeAttribute('src');
      };
    }

    function isAccountLiveUnlocked(userObj) {
      const createdRaw = userObj?.created_at || localStorage.getItem('autro_account_created_at');
      if (!createdRaw) return false;
      const createdTime = new Date(createdRaw).getTime();
      if (Number.isNaN(createdTime)) return false;
      return (Date.now() - createdTime) >= TWO_MONTHS_MS;
    }

    function refreshLiveLockBadge() {
      const badge = document.getElementById('liveLockBadge');
      const unlocked = isAccountLiveUnlocked(activeUser);
      badge.textContent = unlocked ? `Live (${liveCount})` : `2M Lock · ${liveCount}`;
    }

    async function loadSupabaseSessionProfile() {
      renderSavedAvatarsOnly('');
      if (!sb) {
        refreshLiveLockBadge();
        return;
      }

      try {
        const { data: { session } } = await sb.auth.getSession();
        activeUser = session?.user || null;

        if (activeUser) {
          if (activeUser.created_at) {
            localStorage.setItem('autro_account_created_at', activeUser.created_at);
          }

          const { data: prof } = await sb
            .from('profiles')
            .select('full_name, name, avatar_url, avatar, photo_url')
            .eq('id', activeUser.id)
            .maybeSingle();

          activeProfileName =
            prof?.full_name ||
            prof?.name ||
            activeUser.user_metadata?.full_name ||
            activeUser.user_metadata?.name ||
            '';

          activeAvatarUrl =
            prof?.avatar_url ||
            prof?.avatar ||
            prof?.photo_url ||
            activeUser.user_metadata?.avatar_url ||
            activeUser.user_metadata?.avatar ||
            activeUser.user_metadata?.picture ||
            '';

          renderSavedAvatarsOnly(activeAvatarUrl);
        }
      } catch (_) {
        renderSavedAvatarsOnly('');
      }

      refreshLiveLockBadge();
    }

    function handleLiveMenuClick() {
      document.getElementById('plusMenuPopover').classList.remove('open');
      if (!isAccountLiveUnlocked(activeUser)) {
        showToast('New accounts are locked from Live for 2 months. Auto-unlocks after 2 months.');
        return;
      }
      liveCount += 1;
      localStorage.setItem('autro_live_count', String(liveCount));
      refreshLiveLockBadge();
      showToast(`Live started (${LIVEKIT_URL}) · Live count: ${liveCount}`);
    }

    function renderHomeFeedPosts() {
      const container = document.getElementById('homeFeedList');
      const q1 = JSON.parse(localStorage.getItem('autro_instant_feed_posts') || '[]');
      const q2 = JSON.parse(localStorage.getItem('autro_post_cards') || '[]');
      const merged = new Map();

      [...q1, ...q2].forEach(item => {
        if (item && item.id) merged.set(item.id, item);
      });

      const list = Array.from(merged.values());
      container.innerHTML = '';

      list.slice(0, 10).forEach(post => {
        const card = document.createElement('div');
        card.className = 'feed-post-card';

        const authorDiv = document.createElement('div');
        authorDiv.className = 'feed-post-author';
        authorDiv.textContent = post.author_name || activeProfileName || '';
        card.appendChild(authorDiv);

        if (post.caption) {
          const capDiv = document.createElement('div');
          capDiv.className = 'feed-post-caption';
          capDiv.textContent = post.caption;
          card.appendChild(capDiv);
        }

        if (post.media_url) {
          if (post.is_video) {
            const vid = document.createElement('video');
            vid.className = 'feed-post-media';
            vid.src = post.media_url;
            vid.controls = true;
            vid.playsInline = true;
            card.appendChild(vid);
          } else {
            const img = document.createElement('img');
            img.className = 'feed-post-media';
            img.src = post.media_url;
            img.alt = '';
            card.appendChild(img);
          }
        }

        const foot = document.createElement('div');
        foot.className = 'feed-post-footer';
        foot.innerHTML = `
          <a href="post-card.html" class="open-card-link">Open in post-card.html</a>
          <a href="create-post.html" class="open-card-link">Create Post</a>
        `;
        card.appendChild(foot);
        container.appendChild(card);
      });
    }

    document.getElementById('plusMenuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('plusMenuPopover').classList.toggle('open');
    });

    document.getElementById('liveOptionBtn').addEventListener('click', handleLiveMenuClick);

    document.getElementById('phoneGalleryTriggerBtn').addEventListener('click', () => {
      document.getElementById('phoneGalleryFileInput').click();
    });

    document.getElementById('phoneGalleryFileInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const blobUrl = URL.createObjectURL(file);
      sessionStorage.setItem('autro_picked_gallery_media', JSON.stringify({
        url: blobUrl,
        name: file.name,
        type: file.type
      }));
      window.location.href = 'create-post.html?from=gallery';
    });

    document.addEventListener('click', (e) => {
      const pop = document.getElementById('plusMenuPopover');
      const btn = document.getElementById('plusMenuBtn');
      if (pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)) {
        pop.classList.remove('open');
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      await loadSupabaseSessionProfile();
      renderHomeFeedPosts();
    });
  </script>
</body>
  </html>
