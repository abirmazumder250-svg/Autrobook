<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autrobook</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Like Sound -->
  <audio id="like-sound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>
</head>
<body>
  
  <!-- Header Load Hobe Ekhane -->
  <div id="header-container"></div>
  
  <!-- Main Page Content -->
  <div id="app-container"></div>
  
  <!-- Bottom Nav Load Hobe Ekhane -->
  <div id="bottom-nav-container"></div>

  <!-- 1. Firebase Auth -->
  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./auth.js"></script>
  
  <!-- 2. Supabase DB -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <!-- 3. Core Router JS -->
  <script>
    // Page Change Function
    function navigateTo(page) {
      fetch(page)
        .then(res => res.text())
        .then(html => {
          document.getElementById('app-container').innerHTML = html;
          window.scrollTo(0, 0);
        })
        .catch(err => console.error('Page load error:', err));
    }

    // Component Load Function
    function loadComponent(containerId, file) {
      fetch(file)
        .then(res => res.text())
        .then(html => {
          document.getElementById(containerId).innerHTML = html;
        })
        .catch(err => console.error('Component load error:', err));
    }

    // App Start
    window.onload = function() {
      loadComponent('header-container', 'pages/47-header.html');
      loadComponent('bottom-nav-container', 'pages/48-bottom-nav.html');
      navigateTo('pages/01-feed.html'); // Splash skip kore direct feed
    }
  </script>

</body>
</html>
