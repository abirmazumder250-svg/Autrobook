<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Autrobook - Login</title>
<!-- Google reCAPTCHA SDK -->
<script src="https://www.google.com/recaptcha/api.js?onload=renderRecaptcha&render=explicit" async defer></script>

<style>
:root{ color-scheme: light dark; --brand-green: #0f5132; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background: light-dark(#ffffff, #121212);
  min-height:100vh;
  color: light-dark(#111111, #e4e6eb);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; transition: background 0.3s, color 0.3s;
}
.lang-bar{ margin-bottom: 20px; text-align: center; }
.lang-bar select{
  padding: 8px 14px; border-radius: 10px;
  border: 1px solid light-dark(#ccc, #2c2c2e);
  background: light-dark(#f5f5f5, #1c1c1e);
  color: light-dark(#111, white); font-size: 14px; cursor: pointer; outline: none;
  max-width: 280px;
}
.logo{text-align:center;margin-bottom:25px}
.logo img{
  width:70px; height:70px; border-radius:18px; object-fit:cover;
  background: light-dark(#e8f5e9, #1e3a2f); margin-bottom:8px
}
.wrap{width:100%;max-width:400px}
.title{text-align:center;font-size:24px;font-weight:bold;margin-bottom:20px}
.label{font-size:14px;color: light-dark(#555, #b0b3b8);margin-bottom:8px}
input{
  width:100%; padding:16px 18px; border-radius:12px;
  border:1px solid light-dark(#ccc, #2c2c2e);
  background: light-dark(#f5f5f5, #1c1c1e);
  color: light-dark(#111, white); font-size:16px; margin-bottom:15px; outline:none
}
input:focus{border-color:var(--brand-green)}
.btn{
  width:100%; padding:16px; border:none; border-radius:12px;
  background:var(--brand-green); color:white; font-size:17px; font-weight:bold; cursor:pointer; margin-top:10px
}
.btn:disabled{background:#555}
.forgot{text-align:center;margin:15px 0;font-size:15px;cursor:pointer;color:var(--brand-green)}
.msg{text-align:center;font-size:15px;font-weight:bold;min-height:20px;margin-top:10px}
.msg.error{color:#ff3333 !important;}
.msg.success{color:#4caf50}
.step{display:none}
.otp-box{text-align:center;letter-spacing:10px;font-size:24px;font-weight:bold}
.video-box{
  width:100%; border-radius:18px; overflow:hidden; background:#000;
  border:1px solid light-dark(#ccc, #2c2c2e); margin:15px 0; position:relative
}
.video-box video{width:100%;display:block}
.face-frame{ position:absolute; inset:15% 15%; border:2px dashed #198754; border-radius:50%; pointer-events:none }
canvas{display:none}
.back-link{text-align:center;color:var(--brand-green);margin-top:15px;cursor:pointer;font-size:14px}
.recaptcha-container{margin:10px 0;display:flex;justify-content:center;transform:scale(0.9);transform-origin:0 0;width:100%;}

.verification-options {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
}
.or-divider {
  font-size: 13px;
  color: light-dark(#777, #999);
  margin: 5px 0;
}
.fingerprint-btn {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--brand-green);
  border-radius: 12px;
  background: light-dark(#e8f5e9, #1c2e23);
  color: var(--brand-green);
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.2s;
}
.fingerprint-btn:hover {
  background: light-dark(#d0ebd2, #243d2e);
}
.bottom-links{ text-align:center; margin-top:25px; display:flex; flex-direction:column; gap:12px; }
.bottom-links span{ color:var(--brand-green); cursor:pointer; font-weight:bold; font-size:15px; }
</style>
</head>
<body>

<div class="lang-bar">
  <select id="langSelect" onchange="changeLanguage()">
    <option value="en">🇺🇸 United States (English)</option>
    <option value="bd">🇧🇩 Bangladesh (Bengali / English)</option>
    <option value="in">🇮🇳 India (English / Hindi)</option>
    <option value="gb">🇬🇧 United Kingdom (English)</option>
    <option value="ca">🇨🇦 Canada (English / French)</option>
    <option value="au">🇦🇺 Australia (English)</option>
    <option value="sa">🇸🇦 Saudi Arabia (Arabic)</option>
    <option value="ae">🇦🇪 United Arab Emirates (Arabic / English)</option>
    <option value="pk">🇵🇰 Pakistan (Urdu / English)</option>
    <option value="cn">🇨🇳 China (Chinese)</option>
    <option value="jp">🇯🇵 Japan (Japanese)</option>
    <option value="kr">🇰🇷 South Korea (Korean)</option>
    <option value="de">🇩🇪 Germany (German)</option>
    <option value="fr">🇫🇷 France (French)</option>
    <option value="es">🇪🇸 Spain (Spanish)</option>
    <option value="it">🇮🇹 Italy (Italian)</option>
    <option value="br">🇧🇷 Brazil (Portuguese)</option>
    <option value="ru">🇷🇺 Russia (Russian)</option>
    <option value="tr">🇹🇷 Turkey (Turkish)</option>
  </select>
</div>

<div class="logo">
  <img src="logo.png" alt="Autrobook" onerror="this.src='https://via.placeholder.com/70/1c1c1e/198754?text=A'">
</div>

<div class="wrap">
  <!-- STEP 1 : LOGIN -->
  <div id="step1" class="step" style="display:block">
    <div class="title" data-key="loginTitle">Please Login</div>
    <div class="label" data-key="emailLabel">Email Address :</div>
    <input type="email" id="email" placeholder="Enter your email">
    <div class="label" data-key="passLabel">Password :</div>
    <input type="password" id="password" placeholder="Enter your password">
    
    <div class="verification-options">
      <div id="recaptcha-element" class="recaptcha-container"></div>
      <div class="or-divider" data-key="orDivider">OR LOGIN WITH</div>
      <button class="fingerprint-btn" type="button" onclick="loginWithFingerprint()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14.13 14.86c-1.12 1.34-2.12 2.64-3.13 4.14"></path><path d="M17.5 10.5c.34 1.13.5 2.3.5 3.5 0 2-.5 4-1.5 6"></path><path d="M6.5 12.5C6 11 6 9.5 6.5 8c.5-1.5 1.5-3 3-4s3-.5 4.5.5c1.5 1 2.5 2.5 3 4.5"></path><path d="M12 2a10 10 0 0 0-10 10c0 2 .5 4 1.5 5.5"></path></svg>
        <span data-key="fingerprintBtn">Login with Fingerprint / Biometric</span>
      </button>
    </div>

    <button class="btn" id="loginBtn" onclick="login()" data-key="loginBtn">Login</button>
    <a href="#" onclick="showForget()" class="forgot" data-key="forgotText">Forgot password?</a>
    <div class="msg" id="msg1"></div>
    <div class="bottom-links">
      <span onclick="goSignup()" data-key="signupText">Signup New Account</span>
      <span onclick="selfieLogin()" data-key="selfieText">Live Selfie Verification</span>
    </div>
  </div>

  <!-- STEP 2 : FORGET OTP -->
  <div id="step2" class="step">
    <div class="title" data-key="resetTitle">Reset Password</div>
    <div class="label" data-key="resetEmailLabel">Enter your Email :</div>
    <input type="email" id="resetEmail" placeholder="Your email address">
    <button class="btn" onclick="sendResetOTP()" data-key="sendOtpBtn">Send OTP</button>
    <div class="back-link" onclick="backToLogin()" data-key="backLogin">← Back to Login</div>
    <div class="msg" id="msg2"></div>
  </div>

  <!-- STEP 3 : VERIFY OTP -->
  <div id="step3" class="step">
    <div class="title" data-key="otpTitle">Enter OTP</div>
    <input type="text" id="otp" class="otp-box" placeholder="123456" maxlength="6">
    <button class="btn" onclick="verifyOTP()" data-key="verifyOtpBtn">Verify OTP</button>
    <div class="back-link" onclick="backToForget()" data-key="changeEmail">← Change Email</div>
    <div class="msg" id="msg3"></div>
  </div>

  <!-- STEP 4 : LIVE SELFIE VERIFICATION -->
  <div id="step4" class="step">
    <div class="title" id="faceTitle" data-key="selfieTitle">Live Selfie Verification</div>
    <div class="video-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="face-frame"></div>
    </div>
    <canvas id="canvas"></canvas>
    <button class="btn" id="faceBtn" onclick="captureFace()" data-key="captureBtn">📸 Capture & Login</button>
    <div class="back-link" onclick="backToLogin()" data-key="backLogin2">← Back to Login</div>
    <div class="msg" id="msg4"></div>
  </div>
</div>

<script>
let resetEmail = "";
let stream = null;
let captchaVerified = false;
let recaptchaWidgetId = null;

const translations = {
  en: { 
    loginTitle: "Please Login", emailLabel: "Email Address :", passLabel: "Password :", 
    orDivider: "OR LOGIN WITH", fingerprintBtn: "Login with Fingerprint / Biometric", 
    loginBtn: "Login", forgotText: "Forgot password?", signupText: "Signup New Account", 
    selfieText: "Live Selfie Verification", resetTitle: "Reset Password", resetEmailLabel: "Enter your Email :", 
    sendOtpBtn: "Send OTP", backLogin: "← Back to Login", otpTitle: "Enter OTP", verifyOtpBtn: "Verify OTP", 
    changeEmail: "← Change Email", selfieTitle: "Live Selfie Verification", captureBtn: "📸 Capture & Login", backLogin2: "← Back to Login" 
  },
  bd: { 
    loginTitle: "Please Login (Bangladesh)", emailLabel: "Email Address :", passLabel: "Password :", 
    orDivider: "OR LOGIN WITH", fingerprintBtn: "Login with Fingerprint / Biometric", 
    loginBtn: "Login", forgotText: "Forgot password?", signupText: "Signup New Account", 
    selfieText: "Live Selfie Verification", resetTitle: "Reset Password", resetEmailLabel: "Enter your Email :", 
    sendOtpBtn: "Send OTP", backLogin: "← Back to Login", otpTitle: "Enter OTP", verifyOtpBtn: "Verify OTP", 
    changeEmail: "← Change Email", selfieTitle: "Live Selfie Verification", captureBtn: "📸 Capture & Login", backLogin2: "← Back to Login" 
  },
  in: { 
    loginTitle: "Please Login (India)", emailLabel: "Email Address :", passLabel: "Password :", 
    orDivider: "OR LOGIN WITH", fingerprintBtn: "Login with Fingerprint / Biometric", 
    loginBtn: "Login", forgotText: "Forgot password?", signupText: "Signup New Account", 
    selfieText: "Live Selfie Verification", resetTitle: "Reset Password", resetEmailLabel: "Enter your Email :", 
    sendOtpBtn: "Send OTP", backLogin: "← Back to Login", otpTitle: "Enter OTP", verifyOtpBtn: "Verify OTP", 
    changeEmail: "← Change Email", selfieTitle: "Live Selfie Verification", captureBtn: "📸 Capture & Login", backLogin2: "← Back to Login" 
  },
  sa: { 
    loginTitle: "Please Login (Saudi Arabia)", emailLabel: "Email Address :", passLabel: "Password :", 
    orDivider: "OR LOGIN WITH", fingerprintBtn: "Login with Fingerprint / Biometric", 
    loginBtn: "Login", forgotText: "Forgot password?", signupText: "Signup New Account", 
    selfieText: "Live Selfie Verification", resetTitle: "Reset Password", resetEmailLabel: "Enter your Email :", 
    sendOtpBtn: "Send OTP", backLogin: "← Back to Login", otpTitle: "Enter OTP", verifyOtpBtn: "Verify OTP", 
    changeEmail: "← Change Email", selfieTitle: "Live Selfie Verification", captureBtn: "📸 Capture & Login", backLogin2: "← Back to Login" 
  }
};

function renderRecaptcha() {
  if (typeof grecaptcha !== 'undefined' && document.getElementById('recaptcha-element')) {
    try {
      recaptchaWidgetId = grecaptcha.render('recaptcha-element', {
        'sitekey': '6Leifx0uAAAAAP0vZ1H6sH9T7UfUH8lpyhWakTze',
        'callback': onCaptchaSuccess,
        'expired-callback': onCaptchaExpired
      });
    } catch(e) { console.error(e); }
  }
}

function applyLanguage(lang){
  const selectedLang = translations[lang] ? lang : 'en';
  localStorage.setItem('lang', selectedLang);
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[selectedLang][key]){ el.innerText = translations[selectedLang][key]; }
  });
}

function changeLanguage() { 
  applyLanguage(document.getElementById('langSelect').value); 
}

function onCaptchaSuccess(){ captchaVerified = true; msg('msg1', '', 'success'); }
function onCaptchaExpired(){ captchaVerified = false; }

function showStep(id){ 
  document.querySelectorAll('.step').forEach(s=>s.style.display='none'); 
  document.getElementById(id).style.display='block';
  if(id === 'step1' && recaptchaWidgetId !== null && typeof grecaptcha !== 'undefined') {
    try { grecaptcha.reset(recaptchaWidgetId); captchaVerified = false; } catch(e){}
  }
}

function msg(id, t, ok){ const el=document.getElementById(id); el.textContent=t; el.className='msg '+(ok?'success':'error'); }

async function login(){ 
  const email = document.getElementById('email').value.trim().toLowerCase(); 
  const password = document.getElementById('password').value; 
  
  if(!email || !password) return msg('msg1','Please fill all fields','error'); 
  if(!captchaVerified) return msg('msg1','Please complete reCAPTCHA verification','error');
  
  const recaptchaToken = grecaptcha.getResponse(recaptchaWidgetId);
  msg('msg1','Authenticating...', true); 

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, recaptchaToken })
    });

    const data = await response.json();

    if(response.ok && data.success) {
      msg('msg1','Login Successful ✅','success');
      saveSession(email);
      setTimeout(()=> location.href = 'welcome.html', 800);
    } else {
      msg('msg1', data.message || 'Invalid email or password', 'error');
      if(recaptchaWidgetId !== null) grecaptcha.reset(recaptchaWidgetId);
      captchaVerified = false;
    }
  } catch (error) {
    console.error(error);
    msg('msg1','Server connection error. Please try again.', 'error');
  }
}

async function loginWithFingerprint() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    return msg('msg1', 'Enter your email address first for fingerprint login', 'error');
  }

  if (!window.PublicKeyCredential) {
    return msg('msg1', 'Biometric / Fingerprint is not supported on this device', 'error');
  }

  msg('msg1', 'Scanning fingerprint...', true);

  try {
    const publicKey = {
      challenge: Uint8Array.from("autrobook_secure_challenge", c => c.charCodeAt(0)),
      timeout: 60000,
      userVerification: "required"
    };

    const credential = await navigator.credentials.get({ publicKey });
    
    if(credential) {
      msg('msg1', 'Fingerprint Verified ✅ Login Success', 'success');
      saveSession(email);
      setTimeout(() => location.href = 'welcome.html', 1000);
    } else {
      msg('msg1', 'Fingerprint verification failed', 'error');
    }
  } catch (error) {
    console.error(error);
    msg('msg1', 'Fingerprint verification cancelled or failed', 'error');
  }
}

function selfieLogin(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email) return msg('msg1','First enter your Email Address','error');
  resetEmail = email;
  showStep('step4');
  startCamera();
}

function goSignup(){ window.location.href = 'signup-name.html'; }
function showForget(){ showStep('step2'); document.getElementById('resetEmail').value = document.getElementById('email').value; }
function backToLogin(){ 
  showStep('step1'); 
  if(stream) stream.getTracks().forEach(t=>t.stop()); 
}
function backToForget(){ showStep('step2'); }

function sendResetOTP() {
  resetEmail = document.getElementById('resetEmail').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(resetEmail)) return msg('msg2', 'Enter valid email', 'error');
  
  msg('msg2', 'Sending OTP...', true);
  setTimeout(() => {
    msg('msg2', 'OTP sent successfully!', 'success');
    showStep('step3');
  }, 1000);
}

function verifyOTP(){
  const otp = document.getElementById('otp').value.trim();
  if(!otp) return msg('msg3','Please enter OTP','error');
  
  msg('msg3','Verifying...', true);
  setTimeout(() => {
    msg('msg3','Verified ✅','success');
    showStep('step4');
    startCamera();
  }, 1000);
}

async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    document.getElementById('video').srcObject = stream;
  } catch(e){
    msg('msg4','Camera permission needed','error');
  }
}

function captureFace(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  if(!video.srcObject) return msg('msg4','Camera not started','error');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  msg('msg4','Selfie Verified ✅ Login Success','success');
  saveSession(resetEmail || document.getElementById('email').value);
  setTimeout(()=>location.href='welcome.html',1200);
}

function saveSession(email){
  const userData = { name: 'Autrobook User', email: email, loginAt: Date.now() };
  localStorage.setItem('autrobook_user', JSON.stringify(userData));
  localStorage.setItem('ab_logged_in', '1');
}
</script>
</body>
</html>
