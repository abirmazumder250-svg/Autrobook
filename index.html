<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autrobook</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Linked Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/shortcut.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/storycard.css">
  <link rel="stylesheet" href="css/view-profile.css">
  <link rel="stylesheet" href="css/reels.css">
  <link rel="stylesheet" href="Css/CommentSection.css">
</head>
<body>

  <!-- TOP HEADER -->
  <header class="fb-topbar">
    <div class="fb-top-left">
      <a href="shortcut.html" class="fb-hamburger" title="Menu">☰</a>
      <a href="index.html" class="fb-logo-link"><span class="fb-logo-text">Autrobook</span></a>
    </div>
    <div class="fb-top-right">
      <button class="fb-top-icon" onclick="toggleCreateMenu(event)" title="Create">+</button>
      <a href="search-bar.html" class="fb-top-icon" title="Search"><i class="fas fa-search"></i></a>
      <a href="profile.html" class="fb-top-icon fb-top-letter-a" title="Autrobook">A</a>
    </div>
  </header>

  <!-- CREATE DROPDOWN MENU -->
  <div id="createMenu" class="create-menu" style="display:none;">
    <button class="create-menu-item" onclick="openCreatePost(); closeCreateMenu()"><i class="far fa-pen-to-square"></i><span>Post</span></button>
    <button class="create-menu-item" onclick="triggerStoryGallery(); closeCreateMenu()"><i class="fas fa-plus"></i><span>Story</span></button>
    <button class="create-menu-item" onclick="window.location.href='reels.html'"><i class="fas fa-clapperboard"></i><span>Reel</span></button>
    <button class="create-menu-item" onclick="openLive(); closeCreateMenu()"><i class="fas fa-video"></i><span>Live</span></button>
    <button class="create-menu-item" onclick="openNote(); closeCreateMenu()"><i class="far fa-comment"></i><span>Note</span></button>
  </div>

  <!-- CREATE POST ROW (Green Circle -> profile.html) -->
  <div class="fb-create-row">
    <a href="profile.html" class="fb-create-avatar-green" id="topProfileAvatar" title="My Profile">
      <i class="fas fa-user"></i>
    </a>
    <input type="text" class="fb-create-input" placeholder="What's on your mind?" onclick="openCreatePost()" readonly>
    <button class="fb-photo-btn" onclick="openCreatePost()" title="Photo / Post"><i class="far fa-image"></i></button>
  </div>

  <!-- STORIES SECTION (Big + -> Gallery -> storycard.html) -->
  <section class="stories-section">
    <div id="storiesRow" class="stories-row">
      <!-- Add Story Card -->
      <div class="story-card-add" onclick="triggerStoryGallery()">
        <div class="story-circle-plus">+</div>
        <span class="story-label">Add Story</span>
        <input type="file" id="storyGalleryInput" accept="image/*,video/*" style="display:none;" onchange="handleStoryUpload(event)">
      </div>
      <!-- Dynamic Story Cards Render Here -->
    </div>
  </section>

  <!-- REELS SHELF (8 Facebook-style Reels linked to reels.html & view-profile.html) -->
  <section class="reels-shelf-section">
    <div class="reels-shelf-header">
      <div class="reels-shelf-title">
        <i class="fas fa-clapperboard"></i>
        <span>Reels</span>
      </div>
      <a href="reels.html" class="reels-see-all">See all</a>
    </div>
    <div id="reelsShelfRow" class="reels-shelf-row">
      <!-- 8 Reels Rendered by JS -->
    </div>
  </section>

  <!-- MAIN POSTS FEED (Linked with reels.html, view-profile.html & CommentSection.html) -->
  <main id="postsFeed" class="posts-feed"></main>

  <!-- CREATE POST MODAL (Includes Send Post Option) -->
  <div id="createPostModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create Post</h3>
        <button class="close-btn" onclick="closeModal('createPostModal')">✕</button>
      </div>
      <textarea id="postText" placeholder="What's on your mind?" rows="4"></textarea>
      <img id="postPreview" style="display:none;width:100%;border-radius:10px;margin-top:10px;" alt="Preview">
      <input type="file" id="postImageInput" accept="image/*" style="display:none;" onchange="previewPostImage(event)">
      <div class="modal-actions">
        <button class="btn-gray" onclick="document.getElementById('postImageInput').click()"><i class="fas fa-image"></i> Photo</button>
        <button class="btn-green" id="publishBtn" onclick="publishPost()"><i class="fas fa-paper-plane"></i> Send Post</button>
      </div>
    </div>
  </div>

  <!-- STORY VIEWER MODAL (Real Views, Reactions & view-profile.html link) -->
  <div id="storyViewerModal" class="modal">
    <div class="modal-content story-viewer-box">
      <div class="story-viewer-top">
        <a id="storyAuthorLink" href="view-profile.html" class="story-author-info">
          <img id="storyViewerAvatar" src="" alt="User">
          <div>
            <strong id="storyViewerName">User</strong>
            <small id="storyViewerTime">Just now</small>
          </div>
        </a>
        <div class="story-viewer-actions">
          <a href="storycard.html" class="story-open-page-btn" title="Open Story Card">Details</a>
          <button class="close-btn" onclick="closeModal('storyViewerModal')">✕</button>
        </div>
      </div>

      <div class="story-media-stage">
        <img id="storyViewerImg" src="" alt="Story">
      </div>

      <!-- Real Views & Reactions Bar -->
      <div class="story-stats-bar">
        <button class="story-stat-pill" onclick="toggleStoryInsights()">
          <i class="fas fa-eye"></i> <span id="storyViewCount">0</span> Views
        </button>
        <div class="story-react-btns">
          <button onclick="reactToStory('👍')">👍</button>
          <button onclick="reactToStory('❤️')">❤️</button>
          <button onclick="reactToStory('🥰')">🥰</button>
          <button onclick="reactToStory('😆')">😆</button>
          <button onclick="reactToStory('😮')">😮</button>
          <button onclick="reactToStory('😢')">😢</button>
        </div>
      </div>

      <!-- Viewers & Reactors List -->
      <div id="storyInsightsBox" class="story-insights-box" style="display:none;">
        <h4>Viewers & Reactions</h4>
        <div id="storyViewersList"></div>
      </div>
    </div>
  </div>

  <!-- LIVE MODAL -->
  <div id="liveModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Go Live</h3>
        <button class="close-btn" onclick="closeModal('liveModal')">✕</button>
      </div>
      <input type="text" id="liveTitle" placeholder="Enter live video title..." class="modal-input">
      <div class="modal-actions">
        <button class="btn-gray" onclick="closeModal('liveModal')">Cancel</button>
        <button class="btn-green" onclick="startLiveStream()">Start Live</button>
      </div>
    </div>
  </div>

  <!-- NOTE MODAL -->
  <div id="noteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Share a Note</h3>
        <button class="close-btn" onclick="closeModal('noteModal')">✕</button>
      </div>
      <textarea id="noteText" placeholder="Write a quick note..." rows="3"></textarea>
      <div class="modal-actions">
        <button class="btn-gray" onclick="closeModal('noteModal')">Cancel</button>
        <button class="btn-green" onclick="publishNote()">Send Note</button>
      </div>
    </div>
  </div>

  <!-- COMMENT SHEET (Linked with CommentSection.html) -->
  <div id="commentSheet" class="bottom-sheet comment-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button onclick="closeCommentSheet()">←</button>
      <h3>Comments</h3>
      <a href="CommentSection.html" class="full-comments-link">Full View</a>
    </div>
    <div id="commentSheetList" class="comment-list-area"></div>
    <div class="comment-input-row">
      <input type="text" id="commentSheetInput" placeholder="Write a comment..." onkeypress="if(event.key==='Enter') sendCommentFromSheet()">
      <button class="send-comment-btn" onclick="sendCommentFromSheet()" title="Send Comment">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- SHARE SHEET -->
  <div id="shareSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button onclick="closeShareSheet()">←</button>
      <h3>Share Post</h3>
      <span style="width:32px;"></span>
    </div>
    <div class="sheet-group">
      <button class="sheet-item" onclick="shareToFeed()"><i class="fas fa-share"></i><span>Share to Feed Now</span></button>
      <button class="sheet-item" onclick="shareCopyLink()"><i class="fas fa-link"></i><span>Copy Post Link</span></button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR (Friends linked strictly to friend-request.html) -->
  <nav class="fb-bottom-nav">
    <a href="index.html" class="fb-bottom-item active" title="Home"><i class="fas fa-house"></i></a>
    <a href="reels.html" class="fb-bottom-item" title="Reels"><i class="fas fa-play"></i></a>
    <a href="friend-request.html" class="fb-bottom-item" title="Friends"><i class="fas fa-user-group"></i></a>
    <a href="groups.html" class="fb-bottom-item" title="Groups"><i class="fas fa-users"></i></a>
    <a href="games.html" class="fb-bottom-item" title="Games"><i class="fas fa-gamepad"></i></a>
    <a href="notifications.html" class="fb-bottom-item" title="Notifications"><i class="fas fa-bell"></i></a>
    <a href="profile.html" class="fb-bottom-item" title="Profile"><i class="far fa-circle-user"></i></a>
  </nav>

  <div id="toast" class="toast"></div>

  <!-- External & Linked Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/shortcut.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/storycard.js"></script>
  <script src="js/view-profile.js"></script>
  <script src="js/reels.jss"></script>
  <script src="js/CommentSection.js"></script>
  <script src="js/index.js"></script>
</body>
      </html>
