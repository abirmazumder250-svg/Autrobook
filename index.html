<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg-page: #000000;
      --bg-surface: #121212;
      --bg-card: #18191a;
      --bg-pill: #242526;
      --bg-pill-hover: #303234;
      --text-primary: #ffffff;
      --text-secondary: #b0b3b8;
      --border-subtle: rgba(255, 255, 255, 0.14);
      --invert-bg: #ffffff;
      --invert-fg: #000000;
      --accent-green: #0a7d3b;
      --accent-green-dark: #0B3D20;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f6f7f9;
        --bg-pill: #eef0f3;
        --bg-pill-hover: #e2e5ea;
        --text-primary: #000000;
        --text-secondary: #4b5563;
        --border-subtle: rgba(0, 0, 0, 0.14);
        --invert-bg: #000000;
        --invert-fg: #ffffff;
        --accent-green: #0a7d3b;
        --accent-green-dark: #0B3D20;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 72px;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .icon-circle-btn:hover {
      background: var(--bg-pill-hover);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .top-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .autro-a-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 1px solid var(--border-subtle);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .autro-a-btn:hover {
      opacity: 0.88;
    }

    /* PLUS DROPDOWN MENU */
    .plus-menu-popover {
      position: fixed;
      top: 56px;
      right: 54px;
      z-index: 120;
      width: 220px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .plus-menu-popover.open {
      display: flex;
    }

    .plus-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--text-primary);
      border: none;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      text-align: left;
    }

    .plus-menu-item:hover {
      background: var(--bg-pill);
    }

    .plus-menu-item-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .live-lock-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    /* COMPOSER BAR */
    .composer-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }

    .avatar-slot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-primary);
    }

    .avatar-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mind-trigger-btn {
      flex: 1;
      text-align: left;
      background: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14.5px;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mind-trigger-btn:hover {
      background: var(--bg-pill-hover);
      color: var(--text-primary);
    }

    .gallery-trigger-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: transparent;
      color: var(--accent-green);
      border: 1px solid var(--border-subtle);
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .gallery-trigger-btn:hover {
      background: var(--bg-pill);
    }

    /* STORY STRIP */
    .story-strip {
      padding: 12px 14px;
      border-bottom: 8px solid var(--bg-pill);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story-card-box {
      position: relative;
      width: 112px;
      height: 170px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      cursor: pointer;
    }

    .story-card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .story-card-top-label {
      position: relative;
      z-index: 2;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .story-card-bottom {
      position: relative;
      z-index: 2;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 16px 6px 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .story-plus-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 2px solid var(--bg-surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }

    /* UNIFIED POST-CARD FEED STREAM */
    .feed-section {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .fb-post {
      background: var(--bg-surface);
      border-bottom: 8px solid var(--bg-pill);
      padding-bottom: 6px;
    }

    .fb-post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
      gap: 10px;
    }

    .fb-author-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .fb-author-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      min-height: 18px;
    }

    .fb-live-time {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .fb-views-right {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .fb-caption {
      padding: 2px 14px 10px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fb-caption.bold-text {
      font-weight: 700;
    }

    .fb-media {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .fb-counts-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .fb-action-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border-subtle);
      margin: 0 8px;
      padding: 3px 0;
    }

    .fb-action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 9px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      user-select: none;
      touch-action: manipulation;
      text-decoration: none;
    }

    .fb-action-btn:hover {
      background: var(--bg-pill);
      color: var(--text-primary);
    }

    .fb-action-btn.active {
      color: var(--text-primary);
      font-weight: 800;
    }

    .reaction-popup {
      position: fixed;
      z-index: 260;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 7px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      user-select: none;
      max-width: calc(100vw - 16px);
    }

    .reaction-popup.open {
      display: flex;
    }

    .reaction-emoji-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .reaction-emoji-btn:hover,
    .reaction-emoji-btn:active {
      background: var(--bg-pill);
      transform: scale(1.22);
    }

    .share-menu {
      position: fixed;
      z-index: 250;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 150px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .share-menu.open {
      display: flex;
    }

    .share-menu-btn {
      background: transparent;
      color: var(--text-primary);
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .share-menu-btn:hover {
      background: var(--bg-pill);
    }

    /* BOTTOM NAVIGATION BAR */
    .bottom-nav-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      height: 58px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      padding: 0 4px;
    }

    .bottom-nav-item {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 20px;
      position: relative;
    }

    .bottom-nav-item:hover,
    .bottom-nav-item.active {
      color: var(--text-primary);
    }

    .bottom-nav-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .toast-banner {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--invert-bg);
      color: var(--invert-fg);
      border: 1px solid var(--border-subtle);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 200;
      display: none;
    }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const LIVEKIT_URL = 'wss://autrobook-aij9raun.livekit.cloud';
    const TWO_MONTHS_MS = 60 * 24 * 60 * 60 * 1000;
    const REACTIONS = ['❤️', '👍', '🥰', '😆', '😮', '😢', '😠'];

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    let activeUser = null;
    let activeProfileName = '';
    let activeAvatarUrl = '';
    let liveCount = Number(localStorage.getItem('autro_live_count') || '0');
    let feedPosts = [];
    let activeReactionPostId = null;
    let activeSharePost = null;
    let audioCtx = null;
    let ignoreNextDocumentClick = false;

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._idxToast);
      window._idxToast = setTimeout(() => { el.style.display = 'none'; }, 2400);
    }

    function playReactionSound() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(560, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (_) {}
    }

    function formatLiveElapsed(createdAtStr) {
      if (!createdAtStr) return '0s';
      const createdMs = new Date(createdAtStr).getTime();
      if (Number.isNaN(createdMs)) return '0s';
      const diffSec = Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}d`;
    }

    function readLocalReactionState() {
      return JSON.parse(localStorage.getItem('autro_post_reactions_local') || '{}');
    }

    function writeLocalReactionState(postId, data) {
      const all = readLocalReactionState();
      all[postId] = data;
      localStorage.setItem('autro_post_reactions_local', JSON.stringify(all));
    }

    function readSharedPostsSet() {
      return JSON.parse(localStorage.getItem('autro_shared_posts_set') || '{}');
    }

    function markPostSharedLocal(postId, countVal) {
      const setObj = readSharedPostsSet();
      setObj[postId] = Number(countVal || 0);
      localStorage.setItem('autro_shared_posts_set', JSON.stringify(setObj));
    }

    function readLocalCommentsCount(postId) {
      const all = JSON.parse(localStorage.getItem('autro_comments_store') || '{}');
      return Array.isArray(all[postId]) ? all[postId].length : 0;
    }

    function resolveSavedAvatarUrl(raw) {
      const val = String(raw || '').trim();
      if (!val) return '';
      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:') || val.startsWith('blob:')) {
        return val;
      }
      if (sb) {
        return sb.storage.from('avatars').getPublicUrl(val.replace(/^\/+/, '')).data.publicUrl || '';
      }
      return '';
    }

    function renderSavedAvatarsOnly(avatarUrl) {
      const cleanUrl = resolveSavedAvatarUrl(avatarUrl || '');
      const sideLink = document.getElementById('storySideAvatarLink');
      const storyBg = document.getElementById('storyCardBgPhoto');
      const bottomBox = document.getElementById('bottomProfileAvatarBox');

      sideLink.innerHTML = '';
      bottomBox.innerHTML = '';
      storyBg.style.display = 'none';
      storyBg.removeAttribute('src');

      if (!cleanUrl) return;

      const img1 = document.createElement('img');
      img1.src = cleanUrl;
      img1.alt = '';
      img1.onerror = () => img1.remove();
      sideLink.appendChild(img1);

      const img2 = document.createElement('img');
      img2.src = cleanUrl;
      img2.alt = '';
      img2.onerror = () => img2.remove();
      bottomBox.appendChild(img2);

      storyBg.src = cleanUrl;
      storyBg.style.display = 'block';
      storyBg.onerror = () => {
        storyBg.style.display = 'none';
        storyBg.removeAttribute('src');
      };
    }

    function isAccountLiveUnlocked(userObj) {
      const createdRaw = userObj?.created_at || localStorage.getItem('autro_account_created_at');
      if (!createdRaw) return false;
      const createdTime = new Date(createdRaw).getTime();
      if (Number.isNaN(createdTime)) return false;
      return (Date.now() - createdTime) >= TWO_MONTHS_MS;
    }

    function refreshLiveLockBadge() {
      const badge = document.getElementById('liveLockBadge');
      const unlocked = isAccountLiveUnlocked(activeUser);
      badge.textContent = unlocked ? `Live (${liveCount})` : `2M Lock · ${liveCount}`;
    }

    async function loadSupabaseSessionProfile() {
      renderSavedAvatarsOnly('');
      activeProfileName = String(localStorage.getItem('autro_profile_name') || '').trim();

      if (!sb) {
        refreshLiveLockBadge();
        return;
      }

      try {
        const { data: { session } } = await sb.auth.getSession();
        activeUser = session?.user || null;

        if (activeUser) {
          if (activeUser.created_at) {
            localStorage.setItem('autro_account_created_at', activeUser.created_at);
          }

          const { data: prof } = await sb
            .from('profiles')
            .select('full_name, avatar_url')
            .eq('id', activeUser.id)
            .maybeSingle();

          const resolvedName = String(
            prof?.full_name ||
            activeUser.user_metadata?.full_name ||
            activeUser.user_metadata?.name ||
            activeProfileName ||
            ''
          ).trim();

          if (resolvedName) {
            activeProfileName = resolvedName;
            localStorage.setItem('autro_profile_name', resolvedName);
          }

          activeAvatarUrl =
            prof?.avatar_url ||
            activeUser.user_metadata?.avatar_url ||
            activeUser.user_metadata?.avatar ||
            activeUser.user_metadata?.picture ||
            '';

          renderSavedAvatarsOnly(activeAvatarUrl);
        }
      } catch (_) {
        renderSavedAvatarsOnly('');
      }

      refreshLiveLockBadge();
    }

    async function loadLiveSessionCount() {
      if (!sb) {
        refreshLiveLockBadge();
        return;
      }
      try {
        const { count, error } = await sb
          .from('live_sessions')
          .select('*', { count: 'exact', head: true });
        if (!error && typeof count === 'number') {
          liveCount = count;
          localStorage.setItem('autro_live_count', String(liveCount));
        }
      } catch (_) {}
      refreshLiveLockBadge();
    }

    async function handleLiveMenuClick() {
      document.getElementById('plusMenuPopover').classList.remove('open');
      if (!isAccountLiveUnlocked(activeUser)) {
        showToast('New accounts are locked from Live for 2 months. Auto-unlocks after 2 months.');
        return;
      }

      liveCount += 1;
      localStorage.setItem('autro_live_count', String(liveCount));
      refreshLiveLockBadge();

      if (activeUser && sb) {
        const roomName = `autro-live-${activeUser.id}-${Date.now()}`;
        const { error } = await sb
          .from('live_sessions')
          .insert({
            host_user_id: activeUser.id,
            livekit_room: roomName,
            status: 'live'
          });
        if (!error) {
          await loadLiveSessionCount();
        }
      }

      showToast(`Live started (${LIVEKIT_URL}) · Live count: ${liveCount}`);
    }

    async function applyPostReaction(postObj, emoji) {
      if (!postObj) return;

      if (postObj.userReaction === emoji) {
        postObj.userReaction = null;
        postObj.reaction_count = Math.max(0, Number(postObj.reaction_count || 0) - 1);
        writeLocalReactionState(postObj.id, { emoji: null, count: postObj.reaction_count });
        renderFeedCards();
        showToast('Reaction undone');

        if (activeUser && sb && !String(postObj.id).startsWith('local-')) {
          try {
            await sb.from('post_reactions').delete().eq('post_id', postObj.id).eq('user_id', activeUser.id);
            const { data: fresh } = await sb.from('posts').select('reaction_count').eq('id', postObj.id).maybeSingle();
            if (fresh && typeof fresh.reaction_count === 'number') {
              postObj.reaction_count = fresh.reaction_count;
              writeLocalReactionState(postObj.id, { emoji: null, count: postObj.reaction_count });
              renderFeedCards();
            }
          } catch (_) {}
        }
        return;
      }

      if (!postObj.userReaction) {
        postObj.reaction_count = Number(postObj.reaction_count || 0) + 1;
      }
      postObj.userReaction = emoji;
      writeLocalReactionState(postObj.id, { emoji: postObj.userReaction, count: postObj.reaction_count });
      renderFeedCards();

      if (activeUser && sb && !String(postObj.id).startsWith('local-')) {
        try {
          await sb.from('post_reactions').upsert(
            { post_id: postObj.id, user_id: activeUser.id, reaction_emoji: emoji },
            { onConflict: 'post_id,user_id' }
          );
          const { data: fresh } = await sb.from('posts').select('reaction_count').eq('id', postObj.id).maybeSingle();
          if (fresh && typeof fresh.reaction_count === 'number') {
            postObj.reaction_count = Math.max(postObj.reaction_count, fresh.reaction_count);
            writeLocalReactionState(postObj.id, { emoji: postObj.userReaction, count: postObj.reaction_count });
            renderFeedCards();
          }
        } catch (_) {}
      }
    }

    function openReactionPopup(anchorEl, postObj) {
      activeReactionPostId = postObj.id;
      ignoreNextDocumentClick = true;
      const popup = document.getElementById('reactionPopup');
      popup.innerHTML = '';

      REACTIONS.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'reaction-emoji-btn';
        btn.textContent = emoji;
        btn.addEventListener('pointerdown', (e) => e.stopPropagation());
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetPost = feedPosts.find(p => p.id === activeReactionPostId);
          if (targetPost) applyPostReaction(targetPost, emoji);
          closeReactionPopup();
        });
        popup.appendChild(btn);
      });

      const rect = anchorEl.getBoundingClientRect();
      popup.classList.add('open');
      const pRect = popup.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2 - pRect.width / 2;
      const left = Math.min(window.innerWidth - pRect.width - 8, Math.max(8, centerX));
      const top = Math.max(8, rect.top - pRect.height - 8);
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      playReactionSound();
    }

    function closeReactionPopup() {
      document.getElementById('reactionPopup').classList.remove('open');
      activeReactionPostId = null;
    }

    function bindReactionBtn(btnEl, postObj) {
      let pressTimer = null;
      let wasLongPress = false;

      const startPress = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        wasLongPress = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          wasLongPress = true;
          openReactionPopup(btnEl, postObj);
        }, 360);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      btnEl.addEventListener('pointerdown', startPress);
      btnEl.addEventListener('pointerup', cancelPress);
      btnEl.addEventListener('pointerleave', cancelPress);
      btnEl.addEventListener('pointercancel', cancelPress);
      btnEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        wasLongPress = true;
        openReactionPopup(btnEl, postObj);
      });

      btnEl.addEventListener('click', (e) => {
        if (wasLongPress) {
          e.preventDefault();
          wasLongPress = false;
          return;
        }
        applyPostReaction(postObj, postObj.userReaction || '👍');
      });
    }

    function buildPostShareUrl(postId) {
      const base = `${window.location.origin}/post-card.html`;
      return `${base}?post=${encodeURIComponent(postId)}`;
    }

    function openShareMenu(anchorBtn, postObj) {
      activeSharePost = postObj;
      ignoreNextDocumentClick = true;
      const menu = document.getElementById('shareMenu');
      const rect = anchorBtn.getBoundingClientRect();
      menu.classList.add('open');
      const mRect = menu.getBoundingClientRect();
      const left = Math.min(window.innerWidth - mRect.width - 10, Math.max(10, rect.left));
      const top = Math.max(10, rect.top - mRect.height - 8);
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function closeShareMenu() {
      document.getElementById('shareMenu').classList.remove('open');
    }

    function bindShareBtn(btnEl, postObj) {
      let pressTimer = null;
      let wasLongPress = false;

      const startPress = () => {
        wasLongPress = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          wasLongPress = true;
          openShareMenu(btnEl, postObj);
        }, 380);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      btnEl.addEventListener('pointerdown', startPress);
      btnEl.addEventListener('pointerup', cancelPress);
      btnEl.addEventListener('pointerleave', cancelPress);
      btnEl.addEventListener('pointercancel', cancelPress);
      btnEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        wasLongPress = true;
        openShareMenu(btnEl, postObj);
      });

      btnEl.addEventListener('click', async (e) => {
        if (wasLongPress) {
          e.preventDefault();
          wasLongPress = false;
          return;
        }
        const sharedSet = readSharedPostsSet();
        if (postObj._sharedOnce || Object.prototype.hasOwnProperty.call(sharedSet, postObj.id)) {
          showToast('Already shared');
          return;
        }
        postObj._sharedOnce = true;
        postObj.share_count = Number(postObj.share_count || 0) + 1;
        markPostSharedLocal(postObj.id, postObj.share_count);
        renderFeedCards();
        showToast('Shared');

        if (sb && activeUser && postObj.id && !String(postObj.id).startsWith('local-')) {
          try {
            await sb.from('post_shares').upsert(
              { post_id: postObj.id, user_id: activeUser.id },
              { onConflict: 'post_id,user_id' }
            );
            const { data: freshPost } = await sb
              .from('posts')
              .select('share_count')
              .eq('id', postObj.id)
              .maybeSingle();
            if (freshPost && typeof freshPost.share_count === 'number') {
              postObj.share_count = Math.max(Number(postObj.share_count || 0), freshPost.share_count);
              markPostSharedLocal(postObj.id, postObj.share_count);
              renderFeedCards();
            }
          } catch (_) {}
        }
      });
    }

    function hasMeaningfulPostContent(item) {
      if (!item) return false;
      const author = String(item.author_name || '').trim();
      const caption = String(item.caption || '').trim();
      const media = String(item.media_url || '').trim();
      return Boolean(author || caption || media);
    }

    function renderFeedCards() {
      const container = document.getElementById('homeFeedList');
      container.innerHTML = '';

      feedPosts.slice(0, 15).forEach(post => {
        if (!hasMeaningfulPostContent(post)) return;

        const article = document.createElement('article');
        article.className = 'fb-post';

        const head = document.createElement('div');
        head.className = 'fb-post-head';

        const authorCol = document.createElement('div');
        authorCol.className = 'fb-author-col';

        const authorDiv = document.createElement('div');
        authorDiv.className = 'fb-author-name';
        authorDiv.textContent = String(post.author_name || activeProfileName || '').trim();

        const timeDiv = document.createElement('div');
        timeDiv.className = 'fb-live-time';
        timeDiv.dataset.createdAt = post.created_at || '';
        timeDiv.textContent = formatLiveElapsed(post.created_at);

        authorCol.appendChild(authorDiv);
        authorCol.appendChild(timeDiv);

        const viewsRight = document.createElement('div');
        viewsRight.className = 'fb-views-right';
        viewsRight.innerHTML = `<i class="far fa-eye"></i><span>${Number(post.view_count || 0)}</span>`;

        head.appendChild(authorCol);
        head.appendChild(viewsRight);
        article.appendChild(head);

        if (post.caption) {
          const capDiv = document.createElement('div');
          capDiv.className = `fb-caption ${post.is_bold ? 'bold-text' : ''}`;
          capDiv.textContent = post.caption;
          article.appendChild(capDiv);
        }

        if (post.media_url) {
          if (post.is_video) {
            const vid = document.createElement('video');
            vid.className = 'fb-media';
            vid.src = post.media_url;
            vid.controls = true;
            vid.playsInline = true;
            article.appendChild(vid);
          } else {
            const img = document.createElement('img');
            img.className = 'fb-media';
            img.src = post.media_url;
            img.alt = '';
            article.appendChild(img);
          }
        }

        const cmtCount = Math.max(Number(post.comment_count || 0), readLocalCommentsCount(post.id));
        const countsDiv = document.createElement('div');
        countsDiv.className = 'fb-counts-row';
        countsDiv.innerHTML = `
          <span>${post.userReaction || '👍'} ${Number(post.reaction_count || 0)}</span>
          <span>${cmtCount} comments · ${Number(post.share_count || 0)} shares</span>
        `;
        article.appendChild(countsDiv);

        const actionBar = document.createElement('div');
        actionBar.className = 'fb-action-bar';

        const likeBtn = document.createElement('button');
        likeBtn.type = 'button';
        likeBtn.className = `fb-action-btn ${post.userReaction ? 'active' : ''}`;
        likeBtn.innerHTML = post.userReaction
          ? `<span>${post.userReaction}</span><span>Like</span>`
          : `<i class="far fa-thumbs-up"></i><span>Like</span>`;
        bindReactionBtn(likeBtn, post);

        const cmtLink = document.createElement('a');
        cmtLink.href = `post-card.html?post=${encodeURIComponent(post.id)}`;
        cmtLink.className = 'fb-action-btn';
        cmtLink.innerHTML = `<i class="far fa-comment"></i><span>Comment</span>`;

        const shareBtn = document.createElement('button');
        shareBtn.type = 'button';
        shareBtn.className = 'fb-action-btn';
        shareBtn.innerHTML = `<i class="fas fa-share"></i><span>Share</span>`;
        bindShareBtn(shareBtn, post);

        actionBar.appendChild(likeBtn);
        actionBar.appendChild(cmtLink);
        actionBar.appendChild(shareBtn);
        article.appendChild(actionBar);
        container.appendChild(article);
      });
    }

    function refreshFeedTimersOnly() {
      document.querySelectorAll('.fb-live-time').forEach(el => {
        el.textContent = formatLiveElapsed(el.dataset.createdAt);
      });
    }

    async function loadHomeFeedPosts() {
      const localReactions = readLocalReactionState();
      const sharedSet = readSharedPostsSet();
      const map = new Map();

      if (sb) {
        try {
          const { data: rows, error } = await sb
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

          if (!error && Array.isArray(rows)) {
            rows.forEach(r => {
              const locR = localReactions[r.id];
              const resolvedCount = Math.max(Number(r.reaction_count || 0), Number(locR?.count || 0));
              const resolvedShare = Math.max(Number(r.share_count || 0), Number(sharedSet[r.id] || 0));

              const normalized = {
                id: r.id,
                author_name: String(r.author_name || activeProfileName || '').trim(),
                caption: String(r.caption || '').trim(),
                is_bold: Boolean(r.is_bold),
                media_url: String(r.media_url || '').trim(),
                is_video: String(r.media_type || '').startsWith('video'),
                reaction_count: resolvedCount,
                comment_count: Number(r.comment_count || 0),
                share_count: resolvedShare,
                view_count: Number(r.view_count || 0),
                created_at: r.created_at || new Date().toISOString(),
                userReaction: locR?.emoji || null,
                _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, r.id)
              };
              if (hasMeaningfulPostContent(normalized)) {
                map.set(r.id, normalized);
              }
            });
          }

          if (map.size > 0) {
            const ids = Array.from(map.keys());
            const { data: shareRows } = await sb.from('post_shares').select('post_id').in('post_id', ids);
            if (Array.isArray(shareRows)) {
              const sMap = new Map();
              shareRows.forEach(sr => sMap.set(sr.post_id, (sMap.get(sr.post_id) || 0) + 1));
              sMap.forEach((cnt, pid) => {
                const p = map.get(pid);
                if (p) p.share_count = Math.max(Number(p.share_count || 0), cnt);
              });
            }

            if (activeUser) {
              const { data: myReacts } = await sb
                .from('post_reactions')
                .select('post_id, reaction_emoji')
                .eq('user_id', activeUser.id)
                .in('post_id', ids);

              (myReacts || []).forEach(mr => {
                const p = map.get(mr.post_id);
                if (p) {
                  p.userReaction = mr.reaction_emoji;
                  writeLocalReactionState(p.id, { emoji: p.userReaction, count: p.reaction_count });
                }
              });
            }
          }
        } catch (_) {}
      }

      if (map.size === 0) {
        const q1 = JSON.parse(localStorage.getItem('autro_instant_feed_posts') || '[]');
        const q2 = JSON.parse(localStorage.getItem('autro_post_cards') || '[]');
        [...q1, ...q2].forEach(item => {
          if (item && item.id) {
            const locR = localReactions[item.id];
            const baseCount = Number(item.reaction_count ?? item.reactions ?? 0);
            const baseShare = Number(item.share_count ?? item.shares ?? 0);

            const normalized = {
              id: item.id,
              author_name: String(item.author_name || activeProfileName || '').trim(),
              caption: String(item.caption || '').trim(),
              is_bold: Boolean(item.is_bold),
              media_url: String(item.media_url || '').trim(),
              is_video: Boolean(item.is_video),
              reaction_count: Math.max(baseCount, Number(locR?.count || 0)),
              comment_count: Number(item.comment_count ?? item.comments ?? 0),
              share_count: Math.max(baseShare, Number(sharedSet[item.id] || 0)),
              view_count: Number(item.view_count ?? item.views ?? 0),
              created_at: item.posted_at || item.created_at || new Date().toISOString(),
              userReaction: locR?.emoji || null,
              _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, item.id)
            };
            if (hasMeaningfulPostContent(normalized)) {
              map.set(item.id, normalized);
            }
          }
        });
      }

      feedPosts = Array.from(map.values());
      renderFeedCards();
    }

    document.getElementById('shareToChatOption').addEventListener('click', () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      sessionStorage.setItem('autro_shared_post_payload', JSON.stringify({
        postId: activeSharePost.id,
        url: postUrl,
        caption: activeSharePost.caption || '',
        assets: ['autro-chat.html', 'autro-chat.css', 'autro-chat.js']
      }));
      closeShareMenu();
      window.location.href = `autro-chat.html?share=${encodeURIComponent(postUrl)}&assets=autro-chat.html,autro-chat.css,autro-chat.js`;
    });

    document.getElementById('copyPostLinkOption').addEventListener('click', async () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(postUrl);
        } else {
          const tmp = document.createElement('textarea');
          tmp.value = postUrl;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand('copy');
          tmp.remove();
        }
        showToast('Link copied');
      } catch (_) {
        showToast('Could not copy link');
      }
      closeShareMenu();
    });

    document.getElementById('plusMenuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('plusMenuPopover').classList.toggle('open');
    });

    document.getElementById('liveOptionBtn').addEventListener('click', handleLiveMenuClick);

    document.getElementById('phoneGalleryTriggerBtn').addEventListener('click', () => {
      document.getElementById('phoneGalleryFileInput').click();
    });

    document.getElementById('phoneGalleryFileInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const blobUrl = URL.createObjectURL(file);
      sessionStorage.setItem('autro_picked_gallery_media', JSON.stringify({
        url: blobUrl,
        name: file.name,
        type: file.type
      }));
      window.location.href = 'create-post.html?from=gallery';
    });

    document.addEventListener('click', (e) => {
      if (ignoreNextDocumentClick) {
        ignoreNextDocumentClick = false;
        return;
      }
      const pop = document.getElementById('plusMenuPopover');
      const btn = document.getElementById('plusMenuBtn');
      if (pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)) {
        pop.classList.remove('open');
      }
      const popup = document.getElementById('reactionPopup');
      if (popup.classList.contains('open') && !popup.contains(e.target)) {
        closeReactionPopup();
      }
      const sMenu = document.getElementById('shareMenu');
      if (sMenu.classList.contains('open') && !sMenu.contains(e.target)) {
        closeShareMenu();
      }
    });

    setInterval(refreshFeedTimersOnly, 1000);

    window.addEventListener('DOMContentLoaded', async () => {
      await loadSupabaseSessionProfile();
      await loadLiveSessionCount();
      await loadHomeFeedPosts();
    });
  </script>
