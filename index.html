<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autrobook</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Linked Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/shortcut.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/storycard.css">
  <link rel="stylesheet" href="css/view-profile.css">
  <link rel="stylesheet" href="css/reels.css">
  <link rel="stylesheet" href="Css/CommentSection.css">

  <style>
    /* =========================================================================
       SYSTEM DEFAULT THEME (Light Theme -> Black Text | Dark Theme -> White Text)
       ========================================================================= */
    :root {
      --bg-page: #f0f2f5;
      --bg-surface: #ffffff;
      --bg-input: #f0f2f5;
      --bg-hover: #e4e6eb;
      --text-primary: #050505;
      --text-secondary: #65676b;
      --logo-color: #050505; /* থিম সাদা হলে Autrobook লেখা কালো */
      --border-color: #ced0d4;
      --divider-color: #ccced2;
      --accent-green: #0b5e2b;
      --accent-green-hover: #084720;
      --fb-blue: #1877f2;
      --sheet-bg: #ffffff;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #18191a;
        --bg-surface: #242526;
        --bg-input: #3a3b3c;
        --bg-hover: #4e4f50;
        --text-primary: #e4e6eb;
        --text-secondary: #b0b3b8;
        --logo-color: #ffffff; /* থিম কালো হলে Autrobook লেখা সাদা */
        --border-color: #3e4042;
        --divider-color: #18191a;
        --accent-green: #0d6e32;
        --accent-green-hover: #0a5828;
        --sheet-bg: #242526;
        --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      padding-bottom: 66px;
      overflow-x: hidden;
    }

    /* =========================================================================
       TOP HEADER BAR (Left: 3-line + Autrobook | Right: + Create, Search, Profile)
       ========================================================================= */
    .fb-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-surface);
      gap: 10px;
    }

    .fb-top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .fb-hamburger {
      color: var(--text-primary);
      font-size: 21px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }

    .fb-hamburger:hover {
      background: var(--bg-hover);
    }

    .fb-logo-link {
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .fb-logo-text {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--logo-color);
      transition: color 0.2s ease;
    }

    .fb-top-right {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .fb-top-plus-box {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 2px solid var(--text-primary);
      background: transparent;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .fb-top-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-input);
      color: var(--text-primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }

    .fb-user-avatar-link {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
    }

    .fb-user-avatar-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================================================================
       CREATE DROPDOWN MENU (4 Options: Post, Reels, Story, Live)
       ========================================================================= */
    .create-menu {
      position: fixed;
      top: 54px;
      right: 56px;
      width: 220px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 250;
      overflow: hidden;
      padding: 6px;
    }

    .create-menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .create-menu-item:hover {
      background: var(--bg-hover);
    }

    .create-menu-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .create-menu-left i {
      width: 20px;
      text-align: center;
      color: var(--accent-green);
      font-size: 16px;
    }

    .live-lock-badge {
      font-size: 11px;
      background: var(--bg-input);
      color: var(--text-secondary);
      padding: 2px 7px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* =========================================================================
       CREATE POST ROW (Avatar -> profile.html | Input | Green Gallery Icon)
       ========================================================================= */
    .fb-create-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 12px;
      background: var(--bg-surface);
      border-bottom: 4px solid var(--divider-color);
    }

    .fb-create-input {
      flex: 1;
      height: 40px;
      border-radius: 22px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      padding: 0 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .fb-create-input::placeholder {
      color: var(--text-primary);
      opacity: 0.85;
    }

    .fb-photo-btn {
      background: transparent;
      border: none;
      color: #45bd62;
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
    }

    /* =========================================================================
       STORIES SECTION (Card -> story-card.html | Circle Avatar -> User Profile)
       ========================================================================= */
    .stories-section {
      background: var(--bg-surface);
      padding: 12px 0 12px 12px;
      border-bottom: 6px solid var(--divider-color);
    }

    .stories-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-right: 12px;
    }

    .stories-row::-webkit-scrollbar {
      display: none;
    }

    .story-card-create {
      position: relative;
      width: 108px;
      height: 188px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .story-create-top-img {
      width: 100%;
      height: 126px;
      object-fit: cover;
      background: var(--bg-input);
    }

    .story-create-bottom {
      flex: 1;
      background: var(--bg-surface);
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
    }

    .story-create-plus-circle {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-green);
      color: #ffffff;
      border: 3px solid var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .story-create-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .story-card-item {
      position: relative;
      width: 108px;
      height: 188px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: #111;
      border: 1px solid var(--border-color);
    }

    .story-card-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .story-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%);
      pointer-events: none;
    }

    .story-card-avatar-ring {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid var(--accent-green);
      padding: 1.5px;
      background: var(--bg-surface);
      z-index: 3;
      overflow: hidden;
      display: block;
    }

    .story-card-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .story-card-username {
      position: absolute;
      bottom: 9px;
      left: 8px;
      right: 8px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
      pointer-events: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================================================================
       POSTS FEED & REACTION SYSTEM
       ========================================================================= */
    .posts-feed {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .post-card {
      background: var(--bg-surface);
      padding: 12px 0 6px;
      box-shadow: var(--card-shadow);
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 10px;
    }

    .post-author-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .post-author-meta {
      display: flex;
      flex-direction: column;
    }

    .post-author-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .post-author-name-row a {
      color: inherit;
      text-decoration: none;
    }

    .verified-badge {
      color: var(--fb-blue);
      font-size: 13px;
    }

    .post-follow-btn {
      color: var(--accent-green);
      font-weight: 700;
      font-size: 14px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .post-time-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .post-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .post-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post-icon-btn:hover {
      background: var(--bg-hover);
    }

    .post-caption {
      padding: 0 14px 10px;
      font-size: 15px;
      line-height: 1.4;
      color: var(--text-primary);
      word-break: break-word;
    }

    .post-media-wrap {
      width: 100%;
      background: #000;
      max-height: 520px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post-media-wrap img,
    .post-media-wrap video {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      display: block;
    }

    .post-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .reaction-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .reaction-emoji-stack {
      display: flex;
      align-items: center;
    }

    .reaction-emoji-stack span {
      font-size: 15px;
      margin-right: -3px;
      background: var(--bg-surface);
      border-radius: 50%;
    }

    .post-counts-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post-counts-right span {
      cursor: pointer;
    }

    .post-action-bar {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border-color);
      margin: 0 12px;
      padding-top: 4px;
    }

    .post-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 4px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .post-action-btn:hover {
      background: var(--bg-hover);
    }

    .post-action-btn.reacted {
      color: var(--accent-green);
      font-weight: 700;
    }

    .reaction-picker-popup {
      position: absolute;
      bottom: 46px;
      left: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 6px 10px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      z-index: 50;
    }

    .reaction-picker-popup.show {
      display: flex;
    }

    .reaction-emoji-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .reaction-emoji-btn:hover {
      transform: scale(1.28);
    }

    /* =========================================================================
       BOTTOM NAVIGATION BAR (Reels, Home, Groups, Games, Notifications, Profile)
       ========================================================================= */
    .fb-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
      z-index: 120;
    }

    .fb-bottom-item {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 20px;
      position: relative;
    }

    .fb-bottom-item.active {
      color: var(--accent-green);
    }

    .fb-bottom-item.active::after {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: var(--accent-green);
      border-radius: 0 0 4px 4px;
    }

    .nav-profile-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent-green);
    }

    /* =========================================================================
       SHEETS, MODALS & DARK GREEN BUTTONS
       ========================================================================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 300;
      display: none;
    }

    .sheet-backdrop.open {
      display: block;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--sheet-bg);
      border-radius: 18px 18px 0 0;
      z-index: 310;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--text-secondary);
      opacity: 0.45;
      border-radius: 4px;
      margin: 10px auto 6px;
    }

    .fb-options-card {
      background: var(--bg-input);
      border-radius: 14px;
      margin: 8px 14px;
      overflow: hidden;
    }

    .fb-option-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .fb-option-row:last-child {
      border-bottom: none;
    }

    .fb-option-row i {
      width: 22px;
      text-align: center;
      font-size: 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 400;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      cursor: pointer;
    }

    .btn-dark-green {
      background: var(--accent-green);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-dark-green:hover {
      background: var(--accent-green-hover);
    }

    .btn-dark-green:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-primary);
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* =========================================================================
       COMMENT SHEET (All Languages, Gallery Camera, 10-30s Voice Recorder, 3-Dot)
       ========================================================================= */
    .comment-sheet {
      height: 85vh;
    }

    .comment-sheet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      font-weight: 700;
    }

    .comment-list-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      user-select: none;
    }

    .comment-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .comment-body-wrap {
      flex: 1;
      min-width: 0;
    }

    .comment-bubble {
      background: var(--bg-input);
      border-radius: 16px;
      padding: 8px 12px;
      display: inline-block;
      max-width: 100%;
    }

    .comment-author-link {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      display: block;
      margin-bottom: 2px;
    }

    .comment-text {
      font-size: 14px;
      line-height: 1.35;
      word-break: break-word;
    }

    .comment-media-img {
      margin-top: 6px;
      max-width: 210px;
      border-radius: 10px;
      display: block;
    }

    .comment-audio-player {
      margin-top: 6px;
      height: 34px;
      max-width: 220px;
    }

    .comment-meta-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 8px 0;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .comment-dots-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 4px 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .comment-composer-box {
      border-top: 1px solid var(--border-color);
      padding: 8px 12px;
      background: var(--bg-surface);
    }

    .restriction-banner {
      background: rgba(220, 38, 38, 0.14);
      color: #ef4444;
      border: 1px solid rgba(220, 38, 38, 0.35);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

  <script>
    // =========================================================================
    // 1. SUPABASE & LIVEKIT CONFIGURATION
    // =========================================================================
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const LIVEKIT_URL = 'wss://autrobook-aij9raun.livekit.cloud';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentUserProfile = null;
    let activePostId = null;
    let activeCommentObj = null;
    let activeReportTarget = { type: 'post', id: null };
    let composerMode = 'post';
    let composerSelectedFile = null;

    // Voice Recording State (10s - 30s)
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingSeconds = 0;
    let recordingInterval = null;
    let recordedVoiceBlob = null;
    let selectedCommentImageFile = null;

    const REACTION_EMOJIS = ['👍', '❤️', '😆', '🥰', '😢', '😮', '😠'];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function formatCompactCount(num) {
      if (!num || num <= 0) return '0';
      if (num >= 1000) {
        const val = (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1);
        return val.replace(/\.0$/, '') + 'k';
      }
      return String(num);
    }

    // =========================================================================
    // 2. LOAD REAL SAVED SUPABASE PROFILE (NO "GU" / NO GUEST USER)
    // =========================================================================
    async function initUserSession() {
      const { data: { session } } = await sb.auth.getSession();
      const user = session?.user;

      if (!user) {
        // সাইন ইন করা না থাকলে সরাসরি লগইন পেজে পাঠাবে, কখনোই "GU" দেখাবে না
        window.location.href = 'login.html';
        return;
      }

      currentUser = user;

      // Supabase-এর profiles টেবিল থেকে ইউজারের সেভ করা আসল নাম ও প্রোফাইল ছবি আনা
      let { data: profile } = await sb
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .maybeSingle();

      // যদি profiles রো না থাকে তবে auth metadata থেকে তৈরি করে সেভ করবে
      if (!profile) {
        const savedName = user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0];
        const savedAvatar = user.user_metadata?.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(savedName)}&background=0b5e2b&color=fff`;

        const { data: inserted } = await sb
          .from('profiles')
          .upsert({
            id: user.id,
            full_name: savedName,
            avatar_url: savedAvatar,
            created_at: user.created_at
          })
          .select()
          .single();

        profile = inserted || {
          id: user.id,
          full_name: savedName,
          avatar_url: savedAvatar,
          created_at: user.created_at
        };
      }

      currentUserProfile = profile;

      const realName = currentUserProfile.full_name;
      const realAvatar = currentUserProfile.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(realName)}&background=0b5e2b&color=fff`;

      document.getElementById('headerProfileImg').src = realAvatar;
      document.getElementById('headerProfileImg').alt = realName;
      document.getElementById('rowProfileImg').src = realAvatar;
      document.getElementById('rowProfileImg').alt = realName;
      document.getElementById('createStoryUserImg').src = realAvatar;
      document.getElementById('bottomNavProfileImg').src = realAvatar;
      document.getElementById('composerUserAvatar').src = realAvatar;
      document.getElementById('composerUserName').textContent = realName;

      updateLiveLockBadge();
    }

    function getAccountAgeDays() {
      const createdDate = new Date(currentUserProfile?.created_at || currentUser?.created_at || Date.now());
      return Math.floor((Date.now() - createdDate.getTime()) / (1000 * 60 * 60 * 24));
    }

    function updateLiveLockBadge() {
      const days = getAccountAgeDays();
      const badge = document.getElementById('liveLockBadge');
      if (days >= 60) {
        badge.innerHTML = `<i class="fas fa-circle" style="color:#ef4444;font-size:8px;"></i> LIVE`;
      } else {
        const left = 60 - days;
        badge.innerHTML = `<i class="fas fa-lock"></i> ${left}d left`;
      }
    }

    // =========================================================================
    // 3. TOP BAR (+) MENU & UNIFIED COMPOSER (POST, REELS, STORY, LIVE)
    // =========================================================================
    function toggleCreateMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('createMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    function closeCreateMenu() {
      document.getElementById('createMenu').style.display = 'none';
    }

    document.addEventListener('click', () => closeCreateMenu());

    function openMediaComposer(mode, autoOpenGallery = false) {
      if (!currentUser || !currentUserProfile) return;
      composerMode = mode;
      composerSelectedFile = null;
      document.getElementById('composerCaption').value = '';
      clearComposerMedia();

      const titles = { post: 'Create Post', reel: 'Create Reel', story: 'Create Story' };
      document.getElementById('composerTitle').textContent = titles[mode] || 'Create Post';
      document.getElementById('composerUserName').textContent = currentUserProfile.full_name;
      document.getElementById('composerModal').classList.add('open');

      if (autoOpenGallery) {
        setTimeout(() => document.getElementById('composerGalleryInput').click(), 150);
      }
    }

    function handleComposerFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      composerSelectedFile = file;

      const url = URL.createObjectURL(file);
      const box = document.getElementById('composerMediaPreviewBox');
      const img = document.getElementById('composerImgPreview');
      const vid = document.getElementById('composerVidPreview');

      box.style.display = 'block';
      if (file.type.startsWith('video/')) {
        img.style.display = 'none';
        vid.style.display = 'block';
        vid.src = url;
      } else {
        vid.style.display = 'none';
        img.style.display = 'block';
        img.src = url;
      }
    }

    function clearComposerMedia() {
      composerSelectedFile = null;
      document.getElementById('composerMediaPreviewBox').style.display = 'none';
      document.getElementById('composerImgPreview').src = '';
      document.getElementById('composerVidPreview').src = '';
      document.getElementById('composerGalleryInput').value = '';
    }

    // গ্যালারি থেকে সিলেক্ট করে Next বাটনে ক্লিক করলে ইউজারের নিজের নামে Supabase-এ সেভ হবে
    async function submitSupabaseContent() {
      if (!currentUser || !currentUserProfile) return;
      const caption = document.getElementById('composerCaption').value.trim();

      if (!caption && !composerSelectedFile) {
        return showToast('Select a photo/video from gallery or write something.');
      }

      const nextBtn = document.getElementById('composerNextBtn');
      nextBtn.disabled = true;
      nextBtn.textContent = 'Saving...';

      try {
        let mediaUrl = null;
        let mediaType = 'image';

        if (composerSelectedFile) {
          mediaType = composerSelectedFile.type.startsWith('video/') ? 'video' : 'image';
          const ext = composerSelectedFile.name.split('.').pop();
          const path = `${composerMode}s/${currentUser.id}_${Date.now()}.${ext}`;
          const { error: upErr } = await sb.storage.from('media').upload(path, composerSelectedFile);
          if (upErr) throw upErr;

          const { data: pubData } = sb.storage.from('media').getPublicUrl(path);
          mediaUrl = pubData.publicUrl;
        }

        const authorName = currentUserProfile.full_name;
        const authorAvatar = currentUserProfile.avatar_url;

        if (composerMode === 'story') {
          const { error } = await sb.from('stories').insert({
            user_id: currentUser.id,
            author_name: authorName,
            author_avatar: authorAvatar,
            media_url: mediaUrl,
            media_type: mediaType,
            caption: caption
          });
          if (error) throw error;
          showToast('Story saved & published!');
          await loadStories();
        } else if (composerMode === 'reel') {
          const { error } = await sb.from('reels').insert({
            user_id: currentUser.id,
            author_name: authorName,
            author_avatar: authorAvatar,
            video_url: mediaUrl,
            caption: caption
          });
          if (error) throw error;
          showToast('Reel saved & published!');
        } else {
          const { error } = await sb.from('posts').insert({
            user_id: currentUser.id,
            author_name: authorName,
            author_avatar: authorAvatar,
            content: caption,
            media_url: mediaUrl,
            media_type: mediaType
          });
          if (error) throw error;
          showToast('Post saved & published!');
          await loadPostsFeed();
        }

        closeModal('composerModal');
      } catch (err) {
        showToast('Error saving: ' + err.message);
      } finally {
        nextBtn.disabled = false;
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
      }
    }

    async function startLiveKitBroadcast() {
      const title = document.getElementById('liveStreamTitle')?.value.trim() || 'Live on Autrobook';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('liveLocalPreview').srcObject = stream;

        const tokenRes = await fetch('/api/livekit-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            roomName: `live_${currentUser.id}`,
            participantName: currentUserProfile.full_name
          })
        });
        const { token } = await tokenRes.json();

        const room = new LivekitClient.Room();
        await room.connect(LIVEKIT_URL, token);
        await room.localParticipant.enableCameraAndMicrophone();

        await sb.from('posts').insert({
          user_id: currentUser.id,
          author_name: currentUserProfile.full_name,
          author_avatar: currentUserProfile.avatar_url,
          content: `🔴 LIVE NOW: ${title}`,
          is_live: true
        });

        showToast('You are now LIVE!');
        loadPostsFeed();
      } catch (err) {
        showToast('Live stream initialized on ' + LIVEKIT_URL);

    }

    function toggleReactionPicker(postId) {
      document.querySelectorAll('.reaction-picker-popup').forEach(p => {
        if (p.id !== `picker-${postId}`) p.classList.remove('show');
      });
      const picker = document.getElementById(`picker-${postId}`);
      if (picker) picker.classList.toggle('show');
    }

    function handleLikeButtonClick(postId) {
      const btn = document.getElementById(`like-btn-${postId}`);
      const existingEmoji = btn.dataset.currentEmoji;
      if (existingEmoji) {
        togglePostReaction(postId, existingEmoji);
      } else {
        togglePostReaction(postId, '👍');
      }
    }

    async function togglePostReaction(postId, emoji) {
      if (!currentUser) return;

      const picker = document.getElementById(`picker-${postId}`);
      if (picker) picker.classList.remove('show');

      const btn = document.getElementById(`like-btn-${postId}`);
      const countEl = document.getElementById(`react-count-${postId}`);
      const prevEmoji = btn.dataset.currentEmoji;
      let rawCount = parseInt(btn.dataset.rawCount || '0', 10);

      if (prevEmoji === emoji) {
        rawCount = Math.max(0, rawCount - 1);
        btn.dataset.currentEmoji = '';
        btn.dataset.rawCount = rawCount;
        btn.classList.remove('reacted');
        btn.innerHTML = `<i class="far fa-thumbs-up"></i><span>Like</span>`;
        countEl.textContent = formatCompactCount(rawCount);

        await sb.from('post_reactions')
          .delete()
          .eq('post_id', postId)
          .eq('user_id', currentUser.id);
      } else {
        if (!prevEmoji) {
          rawCount += 1;
        }
        btn.dataset.currentEmoji = emoji;
        btn.dataset.rawCount = rawCount;
        btn.classList.add('reacted');
        btn.innerHTML = `<span style="font-size:17px;">${emoji}</span><span>Reacted</span>`;
        countEl.textContent = formatCompactCount(rawCount);

        await sb.from('post_reactions').upsert({
          post_id: postId,
          user_id: currentUser.id,
          reaction_type: emoji
        }, { onConflict: 'post_id,user_id' });
      }
    }

    async function toggleVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopVoiceRecordingIfActive();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        recordingSeconds = 0;
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          if (recordingSeconds < 10) {
            recordedVoiceBlob = null;
            showToast('Voice comment must be at least 10 seconds (10–30s limit).');
            return;
          }
          recordedVoiceBlob = new Blob(audioChunks, { type: 'audio/webm' });
          document.getElementById('commentAttachmentPreview').style.display = 'flex';
          document.getElementById('commentAttachmentLabel').textContent = `🎤 Voice note (${recordingSeconds}s)`;
        };

        mediaRecorder.start();
        const btn = document.getElementById('voiceRecordBtn');
        const timerLbl = document.getElementById('voiceTimerLabel');
        btn.classList.add('recording');
        timerLbl.textContent = '0s / 30s';

        recordingInterval = setInterval(() => {
          recordingSeconds += 1;
          timerLbl.textContent = `${recordingSeconds}s / 30s`;
          if (recordingSeconds >= 30) {
            stopVoiceRecordingIfActive();
            showToast('Maximum 30 seconds reached.');
          }
        }, 1000);
      } catch (err) {
        showToast('Microphone permission required for voice comments.');
      }
    }

    function stopVoiceRecordingIfActive() {
      clearInterval(recordingInterval);
      document.getElementById('voiceRecordBtn').classList.remove('recording');
      document.getElementById('voiceTimerLabel').textContent = '';
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

    function clearCommentAttachment() {
      selectedCommentImageFile = null;
      recordedVoiceBlob = null;
      document.getElementById('commentGalleryInput').value = '';
      document.getElementById('commentAttachmentPreview').style.display = 'none';
    }

    async function sendCommentToSupabase() {
      if (!currentUser) return;
      const input = document.getElementById('commentSheetInput');
      const text = input.value.trim();

      if (!text && !selectedCommentImageFile && !recordedVoiceBlob) {
        return showToast('Write a comment, pick a photo, or record a 10–30s voice note.');
      }

      const sendBtn = document.getElementById('sendCommentBtn');
      sendBtn.disabled = true;

      try {
        let imageUrl = null;
        let voiceUrl = null;

        if (selectedCommentImageFile) {
          const path = `comments/img_${currentUser.id}_${Date.now()}.jpg`;
          const { error } = await sb.storage.from('media').upload(path, selectedCommentImageFile);
          if (!error) {
            imageUrl = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
          }
        }

        if (recordedVoiceBlob) {
          const path = `comments/voice_${currentUser.id}_${Date.now()}.webm`;
          const { error } = await sb.storage.from('media').upload(path, recordedVoiceBlob);
          if (!error) {
            voiceUrl = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
          }
        }

        const { error: insertErr } = await sb.from('post_comments').insert({
          post_id: activePostId,
          user_id: currentUser.id,
          comment_text: text,
          image_url: imageUrl,
          voice_url: voiceUrl
        });

        if (insertErr) throw insertErr;

        input.value = '';
        clearCommentAttachment();
        await loadPostComments(activePostId);
        showToast('Comment sent & saved!');
      } catch (err) {
        showToast('Failed to send comment: ' + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    // =========================================================================
    // 9. HELPERS & INITIALIZATION
    // =========================================================================
    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function timeAgo(dateStr) {
      const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
      return `${Math.floor(diff / 86400)}d`;
    }

    async function followAuthor(authorId, btn) {
      if (!currentUser) return;
      await sb.from('follows').upsert({ follower_id: currentUser.id, following_id: authorId });
      btn.textContent = 'Following';
    }

    async function sharePost(postId) {
      const url = `${window.location.origin}/index.html#post-${postId}`;
      navigator.clipboard.writeText(url);
      showToast('Post link copied to share!');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initUserSession();
      if (currentUser) {
        await Promise.all([loadStories(), loadPostsFeed()]);
      }
    });
  </script>
</body>
