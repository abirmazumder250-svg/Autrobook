<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Autrobook - Newsfeed</title>
<style>
  :root {
    --bg-page: #f0f2f5;
    --card-bg: #ffffff;
    --text-primary: #050505;
    --text-secondary: #65676b;
    --border-color: #dddfe2;
    --input-bg: #f0f2f5;
    --brand-green: #14532d;
    --brand-green-hover: #166534;
    --icon-bg: #e4e6eb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #18191a;
      --card-bg: #242526;
      --text-primary: #e4e6eb;
      --text-secondary: #b0b3b8;
      --border-color: #393a3b;
      --input-bg: #3a3b3c;
      --brand-green: #15803d;
      --brand-green-hover: #16a34a;
      --icon-bg: #3a3b3c;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-primary);
    padding-bottom: 65px;
  }

  /* Top Header (Facebook Style) */
  .top-header {
    background-color: var(--card-bg);
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid var(--border-color);
  }

  .brand-logo {
    color: var(--brand-green);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .header-icons {
    display: flex;
    gap: 8px;
  }

  .circle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background-color: var(--icon-bg);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    border: none;
  }

  /* Stories Section */
  .stories-bar {
    background-color: var(--card-bg);
    padding: 12px 10px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border-color);
    scrollbar-width: none;
  }
  .stories-bar::-webkit-scrollbar { display: none; }

  .story-card {
    min-width: 105px;
    height: 180px;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background-color: var(--input-bg);
    border: 1px solid var(--border-color);
    cursor: pointer;
  }

  .story-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .create-story-top {
    height: 65%;
    width: 100%;
    object-fit: cover;
  }

  .add-story-plus {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background-color: var(--brand-green);
    color: #fff;
    border: 3px solid var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translateX(-50%);
  }

  .story-name {
    position: absolute;
    bottom: 8px;
    left: 6px;
    right: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    text-align: center;
  }
  .story-card.create .story-name {
    color: var(--text-primary);
    text-shadow: none;
  }

  /* Create Post Section */
  .create-post-section {
    background-color: var(--card-bg);
    padding: 12px 15px;
    margin-top: 8px;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
  }

  .post-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--brand-green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  .post-input {
    flex: 1;
    background-color: var(--input-bg);
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
  }

  .post-submit-btn {
    background-color: var(--brand-green);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  /* Feed Post Card */
  .feed-card {
    background-color: var(--card-bg);
    margin-top: 8px;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
  }

  .feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
  }

  .author-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .author-details h4 {
    font-size: 15px;
    font-weight: 700;
  }

  .author-details span {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .feed-content {
    padding: 0 15px 12px 15px;
    font-size: 15px;
    line-height: 1.4;
  }

  .feed-image {
    width: 100%;
    max-height: 380px;
    object-fit: cover;
    display: block;
  }

  .feed-stats {
    display: flex;
    justify-content: space-between;
    padding: 10px 15px;
    font-size: 13px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
  }

  .feed-actions {
    display: flex;
    justify-content: space-around;
    padding: 4px 0;
  }

  .action-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-secondary);
    padding: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .action-btn.liked {
    color: var(--brand-green);
  }

  /* Bottom Navigation Bar */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 55px;
    background-color: var(--card-bg);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 1000;
  }

  .nav-tab {
    font-size: 22px;
    color: var(--text-secondary);
    cursor: pointer;
    position: relative;
    padding: 8px 14px;
  }

  .nav-tab.active {
    color: var(--brand-green);
    border-top: 3px solid var(--brand-green);
  }

  .badge {
    position: absolute;
    top: 4px;
    right: 6px;
    background: #e41e3f;
    color: white;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="top-header">
    <div class="brand-logo">autrobook</div>
    <div class="header-icons">
      <button class="circle-btn" onclick="focusPostInput()" title="Create Post">➕</button>
      <button class="circle-btn" title="Search">🔍</button>
      <button class="circle-btn" onclick="logout()" title="Logout">🚪</button>
    </div>
  </div>

  <!-- Stories Bar -->
  <div class="stories-bar">
    <div class="story-card create" onclick="focusPostInput()">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" class="create-story-top" alt="You">
      <div class="add-story-plus">+</div>
      <div class="story-name">Create story</div>
    </div>
    <div class="story-card">
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300" alt="Story">
      <div class="story-name">Mihad Sarkar</div>
    </div>
    <div class="story-card">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Story">
      <div class="story-name">Ri Ya</div>
    </div>
    <div class="story-card">
      <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300" alt="Story">
      <div class="story-name">A T</div>
    </div>
  </div>

  <!-- Create Post Box -->
  <div class="create-post-section">
    <div class="post-row">
      <div class="avatar" id="userInitial">A</div>
      <input type="text" id="newPostText" class="post-input" placeholder="What's on your mind, Abir?">
      <button class="post-submit-btn" onclick="publishPost()">Post</button>
    </div>
  </div>

  <!-- Dynamic Feed Container -->
  <div id="feedStream">
    <!-- Default Sample Post -->
    <div class="feed-card">
      <div class="feed-header">
        <div class="author-info">
          <div class="avatar">A</div>
          <div class="author-details">
            <h4 id="defaultAuthor">Abir Mazumder</h4>
            <span>Just now • 🌍</span>
          </div>
        </div>
        <span style="color: var(--text-secondary); cursor: pointer;">•••</span>
      </div>
      <div class="feed-content">
        Welcome to Autrobook newsfeed! 🚀 Your secure community platform is fully up and running.
      </div>
      <img src="https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?w=600" class="feed-image" alt="Post">
      <div class="feed-stats">
        <span>👍 ❤️ <span class="like-count">2.2K</span></span>
        <span>123 comments • 19 shares</span>
      </div>
      <div class="feed-actions">
        <button class="action-btn" onclick="toggleLike(this)">👍 Like</button>
        <button class="action-btn">💬 Comment</button>
        <button class="action-btn">↗️ Share</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">
    <div class="nav-tab active">🏠</div>
    <div class="nav-tab">📺<span class="badge">3</span></div>
    <div class="nav-tab">👥</div>
    <div class="nav-tab">🔔</div>
    <div class="nav-tab" onclick="logout()">☰</div>
  </div>

  <script>
    // Authentication Check
    if (!localStorage.getItem('autrobook_user') && localStorage.getItem('ab_logged_in') !== '1') {
      window.location.replace('../index.html');
    }

    // Load User Info
    const storedUser = JSON.parse(localStorage.getItem('autrobook_user') || '{}');
    const userName = storedUser.name || (storedUser.email ? storedUser.email.split('@')[0] : 'Abir Mazumder');
    document.getElementById('newPostText').placeholder = `What's on your mind, ${userName.split(' ')[0]}?`;
    document.getElementById('userInitial').innerText = userName.charAt(0).toUpperCase();

    function focusPostInput() {
      document.getElementById('newPostText').focus();
    }

    // Create a New Post Dynamically
    function publishPost() {
      const input = document.getElementById('newPostText');
      const text = input.value.trim();
      if (!text) return;

      const feedStream = document.getElementById('feedStream');
      const newCard = document.createElement('div');
      newCard.className = 'feed-card';
      newCard.innerHTML = `
        <div class="feed-header">
          <div class="author-info">
            <div class="avatar">${userName.charAt(0).toUpperCase()}</div>
            <div class="author-details">
              <h4>${userName}</h4>
              <span>Just now • 🌍</span>
            </div>
          </div>
          <span style="color: var(--text-secondary); cursor: pointer;">•••</span>
        </div>
        <div class="feed-content">${text}</div>
        <div class="feed-stats">
          <span>👍 <span class="like-count">0</span></span>
          <span>0 comments • 0 shares</span>
        </div>
        <div class="feed-actions">
          <button class="action-btn" onclick="toggleLike(this)">👍 Like</button>
          <button class="action-btn">💬 Comment</button>
          <button class="action-btn">↗️ Share</button>
        </div>
      `;

      feedStream.prepend(newCard);
      input.value = '';
    }

    // Interactive Like Button
    function toggleLike(btn) {
      btn.classList.toggle('liked');
      const card = btn.closest('.feed-card');
      const countEl = card.querySelector('.like-count');
      if (btn.classList.contains('liked')) {
        btn.innerHTML = '👍 Liked';
        if (!isNaN(countEl.innerText)) countEl.innerText = parseInt(countEl.innerText) + 1;
      } else {
        btn.innerHTML = '👍 Like';
        if (!isNaN(countEl.innerText)) countEl.innerText = Math.max(0, parseInt(countEl.innerText) - 1);
      }
    }

    function logout() {
      localStorage.removeItem('autrobook_user');
      localStorage.removeItem('ab_logged_in');
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
