<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Games Hub — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Games CSS Link -->
  <link rel="stylesheet" href="css/games.css">
</head>
<body>

  <!-- TOP NAV -->
  <header class="top-nav">
    <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
    <h2>Games Hub</h2>
    <div class="nav-actions">
      <button class="icon-btn"><i class="fas fa-trophy"></i></button>
    </div>
  </header>

  <div class="games-container">
    
    <!-- SEARCH BAR -->
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="gameSearchInput" placeholder="Search games..." oninput="filterGames()">
    </div>

    <!-- CATEGORIES -->
    <div class="tabs" id="gameTabs">
      <button class="tab-btn active" onclick="filterCategory('all', this)">All Games</button>
      <button class="tab-btn" onclick="filterCategory('action', this)">Action</button>
      <button class="tab-btn" onclick="filterCategory('sports', this)">Sports</button>
      <button class="tab-btn" onclick="filterCategory('arcade', this)">Arcade</button>
      <button class="tab-btn" onclick="filterCategory('puzzle', this)">Puzzle</button>
    </div>

    <!-- GAMES GRID -->
    <div class="game-grid" id="gamesGrid">
      <!-- Populated via JS -->
    </div>

  </div>

  <!-- FOOTER DYNAMIC YEAR -->
  <div class="footer-text">
    Live • @ <span id="dynamicYear"></span> Autrobook Version 1
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bn-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i></div>
    <div class="bn-item" onclick="window.location.href='friends.html'"><i class="fas fa-user-friends"></i></div>
    <div class="bn-item" onclick="window.location.href='groups.html'"><i class="fas fa-users"></i></div>
    <div class="bn-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i></div>
    <div class="bn-item active"><i class="fas fa-gamepad"></i></div>
  </nav>

  <!-- ==================== FULL SCREEN GAME PLAYER ==================== -->
  <div class="game-player-overlay" id="gamePlayerOverlay">
    <div class="game-player-header">
      <h2 id="gamePlayerTitle">Playing</h2>
      <button class="close-game-btn" onclick="closeGame()"><i class="fas fa-times"></i></button>
    </div>
    <!-- The actual game loads inside this iframe -->
    <iframe id="gameIframe" class="game-iframe" src="" allowfullscreen></iframe>
  </div>

  <!-- Main JS Link -->
  <script src="js/games.js"></script>
</body>
</html>
