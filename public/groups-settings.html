<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groups settings</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root {
      --bg-color: #FFFFFF;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --border-color: #e8eaed;
      --hover-bg: rgba(32, 33, 36, 0.06);
      --active-bg: rgba(32, 33, 36, 0.12);
      --icon-color: #202124;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #202124;
        --text-primary: #e8eaed;
        --text-secondary: #9aa0a6;
        --border-color: #3c4043;
        --hover-bg: rgba(255, 255, 255, 0.06);
        --active-bg: rgba(255, 255, 255, 0.12);
        --icon-color: #e8eaed;
      }
    }

    body.light-theme {
      --bg-color: #FFFFFF;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --border-color: #e8eaed;
      --hover-bg: rgba(32, 33, 36, 0.06);
      --active-bg: rgba(32, 33, 36, 0.12);
      --icon-color: #202124;
    }

    body.dark-theme {
      --bg-color: #202124;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --border-color: #3c4043;
      --hover-bg: rgba(255, 255, 255, 0.06);
      --active-bg: rgba(255, 255, 255, 0.12);
      --icon-color: #e8eaed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-color);
    }

    /* Top Header */
    .top-header {
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 12px;
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      color: var(--icon-color);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
      margin-right: 16px;
    }

    .back-btn:hover {
      background-color: var(--hover-bg);
    }

    .back-btn:active {
      background-color: var(--active-bg);
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .header-title {
      font-size: 20px;
      font-weight: 500;
      line-height: 24px;
      letter-spacing: 0.15px;
      color: var(--text-primary);
    }

    /* Settings List */
    .settings-list {
      padding-top: 8px;
      display: flex;
      flex-direction: column;
    }

    .setting-item {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 22px;
      padding: 18px 20px;
      cursor: pointer;
      color: inherit;
      transition: background-color 0.15s ease;
    }

    .setting-item:hover {
      background-color: var(--hover-bg);
    }

    .setting-item:active {
      background-color: var(--active-bg);
    }

    .setting-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--icon-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .setting-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .setting-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .setting-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 22px;
      color: var(--text-primary);
    }

    .setting-subtitle {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="top-header">
      <button
        type="button"
        class="back-btn"
        id="backToGroupsBtn"
        aria-label="Back to groups"
        onclick="goToGroups()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
        </svg>
      </button>
      <h1 class="header-title">Groups settings</h1>
    </header>

    <!-- Options -->
    <main class="settings-list" role="menu">
      <!-- Notifications -->
      <button
        type="button"
        class="setting-item"
        role="menuitem"
        onclick="openSettingPage('groups-notifications.html')"
      >
        <span class="setting-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z" />
          </svg>
        </span>
        <span class="setting-content">
          <span class="setting-title">Notifications</span>
          <span class="setting-subtitle">Edit preferences for receiving notifications.</span>
        </span>
      </button>

      <!-- Pinned groups -->
      <button
        type="button"
        class="setting-item"
        role="menuitem"
        onclick="openSettingPage('pinned-groups.html')"
      >
        <span class="setting-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2zm-8 2l1.2-1.2.8-.8V4h4v8l.8.8L16 14H8z" />
          </svg>
        </span>
        <span class="setting-content">
          <span class="setting-title">Pinned groups</span>
          <span class="setting-subtitle">Pin your favorite groups for quick access.</span>
        </span>
      </button>

      <!-- Following -->
      <button
        type="button"
        class="setting-item"
        role="menuitem"
        onclick="openSettingPage('following.html')"
      >
        <span class="setting-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2zm6 13H4V8h16v11zm-7-7h2v2h-2v2h-2v-2H9v-2h2v-2h2v2z" />
          </svg>
        </span>
        <span class="setting-content">
          <span class="setting-title">Following</span>
          <span class="setting-subtitle">Follow or unfollow groups to control what you see in Feed.</span>
        </span>
      </button>

      <!-- New Option 1: Hidden groups -->
      <button
        type="button"
        class="setting-item"
        role="menuitem"
        onclick="openSettingPage('hidden-groups.html')"
      >
        <span class="setting-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 6.5c2.76 0 5 2.24 5 5 0 .64-.13 1.25-.35 1.8l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.72-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 6.63 11.36 6.5 12 6.5zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" />
          </svg>
        </span>
        <span class="setting-content">
          <span class="setting-title">Hidden groups</span>
          <span class="setting-subtitle">Manage groups you've hidden from your recommendations and feed.</span>
        </span>
      </button>

      <!-- New Option 2: Group invites -->
      <button
        type="button"
        class="setting-item"
        role="menuitem"
        onclick="openSettingPage('group-invites.html')"
      >
        <span class="setting-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
          </svg>
        </span>
        <span class="setting-content">
          <span class="setting-title">Group invites</span>
          <span class="setting-subtitle">View pending invitations or choose who can invite you to groups.</span>
        </span>
      </button>
    </main>
  </div>

  <script>
    // Apply saved theme if present in localStorage (compatible with #FFFFFF and #202124)
    (function applyStoredTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === '#FFFFFF') {
        document.body.classList.add('light-theme');
      } else if (savedTheme === 'dark' || savedTheme === '#202124') {
        document.body.classList.add('dark-theme');
      }
    })();

    // Navigate back to groups.html via `<` button
    function goToGroups() {
      window.location.href = 'groups.html';
    }

    // Navigate to selected setting page
    function openSettingPage(targetUrl) {
      window.location.href = targetUrl;
    }
  </script>
</body>
        </html>
