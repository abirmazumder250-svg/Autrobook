<!DOCTYPE html>
<html lang="en" data-page="tag-someone.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tag someone</title>
  <link rel="canonical" href="/tag-someone.html" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-hover: #2c2e33;
      --bg-selected: rgba(11, 93, 52, 0.18);
      --text-primary: #ffffff;
      --text-secondary: #9aa0a6;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
      --accent-green-light: #22c55e;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-hover: #f3f4f6;
        --bg-selected: rgba(11, 93, 52, 0.1);
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
        --accent-green-light: #0b5d34;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--bg-surface);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .back-btn:hover {
      background: var(--bg-hover);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .topbar-title {
      font-size: 19px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .done-btn {
      background: transparent;
      border: none;
      color: var(--accent-green-light);
      font-size: 14px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: background 0.15s ease;
    }

    .done-btn.visible {
      display: inline-flex;
      align-items: center;
    }

    .done-btn:hover {
      background: var(--bg-hover);
    }

    /* SEARCH ROW */
    .search-wrap {
      position: sticky;
      top: 56px;
      z-index: 35;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px 10px;
    }

    .search-row {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .search-icon {
      color: var(--text-secondary);
      font-size: 17px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 400;
      outline: none;
      min-width: 0;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .clear-search-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 15px;
      padding: 4px;
      cursor: pointer;
      display: none;
    }

    .clear-search-btn.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* FRIENDS LIST */
    .list-container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 6px 0 32px;
      flex: 1;
    }

    .friend-item {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.14s ease;
    }

    .friend-item:hover {
      background: var(--bg-hover);
    }

    .friend-item.selected {
      background: var(--bg-selected);
    }

    .friend-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .friend-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent-green);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }

    .friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .friend-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .friend-name {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .friend-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: transparent;
      flex-shrink: 0;
      transition: all 0.14s ease;
    }

    .friend-item.selected .friend-check {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #ffffff;
    }

    .status-box {
      padding: 44px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
    }

    .status-box.not-found {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" class="back-btn" onclick="goBack()" aria-label="Back" title="Back">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1 class="topbar-title">Tag someone</h1>
    </div>

    <button type="button" id="doneBtn" class="done-btn" onclick="confirmSelectionAndReturn()">
      DONE
    </button>
  </header>

  <div class="search-wrap">
    <div class="search-row">
      <i class="fas fa-magnifying-glass search-icon" aria-hidden="true"></i>
      <input
        type="text"
        id="tagSearchInput"
        class="search-input"
        placeholder="Tag someone"
        autocomplete="off"
        oninput="handleSearchInput()"
      />
      <button
        type="button"
        id="clearSearchBtn"
        class="clear-search-btn"
        aria-label="Clear search"
        onclick="clearSearch()"
      >
        <i class="fas fa-xmark"></i>
      </button>
    </div>
  </div>

  <main id="friendsListContainer" class="list-container">
    <div class="status-box">
      <div class="spinner" aria-hidden="true"></div>
      <div>Loading friends...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    const sb = window.supabase && typeof window.supabase.createClient === 'function'
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    const TAGGED_PARTNER_KEYS = [
      'autro_tagged_partner',
      'autro_selected_partner',
      'autro_tagged_people'
    ];

    let allFriends = [];
    let selectedFriend = null;

    function getReturnUrl() {
      const params = new URLSearchParams(window.location.search);
      const from = (params.get('from') || '').trim();
      const map = {
        'new-relationship': '/new-relationship.html',
        'relationship': '/new-relationship.html',
        'create-post': '/create-post.html'
      };
      return map[from] || '/new-relationship.html';
    }

    function goBack() {
      window.location.href = getReturnUrl();
    }

    function safeWriteStore(key, val) {
      const str = String(val || '');
      try { sessionStorage.setItem(key, str); } catch (_) {}
      try { localStorage.setItem(key, str); } catch (_) {}
      try {
        let state = {};
        if (window.name && window.name.startsWith('AUTRO_STATE:')) {
          state = JSON.parse(window.name.slice('AUTRO_STATE:'.length)) || {};
        }
        if (str) state[key] = str;
        else delete state[key];
        const nextName = 'AUTRO_STATE:' + JSON.stringify(state);
        if (nextName.length < 1800000) window.name = nextName;
      } catch (_) {}
    }

    function getInitials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      return parts.slice(0, 2).map(p => p[0].toUpperCase()).join('');
    }

    function normalizePerson(raw, index = 0) {
      if (!raw || typeof raw !== 'object') return null;
      const name = String(
        raw.full_name ||
        raw.display_name ||
        raw.name ||
        raw.username ||
        raw.friend_name ||
        ''
      ).trim();

      if (!name) return null;

      return {
        id: String(raw.id || raw.user_id || raw.friend_id || `friend_${index}`),
        name,
        username: String(raw.username || raw.handle || '').trim(),
        avatarUrl: String(raw.avatar_url || raw.photo_url || raw.avatar || '').trim()
      };
    }

    async function fetchFriendsFromSupabase() {
      if (!sb) return [];

      let userId = '';
      try {
        const { data: { session } } = await sb.auth.getSession();
        userId = session?.user?.id || '';
      } catch (_) {}

      // 1) Try `friends` table for current user
      if (userId) {
        try {
          const { data, error } = await sb
            .from('friends')
            .select('*')
            .or(`user_id.eq.${userId},friend_id.eq.${userId}`);
          if (!error && Array.isArray(data) && data.length) {
            const ids = new Set();
            const directPeople = [];

            for (const row of data) {
              const otherId = row.friend_id && row.friend_id !== userId
                ? row.friend_id
                : (row.user_id && row.user_id !== userId ? row.user_id : '');
              if (otherId) ids.add(otherId);
              const p = normalizePerson(row);
              if (p && p.id !== userId) directPeople.push(p);
            }

            if (ids.size) {
              const { data: profilesData } = await sb
                .from('profiles')
                .select('*')
                .in('id', Array.from(ids));
              if (Array.isArray(profilesData) && profilesData.length) {
                return profilesData.map(normalizePerson).filter(Boolean);
              }
            }

            if (directPeople.length) return directPeople;
          }
        } catch (_) {}
      }

      // 2) Try `friendships` table with accepted status
      if (userId) {
        try {
          const { data, error } = await sb
            .from('friendships')
            .select('*')
            .or(`requester_id.eq.${userId},addressee_id.eq.${userId},user_id.eq.${userId},friend_id.eq.${userId}`);
          if (!error && Array.isArray(data) && data.length) {
            const ids = new Set();
            for (const row of data) {
              if (row.status && String(row.status).toLowerCase() !== 'accepted') continue;
              const candidates = [row.requester_id, row.addressee_id, row.user_id, row.friend_id].filter(Boolean);
              for (const cid of candidates) {
                if (cid !== userId) ids.add(cid);
              }
            }
            if (ids.size) {
              const { data: profilesData } = await sb
                .from('profiles')
                .select('*')
                .in('id', Array.from(ids));
              if (Array.isArray(profilesData) && profilesData.length) {
                return profilesData.map(normalizePerson).filter(Boolean);
              }
            }
          }
        } catch (_) {}
      }

      // 3) Fallback to `profiles` table (excluding current user if logged in)
      try {
        let query = sb.from('profiles').select('*').limit(100);
        if (userId) {
          query = query.neq('id', userId);
        }
        const { data, error } = await query;
        if (!error && Array.isArray(data)) {
          return data.map(normalizePerson).filter(Boolean);
        }
      } catch (_) {}

      return [];
    }

    function updateDoneButton() {
      const btn = document.getElementById('doneBtn');
      if (selectedFriend && selectedFriend.name) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }

    function selectFriend(friend, autoReturn = true) {
      selectedFriend = friend;
      updateDoneButton();

      const payload = JSON.stringify({
        id: friend.id,
        name: friend.name,
        username: friend.username,
        avatarUrl: friend.avatarUrl
      });

      for (const key of TAGGED_PARTNER_KEYS) {
        safeWriteStore(key, payload);
      }

      renderFriendsList();

      if (autoReturn) {
        const returnUrl = new URL(getReturnUrl(), window.location.origin);
        returnUrl.searchParams.set('partner', friend.name);
        window.location.href = returnUrl.pathname + returnUrl.search;
      }
    }

    function confirmSelectionAndReturn() {
      if (!selectedFriend) return;
      selectFriend(selectedFriend, true);
    }

    function renderFriendsList() {
      const container = document.getElementById('friendsListContainer');
      const query = document.getElementById('tagSearchInput').value.trim().toLowerCase();

      const filtered = query
        ? allFriends.filter(f =>
            f.name.toLowerCase().includes(query) ||
            (f.username && f.username.toLowerCase().includes(query))
          )
        : allFriends;

      if (!filtered.length) {
        container.innerHTML = `<div class="status-box not-found">Not found</div>`;
        return;
      }

      container.innerHTML = '';
      filtered.forEach((friend) => {
        const isSelected = selectedFriend && selectedFriend.id === friend.id;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `friend-item${isSelected ? ' selected' : ''}`;
        btn.onclick = () => selectFriend(friend, true);

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'friend-avatar';
        if (friend.avatarUrl) {
          const img = document.createElement('img');
          img.src = friend.avatarUrl;
          img.alt = friend.name;
          img.onerror = () => {
            avatarDiv.textContent = getInitials(friend.name);
          };
          avatarDiv.appendChild(img);
        } else {
          avatarDiv.textContent = getInitials(friend.name);
        }

        const leftDiv = document.createElement('div');
        leftDiv.className = 'friend-left';

        const metaDiv = document.createElement('div');
        metaDiv.className = 'friend-meta';

        const nameEl = document.createElement('span');
        nameEl.className = 'friend-name';
        nameEl.textContent = friend.name;
        metaDiv.appendChild(nameEl);

        if (friend.username) {
          const subEl = document.createElement('span');
          subEl.className = 'friend-sub';
          subEl.textContent = friend.username.startsWith('@') ? friend.username : `@${friend.username}`;
          metaDiv.appendChild(subEl);
        }

        leftDiv.appendChild(avatarDiv);
        leftDiv.appendChild(metaDiv);

        const checkEl = document.createElement('span');
        checkEl.className = 'friend-check';
        checkEl.innerHTML = '<i class="fas fa-check"></i>';

        btn.appendChild(leftDiv);
        btn.appendChild(checkEl);
        container.appendChild(btn);
      });
    }

    function handleSearchInput() {
      const input = document.getElementById('tagSearchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (input.value.length > 0) {
        clearBtn.classList.add('visible');
      } else {
        clearBtn.classList.remove('visible');
      }
      renderFriendsList();
    }

    function clearSearch() {
      const input = document.getElementById('tagSearchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.remove('visible');
      renderFriendsList();
      input.focus();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      allFriends = await fetchFriendsFromSupabase();
      renderFriendsList();
    });
  </script>
</body>
</html>
