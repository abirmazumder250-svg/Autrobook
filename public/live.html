<!DOCTYPE html>
<html lang="en" data-page="live.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Go Live - Requirements</title>
  <link rel="canonical" href="/live.html" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-secondary-btn: #303134;
      --bg-secondary-btn-hover: #3c4043;
      --text-primary: #ffffff;
      --text-secondary: #b0b3b8;
      --text-muted: #8a8f98;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-green: #0b5d34;
      --accent-green-hover: #0f7642;
      --accent-green-bright: #10b981;
      --lock-yellow: #facc15;
      --lock-yellow-dark: #ca8a04;
      --danger-red: #ef4444;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-secondary-btn: #eef0f3;
        --bg-secondary-btn-hover: #e2e5ea;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --text-muted: #80868b;
        --border-subtle: rgba(32, 33, 36, 0.08);
        --accent-green: #0b5d34;
        --accent-green-hover: #084727;
        --accent-green-bright: #0b5d34;
        --lock-yellow: #eab308;
        --lock-yellow-dark: #a16207;
        --danger-red: #dc2626;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .topbar {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 21px;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .back-btn:hover {
      background: var(--bg-secondary-btn);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .status-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.16);
      color: var(--lock-yellow-dark);
      border: 1px solid rgba(234, 179, 8, 0.35);
      letter-spacing: 0.3px;
    }

    @media (prefers-color-scheme: dark) {
      .status-pill {
        color: var(--lock-yellow);
      }
    }

    .status-pill.unlocked {
      background: rgba(16, 185, 129, 0.16);
      color: var(--accent-green-bright);
      border-color: rgba(16, 185, 129, 0.38);
    }

    /* CENTER CONTENT */
    .center-wrap {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* YELLOW LOCK ILLUSTRATION */
    .lock-illustration {
      position: relative;
      width: 112px;
      height: 112px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .doc-card {
      position: absolute;
      width: 34px;
      height: 46px;
      border-radius: 5px;
      background: #e2e8f0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16);
      bottom: 10px;
    }

    .doc-card.left {
      left: 14px;
      transform: rotate(-10deg);
      background: #cbd5e1;
    }

    .doc-card.right {
      right: 14px;
      transform: rotate(10deg);
      background: #f1f5f9;
    }

    .doc-card::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 7px;
      right: 7px;
      height: 3px;
      border-radius: 2px;
      background: #94a3b8;
      box-shadow: 0 7px 0 #94a3b8, 0 14px 0 #94a3b8;
    }

    .padlock-shackle {
      position: relative;
      width: 42px;
      height: 34px;
      border: 7px solid #94a3b8;
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      margin-bottom: -8px;
      z-index: 3;
      transition: transform 0.25s ease;
    }

    .lock-illustration.unlocked .padlock-shackle {
      transform: translate(10px, -7px) rotate(16deg);
      border-color: var(--accent-green-bright);
    }

    .padlock-body {
      position: relative;
      z-index: 4;
      width: 62px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(155deg, #fde047 0%, #eab308 65%, #ca8a04 100%);
      box-shadow: 0 10px 20px rgba(202, 138, 4, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-illustration.unlocked .padlock-body {
      background: linear-gradient(155deg, #34d399 0%, #0b5d34 100%);
      box-shadow: 0 10px 20px rgba(11, 93, 52, 0.35);
    }

    .padlock-slash {
      width: 4px;
      height: 24px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.92);
      transform: rotate(28deg);
    }

    .lock-illustration.unlocked .padlock-slash {
      display: none;
    }

    .lock-check {
      display: none;
      color: #ffffff;
      font-size: 22px;
    }

    .lock-illustration.unlocked .lock-check {
      display: inline-block;
    }

    .hero-heading {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .hero-subtext {
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--text-secondary);
      max-width: 340px;
      margin-bottom: 24px;
    }

    /* REQUIREMENTS LIST */
    .req-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }

    .req-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .req-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .req-icon.unmet {
      background: var(--text-primary);
      color: var(--bg-page);
    }

    .req-icon.met {
      background: var(--accent-green);
      color: #ffffff;
    }

    .req-content {
      flex: 1;
      min-width: 0;
    }

    .req-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.38;
      color: var(--text-primary);
    }

    .req-meta {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* BOTTOM BUTTONS */
    .bottom-actions {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-learn-more {
      height: 44px;
      border-radius: 8px;
      background: var(--bg-secondary-btn);
      color: var(--text-primary);
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .btn-learn-more:hover {
      background: var(--bg-secondary-btn-hover);
    }

    .btn-learn-more:active {
      transform: scale(0.98);
    }

    .btn-ok {
      height: 44px;
      border: none;
      border-radius: 8px;
      background: var(--accent-green);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .btn-ok:hover {
      background: var(--accent-green-hover);
    }

    .btn-ok:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/create-post.html" class="back-btn" aria-label="Back to create post" title="Back">
      <i class="fas fa-chevron-left"></i>
    </a>
    <span id="lockStatusPill" class="status-pill">LOCKED</span>
  </header>

  <main class="center-wrap">
    <div id="lockIllustration" class="lock-illustration" aria-hidden="true">
      <div class="doc-card left"></div>
      <div class="doc-card right"></div>
      <div class="padlock-shackle"></div>
      <div class="padlock-body">
        <div class="padlock-slash"></div>
        <i class="fas fa-check lock-check"></i>
      </div>
    </div>

    <h1 id="heroTitle" class="hero-heading">You can't go live yet</h1>
    <p id="heroSubtitle" class="hero-subtext">
      To start a live video, you need to meet these requirements:
    </p>

    <div class="req-list">
      <div class="req-item">
        <div id="reqAgeIcon" class="req-icon unmet">!</div>
        <div class="req-content">
          <div class="req-title">Your account must be at least 60 days old</div>
          <div id="reqAgeMeta" class="req-meta">Checking account age...</div>
        </div>
      </div>

      <div class="req-item">
        <div id="reqSecondIcon" class="req-icon unmet">!</div>
        <div class="req-content">
          <div class="req-title">You must have at least 5 published posts</div>
          <div id="reqSecondMeta" class="req-meta">Checking published posts...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bottom-actions">
    <a href="/live-info.html" class="btn-learn-more">Learn more</a>
    <button type="button" id="okBtn" class="btn-ok" onclick="handleOkClick()">OK</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const CREATE_POST_URL = '/create-post.html';
    const LIVE_INFO_URL = '/live-info.html';

    const REQUIRED_DAYS = 60;
    const REQUIRED_POSTS = 5;

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    function computeAccountAgeDays(createdAtStr) {
      if (!createdAtStr) return 0;
      const createdMs = Date.parse(createdAtStr);
      if (Number.isNaN(createdMs)) return 0;
      const diffDays = Math.floor((Date.now() - createdMs) / (1000 * 60 * 60 * 24));
      return Math.max(0, diffDays);
    }

    function getFallbackCreatedDate() {
      try {
        const stored = localStorage.getItem('autro_account_created_at') || sessionStorage.getItem('autro_account_created_at');
        if (stored) return stored;
      } catch (_) {}
      return new Date().toISOString();
    }

    function getFallbackPostCount() {
      try {
        const rawPosts = localStorage.getItem('autro_posts') || localStorage.getItem('autro_user_posts');
        if (rawPosts) {
          const parsed = JSON.parse(rawPosts);
          if (Array.isArray(parsed)) return parsed.length;
        }
        const num = Number(localStorage.getItem('autro_posts_count') || 0);
        if (!Number.isNaN(num) && num >= 0) return num;
      } catch (_) {}
      return 0;
    }

    async function fetchRealUserStats() {
      let createdAt = getFallbackCreatedDate();
      let postCount = getFallbackPostCount();

      if (!sb) {
        return { accountAgeDays: computeAccountAgeDays(createdAt), postCount };
      }

      try {
        const { data: { session } } = await sb.auth.getSession();
        const user = session?.user;

        if (user) {
          if (user.created_at) {
            createdAt = user.created_at;
          }

          try {
            const { data: profile } = await sb
              .from('profiles')
              .select('created_at')
              .eq('id', user.id)
              .maybeSingle();
            if (profile?.created_at) {
              createdAt = profile.created_at;
            }
          } catch (_) {}

          try {
            const { count, error } = await sb
              .from('posts')
              .select('*', { count: 'exact', head: true })
              .eq('user_id', user.id);

            if (!error && typeof count === 'number') {
              postCount = count;
            }
          } catch (_) {}
        }
      } catch (_) {}

      return {
        accountAgeDays: computeAccountAgeDays(createdAt),
        postCount: Math.max(0, Number(postCount) || 0)
      };
    }

    function renderRequirementsState({ accountAgeDays, postCount }) {
      const ageMet = accountAgeDays >= REQUIRED_DAYS;
      const secondMet = postCount >= REQUIRED_POSTS;
      const isUnlocked = ageMet && secondMet;

      const lockIll = document.getElementById('lockIllustration');
      const statusPill = document.getElementById('lockStatusPill');
      const heroTitle = document.getElementById('heroTitle');
      const heroSubtitle = document.getElementById('heroSubtitle');
      const okBtn = document.getElementById('okBtn');

      const ageIcon = document.getElementById('reqAgeIcon');
      const ageMeta = document.getElementById('reqAgeMeta');
      const secondIcon = document.getElementById('reqSecondIcon');
      const secondMeta = document.getElementById('reqSecondMeta');

      ageIcon.className = `req-icon ${ageMet ? 'met' : 'unmet'}`;
      ageIcon.innerHTML = ageMet ? '<i class="fas fa-check"></i>' : '!';
      ageMeta.textContent = `${accountAgeDays} / ${REQUIRED_DAYS} days`;

      secondIcon.className = `req-icon ${secondMet ? 'met' : 'unmet'}`;
      secondIcon.innerHTML = secondMet ? '<i class="fas fa-check"></i>' : '!';
      secondMeta.textContent = `${postCount} / ${REQUIRED_POSTS} posts`;

      if (isUnlocked) {
        lockIll.classList.add('unlocked');
        statusPill.classList.add('unlocked');
        statusPill.textContent = 'UNLOCKED';
        heroTitle.textContent = 'Live video unlocked';
        heroSubtitle.textContent = 'Your account meets all requirements to go live.';
        okBtn.textContent = 'Go Live';
      } else {
        lockIll.classList.remove('unlocked');
        statusPill.classList.remove('unlocked');
        statusPill.textContent = 'LOCKED';
        heroTitle.textContent = "You can't go live yet";
        heroSubtitle.textContent = 'To start a live video, you need to meet these requirements:';
        okBtn.textContent = 'OK';
      }
    }

    function handleOkClick() {
      window.location.href = CREATE_POST_URL;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const stats = await fetchRealUserStats();
      renderRequirementsState(stats);
    });
  </script>
</body>
</html>
