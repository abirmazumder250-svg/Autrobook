<!DOCTYPE html>
<html lang="en" data-page="live.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Video Requirements</title>
  <link rel="canonical" href="/live.html" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #2c2d31;
      --bg-card-hover: #35373c;
      --text-primary: #ffffff;
      --text-secondary: #b0b3b8;
      --text-muted: #8a8f98;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
      --accent-green-hover: #0a7d3b;
      --accent-green-soft: rgba(11, 93, 52, 0.18);
      --accent-yellow: #eab308;
      --accent-yellow-bright: #facc15;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f0f2f5;
        --bg-card-hover: #e4e6eb;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --text-muted: #80868b;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
        --accent-green-hover: #084727;
        --accent-green-soft: rgba(11, 93, 52, 0.12);
        --accent-yellow: #ca8a04;
        --accent-yellow-bright: #eab308;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* TOP HEADER */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: var(--bg-surface);
    }

    .back-link {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 21px;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .back-link:hover {
      background: var(--bg-card);
    }

    .back-link:active {
      transform: scale(0.94);
    }

    /* CENTER CONTENT */
    .content-wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 22px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* YELLOW LOCK ILLUSTRATION */
    .lock-hero {
      position: relative;
      width: 148px;
      height: 132px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .doc-stack-left,
    .doc-stack-right {
      position: absolute;
      bottom: 8px;
      width: 34px;
      height: 56px;
      border-radius: 5px;
      background: #9aa0a6;
      opacity: 0.35;
    }

    .doc-stack-left {
      left: 16px;
      transform: rotate(-8deg);
    }

    .doc-stack-right {
      right: 16px;
      height: 64px;
      transform: rotate(8deg);
    }

    .lock-shackle {
      position: relative;
      width: 44px;
      height: 36px;
      border: 8px solid #8a8f98;
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      margin-bottom: -6px;
      z-index: 2;
      transition: transform 0.25s ease;
    }

    .lock-hero.unlocked .lock-shackle {
      transform: translate(10px, -6px) rotate(18deg);
      border-color: var(--accent-green-hover);
    }

    .lock-body {
      position: relative;
      z-index: 3;
      width: 68px;
      height: 58px;
      border-radius: 12px;
      background: linear-gradient(165deg, var(--accent-yellow-bright) 0%, var(--accent-yellow) 100%);
      box-shadow: 0 10px 24px rgba(234, 179, 8, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 16px;
    }

    .lock-hero.unlocked .lock-body {
      background: linear-gradient(165deg, #10b981 0%, var(--accent-green) 100%);
      box-shadow: 0 10px 24px rgba(11, 93, 52, 0.32);
    }

    .lock-slash {
      width: 4px;
      height: 22px;
      background: var(--bg-page);
      border-radius: 2px;
      transform: rotate(28deg);
    }

    .lock-hero.unlocked .lock-slash {
      display: none;
    }

    .lock-check {
      display: none;
      color: #ffffff;
      font-size: 22px;
    }

    .lock-hero.unlocked .lock-check {
      display: inline-block;
    }

    .lock-bottom-bar {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 82px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent-yellow);
    }

    .lock-hero.unlocked .lock-bottom-bar {
      background: var(--accent-green);
    }

    /* HEADINGS & SUBTITLE */
    .status-heading {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .status-subtext {
      font-size: 15.5px;
      line-height: 1.42;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* REQUIREMENTS LIST */
    .req-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .req-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .req-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      background: var(--text-secondary);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .req-badge.met {
      background: var(--accent-green);
    }

    .req-badge.unmet {
      background: #9aa0a6;
      color: var(--bg-page);
    }

    .req-text-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .req-title {
      font-size: 16.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .req-meta {
      font-size: 13px;
      line-height: 1.35;
      color: var(--text-secondary);
    }

    .unlock-banner {
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--accent-green-soft);
      border: 1px solid var(--accent-green);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .unlock-banner.show {
      display: flex;
    }

    .unlock-banner-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .go-live-btn {
      background: var(--accent-green);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .go-live-btn:hover {
      background: var(--accent-green-hover);
    }

    .go-live-btn:active {
      transform: scale(0.96);
    }

    /* BOTTOM ACTION BAR */
    .bottom-bar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 18px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: var(--bg-surface);
    }

    .btn-learn-more {
      height: 42px;
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .btn-learn-more:hover {
      background: var(--bg-card-hover);
    }

    .btn-learn-more:active {
      transform: scale(0.98);
    }

    .btn-ok {
      height: 42px;
      border: none;
      border-radius: 8px;
      background: var(--accent-green);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .btn-ok:hover {
      background: var(--accent-green-hover);
    }

    .btn-ok:active {
      transform: scale(0.98);
    }

    .toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-green);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 120;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="create-post.html" class="back-link" aria-label="Back to create post" title="Back">
      <i class="fas fa-chevron-left"></i>
    </a>
  </header>

  <main class="content-wrap">
    <div id="lockHero" class="lock-hero" aria-hidden="true">
      <div class="doc-stack-left"></div>
      <div class="doc-stack-right"></div>
      <div class="lock-shackle"></div>
      <div class="lock-body">
        <span class="lock-slash"></span>
        <i class="fas fa-check lock-check"></i>
      </div>
      <div class="lock-bottom-bar"></div>
    </div>

    <h1 id="statusHeading" class="status-heading">You can't go live yet</h1>
    <p id="statusSubtext" class="status-subtext">
      To start a live video, you need to meet these requirements:
    </p>

    <section class="req-list" aria-label="Live video requirements">
      <div class="req-item">
        <span id="ageBadge" class="req-badge unmet" aria-hidden="true">!</span>
        <div class="req-text-col">
          <div class="req-title">Your account must be at least 60 days old</div>
          <div id="ageMetaText" class="req-meta">Checking account age...</div>
        </div>
      </div>

      <div class="req-item">
        <span id="postsBadge" class="req-badge unmet" aria-hidden="true">!</span>
        <div class="req-text-col">
          <div class="req-title">Your account must have at least 10 published posts</div>
          <div id="postsMetaText" class="req-meta">Checking published posts count...</div>
        </div>
      </div>
    </section>

    <div id="unlockBanner" class="unlock-banner">
      <span class="unlock-banner-text">Live video is unlocked for your account!</span>
      <button type="button" class="go-live-btn" onclick="startLiveSession()">Go Live</button>
    </div>
  </main>

  <footer class="bottom-bar">
    <a href="autro-ai-assistant.html" class="btn-learn-more">Learn more</a>
    <button type="button" id="okBtn" class="btn-ok" onclick="goToCreatePost()">OK</button>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const CREATE_POST_URL = 'create-post.html';
    const REQUIRED_ACCOUNT_DAYS = 60;
    const REQUIRED_POSTS_COUNT = 10;

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._liveToastTimer);
      window._liveToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2200);
    }

    function goToCreatePost() {
      window.location.href = CREATE_POST_URL;
    }

    function startLiveSession() {
      showToast('Live studio unlocked');
      try {
        sessionStorage.setItem('autro_live_unlocked', 'true');
      } catch (_) {}
      setTimeout(() => {
        window.location.href = CREATE_POST_URL;
      }, 450);
    }

    function calculateAccountAgeDays(createdAtStr) {
      if (!createdAtStr) return 0;
      const createdMs = Date.parse(createdAtStr);
      if (Number.isNaN(createdMs)) return 0;
      const diffMs = Math.max(0, Date.now() - createdMs);
      return Math.floor(diffMs / (1000 * 60 * 60 * 24));
    }

    function applyRequirementsState(ageDays, postsCount, hasAccountDate) {
      const ageMet = Boolean(hasAccountDate) && ageDays >= REQUIRED_ACCOUNT_DAYS;
      const postsMet = postsCount >= REQUIRED_POSTS_COUNT;
      const allMet = ageMet && postsMet;

      const ageBadge = document.getElementById('ageBadge');
      const ageMeta = document.getElementById('ageMetaText');
      if (ageMet) {
        ageBadge.className = 'req-badge met';
        ageBadge.innerHTML = '<i class="fas fa-check"></i>';
        ageMeta.textContent = `Account age: ${ageDays} days (Requirement met)`;
      } else {
        ageBadge.className = 'req-badge unmet';
        ageBadge.textContent = '!';
        ageMeta.textContent = hasAccountDate
          ? `Current account age: ${ageDays} of ${REQUIRED_ACCOUNT_DAYS} days`
          : `Account creation date unavailable (${REQUIRED_ACCOUNT_DAYS} days required)`;
      }

      const postsBadge = document.getElementById('postsBadge');
      const postsMeta = document.getElementById('postsMetaText');
      if (postsMet) {
        postsBadge.className = 'req-badge met';
        postsBadge.innerHTML = '<i class="fas fa-check"></i>';
        postsMeta.textContent = `Published posts: ${postsCount} (Requirement met)`;
      } else {
        postsBadge.className = 'req-badge unmet';
        postsBadge.textContent = '!';
        postsMeta.textContent = `Published posts: ${postsCount} of ${REQUIRED_POSTS_COUNT}`;
      }

      const lockHero = document.getElementById('lockHero');
      const heading = document.getElementById('statusHeading');
      const subtext = document.getElementById('statusSubtext');
      const unlockBanner = document.getElementById('unlockBanner');

      if (allMet) {
        lockHero.classList.add('unlocked');
        heading.textContent = 'Live video unlocked';
        subtext.textContent = 'Your account meets all requirements to start a live video.';
        unlockBanner.classList.add('show');
      } else {
        lockHero.classList.remove('unlocked');
        heading.textContent = "You can't go live yet";
        subtext.textContent = 'To start a live video, you need to meet these requirements:';
        unlockBanner.classList.remove('show');
      }
    }

    async function loadRealLiveEligibility() {
      let ageDays = 0;
      let postsCount = 0;
      let hasAccountDate = false;

      if (sb) {
        try {
          const { data: { session } } = await sb.auth.getSession();
          const user = session?.user;

          if (user) {
            let createdAt = user.created_at || '';
            try {
              const { data: profile } = await sb
                .from('profiles')
                .select('created_at')
                .eq('id', user.id)
                .maybeSingle();
              if (profile?.created_at) {
                createdAt = profile.created_at;
              }
            } catch (_) {}

            if (createdAt) {
              hasAccountDate = true;
              ageDays = calculateAccountAgeDays(createdAt);
            }

            try {
              const { count, error } = await sb
                .from('posts')
                .select('id', { count: 'exact', head: true })
                .eq('user_id', user.id);
              if (!error && typeof count === 'number') {
                postsCount = count;
              }
            } catch (_) {}
          }
        } catch (_) {}
      }

      if (postsCount === 0) {
        try {
          const rawPosts = localStorage.getItem('autro_posts') || sessionStorage.getItem('autro_posts');
          if (rawPosts) {
            const parsed = JSON.parse(rawPosts);
            if (Array.isArray(parsed)) postsCount = parsed.length;
          }
        } catch (_) {}
      }

      applyRequirementsState(ageDays, postsCount, hasAccountDate);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadRealLiveEligibility();
    });
  </script>
</body>
</html>
