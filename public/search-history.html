<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search History</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root {
      --bg-page: #202124;
      --bg-surface: #292a2d;
      --bg-hover: #303134;
      --text-primary: #FFFFFF;
      --text-secondary: #b0b3b8;
      --border-color: #3c4043;
      --danger-bg: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .app-container {
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-page);
    }

    /* Top Navigation Bar */
    .history-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background-color: var(--bg-page);
      border-bottom: 1px solid var(--border-color);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 22px;
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }

    .back-btn:hover {
      background-color: var(--bg-hover);
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clear-all-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .clear-all-btn:hover:not(:disabled) {
      background-color: var(--bg-hover);
    }

    .clear-all-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .clear-all-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Section Title */
    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
    }

    .section-heading {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .count-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 3px 9px;
      border-radius: 999px;
    }

    /* History Rows */
    .history-list {
      display: flex;
      flex-direction: column;
    }

    .history-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 16px;
      transition: background-color 0.18s ease;
    }

    .history-row:hover {
      background-color: var(--bg-hover);
    }

    .history-link {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: var(--text-primary);
    }

    .avatar-circle {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .pin-indicator {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--text-primary);
      border: 2px solid var(--bg-page);
    }

    .history-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .history-query {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Three Dot Menu */
    .menu-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .three-dot-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .three-dot-btn:hover {
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 38px;
      z-index: 100;
      min-width: 154px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text-primary);
      padding: 11px 14px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background-color: var(--bg-hover);
    }

    .dropdown-item.delete-item:hover {
      background-color: var(--danger-bg);
    }

    /* Empty & Status States */
    .state-box {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .toast-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      display: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .toast-banner.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header with Clear All Search History Button -->
    <header class="history-header">
      <div class="header-left">
        <a href="search-bar.html" class="back-btn" aria-label="Back to Search">&lt;</a>
        <h1 class="header-title">Search History</h1>
      </div>
      <button type="button" id="clearAllHistoryBtn" class="clear-all-btn" aria-label="Clear all search history">
        <span aria-hidden="true">&#128465;</span>
        <span>Clear all search history</span>
      </button>
    </header>

    <!-- Section Summary -->
    <div class="section-bar">
      <span class="section-heading">Saved Searches</span>
      <span id="historyCountBadge" class="count-badge">0</span>
    </div>

    <!-- History Items List -->
    <main id="historyList" class="history-list">
      <div class="state-box">Loading search history...</div>
    </main>
  </div>

  <div id="toastBanner" class="toast-banner" role="status" aria-live="polite"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const historyList = document.getElementById('historyList');
    const clearAllHistoryBtn = document.getElementById('clearAllHistoryBtn');
    const historyCountBadge = document.getElementById('historyCountBadge');
    const toastBanner = document.getElementById('toastBanner');

    let toastTimer = null;

    function showToast(message) {
      toastBanner.textContent = message;
      toastBanner.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBanner.classList.remove('show');
      }, 2400);
    }

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getInitial(text = '') {
      const trimmed = String(text).trim();
      return trimmed ? trimmed.charAt(0).toUpperCase() : '?';
    }

    function formatDateTime(isoString) {
      if (!isoString) return 'Saved search';
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return 'Saved search';
      return date.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderAvatar(avatarUrl, label, isPinned) {
      const pinDot = isPinned ? `<span class="pin-indicator" title="Pinned"></span>` : '';
      if (avatarUrl) {
        return `
          <div class="avatar-circle">
            <img src="${escapeHtml(avatarUrl)}" alt="${escapeHtml(label)}" onerror="this.style.display='none'; this.parentElement.textContent='${escapeHtml(getInitial(label))}';" />
            ${pinDot}
          </div>
        `;
      }
      return `
        <div class="avatar-circle">
          ${escapeHtml(getInitial(label))}
          ${pinDot}
        </div>
      `;
    }

    async function loadSearchHistory() {
      historyList.innerHTML = `<div class="state-box">Loading search history...</div>`;

      const { data, error } = await supabase
        .from('search_history')
        .select('*')
        .order('is_pinned', { ascending: false })
        .order('created_at', { ascending: false });

      if (error) {
        historyList.innerHTML = `<div class="state-box">Could not load search history.</div>`;
        clearAllHistoryBtn.disabled = true;
        historyCountBadge.textContent = '0';
        return;
      }

      const items = data || [];
      historyCountBadge.textContent = String(items.length);
      clearAllHistoryBtn.disabled = items.length === 0;

      if (items.length === 0) {
        historyList.innerHTML = `<div class="state-box">No search history found.</div>`;
        return;
      }

      historyList.innerHTML = '';

      items.forEach((item) => {
        const queryLabel = item.query || item.title || item.name || 'Search';
        const isPinned = Boolean(item.is_pinned);
        const targetHref = item.target_url || `search-bar.html?q=${encodeURIComponent(queryLabel)}`;
        const subText = `${isPinned ? 'Pinned · ' : ''}${formatDateTime(item.created_at)}`;

        const row = document.createElement('div');
        row.className = 'history-row';
        row.innerHTML = `
          <a href="${escapeHtml(targetHref)}" class="history-link">
            ${renderAvatar(item.avatar_url || '', queryLabel, isPinned)}
            <div class="history-meta">
              <span class="history-query">${escapeHtml(queryLabel)}</span>
              <span class="history-sub">${escapeHtml(subText)}</span>
            </div>
          </a>
          <div class="menu-wrap">
            <button type="button" class="three-dot-btn" aria-label="More options" data-menu-id="${escapeHtml(String(item.id))}">&#8943;</button>
            <div class="dropdown-menu" id="menu-${escapeHtml(String(item.id))}">
              <button type="button" class="dropdown-item pin-toggle-btn" data-id="${escapeHtml(String(item.id))}" data-pinned="${isPinned}">
                ${isPinned ? 'Unpin search' : 'Pin search'}
              </button>
              <button type="button" class="dropdown-item delete-item single-delete-btn" data-id="${escapeHtml(String(item.id))}">
                Delete search
              </button>
            </div>
          </div>
        `;

        historyList.appendChild(row);
      });

      bindMenuActions();
    }

    function bindMenuActions() {
      document.querySelectorAll('.three-dot-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menuId = btn.getAttribute('data-menu-id');
          const menu = document.getElementById(`menu-${menuId}`);

          document.querySelectorAll('.dropdown-menu.open').forEach((openMenu) => {
            if (openMenu !== menu) openMenu.classList.remove('open');
          });

          if (menu) menu.classList.toggle('open');
        });
      });

      document.querySelectorAll('.pin-toggle-btn').forEach((pinBtn) => {
        pinBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = pinBtn.getAttribute('data-id');
          const currentPinned = pinBtn.getAttribute('data-pinned') === 'true';

          const { error } = await supabase
            .from('search_history')
            .update({ is_pinned: !currentPinned })
            .eq('id', id);

          if (!error) {
            showToast(!currentPinned ? 'Search pinned' : 'Search unpinned');
            loadSearchHistory();
          } else {
            showToast('Failed to update pin status');
          }
        });
      });

      document.querySelectorAll('.single-delete-btn').forEach((delBtn) => {
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = delBtn.getAttribute('data-id');

          const { error } = await supabase
            .from('search_history')
            .delete()
            .eq('id', id);

          if (!error) {
            showToast('Search deleted');
            loadSearchHistory();
          } else {
            showToast('Failed to delete search');
          }
        });
      });
    }

    clearAllHistoryBtn.addEventListener('click', async () => {
      const confirmed = window.confirm('Are you sure you want to clear all search history?');
      if (!confirmed) return;

      clearAllHistoryBtn.disabled = true;
      const originalHtml = clearAllHistoryBtn.innerHTML;
      clearAllHistoryBtn.innerHTML = `<span>Clearing...</span>`;

      const { error } = await supabase
        .from('search_history')
        .delete()
        .not('id', 'is', null);

      clearAllHistoryBtn.innerHTML = originalHtml;

      if (!error) {
        showToast('All search history cleared');
        await loadSearchHistory();
      } else {
        clearAllHistoryBtn.disabled = false;
        showToast('Could not clear search history');
      }
    });

    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu.open').forEach((menu) => {
        menu.classList.remove('open');
      });
    });

    loadSearchHistory();
  </script>
</body>
</html>
