<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Reels — Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg-color: #ffffff;
    --surface-color: #ffffff;
    --card-bg: #f8fafc;
    --input-bg: #f1f5f9;
    --text-color: #0f172a;
    --muted-color: #5f6368;
    --border-color: #e5e7eb;
    --hover-color: rgba(0, 0, 0, 0.06);

    /* System Default Button Tokens (Light: #FFFFFF surface / #202124 text) */
    --btn-bg: #ffffff;
    --btn-hover-bg: #f3f4f6;
    --btn-text: #202124;
    --btn-border: #d1d5db;
    --btn-active-bg: #202124;
    --btn-active-text: #ffffff;

    --reel-stage-bg: #0f1412;
    --danger-color: #dc2626;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #202124;
      --surface-color: #202124;
      --card-bg: #292a2d;
      --input-bg: #303134;
      --text-color: #f1f5f9;
      --muted-color: #9aa0a6;
      --border-color: #3c4043;
      --hover-color: rgba(255, 255, 255, 0.08);

      /* System Default Button Tokens (Dark: #202124 surface / #FFFFFF text) */
      --btn-bg: #202124;
      --btn-hover-bg: #2c2d30;
      --btn-text: #ffffff;
      --btn-border: #3c4043;
      --btn-active-bg: #ffffff;
      --btn-active-text: #202124;

      --reel-stage-bg: #121316;
      --danger-color: #f87171;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    width: 100%;
    height: 100dvh;
    min-height: 100dvh;
    background: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Header */
  .reels-header {
    background: var(--surface-color);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 25;
    flex-shrink: 0;
  }

  .header-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .header-brand-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .reels-pill {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .slide-counter-badge {
    background: var(--input-bg);
    color: var(--muted-color);
    border: 1px solid var(--border-color);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .header-right-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .circle-action-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.14s ease, background 0.15s ease;
  }

  .circle-action-btn:hover {
    background: var(--btn-hover-bg);
  }

  .circle-action-btn:active {
    transform: scale(0.95);
  }

  .circle-action-btn.sound-enhanced {
    border-color: var(--btn-active-bg);
    box-shadow: 0 0 0 2px var(--hover-color);
  }

  .search-sort-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-bar-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 8px 14px;
    color: var(--muted-color);
  }

  .search-bar-wrap input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-color);
    font-size: 13.5px;
    outline: none;
  }

  .sort-select {
    height: 36px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 12px;
    font-weight: 700;
    padding: 0 12px;
    outline: none;
    cursor: pointer;
    flex-shrink: 0;
  }

  .filter-tabs-row {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filter-tabs-row::-webkit-scrollbar {
    display: none;
  }

  .filter-chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .filter-chip:hover {
    background: var(--btn-hover-bg);
  }

  .filter-chip.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }

  .user-filter-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .user-filter-banner.show {
    display: flex;
  }

  .clear-filter-btn {
    border: 1px solid var(--btn-border);
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Pull-to-Refresh Indicator */
  .pull-refresh-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translate(-50%, -120%);
    background: var(--surface-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    z-index: 65;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    transition: transform 0.18s ease;
    pointer-events: none;
  }

  .pull-refresh-indicator.visible {
    transform: translate(-50%, 14px);
  }

  /* Full-Screen Vertical Snap Feed Container */
  .reels-feed-scroller {
    flex: 1;
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    background: var(--reel-stage-bg);
    position: relative;
  }

  .reels-feed-scroller::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  .reel-snap-slide {
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0;
  }

  .reel-card-frame-shell {
    width: 100%;
    height: 100%;
    border-radius: 0;
    overflow: hidden;
    background: #000000;
    position: relative;
  }

  .reel-card-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #000000;
  }

  /* Slide Quick-Action Overlay Bar */
  .slide-quick-bar {
    position: absolute;
    left: 12px;
    top: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    z-index: 18;
    max-width: calc(100% - 24px);
  }

  .slide-quick-link,
  .slide-action-chip,
  .slide-delete-btn {
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    background: rgba(32, 33, 36, 0.78);
    color: #ffffff;
    font-size: 11.5px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }

  .slide-quick-link:hover,
  .slide-action-chip:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .slide-action-chip.saved {
    background: #ffffff;
    color: #202124;
    border-color: #ffffff;
  }

  .slide-delete-btn {
    border-color: rgba(248, 113, 113, 0.65);
    color: #fca5a5;
  }

  .slide-delete-btn:hover {
    background: rgba(220, 38, 38, 0.85);
    color: #ffffff;
  }

  /* Single Downward Scroll Button (^) removed; only downward step control kept */
  .step-down-btn {
    position: fixed;
    right: 16px;
    bottom: 76px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32);
    z-index: 22;
  }

  .step-down-btn:hover {
    background: var(--btn-hover-bg);
  }

  .empty-state-box {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
    color: #f1f5f9;
  }

  /* Delete Confirmation Modal */
  .confirm-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 60;
  }

  .confirm-modal-backdrop.open {
    display: flex;
  }

  .confirm-modal-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  }

  .confirm-modal-title {
    font-size: 16px;
    font-weight: 800;
  }

  .confirm-modal-desc {
    font-size: 13px;
    color: var(--muted-color);
    line-height: 1.45;
  }

  .confirm-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 4px;
  }

  .modal-cancel-btn,
  .modal-delete-btn {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--btn-border);
  }

  .modal-cancel-btn {
    background: var(--btn-bg);
    color: var(--btn-text);
  }

  .modal-delete-btn {
    background: #dc2626;
    color: #ffffff;
    border-color: #dc2626;
  }

  .modal-delete-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .reel-toast {
    position: fixed;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%);
    background: #202124;
    color: #ffffff;
    border: 1px solid #3c4043;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    z-index: 70;
    display: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  .reel-toast.show {
    display: block;
  }

  /* Bottom Navigation matching Screenshot 2 */
  .bottom-nav {
    height: 58px;
    background: var(--surface-color);
    border-top: 1px solid var(--border-color);
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    align-items: center;
    flex-shrink: 0;
    z-index: 30;
  }

  .nav-item {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--muted-color);
    font-size: 20px;
    position: relative;
    transition: color 0.15s ease;
  }

  .nav-item.active {
    color: var(--btn-text);
  }

  .nav-item.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 18%;
    right: 18%;
    height: 2.5px;
    background: var(--btn-text);
    border-radius: 2px 2px 0 0;
  }

  .nav-profile-avatar-slot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border-color);
    background: transparent;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--text-color);
  }

  .nav-item.active .nav-profile-avatar-slot {
    border-color: var(--btn-text);
  }

  .nav-profile-avatar-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<div class="pull-refresh-indicator" id="pullRefreshIndicator">
  <i class="fa-solid fa-rotate-right" id="pullRefreshIcon"></i>
  <span id="pullRefreshText">Pull to refresh</span>
</div>

<header class="reels-header">
  <div class="header-top-row">
    <div class="header-brand-left">
      <span class="brand-title">Autrobook</span>
      <span class="reels-pill">Reels</span>
      <span class="slide-counter-badge" id="slideCounterBadge">0 / 0</span>
    </div>

    <div class="header-right-actions">
      <button type="button" class="circle-action-btn sound-enhanced" id="toggleGlobalMuteBtn" title="Sound Boost (100%–200%) & Mute">
        <i class="fa-solid fa-volume-high" id="globalMuteIcon"></i>
      </button>
    </div>
  </div>

  <div class="search-sort-row">
    <div class="search-bar-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="reelSearchInput" placeholder="Search reels, captions, creators, audio...">
    </div>
    <select id="reelSortSelect" class="sort-select" aria-label="Sort reels">
      <option value="newest">Newest</option>
      <option value="popular">Most Liked</option>
      <option value="oldest">Oldest</option>
    </select>
  </div>

  <div class="filter-tabs-row" id="filterTabsRow">
    <button type="button" class="filter-chip active" data-filter="all">All Reels</button>
    <button type="button" class="filter-chip" data-filter="following">Following</button>
    <button type="button" class="filter-chip" data-filter="saved">Saved</button>
    <button type="button" class="filter-chip" data-filter="mine">My Reels</button>
  </div>

  <div class="user-filter-banner" id="userFilterBanner">
    <span id="userFilterLabel">Filtered by creator</span>
    <button type="button" class="clear-filter-btn" id="clearUserFilterBtn">Show All</button>
  </div>
</header>

<main class="reels-feed-scroller" id="reelsFeedScroller">
  <div class="empty-state-box" id="loadingState">
    <i class="fa-solid fa-clapperboard" style="font-size:28px;color:#ffffff;"></i>
    <div style="font-weight:700;font-size:15px;">Loading Reels Feed...</div>
  </div>
</main>

<button type="button" class="step-down-btn" id="nextReelBtn" title="Next Reel">
  <i class="fa-solid fa-chevron-down"></i>
</button>

<!-- Delete Reel Confirmation Modal -->
<div class="confirm-modal-backdrop" id="deleteConfirmModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
  <div class="confirm-modal-card">
    <div class="confirm-modal-title" id="deleteModalTitle">Delete Reel?</div>
    <div class="confirm-modal-desc" id="deleteModalDesc">
      This will permanently remove the reel from Supabase, Home Feed, Profile Reels, and local storage. This action cannot be undone.
    </div>
    <div class="confirm-modal-actions">
      <button type="button" class="modal-cancel-btn" id="cancelDeleteReelBtn">Cancel</button>
      <button type="button" class="modal-delete-btn" id="confirmDeleteReelBtn">Delete</button>
    </div>
  </div>
</div>

<div class="reel-toast" id="reelToast"></div>

<nav class="bottom-nav" aria-label="Main Navigation">
  <a href="/index.html" class="nav-item" id="navHomeLink" title="Home" aria-label="Home">
    <i class="fa-solid fa-house"></i>
  </a>
  <a href="/reels.html" class="nav-item active" id="navReelsLink" title="Reels" aria-label="Reels">
    <i class="fa-solid fa-clapperboard"></i>
  </a>
  <a href="/friends.html" class="nav-item" id="navFriendsLink" title="Friends" aria-label="Friends">
    <i class="fa-solid fa-user-group"></i>
  </a>
  <a href="/games.html" class="nav-item" id="navGamesLink" title="Games" aria-label="Games">
    <i class="fa-solid fa-gamepad"></i>
  </a>
  <a href="/groups.html" class="nav-item" id="navGroupsLink" title="Groups" aria-label="Groups">
    <i class="fa-solid fa-users"></i>
  </a>
  <a href="/notifications.html" class="nav-item" id="navNotificationsLink" title="Notifications" aria-label="Notifications">
    <i class="fa-solid fa-bell"></i>
  </a>
  <a href="/profile.html" class="nav-item" id="bottomProfileLink" title="Profile" aria-label="Profile">
    <span class="nav-profile-avatar-slot" id="bottomProfileAvatarSlot">
      <i class="fa-solid fa-user" id="bottomProfileFallbackIcon"></i>
    </span>
  </a>
</nav>

<script>
  const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

  const supabaseClient = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  let reelSyncChannel = null;
  try {
    if ('BroadcastChannel' in window) {
      reelSyncChannel = new BroadcastChannel('autrobook_reels_sync');
    }
  } catch (_) {}

  const urlParams = new URLSearchParams(window.location.search);
  let targetUserId = urlParams.get('user_id') || '';
  const focusedReelId = urlParams.get('reel') || urlParams.get('id') || '';
  let activeFilter = 'all';
  let sortMode = 'newest';
  let searchQuery = '';

  /* Sound enhancement states:
     0 = Muted (0%)
     1 = Normal (100% / 1.0x gain)
     2 = Boosted (150% / 1.5x gain)
     3 = Max Boost (200% / 2.0x gain)
  */
  let soundModeLevel = 2;
  let audioCtx = null;
  const boostedVideoNodes = new WeakMap();

  let currentUserId = null;
  let currentSlideIndex = 0;
  let allReels = [];
  let followingIds = new Set();
  let savedReelIds = new Set();
  let pendingDeleteReel = null;

  const scrollerEl = document.getElementById('reelsFeedScroller');
  const searchInputEl = document.getElementById('reelSearchInput');
  const sortSelectEl = document.getElementById('reelSortSelect');
  const slideCounterBadge = document.getElementById('slideCounterBadge');
  const userFilterBanner = document.getElementById('userFilterBanner');
  const userFilterLabel = document.getElementById('userFilterLabel');
  const bottomProfileAvatarSlot = document.getElementById('bottomProfileAvatarSlot');
  const deleteConfirmModal = document.getElementById('deleteConfirmModal');
  const confirmDeleteReelBtn = document.getElementById('confirmDeleteReelBtn');
  const cancelDeleteReelBtn = document.getElementById('cancelDeleteReelBtn');
  const reelToastEl = document.getElementById('reelToast');
  const pullIndicatorEl = document.getElementById('pullRefreshIndicator');
  const pullIconEl = document.getElementById('pullRefreshIcon');
  const pullTextEl = document.getElementById('pullRefreshText');

  function showToast(msg) {
    reelToastEl.textContent = msg;
    reelToastEl.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      reelToastEl.classList.remove('show');
    }, 2400);
  }

  function requestFullScreenView() {
    const docEl = document.documentElement;
    if (!document.fullscreenElement && typeof docEl.requestFullscreen === 'function') {
      docEl.requestFullscreen().catch(() => {});
    }
  }

  function updateSlideCounter(totalCount) {
    if (!slideCounterBadge) return;
    if (!totalCount) {
      slideCounterBadge.textContent = '0 / 0';
      return;
    }
    const clampedIdx = Math.min(Math.max(0, currentSlideIndex), totalCount - 1);
    slideCounterBadge.textContent = `${clampedIdx + 1} / ${totalCount}`;
  }

  function isValidUUID(val) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(val || '').trim());
  }

  function getDeletedReelIdsSet() {
    const set = new Set();
    const keys = ['autro_deleted_reel_ids', 'deleted_reel_ids', 'autrobook_deleted_reels'];
    keys.forEach((k) => {
      try {
        const arr = JSON.parse(localStorage.getItem(k) || '[]');
        if (Array.isArray(arr)) {
          arr.forEach((v) => {
            if (typeof v === 'string' || typeof v === 'number') {
              const clean = String(v).trim();
              if (clean) set.add(clean);
            } else if (v && typeof v === 'object') {
              const clean = String(v.id || v.reel_id || '').trim();
              if (clean) set.add(clean);
            }
          });
        }
      } catch (_) {}
    });
    return set;
  }

  function recordDeletedReelId(reelId) {
    const cleanId = String(reelId || '').trim();
    if (!cleanId) return;
    try {
      const arr = JSON.parse(localStorage.getItem('autro_deleted_reel_ids') || '[]');

  async function resolveStandaloneSessionAndProfile() {
    let localAvatar = '';
    try {
      const savedProfile = JSON.parse(localStorage.getItem('autrobook_profile') || '{}');
      localAvatar = savedProfile.avatar_url || savedProfile.avatar || localStorage.getItem('autro_profile_avatar') || '';
    } catch (e) {
      localAvatar = localStorage.getItem('autro_profile_avatar') || '';
    }

    if (localAvatar) {
      setBottomProfileAvatar(localAvatar);
    }

    currentUserId = localStorage.getItem('autro_user_id') || '';

    if (!supabaseClient) return;

    try {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      let authUser = sessionData?.session?.user || null;

      if (!authUser) {
        const { data: userData } = await supabaseClient.auth.getUser();
        authUser = userData?.user || null;
      }

      if (authUser?.id) {
        currentUserId = String(authUser.id);
        localStorage.setItem('autro_user_id', currentUserId);
        syncNavigationLinks();

        const metaAvatar = authUser.user_metadata?.avatar_url || '';
        const { data: prof } = await supabaseClient
          .from('profiles')
          .select('avatar_url, full_name, name, username')
          .eq('id', currentUserId)
          .maybeSingle();

        const resolvedAvatar = prof?.avatar_url || metaAvatar || localAvatar || '';
        setBottomProfileAvatar(resolvedAvatar);
        if (resolvedAvatar) {
          localStorage.setItem('autro_profile_avatar', resolvedAvatar);
        }

        const resolvedName = prof?.full_name || prof?.name || prof?.username || authUser.user_metadata?.full_name || authUser.user_metadata?.name || '';
        if (resolvedName) {
          localStorage.setItem('autro_profile_name', resolvedName);
        }
      }
    } catch (e) {}
  }

  function normalizeReelRecord(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const id = String(raw.id || raw.reel_id || raw.created_at || raw.time || '').trim();
    if (!id || getDeletedReelIdsSet().has(id)) return null;

    const mediaUrl = String(raw.media_url || raw.video_url || raw.video || raw.url || raw.src || '').trim();
    const caption = String(raw.caption || raw.title || raw.description || '').trim();
    if (!mediaUrl && !caption) return null;

    const rawTime = raw.created_at || raw.time || Date.now();
    const isoTime = typeof rawTime === 'number'
      ? new Date(rawTime).toISOString()
      : String(rawTime || new Date().toISOString());

    return {
      id,
      user_id: raw.user_id || raw.author_id || currentUserId || '',
      author_name: raw.author_name || raw.name || raw.username || raw.user_name || 'Autrobook User',
      author_avatar: raw.author_avatar || raw.avatar_url || raw.avatar || '',
      media_url: mediaUrl,
      media_type: raw.media_type || raw.type || (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(mediaUrl) ? 'video/mp4' : 'video'),
      caption,
      singer_name: raw.singer_name || raw.artist_name || '',
      song_title: raw.song_title || raw.song_name || '',
      audio_name: raw.audio_name || raw.music || raw.audio || 'Original Audio',
      quality: raw.quality || 'HD',
      audience: raw.audience || 'Public',
      likes: Number(raw.likes ?? raw.likes_count ?? raw.reaction_count ?? 0),
      created_at: isoTime
    };
  }

  function syncReelsToSharedStores(reelsList) {

      localStorage.setItem('reels', JSON.stringify(cleanList.slice(0, 100)));

  async function fetchApiReels() {
    try {
      const res = await fetch('/api/reels', { cache: 'no-store' });
      if (!res.ok) return [];
      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) return [];
      const json = await res.json();
      if (Array.isArray(json)) return json;
      if (Array.isArray(json?.reels)) return json.reels;
      if (Array.isArray(json?.data)) return json.data;
      return [];
    } catch (e) {
      return [];
    }
  }

  async function fetchReelsFromSources() {
    const deletedSet = getDeletedReelIdsSet();
    const localKeys = [
      'reels',
      'autrobook_live_reels',
      'autrobook_reels_queue',
      'autro_reels',
      'autrobook_reels',
      'autro_instant_reels'
    ];
    const localReels = [];

    localKeys.forEach((key) => {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(parsed)) localReels.push(...parsed);
      } catch (e) {}
    });

    Object.keys(localStorage).forEach((key) => {
      if (key.startsWith('autrobook_profile_reels_')) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key) || '[]');
          if (Array.isArray(parsed)) localReels.push(...parsed);
        } catch (e) {}
      }
    });

    try {
      const singleNew = JSON.parse(localStorage.getItem('autro_new_reel_created') || 'null');
      if (singleNew && typeof singleNew === 'object') localReels.unshift(singleNew);
    } catch (e) {}

    const apiReels = await fetchApiReels();
    let remoteReels = [];

    if (supabaseClient) {
      try {
        const { data: postReels } = await supabaseClient
          .from('posts')
          .select('*')
          .eq('is_reel', true)
          .order('created_at', { ascending: false })
          .limit(60);
        if (Array.isArray(postReels)) remoteReels.push(...postReels);
      } catch (e) {}

      try {
        const { data: directReels } = await supabaseClient
          .from('reels')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(60);
        if (Array.isArray(directReels)) remoteReels.push(...directReels);
      } catch (e) {}

      if (currentUserId) {
        try {
          const { data: friendsData } = await supabaseClient
            .from('friends')
            .select('user_id, friend_id, status')
            .eq('status', 'accepted')
            .or(`user_id.eq.${currentUserId},friend_id.eq.${currentUserId}`);
          (friendsData || []).forEach((row) => {
            const otherId = row.user_id === currentUserId ? row.friend_id : row.user_id;
            if (otherId) followingIds.add(otherId);
          });
        } catch (e) {}
      }
    }

    const map = new Map();
    [...apiReels, ...remoteReels, ...localReels].forEach((raw) => {
      const norm = normalizeReelRecord(raw);
      if (norm && norm.id && !deletedSet.has(String(norm.id))) {
        map.set(norm.id, { ...map.get(norm.id), ...norm });
      }
    });

    allReels = Array.from(map.values()).sort(
      (a, b) => new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime()
    );

    syncReelsToSharedStores(allReels);
  }

  function extractStoragePathFromPublicUrl(url, bucketName = 'reels') {
    const raw = String(url || '').trim();
    if (!raw) return '';
    const marker = `/storage/v1/object/public/${bucketName}/`;
    const idx = raw.indexOf(marker);
    if (idx === -1) return '';
    return decodeURIComponent(raw.slice(idx + marker.length).split('?')[0]);
  }

  function removeReelFromLocalStores(reelId) {
    const cleanId = String(reelId || '').trim();
    if (!cleanId) return;
    recordDeletedReelId(cleanId);

    const localKeys = [
      'reels',
      'autrobook_live_reels',
      'autrobook_reels_queue',
      'autro_reels',
      'autrobook_reels',
      'autro_instant_reels'
    ];

    localKeys.forEach((key) => {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(parsed)) {
          const filtered = parsed.filter((item) => {
            const id = String(item?.id || item?.reel_id || '');
            return id !== cleanId;
          });
          localStorage.setItem(key, JSON.stringify(filtered));
        }
      } catch (e) {}
    });

    Object.keys(localStorage).forEach((key) => {
      if (key.startsWith('autrobook_profile_reels_')) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key) || '[]');
          if (Array.isArray(parsed)) {
            const filtered = parsed.filter((item) => String(item?.id || item?.reel_id || '') !== cleanId);
            localStorage.setItem(key, JSON.stringify(filtered));
          }
        } catch (e) {}
      }
    });

    try {
      const singleNew = JSON.parse(localStorage.getItem('autro_new_reel_created') || 'null');
      if (singleNew && String(singleNew.id || singleNew.reel_id || '') === cleanId) {
        localStorage.removeItem('autro_new_reel_created');
      }
    } catch (e) {}

    try {
      const engMap = JSON.parse(localStorage.getItem('autrobook_reel_engagement') || '{}');
      if (engMap && typeof engMap === 'object' && engMap[cleanId]) {
        delete engMap[cleanId];
        localStorage.setItem('autrobook_reel_engagement', JSON.stringify(engMap));
      }
    } catch (e) {}
  }

  function broadcastDeletionEverywhere(reelId) {
    const cleanId = String(reelId || '').trim();
    if (!cleanId) return;

    try {
      if (reelSyncChannel) {
        reelSyncChannel.postMessage({
          type: 'DELETE_REEL_CARD',
          reelId: cleanId,
          id: cleanId,
          targets: ['/reels.html', '/index.html', '/profile.html', '/reels-card.html']
        });
        reelSyncChannel.postMessage({
          type: 'REEL_DELETED',
          reelId: cleanId,
          id: cleanId,
          targets: ['/reels.html', '/index.html', '/profile.html', '/reels-card.html']
        });
      }
    } catch (_) {}

    try {
      window.parent?.postMessage({ type: 'DELETE_REEL', reel_id: cleanId, reelId: cleanId }, '*');
    } catch (_) {}
  }

  async function deleteReelFromSupabaseAndState(reel) {
    if (!reel || !reel.id) return false;
    const reelId = String(reel.id).trim();
    const targetObj = allReels.find((item) => String(item.id) === reelId) || reel;

    if (supabaseClient) {
      try {
        let qReels = supabaseClient.from('reels').delete().eq('id', reelId);
        if (currentUserId && isValidUUID(currentUserId) && targetObj.user_id === currentUserId) {
          qReels = qReels.eq('user_id', currentUserId);
        }
        await qReels;
      } catch (e) {}

      try {
        let qPosts = supabaseClient.from('posts').delete().eq('id', reelId);
        if (currentUserId && isValidUUID(currentUserId) && targetObj.user_id === currentUserId) {
          qPosts = qPosts.eq('user_id', currentUserId);
        }
        await qPosts;
      } catch (e) {}

      const storagePath = extractStoragePathFromPublicUrl(targetObj.media_url, 'reels');
      if (storagePath) {
        try {
          await supabaseClient.storage.from('reels').remove([storagePath]);
        } catch (_) {}
      }
    }

    removeReelFromLocalStores(reelId);
    allReels = allReels.filter((item) => String(item.id) !== reelId);
    broadcastDeletionEverywhere(reelId);
    renderVerticalReelsFeed();
    syncNavigationLinks();
    showToast('Reel deleted from Supabase & all pages');
    return true;
  }

  function getFilteredReels() {
    const q = searchQuery.trim().toLowerCase();
    const storedUserId = currentUserId || localStorage.getItem('autro_user_id') || '';
    const deletedSet = getDeletedReelIdsSet();

    const matched = allReels.filter((r) => {
      if (deletedSet.has(String(r.id))) return false;
      if (targetUserId && r.user_id !== targetUserId) {
        return false;
      }

      if (activeFilter === 'following') {
        if (!followingIds.has(r.user_id)) return false;
      } else if (activeFilter === 'saved') {
        if (!savedReelIds.has(String(r.id)) && !savedReelIds.has(r.media_url)) return false;
      } else if (activeFilter === 'mine') {
        if (!storedUserId || r.user_id !== storedUserId) return false;
      }

      if (q) {
        const hay = `${r.caption || ''} ${r.author_name || ''} ${r.audio_name || ''} ${r.singer_name || ''} ${r.song_title || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }

      return true;
    });

    if (sortMode === 'popular') {
      return [...matched].sort((a, b) => Number(b.likes || 0) - Number(a.likes || 0));
    }
    if (sortMode === 'oldest') {
      return [...matched].sort((a, b) => new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime());
    }
    return [...matched].sort((a, b) => new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime());
  }

  function applySoundBoostToVideo(vid) {
    if (!vid) return;
    const isMuted = soundModeLevel === 0;
    const gainMultiplier = soundModeLevel === 3 ? 2.0 : soundModeLevel === 2 ? 1.5 : 1.0;

    vid.muted = isMuted;
    vid.volume = isMuted ? 0 : 1;

    if (isMuted) return;

    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }

      let nodePack = boostedVideoNodes.get(vid);
      if (!nodePack) {
        const source = audioCtx.createMediaElementSource(vid);
        const gainNode = audioCtx.createGain();
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        nodePack = { source, gainNode };
        boostedVideoNodes.set(vid, nodePack);
      }
      nodePack.gainNode.gain.value = gainMultiplier;
    } catch (_) {}
  }

  function syncSoundAcrossAllSlides() {
    const btn = document.getElementById('toggleGlobalMuteBtn');
    const icon = document.getElementById('globalMuteIcon');

    if (soundModeLevel === 0) {
      if (icon) icon.className = 'fa-solid fa-volume-xmark';
      btn?.classList.remove('sound-enhanced');
    } else if (soundModeLevel === 1) {
      if (icon) icon.className = 'fa-solid fa-volume-low';
      btn?.classList.remove('sound-enhanced');
    } else {
      if (icon) icon.className = 'fa-solid fa-volume-high';
      btn?.classList.add('sound-enhanced');
    }

    scrollerEl.querySelectorAll('iframe').forEach((iframe) => {
      try {
        const vid = iframe.contentWindow?.document?.getElementById('reelVideo');
        if (vid) applySoundBoostToVideo(vid);
      } catch (e) {}
    });
  }

  function renderVerticalReelsFeed() {
    const list = getFilteredReels();
    updateUserFilterBanner(list);
    updateSlideCounter(list.length);
    syncNavigationLinks();

    if (!list.length) {
      scrollerEl.innerHTML = `
        <div class="empty-state-box">
          <i class="fa-solid fa-film" style="font-size:32px;color:#9aa0a6;"></i>
          <div style="font-size:15px;font-weight:700;">No reels match this view</div>
          <div style="font-size:12.5px;color:#9aa0a6;">Pull down to refresh or switch filters.</div>
        </div>
      `;
      return;
    }

    scrollerEl.innerHTML = list.map((reel, idx) => {
      const iframeSrc = buildCardIframeSrc(reel);
      const commentHref = getCommentPageUrl(reel);
      const reactionsHref = getReactionsPageUrl(reel);
      const profileReelsHref = getProfileReelsUrl(reel.user_id);
      const indexReelsHref = getIndexReelsUrl(reel.id);
      const showDelete = canDeleteReel(reel);
      const isSaved = savedReelIds.has(String(reel.id)) || savedReelIds.has(reel.media_url);

      return `
        <section class="reel-snap-slide" data-index="${idx}" data-reel-id="${escapeAttr(reel.id)}">
          <div class="reel-card-frame-shell">
            <div class="slide-quick-bar">
              <a href="${escapeAttr(commentHref)}" class="slide-quick-link" title="Open Comments">
                <i class="fa-regular fa-comment"></i>
                <span>Comments</span>
              </a>
              <a href="${escapeAttr(reactionsHref)}" class="slide-quick-link" title="Open Reactions">
                <i class="fa-regular fa-face-smile"></i>
                <span>Reactions</span>
              </a>
              <a href="${escapeAttr(profileReelsHref)}" class="slide-quick-link" title="Open Profile Reels">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
              </a>
              <a href="${escapeAttr(indexReelsHref)}" class="slide-quick-link" title="Open Home Feed">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
              </a>
              <button type="button" class="slide-action-chip ${isSaved ? 'saved' : ''}" data-save-id="${escapeAttr(reel.id)}" title="${isSaved ? 'Saved' : 'Save Reel'}">
                <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark"></i>
                <span>${isSaved ? 'Saved' : 'Save'}</span>
              </button>
              <button type="button" class="slide-action-chip" data-share-id="${escapeAttr(reel.id)}" title="Share Reel">
                <i class="fa-solid fa-share-nodes"></i>
                <span>Share</span>
              </button>
              ${showDelete ? `
                <button type="button" class="slide-delete-btn" data-delete-id="${escapeAttr(reel.id)}" title="Delete Reel">
                  <i class="fa-regular fa-trash-can"></i>
                  <span>Delete</span>
                </button>
              ` : ''}
            </div>
            <iframe
              src="${escapeAttr(iframeSrc)}"
              class="reel-card-iframe"
              title="Reel ${idx + 1}"
              allow="autoplay; encrypted-media; microphone"
              loading="${idx < 2 ? 'eager' : 'lazy'}"
            ></iframe>
          </div>
        </section>
      `;
    }).join('');

    scrollerEl.querySelectorAll('[data-save-id]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const sid = btn.getAttribute('data-save-id');
        const found = allReels.find((item) => String(item.id) === String(sid));
        if (found) toggleSaveReel(found);
      });
    });

    scrollerEl.querySelectorAll('[data-share-id]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const shId = btn.getAttribute('data-share-id');
        const found = allReels.find((item) => String(item.id) === String(shId)) || { id: shId };
        shareReelLink(found);
      });
    });

    scrollerEl.querySelectorAll('.slide-delete-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const delId = btn.getAttribute('data-delete-id');
        const found = allReels.find((item) => String(item.id) === String(delId)) || { id: delId };
        openDeleteReelModal(found);
      });
    });

    if (focusedReelId) {
      const targetSlide = scrollerEl.querySelector(`.reel-snap-slide[data-reel-id="${CSS.escape(focusedReelId)}"]`);
      if (targetSlide) {
        const idxAttr = Number(targetSlide.getAttribute('data-index') || 0);
        currentSlideIndex = idxAttr;
        updateSlideCounter(list.length);
        targetSlide.scrollIntoView({ behavior: 'auto', block: 'start' });
      }
    }

    setupActiveSlideAutoplay();
  }

  function setupActiveSlideAutoplay() {
    const slides = scrollerEl.querySelectorAll('.reel-snap-slide');
    if (!slides.length || !('IntersectionObserver' in window)) return;

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          const slideIdx = Number(entry.target.getAttribute('data-index') || 0);
          const iframe = entry.target.querySelector('iframe');

          if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
            currentSlideIndex = slideIdx;
            updateSlideCounter(slides.length);
            syncNavigationLinks();
          }

          if (!iframe || !iframe.contentWindow) return;
          try {
            const vid = iframe.contentWindow.document.getElementById('reelVideo');
            if (vid) {
              if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
                applySoundBoostToVideo(vid);
                vid.play().catch(() => {});
              } else {
                vid.pause();
              }
            }
          } catch (e) {}
        });
      },
      { root: scrollerEl, threshold: [0.6] }
    );

    slides.forEach((s) => observer.observe(s));
  }

  async function triggerReloadAllReels() {
    if (pullIconEl) pullIconEl.classList.add('fa-spin');
    if (pullTextEl) pullTextEl.textContent = 'Refreshing...';
    pullIndicatorEl?.classList.add('visible');

    await resolveStandaloneSessionAndProfile();
    loadLocalLists();
    await fetchReelsFromSources();
    renderVerticalReelsFeed();

    if (pullTextEl) pullTextEl.textContent = 'Updated';
    setTimeout(() => {
      pullIndicatorEl?.classList.remove('visible');
      if (pullIconEl) pullIconEl.classList.remove('fa-spin');
      if (pullTextEl) pullTextEl.textContent = 'Pull to refresh';
    }, 550);
  }

  /* Pull-to-refresh gesture when pulled downward at top of scroller */
  let touchStartY = 0;
  let isPullingTop = false;
  let pullTriggered = false;

  scrollerEl.addEventListener('touchstart', (e) => {
    if (scrollerEl.scrollTop <= 2 && e.touches.length === 1) {
      touchStartY = e.touches[0].clientY;
      isPullingTop = true;
      pullTriggered = false;
    } else {
      isPullingTop = false;
    }
  }, { passive: true });

  scrollerEl.addEventListener('touchmove', (e) => {
    if (!isPullingTop || scrollerEl.scrollTop > 2) return;
    const deltaY = e.touches[0].clientY - touchStartY;
    if (deltaY > 18) {
      pullIndicatorEl?.classList.add('visible');
      if (deltaY > 85) {
        pullTriggered = true;
        if (pullTextEl) pullTextEl.textContent = 'Release to reload';
      } else if (pullTextEl) {
        pullTextEl.textContent = 'Pull down to reload';
      }
    }
  }, { passive: true });

  scrollerEl.addEventListener('touchend', async () => {
    if (!isPullingTop) return;
    isPullingTop = false;
    if (pullTriggered) {
      pullTriggered = false;
      await triggerReloadAllReels();
    } else {
      pullIndicatorEl?.classList.remove('visible');
    }
  });

  document.getElementById('nextReelBtn').addEventListener('click', () => {
    requestFullScreenView();
    scrollToNextReel();
  });

  document.getElementById('toggleGlobalMuteBtn').addEventListener('click', () => {
    requestFullScreenView();
    soundModeLevel = (soundModeLevel + 1) % 4;
    syncSoundAcrossAllSlides();

    const labels = {
      0: 'Sound Muted (0%)',
      1: 'Sound Normal (100%)',
      2: 'Sound Enhanced (150%)',
      3: 'Sound Boost Max (200%)'
    };
    showToast(labels[soundModeLevel] || 'Sound Enhanced');
  });

  window.addEventListener('message', async (event) => {
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'PROFILE_AVATAR_UPDATED') {
      setBottomProfileAvatar(data.avatar_url || '');
    } else if (data.type === 'NAVIGATE' && data.url) {
      window.location.href = data.url;
    } else if ((data.type === 'DELETE_REEL' || data.type === 'DELETE_REEL_CARD' || data.type === 'REEL_DELETED') && (data.reel_id || data.reelId || data.id)) {
      const delId = String(data.reel_id || data.reelId || data.id);
      removeReelFromLocalStores(delId);
      allReels = allReels.filter((item) => String(item.id) !== delId);
      renderVerticalReelsFeed();
      syncNavigationLinks();
    }
  });

  if (reelSyncChannel) {
    reelSyncChannel.onmessage = (ev) => {
      const msg = ev?.data;
      if (!msg || typeof msg !== 'object') return;
      if ((msg.type === 'DELETE_REEL_CARD' || msg.type === 'REEL_DELETED') && (msg.reelId || msg.id)) {
        const delId = String(msg.reelId || msg.id);
        removeReelFromLocalStores(delId);
        allReels = allReels.filter((item) => String(item.id) !== delId);
        renderVerticalReelsFeed();
        syncNavigationLinks();
      } else if (msg.type === 'NEW_REEL_CREATED' || msg.type === 'REEL_UPDATED') {
        loadLocalLists();
        fetchReelsFromSources().then(() => renderVerticalReelsFeed());
      }
    };
  }

  window.addEventListener('storage', async (event) => {
    if (event.key === 'autrobook_profile' || event.key === 'autro_profile_avatar') {
      await resolveStandaloneSessionAndProfile();
    }
    if (
      event.key === 'reels' ||
      event.key === 'autrobook_live_reels' ||
      event.key === 'autrobook_reels_queue' ||
      event.key === 'autro_reels' ||
      event.key === 'autrobook_reels' ||
      event.key === 'autro_instant_reels' ||
      event.key === 'autro_new_reel_created' ||
      event.key === 'autro_deleted_reel_ids' ||
      event.key === 'autrobook_saved_reels' ||
      event.key === 'autrobook_drafts'
    ) {
      loadLocalLists();
      await fetchReelsFromSources();
      renderVerticalReelsFeed();
    }
  });

  window.addEventListener('autrobook:reel-created', async () => {
    loadLocalLists();
    await fetchReelsFromSources();
    renderVerticalReelsFeed();
  });

  window.addEventListener('pageshow', async () => {
    loadLocalLists();
    await resolveStandaloneSessionAndProfile();
    await fetchReelsFromSources();
    renderVerticalReelsFeed();
  });

  document.querySelectorAll('#filterTabsRow .filter-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filterTabsRow .filter-chip').forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.getAttribute('data-filter') || 'all';
      currentSlideIndex = 0;
      renderVerticalReelsFeed();
    });
  });

  sortSelectEl.addEventListener('change', () => {
    sortMode = sortSelectEl.value || 'newest';
    currentSlideIndex = 0;
    renderVerticalReelsFeed();
  });

  searchInputEl.addEventListener('input', () => {
    searchQuery = searchInputEl.value;
    currentSlideIndex = 0;
    renderVerticalReelsFeed();
  });

  document.getElementById('clearUserFilterBtn').addEventListener('click', () => {
    targetUserId = '';
    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete('user_id');
    window.history.replaceState({}, '', cleanUrl.toString());
    currentSlideIndex = 0;
    renderVerticalReelsFeed();
  });

  document.addEventListener('DOMContentLoaded', async () => {
    syncNavigationLinks();
    syncSoundAcrossAllSlides();
    loadLocalLists();
    await resolveStandaloneSessionAndProfile();
    await fetchReelsFromSources();
    renderVerticalReelsFeed();

    if (supabaseClient && typeof supabaseClient.channel === 'function') {
      try {
        supabaseClient
          .channel('autrobook-live-reels')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts', filter: 'is_reel=eq.true' }, async () => {
            await fetchReelsFromSources();
            renderVerticalReelsFeed();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'reels' }, async () => {
            await fetchReelsFromSources();
            renderVerticalReelsFeed();
          })
          .subscribe();
      } catch (e) {}
    }
  });
</script>
</body>
  </html>
