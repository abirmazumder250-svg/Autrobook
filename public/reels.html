<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg-color: #ffffff;
    --surface-color: #ffffff;
    --card-bg: #f8fafc;
    --input-bg: #f1f5f9;
    --text-color: #0f172a;
    --muted-color: #5f6368;
    --border-color: #e5e7eb;
    --hover-color: rgba(0, 0, 0, 0.06);

    /* System Default Button Tokens (Light: #FFFFFF surface / #202124 text) */
    --btn-bg: #ffffff;
    --btn-hover-bg: #f3f4f6;
    --btn-text: #202124;
    --btn-border: #d1d5db;
    --btn-active-bg: #202124;
    --btn-active-text: #ffffff;

    --reel-stage-bg: #0f1412;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #202124;
      --surface-color: #202124;
      --card-bg: #292a2d;
      --input-bg: #303134;
      --text-color: #f1f5f9;
      --muted-color: #9aa0a6;
      --border-color: #3c4043;
      --hover-color: rgba(255, 255, 255, 0.08);

      /* System Default Button Tokens (Dark: #202124 surface / #FFFFFF text) */
      --btn-bg: #202124;
      --btn-hover-bg: #2c2d30;
      --btn-text: #ffffff;
      --btn-border: #3c4043;
      --btn-active-bg: #ffffff;
      --btn-active-text: #202124;

      --reel-stage-bg: #121316;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Header */
  .reels-header {
    background: var(--surface-color);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 25;
    flex-shrink: 0;
  }

  .header-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .header-brand-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .back-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 14px;
    flex-shrink: 0;
  }

  .back-btn:hover {
    background: var(--btn-hover-bg);
  }

  .brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .reels-pill {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .header-right-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .circle-action-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }

  .circle-action-btn:hover {
    background: var(--btn-hover-bg);
  }

  .search-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 8px 14px;
    color: var(--muted-color);
  }

  .search-bar-wrap input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-color);
    font-size: 13.5px;
    outline: none;
  }

  .filter-tabs-row {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filter-tabs-row::-webkit-scrollbar {
    display: none;
  }

  .filter-chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-chip:hover {
    background: var(--btn-hover-bg);
  }

  .filter-chip.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }

  .user-filter-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .user-filter-banner.show {
    display: flex;
  }

  .clear-filter-btn {
    border: 1px solid var(--btn-border);
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Vertical Snap Feed Container */
  .reels-feed-scroller {
    flex: 1;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    background: var(--reel-stage-bg);
    position: relative;
  }

  .reels-feed-scroller::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  .reel-snap-slide {
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0;
  }

  .reel-card-frame-shell {
    width: 100%;
    height: 100%;
    border-radius: 0;
    overflow: hidden;
    background: #000000;
    position: relative;
  }

  .reel-card-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #000000;
  }

  .floating-create-fab {
    position: fixed;
    right: 16px;
    bottom: 76px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1.5px solid var(--btn-border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    text-decoration: none;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    z-index: 22;
  }

  .floating-create-fab:hover {
    background: var(--btn-hover-bg);
  }

  .empty-state-box {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    color: #f1f5f9;
  }

  .empty-cta-btn {
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    text-decoration: none;
    font-weight: 700;
    font-size: 13.5px;
  }

  .empty-cta-btn:hover {
    background: var(--btn-hover-bg);
  }

  /* Bottom Navigation */
  .bottom-nav {
    height: 58px;
    background: var(--surface-color);
    border-top: 1px solid var(--border-color);
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    align-items: center;
    flex-shrink: 0;
    z-index: 30;
  }

  .nav-item {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-decoration: none;
    color: var(--muted-color);
    font-size: 18px;
    position: relative;
    transition: color 0.15s ease;
  }

  .nav-item span {
    font-size: 10px;
    font-weight: 600;
  }

  .nav-item.active {
    color: var(--btn-text);
  }

  .nav-item.active::after {
    content: "";
    position: absolute;
    top: 0;
    width: 34px;
    height: 3px;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
    background: var(--btn-text);
  }

  .nav-profile-avatar-slot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--border-color);
    background: transparent;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .nav-item.active .nav-profile-avatar-slot {
    border-color: var(--btn-text);
  }

  .nav-profile-avatar-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<header class="reels-header">
  <div class="header-top-row">
    <div class="header-brand-left">
      <a href="/index.html" class="back-btn" id="backToIndexBtn" title="Back to Home">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <span class="brand-title">Autrobook</span>
      <span class="reels-pill">Reels</span>
    </div>

    <div class="header-right-actions">
      <button type="button" class="circle-action-btn" id="toggleGlobalMuteBtn" title="Toggle Sound">
        <i class="fa-solid fa-volume-high" id="globalMuteIcon"></i>
      </button>
      <a href="/create-reels.html" class="circle-action-btn create-reel-plus-link" id="headerCreateReelBtn" title="Create Reel">
        <i class="fa-solid fa-plus"></i>
      </a>
    </div>
  </div>

  <div class="search-bar-wrap">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search" id="reelSearchInput" placeholder="Search reels, people...">
  </div>

  <div class="filter-tabs-row" id="filterTabsRow">
    <button type="button" class="filter-chip active" data-filter="all">All Reels</button>
    <button type="button" class="filter-chip" data-filter="following">Following</button>
    <button type="button" class="filter-chip" data-filter="saved">Saved</button>
    <button type="button" class="filter-chip" data-filter="mine">My Reels</button>
  </div>

  <div class="user-filter-banner" id="userFilterBanner">
    <span id="userFilterLabel">Filtered by creator</span>
    <button type="button" class="clear-filter-btn" id="clearUserFilterBtn">Show All</button>
  </div>
</header>

<main class="reels-feed-scroller" id="reelsFeedScroller">
  <div class="empty-state-box" id="loadingState">
    <i class="fa-solid fa-clapperboard" style="font-size:28px;color:var(--btn-text);"></i>
    <div style="font-weight:700;font-size:15px;">Loading Reels Feed...</div>
  </div>
</main>

<a href="/create-reels.html" class="floating-create-fab create-reel-plus-link" id="floatingCreateReelBtn" title="Create New Reel">
  <i class="fa-solid fa-plus"></i>
</a>

<nav class="bottom-nav" aria-label="Main Navigation">
  <a href="/index.html" class="nav-item" id="navHomeLink" title="Home">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>
  <a href="/reels.html" class="nav-item active" id="navReelsLink" title="Reels">
    <i class="fa-solid fa-clapperboard"></i>
    <span>Reels</span>
  </a>
  <a href="/friend-request.html" class="nav-item" title="Friends">
    <i class="fa-solid fa-user-group"></i>
    <span>Friends</span>
  </a>
  <a href="/groups.html" class="nav-item" title="Groups">
    <i class="fa-solid fa-users"></i>
    <span>Groups</span>
  </a>
  <a href="/notifications.html" class="nav-item" title="Notifications">
    <i class="fa-solid fa-bell"></i>
    <span>Alerts</span>
  </a>
  <a href="/profile.html" class="nav-item" id="bottomProfileLink" title="Profile">
    <span class="nav-profile-avatar-slot" id="bottomProfileAvatarSlot"></span>
    <span>Profile</span>
  </a>
</nav>

<script>
  const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

  const supabaseClient = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  const urlParams = new URLSearchParams(window.location.search);
  let targetUserId = urlParams.get('user_id') || '';
  const focusedReelId = urlParams.get('reel') || urlParams.get('id') || '';
  let activeFilter = 'all';
  let searchQuery = '';
  let globalSoundEnabled = true;
  let currentUserId = null;
  let allReels = [];
  let followingIds = new Set();
  let savedReelIds = new Set();

  const scrollerEl = document.getElementById('reelsFeedScroller');
  const searchInputEl = document.getElementById('reelSearchInput');
  const userFilterBanner = document.getElementById('userFilterBanner');
  const userFilterLabel = document.getElementById('userFilterLabel');
  const bottomProfileAvatarSlot = document.getElementById('bottomProfileAvatarSlot');

  function getCreateReelsUrl() {
    const createUrl = new URL('/create-reels.html', window.location.origin);
    createUrl.searchParams.set('return_to', '/reels.html');
    if (currentUserId) createUrl.searchParams.set('user_id', currentUserId);
    return createUrl.toString();
  }

  function syncCreateReelLinks() {
    const targetUrl = getCreateReelsUrl();
    document.querySelectorAll('.create-reel-plus-link').forEach((el) => {
      el.setAttribute('href', targetUrl);
      el.onclick = (e) => {
        e.preventDefault();
        window.location.href = targetUrl;
      };
    });
  }

  function escapeAttr(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function setBottomProfileAvatar(avatarUrl) {
    const cleanUrl = (avatarUrl || '').trim();
    if (!cleanUrl) {
      bottomProfileAvatarSlot.innerHTML = '';
      return;
    }
    bottomProfileAvatarSlot.innerHTML = `<img src="${escapeAttr(cleanUrl)}" alt="Profile">`;
  }

  async function syncProfileAvatarFromSupabase() {
    let localAvatar = '';
    try {
      const savedProfile = JSON.parse(localStorage.getItem('autrobook_profile') || '{}');
      localAvatar = savedProfile.avatar_url || savedProfile.avatar || localStorage.getItem('autro_profile_avatar') || '';
    } catch (e) {
      localAvatar = localStorage.getItem('autro_profile_avatar') || '';
    }

    if (localAvatar) {
      setBottomProfileAvatar(localAvatar);
    }

    if (!supabaseClient) return;

    try {
      const { data } = await supabaseClient.auth.getUser();
      if (data?.user?.id) {
        currentUserId = data.user.id;
        document.getElementById('bottomProfileLink').href = `/profile.html?user=${encodeURIComponent(currentUserId)}`;
        syncCreateReelLinks();

        const metaAvatar = data.user.user_metadata?.avatar_url || '';
        const { data: prof } = await supabaseClient
          .from('profiles')
          .select('avatar_url')
          .eq('id', currentUserId)
          .maybeSingle();

        const resolvedAvatar = prof?.avatar_url || metaAvatar || localAvatar || '';
        setBottomProfileAvatar(resolvedAvatar);
      }
    } catch (e) {}
  }

  function buildCardIframeSrc(reel) {
    const u = new URL('/reels-card.html', window.location.origin);
    u.searchParams.set('id', reel.id);
    u.searchParams.set('reel', reel.id);
    if (reel.user_id) u.searchParams.set('user_id', reel.user_id);
    if (reel.author_name) u.searchParams.set('author', reel.author_name);
    if (reel.author_avatar) u.searchParams.set('avatar', reel.author_avatar);
    if (reel.media_url) u.searchParams.set('media', reel.media_url);
    if (reel.media_type) u.searchParams.set('type', reel.media_type);
    if (reel.caption) u.searchParams.set('caption', reel.caption);
    if (reel.audio_name) u.searchParams.set('audio', reel.audio_name);
    if (reel.quality) u.searchParams.set('quality', reel.quality);
    if (reel.audience) u.searchParams.set('audience', reel.audience);
    u.searchParams.set('from', '/reels.html');
    u.searchParams.set('home', '/index.html');
    u.searchParams.set('embedded', '1');
    return u.toString();
  }

  function normalizeReelRecord(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const id = String(raw.id || raw.reel_id || raw.created_at || '').trim();
    const mediaUrl = String(raw.media_url || raw.video_url || raw.url || '').trim();
    if (!id && !mediaUrl) return null;

    return {
      id: id || `reel-${Date.now()}`,
      user_id: raw.user_id || raw.author_id || currentUserId || '',
      author_name: raw.author_name || raw.username || raw.user_name || 'Autrobook User',
      author_avatar: raw.author_avatar || raw.avatar_url || '',
      media_url: mediaUrl,
      media_type: raw.media_type || (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(mediaUrl) ? 'video/mp4' : 'video'),
      caption: raw.caption || raw.title || raw.description || '',
      audio_name: raw.audio_name || raw.music || 'Original Audio',
      quality: raw.quality || 'HD',
      audience: raw.audience || 'Public',
      likes: Number(raw.likes ?? raw.reaction_count ?? 0),
      created_at: raw.created_at || new Date().toISOString()
    };
  }

  function loadLocalLists() {
    savedReelIds.clear();
    try {
      const drafts = JSON.parse(localStorage.getItem('autrobook_drafts') || '[]');
      drafts.forEach((d) => {
        if (d.items?.[0]?.src) savedReelIds.add(d.items[0].src);
        if (d.id) savedReelIds.add(d.id);
      });
    } catch (e) {}

    try {
      const saved = JSON.parse(localStorage.getItem('autrobook_saved_reels') || '[]');
      saved.forEach((id) => savedReelIds.add(id));
    } catch (e) {}
  }

  async function fetchApiReels() {
    try {
      const res = await fetch('/api/reels', { cache: 'no-store' });
      if (!res.ok) return [];
      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) return [];
      const json = await res.json();
      if (Array.isArray(json)) return json;
      if (Array.isArray(json?.reels)) return json.reels;
      if (Array.isArray(json?.data)) return json.data;
      return [];
    } catch (e) {
      return [];
    }
  }

  async function fetchReelsFromSources() {
    const localKeys = [
      'autrobook_live_reels',
      'autro_reels',
      'autrobook_reels',
      'autro_instant_reels'
    ];
    const localReels = [];

    localKeys.forEach((key) => {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(parsed)) localReels.push(...parsed);
      } catch (e) {}
    });

    try {
      const singleNew = JSON.parse(localStorage.getItem('autro_new_reel_created') || 'null');
      if (singleNew && typeof singleNew === 'object') localReels.unshift(singleNew);
    } catch (e) {}

    const apiReels = await fetchApiReels();
    let remoteReels = [];

    if (supabaseClient) {
      try {
        const { data } = await supabaseClient
          .from('reels')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(80);
        if (Array.isArray(data)) remoteReels.push(...data);
      } catch (e) {}

      try {
        const { data: postReels } = await supabaseClient
          .from('posts')
          .select('*')
          .eq('is_reel', true)
          .order('created_at', { ascending: false })
          .limit(40);
        if (Array.isArray(postReels)) remoteReels.push(...postReels);
      } catch (e) {}

      if (currentUserId) {
        try {
          const { data: friendsData } = await supabaseClient
            .from('friends')
            .select('user_id, friend_id')
            .or(`user_id.eq.${currentUserId},friend_id.eq.${currentUserId}`);
          (friendsData || []).forEach((row) => {
            const otherId = row.user_id === currentUserId ? row.friend_id : row.user_id;
            if (otherId) followingIds.add(otherId);
          });
        } catch (e) {}
      }
    }

    const map = new Map();
    [...apiReels, ...remoteReels, ...localReels].forEach((raw) => {
      const norm = normalizeReelRecord(raw);
      if (norm && norm.id) {
        map.set(norm.id, { ...map.get(norm.id), ...norm });
      }
    });

    allReels = Array.from(map.values()).sort(
      (a, b) => new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime()
    );
  }

  function getFilteredReels() {
    const q = searchQuery.trim().toLowerCase();
    const storedUserId = currentUserId || localStorage.getItem('autro_user_id') || '';

    return allReels.filter((r) => {
      if (targetUserId && r.user_id !== targetUserId) {
        return false;
      }

      if (activeFilter === 'following') {
        if (!followingIds.has(r.user_id)) return false;
      } else if (activeFilter === 'saved') {
        if (!savedReelIds.has(r.id) && !savedReelIds.has(r.media_url)) return false;
      } else if (activeFilter === 'mine') {
        if (!storedUserId || r.user_id !== storedUserId) return false;
      }

      if (q) {
        const hay = `${r.caption || ''} ${r.author_name || ''} ${r.audio_name || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }

      return true;
    });
  }

  function updateUserFilterBanner(filteredList) {
    if (!targetUserId) {
      userFilterBanner.classList.remove('show');
      return;
    }
    const creatorName = filteredList[0]?.author_name || targetUserId;
    userFilterLabel.textContent = `Showing reels by ${creatorName}`;
    userFilterBanner.classList.add('show');
  }

  function renderVerticalReelsFeed() {
    const list = getFilteredReels();
    updateUserFilterBanner(list);

    if (!list.length) {
      const createHref = getCreateReelsUrl();
      scrollerEl.innerHTML = `
        <div class="empty-state-box">
          <i class="fa-solid fa-film" style="font-size:32px;color:#9aa0a6;"></i>
          <div style="font-size:15px;font-weight:700;">No reels match this view</div>
          <div style="font-size:12.5px;color:#9aa0a6;">Create a new reel or switch filters.</div>
          <a href="${escapeAttr(createHref)}" class="empty-cta-btn create-reel-plus-link"><i class="fa-solid fa-plus"></i> Create Reel</a>
        </div>
      `;
      syncCreateReelLinks();
      return;
    }

    scrollerEl.innerHTML = list.map((reel, idx) => {
      const iframeSrc = buildCardIframeSrc(reel);
      return `
        <section class="reel-snap-slide" data-index="${idx}" data-reel-id="${escapeAttr(reel.id)}">
          <div class="reel-card-frame-shell">
            <iframe
              src="${escapeAttr(iframeSrc)}"
              class="reel-card-iframe"
              title="Reel ${idx + 1}"
              allow="autoplay; encrypted-media; microphone"
              loading="${idx < 2 ? 'eager' : 'lazy'}"
            ></iframe>
          </div>
        </section>
      `;
    }).join('');

    if (focusedReelId) {
      const targetSlide = scrollerEl.querySelector(`.reel-snap-slide[data-reel-id="${CSS.escape(focusedReelId)}"]`);
      if (targetSlide) {
        targetSlide.scrollIntoView({ behavior: 'auto', block: 'start' });
      }
    }

    setupActiveSlideAutoplay();
  }

  function setupActiveSlideAutoplay() {
    const slides = scrollerEl.querySelectorAll('.reel-snap-slide');
    if (!slides.length || !('IntersectionObserver' in window)) return;

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          const iframe = entry.target.querySelector('iframe');
          if (!iframe || !iframe.contentWindow) return;
          try {
            const vid = iframe.contentWindow.document.getElementById('reelVideo');
            if (vid) {
              if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
                vid.muted = !globalSoundEnabled;
                vid.play().catch(() => {});
              } else {
                vid.pause();
              }
            }
          } catch (e) {}
        });
      },
      { root: scrollerEl, threshold: [0.6] }
    );

    slides.forEach((s) => observer.observe(s));
  }

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'PROFILE_AVATAR_UPDATED') {
      setBottomProfileAvatar(data.avatar_url || '');
    } else if (data.type === 'NAVIGATE' && data.url) {
      window.location.href = data.url;
    }
  });

  window.addEventListener('storage', async (event) => {
    if (event.key === 'autrobook_profile' || event.key === 'autro_profile_avatar') {
      await syncProfileAvatarFromSupabase();
    }
    if (
      event.key === 'autrobook_live_reels' ||
      event.key === 'autro_reels' ||
      event.key === 'autrobook_reels' ||
      event.key === 'autro_instant_reels' ||
      event.key === 'autro_new_reel_created' ||
      event.key === 'autrobook_saved_reels' ||
      event.key === 'autrobook_drafts'
    ) {
      loadLocalLists();
      await fetchReelsFromSources();
      renderVerticalReelsFeed();
    }
  });

  window.addEventListener('pageshow', async () => {
    loadLocalLists();
    await syncProfileAvatarFromSupabase();
    await fetchReelsFromSources();
    renderVerticalReelsFeed();
  });

  document.getElementById('toggleGlobalMuteBtn').addEventListener('click', () => {
    globalSoundEnabled = !globalSoundEnabled;
    document.getElementById('globalMuteIcon').className = globalSoundEnabled
      ? 'fa-solid fa-volume-high'
      : 'fa-solid fa-volume-xmark';

    scrollerEl.querySelectorAll('iframe').forEach((iframe) => {
      try {
        const vid = iframe.contentWindow?.document?.getElementById('reelVideo');
        if (vid) vid.muted = !globalSoundEnabled;
      } catch (e) {}
    });
  });

  document.querySelectorAll('#filterTabsRow .filter-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filterTabsRow .filter-chip').forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.getAttribute('data-filter') || 'all';
      renderVerticalReelsFeed();
    });
  });

  searchInputEl.addEventListener('input', () => {
    searchQuery = searchInputEl.value;
    renderVerticalReelsFeed();
  });

  document.getElementById('clearUserFilterBtn').addEventListener('click', () => {
    targetUserId = '';
    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete('user_id');
    window.history.replaceState({}, '', cleanUrl.toString());
    renderVerticalReelsFeed();
  });

  document.addEventListener('DOMContentLoaded', async () => {
    syncCreateReelLinks();
    loadLocalLists();
    await syncProfileAvatarFromSupabase();
    await fetchReelsFromSources();
    renderVerticalReelsFeed();

    if (supabaseClient && typeof supabaseClient.channel === 'function') {
      try {
        supabaseClient
          .channel('autrobook-live-reels')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'reels' }, async () => {
            await fetchReelsFromSources();
            renderVerticalReelsFeed();
          })
          .subscribe();
      } catch (e) {}
    }
  });
</script>
</body>
  </html>
