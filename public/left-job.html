<!DOCTYPE html>
<html lang="en" data-page="left-job.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create life event - Left job</title>
  <link rel="canonical" href="/left-job.html" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #28292d;
      --bg-card-hover: #323338;
      --bg-banner: #d8e7f2;
      --text-primary: #ffffff;
      --text-secondary: #9aa0a6;
      --text-muted: #757a82;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
      --accent-green-hover: #0f7642;
      --accent-blue: #1877f2;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f5f6f8;
        --bg-card-hover: #eaecf0;
        --bg-banner: #dceaf5;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --text-muted: #80868b;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
        --accent-green-hover: #084727;
        --accent-blue: #1877f2;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 19px;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .back-btn:hover {
      background: var(--bg-card);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .topbar-title-link {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: not-allowed;
      transition: color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    }

    .next-btn.active {
      color: var(--accent-green);
      background: rgba(11, 93, 52, 0.14);
      cursor: pointer;
    }

    .next-btn.active:hover {
      background: rgba(11, 93, 52, 0.22);
    }

    .next-btn.active:active {
      transform: scale(0.96);
    }

    /* BANNER AREA */
    .hero-banner-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .hero-banner {
      position: relative;
      width: 100%;
      height: 235px;
      background: var(--bg-banner);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-banner img.custom-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .default-illustration {
      position: relative;
      width: 250px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .mug-shape {
      position: absolute;
      left: 34px;
      bottom: 20px;
      width: 56px;
      height: 74px;
      background: #1464d8;
      border-radius: 6px 6px 22px 22px;
      z-index: 2;
    }

    .mug-shape::after {
      content: "";
      position: absolute;
      left: -12px;
      top: 14px;
      width: 16px;
      height: 36px;
      border: 7px solid #1464d8;
      border-right: none;
      border-radius: 14px 0 0 14px;
    }

    .briefcase-shape {
      position: relative;
      width: 136px;
      height: 94px;
      background: linear-gradient(180deg, #ffa738 0%, #f57c00 100%);
      border-radius: 12px;
      margin-left: 26px;
      margin-top: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
      z-index: 1;
    }

    .briefcase-handle {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 20px;
      border: 7px solid #ffb752;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    .briefcase-flap {
      position: absolute;
      top: 26px;
      left: 0;
      right: 0;
      height: 10px;
      background: rgba(120, 48, 0, 0.22);
    }

    .briefcase-clasp {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 24px;
      border-radius: 6px;
      background: #ffd13b;
    }

    .photo-chip-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(32, 33, 36, 0.72);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 7px 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .photo-chip-btn:hover {
      background: rgba(32, 33, 36, 0.88);
    }

    .photo-chip-btn:active {
      transform: scale(0.96);
    }

    .banner-clear-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 6;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(32, 33, 36, 0.72);
      color: #ffffff;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .banner-clear-btn:hover {
      background: rgba(32, 33, 36, 0.88);
    }

    .banner-clear-btn:active {
      transform: scale(0.94);
    }

    .center-badge {
      position: relative;
      margin: -24px auto 14px;
      z-index: 10;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: 3px solid var(--bg-page);
      color: #ffffff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    /* FORM FIELDS */
    .form-body {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 16px 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 62px;
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .input-card:focus-within {
      border-color: var(--accent-green);
    }

    .employer-card {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }

    .employer-card:hover {
      background: var(--bg-card-hover);
    }

    .field-caption {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    .employer-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .employer-text.selected {
      color: var(--text-primary);
      font-weight: 600;
    }

    .employer-chevron {
      color: var(--text-secondary);
      font-size: 14px;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .date-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .date-picker-hidden {
      position: relative;
      margin-top: 4px;
    }

    .date-picker-hidden input[type="date"] {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-green);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 120;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="/life-event.html" class="back-btn" aria-label="Back to life event" title="Back">
        <i class="fas fa-arrow-left"></i>
      </a>
      <a href="/left-job.html" class="topbar-title-link">Create life event</a>
    </div>

    <button type="button" id="nextBtn" class="next-btn" onclick="submitLeftJobToCreatePost()" disabled>
      NEXT
    </button>
  </header>

  <div class="hero-banner-wrap">
    <div id="heroBanner" class="hero-banner">
      <button type="button" class="photo-chip-btn" onclick="openGalleryPicker()">
        <i class="far fa-image"></i>
        <span>Photo</span>
      </button>

      <button type="button" class="banner-clear-btn" onclick="clearBannerPhoto()" aria-label="Remove photo" title="Remove">
        <i class="fas fa-xmark"></i>
      </button>

      <div id="defaultIllustration" class="default-illustration">
        <div class="mug-shape"></div>
        <div class="briefcase-shape">
          <div class="briefcase-handle"></div>
          <div class="briefcase-flap"></div>
          <div class="briefcase-clasp"></div>
        </div>
      </div>

      <img id="customBannerImg" class="custom-photo" alt="Selected left job photo" style="display:none;" />
    </div>

    <div class="center-badge" aria-hidden="true">
      <i class="fas fa-briefcase"></i>
    </div>
  </div>

  <main class="form-body">
    <div class="input-card">
      <label for="leftJobTitleInput" class="field-caption">Title</label>
      <input
        type="text"
        id="leftJobTitleInput"
        class="title-input"
        maxlength="120"
        value="Left job"
        oninput="saveCurrentDraft()"
      />
    </div>

    <button type="button" class="input-card employer-card" onclick="goToChecklistPage()">
      <div>
        <span id="employerDisplayText" class="employer-text">Add an employer (required)</span>
      </div>
      <i class="fas fa-chevron-right employer-chevron"></i>
    </button>

    <div class="input-card">
      <div class="field-caption">Date:</div>
      <div id="dateLabelText" class="date-value">Nov 28, 2026</div>
      <div class="date-picker-hidden">
        <input type="date" id="leftJobDateInput" onchange="handleDateChange()" />
      </div>
    </div>
  </main>

  <input type="file" id="galleryPhotoInput" accept="image/*" style="display:none;" onchange="handleGalleryPhotoSelected(event)" />

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const LEFT_JOB_PAGE_URL = '/left-job.html';
    const CREATE_POST_PAGE_URL = '/create-post.html';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const LEFT_JOB_DRAFT_KEY = 'autro_left_job_draft';
    const CHECKLIST_SELECTED_KEY = 'autro_selected_employer';
    const LIFE_EVENT_SAVED_KEY = 'autro_life_event';
    const LIFE_EVENT_PHOTO_KEY = 'autro_life_event_photo';
    const POST_DRAFT_KEY = 'autro_create_post_draft';

    let selectedEmployer = '';
    let selectedPhotoDataUrl = '';
    let photoRemovedManually = false;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._ljToastTimer);
      window._ljToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function openGalleryPicker() {
      document.getElementById('galleryPhotoInput').click();
    }

    function safeWriteStore(key, val) {
      const str = String(val || '');
      try { sessionStorage.setItem(key, str); } catch (_) {}
      try { localStorage.setItem(key, str); } catch (_) {}
      try {
        let state = {};
        if (window.name && window.name.startsWith('AUTRO_STATE:')) {
          state = JSON.parse(window.name.slice('AUTRO_STATE:'.length)) || {};
        }
        if (str) state[key] = str;
        else delete state[key];
        const nextName = 'AUTRO_STATE:' + JSON.stringify(state);
        if (nextName.length < 1800000) window.name = nextName;
      } catch (_) {}
    }

    function safeReadStore(key) {
      try {
        const s = sessionStorage.getItem(key);
        if (s) return s;
      } catch (_) {}
      try {
        const l = localStorage.getItem(key);
        if (l) return l;
      } catch (_) {}
      try {
        if (window.name && window.name.startsWith('AUTRO_STATE:')) {
          const state = JSON.parse(window.name.slice('AUTRO_STATE:'.length)) || {};
          if (state[key]) return String(state[key]);
        }
      } catch (_) {}
      return '';
    }

    function compressImageFileToDataUrl(file, maxWidth = 960, quality = 0.72) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith('image/')) return resolve('');
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.naturalWidth || img.width || maxWidth;
            const h = img.naturalHeight || img.height || maxWidth;
            const scale = Math.min(1, maxWidth / w);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(w * scale));
            canvas.height = Math.max(1, Math.round(h * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            URL.revokeObjectURL(objectUrl);
            resolve(dataUrl);
          } catch (_) {
            URL.revokeObjectURL(objectUrl);
            resolve('');
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        };
        img.src = objectUrl;
      });
    }

    function renderBannerVisual() {
      const imgEl = document.getElementById('customBannerImg');
      const defEl = document.getElementById('defaultIllustration');

      if (selectedPhotoDataUrl) {
        imgEl.src = selectedPhotoDataUrl;
        imgEl.style.display = 'block';
        defEl.style.display = 'none';
      } else {
        imgEl.src = '';
        imgEl.style.display = 'none';
        defEl.style.display = photoRemovedManually ? 'none' : 'flex';
      }
    }

    async function handleGalleryPhotoSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      let dataUrl = await compressImageFileToDataUrl(file, 960, 0.72);
      if (!dataUrl && file.size <= 1600000) {
        dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });
      }

      if (dataUrl) {
        selectedPhotoDataUrl = dataUrl;
        photoRemovedManually = false;
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, dataUrl);
        renderBannerVisual();
        saveCurrentDraft();
        showToast('Photo selected');
      } else {
        showToast('Unable to load photo');
      }
    }

    function clearBannerPhoto() {
      selectedPhotoDataUrl = '';
      photoRemovedManually = true;
      document.getElementById('galleryPhotoInput').value = '';
      safeWriteStore(LIFE_EVENT_PHOTO_KEY, '');
      renderBannerVisual();
      saveCurrentDraft();
    }

    function getLiveLocalIsoDate() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatLiveDateLabel(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return isoDate;
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return dt.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function handleDateChange() {
      const val = document.getElementById('leftJobDateInput').value || getLiveLocalIsoDate();
      document.getElementById('dateLabelText').textContent = formatLiveDateLabel(val);
      saveCurrentDraft();
    }

    function updateNextButtonState() {
      const btn = document.getElementById('nextBtn');
      const empEl = document.getElementById('employerDisplayText');
      const hasEmployer = Boolean(String(selectedEmployer || '').trim());

      if (hasEmployer) {
        empEl.textContent = selectedEmployer;
        empEl.classList.add('selected');
        btn.disabled = false;
        btn.classList.add('active');
      } else {
        empEl.textContent = 'Add an employer (required)';
        empEl.classList.remove('selected');
        btn.disabled = true;
        btn.classList.remove('active');
      }
    }

    function saveCurrentDraft() {
      const draft = {
        title: document.getElementById('leftJobTitleInput').value,
        employer: selectedEmployer,
        date: document.getElementById('leftJobDateInput').value,
        photoDataUrl: selectedPhotoDataUrl,
        photoRemovedManually
      };
      safeWriteStore(LEFT_JOB_DRAFT_KEY, JSON.stringify(draft));
      if (selectedPhotoDataUrl) {
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, selectedPhotoDataUrl);
      }
    }

    function goToChecklistPage() {
      saveCurrentDraft();
      window.location.href = 'checklist.html?from=left-job';
    }

    function extractEmployerFromStorage() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get('employer');
      if (fromUrl && fromUrl.trim()) return fromUrl.trim();

      try {
        const raw = localStorage.getItem(CHECKLIST_SELECTED_KEY) || sessionStorage.getItem(CHECKLIST_SELECTED_KEY);
        if (!raw) return '';
        try {
          const parsed = JSON.parse(raw);
          if (typeof parsed === 'string') return parsed.trim();
          if (Array.isArray(parsed) && parsed.length) {
            return parsed.map(x => typeof x === 'string' ? x : (x?.name || x?.title || '')).filter(Boolean).join(', ');
          }
          if (parsed && typeof parsed === 'object') {
            return String(parsed.name || parsed.employer || parsed.title || '').trim();
          }
        } catch (_) {
          return String(raw).trim();
        }
      } catch (_) {}
      return '';
    }

    function restoreLeftJobState() {
      const liveIsoDate = getLiveLocalIsoDate();
      document.getElementById('leftJobDateInput').value = liveIsoDate;
      document.getElementById('dateLabelText').textContent = formatLiveDateLabel(liveIsoDate);

      try {
        const rawDraft = safeReadStore(LEFT_JOB_DRAFT_KEY);
        if (rawDraft) {
          const d = JSON.parse(rawDraft);
          if (typeof d.title === 'string' && d.title.trim()) {
            document.getElementById('leftJobTitleInput').value = d.title;
          }
          if (typeof d.date === 'string' && d.date) {
            document.getElementById('leftJobDateInput').value = d.date;
            document.getElementById('dateLabelText').textContent = formatLiveDateLabel(d.date);
          }
          if (typeof d.photoDataUrl === 'string' && d.photoDataUrl) {
            selectedPhotoDataUrl = d.photoDataUrl;
          }
          photoRemovedManually = Boolean(d.photoRemovedManually);
          if (typeof d.employer === 'string' && d.employer) {
            selectedEmployer = d.employer;
          }
        }
      } catch (_) {}

      const storedPhoto = safeReadStore(LIFE_EVENT_PHOTO_KEY);
      if (storedPhoto && !photoRemovedManually) {
        selectedPhotoDataUrl = storedPhoto;
      }

      const pickedEmployer = extractEmployerFromStorage();
      if (pickedEmployer) {
        selectedEmployer = pickedEmployer;
      }

      renderBannerVisual();
      updateNextButtonState();
    }

    async function syncLeftJobToSupabase(payload) {
      if (!sb) return;
      try {
        const { data: { session } } = await sb.auth.getSession();
        const uid = session?.user?.id;
        if (!uid) return;
        await sb.from('life_events').insert({
          user_id: uid,
          category: payload.categoryLabel,
          sub_category: payload.subCategory,
          title: payload.title,
          employer: payload.employer,
          event_date: payload.date,
          photo_url: payload.photoUrl || null
        });
      } catch (_) {}
    }

    async function submitLeftJobToCreatePost() {
      const empName = String(selectedEmployer || '').trim();
      if (!empName) {
        showToast('Please select an employer first');
        return;
      }

      const titleVal = document.getElementById('leftJobTitleInput').value.trim() || 'Left job';
      const dateVal = document.getElementById('leftJobDateInput').value || getLiveLocalIsoDate();
      const dateDisplay = formatLiveDateLabel(dateVal);
      const photoToPass = selectedPhotoDataUrl || safeReadStore(LIFE_EVENT_PHOTO_KEY) || '';

      const formattedText = `[Work · Left Job] ${titleVal} at ${empName} (${dateDisplay})`;

      const lifeEventPayload = {
        categoryId: 'career',
        categoryLabel: 'Work',
        subCategory: 'Left Job',
        title: titleVal,
        employer: empName,
        date: dateDisplay,
        rawDate: dateVal,
        photoUrl: photoToPass,
        photo_url: photoToPass,
        bannerUrl: photoToPass,
        image: photoToPass,
        photo: photoToPass,
        editUrl: LEFT_JOB_PAGE_URL,
        formattedText,
        savedAt: Date.now()
      };

      safeWriteStore(LIFE_EVENT_SAVED_KEY, JSON.stringify(lifeEventPayload));
      if (photoToPass) {
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, photoToPass);
      }

      try {
        sessionStorage.removeItem(LEFT_JOB_DRAFT_KEY);
        let existingDraft = {};
        const rawPostDraft = safeReadStore(POST_DRAFT_KEY);
        if (rawPostDraft) {
          existingDraft = JSON.parse(rawPostDraft) || {};
        }

        const prevCaption = String(existingDraft.caption || '').trim();
        existingDraft.caption = prevCaption ? `${prevCaption}\n\n${formattedText}` : formattedText;
        existingDraft.lifeEvent = lifeEventPayload;

        safeWriteStore(POST_DRAFT_KEY, JSON.stringify(existingDraft));
      } catch (_) {}

      await syncLeftJobToSupabase(lifeEventPayload);
      window.location.href = CREATE_POST_PAGE_URL;
    }

    window.addEventListener('DOMContentLoaded', () => {
      restoreLeftJobState();
    });
  </script>
</body>
  </html>
