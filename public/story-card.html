<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story Card & Profiles — Autrobook</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root {
      --bg-dark: #202124;
      --bg-elevated: #292a2d;
      --bg-sheet: #242528;
      --text-white: #ffffff;
      --text-muted: #b0b3b8;
      --border-line: rgba(255, 255, 255, 0.16);
      --danger: #d93025;
      --accent-green: #1e6b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    .story-shell {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      max-height: 920px;
      background: var(--bg-dark);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (min-width: 480px) {
      .story-shell {
        height: 94dvh;
        border-radius: 20px;
        border: 1px solid var(--border-line);
      }
    }

    .progress-track-group {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      gap: 5px;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--text-white);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .story-header {
      position: relative;
      z-index: 25;
      padding: 22px 14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(to bottom, rgba(32, 33, 36, 0.9), transparent);
    }

    .story-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .story-avatar-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--text-white);
      background: var(--bg-elevated);
      overflow: hidden;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .story-avatar-fallback {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .story-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }

    .story-author-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .story-author-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .privacy-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-white);
      border: 1px solid var(--border-line);
      white-space: nowrap;
    }

    .story-time-ago {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .story-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .icon-btn:hover {
      background: #3c4043;
    }

    .story-stage {
      position: relative;
      flex: 1;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      overflow: hidden;
      padding: 12px 16px;
      cursor: pointer;
    }

    .story-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .story-text-overlay {
      position: relative;
      z-index: 12;
      padding: 20px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
      color: var(--text-white);
      word-break: break-word;
      max-width: 100%;
    }

    .floating-reaction-burst {
      position: absolute;
      inset: 0;
      z-index: 28;
      pointer-events: none;
      overflow: hidden;
    }

    .burst-emoji {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      animation: floatUp 1.1s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.6);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, -30px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -170px) scale(0.9);
      }
    }

    .quick-replies-row {
      position: relative;
      z-index: 25;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 4px 14px 8px;
    }

    .quick-reply-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-reply-chip:hover {
      background: #3c4043;
    }

    .owner-controls {
      position: relative;
      z-index: 25;
      padding: 10px 14px 18px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .owner-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .owner-privacy-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .viewer-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .privacy-select {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .privacy-select option {
      background: var(--bg-dark);
      color: var(--text-white);
    }

    .specific-friends-btn {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .specific-friends-btn:hover {
      background: #3c4043;
    }

    .privacy-helper-text {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .viewers-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 58%;
      z-index: 40;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-line);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .viewers-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .viewers-drawer-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .viewers-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border-line);
    }

    .viewer-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-item-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--text-white);
    }

    .viewer-item-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-white);
      display: block;
    }

    .viewer-item-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .viewer-item-reaction {
      font-size: 1.2rem;
    }

    .viewer-controls {
      position: relative;
      z-index: 25;
      padding: 8px 12px 18px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reaction-picker-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
    }

    .reaction-btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      font-size: 1.3rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .reaction-btn:hover {
      transform: scale(1.18);
      background: rgba(255, 255, 255, 0.08);
    }

    .reaction-btn.is-selected {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 0 1.5px var(--text-white);
    }

    .viewer-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      border-radius: 999px;
      padding: 4px 6px 4px 14px;
    }

    .story-reply-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-white);
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    .story-reply-input::placeholder {
      color: var(--text-muted);
    }

    .send-reply-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--text-white);
      color: var(--bg-dark);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .active-reaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--text-white);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .active-reaction-badge:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-panel {
      width: 100%;
      max-height: 85%;
      background: var(--bg-sheet);
      border-top: 1px solid var(--border-line);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .sheet-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .sheet-option-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-option-btn:hover {
      background: #3c4043;
    }

    .sheet-option-btn.danger {
      color: #ff6b6b;
    }

    .modal-textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-dark);
      color: var(--text-white);
      padding: 10px 12px;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
    }

    .reason-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reason-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 0.84rem;
      cursor: pointer;
    }

    .friend-check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 0.86rem;
      cursor: pointer;
    }

    .friend-check-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sheet-actions-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .primary-action-btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent-green);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-action-btn {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .danger-action-btn {
      padding: 9px 14px;
      border-radius: 10px;
      border: none;
      background: var(--danger);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .status-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-height: 18px;
    }

    .profile-card-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding: 8px 4px;
    }

    .profile-card-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-green);
      background: var(--bg-elevated);
    }

    .profile-card-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .profile-card-bio {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.4;
      max-width: 100%;
    }

    .profile-card-stat {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-white);
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
    }

    .profile-posts-section {
      width: 100%;
      margin-top: 6px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile-posts-heading {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-white);
      border-top: 1px solid var(--border-line);
      padding-top: 10px;
    }

    .profile-post-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 0.84rem;
      color: var(--text-white);
      line-height: 1.4;
    }

    .profile-post-media {
      margin-top: 6px;
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="story-shell" id="storyShell">
    <div class="progress-track-group" id="progressTrackGroup"></div>

    <header class="story-header">
      <div class="story-user-info" id="authorProfileLink" title="Open profile">
        <div class="story-avatar-wrap">
          <img id="storyAuthorAvatar" src="" alt="" class="story-avatar hidden" />
          <span id="storyAvatarFallback" class="story-avatar-fallback"></span>
        </div>
        <div class="story-meta">
          <div class="story-author-row">
            <span id="storyAuthorName" class="story-author-name"></span>
            <span id="storyPrivacyBadge" class="privacy-badge">Public</span>
          </div>
          <span id="storyTimeAgo" class="story-time-ago"></span>
        </div>
      </div>

      <div class="story-header-actions">
        <button type="button" id="moreOptionsBtn" class="icon-btn" title="More options">⋯</button>
        <button type="button" id="togglePauseBtn" class="icon-btn" title="Pause / Resume">❚❚</button>
        <button type="button" id="closeStoryBtn" class="icon-btn" title="Close">✕</button>
      </div>
    </header>

    <main class="story-stage" id="storyStage" title="Click story card">
      <img id="storyMediaImage" class="story-media hidden" alt="Story media" />
      <video id="storyMediaVideo" class="story-media hidden" playsinline autoplay muted loop></video>
      <div id="storyTextOverlay" class="story-text-overlay hidden"></div>
      <div id="floatingReactionBurst" class="floating-reaction-burst"></div>
    </main>

    <div id="quickRepliesRow" class="quick-replies-row hidden">
      <button type="button" class="quick-reply-chip" data-reply="Stay sharp">Stay sharp</button>
      <button type="button" class="quick-reply-chip" data-reply="Nice vibe">Nice vibe</button>
    </div>

    <section id="ownerControls" class="owner-controls hidden">
      <div class="owner-top-row">
        <button type="button" id="openViewersBtn" class="viewer-pill-btn">
          <span>👁</span>
          <span id="viewerCountText">0 viewers</span>
        </button>

        <div class="owner-privacy-group">
          <select id="privacySelect" class="privacy-select" aria-label="Story Privacy">
            <option value="public">Public</option>
            <option value="friends">Friends</option>
            <option value="specific">Specific Friends</option>
          </select>
          <button type="button" id="selectSpecificFriendsBtn" class="specific-friends-btn hidden">
            Select Friends
          </button>
        </div>
      </div>
      <p id="privacyHelperText" class="privacy-helper-text">
        Public: Everyone including friends can see this story.
      </p>
    </section>

    <aside id="viewersDrawer" class="viewers-drawer hidden">
      <div class="viewers-drawer-header">
        <h3 id="viewersDrawerTitle">Viewers</h3>
        <button type="button" id="closeViewersBtn" class="icon-btn">✕</button>
      </div>
      <ul id="viewersList" class="viewers-list"></ul>
    </aside>

    <section id="viewerControls" class="viewer-controls hidden">
      <div id="reactionPickerBar" class="reaction-picker-bar">
        <button type="button" class="reaction-btn" data-emoji="❤️" aria-label="Love">❤️</button>
        <button type="button" class="reaction-btn" data-emoji="👍" aria-label="Like">👍</button>
        <button type="button" class="reaction-btn" data-emoji="🥰" aria-label="Care">🥰</button>
        <button type="button" class="reaction-btn" data-emoji="😆" aria-label="Haha">😆</button>
        <button type="button" class="reaction-btn" data-emoji="😢" aria-label="Sad">😢</button>
        <button type="button" class="reaction-btn" data-emoji="😠" aria-label="Angry">😠</button>
        <button type="button" class="reaction-btn" data-emoji="😮" aria-label="Wow">😮</button>
      </div>

      <div class="viewer-bottom-row">
        <div class="message-input-wrap">
          <input
            type="text"
            id="storyReplyInput"
            class="story-reply-input"
            placeholder="Send message..."
            autocomplete="off"
          />
          <button type="button" id="sendReplyBtn" class="send-reply-btn" title="Send message">➤</button>
        </div>

        <button type="button" id="activeReactionBadge" class="active-reaction-badge hidden" title="Undo reaction">
          <span>↩</span>
          <span id="activeReactionEmoji"></span>
          <span>Undo</span>
        </button>
      </div>
    </section>

    <!-- User Profile Sheet (Other User) -->
    <div id="userProfileSheet" class="sheet-backdrop hidden">
      <div class="sheet-panel">
        <div class="sheet-header">
          <span class="sheet-title">User Profile</span>
          <button type="button" id="closeUserProfileBtn" class="icon-btn">✕</button>
        </div>

        <div class="profile-card-box">
          <img id="otherProfilePic" class="profile-card-avatar" src="default.jpg" alt="Profile picture" />
          <h3 id="otherProfileName" class="profile-card-name">Loading...</h3>

      function playReactSound(emoji) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const freqMap = {
          "❤️": 587.33,
          "👍": 523.25,
          "🥰": 659.25,
          "😆": 783.99,
          "😢": 392.0,
          "😠": 261.63,
          "😮": 880.0
        };
        const freq = freqMap[emoji] || 587.33;
        osc.type = emoji === "😠" ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq * 0.85, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + 0.14);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }

      function playUndoSound() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.16);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }

      async function deleteRowByFilter(queryString) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stories?${queryString}`, {
          method: "DELETE",
          headers: {
            ...getSupabaseHeaders(false),
            Prefer: "return=representation"

        return { ok: res.ok, status: res.status, count: Array.isArray(rows) ? rows.length : 0 };
      }

      async function deleteStoryFromSupabase(story) {
        const cleanId = String(story?.id || story?.storyId || story?.story_id || "").trim();
        if (cleanId) {
          try {
            let result = await deleteRowByFilter(`id=eq.${encodeURIComponent(cleanId)}`);
            if (result.ok && result.count === 0) {
              result = await deleteRowByFilter(`story_id=eq.${encodeURIComponent(cleanId)}`);
            }
            console.log("Supabase stories delete result:", result);
            if (!result.ok || result.count === 0) {
              console.warn("Supabase DB থেকে রো ডিলিট হয়নি—stories টেবিলের RLS DELETE policy বা id চেক করুন।");
            }
          } catch (err) {
            console.error("Supabase stories delete failed:", err);
          }
        }

        const rawUrl = String(story?.mediaUrl || story?.media_url || "").trim();
        const publicPrefix = "/storage/v1/object/public/stories/";
        const signPrefix = "/storage/v1/object/sign/stories/";
        let extractedPath = "";

        if (rawUrl.includes(publicPrefix)) {
          extractedPath = rawUrl.split(publicPrefix)[1].split("?")[0];
        } else if (rawUrl.includes(signPrefix)) {
          extractedPath = rawUrl.split(signPrefix)[1].split("?")[0];
        }

        if (extractedPath) {
          const decodedPath = decodeURIComponent(extractedPath);
          const encodedPath = encodeStoragePath(decodedPath);
          if (encodedPath) {
            try {
              const stRes = await fetch(
                `${SUPABASE_URL}/storage/v1/object/stories/${encodedPath}`,
                {
                  method: "DELETE",
                  headers: getSupabaseHeaders(false)
                }
              );
              const stBody = await stRes.text().catch(() => "");
              console.log("Supabase storage delete status:", stRes.status, stBody);
            } catch (err) {
              console.error("Supabase storage delete failed:", err);
            }
          }
        }
      }

        if (!raw || typeof raw !== "object") return null;

        if (!id) return null;

        const createdRaw = raw.createdAt || raw.created_at || raw.time || Date.now();

        const safeCreatedMs = Number.isNaN(createdMs) ? Date.now() : createdMs;
        const expiresRaw = raw.expires_at || raw.expiresAt;
        const expiresMs = expiresRaw ? new Date(expiresRaw).getTime() : (safeCreatedMs + FORTY_EIGHT_HOURS_MS);

        const mediaUrl = String(
          raw.mediaUrl || raw.media_url || raw.image || raw.image_url || raw.video_url || ""
        ).trim();
        const mediaType = String(
          raw.mediaType || raw.media_type || (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(mediaUrl) ? "video" : "image")
        ).toLowerCase();

        const rawPrivacy = String(raw.privacy || raw.audience || "public").toLowerCase();
        const privacy = rawPrivacy === "specific_friend" || rawPrivacy === "specific_friends"
          ? "specific"
          : (ALLOWED_PRIVACY.includes(rawPrivacy) ? rawPrivacy : "public");

        const allowedFriendIds = normalizeIdArray(
          raw.allowedFriendIds || raw.allowed_friend_ids || raw.specific_friend_ids
        );
        const ownerFriends = normalizeIdArray(
          raw.ownerFriends || raw.owner_friends || raw.friend_ids
        );

        return {
          ...raw,
          id,
          ownerId: String(raw.ownerId || raw.user_id || raw.author_id || "").trim(),
          authorName: String(raw.authorName || raw.author_name || raw.name || "").trim(),
          authorAvatar: String(raw.authorAvatar || raw.author_avatar || raw.avatar || "").trim(),
          mediaUrl,
          media_url: mediaUrl,
          mediaType: mediaType.startsWith("video") ? "video" : "image",
          text: String(raw.text ?? raw.caption ?? raw.title ?? "").trim(),
          privacy,
          ownerFriends,
          allowedFriendIds,
          createdAt: new Date(safeCreatedMs).toISOString(),
          expiresAtMs: Number.isNaN(expiresMs) ? (safeCreatedMs + FORTY_EIGHT_HOURS_MS) : expiresMs,
          viewers: Array.isArray(raw.viewers) ? raw.viewers : []
        };
      }

      function isExpired(story, nowMs = Date.now()) {
        const norm = normalizeStory(story);
        if (!norm) return true;
        if (nowMs >= norm.expiresAtMs) return true;
        const ms = new Date(norm.createdAt).getTime();
        if (Number.isNaN(ms)) return true;
        return nowMs - ms >= FORTY_EIGHT_HOURS_MS;
      }

      function syncAllStoryLists(validStories) {
        STORY_LIST_KEYS.forEach((key) => {
          try {
            const existing = readJson(key, []);
            if (Array.isArray(existing)) {
              const filtered = existing
                .map(normalizeStory)
                .filter((s) => s && !isExpired(s));
              writeJson(key, filtered);
            }
          } catch (_) {}
        });
        writeJson(STORAGE_KEYS.STORIES, validStories);
      }

      function getLocalActiveStories() {
        const nowMs = Date.now();
        const mergedMap = new Map();

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            arr.forEach((item) => {
              const norm = normalizeStory(item);
              if (!norm) return;
              if (isExpired(norm, nowMs)) {
                deleteStoryFromSupabase(norm);
                return;
              }
              mergedMap.set(norm.id, { ...mergedMap.get(norm.id), ...norm });
            });
          }
        });

        try {
          const sessionCard = JSON.parse(sessionStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_CARD) || "null");
          const normSession = normalizeStory(sessionCard);
          if (normSession) {
            if (isExpired(normSession, nowMs)) {
              sessionStorage.removeItem(STORAGE_KEYS.ACTIVE_STORY_CARD);
              deleteStoryFromSupabase(normSession);
            } else if (!mergedMap.has(normSession.id)) {
              mergedMap.set(normSession.id, normSession);
            }
          }
        } catch (_) {}

        const valid = Array.from(mergedMap.values()).sort(
          (a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime()
        );

        syncAllStoryLists(valid);
        return valid;
      }

      function getCurrentUser() {
        const stored = readJson(STORAGE_KEYS.CURRENT_USER, null);
        const localUid = localStorage.getItem("autro_user_id") || "";
        const localFriends = readJson("autrobook_friends_ids", []);
        if (stored && stored.id) {
          return {
            id: String(stored.id),
            name: stored.name || localStorage.getItem("autro_profile_name") || "",
            avatar: stored.avatar || localStorage.getItem("autro_profile_avatar") || "",
            friends: normalizeIdArray(stored.friends || localFriends)
          };
        }
        const params = new URLSearchParams(window.location.search);
        return {
          id: params.get("userId") || localUid || "",
          name: params.get("userName") || localStorage.getItem("autro_profile_name") || "",
          avatar: params.get("avatar") || localStorage.getItem("autro_profile_avatar") || "",
          friends: normalizeIdArray(localFriends)
        };
      }

      function isOwner(story) {
        if (!story || !currentUser || !currentUser.id || !story.ownerId) return false;
        return String(story.ownerId) === String(currentUser.id);
      }

      function canUserViewStory(story, user) {
        if (!story || isExpired(story)) return false;
        if (user && user.id && String(story.ownerId) === String(user.id)) return true;

        const privacy = ALLOWED_PRIVACY.includes(story.privacy) ? story.privacy : "public";
        const viewerId = user && user.id ? String(user.id) : "";

        if (privacy === "public") return true;

        if (privacy === "friends") {
          if (!viewerId) return false;
          const authorFriends = normalizeIdArray(story.ownerFriends);
          const userFriends = user ? normalizeIdArray(user.friends) : [];
          return authorFriends.includes(viewerId) || userFriends.includes(String(story.ownerId));
        }

        if (privacy === "specific") {
          if (!viewerId) return false;
          const allowed = normalizeIdArray(story.allowedFriendIds);
          return allowed.includes(viewerId);
        }

        return false;
      }

      function getPrivacyLabel(privacy) {
        if (privacy === "friends") return "Friends";
        if (privacy === "specific") return "Specific Friends";
        return "Public";
      }

      function getPrivacyHelperText(privacy, allowedCount = 0) {
        if (privacy === "friends") {
          return "Friends: Only your ID friends can see this story.";
        }
        if (privacy === "specific") {
          return `Specific Friends: Only ${allowedCount} selected ${allowedCount === 1 ? "friend" : "friends"} can see this story.`;
        }
        return "Public: Everyone including friends can see this story.";
      }

      function syncPrivacyControls(privacy, allowedFriendIds = []) {
        const cleanAllowed = normalizeIdArray(allowedFriendIds);
        if (privacy === "specific") {
          selectSpecificFriendsBtn.classList.remove("hidden");
        } else {
          selectSpecificFriendsBtn.classList.add("hidden");
        }
        privacyHelperText.textContent = getPrivacyHelperText(privacy, cleanAllowed.length);
      }

      function renderProgress() {
        progressTrackGroup.innerHTML = "";
        visibleStories.forEach((_, idx) => {
          const bar = document.createElement("div");
          bar.className = "progress-bar";
          const fill = document.createElement("div");
          fill.className = "progress-fill";
          fill.id = `prog_${idx}`;
          if (idx < activeIndex) fill.style.width = "100%";
          bar.appendChild(fill);
          progressTrackGroup.appendChild(bar);
        });
      }

      function updateProgressWidth() {
        const fill = document.getElementById(`prog_${activeIndex}`);
        if (!fill) return;
        const pct = Math.min(100, (elapsedSeconds / STORY_DURATION_SECONDS) * 100);
        fill.style.width = `${pct}%`;
      }

      function applyAuthorHeader(story, profileRow) {
        const resolvedName =
          (profileRow && (profileRow.name || profileRow.full_name || profileRow.username)) ||
          story.authorName ||
          "";
        const resolvedAvatar =
          (profileRow && profileRow.avatar_url) ||
          story.authorAvatar ||
          "";

        storyAuthorName.textContent = resolvedName;

        if (resolvedAvatar) {
          storyAuthorAvatar.src = resolvedAvatar;
          storyAuthorAvatar.classList.remove("hidden");
          storyAvatarFallback.classList.add("hidden");
        } else {
          storyAuthorAvatar.removeAttribute("src");
          storyAuthorAvatar.classList.add("hidden");
          storyAvatarFallback.textContent = resolvedName ? resolvedName.charAt(0).toUpperCase() : "";
          storyAvatarFallback.classList.remove("hidden");
        }
      }

      function recordView(story) {
        if (!story || isOwner(story) || !currentUser || !currentUser.id) return;
        const all = readJson(STORAGE_KEYS.STORIES, []);
        const idx = all.findIndex((s) => String(s.id) === String(story.id));
        if (idx === -1) return;

        const viewers = Array.isArray(all[idx].viewers) ? all[idx].viewers : [];
        const existingIdx = viewers.findIndex((v) => String(v.id) === String(currentUser.id));
        const entry = {
          id: currentUser.id,
          name: currentUser.name || "",
          avatar: currentUser.avatar || "",
          viewedAt: new Date().toISOString()
        };

        if (existingIdx >= 0) {
          viewers[existingIdx] = { ...viewers[existingIdx], ...entry };
        } else {
          viewers.unshift(entry);
        }

        all[idx].viewers = viewers;
        writeJson(STORAGE_KEYS.STORIES, all);
        activeStory.viewers = viewers;
      }

      function renderViewers(story) {
        const viewers = Array.isArray(story.viewers) ? story.viewers : [];
        const reactionsMap = readJson(STORAGE_KEYS.REACTIONS, {});
        const storyRxns = reactionsMap[story.id] || {};

        viewerCountText.textContent = `${viewers.length} ${viewers.length === 1 ? "viewer" : "viewers"}`;
        viewersDrawerTitle.textContent = `Viewers (${viewers.length})`;
        viewersList.innerHTML = "";

        if (!viewers.length) {
          const li = document.createElement("li");
          li.className = "viewer-item-meta";
          li.textContent = "No viewers yet.";
          viewersList.appendChild(li);
          return;
        }

        viewers.forEach((v) => {
          const li = document.createElement("li");
          li.className = "viewer-item";

          const left = document.createElement("div");
          left.className = "viewer-item-left";

          if (v.avatar) {
            const img = document.createElement("img");
            img.className = "viewer-item-avatar";
            img.src = v.avatar;
            img.alt = v.name || "";
            left.appendChild(img);
          }

          const info = document.createElement("div");
          const nameEl = document.createElement("span");
          nameEl.className = "viewer-item-name";
          nameEl.textContent = v.name || "";

          const timeEl = document.createElement("span");
          timeEl.className = "viewer-item-meta";
          timeEl.textContent = `Viewed ${formatTimeAgo(v.viewedAt)} ago`;

          info.appendChild(nameEl);
          info.appendChild(timeEl);
          left.appendChild(info);
          li.appendChild(left);

          const rxn = storyRxns[v.id];
          if (rxn) {
            const rxnEl = document.createElement("span");
            rxnEl.className = "viewer-item-reaction";
            rxnEl.textContent = rxn;
            li.appendChild(rxnEl);
          }

          viewersList.appendChild(li);
        });
      }

      async function renderStory(index) {
        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }

        activeIndex = ((index % visibleStories.length) + visibleStories.length) % visibleStories.length;
        activeStory = visibleStories[activeIndex];

        if (isExpired(activeStory)) {
          await deleteStoryFromSupabase(activeStory);
          refreshStories();
          return;
        }

        try {
          sessionStorage.setItem(STORAGE_KEYS.ACTIVE_STORY_CARD, JSON.stringify(activeStory));
          localStorage.setItem(STORAGE_KEYS.ACTIVE_STORY_ID, activeStory.id);
        } catch (_) {}

        recordView(activeStory);

        const currentPrivacy = ALLOWED_PRIVACY.includes(activeStory.privacy)
          ? activeStory.privacy
          : "public";

        applyAuthorHeader(activeStory, null);
        storyPrivacyBadge.textContent = getPrivacyLabel(currentPrivacy);
        storyTimeAgo.textContent = formatTimeAgo(activeStory.createdAt);

        fetchProfileRecord(activeStory.ownerId).then((profile) => {
          if (profile && activeStory) {
            applyAuthorHeader(activeStory, profile);
          }
        });

        storyMediaImage.classList.add("hidden");
        storyMediaVideo.classList.add("hidden");
        storyTextOverlay.classList.add("hidden");
        storyMediaVideo.pause();

        if (activeStory.mediaType === "video" && activeStory.mediaUrl) {
          storyMediaVideo.src = activeStory.mediaUrl;
          storyMediaVideo.classList.remove("hidden");
          storyMediaVideo.play().catch(() => {});
        } else if (activeStory.mediaUrl) {
          storyMediaImage.src = activeStory.mediaUrl;
          storyMediaImage.classList.remove("hidden");
        }

        if (activeStory.text) {
          storyTextOverlay.textContent = activeStory.text;
          storyTextOverlay.classList.remove("hidden");
        }

        const ownerMode = isOwner(activeStory);

        if (ownerMode) {
          ownerControls.classList.remove("hidden");
          viewerControls.classList.add("hidden");
          quickRepliesRow.classList.add("hidden");
          privacySelect.value = currentPrivacy;
          syncPrivacyControls(currentPrivacy, activeStory.allowedFriendIds);
          renderViewers(activeStory);
        } else {
          ownerControls.classList.add("hidden");
          viewersDrawer.classList.add("hidden");
          viewerControls.classList.remove("hidden");
          quickRepliesRow.classList.remove("hidden");
          syncReactionButtons(activeStory.id);

          const msgParams = new URLSearchParams();
          if (activeStory.ownerId) msgParams.set("toUserId", activeStory.ownerId);
          msgParams.set("storyId", activeStory.id);
          viewerCreateMessageLink.href = `message.html?${msgParams.toString()}`;
        }

        renderProgress();
        elapsedSeconds = 0;
        updateProgressWidth();
      }

      function refreshStories() {
        const clean = getLocalActiveStories();
        visibleStories = clean.filter((s) => canUserViewStory(s, currentUser));
        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }
        renderStory(0);
      }

      function startTimer() {
        if (timerId) clearInterval(timerId);
        timerId = setInterval(async () => {
          if (activeStory && isExpired(activeStory)) {
            await deleteStoryFromSupabase(activeStory);
            refreshStories();
            return;
          }
          if (isPaused) return;
          elapsedSeconds += 0.1;
          updateProgressWidth();

          if (elapsedSeconds >= STORY_DURATION_SECONDS) {
            if (visibleStories.length > 1) {
              renderStory(activeIndex + 1);
            } else {
              goToIndexPage();
            }
          }
        }, 100);
      }

      function sendMessageToChat(text) {
        const messageText = (text || "").trim();
        if (!messageText || !activeStory) return;

        const payload = {
          toUserId: activeStory.ownerId || "",
          toUserName: activeStory.authorName || "",
          fromUserId: (currentUser && currentUser.id) || "",
          fromUserName: (currentUser && currentUser.name) || "",
          storyId: activeStory.id,
          message: messageText,
          sentAt: new Date().toISOString()
        };

        writeJson(STORAGE_KEYS.PENDING_CHAT, payload);

        const targetUrl =
          `message.html?toUserId=${encodeURIComponent(payload.toUserId)}` +
          `&storyId=${encodeURIComponent(payload.storyId)}` +
          `&msg=${encodeURIComponent(payload.message)}`;

        window.location.href = targetUrl;
      }

      function saveEditedStoryText(nextText) {
        if (!activeStory) return;
        const cleanText = String(nextText || "").trim();
        activeStory.text = cleanText;
        activeStory.caption = cleanText;

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            const idx = arr.findIndex((s) => String(s?.id || s?.storyId || "") === String(activeStory.id));
            if (idx !== -1) {
              arr[idx] = { ...arr[idx], text: cleanText, caption: cleanText };
              writeJson(key, arr);
            }
          }
        });

        try {
          sessionStorage.setItem(STORAGE_KEYS.ACTIVE_STORY_CARD, JSON.stringify(activeStory));
        } catch (_) {}

        updateStoryTextInSupabase(activeStory.id, cleanText);

        if (cleanText) {
          storyTextOverlay.textContent = cleanText;
          storyTextOverlay.classList.remove("hidden");
        } else {
          storyTextOverlay.textContent = "";
          storyTextOverlay.classList.add("hidden");
        }
      }

      function persistStoryPrivacy(nextPrivacy, nextAllowedFriendIds) {
        if (!activeStory) return;
        const cleanPrivacy = ALLOWED_PRIVACY.includes(nextPrivacy) ? nextPrivacy : "public";
        const cleanAllowed = normalizeIdArray(nextAllowedFriendIds);

        activeStory.privacy = cleanPrivacy;
        activeStory.allowedFriendIds = cleanAllowed;

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            const idx = arr.findIndex((s) => String(s?.id || s?.storyId || "") === String(activeStory.id));
            if (idx !== -1) {
              arr[idx] = {
                ...arr[idx],
                privacy: cleanPrivacy,
                allowedFriendIds: cleanAllowed
              };
              writeJson(key, arr);
            }
          }
        });

        try {
          sessionStorage.setItem(STORAGE_KEYS.ACTIVE_STORY_CARD, JSON.stringify(activeStory));
        } catch (_) {}

        storyPrivacyBadge.textContent = getPrivacyLabel(cleanPrivacy);
        syncPrivacyControls(cleanPrivacy, cleanAllowed);
        updateStoryPrivacyInSupabase(activeStory.id, cleanPrivacy, cleanAllowed);
      }

      function addCurrentStoryToHighlights() {
        if (!activeStory) return;
        const highlights = readJson(STORAGE_KEYS.HIGHLIGHTS, []);
        const list = Array.isArray(highlights) ? highlights : [];

        const highlightEntry = {
          id: activeStory.id,
          highlightedAt: new Date().toISOString(),
          storyCard: { ...activeStory }
        };

        const idx = list.findIndex((h) => String(h?.id) === String(activeStory.id));
        if (idx >= 0) {
          list[idx] = highlightEntry;
        } else {
          list.unshift(highlightEntry);
        }

        writeJson(STORAGE_KEYS.HIGHLIGHTS, list);
      }

      async function deleteCurrentStory() {
        if (!activeStory) return;
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        ownerDeleteBtn.disabled = true;
        ownerDeleteBtn.firstElementChild.textContent = "Deleting...";

        const targetId = String(activeStory.id);
        await deleteStoryFromSupabase(activeStory);

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            writeJson(key, arr.filter((s) => String(s?.id || s?.storyId || s?.story_id || "") !== targetId));
          }
        });

        try {
          sessionStorage.removeItem(STORAGE_KEYS.ACTIVE_STORY_CARD);
          if (localStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_ID) === targetId) {
            localStorage.removeItem(STORAGE_KEYS.ACTIVE_STORY_ID);
          }
          if (storySyncChannel) {
            storySyncChannel.postMessage({ type: "STORY_DELETED", storyId: targetId });
          }
        } catch (_) {}

        goToIndexPage();
      }

      function renderPostsIntoContainer(container, posts, fallbackEmptyText) {
        container.innerHTML = "";
        if (!Array.isArray(posts) || !posts.length) {
          const empty = document.createElement("div");
          empty.className = "viewer-item-meta";
          empty.textContent = fallbackEmptyText;
          container.appendChild(empty);
          return;
        }

        posts.forEach((post) => {
          const item = document.createElement("div");
          item.className = "profile-post-item";

          const content = document.createElement("div");
          content.textContent = post.content || post.text || post.caption || post.title || "Post";
          item.appendChild(content);

          const imgUrl = post.image_url || post.media_url || post.image || "";
          if (imgUrl) {
            const img = document.createElement("img");
            img.className = "profile-post-media";
            img.src = imgUrl;
            img.alt = "Post media";
            item.appendChild(img);
          }

          container.appendChild(item);
        });
      }

      function isFollowingTarget(targetId) {
        if (!targetId) return false;
        const followsMap = readJson(STORAGE_KEYS.FOLLOWS, {});
        const actorKey = (currentUser && currentUser.id) || "guest";
        const list = Array.isArray(followsMap[actorKey]) ? followsMap[actorKey] : [];
        return list.includes(String(targetId));
      }

      function markFollowingTarget(targetId) {
        if (!targetId) return;
        const followsMap = readJson(STORAGE_KEYS.FOLLOWS, {});
        const actorKey = (currentUser && currentUser.id) || "guest";
        const list = new Set(Array.isArray(followsMap[actorKey]) ? followsMap[actorKey] : []);
        list.add(String(targetId));
        followsMap[actorKey] = Array.from(list);
        writeJson(STORAGE_KEYS.FOLLOWS, followsMap);
      }

      async function openUserProfileModal(targetId) {
        if (!targetId || (activeStory && isOwner(activeStory))) return;

        setPaused(true);
        inspectedUserId = String(targetId);
        otherProfileStatus.textContent = "";
        otherProfileName.textContent = "Loading...";
        otherProfileBio.textContent = "";
        otherFollowersCount.textContent = "0";
        otherProfilePic.src = activeStory?.authorAvatar || "default.jpg";
        otherUserPostsList.innerHTML = "";

        const alreadyFollowed = isFollowingTarget(inspectedUserId);
        otherFollowBtn.textContent = alreadyFollowed ? "Following" : "+ Follow";

        userProfileSheet.classList.remove("hidden");

        const [profile, posts] = await Promise.all([
          fetchProfileRecord(inspectedUserId),
          fetchUserPosts(inspectedUserId)
        ]);

        if (!profile && !posts.length) {
          otherProfileName.textContent = activeStory?.authorName || "User Not Found";
          return;
        }

        const displayName =
          (profile && (profile.name || profile.full_name || profile.username)) ||
          activeStory?.authorName ||
          "User";
        otherProfilePic.src = (profile && profile.avatar_url) || activeStory?.authorAvatar || "default.jpg";
        otherProfileName.textContent = displayName;
        otherProfileBio.textContent = (profile && profile.bio) || "";

        const baseFollowers = Number(profile?.followers ?? 0) || 0;
        otherFollowersCount.textContent = String(alreadyFollowed ? baseFollowers + 1 : baseFollowers);

        renderPostsIntoContainer(otherUserPostsList, posts, "No posts yet.");
      }

      async function handleFollowUser() {
        if (!inspectedUserId) return;
        const alreadyFollowed = isFollowingTarget(inspectedUserId);
        if (!alreadyFollowed) {
          markFollowingTarget(inspectedUserId);
          if (currentUser && currentUser.id) {
            await insertFollowRecord(currentUser.id, inspectedUserId);
          }
          const currentCount = Number(otherFollowersCount.textContent || 0) || 0;
          otherFollowersCount.textContent = String(currentCount + 1);
        }
        otherFollowBtn.textContent = "Following";
        otherProfileStatus.textContent = "Following";
      }

      function handleMessageInspectedUser() {
        if (!inspectedUserId) return;
        window.location.href = `chat.html?to=${encodeURIComponent(inspectedUserId)}`;
      }

      function handleReportInspectedUser() {
        if (!inspectedUserId) return;
        otherProfileStatus.textContent = "Reported";
      }

      function openAuthorDestination() {
        if (!activeStory || isExpired(activeStory)) {
          refreshStories();
          return;
        }
        if (isOwner(activeStory)) {
          window.location.href = "profile.html";
          return;
        }
        if (activeStory.ownerId) {
          openUserProfileModal(activeStory.ownerId);
        } else {
          const params = new URLSearchParams();
          params.set("tab", "stories");
          params.set("storyId", activeStory.id);
          window.location.href = `profile.html?${params.toString()}`;
        }
      }

      async function openSpecificFriendsModal() {
        if (!activeStory) return;
        setPaused(true);
        specificFriendsNote.textContent = "";
        specificFriendsList.innerHTML = "";

        const remoteFriends = currentUser?.id ? await fetchFriendsFromSupabase(currentUser.id) : [];
        const friendIds = normalizeIdArray([
          ...remoteFriends,
          ...(currentUser?.friends || []),
          ...(activeStory.ownerFriends || []),
          ...(activeStory.allowedFriendIds || [])
        ]);

        const profiles = await fetchProfilesFromSupabase(friendIds);
        const profileMap = new Map(profiles.map((p) => [String(p.id), p]));

        candidateFriends = friendIds.map((id) => {
          const p = profileMap.get(id);
          return {
            id,
            name: (p && (p.name || p.full_name || p.username)) || id
          };
        });

        if (!candidateFriends.length) {
          const div = document.createElement("div");
          div.className = "viewer-item-meta";
          div.textContent = "No friends found.";
          specificFriendsList.appendChild(div);
        } else {
          const selectedSet = new Set(normalizeIdArray(activeStory.allowedFriendIds));
          candidateFriends.forEach((friend) => {
            const label = document.createElement("label");
            label.className = "friend-check-item";

            const left = document.createElement("div");
            left.className = "friend-check-left";

            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.value = friend.id;
            cb.checked = selectedSet.has(friend.id);

            const nameSpan = document.createElement("span");
            nameSpan.textContent = friend.name;

            left.appendChild(cb);
            left.appendChild(nameSpan);
            label.appendChild(left);
            specificFriendsList.appendChild(label);
          });
        }

        specificFriendsSheet.classList.remove("hidden");
      }

      function buildReportReasonsUI() {
        reportReasonsList.innerHTML = "";
        REPORT_REASONS.forEach((reason, i) => {
          const label = document.createElement("label");
          label.className = "reason-item";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "storyReportReason";
          radio.value = reason;
          radio.id = `report_reason_${i}`;
          radio.addEventListener("change", () => {
            selectedReportReason = reason;
            reportStatusNote.textContent = "";
          });

          const span = document.createElement("span");
          span.textContent = `${i + 1}. ${reason}`;

          label.appendChild(radio);
          label.appendChild(span);
          reportReasonsList.appendChild(label);
        });
      }

      function validateReportPayload() {
        const details = (reportDetailsTextarea.value || "").trim();
        if (!selectedReportReason) {
          reportStatusNote.textContent = "Please select one of the 10 valid reasons.";
          return null;
        }
        if (details.length < 5) {
          reportStatusNote.textContent = "Please enter valid details (at least 5 characters).";
          return null;
        }
        return {
          storyId: activeStory ? activeStory.id : "",
          storyOwnerId: activeStory ? activeStory.ownerId : "",
          storyAuthorName: activeStory ? activeStory.authorName : "",
          storyUrl: window.location.href,
          reporterId: (currentUser && currentUser.id) || "",
          reporterName: (currentUser && currentUser.name) || "",
          reason: selectedReportReason,
          details,
          submittedAt: new Date().toISOString()
        };
      }

      function saveReportLocally(payload) {
        const reports = readJson(STORAGE_KEYS.REPORTS, []);
        const list = Array.isArray(reports) ? reports : [];
        list.unshift(payload);
        writeJson(STORAGE_KEYS.REPORTS, list);
      }

      async function sendReportToEmailEndpoint(payload) {
        const res = await fetch("/api/report-story", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          throw new Error("Failed to send report email");
        }
        return res.json().catch(() => ({ ok: true }));
      }

      function bindProfileEvents() {
        authorProfileLink.addEventListener("click", (e) => {
          e.stopPropagation();
          openAuthorDestination();
        });

        closeUserProfileBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          userProfileSheet.classList.add("hidden");
          setPaused(false);
        });

        otherFollowBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          handleFollowUser();
        });

        otherMessageBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          handleMessageInspectedUser();
        });

        otherReportBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          handleReportInspectedUser();
        });
      }

      function bindStoryMenuEvents() {
        moreOptionsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          setPaused(true);
          if (isOwner(activeStory)) {
            ownerMenuSheet.classList.remove("hidden");
          } else {
            syncReactionButtons(activeStory.id);
            viewerMenuSheet.classList.remove("hidden");
          }
        });

        closeOwnerMenuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          ownerMenuSheet.classList.add("hidden");
          setPaused(false);
        });

        ownerEditBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          ownerMenuSheet.classList.add("hidden");
          editStoryTextarea.value = activeStory ? (activeStory.text || "") : "";
          editStorySheet.classList.remove("hidden");
        });

        closeEditSheetBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          editStorySheet.classList.add("hidden");
          setPaused(false);
        });

        cancelEditBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          editStorySheet.classList.add("hidden");
          setPaused(false);
        });

        saveEditBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          saveEditedStoryText(editStoryTextarea.value);
          editStorySheet.classList.add("hidden");
          setPaused(false);
        });

        ownerHighlightBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          addCurrentStoryToHighlights();
          ownerHighlightBtn.firstElementChild.textContent = "Highlights (Added)";
          setTimeout(() => {
            ownerHighlightBtn.firstElementChild.textContent = "Highlights";
            ownerMenuSheet.classList.add("hidden");
            setPaused(false);
          }, 700);
        });

        ownerDeleteBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          await deleteCurrentStory();
        });

        closeViewerMenuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          viewerMenuSheet.classList.add("hidden");
          setPaused(false);
        });

        viewerOpenUserProfileBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          viewerMenuSheet.classList.add("hidden");
          if (activeStory && activeStory.ownerId) {
            openUserProfileModal(activeStory.ownerId);
          }
        });

        viewerUndoReactBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          undoCurrentReaction();
          viewerMenuSheet.classList.add("hidden");
          setPaused(false);
        });

        viewerOpenReportBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          viewerMenuSheet.classList.add("hidden");
          selectedReportReason = "";
          reportDetailsTextarea.value = "";
          reportStatusNote.textContent = "";
          buildReportReasonsUI();
          reportStorySheet.classList.remove("hidden");
        });

        closeReportSheetBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          reportStorySheet.classList.add("hidden");
          setPaused(false);
        });

        submitReportBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const payload = validateReportPayload();
          if (!payload) return;
          saveReportLocally(payload);
          reportStatusNote.textContent = "Report submitted.";
        });

        sendReportEmailBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const payload = validateReportPayload();
          if (!payload) return;
          saveReportLocally(payload);
          reportStatusNote.textContent = "Sending report...";
          try {
            await sendReportToEmailEndpoint(payload);
            reportStatusNote.textContent = "Report sent.";
            setTimeout(() => {
              reportStorySheet.classList.add("hidden");
              setPaused(false);
            }, 900);
          } catch {
            reportStatusNote.textContent = "Saved. Check /api/report-story email env vars.";
          }
        });
      }

      function bindStoryStageAndPrivacyEvents() {
        togglePauseBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          setPaused(!isPaused);
        });

        closeStoryBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          goToIndexPage();
        });

        storyStage.addEventListener("click", (e) => {
          if (!viewersDrawer.classList.contains("hidden")) return;
          const rect = storyStage.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (visibleStories.length > 1 && x < rect.width * 0.22) {
            renderStory(activeIndex - 1);
            return;
          }
          if (visibleStories.length > 1 && x > rect.width * 0.78) {
            renderStory(activeIndex + 1);
            return;
          }
          openAuthorDestination();
        });

        openViewersBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          setPaused(true);
          renderViewers(activeStory);
          viewersDrawer.classList.remove("hidden");
        });

        closeViewersBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          viewersDrawer.classList.add("hidden");
          setPaused(false);
        });

        privacySelect.addEventListener("change", (e) => {
          e.stopPropagation();
          if (!activeStory) return;
          const nextPrivacy = ALLOWED_PRIVACY.includes(e.target.value) ? e.target.value : "public";
          persistStoryPrivacy(nextPrivacy, activeStory.allowedFriendIds);
          if (nextPrivacy === "specific") {
            openSpecificFriendsModal();
          }
        });

        selectSpecificFriendsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openSpecificFriendsModal();
        });

        closeSpecificFriendsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          specificFriendsSheet.classList.add("hidden");
          setPaused(false);
        });

        cancelSpecificFriendsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          specificFriendsSheet.classList.add("hidden");
          setPaused(false);
        });

        saveSpecificFriendsBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!activeStory) return;
          const checkedIds = Array.from(
            specificFriendsList.querySelectorAll('input[type="checkbox"]:checked')
          ).map((cb) => String(cb.value));
          persistStoryPrivacy("specific", checkedIds);
          specificFriendsSheet.classList.add("hidden");
          setPaused(false);
        });
      }

      function bindViewerInteractionEvents() {
        reactionButtons.forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleReaction(btn.dataset.emoji);
          });
        });

        activeReactionBadge.addEventListener("click", (e) => {
          e.stopPropagation();
          undoCurrentReaction();
        });

        sendReplyBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sendMessageToChat(storyReplyInput.value);
        });

        storyReplyInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            sendMessageToChat(storyReplyInput.value);
          }
        });

        storyReplyInput.addEventListener("focus", () => setPaused(true));
        storyReplyInput.addEventListener("blur", () => {
          if (!storyReplyInput.value.trim()) setPaused(false);
        });

        quickRepliesRow.addEventListener("click", (e) => {
          const chip = e.target.closest(".quick-reply-chip");
          if (!chip) return;
          e.stopPropagation();
          sendMessageToChat(chip.dataset.reply);
        });
      }

      function bindAllEvents() {
        bindProfileEvents();
        bindStoryMenuEvents();
        bindStoryStageAndPrivacyEvents();
        bindViewerInteractionEvents();
      }

      async function init() {
        bindAllEvents();

        currentUser = getCurrentUser();
        if (currentUser && currentUser.id) {
          const remoteFriends = await fetchFriendsFromSupabase(currentUser.id);
          if (remoteFriends.length) {
            currentUser.friends = normalizeIdArray([...currentUser.friends, ...remoteFriends]);
          }
        }

        const remoteStories = await fetchStoriesFromSupabase();
        const localStories = getLocalActiveStories();

        const merged = new Map();
        localStories.forEach((s) => merged.set(s.id, s));
        remoteStories.forEach((s) => merged.set(s.id, { ...merged.get(s.id), ...s }));

        const combined = Array.from(merged.values())
          .filter((s) => s && !isExpired(s))
          .sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());

        syncAllStoryLists(combined);
        visibleStories = combined.filter((s) => canUserViewStory(s, currentUser));

        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const requestedId =
          params.get("storyId") || params.get("id") || localStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_ID);

        if (requestedId) {
          const found = visibleStories.findIndex((s) => String(s.id) === String(requestedId));
          activeIndex = found >= 0 ? found : 0;
        } else {
          activeIndex = 0;
        }

        await renderStory(activeIndex);
        startTimer();
      }

      init();
    })();
  </script>
