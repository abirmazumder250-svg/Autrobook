<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story Card — Autrobook</title>
  <style>
    :root {
      --bg-dark: #202124;
      --bg-elevated: #292a2d;
      --text-white: #ffffff;
      --text-muted: #b0b3b8;
      --border-line: rgba(255, 255, 255, 0.16);
      --danger: #d93025;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    .story-shell {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      max-height: 920px;
      background: var(--bg-dark);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (min-width: 480px) {
      .story-shell {
        height: 94dvh;
        border-radius: 20px;
        border: 1px solid var(--border-line);
      }
    }

    /* Progress Bars */
    .progress-track-group {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      gap: 5px;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--text-white);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    /* Header */
    .story-header {
      position: relative;
      z-index: 25;
      padding: 22px 14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(to bottom, rgba(32, 33, 36, 0.9), transparent);
    }

    .story-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .story-avatar-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--text-white);
      background: var(--bg-elevated);
      overflow: hidden;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .story-avatar-fallback {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .story-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }

    .story-author-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .story-author-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .privacy-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-white);
      border: 1px solid var(--border-line);
      white-space: nowrap;
    }

    .story-time-ago {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .story-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.88rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .icon-btn:hover {
      background: #3c4043;
    }

    /* Main Stage */
    .story-stage {
      position: relative;
      flex: 1;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      overflow: hidden;
      padding: 12px 16px;
    }

    .story-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .story-text-overlay {
      position: relative;
      z-index: 12;
      padding: 20px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
      color: var(--text-white);
      word-break: break-word;
      max-width: 100%;
    }

    /* Floating Reaction Burst */
    .floating-reaction-burst {
      position: absolute;
      inset: 0;
      z-index: 28;
      pointer-events: none;
      overflow: hidden;
    }

    .burst-emoji {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      animation: floatUp 1.1s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.6);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, -30px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -170px) scale(0.9);
      }
    }

    /* Mode Switch */
    .mode-test-bar {
      position: relative;
      z-index: 26;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 4px 12px;
    }

    .mode-switch-btn {
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-switch-btn.active {
      background: var(--text-white);
      color: var(--bg-dark);
    }

    /* Quick Replies */
    .quick-replies-row {
      position: relative;
      z-index: 25;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 4px 14px 8px;
    }

    .quick-reply-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-reply-chip:hover {
      background: #3c4043;
    }

    /* Owner Controls */
    .owner-controls {
      position: relative;
      z-index: 25;
      padding: 10px 14px 18px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .owner-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .viewer-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .privacy-select {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .privacy-select option {
      background: var(--bg-dark);
      color: var(--text-white);
    }

    .owner-action-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .owner-sub-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .owner-sub-btn.danger-btn:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* Viewers Drawer */
    .viewers-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 58%;
      z-index: 40;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-line);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .viewers-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .viewers-drawer-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .viewers-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border-line);
    }

    .viewer-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-item-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--text-white);
    }

    .viewer-item-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-white);
      display: block;
    }

    .viewer-item-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .viewer-item-reaction {
      font-size: 1.2rem;
    }

    /* Viewer Controls */
    .viewer-controls {
      position: relative;
      z-index: 25;
      padding: 8px 12px 18px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reaction-picker-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
    }

    .reaction-btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      font-size: 1.3rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .reaction-btn:hover {
      transform: scale(1.18);
      background: rgba(255, 255, 255, 0.08);
    }

    .reaction-btn.is-selected {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 0 1.5px var(--text-white);
    }

    .viewer-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      border-radius: 999px;
      padding: 4px 6px 4px 14px;
    }

    .story-reply-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-white);
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    .story-reply-input::placeholder {
      color: var(--text-muted);
    }

    .send-reply-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--text-white);
      color: var(--bg-dark);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .active-reaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--text-white);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .active-reaction-badge:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    .redirect-toast {
      position: absolute;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      color: var(--text-white);
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="story-shell" id="storyShell">
    <div class="progress-track-group" id="progressTrackGroup"></div>

    <header class="story-header">
      <div class="story-user-info" id="authorProfileLink" title="Open profile">
        <div class="story-avatar-wrap">
          <img id="storyAuthorAvatar" src="" alt="" class="story-avatar hidden" />
          <span id="storyAvatarFallback" class="story-avatar-fallback"></span>
        </div>
        <div class="story-meta">
          <div class="story-author-row">
            <span id="storyAuthorName" class="story-author-name"></span>
            <span id="storyPrivacyBadge" class="privacy-badge">Public</span>
          </div>
          <span id="storyTimeAgo" class="story-time-ago"></span>
        </div>
      </div>

      <div class="story-header-actions">
        <button type="button" id="togglePauseBtn" class="icon-btn" title="Pause / Resume">❚❚</button>
        <button type="button" id="closeStoryBtn" class="icon-btn" title="Back to Home">✕</button>
      </div>
    </header>

    <main class="story-stage" id="storyStage">
      <img id="storyMediaImage" class="story-media hidden" alt="Story media" />
      <video id="storyMediaVideo" class="story-media hidden" playsinline autoplay muted loop></video>
      <div id="storyTextOverlay" class="story-text-overlay hidden"></div>
      <div id="floatingReactionBurst" class="floating-reaction-burst"></div>
    </main>

    <div class="mode-test-bar" id="modeTestBar">
      <button type="button" id="btnOwnerPreview" class="mode-switch-btn active">Owner View</button>
      <button type="button" id="btnViewerPreview" class="mode-switch-btn">Viewer View</button>
    </div>

    <div id="quickRepliesRow" class="quick-replies-row hidden">
      <button type="button" class="quick-reply-chip" data-reply="Stay sharp">Stay sharp</button>
      <button type="button" class="quick-reply-chip" data-reply="Nice vibe">Nice vibe</button>
    </div>

    <section id="ownerControls" class="owner-controls hidden">
      <div class="owner-top-row">
        <button type="button" id="openViewersBtn" class="viewer-pill-btn">
          <span>👁</span>
          <span id="viewerCountText">0 viewers</span>
        </button>

        <select id="privacySelect" class="privacy-select" aria-label="Story Privacy">
          <option value="public">Public</option>
          <option value="friends">Friends</option>
          <option value="specific">Specific Friends</option>
        </select>
      </div>

      <div class="owner-action-group">
        <button type="button" id="addHighlightBtn" class="owner-sub-btn">
          <span>＋</span>
          <span>Highlight</span>
        </button>
        <button type="button" id="deleteStoryBtn" class="owner-sub-btn danger-btn">
          <span>🗑</span>
          <span>Delete</span>
        </button>
        <button type="button" id="shareStoryBtn" class="owner-sub-btn">
          <span>↗</span>
          <span>Share</span>
        </button>
      </div>
    </section>

    <aside id="viewersDrawer" class="viewers-drawer hidden">
      <div class="viewers-drawer-header">
        <h3 id="viewersDrawerTitle">Story Viewers</h3>
        <button type="button" id="closeViewersBtn" class="icon-btn">✕</button>
      </div>
      <ul id="viewersList" class="viewers-list"></ul>
    </aside>

    <section id="viewerControls" class="viewer-controls hidden">
      <div id="reactionPickerBar" class="reaction-picker-bar">
        <button type="button" class="reaction-btn" data-emoji="❤️" aria-label="Love">❤️</button>
        <button type="button" class="reaction-btn" data-emoji="👍" aria-label="Like">👍</button>
        <button type="button" class="reaction-btn" data-emoji="🥰" aria-label="Care">🥰</button>
        <button type="button" class="reaction-btn" data-emoji="😆" aria-label="Haha">😆</button>
        <button type="button" class="reaction-btn" data-emoji="😢" aria-label="Sad">😢</button>
        <button type="button" class="reaction-btn" data-emoji="😠" aria-label="Angry">😠</button>
        <button type="button" class="reaction-btn" data-emoji="😮" aria-label="Wow">😮</button>
      </div>

      <div class="viewer-bottom-row">
        <div class="message-input-wrap">
          <input
            type="text"
            id="storyReplyInput"
            class="story-reply-input"
            placeholder="Send message..."
            autocomplete="off"
          />
          <button type="button" id="sendReplyBtn" class="send-reply-btn" title="Send to autrobook-chat.html">➤</button>
        </div>

        <button type="button" id="activeReactionBadge" class="active-reaction-badge hidden" title="Click to undo">
          <span id="activeReactionEmoji"></span>
          <span>Undo</span>
        </button>
      </div>
    </section>

    <div id="redirectToast" class="redirect-toast">
      Returning to feed in <span id="redirectCountdown">5</span>s...
    </div>
  </div>

  <script>
    (() => {
      const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

      const FORTY_EIGHT_HOURS_MS = 48 * 60 * 60 * 1000;
      const AUTO_REDIRECT_SECONDS = 5;
      const ALLOWED_REACTIONS = ["❤️", "👍", "🥰", "😆", "😢", "😠", "😮"];
      const ALLOWED_PRIVACY = ["public", "friends", "specific"];

      const STORAGE_KEYS = {
        STORIES: "autrobook_stories_v1",
        ACTIVE_STORY_ID: "autrobook_active_story_id",
        CURRENT_USER: "autrobook_current_user",
        REACTIONS: "autrobook_story_reactions_v1",
        HIGHLIGHTS: "autrobook_story_highlights_v1",
        PENDING_CHAT: "autrobook_pending_chat_message"
      };

      const progressTrackGroup = document.getElementById("progressTrackGroup");
      const authorProfileLink = document.getElementById("authorProfileLink");
      const storyAuthorAvatar = document.getElementById("storyAuthorAvatar");
      const storyAvatarFallback = document.getElementById("storyAvatarFallback");
      const storyAuthorName = document.getElementById("storyAuthorName");
      const storyPrivacyBadge = document.getElementById("storyPrivacyBadge");
      const storyTimeAgo = document.getElementById("storyTimeAgo");

      const togglePauseBtn = document.getElementById("togglePauseBtn");
      const closeStoryBtn = document.getElementById("closeStoryBtn");

      const storyStage = document.getElementById("storyStage");
      const storyMediaImage = document.getElementById("storyMediaImage");
      const storyMediaVideo = document.getElementById("storyMediaVideo");
      const storyTextOverlay = document.getElementById("storyTextOverlay");
      const floatingReactionBurst = document.getElementById("floatingReactionBurst");

      const btnOwnerPreview = document.getElementById("btnOwnerPreview");
      const btnViewerPreview = document.getElementById("btnViewerPreview");

      const quickRepliesRow = document.getElementById("quickRepliesRow");
      const ownerControls = document.getElementById("ownerControls");
      const viewerControls = document.getElementById("viewerControls");

      const openViewersBtn = document.getElementById("openViewersBtn");
      const viewerCountText = document.getElementById("viewerCountText");
      const privacySelect = document.getElementById("privacySelect");
      const viewersDrawer = document.getElementById("viewersDrawer");
      const viewersDrawerTitle = document.getElementById("viewersDrawerTitle");
      const closeViewersBtn = document.getElementById("closeViewersBtn");
      const viewersList = document.getElementById("viewersList");

      const addHighlightBtn = document.getElementById("addHighlightBtn");
      const deleteStoryBtn = document.getElementById("deleteStoryBtn");
      const shareStoryBtn = document.getElementById("shareStoryBtn");

      const reactionButtons = Array.from(document.querySelectorAll(".reaction-btn"));
      const activeReactionBadge = document.getElementById("activeReactionBadge");
      const activeReactionEmoji = document.getElementById("activeReactionEmoji");

      const storyReplyInput = document.getElementById("storyReplyInput");
      const sendReplyBtn = document.getElementById("sendReplyBtn");

      const redirectToast = document.getElementById("redirectToast");
      const redirectCountdown = document.getElementById("redirectCountdown");

      let currentUser = null;
      let visibleStories = [];
      let activeIndex = 0;
      let activeStory = null;
      let forceViewerMode = false;
      let isPaused = false;
      let elapsedSeconds = 0;
      let timerId = null;
      let audioCtx = null;

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playReactSound(emoji) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const freqMap = {
          "❤️": 587.33,
          "👍": 523.25,
          "🥰": 659.25,
          "😆": 783.99,
          "😢": 392.0,
          "😠": 261.63,
          "😮": 880.0
        };
        const freq = freqMap[emoji] || 587.33;
        osc.type = emoji === "😠" ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq * 0.85, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + 0.14);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }

      function playUndoSound() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.16);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function writeJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      }

      function isExpired(story, nowMs = Date.now()) {
        if (!story || !story.createdAt) return true;
        const ms = new Date(story.createdAt).getTime();
        if (Number.isNaN(ms)) return true;
        return nowMs - ms >= FORTY_EIGHT_HOURS_MS;
      }

      function getCleanActiveStories() {
        const all = readJson(STORAGE_KEYS.STORIES, []);
        const nowMs = Date.now();
        const valid = all.filter((s) => !isExpired(s, nowMs));
        if (valid.length !== all.length) {
          writeJson(STORAGE_KEYS.STORIES, valid);
        }
        return valid;
      }

      function getCurrentUser() {
        const stored = readJson(STORAGE_KEYS.CURRENT_USER, null);
        if (stored && stored.id) {
          return {
            id: String(stored.id),
            name: stored.name || "",
            avatar: stored.avatar || "",
            friends: Array.isArray(stored.friends) ? stored.friends.map(String) : []
          };
        }
        const params = new URLSearchParams(window.location.search);
        return {
          id: params.get("userId") || "",
          name: params.get("userName") || "",
          avatar: params.get("avatar") || "",
          friends: []
        };
      }

      async function fetchAuthorProfileFromSupabase(story) {
        if (!story || !story.ownerId) return null;
        try {
          const query =
            `${SUPABASE_URL}/rest/v1/profiles` +
            `?select=id,full_name,username,avatar_url` +
            `&id=eq.${encodeURIComponent(story.ownerId)}&limit=1`;

          const res = await fetch(query, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          });
          if (!res.ok) return null;
          const rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) return null;
          return rows[0];
        } catch {
          return null;
        }
      }

      function isOwner(story) {
        if (forceViewerMode) return false;
        if (!story || !currentUser || !currentUser.id) return false;
        if (story.ownerId) return String(story.ownerId) === String(currentUser.id);
        return Boolean(story.isOwner);
      }

      function canUserViewStory(story, user) {
        if (!story) return false;
        if (user && user.id && String(story.ownerId) === String(user.id)) return true;

        const privacy = ALLOWED_PRIVACY.includes(story.privacy) ? story.privacy : "public";
        const viewerId = user && user.id ? String(user.id) : "";

        if (privacy === "public") return true;
        if (privacy === "friends") {
          const authorFriends = Array.isArray(story.ownerFriends) ? story.ownerFriends.map(String) : [];
          const userFriends = user && Array.isArray(user.friends) ? user.friends.map(String) : [];
          return authorFriends.includes(viewerId) || userFriends.includes(String(story.ownerId));
        }
        if (privacy === "specific") {
          const allowed = Array.isArray(story.allowedFriendIds)
            ? story.allowedFriendIds.map(String)
            : [];
          return allowed.includes(viewerId);
        }
        return false;
      }

      function getPrivacyLabel(privacy) {
        if (privacy === "friends") return "Friends";
        if (privacy === "specific") return "Specific Friends";
        return "Public";
      }

      function formatTimeAgo(createdAt) {
        const ms = new Date(createdAt).getTime();
        if (Number.isNaN(ms)) return "Just now";
        const sec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
        if (sec < 60) return `${sec}s`;
        const min = Math.floor(sec / 60);
        if (min < 60) return `${min}m`;
        const hr = Math.floor(min / 60);
        return `${hr}h`;
      }

      function renderProgress() {
        progressTrackGroup.innerHTML = "";
        visibleStories.forEach((_, idx) => {
          const bar = document.createElement("div");
          bar.className = "progress-bar";
          const fill = document.createElement("div");
          fill.className = "progress-fill";
          fill.id = `prog_${idx}`;
          if (idx < activeIndex) fill.style.width = "100%";
          bar.appendChild(fill);
          progressTrackGroup.appendChild(bar);
        });
      }

      function updateProgressWidth() {
        const fill = document.getElementById(`prog_${activeIndex}`);
        if (!fill) return;
        const pct = Math.min(100, (elapsedSeconds / AUTO_REDIRECT_SECONDS) * 100);
        fill.style.width = `${pct}%`;
      }

      function spawnBurst(emoji) {
        const el = document.createElement("div");
        el.className = "burst-emoji";
        el.textContent = emoji;
        floatingReactionBurst.appendChild(el);
        setTimeout(() => el.remove(), 1150);
      }

      function getUserReaction(storyId) {
        if (!currentUser || !currentUser.id) return null;
        const map = readJson(STORAGE_KEYS.REACTIONS, {});
        return (map[storyId] && map[storyId][currentUser.id]) || null;
      }

      function syncReactionButtons(storyId) {
        const selected = getUserReaction(storyId);
        reactionButtons.forEach((btn) => {
          btn.classList.toggle("is-selected", btn.dataset.emoji === selected);
        });

        if (selected) {
          activeReactionEmoji.textContent = selected;
          activeReactionBadge.classList.remove("hidden");
        } else {
          activeReactionEmoji.textContent = "";
          activeReactionBadge.classList.add("hidden");
        }
      }

      function toggleReaction(emoji) {
        if (!activeStory || !ALLOWED_REACTIONS.includes(emoji)) return;
        if (isOwner(activeStory)) return;
        const actorId = (currentUser && currentUser.id) || "guest";

        const map = readJson(STORAGE_KEYS.REACTIONS, {});
        if (!map[activeStory.id]) map[activeStory.id] = {};

        const prev = map[activeStory.id][actorId] || null;
        if (prev === emoji) {
          delete map[activeStory.id][actorId];
          writeJson(STORAGE_KEYS.REACTIONS, map);
          playUndoSound();
        } else {
          map[activeStory.id][actorId] = emoji;
          writeJson(STORAGE_KEYS.REACTIONS, map);
          playReactSound(emoji);
          spawnBurst(emoji);
        }

        syncReactionButtons(activeStory.id);
      }

      function recordView(story) {
        if (!story || isOwner(story) || !currentUser || !currentUser.id) return;
        const all = readJson(STORAGE_KEYS.STORIES, []);
        const idx = all.findIndex((s) => String(s.id) === String(story.id));
        if (idx === -1) return;

        const viewers = Array.isArray(all[idx].viewers) ? all[idx].viewers : [];
        const existingIdx = viewers.findIndex((v) => String(v.id) === String(currentUser.id));
        const entry = {
          id: currentUser.id,
          name: currentUser.name || "",
          avatar: currentUser.avatar || "",
          viewedAt: new Date().toISOString()
        };

        if (existingIdx >= 0) {
          viewers[existingIdx] = { ...viewers[existingIdx], ...entry };
        } else {
          viewers.unshift(entry);
        }

        all[idx].viewers = viewers;
        writeJson(STORAGE_KEYS.STORIES, all);
        activeStory.viewers = viewers;
      }

      function renderViewers(story) {
        const viewers = Array.isArray(story.viewers) ? story.viewers : [];
        const reactionsMap = readJson(STORAGE_KEYS.REACTIONS, {});
        const storyRxns = reactionsMap[story.id] || {};

        viewerCountText.textContent = `${viewers.length} ${viewers.length === 1 ? "viewer" : "viewers"}`;
        viewersDrawerTitle.textContent = `Viewers (${viewers.length})`;
        viewersList.innerHTML = "";

        if (!viewers.length) {
          const li = document.createElement("li");
          li.className = "viewer-item-meta";
          li.textContent = "No viewers yet.";
          viewersList.appendChild(li);
          return;
        }

        viewers.forEach((v) => {
          const li = document.createElement("li");
          li.className = "viewer-item";

          const left = document.createElement("div");
          left.className = "viewer-item-left";

          if (v.avatar) {
            const img = document.createElement("img");
            img.className = "viewer-item-avatar";
            img.src = v.avatar;
            img.alt = v.name || "";
            left.appendChild(img);
          }

          const info = document.createElement("div");
          const nameEl = document.createElement("span");
          nameEl.className = "viewer-item-name";
          nameEl.textContent = v.name || "";

          const timeEl = document.createElement("span");
          timeEl.className = "viewer-item-meta";
          timeEl.textContent = `Viewed ${formatTimeAgo(v.viewedAt)} ago`;

          info.appendChild(nameEl);
          info.appendChild(timeEl);
          left.appendChild(info);
          li.appendChild(left);

          const rxn = storyRxns[v.id];
          if (rxn) {
            const rxnEl = document.createElement("span");
            rxnEl.className = "viewer-item-reaction";
            rxnEl.textContent = rxn;
            li.appendChild(rxnEl);
          }

          viewersList.appendChild(li);
        });
      }

      function applyAuthorHeader(story, profileRow) {
        const resolvedName =
          (profileRow && (profileRow.full_name || profileRow.username)) ||
          story.authorName ||
          "";
        const resolvedAvatar =
          (profileRow && profileRow.avatar_url) ||
          story.authorAvatar ||
          "";

        storyAuthorName.textContent = resolvedName;

        if (resolvedAvatar) {
          storyAuthorAvatar.src = resolvedAvatar;
          storyAuthorAvatar.classList.remove("hidden");
          storyAvatarFallback.classList.add("hidden");
        } else {
          storyAuthorAvatar.removeAttribute("src");
          storyAuthorAvatar.classList.add("hidden");
          storyAvatarFallback.textContent = resolvedName ? resolvedName.charAt(0).toUpperCase() : "";
          storyAvatarFallback.classList.remove("hidden");
        }
      }

      function openAuthorProfile() {
        if (!activeStory) return;
        const targetId = activeStory.ownerId || "";
        const url = targetId
          ? `profile.html?userId=${encodeURIComponent(targetId)}`
          : "profile.html";
        window.location.href = url;
      }

      async function renderStory(index) {
        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }

        activeIndex = ((index % visibleStories.length) + visibleStories.length) % visibleStories.length;
        activeStory = visibleStories[activeIndex];

        if (isExpired(activeStory)) {
          refreshStories();
          return;
        }

        recordView(activeStory);

        const currentPrivacy = ALLOWED_PRIVACY.includes(activeStory.privacy)
          ? activeStory.privacy
          : "public";

        applyAuthorHeader(activeStory, null);
        storyPrivacyBadge.textContent = getPrivacyLabel(currentPrivacy);
        storyTimeAgo.textContent = formatTimeAgo(activeStory.createdAt);

        fetchAuthorProfileFromSupabase(activeStory).then((profile) => {
          if (profile && activeStory) {
            applyAuthorHeader(activeStory, profile);
          }
        });

        storyMediaImage.classList.add("hidden");
        storyMediaVideo.classList.add("hidden");
        storyTextOverlay.classList.add("hidden");
        storyMediaVideo.pause();

        if (activeStory.mediaType === "video" && activeStory.mediaUrl) {
          storyMediaVideo.src = activeStory.mediaUrl;
          storyMediaVideo.classList.remove("hidden");
          storyMediaVideo.play().catch(() => {});
        } else if (activeStory.mediaUrl) {
          storyMediaImage.src = activeStory.mediaUrl;
          storyMediaImage.classList.remove("hidden");
        }

        if (activeStory.text) {
          storyTextOverlay.textContent = activeStory.text;
          storyTextOverlay.classList.remove("hidden");
        }

        const ownerMode = isOwner(activeStory);
        btnOwnerPreview.classList.toggle("active", ownerMode);
        btnViewerPreview.classList.toggle("active", !ownerMode);

        if (ownerMode) {
          ownerControls.classList.remove("hidden");
          viewerControls.classList.add("hidden");
          quickRepliesRow.classList.add("hidden");
          privacySelect.value = currentPrivacy;
          renderViewers(activeStory);
        } else {
          ownerControls.classList.add("hidden");
          viewersDrawer.classList.add("hidden");
          viewerControls.classList.remove("hidden");
          quickRepliesRow.classList.remove("hidden");
          syncReactionButtons(activeStory.id);
        }

        renderProgress();
        elapsedSeconds = 0;
        updateProgressWidth();
        syncCountdownLabel();
      }

      function refreshStories() {
        const clean = getCleanActiveStories();
        visibleStories = clean.filter((s) => canUserViewStory(s, currentUser));
        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }
        renderStory(0);
      }

      function sendMessageToChat(text) {
        const messageText = (text || "").trim();
        if (!messageText || !activeStory) return;

        const payload = {
          toUserId: activeStory.ownerId || "",
          toUserName: activeStory.authorName || "",
          fromUserId: (currentUser && currentUser.id) || "",
          fromUserName: (currentUser && currentUser.name) || "",
          storyId: activeStory.id,
          message: messageText,
          sentAt: new Date().toISOString()
        };

        writeJson(STORAGE_KEYS.PENDING_CHAT, payload);

        const targetUrl =
          `autrobook-chat.html?toUserId=${encodeURIComponent(payload.toUserId)}` +
          `&storyId=${encodeURIComponent(payload.storyId)}` +
          `&msg=${encodeURIComponent(payload.message)}`;

        window.location.href = targetUrl;
      }

      function deleteCurrentStory() {
        if (!activeStory) return;
        const all = readJson(STORAGE_KEYS.STORIES, []);
        const updated = all.filter((s) => String(s.id) !== String(activeStory.id));
        writeJson(STORAGE_KEYS.STORIES, updated);

        if (localStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_ID) === String(activeStory.id)) {
          localStorage.removeItem(STORAGE_KEYS.ACTIVE_STORY_ID);
        }

        goToIndexPage();
      }

      function goToIndexPage() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        window.location.href = "index.html";
      }

      function syncCountdownLabel() {
        const rem = Math.max(0, Math.ceil(AUTO_REDIRECT_SECONDS - elapsedSeconds));
        redirectCountdown.textContent = String(rem);
      }

      function startTimer() {
        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
          if (isPaused) return;
          elapsedSeconds += 0.1;
          updateProgressWidth();
          syncCountdownLabel();

          if (elapsedSeconds >= AUTO_REDIRECT_SECONDS) {
            goToIndexPage();
          }
        }, 100);
      }

      function setPaused(paused) {
        isPaused = paused;
        togglePauseBtn.textContent = isPaused ? "▶" : "❚❚";
        if (activeStory && activeStory.mediaType === "video") {
          if (isPaused) storyMediaVideo.pause();
          else storyMediaVideo.play().catch(() => {});
        }
        if (isPaused) {
          redirectToast.textContent = "Paused";
        } else {
          redirectToast.innerHTML = `Returning to feed in <span id="redirectCountdown">${Math.max(
            0,
            Math.ceil(AUTO_REDIRECT_SECONDS - elapsedSeconds)
          )}</span>s...`;
        }
      }

      authorProfileLink.addEventListener("click", (e) => {
        e.stopPropagation();
        openAuthorProfile();
      });

      btnOwnerPreview.addEventListener("click", (e) => {
        e.stopPropagation();
        forceViewerMode = false;
        renderStory(activeIndex);
      });

      btnViewerPreview.addEventListener("click", (e) => {
        e.stopPropagation();
        forceViewerMode = true;
        renderStory(activeIndex);
      });

      togglePauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setPaused(!isPaused);
      });

      closeStoryBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        goToIndexPage();
      });

      storyStage.addEventListener("click", (e) => {
        if (!viewersDrawer.classList.contains("hidden")) return;
        if (visibleStories.length <= 1) return;
        const rect = storyStage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.3) renderStory(activeIndex - 1);
        else if (x > rect.width * 0.7) renderStory(activeIndex + 1);
      });

      openViewersBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setPaused(true);
        renderViewers(activeStory);
        viewersDrawer.classList.remove("hidden");
      });

      closeViewersBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        viewersDrawer.classList.add("hidden");
        setPaused(false);
      });

      privacySelect.addEventListener("change", (e) => {
        e.stopPropagation();
        if (!activeStory) return;
        const nextPrivacy = ALLOWED_PRIVACY.includes(e.target.value) ? e.target.value : "public";

        const all = readJson(STORAGE_KEYS.STORIES, []);
        const idx = all.findIndex((s) => String(s.id) === String(activeStory.id));
        if (idx !== -1) {
          all[idx].privacy = nextPrivacy;
          writeJson(STORAGE_KEYS.STORIES, all);
        }

        activeStory.privacy = nextPrivacy;
        storyPrivacyBadge.textContent = getPrivacyLabel(nextPrivacy);
      });

      addHighlightBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!activeStory) return;
        const highlights = readJson(STORAGE_KEYS.HIGHLIGHTS, []);
        if (!highlights.some((h) => String(h.id) === String(activeStory.id))) {
          highlights.unshift({ ...activeStory, highlightedAt: new Date().toISOString() });
          writeJson(STORAGE_KEYS.HIGHLIGHTS, highlights);
        }
        addHighlightBtn.textContent = "✓ Saved";
        setTimeout(() => {
          addHighlightBtn.innerHTML = "<span>＋</span><span>Highlight</span>";
        }, 1200);
      });

      deleteStoryBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteCurrentStory();
      });

      shareStoryBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href).catch(() => {});
        }
        shareStoryBtn.textContent = "✓ Copied";
        setTimeout(() => {
          shareStoryBtn.innerHTML = "<span>↗</span><span>Share</span>";
        }, 1200);
      });

      reactionButtons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleReaction(btn.dataset.emoji);
        });
      });

      activeReactionBadge.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!activeStory) return;
        const current = getUserReaction(activeStory.id);
        if (current) toggleReaction(current);
      });

      sendReplyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        sendMessageToChat(storyReplyInput.value);
      });

      storyReplyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessageToChat(storyReplyInput.value);
        }
      });

      storyReplyInput.addEventListener("focus", () => setPaused(true));
      storyReplyInput.addEventListener("blur", () => {
        if (!storyReplyInput.value.trim()) setPaused(false);
      });

      quickRepliesRow.addEventListener("click", (e) => {
        const chip = e.target.closest(".quick-reply-chip");
        if (!chip) return;
        e.stopPropagation();
        sendMessageToChat(chip.dataset.reply);
      });

      function init() {
        currentUser = getCurrentUser();
        const clean = getCleanActiveStories();
        visibleStories = clean.filter((s) => canUserViewStory(s, currentUser));

        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const requestedId =
          params.get("storyId") || localStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_ID);

        if (requestedId) {
          const found = visibleStories.findIndex((s) => String(s.id) === String(requestedId));
          activeIndex = found >= 0 ? found : 0;
        } else {
          activeIndex = 0;
        }

        renderStory(activeIndex);
        startTimer();
      }

      init();
    })();
  </script>
</body>
  </html>
