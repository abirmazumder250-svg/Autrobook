<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story Card — Autrobook</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root {
      --bg-dark: #202124;
      --bg-elevated: #292a2d;
      --bg-sheet: #242528;
      --text-white: #ffffff;
      --text-muted: #b0b3b8;
      --border-line: rgba(255, 255, 255, 0.16);
      --danger: #d93025;
      --accent-green: #1e6b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    .story-shell {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      max-height: 920px;
      background: var(--bg-dark);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (min-width: 480px) {
      .story-shell {
        height: 94dvh;
        border-radius: 20px;
        border: 1px solid var(--border-line);
      }
    }

    /* Progress Bars */
    .progress-track-group {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      gap: 5px;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--text-white);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    /* Header */
    .story-header {
      position: relative;
      z-index: 25;
      padding: 22px 14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(to bottom, rgba(32, 33, 36, 0.9), transparent);
    }

    .story-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .story-avatar-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--text-white);
      background: var(--bg-elevated);
      overflow: hidden;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .story-avatar-fallback {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .story-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      min-width: 0;
    }

    .story-author-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .story-author-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .privacy-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-white);
      border: 1px solid var(--border-line);
      white-space: nowrap;
    }

    .story-time-ago {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .story-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .icon-btn:hover {
      background: #3c4043;
    }

    /* Main Stage */
    .story-stage {
      position: relative;
      flex: 1;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      overflow: hidden;
      padding: 12px 16px;
      cursor: pointer;
    }

    .story-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .story-text-overlay {
      position: relative;
      z-index: 12;
      padding: 20px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
      color: var(--text-white);
      word-break: break-word;
      max-width: 100%;
    }

    /* Floating Reaction Burst */
    .floating-reaction-burst {
      position: absolute;
      inset: 0;
      z-index: 28;
      pointer-events: none;
      overflow: hidden;
    }

    .burst-emoji {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      animation: floatUp 1.1s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.6);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, -30px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -170px) scale(0.9);
      }
    }

    /* Quick Replies */
    .quick-replies-row {
      position: relative;
      z-index: 25;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 4px 14px 8px;
    }

    .quick-reply-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-reply-chip:hover {
      background: #3c4043;
    }

    /* Owner Controls */
    .owner-controls {
      position: relative;
      z-index: 25;
      padding: 10px 14px 18px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .owner-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .viewer-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .privacy-select {
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .privacy-select option {
      background: var(--bg-dark);
      color: var(--text-white);
    }

    /* Viewers Drawer */
    .viewers-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 58%;
      z-index: 40;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-line);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .viewers-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .viewers-drawer-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .viewers-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .viewer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border-line);
    }

    .viewer-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-item-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--text-white);
    }

    .viewer-item-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-white);
      display: block;
    }

    .viewer-item-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .viewer-item-reaction {
      font-size: 1.2rem;
    }

    /* Viewer Controls */
    .viewer-controls {
      position: relative;
      z-index: 25;
      padding: 8px 12px 18px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reaction-picker-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
    }

    .reaction-btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      font-size: 1.3rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .reaction-btn:hover {
      transform: scale(1.18);
      background: rgba(255, 255, 255, 0.08);
    }

    .reaction-btn.is-selected {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 0 1.5px var(--text-white);
    }

    .viewer-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      border-radius: 999px;
      padding: 4px 6px 4px 14px;
    }

    .story-reply-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-white);
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    .story-reply-input::placeholder {
      color: var(--text-muted);
    }

    .send-reply-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--text-white);
      color: var(--bg-dark);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .active-reaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid var(--text-white);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .active-reaction-badge:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* Bottom Action Sheet & Modals */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-panel {
      width: 100%;
      max-height: 82%;
      background: var(--bg-sheet);
      border-top: 1px solid var(--border-line);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .sheet-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .sheet-option-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-option-btn:hover {
      background: #3c4043;
    }

    .sheet-option-btn.danger {
      color: #ff6b6b;
    }

    .modal-textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-dark);
      color: var(--text-white);
      padding: 10px 12px;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
    }

    .reason-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reason-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 0.84rem;
      cursor: pointer;
    }

    .sheet-actions-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .primary-action-btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent-green);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-action-btn {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-white);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .status-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="story-shell" id="storyShell">
    <div class="progress-track-group" id="progressTrackGroup"></div>

    <header class="story-header">
      <div class="story-user-info" id="authorProfileLink" title="Open profile stories">
        <div class="story-avatar-wrap">
          <img id="storyAuthorAvatar" src="" alt="" class="story-avatar hidden" />
          <span id="storyAvatarFallback" class="story-avatar-fallback"></span>
        </div>
        <div class="story-meta">
          <div class="story-author-row">
            <span id="storyAuthorName" class="story-author-name"></span>
            <span id="storyPrivacyBadge" class="privacy-badge">Public</span>
          </div>
          <span id="storyTimeAgo" class="story-time-ago"></span>
        </div>
      </div>

      <div class="story-header-actions">
        <button type="button" id="moreOptionsBtn" class="icon-btn" title="More options">⋯</button>
        <button type="button" id="togglePauseBtn" class="icon-btn" title="Pause / Resume">❚❚</button>
        <button type="button" id="closeStoryBtn" class="icon-btn" title="Close">✕</button>
      </div>
    </header>

    <main class="story-stage" id="storyStage" title="Click story card">
      <img id="storyMediaImage" class="story-media hidden" alt="Story media" />
      <video id="storyMediaVideo" class="story-media hidden" playsinline autoplay muted loop></video>
      <div id="storyTextOverlay" class="story-text-overlay hidden"></div>
      <div id="floatingReactionBurst" class="floating-reaction-burst"></div>
    </main>

    <div id="quickRepliesRow" class="quick-replies-row hidden">
      <button type="button" class="quick-reply-chip" data-reply="Stay sharp">Stay sharp</button>
      <button type="button" class="quick-reply-chip" data-reply="Nice vibe">Nice vibe</button>
    </div>

    <!-- Owner Controls -->
    <section id="ownerControls" class="owner-controls hidden">
      <div class="owner-top-row">
        <button type="button" id="openViewersBtn" class="viewer-pill-btn">
          <span>👁</span>
          <span id="viewerCountText">0 viewers</span>
        </button>

        <select id="privacySelect" class="privacy-select" aria-label="Story Privacy">
          <option value="public">Public</option>
          <option value="friends">Friends</option>
          <option value="specific">Specific Friends</option>
        </select>
      </div>
    </section>

    <!-- Viewers Drawer (Owner) -->
    <aside id="viewersDrawer" class="viewers-drawer hidden">
      <div class="viewers-drawer-header">
        <h3 id="viewersDrawerTitle">Viewers</h3>
        <button type="button" id="closeViewersBtn" class="icon-btn">✕</button>
      </div>
      <ul id="viewersList" class="viewers-list"></ul>
    </aside>

    <!-- Viewer Controls -->
    <section id="viewerControls" class="viewer-controls hidden">
      <div id="reactionPickerBar" class="reaction-picker-bar">
        <button type="button" class="reaction-btn" data-emoji="❤️" aria-label="Love">❤️</button>
        <button type="button" class="reaction-btn" data-emoji="👍" aria-label="Like">👍</button>
        <button type="button" class="reaction-btn" data-emoji="🥰" aria-label="Care">🥰</button>
        <button type="button" class="reaction-btn" data-emoji="😆" aria-label="Haha">😆</button>
        <button type="button" class="reaction-btn" data-emoji="😢" aria-label="Sad">😢</button>
        <button type="button" class="reaction-btn" data-emoji="😠" aria-label="Angry">😠</button>
        <button type="button" class="reaction-btn" data-emoji="😮" aria-label="Wow">😮</button>
      </div>

      <div class="viewer-bottom-row">
        <div class="message-input-wrap">
          <input
            type="text"
            id="storyReplyInput"
            class="story-reply-input"
            placeholder="Send message..."
            autocomplete="off"
          />
          <button type="button" id="sendReplyBtn" class="send-reply-btn" title="Send message">➤</button>
        </div>

        <button type="button" id="activeReactionBadge" class="active-reaction-badge hidden" title="Undo reaction">
          <span>↩</span>
          <span id="activeReactionEmoji"></span>
          <span>Undo</span>
        </button>
      </div>
    </section>

    <!-- Owner Three-Dot Menu Sheet -->
    <div id="ownerMenuSheet" class="sheet-backdrop hidden">
      <div class="sheet-panel">
        <div class="sheet-header">
          <span class="sheet-title">Story Options</span>
          <button type="button" id="closeOwnerMenuBtn" class="icon-btn">✕</button>
        </div>
        <button type="button" id="ownerEditBtn" class="sheet-option-btn">
          <span>Edit</span>
          <span>✎</span>
        </button>
        <button type="button" id="ownerHighlightBtn" class="sheet-option-btn">
          <span>Highlights</span>
          <span>★</span>
        </button>
        <button type="button" id="ownerDeleteBtn" class="sheet-option-btn danger">
          <span>Delete</span>
          <span>🗑</span>
        </button>
      </div>
    </div>

    <!-- Edit Story Modal (Owner) -->
    <div id="editStorySheet" class="sheet-backdrop hidden">
      <div class="sheet-panel">
        <div class="sheet-header">
          <span class="sheet-title">Edit Story</span>
          <button type="button" id="closeEditSheetBtn" class="icon-btn">✕</button>
        </div>
        <textarea id="editStoryTextarea" class="modal-textarea" placeholder="Update story text..."></textarea>
        <div class="sheet-actions-row">
          <button type="button" id="cancelEditBtn" class="secondary-action-btn">Cancel</button>
          <button type="button" id="saveEditBtn" class="primary-action-btn">Save</button>
        </div>
      </div>
    </div>

    <!-- Viewer Three-Dot Menu Sheet -->
    <div id="viewerMenuSheet" class="sheet-backdrop hidden">
      <div class="sheet-panel">
        <div class="sheet-header">
          <span class="sheet-title">Options</span>
          <button type="button" id="closeViewerMenuBtn" class="icon-btn">✕</button>
        </div>
        <a id="viewerCreateMessageLink" href="message.html" class="sheet-option-btn" style="text-decoration: none;">
          <span>Create message</span>
          <span>✉</span>
        </a>
        <button type="button" id="viewerUndoReactBtn" class="sheet-option-btn">
          <span>↩ React undo</span>
          <span id="viewerMenuReactPreview"></span>
        </button>
        <button type="button" id="viewerOpenReportBtn" class="sheet-option-btn danger">
          <span>Report</span>
          <span>⚑</span>
        </button>
      </div>
    </div>

    <!-- Report Story Modal (10 Valid Reasons + Submit + Send) -->
    <div id="reportStorySheet" class="sheet-backdrop hidden">
      <div class="sheet-panel">
        <div class="sheet-header">
          <span class="sheet-title">Report Story</span>
          <button type="button" id="closeReportSheetBtn" class="icon-btn">✕</button>
        </div>

        <div id="reportReasonsList" class="reason-list"></div>

        <textarea
          id="reportDetailsTextarea"
          class="modal-textarea"
          placeholder="Add valid details about this issue..."
        ></textarea>

        <div id="reportStatusNote" class="status-note"></div>

        <div class="sheet-actions-row">
          <button type="button" id="submitReportBtn" class="secondary-action-btn">Submit</button>
          <button type="button" id="sendReportEmailBtn" class="primary-action-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

      const FORTY_EIGHT_HOURS_MS = 48 * 60 * 60 * 1000;
      const STORY_DURATION_SECONDS = 5;
      const ALLOWED_REACTIONS = ["❤️", "👍", "🥰", "😆", "😢", "😠", "😮"];
      const ALLOWED_PRIVACY = ["public", "friends", "specific"];

      const REPORT_REASONS = [
        "Harassment or bullying",

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playReactSound(emoji) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const freqMap = {
          "❤️": 587.33,
          "👍": 523.25,
          "🥰": 659.25,
          "😆": 783.99,
          "😢": 392.0,
          "😠": 261.63,
          "😮": 880.0
        };
        const freq = freqMap[emoji] || 587.33;
        osc.type = emoji === "😠" ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq * 0.85, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + 0.14);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.24);
      }

      function playUndoSound() {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.16);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }

      function normalizeStory(raw) {
        if (!raw || typeof raw !== "object") return null;
        const id = String(raw.id || raw.storyId || raw.story_id || "").trim();
        if (!id) return null;

        const createdRaw = raw.createdAt || raw.created_at || raw.time || Date.now();
        const createdMs = typeof createdRaw === "number" ? createdRaw : new Date(createdRaw).getTime();
        const safeCreatedMs = Number.isNaN(createdMs) ? Date.now() : createdMs;
        const expiresRaw = raw.expires_at || raw.expiresAt;
        const expiresMs = expiresRaw ? new Date(expiresRaw).getTime() : (safeCreatedMs + FORTY_EIGHT_HOURS_MS);

        const mediaUrl = String(
          raw.mediaUrl || raw.media_url || raw.image || raw.image_url || raw.video_url || ""
        ).trim();
        const mediaType = String(
          raw.mediaType || raw.media_type || (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(mediaUrl) ? "video" : "image")
        ).toLowerCase();

        const rawPrivacy = String(raw.privacy || raw.audience || "public").toLowerCase();
        const privacy = rawPrivacy === "specific_friend"
          ? "specific"
          : (ALLOWED_PRIVACY.includes(rawPrivacy) ? rawPrivacy : "public");

        return {
          ...raw,
          id,
          ownerId: String(raw.ownerId || raw.user_id || raw.author_id || "").trim(),
          authorName: String(raw.authorName || raw.author_name || raw.name || "").trim(),
          authorAvatar: String(raw.authorAvatar || raw.author_avatar || raw.avatar || "").trim(),
          mediaUrl,
          media_url: mediaUrl,
          mediaType: mediaType.startsWith("video") ? "video" : "image",
          text: String(raw.text ?? raw.caption ?? raw.title ?? "").trim(),
          privacy,
          createdAt: new Date(safeCreatedMs).toISOString(),
          expiresAtMs: Number.isNaN(expiresMs) ? (safeCreatedMs + FORTY_EIGHT_HOURS_MS) : expiresMs,
          viewers: Array.isArray(raw.viewers) ? raw.viewers : []
        };
      }

      function isExpired(story, nowMs = Date.now()) {
        const norm = normalizeStory(story);
        if (!norm) return true;
        if (nowMs >= norm.expiresAtMs) return true;
        const ms = new Date(norm.createdAt).getTime();
        if (Number.isNaN(ms)) return true;
        return nowMs - ms >= FORTY_EIGHT_HOURS_MS;
      }

      async function deleteStoryFromSupabase(story) {
        const cleanId = String(story?.id || "").trim();
        if (!cleanId) return;

        try {
          await fetch(`${SUPABASE_URL}/rest/v1/stories?id=eq.${encodeURIComponent(cleanId)}`, {
            method: "DELETE",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          });
        } catch (_) {}

        const rawUrl = String(story?.mediaUrl || story?.media_url || "").trim();
        const marker = "/storage/v1/object/public/stories/";
        const idx = rawUrl.indexOf(marker);
        if (idx !== -1) {
          const objPath = decodeURIComponent(rawUrl.slice(idx + marker.length).split("?")[0]);
          if (objPath) {
            try {
              await fetch(`${SUPABASE_URL}/storage/v1/object/stories/${encodeURIComponent(objPath)}`, {
                method: "DELETE",
                headers: {
                  apikey: SUPABASE_ANON_KEY,
                  Authorization: `Bearer ${SUPABASE_ANON_KEY}`
                }
              });
            } catch (_) {}
          }
        }
      }

      async function updateStoryTextInSupabase(storyId, nextText) {

            method: "PATCH",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: nextText, caption: nextText })
          });
        } catch (_) {}
      }

      async function fetchStoriesFromSupabase() {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/stories?select=*&order=created_at.desc`, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          });
          if (!res.ok) return [];
          const rows = await res.json();
          if (!Array.isArray(rows)) return [];
          return rows.map(normalizeStory).filter((s) => s && !isExpired(s));
        } catch {
          return [];
        }
      }

      function syncAllStoryLists(validStories) {
        STORY_LIST_KEYS.forEach((key) => {
          try {
            const existing = readJson(key, []);
            if (Array.isArray(existing)) {
              const filtered = existing
                .map(normalizeStory)
                .filter((s) => s && !isExpired(s));
              writeJson(key, filtered);
            }
          } catch (_) {}
        });
        writeJson(STORAGE_KEYS.STORIES, validStories);
      }

      function getLocalActiveStories() {
        const nowMs = Date.now();
        const mergedMap = new Map();

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            arr.forEach((item) => {
              const norm = normalizeStory(item);
              if (!norm) return;
              if (isExpired(norm, nowMs)) {
                deleteStoryFromSupabase(norm);
                return;
              }
              mergedMap.set(norm.id, { ...mergedMap.get(norm.id), ...norm });
            });
          }
        });

        try {
          const sessionCard = JSON.parse(sessionStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_CARD) || "null");
          const normSession = normalizeStory(sessionCard);
          if (normSession) {
            if (isExpired(normSession, nowMs)) {
              sessionStorage.removeItem(STORAGE_KEYS.ACTIVE_STORY_CARD);
              deleteStoryFromSupabase(normSession);
            } else if (!mergedMap.has(normSession.id)) {
              mergedMap.set(normSession.id, normSession);
            }
          }
        } catch (_) {}

        const valid = Array.from(mergedMap.values()).sort(
          (a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime()
        );

        syncAllStoryLists(valid);
        return valid;
      }

        } catch {

        }

      function isOwner(story) {
        if (!story || !currentUser || !currentUser.id || !story.ownerId) return false;
        return String(story.ownerId) === String(currentUser.id);
      }

      function canUserViewStory(story, user) {
        if (!story || isExpired(story)) return false;
        if (user && user.id && String(story.ownerId) === String(user.id)) return true;

        const privacy = ALLOWED_PRIVACY.includes(story.privacy) ? story.privacy : "public";
        const viewerId = user && user.id ? String(user.id) : "";

        if (privacy === "public") return true;
        if (privacy === "friends") {
          const authorFriends = Array.isArray(story.ownerFriends) ? story.ownerFriends.map(String) : [];
          const userFriends = user && Array.isArray(user.friends) ? user.friends.map(String) : [];
          return authorFriends.includes(viewerId) || userFriends.includes(String(story.ownerId));
        }
        if (privacy === "specific") {
          const allowed = Array.isArray(story.allowedFriendIds)
            ? story.allowedFriendIds.map(String)
            : [];
          return allowed.includes(viewerId);
        }
        return false;
      }

      function getPrivacyLabel(privacy) {
        if (privacy === "friends") return "Friends";
        if (privacy === "specific") return "Specific Friends";
        return "Public";
      }

      function formatTimeAgo(createdAt) {
        const ms = new Date(createdAt).getTime();
        if (Number.isNaN(ms)) return "Just now";
        const sec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
        if (sec < 60) return `${sec}s`;
        const min = Math.floor(sec / 60);
        if (min < 60) return `${min}m`;
        const hr = Math.floor(min / 60);
        return `${hr}h`;
      }

      function toggleReaction(emoji) {
        if (!activeStory || !ALLOWED_REACTIONS.includes(emoji)) return;
        if (isOwner(activeStory)) return;
        const actorId = (currentUser && currentUser.id) || "guest";

        const map = readJson(STORAGE_KEYS.REACTIONS, {});
        if (!map[activeStory.id]) map[activeStory.id] = {};

        const prev = map[activeStory.id][actorId] || null;
        if (prev === emoji) {
          delete map[activeStory.id][actorId];
          writeJson(STORAGE_KEYS.REACTIONS, map);
          playUndoSound();
        } else {
          map[activeStory.id][actorId] = emoji;
          writeJson(STORAGE_KEYS.REACTIONS, map);
          playReactSound(emoji);
          spawnBurst(emoji);
        }

        syncReactionButtons(activeStory.id);
      }

      function undoCurrentReaction() {
        if (!activeStory) return;
        const current = getUserReaction(activeStory.id);
        if (current) {
          toggleReaction(current);
        }
      }

      function recordView(story) {
        if (!story || isOwner(story) || !currentUser || !currentUser.id) return;
        const all = readJson(STORAGE_KEYS.STORIES, []);
        const idx = all.findIndex((s) => String(s.id) === String(story.id));
        if (idx === -1) return;

        const viewers = Array.isArray(all[idx].viewers) ? all[idx].viewers : [];
        const existingIdx = viewers.findIndex((v) => String(v.id) === String(currentUser.id));
        const entry = {
          id: currentUser.id,
          name: currentUser.name || "",
          avatar: currentUser.avatar || "",
          viewedAt: new Date().toISOString()
        };

        if (existingIdx >= 0) {
          viewers[existingIdx] = { ...viewers[existingIdx], ...entry };
        } else {
          viewers.unshift(entry);
        }

        all[idx].viewers = viewers;
        writeJson(STORAGE_KEYS.STORIES, all);
        activeStory.viewers = viewers;
      }

      function renderViewers(story) {
        const viewers = Array.isArray(story.viewers) ? story.viewers : [];
        const reactionsMap = readJson(STORAGE_KEYS.REACTIONS, {});
        const storyRxns = reactionsMap[story.id] || {};

        viewerCountText.textContent = `${viewers.length} ${viewers.length === 1 ? "viewer" : "viewers"}`;
        viewersDrawerTitle.textContent = `Viewers (${viewers.length})`;
        viewersList.innerHTML = "";

        if (!viewers.length) {
          const li = document.createElement("li");
          li.className = "viewer-item-meta";
          li.textContent = "No viewers yet.";
          viewersList.appendChild(li);
          return;
        }

        viewers.forEach((v) => {
          const li = document.createElement("li");
          li.className = "viewer-item";

          const left = document.createElement("div");
          left.className = "viewer-item-left";

          if (v.avatar) {
            const img = document.createElement("img");
            img.className = "viewer-item-avatar";
            img.src = v.avatar;
            img.alt = v.name || "";
            left.appendChild(img);
          }

          const info = document.createElement("div");
          const nameEl = document.createElement("span");
          nameEl.className = "viewer-item-name";
          nameEl.textContent = v.name || "";

          const timeEl = document.createElement("span");
          timeEl.className = "viewer-item-meta";
          timeEl.textContent = `Viewed ${formatTimeAgo(v.viewedAt)} ago`;

          info.appendChild(nameEl);
          info.appendChild(timeEl);
          left.appendChild(info);
          li.appendChild(left);

          const rxn = storyRxns[v.id];
          if (rxn) {
            const rxnEl = document.createElement("span");
            rxnEl.className = "viewer-item-reaction";
            rxnEl.textContent = rxn;
            li.appendChild(rxnEl);
          }

          viewersList.appendChild(li);
        });
      }

      async function renderStory(index) {
        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }

        activeIndex = ((index % visibleStories.length) + visibleStories.length) % visibleStories.length;
        activeStory = visibleStories[activeIndex];

        if (isExpired(activeStory)) {
          deleteStoryFromSupabase(activeStory);
          refreshStories();
          return;
        }

        try {
          sessionStorage.setItem(STORAGE_KEYS.ACTIVE_STORY_CARD, JSON.stringify(activeStory));
          localStorage.setItem(STORAGE_KEYS.ACTIVE_STORY_ID, activeStory.id);
        } catch (_) {}

        recordView(activeStory);

        const currentPrivacy = ALLOWED_PRIVACY.includes(activeStory.privacy)
          ? activeStory.privacy
          : "public";

        applyAuthorHeader(activeStory, null);
        storyPrivacyBadge.textContent = getPrivacyLabel(currentPrivacy);
        storyTimeAgo.textContent = formatTimeAgo(activeStory.createdAt);

        fetchAuthorProfileFromSupabase(activeStory).then((profile) => {
          if (profile && activeStory) {
            applyAuthorHeader(activeStory, profile);
          }
        });

        storyMediaImage.classList.add("hidden");
        storyMediaVideo.classList.add("hidden");
        storyTextOverlay.classList.add("hidden");
        storyMediaVideo.pause();

        if (activeStory.mediaType === "video" && activeStory.mediaUrl) {
          storyMediaVideo.src = activeStory.mediaUrl;
          storyMediaVideo.classList.remove("hidden");
          storyMediaVideo.play().catch(() => {});
        } else if (activeStory.mediaUrl) {
          storyMediaImage.src = activeStory.mediaUrl;
          storyMediaImage.classList.remove("hidden");
        }

        if (activeStory.text) {
          storyTextOverlay.textContent = activeStory.text;
          storyTextOverlay.classList.remove("hidden");
        }

        const ownerMode = isOwner(activeStory);

        if (ownerMode) {
          ownerControls.classList.remove("hidden");
          viewerControls.classList.add("hidden");
          quickRepliesRow.classList.add("hidden");
          privacySelect.value = currentPrivacy;
          renderViewers(activeStory);
        } else {
          ownerControls.classList.add("hidden");
          viewersDrawer.classList.add("hidden");
          viewerControls.classList.remove("hidden");
          quickRepliesRow.classList.remove("hidden");
          syncReactionButtons(activeStory.id);

          const msgParams = new URLSearchParams();
          if (activeStory.ownerId) msgParams.set("toUserId", activeStory.ownerId);
          msgParams.set("storyId", activeStory.id);
          viewerCreateMessageLink.href = `message.html?${msgParams.toString()}`;
        }

        renderProgress();
        elapsedSeconds = 0;
        updateProgressWidth();
      }

      function refreshStories() {
        const clean = getLocalActiveStories();
        visibleStories = clean.filter((s) => canUserViewStory(s, currentUser));
        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }
        renderStory(0);
      }

      function sendMessageToChat(text) {
        const messageText = (text || "").trim();
        if (!messageText || !activeStory) return;

        const payload = {
          toUserId: activeStory.ownerId || "",
          toUserName: activeStory.authorName || "",
          fromUserId: (currentUser && currentUser.id) || "",
          fromUserName: (currentUser && currentUser.name) || "",
          storyId: activeStory.id,
          message: messageText,
          sentAt: new Date().toISOString()
        };

        writeJson(STORAGE_KEYS.PENDING_CHAT, payload);

        const targetUrl =
          `message.html?toUserId=${encodeURIComponent(payload.toUserId)}` +
          `&storyId=${encodeURIComponent(payload.storyId)}` +
          `&msg=${encodeURIComponent(payload.message)}`;

        window.location.href = targetUrl;
      }

      function saveEditedStoryText(nextText) {
        if (!activeStory) return;
        const cleanText = String(nextText || "").trim();
        activeStory.text = cleanText;
        activeStory.caption = cleanText;

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            const idx = arr.findIndex((s) => String(s?.id || s?.storyId || "") === String(activeStory.id));
            if (idx !== -1) {
              arr[idx] = { ...arr[idx], text: cleanText, caption: cleanText };
              writeJson(key, arr);
            }
          }
        });

        try {
          sessionStorage.setItem(STORAGE_KEYS.ACTIVE_STORY_CARD, JSON.stringify(activeStory));
        } catch (_) {}

        updateStoryTextInSupabase(activeStory.id, cleanText);

        if (cleanText) {
          storyTextOverlay.textContent = cleanText;
          storyTextOverlay.classList.remove("hidden");
        } else {
          storyTextOverlay.textContent = "";
          storyTextOverlay.classList.add("hidden");
        }
      }

      function addCurrentStoryToHighlights() {
        if (!activeStory || isExpired(activeStory)) return;
        const highlights = readJson(STORAGE_KEYS.HIGHLIGHTS, []);
        const list = Array.isArray(highlights) ? highlights : [];

        const highlightItem = {
          id: activeStory.id,
          highlightedAt: new Date().toISOString(),
          storyCard: { ...activeStory }
        };

        const idx = list.findIndex((h) => String(h?.id) === String(activeStory.id));
        if (idx >= 0) {
          list[idx] = highlightItem;
        } else {
          list.unshift(highlightItem);
        }

        writeJson(STORAGE_KEYS.HIGHLIGHTS, list);
      }

      async function deleteCurrentStory() {
        if (!activeStory) return;
        const targetId = String(activeStory.id);
        await deleteStoryFromSupabase(activeStory);

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            writeJson(key, arr.filter((s) => String(s?.id || s?.storyId || "") !== targetId));
          }
        });

        try {
          sessionStorage.removeItem(STORAGE_KEYS.ACTIVE_STORY_CARD);
          if (localStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_ID) === targetId) {
            localStorage.removeItem(STORAGE_KEYS.ACTIVE_STORY_ID);
          }
          if (storySyncChannel) {
            storySyncChannel.postMessage({ type: "STORY_DELETED", storyId: targetId });
          }
        } catch (_) {}

        goToIndexPage();
      }

      function goToIndexPage() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        window.location.href = "index.html";
      }

      function startTimer() {
        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
          if (activeStory && isExpired(activeStory)) {
            deleteStoryFromSupabase(activeStory);
            refreshStories();
            return;
          }
          if (isPaused) return;
          elapsedSeconds += 0.1;
          updateProgressWidth();

          if (elapsedSeconds >= STORY_DURATION_SECONDS) {
            if (visibleStories.length > 1) {
              renderStory(activeIndex + 1);
            } else {
              goToIndexPage();
            }
          }
        }, 100);
      }

      function setPaused(paused) {
        isPaused = paused;
        togglePauseBtn.textContent = isPaused ? "▶" : "❚❚";
        if (activeStory && activeStory.mediaType === "video") {
          if (isPaused) storyMediaVideo.pause();
          else storyMediaVideo.play().catch(() => {});
        }
      }

      function buildReportReasonsUI() {
        reportReasonsList.innerHTML = "";
        REPORT_REASONS.forEach((reason, i) => {
          const label = document.createElement("label");
          label.className = "reason-item";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "storyReportReason";
          radio.value = reason;
          radio.id = `report_reason_${i}`;
          radio.addEventListener("change", () => {
            selectedReportReason = reason;
            reportStatusNote.textContent = "";
          });

          const span = document.createElement("span");
          span.textContent = `${i + 1}. ${reason}`;

          label.appendChild(radio);
          label.appendChild(span);
          reportReasonsList.appendChild(label);
        });
      }

      function validateReportPayload() {
        const details = (reportDetailsTextarea.value || "").trim();
        if (!selectedReportReason) {
          reportStatusNote.textContent = "Please select one of the 10 valid reasons.";
          return null;
        }
        if (details.length < 5) {
          reportStatusNote.textContent = "Please enter valid details (at least 5 characters).";
          return null;
        }
        return {
          storyId: activeStory ? activeStory.id : "",
          storyOwnerId: activeStory ? activeStory.ownerId : "",
          storyAuthorName: activeStory ? activeStory.authorName : "",
          storyUrl: window.location.href,
          reporterId: (currentUser && currentUser.id) || "",
          reporterName: (currentUser && currentUser.name) || "",
          reason: selectedReportReason,
          details,
          submittedAt: new Date().toISOString()
        };
      }

      function saveReportLocally(payload) {
        const reports = readJson(STORAGE_KEYS.REPORTS, []);
        const list = Array.isArray(reports) ? reports : [];
        list.unshift(payload);
        writeJson(STORAGE_KEYS.REPORTS, list);
      }

      async function sendReportToEmailEndpoint(payload) {
        const res = await fetch("/api/report-story", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          throw new Error("Failed to send report email");
        }
        return res.json().catch(() => ({ ok: true }));
      }

      authorProfileLink.addEventListener("click", (e) => {
        e.stopPropagation();
        openProfileStoriesPage();
      });

      moreOptionsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setPaused(true);
        if (isOwner(activeStory)) {
          ownerMenuSheet.classList.remove("hidden");
        } else {
          syncReactionButtons(activeStory.id);
          viewerMenuSheet.classList.remove("hidden");
        }
      });

      closeOwnerMenuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        ownerMenuSheet.classList.add("hidden");
        setPaused(false);
      });

      ownerEditBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        ownerMenuSheet.classList.add("hidden");
        editStoryTextarea.value = activeStory ? (activeStory.text || "") : "";
        editStorySheet.classList.remove("hidden");
      });

      closeEditSheetBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        editStorySheet.classList.add("hidden");
        setPaused(false);
      });

      cancelEditBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        editStorySheet.classList.add("hidden");
        setPaused(false);
      });

      saveEditBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        saveEditedStoryText(editStoryTextarea.value);
        editStorySheet.classList.add("hidden");
        setPaused(false);
      });

      ownerHighlightBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        addCurrentStoryToHighlights();
        ownerHighlightBtn.firstElementChild.textContent = "Highlights (Added)";
        setTimeout(() => {
          ownerHighlightBtn.firstElementChild.textContent = "Highlights";
          ownerMenuSheet.classList.add("hidden");
          setPaused(false);
        }, 700);
      });

      ownerDeleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteCurrentStory();
      });

      closeViewerMenuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        viewerMenuSheet.classList.add("hidden");
        setPaused(false);
      });

      viewerUndoReactBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        undoCurrentReaction();
        viewerMenuSheet.classList.add("hidden");
        setPaused(false);
      });

      viewerOpenReportBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        viewerMenuSheet.classList.add("hidden");
        selectedReportReason = "";
        reportDetailsTextarea.value = "";
        reportStatusNote.textContent = "";
        buildReportReasonsUI();
        reportStorySheet.classList.remove("hidden");
      });

      closeReportSheetBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        reportStorySheet.classList.add("hidden");
        setPaused(false);
      });

      submitReportBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const payload = validateReportPayload();
        if (!payload) return;
        saveReportLocally(payload);
        reportStatusNote.textContent = "Report submitted. Click Send to email.";
      });

      sendReportEmailBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const payload = validateReportPayload();
        if (!payload) return;
        saveReportLocally(payload);
        reportStatusNote.textContent = "Sending report...";
        try {
          await sendReportToEmailEndpoint(payload);
          reportStatusNote.textContent = "Report sent.";
          setTimeout(() => {
            reportStorySheet.classList.add("hidden");
            setPaused(false);
          }, 900);
        } catch {
          reportStatusNote.textContent = "Saved locally. Configure /api/report-story with Gmail env vars to send email.";
        }
      });

      togglePauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setPaused(!isPaused);
      });

      closeStoryBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        goToIndexPage();
      });

      storyStage.addEventListener("click", (e) => {
        if (!viewersDrawer.classList.contains("hidden")) return;
        const rect = storyStage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (visibleStories.length > 1 && x < rect.width * 0.22) {
          renderStory(activeIndex - 1);
          return;
        }
        if (visibleStories.length > 1 && x > rect.width * 0.78) {
          renderStory(activeIndex + 1);
          return;
        }
        openProfileStoriesPage();
      });

      openViewersBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setPaused(true);
        renderViewers(activeStory);
        viewersDrawer.classList.remove("hidden");
      });

      closeViewersBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        viewersDrawer.classList.add("hidden");
        setPaused(false);
      });

      privacySelect.addEventListener("change", (e) => {
        e.stopPropagation();
        if (!activeStory) return;
        const nextPrivacy = ALLOWED_PRIVACY.includes(e.target.value) ? e.target.value : "public";

        STORY_LIST_KEYS.forEach((key) => {
          const arr = readJson(key, []);
          if (Array.isArray(arr)) {
            const idx = arr.findIndex((s) => String(s?.id || s?.storyId || "") === String(activeStory.id));
            if (idx !== -1) {
              arr[idx].privacy = nextPrivacy;
              writeJson(key, arr);
            }
          }
        });

        activeStory.privacy = nextPrivacy;
        storyPrivacyBadge.textContent = getPrivacyLabel(nextPrivacy);
      });

      reactionButtons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleReaction(btn.dataset.emoji);
        });
      });

      activeReactionBadge.addEventListener("click", (e) => {
        e.stopPropagation();
        undoCurrentReaction();
      });

      sendReplyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        sendMessageToChat(storyReplyInput.value);
      });

      storyReplyInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessageToChat(storyReplyInput.value);
        }
      });

      storyReplyInput.addEventListener("focus", () => setPaused(true));
      storyReplyInput.addEventListener("blur", () => {
        if (!storyReplyInput.value.trim()) setPaused(false);
      });

      quickRepliesRow.addEventListener("click", (e) => {
        const chip = e.target.closest(".quick-reply-chip");
        if (!chip) return;
        e.stopPropagation();
        sendMessageToChat(chip.dataset.reply);
      });

      async function init() {
        currentUser = getCurrentUser();
        const remoteStories = await fetchStoriesFromSupabase();
        const localStories = getLocalActiveStories();

        const merged = new Map();
        localStories.forEach((s) => merged.set(s.id, s));
        remoteStories.forEach((s) => merged.set(s.id, { ...merged.get(s.id), ...s }));

        const combined = Array.from(merged.values())
          .filter((s) => s && !isExpired(s))
          .sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());

        syncAllStoryLists(combined);
        visibleStories = combined.filter((s) => canUserViewStory(s, currentUser));

        if (!visibleStories.length) {
          goToIndexPage();
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const requestedId =
          params.get("storyId") || params.get("id") || localStorage.getItem(STORAGE_KEYS.ACTIVE_STORY_ID);

        if (requestedId) {
          const found = visibleStories.findIndex((s) => String(s.id) === String(requestedId));
          activeIndex = found >= 0 ? found : 0;
        } else {
          activeIndex = 0;
        }

        renderStory(activeIndex);
        startTimer();
      }

      init();
    })();
  </script>
</body>
