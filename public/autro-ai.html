<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autro AI Assistant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #ffffff;
      --bg-surface: #ffffff;
      --bg-card: #f4f5f7;
      --bg-card-hover: #eaecef;
      --bg-tile: #e4e6eb;
      --bg-user: #050505;
      --bg-ai: #f0f2f5;
      --text-main: #050505;
      --text-muted: #55585e;
      --text-user: #ffffff;
      --text-ai: #050505;
      --border-color: #d8dce0;
      --tick-bg: #050505;
      --tick-color: #ffffff;
      --send-ready-bg: #050505;
      --send-ready-color: #ffffff;
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.06);
      --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0b0b0c;
        --bg-surface: #121214;
        --bg-card: #1d1e22;
        --bg-card-hover: #26282d;
        --bg-tile: #2e3036;
        --bg-user: #ffffff;
        --bg-ai: #1d1e22;
        --text-main: #ffffff;
        --text-muted: #b5b8c0;
        --text-user: #050505;
        --text-ai: #ffffff;
        --border-color: #2c2e33;
        --tick-bg: #ffffff;
        --tick-color: #050505;
        --send-ready-bg: #ffffff;
        --send-ready-color: #050505;
        --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.45);
        --shadow-soft: 0 3px 12px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.12s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: var(--bg-card);
    }

    .icon-btn:active,
    .suggestion-card:active,
    .send-btn:active {
      transform: scale(0.98);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .header-logo-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 12px;
      color: var(--text-main);
    }

    .header-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-fallback-text {
      display: none;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--text-main);
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified-tick {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--tick-bg);
      color: var(--tick-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin: auto;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 18px 8px;
    }

    .hero-logo-box {
      width: 92px;
      height: 92px;
      border-radius: 26px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
      font-size: 26px;
    }

    .hero-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-heading {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-main);
      margin-bottom: 22px;
    }

    .suggestion-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .suggestion-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 14px;
      border-radius: 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .suggestion-card:hover {
      background-color: var(--bg-card-hover);
    }

    .suggestion-tile {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background-color: var(--bg-tile);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .suggestion-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      gap: 4px;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow-soft);
    }

    .message-row.user .message-bubble {
      background-color: var(--bg-user);
      color: var(--text-user);
      border-bottom-right-radius: 5px;
      font-weight: 500;
    }

    .message-row.assistant .message-bubble {
      background-color: var(--bg-ai);
      color: var(--text-ai);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 5px;
    }

    .message-meta {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 5px;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 2px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-ai);
      opacity: 0.4;
      animation: bounceDot 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounceDot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .footer-area {
      padding: 8px 16px 14px;
      background-color: var(--bg-surface);
    }

    .disclaimer-note {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-muted);
      text-align: center;
      max-width: 640px;
      margin: 0 auto 12px;
    }

    .composer-form {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 26px;
      padding: 6px 8px 6px 16px;
    }

    .prompt-input {
      flex: 1;
      min-height: 40px;
      max-height: 120px;
      padding: 8px 4px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.4;
      resize: none;
      outline: none;
    }

    .prompt-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background-color: var(--bg-tile);
      color: var(--text-main);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    }

    .send-btn.ready {
      background-color: var(--send-ready-bg);
      color: var(--send-ready-color);
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app-shell {
        border-left: none;
        border-right: none;
      }

      .hero-heading {
        font-size: 23px;
      }

      .suggestion-text {
        font-size: 15px;
      }

      .message-row {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <a href="javascript:history.back()" class="icon-btn" aria-label="Back" title="Back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="brand-header">
          <div class="header-logo-wrap">
            <img class="autro-logo-img" src="/au.png" alt="Autro AI Assistant" />
            <span class="logo-fallback-text">AU</span>
          </div>
          <div class="brand-title-row">
            <span class="brand-title" id="headerTitle">Autro AI Assistant</span>
            <span class="verified-tick" title="Autro AI Assistant">
              <i class="fa-solid fa-check"></i>
            </span>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <button type="button" id="clearChatBtn" class="icon-btn" aria-label="New chat" title="New chat">
          <i class="fa-regular fa-pen-to-square"></i>
        </button>
      </div>
    </header>

    <main id="chatContainer" class="chat-container">
      <div id="emptyState" class="empty-state">
        <div class="hero-logo-box">
          <img class="autro-logo-img" src="/au.png" alt="Autro AI Assistant" />
          <span class="logo-fallback-text">AU</span>
        </div>

        <h1 class="hero-heading">Need help? Just ask.</h1>

        <div class="suggestion-list">
          <button type="button" class="suggestion-card" data-prompt="How can Autro AI Assistant help me today?">
            <span class="suggestion-tile">
              <i class="fa-solid fa-bolt"></i>
            </span>
            <span class="suggestion-text">How can Autro AI Assistant help me today?</span>
          </button>

          <button type="button" class="suggestion-card" data-prompt="Explain a topic clearly in simple English">
            <span class="suggestion-tile">
              <i class="fa-solid fa-language"></i>
            </span>
            <span class="suggestion-text">Explain a topic clearly in simple English</span>
          </button>

          <button type="button" class="suggestion-card" data-prompt="Give me a quick creative idea for my project">
            <span class="suggestion-tile">
              <i class="fa-solid fa-lightbulb"></i>
            </span>
            <span class="suggestion-text">Give me a quick creative idea for my project</span>
          </button>
        </div>
      </div>
    </main>

    <div class="footer-area">
      <p class="disclaimer-note">
        Default language is English. After your first message, Autro AI Assistant replies in the language you use.
      </p>

      <form id="chatForm" class="composer-form">
        <textarea
          id="promptInput"
          class="prompt-input"
          rows="1"
          placeholder="Ask anything..."
          required
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
          <i class="fa-solid fa-location-arrow" style="transform: rotate(45deg);"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const API_ENDPOINT = '/api/autro-ai';
      const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
      const CHAT_STORAGE_KEY = 'autro_ai_chat_history_v3';

      let supabaseClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (_) {}

      const chatContainer = document.getElementById('chatContainer');
      const emptyState = document.getElementById('emptyState');
      const chatForm = document.getElementById('chatForm');
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const clearChatBtn = document.getElementById('clearChatBtn');

      const conversationHistory = [];
      const savedMessages = [];
      let profileContext = {
        userId: '',
        fullName: '',
        username: '',
        email: '',
        bio: '',
        location: '',
        education: ''
      };

      function initLogoAutoDetect() {
        const logoPaths = [
          '/au.png',
          'au.png',
          './au.png',
          '../au.png',
          '/images/au.png',
          'images/au.png',
          '/assets/au.png',
          'assets/au.png',
          '/public/au.png'
        ];

        const imgs = document.querySelectorAll('.autro-logo-img');
        imgs.forEach((img) => {
          let index = 0;
          const fallbackEl = img.nextElementSibling;

          function tryNextPath() {
            if (index >= logoPaths.length) {
              img.style.display = 'none';
              if (fallbackEl) fallbackEl.style.display = 'inline-flex';
              return;
            }
            const candidate = logoPaths[index++];
            img.onload = () => {
              img.style.display = 'block';
              if (fallbackEl) fallbackEl.style.display = 'none';
            };
            img.onerror = tryNextPath;
            img.src = candidate;
          }

          tryNextPath();
        });
      }

      function saveChatToStorage() {
        try {
          localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(savedMessages.slice(-100)));
        } catch (_) {}
      }

      function restoreChatFromStorage() {
        try {
          const raw = localStorage.getItem(CHAT_STORAGE_KEY);
          if (!raw) return;
          const list = JSON.parse(raw);
          if (!Array.isArray(list) || list.length === 0) return;

          for (const item of list) {
            if (!item || typeof item.text !== 'string' || !item.role) continue;
            savedMessages.push(item);
            conversationHistory.push({
              role: item.role === 'user' ? 'user' : 'model',
              text: item.text
            });
            renderBubble(item.role, item.text, item.meta || formatTime());
          }
        } catch (_) {}
      }

      function readCachedProfile() {
        const info = {
          userId: '',
          fullName: '',
          username: '',
          email: '',
          bio: '',
          location: '',
          education: ''
        };
        try {
          const keys = [
            'autro_account_profile',
            'autrobook_user',
            'autro_user_profile',
            'current_user',
            'autrobook_current_user'
          ];
          for (const key of keys) {
            const raw = localStorage.getItem(key) || sessionStorage.getItem(key);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') continue;
            const u = parsed.user && typeof parsed.user === 'object' ? parsed.user : parsed;

            if (!info.userId) info.userId = String(u.id || u.user_id || parsed.id || parsed.user_id || '').trim();
            if (!info.fullName) info.fullName = String(u.full_name || u.fullName || u.name || parsed.full_name || parsed.name || '').trim();
            if (!info.username) info.username = String(u.username || u.user_name || parsed.username || '').trim();
            if (!info.email) info.email = String(u.email || parsed.email || '').trim();
            if (!info.bio) info.bio = String(u.bio || u.about || parsed.bio || '').trim();
            if (!info.location) info.location = String(u.location || u.city || u.lives_in || parsed.location || '').trim();
            if (!info.education) info.education = String(u.education || u.school || u.university || parsed.education || '').trim();
            if (info.fullName) break;
          }

          if (!info.fullName) {
            info.fullName = String(
              localStorage.getItem('autro_profile_name') ||
              localStorage.getItem('autro_user_name') ||
              sessionStorage.getItem('autro_profile_name') ||
              ''
            ).trim();
          }
        } catch (_) {}
        return info;
      }

      async function resolveProfileContext() {
        profileContext = { ...profileContext, ...readCachedProfile() };
        if (!supabaseClient) return profileContext;

        try {
          let userId = profileContext.userId || null;

          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session && session.user) {
            userId = session.user.id;
            profileContext.userId = userId;
            profileContext.fullName =
              session.user.user_metadata?.full_name ||
              session.user.user_metadata?.name ||
              profileContext.fullName;
            profileContext.username =
              session.user.user_metadata?.username ||
              profileContext.username;
            profileContext.email = session.user.email || profileContext.email;
          }

          if (userId) {
            const { data: profileRow } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('id', userId)
              .maybeSingle();

            if (profileRow) {
              if (profileRow.full_name) profileContext.fullName = String(profileRow.full_name).trim();
              if (profileRow.username) profileContext.username = String(profileRow.username).trim();
              if (profileRow.email) profileContext.email = String(profileRow.email).trim();
              if (profileRow.bio) profileContext.bio = String(profileRow.bio).trim();
              if (profileRow.location || profileRow.city || profileRow.lives_in) {
                profileContext.location = String(profileRow.location || profileRow.city || profileRow.lives_in).trim();
              }
              if (profileRow.education || profileRow.university || profileRow.school) {
                profileContext.education = String(profileRow.education || profileRow.university || profileRow.school).trim();
              }
            }
          }

          const clientKey = localStorage.getItem('autro_account_client_id');
          let settingsRow = null;

          if (userId) {
            const { data } = await supabaseClient
              .from('account_settings')
              .select('*')
              .eq('user_id', userId)
              .order('updated_at', { ascending: false })
              .limit(1)
              .maybeSingle();
            settingsRow = data;
          }

          if (!settingsRow && clientKey) {
            const { data } = await supabaseClient
              .from('account_settings')
              .select('*')
              .eq('account_key', clientKey)
              .order('updated_at', { ascending: false })
              .limit(1)
              .maybeSingle();
            settingsRow = data;
          }

          if (!settingsRow && !userId) {
            const { data: latestRows } = await supabaseClient
              .from('account_settings')
              .select('*')
              .order('updated_at', { ascending: false })
              .limit(1);
            if (Array.isArray(latestRows) && latestRows.length > 0) {
              settingsRow = latestRows[0];
            }
          }

          if (settingsRow) {
            if (settingsRow.full_name) profileContext.fullName = String(settingsRow.full_name).trim();
            if (settingsRow.bio) profileContext.bio = String(settingsRow.bio).trim();
            if (settingsRow.location || settingsRow.city || settingsRow.lives_in) {
              profileContext.location = String(settingsRow.location || settingsRow.city || settingsRow.lives_in).trim();
            }
            if (settingsRow.education || settingsRow.university || settingsRow.school) {
              profileContext.education = String(settingsRow.education || settingsRow.university || settingsRow.school).trim();
            }
          }
        } catch (_) {}

        return profileContext;
      }

      function formatTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function updateSendButtonState() {
        const hasText = promptInput.value.trim().length > 0;
        sendBtn.classList.toggle('ready', hasText);
      }

      function autoResizeTextarea() {
        promptInput.style.height = 'auto';
        promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
        updateSendButtonState();
      }

      function renderBubble(role, text, metaLabel) {
        if (emptyState) {
          emptyState.style.display = 'none';
        }

        const row = document.createElement('div');
        row.className = `message-row ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = metaLabel || formatTime();

        row.appendChild(bubble);
        row.appendChild(meta);
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return { row, bubble, meta };
      }

      function appendMessage(role, text, metaLabel, persist = true) {
        const finalMeta = metaLabel || formatTime();
        const rendered = renderBubble(role, text, finalMeta);

        if (persist) {
          savedMessages.push({
            role,
            text,
            meta: finalMeta
          });
          saveChatToStorage();
        }

        return rendered;
      }

      function appendTypingIndicator() {
        if (emptyState) {
          emptyState.style.display = 'none';
        }

        const row = document.createElement('div');
        row.className = 'message-row assistant';
        row.id = 'typingIndicatorRow';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = `
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        `;

        row.appendChild(bubble);
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return row;
      }

      function removeTypingIndicator() {
        const el = document.getElementById('typingIndicatorRow');
        if (el) el.remove();
      }

      async function sendMessage(userText) {
        const trimmed = userText.trim();
        if (!trimmed) return;

        appendMessage('user', trimmed, formatTime(), true);
        conversationHistory.push({ role: 'user', text: trimmed });

        promptInput.value = '';
        autoResizeTextarea();
        sendBtn.disabled = true;

        const startTime = performance.now();
        appendTypingIndicator();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);

        try {
          const activeName =
            profileContext.fullName ||
            profileContext.username ||
            (profileContext.email && profileContext.email.includes('@') ? profileContext.email.split('@')[0] : '');

          const response = await fetch(API_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              message: trimmed,
              profileName: activeName,
              userProfile: profileContext,
              history: conversationHistory.slice(-4)
            })
          });

          clearTimeout(timeoutId);
          const data = await response.json();
          removeTypingIndicator();

          const elapsedSec = ((performance.now() - startTime) / 1000).toFixed(2);
          const modelLabel = data.model ? `${data.model} • ` : '';

          if (!response.ok || !data.reply) {
            appendMessage(
              'assistant',
              data.error || 'Could not get a response right now.',
              `${modelLabel}${elapsedSec}s`,
              true
            );
          } else {
            conversationHistory.push({ role: 'assistant', text: data.reply });
            appendMessage(
              'assistant',
              data.reply,
              `${modelLabel}${elapsedSec}s`,
              true
            );
          }
        } catch (err) {
          clearTimeout(timeoutId);
          removeTypingIndicator();
          const msg = err.name === 'AbortError'
            ? 'Response took too long. Please try again.'
            : 'Network error while connecting to Autro AI Assistant.';
          appendMessage('assistant', msg, formatTime(), true);
        } finally {
          sendBtn.disabled = false;
          updateSendButtonState();
          promptInput.focus();
        }
      }

      document.querySelectorAll('.suggestion-card').forEach((card) => {
        card.addEventListener('click', () => {
          const prompt = card.getAttribute('data-prompt') || '';
          if (prompt) sendMessage(prompt);
        });
      });

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        sendMessage(promptInput.value);
      });

      promptInput.addEventListener('input', autoResizeTextarea);

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(promptInput.value);
        }
      });

      clearChatBtn.addEventListener('click', () => {
        conversationHistory.length = 0;
        savedMessages.length = 0;
        try {
          localStorage.removeItem(CHAT_STORAGE_KEY);
        } catch (_) {}

        chatContainer.innerHTML = '';
        if (emptyState) {
          emptyState.style.display = 'flex';
          chatContainer.appendChild(emptyState);
        }
      });

      initLogoAutoDetect();
      restoreChatFromStorage();
      resolveProfileContext();
      updateSendButtonState();
    })();
  </script>
</body>
</html>
