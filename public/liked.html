<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Liked Reels — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/theme.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --surface: #f3f4f6;
      --card: #FFFFFF;
      --elevated: #f8f9fa;
      --text: #202124;
      --muted: #5f6368;
      --border: #e5e7eb;
      --dark-green: #0B3D20;
      --emerald: #0a7d3b;
      --emerald-bright: #10b981;
      --pill-bg: #eef0f2;
      --pill-text: #202124;
      --btn-hover: #e2e5e9;
      --shadow: 0 8px 24px rgba(32, 33, 36, 0.14);
    }

    :root[data-theme="dark"],
    body.dark-theme {
      color-scheme: dark;
      --bg: #202124;
      --surface: #28292c;
      --card: #202124;
      --elevated: #2c2d31;
      --text: #FFFFFF;
      --muted: #9aa0a6;
      --border: #383a3f;
      --dark-green: #0B3D20;
      --emerald: #0a7d3b;
      --emerald-bright: #10b981;
      --pill-bg: #303134;
      --pill-text: #ffffff;
      --btn-hover: #3c4043;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #202124;
        --surface: #28292c;
        --card: #202124;
        --elevated: #2c2d31;
        --text: #FFFFFF;
        --muted: #9aa0a6;
        --border: #383a3f;
        --dark-green: #0B3D20;
        --emerald: #0a7d3b;
        --emerald-bright: #10b981;
        --pill-bg: #303134;
        --pill-text: #ffffff;
        --btn-hover: #3c4043;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 92px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      padding: 0 14px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .back-btn:hover {
      background: var(--surface);
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .header-spacer {
      width: 38px;
      flex-shrink: 0;
    }

    /* Privacy Notice */
    .privacy-banner {
      background: var(--surface);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .privacy-banner i {
      font-size: 12.5px;
    }

    /* Main Content */
    .main-container {
      max-width: 760px;
      margin: 0 auto;
    }

    .empty-state {
      background: var(--surface);
      padding: 46px 20px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    .empty-clapper-svg {
      width: 78px;
      height: 78px;
      display: block;
    }

    .empty-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
    }

    .liked-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px;
    }

    @media (min-width: 560px) {
      .liked-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .liked-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .liked-card:hover {
      transform: translateY(-2px);
      border-color: var(--emerald);
    }

    .liked-thumb {
      aspect-ratio: 9 / 13;
      background: var(--dark-green);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .liked-thumb img,
    .liked-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .liked-info {
      padding: 10px 12px;
    }

    .liked-caption {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Bottom Create Reels Button */
    .floating-create-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 60;
    }

    .create-reels-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--pill-bg);
      color: var(--pill-text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 24px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .create-reels-btn:hover {
      background: var(--btn-hover);
    }

    .create-reels-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <header class="top-header">
    <button
      type="button"
      class="back-btn"
      id="backToSaveBtn"
      aria-label="Back to Saved"
      onclick="goToSavePage()"
    >
      <i class="fas fa-chevron-left"></i>
    </button>
    <h1 class="header-title">Liked</h1>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <div class="privacy-banner">
    <i class="fas fa-lock"></i>
    <span>Liked reels are only visible to you.</span>
  </div>

  <main class="main-container" id="likedContainer"></main>

  <div class="floating-create-wrap">
    <button
      type="button"
      class="create-reels-btn"
      id="createReelsBtn"
      onclick="navigateToCreateReels()"
    >
      <i class="fas fa-clapperboard"></i>
      <span>Create reels</span>
    </button>
  </div>

  <script>
    const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

    const sb = (window.supabase && typeof window.supabase.createClient === "function")
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    function goToSavePage() {
      window.location.href = "save.html";
    }

    function navigateToCreateReels() {
      window.location.href = "create-reels.html";
    }

    function escapeHtml(val) {
      return String(val ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function renderEmptyLiked() {
      const container = document.getElementById("likedContainer");
      if (!container) return;
      container.innerHTML = `
        <div class="empty-state" id="emptyLikedBox">
          <svg class="empty-clapper-svg" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g transform="rotate(-12 44 44)">
              <rect x="14" y="34" width="60" height="38" rx="7" fill="#0a7d3b" stroke="#0B3D20" stroke-width="2.5"/>
              <path d="M16 21C15.5 17.5 18 14.5 21.5 14L67.5 8C71 7.5 74 10 74.5 13.5L76 23L17.5 30.5L16 21Z" fill="#0B3D20" stroke="#10b981" stroke-width="2"/>
              <path d="M27 13L34 28M42 11L49 26M57 9L64 24" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
              <polygon points="39,44 39,62 55,53" fill="#ffffff"/>
            </g>
          </svg>
          <div class="empty-title">No liked reels yet</div>
        </div>
      `;
    }

    function renderLikedReels(reels) {
      const container = document.getElementById("likedContainer");
      if (!container) return;

      if (!Array.isArray(reels) || reels.length === 0) {
        renderEmptyLiked();
        return;
      }

      container.innerHTML = `<div class="liked-grid">${reels.map((r) => {
        const caption = r.caption || r.title || "Liked Reel";
        const mediaUrl = r.thumbnail_url || r.video_url || r.media_url || "";
        const reelHref = r.id !== undefined ? `reels.html?reel=${encodeURIComponent(r.id)}` : "reels.html";

        const mediaHtml = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(mediaUrl) && !r.thumbnail_url
          ? `<video src="${escapeHtml(mediaUrl)}" muted preload="metadata"></video>`
          : mediaUrl
            ? `<img src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(caption)}" />`
            : `<i class="fas fa-clapperboard" style="font-size:30px;color:#34d399;"></i>`;

        return `
          <a href="${escapeHtml(reelHref)}" class="liked-card">
            <div class="liked-thumb">${mediaHtml}</div>
            <div class="liked-info">
              <div class="liked-caption">${escapeHtml(caption)}</div>
            </div>
          </a>
        `;
      }).join("")}</div>`;
    }

    async function loadLikedReelsFromSupabase() {
      if (!sb) {
        renderEmptyLiked();
        return;
      }

      try {
        const { data: sess } = await sb.auth.getSession();
        const userId = sess?.session?.user?.id || localStorage.getItem("autro_user_id") || null;

        if (!userId) {
          renderEmptyLiked();
          return;
        }

        const { data: likeRows, error: likesErr } = await sb
          .from("reel_likes")
          .select("reel_id, created_at")
          .eq("user_id", userId)
          .order("created_at", { ascending: false });

        if (likesErr) throw likesErr;

        const ids = Array.isArray(likeRows)
          ? [...new Set(likeRows.map((x) => x.reel_id).filter(Boolean))]
          : [];

        if (!ids.length) {
          renderEmptyLiked();
          return;
        }

        const { data: reelsData, error: reelsErr } = await sb
          .from("reels")
          .select("*")
          .in("id", ids);

        if (reelsErr) throw reelsErr;

        const map = new Map((reelsData || []).map((item) => [String(item.id), item]));
        const ordered = ids.map((id) => map.get(String(id))).filter(Boolean);
        renderLikedReels(ordered);
      } catch (err) {
        console.warn("Failed to load liked reels:", err);
        renderEmptyLiked();
      }
    }

    document.addEventListener("DOMContentLoaded", loadLikedReelsFromSupabase);
  </script>
</body>
</html>
