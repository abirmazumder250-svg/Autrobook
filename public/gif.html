<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Select GIF</title>
  <style>
    :root {
      --bg-page: #121212;
      --bg-header: #161618;
      --bg-search: #252528;
      --bg-card: #1c1c1e;
      --text-main: #f5f5f7;
      --text-muted: #9a9aa0;
      --border-subtle: #242427;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sticky Top Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(22, 22, 24, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 14px 12px;
    }

    .header-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 36px;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--text-main);
      text-decoration: none;
      font-size: 24px;
      line-height: 1;
      transition: background-color 0.18s ease, transform 0.12s ease;
    }

    .back-link:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .back-link:active {
      transform: scale(0.92);
    }

    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      pointer-events: none;
    }

    /* Search Bar */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background-color: var(--bg-search);
      border: 1px solid transparent;
      border-radius: 22px;
      padding: 0 38px 0 42px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      background-color: #2d2d31;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-btn.show {
      display: flex;
    }

    /* 2-Column GIF Grid */
    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 3px 3px 28px;
    }

    .gif-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: var(--bg-card);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .gif-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .gif-item:hover img {
      transform: scale(1.03);
    }

    .gif-item:active img {
      transform: scale(0.96);
      filter: brightness(0.85);
    }

    .empty-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-msg.show {
      display: flex;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background-color: #242428;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <a href="create-post.html" class="back-link" aria-label="Back to create post">&#8592;</a>
      <h1 class="header-title">Select GIF</h1>
    </div>

    <div class="search-box">
      <span class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search GIFs"
        autocomplete="off"
      />
      <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear">&times;</button>
    </div>
  </header>

  <main class="gif-grid" id="gifGrid"></main>

  <div class="empty-msg" id="emptyMsg">
    <p style="font-size:16px; color:#f5f5f7; margin-bottom:4px;">No GIFs found</p>
    <span style="font-size:13px;">Try another search word</span>
  </div>

  <div class="toast" id="toast">Selected GIF! Going to create-post.html...</div>

  <script>
    function makeAnimatedCard(label, emoji, bg1, bg2, accent) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${bg1}"/>
              <stop offset="100%" stop-color="${bg2}"/>
            </linearGradient>
          </defs>
          <rect width="400" height="400" fill="url(#bg)"/>
          <circle cx="200" cy="180" r="86" fill="${accent}" opacity="0.18">
            <animate attributeName="r" values="78;96;78" dur="1.4s" repeatCount="indefinite"/>
          </circle>
          <g>
            <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="0.9s" repeatCount="indefinite"/>
            <text x="200" y="198" text-anchor="middle" font-size="96">${emoji}</text>
          </g>
          <text x="200" y="315" text-anchor="middle" fill="#f5f5f7" font-family="sans-serif" font-size="22" font-weight="700">${label}</text>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

    const GIF_LIST = [
      {
        title: "spongebob imagination rainbow meme",
        url: "https://media.giphy.com/media/BmmfETghGOPrW/giphy.gif",
        fallback: makeAnimatedCard("IMAGINATION", "🌈", "#16324f", "#274c77", "#ffd166")
      },
      {
        title: "cute kitten confused cat paw",
        url: "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
        fallback: makeAnimatedCard("CONFUSED CAT", "🐱", "#2b2438", "#463a5c", "#f4a261")
      },
      {
        title: "confused nick young question marks",
        url: "https://media.giphy.com/media/3o7aTskHEUdgCQAXde/giphy.gif",
        fallback: makeAnimatedCard("WHAT?!", "❓", "#222638", "#3a405a", "#4cc9f0")
      },
      {
        title: "anime reaction surprise excited",
        url: "https://media.giphy.com/media/3o6Zt481isNVuQI1l6/giphy.gif",
        fallback: makeAnimatedCard("SURPRISED!", "✨", "#3b1d3a", "#5e2a5c", "#ff758f")
      },
      {
        title: "fireworks night celebration sky",
        url: "https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif",
        fallback: makeAnimatedCard("CELEBRATION", "🎆", "#19192b", "#2d2d4e", "#ff5e7e")
      },
      {
        title: "fry squinting suspicious cartoon",
        url: "https://media.giphy.com/media/ANbD1CCdA3iI8/giphy.gif",
        fallback: makeAnimatedCard("SUSPICIOUS", "🧐", "#2d2419", "#4f3d28", "#ffb703")
      },
      {
        title: "laughing hard reaction red shirt",
        url: "https://media.giphy.com/media/10JhviFuU2gWD6/giphy.gif",
        fallback: makeAnimatedCard("HAHAHA!", "😂", "#3a1c1c", "#612b2b", "#ffd166")
      },
      {
        title: "funny office dance reaction group",
        url: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",
        fallback: makeAnimatedCard("DANCE TIME", "💃", "#1c332d", "#2c5248", "#06d6a0")
      },
      {
        title: "dancing dog golden retriever funny",
        url: "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif",
        fallback: makeAnimatedCard("HAPPY DOG", "🐶", "#2e2218", "#4d3826", "#e09f5a")
      },
      {
        title: "orange cat belly funny",
        url: "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif",
        fallback: makeAnimatedCard("CHONKY CAT", "🐈", "#332118", "#543526", "#f77f00")
      },
      {
        title: "hearts love reaction romantic",
        url: "https://media.giphy.com/media/c76IJL3wNW8nwSTZGj/giphy.gif",
        fallback: makeAnimatedCard("LOVE IT", "❤️", "#3b1a26", "#61293d", "#ff4d6d")
      },
      {
        title: "shocked drama reaction",
        url: "https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif",
        fallback: makeAnimatedCard("SHOCKED!", "😱", "#381e28", "#5c2e40", "#ff9f1c")
      }
    ];

    const FULL_GIFS = Array.from({ length: 100 }, (_, i) => {
      const base = GIF_LIST[i % GIF_LIST.length];
      return {
        id: i + 1,
        title: `${base.title} ${i + 1}`,
        url: base.url,
        fallback: base.fallback
      };
    });

    const gifGrid = document.getElementById("gifGrid");
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const emptyMsg = document.getElementById("emptyMsg");
    const toast = document.getElementById("toast");

    let query = "";

    function goToCreatePost(gifUrl) {
      localStorage.setItem("selectedGifUrl", gifUrl);
      localStorage.setItem("selectedGif", JSON.stringify({ url: gifUrl, time: Date.now() }));
      toast.classList.add("show");
      setTimeout(() => {
        window.location.href = `create-post.html?gif=${encodeURIComponent(gifUrl)}`;
      }, 150);
    }

    function applyFallback(img, fallbackSrc) {
      if (!img.dataset.fallbackApplied) {
        img.dataset.fallbackApplied = "1";
        img.src = fallbackSrc;
      }
    }

    function renderGifs() {
      const q = query.trim().toLowerCase();
      const items = FULL_GIFS.filter((item) => !q || item.title.toLowerCase().includes(q));

      gifGrid.innerHTML = "";
      emptyMsg.classList.toggle("show", items.length === 0);

      const frag = document.createDocumentFragment();

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "gif-item";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", item.title);

        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.title;
        img.loading = "lazy";

        img.addEventListener("error", () => applyFallback(img, item.fallback));
        img.addEventListener("load", () => {
          // Giphy removed/unavailable images often return tiny placeholder dimensions
          if (!img.dataset.fallbackApplied && (img.naturalWidth < 40 || img.naturalHeight < 40)) {
            applyFallback(img, item.fallback);
          }
        });

        card.appendChild(img);

        const onSelect = () => goToCreatePost(img.currentSrc || img.src);
        card.addEventListener("click", onSelect);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            onSelect();
          }
        });

        frag.appendChild(card);
      });

      gifGrid.appendChild(frag);
    }

    searchInput.addEventListener("input", (e) => {
      query = e.target.value;
      clearBtn.classList.toggle("show", query.length > 0);
      renderGifs();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      query = "";
      clearBtn.classList.remove("show");
      searchInput.focus();
      renderGifs();
    });

    renderGifs();
  </script>
</body>
</html>
