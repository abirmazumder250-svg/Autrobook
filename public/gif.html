<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Select GIF</title>

  <!-- External Theme Stylesheet -->
  <link rel="stylesheet" href="/theme.css" />

  <style>
    :root {
      --bg-primary: #202124;
      --bg-secondary: #2c2e33;
      --bg-card: #292a2d;
      --bg-hover: #35373c;
      --text-primary: #ffffff;
      --text-secondary: #b0b3b8;
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-color: #8ab4f8;
      --shadow-color: rgba(0, 0, 0, 0.35);
      --header-height: 58px;
      --radius-md: 12px;
      --radius-pill: 24px;
    }

    html[data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f1f3f4;
      --bg-card: #f8f9fa;
      --bg-hover: #e8eaed;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --border-color: rgba(32, 33, 36, 0.14);
      --accent-color: #1a73e8;
      --shadow-color: rgba(32, 33, 36, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-shell {
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      backdrop-filter: blur(10px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .icon-btn:hover {
      background-color: var(--bg-hover);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gif-count-badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: var(--bg-secondary);
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
    }

    /* Search Section */
    .search-wrapper {
      padding: 12px 14px 8px;
      background-color: var(--bg-primary);
      position: sticky;
      top: var(--header-height);
      z-index: 90;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      padding: 0 14px;
      height: 44px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.18);
    }

    .search-icon {
      color: var(--text-secondary);
      font-size: 17px;
      margin-right: 10px;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 15px;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .clear-search-btn {
      display: none;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 6px;
      border-radius: 50%;
    }

    .clear-search-btn.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .clear-search-btn:hover {
      color: var(--text-primary);
      background-color: var(--bg-hover);
    }

    /* Quick Category Chips */
    .chips-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 14px 10px;
      scrollbar-width: none;
    }

    .chips-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .chip.active {
      background-color: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }

    /* GIF Grid */
    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 4px 6px 28px;
    }

    .gif-card {
      position: relative;
      aspect-ratio: 4 / 3.3;
      background-color: var(--bg-card);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .gif-card:hover {
      transform: scale(1.012);
      box-shadow: 0 6px 18px var(--shadow-color);
      border-color: var(--accent-color);
      z-index: 2;
    }

    .gif-card:active {
      transform: scale(0.97);
    }

    .gif-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gif-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.68) 0%, rgba(0, 0, 0, 0) 55%);
      opacity: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 8px 10px;
      transition: opacity 0.2s ease;
    }

    .gif-card:hover .gif-overlay {
      opacity: 1;
    }

    .gif-label {
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 82%;
    }

    .gif-select-pill {
      background-color: #ffffff;
      color: #202124;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    /* Empty State */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px;
      color: var(--text-secondary);
    }

    .empty-state.visible {
      display: flex;
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .empty-state-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-state-desc {
      font-size: 14px;
      max-width: 300px;
      line-height: 1.5;
    }

    /* Selection Toast */
    .selection-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background-color: #202124;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 200;
    }

    .selection-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 540px) {
      .gif-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 6px 14px 32px;
      }
    }
  </style>
</head>

    <header class="top-header">
      <div class="header-left">
        <a
          href="create-post.html"
          id="backToCreatePost"
          class="icon-btn"
          aria-label="Back to create post"
          title="Back to create-post.html"
        >
          &#8592;
        </a>
        <h1 class="header-title">Select GIF</h1>
      </div>

      <div class="header-actions">
        <span id="gifCountBadge" class="gif-count-badge">55 GIFs</span>
        <button
          type="button"
          id="themeToggleBtn"
          class="icon-btn"
          aria-label="Switch theme"
          title="Toggle #FFFFFF / #202124 theme"
        >
          &#9728;&#65039;
        </button>
      </div>
    </header>

    <!-- Search Input -->
    <div class="search-wrapper">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input
          type="text"
          id="gifSearchInput"
          class="search-input"
          placeholder="Search GIFs"
          autocomplete="off"
          aria-label="Search GIFs"
        />
        <button
          type="button"
          id="clearSearchBtn"
          class="clear-search-btn"
          aria-label="Clear search"
          title="Clear search"
        >
          &times;
        </button>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="chips-bar" id="categoryChips">
      <button type="button" class="chip active" data-category="all">All</button>
      <button type="button" class="chip" data-category="funny">Funny</button>
      <button type="button" class="chip" data-category="cat">Cats</button>
      <button type="button" class="chip" data-category="dog">Dogs</button>
      <button type="button" class="chip" data-category="reaction">Reactions</button>
      <button type="button" class="chip" data-category="dance">Dance</button>
      <button type="button" class="chip" data-category="love">Love</button>
      <button type="button" class="chip" data-category="celebrate">Celebrate</button>
    </div>

    <!-- GIF Grid Container -->
    <main id="gifGrid" class="gif-grid" aria-live="polite"></main>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-state-icon">&#128533;</div>
      <div class="empty-state-title">No matching GIFs found</div>
      <p class="empty-state-desc">Try searching with another keyword or select a different category.</p>
    </div>
  </div>

  <!-- Toast Feedback -->
  <div id="selectionToast" class="selection-toast" role="status" aria-live="polite">
    GIF selected! Redirecting to create-post.html...

      { id: 53, title: "Success Trophy Win", category: "celebrate", url: "https://media.tenor.com/images/7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d/tenor.gif" },
      { id: 54, title: "Sweet Love Note", category: "love", url: "https://media.tenor.com/images/8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e/tenor.gif" },
      { id: 55, title: "Nervous Sweat Smile", category: "reaction", url: "https://media.tenor.com/images/9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f/tenor.gif" }
    ];

    const gifGrid = document.getElementById("gifGrid");
    const searchInput = document.getElementById("gifSearchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const categoryChips = document.getElementById("categoryChips");
    const emptyState = document.getElementById("emptyState");
    const gifCountBadge = document.getElementById("gifCountBadge");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const selectionToast = document.getElementById("selectionToast");

    let activeCategory = "all";
    let searchQuery = "";

    // Theme initialization (#202124 dark & #FFFFFF light)
    function applyTheme(theme) {
      const normalized = theme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", normalized);
      localStorage.setItem("selectedTheme", normalized);
      themeToggleBtn.innerHTML = normalized === "dark" ? "&#9728;&#65039;" : "&#127769;";
    }

    const savedTheme = localStorage.getItem("selectedTheme") || "dark";
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    // Fallback SVG generator if any external GIF fails to load
    function createFallbackDataUrl(label, index) {
      const bg = index % 2 === 0 ? "#2c2e33" : "#383b42";
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
          <rect width="320" height="240" fill="${bg}"/>
          <circle cx="160" cy="96" r="34" fill="#8ab4f8" opacity="0.22"/>
          <text x="160" y="103" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">GIF #${index}</text>
          <text x="160" y="146" text-anchor="middle" fill="#e8eaed" font-family="sans-serif" font-size="13">${escapeXml(label)}</text>
        </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function escapeXml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    }

    // Handle GIF selection -> save & go to create-post.html
    function selectGifAndRedirect(gif) {
      const payload = {
        id: gif.id,
        title: gif.title,
        category: gif.category,
        url: gif.url,
        selectedAt: new Date().toISOString()
      };

      try {
        sessionStorage.setItem("selectedGif", JSON.stringify(payload));
        localStorage.setItem("lastSelectedGif", JSON.stringify(payload));
      } catch (err) {
        console.warn("Storage warning:", err);
      }

      selectionToast.textContent = `Selected "${gif.title}" — going to create-post.html...`;
      selectionToast.classList.add("show");

      const targetUrl = `create-post.html?gifId=${encodeURIComponent(gif.id)}&gifUrl=${encodeURIComponent(gif.url)}&gifTitle=${encodeURIComponent(gif.title)}`;

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 220);
    }

    // Render filtered GIFs
    function renderGifs() {
      const normalizedQuery = searchQuery.trim().toLowerCase();

      const filtered = GIF_COLLECTION.filter((gif) => {
        const matchesCategory = activeCategory === "all" || gif.category === activeCategory;
        const matchesSearch =
          !normalizedQuery ||
          gif.title.toLowerCase().includes(normalizedQuery) ||
          gif.category.toLowerCase().includes(normalizedQuery) ||
          String(gif.id).includes(normalizedQuery);
        return matchesCategory && matchesSearch;
      });

      gifCountBadge.textContent = `${filtered.length} GIFs`;
      gifGrid.innerHTML = "";

      if (filtered.length === 0) {
        emptyState.classList.add("visible");
        return;
      }

      emptyState.classList.remove("visible");

      const fragment = document.createDocumentFragment();

      filtered.forEach((gif) => {
        const card = document.createElement("div");
        card.className = "gif-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", `Select GIF: ${gif.title}`);

        const img = document.createElement("img");
        img.src = gif.url;
        img.alt = gif.title;
        img.loading = "lazy";
        img.addEventListener("error", () => {
          img.src = createFallbackDataUrl(gif.title, gif.id);
        });

        const overlay = document.createElement("div");
        overlay.className = "gif-overlay";

        const label = document.createElement("span");
        label.className = "gif-label";
        label.textContent = gif.title;

        const pill = document.createElement("span");
        pill.className = "gif-select-pill";
        pill.textContent = "Select";

        overlay.appendChild(label);
        overlay.appendChild(pill);

        card.appendChild(img);
        card.appendChild(overlay);

        card.addEventListener("click", () => selectGifAndRedirect(gif));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectGifAndRedirect(gif);
          }
        });

        fragment.appendChild(card);
      });

      gifGrid.appendChild(fragment);
    }

    // Search events
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("visible", searchQuery.length > 0);
      renderGifs();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchQuery = "";
      searchInput.value = "";
      clearSearchBtn.classList.remove("visible");
      searchInput.focus();
      renderGifs();
    });

    // Category filter events
    categoryChips.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;

      categoryChips.querySelectorAll(".chip").forEach((btn) => btn.classList.remove("active"));
      chip.classList.add("active");
      activeCategory = chip.dataset.category || "all";
      renderGifs();
    });

    // Initial render
    renderGifs();
  </script>
</body>
</html>
