<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Select GIF</title>
  <style>
    :root {
      --bg-page: #121212;
      --bg-header: #161618;
      --bg-search: #252528;
      --bg-card: #1c1c1e;
      --text-main: #f5f5f7;
      --text-muted: #9a9aa0;
      --border-subtle: #242427;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sticky Top Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(22, 22, 24, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 14px 12px;
    }

    .header-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 36px;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--text-main);
      text-decoration: none;
      font-size: 24px;
      line-height: 1;
      transition: background-color 0.18s ease, transform 0.12s ease;
    }

    .back-link:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .back-link:active {
      transform: scale(0.92);
    }

    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      pointer-events: none;
    }

    /* Search Bar */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background-color: var(--bg-search);
      border: 1px solid transparent;
      border-radius: 22px;
      padding: 0 38px 0 42px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      background-color: #2d2d31;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-btn.show {
      display: flex;
    }

    /* 2-Column GIF Grid */
    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 3px 3px 28px;
    }

    .gif-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: var(--bg-card);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .gif-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .gif-item:hover img {
      transform: scale(1.03);
    }

    .gif-item:active img {
      transform: scale(0.96);
      filter: brightness(0.85);
    }

    .empty-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-msg.show {
      display: flex;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background-color: #242428;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <a href="create-post.html" class="back-link" aria-label="Back to create post">&#8592;</a>
      <h1 class="header-title">Select GIF</h1>
    </div>

    <div class="search-box">
      <span class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search GIFs"
        autocomplete="off"
      />
      <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear">&times;</button>
    </div>
  </header>

  <main class="gif-grid" id="gifGrid"></main>

  <div class="empty-msg" id="emptyMsg">
    <p style="font-size:16px; color:#f5f5f7; margin-bottom:4px;">No GIFs found</p>
    <span style="font-size:13px;">Try another search word</span>
  </div>

  <div class="toast" id="toast">Selected GIF! Going to create-post.html...</div>

  <script>
    // Reliable animated fallback scenes for dogs, cats & people if an external CDN blocks a request
    function fallbackDog(bg1, bg2, fur, ear) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs>
          <rect width="400" height="400" fill="url(#g)"/>
          <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="0.8s" repeatCount="indefinite"/>
            <ellipse cx="195" cy="265" rx="68" ry="48" fill="${fur}"/>
            <circle cx="235" cy="182" r="50" fill="${fur}"/>
            <ellipse cx="190" cy="192" rx="16" ry="34" transform="rotate(18 190 192)" fill="${ear}"/>
            <ellipse cx="272" cy="188" rx="16" ry="32" transform="rotate(-14 272 188)" fill="${ear}"/>
            <circle cx="222" cy="172" r="6" fill="#18181b"/>
            <circle cx="252" cy="172" r="6" fill="#18181b"/>
            <circle cx="268" cy="190" r="7" fill="#18181b"/>
            <path d="M250 206 Q258 226 266 206 Z" fill="#ff6b8b"/>
          </g>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

    function fallbackCat(bg1, bg2, coat, stripe) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs>
          <rect width="400" height="400" fill="url(#g)"/>
          <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="1s" repeatCount="indefinite"/>
            <ellipse cx="200" cy="272" rx="62" ry="48" fill="${coat}"/>
            <polygon points="154,154 144,100 188,134" fill="${coat}"/>
            <polygon points="246,134 290,100 280,154" fill="${coat}"/>
            <circle cx="215" cy="180" r="52" fill="${coat}"/>
            <line x1="215" y1="132" x2="215" y2="150" stroke="${stripe}" stroke-width="5"/>
            <circle cx="194" cy="178" r="8" fill="#18181b"/>
            <circle cx="236" cy="178" r="8" fill="#18181b"/>
            <polygon points="215,192 208,200 222,200" fill="#ff758f"/>
          </g>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

    function fallbackPerson(bg1, bg2, skin, hair, shirt) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs>
          <rect width="400" height="400" fill="url(#g)"/>
          <g><animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="0.7s" repeatCount="indefinite"/>
            <path d="M112 355 Q120 255 200 255 Q280 255 288 355 Z" fill="${shirt}"/>
            <circle cx="200" cy="166" r="58" fill="${hair}"/>
            <ellipse cx="200" cy="176" rx="46" ry="52" fill="${skin}"/>
            <circle cx="182" cy="172" r="5.5" fill="#18181b"/>
            <circle cx="218" cy="172" r="5.5" fill="#18181b"/>
            <ellipse cx="200" cy="198" rx="12" ry="9" fill="#800f2f"/>
          </g>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

    const GIF_LIST = [
      // Dogs, Cats, Monkey & People GIFs matching your screenshots & more
      { title: "dancing dog golden retriever funny", url: "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif", fallback: fallbackDog("#2e2218", "#4d3826", "#e09f5a", "#8c5223") },
      { title: "sad dog crying looking at phone", url: "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif", fallback: fallbackDog("#232736", "#373e57", "#e8d5b7", "#9e8b70") },
      { title: "crying cat looking at phone sad", url: "https://media.giphy.com/media/JIX9t1j0d1JSONuWyG/giphy.gif", fallback: fallbackCat("#1d2436", "#2f3a57", "#f4a261", "#c86d2d") },
      { title: "monkey lying on floor using phone", url: "https://media.giphy.com/media/lkdH8FmImcGoylv3t3/giphy.gif", fallback: fallbackPerson("#2b241d", "#473b2f", "#c68b59", "#3b2818", "#52b788") },
      { title: "chihuahua smiling funny dog teeth", url: "https://media.giphy.com/media/4Zo41lhzKt6iZ8xff9/giphy.gif", fallback: fallbackDog("#292421", "#453d38", "#f8f9fa", "#ced4da") },
      { title: "woman eating snack reaction", url: "https://media.giphy.com/media/guufsF0UyNBoA/giphy.gif", fallback: fallbackPerson("#33221c", "#54372d", "#e0a97d", "#2b1b12", "#ff758f") },
      { title: "puppy wearing sunglasses cool dog", url: "https://media.giphy.com/media/9G0AdBJvEbNRBoFgVn/giphy.gif", fallback: fallbackDog("#29231e", "#453b32", "#ffffff", "#adb5bd") },
      { title: "little girl side eye reaction", url: "https://media.giphy.com/media/ANbD1CCdA3iI8/giphy.gif", fallback: fallbackPerson("#222a38", "#354259", "#ffdbac", "#d4a373", "#4cc9f0") },
      { title: "laughing boy funny reaction", url: "https://media.giphy.com/media/10JhviFuU2gWD6/giphy.gif", fallback: fallbackPerson("#33281b", "#54412b", "#f1c29b", "#1c1917", "#ffd166") },
      { title: "dancing party people groove", url: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif", fallback: fallbackPerson("#2e1c38", "#4d2e5e", "#d99b66", "#18181b", "#f72585") },
      { title: "garfield orange cat belly funny", url: "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif", fallback: fallbackCat("#332118", "#543526", "#f77f00", "#d62828") },
      { title: "black cat playing cute kitty", url: "https://media.giphy.com/media/3o7TKtnuHOHHUjR38Y/giphy.gif", fallback: fallbackCat("#1f1d2b", "#343047", "#343a40", "#212529") },
      { title: "two cute cats side by side", url: "https://media.giphy.com/media/od5H3PmEG5EVq/giphy.gif", fallback: fallbackCat("#2b2438", "#463a5c", "#6c757d", "#f8f9fa") },
      { title: "red hearts floating love gif", url: "https://media.giphy.com/media/c76IJL3wNW8nwSTZGj/giphy.gif", fallback: fallbackPerson("#3b1a26", "#61293d", "#f1c29b", "#2b1d16", "#ff4d6d") },
      { title: "shocked reaction drama gif", url: "https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif", fallback: fallbackPerson("#381e28", "#5c2e40", "#e0a97d", "#1f1a17", "#ff9f1c") },
      { title: "funny dog grin smile", url: "https://media.giphy.com/media/m645h29pi4JsU/giphy.gif", fallback: fallbackDog("#26221e", "#403932", "#f8f9fa", "#adb5bd") },
      { title: "happy cat blink cute", url: "https://media.giphy.com/media/EAqw56L24tCAw/giphy.gif", fallback: fallbackCat("#1e2d29", "#2e4740", "#f4a261", "#e76f51") },
      { title: "person waving hello friendly", url: "https://media.giphy.com/media/XreQmk7ETCak0/giphy.gif", fallback: fallbackPerson("#1d2b3d", "#2d4463", "#f1c29b", "#2b1d16", "#06d6a0") },
      { title: "funny fail laugh reaction", url: "https://media.giphy.com/media/ZechFo0yBIQpEVE1Sm/giphy.gif", fallback: fallbackPerson("#38281c", "#5c412c", "#d99b66", "#18181b", "#ffb703") },
      { title: "confetti party celebration", url: "https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif", fallback: fallbackPerson("#2d1e40", "#492f69", "#f1c29b", "#2b1d16", "#ff5e7e") }
    ];

    // Expand to 100 items mixing dogs, cats, and people seamlessly
    const FULL_GIFS = [];
    for (let i = 0; i < 100; i++) {
      const base = GIF_LIST[i % GIF_LIST.length];
      FULL_GIFS.push({
        id: i + 1,
        title: `${base.title} ${i + 1}`,
        url: base.url,
        fallback: base.fallback
      });
    }

    const gifGrid = document.getElementById("gifGrid");
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const emptyMsg = document.getElementById("emptyMsg");
    const toast = document.getElementById("toast");

    let query = "";

    function goToCreatePost(gifUrl) {
      localStorage.setItem("selectedGifUrl", gifUrl);
      localStorage.setItem("selectedGif", JSON.stringify({ url: gifUrl, time: Date.now() }));
      toast.classList.add("show");
      setTimeout(() => {
        window.location.href = `create-post.html?gif=${encodeURIComponent(gifUrl)}`;
      }, 150);
    }

    function renderGifs() {
      const q = query.trim().toLowerCase();
      const items = FULL_GIFS.filter((item) => !q || item.title.toLowerCase().includes(q));

      gifGrid.innerHTML = "";
      emptyMsg.classList.toggle("show", items.length === 0);

      const frag = document.createDocumentFragment();

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "gif-item";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", item.title);

        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.title;
        img.loading = "lazy";

        img.addEventListener("error", () => {
          if (img.src !== item.fallback) {
            img.src = item.fallback;
          }
        });

        card.appendChild(img);

        const onSelect = () => goToCreatePost(img.currentSrc || img.src);
        card.addEventListener("click", onSelect);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            onSelect();
          }
        });

        frag.appendChild(card);
      });

      gifGrid.appendChild(frag);
    }

    searchInput.addEventListener("input", (e) => {
      query = e.target.value;
      clearBtn.classList.toggle("show", query.length > 0);
      renderGifs();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      query = "";
      clearBtn.classList.remove("show");
      searchInput.focus();
      renderGifs();
    });

    renderGifs();
  </script>
</body>
</html>
