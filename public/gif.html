<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Select GIF</title>
  <style>
    :root {
      --bg-page: #121212;
      --bg-header: #161618;
      --bg-search: #252528;
      --bg-card: #1c1c1e;
      --text-main: #f5f5f7;
      --text-muted: #9a9aa0;
      --border-subtle: #242427;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(22, 22, 24, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 14px;
    }

    .header-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 36px;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--text-main);
      text-decoration: none;
      font-size: 24px;
      line-height: 1;
      transition: background-color 0.18s ease, transform 0.12s ease;
    }

    .back-link:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .back-link:active {
      transform: scale(0.92);
    }

    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      pointer-events: none;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background-color: var(--bg-search);
      border: 1px solid transparent;
      border-radius: 22px;
      padding: 0 38px 0 42px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      background-color: #2d2d31;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-btn.show {
      display: flex;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 3px 3px 28px;
    }

    .gif-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: var(--bg-card);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .gif-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .gif-item:hover img {
      transform: scale(1.03);
    }

    .gif-item:active img {
      transform: scale(0.96);
      filter: brightness(0.85);
    }

    .empty-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-msg.show {
      display: flex;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background-color: #242428;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <a href="create-post.html" class="back-link" aria-label="Back to create post">&#8592;</a>
      <h1 class="header-title">Select GIF</h1>
    </div>

    <div class="search-box">
      <span class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search GIFs"
        autocomplete="off"
      />
      <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear">&times;</button>
    </div>
  </header>

  <main class="gif-grid" id="gifGrid"></main>

  <div class="empty-msg" id="emptyMsg">
    <p style="font-size:16px; color:#f5f5f7; margin-bottom:4px;">No GIFs found</p>
    <span style="font-size:13px;">Try another search word</span>
  </div>

  <div class="toast" id="toast">Selected GIF! Going to create-post.html...</div>

  <script>
    const UNIQUE_SCENES = [
      ["funny laugh lol", "😂", "#3a1b1b", "#632828", "#ffd166", "bounce"],
      ["happy dog wag", "🐶", "#2b2016", "#4d3826", "#f4a261", "spin"],
      ["cute cat blink", "🐱", "#221e33", "#3b3359", "#ff758f", "pulse"],
      ["mind blown wow", "🤯", "#1b2838", "#2d4463", "#4cc9f0", "shake"],
      ["party dance groove", "💃", "#331936", "#59285e", "#f72585", "bounce"],
      ["cool sunglasses", "😎", "#1e272e", "#344452", "#06d6a0", "pulse"],
      ["love heart kiss", "😍", "#3b1725", "#66233d", "#ff4d6d", "pulse"],
      ["sad cry tear", "😭", "#1a2436", "#2b3d5c", "#90e0ef", "bounce"],
      ["angry mad fire", "😡", "#3b1616", "#662222", "#ff5400", "shake"],
      ["shocked gasp oh", "😱", "#2e1c3b", "#4e2d66", "#ffb703", "shake"],
      ["thumbs up ok", "👍", "#193026", "#295240", "#52b788", "bounce"],
      ["clap applause yay", "👏", "#332817", "#594426", "#ffd166", "pulse"],
      ["sleepy tired yawn", "😴", "#1b1f33", "#2d3457", "#a8dadc", "pulse"],
      ["hungry snack food", "🍕", "#362016", "#5e3624", "#ff9f1c", "bounce"],
      ["coffee morning sip", "☕", "#291e18", "#4a3529", "#ddb892", "pulse"],
      ["celebration confetti", "🎉", "#2b193d", "#4b296b", "#ff5e7e", "spin"],
      ["rocket launch boost", "🚀", "#152238", "#233a61", "#48cae4", "bounce"],
      ["ghost spooky boo", "👻", "#23252d", "#3a3e4d", "#f8f9fa", "shake"],
      ["monkey cheeky grin", "🙈", "#2e2318", "#523d28", "#e9c46a", "pulse"],
      ["unicorn magic dream", "🦄", "#361b3d", "#5c2b69", "#ff85a1", "spin"],
      ["gaming controller pro", "🎮", "#172d36", "#254d5c", "#00f5d4", "pulse"],
      ["music vibe beat", "🎧", "#2c1b38", "#4b2c61", "#c77dff", "bounce"],
      ["wink flirt playful", "😉", "#381c2b", "#612d49", "#ff70a6", "pulse"],
      ["thinking hmm idea", "🤔", "#29261b", "#47412d", "#ffd166", "shake"]
    ];

    function buildUniqueGifDataUrl([title, emoji, c1, c2, ring, anim], index) {
      let animTag = "";
      if (anim === "bounce") {
        animTag = `<animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="${0.75 + (index % 4) * 0.1}s" repeatCount="indefinite"/>`;
      } else if (anim === "spin") {
        animTag = `<animateTransform attributeName="transform" type="rotate" values="-14 200 185; 14 200 185; -14 200 185" dur="0.9s" repeatCount="indefinite"/>`;
      } else if (anim === "shake") {
        animTag = `<animateTransform attributeName="transform" type="translate" values="-8,0; 8,0; -8,0" dur="0.45s" repeatCount="indefinite"/>`;
      } else {
        animTag = `<animateTransform attributeName="transform" type="scale" values="0.94; 1.08; 0.94" additive="sum" dur="1s" repeatCount="indefinite"/>`;
      }

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
          <defs>
            <linearGradient id="g${index}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${c1}"/>
              <stop offset="100%" stop-color="${c2}"/>
            </linearGradient>
          </defs>
          <rect width="400" height="400" fill="url(#g${index})"/>
          <circle cx="200" cy="185" r="88" fill="${ring}" opacity="0.2">
            <animate attributeName="r" values="76;98;76" dur="1.3s" repeatCount="indefinite"/>
          </circle>
          <g transform-origin="200 185">
            ${animTag}
            <text x="200" y="210" text-anchor="middle" font-size="104">${emoji}</text>
          </g>
          <rect x="64" y="294" width="272" height="42" rx="21" fill="rgba(0,0,0,0.34)"/>
          <text x="200" y="321" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">${title.toUpperCase()}</text>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

    const GIF_ITEMS = UNIQUE_SCENES.map((scene, idx) => ({
      id: idx + 1,
      title: scene[0],
      url: buildUniqueGifDataUrl(scene, idx)
    }));

    const gifGrid = document.getElementById("gifGrid");
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const emptyMsg = document.getElementById("emptyMsg");
    const toast = document.getElementById("toast");

    let query = "";

    function goToCreatePost(gifUrl) {
      localStorage.setItem("selectedGifUrl", gifUrl);
      localStorage.setItem("selectedGif", JSON.stringify({ url: gifUrl, time: Date.now() }));
      toast.classList.add("show");
      setTimeout(() => {
        window.location.href = `create-post.html?gif=${encodeURIComponent(gifUrl)}`;
      }, 150);
    }

    function renderGifs() {
      const q = query.trim().toLowerCase();
      const items = GIF_ITEMS.filter((item) => !q || item.title.toLowerCase().includes(q));

      gifGrid.innerHTML = "";
      emptyMsg.classList.toggle("show", items.length === 0);

      const frag = document.createDocumentFragment();

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "gif-item";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", item.title);

        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.title;

        card.appendChild(img);

        const onSelect = () => goToCreatePost(item.url);
        card.addEventListener("click", onSelect);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            onSelect();
          }
        });

        frag.appendChild(card);
      });

      gifGrid.appendChild(frag);
    }

    searchInput.addEventListener("input", (e) => {
      query = e.target.value;
      clearBtn.classList.toggle("show", query.length > 0);
      renderGifs();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      query = "";
      clearBtn.classList.remove("show");
      searchInput.focus();
      renderGifs();
    });

    renderGifs();
  </script>
</body>
</html>
