<!DOCTYPE html>
<html lang="en" data-page="remembrance.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create life event - Remembrance</title>
  <link rel="canonical" href="/remembrance.html" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #28292d;
      --bg-card-hover: #323338;
      --bg-banner: #e6eef7;
      --text-primary: #ffffff;
      --text-secondary: #9aa0a6;
      --text-muted: #757a82;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
      --accent-green-hover: #0f7642;
      --accent-badge: #0b5d34;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f5f6f8;
        --bg-card-hover: #eaecf0;
        --bg-banner: #e9f0f8;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --text-muted: #80868b;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
        --accent-green-hover: #084727;
        --accent-badge: #0b5d34;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 19px;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .back-btn:hover {
      background: var(--bg-card);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .topbar-title-link {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: not-allowed;
      transition: color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    }

    .next-btn.active {
      color: var(--accent-green);
      background: rgba(11, 93, 52, 0.14);
      cursor: pointer;
    }

    .next-btn.active:hover {
      background: rgba(11, 93, 52, 0.22);
    }

    .next-btn.active:active {
      transform: scale(0.96);
    }

    /* BANNER AREA */
    .hero-banner-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .hero-banner {
      position: relative;
      width: 100%;
      height: 235px;
      background: var(--bg-banner);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-banner img.custom-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .default-illustration {
      position: relative;
      width: 280px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .remembrance-scene {
      position: relative;
      width: 210px;
      height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .petal-doodle {
      position: absolute;
      width: 34px;
      height: 46px;
      border: 2px solid rgba(56, 132, 210, 0.22);
      border-radius: 50% 0 50% 50%;
      pointer-events: none;
    }

    .petal-doodle.left {
      bottom: 24px;
      left: -8px;
      transform: rotate(-16deg);
    }

    .petal-doodle.right {
      bottom: 10px;
      right: -6px;
      transform: rotate(35deg);
    }

    .candle-glow {
      position: absolute;
      top: 10px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.78) 0%, rgba(253, 224, 71, 0.25) 55%, transparent 75%);
      z-index: 1;
      pointer-events: none;
    }

    .candle-flame {
      position: absolute;
      top: 20px;
      width: 20px;
      height: 34px;
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 65%, #ea580c 100%);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.55);
      z-index: 4;
    }

    .candle-flame::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 5px;
      width: 10px;
      height: 16px;
      background: #fffbeb;
      border-radius: 50%;
      opacity: 0.85;
    }

    .candle-wick {
      position: absolute;
      top: 52px;
      width: 3px;
      height: 7px;
      background: #1e293b;
      border-radius: 2px;
      z-index: 4;
    }

    .candle-wax {
      position: relative;
      width: 56px;
      height: 64px;
      background: linear-gradient(90deg, #bae6fd 0%, #e0f2fe 45%, #7dd3fc 100%);
      border-radius: 7px 7px 3px 3px;
      margin-bottom: 18px;
      box-shadow: inset 0 -6px 10px rgba(2, 132, 199, 0.22);
      z-index: 3;
    }

    .candle-wax::before {
      content: "";
      position: absolute;
      top: 0;
      right: 8px;
      width: 11px;
      height: 22px;
      background: #f0f9ff;
      border-radius: 0 0 8px 8px;
    }

    .candle-leaves {
      position: absolute;
      bottom: 18px;
      right: 36px;
      width: 38px;
      height: 28px;
      z-index: 2;
    }

    .leaf-blade {
      position: absolute;
      width: 16px;
      height: 28px;
      background: linear-gradient(160deg, #4ade80 0%, #15803d 100%);
      border-radius: 100% 0 100% 0;
    }

    .leaf-blade.a {
      bottom: 0;
      left: 4px;
      transform: rotate(-18deg);
    }

    .leaf-blade.b {
      bottom: 2px;
      right: 2px;
      transform: rotate(22deg);
      background: linear-gradient(160deg, #22c55e 0%, #166534 100%);
    }

    .candle-holder {
      position: absolute;
      bottom: 10px;
      width: 84px;
      height: 11px;
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 3px 3px 10px 10px;
      box-shadow: 0 5px 12px rgba(29, 78, 216, 0.28);
      z-index: 4;
    }

    .photo-chip-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(32, 33, 36, 0.72);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 7px 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .photo-chip-btn:hover {
      background: rgba(32, 33, 36, 0.88);
    }

    .photo-chip-btn:active {
      transform: scale(0.96);
    }

    .banner-clear-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 6;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(32, 33, 36, 0.72);
      color: #ffffff;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .banner-clear-btn:hover {
      background: rgba(32, 33, 36, 0.88);
    }

    .banner-clear-btn:active {
      transform: scale(0.94);
    }

    .center-badge {
      position: relative;
      margin: -24px auto 14px;
      z-index: 10;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-badge);
      border: 3px solid var(--bg-page);
      color: #ffffff;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    /* FORM FIELDS */
    .form-body {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 16px 36px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 62px;
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .input-card:focus-within {
      border-color: var(--accent-green);
    }

    .field-caption {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    .title-input::placeholder {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .helper-hint {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 0 4px 2px;
      line-height: 1.35;
    }

    .date-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .date-picker-hidden {
      position: relative;
      margin-top: 4px;
    }

    .date-picker-hidden input[type="date"] {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-green);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 120;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="life-event.html" class="back-btn" aria-label="Back to life event" title="Back" onclick="handleBackToLifeEvent(event)">
        <i class="fas fa-arrow-left"></i>
      </a>
      <a href="life-event.html" class="topbar-title-link" onclick="handleBackToLifeEvent(event)">Create life event</a>
    </div>

    <button type="button" id="nextBtn" class="next-btn" onclick="submitRemembranceToCreatePost()" disabled>
      NEXT
    </button>
  </header>

  <div class="hero-banner-wrap">
    <div id="heroBanner" class="hero-banner">
      <button type="button" class="photo-chip-btn" onclick="openGalleryPicker()">
        <i class="far fa-image"></i>
        <span>Photo</span>
      </button>

      <button type="button" class="banner-clear-btn" onclick="clearBannerPhoto()" aria-label="Remove photo" title="Remove">
        <i class="fas fa-xmark"></i>
      </button>

      <div id="defaultIllustration" class="default-illustration">
        <div class="remembrance-scene" aria-hidden="true">
          <div class="petal-doodle left"></div>
          <div class="petal-doodle right"></div>
          <div class="candle-glow"></div>
          <div class="candle-flame"></div>
          <div class="candle-wick"></div>
          <div class="candle-leaves">
            <span class="leaf-blade a"></span>
            <span class="leaf-blade b"></span>
          </div>
          <div class="candle-wax"></div>
          <div class="candle-holder"></div>
        </div>
      </div>

      <img id="customBannerImg" class="custom-photo" alt="Selected remembrance photo" style="display:none;" />
    </div>

    <div class="center-badge" aria-hidden="true">
      <i class="fas fa-fire-flame-curved"></i>
    </div>
  </div>

  <main class="form-body">
    <div class="input-card">
      <label for="remembranceTitleInput" class="field-caption">Title</label>
      <input
        type="text"
        id="remembranceTitleInput"
        class="title-input"
        maxlength="120"
        placeholder="Title"
        oninput="handleTitleInput()"
      />
    </div>
    <p class="helper-hint">Example: remembering a friend, celebration of life, in memory of...</p>

    <div class="input-card">
      <div class="field-caption">Date:</div>
      <div id="dateLabelText" class="date-value">Nov 28, 2026</div>
      <div class="date-picker-hidden">
        <input type="date" id="remembranceDateInput" onchange="handleDateChange()" />
      </div>
    </div>
  </main>

  <input type="file" id="galleryPhotoInput" accept="image/*" style="display:none;" onchange="handleGalleryPhotoSelected(event)" />

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const REMEMBRANCE_PAGE_URL = '/remembrance.html';
    const LIFE_EVENT_PAGE_URL = 'life-event.html';
    const CREATE_POST_PAGE_URL = '/create-post.html';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const REMEMBRANCE_DRAFT_KEY = 'autro_remembrance_draft';
    const LIFE_EVENT_SAVED_KEY = 'autro_life_event';
    const LIFE_EVENT_PHOTO_KEY = 'autro_life_event_photo';
    const POST_DRAFT_KEY = 'autro_create_post_draft';

    let selectedPhotoDataUrl = '';
    let photoRemovedManually = false;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._rmToastTimer);
      window._rmToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function openGalleryPicker() {
      document.getElementById('galleryPhotoInput').click();
    }

    function safeWriteStore(key, val) {
      const str = String(val || '');
      try { sessionStorage.setItem(key, str); } catch (_) {}
      try { localStorage.setItem(key, str); } catch (_) {}
      try {
        let state = {};
        if (window.name && window.name.startsWith('AUTRO_STATE:')) {
          state = JSON.parse(window.name.slice('AUTRO_STATE:'.length)) || {};
        }
        if (str) state[key] = str;
        else delete state[key];
        const nextName = 'AUTRO_STATE:' + JSON.stringify(state);
        if (nextName.length < 1800000) window.name = nextName;
      } catch (_) {}
    }

    function safeReadStore(key) {
      try {
        const s = sessionStorage.getItem(key);
        if (s) return s;
      } catch (_) {}
      try {
        const l = localStorage.getItem(key);
        if (l) return l;
      } catch (_) {}
      try {
        if (window.name && window.name.startsWith('AUTRO_STATE:')) {
          const state = JSON.parse(window.name.slice('AUTRO_STATE:'.length)) || {};
          if (state[key]) return String(state[key]);
        }
      } catch (_) {}
      return '';
    }

    function handleBackToLifeEvent(event) {
      if (event) event.preventDefault();
      saveCurrentDraft();
      window.location.href = LIFE_EVENT_PAGE_URL;
    }

    function compressImageFileToDataUrl(file, maxWidth = 960, quality = 0.72) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith('image/')) return resolve('');
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.naturalWidth || img.width || maxWidth;
            const h = img.naturalHeight || img.height || maxWidth;
            const scale = Math.min(1, maxWidth / w);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(w * scale));
            canvas.height = Math.max(1, Math.round(h * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            URL.revokeObjectURL(objectUrl);
            resolve(dataUrl);
          } catch (_) {
            URL.revokeObjectURL(objectUrl);
            resolve('');
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        };
        img.src = objectUrl;
      });
    }

    function renderBannerVisual() {
      const imgEl = document.getElementById('customBannerImg');
      const defEl = document.getElementById('defaultIllustration');

      if (selectedPhotoDataUrl) {
        imgEl.src = selectedPhotoDataUrl;
        imgEl.style.display = 'block';
        defEl.style.display = 'none';
      } else {
        imgEl.src = '';
        imgEl.style.display = 'none';
        defEl.style.display = photoRemovedManually ? 'none' : 'flex';
      }
    }

    async function handleGalleryPhotoSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      let dataUrl = await compressImageFileToDataUrl(file, 960, 0.72);
      if (!dataUrl && file.size <= 1600000) {
        dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });
      }

      if (dataUrl) {
        selectedPhotoDataUrl = dataUrl;
        photoRemovedManually = false;
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, dataUrl);
        renderBannerVisual();
        saveCurrentDraft();
        showToast('Photo selected');
      } else {
        showToast('Unable to load photo');
      }
    }

    function clearBannerPhoto() {
      selectedPhotoDataUrl = '';
      photoRemovedManually = true;
      document.getElementById('galleryPhotoInput').value = '';
      safeWriteStore(LIFE_EVENT_PHOTO_KEY, '');
      renderBannerVisual();
      saveCurrentDraft();
    }

    function getLiveLocalIsoDate() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatLiveDateLabel(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return isoDate;
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return dt.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function handleDateChange() {
      const val = document.getElementById('remembranceDateInput').value || getLiveLocalIsoDate();
      document.getElementById('dateLabelText').textContent = formatLiveDateLabel(val);
      saveCurrentDraft();
    }

    function updateNextButtonState() {
      const btn = document.getElementById('nextBtn');
      const titleVal = document.getElementById('remembranceTitleInput').value.trim();
      const hasTitle = Boolean(titleVal);

      btn.disabled = !hasTitle;
      btn.classList.toggle('active', hasTitle);
    }

    function handleTitleInput() {
      updateNextButtonState();
      saveCurrentDraft();
    }

    function saveCurrentDraft() {
      const draft = {
        title: document.getElementById('remembranceTitleInput').value,
        date: document.getElementById('remembranceDateInput').value,
        photoDataUrl: selectedPhotoDataUrl,
        photoRemovedManually
      };
      safeWriteStore(REMEMBRANCE_DRAFT_KEY, JSON.stringify(draft));
      if (selectedPhotoDataUrl) {
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, selectedPhotoDataUrl);
      }
    }

    function restoreRemembranceState() {
      const liveIsoDate = getLiveLocalIsoDate();
      document.getElementById('remembranceDateInput').value = liveIsoDate;
      document.getElementById('dateLabelText').textContent = formatLiveDateLabel(liveIsoDate);

      try {
        const rawDraft = safeReadStore(REMEMBRANCE_DRAFT_KEY);
        if (rawDraft) {
          const d = JSON.parse(rawDraft);
          if (typeof d.title === 'string') {
            document.getElementById('remembranceTitleInput').value = d.title;
          }
          if (typeof d.date === 'string' && d.date) {
            document.getElementById('remembranceDateInput').value = d.date;
            document.getElementById('dateLabelText').textContent = formatLiveDateLabel(d.date);
          }
          if (typeof d.photoDataUrl === 'string' && d.photoDataUrl) {
            selectedPhotoDataUrl = d.photoDataUrl;
          }
          photoRemovedManually = Boolean(d.photoRemovedManually);
        }
      } catch (_) {}

      const storedPhoto = safeReadStore(LIFE_EVENT_PHOTO_KEY);
      if (storedPhoto && !photoRemovedManually) {
        selectedPhotoDataUrl = storedPhoto;
      }

      renderBannerVisual();
      updateNextButtonState();
    }

    async function syncRemembranceToSupabase(payload) {
      if (!sb) return;
      try {
        const { data: { session } } = await sb.auth.getSession();
        const uid = session?.user?.id;
        if (!uid) return;
        await sb.from('life_events').insert({
          user_id: uid,
          category: payload.categoryLabel,
          sub_category: payload.subCategory,
          title: payload.title,
          event_date: payload.date,
          photo_url: payload.photoUrl || null
        });
      } catch (_) {}
    }

    async function submitRemembranceToCreatePost() {
      const titleVal = document.getElementById('remembranceTitleInput').value.trim();
      if (!titleVal) {
        showToast('Please enter a remembrance title');
        return;
      }

      const dateVal = document.getElementById('remembranceDateInput').value || getLiveLocalIsoDate();
      const dateDisplay = formatLiveDateLabel(dateVal);
      const photoToPass = selectedPhotoDataUrl || safeReadStore(LIFE_EVENT_PHOTO_KEY) || '';

      const formattedText = `[Remembrance] ${titleVal} (${dateDisplay})`;

      const lifeEventPayload = {
        categoryId: 'remembrance',
        categoryLabel: 'Remembrance',
        subCategory: 'Remembrance',
        title: titleVal,
        date: dateDisplay,
        rawDate: dateVal,
        photoUrl: photoToPass,
        photo_url: photoToPass,
        bannerUrl: photoToPass,
        image: photoToPass,
        photo: photoToPass,
        editUrl: REMEMBRANCE_PAGE_URL,
        formattedText,
        savedAt: Date.now()
      };

      safeWriteStore(LIFE_EVENT_SAVED_KEY, JSON.stringify(lifeEventPayload));
      if (photoToPass) {
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, photoToPass);
      }

      try {
        sessionStorage.removeItem(REMEMBRANCE_DRAFT_KEY);
        let existingDraft = {};
        const rawPostDraft = safeReadStore(POST_DRAFT_KEY);
        if (rawPostDraft) {
          existingDraft = JSON.parse(rawPostDraft) || {};
        }

        const prevCaption = String(existingDraft.caption || '').trim();
        existingDraft.caption = prevCaption ? `${prevCaption}\n\n${formattedText}` : formattedText;
        existingDraft.lifeEvent = lifeEventPayload;

        safeWriteStore(POST_DRAFT_KEY, JSON.stringify(existingDraft));
      } catch (_) {}

      await syncRemembranceToSupabase(lifeEventPayload);
      window.location.href = CREATE_POST_PAGE_URL;
    }

    window.addEventListener('DOMContentLoaded', () => {
      restoreRemembranceState();
    });
  </script>
</body>
  </html>
