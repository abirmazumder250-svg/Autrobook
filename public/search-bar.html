<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root {
      --bg-page: #202124;
      --bg-surface: #292a2d;
      --bg-hover: #303134;
      --text-primary: #FFFFFF;
      --text-secondary: #b0b3b8;
      --border-color: #3c4043;
      --dark-green: #14532d;
      --dark-green-bright: #166534;
      --dark-green-accent: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .app-container {
      max-width: 680px;
      margin: 0 auto;
      background-color: var(--bg-page);
      min-height: 100vh;
    }

    /* Top Search Header */
    .search-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background-color: var(--bg-page);
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 22px;
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }

    .back-btn:hover {
      background-color: var(--bg-hover);
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 0 14px;
      height: 42px;
    }

    .search-input-wrap:focus-within {
      border-color: var(--dark-green-accent);
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 15px;
      padding-right: 28px;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .clear-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .clear-btn.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Section Headers */
    .section-block {
      padding: 14px 16px 6px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .action-link,
    .refresh-btn {
      background: none;
      border: none;
      color: var(--dark-green-accent);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .action-link:hover,
    .refresh-btn:hover {
      background-color: var(--dark-green);
      color: var(--text-primary);
    }

    /* List Items (Recent Searches & Groups) */
    .item-list {
      display: flex;
      flex-direction: column;
    }

    .list-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 12px;
      transition: background-color 0.18s ease;
    }

    .list-row:hover {
      background-color: var(--bg-hover);
    }

    .row-main-link {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .avatar-box {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      background-color: var(--dark-green);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }

    .avatar-box.square-rounded {
      border-radius: 10px;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .pin-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background-color: var(--dark-green-accent);
      border: 2px solid var(--bg-page);
    }

    .row-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .row-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .badge-pill {
      background-color: var(--dark-green);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* Three Dot Menu */
    .more-btn-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .three-dot-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      letter-spacing: 1px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .three-dot-btn:hover {
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 38px;
      z-index: 100;
      min-width: 150px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      background: none;
      border: none;
      color: var(--text-primary);
      padding: 11px 14px;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-item:hover {
      background-color: var(--dark-green);
    }

    .dropdown-item.delete-action:hover {
      background-color: #7f1d1d;
    }

    /* People You May Know Horizontal Cards */
    .people-carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 16px 14px;
      scrollbar-width: none;
    }

    .people-carousel::-webkit-scrollbar {
      display: none;
    }

    .person-card {
      width: 210px;
      flex-shrink: 0;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .person-card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .person-card-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background-color: var(--dark-green);
      display: block;
    }

    .person-card-body {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .person-card-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-card-meta {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-dark-green {
      flex: 1;
      background-color: var(--dark-green-bright);
      color: var(--text-primary);
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-dark-green:hover {
      background-color: var(--dark-green);
    }

    .btn-secondary-dark {
      background-color: var(--bg-hover);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary-dark:hover {
      background-color: var(--border-color);
    }

    .divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 8px 0;
    }

    .status-message {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .not-found-box {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="search-header">
      <a href="index.html" class="back-btn" aria-label="Back to Home">&lt;</a>
      <div class="search-input-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search"
          autocomplete="off"
        />
        <button type="button" id="clearSearchBtn" class="clear-btn" aria-label="Clear search">&times;</button>
      </div>
    </header>

    <!-- Live Search Results Container -->
    <section id="searchResultsSection" style="display: none;">
      <div class="section-block">
        <div class="section-header">
          <h2 class="section-title" id="searchResultsTitle">Search Results</h2>
        </div>
      </div>
      <div id="searchResultsList" class="item-list"></div>
      <div class="divider"></div>
    </section>

    <!-- Default View (Recent Searches, People You May Know, For You Groups) -->
    <main id="defaultDiscoveryView">
      <!-- Recent Searches -->
      <section class="section-block">
        <div class="section-header">
          <h2 class="section-title">Recent</h2>
          <div class="section-actions">
            <a href="search-history.html" class="action-link">See all</a>
          </div>
        </div>
      </section>
      <div id="recentSearchList" class="item-list"></div>

      <div class="divider"></div>

      <!-- People You May Know -->
      <section class="section-block">
        <div class="section-header">
          <h2 class="section-title">People you may know</h2>
          <div class="section-actions">
            <a href="friends.html" class="action-link">See all</a>
          </div>
        </div>
      </section>
      <div id="peopleCarousel" class="people-carousel"></div>

      <div class="divider"></div>

      <!-- For You Groups -->
      <section class="section-block">
        <div class="section-header">
          <h2 class="section-title">For you</h2>
          <div class="section-actions">
            <button type="button" id="refreshGroupsBtn" class="refresh-btn">Refresh</button>
          </div>
        </div>
      </section>
      <div id="groupsList" class="item-list"></div>
    </main>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const searchResultsSection = document.getElementById('searchResultsSection');
    const searchResultsTitle = document.getElementById('searchResultsTitle');
    const searchResultsList = document.getElementById('searchResultsList');
    const defaultDiscoveryView = document.getElementById('defaultDiscoveryView');
    const recentSearchList = document.getElementById('recentSearchList');
    const peopleCarousel = document.getElementById('peopleCarousel');
    const groupsList = document.getElementById('groupsList');
    const refreshGroupsBtn = document.getElementById('refreshGroupsBtn');

    let searchDebounceTimer = null;

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getInitials(name = '') {
      const clean = name.trim();
      if (!clean) return '?';
      return clean.charAt(0).toUpperCase();
    }

    function buildTargetLink(type, item) {
      const safeId = encodeURIComponent(item.id ?? '');
      const safeSlug = encodeURIComponent(item.slug || item.username || item.name || item.title || '');
      if (type === 'profile') {
        return `profile.html?id=${safeId}&name=${safeSlug}`;
      }
      if (type === 'group') {
        return `group.html?id=${safeId}&name=${safeSlug}`;
      }
      if (type === 'reel') {
        return `reels.html?id=${safeId}&title=${safeSlug}`;
      }
      return `search-bar.html?q=${encodeURIComponent(item.query || item.title || '')}`;
    }

    function createAvatarHtml(imageUrl, labelText, isSquare = false, isPinned = false) {
      const shapeClass = isSquare ? 'avatar-box square-rounded' : 'avatar-box';
      const pinBadge = isPinned ? `<span class="pin-dot" title="Pinned"></span>` : '';
      if (imageUrl) {
        return `
          <div class="${shapeClass}">
            <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(labelText)}" onerror="this.style.display='none'; this.parentElement.textContent='${escapeHtml(getInitials(labelText))}';" />
            ${pinBadge}
          </div>
        `;
      }
      return `
        <div class="${shapeClass}">
          ${escapeHtml(getInitials(labelText))}
          ${pinBadge}
        </div>
      `;
    }

    /* ---------------- RECENT SEARCHES (SUPABASE) ---------------- */
    async function loadRecentSearches() {
      recentSearchList.innerHTML = `<div class="status-message">Loading recent searches...</div>`;

      const { data, error } = await supabase
        .from('search_history')
        .select('*')
        .order('is_pinned', { ascending: false })
        .order('created_at', { ascending: false })
        .limit(10);

      if (error) {
        recentSearchList.innerHTML = `<div class="status-message">Could not load recent searches.</div>`;
        return;
      }

      if (!data || data.length === 0) {
        recentSearchList.innerHTML = `<div class="status-message">No recent searches.</div>`;
        return;
      }

      recentSearchList.innerHTML = '';

      data.forEach((entry) => {
        const displayLabel = entry.query || entry.title || entry.name || 'Search';
        const isPinned = Boolean(entry.is_pinned);
        const targetHref = entry.target_url || `search-bar.html?q=${encodeURIComponent(displayLabel)}`;

        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = `
          <a href="${escapeHtml(targetHref)}" class="row-main-link recent-trigger" data-query="${escapeHtml(displayLabel)}">
            ${createAvatarHtml(entry.avatar_url || '', displayLabel, false, isPinned)}
            <div class="row-info">
              <span class="row-title">${escapeHtml(displayLabel)}</span>
              <span class="row-subtitle">${isPinned ? 'Pinned search' : 'Recent search'}</span>
            </div>
          </a>
          <div class="more-btn-wrap">
            <button type="button" class="three-dot-btn" aria-label="More options" data-menu-id="${escapeHtml(String(entry.id))}">&#8943;</button>
            <div class="dropdown-menu" id="menu-${escapeHtml(String(entry.id))}">
              <button type="button" class="dropdown-item pin-btn" data-id="${escapeHtml(String(entry.id))}" data-pinned="${isPinned}">
                ${isPinned ? 'Unpin search' : 'Pin search'}
              </button>
              <button type="button" class="dropdown-item delete-action delete-search-btn" data-id="${escapeHtml(String(entry.id))}">
                Delete search
              </button>
            </div>
          </div>
        `;

        row.querySelector('.recent-trigger').addEventListener('click', (e) => {
          const q = e.currentTarget.getAttribute('data-query');
          if (q && !entry.target_url) {
            e.preventDefault();
            searchInput.value = q;
            clearSearchBtn.classList.add('visible');
            performSearch(q, false);
          }
        });

        recentSearchList.appendChild(row);
      });

      bindRowMenuEvents();
    }

    async function saveSearchToSupabase(queryText, matchedItem = null) {
      const cleaned = queryText.trim();
      if (!cleaned) return;

      const payload = {
        query: cleaned,
        title: matchedItem ? (matchedItem.name || matchedItem.title || cleaned) : cleaned,
        avatar_url: matchedItem ? (matchedItem.avatar_url || matchedItem.image_url || '') : '',
        target_url: matchedItem ? buildTargetLink(matchedItem._type, matchedItem) : null,
        is_pinned: false
      };

      const { data: existing } = await supabase
        .from('search_history')
        .select('id, is_pinned')
        .ilike('query', cleaned)
        .limit(1);

      if (existing && existing.length > 0) {
        await supabase
          .from('search_history')
          .update({
            created_at: new Date().toISOString(),
            title: payload.title,
            avatar_url: payload.avatar_url || undefined,
            target_url: payload.target_url || undefined
          })
          .eq('id', existing[0].id);
      } else {
        await supabase.from('search_history').insert([payload]);
      }

      loadRecentSearches();
    }

    function bindRowMenuEvents() {
      document.querySelectorAll('.three-dot-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menuId = btn.getAttribute('data-menu-id');
          const targetMenu = document.getElementById(`menu-${menuId}`);

          document.querySelectorAll('.dropdown-menu.open').forEach((openMenu) => {
            if (openMenu !== targetMenu) {
              openMenu.classList.remove('open');
            }
          });

          if (targetMenu) {
            targetMenu.classList.toggle('open');
          }
        });
      });

      document.querySelectorAll('.pin-btn').forEach((pinBtn) => {
        pinBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = pinBtn.getAttribute('data-id');
          const currentlyPinned = pinBtn.getAttribute('data-pinned') === 'true';

          await supabase
            .from('search_history')
            .update({ is_pinned: !currentlyPinned })
            .eq('id', id);

          loadRecentSearches();
        });
      });

      document.querySelectorAll('.delete-search-btn').forEach((delBtn) => {
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = delBtn.getAttribute('data-id');

          await supabase
            .from('search_history')
            .delete()
            .eq('id', id);

          loadRecentSearches();
        });
      });
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu.open').forEach((menu) => {
        menu.classList.remove('open');
      });
    });

    /* ---------------- PEOPLE YOU MAY KNOW (SUPABASE PROFILES) ---------------- */
    async function loadPeopleYouMayKnow() {
      peopleCarousel.innerHTML = `<div class="status-message">Loading people...</div>`;

      const { data: profiles, error } = await supabase
        .from('profiles')
        .select('*')
        .limit(12);

      if (error || !profiles || profiles.length === 0) {
        peopleCarousel.innerHTML = `<div class="status-message">No profiles available.</div>`;
        return;
      }

      peopleCarousel.innerHTML = '';

      profiles.forEach((person) => {
        const displayName = person.full_name || person.name || person.username || 'User';
        const subText = person.bio || person.location || (person.username ? `@${person.username}` : 'Member');
        const profileUrl = buildTargetLink('profile', person);
        const imgSrc = person.avatar_url || person.cover_url || '';

        const card = document.createElement('div');
        card.className = 'person-card';
        card.innerHTML = `
          <a href="${escapeHtml(profileUrl)}" class="person-card-link">
            ${
              imgSrc
                ? `<img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(displayName)}" class="person-card-img" onerror="this.style.display='none';" />`
                : `<div class="person-card-img" style="display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;">${escapeHtml(getInitials(displayName))}</div>`
            }
          </a>
          <div class="person-card-body">
            <a href="${escapeHtml(profileUrl)}" class="person-card-link">
              <div class="person-card-name">${escapeHtml(displayName)}</div>
              <div class="person-card-meta">${escapeHtml(subText)}</div>
            </a>
            <div class="person-card-actions">
              <button type="button" class="btn-dark-green add-friend-btn" data-id="${escapeHtml(String(person.id))}">Add friend</button>
              <button type="button" class="btn-secondary-dark remove-card-btn">Remove</button>
            </div>
          </div>
        `;

        card.querySelector('.add-friend-btn').addEventListener('click', (btnEvt) => {
          const b = btnEvt.currentTarget;
          b.textContent = b.textContent === 'Add friend' ? 'Requested' : 'Add friend';
        });

        card.querySelector('.remove-card-btn').addEventListener('click', () => {
          card.remove();
        });

        peopleCarousel.appendChild(card);
      });
    }

    /* ---------------- FOR YOU GROUPS (SUPABASE GROUPS) ---------------- */
    async function loadGroupsList() {
      groupsList.innerHTML = `<div class="status-message">Loading groups...</div>`;

      const { data: groups, error } = await supabase
        .from('groups')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !groups || groups.length === 0) {
        groupsList.innerHTML = `<div class="status-message">No groups found in Supabase.</div>`;
        return;
      }

      groupsList.innerHTML = '';

      groups.forEach((group) => {
        const groupName = group.name || group.title || 'Group';
        const groupUrl = group.link || group.url || buildTargetLink('group', group);
        const privacyText = group.privacy || group.group_type || 'Group';
        const memberText = group.members_count ? `${group.members_count} members` : '';
        const subtitle = [privacyText, memberText].filter(Boolean).join(' · ');

        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = `
          <a href="${escapeHtml(groupUrl)}" class="row-main-link">
            ${createAvatarHtml(group.avatar_url || group.image_url || group.cover_url || '', groupName, true, false)}
            <div class="row-info">
              <span class="row-title">${escapeHtml(groupName)}</span>
              <span class="row-subtitle">${escapeHtml(subtitle)}</span>
            </div>
          </a>
        `;

        groupsList.appendChild(row);
      });
    }

    refreshGroupsBtn.addEventListener('click', async () => {
      refreshGroupsBtn.textContent = 'Refreshing...';
      await loadGroupsList();
      refreshGroupsBtn.textContent = 'Refresh';
    });

    /* ---------------- LIVE SEARCH ACROSS PROFILES, GROUPS, REELS ---------------- */
    async function performSearch(rawQuery, shouldPersistHistory = false) {
      const q = rawQuery.trim();
      if (!q) {
        searchResultsSection.style.display = 'none';
        defaultDiscoveryView.style.display = 'block';
        return;
      }

      defaultDiscoveryView.style.display = 'none';
      searchResultsSection.style.display = 'block';
      searchResultsTitle.textContent = `Results for "${q}"`;
      searchResultsList.innerHTML = `<div class="status-message">Searching...</div>`;

      const pattern = `%${q}%`;

      const [profilesRes, groupsRes, reelsRes] = await Promise.all([
        supabase
          .from('profiles')
          .select('*')
          .or(`full_name.ilike.${pattern},name.ilike.${pattern},username.ilike.${pattern}`),
        supabase
          .from('groups')
          .select('*')
          .or(`name.ilike.${pattern},title.ilike.${pattern},description.ilike.${pattern}`),
        supabase
          .from('reels')
          .select('*')
          .or(`title.ilike.${pattern},caption.ilike.${pattern},name.ilike.${pattern}`)
      ]);

      const combinedResults = [];

      if (!profilesRes.error && profilesRes.data) {
        profilesRes.data.forEach((item) => {
          combinedResults.push({
            _type: 'profile',
            _badge: 'Profile',
            _title: item.full_name || item.name || item.username || 'Profile',
            _sub: item.username ? `@${item.username}` : (item.bio || 'Profile'),
            _img: item.avatar_url || '',
            _href: buildTargetLink('profile', item),
            ...item
          });
        });
      }

      if (!groupsRes.error && groupsRes.data) {
        groupsRes.data.forEach((item) => {
          combinedResults.push({
            _type: 'group',
            _badge: 'Group',
            _title: item.name || item.title || 'Group',
            _sub: item.privacy || 'Group',
            _img: item.avatar_url || item.image_url || '',
            _href: item.link || item.url || buildTargetLink('group', item),
            ...item
          });
        });
      }

      if (!reelsRes.error && reelsRes.data) {
        reelsRes.data.forEach((item) => {
          combinedResults.push({
            _type: 'reel',
            _badge: 'Reel',
            _title: item.title || item.name || item.caption || 'Reel',
            _sub: item.caption || 'Reel video',
            _img: item.thumbnail_url || item.cover_url || item.avatar_url || '',
            _href: item.link || item.url || buildTargetLink('reel', item),
            ...item
          });
        });
      }

      if (combinedResults.length === 0) {
        searchResultsList.innerHTML = `<div class="not-found-box">Not found</div>`;
        if (shouldPersistHistory) {
          await saveSearchToSupabase(q, null);
        }
        return;
      }

      searchResultsList.innerHTML = '';

      combinedResults.forEach((resItem) => {
        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = `
          <a href="${escapeHtml(resItem._href)}" class="row-main-link search-result-link">
            ${createAvatarHtml(resItem._img, resItem._title, resItem._type !== 'profile', false)}
            <div class="row-info">
              <span class="row-title">${escapeHtml(resItem._title)}</span>
              <span class="row-subtitle">${escapeHtml(resItem._sub)}</span>
            </div>
            <span class="badge-pill">${escapeHtml(resItem._badge)}</span>
          </a>
        `;

        row.querySelector('.search-result-link').addEventListener('click', () => {
          saveSearchToSupabase(resItem._title, resItem);
        });

        searchResultsList.appendChild(row);
      });

      if (shouldPersistHistory) {
        await saveSearchToSupabase(q, combinedResults[0]);
      }
    }

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      clearSearchBtn.classList.toggle('visible', val.trim().length > 0);

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        performSearch(val, false);
      }, 220);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(searchDebounceTimer);
        performSearch(searchInput.value, true);
      }
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.remove('visible');
      searchResultsSection.style.display = 'none';
      defaultDiscoveryView.style.display = 'block';
      searchInput.focus();
    });

    /* ---------------- INITIALIZE ---------------- */
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');

    loadRecentSearches();
    loadPeopleYouMayKnow();
    loadGroupsList();

    if (initialQuery && initialQuery.trim()) {
      searchInput.value = initialQuery;
      clearSearchBtn.classList.add('visible');
      performSearch(initialQuery, false);
    }
  </script>
</body>
