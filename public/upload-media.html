<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Media • Autrobook</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root {
      --bg-page: #FFFFFF;
      --bg-card: #F8FAF9;
      --bg-subtle: #EEF3F0;
      --text-main: #111827;
      --text-muted: #4B5563;
      --border-color: #DCE5E0;
      --accent-green: #0B3D20;
      --accent-green-hover: #14532D;
      --accent-text: #FFFFFF;
      --danger-bg: #FEF2F2;
      --danger-text: #B91C1C;
      --success-bg: #ECFDF5;
      --success-text: #065F46;
      --shadow-card: 0 10px 28px rgba(11, 61, 32, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #202124;
        --bg-card: #292A2D;
        --bg-subtle: #303134;
        --text-main: #E8EAED;
        --text-muted: #9AA0A6;
        --border-color: #3C4043;
        --accent-green: #1B5E34;
        --accent-green-hover: #257A45;
        --accent-text: #FFFFFF;
        --danger-bg: rgba(185, 28, 28, 0.18);
        --danger-text: #FCA5A5;
        --success-bg: rgba(16, 185, 129, 0.16);
        --success-text: #6EE7B7;
        --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.35);
      }
    }

    :root[data-theme="light"] {
      --bg-page: #FFFFFF;
      --bg-card: #F8FAF9;
      --bg-subtle: #EEF3F0;
      --text-main: #111827;
      --text-muted: #4B5563;
      --border-color: #DCE5E0;
      --accent-green: #0B3D20;
      --accent-green-hover: #14532D;
      --accent-text: #FFFFFF;
      --danger-bg: #FEF2F2;
      --danger-text: #B91C1C;
      --success-bg: #ECFDF5;
      --success-text: #065F46;
      --shadow-card: 0 10px 28px rgba(11, 61, 32, 0.08);
    }

    :root[data-theme="dark"] {
      --bg-page: #202124;
      --bg-card: #292A2D;
      --bg-subtle: #303134;
      --text-main: #E8EAED;
      --text-muted: #9AA0A6;
      --border-color: #3C4043;
      --accent-green: #1B5E34;
      --accent-green-hover: #257A45;
      --accent-text: #FFFFFF;
      --danger-bg: rgba(185, 28, 28, 0.18);
      --danger-text: #FCA5A5;
      --success-bg: rgba(16, 185, 129, 0.16);
      --success-text: #6EE7B7;
      --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .upload-wrapper {
      width: 100%;
      max-width: 500px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-card);
      display: none;
    }

    .upload-wrapper.ready {
      display: block;
    }

    .upload-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-green);
      background-color: var(--bg-subtle);
    }

    .upload-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .upload-subtitle {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .lang-select {
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .lang-select:hover {
      border-color: var(--accent-green);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .select-input,
    .file-input {
      width: 100%;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 0.92rem;
    }

    .select-input:focus,
    .file-input:focus {
      outline: 2px solid var(--accent-green);
      outline-offset: 1px;
    }

    .preview-box {
      display: none;
      margin-bottom: 16px;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 12px;
      background-color: var(--bg-page);
      text-align: center;
    }

    .preview-box.active {
      display: block;
    }

    .preview-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      object-fit: contain;
    }

    .primary-btn {
      width: 100%;
      background-color: var(--accent-green);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .primary-btn:hover:not(:disabled) {
      background-color: var(--accent-green-hover);
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.45;
      display: none;
      word-break: break-all;
    }

    .status-box.show {
      display: block;
    }

    .status-box.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .status-box.error {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid rgba(185, 28, 28, 0.35);
    }

    .url-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      min-width: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
    }

    .copy-btn {
      background-color: var(--accent-green);
      color: var(--accent-text);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>

    const uploadCard = document.getElementById("uploadCard");
    const langSelect = document.getElementById("langSelect");
    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const bucketLabel = document.getElementById("bucketLabel");
    const optAvatars = document.getElementById("optAvatars");
    const optImages = document.getElementById("optImages");
    const fileLabel = document.getElementById("fileLabel");
    const bucketSelect = document.getElementById("bucketSelect");
    const mediaInput = document.getElementById("mediaInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const previewBox = document.getElementById("previewBox");
    const previewImg = document.getElementById("previewImg");
    const statusBox = document.getElementById("statusBox");

    let currentLang = localStorage.getItem("autrobook_lang") || "en";
    if (!TRANSLATIONS[currentLang]) currentLang = "en";
    let isUploading = false;
    let activeUser = null;

    function t(key) {
      return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key];
    }

    function applyLanguage(langCode) {
      currentLang = TRANSLATIONS[langCode] ? langCode : "en";
      localStorage.setItem("autrobook_lang", currentLang);
      langSelect.value = currentLang;

      document.documentElement.lang = currentLang;
      document.documentElement.dir = t("dir");
      document.title = t("docTitle");
      pageTitle.textContent = t("pageTitle");
      pageSubtitle.textContent = t("pageSubtitle");
      bucketLabel.textContent = t("bucketLabel");
      optAvatars.textContent = t("optAvatars");
      optImages.textContent = t("optImages");
      fileLabel.textContent = t("fileLabel");
      uploadBtn.textContent = isUploading ? t("uploadingBtn") : t("uploadBtn");

      const copyBtn = document.getElementById("copyUrlBtn");
      if (copyBtn && copyBtn.dataset.state !== "copied") {
        copyBtn.textContent = t("copyBtn");
      }
    }

    applyLanguage(currentLang);

    langSelect.addEventListener("change", () => {
      applyLanguage(langSelect.value);
    });

    function showStatus(type, message, publicUrl = "") {
      statusBox.className = `status-box show ${type}`;
      if (publicUrl) {
        statusBox.innerHTML = `
          <div>${message}</div>
          <div class="url-row">
            <input type="text" id="publicUrlField" class="url-input" value="${publicUrl}" readonly />
            <button type="button" id="copyUrlBtn" class="copy-btn" data-state="idle">${t("copyBtn")}</button>
          </div>
        `;
        const copyBtn = document.getElementById("copyUrlBtn");
        const urlField = document.getElementById("publicUrlField");
        copyBtn?.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(urlField.value);
            copyBtn.dataset.state = "copied";
            copyBtn.textContent = t("copiedBtn");
            setTimeout(() => {
              copyBtn.dataset.state = "idle";
              copyBtn.textContent = t("copyBtn");
            }, 1500);
          } catch (_) {
            urlField.select();
            document.execCommand("copy");
          }
        });
      } else {
        statusBox.textContent = message;
      }
    }

    async function enforceAuth() {
      if (!window.AutroAuth || typeof window.AutroAuth.checkSessionAndProfile !== "function") {
        window.location.replace("/login.html");
        return false;
      }

      const authData = await window.AutroAuth.checkSessionAndProfile({ requireCompleteProfile: true });
      if (!authData || !authData.user) {
        return false;
      }

      activeUser = authData.user;
      uploadCard.classList.add("ready");
      return true;
    }

    const isAuthorized = await enforceAuth();

    mediaInput.addEventListener("change", () => {
      const file = mediaInput.files && mediaInput.files[0];
      statusBox.className = "status-box";
      if (!file) {
        previewBox.classList.remove("active");
        previewImg.removeAttribute("src");
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        previewImg.src = ev.target?.result || "";
        previewBox.classList.add("active");
      };
      reader.readAsDataURL(file);
    });

    async function uploadMedia(bucketName, filePath, file) {
      const { data, error } = await supabase.storage
        .from(bucketName) // "images" অথবা "avatars"
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
        });

      if (error) {
        throw error;
      }

      const { data: urlData } = supabase.storage
        .from(bucketName)
        .getPublicUrl(data.path);

      return urlData.publicUrl;
    }

    uploadBtn.addEventListener("click", async () => {
      if (!isAuthorized) {
        showStatus("error", t("authRequiredError"));
        await enforceAuth();
        return;
      }

      const file = mediaInput.files && mediaInput.files[0];
      if (!file) {
        showStatus("error", t("selectFileError"));
        return;
      }

      const bucketName = bucketSelect.value || "avatars";
      const authCheck = await window.AutroAuth.checkSessionAndProfile({ requireCompleteProfile: true });
      if (!authCheck || !authCheck.user) {
        return;
      }

      activeUser = authCheck.user;
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const filePath = `${activeUser.id}/${Date.now()}_${safeName}`;

      isUploading = true;
      uploadBtn.disabled = true;
      uploadBtn.textContent = t("uploadingBtn");
      showStatus("success", t("uploadingStatus"));

      try {
        const url = await uploadMedia(bucketName, filePath, file);
        console.log("Public URL:", url);
        showStatus("success", t("uploadSuccess"), url);
      } catch (err) {
        console.error("Upload error:", err);
        showStatus("error", `${t("uploadFailed")} ${err?.message || "Unknown error"}`);
      } finally {
        isUploading = false;
        uploadBtn.disabled = false;
        uploadBtn.textContent = t("uploadBtn");
      }
    });
  </script>
</body>
</html>
