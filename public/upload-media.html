<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Media • Autrobook</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    :root {
      --bg-page: #FFFFFF;
      --bg-card: #F8FAF9;
      --bg-subtle: #EEF3F0;
      --text-main: #111827;
      --text-muted: #4B5563;
      --border-color: #DCE5E0;
      --accent-green: #0B3D20;
      --accent-green-hover: #14532D;
      --accent-text: #FFFFFF;
      --danger-bg: #FEF2F2;
      --danger-text: #B91C1C;
      --success-bg: #ECFDF5;
      --success-text: #065F46;
      --shadow-card: 0 10px 28px rgba(11, 61, 32, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #202124;
        --bg-card: #292A2D;
        --bg-subtle: #303134;
        --text-main: #E8EAED;
        --text-muted: #9AA0A6;
        --border-color: #3C4043;
        --accent-green: #1B5E34;
        --accent-green-hover: #257A45;
        --accent-text: #FFFFFF;
        --danger-bg: rgba(185, 28, 28, 0.18);
        --danger-text: #FCA5A5;
        --success-bg: rgba(16, 185, 129, 0.16);
        --success-text: #6EE7B7;
        --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.35);
      }
    }

    :root[data-theme="light"] {
      --bg-page: #FFFFFF;
      --bg-card: #F8FAF9;
      --bg-subtle: #EEF3F0;
      --text-main: #111827;
      --text-muted: #4B5563;
      --border-color: #DCE5E0;
      --accent-green: #0B3D20;
      --accent-green-hover: #14532D;
      --accent-text: #FFFFFF;
      --danger-bg: #FEF2F2;
      --danger-text: #B91C1C;
      --success-bg: #ECFDF5;
      --success-text: #065F46;
      --shadow-card: 0 10px 28px rgba(11, 61, 32, 0.08);
    }

    :root[data-theme="dark"] {
      --bg-page: #202124;
      --bg-card: #292A2D;
      --bg-subtle: #303134;
      --text-main: #E8EAED;
      --text-muted: #9AA0A6;
      --border-color: #3C4043;
      --accent-green: #1B5E34;
      --accent-green-hover: #257A45;
      --accent-text: #FFFFFF;
      --danger-bg: rgba(185, 28, 28, 0.18);
      --danger-text: #FCA5A5;
      --success-bg: rgba(16, 185, 129, 0.16);
      --success-text: #6EE7B7;
      --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .upload-wrapper {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    .upload-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-green);
      background-color: var(--bg-subtle);
    }

    .upload-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .upload-subtitle {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .theme-btn {
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .theme-btn:hover {
      border-color: var(--accent-green);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .select-input,
    .file-input {
      width: 100%;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 0.92rem;
    }

    .select-input:focus,
    .file-input:focus {
      outline: 2px solid var(--accent-green);
      outline-offset: 1px;
    }

    .preview-box {
      display: none;
      margin-bottom: 16px;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 12px;
      background-color: var(--bg-page);
      text-align: center;
    }

    .preview-box.active {
      display: block;
    }

    .preview-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      object-fit: contain;
    }

    .primary-btn {
      width: 100%;
      background-color: var(--accent-green);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .primary-btn:hover:not(:disabled) {
      background-color: var(--accent-green-hover);
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.45;
      display: none;
      word-break: break-all;
    }

    .status-box.show {
      display: block;
    }

    .status-box.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .status-box.error {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid rgba(185, 28, 28, 0.35);
    }

    .url-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      min-width: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
    }

    .copy-btn {
      background-color: var(--accent-green);
      color: var(--accent-text);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="upload-wrapper">
    <header class="upload-header">
      <div class="brand-group">
        <img src="/logo.png" alt="Autrobook" class="brand-logo" onerror="this.style.display='none'" />
        <div>
          <h1 class="upload-title">Upload Media</h1>
          <p class="upload-subtitle">Autrobook Storage</p>
        </div>
      </div>
      <button type="button" id="themeToggleBtn" class="theme-btn">Theme</button>
    </header>

    <div class="form-group">
      <label for="bucketSelect" class="form-label">Bucket নির্বাচন করুন</label>
      <select id="bucketSelect" class="select-input">
        <option value="avatars">avatars (Profile / Avatar)</option>
        <option value="images">images (Posts / Media)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mediaInput" class="form-label">ছবি নির্বাচন করুন</label>
      <input type="file" id="mediaInput" class="file-input" accept="image/*" />
    </div>

    <div id="previewBox" class="preview-box">
      <img id="previewImg" src="" alt="Selected preview" class="preview-img" />
    </div>

    <button type="button" id="uploadBtn" class="primary-btn">Upload</button>

    <div id="statusBox" class="status-box"></div>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
      },
    });

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const bucketSelect = document.getElementById("bucketSelect");
    const mediaInput = document.getElementById("mediaInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const previewBox = document.getElementById("previewBox");
    const previewImg = document.getElementById("previewImg");
    const statusBox = document.getElementById("statusBox");

    function applyTheme(mode) {
      if (mode === "light" || mode === "dark") {
        document.documentElement.setAttribute("data-theme", mode);
        localStorage.setItem("autrobook_theme", mode);
      } else {
        document.documentElement.removeAttribute("data-theme");
        localStorage.removeItem("autrobook_theme");
      }
      const isDark =
        mode === "dark" ||
        (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches);
      themeToggleBtn.textContent = isDark ? "Light (#FFF)" : "Dark (#202124)";
    }

    applyTheme(localStorage.getItem("autrobook_theme"));

    themeToggleBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const currentlyDark = current === "dark" || (!current && systemDark);
      applyTheme(currentlyDark ? "light" : "dark");
    });

    function showStatus(type, message, publicUrl = "") {
      statusBox.className = `status-box show ${type}`;
      if (publicUrl) {
        statusBox.innerHTML = `
          <div>${message}</div>
          <div class="url-row">
            <input type="text" id="publicUrlField" class="url-input" value="${publicUrl}" readonly />
            <button type="button" id="copyUrlBtn" class="copy-btn">Copy</button>
          </div>
        `;
        const copyBtn = document.getElementById("copyUrlBtn");
        const urlField = document.getElementById("publicUrlField");
        copyBtn?.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(urlField.value);
            copyBtn.textContent = "Copied";
            setTimeout(() => {
              copyBtn.textContent = "Copy";
            }, 1500);
          } catch (_) {
            urlField.select();
            document.execCommand("copy");
          }
        });
      } else {
        statusBox.textContent = message;
      }
    }

    mediaInput.addEventListener("change", () => {
      const file = mediaInput.files && mediaInput.files[0];
      statusBox.className = "status-box";
      if (!file) {
        previewBox.classList.remove("active");
        previewImg.removeAttribute("src");
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        previewImg.src = ev.target?.result || "";
        previewBox.classList.add("active");
      };
      reader.readAsDataURL(file);
    });

    async function uploadMedia(bucketName, filePath, file) {
      const { data, error } = await supabase.storage
        .from(bucketName) // "images" অথবা "avatars"
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
        });

      if (error) {
        throw error;
      }

      const { data: urlData } = supabase.storage
        .from(bucketName)
        .getPublicUrl(data.path);

      return urlData.publicUrl;
    }

    uploadBtn.addEventListener("click", async () => {
      const file = mediaInput.files && mediaInput.files[0];
      if (!file) {
        showStatus("error", "অনুগ্রহ করে প্রথমে একটি ছবি নির্বাচন করুন।");
        return;
      }

      const bucketName = bucketSelect.value || "avatars";
      let folderPrefix = "user123";

      try {
        if (window.AutroAuth && typeof window.AutroAuth.checkSessionAndProfile === "function") {
          const authData = await window.AutroAuth.checkSessionAndProfile({ requireCompleteProfile: false });
          if (authData?.user?.id) {
            folderPrefix = authData.user.id;
          }
        } else {
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.user?.id) {
            folderPrefix = session.user.id;
          }
        }
      } catch (_) {
        // Fallback to default folder prefix if guest/test session
      }

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const filePath = `${folderPrefix}/${Date.now()}_${safeName}`;

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading...";
      showStatus("success", "আপলোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...");

      try {
        const url = await uploadMedia(bucketName, filePath, file);
        console.log("Public URL:", url);
        showStatus("success", "সফলভাবে আপলোড হয়েছে!", url);
      } catch (err) {
        console.error("Upload error:", err);
        showStatus("error", `আপলোড ব্যর্থ হয়েছে: ${err?.message || "Unknown error"}`);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload";
      }
    });
  </script>
</body>
      </html>
