<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Edit profile — Autrobook</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    /* =========================================================================
       1. THEME & COLOR TOKENS (Light, Dark & System Preference)
       ========================================================================= */
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --row-hover: #f4f5f7;
      --text: #111315;
      --muted: #5f6368;
      --border: #d1d5db;
      --green: #065f2b;
      --green-hover: #044720;
      --green-deep: #033818;
      --avatar-ring: transparent;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #202124;
        --row-hover: #292a2d;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #3c4043;
        --green: #065f2b;
        --green-hover: #087837;
        --green-deep: #044720;
        --avatar-ring: transparent;
      }
    }

    html[data-theme="light"],
    body[data-theme="light"] {
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --row-hover: #f4f5f7;
      --text: #111315;
      --muted: #5f6368;
      --border: #d1d5db;
      --green: #065f2b;
      --green-hover: #044720;
      --green-deep: #033818;
      --avatar-ring: transparent;
    }

    html[data-theme="dark"],
    body[data-theme="dark"] {
      --bg: #202124;
      --surface: #202124;
      --row-hover: #292a2d;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #3c4043;
      --green: #065f2b;
      --green-hover: #087837;
      --green-deep: #044720;
      --avatar-ring: transparent;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 68px;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       2. STICKY TOP BAR & DARK GREEN ACTION BUTTONS
       ========================================================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #FFFFFF;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }

    .back-btn:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    .topbar-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .save-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .save-btn:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================================================================
       3. TOP PROFILE PIC GUARD BAR & MEDIA HEADER
       ========================================================================= */
    .page-wrap {
      max-width: 780px;
      margin: 0 auto;
    }

    .guard-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .guard-top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .guard-icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--green);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .guard-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guard-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
    }

    .guard-state-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--row-hover);
    }

    .guard-state-pill.active {
      background: var(--green);
      border-color: var(--green);
      color: #FFFFFF;
    }

    .switch-btn {
      position: relative;
      width: 52px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--row-hover);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .switch-btn.on {
      background: var(--green);
      border-color: var(--green);
    }

    .switch-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .switch-btn.on .switch-knob {
      transform: translateX(24px);
    }

    .media-header {
      position: relative;
      padding-bottom: 16px;
    }

    .cover-box {
      position: relative;
      width: 100%;
      height: 220px;
      background: var(--row-hover);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .cover-box {
        height: 260px;
      }
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-img.has-img {
      display: block;
    }

    .cover-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13.5px;
    }

    .cover-placeholder.hidden {
      display: none;
    }

    .cam-badge-btn {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--green);
      color: #FFFFFF;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      z-index: 4;
    }

    .cam-badge-btn:hover {
      background: var(--green-hover);
    }

    .cover-cam-btn {
      right: 14px;
      bottom: 14px;
    }

    .avatar-wrap {
      position: relative;
      width: 148px;
      height: 148px;
      margin: -90px auto 0;
      z-index: 5;
    }

    .avatar-circle {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--row-hover);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar-img.has-img {
      display: block;
    }

    .avatar-placeholder {
      font-size: 48px;
      color: var(--muted);
    }

    .avatar-placeholder.hidden {
      display: none;
    }

    .avatar-center-badge {
      position: absolute;
      top: 84%;
      left: 43%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #FFFFFF;
      background: var(--green);
      color: #FFFFFF;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 3;
    }

    .avatar-wrap.guarded .avatar-center-badge {
      display: inline-flex;
    }

    .avatar-cam-btn {
      right: 4px;
      bottom: 4px;
    }

    /* =========================================================================
       4. PROFILE SECTIONS & ROWS
       ========================================================================= */
    .section-block {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      padding-bottom: 10px;
    }

    .section-header {
      width: 100%;
      padding: 10px 18px;
      background: transparent;
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }

    .section-header:hover {
      background: var(--row-hover);
    }

    .section-header i {
      font-size: 14px;
      color: var(--text);
      transition: transform 0.2s ease;
    }

    .section-block.collapsed .section-header i {
      transform: rotate(180deg);
    }

    .section-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .section-block.collapsed .section-items {
      display: none;
    }

    .item-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      cursor: pointer;
    }

    .item-row:hover {
      background: var(--row-hover);
    }

    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .item-icon {
      width: 26px;
      padding-top: 2px;
      font-size: 19px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-text-wrap {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }

    .item-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.45;
      word-break: break-word;
    }

    .item-meta-line {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .item-privacy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .edit-btn {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #FFFFFF;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .edit-btn:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    /* =========================================================================
       5. MODAL EDITOR, SEARCH PICKER, @FRIENDS CHIPS & MAP RESULTS
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 580px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 4px;
    }

    .field-input,
    .field-textarea,
    .field-select {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--row-hover);
      color: var(--text);
      font-size: 14.5px;
      outline: none;
      margin-bottom: 10px;
    }

    .field-textarea {
      height: auto;
      min-height: 96px;
      padding: 10px 12px;
      resize: vertical;
    }

    .field-input:focus,
    .field-textarea:focus,
    .field-select:focus {
      border-color: var(--green);
    }

    .picker-search-wrap {
      position: relative;
      margin-bottom: 8px;
    }

    .picker-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13.5px;
      pointer-events: none;
    }

    .picker-search-input {
      width: 100%;
      height: 42px;
      padding: 0 12px 0 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--row-hover);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .picker-search-input:focus {
      border-color: var(--green);
    }

    .option-list {
      max-height: 225px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      margin-bottom: 10px;
    }

    .option-item {
      width: 100%;
      padding: 11px 13px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .option-item:last-child {
      border-bottom: none;
    }

    .option-item:hover {
      background: var(--row-hover);
    }

    .option-item.selected {
      background: var(--green);
      color: #FFFFFF;
      font-weight: 700;
    }

    .option-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .option-item.selected .option-sub {
      color: #e5e7eb;
    }

    .friend-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .friend-mini-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--green);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .friend-mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .family-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .family-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--green);
      background: var(--row-hover);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .family-chip button {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
    }

    .family-chip button:hover {
      color: var(--text);
    }

    .family-add-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .family-add-bar .field-select {
      margin-bottom: 0;
      flex: 1;
    }

    .map-meta-box {
      font-size: 12.5px;
      color: var(--muted);
      background: var(--row-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 8px;
      display: none;
    }

    .map-meta-box.active {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .photo-preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--row-hover);
    }

    .photo-preview-box img.cover-prev {
      width: 100%;
      max-height: 195px;
      object-fit: cover;
      border-radius: 8px;
    }

    .photo-preview-box img.avatar-prev {
      width: 132px;
      height: 132px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--border);
    }

    .action-btn-green {
      height: 38px;
      padding: 0 15px;
      border-radius: 8px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .action-btn-green:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .modal-footer button {
      flex: 1;
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-footer button:hover {
      background: var(--green-hover);
      border-color: var(--green-hover);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(80px);
      z-index: 150;
      background: var(--green);
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="profile.html" class="back-btn" title="Back to profile" aria-label="Back to profile">
        <i class="fas fa-chevron-left"></i>
      </a>
      <h1 class="topbar-title">Edit profile</h1>
    </div>
    <div class="topbar-actions">
      <button type="button" id="saveProfileBtn" class="save-btn">
        <i class="fas fa-check"></i>
        <span>Save</span>
      </button>
    </div>
  </header>

  <div class="page-wrap">
    <!-- Top Profile Pic Guard On / Off Bar -->
    <div class="guard-top-bar">
      <div class="guard-top-left">
        <span class="guard-icon-badge"><i class="fas fa-shield-alt"></i></span>
        <div class="guard-title-row">
          <span class="guard-title">Profile pic guard</span>
          <span id="guardStatusPill" class="guard-state-pill">Off</span>
        </div>
      </div>
      <button
        type="button"
        id="profileGuardSwitch"
        class="switch-btn"
        role="switch"
        aria-checked="false"
        aria-label="Toggle profile picture guard">
        <span class="switch-knob"></span>
      </button>
    </div>

    <!-- Cover Photo & Circular Profile Avatar -->
    <section class="media-header">
      <div class="cover-box" onclick="triggerPhoto('cover')">
        <div id="coverPlaceholder" class="cover-placeholder">
          <i class="fas fa-image" style="font-size:26px;"></i>
          <span>Add cover photo</span>
        </div>
        <img id="coverImg" class="cover-img" alt="Cover photo">
        <button type="button" class="cam-badge-btn cover-cam-btn" onclick="event.stopPropagation(); triggerPhoto('cover');" title="Edit cover photo">
          <i class="fas fa-camera"></i>
        </button>
      </div>
      <input type="file" id="coverInput" accept="image/*" style="display:none;">

      <div id="avatarWrap" class="avatar-wrap">
        <div class="avatar-circle" onclick="triggerPhoto('avatar')">
          <span id="avatarCenterBadge" class="avatar-center-badge" aria-hidden="true">
            <i class="fas fa-shield-alt"></i>
          </span>
          <span id="avatarPlaceholder" class="avatar-placeholder"><i class="fas fa-user"></i></span>
          <img id="avatarImg" class="avatar-img" alt="Profile photo">
        </div>

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function privacyIcon(p) {
      if (p === 'Only me') return 'fa-lock';
      if (p === 'Friends' || p === 'Your friends of friends') return 'fa-user-friends';
      return 'fa-globe-americas';
    }

    function formatFamilySummary(s) {
      const list = Array.isArray(s.family_members) ? s.family_members : [];
      if (list.length) {
        return list.map(m => `${m.name}${m.relation ? ` (${m.relation})` : ''}`).join(', ');
      }
      return s.family || '';
    }

    function normalizeTheme(val) {
      if (!val) return null;
      const v = String(val).toLowerCase().trim();
      if (v === 'dark' || v === 'true' || v === '1') return 'dark';
      if (v === 'light' || v === 'false' || v === '0') return 'light';
      return null;
    }

    function applyTheme(val) {
      const norm = normalizeTheme(val);
      if (norm) {
        document.documentElement.setAttribute('data-theme', norm);
        document.body.setAttribute('data-theme', norm);
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.body.removeAttribute('data-theme');
      }
    }

    function initTheme() {
      for (const k of THEME_KEYS) {
        try {
          const norm = normalizeTheme(localStorage.getItem(k));
          if (norm) {
            applyTheme(norm);
            break;
          }
        } catch (_) {}
      }
      window.addEventListener('storage', (e) => {
        if (e && THEME_KEYS.includes(e.key)) applyTheme(e.newValue);
      });
      if (themeChannel) {
        themeChannel.onmessage = (ev) => {
          if (ev?.data?.type === 'THEME_SYNC') applyTheme(ev.data.theme);
        };
      }
    }

    function renderGuardUI() {
      const isOn = Boolean(dataState.profile_pic_guard);
      const sw = document.getElementById('profileGuardSwitch');
      const pill = document.getElementById('guardStatusPill');
      const wrap = document.getElementById('avatarWrap');

      if (sw) {
        sw.classList.toggle('on', isOn);
        sw.setAttribute('aria-checked', String(isOn));
      }
      if (pill) {
        pill.textContent = isOn ? 'On' : 'Off';
        pill.classList.toggle('active', isOn);
      }
      if (wrap) {
        wrap.classList.toggle('guarded', isOn);
      }
    }

    async function toggleProfilePicGuard() {
      dataState.profile_pic_guard = !Boolean(dataState.profile_pic_guard);
      renderGuardUI();
      saveLocal();
      showToast(dataState.profile_pic_guard ? 'Profile pic guard On' : 'Profile pic guard Off');
      await saveToSupabase();
    }

      const input = document.getElementById(kind === 'cover' ? 'coverInput' : 'avatarInput');

        coverImg.removeAttribute('src');

    async function loadFriendsList() {
      const collected = [];
      const seen = new Set();

      const pushFriend = (f) => {
        if (!f) return;
        const name = String(f.full_name || f.name || f.username || '').trim();
        const handle = String(f.username || '').replace(/^@+/, '').trim();
        const id = String(f.id || handle || name).trim();
        if (!name && !handle) return;
        const key = id.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        collected.push({
          id: f.id || id,
          full_name: name || `@${handle}`,
          username: handle ? `@${handle}` : '',
          avatar_url: f.avatar_url || ''
        });
      };

      try {
        const localFriends = JSON.parse(localStorage.getItem('autrobook_friends') || '[]');
        if (Array.isArray(localFriends)) localFriends.forEach(pushFriend);
      } catch (_) {}

      try {
        const localUser = JSON.parse(localStorage.getItem('autrobook_user') || '{}');
        if (Array.isArray(localUser.friends)) localUser.friends.forEach(pushFriend);
      } catch (_) {}

      if (sb) {
        try {
          const { data: rows } = await sb
            .from('profiles')
            .select('id, full_name, username, avatar_url')
            .limit(50);
          if (Array.isArray(rows)) rows.forEach(pushFriend);
        } catch (_) {}
      }

      friendsCache = collected;
      return friendsCache;
    }

    function addFamilyMemberEntry(name, username, avatarUrl) {
      const cleanName = String(name || '').replace(/^@friends\s*/i, '').trim();
      const relation = document.getElementById('familyRelationSelect')?.value || 'Family member';
      if (!cleanName) return;

      const cleanHandle = username ? String(username).replace(/^@+/, '') : '';
      const existingIdx = draftFamilyMembers.findIndex(
        x => x.name.toLowerCase() === cleanName.toLowerCase() && (x.username || '') === (cleanHandle ? `@${cleanHandle}` : '')
      );

      const entry = {
        name: cleanName,
        username: cleanHandle ? `@${cleanHandle}` : '',
        relation,
        avatar_url: avatarUrl || ''
      };

      if (existingIdx >= 0) draftFamilyMembers[existingIdx] = entry;
      else draftFamilyMembers.push(entry);

      renderFamilyChips();
      syncFamilyTextInput();

    function handleFamilyInputSearch(rawQuery) {
      const qRaw = String(rawQuery || '').trim();
      const listEl = document.getElementById('optionList');
      if (!listEl) return;

      if (!qRaw) {
        listEl.innerHTML = `<div style="padding:12px;font-size:13.5px;color:var(--muted);">Type <strong>@friends</strong> or a friend's name to search friends and add as a family member.</div>`;
        return;
      }

      const lower = qRaw.toLowerCase();
      let matches = friendsCache;

      if (lower === '@friends' || lower === '@friend' || lower === 'friends') {
        matches = friendsCache;
      } else {
        const cleaned = lower.replace(/^@friends\s*/i, '').replace(/^@+/, '').trim();
        matches = cleaned
          ? friendsCache.filter(f =>
              f.full_name.toLowerCase().includes(cleaned) ||
              f.username.toLowerCase().includes(cleaned)
            )
          : friendsCache;
      }

      const customOptionHtml = `
        <button type="button" class="option-item" onclick="addFamilyMemberEntry('${escapeHtml(qRaw.replace(/^@friends\s*/i, '')).replace(/'/g, "\\'")}', '', '')">

              <div class="option-sub">Add with selected relation</div>
            </div>
          </div>
          <span class="option-sub">Add</span>
        </button>
      `;

      if (!matches.length) {
        listEl.innerHTML = customOptionHtml;
        return;
      }

      listEl.innerHTML = matches.map(f => {
        const initials = (f.full_name || 'F').trim().charAt(0).toUpperCase();
        const avatarHtml = f.avatar_url
          ? `<img src="${escapeHtml(f.avatar_url)}" alt="${escapeHtml(f.full_name)}">`

        return `
          <button type="button" class="option-item" onclick="addFamilyMemberEntry('${escapeHtml(f.full_name).replace(/'/g, "\\'")}', '${escapeHtml(f.username).replace(/'/g, "\\'")}', '${escapeHtml(f.avatar_url).replace(/'/g, "\\'")}')">

    function filterOptions(query) {
      const item = findItem(activeKey);
      if (!item) return;
      const q = (query || '').trim().toLowerCase();
      const base = item.options || [];
      const filtered = !q
        ? base
        : base.filter(o => {
            const l = (typeof o === 'string' ? o : o.label).toLowerCase();
            const s = (typeof o === 'string' ? '' : (o.sub || '')).toLowerCase();
            return l.includes(q) || s.includes(q);
          });
      renderOptionList(filtered, document.getElementById('editInput')?.value || '');
    }

    function searchWorldMap(query) {
      const q = (query || '').trim().toLowerCase();
      const currentVal = document.getElementById('editInput')?.value || '';
      const localMatches = !q
        ? WORLD_PLACES
        : WORLD_PLACES.filter(p =>
            p.label.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q)
          );

      renderOptionList(localMatches, currentVal);

      clearTimeout(geoSearchTimer);
      if ((query || '').trim().length < 2) return;

      geoSearchTimer = setTimeout(async () => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&limit=8&q=${encodeURIComponent(query.trim())}`;
          const res = await fetch(url, { headers: { Accept: 'application/json' } });
          if (!res.ok) return;
          const places = await res.json();
          if (!Array.isArray(places) || !places.length) return;

          const remoteMapped = places.map(p => {
            const parts = (p.display_name || '').split(',').map(s => s.trim()).filter(Boolean);
            const shortName = parts.slice(0, 3).join(', ') || p.display_name;
            return {
              label: shortName,
              sub: 'World Map',
              lat: Number(p.lat),
              lon: Number(p.lon)
            };
          });

          const seen = new Set();
          const merged = [...remoteMapped, ...localMatches].filter(itemObj => {
            const key = itemObj.label.toLowerCase();
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });

          renderOptionList(merged, document.getElementById('editInput')?.value || '');
        } catch (_) {}
      }, 280);
    }

          const r = new FileReader();
          r.onload = e => e.target?.result && openPhotoModal('cover', e.target.result);

      if (avatarInput) {

          r.onload = e => e.target?.result && openPhotoModal('avatar', e.target.result);

    function saveLocal() {

        const guardEnabled = Boolean(dataState.profile_pic_guard);
        const prev = JSON.parse(localStorage.getItem('autrobook_user') || '{}') || {};
        const merged = Object.assign({}, prev, dataState, {
          id: activeUserId || prev.id || null,
          profile_pic_guard: guardEnabled,
          thought: dataState.bio || ''
        });
        localStorage.setItem('autrobook_user', JSON.stringify(merged));
        localStorage.setItem('autro_profile_pic_guard', guardEnabled ? 'true' : 'false');

        if (dataState.avatar_url) {
          localStorage.setItem('autro_avatar_url', dataState.avatar_url);
          localStorage.setItem('autro_profile_avatar', dataState.avatar_url);
        } else {
          localStorage.removeItem('autro_avatar_url');
          localStorage.removeItem('autro_profile_avatar');
        }
        if (dataState.cover_url) {
          localStorage.setItem('autro_cover_url', dataState.cover_url);
        } else {
          localStorage.removeItem('autro_cover_url');
        }
        try {
          sessionStorage.setItem('autrobook_profile_sync', JSON.stringify(merged));
        } catch (_) {}
        try {
          profileChannel?.postMessage({
            type: 'PROFILE_UPDATED',
            profile_pic_guard: guardEnabled,
            profile: merged
          });
        } catch (_) {}
      } catch (_) {}
    }

    async function getUserId() {
      if (activeUserId) return activeUserId;
      if (sb?.auth) {
        try {
          const { data } = await sb.auth.getUser();
          if (data?.user?.id) {
            activeUserId = data.user.id;
            return activeUserId;
          }
          const { data: sData } = await sb.auth.getSession();
          if (sData?.session?.user?.id) {
            activeUserId = sData.session.user.id;
            return activeUserId;
          }
        } catch (_) {}
      }
      try {
        const local = JSON.parse(localStorage.getItem('autrobook_user') || '{}') || {};
        if (local.id) {
          activeUserId = local.id;
          return activeUserId;
        }
      } catch (_) {}
      return null;
    }

    async function uploadDataUrl(dataUrl, bucket, folder) {
      if (!dataUrl || !sb || !String(dataUrl).startsWith('data:')) return dataUrl || '';
      try {
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const ext = (blob.type.split('/')[1] || 'jpg').replace(/[^a-z0-9]/gi, '');
        const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
        const { error } = await sb.storage.from(bucket).upload(path, blob, {
          contentType: blob.type || 'image/jpeg',
          upsert: true
        });
        if (!error) {
          const pub = sb.storage.from(bucket).getPublicUrl(path);
          if (pub?.data?.publicUrl) return pub.data.publicUrl;
        }
      } catch (_) {}
      return dataUrl;
    }

    async function saveToSupabase() {
      const btn = document.getElementById('saveProfileBtn');
      if (btn) btn.disabled = true;

      try {
        const userId = await getUserId();
        if (sb && userId) {
          if (dataState.avatar_url && String(dataState.avatar_url).startsWith('data:')) {
            dataState.avatar_url = await uploadDataUrl(dataState.avatar_url, 'avatars', userId);
          }
          if (dataState.cover_url && String(dataState.cover_url).startsWith('data:')) {
            dataState.cover_url = await uploadDataUrl(dataState.cover_url, 'posts', userId);
          }
        }

        saveLocal();
        renderMedia();
        renderSections();

        if (sb && userId) {
          const payload = {
            id: userId,
            full_name: dataState.full_name || '',
            username: dataState.username || null,
            avatar_url: dataState.avatar_url || '',
            cover_url: dataState.cover_url || '',
            profile_pic_guard: Boolean(dataState.profile_pic_guard),
            bio: dataState.bio || '',
            thought: dataState.bio || '',
            pinned_details: dataState.pinned_details || '',
            category_main: dataState.category_main || '',
            is_ai_creator: dataState.is_ai_creator || '',
            page_type: dataState.page_type || '',
            location: dataState.location || '',
            hometown: dataState.hometown || '',
            dob: dataState.dob || '',
            relationship: dataState.relationship || '',
            family: dataState.family || '',
            gender: dataState.gender || '',
            language: dataState.language || '',
            work_company: dataState.work_company || '',
            work_role: dataState.work_role || '',
            work_period: dataState.work_period || '',
            education_university: dataState.education_university || '',
            education_university_year: dataState.education_university_year || '',
            education_college: dataState.education_college || '',
            education_college_year: dataState.education_college_year || '',
            education_school: dataState.education_school || '',
            education_school_year: dataState.education_school_year || '',
            hobbies: dataState.hobbies || '',
            interest_music: dataState.interest_music || '',
            interest_tv: dataState.interest_tv || '',
            interest_movies: dataState.interest_movies || '',
            interest_games: dataState.interest_games || '',
            interest_sports: dataState.interest_sports || '',
            travel_places: dataState.travel_places || '',
            website_url: dataState.link_url || '',
            social_link: dataState.social_link || '',
            email: dataState.email || '',
            phone: dataState.phone_primary || '',
            updated_at: new Date().toISOString()
          };

          const { error } = await sb.from('profiles').upsert(payload, { onConflict: 'id' });
          if (error) {
            await sb.from('profiles').upsert({
              id: userId,
              full_name: dataState.full_name || '',
              username: dataState.username || null,
              avatar_url: dataState.avatar_url || '',
              cover_url: dataState.cover_url || '',
              bio: dataState.bio || '',
              thought: dataState.bio || '',
              updated_at: new Date().toISOString()
            }, { onConflict: 'id' });
          }
        }

        showToast('Saved');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function initPage() {
      initTheme();
      bindInputs();

      try {
        const local = JSON.parse(localStorage.getItem('autrobook_user') || '{}') || {};
        const guardFlag = localStorage.getItem('autro_profile_pic_guard');
        dataState = Object.assign({}, DEFAULT_DATA, local, {
          profile_pic_guard: guardFlag !== null ? guardFlag === 'true' : Boolean(local.profile_pic_guard),
          bio: local.bio || local.thought || ''
        });
        if (local.id) activeUserId = local.id;
        if (!dataState.avatar_url && (localStorage.getItem('autro_avatar_url') || localStorage.getItem('autro_profile_avatar'))) {
          dataState.avatar_url = localStorage.getItem('autro_avatar_url') || localStorage.getItem('autro_profile_avatar');
        }
        if (!dataState.cover_url && localStorage.getItem('autro_cover_url')) {
          dataState.cover_url = localStorage.getItem('autro_cover_url');
        }
      } catch (_) {}

      renderMedia();
      renderSections();

      document.getElementById('saveProfileBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        saveToSupabase();
      });

      if (!sb) return;
      try {
        const { data: sData } = await sb.auth.getSession();
        const user = sData?.session?.user;
        if (!user) return;
        activeUserId = user.id;

        const { data: row } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
        if (row) {
          dataState = Object.assign({}, dataState, {
            full_name: row.full_name ?? dataState.full_name,
            username: row.username ?? dataState.username,
            avatar_url: row.avatar_url ?? dataState.avatar_url,
            cover_url: row.cover_url ?? dataState.cover_url,
            profile_pic_guard: typeof row.profile_pic_guard === 'boolean' ? row.profile_pic_guard : dataState.profile_pic_guard,
            bio: row.bio ?? row.thought ?? dataState.bio,
            pinned_details: row.pinned_details ?? dataState.pinned_details,
            category_main: row.category_main ?? dataState.category_main,
            is_ai_creator: row.is_ai_creator ?? dataState.is_ai_creator,
            page_type: row.page_type ?? dataState.page_type,
            location: row.location ?? dataState.location,
            hometown: row.hometown ?? dataState.hometown,
            dob: row.dob ?? dataState.dob,
            relationship: row.relationship ?? dataState.relationship,
            family: row.family ?? dataState.family,
            gender: row.gender ?? dataState.gender,
            language: row.language ?? dataState.language,
            work_company: row.work_company ?? dataState.work_company,
            work_role: row.work_role ?? dataState.work_role,
            work_period: row.work_period ?? dataState.work_period,
            education_university: row.education_university ?? dataState.education_university,
            education_university_year: row.education_university_year ?? dataState.education_university_year,
            education_college: row.education_college ?? dataState.education_college,
            education_college_year: row.education_college_year ?? dataState.education_college_year,
            education_school: row.education_school ?? dataState.education_school,
            education_school_year: row.education_school_year ?? dataState.education_school_year,
            hobbies: row.hobbies ?? dataState.hobbies,
            interest_music: row.interest_music ?? dataState.interest_music,
            interest_tv: row.interest_tv ?? dataState.interest_tv,
            interest_movies: row.interest_movies ?? dataState.interest_movies,
            interest_games: row.interest_games ?? dataState.interest_games,
            interest_sports: row.interest_sports ?? dataState.interest_sports,
            travel_places: row.travel_places ?? dataState.travel_places,
            link_url: row.website_url ?? dataState.link_url,
            social_link: row.social_link ?? dataState.social_link,
            email: row.email ?? dataState.email,
            phone_primary: row.phone ?? dataState.phone_primary
          });
          saveLocal();
          renderMedia();
          renderSections();
        }
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
