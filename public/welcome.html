<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Welcome to Autrobook - 18+ Free Social Media Platform">

<title>Welcome to Autrobook</title>

<!-- Google Fonts: Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --bg: #FFFFFF;
    --surface: #F8F9FA;
    --card: #FFFFFF;
    --card-elevated: #FFFFFF;

    --text: #202124;
    --muted: #5F6368;

    --primary: #0F5132;
    --primary-hover: #0B3D26;
    --primary-soft: rgba(15, 81, 50, 0.08);

    --accent: #0F5132;
    --accent-dark: #0B3D26;
    --accent-soft: rgba(15, 81, 50, 0.10);
    --accent-border: rgba(15, 81, 50, 0.25);

    --border: rgba(32, 33, 36, 0.10);
    --danger: #DC2626;

    --shadow-sm: 0 2px 10px rgba(32, 33, 36, 0.04);
    --shadow-md: 0 12px 32px rgba(32, 33, 36, 0.08);
    --shadow-btn: 0 8px 22px rgba(15, 81, 50, 0.22);

    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-pill: 999px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
}

html {
    scroll-behavior: smooth;
}

body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

.app-container {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding:
        calc(env(safe-area-inset-top, 0px) + 8px)
        20px
        calc(env(safe-area-inset-bottom, 0px) + 12px);
    position: relative;
}

.top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    position: relative;
    z-index: 10;
    opacity: 0;
    animation: fadeSlideDown 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 9px 15px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.2s ease, background-color 0.2s ease;
}

.lang-btn:hover {
    border-color: var(--accent);
    background: var(--bg);
}

.lang-btn:active {
    transform: scale(0.96);
}

.lang-btn svg {
    width: 16px;
    height: 16px;
    color: var(--accent);
    flex-shrink: 0;
}

.lang-chevron {
    width: 14px !important;
    height: 14px !important;
    color: var(--muted) !important;
}

.menu-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    position: relative;
    z-index: 15;
    transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease;
}

.menu-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--bg);
}

.menu-btn:active {
    transform: scale(0.94);
}

.logo-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 22px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
}

.logo-box {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
        0 10px 24px rgba(32, 33, 36, 0.06),
        0 4px 12px rgba(15, 81, 50, 0.10);
}

.logo-box::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 22px;
    border: 1.5px solid var(--accent);
    opacity: 0;
    animation: pulseRing 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.7s;
    pointer-events: none;
}

.logo-box img {
    width: 46px;
    height: 46px;
    object-fit: contain;
    border-radius: 12px;
    display: block;
}

.brand-title {
    margin-top: 16px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
}

.brand-subtitle {
    margin-top: 5px;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
}

.accounts-section {
    width: 100%;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.16s forwards;
}

.accounts-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 2px;
}

.accounts-heading h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
}

.count-pill {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: var(--radius-pill);
}

.accounts-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 38vh;
    max-height: 38dvh;
    overflow-y: auto;
    padding-bottom: 4px;
}

.accounts-list::-webkit-scrollbar {
    width: 4px;
}

.accounts-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
}

.account-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.2s ease, background-color 0.2s ease;
}

.account-item:hover {
    background: var(--bg);
    border-color: var(--accent);
}

.account-item:active {
    transform: scale(0.985);
}

.acc-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
}

.acc-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.acc-info {
    flex: 1;
    min-width: 0;
}

.acc-name {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.acc-email {
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.acc-status {
    margin-top: 5px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent-dark);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.acc-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
}

.acc-chevron {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s ease;
}

.account-item:hover .acc-chevron {
    transform: translateX(2px);
}

.empty-state {
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 20px;
    text-align: center;
}

.empty-icon-wrap {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
}

.empty-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
}

.empty-description {
    font-size: 13px;
    line-height: 1.55;
    color: var(--muted);
    max-width: 260px;
    margin: 0 auto;
}

.spacer {
    flex: 1;
    min-height: 28px;
}

/* =========================================================
   ACTION BUTTONS - DARK GREEN ACCENT
   ========================================================= */

.btn-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.24s forwards;
}

.btn {
    width: 100%;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: var(--radius-pill);
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.18s ease, background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    text-decoration: none;
}

.btn:active {
    transform: scale(0.975);
}

.btn-primary {
    background: #0F5132;
    color: #FFFFFF;
    border: 1px solid #0F5132;
    box-shadow: var(--shadow-btn);
}

.btn-primary:hover {
    background: #0B3D26;
    border-color: #0B3D26;
}

.btn-secondary {
    background: #FFFFFF;
    color: #0F5132;
    border: 1.5px solid #0F5132;
}

.btn-secondary:hover {
    background: rgba(15, 81, 50, 0.06);
    border-color: #0B3D26;
    color: #0B3D26;
}

.footer-wrap {
    text-align: center;
    padding: 10px 0 18px;
    opacity: 0;
    animation: fadeIn 0.7s ease 0.35s forwards;
}

.footer-brand {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--text);
    margin-bottom: 6px;
}

.footer-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
}

.age-pill {
    background: var(--accent);
    color: #FFFFFF;
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: var(--radius-pill);
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.52);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.modal-overlay.active {
    display: flex;
}

.lang-modal {
    width: 100%;
    max-width: 410px;
    height: 82vh;
    height: 82dvh;
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    animation: modalPop 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.lang-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
}

.lang-header h3 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
}

.lang-search-wrap {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
}

.lang-search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #FFFFFF;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
}

.lang-search-input:focus {
    border-color: var(--accent);
}

.close-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.15s ease;
}

.close-btn:active {
    transform: scale(0.92);
}

.lang-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.lang-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color 0.18s ease;
}

.lang-item:hover {
    background: var(--surface);
}

.lang-item.selected {
    background: var(--accent-soft);
}

.lang-label-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
}

.lang-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
}

.lang-country {
    font-size: 12px;
    color: var(--muted);
}

.lang-radio {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
}

.confirm-box {
    width: 100%;
    max-width: 340px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 24px 20px 20px;
    text-align: center;
    box-shadow: var(--shadow-md);
    animation: modalPop 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.confirm-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
}

.confirm-desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 20px;
}

.confirm-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.confirm-btn {
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease;
}

.confirm-btn:active {
    transform: scale(0.96);
}

.confirm-cancel {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
}

.confirm-delete {
    background: var(--danger);
    color: #FFFFFF;
}

.sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.52);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 900;
    display: none;
}

.sheet-overlay.active {
    display: block;
}

.bottom-sheet {
    position: fixed;
    left: 50%;
    bottom: -100%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 460px;
    max-height: 82vh;
    max-height: 82dvh;
    background: #FFFFFF;
    border-top: 1px solid var(--border);
    border-radius: 26px 26px 0 0;
    padding: 14px 20px calc(env(safe-area-inset-bottom, 16px) + 22px);
    z-index: 950;
    display: flex;
    flex-direction: column;
    transition: bottom 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 -10px 32px rgba(32, 33, 36, 0.16);
}

.bottom-sheet.active {
    bottom: 0;
}

.sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 10px;
    background: var(--border);
    margin: 0 auto 16px;
}

.sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.sheet-header h3 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
}

.delete-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
}

.del-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: border-color 0.2s ease;
}

.del-item:hover {
    border-color: var(--danger);
}

.del-item input {
    width: 19px;
    height: 19px;
    accent-color: var(--danger);
    cursor: pointer;
}

.del-item-info {
    flex: 1;
    min-width: 0;
}

.del-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
}

.del-email {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sheet-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius-pill);
    border: none;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.15s ease;
}

.sheet-btn:active:not(:disabled) {
    transform: scale(0.98);
}

.sheet-btn-danger {
    background: var(--danger);
    color: #FFFFFF;
}

.sheet-btn-danger:disabled {
    opacity: 0.38;
    cursor: not-allowed;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 90px);
    width: max-content;
    max-width: calc(100% - 40px);
    padding: 12px 18px;
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: #FFFFFF;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(15, 81, 50, 0.25);
    z-index: 2000;
    opacity: 0;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    text-align: center;
}

.toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
}

@keyframes fadeSlideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeSlideDown {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

@keyframes pulseRing {
    0% {
        transform: scale(1);
        opacity: 0.35;
    }
    100% {
        transform: scale(1.32);
        opacity: 0;
    }
}

@keyframes modalPop {
    from {
        transform: scale(0.95);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

@media (max-width: 360px) {
    .app-container {
        padding-left: 16px;
        padding-right: 16px;
    }
    .logo-box {
        width: 64px;
        height: 64px;
    }
    .logo-box img {
        width: 40px;
        height: 40px;
    }
    .brand-title {
        font-size: 23px;
    }
    .acc-avatar {
        width: 44px;
        height: 44px;
    }
}

@media (min-width: 481px) {
    body {
        background: var(--surface);
        padding: 24px 0;
    }
    .app-container {
        min-height: calc(100vh - 48px);
        background: #FFFFFF;
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow-md);
        padding: 16px 26px 20px;
    }
}
</style>
</head>

<body>

<div class="app-container">

    <!-- TOP BAR -->
    <div class="top-bar">
        <button type="button" class="lang-btn" id="languageButton" aria-label="Change language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span id="currentLangText">English (US)</span>
            <svg class="lang-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>

        <button type="button" class="menu-btn" id="menuButton" aria-label="Manage profiles">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="19" cy="12" r="1"></circle>
                <circle cx="5" cy="12" r="1"></circle>

/* =========================================================
   LOCAL STORAGE & STATE
========================================================= */

const LANGUAGE_ID_KEY = "autro_lang_id";
const LANGUAGE_CODE_KEY = "autro_lang";
const PROFILE_STORAGE_KEY = "autro_saved_profiles";

let currentLangId = safeGetStorage(LANGUAGE_ID_KEY) || "en-US";
let savedProfiles = loadSavedProfiles();
let pendingDeleteIds = [];

function getActiveLanguageObj() {
    return languages.find(l => l.id === currentLangId) || languages[0];
}

function loadSavedProfiles() {
    try {
        const saved = safeGetStorage(PROFILE_STORAGE_KEY);
        if (!saved) return [];
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
        console.error("Failed to load saved profiles:", error);
        return [];
    }
}

function saveProfiles() {
    safeSetStorage(PROFILE_STORAGE_KEY, JSON.stringify(savedProfiles));
}

/* =========================================================
   INITIALIZATION (EVENTS FIRST, THEN RENDER & SUPABASE)
========================================================= */

document.addEventListener("DOMContentLoaded", function () {
    setupEvents();
    buildLanguageList();
    applyLanguage();
    renderAccounts();
    loadSupabaseUser();
});

/* =========================================================
   SUPABASE CURRENT USER SYNC
========================================================= */

async function loadSupabaseUser() {
    if (!supabaseClient || !supabaseClient.auth) return;

    try {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error || !data || !data.user) return;

        const user = data.user;
        const metadata = user.user_metadata || {};

        const userName =
            metadata.full_name ||
            metadata.name ||
            metadata.username ||
            user.email ||
            "User";

        const userEmail = user.email || "";
        const avatar = metadata.avatar_url || metadata.picture || "";

        const existingProfile = savedProfiles.find(
            profile => profile.email === userEmail
        );

        if (!existingProfile) {
            savedProfiles.unshift({
                id: user.id,
                name: userName,
                email: userEmail,
                avatar: avatar,
                notifications: 0
            });
            saveProfiles();
            renderAccounts();
        }
    } catch (error) {
        console.warn("Supabase session check skipped:", error);
    }
}

/* =========================================================
   LANGUAGE SELECTION, SEARCH & LIVE TRANSLATION
========================================================= */

function buildLanguageList(filterQuery = "") {
    const langList = document.getElementById("langList");
    if (!langList) return;
    langList.innerHTML = "";
    const query = filterQuery.trim().toLowerCase();

    const filtered = languages.filter(lang =>
        lang.name.toLowerCase().includes(query) ||
        lang.country.toLowerCase().includes(query) ||
        lang.code.toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
        langList.innerHTML = `
            <div class="empty-state" style="margin: 12px; padding: 24px;">
                <div class="empty-description">No matching language or country found.</div>
            </div>
        `;
        return;
    }

    filtered.forEach(language => {
        const item = document.createElement("div");
        const isSelected = currentLangId === language.id;
        item.className = "lang-item" + (isSelected ? " selected" : "");

        item.innerHTML = `
            <div class="lang-label-group">
                <span class="lang-name">${escapeHTML(language.name)}</span>
                <span class="lang-country">${escapeHTML(language.country)}</span>
            </div>
            <input
                type="radio"
                class="lang-radio"
                name="language"
                value="${escapeHTML(language.id)}"
                ${isSelected ? "checked" : ""}
            >
        `;

        item.addEventListener("click", function () {
            selectLanguage(language);
        });

        langList.appendChild(item);
    });
}

function selectLanguage(langObj) {
    currentLangId = langObj.id;
    safeSetStorage(LANGUAGE_ID_KEY, langObj.id);
    safeSetStorage(LANGUAGE_CODE_KEY, langObj.code);
    applyLanguage();
    buildLanguageList();
    closeLanguageModal();
}

function applyLanguage() {
    const activeLang = getActiveLanguageObj();
    const t = translations[activeLang.code] || translations.en;

    document.documentElement.lang = activeLang.code;
    document.documentElement.dir = activeLang.rtl ? "rtl" : "ltr";

    document.getElementById("currentLangText").textContent = activeLang.name;
    document.getElementById("welcomeSubtitle").textContent = t.welcome;
    document.getElementById("accountsTitle").textContent = t.savedProfiles;
    document.getElementById("btnOther").textContent = t.useOther;
    document.getElementById("btnCreate").textContent = t.createNew;
    document.getElementById("footerTagline").textContent = t.tagline;
    document.getElementById("langModalTitle").textContent = t.selectLanguage;
    document.getElementById("langSearchInput").placeholder = t.searchPlaceholder;
    document.getElementById("manageTitle").textContent = t.manageProfiles;
    document.getElementById("btnDelete").textContent = t.removeSelected;
    document.getElementById("confirmTitle").textContent = t.confirmDelete;
    document.getElementById("confirmDesc").textContent = t.confirmDesc;
    document.getElementById("confirmCancelBtn").textContent = t.cancel;
    document.getElementById("confirmProceedBtn").textContent = t.remove;

    renderAccounts();
}

/* =========================================================
   RENDER SAVED PROFILES
========================================================= */

function renderAccounts() {
    const list = document.getElementById("accountsList");
    const count = document.getElementById("accountsCount");
    const activeLang = getActiveLanguageObj();
    const t = translations[activeLang.code] || translations.en;

    list.innerHTML = "";
    count.textContent = `${savedProfiles.length} ${savedProfiles.length === 1 ? t.profile : t.profiles}`;

    if (savedProfiles.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon-wrap">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="empty-title">${t.noProfiles}</div>
                <div class="empty-description">${t.noProfilesDescription}</div>
            </div>
        `;
        return;
    }

    savedProfiles.forEach(function (profile) {
        const item = document.createElement("div");
        item.className = "account-item";

        const avatarContent = profile.avatar
            ? `<img src="${escapeHTML(profile.avatar)}" alt="">`
            : `${escapeHTML(getInitial(profile.name))}`;

        const notificationCount = Number(profile.notifications || 0);

        item.innerHTML = `
            <div class="acc-avatar">${avatarContent}</div>

            <div class="acc-info">
                <div class="acc-name">${escapeHTML(profile.name || "User")}</div>
                <div class="acc-email">${escapeHTML(profile.email || "")}</div>
                <div class="acc-status">
                    <span class="acc-dot"></span>
                    <span>${notificationCount} ${t.notifications}</span>
                </div>
            </div>

            <div class="acc-chevron">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        `;

        item.addEventListener("click", function () {
            openSavedProfile(profile);
        });

        list.appendChild(item);
    });
}

function openSavedProfile(profile) {
    const email = profile.email || "";
    const profileId = profile.id || "";
    window.location.href =
        "login.html?email=" +
        encodeURIComponent(email) +
        "&profile_id=" +
        encodeURIComponent(profileId);
}

/* =========================================================
   PROFILE MANAGEMENT SHEET & DELETE (THREE DOTS HANDLER)
========================================================= */

function openSheet(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    const overlay = document.getElementById("sheetOverlay");
    const sheet = document.getElementById("bottomSheet");
    renderDeleteList();
    overlay.classList.add("active");
    sheet.classList.add("active");
}

function closeSheet() {
    document.getElementById("sheetOverlay").classList.remove("active");
    document.getElementById("bottomSheet").classList.remove("active");
}

function renderDeleteList() {
    const deleteList = document.getElementById("deleteList");
    const deleteButton = document.getElementById("btnDelete");
    const activeLang = getActiveLanguageObj();
    const t = translations[activeLang.code] || translations.en;

    deleteList.innerHTML = "";
    deleteButton.disabled = true;

    if (savedProfiles.length === 0) {
        deleteList.innerHTML = `
            <div class="empty-state">
                <div class="empty-description">${t.noProfilesFound}</div>
            </div>
        `;
        return;
    }

    savedProfiles.forEach(function (profile, index) {
        const safeId = profile.id || ("profile_" + index);
        const label = document.createElement("label");
        label.className = "del-item";
        const initial = getInitial(profile.name);

        label.innerHTML = `
            <input type="checkbox" value="${escapeHTML(safeId)}">
            <div class="acc-avatar" style="width:40px;height:40px;font-size:15px;">
                ${escapeHTML(initial)}
            </div>
            <div class="del-item-info">
                <div class="del-name">${escapeHTML(profile.name || "User")}</div>
                <div class="del-email">${escapeHTML(profile.email || "")}</div>
            </div>
        `;

        const checkbox = label.querySelector("input[type=checkbox]");
        checkbox.addEventListener("change", checkDeleteButton);
        deleteList.appendChild(label);
    });
}

function checkDeleteButton() {
    const checked = document.querySelectorAll("#deleteList input:checked");
    document.getElementById("btnDelete").disabled = checked.length === 0;
}

function requestDeleteSelectedProfiles() {
    const checked = document.querySelectorAll("#deleteList input:checked");
    pendingDeleteIds = Array.from(checked).map(cb => cb.value);
    if (pendingDeleteIds.length === 0) return;

    document.getElementById("confirmModal").classList.add("active");
}

function closeConfirmModal() {
    document.getElementById("confirmModal").classList.remove("active");
    pendingDeleteIds = [];
}

function executeDeleteProfiles() {
    if (pendingDeleteIds.length === 0) return;

    const countRemoved = pendingDeleteIds.length;
    const activeLang = getActiveLanguageObj();
    const t = translations[activeLang.code] || translations.en;

    savedProfiles = savedProfiles.filter(
        (profile, index) => !pendingDeleteIds.includes(String(profile.id || ("profile_" + index)))
    );

    saveProfiles();
    renderAccounts();
    renderDeleteList();
    closeConfirmModal();
    closeSheet();

    showToast(countRemoved === 1 ? t.profileRemoved : t.profilesRemoved);
}

/* =========================================================
   MODALS & TOAST
========================================================= */

function openLanguageModal(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    const searchInput = document.getElementById("langSearchInput");
    searchInput.value = "";
    buildLanguageList();
    document.getElementById("langModal").classList.add("active");
    setTimeout(() => {
        try { searchInput.focus(); } catch (_) {}
    }, 120);
}

function closeLanguageModal() {
    document.getElementById("langModal").classList.remove("active");
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(function () {
        toast.classList.remove("show");
    }, 2500);
}

/* =========================================================
   UTILITIES
========================================================= */

function getInitial(name) {
    if (!name) return "U";
    return String(name).trim().charAt(0).toUpperCase();
}

function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================================================
   EVENT LISTENERS
========================================================= */

function setupEvents() {
    const langBtn = document.getElementById("languageButton");
    const langClose = document.getElementById("langClose");
    const langSearch = document.getElementById("langSearchInput");
    const langModal = document.getElementById("langModal");

    const menuBtn = document.getElementById("menuButton");
    const sheetClose = document.getElementById("sheetClose");
    const sheetOverlay = document.getElementById("sheetOverlay");

    const btnDelete = document.getElementById("btnDelete");
    const confirmCancelBtn = document.getElementById("confirmCancelBtn");
    const confirmProceedBtn = document.getElementById("confirmProceedBtn");
    const confirmModal = document.getElementById("confirmModal");

    if (langBtn) langBtn.addEventListener("click", openLanguageModal);
    if (langClose) langClose.addEventListener("click", closeLanguageModal);
    if (langSearch) {
        langSearch.addEventListener("input", function (event) {
            buildLanguageList(event.target.value);
        });
    }
    if (langModal) {
        langModal.addEventListener("click", function (event) {
            if (event.target === langModal) {
                closeLanguageModal();
            }
        });
    }

    if (menuBtn) {
        menuBtn.addEventListener("click", openSheet);
    }
    if (sheetClose) sheetClose.addEventListener("click", closeSheet);
    if (sheetOverlay) sheetOverlay.addEventListener("click", closeSheet);

    if (btnDelete) btnDelete.addEventListener("click", requestDeleteSelectedProfiles);
    if (confirmCancelBtn) confirmCancelBtn.addEventListener("click", closeConfirmModal);
    if (confirmProceedBtn) confirmProceedBtn.addEventListener("click", executeDeleteProfiles);
    if (confirmModal) {
        confirmModal.addEventListener("click", function (event) {
            if (event.target === confirmModal) {
                closeConfirmModal();
            }
        });
    }

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeLanguageModal();
            closeConfirmModal();
            closeSheet();
        }
    });
}
</script>

</body>
