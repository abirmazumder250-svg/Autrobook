/* =========================================================
   AUTROBOOK WELCOME PAGE
   System Default Theme
   ========================================================= */

:root {
    --primary: #043D22;
    --primary-hover: #022C18;
    --primary-light: rgba(4, 61, 34, 0.08);

    --bg: #F4F6F8;
    --card: #FFFFFF;

    --text: #111827;
    --muted: #6B7280;

    --border: #E5E7EB;
    --danger: #EF4444;

    --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);

    --radius: 18px;
}

/* SYSTEM DARK MODE */

@media (prefers-color-scheme: dark) {
    :root {
        --primary: #043D22;
        --primary-hover: #07512D;
        --primary-light: rgba(4, 61, 34, 0.22);

        --bg: #121212;
        --card: #1E1E1E;

        --text: #F3F4F6;
        --muted: #9CA3AF;

        --border: #374151;

        --shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }
}

/* RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;

    overflow-x: hidden;
}

/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.app-container {
    width: 100%;
    max-width: 480px;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;

    padding:
        env(safe-area-inset-top, 0px)
        20px
        env(safe-area-inset-bottom, 0px);

    position: relative;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.top-bar {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 0;
}

.lang-btn {
    display: flex;
    align-items: center;
    gap: 8px;

    background: var(--card);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: 12px;

    padding: 10px 14px;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;
}

.lang-btn:active {
    transform: scale(0.96);
}

.lang-icon {
    font-size: 17px;
}

.menu-btn {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    background: transparent;
    color: var(--text);

    font-size: 27px;

    cursor: pointer;
}

.menu-btn:active {
    background: var(--primary-light);
}

/* =========================================================
   LOGO
   ========================================================= */

.logo-section {
    display: flex;
    flex-direction: column;
    align-items: center;

    margin-top: 35px;
    margin-bottom: 32px;
}

.logo-box {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    background: var(--primary);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    box-shadow: 0 8px 20px rgba(4, 61, 34, 0.20);
}

.logo-box img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.logo-fallback {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #FFFFFF;

    font-size: 38px;
    font-weight: 900;
}

.brand-title {
    margin-top: 15px;

    font-size: 27px;
    font-weight: 800;

    letter-spacing: -0.7px;
}

.brand-subtitle {
    margin-top: 6px;

    font-size: 14px;
    color: var(--muted);

    text-align: center;
}

/* =========================================================
   SAVED PROFILE SECTION
   ========================================================= */

.accounts-section {
    width: 100%;
}

.accounts-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 14px;
}

.accounts-heading h3 {
    font-size: 16px;
    font-weight: 700;
}

.accounts-heading span {
    font-size: 13px;
    color: var(--muted);
}

.accounts-list {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 12px;

    max-height: 42vh;
    max-height: 42dvh;

    overflow-y: auto;

    padding-bottom: 5px;
}

.accounts-list::-webkit-scrollbar {
    width: 4px;
}

.accounts-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
}

/* PROFILE CARD */

.account-item {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 13px;

    padding: 13px;

    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 16px;

    cursor: pointer;

    transition: 0.2s;
}

.account-item:active {
    transform: scale(0.98);
}

.account-item:hover {
    border-color: var(--primary);
}

/* AVATAR */

.acc-avatar {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    background: var(--primary);
    color: #FFFFFF;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;
    font-weight: 800;

    flex-shrink: 0;

    overflow: hidden;
}

.acc-avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* PROFILE INFO */

.acc-info {
    flex: 1;

    min-width: 0;
}

.acc-name {
    font-size: 16px;
    font-weight: 700;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.acc-email {
    margin-top: 4px;

    font-size: 13px;
    color: var(--muted);

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.acc-status {
    margin-top: 5px;

    font-size: 12px;
    color: var(--muted);

    display: flex;
    align-items: center;
    gap: 5px;
}

.acc-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #22C55E;
}

.acc-chevron {
    font-size: 24px;
    color: var(--muted);

    flex-shrink: 0;
}

/* EMPTY PROFILE */

.empty-state {
    background: var(--card);

    border: 1px dashed var(--border);
    border-radius: 18px;

    padding: 30px 20px;

    text-align: center;
}

.empty-icon {
    font-size: 36px;
    margin-bottom: 12px;
}

.empty-title {
    font-size: 16px;
    font-weight: 700;

    margin-bottom: 7px;
}

.empty-description {
    font-size: 13px;
    line-height: 1.6;

    color: var(--muted);
}

/* =========================================================
   SPACER
   ========================================================= */

.spacer {
    flex: 1;
    min-height: 35px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn-group {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 12px;

    margin-top: 25px;
    margin-bottom: 30px;
}

.btn {
    width: 100%;

    min-height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 30px;

    padding: 15px;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;

    text-decoration: none;
}

.btn:active {
    transform: scale(0.97);
}

/* DARK GREEN BUTTON */

.btn-primary {
    background: var(--primary);
    color: #FFFFFF;

    border: 1px solid var(--primary);
}

.btn-primary:hover {
    background: var(--primary-hover);
}

/* SECONDARY BUTTON */

.btn-secondary {
    background: transparent;

    color: var(--primary);

    border: 1px solid var(--primary);
}

.btn-secondary:hover {
    background: var(--primary-light);
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer-wrap {
    text-align: center;

    padding: 15px 0 25px;
}

.footer-brand {
    font-size: 17px;
    font-weight: 800;

    letter-spacing: 0.8px;

    margin-bottom: 5px;
}

.footer-tagline {
    font-size: 12px;
    color: var(--muted);
}

/* =========================================================
   LANGUAGE MODAL
   ========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.55);

    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    z-index: 999;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 16px;
}

.modal-overlay.active {
    display: flex;
}

.lang-modal {
    width: 100%;
    max-width: 420px;

    max-height: 85vh;
    max-height: 85dvh;

    display: flex;
    flex-direction: column;

    background: var(--card);

    border-radius: 20px;

    overflow: hidden;

    box-shadow: var(--shadow);
}

.lang-header {
    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}

.lang-header h3 {
    font-size: 18px;
    font-weight: 800;
}

.close-btn {
    width: 36px;
    height: 36px;

    border-radius: 50%;

    background: var(--bg);
    color: var(--text);

    border: none;

    font-size: 18px;

    cursor: pointer;
}

.lang-list {
    overflow-y: auto;

    padding: 8px;
}

.lang-item {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 14px;

    border-radius: 12px;

    cursor: pointer;

    transition: 0.2s;
}

.lang-item:hover {
    background: var(--bg);
}

.lang-item:active {
    transform: scale(0.98);
}

.lang-name {
    font-size: 16px;
    font-weight: 500;
}

.lang-radio {
    width: 22px;
    height: 22px;

    accent-color: #4285F4;

    cursor: pointer;
}

/* =========================================================
   PROFILE MANAGEMENT BOTTOM SHEET
   ========================================================= */

.sheet-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.5);

    z-index: 900;

    display: none;
}

.sheet-overlay.active {
    display: block;
}

.bottom-sheet {
    position: fixed;

    left: 50%;
    bottom: -100%;

    transform: translateX(-50%);

    width: 100%;
    max-width: 480px;

    max-height: 85vh;
    max-height: 85dvh;

    background: var(--card);

    border-radius: 24px 24px 0 0;

    padding: 20px 20px 30px;

    z-index: 901;

    display: flex;
    flex-direction: column;

    transition: bottom 0.3s ease;

    box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.15);
}

.bottom-sheet.active {
    bottom: 0;
}

.sheet-handle {
    width: 42px;
    height: 5px;

    border-radius: 10px;

    background: var(--border);

    margin: 0 auto 20px;
}

.sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.sheet-header h3 {
    font-size: 18px;
    font-weight: 800;
}

.delete-list {
    flex: 1;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 10px;

    margin-bottom: 20px;
}

.del-item {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 13px;

    border: 1px solid var(--border);
    border-radius: 14px;

    cursor: pointer;
}

.del-item input {
    width: 20px;
    height: 20px;

    accent-color: var(--primary);
}

.del-item-info {
    flex: 1;
    min-width: 0;
}

.del-name {
    font-size: 15px;
    font-weight: 700;
}

.del-email {
    font-size: 12px;
    color: var(--muted);

    margin-top: 4px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sheet-btn {
    width: 100%;

    padding: 16px;

    border-radius: 14px;

    border: none;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}

.sheet-btn-danger {
    background: var(--danger);
    color: white;
}

.sheet-btn-danger:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 30px;

    transform: translate(-50%, 100px);

    width: max-content;
    max-width: calc(100% - 40px);

    padding: 13px 18px;

    border-radius: 12px;

    background: #222222;
    color: #FFFFFF;

    font-size: 14px;

    z-index: 2000;

    opacity: 0;

    transition: 0.3s;

    text-align: center;
}

.toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 360px) {

    .app-container {
        padding-left: 15px;

    }

        width: 65px;
        height: 65px;
    }

    .brand-title {
        font-size: 24px;
    }

    .acc-avatar {
        width: 46px;
        height: 46px;
    }

    .acc-name {
        font-size: 14px;
    }
}

@media (min-width: 481px) {

    body {
        padding: 20px 0;
    }

    .app-container {
        min-height: calc(100vh - 40px);

        background: var(--card);

        border-radius: 24px;

        box-shadow: var(--shadow);
    }
}

/* =========================================================
   LOCAL STORAGE
========================================================= */

const LANGUAGE_STORAGE_KEY = "autro_lang";

const PROFILE_STORAGE_KEY = "autro_saved_profiles";


/* =========================================================
   CURRENT LANGUAGE
========================================================= */

let currentLang =
    localStorage.getItem(LANGUAGE_STORAGE_KEY) || "en";


/* =========================================================
   PROFILE DATA
========================================================= */

/*
    IMPORTANT:

    No demo profiles are included.

    Profiles will only appear if the current browser/device
    has saved profiles in LocalStorage.

    Expected profile format:

    {
        id: "unique-profile-id",
        name: "User Name",
        email: "user@email.com",
        avatar: "avatar-url",
        notifications: 0
    }
*/

let savedProfiles = loadSavedProfiles();


function loadSavedProfiles() {

    try {

        const saved = localStorage.getItem(
            PROFILE_STORAGE_KEY
        );

        if (!saved) {
            return [];
        }

        const parsed = JSON.parse(saved);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (error) {

        console.error(
            "Failed to load saved profiles:",
            error
        );

        return [];

    }

}


function saveProfiles() {

    localStorage.setItem(
        PROFILE_STORAGE_KEY,
        JSON.stringify(savedProfiles)
    );

}


/* =========================================================
   INITIALIZATION
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        buildLanguageList();

        applyLanguage();

        renderAccounts();

        await loadSupabaseUser();

        setupEvents();

    }
);


/* =========================================================
   SUPABASE CURRENT USER
========================================================= */

async function loadSupabaseUser() {

    if (!supabaseClient) {
        return;
    }

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if (error || !data.user) {
            return;
        }

        const user = data.user;

        const metadata = user.user_metadata || {};

        const userName =
            metadata.full_name ||
            metadata.name ||
            metadata.username ||
            user.email ||
            "User";

        const userEmail =
            user.email || "";

        const avatar =
            metadata.avatar_url ||
            metadata.picture ||
            "";

        /*
            Do not create duplicate profiles.

            Only add current authenticated user
            if they are not already saved.
        */

        const existingProfile = savedProfiles.find(
            profile =>
                profile.email === userEmail
        );

        if (!existingProfile) {

            const currentProfile = {

                id: user.id,

                name: userName,

                email: userEmail,

                avatar: avatar,

                notifications: 0

            };

            savedProfiles.unshift(
                currentProfile
            );

            saveProfiles();

            renderAccounts();

        }

    } catch (error) {

        console.error(
            "Supabase session error:",
            error
        );

    }

}


/* =========================================================
   LANGUAGE LIST
========================================================= */

function buildLanguageList() {

    const langList =
        document.getElementById("langList");

    langList.innerHTML = "";

    languages.forEach(language => {

        const item =
            document.createElement("div");

        item.className = "lang-item";

        item.innerHTML = `

            <span class="lang-name">
                ${language.name}
            </span>

            <input
                type="radio"
                class="lang-radio"
                name="language"
                value="${language.code}"
                ${currentLang === language.code
                    ? "checked"
                    : ""}
            >

        `;

        item.addEventListener(
            "click",
            function () {

                selectLanguage(
                    language.code,
                    language.name
                );

            }
        );

        langList.appendChild(item);

    });

}


/* =========================================================
   SELECT LANGUAGE
========================================================= */

function selectLanguage(
    code,
    name
) {

    currentLang = code;

    localStorage.setItem(
        LANGUAGE_STORAGE_KEY,
        code
    );

    document.getElementById(
        "currentLangText"
    ).textContent = name;

    applyLanguage();

    buildLanguageList();

    closeLanguageModal();

}


/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLanguage() {

    const t =
        translations[currentLang] ||
        translations.en;

    const selectedLanguage =
        languages.find(
            language =>
                language.code === currentLang
        );

    if (selectedLanguage) {

        document.getElementById(
            "currentLangText"
        ).textContent =
            selectedLanguage.name;

    }

    document.getElementById(
        "welcomeSubtitle"
    ).textContent =
        t.welcome;

    document.getElementById(
        "accountsTitle"
    ).textContent =
        t.savedProfiles;

    document.getElementById(
        "btnOther"
    ).textContent =
        t.useOther;

    document.getElementById(
        "btnCreate"
    ).textContent =
        t.createNew;

    document.getElementById(
        "footerTagline"
    ).textContent =
        t.tagline;

    document.getElementById(
        "langModalTitle"
    ).textContent =
        t.selectLanguage;

    document.getElementById(
        "manageTitle"
    ).textContent =
        t.manageProfiles;

    document.getElementById(
        "btnDelete"
    ).textContent =
        t.removeSelected;

    renderAccounts();

}


/* =========================================================
   RENDER SAVED PROFILES
========================================================= */

function renderAccounts() {

    const list =
        document.getElementById(
            "accountsList"
        );

    const count =
        document.getElementById(
            "accountsCount"
        );

    const t =
        translations[currentLang] ||
        translations.en;

    list.innerHTML = "";

    count.textContent =
        savedProfiles.length +
        " " +
        (
            savedProfiles.length === 1
                ? t.profile
                : t.profiles
        );


    /* EMPTY STATE */

    if (savedProfiles.length === 0) {

        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    👤
                </div>

                <div class="empty-title">
                    ${t.noProfiles}
                </div>

                <div class="empty-description">
                    ${t.noProfilesDescription}
                </div>

            </div>

        `;

        return;

    }


    /* PROFILE CARDS */

    savedProfiles.forEach(
        function (profile) {

            const item =
                document.createElement("div");

            item.className =
                "account-item";

            const avatarContent =
                profile.avatar
                    ? `
                        <img
                            src="${escapeHTML(profile.avatar)}"
                            alt=""
                        >
                    `
                    : `
                        ${escapeHTML(
                            getInitial(profile.name)
                        )}
                    `;

            const notificationCount =
                Number(
                    profile.notifications || 0
                );

            item.innerHTML = `

                <div class="acc-avatar">
                    ${avatarContent}
                </div>

                <div class="acc-info">

                    <div class="acc-name">
                        ${escapeHTML(
                            profile.name || "User"
                        )}
                    </div>

                    <div class="acc-email">
                        ${escapeHTML(
                            profile.email || ""
                        )}
                    </div>

                    <div class="acc-status">

                        <span class="acc-dot"></span>

                        ${notificationCount}
                        ${t.notifications}

                    </div>

                </div>

                <div class="acc-chevron">
                    ›
                </div>

            `;


            /* PROFILE CLICK */

            item.addEventListener(
                "click",
                function () {

                    openSavedProfile(
                        profile
                    );

                }
            );


            list.appendChild(item);

        }
    );

}


/* =========================================================
   OPEN SAVED PROFILE
========================================================= */

function openSavedProfile(profile) {

    /*
        Clicking a saved profile opens login.html
        with its email pre-filled.

        login.html should read:

        const params = new URLSearchParams(
            window.location.search
        );

        const email = params.get("email");

    */

    const email =
        profile.email || "";

    const profileId =
        profile.id || "";

    window.location.href =
        "login.html?email=" +
        encodeURIComponent(email) +
        "&profile_id=" +
        encodeURIComponent(profileId);

}


/* =========================================================
   PROFILE MANAGEMENT
========================================================= */

function openSheet() {

    document.getElementById(
        "sheetOverlay"
    ).classList.add("active");

    document.getElementById(
        "bottomSheet"
    ).classList.add("active");

    renderDeleteList();

}


function closeSheet() {

    document.getElementById(
        "sheetOverlay"
    ).classList.remove("active");

    document.getElementById(
        "bottomSheet"
    ).classList.remove("active");

}


/* =========================================================
   DELETE LIST
========================================================= */

function renderDeleteList() {

    const deleteList =
        document.getElementById(
            "deleteList"
        );

    const deleteButton =
        document.getElementById(
            "btnDelete"
        );

    const t =
        translations[currentLang] ||
        translations.en;

    deleteList.innerHTML = "";

    deleteButton.disabled = true;


    if (savedProfiles.length === 0) {

        deleteList.innerHTML = `

            <div class="empty-state">

                <div class="empty-description">
                    ${t.noProfilesFound}
                </div>

            </div>

        `;

        return;

    }


    savedProfiles.forEach(
        function (profile) {

            const label =
                document.createElement("label");

            label.className =
                "del-item";

            const initial =
                getInitial(profile.name);

            label.innerHTML = `

                <input
                    type="checkbox"
                    value="${escapeHTML(profile.id)}"
                >

                <div class="acc-avatar"
                    style="
                        width:40px;
                        height:40px;
                        font-size:16px;
                    "
                >
                    ${escapeHTML(initial)}
                </div>

                <div class="del-item-info">

                    <div class="del-name">
                        ${escapeHTML(
                            profile.name || "User"
                        )}
                    </div>

                    <div class="del-email">
                        ${escapeHTML(
                            profile.email || ""
                        )}
                    </div>

                </div>

            `;


            const checkbox =
                label.querySelector(
                    "input[type=checkbox]"
                );

            checkbox.addEventListener(
                "change",
                checkDeleteButton
            );

            deleteList.appendChild(label);

        }
    );

}


/* =========================================================
   DELETE BUTTON STATE
========================================================= */

function checkDeleteButton() {

    const checked =
        document.querySelectorAll(
            "#deleteList input:checked"
        );

    document.getElementById(
        "btnDelete"
    ).disabled =
        checked.length === 0;

}


/* =========================================================
   DELETE PROFILES
========================================================= */

function deleteSelectedProfiles() {

    const checked =
        document.querySelectorAll(
            "#deleteList input:checked"
        );

    const idsToDelete =
        Array.from(checked).map(
            checkbox =>
                checkbox.value
        );

    if (idsToDelete.length === 0) {
        return;
    }


    const t =
        translations[currentLang] ||
        translations.en;


    /* CONFIRM */

    if (
        !confirm(
            t.confirmDelete
        )
    ) {

        return;

    }


    savedProfiles =
        savedProfiles.filter(
            profile =>
                !idsToDelete.includes(
                    String(profile.id)
                )
        );


    saveProfiles();

    renderAccounts();

    renderDeleteList();

    closeSheet();

    showToast(
        idsToDelete.length === 1
            ? t.profileRemoved
            : t.profilesRemoved
    );

}


/* =========================================================
   LANGUAGE MODAL
========================================================= */

function openLanguageModal() {

    document.getElementById(
        "langModal"
    ).classList.add("active");

}


function closeLanguageModal() {

    document.getElementById(
        "langModal"
    ).classList.remove("active");

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(
        function () {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================================================
   UTILITIES
========================================================= */

function getInitial(name) {

    if (!name) {
        return "U";
    }

    return String(name)
        .trim()
        .charAt(0)
        .toUpperCase();

}


function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   EVENT LISTENERS
========================================================= */

function setupEvents() {


    /* LANGUAGE */

    document.getElementById(
        "languageButton"
    ).addEventListener(
        "click",
        openLanguageModal
    );


    document.getElementById(
        "langClose"
    ).addEventListener(
        "click",
        closeLanguageModal
    );


    document.getElementById(
        "langModal"
    ).addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                document.getElementById(
                    "langModal"
                )
            ) {

                closeLanguageModal();

            }

        }
    );


    /* PROFILE MANAGEMENT */

    document.getElementById(
        "menuButton"
    ).addEventListener(
        "click",
        openSheet
    );


    document.getElementById(
        "sheetClose"
    ).addEventListener(
        "click",
        closeSheet
    );


    document.getElementById(
        "sheetOverlay"
    ).addEventListener(
        "click",
        closeSheet
    );


    document.getElementById(
        "btnDelete"
    ).addEventListener(
        "click",
        deleteSelectedProfiles
    );


    /* ESC KEY */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {

                closeLanguageModal();

                closeSheet();

            }

        }
    );


    /* PROFILE PAGE LINK */

    /*
        Menu can be used to open profile.html.

        You can add this option in your
        profile management page as well.
    */

}


/* =========================================================
   STARTUP
========================================================= */

applyLanguage();
