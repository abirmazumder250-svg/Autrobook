<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #ffffff;
    --card: #ffffff;
    --subtle: #f3f4f6;
    --input-bg: #f8fafc;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
    --accent: #14532d;
    --accent-hover: #166534;
    --accent-soft: rgba(20, 83, 45, 0.1);
    --error: #c62828;
    --success: #14532d;
    --shadow: 0 12px 32px rgba(32, 33, 36, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #202124;
      --card: #202124;
      --subtle: #292a2d;
      --input-bg: #292a2d;
      --text: #ffffff;
      --muted: #9aa0a6;
      --border: #3c4043;
      --accent: #15803d;
      --accent-hover: #166534;
      --accent-soft: rgba(21, 128, 61, 0.2);
      --error: #f87171;
      --success: #4ade80;
      --shadow: 0 16px 38px rgba(0, 0, 0, 0.45);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 22px;
    box-shadow: var(--shadow);
  }

  .brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }

  .logo-badge {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .logo-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.2px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.45;
  }

  .alert {
    display: none;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    text-align: center;
    line-height: 1.4;
  }

  .alert.show.error {
    display: block;
    background: rgba(198, 40, 40, 0.1);
    color: var(--error);
    border: 1px solid var(--error);
  }

  .alert.show.success {
    display: block;
    background: var(--accent-soft);
    color: var(--success);
    border: 1px solid var(--accent);
  }

  .form-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    height: 44px;
    padding: 0 40px 0 13px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: var(--accent);
  }

  .toggle-pass-btn {
    position: absolute;
    right: 8px;
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .captcha-box {
    display: flex;
    justify-content: center;
    margin: 14px 0 12px;
    overflow-x: auto;
  }

  .fp-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--subtle);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    margin-bottom: 14px;
    font-size: 12px;
  }

  .fp-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    color: var(--text);
  }

  .fp-status.verified i {
    color: var(--success);
  }

  .fp-status.locked i,
  .fp-status.locked {
    color: var(--error);
  }

  .fp-verify-btn {
    height: 30px;
    padding: 0 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #ffffff;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }

  .fp-verify-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .fp-verify-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .primary-btn {
    width: 100%;
    height: 45px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #ffffff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.15s ease, transform 0.12s ease;
  }

  .primary-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .primary-btn:active:not(:disabled) {
    transform: scale(0.99);
  }

  .primary-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .step-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }

  .link-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .link-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .link-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .footer-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
  }

  .footer-link:hover {
    color: var(--text);
  }
</style>
</head>
<body>
  <main class="auth-card">
    <div class="brand-header">
      <div class="logo-badge">
        <img src="/logo.png" alt="Autrobook">
      </div>
      <h1>Reset Password</h1>
      <p class="subtitle" id="pageSubtitle">Enter your email to receive a 6-digit verification code</p>
    </div>

    <div id="alertBox" class="alert" role="alert"></div>

    <!-- Step 1: Email + reCAPTCHA + Fingerprint Verify -->
    <section id="step1">
      <div class="form-group">
        <label for="resetEmail">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="captcha-box">
        <div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d"></div>
      </div>

      <div class="fp-box">
        <div class="fp-status" id="fpStatus">
          <i class="fa-solid fa-fingerprint"></i>
          <span id="fpStatusText">Fingerprint ready</span>
        </div>
        <button type="button" id="verifyFpBtn" class="fp-verify-btn">Verify</button>
      </div>

      <button type="button" id="sendOtpBtn" class="primary-btn">
        <i class="fa-regular fa-paper-plane"></i>
        <span>Send OTP Code</span>
      </button>
    </section>

    <!-- Step 2: OTP + New Password -->
    <section id="step2" style="display: none;">
      <div class="form-group">
        <label for="otpCode">6-Digit OTP Code</label>
        <div class="input-wrap">
          <input type="text" id="otpCode" placeholder="Enter OTP from email" inputmode="numeric" maxlength="8" autocomplete="one-time-code">
        </div>
      </div>

      <div class="form-group">
        <label for="newPass">New Password</label>
        <div class="input-wrap">
          <input type="password" id="newPass" placeholder="At least 6 characters" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" data-target="newPass" aria-label="Toggle new password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPass">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPass" placeholder="Re-enter new password" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" data-target="confirmPass" aria-label="Toggle confirm password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="button" id="resetPassBtn" class="primary-btn">
        <i class="fa-solid fa-key"></i>
        <span>Reset Password</span>
      </button>

      <div class="step-actions">
        <button type="button" id="changeEmailBtn" class="link-btn">Change email</button>
        <button type="button" id="resendOtpBtn" class="link-btn">Resend OTP</button>
      </div>
    </section>

    <a href="/login.html" class="footer-link">Back to Login</a>
  </main>

<script>
  const MAX_FP_ATTEMPTS = 6;
  const memoryStore = new Map();

  function safeReadStorage(type, key) {
    try {
      const store = type === 'local' ? window.localStorage : window.sessionStorage;
      if (!store) return memoryStore.get(`${type}:${key}`) || '';
      return store.getItem(key) || '';
    } catch (_) {
      return memoryStore.get(`${type}:${key}`) || '';
    }
  }

  function safeWriteStorage(type, key, value) {
    memoryStore.set(`${type}:${key}`, value);
    try {
      const store = type === 'local' ? window.localStorage : window.sessionStorage;
      if (store) store.setItem(key, value);
    } catch (_) {}
  }

  function safeRemoveStorage(type, key) {
    memoryStore.delete(`${type}:${key}`);
    try {
      const store = type === 'local' ? window.localStorage : window.sessionStorage;
      if (store) store.removeItem(key);
    } catch (_) {}
  }

  const alertBox = document.getElementById('alertBox');
  const subtitleEl = document.getElementById('pageSubtitle');
  const step1El = document.getElementById('step1');
  const step2El = document.getElementById('step2');
  const emailInput = document.getElementById('resetEmail');
  const sendOtpBtn = document.getElementById('sendOtpBtn');
  const resetPassBtn = document.getElementById('resetPassBtn');
  const resendOtpBtn = document.getElementById('resendOtpBtn');
  const changeEmailBtn = document.getElementById('changeEmailBtn');
  const fpStatusEl = document.getElementById('fpStatus');
  const fpStatusTextEl = document.getElementById('fpStatusText');
  const verifyFpBtn = document.getElementById('verifyFpBtn');

  let cachedFingerprint = '';
  let fingerprintVerified = false;
  let isPermanentLocked = false;

  function getLockKey(email) {
    const clean = (email || emailInput.value || safeReadStorage('session', 'autro_reset_email') || 'global').trim().toLowerCase();
    return `autro_fp_locked_${clean}`;
  }

  function getAttemptKey(email) {
    const clean = (email || emailInput.value || safeReadStorage('session', 'autro_reset_email') || 'global').trim().toLowerCase();
    return `autro_fp_attempts_${clean}`;
  }

  function enforcePermanentLock(email = '') {
    isPermanentLocked = true;
    fingerprintVerified = false;
    safeWriteStorage('local', getLockKey(email), '1');
    safeWriteStorage('local', 'autro_fp_locked_global', '1');
    fpStatusEl.classList.remove('verified');
    fpStatusEl.classList.add('locked');
    fpStatusTextEl.textContent = 'ID Locked (6/6 failed) — Permanent';
    verifyFpBtn.textContent = 'Locked';
    verifyFpBtn.disabled = true;
    sendOtpBtn.disabled = true;
    resetPassBtn.disabled = true;
    resendOtpBtn.disabled = true;
    emailInput.disabled = true;
    showAlert('Wrong fingerprint! Failed 6 times. ID is permanently locked and cannot be opened.', 'error');
  }

  function checkIfLocked(email = '') {
    if (
      safeReadStorage('local', getLockKey(email)) === '1' ||
      safeReadStorage('local', 'autro_fp_locked_global') === '1'
    ) {
      enforcePermanentLock(email);
      return true;
    }
    return false;
  }

  function showAlert(message, type = 'error') {
    alertBox.textContent = message;
    alertBox.className = `alert show ${type}`;
  }

  function clearAlert() {
    if (isPermanentLocked) return;
    alertBox.textContent = '';
    alertBox.className = 'alert';
  }

  function setFingerprintUi(verified, labelText) {
    if (isPermanentLocked) return;
    fingerprintVerified = verified;
    fpStatusEl.classList.toggle('verified', verified);
    fpStatusEl.classList.remove('locked');
    fpStatusTextEl.textContent = labelText;
    verifyFpBtn.textContent = verified ? 'Verified' : 'Verify';
  }

  function getWebGlFingerprint() {
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return 'no-webgl';
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const vendor = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
      const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      return `${vendor}|${renderer}`;
    } catch (_) {
      return 'webgl-err';
    }
  }

  function getCanvasFingerprint() {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 220;
      canvas.height = 40;
      const ctx = canvas.getContext('2d');
      if (!ctx) return 'no-canvas';
      ctx.textBaseline = 'top';
      ctx.font = '14px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = '#14532d';
      ctx.fillRect(2, 2, 24, 24);
      ctx.fillStyle = '#202124';
      ctx.fillText('Autrobook.fp.v1', 34, 8);
      return canvas.toDataURL();
    } catch (_) {
      return 'canvas-err';
    }
  }

  async function sha256Hex(input) {
    if (window.crypto && window.crypto.subtle && typeof TextEncoder !== 'undefined') {
      const data = new TextEncoder().encode(input);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }
    let h = 2166136261;
    for (let i = 0; i < input.length; i++) {
      h ^= input.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16);
  }

  async function generateDeviceFingerprint() {
    if (cachedFingerprint) return cachedFingerprint;
    const rawSignals = [
      navigator.userAgent || '',
      navigator.language || '',
      Array.isArray(navigator.languages) ? navigator.languages.join(',') : '',
      String(navigator.hardwareConcurrency || ''),
      String(navigator.deviceMemory || ''),
      `${screen.width}x${screen.height}x${screen.colorDepth}`,
      Intl.DateTimeFormat().resolvedOptions().timeZone || '',
      getWebGlFingerprint(),
      getCanvasFingerprint()
    ].join('||');

    cachedFingerprint = await sha256Hex(rawSignals);
    safeWriteStorage('session', 'autro_device_fp', cachedFingerprint);
    return cachedFingerprint;
  }

  function recordFailedFingerprintAttempt(email = '') {
    const key = getAttemptKey(email);
    const current = Number(safeReadStorage('local', key) || '0') + 1;
    safeWriteStorage('local', key, String(current));

    if (current >= MAX_FP_ATTEMPTS) {
      enforcePermanentLock(email);
      return false;
    }

    setFingerprintUi(false, `Wrong (${current}/${MAX_FP_ATTEMPTS})`);
    showAlert(`Wrong fingerprint! Attempt ${current} of ${MAX_FP_ATTEMPTS}. After 6 attempts, ID will be locked permanently.`, 'error');
    return false;
  }

  async function verifyFingerprint() {
    const email = (emailInput.value || safeReadStorage('session', 'autro_reset_email') || '').trim().toLowerCase();
    if (checkIfLocked(email)) return false;

    verifyFpBtn.disabled = true;
    setFingerprintUi(false, 'Verifying...');

    try {
      const fp = await generateDeviceFingerprint();

      try {
        const res = await fetch('/api/verify-fingerprint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fingerprint: fp, email })
        });
        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          if (data && data.locked) {
            enforcePermanentLock(email);
            return false;
          }
          if (res.ok && data && data.verified === true) {
            safeWriteStorage('local', getAttemptKey(email), '0');
            setFingerprintUi(true, `Matched (${fp.slice(0, 8)})`);
            return true;
          }
          if (res.ok && data && data.verified === false) {
            return recordFailedFingerprintAttempt(email);
          }
        }
      } catch (_) {}

      const registeredFp = safeReadStorage('local', `autro_registered_fp_${email || 'default'}`) || safeReadStorage('local', 'autro_registered_fp_default');
      if (!registeredFp) {
        safeWriteStorage('local', `autro_registered_fp_${email || 'default'}`, fp);
        safeWriteStorage('local', 'autro_registered_fp_default', fp);
        safeWriteStorage('local', getAttemptKey(email), '0');
        setFingerprintUi(true, `Matched (${fp.slice(0, 8)})`);
        return true;
      }

      if (registeredFp === fp) {
        safeWriteStorage('local', getAttemptKey(email), '0');
        setFingerprintUi(true, `Matched (${fp.slice(0, 8)})`);
        return true;
      }

      return recordFailedFingerprintAttempt(email);
    } finally {
      if (!isPermanentLocked) {
        verifyFpBtn.disabled = false;
      }
    }
  }

  document.querySelectorAll('.toggle-pass-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.getAttribute('data-target'));
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = `<i class="fa-regular ${isPassword ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
    });
  });

  async function requestOtp(isResend = false) {
    const email = (emailInput.value || '').trim().toLowerCase();
    if (checkIfLocked(email)) return;

    clearAlert();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert('Please enter a valid email address.', 'error');
      return;
    }

    const fpOk = await verifyFingerprint();
    if (!fpOk) return;

    let captchaToken = '';
    if (!isResend) {
      if (typeof grecaptcha === 'undefined') {
        showAlert('reCAPTCHA is still loading. Please wait a moment and try again.', 'error');
        return;
      }
      captchaToken = grecaptcha.getResponse();
      if (!captchaToken) {
        showAlert('Please complete the reCAPTCHA verification.', 'error');
        return;
      }
    }

    sendOtpBtn.disabled = true;
    if (resendOtpBtn) resendOtpBtn.disabled = true;

    try {
      const response = await fetch('/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          purpose: 'reset-password',
          recaptchaToken: captchaToken,
          fingerprint: cachedFingerprint,
          fingerprintVerified
        })
      });

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : {};

      if (!response.ok || payload.ok === false) {
        throw new Error(payload.error || payload.message || 'Unable to send OTP email. Check server mail settings.');
      }

      safeWriteStorage('session', 'autro_reset_email', email);
      safeWriteStorage('local', 'autro_reset_email', email);

      step1El.style.display = 'none';
      step2El.style.display = 'block';
      subtitleEl.textContent = `OTP sent to ${email}. Enter the code and set a new password.`;
      showAlert('Verification code sent to your email address.', 'success');
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
    } catch (err) {
      showAlert(err.message || 'Failed to send OTP email.', 'error');
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
    } finally {
      if (!isPermanentLocked) {
        sendOtpBtn.disabled = false;
        if (resendOtpBtn) resendOtpBtn.disabled = false;
      }
    }
  }

  async function handleResetPassword() {
    const email = (
      safeReadStorage('session', 'autro_reset_email') ||
      safeReadStorage('local', 'autro_reset_email') ||
      emailInput.value ||
      ''
    ).trim().toLowerCase();

    if (checkIfLocked(email)) return;

    clearAlert();

    const fpOk = await verifyFingerprint();
    if (!fpOk) return;

    const otp = (document.getElementById('otpCode').value || '').trim();
    const newPassword = document.getElementById('newPass').value || '';
    const confirmPassword = document.getElementById('confirmPass').value || '';

    if (!email) {
      showAlert('Email is missing. Please go back and request an OTP.', 'error');
      return;
    }
    if (!otp || otp.length < 4) {
      showAlert('Please enter the OTP code sent to your email.', 'error');
      return;
    }
    if (newPassword.length < 6) {
      showAlert('New password must be at least 6 characters long.', 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      showAlert('Passwords do not match.', 'error');
      return;
    }

    resetPassBtn.disabled = true;

    try {
      const response = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          otp,
          newPassword,
          fingerprint: cachedFingerprint,
          fingerprintVerified
        })
      });

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : {};

      if (!response.ok || payload.ok === false) {
        throw new Error(payload.error || payload.message || 'Invalid OTP or unable to reset password.');
      }

      safeRemoveStorage('session', 'autro_reset_email');
      showAlert('Password reset successful. Redirecting to login...', 'success');
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 1200);
    } catch (err) {
      showAlert(err.message || 'Password reset failed.', 'error');
    } finally {
      if (!isPermanentLocked) {
        resetPassBtn.disabled = false;
      }
    }
  }

  verifyFpBtn.addEventListener('click', () => {
    clearAlert();
    verifyFingerprint();
  });
  sendOtpBtn.addEventListener('click', () => requestOtp(false));
  resetPassBtn.addEventListener('click', handleResetPassword);
  resendOtpBtn.addEventListener('click', () => requestOtp(true));
  changeEmailBtn.addEventListener('click', () => {
    if (isPermanentLocked) return;
    clearAlert();
    step2El.style.display = 'none';
    step1El.style.display = 'block';
    subtitleEl.textContent = 'Enter your email to receive a 6-digit verification code';
  });

  generateDeviceFingerprint();
  checkIfLocked('');
</script>
</body>
</html>
