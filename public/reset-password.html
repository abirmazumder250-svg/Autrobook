<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Reset Password - Autrobook</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFFFF;
    --surface: #F8F9FA;
    --card: #FFFFFF;
    --subtle: #F1F3F4;
    --input-bg: #FFFFFF;
    --text: #202124;
    --muted: #5F6368;
    --border: rgba(32, 33, 36, 0.14);

    --primary: #202124;
    --primary-hover: #3C4043;
    --accent: #0F5132;
    --accent-hover: #0B3D26;
    --accent-bright: #198754;
    --accent-soft: rgba(15, 81, 50, 0.10);
    --shadow-btn: 0 8px 22px rgba(15, 81, 50, 0.24);

    --error: #DC2626;
    --warn: #D97706;
    --success: #0F5132;
    --shadow: 0 12px 32px rgba(32, 33, 36, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #292A2D;
      --card: #202124;
      --subtle: #292A2D;
      --input-bg: #292A2D;
      --text: #FFFFFF;
      --muted: #BDC1C6;
      --border: rgba(255, 255, 255, 0.16);

      --primary: #FFFFFF;
      --primary-hover: #E8EAED;
      --accent: #0F5132;
      --accent-hover: #146C43;
      --accent-bright: #198754;
      --accent-soft: rgba(25, 135, 84, 0.18);
      --shadow-btn: 0 8px 22px rgba(0, 0, 0, 0.35);

      --error: #F87171;
      --warn: #FBBF24;
      --success: #4ADE80;
      --shadow: 0 16px 38px rgba(0, 0, 0, 0.45);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: rgba(15, 81, 50, 0.16);
    -webkit-font-smoothing: antialiased;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background-color: var(--bg);
    background-image: none;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      18px
      calc(env(safe-area-inset-bottom, 0px) + 24px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  body.page-exit {
    opacity: 0;
    transform: translateY(6px);
  }

  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes stepSlideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes logoPulseRing {
    0% {
      transform: scale(1);
      opacity: 0.75;
    }
    100% {
      transform: scale(1.42);
      opacity: 0;
    }
  }

  @keyframes logoFloatGlow {
    0%, 100% {
      transform: translateY(0px);
      box-shadow:
        0 10px 24px rgba(32, 33, 36, 0.08),
        0 0 0 3px rgba(15, 81, 50, 0.14),
        0 8px 24px rgba(15, 81, 50, 0.22);
    }
    50% {
      transform: translateY(-3px);
      box-shadow:
        0 14px 28px rgba(32, 33, 36, 0.12),
        0 0 0 5px rgba(15, 81, 50, 0.22),
        0 12px 30px rgba(15, 81, 50, 0.34);
    }
  }

  @keyframes shakeError {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .auth-wrap {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }

  .top-logo {
    position: relative;
    width: 66px;
    height: 66px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .top-logo::before,
  .top-logo::after {
    content: '';
    position: absolute;
    width: 66px;
    height: 66px;
    border-radius: 20px;
    border: 2px solid rgba(15, 81, 50, 0.45);
    pointer-events: none;
    animation: logoPulseRing 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }

  .top-logo::after {
    animation-delay: 1.4s;
  }

  @media (prefers-color-scheme: dark) {
    .top-logo::before,
    .top-logo::after {
      border-color: rgba(25, 135, 84, 0.50);
    }
  }

  .logo-badge {
    position: relative;
    z-index: 2;
    width: 66px;
    height: 66px;
    border-radius: 20px;
    border: 1.5px solid rgba(15, 81, 50, 0.35);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: logoFloatGlow 3.2s ease-in-out infinite;
  }

  .logo-badge img {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    object-fit: cover;
    display: block;
  }

  h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 5px;
    color: var(--text);
  }

  .subtitle {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 320px;
  }

  .security-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .security-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
  }

  .security-chip i {
    color: var(--accent-bright);
  }

  .alert {
    display: none;
    padding: 11px 13px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    text-align: center;
    line-height: 1.45;
    word-break: break-word;
  }

  .alert.shake {
    animation: shakeError 0.36s ease;
  }

  .alert.show.error {
    display: block;
    background: rgba(220, 38, 38, 0.10);
    color: var(--error);
    border: 1px solid rgba(220, 38, 38, 0.38);
  }

  .alert.show.success {
    display: block;
    background: var(--accent-soft);
    color: var(--success);
    border: 1px solid rgba(25, 135, 84, 0.35);
  }

  .step-panel {
    animation: stepSlideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .form-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
    transition: color 0.2s ease;
  }

  .form-group:focus-within label {
    color: var(--accent-bright);
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    height: 46px;
    padding: 0 42px 0 14px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }

  input:focus {
    border-color: var(--accent-bright);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .toggle-pass-btn {
    position: absolute;
    right: 8px;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  [dir="rtl"] input {
    padding: 0 14px 0 42px;
  }

  [dir="rtl"] .toggle-pass-btn {
    right: auto;
    left: 8px;
  }

  .toggle-pass-btn:hover {
    color: var(--text);
    background: var(--surface);
  }

  .strength-box {
    margin-top: 7px;
  }

  .strength-track {
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 5px;
  }

  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--error);
    transition: width 0.25s ease, background-color 0.25s ease;
  }

  .strength-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
  }

  .passkey-btn {
    width: 100%;
    height: 46px;
    border-radius: 999px;
    border: 1.5px dashed var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  .passkey-btn:hover:not(:disabled) {
    border-color: var(--accent-bright);
    background: var(--subtle);
    transform: translateY(-1px);
  }

  .passkey-btn:active:not(:disabled) {
    transform: scale(0.99);
  }

  .passkey-btn.verified {
    border-style: solid;
    border-color: var(--accent-bright);
    background: var(--accent-soft);
    color: var(--success);
  }

  .passkey-btn.locked {
    border-style: solid;
    border-color: var(--error);
    color: var(--error);
  }

  .passkey-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .backup-recovery-panel {
    margin-bottom: 12px;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: none;
    flex-direction: column;
    gap: 10px;
  }

  .backup-recovery-panel.active {
    display: flex;
  }

  .backup-recovery-input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-family: monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    outline: none;
  }

  .backup-recovery-input:focus {
    border-color: var(--accent-bright);
  }

  .backup-recovery-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-items: stretch;
  }

  .backup-recovery-btn {
    min-height: 44px;
    padding: 6px 12px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.25;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: background-color 0.2s ease, transform 0.15s ease;
  }

  .backup-recovery-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .backup-recovery-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .backup-generate-btn {
    min-height: 44px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1.5px solid rgba(25, 135, 84, 0.35);
    background: var(--accent-soft);
    color: var(--accent-bright);
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.25;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }

  .backup-generate-btn:hover:not(:disabled) {
    border-color: var(--accent-bright);
    background: rgba(25, 135, 84, 0.24);
  }

  .backup-generate-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .one-time-backup-card {
    margin-bottom: 14px;
    padding: 13px 14px;
    border-radius: 16px;
    border: 1.5px solid var(--accent-bright);
    background: var(--accent-soft);
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .one-time-backup-card.show {
    display: flex;
  }

  .one-time-backup-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--success);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .one-time-backup-desc {
    font-size: 12px;
    color: var(--text);
    line-height: 1.45;
  }

  .one-time-backup-code {
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--card);
    border: 1px dashed var(--accent-bright);
    font-family: monospace;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    color: var(--text);
    user-select: all;
  }

  .one-time-backup-actions {
    display: flex;
    gap: 8px;
  }

  .one-time-backup-btn {
    flex: 1;
    height: 36px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .one-time-backup-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }

  .captcha-box {
    display: flex;
    justify-content: center;
    margin: 12px 0 14px;
    overflow-x: auto;
    min-height: 76px;
  }

  .primary-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #FFFFFF;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: var(--shadow-btn);
    transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }

  .primary-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .primary-btn:active:not(:disabled) {
    transform: scale(0.98);
  }

  .primary-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    box-shadow: none;
  }

  .step-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
  }

  .link-btn {
    flex: 1;
    height: 38px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  }

  .link-btn:hover:not(:disabled) {
    border-color: var(--accent-bright);
    color: var(--accent-bright);
    background: var(--subtle);
  }

  .link-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .footer-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .footer-link:hover {
    color: var(--text);
  }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="brand-header">
      <div class="top-logo">
        <div class="logo-badge">
          <img src="/logo.png" alt="Autrobook">
        </div>
      </div>
      <h1 id="pageTitle">Reset Password</h1>
      <p class="subtitle" id="pageSubtitle">Complete passkey and reCAPTCHA verification to receive a 6-digit OTP</p>
    </div>

    <div class="security-strip">
      <span class="security-chip"><i class="fa-solid fa-shield-halved"></i> <span id="chipPasskey">Passkey Protected</span></span>
      <span class="security-chip"><i class="fa-solid fa-envelope-circle-check"></i> <span id="chipOtp">6-Digit OTP</span></span>
      <span class="security-chip"><i class="fa-solid fa-lock"></i> <span id="chipPolicy">Strong Policy</span></span>
    </div>

    <div id="alertBox" class="alert" role="alert"></div>

    <!-- Shown once when a single-use backup code is generated or after password reset -->
    <div id="oneTimeBackupCard" class="one-time-backup-card" role="region" aria-live="polite">
      <div class="one-time-backup-title">
        <i class="fa-solid fa-key"></i>
        <span id="oneTimeBackupTitle">One-Time Backup Recovery Code</span>
      </div>
      <p class="one-time-backup-desc" id="oneTimeBackupDesc">
        Save this code now. It is shown only once and expires after a single recovery use.
      </p>
      <div id="oneTimeBackupCodeValue" class="one-time-backup-code"></div>
      <div class="one-time-backup-actions">
        <button type="button" id="copyBackupCodeBtn" class="one-time-backup-btn">
          <i class="fa-regular fa-copy"></i> <span id="copyBackupCodeText">Copy Code</span>
        </button>
        <button type="button" id="continueToLoginBtn" class="one-time-backup-btn primary">
          <span id="continueToLoginText">Continue to Login</span>
        </button>
      </div>
    </div>

    <!-- Step 1: Email + Passkey + Backup Code + reCAPTCHA -->
    <section id="step1" class="step-panel">
      <div class="form-group">
        <label for="resetEmail" id="emailLabel">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" maxlength="160" required>
        </div>
      </div>

      <button type="button" id="passkeyBtn" class="passkey-btn">
        <i class="fa-solid fa-fingerprint"></i>
        <span id="passkeyBtnText">Verify with Passkey</span>
      </button>

      <button type="button" id="backupRecoveryToggleBtn" class="passkey-btn">
        <i class="fa-solid fa-key"></i>
        <span id="backupRecoveryToggleText">Use Backup Recovery Code</span>
      </button>

      <div id="backupRecoveryPanel" class="backup-recovery-panel">
        <input type="text" id="backupRecoveryInput" class="backup-recovery-input" placeholder="XXXX-XXXX" maxlength="16" autocomplete="off">
        <div class="backup-recovery-btn-row">
          <button type="button" id="backupRecoveryVerifyBtn" class="backup-recovery-btn">Verify Backup Code</button>
          <button type="button" id="backupGenerateBtn" class="backup-generate-btn">+ Generate Backup Code</button>
        </div>
      </div>

      <div class="captcha-box">
        <div class="g-recaptcha" data-sitekey="6LdCfi8uAAAAAAmPBt26_S6gNd8Wgkv2zJd2YUPp"></div>
      </div>

      <button type="button" id="sendOtpBtn" class="primary-btn">
        <i class="fa-regular fa-paper-plane"></i>
        <span id="sendOtpBtnText">Send OTP Code</span>
      </button>
    </section>

    <!-- Step 2: OTP + Strong New Password -->
    <section id="step2" class="step-panel" style="display: none;">
      <div class="form-group">
        <label for="otpCode" id="otpLabel">6-Digit OTP Code</label>
        <div class="input-wrap">
          <input type="text" id="otpCode" placeholder="Enter 6-digit OTP from email" inputmode="numeric" maxlength="6" autocomplete="one-time-code" oninput="this.value = this.value.replace(/\D/g, '').slice(0, 6)">
        </div>
      </div>

      <div class="form-group">
        <label for="newPass" id="newPassLabel">New Password</label>
        <div class="input-wrap">
          <input type="password" id="newPass" placeholder="Min 8 chars, upper, lower &amp; number/symbol" autocomplete="new-password" maxlength="128" oninput="updateNewPasswordStrength()">
          <button type="button" class="toggle-pass-btn" data-target="newPass" aria-label="Toggle new password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="strength-box">
          <div class="strength-track">
            <div class="strength-fill" id="passStrengthFill"></div>
          </div>
          <div class="strength-meta">
            <span id="passStrengthText">Strength: None</span>
            <span id="passCooldownText"></span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPass" id="confirmPassLabel">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPass" placeholder="Re-enter new password" autocomplete="new-password" maxlength="128">
          <button type="button" class="toggle-pass-btn" data-target="confirmPass" aria-label="Toggle confirm password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

  function isSecureWebAuthnOrigin() {

    const h = window.location.hostname;

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(String(text || '').trim().toUpperCase());
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer))
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function generateOneTimeBackupCode() {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const bytes = new Uint8Array(8);
    crypto.getRandomValues(bytes);
    let left = '';
    let right = '';
    for (let i = 0; i < 4; i++) {
      left += alphabet[bytes[i] % alphabet.length];
      right += alphabet[bytes[i + 4] % alphabet.length];
    }
    return `${left}-${right}`;
  }

  async function resolveUserIdByEmail(email) {
    const clean = normalizeEmail(email);
    if (!clean || !supabaseResetClient) return '';
    try {
      const { data } = await supabaseResetClient
        .from('profiles')
        .select('id')
        .eq('email', clean)
        .maybeSingle();
      return data?.id || '';
    } catch (_) {
      return '';
    }
  }

  async function verifyAndConsumeBackupCode(userId, plainCode) {
    const normalized = String(plainCode || '').trim().toUpperCase();
    if (!normalized) {
      return { valid: false, codeId: '', message: 'Invalid or already used backup code.' };
    }

    const codeHash = await sha256Hex(normalized);

    if (userId && supabaseResetClient) {
      try {
        const { data: matchRow, error: selErr } = await supabaseResetClient
          .from('backup_codes')
          .select('id')
          .eq('user_id', userId)
          .eq('code_hash', codeHash)
          .eq('used', false)
          .maybeSingle();

        if (selErr || !matchRow) {
          return { valid: false, codeId: '', message: 'Invalid or already used backup code.' };
        }

        const { error: updErr } = await supabaseResetClient
          .from('backup_codes')
          .update({ used: true, used_at: new Date().toISOString() })
          .eq('id', matchRow.id)
          .eq('used', false);

        if (updErr) {
          return { valid: false, codeId: '', message: 'Could not consume single-use backup code.' };
        }

        return { valid: true, codeId: matchRow.id, message: 'Single-use backup recovery code verified.' };
      } catch (_) {
        return { valid: false, codeId: '', message: 'Invalid or already used backup code.' };
      }
    }

    return { valid: false, codeId: '', message: 'Invalid or already used backup code.' };
  }

  async function issueSingleUseBackupCode(userId, email) {
    const plainCode = generateOneTimeBackupCode();
    const codeHash = await sha256Hex(plainCode);

    if (userId && supabaseResetClient) {
      const { error } = await supabaseResetClient
        .from('backup_codes')
        .insert({
          user_id: userId,
          email: normalizeEmail(email),
          code_hash: codeHash,
          used: false,
          created_at: new Date().toISOString()
        });
      if (error) {
        return { ok: false, code: '' };
      }
    }

    return { ok: true, code: plainCode };
  }

  function enforceEmailLock(email = '') {
    const dict = getUiDict();
    const targetEmail = normalizeEmail(email) || getActiveEmail();
    isEmailLocked = true;
    passkeyVerified = false;
    passkeyCredentialId = '';
    backupCodeVerified = false;
    backupCodeConsumedId = '';

    if (targetEmail) {
      const existingUntil = Number(safeReadStorage('local', getLockUntilKey(targetEmail)) || '0');
      const lockUntil = existingUntil > Date.now() ? existingUntil : Date.now() + LOCK_DURATION_MS;
      safeWriteStorage('local', getLockUntilKey(targetEmail), String(lockUntil));
    }

    passkeyBtn.classList.remove('verified');
    passkeyBtn.classList.add('locked');
    passkeyBtn.disabled = true;
    passkeyBtnText.textContent = formatStr(dict.securityLockBtn, { max: MAX_PASSKEY_ATTEMPTS });

    if (backupRecoveryVerifyBtn) backupRecoveryVerifyBtn.disabled = true;
    if (backupGenerateBtn) backupGenerateBtn.disabled = true;
    sendOtpBtn.disabled = true;
    resetPassBtn.disabled = true;
    resendOtpBtn.disabled = true;
    showAlert(dict.errLocked, 'error');
  }

    isEmailLocked = false;
    passkeyBtn.classList.remove('locked');
    passkeyBtn.disabled = false;
    if (backupRecoveryVerifyBtn) backupRecoveryVerifyBtn.disabled = false;
    if (backupGenerateBtn && !isGeneratingBackup) backupGenerateBtn.disabled = false;
    if (!passkeyVerified) {
      passkeyBtnText.textContent = dict.verifyPasskey;
    }
    if (!isSendingOtp) sendOtpBtn.disabled = false;
    if (!isResettingPass) resetPassBtn.disabled = false;
    if (resendRemaining <= 0) resendOtpBtn.disabled = false;
  }

  function checkIfLocked(email = '') {
    const clean = normalizeEmail(email) || getActiveEmail();
    if (!clean) {
      releaseLockUiIfUnlocked();
      return false;
    }
    const lockUntil = Number(safeReadStorage('local', getLockUntilKey(clean)) || '0');
    if (lockUntil > Date.now()) {
      enforceEmailLock(clean);
      return true;
    }
    if (lockUntil > 0) {
      safeRemoveStorage('local', getLockUntilKey(clean));
      safeWriteStorage('local', getAttemptKey(clean), '0');
      safeWriteStorage('local', getBackupAttemptKey(clean), '0');
    }
    releaseLockUiIfUnlocked();
    return false;
  }

  function recordFailedPasskeyAttempt(email = '', reason = '') {
    const dict = getUiDict();
    const clean = normalizeEmail(email) || getActiveEmail();
    const key = getAttemptKey(clean);
    const current = Number(safeReadStorage('local', key) || '0') + 1;
    safeWriteStorage('local', key, String(current));

    if (current >= MAX_PASSKEY_ATTEMPTS) {
      enforceEmailLock(clean);
      return false;

    setPasskeyUi(false, formatStr(dict.passkeyFailedBtn, { current, max: MAX_PASSKEY_ATTEMPTS }));
    const detail = reason ? ` (${reason})` : '';
    showAlert(formatStr(dict.errPasskeyAttempt, { detail, current, max: MAX_PASSKEY_ATTEMPTS }), 'error');
    return false;
  }

  function recordFailedBackupAttempt(email = '') {
    const dict = getUiDict();
    const clean = normalizeEmail(email) || getActiveEmail();
    const key = getBackupAttemptKey(clean);
    const current = Number(safeReadStorage('local', key) || '0') + 1;
    safeWriteStorage('local', key, String(current));

    if (current >= MAX_BACKUP_ATTEMPTS) {
      enforceEmailLock(clean);
      return false;
    }

    showAlert(formatStr(dict.errBackupAttempt, { current, max: MAX_BACKUP_ATTEMPTS }), 'error');
    return false;
  }

  function bytesToHex(buffer) {
    return Array.from(new Uint8Array(buffer))
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function hexToBytes(hex) {
    const clean = String(hex || '').replace(/[^0-9a-fA-F]/g, '');
    const out = new Uint8Array(clean.length / 2);
    for (let i = 0; i < out.length; i++) {
      out[i] = parseInt(clean.slice(i * 2, i * 2 + 2), 16);
    }
    return out;
  }

  function startResendCooldown() {
    resendRemaining = RESEND_COOLDOWN_SEC;
    if (resendTimer) clearInterval(resendTimer);

    const tick = () => {
      const dict = getUiDict();
      if (isEmailLocked) {
        clearInterval(resendTimer);
        return;
      }
      if (resendRemaining > 0) {
        resendOtpBtn.disabled = true;
        const label = formatStr(dict.resendIn, { sec: resendRemaining });
        resendOtpBtn.textContent = label;
        cooldownTextEl.textContent = label;
        resendRemaining--;
      } else {
        clearInterval(resendTimer);
        resendTimer = null;
        resendOtpBtn.disabled = false;
        resendOtpBtn.textContent = dict.resendOtp;
        cooldownTextEl.textContent = '';
      }
    };

    tick();
    resendTimer = setInterval(tick, 1000);
  }

  function evaluatePasswordPolicy(pw) {
    const hasLength = pw.length >= 8;
    const hasLower = /[a-z]/.test(pw);
    const hasUpper = /[A-Z]/.test(pw);
    const hasNumberOrSymbol = /[\d\W_]/.test(pw);
    return {
      hasLength,
      hasLower,
      hasUpper,
      hasNumberOrSymbol,
      isStrongEnough: hasLength && hasLower && hasUpper && hasNumberOrSymbol
    };
  }

  function updateNewPasswordStrength() {
    const dict = getUiDict();
    const pw = document.getElementById('newPass').value || '';
    const fill = document.getElementById('passStrengthFill');
    const text = document.getElementById('passStrengthText');
    if (!fill || !text) return;

    const policy = evaluatePasswordPolicy(pw);
    const score = [
      policy.hasLength,
      policy.hasLower,
      policy.hasUpper,
      policy.hasNumberOrSymbol
    ].filter(Boolean).length;

    if (!pw) {
      fill.style.width = '0%';
      fill.style.background = 'var(--error)';
      text.textContent = dict.strengthNone;
    } else if (score <= 1) {
      fill.style.width = '25%';
      fill.style.background = 'var(--error)';
      text.textContent = dict.strengthWeak;
    } else if (score <= 3) {
      fill.style.width = '65%';
      fill.style.background = 'var(--warn)';
      text.textContent = dict.strengthFair;
    } else {
      fill.style.width = '100%';
      fill.style.background = 'var(--success)';
      text.textContent = dict.strengthStrong;
    }
  }

  async function verifyPasskey() {
    const dict = getUiDict();
    const email = normalizeEmail(emailInput.value) || getActiveEmail();
    if (checkIfLocked(email)) return false;

    clearAlert();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert(dict.errInvalidEmailPasskey, 'error');
      return false;
    }

    if (!isSecureWebAuthnOrigin()) {
      return recordFailedPasskeyAttempt(email, dict.errInsecureOrigin);
    }

    if (
      typeof window.PublicKeyCredential === 'undefined' ||
      !navigator.credentials ||
      !navigator.credentials.create ||
      !navigator.credentials.get
    ) {
      return recordFailedPasskeyAttempt(email, dict.errWebAuthnUnavailable);
    }

    passkeyBtn.disabled = true;
    setPasskeyUi(false, dict.openingPasskey);

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);
      const rpId = window.location.hostname || 'localhost';

      const storedCredId = safeReadStorage('local', getPasskeyIdKey(email));
      let credential = null;

      if (storedCredId) {
        const allowCredentials = [{
          type: 'public-key',
          id: hexToBytes(storedCredId),
          transports: ['internal', 'hybrid']
        }];

        credential = await navigator.credentials.get({
          publicKey: {
            challenge,
            rpId,
            allowCredentials,
            userVerification: 'required',
            timeout: 30000
          }
        });
      } else {
        const userId = new TextEncoder().encode(email);
        credential = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: {
              name: 'Autrobook',
              id: rpId
            },
            user: {
              id: userId,
              name: email,
              displayName: email.split('@')[0] || 'User'
            },
            pubKeyCredParams: [
              { type: 'public-key', alg: -7 },
              { type: 'public-key', alg: -257 }
            ],
            authenticatorSelection: {
              authenticatorAttachment: 'platform',
              residentKey: 'preferred',
              userVerification: 'required'
            },
            timeout: 30000
          }
        });

        if (credential && credential.rawId) {
          safeWriteStorage('local', getPasskeyIdKey(email), bytesToHex(credential.rawId));
        }
      }

      if (!credential || !credential.rawId) {
        return recordFailedPasskeyAttempt(email, dict.errNoCredential);
      }

      passkeyCredentialId = bytesToHex(credential.rawId);
      safeWriteStorage('local', getAttemptKey(email), '0');
      setPasskeyUi(true, dict.passkeyVerified);
      showAlert(dict.okPasskeyVerified, 'success');
      return true;
    } catch (err) {
      const reason = err && err.name ? err.name : dict.errCancelled;
      return recordFailedPasskeyAttempt(email, reason);
    } finally {
      if (!isEmailLocked) {
        passkeyBtn.disabled = false;
      }
    }
  }

  async function verifyBackupCodeStep() {
    const dict = getUiDict();
    const email = normalizeEmail(emailInput.value) || getActiveEmail();
    if (checkIfLocked(email)) return false;

    clearAlert();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert(dict.errInvalidEmail, 'error');
      return false;
    }

    const codeVal = String(backupRecoveryInput?.value || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(codeVal)) {
      showAlert(dict.errInvalidBackupFormat, 'error');
      return false;
    }

    backupRecoveryVerifyBtn.disabled = true;
    if (backupGenerateBtn) backupGenerateBtn.disabled = true;
    const userId = await resolveUserIdByEmail(email);
    const res = await verifyAndConsumeBackupCode(userId, codeVal);
    backupRecoveryVerifyBtn.disabled = false;
    if (backupGenerateBtn && !isEmailLocked) backupGenerateBtn.disabled = false;

    if (!res.valid) {
      backupCodeVerified = false;
      backupCodeConsumedId = '';
      return recordFailedBackupAttempt(email);
    }

    backupCodeVerified = true;
    backupCodeConsumedId = res.codeId || '';
    safeWriteStorage('local', getBackupAttemptKey(email), '0');
    backupRecoveryToggleBtn.classList.add('verified');
    backupRecoveryToggleText.textContent = dict.backupRecoveryVerified;
    if (backupRecoveryInput) backupRecoveryInput.value = '';
    if (backupRecoveryPanel) backupRecoveryPanel.classList.remove('active');
    showAlert(res.message, 'success');
    return true;
  }

  async function generateBackupCodeStep() {
    if (isGeneratingBackup) return;
    const dict = getUiDict();
    const email = normalizeEmail(emailInput.value) || getActiveEmail();
    if (checkIfLocked(email)) return;

    clearAlert();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert(dict.errInvalidEmail, 'error');
      return;
    }

    isGeneratingBackup = true;
    if (backupGenerateBtn) {
      backupGenerateBtn.disabled = true;
      backupGenerateBtn.textContent = dict.generatingBackupCode;
    }
    if (backupRecoveryVerifyBtn) backupRecoveryVerifyBtn.disabled = true;

    try {
      const userId = await resolveUserIdByEmail(email);
      const created = await issueSingleUseBackupCode(userId, email);
      if (!created.ok || !created.code) {
        showAlert(dict.errGenerateBackupFail, 'error');
        return;
      }
      showOneTimeBackupCode(created.code, dict.okBackupCodeGenerated);
    } catch (_) {
      showAlert(dict.errGenerateBackupFail, 'error');
    } finally {
      isGeneratingBackup = false;
      if (backupGenerateBtn) {
        backupGenerateBtn.textContent = dict.backupGenerateBtn;
        if (!isEmailLocked) backupGenerateBtn.disabled = false;
      }
      if (backupRecoveryVerifyBtn && !isEmailLocked) {
        backupRecoveryVerifyBtn.disabled = false;
      }
    }
  }

  document.querySelectorAll('.toggle-pass-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.getAttribute('data-target'));
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = `<i class="fa-regular ${isPassword ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
    });
  });

  async function requestOtp(isResend = false) {
    if (isSendingOtp) return;
    const dict = getUiDict();
    const email = normalizeEmail(emailInput.value) || getActiveEmail();
    if (checkIfLocked(email)) return;

    clearAlert();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert(dict.errInvalidEmail, 'error');
      return;
    }

    if (!passkeyVerified && !backupCodeVerified) {
      const ok = await verifyPasskey();
      if (!ok && !backupCodeVerified) return;
    }

    let captchaToken = '';
    if (!isResend) {
      if (typeof grecaptcha === 'undefined') {
        showAlert(dict.errCaptchaLoading, 'error');
        return;
      }
      captchaToken = grecaptcha.getResponse();
      if (!captchaToken) {
        showAlert(dict.errCaptchaRequired, 'error');
        return;
      }
    }

    isSendingOtp = true;
    sendOtpBtn.disabled = true;
    sendOtpBtnText.textContent = dict.sendingOtp;
    if (resendOtpBtn) resendOtpBtn.disabled = true;

    try {
      const response = await fetch('/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          purpose: 'reset-password',
          isResend,
          token: captchaToken,
          recaptchaToken: captchaToken,
          passkeyVerified,
          passkeyCredentialId,
          backupCodeVerified,
          backupCodeConsumedId
        })
      });

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : {};

      if (!response.ok || payload.ok === false || payload.success === false) {
        throw new Error(payload.error || payload.message || dict.errSendOtpDefault);
      }

      otpFailedAttempts = 0;
      safeWriteStorage('session', 'autro_reset_email', email);

      step1El.style.display = 'none';
      step2El.style.display = 'block';
      document.getElementById('otpCode').focus();
      subtitleEl.textContent = formatStr(dict.otpSentSubtitle, { email });
      showAlert(dict.okOtpSent, 'success');
      startResendCooldown();
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
    } catch (err) {
      showAlert(err.message || dict.errSendOtpFail, 'error');
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
    } finally {
      isSendingOtp = false;
      sendOtpBtnText.textContent = dict.sendOtp;
      if (!isEmailLocked) {
        sendOtpBtn.disabled = false;
        if (resendOtpBtn && resendRemaining <= 0) {
          resendOtpBtn.disabled = false;
        }
      }
    }
  }

  async function handleResetPassword() {
    if (isResettingPass) return;
    const dict = getUiDict();
    const email = getActiveEmail();
    if (checkIfLocked(email)) return;

    clearAlert();

    if (!passkeyVerified && !backupCodeVerified) {
      const ok = await verifyPasskey();
      if (!ok && !backupCodeVerified) return;
    }

    const otp = (document.getElementById('otpCode').value || '').trim();
    const newPassword = document.getElementById('newPass').value || '';
    const confirmPassword = document.getElementById('confirmPass').value || '';

    if (!email) {
      showAlert(dict.errMissingEmail, 'error');
      return;
    }
    if (!/^\d{6}$/.test(otp)) {
      showAlert(dict.errInvalidOtp, 'error');
      return;
    }

    const policy = evaluatePasswordPolicy(newPassword);
    if (!policy.isStrongEnough) {
      showAlert(dict.errWeakPassword, 'error');
      return;
    }

    if (newPassword !== confirmPassword) {
      showAlert(dict.errPasswordMismatch, 'error');
      return;
    }

    isResettingPass = true;
    resetPassBtn.disabled = true;
    resetPassBtnText.textContent = dict.updatingPass;

    try {
      const response = await fetch('/api/update-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          otp,
          newPassword,
          passkeyVerified,
          passkeyCredentialId,
          backupCodeVerified,
          backupCodeConsumedId
        })
      });

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : {};

      if (!response.ok || payload.ok === false || payload.success === false) {
        otpFailedAttempts++;
        if (otpFailedAttempts >= MAX_OTP_VERIFY_ATTEMPTS) {
          enforceEmailLock(email);
          return;
        }
        throw new Error(payload.error || payload.message || formatStr(dict.errVerifyFail, { current: otpFailedAttempts, max: MAX_OTP_VERIFY_ATTEMPTS }));
      }

      const userId = await resolveUserIdByEmail(email);
      const issued = payload.oneTimeBackupCode
        ? { ok: true, code: payload.oneTimeBackupCode }
        : await issueSingleUseBackupCode(userId, email);

      safeRemoveStorage('session', 'autro_reset_email');
      safeRemoveStorage('local', getLockUntilKey(email));
      safeWriteStorage('local', getAttemptKey(email), '0');
      safeWriteStorage('local', getBackupAttemptKey(email), '0');

      passkeyVerified = false;
      passkeyCredentialId = '';
      backupCodeVerified = false;
      backupCodeConsumedId = '';
      document.getElementById('otpCode').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
      updateNewPasswordStrength();

      step2El.style.display = 'none';
      if (issued.ok && issued.code) {
        showOneTimeBackupCode(issued.code, dict.okPasswordUpdated);
      } else {
        showAlert(dict.okPasswordUpdated, 'success');
        setTimeout(() => navigateSmooth(LOGIN_REDIRECT_PATH), 1100);
      }
    } catch (err) {
      showAlert(err.message || dict.errResetFail, 'error');
    } finally {
      isResettingPass = false;
      resetPassBtnText.textContent = dict.resetPass;
      if (!isEmailLocked) {
        resetPassBtn.disabled = false;
      }
    }
  }

  copyBackupCodeBtn?.addEventListener('click', async () => {
    const dict = getUiDict();
    const codeText = oneTimeBackupCodeValue?.textContent?.trim() || '';
    if (!codeText) return;
    try {
      await navigator.clipboard.writeText(codeText);
      if (copyBackupCodeText) copyBackupCodeText.textContent = dict.copiedBackupCode;
      setTimeout(() => {
        if (copyBackupCodeText) copyBackupCodeText.textContent = dict.copyBackupCode;
      }, 1800);
    } catch (_) {}
  });

  continueToLoginBtn?.addEventListener('click', () => {
    if (oneTimeBackupCodeValue) oneTimeBackupCodeValue.textContent = '';
    if (oneTimeBackupCard) oneTimeBackupCard.classList.remove('show');
    navigateSmooth(LOGIN_REDIRECT_PATH);
  });

  emailInput.addEventListener('input', () => {
    const dict = getUiDict();
    passkeyVerified = false;
    passkeyCredentialId = '';
    backupCodeVerified = false;
    backupCodeConsumedId = '';
    backupRecoveryToggleBtn?.classList.remove('verified');
    backupRecoveryToggleText.textContent = dict.backupRecoveryToggle;
    otpFailedAttempts = 0;
    checkIfLocked(emailInput.value);
    if (!isEmailLocked) {
      setPasskeyUi(false, dict.verifyPasskey);
      clearAlert();
    }
  });

  emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      requestOtp(false);
    }
  });

  document.getElementById('confirmPass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleResetPassword();
    }
  });

  passkeyBtn.addEventListener('click', verifyPasskey);
  backupRecoveryToggleBtn?.addEventListener('click', () => {
    if (isEmailLocked) return;
    clearAlert();
    backupRecoveryPanel?.classList.toggle('active');
    if (backupRecoveryPanel?.classList.contains('active')) {
      backupRecoveryInput?.focus();
    }
  });
  backupRecoveryVerifyBtn?.addEventListener('click', verifyBackupCodeStep);
  backupGenerateBtn?.addEventListener('click', generateBackupCodeStep);
  sendOtpBtn.addEventListener('click', () => requestOtp(false));
  resetPassBtn.addEventListener('click', handleResetPassword);
  resendOtpBtn.addEventListener('click', () => requestOtp(true));
  changeEmailBtn.addEventListener('click', () => {
    if (isEmailLocked) return;
    const dict = getUiDict();
    clearAlert();
    passkeyVerified = false;
    passkeyCredentialId = '';
    backupCodeVerified = false;
    backupCodeConsumedId = '';
    backupRecoveryToggleBtn?.classList.remove('verified');
    backupRecoveryToggleText.textContent = dict.backupRecoveryToggle;
    otpFailedAttempts = 0;
    safeRemoveStorage('session', 'autro_reset_email');
    setPasskeyUi(false, dict.verifyPasskey);
    step2El.style.display = 'none';
    step1El.style.display = 'block';
    subtitleEl.textContent = dict.pageSubtitle;
  });

  window.addEventListener('autro:languageChanged', applyPageLanguage);
  window.addEventListener('storage', (e) => {
    if (e.key === 'autro_lang' || e.key === 'autro_language' || e.key === 'lang' || e.key === 'autro_language_dir') {
      applyPageLanguage();
    }
  });

  window.addEventListener('pagehide', () => {
    if (resendTimer) clearInterval(resendTimer);
  });

  applyPageLanguage();
  checkIfLocked(emailInput.value);
</script>
