<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #ffffff;
    --card: #ffffff;
    --subtle: #f3f4f6;
    --input-bg: #f8fafc;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
    --accent: #14532d;
    --accent-hover: #166534;
    --accent-soft: rgba(20, 83, 45, 0.1);
    --error: #c62828;
    --success: #14532d;
    --shadow: 0 12px 32px rgba(32, 33, 36, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #202124;
      --card: #202124;
      --subtle: #292a2d;
      --input-bg: #292a2d;
      --text: #ffffff;
      --muted: #9aa0a6;
      --border: #3c4043;
      --accent: #15803d;
      --accent-hover: #166534;
      --accent-soft: rgba(21, 128, 61, 0.2);
      --error: #f87171;
      --success: #4ade80;
      --shadow: 0 16px 38px rgba(0, 0, 0, 0.45);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 22px;
    box-shadow: var(--shadow);
  }

  .brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 18px;
  }

  .logo-badge {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .logo-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.2px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.45;
  }

  .alert {
    display: none;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    text-align: center;
    line-height: 1.4;
    word-break: break-word;
  }

  .alert.show.error {
    display: block;
    background: rgba(198, 40, 40, 0.1);
    color: var(--error);
    border: 1px solid var(--error);
  }

  .alert.show.success {
    display: block;
    background: var(--accent-soft);
    color: var(--success);
    border: 1px solid var(--accent);
  }

  .form-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    height: 44px;
    padding: 0 40px 0 13px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: var(--accent);
  }

  .toggle-pass-btn {
    position: absolute;
    right: 8px;
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .passkey-btn {
    width: 100%;
    height: 44px;
    border-radius: 999px;
    border: 1.5px dashed var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }

  .passkey-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--subtle);
  }

  .passkey-btn.verified {
    border-style: solid;
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--success);
  }

  .passkey-btn.locked {
    border-style: solid;
    border-color: var(--error);
    color: var(--error);
  }

  .passkey-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .captcha-box {
    display: flex;
    justify-content: center;
    margin: 12px 0 14px;
    overflow-x: auto;
  }

  .primary-btn {
    width: 100%;
    height: 45px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #ffffff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.15s ease, transform 0.12s ease;
  }

  .primary-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .primary-btn:active:not(:disabled) {
    transform: scale(0.99);
  }

  .primary-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .step-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }

  .link-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .link-btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .link-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .footer-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
  }

  .footer-link:hover {
    color: var(--text);
  }
</style>
</head>
<body>
  <main class="auth-card">
    <div class="brand-header">
      <div class="logo-badge">
        <img src="/logo.png" alt="Autrobook">
      </div>
      <h1>Reset Password</h1>
      <p class="subtitle" id="pageSubtitle">Enter your email to receive a 6-digit verification code</p>
    </div>

    <div id="alertBox" class="alert" role="alert"></div>

    <!-- Step 1: Email + Passkey + reCAPTCHA -->
    <section id="step1">
      <div class="form-group">
        <label for="resetEmail">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <button type="button" id="passkeyBtn" class="passkey-btn">
        <i class="fa-solid fa-fingerprint"></i>
        <span id="passkeyBtnText">Login with Passkey</span>
      </button>

      <div class="captcha-box">
        <div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d"></div>
      </div>

      <button type="button" id="sendOtpBtn" class="primary-btn">
        <i class="fa-regular fa-paper-plane"></i>
        <span>Send OTP Code</span>
      </button>
    </section>

    <!-- Step 2: OTP + New Password -->
    <section id="step2" style="display: none;">
      <div class="form-group">
        <label for="otpCode">6-Digit OTP Code</label>
        <div class="input-wrap">
          <input type="text" id="otpCode" placeholder="Enter 6-digit OTP from email" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        </div>
      </div>

      <div class="form-group">
        <label for="newPass">New Password</label>
        <div class="input-wrap">
          <input type="password" id="newPass" placeholder="At least 6 characters" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" data-target="newPass" aria-label="Toggle new password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPass">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPass" placeholder="Re-enter new password" autocomplete="new-password">
          <button type="button" class="toggle-pass-btn" data-target="confirmPass" aria-label="Toggle confirm password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="button" id="resetPassBtn" class="primary-btn">
        <i class="fa-solid fa-key"></i>
        <span>Reset Password</span>
      </button>

      <div class="step-actions">
        <button type="button" id="changeEmailBtn" class="link-btn">Change email</button>
        <button type="button" id="resendOtpBtn" class="link-btn">Resend OTP</button>
      </div>
    </section>

    <a href="/login.html" id="backToLoginLink" class="footer-link">Back to Login</a>
  </main>

<script>
  const MAX_PASSKEY_ATTEMPTS = 6;
  const LOGIN_REDIRECT_PATH = '/login.html';
  const memoryStore = new Map();

  function safeReadStorage(type, key) {
    try {
      const store = type === 'local' ? window.localStorage : window.sessionStorage;
      if (!store) return memoryStore.get(`${type}:${key}`) || '';
      return store.getItem(key) || '';
    } catch (_) {
      return memoryStore.get(`${type}:${key}`) || '';
    }
  }

  function safeWriteStorage(type, key, value) {
    memoryStore.set(`${type}:${key}`, value);
    try {
      const store = type === 'local' ? window.localStorage : window.sessionStorage;
      if (store) store.setItem(key, value);
    } catch (_) {}
  }

  function safeRemoveStorage(type, key) {
    memoryStore.delete(`${type}:${key}`);
    try {
      const store = type === 'local' ? window.localStorage : window.sessionStorage;
      if (store) store.removeItem(key);
    } catch (_) {}
  }

  const alertBox = document.getElementById('alertBox');
  const subtitleEl = document.getElementById('pageSubtitle');
  const step1El = document.getElementById('step1');
  const step2El = document.getElementById('step2');
  const emailInput = document.getElementById('resetEmail');
  const passkeyBtn = document.getElementById('passkeyBtn');
  const passkeyBtnText = document.getElementById('passkeyBtnText');
  const sendOtpBtn = document.getElementById('sendOtpBtn');
  const resetPassBtn = document.getElementById('resetPassBtn');
  const resendOtpBtn = document.getElementById('resendOtpBtn');
  const changeEmailBtn = document.getElementById('changeEmailBtn');
  const backToLoginLink = document.getElementById('backToLoginLink');

  if (backToLoginLink) {
    backToLoginLink.href = LOGIN_REDIRECT_PATH;
  }

  let passkeyVerified = false;
  let passkeyCredentialId = '';
  let isPermanentLocked = false;

  function getLockKey(email) {
    const clean = (email || emailInput.value || safeReadStorage('session', 'autro_reset_email') || 'global').trim().toLowerCase();
    return `autro_passkey_locked_${clean}`;
  }

  function getAttemptKey(email) {
    const clean = (email || emailInput.value || safeReadStorage('session', 'autro_reset_email') || 'global').trim().toLowerCase();
    return `autro_passkey_attempts_${clean}`;
  }

  function getPasskeyIdKey(email) {
    const clean = (email || emailInput.value || 'global').trim().toLowerCase();
    return `autro_google_passkey_id_${clean}`;
  }

  function enforcePermanentLock(email = '') {
    isPermanentLocked = true;
    passkeyVerified = false;
    safeWriteStorage('local', getLockKey(email), '1');
    safeWriteStorage('local', 'autro_passkey_locked_global', '1');

    passkeyBtn.classList.remove('verified');
    passkeyBtn.classList.add('locked');
    passkeyBtn.disabled = true;
    passkeyBtnText.textContent = 'ID Locked (6/6 failed)';

    sendOtpBtn.disabled = true;
    resetPassBtn.disabled = true;
    resendOtpBtn.disabled = true;
    emailInput.disabled = true;
    showAlert('Passkey verification failed 6 times. ID is permanently locked and cannot be opened.', 'error');
  }

  function checkIfLocked(email = '') {
    if (
      safeReadStorage('local', getLockKey(email)) === '1' ||
      safeReadStorage('local', 'autro_passkey_locked_global') === '1'
    ) {
      enforcePermanentLock(email);
      return true;
    }
    return false;
  }

  function showAlert(message, type = 'error') {
    alertBox.textContent = message;
    alertBox.className = `alert show ${type}`;
  }

  function clearAlert() {
    if (isPermanentLocked) return;
    alertBox.textContent = '';
    alertBox.className = 'alert';
  }

  function setPasskeyUi(verified, label) {
    if (isPermanentLocked) return;
    passkeyVerified = verified;
    passkeyBtn.classList.toggle('verified', verified);
    passkeyBtn.classList.remove('locked');
    passkeyBtnText.textContent = label;
  }

  function recordFailedPasskeyAttempt(email = '', reason = '') {
    const key = getAttemptKey(email);
    const current = Number(safeReadStorage('local', key) || '0') + 1;
    safeWriteStorage('local', key, String(current));

    if (current >= MAX_PASSKEY_ATTEMPTS) {
      enforcePermanentLock(email);
      return false;
    }

    setPasskeyUi(false, `Passkey Failed (${current}/${MAX_PASSKEY_ATTEMPTS})`);
    const detail = reason ? ` (${reason})` : '';
    showAlert(`Biometric verification failed${detail}. Attempt ${current} of ${MAX_PASSKEY_ATTEMPTS}. After 6 attempts, ID is permanently locked.`, 'error');
    return false;
  }

  function bytesToHex(buffer) {
    return Array.from(new Uint8Array(buffer))
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function hexToBytes(hex) {
    const clean = String(hex || '').replace(/[^0-9a-fA-F]/g, '');
    const out = new Uint8Array(clean.length / 2);
    for (let i = 0; i < out.length; i++) {
      out[i] = parseInt(clean.slice(i * 2, i * 2 + 2), 16);
    }
    return out;
  }

  async function verifyGooglePasskey() {
    const email = (emailInput.value || safeReadStorage('session', 'autro_reset_email') || '').trim().toLowerCase();
    if (checkIfLocked(email)) return false;

    clearAlert();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert('Please enter your email address first before using Passkey.', 'error');
      return false;
    }

    if (
      typeof window.PublicKeyCredential === 'undefined' ||
      !navigator.credentials ||
      !navigator.credentials.create ||
      !navigator.credentials.get
    ) {
      return recordFailedPasskeyAttempt(email, 'Passkey not supported on this browser');
    }

    passkeyBtn.disabled = true;
    setPasskeyUi(false, 'Opening Passkey...');

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const storedCredId =
        safeReadStorage('local', getPasskeyIdKey(email)) ||
        safeReadStorage('local', 'autro_google_passkey_id_global');

      let credential = null;

      if (storedCredId) {
        const allowCredentials = [{
          type: 'public-key',
          id: hexToBytes(storedCredId),
          transports: ['internal', 'hybrid']
        }];

        credential = await navigator.credentials.get({
          publicKey: {
            challenge,
            rpId: window.location.hostname,
            allowCredentials,
            userVerification: 'required',
            timeout: 30000
          }
        });
      } else {
        const userId = new TextEncoder().encode(email);
        credential = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: {
              name: 'Autrobook',
              id: window.location.hostname
            },
            user: {
              id: userId,
              name: email,
              displayName: email.split('@')[0] || 'User'
            },
            pubKeyCredParams: [
              { type: 'public-key', alg: -7 },
              { type: 'public-key', alg: -257 }
            ],
            authenticatorSelection: {
              authenticatorAttachment: 'platform',
              residentKey: 'preferred',
              userVerification: 'required'
            },
            timeout: 30000
          }
        });

        if (credential && credential.rawId) {
          const newHex = bytesToHex(credential.rawId);
          safeWriteStorage('local', getPasskeyIdKey(email), newHex);
          safeWriteStorage('local', 'autro_google_passkey_id_global', newHex);
        }
      }

      if (!credential || !credential.rawId) {
        return recordFailedPasskeyAttempt(email, 'No passkey returned');
      }

      passkeyCredentialId = bytesToHex(credential.rawId);
      safeWriteStorage('local', getAttemptKey(email), '0');
      setPasskeyUi(true, 'Passkey Verified');
      showAlert('Google / Device Passkey verified successfully.', 'success');
      return true;
    } catch (err) {
      const msg = err && err.message ? err.message : 'Operation timed out or was not allowed';
      return recordFailedPasskeyAttempt(email, msg);
    } finally {
      if (!isPermanentLocked) {
        passkeyBtn.disabled = false;
      }
    }
  }

  document.querySelectorAll('.toggle-pass-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.getAttribute('data-target'));
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = `<i class="fa-regular ${isPassword ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
    });
  });

  async function requestOtp(isResend = false) {
    const email = (emailInput.value || '').trim().toLowerCase();
    if (checkIfLocked(email)) return;

    clearAlert();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert('Please enter a valid email address.', 'error');
      return;
    }

    if (!passkeyVerified) {
      const ok = await verifyGooglePasskey();
      if (!ok) return;
    }

    let captchaToken = '';
    if (!isResend) {
      if (typeof grecaptcha === 'undefined') {
        showAlert('reCAPTCHA is still loading. Please wait a moment and try again.', 'error');
        return;
      }
      captchaToken = grecaptcha.getResponse();
      if (!captchaToken) {
        showAlert('Please complete the reCAPTCHA verification.', 'error');
        return;
      }
    }

    sendOtpBtn.disabled = true;
    if (resendOtpBtn) resendOtpBtn.disabled = true;

    try {
      const response = await fetch('/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          purpose: 'reset-password',
          recaptchaToken: captchaToken,
          passkeyVerified,
          passkeyCredentialId
        })
      });

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : {};

      if (!response.ok || payload.ok === false || payload.success === false) {
        throw new Error(payload.error || payload.message || 'Unable to send OTP email. Check server mail settings.');
      }

      if (payload.otp) {
        safeWriteStorage('session', 'autro_sent_otp', String(payload.otp));
      }
      safeWriteStorage('session', 'autro_reset_email', email);
      safeWriteStorage('local', 'autro_reset_email', email);

      step1El.style.display = 'none';
      step2El.style.display = 'block';
      subtitleEl.textContent = `OTP sent to ${email}. Enter the code and set a new password.`;
      showAlert('Verification code sent to your email address.', 'success');
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
    } catch (err) {
      showAlert(err.message || 'Failed to send OTP email.', 'error');
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
    } finally {
      if (!isPermanentLocked) {
        sendOtpBtn.disabled = false;
        if (resendOtpBtn) resendOtpBtn.disabled = false;
      }
    }
  }

  async function handleResetPassword() {
    const email = (
      safeReadStorage('session', 'autro_reset_email') ||
      safeReadStorage('local', 'autro_reset_email') ||
      emailInput.value ||
      ''
    ).trim().toLowerCase();

    if (checkIfLocked(email)) return;

    clearAlert();

    if (!passkeyVerified) {
      const ok = await verifyGooglePasskey();
      if (!ok) return;
    }

    const otp = (document.getElementById('otpCode').value || '').trim();
    const newPassword = document.getElementById('newPass').value || '';
    const confirmPassword = document.getElementById('confirmPass').value || '';

    if (!email) {
      showAlert('Email is missing. Please go back and request an OTP.', 'error');
      return;
    }
    if (!/^\d{6}$/.test(otp)) {
      showAlert('Please enter the 6-digit OTP code sent to your email.', 'error');
      return;
    }
    if (newPassword.length < 6) {
      showAlert('New password must be at least 6 characters long.', 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      showAlert('Passwords do not match.', 'error');
      return;
    }

    const expectedOtp = safeReadStorage('session', 'autro_sent_otp');
    if (expectedOtp && otp !== expectedOtp) {
      showAlert('Invalid OTP code. Please check your email and try again.', 'error');
      return;
    }

    resetPassBtn.disabled = true;

    try {
      let response = await fetch('/api/update-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          otp,
          newPassword,
          password: newPassword,
          passkeyVerified,
          passkeyCredentialId
        })
      });

      if (response.status === 404) {
        response = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            otp,
            password: newPassword,
            profile: { full_name: email.split('@')[0] || 'User' },
            passkeyVerified,
            passkeyCredentialId
          })
        });
      }

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : {};

      if (!response.ok || payload.ok === false || payload.success === false) {
        throw new Error(payload.error || payload.message || 'Invalid OTP or unable to reset password.');
      }

      safeRemoveStorage('session', 'autro_reset_email');
      safeRemoveStorage('session', 'autro_sent_otp');
      showAlert('Password reset successful. Redirecting to login...', 'success');
      setTimeout(() => {
        window.location.href = LOGIN_REDIRECT_PATH;
      }, 1200);
    } catch (err) {
      showAlert(err.message || 'Password reset failed.', 'error');
    } finally {
      if (!isPermanentLocked) {
        resetPassBtn.disabled = false;
      }
    }
  }

  passkeyBtn.addEventListener('click', verifyGooglePasskey);
  sendOtpBtn.addEventListener('click', () => requestOtp(false));
  resetPassBtn.addEventListener('click', handleResetPassword);
  resendOtpBtn.addEventListener('click', () => requestOtp(true));
  changeEmailBtn.addEventListener('click', () => {
    if (isPermanentLocked) return;
    clearAlert();
    passkeyVerified = false;
    setPasskeyUi(false, 'Login with Passkey');
    step2El.style.display = 'none';
    step1El.style.display = 'block';
    subtitleEl.textContent = 'Enter your email to receive a 6-digit verification code';
  });

  checkIfLocked('');
</script>
</body>
</html>
