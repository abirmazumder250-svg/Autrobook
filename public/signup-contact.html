<html lang="en">

<meta charset="UTF-8">

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  :root {
    --primary: #0B3D20;
    --primary-hover: #072915;
    --accent-line: #0B3D20;
    --dark-green-btn: #0B3D20;
    --dark-green-hover: #0e4e29;
    --bg: #18191a;
    --card: #242526;
    --text: #ffffff;
    --muted: #b0b3b8;
    --border: #3a3b3c;
    --input-bg: #1e2021;
    --error: #f02849;
    --success: #0B3D20;
    --disabled: #4b4c4f;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --primary: #0B3D20;
      --primary-hover: #072915;
      --accent-line: #0B3D20;
      --dark-green-btn: #0B3D20;
      --dark-green-hover: #062413;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #050505;
      --muted: #65676b;
      --border: #dadde1;
      --input-bg: #ffffff;
      --error: #e41e3f;
      --success: #0B3D20;
      --disabled: #9e9e9e;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: rgba(11, 61, 32, 0.25);
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    max-width: 480px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    border: 1px solid var(--border);
    text-decoration: none;
    flex-shrink: 0;
  }

  .lang-selector-box {
    position: relative;
    display: inline-flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0 34px 0 14px;
    height: 38px;
    min-width: 195px;
    max-width: 260px;
    cursor: pointer;
  }

  .lang-selector-box select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-color: transparent;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    width: 100%;
    height: 100%;
    line-height: 36px;
    opacity: 1;
    visibility: visible;
  }

  .lang-selector-box select option {
    background-color: var(--card);
    color: var(--text);
  }

  .lang-selector-box .lang-caret {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 12px;
    color: var(--muted);
  }

  .lang-modal-back {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .lang-modal {
    background: var(--card);
    width: 90%;
    max-width: 380px;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--border);
  }

  .lang-modal h3 {
    margin-bottom: 16px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .lang-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 380px;
    overflow-y: auto;
  }

  .lang-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
  }

  .lang-item:hover {
    background: var(--bg);
  }

  .lang-item span {
    font-size: 15px;
    font-weight: 500;
  }

  .lang-item input[type="radio"] {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
  }

  .lang-item input[type="radio"]:checked {
    border-color: var(--primary);
  }

  .lang-item input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    background: var(--primary);
    border-radius: 50%;
  }

  .lang-close {
    width: 100%;
    padding: 13px;
    margin-top: 18px;
    background: var(--dark-green-btn);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .header {
    text-align: center;
    margin-bottom: 18px;
    padding: 0 20px;
  }

  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    object-fit: cover;
    margin: 0 auto 12px;
    display: block;
  }

  h2 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--text);
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
  }

  .progress-container {
    width: 100%;
    max-width: 440px;
    padding: 0 20px;
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }

  .progress-step {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
  }

  .progress-step.active {
    background: var(--accent-line);
  }

  .form-wrap {
    width: 100%;
    max-width: 440px;
    padding: 0 20px 40px;
    position: relative;
    z-index: 10;
  }

  .form-group {
    margin-bottom: 16px;
    position: relative;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }

  input:focus {
    border-color: var(--accent-line);
  }

  .eye-icon {
    position: absolute;
    right: 14px;
    top: 38px;
    cursor: pointer;
    color: var(--muted);
    padding: 6px;
    font-size: 17px;
  }

  .dob-wrap {
    display: flex;
    gap: 8px;
  }

  .dob-wrap input {
    text-align: center;
  }

  .verify-box {
    border: 1.5px dashed var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    background: var(--card);
    margin-bottom: 18px;
  }

  .verify-box video {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 10px;
    display: none;
    margin-bottom: 10px;
    transform: scaleX(-1);
    background: #000000;
  }

  .verify-box img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    margin: 10px auto;
    display: none;
    border: 3px solid var(--accent-line);
  }

  .verify-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--dark-green-btn);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s;
  }

  .verify-btn:hover:not(:disabled) {
    background: var(--dark-green-hover);
  }

  .verify-btn:active:not(:disabled) {
    transform: scale(0.99);
  }

  .verify-btn.verified {
    background: var(--dark-green-btn) !important;
    border: 1px solid var(--accent-line);
  }

  .liveness-text {
    font-size: 12.5px;
    color: var(--accent-line);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .action-row-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .capture-now-btn,
  .stop-cam-btn,
  .upload-selfie-btn {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .capture-now-btn {
    display: none;
    border: 1.5px solid var(--accent-line);
    background: rgba(11, 61, 32, 0.15);
    color: var(--accent-line);
  }

  .stop-cam-btn {
    display: none;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
  }

  .upload-selfie-btn {
    margin-top: 8px;
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
  }

  .upload-selfie-btn:hover {
    color: var(--text);
    border-color: var(--muted);
  }

  .fingerprint-btn {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .fingerprint-btn:hover:not(:disabled) {
    border-color: var(--accent-line);
    color: var(--accent-line);
  }

  .fingerprint-btn.verified {
    border-color: var(--accent-line);
    color: var(--accent-line);
    background: rgba(11, 61, 32, 0.12);
  }

  .verify-status {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.4;
  }

  .manual-captcha-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1.5px solid var(--border);
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    margin: 8px 0 18px;
  }

  .manual-captcha-row input[type="checkbox"] {
    display: none;
  }

  .custom-checkbox {
    width: 24px;
    height: 24px;
    border: 2px solid var(--muted);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .manual-captcha-row input:checked ~ .custom-checkbox {
    background: var(--dark-green-btn);
    border-color: var(--accent-line);
  }

  .manual-captcha-row input:checked ~ .custom-checkbox::after {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    color: #ffffff;
    font-size: 13px;
  }

  .manual-captcha-row span {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    margin-top: 10px;
    background: var(--disabled);
    color: #ffffff;
    cursor: not-allowed;
    transition: background 0.2s, transform 0.1s;
  }

  .btn.active {
    background: var(--dark-green-btn) !important;
    cursor: pointer;
  }

  .btn.active:hover {
    background: var(--dark-green-hover) !important;
  }

  .btn.active:active {
    transform: scale(0.99);
  }

  .btn-secondary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    margin-top: 10px;
    cursor: pointer;
  }

  .msg {
    text-align: center;
    font-size: 13px;
    color: var(--error);
    font-weight: 700;
    min-height: 20px;
    margin-bottom: 10px;
    word-break: break-word;
    line-height: 1.4;
  }

  .msg.success {
    color: var(--success);
  }

  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .footer-text a {
    color: var(--accent-line);
    font-weight: 700;
    text-decoration: none;
  }

  .otp-timer {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
  }

  .hide {
    display: none !important;
  }
</style>
</head>

  return Object.assign({}, UI_STRINGS.en, {
    heading: `${UI_STRINGS.en.heading} (${labelText})`,
    subtitle: `${UI_STRINGS.en.subtitle} — ${labelText}`
  });
}

function setActiveLanguage(langCode, langName, isRtl) {
  currentLang = langCode || 'en';

  try {
    localStorage.setItem('autro_lang', currentLang);

  document.documentElement.lang = currentLang;
  document.documentElement.dir = resolvedRtl ? 'rtl' : 'ltr';

  const selectEl = document.getElementById('languageSelect');

    const code = opt.value;
    const name = opt.textContent.trim();
    const isRtl = opt.getAttribute('data-dir') === 'rtl';

    const item = document.createElement('div');
    item.className = 'lang-item';
    item.innerHTML = `
      <span>${name}</span>
      <input type="radio" name="modalLang" value="${code}" ${currentLang === code ? 'checked' : ''}>
    `;
    item.addEventListener('click', () => {
      selectEl.value = code;
      setActiveLanguage(code, name, isRtl);
      closeLangModal();
    });
    list.appendChild(item);
  });
}

async function registerFingerprint() {
  const btn = document.getElementById('fingerprintBtn');
  const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
  setMessage('');

  const isTopFrame = window.self === window.top;
  const isSecure = window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  if (!isTopFrame) {
    fingerprintVerified = false;
    webauthnCredentialId = null;
    btn.classList.remove('verified');
    btn.innerHTML = `<i class="fas fa-fingerprint"></i> <span id="fingerprintBtnText">${dict.fingerprint}</span>`;
    setMessage('Fingerprint verification is mandatory and cannot run inside an embedded frame. Open the site directly in your browser.');
    updateSecurityStatus();
    checkButtonState();
    return;
  }

  if (!isSecure || !window.PublicKeyCredential || !navigator.credentials || typeof navigator.credentials.create !== 'function') {
    fingerprintVerified = false;
    webauthnCredentialId = null;
    btn.classList.remove('verified');
    btn.innerHTML = `<i class="fas fa-fingerprint"></i> <span id="fingerprintBtnText">${dict.fingerprint}</span>`;
    setMessage('Biometric / fingerprint authentication is required on a supported secure device.');
    updateSecurityStatus();
    checkButtonState();
    return;
  }

  try {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Touch fingerprint sensor...';
    const challenge = new Uint8Array(32);
    window.crypto.getRandomValues(challenge);
    const userId = new Uint8Array(16);
    window.crypto.getRandomValues(userId);
    const emailVal = document.getElementById('email').value.trim() || 'user@autrobook.com';
    let displayName = 'Autrobook User';
    try {
      displayName = localStorage.getItem('signup_name') || 'Autrobook User';
    } catch (e) {}

    const credential = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'Autrobook', id: location.hostname || 'localhost' },
        user: {
          id: userId,
          name: emailVal,
          displayName
        },
        pubKeyCredParams: [
          { type: 'public-key', alg: -7 },
          { type: 'public-key', alg: -257 }
        ],
        authenticatorSelection: {
          userVerification: 'required'
        },
        timeout: 60000,
        attestation: 'none'
      }
    });

    if (credential) {
      webauthnCredentialId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
      fingerprintVerified = true;
      btn.classList.add('verified');
      btn.innerHTML = '<i class="fas fa-check-circle"></i> Fingerprint Verified';
      btn.disabled = true;
      setMessage('Fingerprint verified successfully!', true);
    } else {
      fingerprintVerified = false;
      webauthnCredentialId = null;
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-fingerprint"></i> <span id="fingerprintBtnText">${dict.fingerprint}</span>`;
      setMessage('Fingerprint verification is mandatory to continue.');
    }
  } catch (err) {
    console.warn('Fingerprint error:', err);
    fingerprintVerified = false;
    webauthnCredentialId = null;
    btn.classList.remove('verified');
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-fingerprint"></i> <span id="fingerprintBtnText">${dict.fingerprint}</span>`;
    setMessage('Fingerprint verification failed or was cancelled. Please complete fingerprint scan.');
  }

  updateSecurityStatus();
  checkButtonState();
}

async function handleSelfieFileUpload(event) {
  const file = event && event.target && event.target.files && event.target.files[0];
  if (!file) return;
  setMessage('');

  const statusEl = document.getElementById('verifyStatus');
  statusEl.textContent = 'Processing selfie photo...';

  const reader = new FileReader();
  reader.onload = async (e) => {
    selfieData = e.target.result || '';
    const photoImg = document.getElementById('photo');
    photoImg.src = selfieData;
    photoImg.style.display = 'block';

    if (window.faceapi) {
      try {
        if (!modelsLoaded) {
          await Promise.race([
            Promise.all([
              faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
              faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
              faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 7000))
          ]);
          modelsLoaded = true;
        }
        const fullDetection = await faceapi
          .detectSingleFace(photoImg, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptor();
        if (fullDetection && fullDetection.descriptor) {
          faceDescriptor = Array.from(fullDetection.descriptor);
        }
      } catch (err) {
        console.warn('Photo descriptor fallback:', err);
      }
    }

    stopCamera(document.getElementById('cameraBtn'));
    const btn = document.getElementById('cameraBtn');
    btn.innerHTML = '<i class="fas fa-check"></i> Selfie Verified';
    btn.classList.add('verified');
    btn.disabled = true;

    livenessPassed = true;
    updateSecurityStatus();
    setMessage('Selfie verified successfully!', true);
    checkButtonState();
  };
  reader.readAsDataURL(file);
}

async function startCamera() {
  const btn = document.getElementById('cameraBtn');
  const statusEl = document.getElementById('verifyStatus');
  const captureNowBtn = document.getElementById('captureNowBtn');
  const stopCamBtn = document.getElementById('stopCamBtn');
  setMessage('');

  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    statusEl.textContent = 'Live stream unavailable — tap "Use Front Camera / Photo Picker Fallback" below';
    setMessage('Live camera stream is not supported here. Use the fallback button below.');
    return;
  }

  try {
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Opening camera...';
    btn.disabled = true;
    statusEl.textContent = 'Requesting camera permission...';

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
    } catch (firstErr) {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }

    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    await video.play();

    document.getElementById('livenessText').classList.remove('hide');
    captureNowBtn.style.display = 'flex';
    stopCamBtn.style.display = 'flex';
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning face &amp; eyes...';
    statusEl.textContent = 'Loading eye & face scan models...';

    if (!window.faceapi) {
      statusEl.textContent = 'Camera ready — tap "Capture Now" to verify';
      return;
    }

    try {
      if (!modelsLoaded) {
        await Promise.race([
          Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
          ]),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Model load timeout')), 8000))
        ]);
        modelsLoaded = true;
      }
    } catch (modelErr) {
      console.warn('Face-API models fallback:', modelErr);
      statusEl.textContent = 'Eye model slow — tap "Capture Now" or blink';
      return;
    }

    statusEl.textContent = 'Blink your eyes once to complete verification';

    let blinkCount = 0;
    let lastEyeState = 'open';
    let completed = false;

    scanInterval = setInterval(async () => {
      if (completed || !video || video.readyState < 2) return;
      try {
        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 }))
          .withFaceLandmarks();

        if (detection && detection.landmarks) {
          const leftEye = detection.landmarks.getLeftEye();
          const rightEye = detection.landmarks.getRightEye();
          const earLeft = (getDistance(leftEye[1], leftEye[5]) + getDistance(leftEye[2], leftEye[4])) / (2 * getDistance(leftEye[0], leftEye[3]));
          const earRight = (getDistance(rightEye[1], rightEye[5]) + getDistance(rightEye[2], rightEye[4])) / (2 * getDistance(rightEye[0], rightEye[3]));
          const avgEar = (earLeft + earRight) / 2;

          if (avgEar < 0.25 && lastEyeState === 'open') {
            blinkCount++;
            lastEyeState = 'closed';
          } else if (avgEar >= 0.25 && lastEyeState === 'closed') {
            lastEyeState = 'open';
          }

          if (blinkCount >= 1) {
            completed = true;
            await capturePhotoAndDescriptor(video);
          }
        }
      } catch (frameErr) {
        console.warn('Frame scan skipped:', frameErr);
      }
    }, 240);

    scanTimeout = setTimeout(() => {
      if (!livenessPassed && !completed) {
        statusEl.textContent = 'Auto-blink timed out — tap "Capture Now" to verify';
      }
    }, 15000);
  } catch (err) {
    console.error('Camera error:', err);
    const reason = err && err.name === 'NotAllowedError'
      ? 'Camera permission denied. Allow camera or tap "Use Front Camera / Photo Picker Fallback".'
      : 'Live camera blocked here. Tap "Use Front Camera / Photo Picker Fallback" below.';
    setMessage(reason);
    statusEl.textContent = reason;
    stopCamera(btn);
  }
}

async function capturePhotoAndDescriptor(video) {
  if (scanInterval) {
    clearInterval(scanInterval);
    scanInterval = null;
  }
  if (scanTimeout) {
    clearTimeout(scanTimeout);
    scanTimeout = null;
  }

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;

  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  const photoImg = document.getElementById('photo');
  photoImg.src = selfieData;
  photoImg.style.display = 'block';

  if (window.faceapi && modelsLoaded) {
    try {
      const fullDetection = await faceapi
        .detectSingleFace(photoImg, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();
      if (fullDetection && fullDetection.descriptor) {
        faceDescriptor = Array.from(fullDetection.descriptor);
      }
    } catch (e) {
      console.warn('Descriptor extraction warning:', e);
    }
  }

  document.getElementById('livenessText').classList.add('hide');
  document.getElementById('captureNowBtn').style.display = 'none';
  document.getElementById('stopCamBtn').style.display = 'none';
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.style.display = 'none';

  const btn = document.getElementById('cameraBtn');
  btn.innerHTML = '<i class="fas fa-check"></i> Face Verified';
  btn.classList.add('verified');
  btn.disabled = true;

  livenessPassed = true;
  updateSecurityStatus();
  setMessage('Live selfie captured and verified!', true);
  checkButtonState();
}

function isValidDob(day, month, year) {
  const d = parseInt(day, 10);
  const m = parseInt(month, 10);
  const y = parseInt(year, 10);
  if (!d || !m || !y) return false;
  if (d < 1 || d > 31 || m < 1 || m > 12) return false;
  const currentYear = new Date().getFullYear();
  if (y < 1900 || y > currentYear) return false;
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function hasHumanCheck() {
  const recaptchaToken = (typeof grecaptcha !== 'undefined' && typeof grecaptcha.getResponse === 'function')
    ? grecaptcha.getResponse()
    : '';
  const manualChecked = document.getElementById('humanCheck').checked;
  return Boolean(recaptchaToken) || manualChecked;
}

function checkButtonState() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const day = document.getElementById('day').value.trim();
  const month = document.getElementById('month').value.trim();
  const year = document.getElementById('year').value.trim();
  const password = document.getElementById('password').value;

  const humanOk = hasHumanCheck();
  const sendBtn = document.getElementById('sendOtpBtn');
  const signBtn = document.getElementById('signUpBtn');

  if (isValidEmail(email) && humanOk) {
    sendBtn.classList.add('active');
    sendBtn.disabled = false;
  } else {
    sendBtn.classList.remove('active');
    sendBtn.disabled = true;
  }

  const dobOk = year.length === 4 && isValidDob(day, month, year);
  if (otpSent && otp.length === 6 && humanOk && livenessPassed && fingerprintVerified && isValidEmail(email) && dobOk && password.length >= 6) {
    signBtn.classList.add('active');
    signBtn.disabled = false;
  } else {
    signBtn.classList.remove('active');
    signBtn.disabled = true;
  }
}

window.enableBtn = () => checkButtonState();
window.manualCaptcha = () => checkButtonState();

function updateTimer() {
  const el = document.getElementById('otpTimer');
  if (!el) return;
  const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
  if (otpSeconds > 0) {
    el.textContent = `${dict.otpExpiresPrefix}${otpSeconds}s`;
  } else {
    el.textContent = dict.otpExpired;
  }
}

async function parseJsonSafe(res) {
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    return { message: text || `HTTP ${res.status}` };
  }
}

async function sendOTP() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('sendOtpBtn');
  const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
  setMessage('');

  if (!isValidEmail(email)) {
    setMessage('Please enter a valid email address.');
    return;
  }

  let signupName = 'User';
  try {
    signupName = localStorage.getItem('signup_name') || 'User';
  } catch (e) {}

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending OTP...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        name: signupName,
        lang: currentLang
      })
    });

    const data = await parseJsonSafe(res);

    if (data.alreadyExists) {
      setMessage('An account already exists with this email. Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
      return;
    }

    if (!res.ok || data.success === false) {
      const errMsg = data.message || data.error || data.code || `Failed to send OTP (HTTP ${res.status}).`;
      setMessage(errMsg);
      btn.innerHTML = dict.sendOtp;
      checkButtonState();
      return;
    }

    otpSent = true;
    document.getElementById('otpGroup').classList.remove('hide');
    document.getElementById('otp').focus();
    setMessage('6-digit OTP code sent to your email. Check Inbox or Spam.', true);

    otpSeconds = 60;
    updateTimer();
    if (otpTimer) clearInterval(otpTimer);
    otpTimer = setInterval(() => {
      otpSeconds--;
      updateTimer();
      if (otpSeconds <= 0) {
        clearInterval(otpTimer);
      }
    }, 1000);

    btn.innerHTML = '<i class="fas fa-check"></i> OTP Sent';
    setTimeout(() => {
      btn.innerHTML = 'Resend OTP';
      checkButtonState();
    }, 3000);

    checkButtonState();
  } catch (err) {
    console.error('Send OTP network/client error:', err);
    setMessage('Network or server error while sending OTP: ' + (err.message || 'Unknown error'));
    btn.innerHTML = dict.sendOtp;
    checkButtonState();
  }
}

async function verifyOTPAndSignup() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const password = document.getElementById('password').value;
  let name = 'User';
  try {
    name = localStorage.getItem('signup_name') || 'User';
  } catch (e) {}
  const day = document.getElementById('day').value.trim();
  const month = document.getElementById('month').value.trim();
  const year = document.getElementById('year').value.trim();

  const btn = document.getElementById('signUpBtn');
  const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
  setMessage('');

  if (!livenessPassed) {
    setMessage('Please complete selfie / camera verification first.');
    return;
  }

  if (!fingerprintVerified || !webauthnCredentialId) {
    setMessage('Fingerprint verification is mandatory before signing up.');
    return;
  }

  if (!isValidDob(day, month, year)) {
    setMessage('Please enter a valid birthday (DD / MM / YYYY).');
    return;
  }

  if (password.length < 6) {
    setMessage('Password must be at least 6 characters long.');
    return;
  }

  const dob = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        otp,
        password,
        profile: {
          full_name: name,
          dob,
          selfieData,
          faceDescriptor,
          webauthnCredentialId,
          language: currentLang
        }
      })
    });

    const data = await parseJsonSafe(res);

    if (data.alreadyExists) {
      setMessage('An account already exists with this email. Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
      return;
    }

    if (!res.ok || data.success === false) {
      const errMsg = data.message || data.error || data.code || `Signup failed (HTTP ${res.status}).`;
      setMessage(errMsg);
      btn.innerHTML = dict.signUp;
      checkButtonState();
      return;
    }

    if (supabaseClient) {
      const { error: signInErr } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (signInErr) {
        window.location.href = 'login.html?msg=signup_success';
        return;
      }
    }

    window.location.href = 'index.html';
  } catch (err) {
    console.error('Verify OTP / Signup error:', err);
    setMessage('Error completing sign up: ' + (err.message || 'Unknown error'));
    btn.innerHTML = dict.signUp;
    checkButtonState();
  }
}

function initPage() {
  const selectEl = document.getElementById('languageSelect');
  if (selectEl) {
    selectEl.addEventListener('change', () => onLanguageSelectChange(selectEl));
    selectEl.addEventListener('input', () => onLanguageSelectChange(selectEl));
  }
  restoreSavedLanguage();
  updateNamePreview();
  updateSecurityStatus();
  checkButtonState();
}

initPage();
document.addEventListener('DOMContentLoaded', initPage);
