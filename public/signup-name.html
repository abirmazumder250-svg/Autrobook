<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Sign Up - Autrobook</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F8F9FA;
    --card: #FFFFFF;
    --text: #202124;
    --muted: #5F6368;
    --border: rgba(32, 33, 36, 0.14);
    --input-bg: #FFFFFF;

    --primary: #202124;
    --primary-hover: #3C4043;
    --accent: #202124;
    --accent-dark: #202124;
    --accent-soft: rgba(32, 33, 36, 0.08);

    --btn-green: #0F5132;
    --btn-green-hover: #0B3D26;
    --btn-green-bright: #198754;
    --btn-green-soft: rgba(15, 81, 50, 0.10);
    --btn-green-shadow: 0 8px 22px rgba(15, 81, 50, 0.24);

    --error: #DC2626;
    --success: #0F5132;

    --shadow-sm: 0 2px 10px rgba(32, 33, 36, 0.04);
    --shadow-md: 0 12px 32px rgba(32, 33, 36, 0.08);
    --shadow-btn: 0 8px 22px rgba(15, 81, 50, 0.24);

    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-pill: 999px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #292A2D;
      --card: #202124;
      --text: #FFFFFF;
      --muted: #BDC1C6;
      --border: rgba(255, 255, 255, 0.16);
      --input-bg: #292A2D;

      --primary: #FFFFFF;
      --primary-hover: #E8EAED;
      --accent: #FFFFFF;
      --accent-dark: #E8EAED;
      --accent-soft: rgba(255, 255, 255, 0.12);

      --btn-green: #0F5132;
      --btn-green-hover: #146C43;
      --btn-green-bright: #198754;
      --btn-green-soft: rgba(25, 135, 84, 0.18);
      --btn-green-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);

      --success: #198754;

      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.40);
      --shadow-btn: 0 8px 22px rgba(0, 0, 0, 0.35);
    }

    .lang-modal,
    .lang-search-input {
      background: var(--card);
      color: var(--text);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: rgba(15, 81, 50, 0.16);
    -webkit-font-smoothing: antialiased;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }

  body.page-exit {
    opacity: 0;
    transform: translateY(6px);
  }

  /* Entrance Animations */
  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes logoPulseRing {
    0% {
      transform: scale(1);
      opacity: 0.75;
    }
    100% {
      transform: scale(1.42);
      opacity: 0;
    }
  }

  @keyframes logoFloatGlow {
    0%, 100% {
      transform: translateY(0px);
      box-shadow:
        0 10px 24px rgba(32, 33, 36, 0.08),
        0 0 0 3px rgba(15, 81, 50, 0.14),
        0 8px 24px rgba(15, 81, 50, 0.22);
    }
    50% {
      transform: translateY(-3px);
      box-shadow:
        0 14px 28px rgba(32, 33, 36, 0.12),
        0 0 0 5px rgba(15, 81, 50, 0.22),
        0 12px 30px rgba(15, 81, 50, 0.34);
    }
  }

  @keyframes progressGrow {
    from {
      transform: scaleX(0);
      transform-origin: left center;
    }
    to {
      transform: scaleX(1);
      transform-origin: left center;
    }
  }

  @keyframes shakeError {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  @keyframes modalPop {
    from {
      transform: scale(0.95);
      opacity: 0;
    }
    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  .app-container {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding:
      calc(env(safe-area-inset-top, 0px) + 8px)
      20px
      calc(env(safe-area-inset-bottom, 0px) + 24px);
    position: relative;
    animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    gap: 12px;
    position: relative;
    z-index: 10;
    animation: fadeSlideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.04s both;
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
    border: 1px solid var(--border);
    text-decoration: none;
    flex-shrink: 0;
    transition: transform 0.18s ease, border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  }

  .back-btn:hover {
    border-color: var(--btn-green-bright);
    color: var(--btn-green-bright);
    background: var(--bg);
    transform: translateX(-2px);
  }

  .back-btn:active {
    transform: scale(0.93);
  }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 9px 15px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    max-width: 245px;
    transition: transform 0.18s ease, border-color 0.2s ease, background-color 0.2s ease;
  }

  .lang-btn:hover {
    border-color: var(--btn-green-bright);
    background: var(--bg);
  }

  .lang-btn:active {
    transform: scale(0.96);
  }

  .lang-btn svg {
    width: 16px;
    height: 16px;
    color: var(--btn-green-bright);
    flex-shrink: 0;
  }

  .lang-btn span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lang-chevron {
    width: 14px !important;
    height: 14px !important;
    color: var(--muted) !important;
    transition: transform 0.2s ease;
  }

  .lang-btn:hover .lang-chevron {
    transform: translateY(1px);
  }

  .header {
    text-align: center;
    margin-top: 12px;
    margin-bottom: 18px;
    animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
  }

  /* Animated Logo with Pulse Ring & Float */
  .top-logo {
    position: relative;
    width: 68px;
    height: 68px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .top-logo::before,
  .top-logo::after {
    content: '';
    position: absolute;
    width: 68px;
    height: 68px;
    border-radius: 20px;
    border: 2px solid rgba(15, 81, 50, 0.45);
    pointer-events: none;
    animation: logoPulseRing 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }

  .top-logo::after {
    animation-delay: 1.4s;
  }

  @media (prefers-color-scheme: dark) {
    .top-logo::before,
    .top-logo::after {
      border-color: rgba(25, 135, 84, 0.50);
    }
  }

  .logo-box {
    position: relative;
    z-index: 2;
    width: 68px;
    height: 68px;
    border-radius: 20px;
    background: var(--bg);
    border: 1.5px solid rgba(15, 81, 50, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: logoFloatGlow 3.2s ease-in-out infinite;
  }

  .logo {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    object-fit: cover;
    display: block;
  }

  h2 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    color: var(--text);
  }

  .subtitle {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
  }

  .progress-container {
    width: 100%;
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.16s both;
  }

  .progress-step {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }

  .progress-step.active {
    background: var(--btn-green);
    animation: progressGrow 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .form-wrap {
    width: 100%;
    position: relative;
    z-index: 10;
  }

  .form-group {
    margin-bottom: 16px;
    position: relative;
    animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .form-group:nth-child(1) { animation-delay: 0.2s; }
  .form-group:nth-child(2) { animation-delay: 0.26s; }
  .form-group:nth-child(3) { animation-delay: 0.32s; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
    transition: color 0.2s ease;
  }

  .form-group:focus-within label {
    color: var(--btn-green-bright);
  }

  input[type="text"] {
    width: 100%;
    padding: 13px 15px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }

  input[type="text"]:focus {
    border-color: var(--btn-green-bright);
    box-shadow: 0 0 0 3px var(--btn-green-soft);
  }

  input::placeholder {
    color: var(--muted);
    opacity: 0.72;
  }

  .faint-note {
    margin-top: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    opacity: 0.85;
    line-height: 1.4;
    transition: color 0.2s ease, transform 0.2s ease;
  }

  .faint-note.preview-live {
    color: var(--btn-green-bright);
    font-weight: 600;
  }

  .btn {
    width: 100%;
    min-height: 50px;
    padding: 13px 20px;
    border-radius: var(--radius-pill);
    font-size: 15px;
    font-weight: 700;
    border: none;
    margin-top: 10px;
    background: var(--btn-green);
    color: #FFFFFF;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: background-color 0.2s ease, transform 0.16s ease, box-shadow 0.2s ease;
    position: relative;
    z-index: 10;
    animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
  }

  .btn:hover {
    background: var(--btn-green-hover);
    transform: translateY(-1px);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .msg {
    text-align: center;
    font-size: 13px;
    color: var(--error);
    font-weight: 700;
    min-height: 18px;
    margin-bottom: 8px;
    word-break: break-word;
    line-height: 1.4;
  }

  .msg.shake {
    animation: shakeError 0.36s ease;
  }

  .msg.success {
    color: var(--success);
  }

  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--muted);
    animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.44s both;
  }

  .footer-text a {
    color: var(--text);
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .footer-text a:hover {
    color: var(--btn-green-bright);
    border-bottom-color: var(--btn-green-bright);
  }

  .hide {
    display: none !important;
  }

  /* Language Selection Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.52);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .lang-modal {
    width: 100%;
    max-width: 410px;
    height: 82vh;
    height: 82dvh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    animation: modalPop 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .lang-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .lang-header h3 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
  }

  .close-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.16s ease, background-color 0.2s ease;
  }

  .close-btn:hover {
    background: var(--accent-soft);
  }

  .close-btn:active {
    transform: scale(0.92);
  }

  .lang-search-wrap {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .lang-search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  .lang-search-input:focus {
    border-color: var(--btn-green-bright);
  }

  .lang-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .lang-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color 0.16s ease, transform 0.14s ease;
  }

  .lang-item:hover {
    background: var(--surface);
  }

  .lang-item:active {
    transform: scale(0.99);
  }

  .lang-item.selected {
    background: var(--btn-green-soft);
  }

  .lang-label-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
  }

  .lang-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
  }

  .lang-country {
    font-size: 12px;
    color: var(--muted);
  }

  .lang-radio {
    width: 20px;
    height: 20px;
    accent-color: var(--btn-green);
    cursor: pointer;
    flex-shrink: 0;
  }

  @media (min-width: 481px) {
    body {
      background: var(--surface);
      padding: 24px 0;
    }
    .app-container {
      min-height: calc(100vh - 48px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow-md);
      padding: 16px 26px 28px;
    }
  }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <a href="welcome.html" class="back-btn" onclick="goWelcome(event)" title="Back to Welcome" aria-label="Back to Welcome">
      <i class="fas fa-arrow-left"></i>
    </a>

    <button type="button" class="lang-btn" id="languageButton" onclick="openLangModal()" aria-label="Change language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <span id="currentLangText">English (US)</span>
      <svg class="lang-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <div class="header">
    <div class="top-logo">
      <div class="logo-box">
        <img src="logo.png" alt="Autrobook Logo" class="logo" onerror="this.parentElement.style.display='none'">
      </div>
    </div>
    <h2 id="titleHeading">What's your name?</h2>
    <p class="subtitle" id="subtitleText">Enter the name you use in real life</p>
  </div>

  <div class="progress-container">
    <div class="progress-step active"></div>
    <div class="progress-step"></div>
  </div>

  <div class="form-wrap">
    <div class="form-group">
      <label for="firstName" id="firstNameLabel">First Name</label>
      <input type="text" id="firstName" autocomplete="given-name" placeholder="Enter your first name">
    </div>

    <div class="form-group">
      <label for="surname" id="surnameLabel">Surname</label>
      <input type="text" id="surname" autocomplete="family-name" placeholder="Enter your surname">
    </div>

    <div class="form-group">
      <label for="username" id="usernameLabel">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="Choose a username" oninput="updateUsernameHint()">
      <p class="faint-note" id="usernameHint">Unique handle for your Autrobook profile (e.g. @your_handle)</p>
    </div>

    <div class="msg" id="msg"></div>
    <button type="button" class="btn" id="nextBtn" onclick="goNext()">Next</button>

    <p class="footer-text" id="loginFooter">
      <span id="haveAccText">Already have an account?</span>
      <a href="login.html" id="loginLink">Log in</a>
    </p>
  </div>
</div>

<!-- LANGUAGE SELECTION MODAL WITH SEARCH -->
<div class="modal-overlay" id="langModal" onclick="closeLangModal()">
  <div class="lang-modal" onclick="event.stopPropagation()">
    <div class="lang-header">
      <h3 id="langModalTitle">Select Language</h3>
      <button type="button" class="close-btn" id="langCloseBtn" onclick="closeLangModal()" aria-label="Close">✕</button>
    </div>
    <div class="lang-search-wrap">
      <input type="text" class="lang-search-input" id="langSearchInput" placeholder="Search language or country...">
    </div>
    <div class="lang-list" id="langList"></div>
  </div>
</div>

const memoryStore = new Map();

function safeGetStorage(key) {
  try {
    const ls = window.localStorage.getItem(key);
    if (ls !== null) return ls;
  } catch (e) {}
  try {
    const ss = window.sessionStorage.getItem(key);
    if (ss !== null) return ss;
  } catch (e) {}
  return memoryStore.has(key) ? memoryStore.get(key) : null;
}

function safeSetStorage(key, value) {
  memoryStore.set(key, String(value));
  try { window.localStorage.setItem(key, String(value)); } catch (e) {}
  try { window.sessionStorage.setItem(key, String(value)); } catch (e) {}
}

const UI_STRINGS = {
  en: {
    title: "What's your name?",
    subtitle: "Enter the name you use in real life",
    firstName: "First Name",
    surname: "Surname",
    username: "Username",
    firstNamePlaceholder: "Enter your first name",
    surnamePlaceholder: "Enter your surname",
    usernamePlaceholder: "Choose a username",
    usernameHint: "Unique handle for your Autrobook profile (e.g. @your_handle)",
    handlePrefix: "Profile handle preview:",
    next: "Next",
    haveAcc: "Already have an account?",
    loginLink: "Log in",
    err1: "Please enter your first name",
    err2: "Please enter your surname",
    err3: "Please enter a username",
    modalTitle: "Select Language",
    searchPlaceholder: "Search language or country..."
  }
};

const LANGUAGE_ID_KEY = 'autro_lang_id';
const LANGUAGE_CODE_KEY = 'autro_lang';

let currentLangId = safeGetStorage(LANGUAGE_ID_KEY) || 'en-US';
let currentLang = safeGetStorage(LANGUAGE_CODE_KEY) || safeGetStorage('lang') || 'en';

function getActiveLanguageObj() {
  const exact = languages.find(l => l.id === currentLangId);
  if (exact) return exact;
  if (currentLang) {
    const byCode = languages.find(l => l.code === currentLang || l.id === currentLang);
    if (byCode) return byCode;
  }
  return languages[0];
}

function getDict(langObj) {
  const code = (langObj && langObj.code) || 'en';
  const base = code.split('-')[0];
  return UI_STRINGS[code] || UI_STRINGS[base] || UI_STRINGS.en;
}

function escapeHTML(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function navigateSmooth(url) {
  document.body.classList.add('page-exit');
  setTimeout(() => {
    window.location.href = url;
  }, 200);
}

function goWelcome(event) {
  if (event) event.preventDefault();
  navigateSmooth('welcome.html');
}

function showMsg(text, isSuccess = false) {
  const msg = document.getElementById('msg');
  if (!msg) return;
  msg.textContent = text || '';
  msg.classList.toggle('success', Boolean(isSuccess));
  msg.classList.remove('shake');
  if (text && !isSuccess) {
    void msg.offsetWidth;
    msg.classList.add('shake');
  }
}

function updateUsernameHint(customDefaultHint) {
  const hintEl = document.getElementById('usernameHint');
  const unInput = document.getElementById('username');
  if (!hintEl || !unInput) return;

  const t = getDict(getActiveLanguageObj());
  const val = (unInput.value || '').trim().replace(/^@+/, '');
  if (val) {
    hintEl.textContent = `${t.handlePrefix} @${val}`;
    hintEl.classList.add('preview-live');
  } else {
    hintEl.textContent = customDefaultHint || t.usernameHint;
    hintEl.classList.remove('preview-live');
  }
}

function applyAppTranslation() {
  const activeLang = getActiveLanguageObj();
  const t = getDict(activeLang);

  document.documentElement.lang = activeLang.code;
  document.documentElement.dir = activeLang.rtl ? 'rtl' : 'ltr';

  const setText = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };
  const setPlaceholder = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.placeholder = val;
  };

  setText('currentLangText', activeLang.name);
  setText('titleHeading', t.title);
  setText('subtitleText', t.subtitle);
  setText('firstNameLabel', t.firstName);
  setText('surnameLabel', t.surname);
  setText('usernameLabel', t.username);
  setPlaceholder('firstName', t.firstNamePlaceholder);
  setPlaceholder('surname', t.surnamePlaceholder);
  setPlaceholder('username', t.usernamePlaceholder);
  setText('nextBtn', t.next);
  setText('haveAccText', t.haveAcc);
  setText('loginLink', t.loginLink);
  setText('langModalTitle', t.modalTitle);
  setPlaceholder('langSearchInput', t.searchPlaceholder);

  updateUsernameHint(t.usernameHint);
}

async function syncLanguageToSupabase(langCode, langName, isRtl) {
  if (!supabaseClient) return;

  try {
    await supabaseClient.auth.updateUser({
      data: {
        language: langCode,
        language_name: langName,
        dir: isRtl ? 'rtl' : 'ltr'
      }
    });
  } catch (e) {}

  try {
    await supabaseClient
      .from('language_preferences')
      .upsert({
        language: langCode,
        language_name: langName,
        dir: isRtl ? 'rtl' : 'ltr',
        updated_at: new Date().toISOString()
      }, { onConflict: 'language' });
  } catch (e) {}
}

function selectLanguage(langObj) {
  currentLangId = langObj.id;
  currentLang = langObj.code;
  const isRtl = Boolean(langObj.rtl);

  safeSetStorage(LANGUAGE_ID_KEY, langObj.id);
  safeSetStorage(LANGUAGE_CODE_KEY, langObj.code);
  safeSetStorage('lang', langObj.code);
  safeSetStorage('autro_language', langObj.code);
  safeSetStorage('autro_language_name', langObj.name);
  safeSetStorage('autro_language_dir', isRtl ? 'rtl' : 'ltr');

  applyAppTranslation();
  buildLangList(document.getElementById('langSearchInput')?.value || '');
  closeLangModal();
  showMsg('');

  syncLanguageToSupabase(langObj.code, langObj.name, isRtl);

  window.dispatchEvent(new CustomEvent('autro:languageChanged', {
    detail: { code: langObj.code, name: langObj.name, rtl: isRtl }
  }));
}

function buildLangList(filterQuery = '') {
  const list = document.getElementById('langList');
  if (!list) return;
  list.innerHTML = '';

  const q = String(filterQuery || '').trim().toLowerCase();
  const filtered = languages.filter(lang =>
    lang.name.toLowerCase().includes(q) ||
    lang.country.toLowerCase().includes(q) ||
    lang.code.toLowerCase().includes(q)
  );

  if (filtered.length === 0) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">No matching language or country found.</div>`;
    return;
  }

  filtered.forEach(language => {
    const isSelected = currentLangId === language.id;
    const item = document.createElement('div');
    item.className = 'lang-item' + (isSelected ? ' selected' : '');
    item.innerHTML = `
      <div class="lang-label-group">
        <span class="lang-name">${escapeHTML(language.name)}</span>
        <span class="lang-country">${escapeHTML(language.country)}</span>
      </div>
      <input
        type="radio"
        class="lang-radio"
        name="modalLang"
        value="${escapeHTML(language.id)}"
        ${isSelected ? 'checked' : ''}
      >
    `;
    item.addEventListener('click', () => {
      selectLanguage(language);
    });
    list.appendChild(item);
  });
}

function openLangModal() {
  const modal = document.getElementById('langModal');
  const searchInput = document.getElementById('langSearchInput');
  if (searchInput) searchInput.value = '';
  buildLangList('');
  if (modal) modal.classList.add('active');
  setTimeout(() => {
    try { searchInput && searchInput.focus(); } catch (_) {}
  }, 100);
}

function closeLangModal() {
  const modal = document.getElementById('langModal');
  if (modal) modal.classList.remove('active');
}

function goNext() {
  const t = getDict(getActiveLanguageObj());

  const fn = (document.getElementById('firstName').value || '').trim();
  const sn = (document.getElementById('surname').value || '').trim();
  const un = (document.getElementById('username').value || '').trim().replace(/^@+/, '');

  if (fn === '') return showMsg(t.err1 || "Please enter your first name");
  if (sn === '') return showMsg(t.err2 || "Please enter your surname");
  if (un === '') return showMsg(t.err3 || "Please enter a username");

  safeSetStorage('signup_firstName', fn);
  safeSetStorage('signup_surname', sn);
  safeSetStorage('signup_username', un);
  safeSetStorage('signup_name', fn + ' ' + sn);
  safeSetStorage('autro_lang', currentLang);
  safeSetStorage(LANGUAGE_ID_KEY, currentLangId);

  navigateSmooth('signup-contact.html');
}

window.addEventListener('DOMContentLoaded', async () => {
  const searchInput = document.getElementById('langSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => buildLangList(e.target.value));
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLangModal();
  });

  buildLangList('');
  applyAppTranslation();

  if (safeGetStorage('signup_firstName')) {
    document.getElementById('firstName').value = safeGetStorage('signup_firstName');
  }
  if (safeGetStorage('signup_surname')) {
    document.getElementById('surname').value = safeGetStorage('signup_surname');
  }
  if (safeGetStorage('signup_username')) {
    document.getElementById('username').value = safeGetStorage('signup_username');
  }
  updateUsernameHint();

  try {
    if (supabaseClient) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('loginFooter').classList.add('hide');
      }
    }
  } catch (err) {
    console.log("Supabase skip:", err);
  }
});
