<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts Feed - Autrobook</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg-color: #ffffff;
    --surface-color: #ffffff;
    --card-bg: #ffffff;
    --subtle-bg: #f3f4f6;
    --input-bg: #f1f3f4;
    --text-color: #202124;
    --muted-color: #5f6368;
    --border-color: #dadce0;
    --hover-color: rgba(32, 33, 36, 0.06);
    --btn-bg: #ffffff;
    --btn-hover-bg: #f3f4f6;
    --btn-text: #202124;
    --btn-border: #dadce0;
    --btn-active-bg: #202124;
    --btn-active-text: #ffffff;
    --accent-link: #1a73e8;
    --badge-bg: rgba(26, 115, 232, 0.1);
    --danger-color: #d93025;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #202124;
      --surface-color: #202124;
      --card-bg: #202124;
      --subtle-bg: #292a2d;
      --input-bg: #292a2d;
      --text-color: #ffffff;
      --muted-color: #9aa0a6;
      --border-color: #3c4043;
      --hover-color: rgba(255, 255, 255, 0.08);
      --btn-bg: #202124;
      --btn-hover-bg: #2c2d30;
      --btn-text: #ffffff;
      --btn-border: #3c4043;
      --btn-active-bg: #ffffff;
      --btn-active-text: #202124;
      --accent-link: #8ab4f8;
      --badge-bg: rgba(138, 180, 248, 0.14);
      --danger-color: #f28b82;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
  }

  .app-shell {
    max-width: 740px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--surface-color);
    display: flex;
    flex-direction: column;
    padding-bottom: 84px;
  }

  /* Top Header */
  .top-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface-color);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }

  .icon-btn:hover {
    background: var(--btn-hover-bg);
  }

  .icon-btn:active {
    transform: scale(0.96);
  }

  .page-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 8px 14px;
    color: var(--muted-color);
  }

  .search-wrap input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-color);
    font-size: 14px;
    outline: none;
  }

  /* Quick Composer Strip */
  .quick-composer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    background: var(--surface-color);
  }

  .mini-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: var(--subtle-bg);
    color: var(--text-color);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    font-weight: 700;
    font-size: 14px;
  }

  .mini-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .composer-trigger {
    flex: 1;
    text-align: left;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--muted-color);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.15s ease;
  }

  .composer-trigger:hover {
    background: var(--btn-hover-bg);
  }

  /* Feed Stream */
  .feed-stream {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 0 28px;
  }

  .post-card {
    background: var(--card-bg);
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  @media (min-width: 640px) {
    .post-card {
      margin: 0 14px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
    }
  }

  .post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .post-author-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .post-author-meta {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .post-author-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .post-time {
    font-size: 12px;
    color: var(--muted-color);
    font-variant-numeric: tabular-nums;
  }

  .header-pills {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .pill-link-btn,
  .owner-action-btn {
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .pill-link-btn:hover,
  .owner-action-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--accent-link);
  }

  .owner-action-btn.delete-btn {
    color: var(--danger-color);
  }

  .owner-action-btn.delete-btn:hover {
    border-color: var(--danger-color);
  }

  /* Clickable post body navigating to comment.html */
  .post-clickable-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    border-radius: 10px;
    transition: opacity 0.15s ease;
  }

  .post-clickable-body:hover {
    opacity: 0.96;
  }

  .post-caption {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text-color);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-caption.bold-text {
    font-weight: 700;
  }

  /* Inline Caption Editor */
  .edit-caption-box {
    display: none;
    flex-direction: column;
    gap: 8px;
    background: var(--subtle-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 10px;
  }

  .edit-caption-box.open {
    display: flex;
  }

  .edit-caption-textarea {
    width: 100%;
    min-height: 82px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.45;
    resize: vertical;
    outline: none;
  }

  .edit-caption-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .edit-save-btn {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--btn-active-bg);
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .edit-cancel-btn {
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .post-media-box {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    background: var(--subtle-bg);
  }

  .post-media-box img,
  .post-media-box video {
    width: 100%;
    max-height: 480px;
    object-fit: cover;
    display: block;
  }

  /* Summary & Counts Row linking to reactions.html and comment.html */
  .post-stats-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    color: var(--muted-color);
    padding-top: 4px;
    flex-wrap: wrap;
  }

  .reactions-summary-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--text-color);
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--subtle-bg);
    border: 1px solid var(--border-color);
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .reactions-summary-link:hover {
    background: var(--btn-hover-bg);
    border-color: var(--accent-link);
  }

  .stats-right-links {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-variant-numeric: tabular-nums;
  }

  .stat-text-link {
    color: var(--muted-color);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    border: none;
    font-size: 12.5px;
    padding: 2px 4px;
  }

  .stat-text-link:hover {
    color: var(--accent-link);
    text-decoration: underline;
  }

  .post-actions-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-color);
  }

  .action-btn {
    height: 38px;
    border-radius: 9px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 13px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.15s ease, transform 0.08s ease;
  }

  .action-btn:hover {
    background: var(--btn-hover-bg);
  }

  .action-btn:active {
    transform: scale(0.98);
  }

  .action-btn.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }

  .comments-drawer {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
  }

  .comments-drawer.open {
    display: flex;
  }

  .drawer-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted-color);
  }

  .drawer-full-link {
    color: var(--accent-link);
    text-decoration: none;
    font-weight: 700;
  }

  .drawer-full-link:hover {
    text-decoration: underline;
  }

  .comment-item {
    background: var(--subtle-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 8px 11px;
    font-size: 13px;
  }

  .comment-author {
    font-weight: 700;
    margin-bottom: 2px;
  }

  .comment-form {
    display: flex;
    gap: 8px;
  }

  .comment-input {
    flex: 1;
    height: 36px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    padding: 0 13px;
    font-size: 13px;
    outline: none;
  }

  .comment-send-btn {
    height: 36px;
    padding: 0 15px;
    border-radius: 999px;
    border: 1px solid var(--btn-active-bg);
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .empty-box {
    margin: 24px 16px;
    padding: 34px 20px;
    border-radius: 16px;
    border: 1px dashed var(--border-color);
    background: var(--subtle-bg);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .primary-pill-link {
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--btn-active-bg);
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
  }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 60px;
    background: var(--surface-color);
    border-top: 1px solid var(--border-color);
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: center;
    z-index: 30;
  }

  .nav-item {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-decoration: none;
    color: var(--muted-color);
    font-size: 17px;
  }

  .nav-item span {
    font-size: 10.5px;
    font-weight: 600;
  }

  .nav-item.active {
    color: var(--text-color);
  }

  .toast-banner {
    position: fixed;
    left: 50%;
    bottom: 74px;
    transform: translateX(-50%);
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border: 1px solid var(--btn-border);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    z-index: 60;
    display: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }

  .toast-banner.show {
    display: block;
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="top-header">
    <div class="header-row">
      <div class="header-left">
        <a href="/index.html" class="icon-btn" title="Home Feed" aria-label="Home Feed">
          <i class="fa-solid fa-house"></i>
        </a>
        <h1 class="page-title">Posts</h1>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="refreshFeedBtn" title="Refresh Posts" aria-label="Refresh Posts">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <a href="/create-post.html?from=post" class="icon-btn" id="createPostPlusBtn" title="Create Post" aria-label="Create Post">
          <i class="fa-solid fa-plus"></i>

    </div>

    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="postSearchInput" placeholder="Search posts or authors...">
    </div>
  </header>

  <section class="quick-composer">
    <div class="mini-avatar" id="headerUserAvatar">A</div>
    <a href="/create-post.html?from=post" class="composer-trigger">What's on your mind? Create a post...</a>
    <a href="/create-post.html?from=post" class="icon-btn" title="New Post" aria-label="New Post">
      <i class="fa-solid fa-plus"></i>
    </a>
  </section>

  <main class="feed-stream" id="postsFeedStream">
    <div class="empty-box" id="loadingBox">
      <i class="fa-regular fa-newspaper" style="font-size:24px;"></i>
      <div style="font-weight:700;">Loading posts...</div>
    </div>
  </main>
</div>

<nav class="bottom-nav" aria-label="Bottom Navigation">
  <a href="/index.html" class="nav-item" title="Home">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>
  <a href="/post.html" class="nav-item active" title="Posts">
    <i class="fa-regular fa-newspaper"></i>
    <span>Posts</span>
  </a>
  <a href="/reels.html" class="nav-item" title="Reels">
    <i class="fa-solid fa-clapperboard"></i>
    <span>Reels</span>
  </a>
  <a href="/create-post.html?from=post" class="nav-item" title="Create">
    <i class="fa-solid fa-plus-circle"></i>
    <span>Create</span>
  </a>
  <a href="/profile.html" class="nav-item" title="Profile">
    <i class="fa-regular fa-user"></i>
    <span>Profile</span>
  </a>
</nav>

<div class="toast-banner" id="toastBanner"></div>

<script>
  const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

  const supabaseClient = (window.AutroAuth && window.AutroAuth.supabase)
    ? window.AutroAuth.supabase
    : (window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null);

  let postSyncChannel = null;
  try {
    if ('BroadcastChannel' in window) {
      postSyncChannel = new BroadcastChannel('autrobook_posts_sync');
    }
  } catch (_) {}

  const feedStreamEl = document.getElementById('postsFeedStream');
  const searchInputEl = document.getElementById('postSearchInput');
  const refreshFeedBtn = document.getElementById('refreshFeedBtn');
  const headerUserAvatarEl = document.getElementById('headerUserAvatar');
  const toastBannerEl = document.getElementById('toastBanner');

  const POST_CACHE_KEYS = [
    'posts',
    'autro_instant_feed_posts',
    'autro_post_cards',
    'autrobook_profile_posts',
    'autro_profile_posts'
  ];

  let currentUser = null;
  let currentProfile = null;
  let allPosts = [];
  let likedPostIds = new Set();
  let searchQuery = '';
  let editingPostId = null;

  function showToast(msg) {
    toastBannerEl.textContent = msg;
    toastBannerEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => {
      toastBannerEl.classList.remove('show');
    }, 2200);
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatTimeAgo(isoOrMs) {
    const ts = typeof isoOrMs === 'number' ? isoOrMs : new Date(isoOrMs || Date.now()).getTime();
    if (Number.isNaN(ts)) return '0s';
    const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (diffSec < 60) return `${diffSec}s`;
    if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m`;
    if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h`;
    return `${Math.floor(diffSec / 86400)}d`;
  }

  function refreshLiveTimestamps() {
    document.querySelectorAll('.post-time[data-created-at]').forEach((el) => {
      el.textContent = formatTimeAgo(el.getAttribute('data-created-at'));
    });
  }

  function getDeletedPostIdSet() {
    const deletedSet = new Set();
    const listKeys = [
      'autro_deleted_post_ids',
      'deleted_post_ids',
      'autro_trashed_post_ids',
      'autro_removed_post_ids'
    ];

    listKeys.forEach((key) => {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(parsed)) {
          parsed.forEach((entry) => {
            if (typeof entry === 'string' || typeof entry === 'number') {
              const clean = String(entry).trim();
              if (clean) deletedSet.add(clean);
            } else if (entry && typeof entry === 'object') {
              const clean = String(entry.id || entry.post_id || '').trim();
              if (clean) deletedSet.add(clean);
            }
          });
        }
      } catch (e) {}
    });

    return deletedSet;
  }

  function recordDeletedPostId(postId) {
    const cleanId = String(postId || '').trim();
    if (!cleanId) return;
    try {
      const existing = JSON.parse(localStorage.getItem('autro_deleted_post_ids') || '[]');
      const set = new Set(Array.isArray(existing) ? existing.map(String) : []);
      set.add(cleanId);
      localStorage.setItem('autro_deleted_post_ids', JSON.stringify(Array.from(set).slice(-120)));
    } catch (_) {}
  }

  function pruneDeletedPostFromLocalCaches(postId) {
    const cleanId = String(postId || '').trim();
    if (!cleanId) return;
    recordDeletedPostId(cleanId);

    POST_CACHE_KEYS.forEach((key) => {
      try {
        const arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(arr)) {
          const filtered = arr.filter((item) => {
            if (!item || typeof item !== 'object') return true;
            const itemId = String(item.id || item.post_id || '').trim();
            return itemId !== cleanId;
          });
          localStorage.setItem(key, JSON.stringify(filtered));
        }
      } catch (e) {}
    });

    try {
      const singleNew = JSON.parse(localStorage.getItem('autro_new_post_created') || 'null');
      if (singleNew && typeof singleNew === 'object') {
        const singleId = String(singleNew.id || singleNew.post_id || '').trim();
        if (singleId === cleanId) {
          localStorage.removeItem('autro_new_post_created');
        }
      }
    } catch (e) {}

    try {
      const latestSession = JSON.parse(sessionStorage.getItem('autro_latest_created_post') || 'null');
      if (latestSession && String(latestSession.id || '') === cleanId) {
        sessionStorage.removeItem('autro_latest_created_post');
      }
    } catch (_) {}
  }

  function syncCaptionAcrossLocalCaches(postId, nextCaption) {
    const cleanId = String(postId || '').trim();
    if (!cleanId) return;

    POST_CACHE_KEYS.forEach((key) => {
      try {
        const arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(arr)) {
          const updated = arr.map((item) => {
            if (!item || typeof item !== 'object') return item;
            const itemId = String(item.id || item.post_id || '').trim();
            if (itemId === cleanId) {
              return { ...item, caption: nextCaption, text: nextCaption };
            }
            return item;
          });
          localStorage.setItem(key, JSON.stringify(updated));
        }
      } catch (_) {}
    });

    try {
      const singleNew = JSON.parse(localStorage.getItem('autro_new_post_created') || 'null');
      if (singleNew && String(singleNew.id || singleNew.post_id || '') === cleanId) {
        localStorage.setItem('autro_new_post_created', JSON.stringify({
          ...singleNew,
          caption: nextCaption,
          text: nextCaption
        }));
      }
    } catch (_) {}

    try {
      if (postSyncChannel) {
        postSyncChannel.postMessage({
          type: 'POST_UPDATED',
          postId: cleanId,
          caption: nextCaption,
          targets: ['/index.html', '/profile.html', '/post.html']
        });
      }
    } catch (_) {}
  }

  function broadcastPostDeletion(postId) {
    const cleanId = String(postId || '').trim();
    if (!cleanId) return;
    try {
      if (postSyncChannel) {
        postSyncChannel.postMessage({
          type: 'DELETE_POST_CARD',
          postId: cleanId,
          id: cleanId,
          targets: ['/index.html', '/profile.html', '/post.html']
        });
        postSyncChannel.postMessage({
          type: 'POST_DELETED',
          postId: cleanId,
          id: cleanId,
          targets: ['/index.html', '/profile.html', '/post.html']
        });
      }
    } catch (_) {}
  }

  async function savePostCaptionEdit(postId, nextCaption) {
    const cleanId = String(postId || '').trim();
    const post = allPosts.find((p) => String(p.id) === cleanId);
    if (!post) return;

    const trimmed = String(nextCaption || '').trim();
    if (!trimmed && !post.media_url) {
      showToast('Post caption cannot be empty without media.');
      return;
    }

    if (supabaseClient && !cleanId.startsWith('local-')) {
      let query = supabaseClient
        .from('posts')
        .update({ caption: trimmed })
        .eq('id', cleanId);
      if (currentUser?.id) {
        query = query.eq('user_id', currentUser.id);
      }
      const { error } = await query;
      if (error) {
        showToast('Failed to update caption: ' + error.message);
        return;
      }
    }

    post.caption = trimmed;
    editingPostId = null;
    syncCaptionAcrossLocalCaches(cleanId, trimmed);
    renderPosts();
    showToast('Caption updated');
  }

  async function deletePostPermanently(postId) {
    const cleanId = String(postId || '').trim();
    if (!cleanId) return;

    if (supabaseClient && !cleanId.startsWith('local-')) {
      let query = supabaseClient
        .from('posts')
        .delete()
        .eq('id', cleanId);
      if (currentUser?.id) {
        query = query.eq('user_id', currentUser.id);
      }
      const { data: deletedRows, error } = await query.select('id');
      if (error) {
        showToast('Delete failed: ' + error.message);
        return;
      }
      if (!deletedRows || deletedRows.length === 0) {
        showToast('Could not delete post (check ownership or RLS).');
        return;
      }
    }

    allPosts = allPosts.filter((p) => String(p.id) !== cleanId);
    if (editingPostId === cleanId) editingPostId = null;
    pruneDeletedPostFromLocalCaches(cleanId);
    broadcastPostDeletion(cleanId);
    renderPosts();
    showToast('Post deleted from Supabase');
  }

  function normalizePost(raw, deletedSet = new Set()) {
    if (!raw || typeof raw !== 'object') return null;
    if (raw.is_reel === true) return null;
    if (raw.archived === true || raw.trashed === true || raw.deleted === true) return null;

    const id = String(raw.id || raw.post_id || '').trim();
    if (!id) return null;
    if (deletedSet.has(id)) return null;

    const caption = String(raw.caption || raw.text || raw.content || '').trim();
    const mediaUrl = String(raw.media_url || raw.image_url || raw.image || raw.video_url || raw.url || '').trim();
    if (!caption && !mediaUrl) return null;

    const mediaTypeRaw = String(raw.media_type || '').toLowerCase();
    const isVideo =
      Boolean(raw.is_video) ||
      mediaTypeRaw.startsWith('video') ||
      /\.(mp4|webm|mov|m4v)(\?|$)/i.test(mediaUrl);

    const rawTime = raw.created_at || raw.posted_at || raw.time || Date.now();
    const isoTime = typeof rawTime === 'number'
      ? new Date(rawTime).toISOString()
      : String(rawTime || new Date().toISOString());

    return {
      id,
      user_id: raw.user_id || '',
      author_name: String(raw.author_name || raw.name || raw.username || 'Autrobook User').trim(),
      author_avatar: String(raw.author_avatar || raw.avatar_url || raw.avatar || '').trim(),
      caption,
      is_bold: Boolean(raw.is_bold),
      media_url: mediaUrl,
      media_type: isVideo ? 'video' : (mediaUrl ? 'image' : 'none'),
      reaction_count: Number(raw.reaction_count ?? raw.likes ?? 0),
      comment_count: Number(raw.comment_count ?? 0),
      share_count: Number(raw.share_count ?? 0),
      created_at: isoTime
    };
  }

  async function loadPosts() {
    const deletedSet = getDeletedPostIdSet();
    deletedSet.forEach((deletedId) => pruneDeletedPostFromLocalCaches(deletedId));

    const supabasePosts = [];
    let supabaseLoadedSuccessfully = false;

    if (supabaseClient) {
      try {
        const { data, error } = await supabaseClient
          .from('posts')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(60);
        if (!error && Array.isArray(data)) {
          supabaseLoadedSuccessfully = true;
          data.forEach((row) => {
            if (row && row.is_reel !== true && row.archived !== true && row.trashed !== true && row.deleted !== true) {
              supabasePosts.push(row);
            }
          });
        }
      } catch (e) {}

      if (currentUser?.id) {
        try {
          const { data: reactions } = await supabaseClient
            .from('post_reactions')
            .select('post_id')
            .eq('user_id', currentUser.id);
          likedPostIds = new Set();
          (reactions || []).forEach((r) => {
            if (r.post_id) likedPostIds.add(String(r.post_id));
          });
        } catch (e) {}
      }
    }

    const collected = [...supabasePosts];
    const supabaseIdSet = new Set(
      supabasePosts
        .map((p) => String(p?.id || p?.post_id || '').trim())
        .filter(Boolean)
    );

    POST_CACHE_KEYS.forEach((key) => {
      try {
        const arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(arr)) {
          arr.forEach((item) => {
            if (!item || typeof item !== 'object') return;
            const itemId = String(item.id || item.post_id || '').trim();
            if (!itemId || deletedSet.has(itemId)) return;
            if (supabaseLoadedSuccessfully && !itemId.startsWith('local-') && !supabaseIdSet.has(itemId)) {
              pruneDeletedPostFromLocalCaches(itemId);
              return;
            }
            collected.push(item);
          });
        }
      } catch (e) {}
    });

    try {
      const singleNew = JSON.parse(localStorage.getItem('autro_new_post_created') || 'null');
      if (singleNew && typeof singleNew === 'object') {
        const singleId = String(singleNew.id || singleNew.post_id || '').trim();
        if (singleId && !deletedSet.has(singleId)) {
          collected.unshift(singleNew);
        }
      }
    } catch (e) {}

    try {
      const latestSession = JSON.parse(sessionStorage.getItem('autro_latest_created_post') || 'null');
      if (latestSession && typeof latestSession === 'object') {
        const sessId = String(latestSession.id || '').trim();
        if (sessId && !deletedSet.has(sessId)) {
          collected.unshift(latestSession);
        }
      }
    } catch (_) {}

    const map = new Map();
    collected.forEach((item) => {
      const norm = normalizePost(item, deletedSet);
      if (norm && norm.id) {
        map.set(norm.id, { ...map.get(norm.id), ...norm });
      }
    });

    allPosts = Array.from(map.values()).sort(
      (a, b) => new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime()
    );
  }

  /* Navigation URL builders for comment.html and reactions.html */
  function buildCommentUrl(post) {
    const u = new URL('/comment.html', window.location.origin);
    u.searchParams.set('type', 'post');
    u.searchParams.set('postId', post.id);
    if (post.user_id) u.searchParams.set('user_id', post.user_id);
    u.searchParams.set('from', 'post');
    return u.toString();
  }

  function buildReactionsUrl(post) {
    const u = new URL('/reactions.html', window.location.origin);
    u.searchParams.set('type', 'post');
    u.searchParams.set('postId', post.id);
    if (post.user_id) u.searchParams.set('user_id', post.user_id);
    u.searchParams.set('from', 'post');
    return u.toString();
  }

  function navigateToComment(postId) {
    const post = allPosts.find((p) => String(p.id) === String(postId));
    if (!post) return;
    window.location.href = buildCommentUrl(post);
  }

  function renderPosts() {
    const q = searchQuery.trim().toLowerCase();
    const list = allPosts.filter((p) => {
      if (!q) return true;
      const hay = `${p.caption || ''} ${p.author_name || ''}`.toLowerCase();
      return hay.includes(q);
    });

    if (!list.length) {
      feedStreamEl.innerHTML = `
        <div class="empty-box">
          <i class="fa-regular fa-newspaper" style="font-size:28px;"></i>
          <div style="font-size:15px;font-weight:700;">No posts found</div>
          <div style="font-size:12.5px;color:var(--muted-color);">Tap + to create a new post.</div>
          <a href="/create-post.html?from=post" class="primary-pill-link"><i class="fa-solid fa-plus"></i> Create Post</a>
        </div>

      return;
    }

    feedStreamEl.innerHTML = list.map((post) => {
      const isLiked = likedPostIds.has(String(post.id));
      const isOwner = Boolean(currentUser?.id && post.user_id && String(post.user_id) === String(currentUser.id)) || String(post.id).startsWith('local-');
      const isEditing = String(editingPostId) === String(post.id);
      const avatarInitial = (post.author_name[0] || 'A').toUpperCase();
      const commentHref = buildCommentUrl(post);
      const reactionsHref = buildReactionsUrl(post);

      const mediaHtml = post.media_url
        ? (post.media_type === 'video'
            ? `<div class="post-media-box"><video src="${escapeHtml(post.media_url)}" controls playsinline preload="metadata"></video></div>`
            : `<div class="post-media-box"><img src="${escapeHtml(post.media_url)}" alt="${escapeHtml(post.author_name)} post"></div>`)
        : '';

      const ownerControlsHtml = isOwner
        ? `
          <button type="button" class="owner-action-btn edit-post-btn" data-id="${escapeHtml(post.id)}" title="Edit Caption">
            <i class="fa-regular fa-pen-to-square"></i>
            <span>Edit</span>
          </button>
          <button type="button" class="owner-action-btn delete-btn delete-post-btn" data-id="${escapeHtml(post.id)}" title="Delete Post">
            <i class="fa-regular fa-trash-can"></i>
            <span>Delete</span>
          </button>
        `
        : '';

      const editBoxHtml = isOwner
        ? `
          <div class="edit-caption-box ${isEditing ? 'open' : ''}" id="edit-box-${escapeHtml(post.id)}">
            <textarea class="edit-caption-textarea" id="edit-textarea-${escapeHtml(post.id)}" placeholder="Update post caption...">${escapeHtml(post.caption || '')}</textarea>
            <div class="edit-caption-actions">
              <button type="button" class="edit-cancel-btn" data-id="${escapeHtml(post.id)}">Cancel</button>
              <button type="button" class="edit-save-btn" data-id="${escapeHtml(post.id)}">Save</button>
            </div>
          </div>
        `
        : '';

      return `
        <article class="post-card" data-post-id="${escapeHtml(post.id)}">
          <div class="post-header">
            <div class="post-author-row">
              <div class="mini-avatar">
                ${post.author_avatar
                  ? `<img src="${escapeHtml(post.author_avatar)}" alt="${escapeHtml(post.author_name)}">`
                  : escapeHtml(avatarInitial)}
              </div>
              <div class="post-author-meta">
                <span class="post-author-name">${escapeHtml(post.author_name)}</span>
                <span class="post-time" data-created-at="${escapeHtml(post.created_at)}">${escapeHtml(formatTimeAgo(post.created_at))}</span>
              </div>
            </div>
            <div class="header-pills">
              ${ownerControlsHtml}
              <a href="${escapeHtml(reactionsHref)}" class="pill-link-btn" title="View Reactions">
                <i class="fa-regular fa-face-smile"></i>
                <span>Reactions</span>
              </a>
              <a href="${escapeHtml(commentHref)}" class="pill-link-btn" title="Open Comments">
                <i class="fa-regular fa-comment"></i>
                <span>Comments</span>
              </a>
            </div>
          </div>

          ${editBoxHtml}

          <div class="post-clickable-body" data-id="${escapeHtml(post.id)}" title="Click post to view full comments">
            ${post.caption
              ? `<div class="post-caption ${post.is_bold ? 'bold-text' : ''}">${escapeHtml(post.caption)}</div>`
              : ''}
            ${mediaHtml}
          </div>

          <div class="post-stats-row">
            <a href="${escapeHtml(reactionsHref)}" class="reactions-summary-link" title="See who reacted to this post">
              <span>❤️ 👍</span>

              <span>Share</span>

          <div class="comments-drawer" id="drawer-${escapeHtml(post.id)}">
            <div class="drawer-top-bar">
              <span>Quick comments</span>

            <div class="comments-list" id="comments-list-${escapeHtml(post.id)}"></div>
            <form class="comment-form" data-id="${escapeHtml(post.id)}">
              <input type="text" class="comment-input" placeholder="Write a quick comment..." required>

  async function loadCommentsForPost(postId, containerEl) {
    if (!containerEl) return;
    if (!supabaseClient) {
      containerEl.innerHTML = `<div class="comment-item">Comments available when connected.</div>`;
      return;
    }
    try {
      const { data } = await supabaseClient
        .from('post_comments')
        .select('id, author_name, comment_text, created_at')
        .eq('post_id', postId)
        .order('created_at', { ascending: true })
        .limit(20);

      if (!Array.isArray(data) || !data.length) {
        containerEl.innerHTML = `<div class="comment-item" style="color:var(--muted-color);">No comments yet.</div>`;
        return;
      }

      containerEl.innerHTML = data.map((c) => `
        <div class="comment-item">
          <div class="comment-author">${escapeHtml(c.author_name || 'User')}</div>
          <div>${escapeHtml(c.comment_text || '')}</div>
        </div>
      `).join('');
    } catch (e) {
      containerEl.innerHTML = '';
    }
  }

  function bindCardInteractions() {
    document.querySelectorAll('.edit-post-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const postId = btn.getAttribute('data-id');
        editingPostId = String(editingPostId) === String(postId) ? null : postId;
        renderPosts();
        if (editingPostId) {
          const ta = document.getElementById(`edit-textarea-${postId}`);
          if (ta) ta.focus();
        }
      });
    });

    document.querySelectorAll('.edit-cancel-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        editingPostId = null;
        renderPosts();
      });
    });

    document.querySelectorAll('.edit-save-btn').forEach((btn) => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const postId = btn.getAttribute('data-id');
        const ta = document.getElementById(`edit-textarea-${postId}`);
        await savePostCaptionEdit(postId, ta ? ta.value : '');
      });
    });

    document.querySelectorAll('.delete-post-btn').forEach((btn) => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const postId = btn.getAttribute('data-id');
        await deletePostPermanently(postId);
      });
    });

    /* Clicking post caption or media opens comment.html */
    document.querySelectorAll('.post-clickable-body').forEach((bodyEl) => {
      bodyEl.addEventListener('click', (e) => {
        if (e.target.closest('video')) return;
        const postId = bodyEl.getAttribute('data-id');
        if (String(editingPostId) === String(postId)) return;
        navigateToComment(postId);
      });
    });

    document.querySelectorAll('.like-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const postId = btn.getAttribute('data-id');
        const post = allPosts.find((p) => String(p.id) === String(postId));
        if (!post) return;

        const alreadyLiked = likedPostIds.has(String(postId));
        if (alreadyLiked) {
          likedPostIds.delete(String(postId));
          post.reaction_count = Math.max(0, Number(post.reaction_count || 0) - 1);
          btn.classList.remove('active');
          btn.querySelector('i').className = 'fa-regular fa-heart';
          if (supabaseClient && currentUser?.id) {
            await supabaseClient.from('post_reactions').delete().eq('post_id', postId).eq('user_id', currentUser.id);
          }
        } else {
          likedPostIds.add(String(postId));
          post.reaction_count = Number(post.reaction_count || 0) + 1;
          btn.classList.add('active');
          btn.querySelector('i').className = 'fa-solid fa-heart';
          if (supabaseClient && currentUser?.id) {
            await supabaseClient.from('post_reactions').upsert({
              post_id: postId,
              user_id: currentUser.id,
              reaction_emoji: '❤️'
            }, { onConflict: 'post_id,user_id' });
          }
        }

        const cardEl = document.querySelector(`.post-card[data-post-id="${CSS.escape(postId)}"]`);
        const likesLabel = cardEl?.querySelector('.stat-likes');
        if (likesLabel) likesLabel.textContent = `${post.reaction_count} reactions`;
      });
    });

    document.querySelectorAll('.comment-form').forEach((form) => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const postId = form.getAttribute('data-id');
        const input = form.querySelector('.comment-input');
        const text = (input?.value || '').trim();
        if (!text) return;

        const authorName = String(
          currentProfile?.full_name ||
          currentProfile?.name ||
          currentUser?.user_metadata?.full_name ||
          localStorage.getItem('autro_profile_name') ||
          'Autrobook User'
        ).trim();

        if (supabaseClient && currentUser?.id) {
          await supabaseClient.from('post_comments').insert({
            post_id: postId,
            user_id: currentUser.id,
            author_name: authorName,
            comment_text: text
          });
        }

        const post = allPosts.find((p) => String(p.id) === String(postId));
        if (post) post.comment_count = Number(post.comment_count || 0) + 1;

        input.value = '';
        await loadCommentsForPost(postId, document.getElementById(`comments-list-${postId}`));
        showToast('Comment posted');
      });
    });

    document.querySelectorAll('.share-post-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const postId = btn.getAttribute('data-id');
        const shareUrl = `${window.location.origin}/comment.html?type=post&postId=${encodeURIComponent(postId)}&from=post`;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(shareUrl);
            showToast('Post link copied');
          } else {
            showToast(shareUrl);
          }
        } catch (e) {
          showToast('Post link ready');
        }
      });
    });
  }

  if (postSyncChannel) {
    postSyncChannel.onmessage = async (ev) => {
      const msg = ev?.data;
      if (!msg || typeof msg !== 'object') return;
      if ((msg.type === 'DELETE_POST_CARD' || msg.type === 'POST_DELETED') && (msg.postId || msg.id)) {
        const delId = String(msg.postId || msg.id);
        pruneDeletedPostFromLocalCaches(delId);
        allPosts = allPosts.filter((p) => String(p.id) !== delId);
        renderPosts();
      } else if (msg.type === 'NEW_POST_CARD' || msg.type === 'CREATE_POST_TO_CARD' || msg.type === 'POST_UPDATED') {
        await loadPosts();
        renderPosts();
      }
    };
  }

  searchInputEl.addEventListener('input', () => {
    searchQuery = searchInputEl.value;
    renderPosts();
  });

  refreshFeedBtn.addEventListener('click', async () => {
    await loadPosts();
    renderPosts();
    showToast('Feed refreshed');
  });

  window.addEventListener('storage', async (e) => {
    if (
      POST_CACHE_KEYS.includes(e.key) ||
      e.key === 'autro_new_post_created' ||
      e.key === 'autro_deleted_post_ids' ||
      e.key === 'deleted_post_ids'
    ) {
      await loadPosts();
      renderPosts();
    }
  });

  window.addEventListener('pageshow', async () => {
    await loadPosts();
    renderPosts();
  });

  setInterval(refreshLiveTimestamps, 1000);

  document.addEventListener('DOMContentLoaded', async () => {
    if (window.AutroAuth && typeof window.AutroAuth.checkSessionAndProfile === 'function') {
      const authResult = await window.AutroAuth.checkSessionAndProfile({ requireCompleteProfile: true });
      if (!authResult || !authResult.user) {
        return;
      }
      currentUser = authResult.user;
      currentProfile = authResult.profile || null;
      localStorage.setItem('autro_user_id', currentUser.id);
    } else {
      window.location.replace('/login.html');
      return;
    }

    renderCurrentUserAvatar();
    await loadPosts();
    renderPosts();

    if (supabaseClient && typeof supabaseClient.channel === 'function') {
      try {
        supabaseClient
          .channel('autrobook-posts-feed')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, async (payload) => {
            if (payload?.eventType === 'DELETE' && payload?.old?.id) {
              pruneDeletedPostFromLocalCaches(payload.old.id);
            }
            await loadPosts();
            renderPosts();
          })
          .subscribe();
      } catch (e) {}
    }
  });
</script>
</body>
  </html>
