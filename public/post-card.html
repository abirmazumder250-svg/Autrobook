<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Post Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #FFFFFF;
      --bg-surface: #FFFFFF;
      --bg-soft: #f0f2f5;
      --bg-hover: #e4e6eb;
      --text-main: #050505;
      --text-muted: #65676b;
      --border-line: rgba(0, 0, 0, 0.12);
      --invert-bg: #050505;
      --invert-fg: #FFFFFF;
      --accent-mint: #10b981;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #202124;
        --bg-surface: #202124;
        --bg-soft: #2a2c30;
        --bg-hover: #35383d;
        --text-main: #e4e6eb;
        --text-muted: #b0b3b8;
        --border-line: rgba(255, 255, 255, 0.14);
        --invert-bg: #FFFFFF;
        --invert-fg: #000000;
        --accent-mint: #10b981;
      }
    }

    html[data-theme="light"],
    body[data-theme="light"] {
      --bg-page: #FFFFFF;
      --bg-surface: #FFFFFF;
      --bg-soft: #f0f2f5;
      --bg-hover: #e4e6eb;
      --text-main: #050505;
      --text-muted: #65676b;
      --border-line: rgba(0, 0, 0, 0.12);
      --invert-bg: #050505;
      --invert-fg: #FFFFFF;
      --accent-mint: #10b981;
    }

    html[data-theme="dark"],
    body[data-theme="dark"] {
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-soft: #2a2c30;
      --bg-hover: #35383d;
      --text-main: #e4e6eb;
      --text-muted: #b0b3b8;
      --border-line: rgba(255, 255, 255, 0.14);
      --invert-bg: #FFFFFF;
      --invert-fg: #000000;
      --accent-mint: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-line);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      text-decoration: none;
      color: var(--text-main);
      background: var(--bg-soft);
      border: 1px solid var(--border-line);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      background: var(--bg-hover);
    }

    .nav-btn.solid {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .feed-stream {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-size: 14.5px;
    }

    .fb-post {
      background: var(--bg-surface);
      border-bottom: 8px solid var(--bg-soft);
      padding-bottom: 6px;
    }

    .fb-post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
      gap: 10px;
    }

    .fb-author-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .fb-post-avatar-link {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-soft);
      border: 1.5px solid var(--accent-mint);
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-main);
      flex-shrink: 0;
    }

    .fb-post-avatar-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fb-author-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .fb-author-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-mint);
      text-decoration: none;
      line-height: 1.2;
    }

    .fb-author-link:hover {
      text-decoration: underline;
    }

    .fb-live-time {
      font-size: 12.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fb-views-right {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .fb-caption {
      padding: 2px 14px 10px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fb-caption.bold-text {
      font-weight: 700;
    }

    .fb-media {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      border-top: 1px solid var(--border-line);
      border-bottom: 1px solid var(--border-line);
    }

    .fb-counts-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-line);
    }

    .fb-reaction-summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text-main);
    }

    .fb-counts-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }

    .fb-action-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border-line);
      margin: 0 8px;
      padding: 3px 0;
    }

    .fb-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      user-select: none;
      touch-action: manipulation;
    }

    .fb-action-btn:hover {
      background: var(--bg-soft);
      color: var(--text-main);
    }

    .fb-action-btn.active {
      color: var(--accent-mint);
      font-weight: 800;
    }

    .reaction-popup {
      position: fixed;
      z-index: 260;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 7px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      user-select: none;
      max-width: calc(100vw - 16px);
    }

    .reaction-popup.open {
      display: flex;
    }

    .reaction-emoji-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .reaction-emoji-btn:hover,
    .reaction-emoji-btn:active {
      background: var(--bg-soft);
      transform: scale(1.22);
    }

    .share-menu {
      position: fixed;
      z-index: 250;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 150px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .share-menu.open {
      display: flex;
    }

    .share-menu-btn {
      background: transparent;
      color: var(--text-main);
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .share-menu-btn:hover {
      background: var(--bg-soft);
    }

    .comments-panel {
      border-top: 1px solid var(--border-line);
      padding: 10px 14px 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .comments-panel.open {
      display: flex;
    }

    .composer-line {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text-pill-input {
      flex: 1;
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 18px;
      padding: 8px 13px;
      font-size: 13.5px;
      outline: none;
    }

    .text-pill-input::placeholder {
      color: var(--text-muted);
    }

    .pill-btn {
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .pill-btn:hover {
      background: var(--bg-hover);
    }

    .pill-btn.solid {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .comment-row {
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comment-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .comment-author-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .comment-author:hover {
      text-decoration: underline;
    }

    .comment-time {
      font-size: 11.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .comment-body {
      font-size: 13.5px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .c-chip-btn {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .c-chip-btn.active {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .replies-list {
      margin-left: 12px;
      padding-left: 10px;
      border-left: 2px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reply-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .reply-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .reply-author {
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
    }

    .reply-time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .dots-menu {
      position: fixed;
      z-index: 260;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 130px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .dots-menu.open {
      display: flex;
    }

    .dots-menu-btn {
      background: transparent;
      color: var(--text-main);
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .dots-menu-btn:hover {
      background: var(--bg-soft);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 320;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      max-width: 410px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reason-option {
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .reason-option.selected {
      background: var(--invert-bg);
      color: var(--invert-fg);
      font-weight: 700;
    }

    .toast-pill {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--invert-bg);
      color: var(--invert-fg);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 420;
      display: none;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-nav-group">
      <a href="/public/index.html" class="nav-btn">
        <i class="fas fa-house"></i>
        <span>Feed</span>
      </a>
      <a href="/public/profile.html" class="nav-btn">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
      <a href="/create-post.html" class="nav-btn solid">
        <i class="fas fa-plus"></i>
        <span>Create Post</span>
      </a>
    </div>
  </header>

  <main id="feedStream" class="feed-stream"></main>

  <div id="reactionPopup" class="reaction-popup"></div>

  <div id="shareMenu" class="share-menu">
    <button type="button" class="share-menu-btn" id="shareToChatOption">
      <i class="fas fa-share"></i>
      <span>Share</span>
    </button>
    <button type="button" class="share-menu-btn" id="copyPostLinkOption">
      <i class="far fa-copy"></i>
      <span>Copy link</span>
    </button>
  </div>

  <div id="dotsMenu" class="dots-menu">
    <button type="button" class="dots-menu-btn" id="saveCommentOption">Save</button>
    <button type="button" class="dots-menu-btn" id="reportCommentOption">Report</button>
  </div>

  <div id="reportModal" class="modal-backdrop">
    <div class="modal-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>Report Comment</b>
        <button type="button" class="pill-btn" id="closeReportBtn">Close</button>
      </div>
      <div id="reportReasonsList" style="display:flex;flex-direction:column;gap:6px;"></div>
      <div class="composer-line" style="margin-top:6px;">
        <button type="button" class="pill-btn solid" id="submitReportBtn" style="flex:1;">Submit</button>
        <button type="button" class="pill-btn solid" id="sendReportBtn" style="flex:1;">Send</button>
      </div>
    </div>
  </div>

  <div id="toastPill" class="toast-pill"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    const REACTIONS = ['❤️', '👍', '🥰', '😆', '😮', '😢', '😠'];
    const REPORT_REASONS = [
      'Spam or misleading promotion',
      'Hate speech or discriminatory content',
      'Harassment or personal attack',
      'Violence or physical threats',
      'Nudity or sexually explicit content',
      'False information or misinformation',
      'Scam or fraudulent activity',
      'Intellectual property or copyright violation',
      'Self-harm or dangerous behavior',
      'Violation of community standards'
    ];

    const HEAVY_STORAGE_KEYS = [
      'autro_instant_feed_posts',
      'autro_post_cards',
      'autro_profile_posts',
      'autro_comments_store',
      'autro_saved_items',
      'autro_comment_reports'
    ];

    const THEME_STORAGE_KEYS = [
      'autro_theme',
      'autrobook_theme',
      'theme',
      'autrobook_dark_mode'
    ];

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    let postSyncChannel = null;
    let themeSyncChannel = null;
    try {
      if ('BroadcastChannel' in window) {
        postSyncChannel = new BroadcastChannel('autrobook_posts_sync');
        themeSyncChannel = new BroadcastChannel('autrobook_theme_sync');
      }
    } catch (_) {}

    let activeUser = null;
    let activeAuthorName = '';
    let activeAvatarUrl = '';
    let postsList = [];
    let commentsByPost = new Map();
    let profilesById = new Map();
    let activeReactionTarget = null;
    let activeSharePost = null;
    let activeCommentMenuData = null;
    let selectedReason = REPORT_REASONS[0];
    let audioCtx = null;
    let ignoreNextDocumentClick = false;

    let mediaRecorder = null;
    let voiceChunks = [];
    let recordedVoiceUrl = '';
    let recordedVoiceSec = 0;
    let recordingPostId = null;
    let isRecording = false;
    let voiceTimer = null;

    function normalizeTheme(val) {
      if (!val) return null;
      const v = String(val).toLowerCase().trim();
      if (v === 'dark' || v === 'true' || v === '1') return 'dark';
      if (v === 'light' || v === 'false' || v === '0') return 'light';
      return null;
    }

    function applyPageTheme(themeVal) {
      const normalized = normalizeTheme(themeVal);
      if (normalized) {
        document.documentElement.setAttribute('data-theme', normalized);
        if (document.body) document.body.setAttribute('data-theme', normalized);
      } else {
        document.documentElement.removeAttribute('data-theme');
        if (document.body) document.body.removeAttribute('data-theme');
      }
    }

    function initThemeSync() {
      for (const key of THEME_STORAGE_KEYS) {
        try {
          const val = localStorage.getItem(key);
          const norm = normalizeTheme(val);
          if (norm) {
            applyPageTheme(norm);
            break;
          }
        } catch (_) {}
      }

      window.addEventListener('storage', (e) => {
        if (e && THEME_STORAGE_KEYS.includes(e.key)) {
          applyPageTheme(e.newValue);
        }
      });

      window.addEventListener('autro:theme-updated', (ev) => {
        applyPageTheme(ev?.detail?.theme);
      });

      if (themeSyncChannel) {
        themeSyncChannel.onmessage = (ev) => {
          if (ev?.data?.type === 'THEME_SYNC') {
            applyPageTheme(ev.data.theme);
          }
        };
      }
    }

    function pruneHeavyLocalKeys() {
      for (const key of HEAVY_STORAGE_KEYS) {
        try {
          const val = localStorage.getItem(key);
          if (val && val.length > 200000) {
            localStorage.removeItem(key);
          }
        } catch (_) {}
      }
    }

    function safeLocalStorageSet(key, valueStr) {
      const cleanStr = String(valueStr || '');
      if (!cleanStr || cleanStr.includes('data:image/') || cleanStr.includes('data:video/') || cleanStr.includes('data:audio/')) {
        return false;
      }
      if (cleanStr.length > 240000) {
        return false;
      }
      try {
        localStorage.setItem(key, cleanStr);
        return true;
      } catch (_) {
        pruneHeavyLocalKeys();
        for (const k of HEAVY_STORAGE_KEYS) {
          if (k !== key) {
            try { localStorage.removeItem(k); } catch (_) {}
          }
        }
        try {
          localStorage.setItem(key, cleanStr);
          return true;
        } catch (_) {
          try { localStorage.removeItem(key); } catch (__) {}
          return false;
        }
      }
    }

    function safeJsonParse(raw, fallback) {
      try {
        const parsed = raw ? JSON.parse(raw) : fallback;
        return parsed ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toastPill');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._pcToast);
      window._pcToast = setTimeout(() => { el.style.display = 'none'; }, 2200);
    }

    function playReactionSound() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(560, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (_) {}
    }

    function formatLiveElapsed(createdAtStr) {
      if (!createdAtStr) return '0s';
      const createdMs = new Date(createdAtStr).getTime();
      if (Number.isNaN(createdMs)) return '0s';
      const diffSec = Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}d`;
    }

    function resolveSavedAvatarUrl(raw) {
      const val = String(raw || '').trim();
      if (!val) return '';
      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:') || val.startsWith('blob:')) {
        return val;
      }
      if (sb) {
        return sb.storage.from('avatars').getPublicUrl(val.replace(/^\/+/, '')).data.publicUrl || '';
      }
      return '';
    }

    function resolvePostMediaUrl(raw) {
      const val = String(raw || '').trim();
      if (!val) return '';
      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:') || val.startsWith('blob:')) {
        return val;
      }
      if (sb) {
        return sb.storage.from('media').getPublicUrl(val.replace(/^\/+/, '')).data.publicUrl || '';
      }
      return '';
    }

    function normalizeIncomingPost(rawPost) {
      if (!rawPost || typeof rawPost !== 'object') return null;
      const id = String(rawPost.id || rawPost.post_id || `local-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`).trim();
      const mediaUrl = String(rawPost.media_url || rawPost.image_url || rawPost.mediaUrl || rawPost.imageUrl || '').trim();
      const mediaType = String(rawPost.media_type || rawPost.mediaType || '').toLowerCase();
      const isVideo = Boolean(rawPost.is_video || rawPost.isVideo || mediaType.startsWith('video') || /\.(mp4|webm|ogg|mov)(\?|$)/i.test(mediaUrl));

      return {
        id,
        user_id: String(rawPost.user_id || rawPost.author_id || rawPost.userId || activeUser?.id || '').trim(),
        author_name: '',
        caption: String(rawPost.caption || rawPost.content || rawPost.text || '').trim(),
        is_bold: Boolean(rawPost.is_bold || rawPost.isBold),
        media_url: mediaUrl,
        is_video: isVideo,
        reaction_count: Number(rawPost.reaction_count ?? rawPost.reactions ?? 0),
        comment_count: Number(rawPost.comment_count ?? rawPost.comments ?? 0),
        share_count: Number(rawPost.share_count ?? rawPost.shares ?? 0),
        view_count: Number(rawPost.view_count ?? rawPost.views ?? 0),
        created_at: rawPost.created_at || rawPost.posted_at || rawPost.createdAt || new Date().toISOString()
      };
    }

    function publishPostToTargets(postObj) {
      const normalized = normalizeIncomingPost(postObj);
      if (!normalized) return;

      const storeKeys = ['autro_instant_feed_posts', 'autro_post_cards', 'autro_profile_posts'];
      storeKeys.forEach((key) => {
        const existing = safeJsonParse(localStorage.getItem(key), []);
        const list = Array.isArray(existing) ? existing.filter(x => x && String(x.id) !== normalized.id) : [];
        const updated = [normalized, ...list].slice(0, 30);
        safeLocalStorageSet(key, JSON.stringify(updated));
      });

      try {
        sessionStorage.setItem('autro_latest_created_post', JSON.stringify(normalized));
      } catch (_) {}

      try {
        if (postSyncChannel) {
          postSyncChannel.postMessage({
            type: 'NEW_POST_CARD',
            targets: ['/public/profile.html', '/public/index.html'],
            post: normalized
          });
        }
      } catch (_) {}

      try {
        window.dispatchEvent(new CustomEvent('autro:post-created', {
          detail: {
            post: normalized,
            targets: ['/public/profile.html', '/public/index.html']
          }
        }));
      } catch (_) {}
    }

    async function applyReaction(target, emoji) {
      if (!target) return;

      if (target.type === 'post') {
        const post = postsList.find(p => p.id === target.postId);
        if (!post) return;

        if (post.userReaction === emoji) {
          post.userReaction = null;
          post.reaction_count = Math.max(0, Number(post.reaction_count || 0) - 1);
          writeLocalReactionState(post.id, {
            emoji: null,
            count: post.reaction_count
          });
          if (activeUser && sb && !String(post.id).startsWith('local-')) {
            await sb.from('post_reactions').delete().eq('post_id', post.id).eq('user_id', activeUser.id);
          }
          await syncPostReactionCount(post.id, post.reaction_count);
          renderPostsStream();
          showToast('Reaction removed');
          return;
        }

        if (!post.userReaction) {
          post.reaction_count = Number(post.reaction_count || 0) + 1;
        }
        post.userReaction = emoji;
        writeLocalReactionState(post.id, {
          emoji: post.userReaction,
          count: post.reaction_count
        });

        if (activeUser && sb && !String(post.id).startsWith('local-')) {
          await sb.from('post_reactions').upsert(
            { post_id: post.id, user_id: activeUser.id, reaction_emoji: emoji },
            { onConflict: 'post_id,user_id' }
          );
        }
        await syncPostReactionCount(post.id, post.reaction_count);
        renderPostsStream();
      } else if (target.type === 'comment') {
        const list = commentsByPost.get(target.postId) || readLocalComments(target.postId);
        const cmt = list.find(c => c.id === target.commentId);
        if (!cmt) return;

        if (cmt.userReaction === emoji) {
          cmt.userReaction = null;
          cmt.like_count = Math.max(0, Number(cmt.like_count || 0) - 1);
          commentsByPost.set(target.postId, list);
          writeLocalComments(target.postId, list);
          renderPostsStream();
          showToast('Reaction removed');
          return;
        }

        if (!cmt.userReaction) {
          cmt.like_count = Number(cmt.like_count || 0) + 1;
        }
        cmt.userReaction = emoji;
        commentsByPost.set(target.postId, list);
        writeLocalComments(target.postId, list);
        renderPostsStream();
      }
    }

    async function toggleVoiceRecord(postId, recordBtn, statusLabel, clearBtn) {
      if (!isRecording) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          showToast('Voice recording is not supported on this browser.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceChunks = [];
          recordedVoiceUrl = '';
          recordedVoiceSec = 0;
          recordingPostId = postId;
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) voiceChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(voiceTimer);
            isRecording = false;
            recordBtn.textContent = '30s Voice';
            const blob = new Blob(voiceChunks, { type: 'audio/webm' });
            recordedVoiceUrl = URL.createObjectURL(blob);
            statusLabel.textContent = `Voice ready (${recordedVoiceSec}s)`;
            clearBtn.style.display = 'inline-block';
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.textContent = 'Stop';
          clearBtn.style.display = 'none';
          statusLabel.textContent = '0s / 30s';

          voiceTimer = setInterval(() => {
            recordedVoiceSec += 1;
            statusLabel.textContent = `${recordedVoiceSec}s / 30s`;
            if (recordedVoiceSec >= 30 && mediaRecorder && mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          }, 1000);
        } catch (_) {
          showToast('Microphone access is required for voice comment.');
        }
      } else if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

          ownerProf?.avatar_url ||

          ''
        );

        commentBtn.type = 'button';
        commentBtn.className = 'fb-action-btn';
        commentBtn.innerHTML = `<i class="far fa-comment"></i><span>Comment</span>`;

        const shareBtn = document.createElement('button');
        shareBtn.type = 'button';
        shareBtn.className = 'fb-action-btn';
        shareBtn.innerHTML = `<i class="fas fa-share"></i><span>Share</span>`;
        bindShareLongPress(shareBtn, post);

        actionBar.appendChild(likeBtn);
        actionBar.appendChild(commentBtn);
        actionBar.appendChild(shareBtn);
        article.appendChild(actionBar);

        const commentsPanel = document.createElement('div');
        commentsPanel.className = `comments-panel ${post._commentsOpen ? 'open' : ''}`;

        commentBtn.onclick = () => {
          post._commentsOpen = !post._commentsOpen;
          renderPostsStream();
        };

        const composerBox = document.createElement('div');
        composerBox.style.display = 'flex';
        composerBox.style.flexDirection = 'column';
        composerBox.style.gap = '7px';

        const line1 = document.createElement('div');
        line1.className = 'composer-line';

        const commentInput = document.createElement('input');
        commentInput.type = 'text';
        commentInput.className = 'text-pill-input';
        commentInput.placeholder = 'Write a comment...';

        const sendBtn = document.createElement('button');
        sendBtn.type = 'button';
        sendBtn.className = 'pill-btn solid';
        sendBtn.textContent = 'Send';

        const line2 = document.createElement('div');
        line2.className = 'composer-line';

        const voiceBtn = document.createElement('button');
        voiceBtn.type = 'button';
        voiceBtn.className = 'pill-btn';
        voiceBtn.textContent = '30s Voice';

        const voiceStatus = document.createElement('span');
        voiceStatus.style.fontSize = '12px';
        voiceStatus.style.color = 'var(--text-muted)';

        const clearVoiceBtn = document.createElement('button');
        clearVoiceBtn.type = 'button';
        clearVoiceBtn.className = 'pill-btn';
        clearVoiceBtn.textContent = 'Clear';
        clearVoiceBtn.style.display = 'none';

        voiceBtn.onclick = () => toggleVoiceRecord(post.id, voiceBtn, voiceStatus, clearVoiceBtn);
        clearVoiceBtn.onclick = () => {
          if (recordedVoiceUrl) URL.revokeObjectURL(recordedVoiceUrl);
          recordedVoiceUrl = '';
          recordedVoiceSec = 0;
          voiceStatus.textContent = '';
          clearVoiceBtn.style.display = 'none';
        };

        sendBtn.onclick = async () => {
          const textVal = commentInput.value.trim();
          const hasVoice = recordingPostId === post.id && Boolean(recordedVoiceUrl);
          if (!textVal && !hasVoice) return;

          const newComment = {
            id: `cmt-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            user_id: activeUser?.id || null,
            author: '',
            text: textVal,
            voiceUrl: hasVoice ? recordedVoiceUrl : '',
            voiceSec: hasVoice ? recordedVoiceSec : 0,
            created_at: new Date().toISOString(),
            like_count: 0,
            dislike_count: 0,
            userReaction: null,
            disliked: false,
            replies: []
          };

          const updated = [...comments, newComment];
          commentsByPost.set(post.id, updated);
          writeLocalComments(post.id, updated);
          post.comment_count = Math.max(Number(post.comment_count || 0) + 1, updated.length);

          if (sb && activeUser && !String(post.id).startsWith('local-')) {
            try {
              const { data: inserted } = await sb
                .from('post_comments')
                .insert({
                  post_id: post.id,
                  user_id: activeUser.id,
                  author_name: '',
                  comment_text: newComment.text || (hasVoice ? 'Voice comment' : ''),
                  voice_url: newComment.voiceUrl,
                  voice_duration_sec: Math.min(30, newComment.voiceSec)
                })
                .select('id')
                .maybeSingle();
              if (inserted?.id) {
                newComment.id = inserted.id;
                writeLocalComments(post.id, updated);
              }
              await sb
                .from('posts')
                .update({ comment_count: updated.length })
                .eq('id', post.id);
            } catch (_) {}
          }

          if (hasVoice) {
            recordedVoiceUrl = '';
            recordedVoiceSec = 0;
            recordingPostId = null;
          }
          commentInput.value = '';
          post._commentsOpen = true;
          renderPostsStream();
        };

        line1.appendChild(commentInput);
        line1.appendChild(sendBtn);
        line2.appendChild(voiceBtn);
        line2.appendChild(voiceStatus);
        line2.appendChild(clearVoiceBtn);
        composerBox.appendChild(line1);
        composerBox.appendChild(line2);
        commentsPanel.appendChild(composerBox);

        comments.forEach(cmt => {
          const cRow = document.createElement('div');
          cRow.className = 'comment-row';

          const cTop = document.createElement('div');
          cTop.className = 'comment-top';

          const cAuthorWrap = document.createElement('div');
          cAuthorWrap.className = 'comment-author-wrap';

          const cAuth = document.createElement('a');
          cAuth.href = buildProfileHref(cmt.user_id || '');
          cAuth.className = 'comment-author';
          cAuth.innerHTML = '<i class="fas fa-link" style="font-size:10px;"></i> <span>Profile</span>';

          const cTime = document.createElement('span');
          cTime.className = 'comment-time fb-live-time';
          cTime.dataset.createdAt = cmt.created_at || '';
          cTime.textContent = formatLiveElapsed(cmt.created_at);

          cAuthorWrap.appendChild(cAuth);
          cAuthorWrap.appendChild(cTime);

          const dotsBtn = document.createElement('button');
          dotsBtn.type = 'button';
          dotsBtn.className = 'pill-btn';
          dotsBtn.textContent = '⋮';
          dotsBtn.onclick = (e) => {
            e.stopPropagation();
            openDotsMenu(dotsBtn, post.id, cmt);
          };

          cTop.appendChild(cAuthorWrap);
          cTop.appendChild(dotsBtn);
          cRow.appendChild(cTop);

          if (cmt.text) {
            const cBody = document.createElement('div');
            cBody.className = 'comment-body';
            cBody.textContent = cmt.text;
            cRow.appendChild(cBody);
          }

          if (cmt.voiceUrl) {
            const audioEl = document.createElement('audio');
            audioEl.controls = true;
            audioEl.src = cmt.voiceUrl;
            audioEl.style.width = '100%';
            cRow.appendChild(audioEl);
          }

          const cActions = document.createElement('div');
          cActions.className = 'comment-actions';

          const cLikeBtn = document.createElement('button');
          cLikeBtn.type = 'button';
          cLikeBtn.className = `c-chip-btn ${cmt.userReaction ? 'active' : ''}`;
          cLikeBtn.textContent = cmt.userReaction
            ? `${cmt.userReaction} ${Number(cmt.like_count || 0)}`
            : `👍 Like ${Number(cmt.like_count || 0)}`;
          bindReactionButton(cLikeBtn, { type: 'comment', postId: post.id, commentId: cmt.id }, '👍');

          const cDislikeBtn = document.createElement('button');
          cDislikeBtn.type = 'button';
          cDislikeBtn.className = `c-chip-btn ${cmt.disliked ? 'active' : ''}`;
          cDislikeBtn.textContent = `👎 Dislike ${Number(cmt.dislike_count || 0)}`;
          cDislikeBtn.onclick = () => {
            cmt.disliked = !cmt.disliked;
            cmt.dislike_count = Math.max(0, Number(cmt.dislike_count || 0) + (cmt.disliked ? 1 : -1));
            commentsByPost.set(post.id, comments);
            writeLocalComments(post.id, comments);
            renderPostsStream();
          };

          const replyBtn = document.createElement('button');
          replyBtn.type = 'button';
          replyBtn.className = 'c-chip-btn';
          replyBtn.textContent = `Reply ${Array.isArray(cmt.replies) && cmt.replies.length ? `(${cmt.replies.length})` : ''}`.trim();

          cActions.appendChild(cLikeBtn);
          cActions.appendChild(cDislikeBtn);
          cActions.appendChild(replyBtn);
          cRow.appendChild(cActions);

          const replyComposer = document.createElement('div');
          replyComposer.className = 'composer-line';
          replyComposer.style.display = 'none';

          const replyInput = document.createElement('input');
          replyInput.type = 'text';
          replyInput.className = 'text-pill-input';
          replyInput.placeholder = 'Write a reply...';

          const replySendBtn = document.createElement('button');
          replySendBtn.type = 'button';
          replySendBtn.className = 'pill-btn solid';
          replySendBtn.textContent = 'Send';

          replySendBtn.onclick = async () => {
            const rVal = replyInput.value.trim();
            if (!rVal) return;
            cmt.replies = Array.isArray(cmt.replies) ? cmt.replies : [];
            cmt.replies.push({
              id: `rep-${Date.now()}`,
              user_id: activeUser?.id || null,
              author: '',
              text: rVal,
              created_at: new Date().toISOString()
            });
            commentsByPost.set(post.id, comments);
            writeLocalComments(post.id, comments);

            if (sb && activeUser && !String(post.id).startsWith('local-') && !String(cmt.id).startsWith('cmt-')) {
              try {
                await sb.from('post_comments').insert({
                  post_id: post.id,
                  user_id: activeUser.id,
                  parent_id: cmt.id,
                  author_name: '',
                  comment_text: rVal
                });
              } catch (_) {}
            }
            renderPostsStream();
          };

          replyBtn.onclick = () => {
            replyComposer.style.display = replyComposer.style.display === 'none' ? 'flex' : 'none';
          };

          replyComposer.appendChild(replyInput);
          replyComposer.appendChild(replySendBtn);
          cRow.appendChild(replyComposer);

          if (Array.isArray(cmt.replies) && cmt.replies.length > 0) {
            const repList = document.createElement('div');
            repList.className = 'replies-list';
            cmt.replies.forEach(rep => {
              const rCard = document.createElement('div');
              rCard.className = 'reply-card';

              const rHead = document.createElement('div');
              rHead.className = 'reply-head';

              const rAuth = document.createElement('a');
              rAuth.href = buildProfileHref(rep.user_id || '');
              rAuth.className = 'reply-author';
              rAuth.innerHTML = '<i class="fas fa-link" style="font-size:10px;"></i> <span>Profile</span>';

              const rTime = document.createElement('span');
              rTime.className = 'reply-time fb-live-time';
              rTime.dataset.createdAt = rep.created_at || '';
              rTime.textContent = formatLiveElapsed(rep.created_at);

              const rText = document.createElement('div');
              rText.textContent = rep.text || '';

              rHead.appendChild(rAuth);
              rHead.appendChild(rTime);
              rCard.appendChild(rHead);
              rCard.appendChild(rText);
              repList.appendChild(rCard);
            });
            cRow.appendChild(repList);
          }

          commentsPanel.appendChild(cRow);
        });

        article.appendChild(commentsPanel);
        stream.appendChild(article);
        incrementPostView(post);
      });
    }

    function refreshLiveTimersOnly() {
      document.querySelectorAll('.fb-live-time').forEach(el => {
        el.textContent = formatLiveElapsed(el.dataset.createdAt);
      });
    }

    function ingestIncomingPostToFeed(rawPost, broadcastToTargets = false) {
      const norm = normalizeIncomingPost(rawPost);
      if (!norm) return;

      const localReactions = readLocalReactionState();
      const sharedSet = readSharedPostsSet();
      const locR = localReactions[norm.id];

      const cardItem = {
        ...norm,
        reaction_count: Math.max(norm.reaction_count, Number(locR?.count || 0)),
        share_count: Math.max(norm.share_count, Number(sharedSet[norm.id] || 0)),
        userReaction: locR?.emoji || null,
        _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, norm.id),
        _commentsOpen: false
      };

      const idx = postsList.findIndex(p => p.id === cardItem.id);
      if (idx >= 0) {
        postsList[idx] = { ...postsList[idx], ...cardItem };
      } else {
        postsList.unshift(cardItem);
      }

      if (broadcastToTargets) {
        publishPostToTargets(norm);
      }

      renderPostsStream();
    }

    async function loadPostsStream() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetPostId = urlParams.get('post');
      const localReactions = readLocalReactionState();
      const sharedSet = readSharedPostsSet();
      const map = new Map();

      if (sb) {
        try {
          const { data: rows, error } = await sb
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(30);

          if (!error && Array.isArray(rows)) {
            rows.forEach(r => {
              const norm = normalizeIncomingPost(r);
              if (!norm) return;
              const locR = localReactions[norm.id];
              const resolvedCount = Math.max(norm.reaction_count, Number(locR?.count || 0));
              const resolvedShare = Math.max(norm.share_count, Number(sharedSet[norm.id] || 0));

              map.set(norm.id, {
                ...norm,
                author_name: '',
                reaction_count: resolvedCount,
                share_count: resolvedShare,
                userReaction: locR?.emoji || null,
                _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, norm.id),
                _commentsOpen: Boolean(targetPostId && targetPostId === norm.id)
              });
            });
          }

          if (map.size > 0) {
            const ids = Array.from(map.keys());
            const { data: shareRows } = await sb.from('post_shares').select('post_id').in('post_id', ids);
            if (Array.isArray(shareRows)) {
              const sMap = new Map();
              shareRows.forEach(sr => sMap.set(sr.post_id, (sMap.get(sr.post_id) || 0) + 1));
              sMap.forEach((cnt, pid) => {
                const p = map.get(pid);
                if (p) p.share_count = Math.max(Number(p.share_count || 0), cnt);
              });
            }

            if (activeUser) {
              const { data: myReactions } = await sb
                .from('post_reactions')
                .select('post_id, reaction_emoji')
                .eq('user_id', activeUser.id)
                .in('post_id', ids);

              (myReactions || []).forEach(mr => {
                const p = map.get(mr.post_id);
                if (p) {
                  p.userReaction = mr.reaction_emoji;
                  writeLocalReactionState(p.id, {
                    emoji: p.userReaction,
                    count: p.reaction_count
                  });
                }
              });
            }
          }
        } catch (_) {}
      }

      const q0 = safeJsonParse(sessionStorage.getItem('autro_latest_created_post'), null);
      const q1 = safeJsonParse(localStorage.getItem('autro_instant_feed_posts'), []);
      const q2 = safeJsonParse(localStorage.getItem('autro_post_cards'), []);
      const q3 = safeJsonParse(localStorage.getItem('autro_profile_posts'), []);
      const combined = [
        ...(q0 ? [q0] : []),
        ...(Array.isArray(q1) ? q1 : []),
        ...(Array.isArray(q2) ? q2 : []),
        ...(Array.isArray(q3) ? q3 : [])
      ];

      combined.forEach(item => {
        const norm = normalizeIncomingPost(item);
        if (!norm) return;
        const locR = localReactions[norm.id];
        const existing = map.get(norm.id);

        if (existing) {
          existing.caption = existing.caption || norm.caption;
          existing.media_url = existing.media_url || norm.media_url;
          existing.author_name = '';
          existing.reaction_count = Math.max(existing.reaction_count, norm.reaction_count, Number(locR?.count || 0));
          existing.share_count = Math.max(existing.share_count, norm.share_count, Number(sharedSet[norm.id] || 0));
          return;
        }

        map.set(norm.id, {
          ...norm,
          author_name: '',
          reaction_count: Math.max(norm.reaction_count, Number(locR?.count || 0)),
          share_count: Math.max(norm.share_count, Number(sharedSet[norm.id] || 0)),
          userReaction: locR?.emoji || null,
          _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, norm.id),
          _commentsOpen: Boolean(targetPostId && targetPostId === norm.id)
        });
      });

      let arr = Array.from(map.values()).sort(
        (a, b) => new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime()
      );

      if (targetPostId && map.has(targetPostId)) {
        const focused = map.get(targetPostId);
        arr = [focused, ...arr.filter(x => x.id !== targetPostId)];
      }

      postsList = arr;
      renderPostsStream();
    }

    function bindCreatePostListeners() {
      if (postSyncChannel) {
        postSyncChannel.onmessage = (ev) => {
          const d = ev?.data;
          if (!d) return;
          if ((d.type === 'CREATE_POST_TO_CARD' || d.type === 'NEW_POST_CARD') && d.post) {
            ingestIncomingPostToFeed(d.post, d.type === 'CREATE_POST_TO_CARD');
          }
        };
      }

      window.addEventListener('message', (ev) => {
        const d = ev?.data;
        if (!d || typeof d !== 'object') return;
        if ((d.type === 'CREATE_POST_TO_CARD' || d.type === 'NEW_POST_CARD') && d.post) {
          ingestIncomingPostToFeed(d.post, d.type === 'CREATE_POST_TO_CARD');
        }
      });

      window.addEventListener('autro:create-post', (ev) => {
        const postPayload = ev?.detail?.post || ev?.detail;
        if (postPayload) {
          ingestIncomingPostToFeed(postPayload, true);
        }
      });

      window.addEventListener('storage', (e) => {
        if (!e || !e.key) return;
        if (['autro_instant_feed_posts', 'autro_post_cards', 'autro_profile_posts'].includes(e.key)) {
          const list = safeJsonParse(e.newValue, []);
          if (Array.isArray(list) && list.length > 0) {
            publishPostToTargets(list[0]);
            loadPostsStream();
          }
        }
      });
    }

    function subscribeRealtimePosts() {
      if (!sb || typeof sb.channel !== 'function') return;
      try {
        sb.channel('autro-post-card-live')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, (payload) => {
            const row = payload.new || payload.old;
            if (!row || !row.id) return;
            if (payload.eventType === 'DELETE') {
              postsList = postsList.filter(p => p.id !== row.id);
              renderPostsStream();
              return;
            }
            const existing = postsList.find(p => p.id === row.id);
            if (existing) {
              existing.author_name = '';
              existing.caption = String(row.caption ?? existing.caption ?? '').trim();
              existing.reaction_count = Math.max(existing.reaction_count, Number(row.reaction_count ?? 0));
              existing.comment_count = Number(row.comment_count ?? existing.comment_count ?? 0);
              existing.share_count = Math.max(existing.share_count, Number(row.share_count ?? 0));
              existing.view_count = Math.max(existing.view_count, Number(row.view_count ?? 0));
              publishPostToTargets(existing);
              renderPostsStream();
            } else if (payload.eventType === 'INSERT') {
              ingestIncomingPostToFeed(row, true);
            }
          })
          .subscribe();
      } catch (_) {}
    }

    document.getElementById('shareToChatOption').addEventListener('click', () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      try {
        sessionStorage.setItem('autro_shared_post_payload', JSON.stringify({
          postId: activeSharePost.id,
          url: postUrl,
          caption: activeSharePost.caption || '',
          assets: ['autro-chat.html', 'autro-chat.css', 'autro-chat.js']
        }));
      } catch (_) {}
      closeShareMenu();
      window.location.href = `autro-chat.html?share=${encodeURIComponent(postUrl)}&assets=autro-chat.html,autro-chat.css,autro-chat.js`;
    });

    document.getElementById('copyPostLinkOption').addEventListener('click', async () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(postUrl);
        } else {
          const tmp = document.createElement('textarea');
          tmp.value = postUrl;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand('copy');
          tmp.remove();
        }
        showToast('Link copied');
      } catch (_) {
        showToast('Could not copy link');
      }
      closeShareMenu();
    });

    document.getElementById('saveCommentOption').addEventListener('click', async () => {
      if (!activeCommentMenuData) return;
      const savedList = safeJsonParse(localStorage.getItem('autro_saved_items'), []);
      const cleanComment = {
        ...activeCommentMenuData.comment,
        voiceUrl: typeof activeCommentMenuData.comment?.voiceUrl === 'string' && activeCommentMenuData.comment.voiceUrl.startsWith('blob:')
          ? ''
          : (activeCommentMenuData.comment?.voiceUrl || '')
      };
      const nextSaved = [{
        type: 'comment',
        postId: activeCommentMenuData.postId,
        comment: cleanComment,
        savedAt: new Date().toISOString()
      }, ...(Array.isArray(savedList) ? savedList : [])].slice(0, 25);
      safeLocalStorageSet('autro_saved_items', JSON.stringify(nextSaved));

      if (sb && activeUser && !String(activeCommentMenuData.comment.id).startsWith('cmt-')) {
        try {
          await sb.from('saved_items').insert({
            user_id: activeUser.id,
            post_id: String(activeCommentMenuData.postId).startsWith('local-') ? null : activeCommentMenuData.postId,
            comment_id: activeCommentMenuData.comment.id
          });
        } catch (_) {}
      }

      closeDotsMenu();
      showToast('Saved');
      window.location.href = 'save-item.html';
    });

    document.getElementById('reportCommentOption').addEventListener('click', openReportModal);
    document.getElementById('closeReportBtn').addEventListener('click', closeReportModal);
    document.getElementById('submitReportBtn').addEventListener('click', () => submitReportAction('Submit'));
    document.getElementById('sendReportBtn').addEventListener('click', () => submitReportAction('Send'));

    document.addEventListener('click', (e) => {
      if (ignoreNextDocumentClick) {
        ignoreNextDocumentClick = false;
        return;
      }
      const popup = document.getElementById('reactionPopup');
      if (popup.classList.contains('open') && !popup.contains(e.target)) {
        closeReactionPopup();
      }
      const sMenu = document.getElementById('shareMenu');
      if (sMenu.classList.contains('open') && !sMenu.contains(e.target)) {
        closeShareMenu();
      }
      const dMenu = document.getElementById('dotsMenu');
      if (dMenu.classList.contains('open') && !dMenu.contains(e.target)) {
        closeDotsMenu();
      }
    });

    setInterval(refreshLiveTimersOnly, 1000);

    window.addEventListener('DOMContentLoaded', async () => {
      initThemeSync();
      pruneHeavyLocalKeys();
      bindCreatePostListeners();
      await loadSessionAndProfile();
      await loadPostsStream();
      subscribeRealtimePosts();
    });
  </script>
