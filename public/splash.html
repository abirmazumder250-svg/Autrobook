<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Autrobook</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F8F9FA;
    --card: #FFFFFF;
    --text: #202124;
    --muted: #5F6368;
    --border: rgba(32, 33, 36, 0.14);

    --primary: #202124;
    --primary-hover: #3C4043;
    --accent: #202124;
    --accent-dark: #202124;
    --accent-soft: rgba(32, 33, 36, 0.08);

    --btn-green: #0F5132;
    --btn-green-hover: #0B3D26;
    --btn-green-bright: #198754;
    --btn-green-soft: rgba(15, 81, 50, 0.10);
    --btn-green-shadow: 0 8px 22px rgba(15, 81, 50, 0.24);

    --loader-track: #E9ECEF;
    --shadow-sm: 0 2px 10px rgba(32, 33, 36, 0.04);
    --shadow-md: 0 12px 32px rgba(32, 33, 36, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #292A2D;
      --card: #202124;
      --text: #FFFFFF;
      --muted: #BDC1C6;
      --border: rgba(255, 255, 255, 0.16);

      --primary: #FFFFFF;
      --primary-hover: #E8EAED;
      --accent: #FFFFFF;
      --accent-dark: #E8EAED;
      --accent-soft: rgba(255, 255, 255, 0.12);

      --btn-green: #0F5132;
      --btn-green-hover: #146C43;
      --btn-green-bright: #198754;
      --btn-green-soft: rgba(25, 135, 84, 0.18);
      --btn-green-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);

      --loader-track: rgba(255, 255, 255, 0.12);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.40);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: rgba(32, 33, 36, 0.12);
    -webkit-font-smoothing: antialiased;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 50% 26%, var(--btn-green-soft) 0%, transparent 56%),
      radial-gradient(circle at 18% 82%, rgba(25, 135, 84, 0.05) 0%, transparent 45%),
      radial-gradient(circle at 84% 18%, rgba(15, 81, 50, 0.05) 0%, transparent 45%);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 24px)
      22px
      calc(env(safe-area-inset-bottom, 0px) + 84px);
    position: relative;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  body.fade-out {
    opacity: 0;
    transform: scale(0.98);
  }

  /* Subtle Decorative Background Grid & Glow */
  .bg-glow {
    position: fixed;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--btn-green-soft) 0%, transparent 72%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -56%);
    pointer-events: none;
    z-index: 0;
  }

  .splash-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 400px;
    width: 100%;
  }

  /* Compact Logo with Matching Pulse Ring + Floating Glow */
  .top-logo {
    position: relative;
    width: 60px;
    height: 60px;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: logoReveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .top-logo::before,
  .top-logo::after {
    content: '';
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 17px;
    border: 2px solid rgba(15, 81, 50, 0.45);
    pointer-events: none;
    animation: logoPulseRing 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }

  .top-logo::after {
    animation-delay: 1.4s;
  }

  @media (prefers-color-scheme: dark) {
    .top-logo::before,
    .top-logo::after {
      border-color: rgba(25, 135, 84, 0.50);
    }
  }

  @keyframes logoPulseRing {
    0% {
      transform: scale(1);
      opacity: 0.75;
    }
    100% {
      transform: scale(1.45);
      opacity: 0;
    }
  }

  @keyframes logoFloatGlow {
    0%, 100% {
      transform: translateY(0px);
      box-shadow:
        0 8px 20px rgba(32, 33, 36, 0.08),
        0 0 0 3px rgba(15, 81, 50, 0.14),
        0 6px 20px rgba(15, 81, 50, 0.22);
    }
    50% {
      transform: translateY(-2.5px);
      box-shadow:
        0 12px 24px rgba(32, 33, 36, 0.12),
        0 0 0 4px rgba(15, 81, 50, 0.22),
        0 10px 26px rgba(15, 81, 50, 0.34);
    }
  }

  .logo-box {
    position: relative;
    z-index: 2;
    width: 60px;
    height: 60px;
    border-radius: 17px;
    background: var(--bg);
    border: 1.5px solid rgba(15, 81, 50, 0.38);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: logoFloatGlow 3.2s ease-in-out infinite;
  }

  .logo-box img {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    object-fit: cover;
    display: block;
  }

  /* Brand Header & Copy */
  .splash-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 1.65rem;
  }

  .brand-kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--btn-green-soft);
    border: 1px solid rgba(15, 81, 50, 0.22);
    color: var(--btn-green-bright);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(10px);
    animation: slideUpFade 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
  }

  .brand-wordmark {
    font-size: 2.15rem;
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.035em;
    color: var(--text);
    opacity: 0;
    transform: translateY(12px);
    animation: slideUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.24s forwards;
  }

  .splash-desc {
    font-size: 0.92rem;
    line-height: 1.58;
    color: var(--muted);
    max-width: 315px;
    opacity: 0;
    transform: translateY(10px);
    animation: slideUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.34s forwards;
  }

  /* Highlighted Feature Pills */
  .feature-pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 1.85rem;
    opacity: 0;
    transform: translateY(10px);
    animation: slideUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
  }

  .feature-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  .feature-pill i {
    color: var(--btn-green-bright);
    font-size: 0.72rem;
  }

  /* Progress Indicator */
  .loader-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeIn 0.55s ease 0.56s forwards;
  }

  .loader-container {
    width: 176px;
    height: 4px;
    background-color: var(--loader-track);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .loader-bar {
    width: 48%;
    height: 100%;
    background: linear-gradient(90deg, var(--btn-green), var(--btn-green-bright));
    border-radius: 999px;
    position: absolute;
    left: -48%;
    animation: indeterminateLoad 1.45s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
  }

  .status-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* Bottom Footer & Platform Note */
  .splash-footer {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    left: 20px;
    right: 20px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-align: center;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.72s forwards;
  }

  .footer-brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .footer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--btn-green-bright);
    box-shadow: 0 0 8px rgba(25, 135, 84, 0.55);
  }

  .footer-platform-note {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  @keyframes logoReveal {
    to {
      opacity: 1;
    }
  }

  @keyframes slideUpFade {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }

  @keyframes indeterminateLoad {
    0% {
      left: -48%;
      width: 42%;
    }
    50% {
      width: 68%;
    }
    100% {
      left: 105%;
      width: 42%;
    }
  }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<div class="splash-wrap">
  <div class="top-logo">
    <div class="logo-box">
      <img src="logo.png" alt="Autrobook">
    </div>
  </div>

  <div class="splash-text">
    <span class="brand-kicker"><i class="fas fa-leaf"></i> Next-Gen Social</span>
    <h1 class="brand-wordmark">Autrobook</h1>
    <p class="splash-desc">Real conversations, effortless voice replies, and calm social spaces built around you.</p>
  </div>

  <div class="feature-pills">
    <span class="feature-pill"><i class="fas fa-spa"></i> Zen Mode</span>
    <span class="feature-pill"><i class="fas fa-microphone"></i> Voice Comments</span>
    <span class="feature-pill"><i class="fas fa-language"></i> Auto Translation</span>
  </div>

  <div class="loader-section">
    <div class="loader-container">
      <div class="loader-bar"></div>
    </div>
    <p class="status-label" id="splashStatus">Loading your space...</p>
  </div>
</div>

<div class="splash-footer">
  <div class="footer-brand">
    <span class="footer-dot"></span>
    <span>Connect Freely</span>
  </div>
  <p class="footer-platform-note">18+ free social media platform</p>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/splash.js"></script>
<script>
  (function () {
    if (window.SPLASH_HANDLED) return;
    window.SPLASH_HANDLED = true;

    const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

    const supabaseClient =
      window.supabase && typeof window.supabase.createClient === "function"
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          })
        : null;

    let navigated = false;
    const statusEl = document.getElementById("splashStatus");

    const stepTimer = setTimeout(() => {
      if (statusEl && !navigated) {
        statusEl.textContent = "Almost ready...";
      }
    }, 900);

    function hasAuthenticatedAccount() {
      if (localStorage.getItem("autro_logged_out") === "1") {
        return false;
      }

      const rawUser = localStorage.getItem("autro_user");
      if (rawUser) {
        try {
          const parsed = JSON.parse(rawUser);
          if (
            parsed &&
            typeof parsed === "object" &&
            (parsed.id || parsed.email || parsed.userId || parsed.username)
          ) {
            return true;
          }
        } catch (_) {}
      }

      const sessionKeys = [
        "autro_session",
        "autro_auth_session",
        "autro_access_token"
      ];
      for (const k of sessionKeys) {
        const val = localStorage.getItem(k);
        if (val && val !== "null" && val !== "undefined" && val.trim() !== "") {
          return true;
        }
      }

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i) || "";
        if (key.startsWith("sb-") && key.endsWith("-auth-token")) {
          const raw = localStorage.getItem(key);
          if (raw) {
            try {
              const parsed = JSON.parse(raw);
              if (
                parsed &&
                (parsed.access_token || parsed.user || parsed.currentSession?.access_token)
              ) {
                return true;
              }
            } catch (_) {}
          }
        }
      }

      return false;
    }

    async function checkSupabaseAccount() {
      if (localStorage.getItem("autro_logged_out") === "1") {
        return false;
      }
      if (!supabaseClient) return false;

      try {
        const { data } = await supabaseClient.auth.getSession();
        const sessionUser = data?.session?.user;
        if (!sessionUser) return false;

        let savedProfile = null;
        try {
          if (sessionUser.id) {
            const { data: byId } = await supabaseClient
              .from("profiles")
              .select("id, email, full_name, username")
              .eq("id", sessionUser.id)
              .maybeSingle();
            savedProfile = byId || null;
          }
          if (!savedProfile && sessionUser.email) {
            const { data: byEmail } = await supabaseClient
              .from("profiles")
              .select("id, email, full_name, username")
              .eq("email", String(sessionUser.email).trim().toLowerCase())
              .maybeSingle();
            savedProfile = byEmail || null;
          }
        } catch (_) {}

        try {
          localStorage.setItem(
            "autro_user",
            JSON.stringify({
              id: savedProfile?.id || sessionUser.id,
              email: savedProfile?.email || sessionUser.email || "",
              full_name: savedProfile?.full_name || sessionUser.user_metadata?.full_name || "",
              username: savedProfile?.username || sessionUser.user_metadata?.username || ""
            })
          );
        } catch (_) {}

        return true;
      } catch (_) {
        return false;
      }
    }

    async function resolveTargetPage() {
      const sbAccountExists = await checkSupabaseAccount();
      if (sbAccountExists) return "index.html";
      if (hasAuthenticatedAccount()) return "index.html";
      return "welcome.html";
    }

    function goNext(target) {
      if (navigated) return;
      navigated = true;
      clearTimeout(stepTimer);
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.replace(target);
      }, 350);
    }

    const targetPromise = resolveTargetPage();
    setTimeout(async () => {
      const target = await targetPromise;
      goNext(target);
    }, 1800);
  })();
</script>
</body>
</html>
