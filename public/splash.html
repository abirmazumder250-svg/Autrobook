<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Autrobook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #FFFFFF;
    --text-primary: #202124;
    --text-secondary: #5F6368;
    --green-primary: #0F9D58;
    --green-dark: #0B8043;
    --green-soft: rgba(15, 157, 88, 0.10);
    --green-border: rgba(15, 157, 88, 0.24);
    --loader-track: #EEF2F0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 24%, rgba(15, 157, 88, 0.06) 0%, rgba(255, 255, 255, 0) 58%);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 16vh;
    overflow: hidden;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  body.fade-out {
    opacity: 0;
    transform: scale(0.98);
  }

  .splash-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 1.5rem;
    max-width: 360px;
    width: 100%;
    position: relative;
  }

  /* Compact Logo Card Positioned Higher */
  .splash-logo {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: var(--bg-color);
    border: 1px solid var(--green-border);
    box-shadow:
      0 10px 24px rgba(32, 33, 36, 0.06),
      0 4px 12px rgba(15, 157, 88, 0.09);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 1.6rem;
    opacity: 0;
    transform: scale(0.86) translateY(12px);
    animation: logoReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .splash-logo::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 22px;
    border: 1.5px solid var(--green-primary);
    opacity: 0;
    animation: pulseRing 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite 0.8s;
  }

  .splash-logo img {
    width: 46px;
    height: 46px;
    object-fit: contain;
    border-radius: 12px;
    display: block;
  }

  /* Typography Reveal */
  .splash-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 2.2rem;
  }

  .splash-text h1 {
    font-size: 1.65rem;
    line-height: 1.22;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    opacity: 0;
    transform: translateY(12px);
    animation: slideUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
  }

  .splash-text h1 span.brand-accent {
    color: var(--green-dark);
  }

  .badge-subtitle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.38rem 0.88rem;
    background-color: var(--green-soft);
    border: 1px solid var(--green-border);
    border-radius: 100px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-primary);
    opacity: 0;
    transform: translateY(10px);
    animation: slideUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.38s forwards;
  }

  .age-tag {
    background: linear-gradient(135deg, var(--green-primary), var(--green-dark));
    color: #FFFFFF;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.14rem 0.45rem;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }

  /* Green-Accented Progress Bar */
  .loader-container {
    width: 146px;
    height: 4px;
    background-color: var(--loader-track);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    opacity: 0;
    animation: fadeIn 0.5s ease 0.55s forwards;
  }

  .loader-bar {
    width: 48%;
    height: 100%;
    background: linear-gradient(90deg, var(--green-primary), var(--text-primary));
    border-radius: 999px;
    position: absolute;
    left: -48%;
    animation: indeterminateLoad 1.45s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
  }

  /* Footer Tagline */
  .splash-footer {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 24px);
    padding-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.7s forwards;
  }

  .footer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--green-primary);
  }

  /* Keyframes */
  @keyframes logoReveal {
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  @keyframes slideUpFade {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }

  @keyframes pulseRing {
    0% {
      transform: scale(1);
      opacity: 0.35;
    }
    100% {
      transform: scale(1.34);
      opacity: 0;
    }
  }

  @keyframes indeterminateLoad {
    0% {
      left: -48%;
      width: 42%;
    }
    50% {
      width: 68%;
    }
    100% {
      left: 105%;
      width: 42%;
    }
  }
</style>
</head>
<body>

<div class="splash-wrap">
  <div class="splash-logo">
    <img src="logo.png" alt="">
  </div>
  
  <div class="splash-text">
    <h1>Welcome to <span class="brand-accent">Autrobook</span></h1>
    <div class="badge-subtitle">
      <span class="age-tag">18+</span>
      <span>Free Social Media Platform</span>
    </div>
  </div>
  
  <div class="loader-container">
    <div class="loader-bar"></div>
  </div>
</div>

<div class="splash-footer">
  <span class="footer-dot"></span>
  <span>Connect Freely</span>
</div>

<script src="js/splash.js"></script>
<script>
  setTimeout(() => {
    document.body.classList.add('fade-out');
    setTimeout(() => {
      window.location.replace('welcome.html');
    }, 350);
  }, 2000);
</script>
</body>
  </html>
