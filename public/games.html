<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Games — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="profile.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --surface: #f3f4f6;
      --card: #FFFFFF;
      --elevated: #FFFFFF;
      --text: #202124;
      --muted: #5f6368;
      --border: #e5e7eb;
      --accent: #0a7d3b;
      --accent-dark: #0B3D20;
      --accent-hover: #08632e;
      --accent-soft: rgba(10, 125, 59, 0.12);
      --gold: #f59e0b;
      --pill-active-bg: rgba(10, 125, 59, 0.16);
      --pill-active-text: #0a7d3b;
      --btn-secondary: #eef0f2;
      --btn-secondary-hover: #e2e5e9;
      --danger: #dc2626;
      --shadow: 0 8px 24px rgba(32, 33, 36, 0.14);
    }

    :root[data-theme="dark"],
    body.dark-theme {
      color-scheme: dark;
      --bg: #202124;
      --surface: #292a2d;
      --card: #202124;
      --elevated: #282a2e;
      --text: #FFFFFF;
      --muted: #b0b7c0;
      --border: #383a3f;
      --accent: #0a7d3b;
      --accent-dark: #0B3D20;
      --accent-hover: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --pill-active-bg: rgba(16, 185, 129, 0.22);
      --pill-active-text: #34d399;
      --btn-secondary: #303134;
      --btn-secondary-hover: #3c4043;
      --danger: #f87171;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #202124;
        --surface: #292a2d;
        --card: #202124;
        --elevated: #282a2e;
        --text: #FFFFFF;
        --muted: #b0b7c0;
        --border: #383a3f;
        --accent: #0a7d3b;
        --accent-dark: #0B3D20;
        --accent-hover: #10b981;
        --accent-soft: rgba(16, 185, 129, 0.14);
        --pill-active-bg: rgba(16, 185, 129, 0.22);
        --pill-active-text: #34d399;
        --btn-secondary: #303134;
        --btn-secondary-hover: #3c4043;
        --danger: #f87171;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--btn-secondary);
      color: var(--text);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.12s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--btn-secondary-hover);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .page-title {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    /* Category Filter Pills */
    .sub-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-tabs::-webkit-scrollbar {
      display: none;
    }

    .sub-tab {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sub-tab:hover {
      background: var(--surface);
    }

    .sub-tab.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    /* Dropdown Popovers (+ Create & ... Menu) */
    .popover-menu {
      position: fixed;
      top: 54px;
      right: 12px;
      min-width: 220px;
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 8px;
      z-index: 120;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .popover-menu.open {
      display: flex;
    }

    .popover-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .popover-item:hover {
      background: var(--surface);
    }

    .popover-item i {
      width: 22px;
      text-align: center;
      font-size: 17px;
      color: var(--text);
    }

    .popover-item .live-lock-hint {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    /* Main Content */
    .main-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }

    .search-box-wrap {
      margin-bottom: 14px;
    }

    .search-input-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
    }

    .search-input-pill i {
      color: var(--muted);
      font-size: 14px;
    }

    .search-input-pill input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .game-count-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    /* 15 Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 560px) {
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .game-card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px 12px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .game-card:hover {
      background: var(--surface);
      border-color: var(--gold);
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .game-logo-frame {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--accent-dark), var(--accent));
      border: 1.5px solid rgba(245, 158, 11, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 6px;
      box-shadow: 0 6px 14px rgba(11, 61, 32, 0.28);
    }

    .game-logo-frame svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .game-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }

    .game-category {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .play-pill {
      margin-top: auto;
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
      transition: filter 0.15s ease;
    }

    .game-card:hover .play-pill {
      filter: brightness(1.08);
    }

    .empty-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 28px 14px;
      color: var(--muted);
      font-size: 14px;
      background: var(--surface);
      border-radius: 12px;
    }

    .empty-box i {
      font-size: 24px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.7;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 80;
    }

    .nav-link {
      color: var(--muted);
      font-size: 20px;
      text-decoration: none;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-link.active {
      color: var(--pill-active-text);
    }

    .nav-profile-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      border: 2px solid var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-profile-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .nav-profile-ring img.has-img {
      display: block;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-dark);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #FFFFFF;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 300;
      display: none;
      max-width: 90vw;
      text-align: center;
      box-shadow: var(--shadow);
    }
  </style>
</head>

    const GAMES_LIST = [
      { name: "Football", href: "football.html", category: "Sports", logo: GAME_LOGOS.football },
      { name: "Cricket", href: "cricket.html", category: "Sports", logo: GAME_LOGOS.cricket },
      { name: "Badminton", href: "badminton.html", category: "Sports", logo: GAME_LOGOS.badminton },
      { name: "Chess", href: "chess.html", category: "Board", logo: GAME_LOGOS.chess },
      { name: "Ludo", href: "ludo.html", category: "Board", logo: GAME_LOGOS.ludo },
      { name: "Carrom", href: "carrom.html", category: "Board", logo: GAME_LOGOS.carrom },
      { name: "Table Tennis", href: "table-tennis.html", category: "Sports", logo: GAME_LOGOS.tableTennis },
      { name: "Basketball", href: "basketball.html", category: "Sports", logo: GAME_LOGOS.basketball },
      { name: "Pool 8 Ball", href: "pool-8-ball.html", category: "Sports", logo: GAME_LOGOS.pool8Ball },
      { name: "Archery", href: "archery.html", category: "Sports", logo: GAME_LOGOS.archery },
      { name: "Car Racing", href: "car-racing.html", category: "Arcade", logo: GAME_LOGOS.carRacing },
      { name: "Snake", href: "snake.html", category: "Arcade", logo: GAME_LOGOS.snake },
      { name: "Sudoku", href: "sudoku.html", category: "Board", logo: GAME_LOGOS.sudoku },
      { name: "Tic Tac Toe", href: "tic-tac-toe.html", category: "Board", logo: GAME_LOGOS.ticTacToe },
      { name: "Puzzle Block", href: "puzzle-block.html", category: "Arcade", logo: GAME_LOGOS.puzzleBlock }
    ];

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function showToast(msg) {
      const el = document.getElementById("toastBanner");
      if (!el) return;
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window._gamesToastTimer);
      window._gamesToastTimer = setTimeout(() => {
        el.style.display = "none";
      }, 3200);
    }

    function filterGamesByCategory(category, btnEl) {
      activeCategory = category;
      document.querySelectorAll(".sub-tab").forEach((t) => t.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      renderGamesGrid();
    }

    function renderGamesGrid() {
      const grid = document.getElementById("gamesGrid");
      const countLabel = document.getElementById("gamesCountLabel");
      if (!grid) return;

      const query = (document.getElementById("gamesSearchInput")?.value || "").trim().toLowerCase();

      const filtered = GAMES_LIST.filter((game) => {
        const matchesCat = activeCategory === "all" || game.category === activeCategory;
        const matchesQuery = !query || game.name.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      if (countLabel) {
        countLabel.textContent = `${filtered.length} ${filtered.length === 1 ? "game" : "games"}`;
      }

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-box"><i class="fas fa-gamepad"></i>No matching games found</div>`;
        return;
      }

      grid.innerHTML = filtered.map((game) => `
        <a href="${escapeHtml(game.href)}" class="game-card" title="Play ${escapeHtml(game.name)}">
          <div class="game-logo-frame" aria-hidden="true">
            ${game.logo}
          </div>
          <div>
            <div class="game-title">${escapeHtml(game.name)}</div>
            <div class="game-category">${escapeHtml(game.category)}</div>
          </div>
          <span class="play-pill">Play</span>
        </a>
      `).join("");
    }

    /* Popover Controls */
    function closeAllPopovers() {
      document.getElementById("createPopover")?.classList.remove("open");
      document.getElementById("morePopover")?.classList.remove("open");
    }

    document.getElementById("createMenuBtn")?.addEventListener("click", (e) => {
      e.stopPropagation();
      const createPop = document.getElementById("createPopover");
      const morePop = document.getElementById("morePopover");
      morePop?.classList.remove("open");
      createPop?.classList.toggle("open");
    });

    document.getElementById("moreMenuBtn")?.addEventListener("click", (e) => {
      e.stopPropagation();
      const createPop = document.getElementById("createPopover");
      const morePop = document.getElementById("morePopover");
      createPop?.classList.remove("open");
      morePop?.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (
        !e.target.closest("#createPopover") &&
        !e.target.closest("#createMenuBtn") &&
        !e.target.closest("#morePopover") &&
        !e.target.closest("#moreMenuBtn")
      ) {
        closeAllPopovers();
      }
    });

    /* Real Account Age Check via Supabase for 2-Month Live Lock */
    async function syncSupabaseUserAndAccountAge() {
      let createdIso = null;
      let avatarUrl = "";

      if (sb) {
        try {
          const { data: sessionRes } = await sb.auth.getSession();
          let authUser = sessionRes?.session?.user || null;

          if (!authUser) {
            const { data: userRes } = await sb.auth.getUser();
            authUser = userRes?.user || null;
          }

          if (authUser) {
            currentUserId = authUser.id;
            createdIso = authUser.created_at || null;
          }

          if (currentUserId) {
            const { data: profileRow } = await sb
              .from("profiles")
              .select("id, avatar_url, created_at")
              .eq("id", currentUserId)
              .maybeSingle();

            if (profileRow) {
              if (profileRow.avatar_url) avatarUrl = profileRow.avatar_url;
              if (profileRow.created_at) createdIso = profileRow.created_at;
            }
          }
        } catch (e) {
          console.warn("Supabase user sync warning:", e);
        }
      }

      const avImg = document.getElementById("bottomProfileAvatar");
      if (avImg) {
        if (avatarUrl) {
          avImg.src = avatarUrl;
          avImg.classList.add("has-img");
        } else {
          avImg.removeAttribute("src");
          avImg.classList.remove("has-img");
        }
      }

      const badge = document.getElementById("liveAgeBadge");
      if (createdIso) {
        const parsedMs = new Date(createdIso).getTime();
        if (!Number.isNaN(parsedMs)) {
          accountCreatedAtMs = parsedMs;
          const elapsedDays = Math.max(0, Math.floor((Date.now() - parsedMs) / (1000 * 60 * 60 * 24)));
          if (badge) {
            badge.textContent = elapsedDays >= TWO_MONTHS_DAYS
              ? `${elapsedDays}d`
              : `${elapsedDays}/${TWO_MONTHS_DAYS}d`;
          }
        }
      } else if (badge) {
        badge.textContent = `0/${TWO_MONTHS_DAYS}d`;
      }
    }

    async function handleLiveClick(event) {
      if (event) event.preventDefault();

      if (!accountCreatedAtMs) {
        await syncSupabaseUserAndAccountAge();
      }

      if (!accountCreatedAtMs || Number.isNaN(accountCreatedAtMs)) {
        showToast("Live locked for new accounts: 2 months (60 days) required.");
        return false;
      }

      const elapsedMs = Date.now() - accountCreatedAtMs;
      const elapsedDays = Math.floor(elapsedMs / (1000 * 60 * 60 * 24));

      if (elapsedMs < TWO_MONTHS_MS) {
        const remainingDays = Math.max(1, Math.ceil((TWO_MONTHS_MS - elapsedMs) / (1000 * 60 * 60 * 24)));
        showToast(`Live locked for 2 months (${elapsedDays}d active · ${remainingDays}d left).`);
        return false;
      }

      const roomName = currentUserId ? `autro-live-${currentUserId}` : "autro-live-room";
      const targetUrl = `live.html?wss=${encodeURIComponent(LIVEKIT_WSS_URL)}&room=${encodeURIComponent(roomName)}`;
      window.location.href = targetUrl;
      return false;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      renderGamesGrid();
      await syncSupabaseUserAndAccountAge();
    });
  </script>
