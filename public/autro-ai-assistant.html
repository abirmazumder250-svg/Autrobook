<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autro AI Assistant — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root,
    :root[data-theme="light"] {
      --bg-page: #f0f2f5;
      --bg-card: #ffffff;
      --bg-soft: #f0f2f5;
      --bg-user: #050505;
      --bg-ai: #f0f2f5;
      --text-main: #050505;
      --text-muted: #65676b;
      --text-user: #ffffff;
      --text-ai: #050505;
      --border-color: #e4e6eb;
      --btn-bg: #050505;
      --btn-text: #ffffff;
      --accent-green: #16a34a;
      --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.05);
    }

    :root[data-theme="dark"],
    html.dark,
    body.dark-theme {
      --bg-page: #18191a;
      --bg-card: #242526;
      --bg-soft: #3a3b3c;
      --bg-user: #e4e6eb;
      --bg-ai: #303134;
      --text-main: #e4e6eb;
      --text-muted: #b0b3b8;
      --text-user: #050505;
      --text-ai: #e4e6eb;
      --border-color: #3e4042;
      --btn-bg: #e4e6eb;
      --btn-text: #050505;
      --accent-green: #22c55e;
      --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #18191a;
        --bg-card: #242526;
        --bg-soft: #3a3b3c;
        --bg-user: #e4e6eb;
        --bg-ai: #303134;
        --text-main: #e4e6eb;
        --text-muted: #b0b3b8;
        --text-user: #050505;
        --text-ai: #e4e6eb;
        --border-color: #3e4042;
        --btn-bg: #e4e6eb;
        --btn-text: #050505;
        --accent-green: #22c55e;
        --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn,
    .clear-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-soft);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .back-btn:active,
    .clear-btn:active,
    .send-btn:active {
      transform: scale(0.96);
    }

    .assistant-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .assistant-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--bg-soft);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .assistant-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .assistant-avatar .fallback-robot {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .assistant-avatar.use-fallback img {
      display: none;
    }

    .assistant-avatar.use-fallback .fallback-robot {
      display: inline-flex;
    }

    .assistant-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .assistant-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 440px;
      padding: 24px 18px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: var(--bg-soft);
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .empty-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-icon .fallback-robot {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .empty-icon.use-fallback img {
      display: none;
    }

    .empty-icon.use-fallback .fallback-robot {
      display: inline-flex;
    }

    .empty-state h2 {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      gap: 4px;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow-soft);
    }

    .message-row.user .message-bubble {
      background-color: var(--bg-user);
      color: var(--text-user);
      border-bottom-right-radius: 5px;
    }

    .message-row.assistant .message-bubble {
      background-color: var(--bg-ai);
      color: var(--text-ai);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 5px;
    }

    .message-meta {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 2px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-ai);
      opacity: 0.4;
      animation: bounceDot 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounceDot {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .composer-wrap {
      padding: 12px 14px;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-color);
    }

    .composer-form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .prompt-input {
      flex: 1;
      min-height: 44px;
      max-height: 130px;
      padding: 11px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-soft);
      color: var(--text-main);
      font-size: 14.5px;
      line-height: 1.4;
      resize: none;
      outline: none;
    }

    .prompt-input:focus {
      border-color: var(--text-main);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app-shell {
        border-left: none;
        border-right: none;
      }

      .message-row {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <a href="javascript:history.back()" class="back-btn" aria-label="Back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="assistant-title-wrap">
          <div class="assistant-avatar" id="headerAvatarWrap">
            <img id="headerAvatarImg" src="" alt="Autro AI" />
            <span class="fallback-robot"><i class="fa-solid fa-robot"></i></span>
          </div>
          <div>
            <div class="assistant-title">Autro AI Assistant</div>
            <div class="assistant-sub" id="assistantSubtitle">Instant replies in all languages</div>
          </div>
        </div>
      </div>

      <button type="button" id="clearChatBtn" class="clear-btn" title="Clear chat">
        <i class="fa-solid fa-rotate-left"></i>
        <span>Clear</span>
      </button>
    </header>

    <main id="chatContainer" class="chat-container">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon" id="emptyAvatarWrap">
          <img id="emptyAvatarImg" src="" alt="Autro AI" />
          <span class="fallback-robot"><i class="fa-solid fa-robot"></i></span>
        </div>
        <h2 id="welcomeHeading">Autro AI Assistant</h2>
        <p id="welcomeDescription">Ask anything in any language — Bengali, English, Hindi, Arabic, Spanish, or more.</p>
      </div>
    </main>

    <div class="composer-wrap">
      <form id="chatForm" class="composer-form">
        <textarea
          id="promptInput"
          class="prompt-input"
          rows="1"
          placeholder="Message Autro AI in any language..."
          required
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // auth.js - Authentication and onboarding guard for Autrobook
    (function () {
      const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

      const LOGIN_PATH = '/login.html';
      const SIGNUP_NAME_PATH = '/signup-name.html';
      const SIGNUP_CONTACT_PATH = '/signup-contact.html';

      let client = null;
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      function getCurrentPath() {
        return window.location.pathname || '/';
      }

      function redirectIfNeeded(targetPath) {
        const current = getCurrentPath();
        if (current.toLowerCase() !== targetPath.toLowerCase()) {
          window.location.replace(targetPath);
        }
      }

      async function checkSessionAndProfile(options = {}) {
        const { requireCompleteProfile = true } = options;

        if (!client) {
          redirectIfNeeded(LOGIN_PATH);
          return null;
        }

        const { data: { session }, error } = await client.auth.getSession();
        if (error || !session || !session.user) {
          redirectIfNeeded(LOGIN_PATH);
          return null;
        }

        const user = session.user;
        if (!requireCompleteProfile) {
          return { session, user, profile: null };
        }

        let profile = null;
        try {
          const { data } = await client
            .from('profiles')
            .select('id, full_name, name, phone, contact, avatar_url')
            .eq('id', user.id)
            .maybeSingle();
          profile = data || null;
        } catch (_) {
          profile = null;
        }

        const meta = user.user_metadata || {};
        const fullName = String(
          profile?.full_name || profile?.name || meta.full_name || meta.name || ''
        ).trim();
        const contact = String(
          profile?.phone || profile?.contact || user.phone || user.email || ''
        ).trim();

        // Redirect new or incomplete accounts to name / contact sign-up steps
        if (!fullName) {
          redirectIfNeeded(SIGNUP_NAME_PATH);
          return null;
        }

        if (!contact) {
          redirectIfNeeded(SIGNUP_CONTACT_PATH);
          return null;
        }

        return { session, user, profile };
      }

      window.AutroAuth = {
        supabase: client,
        checkSessionAndProfile,
        signOut: async function () {
          if (client) {
            await client.auth.signOut();
          }
          redirectIfNeeded(LOGIN_PATH);
        }
      };
    })();
  </script>

  <script>
    (function () {
      const API_ENDPOINT = '/api/autro-ai';
      const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

      let supabaseClient = (window.AutroAuth && window.AutroAuth.supabase) || null;
      if (!supabaseClient) {
        try {
          if (window.supabase && typeof window.supabase.createClient === 'function') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          }
        } catch (_) {}
      }

      const chatContainer = document.getElementById('chatContainer');
      const emptyState = document.getElementById('emptyState');
      const chatForm = document.getElementById('chatForm');
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const clearChatBtn = document.getElementById('clearChatBtn');
      const assistantSubtitle = document.getElementById('assistantSubtitle');
      const welcomeHeading = document.getElementById('welcomeHeading');
      const headerAvatarWrap = document.getElementById('headerAvatarWrap');
      const headerAvatarImg = document.getElementById('headerAvatarImg');
      const emptyAvatarWrap = document.getElementById('emptyAvatarWrap');
      const emptyAvatarImg = document.getElementById('emptyAvatarImg');

      const conversationHistory = [];
      let currentUserProfile = {
        userId: '',
        fullName: '',
        username: '',
        email: '',
        avatarUrl: '',
        bio: '',
        location: '',
        education: ''
      };

      function setAvatarImage(url) {
        const cleanUrl = String(url || '').trim();
        const targets = [
          { wrap: headerAvatarWrap, img: headerAvatarImg },
          { wrap: emptyAvatarWrap, img: emptyAvatarImg }
        ];

        for (const { wrap, img } of targets) {
          if (!wrap || !img) continue;
          if (!cleanUrl) {
            img.removeAttribute('src');
            wrap.classList.add('use-fallback');
            continue;
          }
          wrap.classList.remove('use-fallback');
          img.onerror = () => {
            wrap.classList.add('use-fallback');
          };
          img.onload = () => {
            wrap.classList.remove('use-fallback');
          };
          img.src = cleanUrl;
        }
      }

      function getDisplayName(profile = currentUserProfile) {
        return String(profile?.fullName || '').trim();
      }

      function applyPersonalizedGreeting(profile) {
        const displayName = getDisplayName(profile);
        setAvatarImage(profile?.avatarUrl || '');

        if (assistantSubtitle) {
          assistantSubtitle.textContent = displayName
            ? `Profile: ${displayName}`
            : '';
        }
        if (welcomeHeading) {
          welcomeHeading.textContent = displayName
            ? `Hello, ${displayName}`
            : 'Autro AI Assistant';
        }
      }

      function readCachedUserProfile() {
        const profile = {
          userId: '',
          fullName: '',
          username: '',
          email: '',
          avatarUrl: '',
          bio: '',
          location: '',
          education: ''
        };
        try {
          const storageKeys = [
            'autro_account_profile',
            'autrobook_user',
            'autro_user_profile',
            'current_user',
            'autrobook_current_user'
          ];
          for (const key of storageKeys) {
            const raw = localStorage.getItem(key) || sessionStorage.getItem(key);
            if (!raw) continue;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') continue;
            const u = parsed.user && typeof parsed.user === 'object' ? parsed.user : parsed;

            if (!profile.userId) profile.userId = String(u.id || u.user_id || parsed.id || parsed.user_id || '').trim();
            if (!profile.fullName) profile.fullName = String(u.full_name ?? u.fullName ?? u.name ?? parsed.full_name ?? parsed.name ?? '').trim();
            if (!profile.username) profile.username = String(u.username ?? u.user_name ?? parsed.username ?? '').trim();
            if (!profile.email) profile.email = String(u.email ?? parsed.email ?? '').trim();
            if (!profile.avatarUrl) profile.avatarUrl = String(u.avatar_url ?? u.avatarUrl ?? u.photo_url ?? u.photoUrl ?? u.avatar ?? parsed.avatar_url ?? '').trim();
            if (!profile.bio) profile.bio = String(u.bio ?? u.about ?? parsed.bio ?? '').trim();
            if (!profile.location) profile.location = String(u.location ?? u.city ?? u.lives_in ?? parsed.location ?? '').trim();
            if (!profile.education) profile.education = String(u.education ?? u.school ?? u.university ?? parsed.education ?? '').trim();
            if (profile.fullName || profile.avatarUrl) break;
          }

          if (!profile.fullName) {
            profile.fullName = String(
              localStorage.getItem('autro_profile_name') ??
              localStorage.getItem('autro_user_name') ??
              sessionStorage.getItem('autro_profile_name') ??
              ''
            ).trim();
          }

          if (!profile.avatarUrl) {
            profile.avatarUrl = String(
              localStorage.getItem('autro_profile_avatar') ??
              localStorage.getItem('autro_avatar_url') ??
              sessionStorage.getItem('autro_profile_avatar') ??
              ''
            ).trim();
          }
        } catch (_) {}
        return profile;
      }

      async function resolveCurrentUserProfile() {
        const cached = readCachedUserProfile();
        currentUserProfile = { ...currentUserProfile, ...cached };
        applyPersonalizedGreeting(currentUserProfile);

        if (!supabaseClient) return currentUserProfile;

        try {
          let userId = currentUserProfile.userId || null;

          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session && session.user) {
            userId = session.user.id;
            currentUserProfile.userId = userId;
            if (session.user.user_metadata?.full_name !== undefined || session.user.user_metadata?.name !== undefined) {
              currentUserProfile.fullName = String(
                session.user.user_metadata?.full_name ?? session.user.user_metadata?.name ?? ''
              ).trim();
            }
            if (session.user.user_metadata?.username !== undefined) {
              currentUserProfile.username = String(session.user.user_metadata.username ?? '').trim();
            }
            if (session.user.email !== undefined) {
              currentUserProfile.email = String(session.user.email ?? '').trim();
            }
            const metaAvatar = session.user.user_metadata?.avatar_url ?? session.user.user_metadata?.picture;
            if (metaAvatar !== undefined) {
              currentUserProfile.avatarUrl = String(metaAvatar ?? '').trim();
            }
          }

          if (userId) {
            const { data: profileRow } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('id', userId)
              .maybeSingle();

            if (profileRow) {
              if ('full_name' in profileRow) currentUserProfile.fullName = String(profileRow.full_name ?? '').trim();
              if ('username' in profileRow) currentUserProfile.username = String(profileRow.username ?? '').trim();
              if ('email' in profileRow) currentUserProfile.email = String(profileRow.email ?? '').trim();
              const rowAvatar = profileRow.avatar_url ?? profileRow.avatarUrl ?? profileRow.photo_url ?? profileRow.avatar;
              if (rowAvatar !== undefined) currentUserProfile.avatarUrl = String(rowAvatar ?? '').trim();
              if ('bio' in profileRow) currentUserProfile.bio = String(profileRow.bio ?? '').trim();
              if ('location' in profileRow || 'city' in profileRow || 'lives_in' in profileRow) {
                currentUserProfile.location = String(profileRow.location ?? profileRow.city ?? profileRow.lives_in ?? '').trim();
              }
              if ('education' in profileRow || 'university' in profileRow || 'school' in profileRow) {
                currentUserProfile.education = String(profileRow.education ?? profileRow.university ?? profileRow.school ?? '').trim();
              }
            }
          }

          const clientKey = localStorage.getItem('autro_account_client_id');
          let settingsRow = null;

          if (userId) {
            const { data } = await supabaseClient
              .from('account_settings')
              .select('*')
              .eq('user_id', userId)
              .order('updated_at', { ascending: false })
              .limit(1)
              .maybeSingle();
            settingsRow = data;
          }

          if (!settingsRow && clientKey) {
            const { data } = await supabaseClient
              .from('account_settings')
              .select('*')
              .eq('account_key', clientKey)
              .order('updated_at', { ascending: false })
              .limit(1)
              .maybeSingle();
            settingsRow = data;
          }

          if (!settingsRow && !userId) {
            const { data: latestRows } = await supabaseClient
              .from('account_settings')
              .select('*')
              .order('updated_at', { ascending: false })
              .limit(1);
            if (Array.isArray(latestRows) && latestRows.length > 0) {
              settingsRow = latestRows[0];
            }
          }

          if (settingsRow) {
            if ('full_name' in settingsRow) currentUserProfile.fullName = String(settingsRow.full_name ?? '').trim();
            const settingsAvatar = settingsRow.avatar_url ?? settingsRow.avatarUrl ?? settingsRow.photo_url ?? settingsRow.avatar;
            if (settingsAvatar !== undefined) currentUserProfile.avatarUrl = String(settingsAvatar ?? '').trim();
            if ('bio' in settingsRow) currentUserProfile.bio = String(settingsRow.bio ?? '').trim();
            if ('location' in settingsRow || 'city' in settingsRow || 'lives_in' in settingsRow) {
              currentUserProfile.location = String(settingsRow.location ?? settingsRow.city ?? settingsRow.lives_in ?? '').trim();
            }
            if ('education' in settingsRow || 'university' in settingsRow || 'school' in settingsRow) {
              currentUserProfile.education = String(settingsRow.education ?? settingsRow.university ?? settingsRow.school ?? '').trim();
            }
          }

          if (!currentUserProfile.fullName && !currentUserProfile.avatarUrl && !userId) {
            const { data: fallbackUsers } = await supabaseClient
              .from('users')
              .select('*')
              .order('created_at', { ascending: false })
              .limit(1);
            if (Array.isArray(fallbackUsers) && fallbackUsers[0]) {
              const u = fallbackUsers[0];
              if ('full_name' in u) currentUserProfile.fullName = String(u.full_name ?? '').trim();
              if ('username' in u) currentUserProfile.username = String(u.username ?? '').trim();
              if ('email' in u) currentUserProfile.email = String(u.email ?? '').trim();
              const fallbackAvatar = u.avatar_url ?? u.avatarUrl ?? u.photo_url ?? u.avatar;
              if (fallbackAvatar !== undefined) currentUserProfile.avatarUrl = String(fallbackAvatar ?? '').trim();
            }
          }

          applyPersonalizedGreeting(currentUserProfile);
        } catch (_) {}

        return currentUserProfile;
      }

      function isGreetingMessage(text) {
        const normalized = text.trim().toLowerCase();
        return /^(hi|hello|hey|yo|good morning|good afternoon|good evening|হাই|হ্যালো|হেলো|সালাম|আসসালামু আলাইকুম|কেমন আছেন|কি খবর|কী খবর)[\s!.?]*$/i.test(normalized);
      }

      function buildNameAwareGreeting(text, profile) {
        const name = getDisplayName(profile);
        const isBengali = /[\u0980-\u09FF]/.test(text);
        if (name) {
          return isBengali
            ? `হ্যালো ${name}! আমি আপনাকে কীভাবে সাহায্য করতে পারি?`
            : `Hello ${name}! How can I help you today?`;
        }
        return isBengali
          ? 'হ্যালো! আমি আপনাকে কীভাবে সাহায্য করতে পারি?'
          : 'Hello! How can I help you today?';
      }

      function formatTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function autoResizeTextarea() {
        promptInput.style.height = 'auto';
        promptInput.style.height = Math.min(promptInput.scrollHeight, 130) + 'px';
      }

      function appendMessage(role, text, metaLabel) {
        if (emptyState) {
          emptyState.style.display = 'none';
        }

        const row = document.createElement('div');
        row.className = `message-row ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = metaLabel || formatTime();

        row.appendChild(bubble);
        row.appendChild(meta);
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return { row, bubble, meta };
      }

      function appendTypingIndicator() {
        if (emptyState) {
          emptyState.style.display = 'none';
        }

        const row = document.createElement('div');
        row.className = 'message-row assistant';
        row.id = 'typingIndicatorRow';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = `
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        `;

        row.appendChild(bubble);
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return row;
      }

      function removeTypingIndicator() {
        const el = document.getElementById('typingIndicatorRow');
        if (el) el.remove();
      }

      async function sendMessage(userText) {
        const trimmed = userText.trim();
        if (!trimmed) return;

        appendMessage('user', trimmed, formatTime());
        conversationHistory.push({ role: 'user', text: trimmed });

        promptInput.value = '';
        autoResizeTextarea();
        sendBtn.disabled = true;

        const startTime = performance.now();
        appendTypingIndicator();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 14000);

        try {
          const userProfile = await resolveCurrentUserProfile();
          const personalGreeting = isGreetingMessage(trimmed)
            ? buildNameAwareGreeting(trimmed, userProfile)
            : '';

          const response = await fetch(API_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              message: trimmed,
              profileName: getDisplayName(userProfile),
              userProfile,
              history: conversationHistory.slice(-4)
            })
          });

          clearTimeout(timeoutId);

          let data = {};
          const rawBody = await response.text();
          try {
            data = rawBody ? JSON.parse(rawBody) : {};
          } catch (_) {
            data = { error: rawBody || `Request failed (${response.status})` };
          }

          removeTypingIndicator();

          const elapsedSec = ((performance.now() - startTime) / 1000).toFixed(2);
          const providerLabel = data.model ? `Autro AI (${data.model})` : 'Autro AI';

          if (!response.ok || !data.reply) {
            if (personalGreeting) {
              conversationHistory.push({ role: 'assistant', text: personalGreeting });
              appendMessage('assistant', personalGreeting, `${providerLabel} • ${elapsedSec}s`);
            } else {
              appendMessage(
                'assistant',
                data.error || `Could not get a response right now (${response.status}).`,
                `${providerLabel} • ${elapsedSec}s`
              );
            }
          } else {
            let finalReply = data.reply;
            const displayName = getDisplayName(userProfile);
            if (isGreetingMessage(trimmed) && displayName && !finalReply.toLowerCase().includes(displayName.toLowerCase())) {
              finalReply = `${personalGreeting}\n\n${finalReply}`;
            }
            conversationHistory.push({ role: 'assistant', text: finalReply });
            appendMessage('assistant', finalReply, `${providerLabel} • ${elapsedSec}s`);
          }
        } catch (err) {
          clearTimeout(timeoutId);
          removeTypingIndicator();
          const personalGreeting = isGreetingMessage(trimmed)
            ? buildNameAwareGreeting(trimmed, currentUserProfile)
            : '';
          if (personalGreeting) {
            conversationHistory.push({ role: 'assistant', text: personalGreeting });
            appendMessage('assistant', personalGreeting, formatTime());
          } else {
            const msg = err.name === 'AbortError'
              ? 'Response took too long. Please try again.'
              : 'Network error while connecting to Autro AI.';
            appendMessage('assistant', msg, formatTime());
          }
        } finally {
          sendBtn.disabled = false;
          promptInput.focus();
        }
      }

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        sendMessage(promptInput.value);
      });

      promptInput.addEventListener('input', autoResizeTextarea);

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(promptInput.value);
        }
      });

      clearChatBtn.addEventListener('click', () => {
        conversationHistory.length = 0;
        chatContainer.innerHTML = '';
        if (emptyState) {
          emptyState.style.display = 'block';
          chatContainer.appendChild(emptyState);
        }
      });

      async function initAssistantPage() {
        if (window.AutroAuth && typeof window.AutroAuth.checkSessionAndProfile === 'function') {
          const authResult = await window.AutroAuth.checkSessionAndProfile({
            requireCompleteProfile: true
          });
          if (!authResult) return;
        }
        await resolveCurrentUserProfile();
      }

      initAssistantPage();
    })();
  </script>

  <script>
    (function () {
      const THEME_KEYS = ['autro_theme', 'autrobook_theme', 'theme', 'autrobook_dark_mode'];
      const LANG_KEYS = ['autro_lang_code', 'autrobook_lang', 'lang', 'language'];

      function readTheme() {
        for (const k of THEME_KEYS) {
          try {
            const v = (localStorage.getItem(k) || sessionStorage.getItem(k) || '').toLowerCase().trim();
            if (v === 'dark' || v === '1' || v === 'true') return 'dark';
            if (v === 'light' || v === '0' || v === 'false') return 'light';
          } catch (_) {}
        }
        const match = document.cookie.match(/(?:^|;\s*)(?:autro_theme|autrobook_theme)=(dark|light)/i);
        return match ? match[1].toLowerCase() : 'light';
      }

      function applyGlobalTheme(theme) {
        const t = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.toggle('dark', t === 'dark');
        if (document.body) {
          document.body.setAttribute('data-theme', t);
          document.body.classList.toggle('dark-theme', t === 'dark');
        }
      }

      function readLang() {
        for (const k of LANG_KEYS) {
          try {
            const v = (localStorage.getItem(k) || sessionStorage.getItem(k) || '').trim();
            if (v) return v;
          } catch (_) {}
        }
        const match = document.cookie.match(/(?:^|;\s*)(?:autro_lang_code|autrobook_lang|lang)=([^;]+)/i);
        return match ? decodeURIComponent(match[1]) : 'en';
      }

      async function applyGlobalLang(code) {
        const lang = code || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', ['ar', 'he', 'fa', 'ur'].includes(lang) ? 'rtl' : 'ltr');

        const dictMap = {
          en: {
            'Settings & privacy': 'Settings & privacy',
            'Search settings': 'Search settings',
            'Autrobook Account': 'Autrobook Account',
            'Personal details': 'Personal details',
            'Password and security': 'Password and security',
            'Ad preferences': 'Ad preferences',
            'Verification': 'Verification',
            'See more in Autrobook Account': 'See more in Autrobook Account',
            'Subscriptions': 'Subscriptions',
            'Autro Premium': 'Autro Premium',
            'Tools and resources': 'Tools and resources',
            'Privacy checkup': 'Privacy checkup'
          },
          bn: {
            'Settings & privacy': 'সেটিংস ও প্রাইভেসি',
            'Search settings': 'সেটিংস খুঁজুন',
            'Autrobook Account': 'অট্রোবুক অ্যাকাউন্ট',
            'Personal details': 'ব্যক্তিগত তথ্য',
            'Password and security': 'পাসওয়ার্ড ও নিরাপত্তা',
            'Ad preferences': 'বিজ্ঞাপন পছন্দ',
            'Verification': 'ভেরিফিকেশন',
            'See more in Autrobook Account': 'অট্রোবুক অ্যাকাউন্টে আরও দেখুন',
            'Subscriptions': 'সাবস্ক্রিপশন',
            'Autro Premium': 'অট্রো প্রিমিয়াম',
            'Tools and resources': 'টুলস ও রিসোর্স',
            'Privacy checkup': 'প্রাইভেসি চেকআপ'
          }
        };

        const nodes = document.querySelectorAll('h1, h2, h3, h4, p, span, a, button, label, div');
        for (const el of nodes) {
          if (el.children.length > 0) continue;
          if (!el.dataset.origText) {
            el.dataset.origText = (el.textContent || '').trim();
          }
          const baseText = el.dataset.origText;
          if (!baseText) continue;

          if (lang === 'en') {
            el.textContent = baseText;
          } else if (dictMap[lang] && dictMap[lang][baseText]) {
            el.textContent = dictMap[lang][baseText];
          } else {
            try {
              const res = await fetch(
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(lang)}&dt=t&q=${encodeURIComponent(baseText)}`
              );
              if (res.ok) {
                const data = await res.json();
                const translated = Array.isArray(data?.[0]) ? data[0].map((p) => p[0]).join('') : '';
                if (translated && readLang() === lang) {
                  el.textContent = translated;
                }
              }
            } catch (_) {}
          }
        }

        const searchInput = document.querySelector('input[type="search"], input[placeholder*="Search"]');
        if (searchInput) {
          if (!searchInput.dataset.origPlaceholder) {
            searchInput.dataset.origPlaceholder = searchInput.placeholder || '';
          }
          const ph = searchInput.dataset.origPlaceholder;
          if (lang === 'en') {
            searchInput.placeholder = ph;
          } else if (dictMap[lang] && dictMap[lang][ph]) {
            searchInput.placeholder = dictMap[lang][ph];
          }
        }
      }

      function syncAll() {
        applyGlobalTheme(readTheme());
        applyGlobalLang(readLang());
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncAll);
      } else {
        syncAll();
      }

      window.addEventListener('pageshow', syncAll);
      window.addEventListener('storage', syncAll);
      window.addEventListener('autro:theme-updated', (e) => applyGlobalTheme(e?.detail?.theme || readTheme()));
      window.addEventListener('autro:lang-updated', (e) => applyGlobalLang(e?.detail?.code || readLang()));

      try {
        if ('BroadcastChannel' in window) {
          new BroadcastChannel('autrobook_theme_sync').onmessage = (e) => {
            if (e?.data?.theme) applyGlobalTheme(e.data.theme);
          };
          new BroadcastChannel('autrobook_lang_sync').onmessage = (e) => {
            if (e?.data?.code) applyGlobalLang(e.data.code);
          };
        }
      } catch (_) {}
    })();
  </script>
</body>
