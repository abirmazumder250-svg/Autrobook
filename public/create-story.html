<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create Story</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --surface: #f1f3f4;
      --card: #FFFFFF;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --btn-sec: #f1f3f4;
      --btn-sec-hover: #e8eaed;
      --btn-sec-border: #dadce0;
      --btn-pri: #202124;
      --btn-pri-text: #FFFFFF;
      --btn-pri-hover: #3c4043;
      --shadow-sm: 0 2px 10px rgba(32, 33, 36, 0.08);
      --shadow-md: 0 18px 42px rgba(32, 33, 36, 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #292a2d;
        --card: #202124;
        --text: #FFFFFF;
        --muted: #e8eaed;
        --border: #3c4043;
        --btn-sec: #292a2d;
        --btn-sec-hover: #3c4043;
        --btn-sec-border: #3c4043;
        --btn-pri: #FFFFFF;
        --btn-pri-text: #202124;
        --btn-pri-hover: #e8eaed;
        --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.45);
        --shadow-md: 0 22px 48px rgba(0, 0, 0, 0.75);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 64px;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--btn-sec-border);
      background: var(--btn-sec);
      color: var(--text);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .icon-btn:hover { background: var(--btn-sec-hover); }
    .icon-btn:active { transform: scale(0.95); }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.25px;
      color: var(--text);
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Compact Single-Line Feature Strip */
    .studio-deck {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      box-shadow: var(--shadow-sm);
    }

    .quick-tools-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .quick-tools-row::-webkit-scrollbar { display: none; }

    .quick-tool-pill {
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .quick-tool-pill:hover { background: var(--btn-sec-hover); }
    .quick-tool-pill:active { transform: scale(0.96); }

    /* Gallery Panel */
    .gallery-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (min-width: 640px) {
      .media-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
    }

    .media-tile {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-tile img,
    .media-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .upload-tile {
      flex-direction: column;
      gap: 6px;
      color: var(--text);
      background: var(--surface);
      border-style: dashed;
      border-color: var(--btn-sec-border);
    }

    .upload-tile i { font-size: 20px; }
    .upload-tile span { font-size: 12.5px; font-weight: 700; }

    /* Editor Modal */
    .editor-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(32, 33, 36, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      backdrop-filter: blur(6px);
    }

    .editor-backdrop.open { display: flex; }

    .editor-modal {
      width: 100%;
      max-width: 980px;
      max-height: 94vh;
      overflow-y: auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .editor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .editor-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 820px) {
      .editor-layout {
        grid-template-columns: 340px 1fr;
        align-items: start;
      }
    }

    .story-stage-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .story-canvas {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .story-single-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.2s ease, transform 0.25s ease;
    }

    .story-collage-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 4px;
    }

    .story-collage-grid.single-col { grid-template-columns: 1fr; }

    .story-collage-grid img,
    .story-collage-grid video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .story-sticker-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 6px 12px;
      border-radius: 11px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--btn-sec-border);
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .story-music-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      max-width: 185px;
      padding: 6px 11px;
      border-radius: 11px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--btn-sec-border);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: var(--shadow-sm);
    }

    .story-text-overlay {
      position: absolute;
      left: 14px;
      right: 14px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--btn-sec-border);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      line-height: 1.35;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
    }

    .story-text-overlay.pos-top { top: 54px; }
    .story-text-overlay.pos-center { top: 50%; transform: translateY(-50%); }
    .story-text-overlay.pos-bottom { bottom: 18px; }

    .editor-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--btn-sec-border);
      background: var(--card);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--btn-pri);
      color: var(--btn-pri-text);
      border-color: transparent;
    }

    .editor-input,
    .editor-select {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--btn-sec-border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .editor-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .sec-btn {
      height: 40px;
      padding: 0 15px;
      border-radius: 11px;
      border: 1px solid var(--btn-sec-border);
      background: var(--btn-sec);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
    }

    .pri-btn {
      height: 40px;
      padding: 0 18px;
      border-radius: 11px;
      border: 1px solid transparent;
      background: var(--btn-pri);
      color: var(--btn-pri-text);
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .saved-stories-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .saved-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .saved-story-item {
      min-width: 130px;
      width: 130px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      text-decoration: none;
      color: var(--text);
      display: block;
    }

    .saved-story-item img,
    .saved-story-item video {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .saved-story-meta {
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(90px);
      z-index: 150;
      background: var(--btn-pri);
      color: var(--btn-pri-text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/index.html" id="closeToIndexLink" class="icon-btn" title="Back to index.html" aria-label="Back to index.html">
        <i class="fas fa-times"></i>
      </a>
      <h1 class="header-title">Create story</h1>
      <a href="story-privacy.html" id="storyPrivacyLink" class="icon-btn" title="Story privacy settings" aria-label="Story privacy settings">
        <i class="fas fa-gear"></i>
      </a>
    </div>
  </header>

  <div class="shell">
    <!-- Compact Single-Line Features -->
    <section class="studio-deck" aria-label="Story creation tools">
      <div class="quick-tools-row">
        <button type="button" class="quick-tool-pill" onclick="openEditor('text')">
          <b>Aa</b><span>Text</span>
        </button>
        <button type="button" class="quick-tool-pill" onclick="triggerMusicFileInput()">
          <i class="fas fa-music"></i><span>Music</span>
        </button>
        <button type="button" class="quick-tool-pill" onclick="openEditor('collage')">
          <i class="fas fa-table-cells-large"></i><span>Collage</span>
        </button>
        <button type="button" class="quick-tool-pill" onclick="openEditor('templates')">
          <i class="fas fa-layer-group"></i><span>Templates</span>
        </button>
        <button type="button" class="quick-tool-pill" onclick="openEditor('boomerang')">
          <i class="fas fa-infinity"></i><span>Boomerang</span>
        </button>
      </div>
    </section>

    <!-- Gallery Panel -->
    <section class="gallery-panel" aria-label="Gallery media selector">
      <input type="file" id="galleryFileInput" accept="image/*,video/*" multiple style="display:none;">
      <input type="file" id="musicFileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg" style="display:none;">

      <main id="galleryGrid" class="media-grid"></main>
    </section>

    <section id="savedStoriesSection" class="saved-stories-card" style="display:none;">
      <div style="font-size:14px;font-weight:800;">Recent stories</div>
      <div id="savedStoriesList" class="saved-list"></div>
    </section>
  </div>

  <!-- Story Editor Modal -->
  <div id="editorBackdrop" class="editor-backdrop" onclick="handleBackdropClick(event)">
    <div class="editor-modal" role="dialog" aria-modal="true" aria-label="Story Editor">
      <div class="editor-top">
        <div style="display:flex;align-items:center;gap:10px;">
          <button type="button" class="icon-btn" onclick="closeEditor()" title="Back">
            <i class="fas fa-chevron-left"></i>
          </button>
          <span id="editorModeTitle" style="font-size:17px;font-weight:800;">Edit story</span>
        </div>
        <button type="button" class="sec-btn" onclick="triggerGalleryInput()">
          <i class="fas fa-images"></i>
          <span>Gallery</span>
        </button>
      </div>

      <div class="editor-layout">
        <div class="story-stage-wrap">
          <div id="storyCanvas" class="story-canvas" onclick="handleCanvasCenterClick(event)" title="Click photo or video to open story-card.html">
            <div id="canvasMediaContainer" style="width:100%;height:100%;"></div>
            <div id="canvasSticker" class="story-sticker-badge" style="display:none;"></div>
            <div id="canvasMusic" class="story-music-pill" style="display:none;"></div>
            <div id="canvasText" class="story-text-overlay pos-center" style="display:none;"></div>
          </div>
        </div>

        <div class="editor-controls">
          <div class="control-box">
            <span class="control-label">Text &amp; position</span>
            <input id="storyTextInput" type="text" class="editor-input" placeholder="Type story caption or quote..." oninput="syncEditorToCanvas()">
            <div class="chip-row">
              <button type="button" class="chip-btn active" data-pos="top" onclick="setTextPosition('top', this)">Top</button>
              <button type="button" class="chip-btn" data-pos="center" onclick="setTextPosition('center', this)">Center</button>
              <button type="button" class="chip-btn" data-pos="bottom" onclick="setTextPosition('bottom', this)">Bottom</button>
            </div>
          </div>

          <div class="control-box">
            <span class="control-label">Filter &amp; layout</span>
            <div class="chip-row">
              <button type="button" class="chip-btn active" onclick="setFilter('none', this)">Normal</button>
              <button type="button" class="chip-btn" onclick="setFilter('contrast(1.15) saturate(1.3)', this)">Vivid</button>
              <button type="button" class="chip-btn" onclick="setFilter('grayscale(1)', this)">B&amp;W</button>
              <button type="button" class="chip-btn" onclick="setFilter('sepia(0.35) saturate(1.2)', this)">Warm</button>
              <button type="button" class="chip-btn" onclick="setFilter('hue-rotate(15deg) saturate(1.1)', this)">Cool</button>
            </div>
            <div class="chip-row" style="margin-top:4px;">
              <button type="button" class="chip-btn active" id="layoutSingleBtn" onclick="setLayoutMode('single')">Single</button>
              <button type="button" class="chip-btn" id="layoutCollageBtn" onclick="setLayoutMode('collage')">Collage</button>
              <button type="button" class="chip-btn" id="layoutBoomerangBtn" onclick="setLayoutMode('boomerang')">Boomerang</button>
            </div>
          </div>

          <div class="control-box">
            <span class="control-label">Music &amp; sticker</span>
            <div style="display:flex;gap:8px;align-items:center;">
              <button type="button" class="sec-btn" onclick="triggerMusicFileInput()" style="flex-shrink:0;">
                <i class="fas fa-folder-open"></i>
                <span>Phone files</span>
              </button>
              <select id="musicSelect" class="editor-select" onchange="onMusicSelectChange()">
                <option value="">No music</option>
                <option value="Midnight Breeze — Chill Beats">Midnight Breeze — Chill Beats</option>
                <option value="Golden Hour — Acoustic">Golden Hour — Acoustic</option>
                <option value="Night Drive — Synthwave">Night Drive — Synthwave</option>
                <option value="Morning Calm — Lo-Fi">Morning Calm — Lo-Fi</option>
              </select>
            </div>
            <div id="selectedMusicInfo" style="font-size:12px;font-weight:700;color:var(--muted);"></div>

            <div class="chip-row" style="margin-top:4px;">
              <button type="button" class="chip-btn active" onclick="setSticker('', this)">None</button>
              <button type="button" class="chip-btn" onclick="setSticker('Good Vibes', this)">Good Vibes</button>
              <button type="button" class="chip-btn" onclick="setSticker('On My Mind', this)">On My Mind</button>
              <button type="button" class="chip-btn" onclick="setSticker('Highlight', this)">Highlight</button>
              <button type="button" class="chip-btn" onclick="setSticker('Throwback', this)">Throwback</button>
            </div>
          </div>

          <div class="control-box">
            <span class="control-label">Audience</span>
            <select id="audienceSelect" class="editor-select">
              <option value="Public">Public</option>
              <option value="Friends">Friends</option>
              <option value="Close friends">Close friends</option>
            </select>
          </div>
        </div>
      </div>

      <div class="editor-footer">
        <button type="button" class="sec-btn" onclick="closeEditor()">Cancel</button>
        <a href="/index.html" id="shareToIndexBtn" class="pri-btn" onclick="return handleShareClick(event)">
          <i class="fas fa-paper-plane"></i>
          <span>Share</span>
        </a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const STORY_CARD_PAGE = 'story-card.html';
    const HOME_INDEX_PAGE = '/index.html';

    let sb = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        sb = null;
      }
    }

    let galleryItems = [];
    let selectedIds = [];
    let currentFilter = 'none';
    let currentLayout = 'single';
    let currentTextPos = 'top';
    let currentSticker = '';
    let selectedMusicUrl = '';
    let selectedMusicName = '';
    let publishedStories = [];

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function fileToDataUrl(file, maxBytes = 4 * 1024 * 1024) {
      return new Promise((resolve) => {
        if (!file || file.size > maxBytes) return resolve('');
        const reader = new FileReader();
        reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    function buildStoryPayload(storyId = null, itemOverride = null) {
      const chosen = itemOverride
        ? [itemOverride]
        : selectedIds.map(id => galleryItems.find(m => m.id === id)).filter(Boolean);
      const first = chosen[0] || galleryItems[0] || null;
      const caption = (document.getElementById('storyTextInput')?.value || '').trim();
      const audience = document.getElementById('audienceSelect')?.value || 'Public';
      const selectVal = document.getElementById('musicSelect')?.value || '';
      const musicTitle = selectedMusicName || selectVal || '';
      const nowIso = new Date().toISOString();
      const expiresIso = new Date(Date.now() + 48 * 60 * 60 * 1000).toISOString();
      const authorName = localStorage.getItem('autro_profile_name') || 'Autrobook User';
      const authorAvatar = localStorage.getItem('autro_profile_avatar') || '';
      const userId = localStorage.getItem('autro_user_id') || '';

      return {
        id: storyId || ('story_' + Date.now()),
        user_id: userId,
        author_name: authorName,
        author_avatar: authorAvatar,
        media_url: first ? first.url : '',
        image_url: first ? first.url : '',
        media_type: first ? first.type : 'image',
        items: chosen.map(m => ({ url: m.url, media_url: m.url, type: m.type, label: m.label || 'Media' })),
        title: caption || currentSticker || (first && first.label) || 'Story',
        caption,
        text_position: currentTextPos,
        filter: currentFilter,
        layout: currentLayout,
        sticker: currentSticker,
        music: musicTitle,
        music_name: musicTitle,
        music_url: selectedMusicUrl || '',
        audience,
        card_route: STORY_CARD_PAGE,
        home_route: HOME_INDEX_PAGE,
        created_at: nowIso,
        expires_at: expiresIso
      };
    }

    function storeStoryInAllKeys(payload) {
      const portable = {
        ...payload,
        media_url: String(payload.media_url || '').startsWith('blob:') && payload.dataUrl ? payload.dataUrl : (payload.media_url || ''),
        image_url: String(payload.image_url || '').startsWith('blob:') && payload.dataUrl ? payload.dataUrl : (payload.image_url || payload.media_url || ''),
        music_url: String(payload.music_url || '').startsWith('blob:') && payload.musicDataUrl ? payload.musicDataUrl : (payload.music_url || '')
      };
      delete portable.dataUrl;
      delete portable.musicDataUrl;

      try {
        sessionStorage.setItem('autrobook_active_story_card', JSON.stringify(portable));
        localStorage.setItem('autrobook_active_story_card', JSON.stringify(portable));
        localStorage.setItem('autro_new_story_created', JSON.stringify(portable));
      } catch (e) {}

      ['autrobook_stories', 'autro_stories'].forEach((key) => {
        try {
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          const arr = Array.isArray(existing) ? existing.filter(s => s && String(s.id) !== String(portable.id)) : [];
          arr.unshift(portable);
          localStorage.setItem(key, JSON.stringify(arr.slice(0, 25)));
        } catch (e) {}
      });
    }

    function openStoryCardPage(storyObj) {
      const payload = storyObj || buildStoryPayload();
      if (!payload.media_url) {
        triggerGalleryInput();
        return;
      }
      storeStoryInAllKeys(payload);
      window.location.href = `${STORY_CARD_PAGE}?id=${encodeURIComponent(payload.id)}&from=${encodeURIComponent(HOME_INDEX_PAGE)}`;
    }

    function handleCanvasCenterClick(e) {
      const target = e.target;
      const isMediaEl = target && (
        target.classList.contains('story-single-media') ||
        target.tagName === 'IMG' ||
        target.tagName === 'VIDEO' ||
        target.id === 'canvasMediaContainer'
      );
      if (!isMediaEl) return;
      openStoryCardPage(buildStoryPayload());
    }

    function triggerGalleryInput() {
      const input = document.getElementById('galleryFileInput');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    function triggerMusicFileInput() {
      const input = document.getElementById('musicFileInput');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    function onMusicSelectChange() {
      const sel = document.getElementById('musicSelect');
      if (sel && sel.value) {
        selectedMusicName = sel.value;
        selectedMusicUrl = '';
      } else if (!selectedMusicUrl) {
        selectedMusicName = '';
      }
      updateMusicInfoLabel();
      syncEditorToCanvas();
    }

    function updateMusicInfoLabel() {
      const info = document.getElementById('selectedMusicInfo');
      if (!info) return;
      info.textContent = selectedMusicName ? `Saved audio: ${selectedMusicName}` : '';
    }

    function bindMusicUpload() {
      const input = document.getElementById('musicFileInput');
      if (!input) return;
      input.addEventListener('change', async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const blobUrl = URL.createObjectURL(file);
        const dataUrl = await fileToDataUrl(file, 5 * 1024 * 1024);
        selectedMusicUrl = dataUrl || blobUrl;
        selectedMusicName = file.name.replace(/\.[^/.]+$/, '') || file.name;

        const sel = document.getElementById('musicSelect');
        if (sel) {
          let opt = Array.from(sel.options).find(o => o.value === selectedMusicName);
          if (!opt) {
            opt = document.createElement('option');
            opt.value = selectedMusicName;
            opt.textContent = selectedMusicName;
            sel.appendChild(opt);
          }
          sel.value = selectedMusicName;
        }

        updateMusicInfoLabel();
        syncEditorToCanvas();
        showToast(`Music attached: ${selectedMusicName}`);
      });
    }

    function handleTileClick(id) {
      const item = galleryItems.find(m => m.id === id);
      selectedIds = [id];
      renderGallery();
      if (item) {
        openStoryCardPage(buildStoryPayload(null, item));
      }
    }

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      if (!grid) return;

      const pickTileHtml = `
        <div class="media-tile upload-tile" onclick="triggerGalleryInput()">
          <i class="fas fa-images"></i>
          <span>Gallery</span>
        </div>
      `;

      const itemsHtml = galleryItems.map(item => {
        const mediaTag = item.type === 'video'
          ? `<video src="${item.url}" muted playsinline preload="metadata"></video>`
          : `<img src="${item.url}" alt="${escapeHtml(item.label || 'Gallery media')}">`;

        return `
          <div class="media-tile" onclick="handleTileClick('${item.id}')">
            ${mediaTag}
          </div>
        `;
      }).join('');

      grid.innerHTML = pickTileHtml + itemsHtml;
    }

    function bindGalleryUpload() {
      const input = document.getElementById('galleryFileInput');
      if (!input) return;
      input.addEventListener('change', async () => {
        const files = Array.from(input.files || []);
        if (!files.length) return;

        const addedIds = [];
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const blobUrl = URL.createObjectURL(file);
          const dataUrl = await fileToDataUrl(file, 3.5 * 1024 * 1024);
          const id = 'gallery_' + Date.now() + '_' + i;
          const isVideo = file.type && file.type.startsWith('video/');
          galleryItems.unshift({
            id,
            type: isVideo ? 'video' : 'image',
            url: blobUrl,
            dataUrl,
            label: file.name || 'Gallery item'
          });
          addedIds.push(id);
        }

        selectedIds = addedIds.length > 1 ? addedIds : [addedIds[0]];
        if (addedIds.length > 1 && currentLayout === 'single') {
          currentLayout = 'collage';
        }
        renderGallery();
        openEditor('media');
        showToast(`${files.length} selected from gallery`);
      });
    }

    function openEditor(mode) {
      if (!galleryItems.length && mode !== 'text') {
        triggerGalleryInput();
        return;
      }

      const titles = {
        text: 'Add text to story',
        music: 'Add music to story',
        collage: 'Story collage',
        templates: 'Story template',
        boomerang: 'Boomerang story',
        settings: 'Story settings',
        media: 'Edit story'
      };
      document.getElementById('editorModeTitle').textContent = titles[mode] || 'Edit story';

      if (mode === 'collage' && selectedIds.length < 2 && galleryItems.length >= 2) {
        selectedIds = galleryItems.slice(0, 2).map(x => x.id);
        currentLayout = 'collage';
      } else if (mode === 'boomerang') {
        currentLayout = 'boomerang';
      } else if (mode === 'templates') {
        currentSticker = 'Highlight';
      }

      updateLayoutButtons();
      updateMusicInfoLabel();
      syncEditorToCanvas();
      document.getElementById('editorBackdrop').classList.add('open');
      if (mode === 'text') {
        setTimeout(() => document.getElementById('storyTextInput')?.focus(), 80);
      }
    }

    function closeEditor() {
      document.getElementById('editorBackdrop').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'editorBackdrop') closeEditor();
    }

    function setTextPosition(pos, btn) {
      currentTextPos = pos;
      btn.parentElement?.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      syncEditorToCanvas();
    }

    function setFilter(filterVal, btn) {
      currentFilter = filterVal;
      btn.parentElement?.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      syncEditorToCanvas();
    }

    function updateLayoutButtons() {
      document.getElementById('layoutSingleBtn')?.classList.toggle('active', currentLayout === 'single');
      document.getElementById('layoutCollageBtn')?.classList.toggle('active', currentLayout === 'collage');
      document.getElementById('layoutBoomerangBtn')?.classList.toggle('active', currentLayout === 'boomerang');
    }

    function setLayoutMode(mode) {
      currentLayout = mode;
      if (mode === 'collage' && selectedIds.length < 2 && galleryItems.length >= 2) {
        selectedIds = galleryItems.slice(0, 2).map(x => x.id);
      }
      updateLayoutButtons();
      syncEditorToCanvas();
    }

    function setSticker(stickerText, btn) {
      currentSticker = stickerText;
      btn.parentElement?.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      syncEditorToCanvas();
    }

    function syncEditorToCanvas() {
      const container = document.getElementById('canvasMediaContainer');
      const textEl = document.getElementById('canvasText');
      const musicEl = document.getElementById('canvasMusic');
      const stickerEl = document.getElementById('canvasSticker');

      const chosen = selectedIds
        .map(id => galleryItems.find(m => m.id === id))
        .filter(Boolean);

      if (!chosen.length && galleryItems.length) {
        chosen.push(galleryItems[0]);
      }

      if (container) {
        const extraClass = currentLayout === 'boomerang' ? 'boomerang-loop' : '';
        if (currentLayout === 'collage' && chosen.length > 1) {
          const singleColClass = chosen.length === 2 ? 'single-col' : '';
          container.innerHTML = `
            <div class="story-collage-grid ${singleColClass}">
              ${chosen.slice(0, 4).map(m => m.type === 'video'
                ? `<video src="${m.url}" style="filter:${currentFilter};" muted autoplay loop playsinline></video>`
                : `<img src="${m.url}" style="filter:${currentFilter};" alt="Collage item">`
              ).join('')}
            </div>
          `;
        } else {
          const first = chosen[0];
          container.innerHTML = first
            ? (first.type === 'video'
                ? `<video src="${first.url}" class="story-single-media ${extraClass}" style="filter:${currentFilter};" muted autoplay loop playsinline></video>`
                : `<img src="${first.url}" class="story-single-media ${extraClass}" style="filter:${currentFilter};" alt="Story preview">`)
            : '';
        }
      }

      const caption = (document.getElementById('storyTextInput')?.value || '').trim();
      if (textEl) {
        if (caption) {
          textEl.style.display = 'block';
          textEl.className = `story-text-overlay pos-${currentTextPos}`;
          textEl.textContent = caption;
        } else {
          textEl.style.display = 'none';
        }
      }

      const track = selectedMusicName || (document.getElementById('musicSelect')?.value || '');
      if (musicEl) {
        if (track) {
          musicEl.style.display = 'block';
          musicEl.innerHTML = `<i class="fas fa-music"></i> ${escapeHtml(track)}`;
        } else {
          musicEl.style.display = 'none';
        }
      }

      if (stickerEl) {
        const label = currentSticker || (currentLayout === 'boomerang' ? 'Boomerang' : '');
        if (label) {
          stickerEl.style.display = 'block';
          stickerEl.textContent = label;
        } else {
          stickerEl.style.display = 'none';
        }
      }
    }

    async function persistStoryToSupabase(storyObj) {
      if (!sb) return;
      try {
        let userId = null;
        if (sb.auth?.getUser) {
          const { data } = await sb.auth.getUser();
          userId = data?.user?.id || null;
        }
        await sb.from('stories').insert({
          id: storyObj.id,
          user_id: userId,
          media_url: storyObj.media_url,
          media_type: storyObj.media_type,
          caption: storyObj.title,
          audience: storyObj.audience,
          created_at: storyObj.created_at
        });
      } catch (e) {
        console.warn('Supabase story insert skipped:', e);
      }
    }

    async function handleShareClick(e) {
      if (e) e.preventDefault();
      const payload = buildStoryPayload();
      if (!payload.media_url) {
        window.location.href = HOME_INDEX_PAGE;
        return false;
      }

      publishedStories = [payload, ...publishedStories.filter(s => s && String(s.id) !== String(payload.id))].slice(0, 25);
      storeStoryInAllKeys(payload);

      await persistStoryToSupabase(payload);
      renderSavedStories();
      closeEditor();
      window.location.href = `${HOME_INDEX_PAGE}?story=${encodeURIComponent(payload.id)}`;
      return false;
    }

    function renderSavedStories() {
      const section = document.getElementById('savedStoriesSection');
      const list = document.getElementById('savedStoriesList');
      if (!section || !list || !publishedStories.length) return;
      section.style.display = 'flex';
      list.innerHTML = publishedStories.map(st => {
        const href = `${STORY_CARD_PAGE}?id=${encodeURIComponent(st.id)}&from=${encodeURIComponent(HOME_INDEX_PAGE)}`;
        return `
          <a href="${href}" class="saved-story-item" onclick="event.preventDefault();openStoryCardPage(${escapeHtml(JSON.stringify(st))})">
            ${st.media_type === 'video'
              ? `<video src="${st.media_url}" muted playsinline></video>`
              : `<img src="${st.media_url}" alt="${escapeHtml(st.title)}">`}
            <div class="saved-story-meta">${escapeHtml(st.title)} · ${escapeHtml(st.audience)}</div>
          </a>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const stored = JSON.parse(localStorage.getItem('autrobook_stories') || '[]') || [];
        if (Array.isArray(stored) && stored.length) {
          publishedStories = stored;
          renderSavedStories();
        }
      } catch (e) {}
      bindGalleryUpload();
      bindMusicUpload();
      renderGallery();
    });
  </script>
</body>
  </html>
