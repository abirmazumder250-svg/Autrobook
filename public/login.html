<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Log in - Autrobook</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F8F9FA;
    --card: #FFFFFF;
    --text: #202124;
    --muted: #5F6368;
    --border: rgba(32, 33, 36, 0.14);
    --input-bg: #FFFFFF;

    --primary: #202124;
    --primary-hover: #3C4043;
    --accent: #202124;
    --accent-dark: #202124;
    --accent-soft: rgba(32, 33, 36, 0.08);

    --danger: #DC2626;
    --success: #202124;
    --disabled: #9AA0A6;

    --shadow-sm: 0 2px 10px rgba(32, 33, 36, 0.04);
    --shadow-md: 0 12px 32px rgba(32, 33, 36, 0.08);
    --shadow-btn: 0 8px 22px rgba(32, 33, 36, 0.18);

    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-pill: 999px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #292A2D;
      --card: #202124;
      --text: #FFFFFF;
      --muted: #BDC1C6;
      --border: rgba(255, 255, 255, 0.16);
      --input-bg: #292A2D;

      --primary: #FFFFFF;
      --primary-hover: #E8EAED;
      --accent: #FFFFFF;
      --accent-dark: #E8EAED;
      --accent-soft: rgba(255, 255, 255, 0.12);

      --success: #FFFFFF;

      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.40);
      --shadow-btn: 0 8px 22px rgba(0, 0, 0, 0.35);
    }

    #cameraStream {
      background: #000000;
    }

    .lang-modal,
    .lang-search-input {
      background: var(--card);
      color: var(--text);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: rgba(32, 33, 36, 0.12);
    -webkit-font-smoothing: antialiased;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .login-wrap {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    padding:
      calc(env(safe-area-inset-top, 0px) + 8px)
      20px
      calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .lang-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    margin-bottom: 10px;
    position: relative;
    z-index: 10;
  }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 9px 15px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    max-width: 245px;
    transition: transform 0.18s ease, border-color 0.2s ease, background-color 0.2s ease;
  }

  .lang-btn:hover {
    border-color: var(--accent);
    background: var(--bg);
  }

  .lang-btn:active {
    transform: scale(0.96);
  }

  .lang-btn svg {
    width: 16px;
    height: 16px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .lang-btn span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lang-chevron {
    width: 14px !important;
    height: 14px !important;
    color: var(--muted) !important;
  }

  .top-logo {
    margin-top: 6px;
    margin-bottom: 20px;
  }

  .logo-box {
    width: 78px;
    height: 78px;
    border-radius: 22px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 10px 24px rgba(32, 33, 36, 0.06),
      0 4px 12px rgba(32, 33, 36, 0.08);
  }

  .top-logo img {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    object-fit: cover;
    display: block;
  }

  .login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-group {
    position: relative;
    width: 100%;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .input-group input.has-toggle {
    padding-right: 46px;
  }

  .input-group input:focus {
    border-color: var(--accent);
  }

  .toggle-pass-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
  }

  .toggle-pass-btn:hover {
    color: var(--accent);
    background: var(--surface);
  }

  .form-options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 2px;
  }

  .remember-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  .remember-label input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .security-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }

  .sec-btn {
    width: 100%;
    padding: 12px 16px;
    border-radius: var(--radius-pill);
    border: 1.5px dashed var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }

  .sec-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--bg);
  }

  .sec-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #selfiePreview {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    display: none;
    border: 2px solid var(--accent);
  }

  .sec-btn.verified {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    border-style: solid;
  }

  .btn-login {
    width: 100%;
    min-height: 52px;
    padding: 15px 20px;
    border-radius: var(--radius-pill);
    background: #202124;
    color: #FFFFFF;
    border: none;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: background-color 0.2s ease, transform 0.15s ease;
    margin-top: 6px;
  }

  .btn-login:hover:not(:disabled) {
    background: #3C4043;
  }

  .btn-login:active:not(:disabled) {
    transform: scale(0.98);
  }

  .btn-login:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    background: var(--disabled);
    box-shadow: none;
  }

  @media (prefers-color-scheme: dark) {
    .btn-login {
      background: #FFFFFF;
      color: #202124;
    }

    .btn-login:hover:not(:disabled) {
      background: #E8EAED;
    }
  }

  .link-forgot {
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
  }

  .link-forgot:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .g-recaptcha {
    margin: 14px 0 6px;
    display: flex;
    justify-content: center;
  }

  .error-msg {
    color: var(--danger);
    font-size: 13.5px;
    text-align: center;
    min-height: 20px;
    font-weight: 700;
    word-break: break-word;
    line-height: 1.4;
  }

  .success-msg {
    color: var(--success);
    font-size: 13.5px;
    text-align: center;
    min-height: 20px;
    font-weight: 700;
    line-height: 1.4;
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    margin: 10px 0;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border);
  }

  .divider span {
    padding: 0 12px;
  }

  .btn-google,
  .btn-create {
    width: 100%;
    min-height: 50px;
    padding: 13px 20px;
    border-radius: var(--radius-pill);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .btn-google {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-google:hover {
    background: var(--bg);
    border-color: var(--accent);
  }

  .btn-create {
    background: var(--bg);
    color: var(--text);
    border: 1.5px solid var(--text);
    margin-top: 12px;
  }

  .btn-create:hover {
    background: var(--accent-soft);
  }

  .footer-meta {
    font-weight: 800;
    font-size: 18px;
    margin-top: 22px;
    margin-bottom: 4px;
    color: var(--text);
  }

  .footer-sub {
    font-size: 13px;
    color: var(--muted);
  }

  /* Live Selfie Modal */
  .modal-back {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 18px;
  }

  .modal-box {
    background: var(--card);
    width: 100%;
    max-width: 380px;
    border-radius: 24px;
    border: 1px solid var(--border);
    padding: 24px;
    box-shadow: var(--shadow-md);
  }

  .modal-box h3 {
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    color: var(--text);
  }

  .scan-hint {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    text-align: center;
    margin-bottom: 12px;
    min-height: 18px;
  }

  .modal-close {
    width: 100%;
    padding: 13px 16px;
    margin-top: 12px;
    background: #202124;
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius-pill);
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }

  @media (prefers-color-scheme: dark) {
    .modal-close {
      background: #FFFFFF;
      color: #202124;
    }
  }

  #cameraStream {
    width: 100%;
    border-radius: 14px;
    margin-bottom: 8px;
    background: #000000;
    transform: scaleX(-1);
  }

  /* Language Selection Modal */
  .lang-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.52);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .lang-modal-overlay.active {
    display: flex;
  }

  .lang-modal {
    width: 100%;
    max-width: 410px;
    height: 82vh;
    height: 82dvh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    animation: modalPop 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .lang-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .lang-header h3 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
  }

  .close-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
  }

  .lang-search-wrap {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .lang-search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  .lang-search-input:focus {
    border-color: var(--accent);
  }

  .lang-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .lang-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color 0.16s ease;
  }

  .lang-item:hover {
    background: var(--surface);
  }

  .lang-item.selected {
    background: var(--accent-soft);
  }

  .lang-label-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
  }

  .lang-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
  }

  .lang-country {
    font-size: 12px;
    color: var(--muted);
  }

  .lang-radio {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  @keyframes modalPop {
    from {
      transform: scale(0.95);
      opacity: 0;
    }
    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  @media (min-width: 481px) {
    body {
      background: var(--surface);
      padding: 24px 0;
    }
    .login-wrap {
      min-height: calc(100vh - 48px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow-md);
      padding: 16px 26px 28px;
    }
  }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<div class="login-wrap">

  <div class="lang-top">
    <button type="button" class="lang-btn" id="languageButton" onclick="openLangModal()" aria-label="Change language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <span id="currentLangText">English (US)</span>
      <svg class="lang-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <div class="top-logo">
    <div class="logo-box">
      <img src="logo.png" alt="Autrobook">
    </div>
  </div>

  <form id="loginForm" class="login-form">
    <div class="input-group">
      <input type="text" id="email" placeholder="Username or email" required autocomplete="username">
    </div>

    <div class="input-group">
      <input type="password" id="password" class="has-toggle" placeholder="Password" required autocomplete="current-password">
      <button type="button" class="toggle-pass-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Show or hide password">
        <i class="fas fa-eye" id="togglePasswordIcon"></i>
      </button>
    </div>

    <div class="form-options-row">
      <label class="remember-label" for="rememberMe">
        <input type="checkbox" id="rememberMe" checked>
        <span id="rememberMeText">Remember me</span>
      </label>
      <a href="reset-password.html" class="link-forgot" id="forgotLink">Forgot password?</a>
    </div>

    <div class="security-box">
      <button type="button" class="sec-btn" id="fingerprintBtn" onclick="loginWithPasskey()">
        <i class="fas fa-fingerprint"></i>
        <span id="fingerprintText">Login with Passkey</span>
      </button>

      <button type="button" class="sec-btn" id="selfieBtn" onclick="openLiveSelfieScanner()">
        <img id="selfiePreview" src="" alt="Live Selfie">
        <i id="selfieIcon" class="fas fa-eye"></i>
        <span id="selfieText">Live Selfie &amp; Eye Scan</span>
      </button>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">Log in</button>
  </form>

  <div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d"></div>

  <div id="errorMsg" class="error-msg"></div>
  <div id="successMsg" class="success-msg"></div>

  <div class="divider"><span id="orText">or</span></div>

  <button type="button" class="btn-google" onclick="googleLogin()">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.25-.164-1.84H9v3.481h4.844c-.209 1.131-.868 2.09-1.852 2.731v2.263h2.991c1.75-1.613 2.76-3.986 2.76-6.635z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.991-2.263c-.83.555-1.89.884-2.965.884-2.282 0-4.213-1.541-4.902-3.608H.945v2.267C2.43 16.36 5.486 18 9 18z"/>
      <path fill="#FBBC05" d="M4.098 10.829A5.4 5.4 0 0 1 3.85 9c0-.63.11-1.24.248-1.829V4.904H.945A9.018 9.018 0 0 0 0 9c0 1.45.35 2.82.945 4.096l3.153-2.267z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.486 0 2.43 1.64.945 4.096l3.153 2.267C4.787 5.12 6.718 3.58 9 3.58z"/>
    </svg>
    <span id="googleText">Continue with Google</span>
  </button>

  <button type="button" class="btn-create" id="btnCreate" onclick="window.location.href='signup-name.html'">Create new account</button>

  <div class="footer-meta">Autrobook</div>
  <div class="footer-sub" id="footerSub">18+ Free Social Media Platform</div>
</div>

<!-- Live Selfie & Eye Scanner Modal -->
<div class="modal-back" id="cameraModal" onclick="closeCamera()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="faceIdTitle">Live Selfie &amp; Eye Scan</h3>
    <p class="scan-hint" id="scanHint">Position a real human face in frame and blink clearly</p>
    <video id="cameraStream" autoplay playsinline muted></video>
    <button type="button" class="modal-close" id="cancelCamBtn" onclick="closeCamera()" style="background: var(--surface); color: var(--muted); border: 1px solid var(--border);">Cancel</button>
  </div>
</div>

<!-- LANGUAGE SELECTION MODAL WITH SEARCH -->
<div class="lang-modal-overlay" id="langModal" onclick="closeLangModal()">
  <div class="lang-modal" onclick="event.stopPropagation()">
    <div class="lang-header">
      <h3 id="langModalTitle">Select Language</h3>
      <button type="button" class="close-btn" id="langCloseBtn" onclick="closeLangModal()" aria-label="Close">✕</button>
    </div>
    <div class="lang-search-wrap">
      <input type="text" class="lang-search-input" id="langSearchInput" placeholder="Search language or country...">
    </div>
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";
  const MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
  const MAX_CAPTCHA_ATTEMPTS = 5;

  const LANGUAGE_ID_KEY = "autro_lang_id";
  const LANGUAGE_CODE_KEY = "autro_lang";
  const REMEMBERED_ID_KEY = "autro_remembered_identifier";

  let currentLangId = localStorage.getItem(LANGUAGE_ID_KEY) || "en-US";
  let currentLang = localStorage.getItem(LANGUAGE_CODE_KEY) || localStorage.getItem("lang") || "en";

  function getActiveLanguageObj() {
    const exact = languages.find(l => l.id === currentLangId);
    if (exact) return exact;
    if (currentLang) {
      const byCode = languages.find(l => l.code === currentLang || l.id === currentLang);
      if (byCode) return byCode;
    }
    return languages[0];
  }

  function getTranslationDict(langObj) {
    const code = (langObj && langObj.code) || "en";
    const baseCode = code.split("-")[0];
    if (LOGIN_TRANSLATIONS[code]) return LOGIN_TRANSLATIONS[code];
    if (LOGIN_TRANSLATIONS[baseCode]) return LOGIN_TRANSLATIONS[baseCode];

    const label = (langObj && langObj.name) || code || "English";
    return Object.assign({}, LOGIN_TRANSLATIONS.en, {
      title: `${LOGIN_TRANSLATIONS.en.title} (${label})`,
      tagline: `${LOGIN_TRANSLATIONS.en.tagline} • ${label}`
    });
  }

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function togglePasswordVisibility() {
    const input = document.getElementById("password");
    const icon = document.getElementById("togglePasswordIcon");
    if (!input || !icon) return;
    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }

  function applyLanguage() {
    const activeLang = getActiveLanguageObj();
    const t = getTranslationDict(activeLang);

    document.documentElement.lang = activeLang.code;
    document.documentElement.dir = activeLang.rtl ? "rtl" : "ltr";
    document.title = t.title;

    const setText = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.innerText = val;
    };
    const setPlaceholder = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.placeholder = val;
    };

    setText("currentLangText", activeLang.name);
    setText("loginBtn", t.loginBtn);
    setPlaceholder("email", t.emailPlaceholder);
    setPlaceholder("password", t.passPlaceholder);
    setText("rememberMeText", t.rememberMe);
    setText("forgotLink", t.forgot);
    setText("orText", t.or);
    setText("googleText", t.google);
    setText("btnCreate", t.create);
    setText("footerSub", t.tagline);
    setText("fingerprintText", t.btnPasskey);
    setText("faceIdTitle", t.faceIdTitle);
    setText("scanHint", t.scanHint);
    setText("cancelCamBtn", t.cancelBtn);
    setText("langModalTitle", t.modalTitle);
    setPlaceholder("langSearchInput", t.searchPlaceholder);
    setText("selfieText", isLiveSelfieVerified ? t.selfieVerified : t.btnSelfie);
  }

  async function syncLanguageToSupabase(langCode, langName, dir) {
    const emailEl = document.getElementById("email");
    const emailVal = emailEl ? emailEl.value.trim() : "";

    await supabaseClient.auth.updateUser({
      data: { language: langCode, language_name: langName, dir }
    });

    const payload = {
      language: langCode,
      language_name: langName,
      dir,
      updated_at: new Date().toISOString()
    };
    if (emailVal) payload.email = emailVal;
    await supabaseClient.from("language_preferences").upsert(payload, { onConflict: "email" });
  }

  function selectLanguage(langObj) {
    currentLangId = langObj.id;
    currentLang = langObj.code;
    const finalDir = langObj.rtl ? "rtl" : "ltr";

    localStorage.setItem(LANGUAGE_ID_KEY, langObj.id);
    localStorage.setItem(LANGUAGE_CODE_KEY, langObj.code);
    localStorage.setItem("lang", langObj.code);
    localStorage.setItem("autro_language", langObj.code);
    localStorage.setItem("autro_language_name", langObj.name);
    localStorage.setItem("autro_language_dir", finalDir);

    applyLanguage();
    buildLangList(document.getElementById("langSearchInput")?.value || "");
    closeLangModal();
    syncLanguageToSupabase(langObj.code, langObj.name, finalDir);
    clearMessages();

    window.dispatchEvent(new CustomEvent("autro:languageChanged", {
      detail: { code: langObj.code, name: langObj.name, dir: finalDir }
    }));
  }

  function buildLangList(filterQuery = "") {
    const list = document.getElementById("langList");
    if (!list) return;
    list.innerHTML = "";

    const q = String(filterQuery || "").trim().toLowerCase();
    const filtered = languages.filter(lang =>
      lang.name.toLowerCase().includes(q) ||
      lang.country.toLowerCase().includes(q) ||
      lang.code.toLowerCase().includes(q)
    );

    if (filtered.length === 0) {
      list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">No matching language or country found.</div>`;
      return;
    }

    filtered.forEach(language => {
      const isSelected = currentLangId === language.id;
      const item = document.createElement("div");
      item.className = "lang-item" + (isSelected ? " selected" : "");
      item.innerHTML = `
        <div class="lang-label-group">
          <span class="lang-name">${escapeHTML(language.name)}</span>
          <span class="lang-country">${escapeHTML(language.country)}</span>
        </div>
        <input
          type="radio"
          class="lang-radio"
          name="modalLang"
          value="${escapeHTML(language.id)}"
          ${isSelected ? "checked" : ""}
        >
      `;
      item.addEventListener("click", () => {
        selectLanguage(language);
      });
      list.appendChild(item);
    });
  }

  function openLangModal() {
    const modal = document.getElementById("langModal");
    const searchInput = document.getElementById("langSearchInput");
    if (searchInput) searchInput.value = "";
    buildLangList("");
    if (modal) modal.classList.add("active");
    setTimeout(() => {
      if (searchInput) searchInput.focus();
    }, 100);
  }

  function closeLangModal() {
    const modal = document.getElementById("langModal");
    if (modal) modal.classList.remove("active");
  }

  function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = "flex";
  }

  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  }

  function getDistance(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function computeEAR(eye) {
    const v1 = getDistance(eye[1], eye[5]);
    const v2 = getDistance(eye[2], eye[4]);
    const h = getDistance(eye[0], eye[3]);
    return h === 0 ? 0.3 : (v1 + v2) / (2 * h);
  }

  function cleanupScanner() {
    if (scanInterval) {
      clearInterval(scanInterval);
      scanInterval = null;
    }
    if (scanTimeout) {
      clearTimeout(scanTimeout);
      scanTimeout = null;
    }
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
  }

  function closeCamera() {
    cleanupScanner();
    closeModal("cameraModal");
    if (!isLiveSelfieVerified) {
      const btn = document.getElementById("selfieBtn");
      if (btn) btn.disabled = false;
    }
  }

  async function openLiveSelfieScanner() {
    clearMessages();
    const btn = document.getElementById("selfieBtn");
    const hint = document.getElementById("scanHint");
    const t = getTranslationDict(getActiveLanguageObj());

    openModal("cameraModal");
    hint.innerText = "Starting camera & human face detector...";
    btn.disabled = true;

    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });

    const video = document.getElementById("cameraStream");
    video.srcObject = videoStream;
    await video.play();

    if (!modelsLoaded) {
      hint.innerText = "Loading eye & face scan models...";
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      modelsLoaded = true;
    }

    hint.innerText = t.scanHint;
    let blinkCount = 0;
    let eyeClosed = false;
    let finished = false;

    scanInterval = setInterval(async () => {
      if (finished || video.readyState < 2) return;

      const detection = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.55 }))
        .withFaceLandmarks();

      if (!detection || !detection.landmarks) {
        hint.innerText = "No real human face detected — show your face clearly";
        return;
      }

      const leftEAR = computeEAR(detection.landmarks.getLeftEye());
      const rightEAR = computeEAR(detection.landmarks.getRightEye());
      const avgEAR = (leftEAR + rightEAR) / 2;

      if (avgEAR < 0.24) {
        eyeClosed = true;
        hint.innerText = "Eye blink detected — open eyes to capture";
      } else if (eyeClosed && avgEAR >= 0.25) {
        eyeClosed = false;
        blinkCount++;
      }

      if (blinkCount >= 1) {
        finished = true;
        await finalizeLiveSelfie(video);
      }
    }, 220);

    scanTimeout = setTimeout(() => {
      if (!isLiveSelfieVerified && !finished) {
        showErrorMsg("Eye blink scan timed out. Please look at the camera and blink once.");
        closeCamera();
      }
    }, 18000);
  }

  async function finalizeLiveSelfie(video) {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    liveSelfieBase64 = canvas.toDataURL("image/jpeg", 0.85);

    const img = new Image();
    img.src = liveSelfieBase64;
    await new Promise(res => { img.onload = res; });

    const full = await faceapi
      .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.55 }))
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!full || !full.descriptor) {
      showErrorMsg("Could not extract human face descriptor. Please try again.");
      closeCamera();
      return;
    }

    liveFaceDescriptor = Array.from(full.descriptor);
    isLiveSelfieVerified = true;
    cleanupScanner();
    closeModal("cameraModal");

    const t = getTranslationDict(getActiveLanguageObj());
    const btn = document.getElementById("selfieBtn");
    const icon = document.getElementById("selfieIcon");
    const preview = document.getElementById("selfiePreview");
    const text = document.getElementById("selfieText");

    btn.classList.add("verified");
    btn.disabled = false;
    icon.style.display = "none";
    preview.src = liveSelfieBase64;
    preview.style.display = "block";
    text.innerText = t.selfieVerified;
    showSuccessMsg("Live human selfie & eye blink verified!");
  }

  function normalizeText(str) {
    return (str || "")
      .toLowerCase()
      .replace(/[^a-z0-9\u0980-\u09FF]+/g, " ")
      .trim();
  }

  function isAvatarMatchingName(avatarUrl, fullName, username, email) {
    if (!avatarUrl) return false;
    const cleanAvatar = normalizeText(decodeURIComponent(avatarUrl));
    const candidates = [fullName, username, (email || "").split("@")[0]]
      .map(normalizeText)
      .filter(Boolean);

    for (const cand of candidates) {
      if (cand.length >= 2 && cleanAvatar.includes(cand)) {
        return true;
      }
      const parts = cand.split(" ").filter(p => p.length >= 3);
      if (parts.length > 0 && parts.every(p => cleanAvatar.includes(p))) {
        return true;
      }
    }
    return false;
  }

  async function autoDisableAccountIfAvatarIsName(identifier, userId, profileData) {
    const fullName = profileData?.full_name || profileData?.name || "";
    const username = profileData?.username || "";
    const avatarUrl = profileData?.avatar_url || profileData?.selfie_url || "";

    if (!isAvatarMatchingName(avatarUrl, fullName, username, identifier)) {
      return false;
    }

    if (userId) {
      await supabaseClient
        .from("profiles")
        .update({ is_disabled: true, status: "disabled", disabled_reason: "Profile photo matches account name" })
        .eq("id", userId);
    }
    await supabaseClient
      .from("disabled_accounts")
      .upsert({
        identifier,
        user_id: userId || null,
        reason: "Profile photo matches account name",
        disabled_at: new Date().toISOString()
      }, { onConflict: "identifier" });

    localStorage.setItem("autro_disabled_" + identifier.toLowerCase(), "1");
    return true;
  }

  async function resolveEmailFromIdentifier(identifier) {
    const raw = (identifier || "").trim().replace(/^@+/, "");
    if (!raw) return "";
    if (raw.includes("@")) return raw.toLowerCase();

    const { data } = await supabaseClient
      .from("profiles")
      .select("email")
      .ilike("username", raw)
      .maybeSingle();

    return (data && data.email) ? data.email.trim().toLowerCase() : raw.toLowerCase();
  }

  async function checkAccountDisabledStatus(identifier) {
    const normId = (identifier || "").trim().toLowerCase();
    if (localStorage.getItem("autro_disabled_" + normId) === "1") {
      return { disabled: true, reason: "Account automatically disabled because the profile photo matches the account name." };
    }

    if (!normId) return { disabled: false };

    const { data: disabledRow } = await supabaseClient
      .from("disabled_accounts")
      .select("reason")
      .eq("identifier", normId)
      .maybeSingle();

    if (disabledRow) {
      return {
        disabled: true,
        reason: disabledRow.reason || "Account automatically disabled because the profile photo matches the account name."
      };
    }

    const { data: prof } = await supabaseClient
      .from("profiles")
      .select("id, full_name, username, avatar_url, is_disabled, status")
      .or(`email.eq.${normId},username.eq.${normId}`)
      .maybeSingle();

    if (prof) {
      if (prof.is_disabled || prof.status === "disabled") {
        return { disabled: true, reason: "Account is disabled." };
      }
      const matchedNameAvatar = await autoDisableAccountIfAvatarIsName(normId, prof.id, prof);
      if (matchedNameAvatar) {
        return {
          disabled: true,
          reason: "Account automatically disabled because the profile photo matches the account name."
        };
      }
    }

    return { disabled: false };
  }

  async function recordLoginAudit(userId, email, method) {
    const activeLang = getActiveLanguageObj();
    await supabaseClient.from("login_logs").insert({
      user_id: userId || null,
      email: email || null,
      method,
      language: activeLang.code,
      eye_verified: isLiveSelfieVerified,
      user_agent: navigator.userAgent,
      logged_in_at: new Date().toISOString()
    });
  }

  async function loginWithPasskey() {
    clearMessages();
    const rawIdentifier = document.getElementById("email").value.trim();
    const identifier = await resolveEmailFromIdentifier(rawIdentifier);

    const statusCheck = await checkAccountDisabledStatus(identifier);
    if (statusCheck.disabled) {
      showErrorMsg("Account Disabled: " + statusCheck.reason);
      return;
    }

    const btn = document.getElementById("fingerprintBtn");
    const text = document.getElementById("fingerprintText");
    const t = getTranslationDict(getActiveLanguageObj());

    text.innerText = "Scanning...";
    btn.disabled = true;

    const { data, error } = await supabaseClient.auth.signInWithPasskey();
    if (error) {
      showErrorMsg("Biometric verification failed. " + (error.message || ""));
      text.innerText = t.btnPasskey;
      btn.disabled = false;
      return;
    }

    await recordLoginAudit(data?.user?.id, data?.user?.email || identifier, "passkey");
    showSuccessMsg("Biometric Verified! Logging in...");
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  }

  function setupLoginForm() {
    const form = document.getElementById("loginForm");
    if (!form) return;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();

      const loginBtn = document.getElementById("loginBtn");
      const t = getTranslationDict(getActiveLanguageObj());
      const originalBtnText = t.loginBtn;
      const rawIdentifier = document.getElementById("email").value.trim();
      const email = await resolveEmailFromIdentifier(rawIdentifier);
      const password = document.getElementById("password").value;
      const rememberMe = document.getElementById("rememberMe")?.checked;

      if (rememberMe) {
        localStorage.setItem(REMEMBERED_ID_KEY, rawIdentifier);
      } else {
        localStorage.removeItem(REMEMBERED_ID_KEY);
      }

      const statusCheck = await checkAccountDisabledStatus(email);
      if (statusCheck.disabled) {
        loginBtn.disabled = true;
        loginBtn.innerText = "Account Disabled";
        showErrorMsg("Account Disabled: " + statusCheck.reason);
        return;
      }

      const recaptchaResponse = (typeof grecaptcha !== "undefined" && typeof grecaptcha.getResponse === "function")
        ? grecaptcha.getResponse()
        : "";

      if (!recaptchaResponse) {
        captchaFailCount++;
        if (captchaFailCount >= MAX_CAPTCHA_ATTEMPTS) {
          loginBtn.disabled = true;
          loginBtn.innerText = "Blocked (Too many attempts)";
          showErrorMsg(`Security Block: ${MAX_CAPTCHA_ATTEMPTS} failed CAPTCHA attempts.`);
          return;
        }
        showErrorMsg(`Please complete the CAPTCHA. (Attempt ${captchaFailCount}/${MAX_CAPTCHA_ATTEMPTS})`);
        if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
          grecaptcha.reset();
        }
        return;
      }

      loginBtn.innerText = "Verifying CAPTCHA...";
      loginBtn.disabled = true;

      try {
        const capRes = await fetch("/api/verify-captcha", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: recaptchaResponse })
        });
        const capData = await capRes.json().catch(() => ({}));

        if (!capRes.ok || !capData.success) {
          captchaFailCount++;
          if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
            grecaptcha.reset();
          }
          if (captchaFailCount >= MAX_CAPTCHA_ATTEMPTS) {
            loginBtn.disabled = true;
            loginBtn.innerText = "Blocked (Too many attempts)";
            showErrorMsg(`Security Block: ${MAX_CAPTCHA_ATTEMPTS} failed CAPTCHA attempts.`);
            return;
          }
          loginBtn.innerText = originalBtnText;
          loginBtn.disabled = false;
          showErrorMsg(`CAPTCHA verification failed. (Attempt ${captchaFailCount}/${MAX_CAPTCHA_ATTEMPTS})`);
          return;
        }
      } catch (err) {
        captchaFailCount++;
        if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
          grecaptcha.reset();
        }
        if (captchaFailCount >= MAX_CAPTCHA_ATTEMPTS) {
          loginBtn.disabled = true;
          loginBtn.innerText = "Blocked (Too many attempts)";
          showErrorMsg(`Security Block: ${MAX_CAPTCHA_ATTEMPTS} failed CAPTCHA attempts.`);
          return;
        }
        loginBtn.innerText = originalBtnText;
        loginBtn.disabled = false;
        showErrorMsg(`CAPTCHA check error. (Attempt ${captchaFailCount}/${MAX_CAPTCHA_ATTEMPTS})`);
        return;
      }

      captchaFailCount = 0;

      if (!isLiveSelfieVerified || !liveFaceDescriptor) {
        loginBtn.innerText = originalBtnText;
        loginBtn.disabled = false;
        showErrorMsg("Access Denied: Please complete Live Selfie & Eye Scan first.");
        return;
      }

      loginBtn.innerText = "Logging in...";
      loginBtn.disabled = true;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showErrorMsg(t.errMsg + " (" + (error.message || "Unknown error") + ")");
        if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
          grecaptcha.reset();
        }
        loginBtn.innerText = originalBtnText;
        loginBtn.disabled = false;
        return;
      }

      const user = data?.user;
      const meta = user?.user_metadata || {};
      const wasAutoDisabled = await autoDisableAccountIfAvatarIsName(email, user?.id, {
        full_name: meta.full_name || meta.name || "",
        username: meta.username || "",
        avatar_url: meta.avatar_url || meta.picture || ""
      });

      if (wasAutoDisabled) {
        await supabaseClient.auth.signOut();
        showErrorMsg("Account automatically disabled because the profile photo matches the account name.");
        loginBtn.innerText = originalBtnText;
        loginBtn.disabled = false;
        return;
      }

      await recordLoginAudit(user?.id, user?.email || email, "password+eye_scan");
      showSuccessMsg("Login Successful! Redirecting...");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    });
  }

  async function googleLogin() {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/index.html" }
    });
    if (error) {
      showErrorMsg("Google login failed: " + (error.message || "Unknown error"));
    }
  }

  function showErrorMsg(msg) {
    document.getElementById("errorMsg").innerText = msg;
    document.getElementById("successMsg").innerText = "";
  }

  function showSuccessMsg(msg) {
    document.getElementById("successMsg").innerText = msg;
    document.getElementById("errorMsg").innerText = "";
  }

  function clearMessages() {
    document.getElementById("errorMsg").innerText = "";
    document.getElementById("successMsg").innerText = "";
  }

  function initLoginPage() {
    const searchInput = document.getElementById("langSearchInput");
    if (searchInput && !searchInput.dataset.bound) {
      searchInput.dataset.bound = "1";
      searchInput.addEventListener("input", (e) => buildLangList(e.target.value));
    }

    const savedId = localStorage.getItem(REMEMBERED_ID_KEY);
    const emailInput = document.getElementById("email");
    if (savedId && emailInput && !emailInput.value) {
      emailInput.value = savedId;
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeLangModal();
        closeCamera();
      }
    });

    buildLangList("");
    applyLanguage();
    setupLoginForm();
  }

  initLoginPage();
  document.addEventListener("DOMContentLoaded", initLoginPage);
</script>
