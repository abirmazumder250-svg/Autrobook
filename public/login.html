<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<title>Log in - Autrobook</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFFFF;
    --surface: #F8F9FA;
    --card: #FFFFFF;
    --text: #202124;
    --muted: #5F6368;
    --border: rgba(32, 33, 36, 0.14);
    --input-bg: #FFFFFF;

    --primary: #202124;
    --primary-hover: #3C4043;
    --accent: #202124;
    --accent-dark: #202124;
    --accent-soft: rgba(32, 33, 36, 0.08);

    --btn-green: #0F5132;
    --btn-green-hover: #0B3D26;
    --btn-green-soft: rgba(15, 81, 50, 0.10);
    --btn-green-shadow: 0 8px 22px rgba(15, 81, 50, 0.24);

    --danger: #DC2626;
    --success: #0F5132;
    --disabled: #9AA0A6;

    --shadow-sm: 0 2px 10px rgba(32, 33, 36, 0.04);
    --shadow-md: 0 12px 32px rgba(32, 33, 36, 0.08);
    --shadow-btn: 0 8px 22px rgba(15, 81, 50, 0.24);

    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-pill: 999px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #292A2D;
      --card: #202124;
      --text: #FFFFFF;
      --muted: #BDC1C6;
      --border: rgba(255, 255, 255, 0.16);
      --input-bg: #292A2D;

      --primary: #FFFFFF;
      --primary-hover: #E8EAED;
      --accent: #FFFFFF;
      --accent-dark: #E8EAED;
      --accent-soft: rgba(255, 255, 255, 0.12);

      --btn-green: #0F5132;
      --btn-green-hover: #146C43;
      --btn-green-soft: rgba(25, 135, 84, 0.18);
      --btn-green-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);

      --success: #198754;

      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.40);
      --shadow-btn: 0 8px 22px rgba(0, 0, 0, 0.35);
    }

    #cameraStream {
      background: #000000;
    }

    .lang-modal,
    .lang-search-input {
      background: var(--card);
      color: var(--text);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: rgba(32, 33, 36, 0.12);
    -webkit-font-smoothing: antialiased;
  }

  html {
    scroll-behavior: smooth;
    background-color: var(--bg);
  }

  body {
    background-color: var(--bg);
    background-image: none;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .login-wrap {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    background-image: none;
    padding:
      calc(env(safe-area-inset-top, 0px) + 8px)
      20px
      calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .lang-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    margin-bottom: 10px;
    position: relative;
    z-index: 10;
  }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 9px 15px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    max-width: 260px;
    transition: transform 0.18s ease, border-color 0.2s ease, background-color 0.2s ease;
  }

  .lang-btn:hover {
    border-color: var(--accent);
    background: var(--bg);
  }

  .lang-btn:active {
    transform: scale(0.96);
  }

  .lang-btn svg {
    width: 16px;
    height: 16px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .lang-btn span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lang-chevron {
    width: 14px !important;
    height: 14px !important;
    color: var(--muted) !important;
  }

  .top-logo {
    position: relative;
    margin-top: 8px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .top-logo::before,
  .top-logo::after {
    content: '';
    position: absolute;
    width: 78px;
    height: 78px;
    border-radius: 22px;
    border: 2px solid rgba(15, 81, 50, 0.45);
    pointer-events: none;
    animation: logoPulseRing 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }

  .top-logo::after {
    animation-delay: 1.4s;
  }

  @media (prefers-color-scheme: dark) {
    .top-logo::before,
    .top-logo::after {
      border-color: rgba(25, 135, 84, 0.50);
    }
  }

  @keyframes logoPulseRing {
    0% {
      transform: scale(1);
      opacity: 0.75;
    }
    100% {
      transform: scale(1.42);
      opacity: 0;
    }
  }

  @keyframes logoFloatGlow {
    0%, 100% {
      transform: translateY(0px);
      box-shadow:
        0 10px 24px rgba(32, 33, 36, 0.08),
        0 0 0 3px rgba(15, 81, 50, 0.14),
        0 8px 24px rgba(15, 81, 50, 0.22);
    }
    50% {
      transform: translateY(-3px);
      box-shadow:
        0 14px 28px rgba(32, 33, 36, 0.12),
        0 0 0 5px rgba(15, 81, 50, 0.22),
        0 12px 30px rgba(15, 81, 50, 0.34);
    }
  }

  .logo-box {
    position: relative;
    z-index: 2;
    width: 78px;
    height: 78px;
    border-radius: 22px;
    background: var(--bg);
    border: 1.5px solid rgba(15, 81, 50, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: logoFloatGlow 3.2s ease-in-out infinite;
  }

  .top-logo img {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    object-fit: cover;
    display: block;
  }

  .login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-group {
    position: relative;
    width: 100%;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-group input.has-toggle {
    padding-right: 46px;
  }

  [dir="rtl"] .input-group input.has-toggle {
    padding-right: 16px;
    padding-left: 46px;
  }

  [dir="rtl"] .toggle-pass-btn {
    right: auto;
    left: 12px;
  }

  [dir="rtl"] .lang-label-group {
    text-align: right;
  }

  .input-group input:focus {
    border-color: var(--btn-green);
    box-shadow: 0 0 0 3px var(--btn-green-soft);
  }

  .input-subnote {
    margin-top: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .input-subnote.ok {
    color: var(--success);
  }

  .input-subnote.warn {
    color: var(--danger);
  }

  .toggle-pass-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
  }

  .toggle-pass-btn:hover {
    color: var(--accent);
    background: var(--surface);
  }

  .form-options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 2px;
  }

  .remember-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  .remember-label input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .or-separator {
    width: 100%;
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 2px 0;
  }

  .or-separator::before,
  .or-separator::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border);
  }

  .or-separator span {
    padding: 0 12px;
  }

  .security-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 2px;
  }

  .sec-btn {
    width: 100%;
    padding: 12px 16px;
    border-radius: var(--radius-pill);
    border: 1.5px dashed var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }

  .sec-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--bg);
  }

  .sec-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #selfiePreview {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    display: none;
    border: 2px solid var(--btn-green);
  }

  .sec-btn.verified {
    border-color: var(--btn-green);
    color: var(--btn-green);
    background: var(--btn-green-soft);
    border-style: solid;
  }

  .backup-code-box {
    margin-top: 4px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .backup-code-box.active {
    display: flex;
  }

  .backup-code-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--input-bg);
    color: var(--text);
    font-family: monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    outline: none;
  }

  .backup-code-input:focus {
    border-color: var(--btn-green);
  }

  .backup-actions-row {
    display: flex;
    gap: 8px;
  }

  .backup-verify-btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: var(--radius-pill);
    border: none;
    background: var(--btn-green);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .backup-verify-btn:hover {
    background: var(--btn-green-hover);
  }

  .backup-gen-btn {
    padding: 10px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .backup-gen-btn:hover {
    border-color: var(--btn-green);
    color: var(--btn-green);
  }

  .generated-codes-panel {
    margin-top: 4px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px dashed var(--btn-green);
    background: var(--card);
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .generated-codes-panel.active {
    display: flex;
  }

  .generated-codes-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }

  .generated-codes-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    font-family: monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .generated-code-chip {
    padding: 6px 8px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    text-align: center;
    cursor: pointer;
    user-select: all;
  }

  .copy-codes-btn {
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }

  button.btn-login,
  .login-form .btn-login {
    width: 100%;
    min-height: 52px;
    padding: 15px 20px;
    border-radius: var(--radius-pill);
    background-color: #0F5132;
    color: #FFFFFF;
    border: none;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--btn-green-shadow);
    transition: background-color 0.2s ease, transform 0.15s ease;
    margin-top: 6px;
  }

  button.btn-login:hover:not(:disabled),
  .login-form .btn-login:hover:not(:disabled) {
    background-color: #0B3D26;
  }

  button.btn-login:active:not(:disabled),
  .login-form .btn-login:active:not(:disabled) {
    transform: scale(0.98);
  }

  button.btn-login:disabled,
  .login-form .btn-login:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    background-color: var(--disabled);
    box-shadow: none;
  }

  .link-forgot {
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
  }

  .link-forgot:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .g-recaptcha {
    margin: 14px 0 6px;
    display: flex;
    justify-content: center;
  }

  .error-msg {
    color: var(--danger);
    font-size: 13.5px;
    text-align: center;
    min-height: 20px;
    font-weight: 700;
    word-break: break-word;
    line-height: 1.4;
  }

  .success-msg {
    color: var(--success);
    font-size: 13.5px;
    text-align: center;
    min-height: 20px;
    font-weight: 700;
    line-height: 1.4;
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    margin: 10px 0;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border);
  }

  .divider span {
    padding: 0 12px;
  }

  .btn-google,
  .btn-create {
    width: 100%;
    min-height: 50px;
    padding: 13px 20px;
    border-radius: var(--radius-pill);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .btn-google {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-google:hover {
    background: var(--bg);
    border-color: var(--accent);
  }

  button.btn-create,
  .login-wrap .btn-create {
    background-color: #0F5132;
    color: #FFFFFF;
    border: 1.5px solid #0F5132;
    box-shadow: var(--btn-green-shadow);
    margin-top: 12px;
  }

  button.btn-create:hover,
  .login-wrap .btn-create:hover {
    background-color: #0B3D26;
    border-color: #0B3D26;
  }

  button.btn-create:active,
  .login-wrap .btn-create:active {
    transform: scale(0.98);
  }

  .footer-meta {
    font-weight: 800;
    font-size: 18px;
    margin-top: 22px;
    margin-bottom: 4px;
    color: var(--text);
  }

  .footer-sub {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }

  .modal-back {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 18px;
  }

  .modal-box {
    background: var(--card);
    width: 100%;
    max-width: 380px;
    border-radius: 24px;
    border: 1px solid var(--border);
    padding: 24px;
    box-shadow: var(--shadow-md);
  }

  .modal-box h3 {
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    color: var(--text);
  }

  .scan-hint {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    text-align: center;
    margin-bottom: 12px;
    min-height: 18px;
  }

  .modal-close {
    width: 100%;
    padding: 13px 16px;
    margin-top: 12px;
    background-color: #0F5132;
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius-pill);
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }

  .modal-close:hover {
    background-color: #0B3D26;
  }

  #cameraStream {
    width: 100%;
    border-radius: 14px;
    margin-bottom: 8px;
    background: #000000;
    transform: scaleX(-1);
  }

  .lang-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.52);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .lang-modal-overlay.active {
    display: flex;
  }

  .lang-modal {
    width: 100%;
    max-width: 410px;
    height: 82vh;
    height: 82dvh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    animation: modalPop 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .lang-header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .lang-header h3 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
  }

  .close-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
  }

  .lang-search-wrap {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .lang-search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  .lang-search-input:focus {
    border-color: var(--accent);
  }

  .lang-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .lang-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color 0.16s ease;
  }

  .lang-item:hover {
    background: var(--surface);
  }

  .lang-item.selected {
    background: var(--accent-soft);
  }

  .lang-label-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
  }

  .lang-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
  }

  .lang-country {
    font-size: 12px;
    color: var(--muted);
  }

  .lang-radio {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  @keyframes modalPop {
    from {

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")

  function sanitizeIdentifier(raw) {

  function getAttemptKey(identifier) {
    const clean = sanitizeIdentifier(identifier).toLowerCase() || "global";
    return `autro_login_attempts_${clean}`;
  }

  function getLockUntil(identifier) {
    const raw = localStorage.getItem(getAttemptKey(identifier));
    if (!raw) return { count: 0, lockedUntil: 0 };
    try {
      const parsed = JSON.parse(raw);
      return {
        count: Number(parsed?.count) || 0,
        lockedUntil: Number(parsed?.lockedUntil) || 0
      };
    } catch (_) {
      return { count: 0, lockedUntil: 0 };
    }
  }

  function recordFailedLoginAttempt(identifier) {
    const key = getAttemptKey(identifier);
    const state = getLockUntil(identifier);
    const now = Date.now();
    const nextCount = (state.lockedUntil > 0 && state.lockedUntil < now) ? 1 : state.count + 1;
    const lockedUntil = nextCount >= MAX_FAILED_LOGINS ? now + LOCKOUT_DURATION_MS : 0;
    localStorage.setItem(key, JSON.stringify({ count: nextCount, lockedUntil }));
    return { count: nextCount, lockedUntil };
  }

  function clearFailedLoginAttempts(identifier) {
    localStorage.removeItem(getAttemptKey(identifier));
  }

  function checkTemporaryLock(identifier) {
    const { lockedUntil } = getLockUntil(identifier);
    const now = Date.now();
    if (lockedUntil > now) {
      const minsLeft = Math.ceil((lockedUntil - now) / 60000);
      return {
        locked: true,
        message: `Too many failed login attempts. Please try again in ${minsLeft} minute(s).`
      };
    }
    return { locked: false, message: "" };
  }

  async function sha256Hex(text) {
    const normalized = String(text || "").trim().toUpperCase();
    if (typeof crypto !== "undefined" && crypto.subtle && typeof crypto.subtle.digest === "function") {
      const data = new TextEncoder().encode(normalized);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }
    let h = 2166136261;
    for (let i = 0; i < normalized.length; i++) {
      h ^= normalized.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16).padStart(8, "0");
  }

  async function initLoginDeviceId() {
    let storedFp = localStorage.getItem(LOGIN_DEVICE_FP_KEY) || "";
    if (!storedFp) {
      const raw = [
        navigator.userAgent || "",
        navigator.platform || "",
        navigator.maxTouchPoints || 0,
        screen.width || 0,
        screen.height || 0,
        Intl.DateTimeFormat().resolvedOptions().timeZone || ""
      ].join("|");
      const hex = await sha256Hex(raw);
      storedFp = "LGN-" + hex.slice(0, 8).toUpperCase();
      try { localStorage.setItem(LOGIN_DEVICE_FP_KEY, storedFp); } catch (_) {}
    }
    loginDeviceFp = storedFp;
  }

  function evaluateIdentifierGuard(raw) {
    const clean = sanitizeIdentifier(raw);
    const noteEl = document.getElementById("identifierGuardNote");
    const textEl = document.getElementById("identifierGuardText");
    const badgeEl = document.getElementById("identifierGuardBadge");
    const t = getTranslationDict(getActiveLanguageObj());

    if (!clean) {
      noteEl?.classList.remove("ok", "warn");
      if (textEl) textEl.textContent = t.emailNote;
      if (badgeEl) badgeEl.textContent = "";
      return;
    }

    if (clean.includes("@")) {
      const lower = clean.toLowerCase();
      const domain = lower.split("@")[1] || "";
      if (TYPO_EMAIL_DOMAINS[domain]) {
        const fix = `${lower.split("@")[0]}@${TYPO_EMAIL_DOMAINS[domain]}`;
        noteEl?.classList.remove("ok");
        noteEl?.classList.add("warn");
        if (textEl) textEl.textContent = t.emailTypoNote.replace("{fix}", fix);
        if (badgeEl) badgeEl.textContent = "TYPO";
        return;
      }
      if (DISPOSABLE_EMAIL_DOMAINS.has(domain)) {
        noteEl?.classList.remove("ok");
        noteEl?.classList.add("warn");
        if (textEl) textEl.textContent = t.emailTempNote;
        if (badgeEl) badgeEl.textContent = "TEMP";
        return;
      }
      if (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(lower)) {
        noteEl?.classList.remove("warn");
        noteEl?.classList.add("ok");
        if (textEl) textEl.textContent = t.emailGuardedNote;
        if (badgeEl) badgeEl.textContent = domain;
        return;
      }
    }

    noteEl?.classList.remove("warn");
    noteEl?.classList.add("ok");
    if (textEl) textEl.textContent = t.emailHandleNote;
    if (badgeEl) badgeEl.textContent = "HANDLE";
  }

  function generateRandomBackupCodes(count = 6) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const codes = [];
    for (let i = 0; i < count; i++) {
      let raw = "";
      if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
        const arr = new Uint32Array(8);
        crypto.getRandomValues(arr);
        for (let j = 0; j < 8; j++) {
          raw += chars[arr[j] % chars.length];
        }
      } else {
        for (let j = 0; j < 8; j++) {
          raw += chars[Math.floor(Math.random() * chars.length)];
        }
      }
      codes.push(`${raw.slice(0, 4)}-${raw.slice(4, 8)}`);
    }
    return codes;
  }

  async function resolveUserIdFromIdentifier(identifier) {
    const clean = sanitizeIdentifier(identifier).toLowerCase();
    if (!clean) return "";
    try {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("id")
        .or(`email.eq.${clean},username.eq.${clean}`)
        .maybeSingle();
      if (error) return "";
      return data?.id || "";
    } catch (_) {
      return "";
    }
  }

  async function generateBackupCodesForUser() {
    clearMessages();
    const genBtn = document.getElementById("backupCodeGenerateBtn");
    const panel = document.getElementById("generatedBackupCodesPanel");
    const grid = document.getElementById("generatedBackupCodesGrid");
    const rawIdentifier = sanitizeIdentifier(document.getElementById("email")?.value);
    const resolvedEmail = await resolveEmailFromIdentifier(rawIdentifier);

    if (genBtn) genBtn.disabled = true;

    try {
      let sessionUserId = "";
      try {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        sessionUserId = sessionData?.session?.user?.id || "";
      } catch (_) {}

      let lookupId = sessionUserId;
      if (!lookupId && rawIdentifier) {
        lookupId = await resolveUserIdFromIdentifier(rawIdentifier);
      }

      const onceKey = getBackupOnceKey(rawIdentifier, lookupId);
      const alreadyGeneratedOnce = localStorage.getItem(onceKey) === "1";

      if (alreadyGeneratedOnce) {
        if (grid) grid.innerHTML = "";
        if (panel) panel.classList.remove("active");
        latestGeneratedBackupCodes = [];
        if (genBtn) genBtn.style.display = "none";
        showErrorMsg("Backup codes were already generated once. For security, they cannot be generated or displayed again.");
        return;
      }

      let codes = [];
      let apiSucceeded = false;

      if (resolvedEmail && resolvedEmail.includes("@")) {
        try {
          const apiRes = await fetch("/api/backup-code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "generate",
              userId: lookupId || null,
              email: resolvedEmail
            })
          });
          const apiData = await apiRes.json().catch(() => ({}));
          if (apiRes.ok && apiData.ok && apiData.code) {
            codes = [apiData.code];
            apiSucceeded = true;
          }
        } catch (_) {}
      }

      if (!apiSucceeded) {
        codes = generateRandomBackupCodes(6);
      }

      latestGeneratedBackupCodes = codes;

      try {
        localStorage.setItem(onceKey, "1");
        const cacheKey = `autro_backup_codes_${(rawIdentifier || lookupId || "guest").toLowerCase()}`;
        localStorage.setItem(cacheKey, JSON.stringify(codes));
      } catch (_) {}

      if (!apiSucceeded && lookupId) {
        try {
          const rows = [];
          for (const code of codes) {
            const codeHash = await sha256Hex(code);
            rows.push({
              user_id: lookupId,
              email: resolvedEmail || null,
              code_hash: codeHash,
              used: false,
              created_at: new Date().toISOString()
            });
          }
          await supabaseClient.from("backup_codes").insert(rows);
        } catch (_) {}
      }

      if (grid && panel) {
        grid.innerHTML = codes
          .map((c) => `<div class="generated-code-chip" onclick="selectBackupCodeToInput('${escapeHTML(c)}')">${escapeHTML(c)}</div>`)
          .join("");
        panel.classList.add("active");
      }

      if (codes.length > 0 && document.getElementById("backupCodeInput")) {
        document.getElementById("backupCodeInput").value = codes[0];
      }

      if (genBtn) genBtn.style.display = "none";
      showSuccessMsg("Backup code shown once. Copy or save it safely now—it will not be shown again.");
    } catch (err) {
      showErrorMsg(err?.message || "Could not generate backup codes. Please try again.");
      if (genBtn) genBtn.disabled = false;
    }
  }

  async function verifyAndConsumeBackupCode(userId, plainCode, rawIdentifier = "") {
    const normalized = String(plainCode || "").trim().toUpperCase();
    if (!normalized) {
      return { valid: false, message: "Please enter a valid backup code." };
    }

    const resolvedEmail = await resolveEmailFromIdentifier(rawIdentifier);
    if (resolvedEmail && resolvedEmail.includes("@")) {
      try {
        const apiRes = await fetch("/api/backup-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "verify",
            userId: userId || null,
            email: resolvedEmail,
            code: normalized
          })
        });
        const apiData = await apiRes.json().catch(() => ({}));
        if (apiRes.ok && apiData.ok) {
          return { valid: true, message: "Backup code verified." };
        }
        if (apiRes.status >= 400 && apiRes.status < 500 && apiData.error) {
          return { valid: false, message: apiData.error };
        }
      } catch (_) {}
    }

    if (userId) {
      try {
        const codeHash = await sha256Hex(normalized);
        const { data: matchRow, error: selErr } = await supabaseClient
          .from("backup_codes")
          .select("id")
          .eq("user_id", userId)
          .eq("code_hash", codeHash)
          .eq("used", false)
          .maybeSingle();

        if (!selErr && matchRow) {
          const { error: updErr } = await supabaseClient
            .from("backup_codes")
            .update({ used: true, used_at: new Date().toISOString() })
            .eq("id", matchRow.id)
            .eq("used", false);

          if (!updErr) {
            return { valid: true, message: "Backup code verified." };
          }
        }
      } catch (_) {}
    }

    const cacheKey = `autro_backup_codes_${(rawIdentifier || userId || "guest").toLowerCase()}`;
    try {
      const savedList = JSON.parse(localStorage.getItem(cacheKey) || "[]");
      if (Array.isArray(savedList) && savedList.map(c => String(c).toUpperCase()).includes(normalized)) {
        const remaining = savedList.filter(c => String(c).toUpperCase() !== normalized);
        localStorage.setItem(cacheKey, JSON.stringify(remaining));
        return { valid: true, message: "Backup code verified." };
      }
    } catch (_) {}

    return { valid: false, message: "Invalid or already used backup code." };
  }

  async function verifyBackupCodeForLogin() {
    clearMessages();
    const rawIdentifier = sanitizeIdentifier(document.getElementById("email")?.value);
    const codeVal = document.getElementById("backupCodeInput")?.value || "";
    const verifyBtn = document.getElementById("backupCodeVerifyBtn");
    const toggleBtn = document.getElementById("backupCodeToggleBtn");

    if (!codeVal.trim()) {
      showErrorMsg("Please enter a backup code.");
      return;
    }

    if (verifyBtn) verifyBtn.disabled = true;
    const userId = await resolveUserIdFromIdentifier(rawIdentifier);
    const res = await verifyAndConsumeBackupCode(userId, codeVal, rawIdentifier);
    if (verifyBtn) verifyBtn.disabled = false;

    if (!res.valid) {
      isBackupCodeVerified = false;
      showErrorMsg(res.message);
      return;
    }

    isBackupCodeVerified = true;
    if (toggleBtn) toggleBtn.classList.add("verified");
    if (document.getElementById("backupCodeInput")) {
      document.getElementById("backupCodeInput").value = "";
    }
    showSuccessMsg("Backup recovery code verified. Now enter your password and click Log in.");

  async function syncLanguageToSupabase(langCode, langName, dir, country = "") {
    try {
      const emailEl = document.getElementById("email");
      const emailVal = emailEl ? sanitizeIdentifier(emailEl.value).toLowerCase() : "";

      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (sessionData?.session) {
        await supabaseClient.auth.updateUser({
          data: { language: langCode, language_name: langName, country, dir }
        });
      }

      if (emailVal && emailVal.includes("@")) {
        const payload = {
          email: emailVal,
          language: langCode,
          language_name: langName,
          country,
          dir,
          updated_at: new Date().toISOString()
        };
        await supabaseClient.from("language_preferences").upsert(payload, { onConflict: "email" });
      }
    } catch (_) {}
  }

  function selectLanguage(langObj) {
    if (!langObj) return;
    currentLangId = langObj.id;
    currentLang = langObj.code;
    const finalDir = langObj.rtl ? "rtl" : "ltr";

    try {
      localStorage.setItem(LANGUAGE_ID_KEY, langObj.id);
      localStorage.setItem(LANGUAGE_CODE_KEY, langObj.code);
      localStorage.setItem("lang", langObj.code);
      localStorage.setItem("autro_language", langObj.code);
      localStorage.setItem("autro_language_name", langObj.name);
      localStorage.setItem("autro_language_country", langObj.country || "");
      localStorage.setItem("autro_language_dir", finalDir);
    } catch (_) {}

    applyLanguage();
    buildLangList(document.getElementById("langSearchInput")?.value || "");
    closeLangModal();
    syncLanguageToSupabase(langObj.code, langObj.name, finalDir, langObj.country || "");
    clearMessages();

    window.dispatchEvent(new CustomEvent("autro:languageChanged", {
      detail: {
        id: langObj.id,
        code: langObj.code,
        name: langObj.name,
        country: langObj.country || "",
        dir: finalDir
      }
    }));
  }

  function buildLangList(filterQuery = "") {
    const list = document.getElementById("langList");
    if (!list) return;
    list.innerHTML = "";

    const q = String(filterQuery || "").trim().toLowerCase();
    const filtered = languages.filter(lang =>
      lang.name.toLowerCase().includes(q) ||
      lang.country.toLowerCase().includes(q) ||
      lang.code.toLowerCase().includes(q) ||
      lang.id.toLowerCase().includes(q)
    );

    if (filtered.length === 0) {
      list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">No matching language or country found.</div>`;
      return;
    }

    filtered.forEach(language => {
      const isSelected = currentLangId === language.id;
      const item = document.createElement("div");
      item.className = "lang-item" + (isSelected ? " selected" : "");
      item.innerHTML = `
        <div class="lang-label-group">
          <span class="lang-name">${escapeHTML(language.name)}</span>
          <span class="lang-country">${escapeHTML(language.country)}</span>
        </div>
        <input
          type="radio"
          class="lang-radio"
          name="modalLang"
          value="${escapeHTML(language.id)}"
          ${isSelected ? "checked" : ""}
        >
      `;
      item.addEventListener("click", () => {
        selectLanguage(language);
      });
      list.appendChild(item);
    });
  }

  function getDistance(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function computeEAR(eye) {
    const v1 = getDistance(eye[1], eye[5]);
    const v2 = getDistance(eye[2], eye[4]);
    const h = getDistance(eye[0], eye[3]);
    return h === 0 ? 0.3 : (v1 + v2) / (2 * h);
  }

    if (!isLiveSelfieVerified) {
      const btn = document.getElementById("selfieBtn");
      if (btn) btn.disabled = false;
    }
  }

  async function openLiveSelfieScanner() {
    clearMessages();
    const btn = document.getElementById("selfieBtn");
    const hint = document.getElementById("scanHint");
    const t = getTranslationDict(getActiveLanguageObj());

    openModal("cameraModal");
    hint.innerText = "Starting camera & human face detector...";
    btn.disabled = true;

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Camera access is not supported on this browser.");
      }

      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });

      const video = document.getElementById("cameraStream");
      video.srcObject = videoStream;
      await video.play();

      if (!modelsLoaded) {
        hint.innerText = "Loading eye & face scan models...";
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        modelsLoaded = true;
      }

      hint.innerText = t.scanHint;
      let blinkCount = 0;
      let eyeClosed = false;
      let finished = false;

      scanInterval = setInterval(async () => {
        if (finished || video.readyState < 2) return;

        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.6 }))
          .withFaceLandmarks();

        if (!detection || !detection.landmarks) {
          hint.innerText = "No real human face detected — show your face clearly";
          return;
        }

        const leftEAR = computeEAR(detection.landmarks.getLeftEye());
        const rightEAR = computeEAR(detection.landmarks.getRightEye());
        const avgEAR = (leftEAR + rightEAR) / 2;

        if (avgEAR < 0.23) {
          eyeClosed = true;
          hint.innerText = "Eye blink detected — open eyes to capture";
        } else if (eyeClosed && avgEAR >= 0.25) {
          eyeClosed = false;
          blinkCount++;
        }

        if (blinkCount >= 1) {
          finished = true;
          await finalizeLiveSelfie(video);
        }
      }, 220);

      scanTimeout = setTimeout(() => {
        if (!isLiveSelfieVerified && !finished) {
          showErrorMsg("Eye blink scan timed out. Please look at the camera and blink once.");
          closeCamera();
        }
      }, 18000);
    } catch (err) {
      showErrorMsg(err?.message || "Unable to access camera for live selfie scan.");
      closeCamera();
    }
  }

  async function finalizeLiveSelfie(video) {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    liveSelfieBase64 = canvas.toDataURL("image/jpeg", 0.85);

    const img = new Image();
    img.src = liveSelfieBase64;
    await new Promise(res => { img.onload = res; });

    const full = await faceapi
      .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.6 }))
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!full || !full.descriptor) {
      showErrorMsg("Could not extract human face descriptor. Please try again.");
      closeCamera();
      return;
    }

    liveFaceDescriptor = Array.from(full.descriptor);
    isLiveSelfieVerified = true;
    cleanupScanner();
    closeModal("cameraModal");

    const t = getTranslationDict(getActiveLanguageObj());
    const btn = document.getElementById("selfieBtn");
    const icon = document.getElementById("selfieIcon");
    const preview = document.getElementById("selfiePreview");
    const text = document.getElementById("selfieText");

    btn.classList.add("verified");
    btn.disabled = false;
    icon.style.display = "none";
    preview.src = liveSelfieBase64;
    preview.style.display = "block";
    text.innerText = t.selfieVerified;
    showSuccessMsg("Live human selfie & eye blink verified.");
  }

  function compareFaceDescriptors(storedDescriptor, currentDescriptor) {
    if (!Array.isArray(storedDescriptor) || !Array.isArray(currentDescriptor)) {
      return true;
    }
    if (storedDescriptor.length !== currentDescriptor.length || storedDescriptor.length === 0) {
      return true;
    }
    if (window.faceapi && typeof window.faceapi.euclideanDistance === "function") {
      const distance = window.faceapi.euclideanDistance(storedDescriptor, currentDescriptor);
      return distance <= FACE_MATCH_THRESHOLD;
    }
    return true;
  }

  function normalizeText(str) {
    return (str || "")
      .toLowerCase()
      .replace(/[^a-z0-9\u0980-\u09FF]+/g, " ")
      .trim();
  }

  function isAvatarMatchingName(avatarUrl, fullName, username, email) {
    if (!avatarUrl) return false;
    const cleanAvatar = normalizeText(decodeURIComponent(avatarUrl));
    const candidates = [fullName, username, (email || "").split("@")[0]]
      .map(normalizeText)
      .filter(Boolean);

    for (const cand of candidates) {
      if (cand.length >= 2 && cleanAvatar.includes(cand)) {
        return true;
      }
      const parts = cand.split(" ").filter(p => p.length >= 3);
      if (parts.length > 0 && parts.every(p => cleanAvatar.includes(p))) {
        return true;
      }
    }
    return false;
  }

  async function autoDisableAccountIfAvatarIsName(identifier, userId, profileData) {
    const fullName = profileData?.full_name || profileData?.name || "";
    const username = profileData?.username || "";
    const avatarUrl = profileData?.avatar_url || profileData?.selfie_url || "";

    if (!isAvatarMatchingName(avatarUrl, fullName, username, identifier)) {
      return false;
    }

    if (userId) {
      await supabaseClient
        .from("profiles")
        .update({ is_disabled: true, status: "disabled", disabled_reason: "Profile photo matches account name" })
        .eq("id", userId);
    }
    await supabaseClient
      .from("disabled_accounts")
      .upsert({
        identifier,
        user_id: userId || null,
        reason: "Profile photo matches account name",
        disabled_at: new Date().toISOString()
      }, { onConflict: "identifier" });

    localStorage.setItem("autro_disabled_" + identifier.toLowerCase(), "1");
    return true;
  }

  async function resolveEmailFromIdentifier(identifier) {
    const raw = sanitizeIdentifier(identifier);
    if (!raw) return "";
    if (raw.includes("@")) return raw.toLowerCase();

    try {
      const { data } = await supabaseClient
        .from("profiles")
        .select("email")
        .ilike("username", raw)
        .maybeSingle();

      return (data && data.email) ? data.email.trim().toLowerCase() : raw.toLowerCase();
    } catch (_) {
      return raw.toLowerCase();
    }
  }

  async function checkAccountDisabledStatus(identifier) {
    const normId = sanitizeIdentifier(identifier).toLowerCase();
    if (localStorage.getItem("autro_disabled_" + normId) === "1") {
      return { disabled: true, reason: "Account automatically disabled because the profile photo matches the account name." };
    }

    if (!normId) return { disabled: false };

    try {
      const { data: disabledRow } = await supabaseClient
        .from("disabled_accounts")
        .select("reason")
        .eq("identifier", normId)
        .maybeSingle();

      if (disabledRow) {
        return {
          disabled: true,
          reason: disabledRow.reason || "Account automatically disabled because the profile photo matches the account name."
        };
      }

      const { data: prof } = await supabaseClient
        .from("profiles")
        .select("id, full_name, username, avatar_url, is_disabled, status")
        .or(`email.eq.${normId},username.eq.${normId}`)
        .maybeSingle();

      if (prof) {
        if (prof.is_disabled || prof.status === "disabled") {
          return { disabled: true, reason: "Account is disabled." };
        }
        const matchedNameAvatar = await autoDisableAccountIfAvatarIsName(normId, prof.id, prof);
        if (matchedNameAvatar) {
          return {
            disabled: true,
            reason: "Account automatically disabled because the profile photo matches the account name."
          };
        }
      }
    } catch (_) {}

    return { disabled: false };
  }

  async function recordLoginAudit(userId, email, method) {
    try {
      const activeLang = getActiveLanguageObj();
      const loginSignature = await sha256Hex(`${email}:${LOGIN_SESSION_NONCE}:${loginDeviceFp}`);
      await supabaseClient.from("login_logs").insert({
        user_id: userId || null,
        email: email || null,
        method,
        language: activeLang.code,
        country: activeLang.country || "",
        eye_verified: isLiveSelfieVerified,
        backup_code_verified: isBackupCodeVerified,
        device_fingerprint: loginDeviceFp,
        session_nonce: LOGIN_SESSION_NONCE,
        login_signature: loginSignature,
        user_agent: navigator.userAgent,
        logged_in_at: new Date().toISOString()
      });
    } catch (_) {}
  }

  async function loginWithPasskey() {
    clearMessages();
    const rawIdentifier = sanitizeIdentifier(document.getElementById("email").value);
    const identifier = await resolveEmailFromIdentifier(rawIdentifier);

    const lockState = checkTemporaryLock(identifier);
    if (lockState.locked) {
      showErrorMsg(lockState.message);
      return;
    }

    const statusCheck = await checkAccountDisabledStatus(identifier);
    if (statusCheck.disabled) {
      showErrorMsg("Account Disabled: " + statusCheck.reason);
      return;
    }

    const btn = document.getElementById("fingerprintBtn");
    const text = document.getElementById("fingerprintText");
    const t = getTranslationDict(getActiveLanguageObj());

    text.innerText = "Scanning...";
    btn.disabled = true;

    const { data, error } = await supabaseClient.auth.signInWithPasskey();
    if (error) {
      recordFailedLoginAttempt(identifier);
      showErrorMsg("Biometric verification failed. Please try again.");
      text.innerText = t.btnPasskey;
      btn.disabled = false;
      return;
    }

    clearFailedLoginAttempts(identifier);
    persistLocalUserSession({
      id: data?.user?.id || "",
      email: data?.user?.email || identifier || "",
      full_name: data?.user?.user_metadata?.full_name || "",
      username: data?.user?.user_metadata?.username || ""
    });
    await recordLoginAudit(data?.user?.id, data?.user?.email || identifier, "passkey");
    showSuccessMsg("Biometric verified. Logging in...");
    setTimeout(() => {
      window.location.href = "index.html";
    }, 900);
  }

  function setupLoginForm() {
    const form = document.getElementById("loginForm");
    if (!form || form.dataset.bound === "1") return;
    form.dataset.bound = "1";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (isSubmittingLogin) return;
      isSubmittingLogin = true;
      clearMessages();

      const loginBtn = document.getElementById("loginBtn");
      const t = getTranslationDict(getActiveLanguageObj());
      const originalBtnText = t.loginBtn;
      const rawIdentifier = sanitizeIdentifier(document.getElementById("email").value);
      const email = await resolveEmailFromIdentifier(rawIdentifier);
      const password = document.getElementById("password").value || "";
      const rememberMe = Boolean(document.getElementById("rememberMe")?.checked);

      const releaseLock = () => {
        isSubmittingLogin = false;
      };

      if (!rawIdentifier || !password) {
        showErrorMsg("Please enter both your username/email and password.");
        releaseLock();
        return;
      }

      const lockState = checkTemporaryLock(email || rawIdentifier);
      if (lockState.locked) {
        loginBtn.disabled = true;
        showErrorMsg(lockState.message);
        releaseLock();
        return;
      }

      if (rememberMe) {
        localStorage.setItem(REMEMBERED_ID_KEY, rawIdentifier);
      } else {
        localStorage.removeItem(REMEMBERED_ID_KEY);
      }

      const statusCheck = await checkAccountDisabledStatus(email);
      if (statusCheck.disabled) {
        loginBtn.disabled = true;
        loginBtn.innerText = "Account Disabled";
        showErrorMsg("Account Disabled: " + statusCheck.reason);
        releaseLock();
        return;
      }

      const recaptchaResponse = (typeof grecaptcha !== "undefined" && typeof grecaptcha.getResponse === "function")
        ? grecaptcha.getResponse()
        : "";

      if (recaptchaResponse) {
        captchaVerifiedState = true;
        loginBtn.innerText = "Verifying CAPTCHA...";
        loginBtn.disabled = true;

        try {
          const capRes = await fetch("/api/verify-captcha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: recaptchaResponse,
              recaptchaToken: recaptchaResponse,
              deviceFingerprintId: loginDeviceFp,
              sessionNonce: LOGIN_SESSION_NONCE
            })
          });
          const capData = await capRes.json().catch(() => ({}));

          if (!capRes.ok || !capData.success) {
            captchaFailCount++;
            captchaVerifiedState = false;
            if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
              grecaptcha.reset();
            }
            if (captchaFailCount >= MAX_CAPTCHA_ATTEMPTS) {
              loginBtn.disabled = true;
              loginBtn.innerText = "Blocked (Too many attempts)";
              showErrorMsg(`Security Block: ${MAX_CAPTCHA_ATTEMPTS} failed CAPTCHA attempts.`);
              releaseLock();
              return;
            }
            loginBtn.innerText = originalBtnText;
            loginBtn.disabled = false;
            showErrorMsg(`CAPTCHA verification failed. (Attempt ${captchaFailCount}/${MAX_CAPTCHA_ATTEMPTS})`);
            releaseLock();
            return;
          }
          captchaFailCount = 0;
        } catch (_) {
          captchaFailCount++;
          captchaVerifiedState = false;
          if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
            grecaptcha.reset();
          }
          if (captchaFailCount >= MAX_CAPTCHA_ATTEMPTS) {
            loginBtn.disabled = true;
            loginBtn.innerText = "Blocked (Too many attempts)";
            showErrorMsg(`Security Block: ${MAX_CAPTCHA_ATTEMPTS} failed CAPTCHA attempts.`);
            releaseLock();
            return;
          }
          loginBtn.innerText = originalBtnText;
          loginBtn.disabled = false;
          showErrorMsg(`CAPTCHA check error. (Attempt ${captchaFailCount}/${MAX_CAPTCHA_ATTEMPTS})`);
          releaseLock();
          return;
        }
      }

      loginBtn.innerText = "Logging in...";
      loginBtn.disabled = true;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        const failed = recordFailedLoginAttempt(email);
        const lockNote = failed.lockedUntil > Date.now()
          ? " Account temporarily locked for 10 minutes due to repeated failures."
          : ` (${failed.count}/${MAX_FAILED_LOGINS} failed attempts)`;
        showErrorMsg(t.errMsg + lockNote);
        if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
          grecaptcha.reset();
        }
        captchaVerifiedState = false;
        loginBtn.innerText = originalBtnText;
        loginBtn.disabled = failed.lockedUntil > Date.now();
        releaseLock();
        return;
      }

      const user = data?.user;
      const meta = user?.user_metadata || {};

      if (isLiveSelfieVerified && liveFaceDescriptor && Array.isArray(meta.face_descriptor)) {
        const faceMatched = compareFaceDescriptors(meta.face_descriptor, liveFaceDescriptor);
        if (!faceMatched) {
          await supabaseClient.auth.signOut();
          showErrorMsg("Face verification did not match your account profile.");
          loginBtn.innerText = originalBtnText;
          loginBtn.disabled = false;
          releaseLock();
          return;
        }
      }

      const wasAutoDisabled = await autoDisableAccountIfAvatarIsName(email, user?.id, {
        full_name: meta.full_name || meta.name || "",
        username: meta.username || "",
        avatar_url: meta.avatar_url || meta.picture || ""
      });

      if (wasAutoDisabled) {
        await supabaseClient.auth.signOut();
        showErrorMsg("Account automatically disabled because the profile photo matches the account name.");
        loginBtn.innerText = originalBtnText;
        loginBtn.disabled = false;
        releaseLock();
        return;
      }

      clearFailedLoginAttempts(email);
      persistLocalUserSession({
        id: user?.id || "",
        email: user?.email || email || "",
        full_name: meta.full_name || meta.name || "",
        username: meta.username || ""
      });
      document.getElementById("password").value = "";
      await recordLoginAudit(
        user?.id,
        user?.email || email,
        isLiveSelfieVerified ? "password+eye_scan" : "password"
      );
      showSuccessMsg("Login successful. Redirecting...");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 900);
    });
  }

  async function googleLogin() {
    localStorage.removeItem("autro_logged_out");
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/index.html" }
    });
    if (error) {
      showErrorMsg("Google login failed. Please try again.");
    }
  }

  function showErrorMsg(msg) {
    document.getElementById("errorMsg").innerText = msg;
    document.getElementById("successMsg").innerText = "";
  }

  function showSuccessMsg(msg) {
    document.getElementById("successMsg").innerText = msg;
    document.getElementById("errorMsg").innerText = "";
  }

  function clearMessages() {
    document.getElementById("errorMsg").innerText = "";
    document.getElementById("successMsg").innerText = "";
  }

  function initLoginPage() {
    const searchInput = document.getElementById("langSearchInput");
    if (searchInput && !searchInput.dataset.bound) {
      searchInput.dataset.bound = "1";
      searchInput.addEventListener("input", (e) => buildLangList(e.target.value));
    }

    const savedId = localStorage.getItem(REMEMBERED_ID_KEY);
    const emailInput = document.getElementById("email");
    if (savedId && emailInput && !emailInput.value) {
      emailInput.value = savedId;
    }

    if (emailInput && !emailInput.dataset.guardBound) {
      emailInput.dataset.guardBound = "1";
      emailInput.addEventListener("input", () => {
        evaluateIdentifierGuard(emailInput.value);
      });
    }

    const backupInputEl = document.getElementById("backupCodeInput");
    if (backupInputEl && !backupInputEl.dataset.fmtBound) {
      backupInputEl.dataset.fmtBound = "1";
      backupInputEl.addEventListener("input", () => {
        const raw = backupInputEl.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
        backupInputEl.value = raw.length > 4 ? `${raw.slice(0, 4)}-${raw.slice(4)}` : raw;
      });
    }

    if (!document.body.dataset.keyBound) {
      document.body.dataset.keyBound = "1";
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeLangModal();
          closeCamera();
        }
      });
    }

    window.addEventListener("pagehide", () => {
      cleanupScanner();
    });

    initLoginDeviceId();
    evaluateIdentifierGuard(emailInput?.value || "");
    buildLangList("");
    applyLanguage();
    setupLoginForm();
  }

  initLoginPage();
  document.addEventListener("DOMContentLoaded", initLoginPage);
</script>
