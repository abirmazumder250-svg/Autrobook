<style>
  :root {
    --primary: #043D22;
    --primary-hover: #022a17;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #ef4444;
    --success: #10b981;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #065f35;
      --primary-hover: #043D22;
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .login-wrap {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .lang-top {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    margin-bottom: 20px;
  }

  .lang-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 34px 0 14px;
    height: 40px;
    min-width: 215px;
    max-width: 280px;
    cursor: pointer;
  }

  .lang-select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .lang-select-wrap select option {
    background: var(--card);
    color: var(--text);
  }

  .lang-select-wrap .caret {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 12px;
    color: var(--muted);
  }

  .top-logo {
    margin-bottom: 20px;
  }

  .top-logo img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--primary);
  }

  .login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-group input {
    width: 100%;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: 0.2s;
  }

  .input-group input:focus {
    border-color: var(--primary);
  }

  .security-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 5px;
  }

  .sec-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px dashed var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.2s;
  }

  .sec-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .sec-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #selfiePreview {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: none;
    border: 2px solid var(--success);
  }

  .sec-btn.verified {
    border-color: var(--success);
    color: var(--success);
    background: rgba(16, 185, 129, 0.08);
    border-style: solid;
  }

  .btn-login {
    width: 100%;
    padding: 16px;
    border-radius: 24px;
    background: var(--primary);
    color: #ffffff;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
  }

  .btn-login:active {
    transform: scale(0.98);
  }

  .btn-login:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background: var(--muted);
  }

  .link-forgot {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    text-decoration: none;
    margin-top: -2px;
  }

  .g-recaptcha {
    margin: 15px 0;
    display: flex;
    justify-content: center;
  }

  .error-msg {
    color: var(--danger);
    font-size: 14px;
    text-align: center;
    min-height: 20px;
    font-weight: 600;
    word-break: break-word;
  }

  .success-msg {
    color: var(--success);
    font-size: 14px;
    text-align: center;
    min-height: 20px;
    font-weight: 600;
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 10px 0;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border);
  }

  .divider span {
    padding: 0 10px;
  }

  .btn-google,
  .btn-create {
    width: 100%;
    padding: 15px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: 0.2s;
  }

  .btn-google {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-create {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--primary);
    margin-top: 12px;
  }

  .footer-meta {
    font-weight: 800;
    font-size: 18px;
    margin-top: 20px;
    margin-bottom: 4px;
    color: var(--text);
  }

  .footer-sub {
    font-size: 13px;
    color: var(--muted);
  }

  .modal-back {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .modal-box {
    background: var(--card);
    width: 90%;
    max-width: 380px;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  .modal-box h3 {
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: 800;
    text-align: center;
  }

  .scan-hint {
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
    text-align: center;
    margin-bottom: 12px;
    min-height: 18px;
  }

  .modal-close {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    background: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  #cameraStream {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 8px;
    background: #000000;
    transform: scaleX(-1);
  }
</style>

  function getTranslationDict(langCode, langLabel) {
    const baseCode = (langCode || "en").split("-")[0];
    if (LOGIN_TRANSLATIONS[langCode]) return LOGIN_TRANSLATIONS[langCode];
    if (LOGIN_TRANSLATIONS[baseCode]) return LOGIN_TRANSLATIONS[baseCode];

    const label = langLabel || langCode || "English";
    return Object.assign({}, LOGIN_TRANSLATIONS.en, {
      title: `${LOGIN_TRANSLATIONS.en.title} (${label})`,
      tagline: `${LOGIN_TRANSLATIONS.en.tagline} • ${label}`
    });
  }

  let currentLang = "en";
  try {
    currentLang = localStorage.getItem("autro_lang") || localStorage.getItem("lang") || "en";
  } catch (e) {}

  function getOptionInfo(code) {
    const selectEl = document.getElementById("languageSelect");
    if (!selectEl) return { code, name: code, dir: "ltr" };
    const opt = Array.from(selectEl.options).find(o => o.value === code);
    return {
      code,
      name: opt ? opt.textContent.trim() : code,
      dir: opt && opt.getAttribute("data-dir") === "rtl" ? "rtl" : "ltr"
    };
  }

  function applyLanguage() {
    const info = getOptionInfo(currentLang);
    const t = getTranslationDict(currentLang, info.name);

    document.documentElement.lang = currentLang;
    document.documentElement.dir = info.dir;
    document.title = t.title;

    const setText = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.innerText = val;
    };
    const setPlaceholder = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.placeholder = val;
    };

    setText("loginBtn", t.loginBtn);
    setPlaceholder("email", t.emailPlaceholder);
    setPlaceholder("password", t.passPlaceholder);
    setText("forgotLink", t.forgot);
    setText("orText", t.or);
    setText("googleText", t.google);
    setText("btnCreate", t.create);
    setText("footerSub", t.tagline);
    setText("fingerprintText", t.btnPasskey);
    setText("faceIdTitle", t.faceIdTitle);
    setText("scanHint", t.scanHint);
    setText("cancelCamBtn", t.cancelBtn);
    setText("selfieText", isLiveSelfieVerified ? t.selfieVerified : t.btnSelfie);
  }

  async function syncLanguageToSupabase(langCode, langName, dir) {
    if (!supabaseClient) return;
    const emailEl = document.getElementById("email");
    const emailVal = emailEl ? emailEl.value.trim() : "";

    try {
      await supabaseClient.auth.updateUser({
        data: { language: langCode, language_name: langName, dir }
      });
    } catch (e) {}

    try {
      const payload = {
        language: langCode,
        language_name: langName,
        dir,
        updated_at: new Date().toISOString()
      };
      if (emailVal) payload.email = emailVal;
      await supabaseClient.from("language_preferences").upsert(payload, { onConflict: "email" });
    } catch (e) {}
  }

  function setLanguage(code, name, dir) {
    currentLang = code || "en";
    const info = getOptionInfo(currentLang);
    const finalName = name || info.name;
    const finalDir = dir || info.dir;

    try {
      localStorage.setItem("autro_lang", currentLang);
      localStorage.setItem("lang", currentLang);
      localStorage.setItem("autro_language", currentLang);
      localStorage.setItem("autro_language_name", finalName);
      localStorage.setItem("autro_language_dir", finalDir);
      sessionStorage.setItem("lang", currentLang);
      sessionStorage.setItem("autro_language", currentLang);
    } catch (e) {}

    const selectEl = document.getElementById("languageSelect");
    if (selectEl) {
      const exists = Array.from(selectEl.options).some(o => o.value === currentLang);
      selectEl.value = exists ? currentLang : "en";
    }

    applyLanguage();
    syncLanguageToSupabase(currentLang, finalName, finalDir);
    clearMessages();

    window.dispatchEvent(new CustomEvent("autro:languageChanged", {
      detail: { code: currentLang, name: finalName, dir: finalDir }
    }));
  }

  function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = "flex";
  }

  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  }

  function getDistance(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function computeEAR(eye) {
    const v1 = getDistance(eye[1], eye[5]);
    const v2 = getDistance(eye[2], eye[4]);
    const h = getDistance(eye[0], eye[3]);
    return h === 0 ? 0.3 : (v1 + v2) / (2 * h);
  }

  function cleanupScanner() {
    if (scanInterval) {
      clearInterval(scanInterval);
      scanInterval = null;
    }
    if (scanTimeout) {
      clearTimeout(scanTimeout);
      scanTimeout = null;
    }
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
  }

  function closeCamera() {
    cleanupScanner();
    closeModal("cameraModal");
    if (!isLiveSelfieVerified) {
      const btn = document.getElementById("selfieBtn");
      if (btn) btn.disabled = false;
    }
  }

  async function openLiveSelfieScanner() {
    clearMessages();
    const btn = document.getElementById("selfieBtn");
    const hint = document.getElementById("scanHint");
    const info = getOptionInfo(currentLang);
    const t = getTranslationDict(currentLang, info.name);

    openModal("cameraModal");
    hint.innerText = "Starting camera & human face detector...";
    btn.disabled = true;

    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });

      const video = document.getElementById("cameraStream");
      video.srcObject = videoStream;
      await video.play();

      if (window.faceapi) {
        if (!modelsLoaded) {
          hint.innerText = "Loading eye & face scan models...";
          await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
          await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
          await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
          modelsLoaded = true;
        }

        hint.innerText = t.scanHint;
        let blinkCount = 0;
        let eyeClosed = false;
        let finished = false;

        scanInterval = setInterval(async () => {
          if (finished || video.readyState < 2) return;

          const detection = await faceapi
            .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.55 }))
            .withFaceLandmarks();

          if (!detection || !detection.landmarks) {
            hint.innerText = "No real human face detected — show your face clearly";
            return;
          }

          const leftEAR = computeEAR(detection.landmarks.getLeftEye());
          const rightEAR = computeEAR(detection.landmarks.getRightEye());
          const avgEAR = (leftEAR + rightEAR) / 2;

          if (avgEAR < 0.24) {
            eyeClosed = true;
            hint.innerText = "Eye blink detected — open eyes to capture";
          } else if (eyeClosed && avgEAR >= 0.25) {
            eyeClosed = false;
            blinkCount++;
          }

          if (blinkCount >= 1) {
            finished = true;
            await finalizeLiveSelfie(video, true);
          }
        }, 220);

        scanTimeout = setTimeout(() => {
          if (!isLiveSelfieVerified && !finished) {
            showErrorMsg("Eye blink scan timed out. Please look at the camera and blink once.");
            closeCamera();
          }
        }, 18000);
      } else {
        hint.innerText = "Face model fallback active — capturing live human selfie...";
        setTimeout(() => finalizeLiveSelfie(video, false), 1500);
      }
    } catch (err) {
      console.error("Camera error:", err);
      showErrorMsg("Camera permission denied or unavailable.");
      closeCamera();
    }
  }

  async function finalizeLiveSelfie(video, withDescriptor) {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    liveSelfieBase64 = canvas.toDataURL("image/jpeg", 0.85);

    if (withDescriptor && window.faceapi && modelsLoaded) {
      try {
        const img = new Image();
        img.src = liveSelfieBase64;
        await new Promise(res => { img.onload = res; });
        const full = await faceapi
          .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptor();
        if (full && full.descriptor) {
          liveFaceDescriptor = Array.from(full.descriptor);
        }
      } catch (e) {
        console.warn("Descriptor warning:", e);
      }
    }

    isLiveSelfieVerified = true;
    cleanupScanner();
    closeModal("cameraModal");

    const info = getOptionInfo(currentLang);
    const t = getTranslationDict(currentLang, info.name);

    const btn = document.getElementById("selfieBtn");
    const icon = document.getElementById("selfieIcon");
    const preview = document.getElementById("selfiePreview");
    const text = document.getElementById("selfieText");

    btn.classList.add("verified");
    btn.disabled = false;
    icon.style.display = "none";
    preview.src = liveSelfieBase64;
    preview.style.display = "block";
    text.innerText = t.selfieVerified;
    showSuccessMsg("Live human selfie & eye blink verified!");
  }

  function normalizeText(str) {
    return (str || "")
      .toLowerCase()
      .replace(/[^a-z0-9\u0980-\u09FF]+/g, " ")
      .trim();
  }

  function isAvatarMatchingName(avatarUrl, fullName, username, email) {
    if (!avatarUrl) return false;
    const cleanAvatar = normalizeText(decodeURIComponent(avatarUrl));
    const candidates = [fullName, username, (email || "").split("@")[0]]
      .map(normalizeText)
      .filter(Boolean);

    for (const cand of candidates) {
      if (cand.length >= 2 && cleanAvatar.includes(cand)) {
        return true;
      }
      const parts = cand.split(" ").filter(p => p.length >= 3);
      if (parts.length > 0 && parts.every(p => cleanAvatar.includes(p))) {
        return true;
      }
    }
    return false;
  }

  async function autoDisableAccountIfAvatarIsName(identifier, userId, profileData) {
    const fullName = profileData?.full_name || profileData?.name || "";
    const username = profileData?.username || "";
    const avatarUrl = profileData?.avatar_url || profileData?.selfie_url || "";

    if (!isAvatarMatchingName(avatarUrl, fullName, username, identifier)) {
      return false;
    }

    if (supabaseClient) {
      try {
        if (userId) {
          await supabaseClient
            .from("profiles")
            .update({ is_disabled: true, status: "disabled", disabled_reason: "Profile photo matches account name" })
            .eq("id", userId);
        }
        await supabaseClient
          .from("disabled_accounts")
          .upsert({
            identifier,
            user_id: userId || null,
            reason: "Profile photo matches account name",
            disabled_at: new Date().toISOString()
          }, { onConflict: "identifier" });
      } catch (e) {
        console.warn("Auto-disable sync warning:", e);
      }
    }

    try {
      localStorage.setItem("autro_disabled_" + identifier.toLowerCase(), "1");
    } catch (e) {}

    return true;
  }

  async function checkAccountDisabledStatus(identifier) {
    const normId = (identifier || "").trim().toLowerCase();
    try {
      if (localStorage.getItem("autro_disabled_" + normId) === "1") {
        return { disabled: true, reason: "Account automatically disabled because the profile photo matches the account name." };
      }
    } catch (e) {}

    if (!supabaseClient || !normId) {
      return { disabled: false };
    }

    try {
      const { data: disabledRow } = await supabaseClient
        .from("disabled_accounts")
        .select("reason")
        .eq("identifier", normId)
        .maybeSingle();

      if (disabledRow) {
        return {
          disabled: true,
          reason: disabledRow.reason || "Account automatically disabled because the profile photo matches the account name."
        };
      }

      const { data: prof } = await supabaseClient
        .from("profiles")
        .select("id, full_name, username, avatar_url, is_disabled, status")
        .or(`email.eq.${normId},username.eq.${normId}`)
        .maybeSingle();

      if (prof) {
        if (prof.is_disabled || prof.status === "disabled") {
          return { disabled: true, reason: "Account is disabled." };
        }
        const matchedNameAvatar = await autoDisableAccountIfAvatarIsName(normId, prof.id, prof);
        if (matchedNameAvatar) {
          return {
            disabled: true,
            reason: "Account automatically disabled because the profile photo matches the account name."
          };
        }
      }
    } catch (e) {
      console.warn("Account status check skipped:", e);
    }

    return { disabled: false };
  }

  async function loginWithPasskey() {
    clearMessages();
    const identifier = document.getElementById("email").value.trim();
    const statusCheck = await checkAccountDisabledStatus(identifier);
    if (statusCheck.disabled) {
      showErrorMsg("Account Disabled: " + statusCheck.reason);
      return;
    }

    const btn = document.getElementById("fingerprintBtn");
    const text = document.getElementById("fingerprintText");
    const info = getOptionInfo(currentLang);
    const t = getTranslationDict(currentLang, info.name);

    text.innerText = "Scanning...";
    btn.disabled = true;

    try {
      if (!supabaseClient || !supabaseClient.auth.signInWithPasskey) {
        throw new Error("Passkey client unavailable.");
      }
      const { error } = await supabaseClient.auth.signInWithPasskey();
      if (error) throw error;

      showSuccessMsg("Biometric Verified! Logging in...");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    } catch (err) {
      console.error("Passkey Error:", err);
      showErrorMsg("Biometric verification failed. " + (err.message || ""));
      text.innerText = t.btnPasskey;
      btn.disabled = false;
    }
  }

  function setupLoginForm() {
    const form = document.getElementById("loginForm");
    if (!form) return;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();

      const loginBtn = document.getElementById("loginBtn");
      const info = getOptionInfo(currentLang);
      const t = getTranslationDict(currentLang, info.name);
      const originalBtnText = t.loginBtn;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const statusCheck = await checkAccountDisabledStatus(email);
      if (statusCheck.disabled) {
        loginBtn.disabled = true;
        loginBtn.innerText = "Account Disabled";
        showErrorMsg("Account Disabled: " + statusCheck.reason);
        return;
      }

      const recaptchaResponse = (typeof grecaptcha !== "undefined" && typeof grecaptcha.getResponse === "function")
        ? grecaptcha.getResponse()
        : "";

      if (!recaptchaResponse) {
        captchaFailCount++;
        if (captchaFailCount >= 3) {
          loginBtn.disabled = true;
          loginBtn.innerText = "Blocked (Too many attempts)";
          showErrorMsg("Security Block: 3 failed CAPTCHA attempts.");
          return;
        }
        showErrorMsg(`Please complete the CAPTCHA. (Attempt ${captchaFailCount}/3)`);
        if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
          grecaptcha.reset();
        }
        return;
      }

      if (!isLiveSelfieVerified) {
        showErrorMsg("Access Denied: Please complete Live Selfie & Eye Scan first.");
        return;
      }

      loginBtn.innerText = "Logging in...";
      loginBtn.disabled = true;

      try {
        if (!supabaseClient) {
          throw new Error("Supabase client not initialized.");
        }
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });
        if (error) throw error;

        const user = data?.user;
        const meta = user?.user_metadata || {};
        const wasAutoDisabled = await autoDisableAccountIfAvatarIsName(email, user?.id, {
          full_name: meta.full_name || meta.name || "",
          username: meta.username || "",
          avatar_url: meta.avatar_url || meta.picture || ""
        });

        if (wasAutoDisabled) {
          await supabaseClient.auth.signOut();
          throw new Error("Account automatically disabled because the profile photo matches the account name.");
        }

        showSuccessMsg("Login Successful! Redirecting...");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);
      } catch (err) {
        console.error("Login Error:", err);
        showErrorMsg(t.errMsg + " (" + (err.message || "Unknown error") + ")");
        if (typeof grecaptcha !== "undefined" && typeof grecaptcha.reset === "function") {
          grecaptcha.reset();
        }
        loginBtn.innerText = originalBtnText;
        loginBtn.disabled = false;
      }
    });
  }

  async function googleLogin() {
    try {
      if (!supabaseClient) throw new Error("Supabase client not initialized.");
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/index.html" }
      });
      if (error) throw error;
    } catch (error) {
      showErrorMsg("Google login failed: " + (error.message || "Unknown error"));
    }
  }

  function showErrorMsg(msg) {
    document.getElementById("errorMsg").innerText = msg;
    document.getElementById("successMsg").innerText = "";
  }

  function showSuccessMsg(msg) {
    document.getElementById("successMsg").innerText = msg;
    document.getElementById("errorMsg").innerText = "";
  }

  function clearMessages() {
    document.getElementById("errorMsg").innerText = "";
    document.getElementById("successMsg").innerText = "";
  }

  function initLoginPage() {
    const selectEl = document.getElementById("languageSelect");
    if (selectEl) {
      selectEl.addEventListener("change", () => {
        const opt = selectEl.options[selectEl.selectedIndex];
        setLanguage(
          selectEl.value,
          opt ? opt.textContent.trim() : selectEl.value,
          opt && opt.getAttribute("data-dir") === "rtl" ? "rtl" : "ltr"
        );
      });
      const exists = Array.from(selectEl.options).some(o => o.value === currentLang);
      selectEl.value = exists ? currentLang : "en";
    }
    applyLanguage();
    setupLoginForm();
  }

  initLoginPage();
  document.addEventListener("DOMContentLoaded", initLoginPage);
</script>
