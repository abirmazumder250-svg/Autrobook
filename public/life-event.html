<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create life event</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #2c2d31;
      --bg-card-hover: #35363b;
      --text-primary: #f1f3f4;
      --text-secondary: #b0b3b8;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f0f2f5;
        --bg-card-hover: #e4e6eb;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 20px;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .close-btn:hover {
      background: var(--bg-card);
    }

    .close-btn:active {
      transform: scale(0.94);
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .page-content {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 36px;
    }

    .intro-text {
      text-align: center;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-secondary);
      max-width: 340px;
      margin: 4px auto 20px;
      font-weight: 400;
    }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .event-tile {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      min-height: 82px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      transition: background 0.16s ease, transform 0.12s ease, border-color 0.16s ease;
    }

    .event-tile:hover {
      background: var(--bg-card-hover);
    }

    .event-tile:active {
      transform: scale(0.98);
    }

    .event-tile i {
      font-size: 21px;
      color: var(--text-primary);
    }

    .full-width-tile {
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="create-post.html" id="closeLifeEventLink" class="close-btn" aria-label="Close and return to create post" onclick="handleCloseToCreatePost(event)">
      <i class="fas fa-xmark"></i>
    </a>
    <h1 class="topbar-title">Create life event</h1>
  </header>

  <main class="page-content">
    <p class="intro-text">Share and remember important moments from your life.</p>

    <div id="lifeEventGrid" class="grid-two"></div>
    <div id="customEventBox"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const LIFE_EVENT_ITEMS = [
      { id: 'work', label: 'Work', icon: 'fa-briefcase', href: 'life-event-form.html?category=work' },
      { id: 'education', label: 'Education', icon: 'fa-graduation-cap', href: 'life-event-form.html?category=education' },
      { id: 'relationship', label: 'Relationship', icon: 'fa-heart-circle-plus', href: 'life-event-form.html?category=relationship' },
      { id: 'living', label: 'Living', icon: 'fa-house-chimney', href: 'life-event-form.html?category=living' },
      { id: 'family', label: 'Family', icon: 'fa-tree', href: 'life-event-form.html?category=family' },
      { id: 'travel', label: 'Travel', icon: 'fa-location-dot', href: 'life-event-form.html?category=travel' },
      { id: 'activities', label: 'Activities', icon: 'fa-shapes', href: 'life-event-form.html?category=activities' },
      { id: 'wellness', label: 'Wellness', icon: 'fa-mobile-screen-button', href: 'life-event-form.html?category=wellness' },
      { id: 'milestones', label: 'Milestones', icon: 'fa-star', href: 'life-event-form.html?category=milestones' },
      { id: 'remembrance', label: 'Remembrance', icon: 'fa-candle-holder', href: 'life-event-form.html?category=remembrance' }
    ];

    const CUSTOM_EVENT_ITEM = {
      id: 'custom',
      label: 'Create your own',
      icon: 'fa-star',
      href: 'life-event-form.html?category=custom'
    };

    function handleCloseToCreatePost(e) {
      if (e) e.preventDefault();
      window.location.href = 'create-post.html';
    }

    function openLifeEventCategory(item, e) {
      if (e) e.preventDefault();
      try {
        localStorage.setItem('autro_selected_life_event_category', JSON.stringify({
          id: item.id,
          label: item.label,
          returnTo: 'create-post.html',
          selectedAt: Date.now()
        }));
      } catch (_) {}
      window.location.href = item.href;
    }

    function createTileElement(item, extraClass = '') {
      const link = document.createElement('a');
      link.href = item.href;
      link.className = `event-tile ${extraClass}`.trim();
      link.setAttribute('data-category', item.id);
      link.innerHTML = `
        <i class="fas ${item.icon}"></i>
        <span>${item.label}</span>
      `;
      link.addEventListener('click', (e) => openLifeEventCategory(item, e));
      return link;
    }

    function renderLifeEventTiles() {
      const grid = document.getElementById('lifeEventGrid');
      const customBox = document.getElementById('customEventBox');
      grid.innerHTML = '';
      customBox.innerHTML = '';

      LIFE_EVENT_ITEMS.forEach((item) => {
        grid.appendChild(createTileElement(item));
      });

      customBox.appendChild(createTileElement(CUSTOM_EVENT_ITEM, 'full-width-tile'));
    }

    window.addEventListener('DOMContentLoaded', renderLifeEventTiles);
  </script>
</body>
</html>
