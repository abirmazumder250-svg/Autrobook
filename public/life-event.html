<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Life event</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #2c2d31;
      --bg-chip: #35363a;
      --bg-chip-hover: #434449;
      --text-primary: #f1f3f4;
      --text-secondary: #9aa0a6;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
      --accent-green-hover: #0f7642;
      --accent-fg: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f8f9fa;
        --bg-chip: #f1f3f4;
        --bg-chip-hover: #e8eaed;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
        --accent-green-hover: #084727;
        --accent-fg: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 20px;
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .back-btn:hover {
      background: var(--bg-chip);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .topbar-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
      text-align: center;
    }

    .save-btn {
      background: var(--accent-green);
      color: var(--accent-fg);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .save-btn:hover {
      background: var(--accent-green-hover);
    }

    .save-btn:active {
      transform: scale(0.96);
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .category-card {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }

    .category-card:hover {
      background: var(--bg-chip);
    }

    .category-card:active {
      transform: scale(0.98);
    }

    .category-card.active {
      background: var(--accent-green);
      color: var(--accent-fg);
      border-color: var(--accent-green);
    }

    .category-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--bg-chip);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .category-card.active .category-icon {
      background: rgba(255, 255, 255, 0.18);
      color: var(--accent-fg);
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .field-input,
    .field-textarea {
      width: 100%;
      background: var(--bg-page);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.16s ease;
    }

    .field-input:focus,
    .field-textarea:focus {
      border-color: var(--accent-green);
    }

    .field-textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.45;
    }

    .preview-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .preview-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-green);
      color: var(--accent-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .preview-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .preview-meta {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .preview-note {
      font-size: 13.5px;
      color: var(--text-primary);
      margin-top: 6px;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-green);
      color: var(--accent-fg);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 100;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="create-post.html" class="back-btn" aria-label="Back to create post" title="Back">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div class="topbar-title">Life event</div>
    <button type="button" id="saveLifeEventBtn" class="save-btn" onclick="saveLifeEventAndReturn()">Save</button>
  </header>

  <main class="container">
    <div>
      <div class="section-label">Choose a category</div>
      <div id="categoryGrid" class="category-grid"></div>
    </div>

    <div class="form-card">
      <div class="field-group">
        <label for="eventTitle" class="field-label">Headline</label>
        <input
          type="text"
          id="eventTitle"
          class="field-input"
          maxlength="120"
          placeholder="e.g. Started a new journey"
          oninput="updatePreview()"
        />
      </div>

      <div class="field-group">
        <label for="eventDate" class="field-label">Date</label>
        <input
          type="date"
          id="eventDate"
          class="field-input"
          onchange="updatePreview()"
        />
      </div>

      <div class="field-group">
        <label for="eventLocation" class="field-label">Place (optional)</label>
        <input
          type="text"
          id="eventLocation"
          class="field-input"
          maxlength="120"
          placeholder="Add location"
          oninput="updatePreview()"
        />
      </div>

      <div class="field-group">
        <label for="eventStory" class="field-label">Details</label>
        <textarea
          id="eventStory"
          class="field-textarea"
          maxlength="1000"
          placeholder="Share a memory or note about this moment..."
          oninput="updatePreview()"
        ></textarea>
      </div>
    </div>

    <div class="preview-banner">
      <div id="previewBadge" class="preview-badge">
        <i class="fas fa-flag"></i>
      </div>
      <div>
        <div id="previewTitle" class="preview-title">Life Event</div>
        <div id="previewMeta" class="preview-meta"></div>
        <div id="previewNote" class="preview-note"></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const LIFE_EVENT_CATEGORIES = [
      { id: 'milestone', label: 'Milestone', icon: 'fa-flag', defaultTitle: 'Reached a new milestone' },
      { id: 'career', label: 'New job', icon: 'fa-briefcase', defaultTitle: 'Started a new job' },
      { id: 'education', label: 'Graduation', icon: 'fa-graduation-cap', defaultTitle: 'Graduated' },
      { id: 'travel', label: 'Travel', icon: 'fa-plane', defaultTitle: 'Went on a trip' },
      { id: 'home', label: 'New home', icon: 'fa-house', defaultTitle: 'Moved to a new place' },
      { id: 'celebration', label: 'Celebration', icon: 'fa-cake-candles', defaultTitle: 'Celebrating a special day' }
    ];

    let selectedCategory = LIFE_EVENT_CATEGORIES[0];

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._leToastTimer);
      window._leToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = '';

      LIFE_EVENT_CATEGORIES.forEach((cat) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `category-card ${selectedCategory.id === cat.id ? 'active' : ''}`;
        btn.innerHTML = `
          <span class="category-icon"><i class="fas ${cat.icon}"></i></span>
          <span>${cat.label}</span>
        `;
        btn.onclick = () => {
          const titleInput = document.getElementById('eventTitle');
          const prevDefault = selectedCategory.defaultTitle;
          selectedCategory = cat;
          if (!titleInput.value.trim() || titleInput.value.trim() === prevDefault) {
            titleInput.value = cat.defaultTitle;
          }
          renderCategories();
          updatePreview();
        };
        grid.appendChild(btn);
      });
    }

    function updatePreview() {
      const title = document.getElementById('eventTitle').value.trim() || selectedCategory.defaultTitle;
      const dateVal = document.getElementById('eventDate').value;
      const locVal = document.getElementById('eventLocation').value.trim();
      const storyVal = document.getElementById('eventStory').value.trim();

      document.getElementById('previewBadge').innerHTML = `<i class="fas ${selectedCategory.icon}"></i>`;
      document.getElementById('previewTitle').textContent = title;

      const metaParts = [selectedCategory.label];
      if (dateVal) metaParts.push(dateVal);
      if (locVal) metaParts.push(locVal);
      document.getElementById('previewMeta').textContent = metaParts.join(' · ');
      document.getElementById('previewNote').textContent = storyVal;
    }

    function buildLifeEventText() {
      const title = document.getElementById('eventTitle').value.trim() || selectedCategory.defaultTitle;
      const dateVal = document.getElementById('eventDate').value;
      const locVal = document.getElementById('eventLocation').value.trim();
      const storyVal = document.getElementById('eventStory').value.trim();

      const headerLine = `[${selectedCategory.label}] ${title}`;
      const details = [];
      if (dateVal) details.push(`Date: ${dateVal}`);
      if (locVal) details.push(`Location: ${locVal}`);

      const lines = [headerLine];
      if (details.length) lines.push(details.join(' · '));
      if (storyVal) lines.push(storyVal);

      return lines.join('\n');
    }

    function saveLifeEventAndReturn() {
      const title = document.getElementById('eventTitle').value.trim() || selectedCategory.defaultTitle;
      const dateVal = document.getElementById('eventDate').value;
      const locVal = document.getElementById('eventLocation').value.trim();
      const storyVal = document.getElementById('eventStory').value.trim();
      const formattedEventText = buildLifeEventText();

      const eventPayload = {
        categoryId: selectedCategory.id,
        categoryLabel: selectedCategory.label,
        title,
        date: dateVal,
        location: locVal,
        story: storyVal,
        formattedText: formattedEventText,
        savedAt: Date.now()
      };

      try {
        localStorage.setItem('autro_life_event', JSON.stringify(eventPayload));

        let existingDraft = {};
        const rawDraft = sessionStorage.getItem('autro_create_post_draft');
        if (rawDraft) {
          existingDraft = JSON.parse(rawDraft) || {};
        }

        const existingCaption = String(existingDraft.caption || '').trim();
        existingDraft.caption = existingCaption
          ? `${existingCaption}\n\n${formattedEventText}`
          : formattedEventText;

        if (locVal && !existingDraft.location) {
          existingDraft.location = locVal;
        }

        sessionStorage.setItem('autro_create_post_draft', JSON.stringify(existingDraft));
      } catch (_) {}

      showToast('Added to post');
      setTimeout(() => {
        window.location.href = 'create-post.html';
      }, 150);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('eventDate').value = todayStr;
      document.getElementById('eventTitle').value = selectedCategory.defaultTitle;
      renderCategories();
      updatePreview();
    });
  </script>
</body>
</html>
