<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create life event</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #2c2d31;
      --bg-card-hover: #35363b;
      --bg-sheet: #1d1e22;
      --text-primary: #f1f3f4;
      --text-secondary: #b0b3b8;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f5f6f8;
        --bg-card-hover: #eaecf0;
        --bg-sheet: #ffffff;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 21px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .close-btn:hover {
      background: var(--bg-card);
    }

    .close-btn:active {
      transform: scale(0.94);
    }

    .topbar-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 18px 14px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .subtitle {
      text-align: center;
      font-size: 15.5px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.4;
      padding: 2px 12px 6px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .event-tile {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px 12px;
      min-height: 84px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.12s ease, border-color 0.16s ease;
    }

    .event-tile:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-green);
    }

    .event-tile:active {
      transform: scale(0.98);
    }

    .event-tile i {
      font-size: 20px;
      color: var(--text-primary);
    }

    .event-tile span {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .full-width-tile {
      width: 100%;
    }

    /* BOTTOM SHEET: SELECT CATEGORY */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 640px;
      max-height: 68vh;
      background: var(--bg-sheet);
      color: var(--text-primary);
      border-top: 1px solid var(--border-color);
      border-radius: 18px 18px 0 0;
      padding: 8px 0 22px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-color);
      margin: 0 auto 10px;
    }

    .sheet-header {
      position: relative;
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 14px;
      margin-bottom: 6px;
    }

    .sheet-close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sheet-close-btn:hover {
      background: var(--bg-card);
    }

    .sheet-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      pointer-events: none;
    }

    .subcat-list {
      display: flex;
      flex-direction: column;
    }

    .subcat-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid rgba(128, 128, 128, 0.14);
      transition: background 0.15s ease;
    }

    .subcat-link:last-child {
      border-bottom: none;
    }

    .subcat-link:hover {
      background: var(--bg-card);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="create-post.html" class="close-btn" aria-label="Close and return to create post" title="Close">
      <i class="fas fa-xmark"></i>
    </a>
    <h1 class="topbar-title">Create life event</h1>
  </header>

  <main class="container">
    <p class="subtitle">Share and remember important moments from your life.</p>

    <div class="grid-two">
      <button type="button" class="event-tile" onclick="openCategorySheet('work')">
        <i class="fas fa-briefcase"></i>
        <span>Work</span>
      </button>

      <button type="button" class="event-tile" onclick="openCategorySheet('education')">
        <i class="fas fa-graduation-cap"></i>
        <span>Education</span>
      </button>

      <button type="button" class="event-tile" onclick="openCategorySheet('relationship')">
        <i class="fas fa-heart"></i>
        <span>Relationship</span>
      </button>

      <button type="button" class="event-tile" onclick="openCategorySheet('living')">
        <i class="fas fa-house"></i>
        <span>Living</span>
      </button>

      <button type="button" class="event-tile" onclick="openCategorySheet('family')">
        <i class="fas fa-seedling"></i>
        <span>Family</span>
      </button>

      <a href="travel.html" class="event-tile" onclick="openLifeEventPage('travel.html', event)">
        <i class="fas fa-location-dot"></i>
        <span>Travel</span>
      </a>

      <a href="activities.html" class="event-tile" onclick="openLifeEventPage('activities.html', event)">
        <i class="fas fa-shapes"></i>
        <span>Activities</span>
      </a>

      <a href="wellness.html" class="event-tile" onclick="openLifeEventPage('wellness.html', event)">
        <i class="fas fa-mobile-screen-button"></i>
        <span>Wellness</span>
      </a>

      <a href="milestones.html" class="event-tile" onclick="openLifeEventPage('milestones.html', event)">
        <i class="far fa-star"></i>
        <span>Milestones</span>
      </a>

      <a href="remembrance.html" class="event-tile" onclick="openLifeEventPage('remembrance.html', event)">
        <i class="fas fa-candle-holder"></i>
        <span>Remembrance</span>
      </a>
    </div>

    <a href="create-your-own.html" class="event-tile full-width-tile" onclick="openLifeEventPage('create-your-own.html', event)">
      <i class="fas fa-star-of-life"></i>
      <span>Create your own</span>
    </a>
  </main>

  <div id="categorySheetBackdrop" class="sheet-backdrop" onclick="closeCategorySheet()">
    <div class="sheet-panel" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button type="button" class="sheet-close-btn" onclick="closeCategorySheet()" aria-label="Close">
          <i class="fas fa-xmark"></i>
        </button>
        <div id="sheetTitle" class="sheet-title">Select category</div>
      </div>
      <div id="subcatList" class="subcat-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const SUBCATEGORIES = {
      work: [
        { label: 'New Job', page: 'new-job.html' },
        { label: 'Promotion', page: 'promotion.html' },
        { label: 'Left Job', page: 'left-job.html' },
        { label: 'Retirement', page: 'retirement.html' }
      ],
      education: [
        { label: 'New School', page: 'new-school.html' },
        { label: 'Graduated', page: 'graduated.html' },
        { label: 'Left school', page: 'left-school.html' }
      ],
      relationship: [
        { label: 'New Relationship', page: 'new-relationship.html' },
        { label: 'Engagement', page: 'engagement.html' },
        { label: 'Marriage', page: 'marriage.html' },
        { label: 'First Met', page: 'first-met.html' }
      ],
      living: [
        { label: 'Moved', page: 'moved.html' },
        { label: "Places I've lived", page: 'places-ive-lived.html' },
        { label: 'Hometown', page: 'hometown.html' }
      ],
      family: [
        { label: 'New Child', page: 'new-child.html' },
        { label: 'Parenthood', page: 'parenthood.html' },
        { label: 'New Pet', page: 'new-pet.html' },
        { label: 'Loss of a Loved One', page: 'loss-of-a-loved-one.html' }
      ]
    };

    function openLifeEventPage(targetPage, event) {
      if (event) event.preventDefault();
      try {
        sessionStorage.setItem('autro_selected_life_event_page', targetPage);
      } catch (_) {}
      window.location.href = targetPage;
    }

    function openCategorySheet(groupKey) {
      const items = SUBCATEGORIES[groupKey] || [];
      const listEl = document.getElementById('subcatList');
      document.getElementById('sheetTitle').textContent = 'Select category';
      listEl.innerHTML = '';

      items.forEach((item) => {
        const link = document.createElement('a');
        link.href = item.page;
        link.className = 'subcat-link';
        link.innerHTML = `<span>${item.label}</span>`;
        link.onclick = (e) => openLifeEventPage(item.page, e);
        listEl.appendChild(link);
      });

      document.getElementById('categorySheetBackdrop').classList.add('open');
    }

    function closeCategorySheet() {
      document.getElementById('categorySheetBackdrop').classList.remove('open');
    }
  </script>
</body>
</html>
