<!DOCTYPE html>
<html lang="en" data-page="milestones.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create life event - Milestones</title>
  <link rel="canonical" href="/milestones.html" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #28292d;
      --bg-card-hover: #323338;
      --bg-banner: #e6eef7;
      --text-primary: #ffffff;
      --text-secondary: #9aa0a6;
      --text-muted: #757a82;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
      --accent-green-hover: #0f7642;
      --accent-link: #10b981;
      --accent-badge: #0b5d34;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f5f6f8;
        --bg-card-hover: #eaecf0;
        --bg-banner: #e9f0f8;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --text-muted: #80868b;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
        --accent-green-hover: #084727;
        --accent-link: #0b5d34;
        --accent-badge: #0b5d34;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 19px;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .back-btn:hover {
      background: var(--bg-card);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .topbar-title-link {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: not-allowed;
      transition: color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    }

    .next-btn.active {
      color: var(--accent-green);
      background: rgba(11, 93, 52, 0.14);
      cursor: pointer;
    }

    .next-btn.active:hover {
      background: rgba(11, 93, 52, 0.22);
    }

    .next-btn.active:active {
      transform: scale(0.96);
    }

    /* BANNER AREA */
    .hero-banner-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .hero-banner {
      position: relative;
      width: 100%;
      height: 235px;
      background: var(--bg-banner);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-banner img.custom-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .default-illustration {
      position: relative;
      width: 290px;
      height: 195px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .milestones-scene {
      position: relative;
      width: 230px;
      height: 165px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .doodle-line {
      position: absolute;
      border: 2px solid rgba(56, 132, 210, 0.22);
      pointer-events: none;
    }

    .doodle-swirl {
      width: 56px;
      height: 48px;
      border-radius: 50%;
      bottom: 8px;
      left: -18px;
      transform: rotate(-20deg);
    }

    .doodle-badge {
      width: 44px;
      height: 54px;
      border-radius: 10px;
      bottom: 12px;
      right: -20px;
      transform: rotate(12deg);
    }

    .medal-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .medal-item.left {
      transform: translateX(8px) translateY(-28px);
      z-index: 2;
    }

    .medal-item.center {
      transform: translateY(-2px);
      z-index: 4;
    }

    .medal-item.right {
      transform: translateX(-8px) translateY(-24px);
      z-index: 3;
    }

    .medal-ribbon {
      width: 16px;
      height: 66px;
      border-radius: 0 0 4px 4px;
      margin-bottom: -10px;
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.14);
    }

    .medal-item.left .medal-ribbon {
      background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    }

    .medal-item.center .medal-ribbon {
      height: 82px;
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    }

    .medal-item.right .medal-ribbon {
      background: linear-gradient(180deg, #ec4899 0%, #db2777 100%);
    }

    .medal-disc {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fde047 0%, #facc15 65%, #eab308 100%);
      box-shadow: 0 7px 14px rgba(180, 83, 9, 0.26), inset 0 0 0 4px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .medal-item.center .medal-disc {
      width: 60px;
      height: 60px;
    }

    .medal-star {
      color: #fef08a;
      font-size: 20px;
      filter: drop-shadow(0 1px 2px rgba(161, 98, 7, 0.45));
    }

    .medal-item.center .medal-star {
      font-size: 23px;
    }

    .photo-chip-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(32, 33, 36, 0.72);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 7px 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .photo-chip-btn:hover {
      background: rgba(32, 33, 36, 0.88);
    }

    .photo-chip-btn:active {
      transform: scale(0.96);
    }

    .banner-clear-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 6;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(32, 33, 36, 0.72);
      color: #ffffff;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .banner-clear-btn:hover {
      background: rgba(32, 33, 36, 0.88);
    }

    .banner-clear-btn:active {
      transform: scale(0.94);
    }

    .icon-picker-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: -24px auto 12px;
      position: relative;
      z-index: 10;
      gap: 6px;
    }

    .center-badge-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-badge);
      border: 3px solid var(--bg-page);
      color: #ffffff;
      font-size: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .center-badge-btn:hover {
      background: var(--accent-green-hover);
    }

    .center-badge-btn:active {
      transform: scale(0.94);
    }

    .select-icon-link {
      background: transparent;
      border: none;
      color: var(--accent-link);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .select-icon-link:hover {
      background: rgba(11, 93, 52, 0.12);
      text-decoration: underline;
    }

    /* FORM FIELDS */
    .form-body {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 16px 36px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 62px;
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .input-card:focus-within {
      border-color: var(--accent-green);
    }

    .field-caption {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    .title-input::placeholder {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .helper-hint {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 0 4px 2px;
      line-height: 1.35;
    }

    .date-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .date-picker-hidden {
      position: relative;
      margin-top: 4px;
    }

    .date-picker-hidden input[type="date"] {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-green);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 120;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="life-event.html" class="back-btn" aria-label="Back to life event" title="Back" onclick="handleBackToLifeEvent(event)">
        <i class="fas fa-arrow-left"></i>
      </a>
      <a href="life-event.html" class="topbar-title-link" onclick="handleBackToLifeEvent(event)">Create life event</a>
    </div>

    <button type="button" id="nextBtn" class="next-btn" onclick="submitMilestoneToCreatePost()" disabled>
      NEXT
    </button>
  </header>

  <div class="hero-banner-wrap">
    <div id="heroBanner" class="hero-banner">
      <button type="button" class="photo-chip-btn" onclick="openGalleryPicker()">
        <i class="far fa-image"></i>
        <span>Photo</span>
      </button>

      <button type="button" class="banner-clear-btn" onclick="clearBannerPhoto()" aria-label="Remove photo" title="Remove">
        <i class="fas fa-xmark"></i>
      </button>

      <div id="defaultIllustration" class="default-illustration">
        <div class="milestones-scene" aria-hidden="true">
          <div class="doodle-line doodle-swirl"></div>
          <div class="doodle-line doodle-badge"></div>

          <div class="medal-item left">
            <div class="medal-ribbon"></div>
            <div class="medal-disc">
              <i class="fas fa-star medal-star"></i>
            </div>
          </div>

          <div class="medal-item center">
            <div class="medal-ribbon"></div>
            <div class="medal-disc">
              <i class="fas fa-star medal-star"></i>
            </div>
          </div>

          <div class="medal-item right">
            <div class="medal-ribbon"></div>
            <div class="medal-disc">
              <i class="fas fa-star medal-star"></i>
            </div>
          </div>
        </div>
      </div>

      <img id="customBannerImg" class="custom-photo" alt="Selected milestone photo" style="display:none;" />
    </div>

    <div class="icon-picker-block">
      <button
        type="button"
        id="centerIconBtn"
        class="center-badge-btn"
        aria-label="Select icon"
        title="Select Icon"
        onclick="openSelectIconPage(event)"
      >
        <i id="selectedIconEl" class="fas fa-award"></i>
      </button>
      <a href="change-icon.html?from=milestones.html" class="select-icon-link" onclick="openSelectIconPage(event)">
        Select Icon
      </a>
    </div>
  </div>

  <main class="form-body">
    <div class="input-card">
      <label for="milestoneTitleInput" class="field-caption">Title</label>
      <input
        type="text"
        id="milestoneTitleInput"
        class="title-input"
        maxlength="120"
        placeholder="Title"
        oninput="handleTitleInput()"
      />
    </div>
    <p class="helper-hint">Example: cultural event, religious event, achievement, first or milestone birthday</p>

    <div class="input-card">
      <div class="field-caption">Date:</div>
      <div id="dateLabelText" class="date-value">Nov 28, 2026</div>
      <div class="date-picker-hidden">
        <input type="date" id="milestoneDateInput" onchange="handleDateChange()" />
      </div>
    </div>
  </main>

  <input type="file" id="galleryPhotoInput" accept="image/*" style="display:none;" onchange="handleGalleryPhotoSelected(event)" />

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const MILESTONES_PAGE_URL = '/milestones.html';
    const CHANGE_ICON_PAGE_URL = 'change-icon.html?from=milestones.html';
    const LIFE_EVENT_PAGE_URL = 'life-event.html';
    const CREATE_POST_PAGE_URL = '/create-post.html';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const MILESTONES_DRAFT_KEY = 'autro_milestones_draft';
    const SELECTED_ICON_KEYS = [
      'autro_life_event_icon',
      'autro_selected_icon',
      'autro_custom_icon'
    ];
    const LIFE_EVENT_SAVED_KEY = 'autro_life_event';
    const LIFE_EVENT_PHOTO_KEY = 'autro_life_event_photo';
    const POST_DRAFT_KEY = 'autro_create_post_draft';

    const DEFAULT_ICON_CLASS = 'fas fa-award';
    let selectedIconClass = DEFAULT_ICON_CLASS;
    let selectedPhotoDataUrl = '';
    let photoRemovedManually = false;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._msToastTimer);
      window._msToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function openGalleryPicker() {
      document.getElementById('galleryPhotoInput').click();
    }

    function safeWriteStore(key, val) {
      const str = String(val || '');
      try { sessionStorage.setItem(key, str); } catch (_) {}
      try { localStorage.setItem(key, str); } catch (_) {}
      try {
        let state = {};
        if (window.name && window.name.startsWith('AUTRO_STATE:')) {
          state = JSON.parse(window.name.slice('AUTRO_STATE:'.length)) || {};
        }
        if (str) state[key] = str;
        else delete state[key];
        const nextName = 'AUTRO_STATE:' + JSON.stringify(state);
        if (nextName.length < 1800000) window.name = nextName;
      } catch (_) {}
    }

    function safeReadStore(key) {
      try {
        const s = sessionStorage.getItem(key);
        if (s) return s;
      } catch (_) {}
      try {
        const l = localStorage.getItem(key);
        if (l) return l;
      } catch (_) {}
      try {
        if (window.name && window.name.startsWith('AUTRO_STATE:')) {
          const state = JSON.parse(window.name.slice('AUTRO_STATE:'.length)) || {};
          if (state[key]) return String(state[key]);
        }
      } catch (_) {}
      return '';
    }

    function handleBackToLifeEvent(event) {
      if (event) event.preventDefault();
      saveCurrentDraft();
      window.location.href = LIFE_EVENT_PAGE_URL;
    }

    function openSelectIconPage(event) {
      if (event) event.preventDefault();
      saveCurrentDraft();
      safeWriteStore('autro_icon_return_page', 'milestones.html');
      window.location.href = CHANGE_ICON_PAGE_URL;
    }

    function normalizeIconClass(raw) {
      const clean = String(raw || '').trim();
      if (!clean) return DEFAULT_ICON_CLASS;
      if (/^fa[srlbd]?\s+fa-/i.test(clean)) return clean;
      if (/^fa-[a-z0-9-]+$/i.test(clean)) return `fas ${clean}`;
      return DEFAULT_ICON_CLASS;
    }

    function renderSelectedIcon() {
      const el = document.getElementById('selectedIconEl');
      if (el) el.className = normalizeIconClass(selectedIconClass);
    }

    function extractIconFromUrlOrStorage() {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get('icon') || params.get('iconClass');
      if (fromUrl && fromUrl.trim()) {
        const normalized = normalizeIconClass(fromUrl);
        safeWriteStore(SELECTED_ICON_KEYS[0], normalized);
        return normalized;
      }
      for (const key of SELECTED_ICON_KEYS) {
        const val = safeReadStore(key);
        if (val) return normalizeIconClass(val);
      }
      return DEFAULT_ICON_CLASS;
    }

    function compressImageFileToDataUrl(file, maxWidth = 960, quality = 0.72) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith('image/')) return resolve('');
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.naturalWidth || img.width || maxWidth;
            const h = img.naturalHeight || img.height || maxWidth;
            const scale = Math.min(1, maxWidth / w);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(w * scale));
            canvas.height = Math.max(1, Math.round(h * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            URL.revokeObjectURL(objectUrl);
            resolve(dataUrl);
          } catch (_) {
            URL.revokeObjectURL(objectUrl);
            resolve('');
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        };
        img.src = objectUrl;
      });
    }

    function renderBannerVisual() {
      const imgEl = document.getElementById('customBannerImg');
      const defEl = document.getElementById('defaultIllustration');

      if (selectedPhotoDataUrl) {
        imgEl.src = selectedPhotoDataUrl;
        imgEl.style.display = 'block';
        defEl.style.display = 'none';
      } else {
        imgEl.src = '';
        imgEl.style.display = 'none';
        defEl.style.display = photoRemovedManually ? 'none' : 'flex';
      }
    }

    async function handleGalleryPhotoSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      let dataUrl = await compressImageFileToDataUrl(file, 960, 0.72);
      if (!dataUrl && file.size <= 1600000) {
        dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });
      }

      if (dataUrl) {
        selectedPhotoDataUrl = dataUrl;
        photoRemovedManually = false;
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, dataUrl);
        renderBannerVisual();
        saveCurrentDraft();
        showToast('Photo selected');
      } else {
        showToast('Unable to load photo');
      }
    }

    function clearBannerPhoto() {
      selectedPhotoDataUrl = '';
      photoRemovedManually = true;
      document.getElementById('galleryPhotoInput').value = '';
      safeWriteStore(LIFE_EVENT_PHOTO_KEY, '');
      renderBannerVisual();
      saveCurrentDraft();
    }

    function getLiveLocalIsoDate() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatLiveDateLabel(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return isoDate;
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return dt.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function handleDateChange() {
      const val = document.getElementById('milestoneDateInput').value || getLiveLocalIsoDate();
      document.getElementById('dateLabelText').textContent = formatLiveDateLabel(val);
      saveCurrentDraft();
    }

    function updateNextButtonState() {
      const btn = document.getElementById('nextBtn');
      const titleVal = document.getElementById('milestoneTitleInput').value.trim();
      const hasTitle = Boolean(titleVal);

      btn.disabled = !hasTitle;
      btn.classList.toggle('active', hasTitle);
    }

    function handleTitleInput() {
      updateNextButtonState();
      saveCurrentDraft();
    }

    function saveCurrentDraft() {
      const draft = {
        title: document.getElementById('milestoneTitleInput').value,
        iconClass: selectedIconClass,
        date: document.getElementById('milestoneDateInput').value,
        photoDataUrl: selectedPhotoDataUrl,
        photoRemovedManually
      };
      safeWriteStore(MILESTONES_DRAFT_KEY, JSON.stringify(draft));
      safeWriteStore(SELECTED_ICON_KEYS[0], selectedIconClass);
      if (selectedPhotoDataUrl) {
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, selectedPhotoDataUrl);
      }
    }

    function restoreMilestonesState() {
      const liveIsoDate = getLiveLocalIsoDate();
      document.getElementById('milestoneDateInput').value = liveIsoDate;
      document.getElementById('dateLabelText').textContent = formatLiveDateLabel(liveIsoDate);

      try {
        const rawDraft = safeReadStore(MILESTONES_DRAFT_KEY);
        if (rawDraft) {
          const d = JSON.parse(rawDraft);
          if (typeof d.title === 'string') {
            document.getElementById('milestoneTitleInput').value = d.title;
          }
          if (typeof d.iconClass === 'string' && d.iconClass) {
            selectedIconClass = normalizeIconClass(d.iconClass);
          }
          if (typeof d.date === 'string' && d.date) {
            document.getElementById('milestoneDateInput').value = d.date;
            document.getElementById('dateLabelText').textContent = formatLiveDateLabel(d.date);
          }
          if (typeof d.photoDataUrl === 'string' && d.photoDataUrl) {
            selectedPhotoDataUrl = d.photoDataUrl;
          }
          photoRemovedManually = Boolean(d.photoRemovedManually);
        }
      } catch (_) {}

      selectedIconClass = extractIconFromUrlOrStorage();
      renderSelectedIcon();

      const storedPhoto = safeReadStore(LIFE_EVENT_PHOTO_KEY);
      if (storedPhoto && !photoRemovedManually) {
        selectedPhotoDataUrl = storedPhoto;
      }

      renderBannerVisual();
      updateNextButtonState();
    }

    async function syncMilestoneToSupabase(payload) {
      if (!sb) return;
      try {
        const { data: { session } } = await sb.auth.getSession();
        const uid = session?.user?.id;
        if (!uid) return;
        await sb.from('life_events').insert({
          user_id: uid,
          category: payload.categoryLabel,
          sub_category: payload.subCategory,
          title: payload.title,
          icon_class: payload.iconClass,
          event_date: payload.date,
          photo_url: payload.photoUrl || null
        });
      } catch (_) {}
    }

    async function submitMilestoneToCreatePost() {
      const titleVal = document.getElementById('milestoneTitleInput').value.trim();
      if (!titleVal) {
        showToast('Please enter a milestone title');
        return;
      }

      const dateVal = document.getElementById('milestoneDateInput').value || getLiveLocalIsoDate();
      const dateDisplay = formatLiveDateLabel(dateVal);
      const photoToPass = selectedPhotoDataUrl || safeReadStore(LIFE_EVENT_PHOTO_KEY) || '';
      const iconToPass = normalizeIconClass(selectedIconClass);

      const formattedText = `[Milestones] ${titleVal} (${dateDisplay})`;

      const lifeEventPayload = {
        categoryId: 'milestones',
        categoryLabel: 'Milestones',
        subCategory: 'Milestones',
        title: titleVal,
        iconClass: iconToPass,
        date: dateDisplay,
        rawDate: dateVal,
        photoUrl: photoToPass,
        photo_url: photoToPass,
        bannerUrl: photoToPass,
        image: photoToPass,
        photo: photoToPass,
        editUrl: MILESTONES_PAGE_URL,
        formattedText,
        savedAt: Date.now()
      };

      safeWriteStore(LIFE_EVENT_SAVED_KEY, JSON.stringify(lifeEventPayload));
      if (photoToPass) {
        safeWriteStore(LIFE_EVENT_PHOTO_KEY, photoToPass);
      }

      try {
        sessionStorage.removeItem(MILESTONES_DRAFT_KEY);
        let existingDraft = {};
        const rawPostDraft = safeReadStore(POST_DRAFT_KEY);
        if (rawPostDraft) {
          existingDraft = JSON.parse(rawPostDraft) || {};
        }

        const prevCaption = String(existingDraft.caption || '').trim();
        existingDraft.caption = prevCaption ? `${prevCaption}\n\n${formattedText}` : formattedText;
        existingDraft.lifeEvent = lifeEventPayload;

        safeWriteStore(POST_DRAFT_KEY, JSON.stringify(existingDraft));
      } catch (_) {}

      await syncMilestoneToSupabase(lifeEventPayload);
      window.location.href = CREATE_POST_PAGE_URL;
    }

    window.addEventListener('DOMContentLoaded', () => {
      restoreMilestonesState();
    });
  </script>
</body>
  </html>
