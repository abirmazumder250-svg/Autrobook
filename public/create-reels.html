<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create reel - Autrobook</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/profile.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/profile.js" defer></script>
<style>
  :root {
    --bg-color: #ffffff;
    --surface-color: #ffffff;
    --card-bg: #f8fafc;
    --input-bg: #f1f5f9;
    --text-color: #0f172a;
    --muted-color: #5f6368;
    --border-color: #e5e7eb;
    --hover-color: rgba(0, 0, 0, 0.05);
    --accent-color: #0d4a26;
    --accent-hover: #09361b;
    --accent-soft: rgba(13, 74, 38, 0.14);
    --accent-glow: rgba(13, 74, 38, 0.25);
    --quick-circle-bg: #e9ecef;
    --btn-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #202124;
      --surface-color: #202124;
      --card-bg: #292a2d;
      --input-bg: #303134;
      --text-color: #f1f5f9;
      --muted-color: #9aa0a6;
      --border-color: #3c4043;
      --hover-color: rgba(255, 255, 255, 0.07);
      --accent-color: #115e32;
      --accent-hover: #0d4a26;
      --accent-soft: rgba(17, 94, 50, 0.24);
      --accent-glow: rgba(17, 94, 50, 0.34);
      --quick-circle-bg: #3c4043;
      --btn-text: #ffffff;
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .app-shell {
    max-width: 680px;
    margin: 0 auto;
    min-height: 100vh;
    background-color: var(--surface-color);
    display: flex;
    flex-direction: column;
    padding-bottom: 32px;
  }

  /* Top Bar */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background-color: var(--surface-color);
    gap: 8px;
  }

  .top-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-color);
    font-size: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.18s ease, transform 0.15s ease;
    flex-shrink: 0;
  }

  .icon-btn:hover {
    background-color: var(--hover-color);
    transform: scale(1.04);
  }

  .page-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .share-pill-btn {
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--accent-color);
    background-color: var(--accent-color);
    color: var(--btn-text);
    font-size: 13.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 3px 12px var(--accent-glow);
    transition: transform 0.15s ease, background-color 0.18s ease;
  }

  .share-pill-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    background-color: var(--accent-hover);
  }

  .share-pill-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Caption & Factory Meta Box */
  .caption-box {
    padding: 12px 14px;
    background-color: var(--surface-color);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .caption-input {
    width: 100%;
    min-height: 64px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background-color: var(--input-bg);
    color: var(--text-color);
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }

  .caption-input:focus {
    border-color: var(--accent-color);
  }

  .factory-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--muted-color);
  }

  .meta-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background-color: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    font-weight: 600;
  }

  .cover-preview-thumb {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--accent-color);
    display: none;
  }

  .cover-preview-thumb.visible {
    display: inline-block;
  }

  /* Direct Reels Moderation Form Box */
  .quick-upload-panel {
    margin: 4px 14px 10px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--border-color);
    background-color: var(--card-bg);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quick-upload-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .quick-upload-panel input[type="text"] {
    flex: 1;
    min-width: 180px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background-color: var(--input-bg);
    color: var(--text-color);
    padding: 8px 11px;
    font-size: 13.5px;
    outline: none;
  }

  .quick-upload-panel input[type="file"] {
    font-size: 12.5px;
    color: var(--muted-color);
  }

  .quick-upload-btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--accent-color);
    background-color: var(--accent-color);
    color: var(--btn-text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .quick-upload-btn:hover {
    background-color: var(--accent-hover);
  }

  #reelsStatus {
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted-color);
  }

  /* Horizontal Quick Tools Strip */
  .quick-tools-strip {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 14px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    background-color: var(--surface-color);
  }

  .quick-tools-strip::-webkit-scrollbar {
    display: none;
  }

  .quick-tool-item {
    flex: 0 0 auto;
    width: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: none;
    padding: 0;
    color: var(--text-color);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: transform 0.16s ease;
  }

  .quick-tool-item:hover {
    transform: translateY(-2px);
  }

  .quick-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background-color: var(--quick-circle-bg);
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }

  .quick-tool-item.active .quick-circle {
    background-color: var(--accent-color);
    color: var(--btn-text);
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .quick-label {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.25;
    color: var(--text-color);
  }

  /* Gallery & Select Multiple Header */
  .gallery-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    gap: 10px;
  }

  .gallery-dropdown-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: var(--text-color);
    font-size: 17px;
    font-weight: 700;
    padding: 6px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .gallery-dropdown-btn:hover {
    background-color: var(--hover-color);
  }

  .select-multiple-btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background-color: var(--card-bg);
    color: var(--text-color);
    font-size: 13.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }

  .select-multiple-btn.active {
    background-color: var(--accent-color);
    border-color: var(--accent-color);
    color: var(--btn-text);
    box-shadow: 0 3px 10px var(--accent-glow);
  }

  /* Gallery Media Grid */
  .media-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 0 3px 20px;
  }

  .empty-gallery-box {
    grid-column: 1 / -1;
    margin: 6px 11px 10px;
    padding: 28px 16px;
    border-radius: 16px;
    border: 1.5px dashed var(--border-color);
    background-color: var(--card-bg);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: border-color 0.18s ease, transform 0.15s ease;
  }

  .empty-gallery-box:hover {
    border-color: var(--accent-color);
    transform: translateY(-1px);
  }

  .empty-gallery-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background-color: var(--accent-soft);
    color: var(--text-color);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .empty-gallery-title {
    margin: 0;
    font-size: 14.5px;
    font-weight: 700;
  }

  .empty-gallery-sub {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted-color);
  }

  .media-tile {
    position: relative;
    aspect-ratio: 3 / 4;
    background-color: var(--card-bg);
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.16s ease, border-color 0.16s ease, filter 0.16s ease;
  }

  .media-tile:hover {
    filter: brightness(0.94);
  }

  .media-tile.selected,
  .media-tile.active-pick {
    border-color: var(--accent-color);
  }

  .media-tile img,
  .media-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }

  .media-tile:hover img,
  .media-tile:hover video {
    transform: scale(1.03);
  }

  .media-badge {
    position: absolute;
    left: 6px;
    bottom: 6px;
    padding: 2px 6px;
    border-radius: 6px;
    background-color: rgba(32, 33, 36, 0.78);
    color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .select-check {
    display: none;
    position: absolute;
    top: 7px;
    right: 7px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    background-color: rgba(32, 33, 36, 0.55);
    color: #ffffff;
    font-size: 12px;
    align-items: center;
    justify-content: center;
  }

  .multi-select-mode .select-check {
    display: inline-flex;
  }

  .media-tile.selected .select-check {
    background-color: var(--accent-color);
    color: var(--btn-text);
    border-color: var(--accent-color);
  }

  .status-toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    max-width: 92%;
    z-index: 50;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--btn-text);
    background-color: var(--accent-color);
    border-radius: 14px;
    padding: 10px 16px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    display: none;
  }

  .status-toast.show {
    display: block;
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Top Header -->
  <header class="top-bar">
    <div class="top-left">
      <a href="/reels.html" id="closeToReelsBtn" class="icon-btn" title="Back to Reels" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </a>
      <h1 class="page-title">Create reel</h1>
    </div>

    <div class="top-right">
      <a href="/profile.html" id="profileLinkBtn" class="icon-btn" title="Profile" aria-label="Profile">
        <i class="fa-regular fa-user"></i>
      </a>
      <button type="button" class="share-pill-btn" id="uploadBtn" title="Share / Upload Reel">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Share</span>
      </button>
    </div>
  </header>

  <!-- Caption & Factory Summary -->
  <div class="caption-box">
    <textarea id="reelCaptionInput" class="caption-input" placeholder="Write a caption for your reel..."></textarea>
    <div class="factory-meta-row">
      <span class="meta-badge" id="musicStatusBadge">
        <i class="fa-solid fa-music"></i>
        <span>No music selected</span>
      </span>
      <div style="display:flex;align-items:center;gap:8px;">
        <img id="coverPreviewThumb" class="cover-preview-thumb" alt="Cover">
        <span class="meta-badge" id="coverStatusBadge">
          <i class="fa-regular fa-image"></i>
          <span>Auto cover</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Direct Reels Upload with Moderation -->
  <div class="quick-upload-panel">
    <div class="quick-upload-row">
      <input type="file" id="reelsVideo" accept="video/*">
      <input type="text" id="reelsCaption" placeholder="Caption">
      <button type="button" class="quick-upload-btn" onclick="createReels()">Upload Reels</button>
    </div>
    <p id="reelsStatus"></p>
  </div>

  <!-- Horizontal Quick Tools (Reel Factory) -->
  <nav class="quick-tools-strip" aria-label="Reel creation tools">
    <button type="button" class="quick-tool-item" id="cameraToolBtn">
      <span class="quick-circle"><i class="fa-solid fa-video"></i></span>
      <span class="quick-label">Video Rec</span>
    </button>

    <button type="button" class="quick-tool-item" id="musicToolBtn">
      <span class="quick-circle"><i class="fa-solid fa-music"></i></span>
      <span class="quick-label">Music Add</span>
    </button>

    <button type="button" class="quick-tool-item" id="coverToolBtn">
      <span class="quick-circle"><i class="fa-regular fa-image"></i></span>
      <span class="quick-label">Cover Img</span>
    </button>

    <a href="/templates.html" class="quick-tool-item" id="templatesToolLink">
      <span class="quick-circle"><i class="fa-regular fa-square-plus"></i></span>
      <span class="quick-label">Templates</span>
    </a>

    <a href="/filters.html" class="quick-tool-item" id="filtersToolLink">
      <span class="quick-circle"><i class="fa-solid fa-sliders"></i></span>
      <span class="quick-label">Filters</span>
    </a>

    <a href="/draft.html" class="quick-tool-item" id="draftsToolLink">
      <span class="quick-circle"><i class="fa-regular fa-file-lines"></i></span>
      <span class="quick-label">Drafts</span>
    </a>
  </nav>

  <!-- Hidden inputs for Camera, Music, Cover, and Gallery uploads -->
  <input type="file" id="cameraCaptureInput" accept="video/*,image/*" capture="environment" hidden>
  <input type="file" id="musicFileInput" accept="audio/*,.mp3,.wav,.m4a,.aac" hidden>
  <input type="file" id="coverImageInput" accept="image/*" hidden>
  <input type="file" id="galleryUploadInput" accept="video/*,image/*" multiple hidden>

  <!-- Gallery & Select Multiple Row -->
  <div class="gallery-header">
    <button type="button" class="gallery-dropdown-btn" id="galleryPickerBtn">
      <span>Gallery</span>
      <i class="fa-solid fa-chevron-down" style="font-size: 13px;"></i>
    </button>

    <button type="button" class="select-multiple-btn" id="selectMultipleBtn">
      <i class="fa-regular fa-images"></i>
      <span>Select multiple</span>
    </button>
  </div>

  <!-- Media Grid -->
  <section class="media-grid" id="mediaGrid" aria-label="Gallery media">
    <div class="empty-gallery-box" id="emptyGalleryBox">
      <span class="empty-gallery-icon"><i class="fa-regular fa-images"></i></span>
      <h2 class="empty-gallery-title">No media selected yet</h2>
      <p class="empty-gallery-sub">Tap Gallery or Video Rec to add videos or photos.</p>
    </div>
  </section>

  <div class="status-toast" id="statusToast"></div>
</div>

<script>
  const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

  const supabaseClient = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  let reelSyncChannel = null;
  try {
    if ('BroadcastChannel' in window) {
      reelSyncChannel = new BroadcastChannel('autrobook_reels_sync');
    }
  } catch (_) {}

  let activeCurrentUser = null;
  let activeCurrentProfile = null;
  let activeSelectedAudioName = '';
  let activeSelectedCoverDataUrl = '';
  let activeSelectedCoverFile = null;

  function generateUuid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === 'x' ? r : ((r & 0x3) | 0x8);
      return v.toString(16);
    });
  }

  function clearDeletedFlagForReel(reelId) {
    const cleanId = String(reelId || '').trim();
    if (!cleanId) return;
    const keys = ['autro_deleted_reel_ids', 'deleted_reel_ids', 'autrobook_deleted_reels'];
    keys.forEach((k) => {
      try {
        const arr = JSON.parse(localStorage.getItem(k) || '[]');
        if (Array.isArray(arr)) {
          const next = arr.filter((v) => {
            const id = typeof v === 'string' || typeof v === 'number' ? String(v) : String(v?.id || v?.reel_id || '');
            return id.trim() !== cleanId;
          });
          localStorage.setItem(k, JSON.stringify(next));
        }
      } catch (_) {}
    });
  }

  async function resolveCurrentUserAndProfile() {
    if (!supabaseClient || !supabaseClient.auth) {
      return { user: null, profile: null };
    }

    try {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      let user = sessionData?.session?.user || null;

      if (!user && typeof supabaseClient.auth.getUser === 'function') {
        const { data: userData } = await supabaseClient.auth.getUser();
        user = userData?.user || null;
      }

      if (!user) {
        return { user: null, profile: null };
      }

      let profile = null;
      try {
        const { data: profData } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .maybeSingle();
        profile = profData || null;
      } catch (_) {}

      return { user, profile };
    } catch (_) {
      return { user: null, profile: null };
    }
  }

  function fileToDataUrl(file, maxBytes = 8 * 1024 * 1024) {
    return new Promise((resolve) => {
      if (!file) return resolve('');
      if (file.size > maxBytes) return resolve('');
      const reader = new FileReader();
      reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
    });
  }

  function buildReelsCardUrl(reelRecord) {
    const cardUrl = new URL('/reels-card.html', window.location.origin);
    cardUrl.searchParams.set('id', reelRecord.id);
    cardUrl.searchParams.set('reel', reelRecord.id);
    if (reelRecord.user_id) cardUrl.searchParams.set('user_id', reelRecord.user_id);
    if (reelRecord.author_name) cardUrl.searchParams.set('author', reelRecord.author_name);
    if (reelRecord.author_avatar) cardUrl.searchParams.set('avatar', reelRecord.author_avatar);
    if (reelRecord.media_url && !String(reelRecord.media_url).startsWith('blob:')) {
      cardUrl.searchParams.set('media', reelRecord.media_url);
    }
    if (reelRecord.media_type) cardUrl.searchParams.set('type', reelRecord.media_type);
    if (reelRecord.caption) cardUrl.searchParams.set('caption', reelRecord.caption);
    if (reelRecord.audio_name) cardUrl.searchParams.set('audio', reelRecord.audio_name);
    cardUrl.searchParams.set('from', '/create-reels.html');
    cardUrl.searchParams.set('reels_page', '/reels.html');
    cardUrl.searchParams.set('profile_page', `/profile.html?tab=reels${reelRecord.user_id ? `&user=${encodeURIComponent(reelRecord.user_id)}` : ''}`);
    cardUrl.searchParams.set('home_page', '/index.html?tab=reels');
    return cardUrl.toString();
  }

  function saveReelEverywhere(reelRecord, fallbackDataUrl = '') {
    clearDeletedFlagForReel(reelRecord.id);

    const resolvedMedia = (reelRecord.media_url && !String(reelRecord.media_url).startsWith('blob:'))
      ? reelRecord.media_url
      : (fallbackDataUrl || '');

    const portableRecord = {
      ...reelRecord,
      media_url: resolvedMedia,
      video_url: resolvedMedia,
      video: resolvedMedia,
      cover_url: activeSelectedCoverDataUrl || reelRecord.cover_url || '',
      music: reelRecord.audio_name || 'Original Audio',
      name: reelRecord.author_name || 'Autrobook User',
      likes: Number(reelRecord.likes ?? reelRecord.reaction_count ?? 0),
      time: 'Just now',
      destinations: ['/reels-card.html', '/reels.html', '/profile.html', '/index.html']
    };

    const feedAndCardKeys = [
      'reels',
      'autrobook_live_reels',
      'autrobook_reels_queue',
      'autro_reels',
      'autrobook_reels',
      'autro_instant_reels',
      'autrobook_reel_cards',
      'autro_instant_feed_posts',
      'autro_post_cards'
    ];

    const profileKeys = [
      'autrobook_profile_reels',
      'autro_profile_reels',
      'autrobook_user_reels',
      'autrobook_profile_posts',
      'autro_profile_posts'
    ];

    if (portableRecord.user_id) {
      profileKeys.push(`autrobook_profile_reels_${portableRecord.user_id}`);
      profileKeys.push(`autrobook_profile_posts_${portableRecord.user_id}`);
    }

    const writeList = (key, maxLen = 40) => {
      try {
        const existing = JSON.parse(localStorage.getItem(key) || '[]');
        const arr = Array.isArray(existing)
          ? existing.filter((x) => x && String(x.id) !== String(portableRecord.id))
          : [];
        arr.unshift(portableRecord);
        localStorage.setItem(key, JSON.stringify(arr.slice(0, maxLen)));
      } catch (e) {
        try {
          const slim = {
            id: portableRecord.id,
            user_id: portableRecord.user_id || '',
            author_name: portableRecord.author_name || 'Autrobook User',
            name: portableRecord.author_name || 'Autrobook User',
            author_avatar: portableRecord.author_avatar || '',
            caption: portableRecord.caption || '',
            is_reel: true,
            is_video: Boolean(portableRecord.is_video),
            media_type: portableRecord.media_type || 'video',
            media_url: String(portableRecord.media_url || '').startsWith('data:') ? '' : (portableRecord.media_url || ''),
            video_url: String(portableRecord.video_url || '').startsWith('data:') ? '' : (portableRecord.video_url || ''),
            video: String(portableRecord.video || '').startsWith('data:') ? '' : (portableRecord.video || ''),
            audio_name: portableRecord.audio_name || 'Original Audio',
            music: portableRecord.audio_name || 'Original Audio',
            ai_score: portableRecord.ai_score ?? null,
            badge: portableRecord.badge ?? null,
            likes: 0,
            reaction_count: 0,
            comment_count: 0,
            share_count: 0,
            view_count: 0,
            time: 'Just now',
            created_at: portableRecord.created_at
          };
          localStorage.setItem(key, JSON.stringify([slim]));
        } catch (__) {}
      }
    };

    [...feedAndCardKeys, ...profileKeys].forEach((k) => writeList(k, 40));

    try {
      localStorage.setItem('autro_new_reel_created', JSON.stringify(portableRecord));
      localStorage.setItem('autro_new_post_created', JSON.stringify(portableRecord));
      localStorage.setItem('autrobook_active_reel_card', JSON.stringify(portableRecord));
      sessionStorage.setItem('autrobook_active_reel_card', JSON.stringify(portableRecord));
      window.dispatchEvent(new CustomEvent('autrobook:reel-created', { detail: portableRecord }));
    } catch (e) {}

    try {
      if (reelSyncChannel) {
        reelSyncChannel.postMessage({
          type: 'NEW_REEL_CREATED',
          reel: portableRecord,
          reelId: portableRecord.id,
          targets: ['/reels-card.html', '/reels.html', '/profile.html', '/index.html']
        });
      }
    } catch (_) {}
  }

  async function persistReelToBackend(reelRecord, rawFile) {
    const userId = activeCurrentUser?.id || localStorage.getItem('autro_user_id') || '';
    const authorName = String(
      activeCurrentProfile?.full_name ||
      activeCurrentProfile?.name ||
      activeCurrentUser?.user_metadata?.full_name ||
      localStorage.getItem('autro_profile_name') ||
      'Autrobook User'
    ).trim();
    const authorAvatar = String(
      activeCurrentProfile?.avatar_url ||
      localStorage.getItem('autro_profile_avatar') ||
      ''
    ).trim();

    reelRecord.user_id = userId;
    reelRecord.author_name = authorName;
    reelRecord.author_avatar = authorAvatar;

    const dataUrlBackup = rawFile ? await fileToDataUrl(rawFile, 8 * 1024 * 1024) : '';

    if (supabaseClient && rawFile && userId) {
      try {
        const ext = (rawFile.name && rawFile.name.split('.').pop()) || (reelRecord.is_video ? 'mp4' : 'jpg');
        const filePath = `${userId}/${reelRecord.id}.${ext}`;
        const { error: upErr } = await supabaseClient.storage
          .from('reels')
          .upload(filePath, rawFile, { upsert: true });
        if (!upErr) {
          const { data: pubData } = supabaseClient.storage.from('reels').getPublicUrl(filePath);
          if (pubData?.publicUrl) {
            reelRecord.media_url = pubData.publicUrl;
            reelRecord.video_url = pubData.publicUrl;
          }
        }
      } catch (e) {}
    }

    if (supabaseClient && activeSelectedCoverFile && userId) {
      try {
        const cExt = (activeSelectedCoverFile.name && activeSelectedCoverFile.name.split('.').pop()) || 'jpg';
        const coverPath = `${userId}/covers/${reelRecord.id}.${cExt}`;
        const { error: cErr } = await supabaseClient.storage
          .from('reels')
          .upload(coverPath, activeSelectedCoverFile, { upsert: true });
        if (!cErr) {
          const { data: cPub } = supabaseClient.storage.from('reels').getPublicUrl(coverPath);
          if (cPub?.publicUrl) {
            reelRecord.cover_url = cPub.publicUrl;
          }
        }
      } catch (e) {}
    }

    const finalMediaForDb = (reelRecord.media_url && !String(reelRecord.media_url).startsWith('blob:'))
      ? reelRecord.media_url
      : dataUrlBackup;

    if (supabaseClient && userId) {
      try {
        await supabaseClient.from('reels').insert({
          id: reelRecord.id,
          user_id: userId,
          author_name: authorName,
          author_avatar: authorAvatar,
          caption: reelRecord.caption,
          media_url: finalMediaForDb,
          media_type: reelRecord.media_type,
          audio_name: reelRecord.audio_name || 'Original Audio',
          ai_score: reelRecord.ai_score ?? null,
          badge: reelRecord.badge ?? null,
          audience: 'public',
          created_at: reelRecord.created_at
        });
      } catch (e) {}

      try {
        await supabaseClient.from('posts').insert({
          id: reelRecord.id,
          user_id: userId,
          author_name: authorName,
          author_avatar: authorAvatar,
          caption: reelRecord.caption,
          is_reel: true,
          media_url: finalMediaForDb,
          media_type: reelRecord.media_type,
          ai_score: reelRecord.ai_score ?? null,
          badge: reelRecord.badge ?? null,
          audience: 'public',
          created_at: reelRecord.created_at
        });
      } catch (e) {}
    }

    saveReelEverywhere(reelRecord, dataUrlBackup);
    return reelRecord;
  }

  async function createReels() {
    const videoInput = document.getElementById('reelsVideo') || document.getElementById('reelVideo');
    const captionEl = document.getElementById('reelsCaption');
    const statusEl = document.getElementById('reelsStatus') || document.getElementById('reelStatus');
    const videoFile = videoInput && videoInput.files ? videoInput.files[0] : null;
    const captionText = captionEl ? captionEl.value.trim() : '';

    if (!videoFile && !captionText) {
      if (statusEl) statusEl.innerText = 'Please select a video or enter a caption.';
      return;
    }

    if (statusEl) statusEl.innerText = 'Checking content with moderation...';

    const formData = new FormData();
    if (videoFile) {
      formData.append('video', videoFile);
    }
    formData.append('text', captionText);

    try {
      const res = await fetch('/api/moderate', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.action === 'suspend') {
        if (statusEl) statusEl.innerText = 'Blocked: ' + data.message;
        return;
      }

      const blobUrl = videoFile ? URL.createObjectURL(videoFile) : '';
      const reelRecord = {
        id: generateUuid(),
        media_url: blobUrl,
        video_url: blobUrl,
        cover_url: activeSelectedCoverDataUrl || '',
        media_type: 'video',
        is_video: true,
        caption: captionText || (videoFile && videoFile.name) || 'New Reel',
        audio_name: activeSelectedAudioName || 'Original Audio',
        ai_score: data.ai_score ?? null,
        badge: data.badge ?? null,
        is_reel: true,
        card_page: 'reels-card.html',
        likes: 0,
        reaction_count: 0,
        comment_count: 0,
        share_count: 0,
        view_count: 0,
        created_at: new Date().toISOString()
      };

      const savedRecord = await persistReelToBackend(reelRecord, videoFile);
      if (statusEl) {
        statusEl.innerText = `Uploaded! AI Score: ${data.ai_score ?? 'N/A'} | Badge: ${data.badge ?? 'None'}`;
      }

      const cardRedirectUrl = buildReelsCardUrl(savedRecord);
      setTimeout(() => {
        window.location.href = cardRedirectUrl;
      }, 300);
    } catch (err) {
      if (statusEl) statusEl.innerText = 'Upload failed: ' + (err && err.message ? err.message : 'Network error');
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const closeToReelsBtn = document.getElementById('closeToReelsBtn');
    const profileLinkBtn = document.getElementById('profileLinkBtn');
    const cameraToolBtn = document.getElementById('cameraToolBtn');
    const musicToolBtn = document.getElementById('musicToolBtn');
    const coverToolBtn = document.getElementById('coverToolBtn');
    const draftsToolLink = document.getElementById('draftsToolLink');
    const uploadBtn = document.getElementById('uploadBtn');
    const reelCaptionInput = document.getElementById('reelCaptionInput');

    const musicStatusBadge = document.getElementById('musicStatusBadge');
    const coverStatusBadge = document.getElementById('coverStatusBadge');
    const coverPreviewThumb = document.getElementById('coverPreviewThumb');

    const cameraCaptureInput = document.getElementById('cameraCaptureInput');
    const musicFileInput = document.getElementById('musicFileInput');
    const coverImageInput = document.getElementById('coverImageInput');
    const galleryUploadInput = document.getElementById('galleryUploadInput');
    const galleryPickerBtn = document.getElementById('galleryPickerBtn');
    const selectMultipleBtn = document.getElementById('selectMultipleBtn');
    const mediaGrid = document.getElementById('mediaGrid');
    const statusToast = document.getElementById('statusToast');

    const params = new URLSearchParams(window.location.search);
    const returnToParam = params.get('return_to') || '/reels.html';

    let isMultiSelect = false;
    let activeTile = null;
    const filesByUrl = new Map();

    // Check active Supabase session without /auth.js
    const authResult = await resolveCurrentUserAndProfile();
    if (!authResult || !authResult.user) {
      window.location.replace('/login.html');
      return;
    }

    activeCurrentUser = authResult.user;
    activeCurrentProfile = authResult.profile || null;

    if (profileLinkBtn && activeCurrentUser?.id) {
      profileLinkBtn.href = `/profile.html?tab=reels&user=${encodeURIComponent(activeCurrentUser.id)}`;
    }

    try {
      localStorage.setItem('autro_user_id', activeCurrentUser.id);
      const resolvedName = String(
        activeCurrentProfile?.full_name ||
        activeCurrentProfile?.name ||
        activeCurrentUser.user_metadata?.full_name ||
        activeCurrentUser.user_metadata?.name ||
        ''
      ).trim();
      if (resolvedName) {
        localStorage.setItem('autro_profile_name', resolvedName);
      }
      if (activeCurrentProfile?.avatar_url) {
        localStorage.setItem('autro_profile_avatar', activeCurrentProfile.avatar_url);
      }
    } catch (e) {}

    if (closeToReelsBtn) {
      closeToReelsBtn.href = returnToParam;
      closeToReelsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = returnToParam;
      });
    }

    function notify(msg) {
      statusToast.textContent = msg;
      statusToast.classList.add('show');
      clearTimeout(notify._t);
      notify._t = setTimeout(() => {
        statusToast.classList.remove('show');
      }, 2600);
    }

    function updateMetaBadges() {
      if (musicStatusBadge) {
        musicStatusBadge.innerHTML = `<i class="fa-solid fa-music"></i><span>${activeSelectedAudioName || 'No music selected'}</span>`;
      }
      if (coverStatusBadge) {
        coverStatusBadge.innerHTML = `<i class="fa-regular fa-image"></i><span>${activeSelectedCoverDataUrl ? 'Custom cover' : 'Auto cover'}</span>`;
      }
      if (coverPreviewThumb) {
        if (activeSelectedCoverDataUrl) {
          coverPreviewThumb.src = activeSelectedCoverDataUrl;
          coverPreviewThumb.classList.add('visible');
        } else {
          coverPreviewThumb.removeAttribute('src');
          coverPreviewThumb.classList.remove('visible');
        }
      }
    }

    function syncEmptyState() {
      const hasTiles = mediaGrid.querySelectorAll('.media-tile').length > 0;
      const emptyBox = document.getElementById('emptyGalleryBox');
      if (emptyBox) {
        emptyBox.style.display = hasTiles ? 'none' : 'flex';
      }
    }

    function setActiveTile(tile) {
      mediaGrid.querySelectorAll('.media-tile').forEach((t) => t.classList.remove('active-pick'));
      activeTile = tile;
      if (activeTile) {
        activeTile.classList.add('active-pick');
      }
    }

    function bindTileClick(tile) {
      tile.addEventListener('click', () => {
        setActiveTile(tile);
        if (isMultiSelect) {
          tile.classList.toggle('selected');
        } else {
          notify(`Selected: ${tile.getAttribute('data-title') || 'Media'}`);
        }
      });
    }

    function addMediaTile(file, badgeText) {
      const blobUrl = URL.createObjectURL(file);
      filesByUrl.set(blobUrl, file);
      const isVideo = file.type.startsWith('video/');
      const tileId = generateUuid();
      const tile = document.createElement('div');
      tile.className = 'media-tile';
      tile.setAttribute('data-id', tileId);
      tile.setAttribute('data-src', blobUrl);
      tile.setAttribute('data-type', isVideo ? 'video' : 'image');
      tile.setAttribute('data-title', file.name);
      tile.innerHTML = isVideo
        ? `<video src="${blobUrl}" muted playsinline preload="metadata"></video><span class="media-badge"><i class="fa-solid fa-video"></i> ${badgeText}</span><span class="select-check"><i class="fa-solid fa-check"></i></span>`
        : `<img src="${blobUrl}" alt="${file.name}"><span class="media-badge"><i class="fa-regular fa-image"></i> ${badgeText}</span><span class="select-check"><i class="fa-solid fa-check"></i></span>`;
      bindTileClick(tile);
      mediaGrid.prepend(tile);
      setActiveTile(tile);
      syncEmptyState();
    }

    uploadBtn.addEventListener('click', async () => {
      const chosenTile = activeTile || mediaGrid.querySelector('.media-tile.selected') || mediaGrid.querySelector('.media-tile');
      const captionText = reelCaptionInput.value.trim();

      if (!chosenTile && !captionText) {
        notify('Select a video/photo or write a caption first.');
        return;
      }

      uploadBtn.disabled = true;
      notify('Sharing reel to reels-card.html...');

      const blobSrc = chosenTile ? (chosenTile.getAttribute('data-src') || '') : '';
      const mediaType = chosenTile ? (chosenTile.getAttribute('data-type') || 'video') : 'video';
      const rawFile = blobSrc ? filesByUrl.get(blobSrc) : null;

      const reelRecord = {
        id: generateUuid(),
        media_url: blobSrc,
        video_url: blobSrc,
        cover_url: activeSelectedCoverDataUrl || '',
        media_type: mediaType,
        is_video: mediaType === 'video',
        caption: captionText || (chosenTile && chosenTile.getAttribute('data-title')) || 'New Reel',
        audio_name: activeSelectedAudioName || 'Original Audio',
        is_reel: true,
        card_page: 'reels-card.html',
        likes: 0,
        reaction_count: 0,
        comment_count: 0,
        share_count: 0,
        view_count: 0,
        created_at: new Date().toISOString()
      };

      const savedRecord = await persistReelToBackend(reelRecord, rawFile);
      const cardRedirectUrl = buildReelsCardUrl(savedRecord);

      notify('Reel ready! Opening reel card...');
      setTimeout(() => {
        window.location.href = cardRedirectUrl;
      }, 280);
    });

    const emptyGalleryBox = document.getElementById('emptyGalleryBox');
    if (emptyGalleryBox) {
      emptyGalleryBox.addEventListener('click', () => {
        galleryUploadInput.click();
      });
    }

    cameraToolBtn.addEventListener('click', () => {
      cameraCaptureInput.click();
    });

    cameraCaptureInput.addEventListener('change', () => {
      const file = cameraCaptureInput.files && cameraCaptureInput.files[0];
      if (!file) return;
      addMediaTile(file, 'Rec');
      notify(`Recorded: ${file.name}`);
    });

    musicToolBtn.addEventListener('click', () => {
      musicFileInput.click();
    });

    musicFileInput.addEventListener('change', () => {
      const file = musicFileInput.files && musicFileInput.files[0];
      if (!file) return;
      activeSelectedAudioName = file.name;
      updateMetaBadges();
      notify(`Music added: ${file.name}`);
    });

    coverToolBtn.addEventListener('click', () => {
      coverImageInput.click();
    });

    coverImageInput.addEventListener('change', async () => {
      const file = coverImageInput.files && coverImageInput.files[0];
      if (!file) return;
      activeSelectedCoverFile = file;
      activeSelectedCoverDataUrl = await fileToDataUrl(file, 4 * 1024 * 1024);
      updateMetaBadges();
      notify(`Cover selected: ${file.name}`);
    });

    galleryPickerBtn.addEventListener('click', () => {
      galleryUploadInput.click();
    });

    galleryUploadInput.addEventListener('change', () => {
      const files = Array.from(galleryUploadInput.files || []);
      if (!files.length) return;
      files.forEach((file) => {
        addMediaTile(file, file.type.startsWith('video/') ? 'Reel' : 'Photo');
      });
      notify(`${files.length} item(s) added to Gallery.`);
    });

    selectMultipleBtn.addEventListener('click', () => {
      isMultiSelect = !isMultiSelect;
      selectMultipleBtn.classList.toggle('active', isMultiSelect);
      mediaGrid.classList.toggle('multi-select-mode', isMultiSelect);
      if (!isMultiSelect) {
        mediaGrid.querySelectorAll('.media-tile.selected').forEach((t) => t.classList.remove('selected'));
      }
      notify(isMultiSelect ? 'Select multiple enabled.' : 'Select multiple off.');
    });

    if (draftsToolLink) {
      draftsToolLink.addEventListener('click', (e) => {
        e.preventDefault();
        const selectedItems = Array.from(mediaGrid.querySelectorAll('.media-tile.selected')).map((el) => ({
          src: el.getAttribute('data-src'),
          type: el.getAttribute('data-type'),
          title: el.getAttribute('data-title')
        }));

        const hasDraftData = selectedItems.length > 0 || Boolean(activeSelectedAudioName) || Boolean(reelCaptionInput.value.trim()) || Boolean(activeSelectedCoverDataUrl);
        if (hasDraftData) {
          const newDraft = {
            id: 'draft_' + Date.now(),
            caption: reelCaptionInput.value.trim(),
            audio: activeSelectedAudioName,
            cover: activeSelectedCoverDataUrl,
            selectedCount: selectedItems.length,
            items: selectedItems,
            savedAt: new Date().toLocaleString()
          };
          try {
            const existing = JSON.parse(localStorage.getItem('autrobook_drafts') || '[]');
            existing.unshift(newDraft);
            localStorage.setItem('autrobook_drafts', JSON.stringify(existing));
          } catch (err) {}
          notify('Draft saved! Opening drafts...');
          setTimeout(() => {
            window.location.href = '/draft.html';
          }, 350);
        } else {
          window.location.href = '/draft.html';
        }
      });
    }

    updateMetaBadges();
  });
</script>
