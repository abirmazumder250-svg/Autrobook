<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Post</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #FFFFFF;
      --bg-surface: #FFFFFF;
      --bg-card: #f8f9fa;
      --bg-chip: #f1f3f4;
      --bg-chip-hover: #e8eaed;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --border-color: #dadce0;
      --accent-invert-bg: #202124;
      --accent-invert-fg: #FFFFFF;
      --shadow: 0 2px 10px rgba(32, 33, 36, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #202124;
        --bg-surface: #202124;
        --bg-card: #292a2d;
        --bg-chip: #292a2d;
        --bg-chip-hover: #3c4043;
        --text-primary: #FFFFFF;
        --text-secondary: #9aa0a6;
        --border-color: #3c4043;
        --accent-invert-bg: #FFFFFF;
        --accent-invert-fg: #202124;
        --shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 105px;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .composer-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .header-nav-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .header-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-chip);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .header-close-btn:hover {
      background: var(--bg-chip-hover);
    }

    .header-close-btn:active {
      transform: scale(0.95);
    }

    .header-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
      min-width: 0;
      min-height: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-done-btn {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.18s ease, transform 0.14s ease;
    }

    .header-done-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .header-done-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .header-done-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* MAIN CONTAINER */
    .composer-body {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    /* PROFILE ROW */
    .author-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .author-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .author-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      min-height: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audience-select {
      width: fit-content;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* CHIPS + 'B' ROW */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 14px;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .action-chip:hover {
      background: var(--bg-chip-hover);
    }

    .action-chip.active {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border-color: var(--accent-invert-bg);
    }

    .action-chip i {
      font-size: 13px;
    }

    .bold-chip-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .bold-chip-btn:hover {
      background: var(--bg-chip-hover);
    }

    .bold-chip-btn.active {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border-color: var(--accent-invert-bg);
    }

    /* EDITOR CARD */
    .editor-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .caption-field {
      width: 100%;
      min-height: 140px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 18px;
      line-height: 1.48;
      resize: none;
      outline: none;
    }

    .caption-field::placeholder {
      color: var(--text-secondary);
      opacity: 0.85;
    }

    .caption-field.is-bold {
      font-weight: 700;
    }

    .meta-badges-box {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .meta-badges-box.show {
      display: flex;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
    }

    .meta-pill button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      padding: 0 2px;
    }

    /* PREVIEW BOX */
    .preview-box {
      display: none;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .preview-box.active {
      display: block;
    }

    .preview-box img,
    .preview-box video {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      display: block;
      background: var(--bg-page);
    }

    .remove-preview-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* PROGRESS */
    .progress-box {
      display: none;
      margin-bottom: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .progress-box.active {
      display: block;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--bg-chip);
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-invert-bg);
      transition: width 0.25s ease;
    }

    /* BOTTOM SINGLE GALLERY BAR */
    .bottom-gallery-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      z-index: 60;
      pointer-events: none;
    }

    .gallery-only-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: opacity 0.18s ease, transform 0.14s ease;
    }

    .gallery-only-btn:hover {
      opacity: 0.9;
    }

    .gallery-only-btn:active {
      transform: scale(0.96);
    }

    /* FEELINGS MODAL */
    .feeling-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      z-index: 120;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .feeling-modal-backdrop.open {
      display: flex;
    }

    .feeling-modal-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 78vh;
      background: var(--bg-surface);
      color: var(--text-primary);
      border-top: 1px solid var(--border-color);
      border-radius: 22px 22px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .feeling-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feeling-modal-title {
      font-size: 16.5px;
      font-weight: 800;
    }

    .feeling-close-btn {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 6px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .feeling-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      overflow-y: auto;
      padding-bottom: 8px;
    }

    .feeling-option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .feeling-option-btn:hover,
    .feeling-option-btn.selected {
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border-color: var(--accent-invert-bg);
    }

    .feeling-emoji {
      font-size: 19px;
      line-height: 1;
    }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-invert-bg);
      color: var(--accent-invert-fg);
      border: 1px solid var(--border-color);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 200;
      display: none;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="composer-header">
    <div class="header-nav-group">
      <a href="/public/index.html" class="header-close-btn" title="Close" aria-label="Close">
        <i class="fas fa-xmark"></i>
      </a>
    </div>

    <div id="headerUserName" class="header-title"></div>
    <button type="button" id="doneBtn" class="header-done-btn" onclick="handleDonePost()">Done</button>
  </header>

  <main class="composer-body">
    <!-- PROFILE ROW -->
    <div class="author-line">
      <div id="profileAvatarBox" class="author-avatar"></div>
      <div class="author-info">
        <div id="profileNameBox" class="author-name"></div>
        <select id="postAudience" class="audience-select" aria-label="Audience">
          <option value="public">Public</option>
          <option value="followers">Followers</option>
          <option value="only_me">Only Me</option>
        </select>
      </div>
    </div>

    <!-- ACTION CHIPS + 'B' RIGHT BESIDE FEELINGS -->
    <div class="chips-row">
      <button type="button" id="musicChipBtn" class="action-chip" onclick="openPhoneMusicFiles()">
        <i class="fas fa-music"></i>
        <span id="musicChipLabel">Music</span>
      </button>

      <button type="button" id="peopleChipBtn" class="action-chip" onclick="openPeopleFriendsPage()">
        <i class="fas fa-user-group"></i>
        <span id="peopleChipLabel">People</span>
      </button>

      <button type="button" id="locationChipBtn" class="action-chip" onclick="fetchLiveLocation()">
        <i class="fas fa-location-dot"></i>
        <span id="locationChipLabel">Location</span>
      </button>

      <button type="button" id="feelingsChipBtn" class="action-chip" onclick="openFeelingsModal()">
        <i class="far fa-face-smile"></i>
        <span id="feelingsChipLabel">Feelings</span>
      </button>

      <button type="button" id="boldBtn" class="bold-chip-btn" onclick="toggleCaptionBold()" title="Bold">
        B
      </button>
    </div>

    <!-- CAPTION EDITOR CARD -->
    <section class="editor-card">
      <textarea
        id="captionInput"
        class="caption-field"
        maxlength="2000"
        placeholder="What's on your mind?"
      ></textarea>
      <div id="metaBadgesBox" class="meta-badges-box"></div>
    </section>

    <!-- UPLOAD PROGRESS -->
    <div id="progressBox" class="progress-box">
      <div id="progressText" style="font-size:12.5px;color:var(--text-secondary);">Publishing...</div>
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- MEDIA PREVIEW -->
    <div id="previewBox" class="preview-box">
      <button type="button" class="remove-preview-btn" onclick="clearGalleryMedia()" title="Remove">
        <i class="fas fa-xmark"></i>
      </button>
      <div id="previewContent"></div>
    </div>
  </main>

  <!-- BOTTOM SINGLE GALLERY OPTION -->
  <div class="bottom-gallery-wrap">
    <button type="button" class="gallery-only-btn" onclick="openPhoneGallery()">
      <i class="far fa-images"></i>
      <span>Gallery</span>
    </button>
  </div>

  <!-- HIDDEN FILE INPUTS -->
  <input type="file" id="phoneGalleryInput" accept="image/*,video/*" style="display:none;" onchange="handleGalleryPicked(event)">
  <input type="file" id="phoneMusicInput" accept="audio/*" style="display:none;" onchange="handleMusicPicked(event)">

  <!-- FEELINGS MODAL (16 Emotions in English) -->
  <div id="feelingsModalBackdrop" class="feeling-modal-backdrop" onclick="closeFeelingsModal(event)">
    <div class="feeling-modal-sheet" onclick="event.stopPropagation()">
      <div class="feeling-modal-header">
        <span class="feeling-modal-title">How are you feeling?</span>
        <button type="button" class="feeling-close-btn" onclick="closeFeelingsModal()">Close</button>
      </div>
      <div id="feelingsGrid" class="feeling-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    try {
      if (window.AutroAuth && window.AutroAuth.supabase) {
        sb = window.AutroAuth.supabase;
      } else if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    let postSyncChannel = null;
    try {
      if ('BroadcastChannel' in window) {
        postSyncChannel = new BroadcastChannel('autrobook_posts_sync');
      }
    } catch (_) {}

    const EMOTIONS_LIST = [
      { label: 'Sad', emoji: '😢' },
      { label: 'Enjoyful', emoji: '😍' },
      { label: 'Alas', emoji: '😰' },
      { label: 'Angry', emoji: '😠' },
      { label: 'Cry', emoji: '😭' },
      { label: 'Funny', emoji: '😂' },
      { label: 'Happy', emoji: '😊' },
      { label: 'Excited', emoji: '🤩' },
      { label: 'Loved', emoji: '🥰' },
      { label: 'Blessed', emoji: '🙏' },
      { label: 'Tired', emoji: '😴' },
      { label: 'Confused', emoji: '🤔' },
      { label: 'Cool', emoji: '😎' },
      { label: 'Grateful', emoji: '🤗' },
      { label: 'Surprised', emoji: '😮' },
      { label: 'Motivated', emoji: '💪' }
    ];

    const CACHE_KEYS = [
      'autro_instant_feed_posts',
      'autro_post_cards',
      'autro_profile_posts'
    ];

    let currentUser = null;
    let currentProfile = null;
    let galleryFile = null;
    let galleryMediaType = null;
    let galleryDataUrl = '';
    let musicFile = null;
    let selectedMusicName = '';
    let selectedPeople = '';
    let selectedLocation = '';
    let selectedFeeling = null;
    let isBoldText = false;

    function pruneHeavyLocalKeys() {
      const heavyCandidates = [
        'autro_instant_feed_posts',
        'autro_post_cards',
        'autro_profile_posts',
        'autro_comments_store',
        'autro_saved_items',
        'autro_reports_log'
      ];
      for (const k of heavyCandidates) {
        try {
          const val = localStorage.getItem(k);
          if (val && val.length > 220000) {
            localStorage.removeItem(k);
          }
        } catch (_) {}
      }
    }

    function safeLocalStorageSet(key, valueStr) {
      const cleanStr = String(valueStr || '');
      if (!cleanStr) return false;
      try {
        localStorage.setItem(key, cleanStr);
        return true;
      } catch (_) {
        pruneHeavyLocalKeys();
        for (const k of CACHE_KEYS) {
          if (k !== key) {
            try { localStorage.removeItem(k); } catch (_) {}
          }
        }
        try {
          localStorage.setItem(key, cleanStr);
          return true;
        } catch (_) {
          return false;
        }
      }
    }

    function sanitizePostForCache(post) {
      const item = { ...post };
      const stripVolatileUrl = (u) => {
        if (typeof u !== 'string') return '';
        if (u.startsWith('blob:')) return '';
        if (u.startsWith('data:video/') || u.startsWith('data:audio/') || u.length > 150000) return '';
        return u;
      };
      item.media_url = stripVolatileUrl(item.media_url);
      item.music_url = stripVolatileUrl(item.music_url);
      item.poster_url = stripVolatileUrl(item.poster_url);
      item.avatar = stripVolatileUrl(item.avatar);
      if (typeof item.caption === 'string' && item.caption.length > 1000) {
        item.caption = item.caption.slice(0, 1000);
      }
      return item;
    }

    function appendPostToLocalCache(storageKey, newPost, maxItems = 12) {
      try {
        let list = [];
        try {
          const raw = localStorage.getItem(storageKey);
          const parsed = raw ? JSON.parse(raw) : [];
          if (Array.isArray(parsed)) list = parsed;
        } catch (_) {
          list = [];
        }
        const safePost = sanitizePostForCache(newPost);
        const deduped = [safePost, ...list.filter(p => p && String(p.id) !== String(safePost.id)).map(sanitizePostForCache)].slice(0, maxItems);
        safeLocalStorageSet(storageKey, JSON.stringify(deduped));
      } catch (_) {}
    }

    function broadcastNewPost(postObj) {
      try {
        sessionStorage.setItem('autro_latest_created_post', JSON.stringify(postObj));
      } catch (_) {}

      try {
        if (postSyncChannel) {
          postSyncChannel.postMessage({
            type: 'NEW_POST_CARD',
            targets: ['/public/index.html', '/public/profile.html'],
            post: postObj
          });
        }
      } catch (_) {}

      try {
        window.dispatchEvent(new CustomEvent('autro:post-created', {
          detail: {
            post: postObj,
            targets: ['/public/index.html', '/public/profile.html']
          }
        }));
      } catch (_) {}
    }

    function resolveReturnUrl() {
      const params = new URLSearchParams(window.location.search);
      const fromParam = (params.get('from') || '').toLowerCase().trim();
      let storedTarget = '';
      try {
        storedTarget = String(sessionStorage.getItem('autro_post_return_target') || '').trim();
        sessionStorage.removeItem('autro_post_return_target');
      } catch (_) {}

      if (fromParam === 'profile' || storedTarget.includes('profile.html')) {
        return '/public/profile.html';
      }
      if (storedTarget.startsWith('/')) {
        return storedTarget;
      }
      return '/public/index.html';
    }

    function captureOriginFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const fromParam = (params.get('from') || '').toLowerCase().trim();
      if (fromParam === 'profile') {
        try { sessionStorage.setItem('autro_post_return_target', '/public/profile.html'); } catch (_) {}
      } else if (fromParam === 'feed' || fromParam === 'index') {
        try { sessionStorage.setItem('autro_post_return_target', '/public/index.html'); } catch (_) {}
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._cpToastTimer);
      window._cpToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
    }

    function resolveMediaUrl(url) {
      const raw = String(url || '').trim();
      if (!raw) return '';
      if (raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('data:') || raw.startsWith('blob:')) {
        return raw;
      }
      if (sb) {
        const cleanPath = raw.replace(/^\/+/, '');
        if (cleanPath.startsWith('avatars/')) {
          return sb.storage.from('avatars').getPublicUrl(cleanPath.replace(/^avatars\//, '')).data.publicUrl || '';
        }
        return sb.storage.from('media').getPublicUrl(cleanPath).data.publicUrl || '';
      }
      return '';
    }

    function applyAccountIdentity(name, avatarUrl, userId = null) {
      const savedName = String(name || '').trim();
      const safeAvatar = resolveMediaUrl(avatarUrl || '');

      currentProfile = {
        id: userId || currentUser?.id || null,
        full_name: savedName,
        avatar_url: safeAvatar
      };

      document.getElementById('headerUserName').textContent = savedName || 'Create Post';
      document.getElementById('profileNameBox').textContent = savedName;
      document.title = savedName ? `${savedName} - Create Post` : 'Create Post';

      const avatarBox = document.getElementById('profileAvatarBox');
      avatarBox.innerHTML = '';
      if (safeAvatar) {
        const img = document.createElement('img');
        img.src = safeAvatar;
        img.alt = savedName;
        img.onerror = () => {
          img.remove();
        };
        avatarBox.appendChild(img);
      }
    }

    async function loadSupabaseAccount() {
      applyAccountIdentity('', '', null);

      if (window.AutroAuth && typeof window.AutroAuth.checkSessionAndProfile === 'function') {
        const authResult = await window.AutroAuth.checkSessionAndProfile({ requireCompleteProfile: true });
        if (!authResult) return false;
        currentUser = authResult.user;
      }

      if (!sb) return true;

      try {
        if (!currentUser) {
          const { data: { session } } = await sb.auth.getSession();
          currentUser = session?.user || null;
        }

        if (currentUser) {
          const { data: prof } = await sb
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .maybeSingle();

          const meta = currentUser.user_metadata || {};
          const savedName =
            prof?.full_name ||
            prof?.name ||
            prof?.display_name ||
            prof?.username ||
            meta.full_name ||
            meta.name ||
            meta.display_name ||
            '';

          const savedAvatar =
            prof?.avatar_url ||
            prof?.avatar ||
            prof?.photo_url ||
            meta.avatar_url ||
            meta.avatar ||
            meta.picture ||
            '';

          applyAccountIdentity(savedName, savedAvatar, currentUser.id);
        }
      } catch (_) {
        applyAccountIdentity('', '', currentUser?.id || null);
      }

      return true;
    }

    function subscribeRealtimeProfileIdentity() {
      if (!sb || typeof sb.channel !== 'function') return;
      try {
        sb.channel('public:create_post_profile_sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, (payload) => {
            const row = payload?.new || {};
            const targetId = currentUser?.id || currentProfile?.id;
            if (!targetId || String(row.id || '') === String(targetId)) {
              loadSupabaseAccount();
            }
          })
          .subscribe();
      } catch (_) {}
    }

    // 1. Phone Gallery
    function openPhoneGallery() {
      document.getElementById('phoneGalleryInput').click();
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith('image/')) return resolve('');
        if (file.size > 140000) return resolve('');
        const reader = new FileReader();
        reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    async function handleGalleryPicked(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      galleryFile = file;
      galleryMediaType = file.type.startsWith('video/') ? 'video' : 'image';
      galleryDataUrl = galleryMediaType === 'image' ? await readFileAsDataUrl(file) : '';

      const url = URL.createObjectURL(file);
      const box = document.getElementById('previewBox');
      const content = document.getElementById('previewContent');
      content.innerHTML = galleryMediaType === 'video'
        ? `<video src="${url}" controls playsinline></video>`
        : `<img src="${url}" alt="Gallery media">`;
      box.classList.add('active');
    }

    function clearGalleryMedia() {
      galleryFile = null;
      galleryMediaType = null;
      galleryDataUrl = '';
      document.getElementById('phoneGalleryInput').value = '';
      document.getElementById('previewContent').innerHTML = '';
      document.getElementById('previewBox').classList.remove('active');
    }

    // 2. Music -> Phone Files
    function openPhoneMusicFiles() {
      document.getElementById('phoneMusicInput').click();
    }

    function handleMusicPicked(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      musicFile = file;
      selectedMusicName = file.name.replace(/\.[^/.]+$/, '');
      document.getElementById('musicChipBtn').classList.add('active');
      document.getElementById('musicChipLabel').textContent = selectedMusicName;
      renderMetaBadges();
      showToast(`Music selected: ${selectedMusicName}`);
    }

    // 3. People -> id-friends.html
    function openPeopleFriendsPage() {
      const draft = {
        caption: document.getElementById('captionInput').value,
        audience: document.getElementById('postAudience').value,
        musicName: selectedMusicName,
        location: selectedLocation,
        feeling: selectedFeeling,
        people: selectedPeople,
        bold: isBoldText
      };
      try {
        sessionStorage.setItem('autro_create_post_draft', JSON.stringify(draft));
      } catch (_) {}
      window.location.href = 'id-friends.html?from=create-post';
    }

    function restoreDraftAndFriends() {
      try {
        const raw = sessionStorage.getItem('autro_create_post_draft');
        if (raw) {
          const d = JSON.parse(raw);
          sessionStorage.removeItem('autro_create_post_draft');
          if (d.caption) document.getElementById('captionInput').value = d.caption;
          if (d.audience) document.getElementById('postAudience').value = d.audience;
          if (d.bold) {
            isBoldText = true;
            document.getElementById('captionInput').classList.add('is-bold');
            document.getElementById('boldBtn').classList.add('active');
          }
          if (d.musicName) {
            selectedMusicName = d.musicName;
            document.getElementById('musicChipBtn').classList.add('active');
            document.getElementById('musicChipLabel').textContent = selectedMusicName;
          }
          if (d.location) {
            selectedLocation = d.location;
            document.getElementById('locationChipBtn').classList.add('active');
            document.getElementById('locationChipLabel').textContent = selectedLocation;
          }
          if (d.feeling) {
            selectedFeeling = d.feeling;
            document.getElementById('feelingsChipBtn').classList.add('active');
            document.getElementById('feelingsChipLabel').textContent = `${selectedFeeling.label} ${selectedFeeling.emoji}`;
          }
          if (d.people) {
            selectedPeople = d.people;
          }
        }

        const pickedFriends = sessionStorage.getItem('autro_selected_friends');
        if (pickedFriends) {
          sessionStorage.removeItem('autro_selected_friends');
          const parsed = JSON.parse(pickedFriends);
          selectedPeople = Array.isArray(parsed) ? parsed.join(', ') : String(parsed || '');
        }

        if (selectedPeople) {
          document.getElementById('peopleChipBtn').classList.add('active');
          document.getElementById('peopleChipLabel').textContent = selectedPeople;
        }
        renderMetaBadges();
      } catch (_) {}
    }

    // 4. Live Location
    function fetchLiveLocation() {
      if (!navigator.geolocation) {
        return showToast('Geolocation is not supported on this device.');
      }

      const btn = document.getElementById('locationChipBtn');
      const labelEl = document.getElementById('locationChipLabel');
      labelEl.textContent = 'Locating...';

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          let placeName = `${lat}, ${lon}`;

          try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
            if (resp.ok) {
              const geo = await resp.json();
              const addr = geo.address || {};
              const area = addr.suburb || addr.neighbourhood || addr.city_district || addr.town || addr.city || addr.state || '';
              const country = addr.country || '';
              placeName = [area, country].filter(Boolean).join(', ') || geo.display_name?.split(',').slice(0, 2).join(',') || placeName;
            }
          } catch (_) {}

          selectedLocation = placeName;
          btn.classList.add('active');
          labelEl.textContent = selectedLocation;
          renderMetaBadges();
          showToast(`Location added: ${selectedLocation}`);
        },
        () => {
          labelEl.textContent = selectedLocation || 'Location';
          showToast('Unable to get live location. Please enable GPS.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // 5. Feelings Modal (16 emotions)
    function renderFeelingsGrid() {
      const grid = document.getElementById('feelingsGrid');
      grid.innerHTML = '';
      EMOTIONS_LIST.forEach(item => {
        const isSel = selectedFeeling?.label === item.label;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `feeling-option-btn ${isSel ? 'selected' : ''}`;
        btn.innerHTML = `<span class="feeling-emoji">${item.emoji}</span><span>${item.label}</span>`;
        btn.onclick = () => {
          selectedFeeling = item;
          document.getElementById('feelingsChipBtn').classList.add('active');
          document.getElementById('feelingsChipLabel').textContent = `${item.label} ${item.emoji}`;
          renderMetaBadges();
          closeFeelingsModal();
        };
        grid.appendChild(btn);
      });
    }

    function openFeelingsModal() {
      renderFeelingsGrid();
      document.getElementById('feelingsModalBackdrop').classList.add('open');
    }

    function closeFeelingsModal() {
      document.getElementById('feelingsModalBackdrop').classList.remove('open');
    }

    // 'B' Button right beside Feelings
    function toggleCaptionBold() {
      isBoldText = !isBoldText;
      document.getElementById('captionInput').classList.toggle('is-bold', isBoldText);
      document.getElementById('boldBtn').classList.toggle('active', isBoldText);
      showToast(isBoldText ? 'Bold text ON' : 'Bold text OFF');
    }

    function renderMetaBadges() {
      const box = document.getElementById('metaBadgesBox');
      box.innerHTML = '';
      const chips = [];

      if (selectedFeeling) {
        chips.push({
          text: `Feeling ${selectedFeeling.label} ${selectedFeeling.emoji}`,
          onClear: () => {
            selectedFeeling = null;
            document.getElementById('feelingsChipBtn').classList.remove('active');
            document.getElementById('feelingsChipLabel').textContent = 'Feelings';
            renderMetaBadges();
          }
        });
      }
      if (selectedPeople) {
        chips.push({
          text: `with ${selectedPeople}`,
          onClear: () => {
            selectedPeople = '';
            document.getElementById('peopleChipBtn').classList.remove('active');
            document.getElementById('peopleChipLabel').textContent = 'People';
            renderMetaBadges();
          }
        });
      }
      if (selectedLocation) {
        chips.push({
          text: `at ${selectedLocation}`,
          onClear: () => {
            selectedLocation = '';
            document.getElementById('locationChipBtn').classList.remove('active');
            document.getElementById('locationChipLabel').textContent = 'Location';
            renderMetaBadges();
          }
        });
      }
      if (selectedMusicName) {
        chips.push({
          text: `Music: ${selectedMusicName}`,
          onClear: () => {
            musicFile = null;
            selectedMusicName = '';
            document.getElementById('phoneMusicInput').value = '';
            document.getElementById('musicChipBtn').classList.remove('active');
            document.getElementById('musicChipLabel').textContent = 'Music';
            renderMetaBadges();
          }
        });
      }

      if (!chips.length) {
        box.classList.remove('show');
        return;
      }

      box.classList.add('show');
      chips.forEach(c => {
        const pill = document.createElement('span');
        pill.className = 'meta-pill';
        const txt = document.createElement('span');
        txt.textContent = c.text;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.innerHTML = '<i class="fas fa-xmark"></i>';
        rm.onclick = c.onClear;
        pill.appendChild(txt);
        pill.appendChild(rm);
        box.appendChild(pill);
      });
    }

    function setProgress(pct, msg) {
      const box = document.getElementById('progressBox');
      box.classList.add('active');
      document.getElementById('progressFill').style.width = `${pct}%`;
      if (msg) document.getElementById('progressText').textContent = msg;
    }

    async function uploadToStorage(file, folder) {
      if (!sb || !file) return '';
      const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
      const path = `posts/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await sb.storage.from('media').upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data } = sb.storage.from('media').getPublicUrl(path);
      return data?.publicUrl || '';
    }

    function buildFullCaption() {
      const base = document.getElementById('captionInput').value.trim();
      const parts = [];
      if (selectedFeeling) parts.push(`Feeling ${selectedFeeling.label} ${selectedFeeling.emoji}`);
      if (selectedPeople) parts.push(`with ${selectedPeople}`);
      if (selectedLocation) parts.push(`at ${selectedLocation}`);
      if (selectedMusicName) parts.push(`♪ ${selectedMusicName}`);

      if (parts.length && base) return `${base} — ${parts.join(' · ')}`;
      if (parts.length) return parts.join(' · ');
      return base;
    }

    async function handleDonePost() {
      const caption = buildFullCaption();
      const audience = document.getElementById('postAudience').value;

      if (!caption && !galleryFile && !musicFile) {
        return showToast('Write something or select media first.');
      }

      const btn = document.getElementById('doneBtn');
      btn.disabled = true;
      pruneHeavyLocalKeys();
      setProgress(15, 'Preparing post...');

      try {
        let mediaUrl = '';
        if (galleryFile) {
          setProgress(40, 'Uploading media...');
          try {
            mediaUrl = await uploadToStorage(galleryFile, galleryMediaType === 'video' ? 'videos' : 'images');
          } catch (_) {
            mediaUrl = galleryDataUrl || '';
          }
        }

        let musicUrl = '';
        if (musicFile) {
          setProgress(65, 'Uploading music...');
          try {
            musicUrl = await uploadToStorage(musicFile, 'music');
          } catch (_) {
            musicUrl = '';
          }
        }

        const authorName = currentProfile?.full_name || '';
        const authorAvatar = currentProfile?.avatar_url || '';
        const authorId = currentUser?.id || currentProfile?.id || null;
        const createdAt = new Date().toISOString();

        let savedRow = null;
        if (sb) {
          setProgress(85, 'Saving to Supabase...');
          const insertPayload = {
            user_id: authorId,
            caption,
            media_url: mediaUrl || musicUrl || null,
            media_type: galleryMediaType ? `${galleryMediaType}/*` : (musicFile ? 'audio/*' : 'text'),
            audience,
            created_at: createdAt
          };
          if (authorName) insertPayload.author_name = authorName;

          const { data, error } = await sb
            .from('posts')
            .insert(insertPayload)
            .select()
            .maybeSingle();

          if (error && authorName) {
            delete insertPayload.author_name;
            const retryRes = await sb
              .from('posts')
              .insert(insertPayload)
              .select()
              .maybeSingle();
            if (!retryRes.error && retryRes.data) savedRow = retryRes.data;
          } else if (!error && data) {
            savedRow = data;
          }
        }

        const resolvedMedia = mediaUrl || galleryDataUrl || '';
        const postPayload = {
          id: savedRow?.id || `post-${Date.now()}`,
          user_id: authorId,
          author_name: authorName,
          avatar: authorAvatar,
          posted_at: createdAt,
          created_at: createdAt,
          quality: '1080p',
          is_bold: isBoldText,
          is_video: galleryMediaType === 'video',
          media_url: resolvedMedia,
          image: galleryMediaType === 'image' ? resolvedMedia : '',
          music_url: musicUrl || '',
          music_name: selectedMusicName || '',
          poster_url: galleryMediaType === 'image' ? resolvedMedia : authorAvatar,
          caption,
          text: caption,
          audience,
          reactions: 0,
          likes: 0,
          views: 0,
          comments: 0,
          shares: 0
        };

        appendPostToLocalCache('autro_instant_feed_posts', postPayload, 12);
        appendPostToLocalCache('autro_profile_posts', postPayload, 12);
        appendPostToLocalCache('autro_post_cards', postPayload, 12);
        broadcastNewPost(postPayload);

        setProgress(100, 'Posted!');
        showToast('Post published!');

        const destination = resolveReturnUrl();
        setTimeout(() => {
          window.location.href = destination;
        }, 300);
      } catch (err) {
        btn.disabled = false;
        document.getElementById('progressBox').classList.remove('active');
        showToast(err?.message || 'Could not publish post.');
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      captureOriginFromUrl();
      pruneHeavyLocalKeys();
      const ok = await loadSupabaseAccount();
      if (ok === false) return;
      subscribeRealtimeProfileIdentity();
      restoreDraftAndFriends();
    });
  </script>
