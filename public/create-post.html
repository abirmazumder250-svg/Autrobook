<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>New post</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #242526;
      --bg-surface: #242526;
      --bg-card: #323436;
      --bg-chip: #3a3b3c;
      --bg-chip-hover: #4e4f50;
      --text-primary: #e4e6eb;
      --text-secondary: #b0b3b8;
      --border-color: #3e4042;
      --btn-disabled: #3a3b3c;
      --btn-disabled-fg: #76787b;
      --btn-dark-green: #0b5d34;
      --btn-dark-green-hover: #0f7642;
      --btn-dark-green-fg: #ffffff;
      --accent-green: #0b5d34;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f0f2f5;
        --bg-chip: #f0f2f5;
        --bg-chip-hover: #e4e6eb;
        --text-primary: #050505;
        --text-secondary: #65676b;
        --border-color: #ced0d4;
        --btn-disabled: #e4e6eb;
        --btn-disabled-fg: #bcc0c4;
        --btn-dark-green: #0b5d34;
        --btn-dark-green-hover: #084727;
        --btn-dark-green-fg: #ffffff;
        --accent-green: #0b5d34;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .composer-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .header-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .header-close-btn:hover {
      background: var(--bg-chip);
    }

    .header-close-btn:active {
      transform: scale(0.94);
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      flex: 1;
    }

    .header-next-btn {
      background: var(--btn-disabled);
      color: var(--btn-disabled-fg);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: not-allowed;
      flex-shrink: 0;
      transition: background 0.2s ease, color 0.2s ease, transform 0.14s ease;
    }

    .header-next-btn.ready {
      background: var(--btn-dark-green);
      color: var(--btn-dark-green-fg);
      border-color: var(--btn-dark-green);
      cursor: pointer;
    }

    .header-next-btn.ready:hover {
      background: var(--btn-dark-green-hover);
    }

    .header-next-btn.ready:active {
      transform: scale(0.96);
    }

    /* MAIN COMPOSER AREA */
    .composer-body {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 16px 210px;
      display: flex;
      flex-direction: column;
    }

    /* PROFILE ROW */
    .author-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .author-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .author-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* TOP CHIPS ROW */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 14px;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .action-chip:hover {
      background: var(--bg-chip-hover);
    }

    .action-chip.active {
      background: var(--btn-dark-green);
      color: var(--btn-dark-green-fg);
    }

    .action-chip i {
      font-size: 13.5px;
    }

    .bold-chip-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: none;
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .bold-chip-btn.active {
      background: var(--btn-dark-green);
      color: var(--btn-dark-green-fg);
    }

    /* EDITOR CANVAS */
    .editor-canvas {
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      transition: background 0.25s ease, padding 0.25s ease;
    }

    .editor-canvas.has-bg {
      min-height: 220px;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      text-align: center;
      background-size: cover;
      background-position: center;
      box-shadow: var(--shadow);
    }

    .caption-field {
      width: 100%;
      min-height: 54px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 18px;
      line-height: 1.45;
      resize: none;
      outline: none;
    }

    .caption-field::placeholder {
      color: var(--text-secondary);
      opacity: 0.9;
    }

    .editor-canvas.has-bg .caption-field {
      min-height: 110px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .editor-canvas.has-bg .caption-field::placeholder {
      color: rgba(255, 255, 255, 0.82);
    }

    .caption-field.is-bold {
      font-weight: 800;
    }

    /* LIFE EVENT CARD IN COMPOSER */
    .life-event-card {
      display: none;
      margin-top: 10px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      box-shadow: var(--shadow);
    }

    .life-event-card.active {
      display: block;
    }

    .life-event-banner {
      position: relative;
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, #1b2232 0%, #0e121a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .life-event-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .life-event-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      padding: 16px;
      text-align: center;
    }

    .life-event-edit-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(36, 37, 38, 0.85);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.16s ease, transform 0.14s ease;
    }

    .life-event-edit-btn:hover {
      background: var(--btn-dark-green);
    }

    .life-event-edit-btn:active {
      transform: scale(0.95);
    }

    .life-event-remove-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(36, 37, 38, 0.85);
      color: #ffffff;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .life-event-badge-wrap {
      position: relative;
      margin: -22px auto 6px;
      z-index: 6;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-green);
      border: 3px solid var(--bg-card);
      color: #ffffff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .life-event-details {
      padding: 4px 16px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .life-event-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .life-event-meta {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .life-event-meta i {
      color: #e5484d;
      font-size: 13px;
    }

    .life-event-date {
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .life-event-story {
      font-size: 13.5px;
      color: var(--text-primary);
      margin-top: 4px;
      white-space: pre-line;
    }

    #postStatus {
      color: #ff5c5c;
      font-size: 12.5px;
      margin-top: 6px;
      min-height: 16px;
    }

    /* META BADGES */
    .meta-badges-box {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .meta-badges-box.show {
      display: flex;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
    }

    .meta-pill button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
    }

    /* MEDIA / GIF PREVIEW */
    .preview-box {
      display: none;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      margin-top: 12px;
    }

    .preview-box.active {
      display: block;
    }

    .preview-box img,
    .preview-box video {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .remove-preview-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* PROGRESS */
    .progress-box {
      display: none;
      margin-top: 12px;
      background: var(--bg-card);
      padding: 10px 12px;
      border-radius: 12px;
    }

    .progress-box.active {
      display: block;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--bg-chip);
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--btn-dark-green);
      transition: width 0.25s ease;
    }

    /* BOTTOM DOCK */
    .bottom-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 12px 14px 16px;
      z-index: 60;
    }

    .bottom-dock-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cards-carousel {
      display: flex;
      align-items: stretch;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .cards-carousel::-webkit-scrollbar {
      display: none;
    }

    .tool-tile-btn {
      min-width: 108px;
      flex: 1 0 108px;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.16s ease, transform 0.14s ease, border-color 0.16s ease;
    }

    .tool-tile-btn:hover {
      background: var(--bg-chip-hover);
    }

    .tool-tile-btn:active {
      transform: scale(0.97);
    }

    .tool-tile-btn i {
      font-size: 20px;
      color: var(--text-primary);
    }

    .bg-color-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #ff5f6d, #ffc371, #38ef7d, #0b5d34);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* BOTTOM AUDIENCE BAR */
    .bottom-audience-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .audience-pill-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .audience-select {
      background: transparent;
      color: var(--text-primary);
      border: none;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .audience-select option {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    /* BACKGROUND STYLE SHEET */
    .style-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 110;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .style-sheet-backdrop.open {
      display: flex;
    }

    .style-sheet-panel {
      width: 100%;
      max-width: 680px;
      max-height: 62vh;
      background: var(--bg-surface);
      color: var(--text-primary);
      border-top: 1px solid var(--border-color);
      border-radius: 20px 20px 0 0;
      padding: 10px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .sheet-drag-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-color);
      margin: 0 auto;
    }

    .style-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .style-sheet-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 auto;
      padding-left: 28px;
    }

    .style-done-check {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .style-swatches-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      overflow-y: auto;
      padding-bottom: 8px;
    }

    .swatch-item {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      transition: transform 0.14s ease, border-color 0.16s ease;
    }

    .swatch-item:active {
      transform: scale(0.95);
    }

    .swatch-item.selected {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--btn-dark-green);
    }

    .swatch-none {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      color: var(--text-primary);
      font-size: 20px;
    }

    /* FEELINGS MODAL */
    .feeling-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      z-index: 120;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .feeling-modal-backdrop.open {
      display: flex;
    }

    .feeling-modal-sheet {
      width: 100%;
      max-width: 680px;
      max-height: 82vh;
      background: var(--bg-surface);
      color: var(--text-primary);
      border-top: 1px solid var(--border-color);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .feeling-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feeling-modal-title {
      font-size: 16px;
      font-weight: 700;
    }

    .feeling-close-btn {
      background: var(--btn-dark-green);
      color: var(--btn-dark-green-fg);
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .feeling-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      overflow-y: auto;
    }

    .feeling-option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .feeling-option-btn.selected {
      background: var(--btn-dark-green);
      color: var(--btn-dark-green-fg);
    }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--btn-dark-green);
      color: var(--btn-dark-green-fg);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 200;
      display: none;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="composer-header">
    <a href="/profile.html" id="closeComposerLink" class="header-close-btn" title="Back to Profile" aria-label="Close" onclick="goBackToProfile(event)">
      <i class="fas fa-xmark"></i>
    </a>
    <div id="headerUserName" class="header-title">New post</div>
    <button type="button" id="nextBtn" class="header-next-btn" onclick="handleNextClick()">Next</button>
  </header>

  <main class="composer-body">
    <!-- PROFILE HEADER -->
    <div class="author-line">
      <div id="profileAvatarBox" class="author-avatar"></div>
      <div id="profileNameBox" class="author-name"></div>
    </div>

    <!-- CHIPS ROW -->
    <div class="chips-row">
      <button type="button" id="musicChipBtn" class="action-chip" onclick="openPhoneMusicFiles()">
        <i class="fas fa-music"></i>
        <span id="musicChipLabel">Music</span>
      </button>

      <button type="button" id="peopleChipBtn" class="action-chip" onclick="openPeopleFriendsPage()">
        <i class="fas fa-user-plus"></i>
        <span id="peopleChipLabel">Tag/collaborate</span>
      </button>

      <button type="button" id="locationChipBtn" class="action-chip" onclick="fetchLiveLocation()">
        <i class="fas fa-location-dot"></i>
        <span id="locationChipLabel">Location</span>
      </button>

      <button type="button" id="feelingsChipBtn" class="action-chip" onclick="openFeelingsModal()">
        <i class="far fa-face-smile"></i>
        <span id="feelingsChipLabel">Feelings</span>
      </button>

      <button type="button" id="boldBtn" class="bold-chip-btn" onclick="toggleCaptionBold()" title="Bold">
        B
      </button>
    </div>

    <!-- TEXT EDITOR & BACKGROUND CANVAS -->
    <section id="editorCanvas" class="editor-canvas">
      <textarea
        id="postText"
        class="caption-field"
        maxlength="2000"
        placeholder="What's on your mind?"
        oninput="updateNextButtonState()"
      ></textarea>
    </section>

    <!-- LIFE EVENT CARD PREVIEW -->
    <section id="lifeEventCard" class="life-event-card" aria-label="Life event card">
      <div id="lifeEventBanner" class="life-event-banner">

    function safeLocalStorageSet(key, valueStr) {
      const cleanStr = String(valueStr || '');
      if (!cleanStr) return false;
      try {
        localStorage.setItem(key, cleanStr);
        return true;
      } catch (_) {

      }

    function sanitizePostForCache(post) {
      const item = { ...post };
      const stripVolatileUrl = (u) => {
        if (typeof u !== 'string') return '';
        if (u.startsWith('blob:')) return '';
        if (u.startsWith('data:video/') || u.startsWith('data:audio/') || u.length > 260000) return '';
        return u;
      };
      item.media_url = stripVolatileUrl(item.media_url);
      item.image = stripVolatileUrl(item.image);
      item.gif_url = stripVolatileUrl(item.gif_url);
      item.music_url = stripVolatileUrl(item.music_url);
      item.poster_url = stripVolatileUrl(item.poster_url);
      item.avatar = stripVolatileUrl(item.avatar);
      return item;
    }

    function appendPostToLocalCache(storageKey, newPost, maxItems = 15) {
      try {
        let list = [];
        try {
          const raw = localStorage.getItem(storageKey);
          const parsed = raw ? JSON.parse(raw) : [];
          if (Array.isArray(parsed)) list = parsed;
        } catch (_) {}
        const safePost = sanitizePostForCache(newPost);
        const deduped = [safePost, ...list.filter(p => p && String(p.id) !== String(safePost.id)).map(sanitizePostForCache)].slice(0, maxItems);
        safeLocalStorageSet(storageKey, JSON.stringify(deduped));
      } catch (_) {}
    }

    function resolveMediaUrl(url) {
      const raw = String(url || '').trim();
      if (!raw) return '';
      if (raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('data:') || raw.startsWith('blob:')) {
        return raw;
      }
      if (sb) {
        const cleanPath = raw.replace(/^\/+/, '');
        if (cleanPath.startsWith('avatars/')) {
          return sb.storage.from('avatars').getPublicUrl(cleanPath.replace(/^avatars\//, '')).data.publicUrl || '';
        }
        return sb.storage.from('avatars').getPublicUrl(cleanPath).data.publicUrl || '';
      }
      return '';
    }

      }
    }

    async function loadSupabaseAccount() {
      const cachedName = localStorage.getItem('autro_profile_name') || localStorage.getItem('autro_user_name') || '';
      const cachedAvatar = localStorage.getItem('autro_profile_avatar') || '';
      applyAccountIdentity(cachedName, cachedAvatar, localStorage.getItem('autro_user_id') || null);

      if (!sb) return;

      try {
        if (window.AutroAuth && typeof window.AutroAuth.checkSessionAndProfile === 'function') {
          try {
            const authResult = await window.AutroAuth.checkSessionAndProfile({ requireCompleteProfile: false });
            if (authResult?.user) currentUser = authResult.user;
          } catch (_) {}
        }

        if (!currentUser) {
          const { data: { session } } = await sb.auth.getSession();
          currentUser = session?.user || null;
        }

        if (currentUser?.id) {
          safeLocalStorageSet('autro_user_id', String(currentUser.id));

          const { data: prof } = await sb
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .maybeSingle();

          const meta = currentUser.user_metadata || {};
          const savedName =
            prof?.full_name ||
            prof?.name ||
            prof?.display_name ||
            prof?.username ||
            meta.full_name ||
            meta.name ||
            meta.display_name ||
            cachedName ||
            '';

          const savedAvatar =
            prof?.avatar_url ||
            prof?.avatar ||
            prof?.photo_url ||
            meta.avatar_url ||
            meta.avatar ||
            meta.picture ||
            cachedAvatar ||
            '';

          if (savedName) safeLocalStorageSet('autro_profile_name', savedName);
          if (savedAvatar) safeLocalStorageSet('autro_profile_avatar', savedAvatar);

          applyAccountIdentity(savedName, savedAvatar, currentUser.id);
        }
      } catch (_) {
        applyAccountIdentity(cachedName, cachedAvatar, currentUser?.id || null);
      }
    }

    /* LIFE EVENT CARD RENDERING, PEN REDIRECT TO SUB-PAGE & PHOTO SYNC */
    function slugifyLifeEvent(val) {
      return String(val || '')
        .toLowerCase()
        .replace(/\.html$/i, '')
        .replace(/['’]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function resolveLifeEventTargetPage(ev) {
      if (!ev || typeof ev !== 'object') return '/life-event.html';

      const directUrl = String(ev.pageUrl || ev.route || ev.targetUrl || ev.url || '').trim();
      if (directUrl && (directUrl.startsWith('/') || directUrl.endsWith('.html'))) {
        return directUrl.startsWith('/') ? directUrl : `/${directUrl}`;
      }

      const candidates = [
        ev.slug,
        ev.type,
        ev.eventType,
        ev.subCategory,
        ev.sub_category,
        ev.title,
        ev.categoryId,
        ev.category_id,
        ev.categoryLabel,
        ev.category_label
      ];

      for (const raw of candidates) {
        const slug = slugifyLifeEvent(raw);
        if (LIFE_EVENT_ROUTES[slug]) {
          return LIFE_EVENT_ROUTES[slug];
        }
        for (const [key, path] of Object.entries(LIFE_EVENT_ROUTES)) {
          if (slug && (slug.includes(key) || key.includes(slug))) {
            return path;
          }
        }
      }

      return '/life-event.html';
    }

    function getCategoryIconClass(categoryId, categoryLabel) {
      const key = String(categoryId || categoryLabel || '').toLowerCase();
      if (key.includes('career') || key.includes('work') || key.includes('job') || key.includes('promotion') || key.includes('retirement')) return 'fa-briefcase';
      if (key.includes('education') || key.includes('school') || key.includes('graduat')) return 'fa-graduation-cap';
      if (key.includes('relationship') || key.includes('marri') || key.includes('engag') || key.includes('heart') || key.includes('first-met') || key.includes('first met')) return 'fa-heart';
      if (key.includes('living') || key.includes('home') || key.includes('move') || key.includes('hometown') || key.includes('lived')) return 'fa-house';
      if (key.includes('family') || key.includes('child') || key.includes('parent') || key.includes('pet') || key.includes('loved')) return 'fa-seedling';
      if (key.includes('travel')) return 'fa-plane';
      return 'fa-flag';
    }

        localStorage.setItem('autro_life_event', JSON.stringify(normalized));

      const dateText = (!rawDate || rawDate === todayIso) ? 'Today' : rawDate;

      const bannerImg = document.getElementById('lifeEventBannerImg');

    function compressImageDataUrl(file, maxWidth = 1080, quality = 0.82) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith('image/')) return resolve('');
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = typeof ev.target?.result === 'string' ? ev.target.result : '';
          if (!dataUrl) return resolve('');
          const img = new Image();
          img.onload = () => {
            try {
              const scale = img.width > maxWidth ? (maxWidth / img.width) : 1;
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const compressed = canvas.toDataURL('image/jpeg', quality);
              resolve(compressed.length < dataUrl.length ? compressed : dataUrl);
            } catch (_) {
              resolve(dataUrl);
            }
          };
          img.onerror = () => resolve(dataUrl);
          img.src = dataUrl;
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

        const reader = new FileReader();
        reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : '');
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);

    function fetchLiveLocation() {
      if (!navigator.geolocation) {
        return showToast('Geolocation is not supported on this device.');
      }
      const btn = document.getElementById('locationChipBtn');
      const labelEl = document.getElementById('locationChipLabel');
      labelEl.textContent = 'Locating...';

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          let placeName = `${lat}, ${lon}`;
          try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
            if (resp.ok) {
              const geo = await resp.json();
              const addr = geo.address || {};
              const area = addr.suburb || addr.neighbourhood || addr.city_district || addr.town || addr.city || addr.state || '';
              const country = addr.country || '';
              placeName = [area, country].filter(Boolean).join(', ') || placeName;
            }
          } catch (_) {}

          selectedLocation = placeName;
          btn.classList.add('active');
          labelEl.textContent = selectedLocation;
          renderMetaBadges();
          updateNextButtonState();
          showToast(`Location added: ${selectedLocation}`);
        },
        () => {
          labelEl.textContent = selectedLocation || 'Location';
          showToast('Unable to get live location.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function uploadToStorage(file, folder) {
      if (!sb || !file) return '';
      const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
      const uid = currentUser?.id || currentProfile?.id || 'guest';
      const path = `${uid}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await sb.storage.from('posts').upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data } = sb.storage.from('posts').getPublicUrl(path);
      return data?.publicUrl || '';
    }

    function buildLifeEventSummaryText() {
      if (!selectedLifeEvent) return '';
      if (selectedLifeEvent.formattedText) return String(selectedLifeEvent.formattedText).trim();
      const title = selectedLifeEvent.title || selectedLifeEvent.subCategory || selectedLifeEvent.categoryLabel || 'Life event';
      const place = selectedLifeEvent.employer || selectedLifeEvent.location || '';
      const dateStr = selectedLifeEvent.date || '';
      return [title, place ? `at ${place}` : '', dateStr ? `(${dateStr})` : ''].filter(Boolean).join(' ');
    }

    function buildFullCaption() {
      const base = document.getElementById('postText').value.trim();
      const lifeEventText = buildLifeEventSummaryText();
      const parts = [];
      if (selectedFeeling) parts.push(`Feeling ${selectedFeeling.label} ${selectedFeeling.emoji}`);
      if (selectedPeople) parts.push(`with ${selectedPeople}`);
      if (selectedLocation) parts.push(`at ${selectedLocation}`);
      if (selectedMusicName) parts.push(`♪ ${selectedMusicName}`);

      const segments = [];
      if (base) segments.push(base);
      if (parts.length) segments.push(parts.join(' · '));
      if (lifeEventText) segments.push(lifeEventText);

      return segments.join('\n\n');
    }

    async function createPost() {
      if (isSubmitting) return;

      const rawText = document.getElementById('postText').value;
      const fullCaption = buildFullCaption();
      const imageInput = document.getElementById('postImage');
      const selectedFile = imageInput?.files?.[0] || galleryFile || null;
      const statusEl = document.getElementById('postStatus');
      statusEl.innerText = '';

      if (!fullCaption && !selectedFile && !selectedGifUrl && !selectedLifeEvent && !musicFile) {
        showToast('Write something or select a photo/GIF/video first.');
        return;
      }

      isSubmitting = true;
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.classList.add('ready');
      setProgress(15, 'Checking content...');

      try {
        const formData = new FormData();
        formData.append('text', rawText);
        if (selectedFile) {
          formData.append('image', selectedFile);
        }

        try {
          const res = await fetch('/api/moderate', { method: 'POST', body: formData });
          if (res.ok) {
            const modData = await res.json();
            if (modData && modData.action === 'suspend') {
              statusEl.innerText = 'Blocked: ' + (modData.message || 'Content violates community guidelines.');
              document.getElementById('progressBox').classList.remove('active');
              isSubmitting = false;
              return;
            }
          }
        } catch (_) {}

        let lifeEventUploadedPhoto = getLifeEventPhoto(selectedLifeEvent);
        if (lifeEventPhotoFile) {
          setProgress(35, 'Uploading life event photo...');
          try {
            const uploadedLePhoto = await uploadToStorage(lifeEventPhotoFile, 'life-events');
            if (uploadedLePhoto) {
              lifeEventUploadedPhoto = uploadedLePhoto;
              selectedLifeEvent = {
                ...selectedLifeEvent,
                photoUrl: uploadedLePhoto,
                photo_url: uploadedLePhoto
              };
            }
          } catch (_) {}
        }

        let mediaUrl = selectedGifUrl || lifeEventUploadedPhoto || '';
        if (selectedFile) {
          setProgress(45, 'Uploading media...');
          try {
            const uploaded = await uploadToStorage(selectedFile, galleryMediaType === 'video' ? 'videos' : 'images');
            mediaUrl = uploaded || galleryDataUrl || selectedGifUrl || '';
          } catch (_) {
            mediaUrl = galleryDataUrl || selectedGifUrl || '';
          }
        }

        let musicUrl = '';
        if (musicFile) {
          setProgress(65, 'Uploading music...');
          try {
            musicUrl = await uploadToStorage(musicFile, 'music');
          } catch (_) {
            musicUrl = '';
          }
        }

        const authorName = currentProfile?.full_name || 'User';
        const authorAvatar = currentProfile?.avatar_url || '';
        const authorId = currentUser?.id || currentProfile?.id || null;
        const audience = document.getElementById('postAudience').value;
        const createdAt = new Date().toISOString();

        let savedRow = null;
        if (sb && authorId) {
          setProgress(85, 'Saving post...');
          const insertPayload = {
            user_id: authorId,
            caption: fullCaption,
            media_url: mediaUrl || musicUrl || null,
            media_type: galleryMediaType ? `${galleryMediaType}/*` : (selectedGifUrl ? 'image/gif' : (selectedLifeEvent ? 'life_event' : (musicFile ? 'audio/*' : 'text'))),
            audience,
            created_at: createdAt
          };
          if (authorName) insertPayload.author_name = authorName;

          const { data, error } = await sb
            .from('posts')
            .insert(insertPayload)
            .select()
            .maybeSingle();

          if (error && authorName) {
            delete insertPayload.author_name;
            const retryRes = await sb
              .from('posts')
              .insert(insertPayload)
              .select()
              .maybeSingle();
            if (!retryRes.error && retryRes.data) savedRow = retryRes.data;
          } else if (!error && data) {
            savedRow = data;
          }
        }

        const resolvedMedia = mediaUrl || galleryDataUrl || selectedGifUrl || lifeEventUploadedPhoto || '';
        const postId = savedRow?.id || `local-${Date.now()}`;
        const postObj = {
          id: postId,
          user_id: authorId,
          author_name: authorName,
          avatar: authorAvatar,
          caption: fullCaption,
          text: fullCaption,
          life_event: selectedLifeEvent || null,
          media_url: resolvedMedia,
          image: galleryMediaType === 'video' ? '' : resolvedMedia,
          gif_url: selectedGifUrl || '',
          is_video: galleryMediaType === 'video',
          music_url: musicUrl,
          music_name: selectedMusicName,
          background_style: selectedBgStyle.id !== 'none' ? selectedBgStyle.css : '',
          is_bold: isBoldText,
          audience,
          created_at: createdAt
        };

        addPostToFeed(postObj, authorName, authorAvatar);

        try {
          localStorage.removeItem('selectedGif');
          localStorage.removeItem('selectedGifUrl');
          localStorage.removeItem('autro_life_event');
          localStorage.removeItem('autro_life_event_photo');
          localStorage.removeItem('selectedLifeEventPhoto');
        } catch (_) {}

        setProgress(100, 'Ready! Opening post settings...');
        nextBtn.classList.add('ready');

        setTimeout(() => {
          window.location.href = `/post-settings.html?id=${encodeURIComponent(postId)}`;
        }, 250);
      } catch (err) {
        isSubmitting = false;
        document.getElementById('progressBox').classList.remove('active');
        statusEl.innerText = err?.message || 'Unable to process post.';
      }
    }

    function handleNextClick() {
      createPost();
    }

    window.addEventListener('storage', (e) => {
      if (
        e.key === 'autro_life_event' ||
        e.key === 'autro_life_event_photo' ||
        e.key === 'selectedLifeEventPhoto'
      ) {
        syncLifeEventFromStorage();
      }
    });

    if (postSyncChannel) {
      postSyncChannel.onmessage = (event) => {
        const msg = event?.data || {};
        if (msg.type === 'LIFE_EVENT_UPDATED' || msg.type === 'LIFE_EVENT_PHOTO_UPDATED') {
          if (msg.lifeEvent && typeof msg.lifeEvent === 'object') {
            selectedLifeEvent = msg.lifeEvent;
            persistLifeEventState(selectedLifeEvent);
          } else if (msg.photoUrl) {
            selectedLifeEvent = {
              ...(selectedLifeEvent || { title: 'Life event', date: 'Today' }),
              photoUrl: msg.photoUrl,
              photo_url: msg.photoUrl
            };
            persistLifeEventState(selectedLifeEvent);
          }
          renderLifeEventCard();
        }
      };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      pruneHeavyLocalKeys();
      await loadSupabaseAccount();
      subscribeRealtimeProfileIdentity();
      restoreDraftAndGif();
      updateNextButtonState();
    });
  </script>
</body>
        </html>
