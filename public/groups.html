<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Groups — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --surface: #f3f4f6;
      --card: #FFFFFF;
      --elevated: #FFFFFF;
      --text: #202124;
      --muted: #5f6368;
      --border: #e5e7eb;
      --accent: #14532d;
      --accent-hover: #0f3f22;
      --accent-soft: rgba(20, 83, 45, 0.14);
      --pill-active-bg: rgba(20, 83, 45, 0.16);
      --pill-active-text: #14532d;
      --btn-secondary: #eef0f2;
      --btn-secondary-hover: #e2e5e9;
      --danger: #dc2626;
      --shadow: 0 8px 24px rgba(32, 33, 36, 0.14);
    }

    :root[data-theme="dark"],
    body.dark-theme {
      color-scheme: dark;
      --bg: #202124;
      --surface: #292a2d;
      --card: #202124;
      --elevated: #292a2d;
      --text: #FFFFFF;
      --muted: #b0b7c0;
      --border: #383a3f;
      --accent: #14532d;
      --accent-hover: #166534;
      --accent-soft: rgba(74, 222, 128, 0.16);
      --pill-active-bg: rgba(56, 116, 203, 0.28);
      --pill-active-text: #8ab4f8;
      --btn-secondary: #303134;
      --btn-secondary-hover: #3c4043;
      --danger: #f87171;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #202124;
        --surface: #292a2d;
        --card: #202124;
        --elevated: #292a2d;
        --text: #FFFFFF;
        --muted: #b0b7c0;
        --border: #383a3f;
        --accent: #14532d;
        --accent-hover: #166534;
        --accent-soft: rgba(74, 222, 128, 0.16);
        --pill-active-bg: rgba(56, 116, 203, 0.28);
        --pill-active-text: #8ab4f8;
        --btn-secondary: #303134;
        --btn-secondary-hover: #3c4043;
        --danger: #f87171;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 74px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--btn-secondary);
      color: var(--text);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.12s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--btn-secondary-hover);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .page-title {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    /* Sub-navigation Tabs */
    .sub-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 12px;
    }

    .sub-tab {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sub-tab:hover {
      background: var(--surface);
    }

    .sub-tab.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    /* Dropdown Popovers (+ Create & ... Menu) */
    .popover-menu {
      position: fixed;
      top: 54px;
      right: 12px;
      min-width: 220px;
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 8px;
      z-index: 120;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .popover-menu.open {
      display: flex;
    }

    .popover-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .popover-item:hover {
      background: var(--surface);
    }

    .popover-item i {
      width: 22px;
      text-align: center;
      font-size: 17px;
      color: var(--text);
    }

    .popover-item .live-lock-hint {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    /* Main Content Sections */
    .main-container {
      max-width: 720px;
      margin: 0 auto;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .section-card {
      background: var(--card);
      border-bottom: 6px solid var(--surface);
      padding: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .see-all-btn {
      border: none;
      background: transparent;
      color: var(--pill-active-text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Your Groups List */
    .group-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .group-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .group-row-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .group-thumb {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 20px;
      flex-shrink: 0;
    }

    .group-meta {
      min-width: 0;
      flex: 1;
    }

    .group-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.28;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .group-status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3b82f6;
      display: inline-block;
    }

    .pin-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pin-btn.pinned {
      color: var(--text);
    }

    /* Feed Posts From Your Groups */
    .feed-post {
      padding: 14px;
      background: var(--card);
      border-bottom: 6px solid var(--surface);
    }

    .post-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .post-group-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .post-avatar-stack {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .post-group-avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .post-member-mini {
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--card);
      background: var(--surface);
    }

    .post-title-line {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .join-inline-link {
      color: var(--pill-active-text);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 14px;
    }

    .post-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .post-head-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .post-caption {
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .post-media-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      border-radius: 10px;
      overflow: hidden;
    }

    .post-media-grid.single {
      grid-template-columns: 1fr;
    }

    .post-media-grid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    /* Your Groups Tab Controls */
    .create-group-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .create-group-plus {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--btn-secondary);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .create-group-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .search-box-wrap {
      padding: 12px 14px 8px;
    }

    .search-input-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
    }

    .search-input-pill i {
      color: var(--muted);
    }

    .search-input-pill input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }

    .sort-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 12px;
    }

    .sort-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .sort-select {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    /* Discover Tab Grid */
    .discover-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 12px 14px 20px;
    }

    .discover-card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .discover-cover-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 28px;
    }

    .discover-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dismiss-card-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(32, 33, 36, 0.72);
      color: #FFFFFF;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .discover-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .discover-title {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.28;
      color: var(--text);
    }

    .discover-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .discover-mutual {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
    }

    .discover-mutual img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .join-btn {
      margin-top: auto;
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .join-btn.joined {
      background: var(--accent);
      color: #FFFFFF;
    }

    .empty-box {
      text-align: center;
      padding: 26px 14px;
      color: var(--muted);
      font-size: 14px;
      background: var(--surface);
      border-radius: 12px;
    }

    .empty-box i {
      font-size: 24px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.7;
    }

    /* Create Group Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(32, 33, 36, 0.65);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-cancel {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn-secondary);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      cursor: pointer;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 80;
    }

    .nav-link {
      color: var(--muted);
      font-size: 20px;
      text-decoration: none;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-link.active {
      color: var(--pill-active-text);
    }

    .nav-profile-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      border: 2px solid var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-profile-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .nav-profile-ring img.has-img {
      display: block;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #FFFFFF;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 300;
      display: none;
      max-width: 90vw;
      text-align: center;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="top-bar">
      <div class="top-left">
        <a href="public/shortcut.html" class="icon-btn" title="Shortcuts" aria-label="Shortcuts">
          <i class="fas fa-bars"></i>
        </a>
        <h1 class="page-title">Groups</h1>
      </div>

      <div class="top-actions">
        <button type="button" class="icon-btn" id="createMenuBtn" title="Create" aria-label="Create">
          <i class="fas fa-plus"></i>
        </button>

        <a href="public/search.html" class="icon-btn" title="Search" aria-label="Search">
          <i class="fas fa-search"></i>
        </a>

        <button type="button" class="icon-btn" id="moreMenuBtn" title="More options" aria-label="More options">
          <i class="fas fa-ellipsis-h"></i>
        </button>
      </div>
    </div>

    <div class="sub-tabs" role="tablist">
      <button type="button" class="sub-tab active" data-tab="for-you" onclick="switchGroupsTab('for-you', this)">For you</button>
      <button type="button" class="sub-tab" data-tab="your-groups" onclick="switchGroupsTab('your-groups', this)">Your groups</button>
      <button type="button" class="sub-tab" data-tab="discover" onclick="switchGroupsTab('discover', this)">Discover</button>
    </div>
  </header>

  <!-- (+) Create Popover Menu -->
  <div id="createPopover" class="popover-menu" role="menu">
    <a href="public/create-post.html" class="popover-item" role="menuitem">
      <i class="far fa-edit"></i>
      <span>Post</span>
    </a>
    <a href="public/create-story.html" class="popover-item" role="menuitem">
      <i class="fas fa-book-open"></i>
      <span>Story</span>
    </a>
    <a href="public/create-reels.html" class="popover-item" role="menuitem">
      <i class="fas fa-clapperboard"></i>
      <span>Reels</span>
    </a>
    <button type="button" class="popover-item" id="liveNavBtn" role="menuitem" onclick="handleLiveClick()">
      <i class="fas fa-video"></i>
      <span>Live</span>
      <span id="liveAgeBadge" class="live-lock-hint">60d</span>
    </button>
  </div>

  <!-- (...) Three Dots Popover Menu -->
  <div id="morePopover" class="popover-menu" role="menu">
    <a href="public/invites.html" class="popover-item" role="menuitem">
      <i class="fas fa-envelope-open-text"></i>
      <span>Invites</span>
    </a>
    <a href="public/membership.html" class="popover-item" role="menuitem">
      <i class="fas fa-arrow-right-from-bracket"></i>
      <span>Membership</span>
    </a>
    <a href="public/groups-settings.html" class="popover-item" role="menuitem">
      <i class="fas fa-cog"></i>
      <span>Groups settings</span>
    </a>
  </div>

  <!-- Main Content -->
  <main class="main-container">
    <!-- FOR YOU TAB -->
    <section id="panel-for-you" class="tab-panel active">
      <div class="section-card">
        <div class="section-header">
          <h2 class="section-title">Your groups</h2>
          <button type="button" class="see-all-btn" onclick="switchGroupsTab('your-groups', document.querySelector('.sub-tab[data-tab=\"your-groups\"]'))">See all</button>
        </div>
        <div id="forYouGroupsList" class="group-list"></div>
      </div>

      <div id="fromYourGroupsFeed"></div>
    </section>

    <!-- YOUR GROUPS TAB -->
    <section id="panel-your-groups" class="tab-panel">
      <div class="create-group-row" onclick="openCreateGroupModal()">
        <span class="create-group-plus"><i class="fas fa-plus"></i></span>
        <span class="create-group-label">Create a group</span>
      </div>

      <div class="search-box-wrap">
        <div class="search-input-pill">
          <i class="fas fa-search"></i>
          <input type="search" id="yourGroupsSearch" placeholder="Search your groups by name" oninput="renderYourGroupsTab()" />
        </div>
      </div>

      <div class="sort-bar">

  <script>
    const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";
    const LIVEKIT_WSS_URL = "wss://autrobook-aij9raun.livekit.cloud";
    const TWO_MONTHS_DAYS = 60;
    const TWO_MONTHS_MS = TWO_MONTHS_DAYS * 24 * 60 * 60 * 1000;

    const sb = (window.supabase && typeof window.supabase.createClient === "function")
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let currentUserId = null;
    let accountCreatedAtMs = null;

    let yourGroups = [];
    let groupPosts = [];
    let discoverGroups = [];

    let dismissedGroupIds = new Set();

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function formatCompactNumber(n) {
      const num = Math.max(0, Number(n || 0));
      if (num >= 1000000) return `${(num / 1000000).toFixed(1).replace(/\.0$/, "")}M`;
      if (num >= 1000) return `${(num / 1000).toFixed(1).replace(/\.0$/, "")}K`;
      return String(num);
    }

    function formatElapsedTime(isoStr) {
      if (!isoStr) return "";
      const ms = new Date(isoStr).getTime();
      if (Number.isNaN(ms)) return "";
      const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h`;
      return `${Math.floor(diffSec / 86400)}d`;
    }

    function showToast(msg) {
      const el = document.getElementById("toastBanner");
      if (!el) return;
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window._groupsToastTimer);
      window._groupsToastTimer = setTimeout(() => {
        el.style.display = "none";
      }, 3200);
    }

    function switchGroupsTab(tabName, btnEl) {
      document.querySelectorAll(".sub-tab").forEach((t) => t.classList.remove("active"));
      if (btnEl) {
        btnEl.classList.add("active");
      } else {
        const match = document.querySelector(`.sub-tab[data-tab="${tabName}"]`);
        if (match) match.classList.add("active");
      }

      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      const panel = document.getElementById(`panel-${tabName}`);
      if (panel) panel.classList.add("active");

      if (tabName === "your-groups") renderYourGroupsTab();
      if (tabName === "discover") renderDiscoverTab();
    }

    function updateSortLabelAndRender() {
      const sel = document.getElementById("yourGroupsSort");
      const titleEl = document.getElementById("yourGroupsSortTitle");
      if (sel && titleEl) {
        const label = sel.options[sel.selectedIndex]?.text || "Most visited";
        titleEl.textContent = `Sort by: ${label}`;
      }
      renderYourGroupsTab();
    }

    function togglePinGroup(groupId, ev) {
      if (ev) ev.stopPropagation();
      const key = String(groupId);
      if (pinnedGroupIds.has(key)) {
        pinnedGroupIds.delete(key);
        showToast("Group unpinned");
      } else {
        pinnedGroupIds.add(key);
        showToast("Group pinned");
      }
      renderForYouGroups();
      renderYourGroupsTab();
    }

    function renderForYouGroups() {
      const container = document.getElementById("forYouGroupsList");
      if (!container) return;

      if (!yourGroups.length) {
        container.innerHTML = `<div class="empty-box"><i class="fas fa-users"></i>No joined groups yet</div>`;
        return;
      }

      const pinnedFirst = [...yourGroups].sort(
        (a, b) => Number(pinnedGroupIds.has(String(b.id))) - Number(pinnedGroupIds.has(String(a.id)))
      );

      container.innerHTML = pinnedFirst.slice(0, 6).map((g) => {
        const isPinned = pinnedGroupIds.has(String(g.id));
        const thumbHtml = g.cover
          ? `<img src="${escapeHtml(g.cover)}" alt="${escapeHtml(g.name)}" class="group-thumb" />`
          : `<div class="group-thumb"><i class="fas fa-users"></i></div>`;
        const dotHtml = g.hasDot ? `<span class="status-dot"></span>` : "";

        return `
          <div class="group-row" onclick="showToast('Opened ${escapeHtml(g.name)}')">
            <div class="group-row-left">
              ${thumbHtml}
              <div class="group-meta">
                <div class="group-name">${escapeHtml(g.name)}</div>
                <div class="group-status">${escapeHtml(g.statusText)} ${dotHtml}</div>
              </div>
            </div>
            <button type="button" class="pin-btn ${isPinned ? "pinned" : ""}" title="Pin group" onclick="togglePinGroup('${escapeHtml(g.id)}', event)">
              <i class="fas fa-thumbtack"></i>
            </button>
          </div>
        `;
      }).join("");
    }

    function renderGroupFeedPosts() {
      const container = document.getElementById("fromYourGroupsFeed");
      if (!container) return;

      if (!groupPosts.length) {
        container.innerHTML = `
          <div class="section-card" style="border-bottom:none;">
            <div class="empty-box"><i class="fas fa-newspaper"></i>No group posts available</div>
          </div>
        `;
        return;
      }

      container.innerHTML = groupPosts.map((post) => {
        const validImgs = (post.images || []).filter(Boolean);
        const gridClass = validImgs.length <= 1 ? "post-media-grid single" : "post-media-grid";
        const mediaHtml = validImgs.length
          ? `<div class="${gridClass}">${validImgs.map((src) => `<img src="${escapeHtml(src)}" alt="Group post" />`).join("")}</div>`
          : "";

        const groupAvHtml = post.groupAvatar
          ? `<img src="${escapeHtml(post.groupAvatar)}" alt="${escapeHtml(post.groupName)}" class="post-group-avatar" />`
          : `<div class="post-group-avatar"><i class="fas fa-users"></i></div>`;

        const memberAvHtml = post.memberAvatar
          ? `<img src="${escapeHtml(post.memberAvatar)}" alt="${escapeHtml(post.authorName)}" class="post-member-mini" />`
          : "";

        const actionLabel = post.isMember ? "Joined" : "Join";
        const subMetaParts = [post.authorName, post.timeAgo].filter(Boolean).join(" · ");

        return `
          <article class="feed-post">
            <div class="post-head">
              <div class="post-group-wrap">
                <div class="post-avatar-stack">
                  ${groupAvHtml}
                  ${memberAvHtml}
                </div>
                <div>
                  <div class="post-title-line">
                    <span>${escapeHtml(post.groupName)}</span>
                    <button type="button" class="join-inline-link" onclick="togglePostGroupJoin('${escapeHtml(post.id)}', this)">${actionLabel}</button>
                  </div>
                  <div class="post-sub">
                    ${escapeHtml(subMetaParts)} <i class="fas ${escapeHtml(post.privacyIcon || "fa-globe-americas")}"></i>
                  </div>
                </div>
              </div>
              <div class="post-head-right">
                <button type="button" class="pin-btn" title="More options" onclick="showToast('${escapeHtml(post.groupName)}')">
                  <i class="fas fa-ellipsis-h"></i>
                </button>
                <button type="button" class="pin-btn" title="Hide post" onclick="dismissGroupPost('${escapeHtml(post.id)}')">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
            ${post.caption ? `<div class="post-caption">${escapeHtml(post.caption)}</div>` : ""}
            ${mediaHtml}
          </article>
        `;
      }).join("");
    }

    async function togglePostGroupJoin(postId, btnEl) {
      const targetPost = groupPosts.find((p) => String(p.id) === String(postId));
      if (!targetPost) return;

      const nextJoined = !targetPost.isMember;
      targetPost.isMember = nextJoined;
      if (btnEl) btnEl.textContent = nextJoined ? "Joined" : "Join";

      if (sb && currentUserId && targetPost.groupId) {
        try {
          if (nextJoined) {
            await sb.from("group_members").upsert({ group_id: targetPost.groupId, user_id: currentUserId });
          } else {
            await sb.from("group_members").delete().eq("group_id", targetPost.groupId).eq("user_id", currentUserId);
          }
          await loadSupabaseGroupsAndPosts();
        } catch (_) {}
      }
      showToast(nextJoined ? `Joined ${targetPost.groupName}` : `Left ${targetPost.groupName}`);
    }

    function dismissGroupPost(postId) {
      groupPosts = groupPosts.filter((p) => String(p.id) !== String(postId));
      renderGroupFeedPosts();
      showToast("Post hidden");
    }

    function renderYourGroupsTab() {
      const container = document.getElementById("allYourGroupsList");
      if (!container) return;

      const query = (document.getElementById("yourGroupsSearch")?.value || "").trim().toLowerCase();
      const sortMode = document.getElementById("yourGroupsSort")?.value || "visited";

      let list = yourGroups.filter((g) => !query || g.name.toLowerCase().includes(query));
      if (sortMode === "name") {
        list = [...list].sort((a, b) => a.name.localeCompare(b.name));
      } else if (sortMode === "members") {
        list = [...list].sort((a, b) => (b.membersCount || 0) - (a.membersCount || 0));
      } else {
        list = [...list].sort((a, b) => {
          const pinDiff = Number(pinnedGroupIds.has(String(b.id))) - Number(pinnedGroupIds.has(String(a.id)));
          if (pinDiff !== 0) return pinDiff;
          return (b.visitedScore || 0) - (a.visitedScore || 0);
        });
      }

      if (!list.length) {
        container.innerHTML = `<div class="empty-box"><i class="fas fa-users"></i>No groups found</div>`;
        return;
      }

      container.innerHTML = list.map((g) => {
        const isPinned = pinnedGroupIds.has(String(g.id));
        const thumbHtml = g.cover
          ? `<img src="${escapeHtml(g.cover)}" alt="${escapeHtml(g.name)}" class="group-thumb" />`
          : `<div class="group-thumb"><i class="fas fa-users"></i></div>`;
        const dotHtml = g.hasDot ? `<span class="status-dot"></span>` : "";

        return `
          <div class="group-row" onclick="showToast('Opened ${escapeHtml(g.name)}')">
            <div class="group-row-left">
              ${thumbHtml}
              <div class="group-meta">
                <div class="group-name">${escapeHtml(g.name)}</div>
                <div class="group-status">${escapeHtml(g.statusText)} ${dotHtml}</div>
              </div>
            </div>
            <button type="button" class="pin-btn ${isPinned ? "pinned" : ""}" title="Pin group" onclick="togglePinGroup('${escapeHtml(g.id)}', event)">
              <i class="fas fa-thumbtack"></i>
            </button>
          </div>
        `;
      }).join("");
    }

    function renderDiscoverTab() {
      const grid = document.getElementById("discoverGroupsGrid");
      if (!grid) return;

      const visible = discoverGroups.filter((item) => !dismissedGroupIds.has(String(item.id)));
      if (!visible.length) {
        grid.innerHTML = `<div class="empty-box" style="grid-column: 1 / -1;"><i class="fas fa-compass"></i>No suggested groups available</div>`;
        return;
      }

      grid.innerHTML = visible.map((item) => {
        const coverHtml = item.cover
          ? `<img src="${escapeHtml(item.cover)}" alt="${escapeHtml(item.name)}" />`
          : `<i class="fas fa-users"></i>`;

        const mutualHtml = item.mutualText
          ? `
            <div class="discover-mutual">
              ${item.mutualAvatar ? `<img src="${escapeHtml(item.mutualAvatar)}" alt="Member" />` : ""}
              <span>${escapeHtml(item.mutualText)}</span>
            </div>
          `
          : "";

        return `
          <div class="discover-card">
            <div class="discover-cover-wrap">
              ${coverHtml}
              <button type="button" class="dismiss-card-btn" title="Dismiss" onclick="dismissDiscoverGroup('${escapeHtml(item.id)}')">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="discover-body">
              <div class="discover-title">${escapeHtml(item.name)}</div>
              <div class="discover-meta">${escapeHtml(item.privacy)} · ${escapeHtml(item.membersLabel)}</div>
              ${mutualHtml}
              <button type="button" class="join-btn ${item.joined ? "joined" : ""}" onclick="toggleJoinDiscover('${escapeHtml(item.id)}')">
                ${item.joined ? "Joined" : "Join"}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function dismissDiscoverGroup(id) {
      dismissedGroupIds.add(String(id));
      renderDiscoverTab();
    }

    async function toggleJoinDiscover(id) {
      const target = discoverGroups.find((d) => String(d.id) === String(id));
      if (!target) return;

      const nextJoined = !target.joined;
      target.joined = nextJoined;

      if (sb && currentUserId) {
        try {
          if (nextJoined) {
            await sb.from("group_members").upsert({ group_id: target.id, user_id: currentUserId });
          } else {
            await sb.from("group_members").delete().eq("group_id", target.id).eq("user_id", currentUserId);
          }
          await loadSupabaseGroupsAndPosts();
          showToast(nextJoined ? `Joined ${target.name}` : `Left ${target.name}`);
          return;
        } catch (_) {}
      }

      if (nextJoined) {
        if (!yourGroups.some((g) => String(g.id) === String(target.id))) {
          yourGroups.unshift({
            id: target.id,
            name: target.name,
            statusText: target.membersLabel,
            hasDot: false,
            membersCount: target.membersCount || 1,
            pinned: false,
            visitedScore: 50,
            cover: target.cover || ""
          });
        }
        showToast(`Joined ${target.name}`);
      } else {
        yourGroups = yourGroups.filter((g) => String(g.id) !== String(target.id));
        showToast(`Left ${target.name}`);
      }

      renderForYouGroups();
      renderYourGroupsTab();
      renderDiscoverTab();
    }

    function openCreateGroupModal() {
      document.getElementById("newGroupNameInput").value = "";
      document.getElementById("createGroupModal").classList.add("open");
    }

    function closeCreateGroupModal() {
      document.getElementById("createGroupModal").classList.remove("open");
    }

    async function createNewGroup() {
      const nameInput = document.getElementById("newGroupNameInput");
      const privacyInput = document.getElementById("newGroupPrivacyInput");
      const submitBtn = document.getElementById("createGroupSubmitBtn");
      const groupName = (nameInput?.value || "").trim();
      const privacyVal = privacyInput?.value || "Public group";

      if (!groupName) {
        showToast("Please enter a group name");
        return;
      }

      if (!sb) {
        showToast("Supabase connection required to create a group");
        return;
      }

      if (submitBtn) submitBtn.disabled = true;
      try {
        const payload = {
          name: groupName,
          privacy: privacyVal,
          members_count: 1
        };
        if (currentUserId) {
          payload.owner_id = currentUserId;
          payload.created_by = currentUserId;
        }

        const { data: inserted, error } = await sb
          .from("groups")
          .insert(payload)
          .select("*")
          .maybeSingle();

        if (error) throw error;

        const createdId = inserted?.id || `grp-${Date.now()}`;
        if (currentUserId && inserted?.id) {
          try {
            await sb.from("group_members").upsert({
              group_id: inserted.id,
              user_id: currentUserId
            });
          } catch (_) {}
        }

        pinnedGroupIds.add(String(createdId));
        closeCreateGroupModal();
        await loadSupabaseGroupsAndPosts();
        showToast(`Created "${groupName}"`);
      } catch (err) {
        console.error("Create group error:", err);
        showToast("Could not create group");
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    /* Popover Controls */

        !e.target.closest("#createMenuBtn") &&
        !e.target.closest("#morePopover") &&
        !e.target.closest("#moreMenuBtn")
      ) {
        closeAllPopovers();
      }
    });

    /* Real Account Age Check via Supabase for 2-Month Live Lock */
    async function syncSupabaseUserAndAccountAge() {
      let createdIso = null;
      let avatarUrl = "";

      if (sb) {
        try {
          const { data: sessionRes } = await sb.auth.getSession();
          let authUser = sessionRes?.session?.user || null;

          if (!authUser) {
            const { data: userRes } = await sb.auth.getUser();
            authUser = userRes?.user || null;
          }

          if (authUser) {
            currentUserId = authUser.id;
            createdIso = authUser.created_at || null;
          }

          if (currentUserId) {
            const { data: profileRow } = await sb
              .from("profiles")
              .select("id, avatar_url, created_at")
              .eq("id", currentUserId)
              .maybeSingle();

            if (profileRow) {
              if (profileRow.avatar_url) avatarUrl = profileRow.avatar_url;
              if (profileRow.created_at) createdIso = profileRow.created_at;
            }
          }
        } catch (e) {
          console.warn("Supabase user sync warning:", e);
        }
      }

      const avImg = document.getElementById("bottomProfileAvatar");
      if (avImg) {
        if (avatarUrl) {
          avImg.src = avatarUrl;
          avImg.classList.add("has-img");
        } else {
          avImg.removeAttribute("src");
          avImg.classList.remove("has-img");
        }
      }

      const badge = document.getElementById("liveAgeBadge");
      if (createdIso) {
        const parsedMs = new Date(createdIso).getTime();
        if (!Number.isNaN(parsedMs)) {
          accountCreatedAtMs = parsedMs;
          const elapsedDays = Math.max(0, Math.floor((Date.now() - parsedMs) / (1000 * 60 * 60 * 24)));
          if (badge) {
            badge.textContent = elapsedDays >= TWO_MONTHS_DAYS
              ? `${elapsedDays}d`
              : `${elapsedDays}/${TWO_MONTHS_DAYS}d`;
          }
        }
      } else if (badge) {
        badge.textContent = `0/${TWO_MONTHS_DAYS}d`;
      }
    }

    async function handleLiveClick() {
      if (!accountCreatedAtMs) {
        await syncSupabaseUserAndAccountAge();
      }

      if (!accountCreatedAtMs || Number.isNaN(accountCreatedAtMs)) {
        showToast("Live locked for new accounts: 2 months (60 days) required.");
        return;
      }

      const elapsedMs = Date.now() - accountCreatedAtMs;
      const elapsedDays = Math.floor(elapsedMs / (1000 * 60 * 60 * 24));

      if (elapsedMs < TWO_MONTHS_MS) {
        const remainingDays = Math.max(1, Math.ceil((TWO_MONTHS_MS - elapsedMs) / (1000 * 60 * 60 * 24)));
        showToast(`Live locked for 2 months (${elapsedDays}d active · ${remainingDays}d left).`);
        return;
      }

      const roomName = currentUserId ? `autro-live-${currentUserId}` : "autro-live-room";
      const targetUrl = `public/lives.html?wss=${encodeURIComponent(LIVEKIT_WSS_URL)}&room=${encodeURIComponent(roomName)}`;
      window.location.href = targetUrl;
    }

    /* Load Groups & Group Posts Exclusively from Supabase */
    async function loadSupabaseGroupsAndPosts() {
      if (!sb) {
        yourGroups = [];
        discoverGroups = [];
        groupPosts = [];
        renderForYouGroups();
        renderYourGroupsTab();
        renderDiscoverTab();
        renderGroupFeedPosts();
        return;
      }

      try {
        const { data: groupsRows, error: groupsErr } = await sb
          .from("groups")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(50);

        if (groupsErr) throw groupsErr;
        const allGroups = Array.isArray(groupsRows) ? groupsRows : [];

        let memberGroupIds = new Set();
        if (currentUserId) {
          const { data: memRows } = await sb
            .from("group_members")
            .select("group_id")
            .eq("user_id", currentUserId);

          if (Array.isArray(memRows)) {
            memRows.forEach((m) => {
              if (m.group_id) memberGroupIds.add(String(m.group_id));
            });
          }
        }

        allGroups.forEach((g) => {
          const ownerId = g.owner_id || g.created_by || g.user_id;
          if (currentUserId && ownerId && String(ownerId) === String(currentUserId)) {
            memberGroupIds.add(String(g.id));
          }
        });

        const groupMap = new Map();
        const mappedYour = [];
        const mappedDiscover = [];

        allGroups.forEach((row, idx) => {
          const id = String(row.id || `grp-${idx}`);
          const name = row.name || row.title || "Group";
          const privacy = row.privacy || (row.is_private ? "Private group" : "Public group");
          const membersCount = Number(row.members_count ?? row.member_count ?? 0);
          const newPostsCount = Number(row.new_posts_count ?? row.unread_posts ?? 0);
          const cover = row.cover_url || row.avatar_url || row.image_url || "";

          groupMap.set(id, { id, name, privacy, membersCount, cover });

          const statusText = newPostsCount > 0
            ? `${formatCompactNumber(newPostsCount)}+ new posts`
            : `${formatCompactNumber(membersCount)} members`;

          if (memberGroupIds.has(id)) {
            mappedYour.push({
              id,
              name,
              statusText,
              hasDot: newPostsCount > 0,
              membersCount,
              visitedScore: 100 - idx,
              cover
            });
          } else {
            mappedDiscover.push({
              id,
              name,
              privacy,
              membersLabel: `${formatCompactNumber(membersCount)} members`,
              membersCount,
              mutualText: row.mutual_text || "",
              mutualAvatar: row.mutual_avatar || "",
              cover,
              joined: false
            });
          }
        });

        yourGroups = mappedYour;
        discoverGroups = mappedDiscover;

        const { data: postsRows, error: postsErr } = await sb
          .from("group_posts")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(30);

        if (!postsErr && Array.isArray(postsRows)) {
          groupPosts = postsRows.map((p, idx) => {
            const gId = String(p.group_id || "");
            const grpInfo = groupMap.get(gId) || {};
            const imgs = [];
            if (Array.isArray(p.images)) {
              p.images.forEach((u) => { if (u) imgs.push(u); });
            }
            const singleMedia = p.media_url || p.image_url || "";
            if (singleMedia && !imgs.includes(singleMedia)) imgs.push(singleMedia);

            return {
              id: String(p.id || `gpost-${idx}`),
              groupId: gId,
              groupName: p.group_name || grpInfo.name || "Group",
              isMember: memberGroupIds.has(gId),
              authorName: p.author_name || "",
              timeAgo: formatElapsedTime(p.created_at),
              privacyIcon: p.privacy === "private" ? "fa-lock" : "fa-globe-americas",
              caption: p.content || p.caption || p.text || "",
              groupAvatar: p.group_avatar || grpInfo.cover || "",
              memberAvatar: p.author_avatar || "",
              images: imgs
            };
          });
        } else {
          groupPosts = [];
        }
      } catch (err) {
        console.warn("Supabase groups/posts load error:", err);
        yourGroups = [];
        discoverGroups = [];
        groupPosts = [];
      }

      renderForYouGroups();
      renderYourGroupsTab();
      renderDiscoverTab();
      renderGroupFeedPosts();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      renderForYouGroups();
      renderYourGroupsTab();
      renderDiscoverTab();
      renderGroupFeedPosts();
      await syncSupabaseUserAndAccountAge();
      await loadSupabaseGroupsAndPosts();
    });
  </script>
</body>
  </html>
