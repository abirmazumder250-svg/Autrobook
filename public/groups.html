<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Groups</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --surface: #f3f4f6;
      --card: #FFFFFF;
      --elevated: #FFFFFF;
      --text: #202124;
      --muted: #5f6368;
      --border: #e5e7eb;
      --accent: #14532d;
      --accent-hover: #0f3f22;
      --pill-active-bg: rgba(20, 83, 45, 0.16);
      --pill-active-text: #14532d;
      --btn-secondary: #eef0f2;
      --btn-secondary-hover: #e2e5e9;
      --shadow: 0 8px 24px rgba(32, 33, 36, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #292a2d;
        --card: #202124;
        --elevated: #292a2d;
        --text: #FFFFFF;
        --muted: #b0b7c0;
        --border: #383a3f;
        --accent: #14532d;
        --accent-hover: #166534;
        --pill-active-bg: rgba(56, 116, 203, 0.28);
        --pill-active-text: #8ab4f8;
        --btn-secondary: #303134;
        --btn-secondary-hover: #3c4043;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--btn-secondary);
      color: var(--text);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.12s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--btn-secondary-hover);
    }

    .page-title {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    /* Sub Tabs */
    .sub-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-tabs::-webkit-scrollbar {
      display: none;
    }

    .sub-tab {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sub-tab:hover {
      background: var(--surface);
    }

    .sub-tab.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    /* Main Content */
    .main-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .see-all-link {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--pill-active-text);
      text-decoration: none;
    }

    .empty-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .empty-card i {
      font-size: 28px;
      color: var(--muted);
      opacity: 0.85;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      z-index: 80;
    }

    .nav-link {
      height: 100%;
      color: var(--muted);
      font-size: 20px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-link.active {
      color: var(--pill-active-text);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2.5px;
      background: var(--pill-active-text);
      border-radius: 2px 2px 0 0;
    }

    .nav-profile-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      border: 2px solid var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text);
    }

    .nav-profile-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .nav-profile-ring img.has-img {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="top-bar">
      <div class="top-left">
        <a href="shortcut.html" class="icon-btn" title="Menu" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
        <h1 class="page-title">Groups</h1>
      </div>

      <div class="top-actions">
        <a href="create-group.html" class="icon-btn" title="Create group" aria-label="Create group">
          <i class="fas fa-plus"></i>
        </a>
        <a href="search.html" class="icon-btn" title="Search" aria-label="Search">
          <i class="fas fa-search"></i>
        </a>
        <a href="groups-settings.html" class="icon-btn" title="Settings" aria-label="Settings">
          <i class="fas fa-ellipsis-h"></i>
        </a>
      </div>
    </div>

    <div class="sub-tabs" role="tablist">
      <button type="button" class="sub-tab active" onclick="switchGroupTab('for-you', this)">For you</button>
      <button type="button" class="sub-tab" onclick="switchGroupTab('your-groups', this)">Your groups</button>
      <button type="button" class="sub-tab" onclick="switchGroupTab('discover', this)">Discover</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <section class="section-block">
      <div class="section-header">
        <h2 class="section-title">Your groups</h2>
        <a href="your-groups.html" class="see-all-link">See all</a>
      </div>
      <div class="empty-card" id="yourGroupsBox">
        <i class="fas fa-users"></i>
        <span>No joined groups yet</span>
      </div>
    </section>

    <section class="section-block">
      <div class="empty-card" id="groupPostsBox">
        <i class="far fa-newspaper"></i>
        <span>No group posts available</span>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" aria-label="Primary navigation">
    <a href="index.html" class="nav-link" title="Home" aria-label="Home">
      <i class="fas fa-home"></i>
    </a>
    <a href="reels.html" class="nav-link" title="Reels" aria-label="Reels">
      <i class="fas fa-clapperboard"></i>
    </a>
    <a href="friends.html" class="nav-link" title="Friends" aria-label="Friends">
      <i class="fas fa-user-friends"></i>
    </a>
    <a href="games.html" class="nav-link" title="Games" aria-label="Games">
      <i class="fas fa-gamepad"></i>
    </a>
    <a href="groups.html" class="nav-link active" title="Groups" aria-label="Groups">
      <i class="fas fa-users"></i>
    </a>
    <a href="notifications.html" class="nav-link" title="Notifications" aria-label="Notifications">
      <i class="fas fa-bell"></i>
    </a>
    <a href="profile.html" class="nav-link" title="Profile" aria-label="Profile">
      <span class="nav-profile-ring" id="bottomProfileRing">
        <img id="bottomProfileAvatar" alt="Profile" />
        <i class="fas fa-user" id="bottomProfileFallback"></i>
      </span>
    </a>
  </nav>

  <script>
    const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

    const sb = (window.supabase && typeof window.supabase.createClient === "function")
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    function switchGroupTab(tabName, btnEl) {
      document.querySelectorAll(".sub-tab").forEach((b) => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
    }

    async function syncBottomProfileAvatar() {
      let avatarUrl = localStorage.getItem("autro_profile_avatar") || "";

      if (sb) {
        try {
          const { data: userRes } = await sb.auth.getUser();
          const uid = userRes?.user?.id || localStorage.getItem("autro_user_id");
          if (uid) {
            const { data: prof } = await sb
              .from("profiles")
              .select("avatar_url")
              .eq("id", uid)
              .maybeSingle();
            if (prof?.avatar_url) {
              avatarUrl = prof.avatar_url;
              localStorage.setItem("autro_profile_avatar", avatarUrl);
            }
          }
        } catch (e) {}
      }

      const img = document.getElementById("bottomProfileAvatar");
      const fallback = document.getElementById("bottomProfileFallback");
      if (img && avatarUrl) {
        img.src = avatarUrl;
        img.classList.add("has-img");
        if (fallback) fallback.style.display = "none";
      } else if (fallback) {
        fallback.style.display = "inline-block";
      }
    }

    document.addEventListener("DOMContentLoaded", syncBottomProfileAvatar);
  </script>
</body>
</html>
