<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Groups — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="profile.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --surface: #f3f4f6;
      --card: #FFFFFF;
      --elevated: #FFFFFF;
      --text: #202124;
      --muted: #5f6368;
      --border: #e5e7eb;
      --accent: #0B3D20;
      --accent-hover: #0a7d3b;
      --pill-active-bg: rgba(10, 125, 59, 0.16);
      --pill-active-text: #0a7d3b;
      --btn-secondary: #eef0f2;
      --btn-secondary-hover: #e2e5e9;
      --shadow: 0 8px 24px rgba(32, 33, 36, 0.14);
    }

    :root[data-theme="dark"],
    body.dark-theme {
      color-scheme: dark;
      --bg: #202124;
      --surface: #292a2d;
      --card: #202124;
      --elevated: #292a2d;
      --text: #FFFFFF;
      --muted: #b0b7c0;
      --border: #383a3f;
      --accent: #0B3D20;
      --accent-hover: #0a7d3b;
      --pill-active-bg: rgba(16, 185, 129, 0.22);
      --pill-active-text: #34d399;
      --btn-secondary: #303134;
      --btn-secondary-hover: #3c4043;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #202124;
        --surface: #292a2d;
        --card: #202124;
        --elevated: #292a2d;
        --text: #FFFFFF;
        --muted: #b0b7c0;
        --border: #383a3f;
        --accent: #0B3D20;
        --accent-hover: #0a7d3b;
        --pill-active-bg: rgba(16, 185, 129, 0.22);
        --pill-active-text: #34d399;
        --btn-secondary: #303134;
        --btn-secondary-hover: #3c4043;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--btn-secondary);
      color: var(--text);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.12s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--btn-secondary-hover);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .page-title {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    /* Sub Tabs */
    .sub-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-tabs::-webkit-scrollbar {
      display: none;
    }

    .sub-tab {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sub-tab:hover {
      background: var(--surface);
    }

    .sub-tab.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    /* Three-dot Dropdown Popover */
    .popover-menu {
      position: fixed;
      top: 56px;
      right: 14px;
      min-width: 220px;
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 8px;
      z-index: 120;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .popover-menu.open {
      display: flex;
    }

    .popover-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .popover-item:hover {
      background: var(--surface);
    }

    .popover-item i {
      width: 22px;
      text-align: center;
      font-size: 17px;
      color: var(--text);
    }

    /* Plus Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      z-index: 150;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 680px;
      background: var(--elevated);
      color: var(--text);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      border-top: 1px solid var(--border);
      padding: 10px 14px 24px;
      box-shadow: var(--shadow);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--muted);
      opacity: 0.45;
      margin: 0 auto 14px;
    }

    .sheet-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s ease;
    }

    .sheet-option:hover {
      background: var(--surface);
    }

    .sheet-option-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text);
      flex-shrink: 0;
    }

    .sheet-option-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }

    .sheet-option-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Main Content */
    .main-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .see-all-link {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--pill-active-text);
      text-decoration: none;
    }

    .group-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .group-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .group-thumb {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--pill-active-text);
      flex-shrink: 0;
      overflow: hidden;
    }

    .group-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .group-info {
      min-width: 0;
      flex: 1;
    }

    .group-card-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-card-meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .empty-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .empty-card i {
      font-size: 28px;
      color: var(--muted);
      opacity: 0.85;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      z-index: 80;
    }

    .nav-link {
      height: 100%;
      color: var(--muted);
      font-size: 20px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-link.active {
      color: var(--pill-active-text);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 2.5px;
      background: var(--pill-active-text);
      border-radius: 2px 2px 0 0;
    }

    .nav-profile-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      border: 2px solid var(--accent-hover);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text);
    }

    .nav-profile-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .nav-profile-ring img.has-img {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="top-bar">
      <div class="top-left">
        <a href="shortcut.html" class="icon-btn" title="Menu" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
        <h1 class="page-title">Groups</h1>
      </div>

      <div class="top-actions">
        <button type="button" class="icon-btn" id="plusActionBtn" title="Create" aria-label="Create" onclick="toggleCreateSheet(event)">
          <i class="fas fa-plus"></i>
        </button>
        <a href="search-groups.html" class="icon-btn" title="Search groups" aria-label="Search groups">
          <i class="fas fa-search"></i>
        </a>
        <button type="button" class="icon-btn" id="moreActionBtn" title="More options" aria-label="More options" onclick="toggleMoreMenu(event)">
          <i class="fas fa-ellipsis-h"></i>
        </button>
      </div>
    </div>

    <div class="sub-tabs" role="tablist">
      <button type="button" class="sub-tab active" data-tab="for-you" onclick="switchGroupTab('for-you', this)">For you</button>
      <button type="button" class="sub-tab" data-tab="your-groups" onclick="switchGroupTab('your-groups', this)">Your groups</button>
      <button type="button" class="sub-tab" data-tab="discover" onclick="switchGroupTab('discover', this)">Discover</button>
    </div>
  </header>

  <!-- Three-dot Popover Menu -->
  <div id="moreMenuPopover" class="popover-menu" role="menu">
    <a href="invites.html" class="popover-item" role="menuitem">
      <i class="fas fa-envelope-open-text"></i>
      <span>Invites</span>
    </a>
    <a href="membership.html" class="popover-item" role="menuitem">
      <i class="fas fa-arrow-right-from-bracket"></i>
      <span>Membership</span>
    </a>
    <a href="groups-settings.html" class="popover-item" role="menuitem">
      <i class="fas fa-cog"></i>
      <span>Groups settings</span>
    </a>
  </div>

  <!-- Plus Bottom Sheet Modal -->
  <div id="createSheetBackdrop" class="sheet-backdrop" onclick="closeCreateSheetOnBackdrop(event)">
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Create options">
      <div class="sheet-handle"></div>
      <a href="create-post.html" class="sheet-option">
        <span class="sheet-option-icon"><i class="far fa-edit"></i></span>
        <span>
          <div class="sheet-option-title">Create a post</div>
          <div class="sheet-option-sub">Post in a group you've joined.</div>
        </span>
      </a>
      <a href="groups-post.html" class="sheet-option">
        <span class="sheet-option-icon"><i class="fas fa-users-cog"></i></span>
        <span>
          <div class="sheet-option-title">Create a group</div>
          <div class="sheet-option-sub">Create a public or private group.</div>
        </span>
      </a>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main-container">
    <section class="section-block" id="yourGroupsSection">
      <div class="section-header">
        <h2 class="section-title" id="primarySectionTitle">Your groups</h2>
        <a href="your-groups.html" class="see-all-link">See all</a>
      </div>
      <div class="group-list" id="yourGroupsBox">
        <div class="empty-card">
          <i class="fas fa-users"></i>
          <span>No joined groups yet</span>
        </div>
      </div>
    </section>

    <section class="section-block" id="groupPostsSection">
      <div class="section-header">
        <h2 class="section-title">From your groups</h2>
      </div>
      <div class="group-list" id="groupPostsBox">
        <div class="empty-card">
          <i class="far fa-newspaper"></i>
          <span>No group posts available</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" aria-label="Primary navigation">
    <a href="index.html" class="nav-link" title="Home" aria-label="Home">
      <i class="fas fa-home"></i>
    </a>
    <a href="reels.html" class="nav-link" title="Reels" aria-label="Reels">
      <i class="fas fa-clapperboard"></i>
    </a>
    <a href="friends.html" class="nav-link" title="Friends" aria-label="Friends">
      <i class="fas fa-user-friends"></i>
    </a>
    <a href="games.html" class="nav-link" title="Games" aria-label="Games">
      <i class="fas fa-gamepad"></i>
    </a>
    <a href="groups.html" class="nav-link active" title="Groups" aria-label="Groups">
      <i class="fas fa-users"></i>
    </a>
    <a href="notifications.html" class="nav-link" title="Notifications" aria-label="Notifications">
      <i class="fas fa-bell"></i>
    </a>
    <a href="profile.html" class="nav-link" title="Profile" aria-label="Profile">
      <span class="nav-profile-ring" id="bottomProfileRing">
        <img id="bottomProfileAvatar" alt="Profile" />
        <i class="fas fa-user" id="bottomProfileFallback"></i>
      </span>
    </a>
  </nav>

  <script src="index.js"></script>
  <script src="profile.js"></script>
  <script>
    const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

    const sb = (window.supabase && typeof window.supabase.createClient === "function")
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    let currentTab = "for-you";
    let loadedGroups = [];
    let joinedIds = new Set();

    function escapeHtml(val) {
      return String(val ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function closeMoreMenu() {
      document.getElementById("moreMenuPopover")?.classList.remove("open");
    }

    function toggleMoreMenu(e) {
      e.stopPropagation();
      closeCreateSheet();
      document.getElementById("moreMenuPopover")?.classList.toggle("open");
    }

    function openCreateSheet() {
      closeMoreMenu();
      document.getElementById("createSheetBackdrop")?.classList.add("open");
    }

    function closeCreateSheet() {
      document.getElementById("createSheetBackdrop")?.classList.remove("open");
    }

    function closeCreateSheetOnBackdrop(e) {
      if (e.target && e.target.id === "createSheetBackdrop") {
        closeCreateSheet();
      }
    }

    function toggleCreateSheet(e) {
      e.stopPropagation();
      const sheet = document.getElementById("createSheetBackdrop");
      if (sheet?.classList.contains("open")) {
        closeCreateSheet();
      } else {
        openCreateSheet();
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#moreMenuPopover") && !e.target.closest("#moreActionBtn")) {
        closeMoreMenu();
      }
    });

    function renderGroupsSections() {
      const box = document.getElementById("yourGroupsBox");
      const titleEl = document.getElementById("primarySectionTitle");
      if (!box) return;

      let list = loadedGroups;
      if (currentTab === "your-groups") {
        if (titleEl) titleEl.textContent = "Your groups";
        list = loadedGroups.filter((g) => joinedIds.has(String(g.id)));
      } else if (currentTab === "discover") {
        if (titleEl) titleEl.textContent = "Discover groups";
        list = loadedGroups;
      } else {
        if (titleEl) titleEl.textContent = "Your groups";
        const joinedOnly = loadedGroups.filter((g) => joinedIds.has(String(g.id)));
        list = joinedOnly.length ? joinedOnly : loadedGroups;
      }

      if (!list.length) {
        box.innerHTML = `
          <div class="empty-card">
            <i class="fas fa-users"></i>
            <span>No joined groups yet</span>
          </div>
        `;
        return;
      }

      box.innerHTML = list.map((g) => {
        const name = String(g.name || g.title || "Group");
        const initial = escapeHtml(name.trim().charAt(0).toUpperCase() || "G");
        const avatar = g.avatar_url || g.cover_url || "";
        const members = g.members_count ?? g.member_count;
        const subText = members ? `${members} members` : (g.category || "Group");
        const href = g.id !== undefined ? `group.html?id=${encodeURIComponent(g.id)}` : "groups.html";

        return `
          <a href="${escapeHtml(href)}" class="group-card">
            <div class="group-card-left">
              <div class="group-thumb">
                ${avatar ? `<img src="${escapeHtml(avatar)}" alt="${escapeHtml(name)}" onerror="this.remove(); this.parentElement.textContent='${initial}';" />` : initial}
              </div>
              <div class="group-info">
                <div class="group-card-title">${escapeHtml(name)}</div>
                <div class="group-card-meta">${escapeHtml(subText)}</div>
              </div>
            </div>
            <i class="fas fa-chevron-right" style="color: var(--muted); font-size: 13px;"></i>
          </a>
        `;
      }).join("");
    }

    function switchGroupTab(tabName, btnEl) {
      currentTab = tabName;
      document.querySelectorAll(".sub-tab").forEach((b) => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      renderGroupsSections();
    }

    async function loadGroupsAndProfile() {
      let avatarUrl = localStorage.getItem("autro_profile_avatar") || "";

      if (sb) {
        try {
          const { data: sessionData } = await sb.auth.getSession();
          const uid = sessionData?.session?.user?.id || localStorage.getItem("autro_user_id") || null;

          if (uid) {
            const { data: prof } = await sb
              .from("profiles")
              .select("avatar_url")
              .eq("id", uid)
              .maybeSingle();
            if (prof?.avatar_url) {
              avatarUrl = prof.avatar_url;
              localStorage.setItem("autro_profile_avatar", avatarUrl);
            }

            const { data: memberRows } = await sb
              .from("group_members")
              .select("group_id")
              .eq("user_id", uid);
            if (Array.isArray(memberRows)) {
              joinedIds = new Set(memberRows.map((r) => String(r.group_id)));
            }
          }

          const { data: groupsRows } = await sb
            .from("groups")
            .select("*")
            .order("created_at", { ascending: false });

          if (Array.isArray(groupsRows)) {
            loadedGroups = groupsRows;
          }
        } catch (e) {
          console.warn("Groups sync warning:", e);
        }
      }

      const img = document.getElementById("bottomProfileAvatar");
      const fallback = document.getElementById("bottomProfileFallback");
      if (img && avatarUrl) {
        img.src = avatarUrl;
        img.classList.add("has-img");
        if (fallback) fallback.style.display = "none";
      } else if (fallback) {
        fallback.style.display = "inline-block";
      }

      renderGroupsSections();
    }

    document.addEventListener("DOMContentLoaded", loadGroupsAndProfile);
  </script>
</body>
      </html>
