<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Select workplace</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: #202124;
      --bg-surface: #202124;
      --bg-card: #2c2d31;
      --bg-card-hover: #35363b;
      --text-primary: #f1f3f4;
      --text-secondary: #9aa0a6;
      --border-color: #3c4043;
      --accent-green: #0b5d34;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-card: #f5f6f8;
        --bg-card-hover: #eaecf0;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --border-color: #dadce0;
        --accent-green: #0b5d34;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP HEADER */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 20px;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.12s ease;
    }

    .back-btn:hover {
      background: var(--bg-card);
    }

    .back-btn:active {
      transform: scale(0.94);
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    /* SEARCH ROW */
    .search-wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-surface);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border-color);
      transition: border-color 0.16s ease;
    }

    .search-row:focus-within {
      border-bottom-color: var(--accent-green);
    }

    .search-icon {
      color: var(--text-secondary);
      font-size: 17px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      outline: none;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .clear-search-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .clear-search-btn.visible {
      display: inline-flex;
    }

    /* LIST */
    .results-container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 8px 0 36px;
      display: flex;
      flex-direction: column;
    }

    .place-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .place-item:hover {
      background: var(--bg-card);
    }

    .place-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .place-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .place-name {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .place-meta {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-add-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-green);
      flex-shrink: 0;
    }

    .empty-state {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="checklist.html" class="back-btn" aria-label="Back to checklist" title="Back">
      <i class="fas fa-arrow-left"></i>
    </a>
    <h1 class="topbar-title">Select workplace</h1>
  </header>

  <div class="search-wrap">
    <div class="search-row">
      <i class="fas fa-magnifying-glass search-icon"></i>
      <input
        type="text"
        id="workplaceSearchInput"
        class="search-input"
        placeholder="Select workplace"
        autocomplete="off"
        oninput="handleSearchChange()"
      />
      <button type="button" id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()" aria-label="Clear search">
        <i class="fas fa-xmark"></i>
      </button>
    </div>
  </div>

  <main id="resultsContainer" class="results-container"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    const CHECKLIST_SELECTED_KEY = 'autro_selected_employer';

    const GLOBAL_OFFICES = [
      // Bangladesh
      { name: 'Grameenphone Ltd.', location: 'Dhaka, Bangladesh' },
      { name: 'Robi Axiata Limited', location: 'Dhaka, Bangladesh' },
      { name: 'Banglalink Digital Communications', location: 'Dhaka, Bangladesh' },
      { name: 'bKash Limited', location: 'Dhaka, Bangladesh' },
      { name: 'Nagad', location: 'Dhaka, Bangladesh' },
      { name: 'Pathao Ltd.', location: 'Dhaka, Bangladesh' },
      { name: 'BRAC', location: 'Dhaka, Bangladesh' },
      { name: 'Square Pharmaceuticals PLC', location: 'Dhaka, Bangladesh' },
      { name: 'Beximco Pharmaceuticals Ltd.', location: 'Dhaka, Bangladesh' },
      { name: 'Walton Hi-Tech Industries PLC', location: 'Gazipur / Dhaka, Bangladesh' },
      { name: 'Pran-RFL Group', location: 'Dhaka, Bangladesh' },
      { name: 'Bashundhara Group', location: 'Dhaka, Bangladesh' },
      { name: 'Brain Station 23', location: 'Dhaka, Bangladesh' },
      { name: 'Therap (BD) Ltd.', location: 'Dhaka, Bangladesh' },
      { name: 'BJIT Limited', location: 'Dhaka, Bangladesh' },
      { name: 'Enosis Solutions', location: 'Dhaka, Bangladesh' },
      { name: 'Tiger IT Bangladesh Ltd.', location: 'Dhaka, Bangladesh' },
      { name: 'Chaldal Limited', location: 'Dhaka, Bangladesh' },
      { name: 'Shikho', location: 'Dhaka, Bangladesh' },
      { name: '10 Minute School', location: 'Dhaka, Bangladesh' },
      { name: 'The City Bank PLC', location: 'Dhaka, Bangladesh' },
      { name: 'BRAC Bank PLC', location: 'Dhaka, Bangladesh' },
      { name: 'Eastern Bank PLC (EBL)', location: 'Dhaka, Bangladesh' },
      { name: 'Dutch-Bangla Bank PLC', location: 'Dhaka, Bangladesh' },
      { name: 'Summit Group', location: 'Dhaka, Bangladesh' },
      { name: 'AkijBashir Group', location: 'Dhaka, Bangladesh' },
      { name: 'Apex Footwear Limited', location: 'Dhaka, Bangladesh' },
      { name: 'Biman Bangladesh Airlines', location: 'Dhaka, Bangladesh' },
      { name: 'icddr,b', location: 'Mohakhali, Dhaka, Bangladesh' },

      // Global / International
      { name: 'Google', location: 'Mountain View, CA, USA' },
      { name: 'Meta', location: 'Menlo Park, CA, USA' },
      { name: 'Microsoft', location: 'Redmond, WA, USA' },
      { name: 'Apple', location: 'Cupertino, CA, USA' },
      { name: 'Amazon', location: 'Seattle, WA, USA' },
      { name: 'Netflix', location: 'Los Gatos, CA, USA' },
      { name: 'Tesla', location: 'Austin, TX, USA' },

      { name: 'Samsung Electronics', location: 'Suwon, South Korea' },
      { name: 'Sony Group', location: 'Tokyo, Japan' },
      { name: 'Toyota Motor Corporation', location: 'Toyota City, Japan' },
      { name: 'Unilever', location: 'London, United Kingdom' },
      { name: 'HSBC', location: 'London, United Kingdom' },
      { name: 'Barclays', location: 'London, United Kingdom' },
      { name: 'Siemens', location: 'Munich, Germany' },
      { name: 'SAP', location: 'Walldorf, Germany' },
      { name: 'Shopify', location: 'Ottawa, Canada' },
      { name: 'Stripe', location: 'South San Francisco, CA, USA' },
      { name: 'Airbnb', location: 'San Francisco, CA, USA' },
      { name: 'Uber', location: 'San Francisco, CA, USA' },
      { name: 'Spotify', location: 'Stockholm, Sweden' },
      { name: 'Tata Consultancy Services (TCS)', location: 'Mumbai, India' },
      { name: 'Infosys', location: 'Bengaluru, India' },
      { name: 'Wipro', location: 'Bengaluru, India' },
      { name: 'Alibaba Group', location: 'Hangzhou, China' },
      { name: 'Tencent', location: 'Shenzhen, China' },
      { name: 'Grab', location: 'Singapore' },
      { name: 'Sea Limited', location: 'Singapore' },
      { name: 'Emirates', location: 'Dubai, United Arab Emirates' }
    ];

    let allWorkplaces = [...GLOBAL_OFFICES];

    async function loadWorkplacesFromSupabase() {
      if (!sb) return;
      try {
        const { data, error } = await sb
          .from('workplaces')
          .select('name, location')
          .limit(200);

        if (!error && Array.isArray(data) && data.length) {
          const dbItems = data
            .filter((row) => row && row.name)
            .map((row) => ({
              name: String(row.name).trim(),
              location: String(row.location || 'Office').trim()
            }));

          const seen = new Set(dbItems.map((i) => i.name.toLowerCase()));
          const merged = [
            ...dbItems,
            ...GLOBAL_OFFICES.filter((g) => !seen.has(g.name.toLowerCase()))
          ];
          allWorkplaces = merged;
          renderResults();
        }
      } catch (_) {}
    }

    function selectWorkplace(placeName) {
      const cleanName = String(placeName || '').trim();
      if (!cleanName) return;

      try {
        localStorage.setItem(CHECKLIST_SELECTED_KEY, cleanName);
        sessionStorage.setItem(CHECKLIST_SELECTED_KEY, cleanName);
      } catch (_) {}

      window.location.href = `new-job.html?employer=${encodeURIComponent(cleanName)}`;
    }

    function renderResults() {
      const inputEl = document.getElementById('workplaceSearchInput');
      const container = document.getElementById('resultsContainer');
      const query = inputEl.value.trim();
      const qLower = query.toLowerCase();

      container.innerHTML = '';

      if (!query) {
        return;
      }

      const matches = allWorkplaces.filter(
        (item) =>
          item.name.toLowerCase().includes(qLower) ||
          item.location.toLowerCase().includes(qLower)
      );

      const exactExists = matches.some((m) => m.name.toLowerCase() === qLower);

      if (!exactExists) {
        const customBtn = document.createElement('button');
        customBtn.type = 'button';
        customBtn.className = 'place-item';
        customBtn.onclick = () => selectWorkplace(query);
        customBtn.innerHTML = `
          <span class="place-icon-box"><i class="fas fa-plus"></i></span>
          <span class="place-info">
            <span class="place-name">${escapeHtml(query)}</span>
            <span class="place-meta">Use custom workplace</span>
          </span>
          <span class="custom-add-badge">Select</span>
        `;
        container.appendChild(customBtn);
      }

      matches.slice(0, 30).forEach((place) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'place-item';
        btn.onclick = () => selectWorkplace(place.name);
        btn.innerHTML = `
          <span class="place-icon-box"><i class="far fa-building"></i></span>
          <span class="place-info">
            <span class="place-name">${escapeHtml(place.name)}</span>
            <span class="place-meta">${escapeHtml(place.location)}</span>
          </span>
        `;
        container.appendChild(btn);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function handleSearchChange() {
      const val = document.getElementById('workplaceSearchInput').value;
      document.getElementById('clearSearchBtn').classList.toggle('visible', val.length > 0);
      renderResults();
    }

    function clearSearch() {
      const inputEl = document.getElementById('workplaceSearchInput');
      inputEl.value = '';
      document.getElementById('clearSearchBtn').classList.remove('visible');
      renderResults();
      inputEl.focus();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderResults();
      loadWorkplacesFromSupabase();
    });
  </script>
</body>
</html>
