<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactions</title>
<style>
  :root {
    --bg-primary: #202124;
    --bg-elevated: #292a2d;
    --bg-pill: #303134;
    --bg-pill-active: #394457;
    --text-primary: #FFFFFF;
    --text-secondary: #bdc1c6;
    --accent-blue: #8ab4f8;
    --dark-green: #1b5e20;
    --dark-green-hover: #2e7d32;
    --border-color: #3c4043;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    padding-bottom: 56px;
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .back-btn {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 22px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }

  .back-btn:hover {
    background-color: var(--bg-elevated);
  }

  .header-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .icon-btn:hover {
    background-color: var(--bg-elevated);
  }

  .search-bar {
    display: none;
    padding: 8px 16px 12px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
  }

  .search-bar.open {
    display: block;
  }

  .search-input {
    width: 100%;
    padding: 9px 14px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
  }

  .tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg-primary);
  }

  .tabs::-webkit-scrollbar {
    display: none;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    background-color: var(--bg-pill);
    border: 1px solid transparent;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
  }

  .tab.active {
    background-color: var(--bg-pill-active);
    color: var(--accent-blue);
    border-color: rgba(138, 180, 248, 0.35);
    font-weight: 600;
  }

  .tab .emoji {
    font-size: 16px;
    line-height: 1;
  }

  .info {
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text-secondary);
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .user-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .user-row:hover {
    background-color: var(--bg-elevated);
  }

  .user-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text-primary);
    flex: 1;
    min-width: 0;
  }

  .avatar-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background-color: var(--bg-pill);
    display: block;
  }

  .avatar-fallback {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: var(--bg-pill);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
  }

  .reaction-corner-badge {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background-color: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    box-shadow: 0 0 0 1px var(--border-color);
  }

  .user-meta {
    flex: 1;
    min-width: 0;
  }

  .user-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .action-btn {
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-dark-green {
    background-color: var(--dark-green);
    color: var(--text-primary);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .btn-dark-green:hover {
    background-color: var(--dark-green-hover);
  }

  .btn-neutral {
    background-color: var(--bg-pill);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
  }

  .btn-outline {
    background-color: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  .empty {
    padding: 48px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="back-btn" aria-label="Back to Home Feed">←</a>
    <h1 class="header-title">Reactions</h1>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="searchToggle" aria-label="Search">🔍</button>
    </div>
  </header>

  <div class="search-bar" id="searchBar">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Search by name or user ID..."
      oninput="renderReactions()"
    >
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab active" data-type="all" onclick="selectTab('all', this)">
      <span>All</span>
      <span class="count" id="count-all">0</span>
    </button>
    <button type="button" class="tab" data-type="love" onclick="selectTab('love', this)">
      <span class="emoji">❤️</span>
      <span class="count" id="count-love">0</span>
    </button>
    <button type="button" class="tab" data-type="like" onclick="selectTab('like', this)">
      <span class="emoji">👍</span>
      <span class="count" id="count-like">0</span>
    </button>
    <button type="button" class="tab" data-type="care" onclick="selectTab('care', this)">
      <span class="emoji">🥰</span>
      <span class="count" id="count-care">0</span>
    </button>
    <button type="button" class="tab" data-type="haha" onclick="selectTab('haha', this)">
      <span class="emoji">😆</span>
      <span class="count" id="count-haha">0</span>
    </button>
    <button type="button" class="tab" data-type="sad" onclick="selectTab('sad', this)">
      <span class="emoji">😢</span>
      <span class="count" id="count-sad">0</span>
    </button>
    <button type="button" class="tab" data-type="wow" onclick="selectTab('wow', this)">
      <span class="emoji">😮</span>
      <span class="count" id="count-wow">0</span>
    </button>
    <button type="button" class="tab" data-type="angry" onclick="selectTab('angry', this)">
      <span class="emoji">😠</span>
      <span class="count" id="count-angry">0</span>
    </button>
  </div>

  <p class="info" id="viewInfo">
    Select any reactor to view their profile.
  </p>

  <main id="reactionList">
    <div class="empty">Loading reactions...</div>
  </main>

<script>
const REACTION_EMOJIS = {
  love: "❤️",
  like: "👍",
  care: "🥰",
  haha: "😆",
  sad: "😢",
  wow: "😮",
  angry: "😠"
};

const params = new URLSearchParams(window.location.search);
const postId = params.get("postId");

let currentType = "all";
let currentPost = null;
let currentUser = null;
let reactorItems = [];

document.getElementById("searchToggle").addEventListener("click", () => {
  const bar = document.getElementById("searchBar");
  bar.classList.toggle("open");
  if (bar.classList.contains("open")) {
    document.getElementById("searchInput").focus();
  }
});

function readList(key) {
  try {
    const val = JSON.parse(localStorage.getItem(key));
    return Array.isArray(val) ? val : [];
  } catch (_) {
    return [];
  }
}

function writeList(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

function getCurrentUser() {
  try {
    return JSON.parse(localStorage.getItem("currentUser")) || null;
  } catch (_) {
    return null;
  }
}

function getUsersMap() {
  const users = readList("users");
  const map = new Map();
  users.forEach(u => {
    if (u && u.id) map.set(String(u.id), u);
  });
  if (currentUser && currentUser.id) {
    map.set(String(currentUser.id), currentUser);
  }
  return map;
}

function normalizeType(t) {
  const k = String(t || "like").toLowerCase();
  return REACTION_EMOJIS[k] ? k : "like";
}

function isFriend(userAId, userBId) {
  if (!userAId || !userBId) return false;
  const friends = readList("friends");
  return friends.some(f =>
    (String(f.userId) === String(userAId) && String(f.friendId) === String(userBId)) ||
    (String(f.userId) === String(userBId) && String(f.friendId) === String(userAId))
  );
}

function getPendingRequest(fromId, toId) {
  if (!fromId || !toId) return null;
  const reqs = readList("friendRequests");
  return reqs.find(r =>
    r.status === "pending" &&
    String(r.fromId) === String(fromId) &&
    String(r.toId) === String(toId)
  ) || null;
}

function addFriendPair(userAId, userBId) {
  if (!userAId || !userBId || String(userAId) === String(userBId)) return;
  const friends = readList("friends");
  if (!isFriend(userAId, userBId)) {
    friends.push({
      id: "fr_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      userId: String(userAId),
      friendId: String(userBId),
      createdAt: new Date().toISOString()
    });
    writeList("friends", friends);
  }
}

function sendFriendRequest(toUserId) {
  if (!currentUser || !currentUser.id) return;
  const fromId = String(currentUser.id);
  const toId = String(toUserId);
  if (fromId === toId || isFriend(fromId, toId)) return;
  if (getPendingRequest(fromId, toId)) return;

  const reqs = readList("friendRequests");
  reqs.push({
    id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    fromId,
    fromName: currentUser.name || fromId,
    fromAvatar: currentUser.avatar || "",
    toId,
    status: "pending",
    createdAt: new Date().toISOString()
  });
  writeList("friendRequests", reqs);
  loadReactions();
}

function confirmFriendRequest(requesterId) {
  if (!currentUser || !currentUser.id) return;
  const myId = String(currentUser.id);
  const reqs = readList("friendRequests");
  const updated = reqs.map(r => {
    if (r.status === "pending" && String(r.fromId) === String(requesterId) && String(r.toId) === myId) {
      return { ...r, status: "accepted" };
    }
    return r;
  });
  writeList("friendRequests", updated);

  addFriendPair(myId, requesterId);
  loadReactions();
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getInitials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return "•";
}

function loadReactions() {
  currentUser = getCurrentUser();
  const listEl = document.getElementById("reactionList");
  const infoEl = document.getElementById("viewInfo");

  if (!postId) {
    updateCounts([]);
    listEl.innerHTML = `<div class="empty">No post ID specified.</div>`;
    return;
  }

  const posts = readList("posts");
  currentPost = posts.find(p => String(p.id) === String(postId)) || null;

  if (!currentPost || !Array.isArray(currentPost.reactions)) {
    updateCounts([]);
    listEl.innerHTML = `<div class="empty">No reactions found.</div>`;
    return;
  }

  const usersMap = getUsersMap();
  const postAuthorId = String(currentPost.authorId || currentPost.userId || "");
  const isPostAuthor = Boolean(currentUser && currentUser.id && String(currentUser.id) === postAuthorId);

  infoEl.textContent = isPostAuthor
    ? "Post owner view: Click any reactor to open their profile."
    : "Select any reactor to open their profile.";

  reactorItems = currentPost.reactions
    .map(r => {
      const uid = String(r.userId || r.user_id || r.id || "").trim();
      if (!uid) return null;
      const profile = usersMap.get(uid) || {};
      const displayName = profile.name || r.name || uid;
      const avatar = profile.avatar || r.img || "";
      const isSelf = Boolean(currentUser && currentUser.id && uid === String(currentUser.id));
      const alreadyFriend = isSelf || (currentUser && currentUser.id ? isFriend(currentUser.id, uid) : false);
      const incomingReq = currentUser && currentUser.id ? getPendingRequest(uid, currentUser.id) : null;
      const outgoingReq = currentUser && currentUser.id ? getPendingRequest(currentUser.id, uid) : null;

      return {
        userId: uid,
        name: displayName,
        avatar,
        type: normalizeType(r.type || r.reaction_type),
        isSelf,
        isPostAuthor,
        alreadyFriend,
        hasIncomingRequest: Boolean(incomingReq),
        hasOutgoingRequest: Boolean(outgoingReq)
      };
    })
    .filter(Boolean);

  updateCounts(reactorItems);
  renderReactions();
}

function updateCounts(items) {
  const counts = {
    all: items.length,
    love: 0,
    like: 0,
    care: 0,
    haha: 0,
    sad: 0,
    wow: 0,
    angry: 0
  };
  items.forEach(item => {
    if (counts[item.type] !== undefined) counts[item.type] += 1;
  });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById(`count-${k}`);
    if (el) el.textContent = counts[k];
  });
}

function selectTab(type, btn) {
  currentType = type;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderReactions();
}

function renderReactions() {
  const listEl = document.getElementById("reactionList");
  const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();

  let list = currentType === "all"
    ? reactorItems
    : reactorItems.filter(item => item.type === currentType);

  if (q) {
    list = list.filter(item =>
      item.name.toLowerCase().includes(q) ||
      item.userId.toLowerCase().includes(q)
    );
  }

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty">No reactions to show.</div>`;
    return;
  }

  listEl.innerHTML = list.map(item => {
    const emoji = REACTION_EMOJIS[item.type] || "👍";
    const profileUrl = `profile.html?userId=${encodeURIComponent(item.userId)}`;
    const avatarHtml = item.avatar
      ? `<img class="avatar" src="${escapeHtml(item.avatar)}" alt="${escapeHtml(item.name)}" loading="lazy">`
      : `<div class="avatar-fallback">${escapeHtml(getInitials(item.name))}</div>`;

    let subText = `ID: ${item.userId}`;
    let rightControl = "";

    if (item.isSelf) {
      rightControl = `<a class="action-btn btn-outline" href="${profileUrl}">Profile</a>`;
    } else if (item.isPostAuthor) {
      if (item.alreadyFriend) {
        subText = `Friends • ID: ${item.userId}`;
        rightControl = `<span class="action-btn btn-neutral">Friends</span>`;
      } else if (item.hasIncomingRequest) {
        subText = `Friend request • ID: ${item.userId}`;
        rightControl = `<button type="button" class="action-btn btn-dark-green" onclick="confirmFriendRequest('${escapeHtml(item.userId)}')">Confirm</button>`;
      } else if (item.hasOutgoingRequest) {
        subText = `Request sent • ID: ${item.userId}`;
        rightControl = `<span class="action-btn btn-neutral">Requested</span>`;
      } else {
        rightControl = `<button type="button" class="action-btn btn-dark-green" onclick="sendFriendRequest('${escapeHtml(item.userId)}')">Add friend</button>`;
      }
    } else {
      if (item.alreadyFriend) {
        subText = `Friends • ID: ${item.userId}`;
      } else if (item.hasOutgoingRequest) {
        subText = `Request sent • ID: ${item.userId}`;
      }
      rightControl = `<a class="action-btn btn-outline" href="${profileUrl}">Profile</a>`;
    }

    return `
      <div class="user-row">
        <a class="user-link" href="${profileUrl}">
          <div class="avatar-wrap">
            ${avatarHtml}
            <span class="reaction-corner-badge">${emoji}</span>
          </div>
          <div class="user-meta">
            <div class="user-name">${escapeHtml(item.name)}</div>
            <div class="user-sub">${escapeHtml(subText)}</div>
          </div>
        </a>
        ${rightControl}
      </div>
    `;
  }).join("");
}

loadReactions();
</script>

</body>
</html>
