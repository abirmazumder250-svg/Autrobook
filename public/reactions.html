<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-primary: #202124;
    --bg-elevated: #292a2d;
    --bg-pill: #303134;
    --bg-pill-active: #394457;
    --text-primary: #FFFFFF;
    --text-secondary: #bdc1c6;
    --accent-blue: #8ab4f8;
    --border-color: #3c4043;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    padding-bottom: 56px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .back-btn {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 22px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }

  .back-btn:hover {
    background-color: var(--bg-elevated);
  }

  .header-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .search-toggle {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .search-toggle:hover {
    background-color: var(--bg-elevated);
  }

  .search-bar {
    display: none;
    padding: 8px 16px 12px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
  }

  .search-bar.open {
    display: block;
  }

  .search-input {
    width: 100%;
    padding: 9px 14px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
  }

  .search-input::placeholder {
    color: var(--text-secondary);
  }

  /* Reaction Tabs */
  .tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg-primary);
  }

  .tabs::-webkit-scrollbar {
    display: none;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    background-color: var(--bg-pill);
    border: 1px solid transparent;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .tab:hover {
    background-color: var(--bg-elevated);
  }

  .tab.active {
    background-color: var(--bg-pill-active);
    color: var(--accent-blue);
    border-color: rgba(138, 180, 248, 0.35);
    font-weight: 600;
  }

  .tab .emoji {
    font-size: 16px;
    line-height: 1;
  }

  /* Info Notice */
  .info {
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text-secondary);
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  /* Reactor List */
  .user-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    text-decoration: none;
    color: var(--text-primary);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: background-color 0.15s ease;
  }

  .user-link:hover {
    background-color: var(--bg-elevated);
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background-color: var(--bg-pill);
    flex-shrink: 0;
  }

  .avatar-fallback {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background-color: var(--bg-pill);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .user-meta {
    flex: 1;
    min-width: 0;
  }

  .user-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-handle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .reaction-badge {
    font-size: 20px;
    line-height: 1;
    flex-shrink: 0;
  }

  .empty {
    padding: 48px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="back-btn" aria-label="Back to feed">←</a>
    <h1 class="header-title">Reactions</h1>
    <button type="button" class="search-toggle" id="searchToggle" aria-label="Search reactors">🔍</button>
  </header>

  <!-- Optional Search Bar -->
  <div class="search-bar" id="searchBar">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Search by name or user ID..."
      oninput="renderReactions()"
    >
  </div>

  <!-- Reaction Filter Tabs -->
  <div class="tabs" role="tablist" aria-label="Reaction types">
    <button type="button" class="tab active" data-type="all" onclick="selectTab('all', this)">
      <span>All</span>
      <span class="count" id="count-all">0</span>
    </button>
    <button type="button" class="tab" data-type="love" onclick="selectTab('love', this)">
      <span class="emoji">❤️</span>
      <span class="count" id="count-love">0</span>
    </button>
    <button type="button" class="tab" data-type="like" onclick="selectTab('like', this)">
      <span class="emoji">👍</span>
      <span class="count" id="count-like">0</span>
    </button>
    <button type="button" class="tab" data-type="care" onclick="selectTab('care', this)">
      <span class="emoji">🥰</span>
      <span class="count" id="count-care">0</span>
    </button>
    <button type="button" class="tab" data-type="haha" onclick="selectTab('haha', this)">
      <span class="emoji">😆</span>
      <span class="count" id="count-haha">0</span>
    </button>
    <button type="button" class="tab" data-type="sad" onclick="selectTab('sad', this)">
      <span class="emoji">😢</span>
      <span class="count" id="count-sad">0</span>
    </button>
    <button type="button" class="tab" data-type="wow" onclick="selectTab('wow', this)">
      <span class="emoji">😮</span>
      <span class="count" id="count-wow">0</span>
    </button>
    <button type="button" class="tab" data-type="angry" onclick="selectTab('angry', this)">
      <span class="emoji">😠</span>
      <span class="count" id="count-angry">0</span>
    </button>
  </div>

  <!-- Info Notice -->
  <p class="info">
    You can see the total number of people who reacted to this post, and select any reactor to view their profile.
  </p>

  <!-- Reaction List -->
  <main id="reactionList">
    <div class="empty">Loading reactions...</div>
  </main>

<script>
const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
const SUPABASE_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const REACTION_EMOJIS = {
  love: "❤️",
  like: "👍",
  care: "🥰",
  haha: "😆",
  sad: "😢",
  wow: "😮",
  angry: "😠"
};

const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get("postId");

let currentType = "all";
let allReactorRows = []; // Combined { reactionType, profile }

document.getElementById("searchToggle").addEventListener("click", () => {
  const bar = document.getElementById("searchBar");
  bar.classList.toggle("open");
  if (bar.classList.contains("open")) {
    document.getElementById("searchInput").focus();
  }
});

function normalizeReactionType(rawType) {
  if (!rawType) return "like";
  const key = String(rawType).trim().toLowerCase();
  if (REACTION_EMOJIS[key]) return key;
  if (key === "care_emoji" || key === "hug") return "care";
  if (key === "laugh" || key === "lol") return "haha";
  return "like";
}

function getLocalPostReactions(targetPostId) {
  if (!targetPostId) return [];
  try {
    const posts = JSON.parse(localStorage.getItem("posts")) || [];
    const post = posts.find(p => String(p.id) === String(targetPostId));
    if (!post || !Array.isArray(post.reactions)) return [];
    return post.reactions.map(r => ({
      userId: r.userId || r.user_id || r.id || "",
      type: normalizeReactionType(r.type || r.reaction_type)
    })).filter(r => Boolean(r.userId));
  } catch (err) {
    console.error("Failed to read local posts:", err);
    return [];
  }
}

async function fetchReactionsFromSupabase(targetPostId) {
  if (!targetPostId) return null;

  // Query post_reactions table if present
  const { data, error } = await supabaseClient
    .from("post_reactions")
    .select("user_id, reaction_type")
    .eq("post_id", targetPostId);

  if (error) {
    console.warn("Supabase post_reactions query fallback to localStorage:", error.message);
    return null;
  }

  return (data || []).map(row => ({
    userId: row.user_id,
    type: normalizeReactionType(row.reaction_type)
  })).filter(r => Boolean(r.userId));
}

async function fetchSavedProfiles(userIds) {
  const uniqueIds = [...new Set(userIds.map(id => String(id)).filter(Boolean))];
  if (uniqueIds.length === 0) return new Map();

  // Assumes a `profiles` table with columns: id, full_name (or name/username), avatar_url
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .in("id", uniqueIds);

  if (error) {
    console.error("Error fetching profiles from Supabase:", error.message);
    return new Map();
  }

  const profileMap = new Map();
  (data || []).forEach(p => {
    profileMap.set(String(p.id), p);
  });
  return profileMap;
}

function getDisplayName(profile, userId) {
  if (!profile) return String(userId);
  return (
    profile.full_name ||
    profile.name ||
    profile.display_name ||
    profile.username ||
    String(userId)
  );
}

function getAvatarUrl(profile) {
  if (!profile) return "";
  return profile.avatar_url || profile.avatar || profile.photo_url || "";
}

function getInitials(label) {
  const clean = String(label || "").trim();
  if (!clean) return "•";
  const parts = clean.split(/\s+/);
  if (parts.length >= 2) {
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  return clean.slice(0, 2).toUpperCase();
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function loadReactions() {
  const listEl = document.getElementById("reactionList");

  if (!postId) {
    updateCounts([]);
    listEl.innerHTML = `<div class="empty">No post specified.</div>`;
    return;
  }

  const sbReactions = await fetchReactionsFromSupabase(postId);
  const rawReactions = sbReactions !== null ? sbReactions : getLocalPostReactions(postId);

  const userIds = rawReactions.map(r => r.userId);
  const profileMap = await fetchSavedProfiles(userIds);

  // Only include reactions whose user ID is saved in Supabase `profiles`
  allReactorRows = rawReactions
    .filter(r => profileMap.has(String(r.userId)))
    .map(r => {
      const uid = String(r.userId);
      const profile = profileMap.get(uid);
      return {
        userId: uid,
        reactionType: r.type,
        displayName: getDisplayName(profile, uid),
        username: profile.username ? `@${profile.username}` : `ID: ${uid}`,
        avatarUrl: getAvatarUrl(profile)
      };
    });

  updateCounts(allReactorRows);
  renderReactions();
}

function updateCounts(rows) {
  const counts = {
    all: rows.length,
    love: 0,
    like: 0,
    care: 0,
    haha: 0,
    sad: 0,
    wow: 0,
    angry: 0
  };

  rows.forEach(item => {
    if (counts[item.reactionType] !== undefined) {
      counts[item.reactionType] += 1;
    }
  });

  Object.keys(counts).forEach(key => {
    const el = document.getElementById(`count-${key}`);
    if (el) el.textContent = counts[key];
  });
}

function selectTab(type, buttonEl) {
  currentType = type;
  document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
  if (buttonEl) buttonEl.classList.add("active");
  renderReactions();
}

function renderReactions() {
  const listEl = document.getElementById("reactionList");
  const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();

  let filtered = currentType === "all"
    ? allReactorRows
    : allReactorRows.filter(item => item.reactionType === currentType);

  if (query) {
    filtered = filtered.filter(item =>
      item.displayName.toLowerCase().includes(query) ||
      item.userId.toLowerCase().includes(query) ||
      item.username.toLowerCase().includes(query)
    );
  }

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty">No reactions to show.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(item => {
    const emoji = REACTION_EMOJIS[item.reactionType] || "👍";
    const profileHref = `profile.html?userId=${encodeURIComponent(item.userId)}`;
    const avatarMarkup = item.avatarUrl
      ? `<img class="avatar" src="${escapeHtml(item.avatarUrl)}" alt="${escapeHtml(item.displayName)}" loading="lazy">`
      : `<div class="avatar-fallback" aria-hidden="true">${escapeHtml(getInitials(item.displayName))}</div>`;

    return `
      <a class="user-link" href="${profileHref}">
        ${avatarMarkup}
        <div class="user-meta">
          <div class="user-name">${escapeHtml(item.displayName)}</div>
          <div class="user-handle">${escapeHtml(item.username)}</div>
        </div>
        <span class="reaction-badge" aria-label="${escapeHtml(item.reactionType)}">${emoji}</span>
      </a>
    `;
  }).join("");
}

loadReactions();
</script>

</body>
      </html>
