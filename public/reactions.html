<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reactions — Autrobook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-primary: #202124;
    --bg-elevated: #292a2d;
    --bg-card: #242629;
    --bg-pill: #303134;
    --bg-pill-active: #394457;
    --text-primary: #FFFFFF;
    --text-secondary: #bdc1c6;
    --accent-blue: #8ab4f8;
    --accent-green: #81c995;
    --dark-green: #1b5e20;
    --dark-green-hover: #2e7d32;
    --border-color: #3c4043;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    padding-bottom: 64px;
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 25;
  }

  .back-btn {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 20px;
    font-weight: 600;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-elevated);
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .back-btn:hover {
    background-color: var(--bg-pill);
    border-color: var(--accent-blue);
  }

  .header-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    background-color: var(--bg-elevated);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-size: 16px;
    cursor: pointer;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .icon-btn:hover {
    background-color: var(--bg-pill);
    border-color: var(--accent-blue);
  }

  .search-bar {
    display: none;
    padding: 10px 18px 14px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
  }

  .search-bar.open {
    display: block;
  }

  .search-input {
    width: 100%;
    max-width: 680px;
    display: block;
    margin: 0 auto;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-input:focus {
    border-color: var(--accent-blue);
  }

  .tabs-wrap {
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg-primary);
  }

  .tabs {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar {
    display: none;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 15px;
    border-radius: 20px;
    background-color: var(--bg-pill);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .tab:hover {
    background-color: var(--bg-elevated);
  }

  .tab.active {
    background-color: var(--bg-pill-active);
    color: var(--accent-blue);
    border-color: rgba(138, 180, 248, 0.45);
    font-weight: 600;
  }

  .tab .emoji {
    font-size: 16px;
    line-height: 1;
  }

  .page-shell {
    max-width: 720px;
    margin: 0 auto;
  }

  .info {
    margin: 14px 16px 6px;
    padding: 13px 15px;
    border-radius: 8px;
    background-color: var(--bg-elevated);
    border: 1px solid var(--border-color);
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-secondary);
    text-align: left;
  }

  .user-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin: 10px 16px;
    padding: 13px 15px;
    border-radius: 10px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .user-row:hover {
    background-color: var(--bg-elevated);
    border-color: rgba(138, 180, 248, 0.35);
  }

  .user-link {
    display: flex;
    align-items: center;
    gap: 13px;
    text-decoration: none;
    color: var(--text-primary);
    flex: 1;
    min-width: 0;
  }

  .avatar-wrap {
    position: relative;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    background-color: var(--bg-pill);
    display: block;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .avatar-fallback {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: var(--bg-pill);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
  }

  .reaction-corner-badge {
    position: absolute;
    right: -3px;
    bottom: -3px;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    background-color: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    box-shadow: 0 0 0 1px var(--border-color);
  }

  .user-meta {
    flex: 1;
    min-width: 0;
  }

  .user-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .user-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .you-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-green);
    background-color: rgba(129, 201, 149, 0.14);
    border: 1px solid rgba(129, 201, 149, 0.35);
    padding: 1px 7px;
    border-radius: 4px;
  }

  .user-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .action-btn {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .btn-dark-green {
    background-color: var(--dark-green);
    color: var(--text-primary);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }

  .btn-dark-green:hover {
    background-color: var(--dark-green-hover);
  }

  .btn-neutral {
    background-color: var(--bg-pill);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
  }

  .btn-outline {
    background-color: var(--bg-pill);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  .btn-outline:hover {
    border-color: var(--accent-blue);
  }

  .empty {
    margin: 24px 16px;
    padding: 44px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
  }
</style>
</head>
<body>

  <header class="header">
    <a id="backBtn" href="index.html" class="back-btn" aria-label="Back">&larr;</a>
    <h1 class="header-title">Reactions</h1>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="searchToggle" aria-label="Search">&#128269;</button>
    </div>
  </header>

  <div class="search-bar" id="searchBar">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Search by name or user ID..."
      oninput="renderReactions()"
    >
  </div>

  <div class="tabs-wrap">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-type="all" onclick="selectTab('all', this)">
        <span>All</span>
        <span class="count" id="count-all">0</span>
      </button>
      <button type="button" class="tab" data-type="love" onclick="selectTab('love', this)">
        <span class="emoji">&#10084;&#65039;</span>
        <span class="count" id="count-love">0</span>
      </button>
      <button type="button" class="tab" data-type="like" onclick="selectTab('like', this)">
        <span class="emoji">&#128077;</span>
        <span class="count" id="count-like">0</span>
      </button>
      <button type="button" class="tab" data-type="care" onclick="selectTab('care', this)">
        <span class="emoji">&#129392;</span>
        <span class="count" id="count-care">0</span>
      </button>
      <button type="button" class="tab" data-type="haha" onclick="selectTab('haha', this)">
        <span class="emoji">&#128518;</span>
        <span class="count" id="count-haha">0</span>
      </button>
      <button type="button" class="tab" data-type="sad" onclick="selectTab('sad', this)">
        <span class="emoji">&#128546;</span>
        <span class="count" id="count-sad">0</span>
      </button>
      <button type="button" class="tab" data-type="wow" onclick="selectTab('wow', this)">
        <span class="emoji">&#128558;</span>
        <span class="count" id="count-wow">0</span>
      </button>
      <button type="button" class="tab" data-type="angry" onclick="selectTab('angry', this)">
        <span class="emoji">&#128544;</span>
        <span class="count" id="count-angry">0</span>
      </button>
    </div>
  </div>

  <div class="page-shell">
    <p class="info" id="viewInfo" style="display:none;">
      You can see the total number of people who reacted to this post, but only the names of friends who have reacted will be shown.
    </p>

    <main id="reactionList">
      <div class="empty">No reactions yet.</div>
    </main>
  </div>

<script>
const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

let sbClient = null;
try {
  if (window.supabase && typeof window.supabase.createClient === "function") {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (_) {}

const REACTION_EMOJIS = {
  love: "❤️",
  like: "👍",
  care: "🥰",
  haha: "😆",
  sad: "😢",
  wow: "😮",
  angry: "😠"
};

const params = new URLSearchParams(window.location.search);
const postId = params.get("postId") || params.get("post") || "123";
const fromPage = (params.get("from") || params.get("back") || "index.html").toLowerCase();

let currentType = "all";
let currentPost = null;
let currentUser = null;
let isPostOwnerView = false;
let reactorItems = [];
let lastSnapshot = "";
let pageInitialized = false;

document.getElementById("searchToggle").addEventListener("click", () => {
  const bar = document.getElementById("searchBar");
  bar.classList.toggle("open");
  if (bar.classList.contains("open")) {
    document.getElementById("searchInput").focus();
  }
});

function readList(key) {
  try {
    const val = JSON.parse(localStorage.getItem(key));
    return Array.isArray(val) ? val : [];
  } catch (_) {
    return [];
  }
}

function writeList(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (_) {}
}

function getOrCreateLocalUser() {
  try {
    const existing = JSON.parse(localStorage.getItem("currentUser") || "null");
    if (existing && existing.id) {
      return {
        id: String(existing.id),
        name: String(existing.name || localStorage.getItem("autro_profile_name") || "Abir").trim(),
        avatar: String(existing.avatar || localStorage.getItem("autro_profile_avatar") || "").trim()
      };
    }
  } catch (_) {}

  const id = String(localStorage.getItem("autro_user_id") || "user_101");
  const name = String(localStorage.getItem("autro_profile_name") || "Abir").trim();
  const avatar = String(localStorage.getItem("autro_profile_avatar") || "").trim();
  const userObj = { id, name, avatar };
  writeList("currentUser", userObj);
  return userObj;
}

async function resolveSessionUserSilently() {
  if (!sbClient) return;
  try {
    const { data: { session } } = await sbClient.auth.getSession();
    const authUser = session && session.user ? session.user : null;
    if (!authUser) return;

    const meta = authUser.user_metadata || {};
    const resolvedName = String(meta.full_name || meta.name || currentUser?.name || "Abir").trim();
    const resolvedAvatar = String(meta.avatar_url || meta.picture || currentUser?.avatar || "").trim();

    currentUser = {
      ...(currentUser || {}),
      id: String(authUser.id),
      name: resolvedName,
      avatar: resolvedAvatar
    };
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
  } catch (_) {}
}

function getUsersMap() {
  const users = readList("users");
  const map = new Map();
  users.forEach(u => {
    if (u && u.id) map.set(String(u.id), u);
  });
  if (currentUser && currentUser.id) {
    map.set(String(currentUser.id), currentUser);
  }
  return map;
}

function normalizeType(t) {
  const k = String(t || "like").toLowerCase();
  return REACTION_EMOJIS[k] ? k : "like";
}

function isFriend(userAId, userBId) {
  if (!userAId || !userBId) return false;
  const friends = readList("friends");
  return friends.some(f =>
    (String(f.userId) === String(userAId) && String(f.friendId) === String(userBId)) ||
    (String(f.userId) === String(userBId) && String(f.friendId) === String(userAId))
  );
}

function getPendingRequest(fromId, toId) {
  if (!fromId || !toId) return null;
  const reqs = readList("friendRequests");
  return reqs.find(r =>
    r.status === "pending" &&
    String(r.fromId) === String(fromId) &&
    String(r.toId) === String(toId)
  ) || null;
}

function addFriendPair(userAId, userBId) {
  if (!userAId || !userBId || String(userAId) === String(userBId)) return;
  const friends = readList("friends");
  if (!isFriend(userAId, userBId)) {
    friends.push({
      id: "fr_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      userId: String(userAId),
      friendId: String(userBId),
      createdAt: new Date().toISOString()
    });
    writeList("friends", friends);
  }
}

function sendFriendRequest(toUserId) {
  if (!currentUser || !currentUser.id) return;
  const fromId = String(currentUser.id);
  const toId = String(toUserId);
  if (fromId === toId || isFriend(fromId, toId)) return;
  if (getPendingRequest(fromId, toId)) return;

  const reqs = readList("friendRequests");
  reqs.push({
    id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    fromId,
    fromName: currentUser.name || fromId,
    fromAvatar: currentUser.avatar || "",
    toId,
    status: "pending",
    createdAt: new Date().toISOString()
  });
  writeList("friendRequests", reqs);
  loadReactions(true);
}

function confirmFriendRequest(requesterId) {
  if (!currentUser || !currentUser.id) return;
  const myId = String(currentUser.id);
  const reqs = readList("friendRequests");
  const updated = reqs.map(r => {
    if (r.status === "pending" && String(r.fromId) === String(requesterId) && String(r.toId) === myId) {
      return { ...r, status: "accepted" };
    }
    return r;
  });
  writeList("friendRequests", updated);

  addFriendPair(myId, requesterId);
  loadReactions(true);
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getInitials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return "AB";
}

function updateBackLink() {
  const backEl = document.getElementById("backBtn");
  const uid = String((currentUser && currentUser.id) || "");
  const postAuthorId = String((currentPost && (currentPost.authorId || currentPost.userId || currentPost.user_id)) || "");
  const isOwnPost = Boolean(uid && postAuthorId && uid === postAuthorId);

  if (fromPage.includes("profile") || isOwnPost) {
    backEl.href = "profile.html";
  } else if (fromPage.includes("comments")) {
    backEl.href = `comments.html?post=${encodeURIComponent(postId)}&from=${encodeURIComponent(fromPage)}`;
  } else {
    backEl.href = "index.html";
  }
}

function loadReactions(forceRender = false) {
  currentUser = currentUser || getOrCreateLocalUser();
  const listEl = document.getElementById("reactionList");
  const infoEl = document.getElementById("viewInfo");

  const posts = readList("posts");
  currentPost = posts.find(p => String(p.id) === String(postId)) || null;
  updateBackLink();

  const snapshot = JSON.stringify({
    post: currentPost ? currentPost.reactions : null,
    authorId: currentPost ? (currentPost.authorId || currentPost.userId || "") : "",
    me: currentUser ? currentUser.id : "",
    friends: localStorage.getItem("friends") || "",
    reqs: localStorage.getItem("friendRequests") || "",
    users: localStorage.getItem("users") || ""
  });

  if (!forceRender && snapshot === lastSnapshot) {
    return;
  }
  lastSnapshot = snapshot;

  if (!currentPost || !Array.isArray(currentPost.reactions) || currentPost.reactions.length === 0) {
    infoEl.style.display = "none";
    updateCounts([]);
    listEl.innerHTML = `<div class="empty">No reactions on this post yet.</div>`;
    return;
  }

  const postAuthorId = String(currentPost.authorId || currentPost.userId || "");
  isPostOwnerView = Boolean(currentUser && currentUser.id && String(currentUser.id) === postAuthorId);
  infoEl.style.display = isPostOwnerView ? "none" : "block";

  const usersMap = getUsersMap();

  reactorItems = currentPost.reactions
    .map(r => {
      const uid = String(r.userId || r.user_id || r.id || "").trim();
      if (!uid) return null;
      const profile = usersMap.get(uid) || {};
      const displayName = profile.name || r.name || "Autrobook Member";
      const avatar = profile.avatar || r.img || "";
      const isSelf = Boolean(currentUser && currentUser.id && uid === String(currentUser.id));
      const alreadyFriend = isSelf || (currentUser && currentUser.id ? isFriend(currentUser.id, uid) : false);
      const incomingReq = currentUser && currentUser.id ? getPendingRequest(uid, currentUser.id) : null;
      const outgoingReq = currentUser && currentUser.id ? getPendingRequest(currentUser.id, uid) : null;

      return {
        userId: uid,
        name: displayName,
        avatar,
        type: normalizeType(r.type || r.reaction_type),
        btnHint: r.btn || "",
        isSelf,
        alreadyFriend,
        hasIncomingRequest: Boolean(incomingReq),
        hasOutgoingRequest: Boolean(outgoingReq)
      };
    })
    .filter(Boolean);

  updateCounts(reactorItems);
  renderReactions();
}

function updateCounts(items) {
  const counts = {
    all: items.length,
    love: 0,
    like: 0,
    care: 0,
    haha: 0,
    sad: 0,
    wow: 0,
    angry: 0
  };
  items.forEach(item => {
    if (counts[item.type] !== undefined) counts[item.type] += 1;
  });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById(`count-${k}`);
    if (el) el.textContent = counts[k];
  });
}

function selectTab(type, btn) {
  currentType = type;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderReactions();
}

function renderReactions() {
  const listEl = document.getElementById("reactionList");
  const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();

  let baseList = isPostOwnerView
    ? reactorItems
    : reactorItems.filter(item => item.alreadyFriend || item.isSelf);

  let list = currentType === "all"
    ? baseList
    : baseList.filter(item => item.type === currentType);

  if (q) {
    list = list.filter(item =>
      item.name.toLowerCase().includes(q) ||
      item.userId.toLowerCase().includes(q)
    );
  }

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty">${isPostOwnerView ? "No matching reactions to display." : "No friends or self reactions found for this filter."}</div>`;
    return;
  }

  listEl.innerHTML = list.map(item => {
    const emoji = REACTION_EMOJIS[item.type] || "👍";
    const profileUrl = item.isSelf
      ? "profile.html"
      : `profile.html?userId=${encodeURIComponent(item.userId)}`;
    const avatarHtml = item.avatar
      ? `<img class="avatar" src="${escapeHtml(item.avatar)}" alt="${escapeHtml(item.name)}" loading="lazy">`
      : `<div class="avatar-fallback">${escapeHtml(getInitials(item.name))}</div>`;

    let rightControl = "";
    if (isPostOwnerView && !item.isSelf) {
      if (item.alreadyFriend || item.btnHint === "mention") {
        rightControl = `<a class="action-btn btn-outline" href="${profileUrl}">Mention</a>`;
      } else if (item.hasIncomingRequest || item.btnHint === "confirm") {
        rightControl = `<button type="button" class="action-btn btn-dark-green" onclick="confirmFriendRequest('${escapeHtml(item.userId)}')">Confirm</button>`;
      } else if (item.hasOutgoingRequest) {
        rightControl = `<span class="action-btn btn-neutral">Requested</span>`;
      } else {
        rightControl = `<button type="button" class="action-btn btn-dark-green" onclick="sendFriendRequest('${escapeHtml(item.userId)}')">Add friend</button>`;
      }
    } else {
      rightControl = `<a class="action-btn btn-outline" href="${profileUrl}">Profile</a>`;
    }

    return `
      <div class="user-row">
        <a class="user-link" href="${profileUrl}">
          <div class="avatar-wrap">
            ${avatarHtml}
            <span class="reaction-corner-badge">${emoji}</span>
          </div>
          <div class="user-meta">
            <div class="user-name-row">
              <span class="user-name">${escapeHtml(item.name)}</span>
              ${item.isSelf ? `<span class="you-tag">You</span>` : ""}
            </div>
            <div class="user-sub">ID: ${escapeHtml(item.userId)}</div>
          </div>
        </a>
        ${rightControl}
      </div>
    `;
  }).join("");
}

window.addEventListener("storage", () => {
  if (pageInitialized) loadReactions(false);
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && pageInitialized) loadReactions(false);
});

async function initReactionsPage() {
  currentUser = getOrCreateLocalUser();
  pageInitialized = true;
  loadReactions(true);

  await resolveSessionUserSilently();
  loadReactions(true);

  setInterval(() => {
    if (pageInitialized) loadReactions(false);
  }, 1500);
}

initReactionsPage();
</script>
