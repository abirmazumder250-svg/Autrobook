<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reactions — Autrobook</title>
<link rel="stylesheet" href="/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-primary: #202124;
    --bg-elevated: #292a2d;
    --bg-card: transparent;
    --bg-pill: #303134;
    --bg-pill-active: #394457;
    --text-primary: #FFFFFF;
    --text-secondary: #bdc1c6;
    --accent-blue: #8ab4f8;
    --accent-green: #81c995;
    --dark-green: #1b5e20;
    --dark-green-hover: #2e7d32;
    --border-color: #3c4043;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    padding-bottom: 64px;
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 25;
  }

  .back-btn {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 22px;
    font-weight: 500;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .back-btn:hover {
    background-color: var(--bg-elevated);
  }

  .header-title {
    font-size: 19px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn {
    background-color: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 19px;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .icon-btn:hover {
    background-color: var(--bg-elevated);
  }

  .search-bar {
    display: none;
    padding: 10px 16px 12px;
    background-color: var(--bg-primary);
    border-bottom: 1px solid var(--border-color);
  }

  .search-bar.open {
    display: block;
  }

  .search-input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
  }

  .search-input:focus {
    border-color: var(--accent-blue);
  }

  .tabs-wrap {
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg-primary);
  }

  .tabs {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar {
    display: none;
  }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    background-color: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }

  .tab.active {
    background-color: var(--bg-pill-active);
    color: var(--accent-blue);
  }

  .tab .emoji {
    font-size: 16px;
    line-height: 1;
  }

  .user-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
  }

  .user-row:hover {
    background-color: rgba(255, 255, 255, 0.03);
  }

  .user-link {
    display: flex;
    align-items: center;
    gap: 13px;
    text-decoration: none;
    color: var(--text-primary);
    flex: 1;
    min-width: 0;
  }

  .avatar-wrap {
    position: relative;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
  }

  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    background-color: var(--bg-pill);
    display: block;
  }

  .avatar-fallback {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background-color: var(--bg-pill);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
  }

  .reaction-corner-badge {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: var(--bg-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
  }

  .user-meta {
    flex: 1;
    min-width: 0;
  }

  .user-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .action-btn {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-dark-green {
    background-color: var(--dark-green);
    color: var(--text-primary);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }

  .btn-dark-green:hover {
    background-color: var(--dark-green-hover);
  }

  .btn-mention-green {
    background-color: var(--dark-green);
    color: var(--text-primary);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 7px 14px;
  }

  .btn-mention-green:hover {
    background-color: var(--dark-green-hover);
  }

  .empty {
    padding: 60px 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

  <header class="header">
    <a id="backBtn" href="index.html" class="back-btn" aria-label="Back">&larr;</a>
    <h1 class="header-title">Reactions</h1>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="searchToggle" aria-label="Search">&#128269;</button>
    </div>
  </header>

  <div class="search-bar" id="searchBar">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Search people..."
      oninput="renderReactions()"
    >
  </div>

  <div class="tabs-wrap">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-type="all" onclick="selectTab('all', this)">
        <span>All</span>
        <span class="count" id="count-all">0</span>
      </button>
      <button type="button" class="tab" data-type="love" onclick="selectTab('love', this)">
        <span class="emoji">&#10084;&#65039;</span>
        <span class="count" id="count-love">0</span>
      </button>
      <button type="button" class="tab" data-type="like" onclick="selectTab('like', this)">
        <span class="emoji">&#128077;</span>
        <span class="count" id="count-like">0</span>
      </button>
      <button type="button" class="tab" data-type="care" onclick="selectTab('care', this)">
        <span class="emoji">&#129392;</span>
        <span class="count" id="count-care">0</span>
      </button>
      <button type="button" class="tab" data-type="haha" onclick="selectTab('haha', this)">
        <span class="emoji">&#128518;</span>
        <span class="count" id="count-haha">0</span>
      </button>
      <button type="button" class="tab" data-type="sad" onclick="selectTab('sad', this)">
        <span class="emoji">&#128546;</span>
        <span class="count" id="count-sad">0</span>
      </button>
      <button type="button" class="tab" data-type="wow" onclick="selectTab('wow', this)">
        <span class="emoji">&#128558;</span>
        <span class="count" id="count-wow">0</span>
      </button>
      <button type="button" class="tab" data-type="angry" onclick="selectTab('angry', this)">
        <span class="emoji">&#128544;</span>
        <span class="count" id="count-angry">0</span>
      </button>
    </div>
  </div>

  <main id="reactionList">
    <div class="empty">No reactions yet.</div>
  </main>

<script>
const SUPABASE_URL = "https://gemyqaniztqrsilayblx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_";

let sbClient = null;
try {
  if (window.supabase && typeof window.supabase.createClient === "function") {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (_) {}

let liveChannel = null;
try {
  if (typeof BroadcastChannel !== "undefined") {
    liveChannel = new BroadcastChannel("autrobook_live_engagement");
  }
} catch (_) {}

const REACTION_EMOJIS = {
  love: "❤️",
  heart: "❤️",
  like: "👍",
  thumbs_up: "👍",
  care: "🥰",
  haha: "😆",
  laugh: "😆",
  sad: "😢",
  wow: "😮",
  angry: "😠"
};

const params = new URLSearchParams(window.location.search);
const postId = params.get("postId") || params.get("post") || "123";
const fromPage = (params.get("from") || params.get("back") || "index.html").toLowerCase();

let currentType = "all";
let currentPost = null;
let currentUser = null;
let reactorItems = [];
let supabaseProfilesMap = new Map();
let lastSnapshot = "";
let pageInitialized = false;

document.getElementById("searchToggle").addEventListener("click", () => {
  const bar = document.getElementById("searchBar");
  bar.classList.toggle("open");
  if (bar.classList.contains("open")) {
    document.getElementById("searchInput").focus();
  }
});

function readList(key) {
  try {
    const val = JSON.parse(localStorage.getItem(key));
    return Array.isArray(val) ? val : [];
  } catch (_) {
    return [];
  }
}

function writeList(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (_) {}
}

function readObject(key) {
  try {
    const val = JSON.parse(localStorage.getItem(key));
    return val && typeof val === "object" ? val : {};
  } catch (_) {
    return {};
  }
}

function writeObject(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (_) {}
}

function broadcastReactionSync() {
  const detail = { postId: String(postId), timestamp: Date.now() };
  try {
    window.dispatchEvent(new CustomEvent("autro:post-updated", { detail }));
  } catch (_) {}
  try {
    if (liveChannel) liveChannel.postMessage(detail);
  } catch (_) {}
}

function extractNameFromRow(row) {
  if (!row || typeof row !== "object") return "";
  const candidates = [
    row.full_name,
    row.fullName,
    row.user_name,
    row.userName,
    row.author_name,
    row.authorName,
    row.display_name,
    row.displayName,
    row.username,
    row.name
  ];
  for (const c of candidates) {
    if (typeof c === "string" && c.trim() && c.trim().toLowerCase() !== "autrobook member") {
      return c.trim();
    }
  }
  return "";
}

function extractAvatarFromRow(row) {
  if (!row || typeof row !== "object") return "";
  const candidates = [
    row.user_avatar,
    row.userAvatar,
    row.avatar_url,
    row.avatarUrl,
    row.avatar,
    row.profile_pic,
    row.profilePic,
    row.photo_url,
    row.photoURL,
    row.picture,
    row.img
  ];
  for (const c of candidates) {
    if (typeof c === "string" && c.trim()) {
      return c.trim();
    }
  }
  return "";
}

function getOrCreateLocalUser() {
  const candidateKeys = [
    "currentUser",
    "autro_current_user",
    "autrobook_user",
    "autro_user",
    "loggedInUser"
  ];

  let parsedObj = null;
  for (const k of candidateKeys) {
    try {
      const raw = JSON.parse(localStorage.getItem(k) || "null");
      if (raw && typeof raw === "object" && (raw.id || raw.user_id || raw.uid || raw.name || raw.full_name)) {
        parsedObj = raw;
        break;
      }
    } catch (_) {}
  }

  const fallbackName = String(
    extractNameFromRow(parsedObj) ||
    localStorage.getItem("autro_profile_name") ||
    localStorage.getItem("autro_user_name") ||
    localStorage.getItem("profileName") ||
    ""
  ).trim();

  const fallbackAvatar = String(
    extractAvatarFromRow(parsedObj) ||
    localStorage.getItem("autro_profile_avatar") ||
    localStorage.getItem("autro_user_avatar") ||
    localStorage.getItem("profileAvatar") ||
    ""
  ).trim();

  const fallbackId = String(
    (parsedObj && (parsedObj.id || parsedObj.user_id || parsedObj.uid)) ||
    localStorage.getItem("autro_user_id") ||
    localStorage.getItem("userId") ||
    "user_101"
  ).trim();

  const userObj = {
    id: fallbackId,
    name: fallbackName || "User",
    avatar: fallbackAvatar
  };

  try {
    localStorage.setItem("currentUser", JSON.stringify(userObj));
  } catch (_) {}
  return userObj;
}

async function resolveSessionUserSilently() {
  if (!sbClient) return;
  try {
    const { data: { session } } = await sbClient.auth.getSession();
    const authUser = session && session.user ? session.user : null;
    if (!authUser) return;

    const meta = authUser.user_metadata || {};
    let profileRow = null;

    for (const tbl of ["profiles", "users"]) {
      try {
        const { data, error } = await sbClient
          .from(tbl)
          .select("*")
          .eq("id", authUser.id)
          .maybeSingle();
        if (!error && data) {
          profileRow = data;
          break;
        }
      } catch (_) {}
    }

    const resolvedName = String(
      extractNameFromRow(profileRow) ||
      meta.full_name ||
      meta.name ||
      meta.user_name ||
      (authUser.email ? authUser.email.split("@")[0] : "") ||
      currentUser?.name ||
      "User"
    ).trim();

    const resolvedAvatar = String(
      extractAvatarFromRow(profileRow) ||
      meta.avatar_url ||
      meta.picture ||
      currentUser?.avatar ||
      ""
    ).trim();

    currentUser = {
      ...(currentUser || {}),
      id: String(authUser.id),
      name: resolvedName,
      avatar: resolvedAvatar
    };

    supabaseProfilesMap.set(String(authUser.id), {
      id: String(authUser.id),
      name: resolvedName,
      avatar: resolvedAvatar
    });

    try {
      localStorage.setItem("currentUser", JSON.stringify(currentUser));
    } catch (_) {}
  } catch (_) {}
}

function getUsersMap() {
  const users = readList("users");
  const profiles = readList("profiles");
  const map = new Map();

  [...users, ...profiles].forEach(u => {
    if (!u || typeof u !== "object") return;
    const uid = String(u.id || u.user_id || u.uid || "").trim();
    if (!uid) return;
    const prev = map.get(uid) || {};
    map.set(uid, {
      id: uid,
      name: extractNameFromRow(u) || prev.name || "",
      avatar: extractAvatarFromRow(u) || prev.avatar || ""
    });
  });

  supabaseProfilesMap.forEach((p, uid) => {
    const prev = map.get(uid) || {};
    map.set(uid, {
      id: uid,
      name: p.name || prev.name || "",
      avatar: p.avatar || prev.avatar || ""
    });
  });

  if (currentUser && currentUser.id) {
    const uid = String(currentUser.id);
    const prev = map.get(uid) || {};
    map.set(uid, {
      id: uid,
      name: currentUser.name || prev.name || "",
      avatar: currentUser.avatar || prev.avatar || ""
    });
  }

  return map;
}

function normalizeType(t) {
  const k = String(t || "like").toLowerCase();
  if (k === "heart") return "love";
  if (k === "thumbs_up") return "like";
  if (k === "laugh") return "haha";
  return REACTION_EMOJIS[k] ? k : "like";
}

function getProfileHref(targetUserId, isSelf) {
  if (isSelf) return "profile.html";
  return `profile.html?userId=${encodeURIComponent(String(targetUserId))}&id=${encodeURIComponent(String(targetUserId))}`;
}

function getMutualFriendsCount(targetUserId) {
  if (!currentUser || !currentUser.id || !targetUserId) return 0;
  const friends = readList("friends");
  const myFriends = new Set();
  const theirFriends = new Set();

  friends.forEach(f => {
    const a = String(f.userId || f.user_id || "");
    const b = String(f.friendId || f.friend_id || "");
    if (a === String(currentUser.id) && b) myFriends.add(b);
    if (b === String(currentUser.id) && a) myFriends.add(a);
    if (a === String(targetUserId) && b) theirFriends.add(b);
    if (b === String(targetUserId) && a) theirFriends.add(a);
  });

  let mutual = 0;
  myFriends.forEach(id => {
    if (theirFriends.has(id)) mutual += 1;
  });
  return mutual;
}

function isFriend(userAId, userBId) {
  if (!userAId || !userBId) return false;
  const friends = readList("friends");
  return friends.some(f => {
    const a = String(f.userId || f.user_id || "");
    const b = String(f.friendId || f.friend_id || "");
    return (a === String(userAId) && b === String(userBId)) ||
           (a === String(userBId) && b === String(userAId));
  });
}

function getPendingRequest(fromId, toId) {
  if (!fromId || !toId) return null;
  const reqs = readList("friendRequests");
  return reqs.find(r =>
    r.status === "pending" &&
    String(r.fromId || r.from_id || "") === String(fromId) &&
    String(r.toId || r.to_id || "") === String(toId)
  ) || null;
}

function hasIncomingRequestFrom(otherUserId) {
  if (!currentUser || !currentUser.id || !otherUserId) return false;
  return Boolean(getPendingRequest(otherUserId, currentUser.id));
}

function addFriendPair(userAId, userBId) {
  if (!userAId || !userBId || String(userAId) === String(userBId)) return;
  const friends = readList("friends");
  if (!isFriend(userAId, userBId)) {
    friends.push({
      id: "fr_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      userId: String(userAId),
      friendId: String(userBId),
      createdAt: new Date().toISOString()
    });
    writeList("friends", friends);
  }
}

function sendFriendRequest(toUserId) {
  if (!currentUser || !currentUser.id) return;
  const fromId = String(currentUser.id);
  const toId = String(toUserId);
  if (fromId === toId || isFriend(fromId, toId)) return;
  if (getPendingRequest(fromId, toId)) return;

  const reqs = readList("friendRequests");
  reqs.push({
    id: "req_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    fromId,
    fromName: currentUser.name || fromId,
    fromAvatar: currentUser.avatar || "",
    toId,
    status: "pending",
    createdAt: new Date().toISOString()
  });
  writeList("friendRequests", reqs);
  broadcastReactionSync();
  loadReactions(true);
}

function confirmFriendRequest(requesterId) {
  if (!currentUser || !currentUser.id) return;
  const myId = String(currentUser.id);
  const reqs = readList("friendRequests");
  const updated = reqs.map(r => {
    const fId = String(r.fromId || r.from_id || "");
    const tId = String(r.toId || r.to_id || "");
    if (r.status === "pending" && fId === String(requesterId) && tId === myId) {
      return { ...r, status: "accepted" };
    }
    return r;
  });
  writeList("friendRequests", updated);

  addFriendPair(myId, requesterId);
  broadcastReactionSync();
  loadReactions(true);
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getInitials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return "U";
}

function updateBackLink() {
  const backEl = document.getElementById("backBtn");
  const uid = String((currentUser && currentUser.id) || "");
  const postAuthorId = String((currentPost && (currentPost.authorId || currentPost.userId || currentPost.user_id)) || "");
  const isOwnPost = Boolean(uid && postAuthorId && uid === postAuthorId);

  if (fromPage.includes("profile") || isOwnPost) {
    backEl.href = "profile.html";
  } else if (fromPage.includes("comments")) {
    backEl.href = `comments.html?post=${encodeURIComponent(postId)}&from=${encodeURIComponent(fromPage)}`;
  } else {
    backEl.href = "index.html";
  }
}

function collectRawReactionsForPost(pid) {
  const posts = readList("posts");
  const instantPosts = readList("autro_instant_feed_posts");
  const profilePosts = readList("autro_profile_posts");

  const foundPost =
    posts.find(p => String(p.id) === String(pid)) ||
    instantPosts.find(p => String(p.id) === String(pid)) ||
    profilePosts.find(p => String(p.id) === String(pid)) ||
    null;

  currentPost = foundPost;

  const combined = [];
  if (foundPost && Array.isArray(foundPost.reactions)) {
    foundPost.reactions.forEach(r => {
      if (r && typeof r === "object") combined.push(r);
    });
  }

  const reactionStores = ["autro_post_reactions", "postReactions", "autro_reactions_store", "reactions_by_post"];
  reactionStores.forEach(storeKey => {
    const storeObj = readObject(storeKey);
    const val = storeObj[String(pid)];
    if (Array.isArray(val)) {
      val.forEach(item => {
        if (item && typeof item === "object") combined.push(item);
        else if (typeof item === "string") combined.push({ type: item, userId: currentUser?.id || "" });
      });
    } else if (val && typeof val === "object") {
      Object.entries(val).forEach(([k, v]) => {
        if (typeof v === "string") combined.push({ userId: k, type: v });
      });
    }
  });

  const byUser = new Map();
  combined.forEach((r, idx) => {
    const uid = String(r.userId || r.user_id || r.author_id || r.id || "").trim() || `reactor_${idx + 1}`;
    const existing = byUser.get(uid) || {};
    byUser.set(uid, {
      ...existing,
      ...r,
      userId: uid,
      name: extractNameFromRow(r) || extractNameFromRow(existing) || "",
      avatar: extractAvatarFromRow(r) || extractAvatarFromRow(existing) || "",
      type: normalizeType(r.type || r.reaction_type || r.reaction || r.emoji || existing.type)
    });
  });

  return Array.from(byUser.values());
}

async function fetchProfilesForUserIds(userIds) {
  if (!sbClient) return;
  const cleanIds = Array.from(
    new Set(
      (userIds || [])
        .map(id => String(id || "").trim())
        .filter(id => id && !id.startsWith("reactor_") && id !== "user_101")
    )
  );
  if (!cleanIds.length) return;

  for (const tbl of ["profiles", "users"]) {
    try {
      const { data, error } = await sbClient
        .from(tbl)
        .select("*")
        .in("id", cleanIds);

      if (!error && Array.isArray(data) && data.length) {
        data.forEach(row => {
          const uid = String(row.id || row.user_id || "").trim();
          if (!uid) return;
          const prev = supabaseProfilesMap.get(uid) || {};
          supabaseProfilesMap.set(uid, {
            id: uid,
            name: extractNameFromRow(row) || prev.name || "",
            avatar: extractAvatarFromRow(row) || prev.avatar || ""
          });
        });
      }
    } catch (_) {}
  }
}

async function syncReactionsFromSupabase() {
  if (!sbClient) return;
  const pid = String(postId);
  if (pid.startsWith("local-")) return;

  try {
    const { data, error } = await sbClient
      .from("post_reactions")
      .select("*")
      .eq("post_id", pid);

    if (error || !Array.isArray(data)) return;

    const userIds = data.map(row => String(row.user_id || row.userId || "").trim()).filter(Boolean);
    await fetchProfilesForUserIds(userIds);

    const formatted = data.map(row => {
      const uid = String(row.user_id || row.userId || row.id || "").trim();
      const prof = supabaseProfilesMap.get(uid) || {};
      return {
        userId: uid,
        name: extractNameFromRow(row) || prof.name || "",
        avatar: extractAvatarFromRow(row) || prof.avatar || "",
        type: normalizeType(row.reaction_type || row.type || row.reaction)
      };
    });

    const posts = readList("posts");
    const idx = posts.findIndex(p => String(p.id) === pid);
    if (idx !== -1) {
      posts[idx] = { ...posts[idx], reactions: formatted, reaction_count: formatted.length };
      writeList("posts", posts);
    }

    const store = readObject("autro_post_reactions");
    store[pid] = formatted;
    writeObject("autro_post_reactions", store);

    loadReactions(true);
  } catch (_) {}
}

function loadReactions(forceRender = false) {
  currentUser = currentUser || getOrCreateLocalUser();
  const listEl = document.getElementById("reactionList");

  const rawReactions = collectRawReactionsForPost(postId);
  updateBackLink();

  const usersMap = getUsersMap();
  const profilesSignature = Array.from(supabaseProfilesMap.entries())
    .map(([k, v]) => `${k}:${v.name}:${v.avatar}`)
    .join("|");

  const snapshot = JSON.stringify({
    reactions: rawReactions,
    me: currentUser ? `${currentUser.id}:${currentUser.name}:${currentUser.avatar}` : "",
    profiles: profilesSignature,
    friends: localStorage.getItem("friends") || "",
    reqs: localStorage.getItem("friendRequests") || "",
    users: localStorage.getItem("users") || ""
  });

  if (!forceRender && snapshot === lastSnapshot) {
    return;
  }
  lastSnapshot = snapshot;

  reactorItems = rawReactions.map(r => {
    const uid = String(r.userId || "").trim();
    const profile = usersMap.get(uid) || {};
    const isSelf = Boolean(currentUser && currentUser.id && uid === String(currentUser.id));

    const displayName = isSelf
      ? (currentUser.name || profile.name || r.name || uid || "Member")
      : (profile.name || r.name || uid || "Member");

    const avatar = isSelf
      ? (currentUser.avatar || profile.avatar || r.avatar || "")
      : (profile.avatar || r.avatar || "");

    const alreadyFriend = isSelf || (currentUser && currentUser.id ? isFriend(currentUser.id, uid) : false);
    const incomingReq = !isSelf && currentUser && currentUser.id ? getPendingRequest(uid, currentUser.id) : null;
    const mutualCount = isSelf ? 0 : getMutualFriendsCount(uid);

    return {
      userId: uid,
      name: displayName,
      avatar,
      type: normalizeType(r.type || r.reaction_type),
      isSelf,
      alreadyFriend,
      hasIncomingRequest: Boolean(incomingReq),
      mutualCount
    };
  });

  updateCounts(reactorItems);

  if (reactorItems.length === 0) {
    listEl.innerHTML = `<div class="empty">No reactions yet.</div>`;
    return;
  }

  renderReactions();
}

function updateCounts(items) {
  const counts = {
    all: items.length,
    love: 0,
    like: 0,
    care: 0,
    haha: 0,
    sad: 0,
    wow: 0,
    angry: 0
  };
  items.forEach(item => {
    if (counts[item.type] !== undefined) counts[item.type] += 1;
  });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById(`count-${k}`);
    if (el) el.textContent = counts[k];
  });
}

function selectTab(type, btn) {
  currentType = type;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderReactions();
}

function renderReactions() {
  const listEl = document.getElementById("reactionList");
  const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();

  let list = currentType === "all"
    ? [...reactorItems]
    : reactorItems.filter(item => item.type === currentType);

  if (q) {
    list = list.filter(item =>
      item.name.toLowerCase().includes(q) ||
      item.userId.toLowerCase().includes(q)
    );
  }

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty">No reactions yet.</div>`;
    return;
  }

  listEl.innerHTML = list.map(item => {
    const emoji = REACTION_EMOJIS[item.type] || "👍";
    const profileUrl = getProfileHref(item.userId, item.isSelf);
    const avatarHtml = item.avatar
      ? `<img class="avatar" src="${escapeHtml(item.avatar)}" alt="${escapeHtml(item.name)}" loading="lazy">`
      : `<div class="avatar-fallback">${escapeHtml(getInitials(item.name))}</div>`;

    const subText = item.mutualCount > 0
      ? `${item.mutualCount} mutual ${item.mutualCount === 1 ? "friend" : "friends"}`
      : "";

    let rightControl = "";
    if (!item.isSelf) {
      if (item.hasIncomingRequest || hasIncomingRequestFrom(item.userId)) {
        rightControl = `<button type="button" class="action-btn btn-dark-green" onclick="confirmFriendRequest('${escapeHtml(item.userId)}')">Confirm</button>`;
      } else if (item.alreadyFriend) {
        rightControl = `<a class="action-btn btn-mention-green" href="${profileUrl}">&#128269; Mention</a>`;
      } else {
        rightControl = `<button type="button" class="action-btn btn-dark-green" onclick="sendFriendRequest('${escapeHtml(item.userId)}')">Add friend</button>`;
      }
    }

    return `
      <div class="user-row">
        <a class="user-link" href="${profileUrl}">
          <div class="avatar-wrap">
            ${avatarHtml}
            <span class="reaction-corner-badge">${emoji}</span>
          </div>
          <div class="user-meta">
            <div class="user-name">${escapeHtml(item.name)}</div>
            ${subText ? `<div class="user-sub">${escapeHtml(subText)}</div>` : ""}
          </div>
        </a>
        ${rightControl}
      </div>
    `;
  }).join("");
}

function subscribeLiveUpdates() {
  if (liveChannel) {
    liveChannel.onmessage = event => {
      const data = event?.data || {};
      if (!data.postId || String(data.postId) === String(postId)) {
        syncReactionsFromSupabase();
        loadReactions(true);
      }
    };
  }

  window.addEventListener("autro:post-updated", event => {
    const data = event?.detail || {};
    if (!data.postId || String(data.postId) === String(postId)) {
      syncReactionsFromSupabase();
      loadReactions(true);
    }
  });

  if (sbClient && typeof sbClient.channel === "function") {
    try {
      sbClient
        .channel(`reactions_live_${postId}`)
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "post_reactions", filter: `post_id=eq.${String(postId)}` },
          () => {
            syncReactionsFromSupabase();
          }
        )
        .subscribe();
    } catch (_) {}
  }
}

window.addEventListener("storage", () => {
  if (pageInitialized) loadReactions(false);
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && pageInitialized) loadReactions(false);
});

async function initReactionsPage() {
  currentUser = getOrCreateLocalUser();
  pageInitialized = true;
  subscribeLiveUpdates();
  loadReactions(true);

  await resolveSessionUserSilently();
  await syncReactionsFromSupabase();
  loadReactions(true);

  setInterval(() => {
    if (pageInitialized) loadReactions(false);
  }, 1500);
}

initReactionsPage();
</script>
