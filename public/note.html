<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New status</title>
  <link rel="stylesheet" href="/theme.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-primary: #202124;
      --bg-secondary: #2b2c30;
      --bg-pill: #28292d;
      --bg-drawer: #242529;
      --text-primary: #ffffff;
      --text-muted: #9aa0a6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --share-inactive: #5f6368;
      --share-active: #137333;
      --share-active-hover: #1e8e3e;
      --accent-green: #137333;
      --accent-green-light: #2e9e54;
    }

    html[data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f1f3f4;
      --bg-pill: #f1f3f4;
      --bg-drawer: #f8f9fa;
      --text-primary: #202124;
      --text-muted: #5f6368;
      --border-subtle: rgba(32, 33, 36, 0.12);
      --share-inactive: #9aa0a6;
      --share-active: #137333;
      --share-active-hover: #0d652d;
      --accent-green: #137333;
      --accent-green-light: #1e8e3e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Top Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 8px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 50%;
    }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .color-wheel-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      background: conic-gradient(
        #ff3b30,
        #ff9500,
        #ffcc00,
        #34c759,
        #137333,
        #32ade6,
        #af52de,
        #ff2d55,
        #ff3b30
      );
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease;
    }

    .color-wheel-btn:hover {
      transform: scale(1.08);
    }

    .header-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .share-btn {
      background: transparent;
      border: none;
      color: var(--share-inactive);
      font-size: 16px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .share-btn.active {
      background-color: var(--share-active);
      color: #ffffff;
    }

    .share-btn.active:hover {
      background-color: var(--share-active-hover);
    }

    /* Center Stage with Mixed Color Aura */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      gap: 10px;
      position: relative;
    }

    .vibe-center-group {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 44px;
    }

    .color-aura {
      position: absolute;
      width: 245px;
      height: 245px;
      border-radius: 50%;
      filter: blur(36px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, background 0.25s ease;
      z-index: 0;
    }

    .color-aura.visible {
      opacity: 0.92;
    }

    .vibe-bubble-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transform: translateX(-14px);
      max-width: 240px;
      z-index: 2;
      margin-bottom: 10px;
    }

    .vibe-bubble {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.35;
      text-align: center;
      word-break: break-word;
      cursor: pointer;
      min-width: 112px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .vibe-bubble::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 7px 7px 0;
      border-style: solid;
      border-color: var(--bg-secondary) transparent transparent transparent;
    }

    .clear-vibe-btn {
      position: absolute;
      top: -10px;
      right: -12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background-color: rgba(128, 128, 128, 0.55);
      color: #ffffff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-vibe-btn.show {
      display: inline-flex;
    }

    .avatar-ring {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #3c4043;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .attachments-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      position: relative;
      z-index: 2;
    }

    .attached-photo {
      width: 124px;
      height: 124px;
      object-fit: cover;
      border-radius: 14px;
    }

    .attached-gif {
      width: 148px;
      border-radius: 12px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    .meta-chip button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    /* Inline Text Editor */
    .text-editor-box {
      display: none;
      width: 100%;
      max-width: 310px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--accent-green);
      border-radius: 14px;
      padding: 9px 12px;
      position: relative;
      z-index: 3;
    }

    .text-editor-box.open {
      display: block;
    }

    .text-editor-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 15px;
    }

    /* Emoji Drawer */
    .emoji-panel {
      display: none;
      width: 100%;
      max-width: 330px;
      max-height: 140px;
      overflow-y: auto;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 8px;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      position: relative;
      z-index: 3;
    }

    .emoji-panel.open {
      display: grid;
    }

    .emoji-item {
      background: transparent;
      border: none;
      font-size: 21px;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      line-height: 1.2;
    }

    .emoji-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .status-toast {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 14px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    /* Bottom Controls & Audience Link */
    .bottom-area {
      padding: 6px 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background-color: var(--bg-primary);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .toolbar-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 336px;
      background-color: var(--bg-pill);
      border-radius: 28px;
      padding: 12px 20px;
      gap: 6px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 8px;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .tool-btn:hover {
      transform: scale(1.08);
      opacity: 0.92;
    }

    .tool-aa {
      font-size: 19px;
      font-weight: 700;
      color: var(--accent-green-light);
      letter-spacing: -0.4px;
    }

    .tool-gif-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #e86aa8;
      border: 1.8px solid #e86aa8;
      border-radius: 5px;
      padding: 1px 4px;
      line-height: 1.1;
      letter-spacing: 0.3px;
    }

    /* Logo + Autrochat + Anyone > link to status-settings.html */
    .audience-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 999px;
      transition: background-color 0.15s ease;
    }

    .audience-trigger:hover {
      background-color: rgba(19, 115, 51, 0.16);
    }

    .app-logos-pair {
      display: inline-flex;
      align-items: center;
    }

    .app-logo-img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--bg-primary);
      background-color: var(--bg-secondary);
    }

    .app-logo-img + .app-logo-img {
      margin-left: -6px;
    }

    .audience-chevron {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1;
    }

    /* Up to 5 Colors Drawer (2nd screenshot grid style) */
    .color-drawer {
      display: none;
      width: 100%;
      background-color: var(--bg-drawer);
      border-top: 1px solid var(--border-subtle);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 10px 18px 20px;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 15;
    }

    .color-drawer.open {
      display: flex;
    }

    .drawer-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background-color: var(--text-muted);
      opacity: 0.5;
    }

    .drawer-heading {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .color-swatch {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .color-swatch:hover {
      transform: scale(1.05);
    }

    .color-swatch.selected {
      border-color: rgba(255, 255, 255, 0.85);
    }

    .swatch-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #202124;
      font-size: 12px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .color-swatch.selected .swatch-check {
      display: inline-flex;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <button id="closeBtn" class="icon-btn" type="button" aria-label="Close and go to profile">&times;</button>
    <div class="header-center">
      <button id="colorWheelBtn" class="color-wheel-btn" type="button" title="Choose up to 5 colors" aria-label="Choose up to 5 colors"></button>
      <div id="currentDate" class="header-date"></div>
    </div>
    <button id="shareBtn" class="share-btn" type="button">Share</button>
  </header>

  <main class="stage">
    <div class="vibe-center-group">
      <div id="colorAura" class="color-aura" aria-hidden="true"></div>

      <div class="avatar-ring">

      </div>
    </div>

    <div id="textEditorBox" class="text-editor-box">
      <input id="vibeTextInput" type="text" maxlength="120" placeholder="Type your current vibe..." />
    </div>

    <div id="emojiPanel" class="emoji-panel" aria-label="Emoji picker"></div>

    <div id="attachmentsPreview" class="attachments-preview"></div>

    <div id="statusToast" class="status-toast"></div>

  <footer class="bottom-area">

      <!-- 4. Music Note Outline -->
      <button id="btnMusic" class="tool-btn" type="button" title="Music file" aria-label="Music file">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#339af0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </button>

      <!-- 5. Gallery Image Outline -->
      <button id="btnGallery" class="tool-btn" type="button" title="Gallery photo" aria-label="Gallery photo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#20c997" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="3"/>

        <span class="tool-gif-badge">GIF</span>

    </div>

    <a href="status-settings.html" class="audience-trigger" id="audienceLink" title="Autrobook & Autrochat status settings">
      <span class="app-logos-pair">
        <img src="logo.png" alt="Autrobook" class="app-logo-img" />

      </span>
      <span id="audienceLabel">Anyone</span>
      <span class="audience-chevron">&rsaquo;</span>
    </a>
  </footer>

  <!-- Up to 5 Colors Picker Drawer -->
  <section id="colorDrawer" class="color-drawer" aria-label="Color mixer">
    <div class="drawer-handle"></div>
    <div class="drawer-heading">Choose up to 5 colors.</div>
    <div id="swatchGrid" class="swatch-grid"></div>

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Live date updater
    function updateLiveDate() {
      const d = new Date();
      currentDateEl.textContent = d.toLocaleDateString("en-US", {

        month: "short",
        day: "numeric"

    }
    updateLiveDate();
    setInterval(updateLiveDate, 30000);

    // Theme handling (#FFFFFF and #202124)
    function applyTheme(theme) {
      const normalized = theme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", normalized);
      localStorage.setItem("note_theme", normalized);
    }

    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(localStorage.getItem("note_theme") || (prefersDark ? "dark" : "light"));

    // Load saved audience label if set in status-settings.html
    const savedAudience = localStorage.getItem("autro_status_audience");
    if (savedAudience) {
      audienceLabel.textContent = savedAudience;
    }

    // Smooth multi-color blend around profile avatar (1 up to 5 colors)
    function renderColorAura() {
      const colors = vibeState.selectedColors;
      if (!colors.length) {
        colorAura.classList.remove("visible");
        colorAura.style.background = "none";
        return;
      }

      if (colors.length === 1) {
        colorAura.style.background = `radial-gradient(circle, ${colors[0]} 0%, ${colors[0]}80 48%, transparent 74%)`;
      } else {
        const layers = colors.map((hex, i) => {
          const angle = (360 / colors.length) * i;
          const rad = (angle * Math.PI) / 180;
          const x = Math.round(50 + Math.cos(rad) * 24);
          const y = Math.round(50 + Math.sin(rad) * 24);
          return `radial-gradient(circle at ${x}% ${y}%, ${hex} 0%, ${hex}78 44%, transparent 72%)`;
        });
        colorAura.style.background = layers.join(", ");
      }
      colorAura.classList.add("visible");
    }

    function updateSwatchSelectionUI() {
      const buttons = swatchGrid.querySelectorAll(".color-swatch");
      buttons.forEach((btn) => {
        const hex = btn.dataset.color;
        if (vibeState.selectedColors.includes(hex)) {
          btn.classList.add("selected");
        } else {
          btn.classList.remove("selected");
        }
      });
      renderColorAura();
      updateShareButtonState();
    }

    PALETTE_COLORS.forEach((hex) => {
      const swatch = document.createElement("button");
      swatch.type = "button";
      swatch.className = "color-swatch";
      swatch.dataset.color = hex;
      swatch.style.backgroundColor = hex;
      swatch.setAttribute("aria-label", `Select color ${hex}`);

      const check = document.createElement("span");
      check.className = "swatch-check";
      check.textContent = "✓";
      swatch.appendChild(check);

      swatch.addEventListener("click", () => {
        const existingIndex = vibeState.selectedColors.indexOf(hex);
        if (existingIndex !== -1) {
          vibeState.selectedColors.splice(existingIndex, 1);
        } else {
          if (vibeState.selectedColors.length >= MAX_COLORS) {
            vibeState.selectedColors.shift();
          }
          vibeState.selectedColors.push(hex);
        }
        updateSwatchSelectionUI();
      });

      swatchGrid.appendChild(swatch);
    });

    colorWheelBtn.addEventListener("click", () => {
      colorDrawer.classList.toggle("open");
    });

    // Populate Emoji Grid
    EMOJIS.forEach((emoji) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "emoji-item";
      btn.textContent = emoji;
      btn.addEventListener("click", () => {
        vibeState.emoji = emoji;
        renderVibe();
      });
      emojiPanel.appendChild(btn);
    });

    function hasAnySelection() {
      return Boolean(
        vibeState.text.trim() ||
        vibeState.emoji ||
        vibeState.location ||
        vibeState.photoDataUrl ||
        vibeState.audioName ||
        vibeState.gifUrl ||
        vibeState.selectedColors.length > 0
      );
    }

    function updateShareButtonState() {
      if (hasAnySelection()) {
        shareBtn.classList.add("active");
      } else {
        shareBtn.classList.remove("active");
      }
    }

    function renderVibe() {
      const combinedText = [vibeState.emoji, vibeState.text.trim()].filter(Boolean).join(" ");
      vibeBubble.textContent = combinedText || "current vibe...";
      clearVibeBtn.classList.toggle("show", Boolean(combinedText));

      attachmentsPreview.innerHTML = "";

      if (vibeState.location) {
        const chip = document.createElement("div");
        chip.className = "meta-chip";
        chip.innerHTML = `<span>&#128205; ${escapeHtml(vibeState.location)}</span>`;
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "×";
        del.onclick = () => {
          vibeState.location = "";
          renderVibe();
        };
        chip.appendChild(del);
        attachmentsPreview.appendChild(chip);
      }

      if (vibeState.audioName) {
        const chip = document.createElement("div");
        chip.className = "meta-chip";
        chip.innerHTML = `<span>&#9835; ${escapeHtml(vibeState.audioName)}</span>`;
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "×";
        del.onclick = () => {
          vibeState.audioName = "";
          vibeState.audioDataUrl = "";
          vibeState.audioFile = null;
          renderVibe();
        };
        chip.appendChild(del);
        attachmentsPreview.appendChild(chip);
      }

      if (vibeState.photoDataUrl) {
        const img = document.createElement("img");
        img.src = vibeState.photoDataUrl;
        img.alt = "Selected photo";
        img.className = "attached-photo";
        attachmentsPreview.appendChild(img);
      }

      if (vibeState.gifUrl) {
        const gif = document.createElement("img");
        gif.src = vibeState.gifUrl;
        gif.alt = "Selected GIF";
        gif.className = "attached-gif";
        attachmentsPreview.appendChild(gif);
      }

      updateShareButtonState();
    }

    clearVibeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      vibeState.text = "";
      vibeState.emoji = "";
      vibeTextInput.value = "";
      renderVibe();
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Load saved profile picture from Supabase
    async function loadSupabaseProfile() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const user = session?.user;
        if (user) {
          vibeState.userId = user.id;
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("avatar_url")
            .eq("id", user.id)
            .single();

          if (profile?.avatar_url) {
            profileAvatar.src = profile.avatar_url;
          } else if (user.user_metadata?.avatar_url) {
            profileAvatar.src = user.user_metadata.avatar_url;
          }
          return;
        }

        const { data: fallbackProfiles } = await supabaseClient
          .from("profiles")
          .select("id, avatar_url")
          .not("avatar_url", "is", null)
          .limit(1);

        if (fallbackProfiles && fallbackProfiles.length > 0 && fallbackProfiles[0].avatar_url) {
          profileAvatar.src = fallbackProfiles[0].avatar_url;
          vibeState.userId = fallbackProfiles[0].id;
        }
      } catch (err) {
        console.warn("Could not load Supabase profile avatar:", err);
      }
    }

    // Read GIF returned from gif.html
    function hydrateGifFromReturn() {
      const params = new URLSearchParams(window.location.search);
      const paramGif = params.get("gif");
      const storedGif = sessionStorage.getItem("selected_gif");
      if (paramGif) {
        vibeState.gifUrl = paramGif;
        sessionStorage.setItem("selected_gif", paramGif);
      } else if (storedGif) {
        vibeState.gifUrl = storedGif;
      }
      renderVibe();
    }

    // Aa Text button & bubble tap
    function toggleTextEditor() {
      emojiPanel.classList.remove("open");
      textEditorBox.classList.toggle("open");
      if (textEditorBox.classList.contains("open")) {
        vibeTextInput.value = vibeState.text;
        vibeTextInput.focus();
      }
    }

    document.getElementById("btnText").addEventListener("click", toggleTextEditor);
    vibeBubble.addEventListener("click", toggleTextEditor);

    vibeTextInput.addEventListener("input", (e) => {
      vibeState.text = e.target.value;
      renderVibe();
    });

    // Live Location button
    document.getElementById("btnLocation").addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusToast.textContent = "Geolocation is not supported on this device.";
        return;
      }
      statusToast.textContent = "Fetching live location...";
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          try {
            const res = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`
            );
            const geo = await res.json();
            const place =
              geo.address?.suburb ||
              geo.address?.city ||
              geo.address?.town ||
              geo.address?.state ||
              `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            vibeState.location = place;
          } catch {
            vibeState.location = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          }
          statusToast.textContent = "";
          renderVibe();
        },
        () => {
          statusToast.textContent = "Location permission denied.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // Emoji button
    document.getElementById("btnEmoji").addEventListener("click", () => {
      textEditorBox.classList.remove("open");
      emojiPanel.classList.toggle("open");
    });

    // Music file button -> opens phone audio files
    document.getElementById("btnMusic").addEventListener("click", () => {
      musicInput.click();
    });

    musicInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      vibeState.audioFile = file;
      vibeState.audioName = file.name;
      const reader = new FileReader();
      reader.onload = () => {
        vibeState.audioDataUrl = reader.result;
        renderVibe();
      };
      reader.readAsDataURL(file);
    });

    // Gallery button -> opens phone gallery images
    document.getElementById("btnGallery").addEventListener("click", () => {
      galleryInput.click();
    });

    galleryInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      vibeState.photoFile = file;
      const reader = new FileReader();
      reader.onload = () => {
        vibeState.photoDataUrl = reader.result;
        renderVibe();
      };
      reader.readAsDataURL(file);
    });

    // GIF button -> opens gif.html
    document.getElementById("btnGif").addEventListener("click", () => {
      window.location.href = "gif.html";
    });

    // Close (×) -> opens profile.html
    closeBtn.addEventListener("click", () => {
      window.location.href = "profile.html";
    });

    // Share -> saves current vibe (including mixed colors) to Supabase & local storage, then opens profile.html
    shareBtn.addEventListener("click", async () => {
      if (!hasAnySelection()) return;

      shareBtn.disabled = true;
      statusToast.textContent = "Sharing vibe...";

      const payload = {
        user_id: vibeState.userId || "guest",
        text: vibeState.text.trim(),
        emoji: vibeState.emoji,
        location: vibeState.location,
        photo_url: vibeState.photoDataUrl,
        audio_url: vibeState.audioDataUrl,
        audio_name: vibeState.audioName,
        gif_url: vibeState.gifUrl,
        colors: vibeState.selectedColors,
        avatar_url: profileAvatar.src,
        updated_at: new Date().toISOString()
      };

      localStorage.setItem("current_vibe", JSON.stringify(payload));
      const allVibes = JSON.parse(localStorage.getItem("all_user_vibes") || "{}");
      allVibes[payload.user_id] = payload;
      localStorage.setItem("all_user_vibes", JSON.stringify(allVibes));
      sessionStorage.removeItem("selected_gif");

      try {
        await supabaseClient.from("notes").upsert(payload, { onConflict: "user_id" });
      } catch (err) {
        console.warn("Supabase upsert note:", err);
      }

      const targetQuery =
        payload.user_id && payload.user_id !== "guest"
          ? `?user_id=${encodeURIComponent(payload.user_id)}`
          : "";
      window.location.href = `profile.html${targetQuery}`;
    });

    loadSupabaseProfile().then(hydrateGifFromReturn);
  </script>
</body>
</html>
