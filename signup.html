<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Sign Up</title>
<style>
body {
    margin:0; 
    background:#0a1a0f;
    color:#e4e6eb; 
    font-family:Arial;
    padding:20px;
}
.back {
    color:#81c784;
    text-decoration:none;
    font-size:24px;
}
h1 {
    font-size:24px;
    margin:20px 0 5px 0;
}
p {
    color:#b0b3b8;
    font-size:14px;
    margin-bottom:20px;
}
.input-group {
    display:flex;
    gap:10px;
}
input {
    width:100%;
    padding:14px;
    margin:8px 0;
    background:#13261a;
    border:1px solid #1f3d2a;
    border-radius:8px;
    color:#e4e6eb;
    font-size:15px;
    outline:none;
}
.btn {
    width:100%;
    padding:14px;
    margin:15px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#2e7d32;
    color:white;
}
.footer-link {
    text-align:center;
    color:#4caf50;
    text-decoration:none;
    font-size:14px;
    position:absolute;
    bottom:30px;
    left:0;
    right:0;
}
</style>
</head>
<body>

<a href="index.html" class="back">←</a>

<h1>What's your name?</h1>
<p>Enter the name you use in real life.</p>

<div class="input-group">
<input type="text" placeholder="First name">
<input type="text" placeholder="Last name">
</div>

<button class="btn" onclick="alert('Next step coming soon')">Next</button>

<a href="index.html" class="footer-link">Find my account</a>

</html>
