<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Autrobook</title>
<style>
:root{
  color-scheme: light dark;
}

/* ===== SYSTEM DEFAULT THEME ===== */
body{
  margin:0;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  /* Default = System */
  background: light-dark(#ffffff, #0a1a0f);
  color: light-dark(#111111, #e4e6eb);
}

.logo{
  width:70px;
  height:70px;
  border-radius:16px;
  animation: fadeIn 1s ease-in;
  object-fit: cover;
  /* Light mode এ লোগোর পিছনে একটু shadow, যাতে ভালো দেখায় */
  box-shadow: light-dark(0 4px 20px rgba(0,0,0,0.15), none);
}

.tagline{
  margin-top:15px;
  font-size:14px;
  color:#4caf50;
  animation: fadeIn 1.5s ease-in;
}

.footer{
  position:absolute;
  bottom:30px;
  font-size:12px;
  color: light-dark(#888888, #556b5e);
}

@keyframes fadeIn{
  from {opacity:0; transform: scale(0.8);}
  to {opacity:1; transform: scale(1);}
}

/* ===== OLD BROWSER SUPPORT ===== */
@media (prefers-color-scheme: light){
  body{ background:#ffffff; color:#111111; }
  .footer{ color:#888888; }
}
@media (prefers-color-scheme: dark){
  body{ background:#0a1a0f; color:#e4e6eb; }
  .footer{ color:#556b5e; }
}
</style>
</head>
<body>
<img src="logo.png" class="logo">
<div class="tagline">18+ Free Social Media Platform</div>
<div class="footer">from Autrobook</div>

<script>
// Redirect to login.html after 3 seconds
setTimeout(function(){
  window.location.href = "login.html";
}, 3000);
</script>
</body>
</html>
