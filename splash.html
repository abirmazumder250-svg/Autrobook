<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Autrobook</title>
<style>
  :root{ color-scheme: light dark; }

  /* ===== SYSTEM DEFAULT THEME ===== */
  body{ 
    margin:0; 
    font-family: Arial, sans-serif; 
    display:flex; 
    flex-direction:column; 
    justify-content:center; 
    align-items:center; 
    height:100vh; 
    height:100dvh; 
    text-align:center; 
    overflow:hidden; 
    background: light-dark(#ffffff, #0a1a0f); 
    color: light-dark(#111111, #e4e6eb); 
    transition: background 0.3s, color 0.3s; 
  }
  
  .logo{ 
    width:70px; 
    height:70px; 
    border-radius:16px; 
    animation: fadeIn 0.8s ease-in; 
    object-fit: cover; 
    background: light-dark(#e8f5e9, #1a2e22); 
    box-shadow: light-dark(0 4px 20px rgba(0,0,0,0.15), 0 0 0 transparent); 
  }
  
  .tagline{ 
    margin-top:15px; 
    font-size:14px; 
    font-weight:bold; 
    color:#4caf50; 
    animation: fadeIn 1s ease-in; 
  }
  
  .footer{ 
    position:absolute; 
    bottom:30px; 
    font-size:12px; 
    color: light-dark(#888888, #556b5e); 
  }
  
  .loader{ 
    width:40px; 
    height:4px; 
    background: light-dark(#ddd, #2a4a35); 
    border-radius:10px; 
    margin-top:22px; 
    overflow:hidden; 
  }
  
  .loader div{ 
    height:100%; 
    width:40%; 
    background:#4caf50; 
    border-radius:10px; 
    animation: load 0.8s infinite ease-in-out; 
  }
  
  @keyframes load{ 
    0%{ transform: translateX(-100%); } 
    100%{ transform: translateX(250%); } 
  }
  
  @keyframes fadeIn{ 
    from {opacity:0; transform: scale(0.8);} 
    to {opacity:1; transform: scale(1);} 
  }
  
  /* ===== OLD BROWSER SUPPORT ===== */
  @media (prefers-color-scheme: light){
    body{ background:#ffffff; color:#111111; }
    .logo{ background:#e8f5e9; box-shadow:0 4px 20px rgba(0,0,0,0.15); }
    .footer{ color:#888888; }
    .loader{ background:#ddd; }
  }
  
  @media (prefers-color-scheme: dark){
    body{ background:#0a1a0f; color:#e4e6eb; }
    .logo{ background:#1a2e22; box-shadow:none; }
    .footer{ color:#556b5e; }
    .loader{ background:#2a4a35; }
  }
</style>
</head>
<body>
  <img src="logo.png" class="logo" alt="Autrobook" onerror="this.src='https://via.placeholder.com/70/0a1a0f/4caf50?text=A'">
  <div class="tagline">18+ Free Social Media Platform</div>
  <div class="loader"><div></div></div>
  <div class="footer">from Autrobook</div>

<script>
  // Redirect after 1 second
  // If user is already logged in, go to home.html
  setTimeout(function(){
    try{
      const user = localStorage.getItem('autrobook_user');
      if(user){
        window.location.href = "home.html";
      } else {
        window.location.href = "login.html";
      }
    } catch(e){
      window.location.href = "login.html";
    }
  }, 1000); // 1000ms = 1 second
</script>
</body>
</html>
