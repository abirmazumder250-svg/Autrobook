<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<!-- Google reCAPTCHA - NEW SITE KEY -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  :root{--primary:#1b5e20;--primary-hover:#144817;--bg:#f0f2f5;--card:#ffffff;--text:#1c1e21;--muted:#65676b;--border:#e4e6e9;--input-bg:#fafafa;--error:#c62828;--success:#2e7d32;--shadow:0 10px 40px rgba(0,0,0,.08)}
  @media (prefers-color-scheme: dark){:root{--primary:#2e7d32;--primary-hover:#1b5e20;--bg:#0f1419;--card:#1a1f26;--text:#e8eaed;--muted:#9aa0a6;--border:#2a3038;--input-bg:#0f1419;--error:#ef5350;--success:#66bb6a;--shadow:0 10px 40px rgba(0,0,0,.4)}}
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{background-color:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
  .container{background:var(--card);width:100%;max-width:420px;padding:36px 28px;border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
  .logo-container{text-align:center;margin-bottom:20px}
  .logo-container img{width:100%;max-width:220px;object-fit:contain;display:block;margin:0 auto}
  h2{font-size:24px;font-weight:800;margin-bottom:6px;text-align:center}
  .subtitle{font-size:14px;color:var(--muted);text-align:center;margin-bottom:24px;line-height:1.5}
  .alert{display:none;padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;text-align:center;font-weight:500}
  .alert-error{display:block;background:rgba(198,40,40,.1);color:var(--error);border:1px solid var(--error)}
  .alert-success{display:block;background:rgba(46,125,50,.1);color:var(--success);border:1px solid var(--success)}
  .form-group{margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;outline:none;background-color:var(--input-bg);color:var(--text)}
  input:focus{border-color:var(--primary);background-color:var(--card)}
  .captcha-box{display:flex;justify-content:center;margin-bottom:20px}
  #resetBtn{width:100%;padding:15px;background-color:var(--primary);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
  #resetBtn:disabled{background:#9e9e9e;cursor:not-allowed}
  .back-link{display:block;text-align:center;margin-top:24px;font-size:14px;color:var(--primary);text-decoration:none;font-weight:600}
  .demo-box{margin-top:16px;background:var(--input-bg);border:1px dashed var(--border);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Autrobook Logo" onerror="this.style.display='none';document.getElementById('logoIcon').style.display='block'">
      <div id="logoIcon" style="display:none;font-size:40px;color:#1b5e20"><i class="fas fa-leaf"></i></div>
    </div>
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your email to receive a secure OTP</p>

    <div id="resetError" class="alert"></div>
    <div id="resetSuccess" class="alert"></div>

    <!-- STEP 1: EMAIL + CAPTCHA -->
    <div id="step1">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="resetEmail" placeholder="you@example.com">
      </div>
      <!-- NEW SITE KEY -->
      <div class="captcha-box">
        <div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d"></div>
      </div>
      <button type="button" id="resetBtn" onclick="sendOTP()">Send OTP</button>
      <div class="demo-box">Demo OTP: <b style="color:#1b5e20;font-size:16px">123456</b><br>Real App এ এই OTP Email এ যাবে।</div>
    </div>

    <!-- STEP 2: OTP + NEW PASSWORD -->
    <div id="step2" style="display:none">
      <div class="form-group">
        <label>OTP Code</label>
        <input type="text" id="otpCode" placeholder="123456" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPass" placeholder="New password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPass" placeholder="Confirm password">
      </div>
      <button type="button" id="resetBtn2" onclick="verifyAndReset()" style="width:100%;padding:15px;background:#1b5e20;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer">Reset Password</button>
    </div>

    <a href="welcome.html" class="back-link">← Back to Login</a>
  </div>

<script>
function showErr(t){var e=document.getElementById('resetError');e.textContent=t;e.className='alert alert-error';document.getElementById('resetSuccess').style.display='none'}
function showOk(t){var s=document.getElementById('resetSuccess');s.textContent=t;s.className='alert alert-success';document.getElementById('resetError').style.display='none'}

function sendOTP(){
  var email=document.getElementById('resetEmail').value.trim().toLowerCase();
  var btn=document.getElementById('resetBtn');
  if(!email){showErr('Please enter your email address');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('Please enter a valid email address');return}
  if(typeof grecaptcha==='undefined'){showErr('reCAPTCHA loading... Wait 2 sec and try again.');return}
  var captcha=grecaptcha.getResponse();
  if(!captcha){showErr("Please verify reCAPTCHA (I'm not a robot)");return}

  // Save email + demo OTP
  localStorage.setItem('resetEmail',email);
  localStorage.setItem('autro_reset_email',email);
  localStorage.setItem('autro_otp','123456');

  showOk('✅ Verification passed! OTP sent. Demo OTP is 123456');
  if(typeof grecaptcha!=='undefined') grecaptcha.reset();
  setTimeout(function(){
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    document.querySelector('.subtitle').textContent='Enter OTP 123456 and set new password';
  },800);
}

function verifyAndReset(){
  var otp=document.getElementById('otpCode').value.trim();
  var np=document.getElementById('newPass').value;
  var cp=document.getElementById('confirmPass').value;
  if(otp!=='123456'){showErr('Wrong OTP. Demo OTP is 123456');return}
  if(!np||np.length<4){showErr('New password must be 4+ characters.');return}
  if(np!==cp){showErr('Passwords do not match.');return}
  var email=localStorage.getItem('resetEmail')||localStorage.getItem('autro_reset_email');
  if(email==='demo@autrobook.com'){showErr('Demo account password cannot be changed.');return}
  var users=[];try{users=JSON.parse(localStorage.getItem('autro_users')||'[]')}catch(e){users=[]}
  var f=users.find(u=>(u.email||'').toLowerCase()===email);
  if(!f){showErr('No account found for this email. Please signup first.');return}
  f.password=np;
  localStorage.setItem('autro_users',JSON.stringify(users));
  showOk('✅ Password changed! Redirecting to Login...');
  setTimeout(function(){window.location.href='welcome.html'},1500);
}
</script>
</body>
</html>
