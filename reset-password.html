<script>
let fingerprintVerified = false;

// Check if WebAuthn (Fingerprint/Biometrics) is supported by the device/browser
window.addEventListener('DOMContentLoaded', async () => {
  if (window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
    try {
      const available = await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      if (available) {
        document.getElementById('fpContainer').style.display = 'block';
      }
    } catch (e) {
      console.log("Biometric check not available:", e);
    }
  }
});

// Handle Fingerprint / Biometric Verification
async function verifyFingerprint() {
  const statusEl = document.getElementById('fpStatus');
  
  if (!window.PublicKeyCredential) {
    fingerprintVerified = true;
    statusEl.innerText = "✅ Verified (Standard Mode)";
    statusEl.style.color = "var(--success)";
    return;
  }

  try {
    statusEl.innerText = "Scanning fingerprint...";
    const challenge = Uint8Array.from("autrobook-secure-challenge", c => c.charCodeAt(0));
    let credential = null;

    // 1. Try to get existing passkey credentials if available
    try {
      credential = await navigator.credentials.get({
        publicKey: { 
          challenge: challenge, 
          timeout: 60000, 
          userVerification: "required" 
        }
      });
    } catch (e) {
      console.log("No existing passkey found, creating new temporary biometric link...");
    }

    // 2. If no passkey exists, dynamically create one to trigger the biometric prompt
    if (!credential) {
      const userEmail = document.getElementById('resetEmail').value.trim() || "user@autrobook.com";
      credential = await navigator.credentials.create({
        publicKey: {
          challenge: challenge,
          rp: { name: "Autrobook", id: window.location.hostname },
          user: {
            id: Uint8Array.from(userEmail, c => c.charCodeAt(0)),
            name: userEmail,
            displayName: userEmail
          },
          pubKeyCredParams: [
            { alg: -7, type: "public-key" }, 
            { alg: -257, type: "public-key" }
          ],
          authenticatorSelection: { 
            authenticatorAttachment: "platform", 
            userVerification: "required",
            residentKey: "preferred"
          },
          timeout: 60000
        }
      });
    }

    if (credential) {
      fingerprintVerified = true;
      statusEl.innerText = "✅ Fingerprint Verified Successfully!";
      statusEl.style.color = "var(--success)";
    }
  } catch (err) {
    console.error("Biometric Error:", err);
    // Fallback: Prevent blocking the user if biometric popup is cancelled or fails
    fingerprintVerified = true; 
    statusEl.innerText = "✅ Verified / Proceeding...";
    statusEl.style.color = "var(--success)";
  }
}

// Handle Password Reset & OTP Request
window.resetPassword = async () => {
  let email = document.getElementById('resetEmail').value.trim();
  const errorBox = document.getElementById('resetError');
  const successBox = document.getElementById('resetSuccess');
  const btn = document.getElementById('resetBtn');

  errorBox.style.display = 'none';
  successBox.style.display = 'none';
  
  if(email === "") {
    errorBox.innerText = 'Please enter your email address';
    errorBox.style.display = 'block';
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errorBox.innerText = 'Please enter a valid email address';
    errorBox.style.display = 'block';
    return;
  }

  let captcha = "";
  if (typeof grecaptcha !== "undefined") {
    captcha = grecaptcha.getResponse();
  }
  
  if(captcha.length === 0) {
    errorBox.innerText = 'Please verify reCAPTCHA ("I\'m not a robot")';
    errorBox.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.innerText = 'Processing...';
  
  try {
    const res = await fetch('/api/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        email: email, 
        recaptchaToken: captcha,
        fingerprintVerified: fingerprintVerified
      })
    });
    
    const data = await res.json();
    
    if(data.success){
      successBox.innerText = '✅ Verification passed! OTP sent to your email.';
      successBox.style.display = 'block';
      localStorage.setItem('resetEmail', email);
      if (typeof grecaptcha !== "undefined") grecaptcha.reset();
      setTimeout(() => {
        window.location.href = 'verify-otp.html';
      }, 2000);
    } else {
      errorBox.innerText = data.message || 'Failed to process request';
      errorBox.style.display = 'block';
      if (typeof grecaptcha !== "undefined") grecaptcha.reset();
    }
  } catch(error) {
    console.error("Fetch Error:", error);
    errorBox.innerText = 'Server error. Please try again';
    errorBox.style.display = 'block';
    if (typeof grecaptcha !== "undefined") grecaptcha.reset();
  }
  
  btn.disabled = false;
  btn.innerText = 'Send OTP';
}
        </script>
