<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Autrobook</title>
  <!-- Google reCAPTCHA Script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  
  <style>
    /* ===== THEME & VARIABLES ===== */
    :root {
      --primary: #1b5e20;       /* Dark Green */
      --primary-hover: #144817;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #65676b;
      --border: #e4e6e9;
      --error: #c62828;
      --error-bg: #ffebee;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #2e7d32;
        --primary-hover: #1b5e20;
        --bg: #0f1419;
        --card: #1a1f26;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #2a3038;
        --error: #ef5350;
        --error-bg: rgba(239, 83, 80, 0.1);
        --success: #66bb6a;
        --success-bg: rgba(102, 187, 106, 0.1);
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle Background Glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 15% 20%, rgba(46, 125, 50, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 85% 80%, rgba(46, 125, 50, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== CARD ===== */
    .container {
      position: relative;
      z-index: 1;
      background: var(--card);
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== LOGO ===== */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: contain;
      background: var(--card);
      padding: 8px;
      box-shadow: 0 4px 16px rgba(27, 94, 32, 0.2);
    }

    h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      text-align: center;
      color: var(--text);
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* ===== ALERTS ===== */
    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 500;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error);
      border: 1px solid var(--error);
    }

    .alert-success {
      background-color: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success);
    }

    /* ===== FORM ===== */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
      background-color: var(--bg);
      color: var(--text);
    }

    input[type="email"]:focus {
      border-color: var(--primary);
      background-color: var(--card);
      box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.15);
    }

    /* ===== CAPTCHA ===== */
    .captcha-box {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      background: var(--card);
      padding: 4px;
      border-radius: 10px;
    }

    /* ===== BUTTON (Dark Green) ===== */
    #resetBtn {
      width: 100%;
      padding: 15px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(27, 94, 32, 0.3);
    }

    #resetBtn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(27, 94, 32, 0.4);
    }

    #resetBtn:active {
      transform: translateY(0) scale(0.98);
    }

    #resetBtn:disabled {
      background-color: #9e9e9e;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ===== FINGERPRINT SECTION ===== */
    #fpContainer {
      display: none;
      margin-bottom: 20px;
      padding: 16px;
      border: 1.5px dashed var(--primary);
      border-radius: 12px;
      text-align: center;
      background: var(--bg);
    }

    .fp-btn {
      background: var(--card);
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .fp-btn:hover {
      background: var(--primary);
      color: #ffffff;
    }

    #fpStatus {
      font-size: 12.5px;
      margin-top: 10px;
      color: var(--muted);
      font-weight: 500;
    }

    /* ===== FOOTER ===== */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container { padding: 28px 20px; }
      h2 { font-size: 22px; }
      .logo-container img { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <!-- Logo with fallback icon -->
      <img src="logo.png" alt="Autrobook Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-leaf\' style=\'font-size:40px;color:var(--primary);\'></i>';">
    </div>
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your email to receive a secure OTP</p>

    <div id="resetError" class="alert alert-error"></div>
    <div id="resetSuccess" class="alert alert-success"></div>

    <div class="form-group">
      <label for="resetEmail">Email Address</label>
      <input type="email" id="resetEmail" placeholder="you@example.com" required>
    </div>

    <!-- Fingerprint Verification Section -->
    <div id="fpContainer">
      <button type="button" class="fp-btn" onclick="verifyFingerprint()">
        <i class="fas fa-fingerprint" style="font-size:18px;"></i> Verify Device Fingerprint
      </button>
      <div id="fpStatus">Required biometric verification</div>
    </div>

    <div class="captcha-box">
      <!-- Google reCAPTCHA Site Key -->
      <div class="g-recaptcha" data-sitekey="6Lck5SAuAAAAAJAip9tn4qoVcWnHp02-yusatinK"></div>
    </div>

    <button type="button" id="resetBtn" onclick="resetPassword()">Send OTP</button>

    <a href="login.html" class="back-link">← Back to Login</a>
  </div>

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script>
    let fingerprintVerified = false;

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        try {
          const available = await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          const fpContainer = document.getElementById('fpContainer');
          if (fpContainer) fpContainer.style.display = 'block';
        } catch (e) {
          console.log("Biometric check not available:", e);
          const fpContainer = document.getElementById('fpContainer');
          if (fpContainer) fpContainer.style.display = 'block';
        }
      } else {
        const fpContainer = document.getElementById('fpContainer');
        if (fpContainer) fpContainer.style.display = 'block';
      }
    });

    window.verifyFingerprint = async () => {
      const statusEl = document.getElementById('fpStatus');
      
      if (!window.PublicKeyCredential) {
        fingerprintVerified = true;
        if (statusEl) {
          statusEl.innerText = "✅ Verified (Standard Mode)";
          statusEl.style.color = "var(--success)";
        }
        return;
      }

      try {
        if (statusEl) statusEl.innerText = "Scanning fingerprint...";
        const challenge = Uint8Array.from("autrobook-secure-challenge", c => c.charCodeAt(0));
        let credential = null;

        try {
          credential = await navigator.credentials.get({
            publicKey: { 
              challenge: challenge, 
              timeout: 60000, 
              userVerification: "required" 
            }
          });
        } catch (e) {
          console.log("No existing passkey found, creating new temporary biometric link...");
        }

        if (!credential) {
          const emailField = document.getElementById('resetEmail');
          const userEmail = (emailField && emailField.value.trim()) ? emailField.value.trim() : "user@autrobook.com";
          
          credential = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: "Autrobook", id: window.location.hostname },
              user: {
                id: Uint8Array.from(userEmail, c => c.charCodeAt(0)),
                name: userEmail,
                displayName: userEmail
              },
              pubKeyCredParams: [
                { alg: -7, type: "public-key" }, 
                { alg: -257, type: "public-key" }
              ],
              authenticatorSelection: { 
                authenticatorAttachment: "platform", 
                userVerification: "required",
                residentKey: "preferred"
              },
              timeout: 60000
            }
          });
        }

        if (credential) {
          fingerprintVerified = true;
          if (statusEl) {
            statusEl.innerText = "✅ Fingerprint Verified Successfully!";
            statusEl.style.color = "var(--success)";
          }
        }
      } catch (err) {
        console.error("Biometric Error:", err);
        fingerprintVerified = false; 
        if (statusEl) {
          statusEl.innerText = "❌ Verification failed or cancelled.";
          statusEl.style.color = "var(--error)";
        }
      }
    };

    window.resetPassword = async () => {
      let emailField = document.getElementById('resetEmail');
      let email = emailField ? emailField.value.trim() : "";
      const errorBox = document.getElementById('resetError');
      const successBox = document.getElementById('resetSuccess');
      const btn = document.getElementById('resetBtn');

      if (errorBox) errorBox.style.display = 'none';
      if (successBox) successBox.style.display = 'none';
      
      if (email === "") {
        if (errorBox) { 
          errorBox.innerText = 'Please enter your email address'; 
          errorBox.style.display = 'block'; 
        }
        return;
      }
      
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        if (errorBox) { 
          errorBox.innerText = 'Please enter a valid email address'; 
          errorBox.style.display = 'block'; 
        }
        return;
      }

      // Check if fingerprint is verified
      if (!fingerprintVerified) {
        if (errorBox) {
          errorBox.innerText = 'Please verify your device fingerprint before requesting OTP';
          errorBox.style.display = 'block';
        }
        return;
      }

      let captcha = "";
      if (typeof grecaptcha !== "undefined") {
        captcha = grecaptcha.getResponse();
      }
      
      if (captcha.length === 0) {
        if (errorBox) { 
          errorBox.innerText = 'Please verify reCAPTCHA ("I\'m not a robot")'; 
          errorBox.style.display = 'block'; 
        }
        return;
      }

      if (btn) { 
        btn.disabled = true; 
        btn.innerText = 'Processing...'; 
      }
      
      try {
        const res = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email: email, 
            recaptchaToken: captcha,
            fingerprintVerified: fingerprintVerified
          })
        });
        
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          throw new Error("Server returned non-JSON response (API endpoint missing or crashed)");
        }

        const data = await res.json();
        
        if (data.success) {
          if (successBox) {
            successBox.innerText = '✅ Verification passed! OTP sent to your email.';
            successBox.style.display = 'block';
          }
          localStorage.setItem('resetEmail', email);
          if (typeof grecaptcha !== "undefined") grecaptcha.reset();
          setTimeout(() => {
            window.location.href = 'verify-otp.html';
          }, 2000);
        } else {
          if (errorBox) {
            errorBox.innerText = data.message || 'Failed to process request';
            errorBox.style.display = 'block';
          }
          if (typeof grecaptcha !== "undefined") grecaptcha.reset();
        }
      } catch (error) {
        console.error("Fetch Error:", error);
        if (errorBox) {
          errorBox.innerText = 'Server error or API route /api/send-otp not found!';
          errorBox.style.display = 'block';
        }
        if (typeof grecaptcha !== "undefined") grecaptcha.reset();
      }
      
      if (btn) {
        btn.disabled = false;
        btn.innerText = 'Send OTP';
      }
    };
  </script>
</body>
</html>
