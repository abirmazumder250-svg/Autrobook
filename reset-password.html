<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Autrobook</title>
  <!-- Google reCAPTCHA Script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    :root {
      --primary: #198754;
      --primary-hover: #157347;
      --bg: #f4f6f4;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --error: #dc2626;
      --error-bg: #fee2e2;
      --success: #0f5132;
      --success-bg: #d1e7dd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      font-size: 22px;
      margin-bottom: 6px;
      text-align: center;
      color: var(--success);
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }

    .alert {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error);
    }

    .alert-success {
      background-color: var(--success-bg);
      color: var(--success);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input[type="email"]:focus {
      border-color: var(--primary);
    }

    #fpContainer {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      text-align: center;
      background: #f9fafb;
    }

    .fp-btn {
      background: #198754;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }

    .fp-btn:hover {
      background: #157347;
    }

    #fpStatus {
      font-size: 13px;
      margin-top: 8px;
      color: var(--muted);
    }

    .captcha-box {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    #resetBtn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #resetBtn:hover {
      background-color: var(--primary-hover);
    }

    #resetBtn:disabled {
      background-color: #a3cfbb;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your registered email to get a verification OTP</p>

    <div id="resetError" class="alert alert-error"></div>
    <div id="resetSuccess" class="alert alert-success"></div>

    <div class="form-group">
      <label for="resetEmail">Email Address</label>
      <input type="email" id="resetEmail" placeholder="Enter your email" required>
    </div>

    <div id="fpContainer">
      <button type="button" class="fp-btn" onclick="verifyFingerprint()">🔒 Verify Device Fingerprint</button>
      <div id="fpStatus">Optional biometric check</div>
    </div>

    <div class="captcha-box">
      <!-- Google reCAPTCHA Site Key integrated -->
      <div class="g-recaptcha" data-sitekey="6Lck5SAuAAAAAJAip9tn4qoVcWnHp02-yusatinK"></div>
    </div>

    <button type="button" id="resetBtn" onclick="resetPassword()">Send OTP</button>

    <a href="index.html" class="back-link">← Back to Login</a>
  </div>

  <script>
    let fingerprintVerified = false;

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        try {
          const available = await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (available) {
            const fpContainer = document.getElementById('fpContainer');
            if (fpContainer) fpContainer.style.display = 'block';
          }
        } catch (e) {
          console.log("Biometric check not available:", e);
        }
      }
    });

    window.verifyFingerprint = async () => {
      const statusEl = document.getElementById('fpStatus');
      
      if (!window.PublicKeyCredential) {
        fingerprintVerified = true;
        if (statusEl) {
          statusEl.innerText = "✅ Verified (Standard Mode)";
          statusEl.style.color = "var(--success)";
        }
        return;
      }

      try {
        if (statusEl) statusEl.innerText = "Scanning fingerprint...";
        const challenge = Uint8Array.from("autrobook-secure-challenge", c => c.charCodeAt(0));
        let credential = null;

        try {
          credential = await navigator.credentials.get({
            publicKey: { 
              challenge: challenge, 
              timeout: 60000, 
              userVerification: "required" 
            }
          });
        } catch (e) {
          console.log("No existing passkey found, creating new temporary biometric link...");
        }

        if (!credential) {
          const emailField = document.getElementById('resetEmail');
          const userEmail = (emailField && emailField.value.trim()) ? emailField.value.trim() : "user@autrobook.com";
          
          credential = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: "Autrobook", id: window.location.hostname },
              user: {
                id: Uint8Array.from(userEmail, c => c.charCodeAt(0)),
                name: userEmail,
                displayName: userEmail
              },
              pubKeyCredParams: [
                { alg: -7, type: "public-key" }, 
                { alg: -257, type: "public-key" }
              ],
              authenticatorSelection: { 
                authenticatorAttachment: "platform", 
                userVerification: "required",
                residentKey: "preferred"
              },
              timeout: 60000
            }
          });
        }

        if (credential) {
          fingerprintVerified = true;
          if (statusEl) {
            statusEl.innerText = "✅ Fingerprint Verified Successfully!";
            statusEl.style.color = "var(--success)";
          }
        }
      } catch (err) {
        console.error("Biometric Error:", err);
        fingerprintVerified = false; 
        if (statusEl) {
          statusEl.innerText = "❌ Verification failed or cancelled.";
          statusEl.style.color = "var(--error)";
        }
      }
    };

    window.resetPassword = async () => {
      let emailField = document.getElementById('resetEmail');
      let email = emailField ? emailField.value.trim() : "";
      const errorBox = document.getElementById('resetError');
      const successBox = document.getElementById('resetSuccess');
      const btn = document.getElementById('resetBtn');

      if (errorBox) errorBox.style.display = 'none';
      if (successBox) successBox.style.display = 'none';
      
      if (email === "") {
        if (errorBox) { 
          errorBox.innerText = 'Please enter your email address'; 
          errorBox.style.display = 'block'; 
        }
        return;
      }
      
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        if (errorBox) { 
          errorBox.innerText = 'Please enter a valid email address'; 
          errorBox.style.display = 'block'; 
        }
        return;
      }

      let captcha = "";
      if (typeof grecaptcha !== "undefined") {
        captcha = grecaptcha.getResponse();
      }
      
      if (captcha.length === 0) {
        if (errorBox) { 
          errorBox.innerText = 'Please verify reCAPTCHA ("I\'m not a robot")'; 
          errorBox.style.display = 'block'; 
        }
        return;
      }

      if (btn) { 
        btn.disabled = true; 
        btn.innerText = 'Processing...'; 
      }
      
      try {
        const res = await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email: email, 
            recaptchaToken: captcha,
            fingerprintVerified: fingerprintVerified
          })
        });
        
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          throw new Error("Server returned non-JSON response (API endpoint missing or crashed)");
        }

        const data = await res.json();
        
        if (data.success) {
          if (successBox) {
            successBox.innerText = '✅ Verification passed! OTP sent to your email.';
            successBox.style.display = 'block';
          }
          localStorage.setItem('resetEmail', email);
          if (typeof grecaptcha !== "undefined") grecaptcha.reset();
          setTimeout(() => {
            window.location.href = 'verify-otp.html';
          }, 2000);
        } else {
          if (errorBox) {
            errorBox.innerText = data.message || 'Failed to process request';
            errorBox.style.display = 'block';
          }
          if (typeof grecaptcha !== "undefined") grecaptcha.reset();
        }
      } catch (error) {
        console.error("Fetch Error:", error);
        if (errorBox) {
          errorBox.innerText = 'Server error or API route /api/send-otp not found!';
          errorBox.style.display = 'block';
        }
        if (typeof grecaptcha !== "undefined") grecaptcha.reset();
      }
      
      if (btn) {
        btn.disabled = false;
        btn.innerText = 'Send OTP';
      }
    };
  </script>
</body>
</html>
