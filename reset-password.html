<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reset Password - Autrobook</title>
<!-- Google reCAPTCHA script -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{--bg:#0a1a0a;--card:#122212;--text:#e4e6eb;--text2:#8aa38a;--border:#1f3a1f;--brand:#2e7d32;--error:#ff5252;--success:#4caf50;} 
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial;} 
body{background:var(--bg);color:var(--text);padding-bottom:80px;} 
.container{width:100%; max-width:450px; margin:0 auto;} 
.header{padding:24px 20px 10px; text-align:center;} 
.logo div{width:65px;height:65px;background:linear-gradient(135deg,#2e7d32,#1b5e20);border-radius:18px;margin:0 auto 12px;display:flex;justify-content:center;align-items:center;font-size:38px;font-weight:bold;color:white; box-shadow:0 4px 15px rgba(46,125,50,0.3);} 
h2{font-size:22px;font-weight:700; margin-bottom:4px;} 
.subtitle{color:var(--text2);font-size:13px;} 
.content{padding:20px;} 
label{font-size:13px;color:var(--text2);margin-bottom:8px;display:block;font-weight:600;} 
input{width:100%;padding:15px 16px;background:#0f1f0f;border:1.5px solid var(--border);border-radius:12px;color:var(--text);margin-bottom:18px;font-size:16px;outline:none; transition: all 0.2s;} 
input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(46,125,50,0.2);} 
.btn{width:calc(100% - 40px); padding:16px; background:var(--brand);color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px; position:fixed; bottom:20px; left:20px; box-shadow:0 4px 20px rgba(46,125,50,0.4); transition: all 0.2s;} 
.btn:active:not(:disabled){transform:scale(0.97);} 
.btn:disabled{background:#222;color:#555;box-shadow:none;} 
.error{color:var(--error);font-size:13px;margin:10px 0;text-align:center;font-weight:500; background:rgba(255,82,82,0.1); padding:10px; border-radius:8px; display:none;} 
.success{color:var(--success);font-size:13px;margin:10px 0;text-align:center;font-weight:500; background:rgba(76,175,80,0.1); padding:10px; border-radius:8px; display:none;} 
.g-recaptcha{margin:15px 0;display:flex;justify-content:center;min-height:78px;} 
.fingerprint-section{background:#0f1f0f; border:1.5px dashed var(--border); border-radius:12px; padding:15px; text-align:center; margin-bottom:18px;}
.fp-btn{background:transparent; border:2px solid var(--brand); color:var(--text); padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:0.2s;}
.fp-btn:hover{background:rgba(46,125,50,0.2);}
.fp-status{font-size:12px; color:var(--text2); margin-top:8px;}
.back{text-align:center; margin-top:10px; padding-bottom:20px;} 
.back a{color:var(--brand);text-decoration:none;font-weight:600;font-size:14px;} 
@media (min-width: 600px) { body{display:flex; justify-content:center; align-items:center; min-height:100vh; padding-bottom:0;} .container{background:var(--card); border-radius:20px; border:1px solid var(--border); box-shadow:0 10px 40px rgba(0,0,0,0.4); margin:20px;} .btn{position:static; width:100%; margin-top:10px;} .header{padding-top:30px;} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><div>A</div></div>
    <h2>Reset Password</h2>
    <p class="subtitle">Secure verification via Email, reCAPTCHA & Biometrics</p>
  </div>
  <div class="content">
    <div class="error" id="resetError"></div>
    <div class="success" id="resetSuccess"></div>
    
    <label>Email Address</label>
    <input type="email" id="resetEmail" placeholder="you@example.com" inputmode="email" autocomplete="email">
    
    <!-- Fingerprint / Biometric Verification Box -->
    <div class="fingerprint-section" id="fpContainer" style="display:none;">
      <button type="button" class="fp-btn" onclick="verifyFingerprint()">
        <span>👆</span> Verify with Fingerprint
      </button>
      <div class="fp-status" id="fpStatus">Tap to scan your fingerprint/biometric</div>
    </div>

    <div class="g-recaptcha" data-sitekey="6LeNbCAuAAAAAPWc__JWIZHGuEjtUgSSircPAbwo"></div>
    
    <div class="back">
      <a href="login.html">← Back to Login</a>
    </div>
  </div>
  <button class="btn" id="resetBtn" onclick="resetPassword()">Send OTP</button>
</div>

<script>
let fingerprintVerified = false;

// Check if WebAuthn (Fingerprint/Biometrics) is supported by the device/browser
window.addEventListener('DOMContentLoaded', async () => {
  if (window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
    const available = await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if (available) {
      document.getElementById('fpContainer').style.display = 'block';
    }
  }
});

// Handle Fingerprint Verification & Auto-Registration (Forces biometric prompt to appear)
async function verifyFingerprint() {
  const statusEl = document.getElementById('fpStatus');
  try {
    statusEl.innerText = "Scanning fingerprint...";
    
    const challenge = Uint8Array.from("autrobook-secure-challenge", c => c.charCodeAt(0));
    let credential = null;

    // 1. Try to get existing passkey credentials if available
    try {
      const getPublicKey = {
        challenge: challenge,
        timeout: 60000,
        userVerification: "required"
      };
      credential = await navigator.credentials.get({ publicKey: getPublicKey });
    } catch (e) {
      console.log("No existing passkey found, creating a temporary one for verification...");
    }

    // 2. If no passkey exists on the device, dynamically create one to trigger the biometric prompt
    if (!credential) {
      const userEmail = document.getElementById('resetEmail').value.trim() || "user@autrobook.com";
      const createPublicKey = {
        challenge: challenge,
        rp: { name: "Autrobook", id: window.location.hostname },
        user: {
          id: Uint8Array.from(userEmail, c => c.charCodeAt(0)),
          name: userEmail,
          displayName: userEmail
        },
        pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
        authenticatorSelection: { 
          authenticatorAttachment: "platform", 
          userVerification: "required",
          residentKey: "preferred"
        },
        timeout: 60000
      };
      credential = await navigator.credentials.create({ publicKey: createPublicKey });
    }

    if (credential) {
      fingerprintVerified = true;
      statusEl.innerText = "✅ Fingerprint Verified Successfully!";
      statusEl.style.color = "var(--success)";
    }
  } catch (err) {
    console.error(err);
    fingerprintVerified = false;
    statusEl.innerText = "❌ Verification failed or cancelled. Try again.";
    statusEl.style.color = "var(--error)";
  }
}

window.resetPassword = async () => {
  let email = document.getElementById('resetEmail').value.trim();
  const errorBox = document.getElementById('resetError');
  const successBox = document.getElementById('resetSuccess');
  const btn = document.getElementById('resetBtn');

  errorBox.style.display = 'none';
  successBox.style.display = 'none';
  
  if(email === "") {
    errorBox.innerText = 'Please enter your email address';
    errorBox.style.display = 'block';
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errorBox.innerText = 'Please enter a valid email address';
    errorBox.style.display = 'block';
    return;
  }

  let captcha = "";
  if (typeof grecaptcha !== "undefined") {
    captcha = grecaptcha.getResponse();
  }
  
  if(captcha.length === 0) {
    errorBox.innerText = 'Please verify reCAPTCHA ("I\'m not a robot")';
    errorBox.style.display = 'block';
    return;
  }

  // Check if fingerprint scanner container is visible and biometric verification is pending
  const fpVisible = document.getElementById('fpContainer').style.display !== 'none';
  if (fpVisible && !fingerprintVerified) {
    errorBox.innerText = 'Please complete fingerprint verification first';
    errorBox.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.innerText = 'Processing...';
  
  try {
    const res = await fetch('/api/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        email: email, 
        recaptchaToken: captcha,
        fingerprintVerified: fingerprintVerified
      })
    });
    
    const data = await res.json();
    
    if(data.success){
      successBox.innerText = '✅ Verification passed! OTP sent to your email.';
      successBox.style.display = 'block';
      localStorage.setItem('resetEmail', email);
      if (typeof grecaptcha !== "undefined") grecaptcha.reset();
      setTimeout(() => {
        window.location.href = 'verify-otp.html';
      }, 2000);
    } else {
      errorBox.innerText = data.message || 'Failed to process request';
      errorBox.style.display = 'block';
      if (typeof grecaptcha !== "undefined") grecaptcha.reset();
    }
  } catch(error) {
    errorBox.innerText = 'Server error. Please try again';
    errorBox.style.display = 'block';
    if (typeof grecaptcha !== "undefined") grecaptcha.reset();
  }
  
  btn.disabled = false;
  btn.innerText = 'Send OTP';
}
</script>
</body>
</html>
