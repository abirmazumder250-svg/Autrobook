<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reset Password - Autrobook</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{--bg:#0a1a0a;--card:#122212;--text:#e4e6eb;--text2:#8aa38a;--border:#1f3a1f;--brand:#2e7d32;--error:#ff5252;--success:#4caf50;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial;}
body{background:var(--bg);color:var(--text);padding-bottom:80px;}
.container{width:100%; max-width:450px; margin:0 auto;}
.header{padding:24px 20px 10px; text-align:center;}
.logo div{width:65px;height:65px;background:linear-gradient(135deg,#2e7d32,#1b5e20);border-radius:18px;margin:0 auto 12px;display:flex;justify-content:center;align-items:center;font-size:38px;font-weight:bold;color:white; box-shadow:0 4px 15px rgba(46,125,50,0.3);}
h2{font-size:22px;font-weight:700; margin-bottom:4px;}
.subtitle{color:var(--text2);font-size:13px;}
.content{padding:20px;}
label{font-size:13px;color:var(--text2);margin-bottom:8px;display:block;font-weight:600;}
input{width:100%;padding:15px 16px;background:#0f1f0f;border:1.5px solid var(--border);border-radius:12px;color:var(--text);margin-bottom:18px;font-size:16px;outline:none; transition: all 0.2s;}
input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(46,125,50,0.2);}
.btn{width:calc(100% - 40px); padding:16px; background:var(--brand);color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px; position:fixed; bottom:20px; left:20px; box-shadow:0 4px 20px rgba(46,125,50,0.4); transition: all 0.2s;}
.btn:active:not(:disabled){transform:scale(0.97);}
.btn:disabled{background:#222;color:#555;box-shadow:none;}
.error{color:var(--error);font-size:13px;margin:10px 0;text-align:center;font-weight:500; background:rgba(255,82,82,0.1); padding:10px; border-radius:8px;}
.success{color:var(--success);font-size:13px;margin:10px 0;text-align:center;font-weight:500; background:rgba(76,175,80,0.1); padding:10px; border-radius:8px;}
.g-recaptcha{margin:20px 0;display:flex;justify-content:center;}
.back{text-align:center; margin-top:10px; padding-bottom:20px;}
.back a{color:var(--brand);text-decoration:none;font-weight:600;font-size:14px;}
@media (min-width: 600px) {
body{display:flex; justify-content:center; align-items:center; min-height:100vh; padding-bottom:0;}
.container{background:var(--card); border-radius:20px; border:1px solid var(--border); box-shadow:0 10px 40px rgba(0,0,0,0.4); margin:20px;}
.btn{position:static; width:100%; margin-top:10px;}
.header{padding-top:30px;}
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo"><div>A</div></div>
<h2>Reset Password</h2>
<p class="subtitle">We'll send an OTP to your email</p>
</div>
<div class="content">
<div class="error" id="resetError"></div>
<div class="success" id="resetSuccess"></div>
<label>Email Address</label>
<input type="email" id="resetEmail" placeholder="you@example.com" inputmode="email" autocomplete="email">
<div class="g-recaptcha" data-sitekey="6LfzSBwuAAAAAK4XcwjLp9vNWxGECgLc2YcNdwD5" data-callback="enableBtn" data-expired-callback="disableBtn"></div>
<div class="back">
<a href="login.html">← Back to Login</a>
</div>
</div>
<button class="btn" id="resetBtn" onclick="resetPassword()" disabled>Send OTP</button>
</div>
<script>
// Initialize EmailJS once
(function(){ emailjs.init("kQ86I3mtRX2Ex93I6"); })();

window.enableBtn = () => { document.getElementById('resetBtn').disabled = false; }
window.disableBtn = () => { document.getElementById('resetBtn').disabled = true; }

window.resetPassword = async () => {
let email = document.getElementById('resetEmail').value.trim();
let captcha = grecaptcha.getResponse();
document.getElementById('resetError').innerText = '';
document.getElementById('resetSuccess').innerText = '';

if(email === "") {
document.getElementById('resetError').innerText = 'Please enter your email';
return;
}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
document.getElementById('resetError').innerText = 'Please enter a valid email';
return;
}
if(captcha.length == 0) {
document.getElementById('resetError').innerText = 'Please verify reCAPTCHA';
return;
}

document.getElementById('resetBtn').disabled = true;
document.getElementById('resetBtn').innerText = 'Sending...';

try {
// 1. Generate 6 digit OTP
const otpCode = Math.floor(100000 + Math.random() * 900000);

// 2. Send Email via EmailJS
await emailjs.send("service_rpnb15u", "template_wdjncjn", {
email: email,
otp: otpCode
});

// 3. Save to localStorage and redirect
localStorage.setItem('resetOTP', otpCode);
localStorage.setItem('resetEmail', email);
document.getElementById('resetSuccess').innerText = '✅ OTP sent to your email';
grecaptcha.reset();
window.disableBtn();
setTimeout(() => {
window.location.href = 'verify-otp.html';
}, 2000);

} catch(error) {
document.getElementById('resetError').innerText = 'Failed to send OTP: ' + error.text;
}

document.getElementById('resetBtn').disabled = false;
document.getElementById('resetBtn').innerText = 'Send OTP';
}
</script>
</body>
</html>
