<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Search — Autrobook</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/search-bar.css">
</head>
<body>

<header class="search-topbar">
  <button class="back-link-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
  <div class="search-input-wrap">
    <i class="fas fa-search search-focus-icon"></i>
    <input type="text" id="activeSearchField" placeholder="Search safety profiles, parameters, text tags..." autocomplete="off" autofocus>
  </div>
</header>

<div class="search-results-wrapper">
  <div class="recent-heading" id="searchContextTitle">History Manifest Logs</div>
  <div class="search-results-list" id="searchResultsList">
    <!-- Search item matches process dynamically -->
  </div>
</div>

<script src="js/search-bar.js"></script>
</body>
</html>
