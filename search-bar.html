<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Search — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --dark-green: #0B3D20;
      --dark-green-hover: #072915;
      --accent-green: #0a7d3b;
      --accent-mint: #10b981;
      --dark-green-soft: rgba(11, 61, 32, 0.12);
      --bg: #ffffff;
      --surface: #f4f6f5;
      --card: #ffffff;
      --text: #000000;
      --muted: #3d4741;
      --border: #d6ddd8;
      --btn-sec: #e8ece9;
      --btn-sec-hover: #d8dfd9;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 10px 26px rgba(11, 61, 32, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --dark-green-soft: rgba(16, 185, 129, 0.18);
        --bg: #000000;
        --surface: #0e120f;
        --card: #121713;
        --text: #ffffff;
        --muted: #b8c2bb;
        --border: #232c26;
        --btn-sec: #171e19;
        --btn-sec-hover: #212b24;
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.55);
        --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.78);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    /* Sticky Search Header */
    .search-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 12px 16px 10px;
    }

    .search-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .back-btn:hover {
      background: var(--btn-sec-hover);
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .search-box-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input-icon {
      position: absolute;
      left: 16px;
      color: var(--accent-green);
      font-size: 16px;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      .search-input-icon {
        color: var(--accent-mint);
      }
    }

    .search-input {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 44px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15.5px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
      display: none;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      background: var(--card);
      border-color: var(--accent-green);
      box-shadow: 0 0 0 4px var(--dark-green-soft);
    }

    @media (prefers-color-scheme: dark) {
      .search-input:focus {
        border-color: var(--accent-mint);
      }
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--btn-sec);
      color: var(--text);
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-btn.visible {
      display: inline-flex;
    }

    .clear-btn:hover {
      background: var(--btn-sec-hover);
    }

    .search-submit-btn {
      height: 44px;
      padding: 0 18px;
      flex-shrink: 0;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: var(--dark-green);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .search-submit-btn:hover {
      background: var(--dark-green-hover);
    }

    .search-submit-btn:active {
      transform: scale(0.97);
    }

    /* Filter Chips */
    .filter-chips {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      height: 34px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .filter-chip:hover {
      background: var(--btn-sec-hover);
    }

    .filter-chip.active {
      background: var(--dark-green);
      border-color: var(--accent-mint);
      color: #ffffff;
    }

    .chip-count {
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.16);
      color: var(--text);
    }

    .filter-chip.active .chip-count {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Main Content Container */
    .search-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Hero Discovery Banner */
    .discover-card {
      padding: 18px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .discover-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .discover-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--dark-green-soft);
      color: var(--dark-green);
      font-size: 12px;
      font-weight: 700;
    }

    @media (prefers-color-scheme: dark) {
      .discover-badge {
        color: var(--accent-mint);
      }
    }

    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-mint);
    }

    .discover-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .discover-desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
    }

    .trending-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .trend-tag {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.15s ease;
    }

    .trend-tag:hover {
      border-color: var(--accent-mint);
      transform: translateY(-1px);
    }

    /* Section Headings */
    .section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text);
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent-green);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (prefers-color-scheme: dark) {
      .link-btn {
        color: var(--accent-mint);
      }
    }

    /* Recent Search Pills */
    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recent-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
    }

    .recent-query-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .recent-remove-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 2px;
    }

    .recent-remove-btn:hover {
      color: var(--text);
    }

    /* Result Cards */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-card {
      padding: 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.18s ease, transform 0.15s ease;
    }

    .result-card:hover {
      border-color: var(--accent-mint);
    }

    .result-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--dark-green);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 17px;
      border: 2px solid var(--border);
    }

    .result-body {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
    }

    .result-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .result-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result-image {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
      display: block;
      border: 1px solid var(--border);
    }

    .result-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--dark-green-soft);
      color: var(--dark-green);
      font-size: 11.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    @media (prefers-color-scheme: dark) {
      .result-badge {
        color: var(--accent-mint);
      }
    }

    .empty-box {
      text-align: center;
      padding: 36px 18px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .empty-box i {
      font-size: 34px;
      margin-bottom: 10px;
      display: block;
      color: var(--accent-green);
    }

    @media (prefers-color-scheme: dark) {
      .empty-box i {
        color: var(--accent-mint);
      }
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }

    .nav-item {
      color: var(--muted);
      font-size: 20px;
      text-decoration: none;
      padding: 8px 14px;
      transition: color 0.18s ease;
    }

    .nav-item.active {
      color: var(--dark-green);
    }

    @media (prefers-color-scheme: dark) {
      .nav-item.active {
        color: var(--accent-mint);
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Search Header -->
  <header class="search-header">
    <form class="search-top-row" onsubmit="handleSearchSubmit(event)">
      <a href="profile.html" class="back-btn" title="Back to Profile">
        <i class="fas fa-arrow-left"></i>
      </a>

      <div class="search-box-wrap">
        <i class="fas fa-search search-input-icon"></i>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search Autrobook people, posts, photos..."
          autocomplete="off"
          oninput="handleSearchInput()"
        >
        <button type="button" id="clearSearchBtn" class="clear-btn" title="Clear search" onclick="clearSearch()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <button type="submit" class="search-submit-btn">Search</button>
    </form>

    <!-- Category Filter Chips with Live Counts -->
    <div class="filter-chips" role="tablist" aria-label="Search filters">
      <button type="button" class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">
        <i class="fas fa-layer-group"></i>
        <span>All</span>
        <span id="countAll" class="chip-count">0</span>
      </button>
      <button type="button" class="filter-chip" data-filter="people" onclick="setFilter('people', this)">
        <i class="fas fa-user-friends"></i>
        <span>People</span>
        <span id="countPeople" class="chip-count">0</span>
      </button>
      <button type="button" class="filter-chip" data-filter="posts" onclick="setFilter('posts', this)">
        <i class="fas fa-newspaper"></i>
        <span>Posts</span>
        <span id="countPosts" class="chip-count">0</span>
      </button>
      <button type="button" class="filter-chip" data-filter="photos" onclick="setFilter('photos', this)">
        <i class="fas fa-image"></i>
        <span>Photos</span>
        <span id="countPhotos" class="chip-count">0</span>
      </button>
    </div>
  </header>

  <!-- Main Search Body -->
  <main class="search-container">
    <!-- Discovery & Live Status Banner -->
    <section id="discoverCard" class="discover-card">
      <div class="discover-top">
        <div class="discover-badge">
          <i class="fas fa-leaf"></i>
          <span>Autrobook Live Search</span>
        </div>
        <div id="liveSyncStatus" class="live-status-pill">
          <span class="live-dot"></span>
          <span>Live synced</span>
        </div>
      </div>
      <h1 class="discover-title">Find people, updates &amp; moments</h1>
      <p class="discover-desc">
        Search across real Autrobook profiles, posts, and shared photos with instant live counts.
      </p>
      <div class="trending-tags">
        <button type="button" class="trend-tag" onclick="applyQuickQuery('Autrobook')">#Autrobook</button>
        <button type="button" class="trend-tag" onclick="applyQuickQuery('post')">#post</button>
        <button type="button" class="trend-tag" onclick="applyQuickQuery('photo')">#photo</button>
        <button type="button" class="trend-tag" onclick="applyQuickQuery('update')">#update</button>
      </div>
    </section>

    <!-- Recent Searches -->
    <section id="recentSection" class="section-block">
      <div class="section-header">
        <h2 class="section-title">Recent searches</h2>
        <button type="button" id="clearAllRecentBtn" class="link-btn" onclick="clearAllRecent()">Clear all</button>
      </div>
      <div id="recentList" class="recent-list"></div>
    </section>

    <!-- Search Results -->
    <section id="resultsSection" class="section-block" style="display:none;">
      <div class="section-header">
        <h2 id="resultsHeading" class="section-title">Search results</h2>
        <span id="resultsCount" class="link-btn">0 found</span>
      </div>
      <div id="resultsList" class="results-list"></div>
      <div id="emptyResultsBox" class="empty-box" style="display:none;">
        <i class="fas fa-search"></i>
        <div id="emptyResultsText">No matching results found. Try another keyword.</div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" title="Home"><i class="fas fa-home"></i></a>
    <a href="reels.html" class="nav-item" title="Reels"><i class="fas fa-clapperboard"></i></a>
    <a href="friends.html" class="nav-item" title="Friends"><i class="fas fa-user-friends"></i></a>
    <a href="groups.html" class="nav-item" title="Groups"><i class="fas fa-users"></i></a>
    <a href="notifications.html" class="nav-item" title="Notifications"><i class="fas fa-bell"></i></a>
    <a href="profile.html" class="nav-item" title="Profile"><i class="fas fa-user"></i></a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const RECENT_KEY = 'autrobook_recent_searches';

    let sb = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let activeUserId = null;
    let activeFilter = 'all';
    let searchTimer = null;
    let cachedProfiles = [];
    let cachedPosts = [];
    let profileMap = new Map();

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function setSyncLabel(text) {
      const el = document.getElementById('liveSyncStatus');
      if (!el) return;
      el.innerHTML = `<span class="live-dot"></span><span>${escapeHtml(text)}</span>`;
    }

    function getRecentSearches() {
      try {
        const list = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
        return Array.isArray(list) ? list : [];
      } catch (e) {
        return [];
      }
    }

    async function persistSearchLog(query) {
      const clean = (query || '').trim();
      if (!clean) return;

      const existing = getRecentSearches().filter(item => item.toLowerCase() !== clean.toLowerCase());
      existing.unshift(clean);
      const trimmed = existing.slice(0, 10);
      try {
        localStorage.setItem(RECENT_KEY, JSON.stringify(trimmed));
      } catch (e) {}
      renderRecentSearches();

      if (sb) {
        try {
          await sb.from('search_logs').insert({
            user_id: activeUserId || null,
            query: clean,
            filter_type: activeFilter
          });
        } catch (e) {
          // Optional table; localStorage & live search work seamlessly without it
        }
      }
    }

    function removeRecentSearch(query) {
      const updated = getRecentSearches().filter(item => item !== query);
      try {
        localStorage.setItem(RECENT_KEY, JSON.stringify(updated));
      } catch (e) {}
      renderRecentSearches();
    }

    function clearAllRecent() {
      try {
        localStorage.removeItem(RECENT_KEY);
      } catch (e) {}
      renderRecentSearches();
    }

    function renderRecentSearches() {
      const section = document.getElementById('recentSection');
      const listEl = document.getElementById('recentList');
      if (!section || !listEl) return;

      const items = getRecentSearches();
      if (!items.length) {
        section.style.display = 'none';
        listEl.innerHTML = '';
        return;
      }

      section.style.display = 'flex';
      listEl.innerHTML = items.map(term => `
        <div class="recent-pill">
          <button type="button" class="recent-query-btn" onclick="applyQuickQuery('${escapeHtml(term).replace(/'/g, "\\'")}')">
            <i class="fas fa-history" style="color:var(--muted);font-size:12px;"></i>
            <span>${escapeHtml(term)}</span>
          </button>
          <button type="button" class="recent-remove-btn" title="Remove" onclick="removeRecentSearch('${escapeHtml(term).replace(/'/g, "\\'")}')">
            <i class="fas fa-times"></i>
          </button>
        </div>
      `).join('');
    }

    function loadLocalFallbackData() {
      try {
        const userObj = JSON.parse(localStorage.getItem('autrobook_user') || '{}') || {};
        const fallbackProfiles = [];
        const fallbackPosts = [];

        if (userObj.full_name || userObj.username || userObj.id) {
          const pObj = {
            id: userObj.id || 'local-user',
            full_name: userObj.full_name || 'Autrobook Member',
            username: userObj.username || '',
            avatar_url: userObj.avatar_url || '',
            location: userObj.location || ''
          };
          fallbackProfiles.push(pObj);
        }

        if (Array.isArray(userObj.posts)) {
          userObj.posts.forEach((p, idx) => {
            fallbackPosts.push({
              id: p.id || `local-post-${idx}`,
              user_id: userObj.id || 'local-user',
              content: p.content || '',
              image_url: p.image_url || '',
              created_at: p.created_at || new Date().toISOString()
            });
          });
        }

        if (fallbackProfiles.length) cachedProfiles = fallbackProfiles;
        if (fallbackPosts.length) cachedPosts = fallbackPosts;
        rebuildProfileMap();
      } catch (e) {}
    }

    function rebuildProfileMap() {
      profileMap = new Map();
      cachedProfiles.forEach(p => {
        if (p && p.id) {
          profileMap.set(String(p.id), p);
        }
      });
    }

    async function syncAllLiveData() {
      loadLocalFallbackData();
      if (!sb) return;

      try {
        const { data: sessionData } = await sb.auth.getSession();
        activeUserId = sessionData?.session?.user?.id || null;
      } catch (e) {}

      let syncedAny = false;

      try {
        const { data: profRows, error: profErr } = await sb
          .from('profiles')
          .select('id, full_name, username, avatar_url, location')
          .order('updated_at', { ascending: false })
          .limit(50);

        if (!profErr && Array.isArray(profRows)) {
          cachedProfiles = profRows;
          rebuildProfileMap();
          syncedAny = true;
        }
      } catch (e) {
        console.warn('Profiles live sync warning:', e);
      }

      try {
        const { data: postRows, error: postErr } = await sb
          .from('posts')
          .select('id, user_id, content, image_url, created_at')
          .order('created_at', { ascending: false })
          .limit(60);

        if (!postErr && Array.isArray(postRows)) {
          cachedPosts = postRows;
          syncedAny = true;
        }
      } catch (e) {
        console.warn('Posts live sync warning:', e);
      }

      setSyncLabel(syncedAny ? 'Live database synced' : 'Local live cache');
    }

    function getMatchingBuckets(query) {
      const q = (query || '').trim().toLowerCase();

      const peopleMatches = cachedProfiles
        .filter(p => {
          const name = (p.full_name || '').toString();
          const uname = (p.username || '').toString();
          const loc = (p.location || '').toString();
          const hay = `${name} ${uname} ${loc}`.toLowerCase();
          return !q || hay.includes(q);
        })
        .map(p => {
          const name = (p.full_name || 'Autrobook Member').toString();
          const uname = (p.username || '').toString().replace(/^@+/, '');
          const loc = (p.location || '').toString();
          return {
            type: 'people',
            badge: 'Person',
            title: name,
            subtitle: uname ? `@${uname}` : (loc || 'Autrobook Member'),
            avatarUrl: p.avatar_url || '',
            initials: name.trim().charAt(0).toUpperCase() || 'A'
          };
        });

      const matchingPostsRaw = cachedPosts.filter(post => {
        const content = (post.content || '').toString();
        const author = profileMap.get(String(post.user_id || ''));
        const authorName = (author?.full_name || '').toString();
        const authorUname = (author?.username || '').toString();
        const hay = `${content} ${authorName} ${authorUname}`.toLowerCase();
        return !q || hay.includes(q);
      });

      const postMatches = matchingPostsRaw.map(post => {
        const author = profileMap.get(String(post.user_id || ''));
        const authorName = (author?.full_name || 'Autrobook Member').toString();
        const authorUname = (author?.username || '').toString().replace(/^@+/, '');
        const imgUrl = (post.image_url || '').toString().trim();
        const timePart = post.created_at ? new Date(post.created_at).toLocaleString() : '';
        const handlePart = authorUname ? `@${authorUname}` : '';
        const metaLine = [authorName, handlePart, timePart].filter(Boolean).join(' · ');

        return {
          type: 'posts',
          badge: imgUrl ? 'Post & Photo' : 'Post',
          title: authorName,
          subtitle: metaLine,
          avatarUrl: author?.avatar_url || '',
          initials: authorName.trim().charAt(0).toUpperCase() || 'A',
          text: (post.content || '').toString(),
          imageUrl: imgUrl
        };
      });

      const photoMatches = matchingPostsRaw
        .filter(post => Boolean((post.image_url || '').toString().trim()))
        .map(post => {
          const author = profileMap.get(String(post.user_id || ''));
          const authorName = (author?.full_name || 'Autrobook Member').toString();
          const imgUrl = (post.image_url || '').toString().trim();
          const timePart = post.created_at ? new Date(post.created_at).toLocaleDateString() : 'Recent photo';

          return {
            type: 'photos',
            badge: 'Photo',
            title: (post.content || '').toString().trim() || `Photo by ${authorName}`,
            subtitle: `${authorName} · ${timePart}`,
            imageUrl: imgUrl
          };
        });

      const allMatches = [...peopleMatches, ...postMatches];

      updateFilterCounts({
        all: allMatches.length,
        people: peopleMatches.length,
        posts: postMatches.length,
        photos: photoMatches.length
      });

      if (activeFilter === 'people') return peopleMatches;
      if (activeFilter === 'posts') return postMatches;
      if (activeFilter === 'photos') return photoMatches;
      return allMatches;
    }

    function updateFilterCounts(counts) {
      const cAll = document.getElementById('countAll');
      const cPeople = document.getElementById('countPeople');
      const cPosts = document.getElementById('countPosts');
      const cPhotos = document.getElementById('countPhotos');

      if (cAll) cAll.textContent = String(counts.all ?? 0);
      if (cPeople) cPeople.textContent = String(counts.people ?? 0);
      if (cPosts) cPosts.textContent = String(counts.posts ?? 0);
      if (cPhotos) cPhotos.textContent = String(counts.photos ?? 0);
    }

    function renderResults(items, query) {
      const section = document.getElementById('resultsSection');
      const listEl = document.getElementById('resultsList');
      const emptyBox = document.getElementById('emptyResultsBox');
      const countEl = document.getElementById('resultsCount');
      const headingEl = document.getElementById('resultsHeading');

      const hasQuery = Boolean((query || '').trim());
      if (!hasQuery && activeFilter === 'all') {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'flex';
      headingEl.textContent = hasQuery ? `Results for "${query.trim()}"` : `Browsing ${activeFilter}`;
      countEl.textContent = `${items.length} ${items.length === 1 ? 'result' : 'results'}`;

      if (!items.length) {
        listEl.innerHTML = '';
        emptyBox.style.display = 'block';
        return;
      }

      emptyBox.style.display = 'none';
      listEl.innerHTML = items.map(item => {
        const avatarHtml = item.type === 'people' || item.type === 'posts'
          ? (item.avatarUrl
              ? `<img src="${escapeHtml(item.avatarUrl)}" alt="${escapeHtml(item.title)}" class="result-avatar">`
              : `<div class="result-avatar">${escapeHtml(item.initials || 'A')}</div>`)
          : `<div class="result-avatar"><i class="fas fa-image"></i></div>`;

        const textHtml = item.text ? `<div class="result-text">${escapeHtml(item.text)}</div>` : '';
        const imgHtml = item.imageUrl ? `<img src="${escapeHtml(item.imageUrl)}" alt="Attachment" class="result-image">` : '';

        return `
          <article class="result-card">
            ${avatarHtml}
            <div class="result-body">
              <div class="result-title">${escapeHtml(item.title)}</div>
              ${item.subtitle ? `<div class="result-sub">${escapeHtml(item.subtitle)}</div>` : ''}
              ${textHtml}
              ${imgHtml}
            </div>
            <span class="result-badge">${escapeHtml(item.badge)}</span>
          </article>
        `;
      }).join('');
    }

    async function performSearch(shouldLogHistory = false) {
      const inputEl = document.getElementById('searchInput');
      const query = (inputEl?.value || '').trim();
      await syncAllLiveData();
      const filtered = getMatchingBuckets(query);
      renderResults(filtered, query);

      if (shouldLogHistory && query) {
        await persistSearchLog(query);
      }
    }

    function handleSearchInput() {
      const inputEl = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      const val = inputEl?.value || '';
      if (clearBtn) {
        clearBtn.classList.toggle('visible', val.trim().length > 0);
      }

      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        performSearch(false);
      }, 220);
    }

    async function handleSearchSubmit(event) {
      event.preventDefault();
      await performSearch(true);
    }

    function clearSearch() {
      const inputEl = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (inputEl) {
        inputEl.value = '';
        inputEl.focus();
      }
      if (clearBtn) clearBtn.classList.remove('visible');
      performSearch(false);
    }

    function setFilter(filterName, btnEl) {
      activeFilter = filterName;
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      performSearch(false);
    }

    function applyQuickQuery(term) {
      const inputEl = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (inputEl) {
        inputEl.value = term;
      }
      if (clearBtn) clearBtn.classList.add('visible');
      performSearch(true);
    }

    function subscribeRealtimeSearch() {
      if (!sb || typeof sb.channel !== 'function') return;
      try {
        sb.channel('autro-live-search')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => performSearch(false))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => performSearch(false))
          .subscribe();
      } catch (e) {
        console.warn('Realtime search skipped:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      renderRecentSearches();
      await performSearch(false);
      subscribeRealtimeSearch();
      document.getElementById('searchInput')?.focus();
    });
  </script>
</body>
