<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autrobook - Home</title>
<link rel="stylesheet" href="style.css?v=40">
<style>
:root{--bg:#18191a;--card:#242526;--card2:#3a3b3c;--text:#e4e6eb;--sub:#b0b3b8;--main:#043D22;--line:#3a3b3c}
[data-theme="light"]{--bg:#f0f2f5!important;--card:#ffffff!important;--card2:#f0f2f5!important;--text:#050505!important;--sub:#65676b!important;--line:#ddd!important}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg)!important;color:var(--text)!important;padding-bottom:85px}
.fbTop{background:#000!important;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;position:sticky;top:0;z-index:50}
.fbMenu{font-size:28px;color:#fff;cursor:pointer}
.fbLogo{font-size:30px;font-weight:900;color:#fff!important;letter-spacing:-1px;cursor:pointer}
.fbLogo span{color:#00c853!important}
.fbTopR{display:flex;gap:8px;align-items:center}
.fbIc{width:38px;height:38px;background:#222!important;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;position:relative;color:#fff}
.fbBadge{position:absolute;top:-6px;right:-6px;background:#e41e3f;color:#fff;font-size:11px;font-weight:bold;padding:2px 6px;border-radius:12px}
.fbMind{background:#000!important;display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #222}
.fbMind input{flex:1;background:#222!important;border:none;border-radius:20px;padding:11px 14px;color:#fff!important;font-size:15px;outline:none}
.fbMind input::placeholder{color:#aaa}
.fbPhoto{font-size:22px}
.ava{width:40px;height:40px;border-radius:50%;background:#043D22;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
/* REELS - NO HEADER, DIRECT */
.reelsTop{padding:10px 0 0 10px;background:var(--card);margin-top:8px}
.reelsRail{display:flex;gap:10px;overflow-x:auto;padding:0 10px 10px;scrollbar-width:none}
.reelsRail::-webkit-scrollbar{display:none}
.reelCard{min-width:140px;height:220px;border-radius:14px;position:relative;overflow:hidden;cursor:pointer;flex-shrink:0;background:#000}
.reelCard img{width:100%;height:100%;object-fit:cover}
.reelCard .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px}
.reelCard .rUser{position:absolute;top:8px;left:8px;display:flex;gap:6px;align-items:center;color:#fff;font-size:12px;font-weight:bold;text-shadow:0 1px 3px #000}
.reelCard .rMeta{position:absolute;bottom:8px;left:8px;color:#fff;font-size:12px;text-shadow:0 1px 3px #000}
.suggest{background:var(--card);margin-top:8px;padding:12px 0 0}
.suggestHead{display:flex;justify-content:space-between;padding:0 12px 10px}
.suggestRail{display:flex;gap:10px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}
.suggestRail::-webkit-scrollbar{display:none}
.sCard{min-width:200px;background:var(--card2);border-radius:12px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.sCard img{width:100%;height:140px;object-fit:cover}
.sCard .sBody{padding:10px}
.sCard .sName{font-weight:bold;font-size:15px}
.sCard .sMutual{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;margin:4px 0 8px}
.sCard .sMutual i{width:18px;height:18px;border-radius:50%;background:#043D22;display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;color:#fff}
.btnAdd{background:#043D22!important;color:#fff!important;border:none;width:100%;padding:9px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px}
.btnRemove{background:#4e4f50!important;color:#fff!important;border:none;width:100%;padding:9px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;margin-top:6px}
.seeAll{text-align:center;color:var(--sub);padding:10px;cursor:pointer;font-size:15px;border-top:1px solid var(--line)}
.post{background:var(--card);margin-top:8px;padding:0}
.postHead{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 8px}
.postHead .pAva{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid #043D22}
.postHead .pAva img{width:100%;height:100%;object-fit:cover}
.postHead .pInfo{flex:1}
.postHead .pInfo b{font-size:15px}
.postHead .pInfo div{font-size:13px;color:var(--sub);margin-top:2px}
.postHead .pDots{font-size:20px;color:var(--sub);cursor:pointer;padding:0 6px}
.postHead .pClose{font-size:22px;color:var(--sub);cursor:pointer;padding:0 4px}
.postTextBig{background:#e41e3f;color:#fff;text-align:center;padding:28px 16px;font-size:26px;font-weight:900;line-height:1.5}
.postMeta{display:flex;justify-content:space-between;padding:8px 12px;color:var(--sub);font-size:13px;border-bottom:1px solid var(--line)}
.postActions{display:flex;padding:4px 0}
.pa{flex:1;text-align:center;padding:8px;cursor:pointer;color:var(--sub);font-weight:600;background:none;border:none;font-size:14px}
.pa.liked{color:#043D22}
.card{background:var(--card)!important;color:var(--text)!important;margin:8px 0 0;border-radius:0;padding:12px}
.btn{background:#043D22!important;color:#fff!important;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.btn2{background:var(--card2)!important;color:var(--text)!important;border:none;padding:10px 16px;border-radius:20px;cursor:pointer}
input,textarea,select{background:var(--card2)!important;color:var(--text)!important;border:none;padding:10px;border-radius:10px;width:100%;margin-bottom:8px;outline:none}
.reactPop{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;background:var(--card);border-radius:30px;padding:8px 10px;display:none;gap:6px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.5);align-items:center}
.reactPop span{font-size:36px;cursor:pointer}
.reactPop.show{display:flex}
/* ===== BOTTOM BAR - ALL BLACK, 5 OPTIONS ===== */
.fbBottom{position:fixed;bottom:0;left:0;right:0;background:#000!important;display:flex;border-top:1px solid #222;z-index:50;padding:8px 0 6px}
.fbB{flex:1;text-align:center;cursor:pointer;font-size:26px;color:#888!important;position:relative;line-height:1;background:#000!important}
.fbB small{display:block;font-size:10px;margin-top:3px;color:#888!important}
.fbB.on{color:#fff!important}
.fbB.on small{color:#fff!important}
.fbB.on::after{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:36px;height:3px;background:#043D22;border-radius:3px}
.fbB .badge{position:absolute;top:-4px;margin-left:10px;background:#e41e3f;color:#fff;font-size:11px;font-weight:bold;padding:1px 5px;border-radius:10px}
.fbBAva{width:30px;height:30px;border-radius:50%;background:#043D22;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;overflow:hidden;border:2px solid #fff}
.page{display:none}.page.active{display:block}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#043D22;color:#fff;padding:10px 18px;border-radius:20px;z-index:9999;display:none;font-weight:bold}
</style>
</head>
<body>
<div id="toast"></div>
<div class="reactPop" id="reactPop">
  <span onclick="pickReact('👍')">👍</span><span onclick="pickReact('❤️')">❤️</span><span onclick="pickReact('🥰')">🥰</span><span onclick="pickReact('😆')">😆</span><span onclick="pickReact('😮')">😮</span><span onclick="pickReact('😢')">😢</span><span onclick="pickReact('😡')">😡</span>
</div>
<div style="background:#000;display:flex;gap:6px;justify-content:center;padding:6px;border-bottom:1px solid #222">
  <button class="btn" onclick="setTheme('system')" style="padding:6px 12px;font-size:12px">📱 System Default</button>
  <button class="btn2" onclick="setTheme('light')" style="padding:6px 12px;font-size:12px;background:#222!important;color:#fff!important">☀️ Light</button>
  <button class="btn2" onclick="setTheme('dark')" style="padding:6px 12px;font-size:12px;background:#222!important;color:#fff!important">🌙 Dark</button>
</div>
<div class="fbTop">
  <div style="display:flex;align-items:center;gap:10px">
    <span class="fbMenu" onclick="showPage('profile')">☰</span>
    <span class="fbLogo" onclick="showPage('feed')">Autro<span>book</span></span>
  </div>
  <div class="fbTopR">
    <div class="fbIc" onclick="openModal('postModal')">⊕</div>
    <div class="fbIc" onclick="showPage('search')">🔍</div>
    <div class="fbIc" onclick="showPage('chat')">💬<span class="fbBadge">9+</span></div>
  </div>
</div>
<div class="fbMind">
  <div class="ava" onclick="showPage('profile')">D</div>
  <input placeholder="What's on your mind?" onclick="openModal('postModal')" readonly>
  <span class="fbPhoto">🖼️</span>
</div>

<!-- ❌ TOP TABS LINE DELETED - AR NAI -->

<div id="page-feed" class="page active">
<!-- REELS - HEADER DELETED, DIRECT REELS -->
<div class="reelsTop">
  <div class="reelsRail" id="reelsRail"></div>
</div>
<div id="box-stories"></div>
<div class="suggest">
  <div class="suggestHead"><b>People you may know</b><span style="color:var(--sub)">•••</span></div>
  <div class="suggestRail" id="suggestRail"></div>
  <div class="seeAll" onclick="showPage('friends')">See all ›</div>
</div>
<div id="fbFeed"></div>
<div id="box-feed"></div>
<div id="box-create"></div>
</div>

<div id="page-reels" class="page"><div id="box-reels"></div></div>
<div id="page-friends" class="page"><div id="box-friends"></div></div>
<div id="page-groups" class="page"><div id="box-groups"></div></div>
<div id="page-pages" class="page"><div id="box-pages"></div></div>
<div id="page-live" class="page"><div id="box-live"></div></div>
<div id="page-events" class="page"><div id="box-events"></div></div>
<div id="page-gaming" class="page"><div id="box-gaming"></div></div>
<div id="page-autroai" class="page"><div id="box-autroai"></div></div>
<div id="page-dating" class="page"><div id="box-dating"></div></div>
<div id="page-jobs" class="page"><div id="box-jobs"></div></div>
<div id="page-chat" class="page"><div id="box-chat"></div></div>
<div id="page-podcast" class="page"><div id="box-podcast"></div></div>
<div id="page-shop" class="page"><div id="box-shop"></div></div>
<div id="page-watch" class="page"><div id="box-watch"></div></div>
<div id="page-noti" class="page"><div id="box-noti"></div></div>
<div id="page-profile" class="page"><div id="box-profile"></div></div>
<div id="page-other" class="page" style="padding:20px"><h2 id="oName">Demo User</h2><p id="oBio"></p><button class="btn" onclick="toast('Followed ✅')">➕ Follow</button><button class="btn2" onclick="showPage('feed')">⬅ Back</button><div id="oPosts"></div></div>

<!-- ===== BOTTOM BAR - ALL BLACK, 5 OPTIONS ONLY ===== -->
<div class="fbBottom">
  <div class="fbB" data-b="reels" onclick="showPage('reels',this)">🎬<small>Reels</small></div>
  <div class="fbB on" data-b="feed" onclick="showPage('feed',this)">🏠<small>Home</small></div>
  <div class="fbB" data-b="groups" onclick="showPage('groups',this)">👥<small>Group</small></div>
  <div class="fbB" data-b="friends" onclick="showPage('friends',this)">👥<small>Friends</small></div>
  <div class="fbB" data-b="profile" onclick="showPage('profile',this)"><span class="fbBAva">D</span><small>Profile</small></div>
</div>

<div id="postModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:flex-start;padding-top:40px">
  <div style="background:var(--card);width:92%;max-width:430px;border-radius:14px;padding:16px;color:var(--text)">
    <h3>Create Post</h3>
    <textarea id="postText" placeholder="What's on your mind?" style="min-height:80px;margin-top:10px"></textarea>
    <button class="btn" style="width:100%" onclick="addPost()">Post ✅</button>
    <button class="btn2" style="width:100%;margin-top:8px" onclick="closeModal('postModal')">Cancel</button>
  </div>
</div>
<div id="reelModal" style="display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column">
  <div style="display:flex;justify-content:space-between;padding:12px;color:#fff"><b id="reelModalName">Demo Reel</b><span style="font-size:22px;cursor:pointer" onclick="closeModal('reelModal')">✖</span></div>
  <div id="reelModalBody" style="flex:1;display:flex;align-items:center;justify-content:center;color:#fff"></div>
  <div style="display:flex;gap:10px;padding:14px"><button class="btn" style="flex:1" onclick="toast('Liked ❤️')">❤️ Like</button><button class="btn2" style="flex:1;color:#fff!important;background:#333!important" onclick="toast('Comment')">💬 Comment</button><button class="btn2" style="flex:1;color:#fff!important;background:#333!important" onclick="toast('Shared')">↗️ Share</button></div>
</div>
<script>
let posts=[
  {page:'Demo Page 1',user:'Demo User 1',time:'20m',big:'🔥 Demo Update 🔥<br>এটা একটা ডেমো পোস্ট - ডিজাইন দেখার জন্য',likes:4,comments:1,img:'https://picsum.photos/100/100?21'},
  {page:'Demo Page 2',user:'Demo User 2',time:'1d',big:'এটা ডেমো পোস্ট ২ - ফেসবুক স্টাইল ফিড',likes:12,comments:3,img:'https://picsum.photos/100/100?22'},
  {page:'Demo Page 3',user:'Demo User 3',time:'2h',big:'Autrobook Demo ✨<br>নতুন Reels দেখো 🔥',likes:45,comments:8,img:'https://picsum.photos/100/100?23'}
];
let suggests=[
  {name:'Demo User A',mutual:'1 mutual friend',img:'https://picsum.photos/300/200?31'},
  {name:'Demo User B',mutual:'4 mutual friends',img:'https://picsum.photos/300/200?32'},
  {name:'Demo User C',mutual:'2 mutual friends',img:'https://picsum.photos/300/200?33'}
];
let reels=[
  {name:'Demo User A',title:'Demo Reel 1 ✨',likes:'1.2K',img:'https://picsum.photos/300/500?11'},
  {name:'Demo User B',title:'Demo Reel 2 😂',likes:'890',img:'https://picsum.photos/300/500?12'},
  {name:'Demo User C',title:'Demo Reel 3 💃',likes:'2.1K',img:'https://picsum.photos/300/500?13'}
];
let currentPostIndex=0;
function renderSuggest(){
  let rail=document.getElementById('suggestRail'); if(!rail) return;
  rail.innerHTML=suggests.map((s,i)=>`<div class="sCard"><img src="${s.img}"><div class="sBody"><div class="sName">${s.name}</div><div class="sMutual"><i>👤</i>${s.mutual}</div><button class="btnAdd" onclick="toast('Friend request sent ✅')">👤+ Add friend</button><button class="btnRemove" onclick="this.closest('.sCard').remove()">Remove</button></div></div>`).join('');
}
function renderReels(){
  let rail=document.getElementById('reelsRail'); if(!rail) return;
  rail.innerHTML=reels.map((r,i)=>`<div class="reelCard" onclick="openReel(${i})"><img src="${r.img}"><div class="play">▶️</div><div class="rUser">${r.name}</div><div class="rMeta">${r.title} • ❤️ ${r.likes}</div></div>`).join('');
}
function renderFbFeed(){
  let f=document.getElementById('fbFeed'); if(!f) return;
  f.innerHTML=posts.map((p,i)=>`
  <div class="post">
    <div class="postHead">
      <div class="pAva"><img src="${p.img}"></div>
      <div class="pInfo"><b>${p.page}</b><div>${p.user} · ${p.time} · 🌍</div></div>
      <span class="pDots" onclick="toast('Options')">•••</span>
      <span class="pClose" onclick="this.closest('.post').remove()">✖</span>
    </div>
    <div class="postTextBig">${p.big}</div>
    <div style="padding:8px 12px;color:var(--sub);font-size:13px;cursor:pointer" onclick="toast('Translated')">See translation</div>
    <div class="postMeta"><span>👍 <span id="likeCount${i}">${p.likes}</span></span><span>${p.comments} comment</span></div>
    <div class="postActions">
      <button class="pa" id="likeBtn${i}" onmousedown="startPress(${i})" onmouseup="endPress(${i})" ontouchstart="startPress(${i})" ontouchend="endPress(${i})" onclick="likePost(${i})">👍 Like</button>
      <button class="pa" onclick="toast('Comment')">💬 Comment</button>
      <button class="pa" onclick="toast('Shared')">↗️ Share</button>
    </div>
  </div>`).join('');
}
let pressTimer=null, longPressed=false;
function startPress(i){ longPressed=false; pressTimer=setTimeout(()=>{ longPressed=true; currentPostIndex=i; document.getElementById('reactPop').classList.add('show'); },500); }
function endPress(i){ clearTimeout(pressTimer); }
function pickReact(e){
  let btn=document.getElementById('likeBtn'+currentPostIndex);
  if(btn){ btn.innerHTML=e+' Reacted'; btn.classList.add('liked'); }
  let c=document.getElementById('likeCount'+currentPostIndex);
  if(c) c.innerText=parseInt(c.innerText)+1;
  document.getElementById('reactPop').classList.remove('show');
  toast(e+' Reaction ✅');
}
function likePost(i){
  if(longPressed){ longPressed=false; return; }
  let btn=document.getElementById('likeBtn'+i);
  let c=document.getElementById('likeCount'+i);
  if(btn.classList.contains('liked')){ btn.innerHTML='👍 Like'; btn.classList.remove('liked'); c.innerText=parseInt(c.innerText)-1; }
  else{ btn.innerHTML='👍 Liked'; btn.classList.add('liked'); c.innerText=parseInt(c.innerText)+1; }
}
function openReel(i){
  let r=reels[i]; if(!r) return;
  document.getElementById('reelModalName').innerText=r.name+' - '+r.title;
  document.getElementById('reelModalBody').innerHTML=`<img src="${r.img}" style="width:100%;height:100%;object-fit:cover">`;
  openModal('reelModal');
}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
function openModal(id){let e=document.getElementById(id);if(e)e.style.display='flex';}
function closeModal(id){let e=document.getElementById(id);if(e)e.style.display='none';}
function showPage(p,el){
  document.querySelectorAll('.page').forEach(x=>{x.style.display='none';x.classList.remove('active');});
  let pg=document.getElementById('page-'+p); if(pg){pg.style.display='block';pg.classList.add('active');}
  else{let o=document.getElementById('page-other');o.style.display='block';}
  document.querySelectorAll('.fbB').forEach(x=>x.classList.remove('on'));
  if(el) el.classList.add('on');
  document.querySelectorAll('.fbB').forEach(b=>{ if(b.dataset.b===p) b.classList.add('on'); });
  window.scrollTo(0,0);
}
function addPost(){
  let t=document.getElementById('postText').value.trim();
  if(!t) return toast('Write something!');
  posts.unshift({page:'Demo Page',user:'Demo User',time:'Just now',big:t,likes:0,comments:0,img:'https://picsum.photos/100/100?24'});
  document.getElementById('postText').value='';
  closeModal('postModal'); renderFbFeed(); showPage('feed'); toast('Post Published ✅');
}
function setTheme(theme){
  if(theme==='system'){document.documentElement.removeAttribute('data-theme');localStorage.setItem('autro_theme','system');}
  else{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('autro_theme',theme);}
  toast('Theme: '+theme+' ✅');
}
(function(){let saved=localStorage.getItem('autro_theme')||'system';if(saved==='system'){document.documentElement.removeAttribute('data-theme');}else{document.documentElement.setAttribute('data-theme',saved);}})();
document.addEventListener('click',e=>{ if(!e.target.closest('.reactPop') && !e.target.closest('.pa')){ let r=document.getElementById('reactPop'); if(r) r.classList.remove('show'); }});
async function loadBox(boxId,fileName,fallbackHTML){
  let box=document.getElementById(boxId); if(!box) return;
  try{
    let res=await fetch(fileName+'?v=40'); if(!res.ok) throw new Error('404');
    let html=await res.text();
    let temp=document.createElement('div'); temp.innerHTML=html;
    let scripts=temp.querySelectorAll('script');
    box.innerHTML=html;
    scripts.forEach(s=>{let ns=document.createElement('script'); ns.textContent=s.textContent; document.body.appendChild(ns);});
  }catch(e){ if(fallbackHTML) box.innerHTML=fallbackHTML; }
}
async function loadAll(){
  renderSuggest(); renderReels(); renderFbFeed();
  await loadBox('box-stories','stories.html',`<div style="display:flex;gap:10px;padding:10px;overflow-x:auto;background:var(--card)"><div style="min-width:110px;height:180px;border-radius:14px;background:#333;color:#fff;position:relative;overflow:hidden"><img src="https://picsum.photos/300/500?1" style="width:100%;height:100%;object-fit:cover"><b style="position:absolute;bottom:8px;left:8px">Demo User A</b></div><div style="min-width:110px;height:180px;border-radius:14px;background:#333;color:#fff;position:relative;overflow:hidden"><img src="https://picsum.photos/300/500?2" style="width:100%;height:100%;object-fit:cover"><b style="position:absolute;bottom:8px;left:8px">Demo User B</b></div></div>`);
  await loadBox('box-reels','reels.html',`<div class="card"><h3>🎬 Reels</h3></div>`);
  await loadBox('box-friends','friends.html',`<div class="card"><h3>👥 Friends</h3><p>Demo User A</p></div>`);
  await loadBox('box-groups','groups.html',`<div class="card"><h3>Demo Group 1</h3></div>`);
  await loadBox('box-noti','notifications.html',`<div class="card"><h3>🔔 Notifications</h3><p>Demo User A liked your post ❤️</p></div>`);
  await loadBox('box-profile','profile.html',`<div class="card"><h2>Demo User</h2><p>Demo Location</p></div>`);
}
loadAll();
</script>
</body>
  </html>
