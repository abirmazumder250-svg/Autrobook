<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autrobook - Social Network</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0866ff">
</head>
<body>

  <!-- Header Loads Here -->
  <div id="header-container"></div>

  <!-- All Pages Load Here -->
  <main id="app-container">
    <div class="card" style="text-align:center;padding:50px">
      <h2>Loading Autrobook...</h2>
      <p>Please wait...</p>
    </div>
  </main>

  <!-- Bottom Navigation Loads Here -->
  <div id="bottom-nav-container"></div>

  <!-- Core JS Files -->
  <script src="navigation.js"></script>
  <script src="helpers.js"></script>
  <script src="settings.js"></script>
  <script src="translate.js"></script>

  <!-- Feature JS Files -->
  <script src="autro-ai.js"></script>
  <script src="notifications.js"></script>
  <script src="report.js"></script>
  <script src="pages/comment-section.js"></script>
  <script src="pages/scanner.js"></script>

  <script>
    // When app starts
    window.onload = function() {
      // Load Header and Bottom Nav first
      loadComponent('header-container', 'pages/47-header.html');
      loadComponent('bottom-nav-container', 'pages/48-bottom-nav.html');

      // Load Default Page: Feed
      navigateTo('pages/01-feed.html');

      // Check for Dark Mode
      if(localStorage.getItem('theme') === 'dark'){
        document.body.classList.add('dark');
      }
    }

    // Handle Back Button
    window.onpopstate = function(event) {
      if(event.state && event.state.page){
        navigateTo(event.state.page, false);
      }
    }
  </script>
</body>
</html>
