<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autrobook - Home</title>
<link rel="stylesheet" href="style.css?v=26">
<style>
/* BACKGROUND = SYSTEM DEFAULT, BUTTON = DARK GREEN */
:root{--bg:#f0f2f5;--card:#ffffff;--card2:#f0f2f5;--text:#050505;--sub:#65676b;--main:#043D22;--line:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#18191a;--card:#242526;--card2:#3a3b3c;--text:#e4e6eb;--sub:#b0b3b8;--line:#3a3b3c}}
[data-theme="light"]{--bg:#f0f2f5!important;--card:#ffffff!important;--card2:#f0f2f5!important;--text:#050505!important;--sub:#65676b!important;--line:#ddd!important}
[data-theme="dark"]{--bg:#18191a!important;--card:#242526!important;--card2:#3a3b3c!important;--text:#e4e6eb!important;--sub:#b0b3b8!important;--line:#3a3b3c!important}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg)!important;color:var(--text)!important;padding-bottom:80px}
a{color:var(--text);text-decoration:none}
.fbTop{background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:8px 12px;position:sticky;top:0;z-index:50}
.fbMenu{font-size:26px;color:var(--text);cursor:pointer}
.fbLogo{font-size:28px;font-weight:900;color:var(--text);letter-spacing:-1px;cursor:pointer}
.fbLogo span{color:#043D22!important}
.fbTopR{display:flex;gap:8px;align-items:center}
.fbIc{width:38px;height:38px;background:var(--card2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;color:var(--text)}
.fbBadge{position:absolute;top:-4px;right:-4px;background:#e41e3f;color:#fff;font-size:10px;font-weight:bold;padding:2px 5px;border-radius:10px}
.fbMind{background:var(--card);display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.fbMind input{flex:1;background:transparent;border:1px solid #aaa;border-radius:20px;padding:10px 14px;color:var(--text);font-size:15px;outline:none}
.fbMind input::placeholder{color:var(--sub)}
.fbPhoto{font-size:22px;cursor:pointer}
.ava{width:40px;height:40px;border-radius:50%;background:#043D22;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.tabs.blackNav{background:#000!important;border-bottom:1px solid var(--line)!important;position:sticky;top:54px;z-index:40;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs.blackNav::-webkit-scrollbar{display:none}
.tabs.blackNav .tab{flex:1;text-align:center;padding:12px 8px;cursor:pointer;color:#aaa!important;white-space:nowrap;font-size:13px;border-bottom:3px solid transparent}
.tabs.blackNav .tab.on{color:#fff!important;border-bottom-color:#043D22!important;font-weight:bold}
.card{background:var(--card)!important;color:var(--text)!important;margin:10px;border-radius:12px;padding:12px}
.btn{background:#043D22!important;color:#fff!important;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.btn2{background:var(--card2)!important;color:var(--text)!important;border:none;padding:10px 16px;border-radius:20px;cursor:pointer}
input,textarea,select{background:var(--card2)!important;color:var(--text)!important;border:none;padding:10px;border-radius:10px;width:100%;margin-bottom:8px;outline:none}
.chip{display:inline-block;background:var(--card2);color:var(--text);padding:6px 12px;border-radius:20px;font-size:12px;margin:3px;cursor:pointer}
.chip.on{background:#043D22!important;color:#fff}
.stories{display:flex;gap:10px;padding:10px;overflow-x:auto;background:var(--card)}
.story{min-width:110px;height:180px;border-radius:14px;background:#333;color:#fff;position:relative;overflow:hidden;cursor:pointer;flex-shrink:0}
.story img{width:100%;height:100%;object-fit:cover}
.story b{position:absolute;bottom:8px;left:8px;font-size:12px;text-shadow:0 1px 3px #000}
.story .sAva{position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:50%;border:3px solid #043D22!important;background:#043D22;display:flex;align-items:center;justify-content:center;font-weight:bold}
.post-actions{display:flex;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.pa{flex:1;text-align:center;padding:9px;cursor:pointer;color:var(--sub);font-weight:600;background:none;border:none}
.gTick{display:inline-flex;width:18px;height:18px;background:#043D22;color:#fff;border-radius:50%;align-items:center;justify-content:center;font-size:12px}
.fbBottom{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;border-top:1px solid var(--line);z-index:50}
.fbB{flex:1;text-align:center;padding:11px 0;cursor:pointer;font-size:24px;color:#aaa}
.fbB.on{color:#fff;border-top:3px solid #043D22!important}
.fbBAva{width:28px;height:28px;background:#043D22;color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
.page{display:none}.page.active{display:block}
#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#043D22;color:#fff;padding:10px 18px;border-radius:20px;z-index:9999;display:none;font-weight:bold}
</style>
</head>
<body>
<div id="toast"></div>
<div style="background:var(--card);display:flex;gap:6px;justify-content:center;padding:6px;border-bottom:1px solid var(--line)">
  <button class="btn" onclick="setTheme('system')" style="padding:6px 12px;font-size:12px">📱 System Default</button>
  <button class="btn2" onclick="setTheme('light')" style="padding:6px 12px;font-size:12px">☀️ Light</button>
  <button class="btn2" onclick="setTheme('dark')" style="padding:6px 12px;font-size:12px">🌙 Dark</button>
</div>
<div class="fbTop">
  <div style="display:flex;align-items:center;gap:8px">
    <span class="fbMenu" onclick="showPage('profile')">☰</span>
    <span class="fbLogo" onclick="showPage('feed')">Autro<span>book</span></span>
  </div>
  <div class="fbTopR">
    <div class="fbIc" onclick="openModal('postModal')">➕</div>
    <div class="fbIc" onclick="showPage('search')">🔍</div>
    <div class="fbIc" onclick="showPage('chat')">💬<span class="fbBadge">9+</span></div>
  </div>
</div>
<div class="fbMind">
  <div class="ava" onclick="showPage('profile')">A</div>
  <input placeholder="What's on your mind?" onclick="openModal('postModal')" readonly>
  <span class="fbPhoto" onclick="toast('Photo')">🖼️</span>
</div>
<div id="box-header"></div>
<div id="box-search"></div>
<div class="tabs blackNav">
<div class="tab on" data-p="feed" onclick="showPage('feed',this)">🏠 Home</div>
<div class="tab" data-p="reels" onclick="showPage('reels',this)">🎬 Reels</div>
<div class="tab" data-p="watch" onclick="showPage('watch',this)">📺 Watch</div>
<div class="tab" data-p="friends" onclick="showPage('friends',this)">👥 Friends</div>
<div class="tab" data-p="groups" onclick="showPage('groups',this)">👥 Groups</div>
<div class="tab" data-p="pages" onclick="showPage('pages',this)">📄 Pages</div>
<div class="tab" data-p="live" onclick="showPage('live',this)">🔴 Live</div>
<div class="tab" data-p="events" onclick="showPage('events',this)">📅 Events</div>
<div class="tab" data-p="gaming" onclick="showPage('gaming',this)">🎮 Gaming</div>
<div class="tab" data-p="autroai" onclick="showPage('autroai',this)">✨ Autro AI</div>
<div class="tab" data-p="dating" onclick="showPage('dating',this)">❤️ Dating</div>
<div class="tab" data-p="jobs" onclick="showPage('jobs',this)">💼 Jobs</div>
<div class="tab" data-p="chat" onclick="showPage('chat',this)">💬 Chat</div>
<div class="tab" data-p="podcast" onclick="showPage('podcast',this)">🎙️ Podcast</div>
<div class="tab" data-p="shop" onclick="showPage('shop',this)">🛍️ Shop</div>
<div class="tab" data-p="noti" onclick="showPage('noti',this)">🔔 Noti</div>
<div class="tab" data-p="profile" onclick="showPage('profile',this)">👤 Profile</div>
</div>
<div id="page-feed" class="page active">
<div id="box-stories"></div>
<div id="box-story-editor"></div>
<div id="box-create"></div>
<div id="box-autroai-mini"></div>
<div id="box-poll"></div>
<div id="box-poll-create"></div>
<div id="box-feed"></div>
<div id="box-saved"></div>
<div id="box-memories"></div>
</div>
<div id="page-reels" class="page"><div id="box-reels"></div><div id="box-reels-editor"></div><div id="box-video-editor"></div></div>
<div id="page-friends" class="page"><div id="box-friends"></div></div>
<div id="page-groups" class="page"><div id="box-groups"></div></div>
<div id="page-pages" class="page"><div id="box-pages"></div></div>
<div id="page-live" class="page"><div id="box-live"></div><div id="box-live-chat"></div></div>
<div id="page-events" class="page"><div id="box-events"></div><div id="box-gaming"></div><div id="box-fundraiser"></div><div id="box-fundraiser-donate"></div></div>
<div id="page-gaming" class="page"><div id="box-gaming2"></div></div>
<div id="page-autroai" class="page"><div id="box-autroai"></div><div id="box-settings-autroai"></div></div>
<div id="page-dating" class="page"><div id="box-dating"></div><div id="box-dating-chat"></div></div>
<div id="page-jobs" class="page"><div id="box-jobs"></div><div id="box-jobs-apply"></div></div>
<div id="page-chat" class="page"><div id="box-chat"></div></div>
<div id="page-podcast" class="page"><div id="box-podcast"></div></div>
<div id="page-shop" class="page"><div id="box-shop"></div></div>
<div id="page-watch" class="page"><div id="box-watch"></div><div id="box-market"></div><div id="box-market-sell"></div><div id="box-music"></div><div id="box-music-player"></div><div id="box-weather"></div></div>
<div id="page-noti" class="page"><div id="box-noti"></div><div id="box-noti-view"></div><div id="box-noti-delete"></div></div>
<div id="page-profile" class="page"><div id="box-profile"></div><div id="box-profile-edit"></div><div id="box-avatar"></div><div id="box-settings"></div><div id="box-settings-privacy"></div></div>
<div id="page-other" class="page" style="padding:20px">
<h2 id="oName">User</h2><p id="oBio"></p>
<button class="btn" onclick="toast('Followed ✅')">➕ Follow</button>
<button class="btn2" onclick="showPage('feed')">⬅ Back</button>
<div id="oPosts"></div>
</div>
<div id="box-report"></div>
<div id="box-report-post"></div>
<div id="box-report-reel"></div>
<div id="box-report-user"></div>
<div id="box-comments"></div>
<div id="box-scanner"></div>
<div id="box-comment-section"></div>
<div id="box-bottom"></div>
<div class="fbBottom">
  <div class="fbB on" onclick="showPage('feed',this)">🏠</div>
  <div class="fbB" onclick="showPage('reels',this)">🎬</div>
  <div class="fbB" onclick="showPage('friends',this)">👥</div>
  <div class="fbB" onclick="showPage('groups',this)">🎯</div>
  <div class="fbB" onclick="showPage('noti',this)">🔔</div>
  <div class="fbB" onclick="showPage('profile',this)"><span class="fbBAva">A</span></div>
</div>
<div id="postModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:flex-start;padding-top:40px">
  <div style="background:var(--card);width:92%;max-width:430px;border-radius:14px;padding:16px;color:var(--text)">
    <h3>Create Post</h3>
    <textarea id="postText" placeholder="What's on your mind?" style="min-height:80px;margin-top:10px"></textarea>
    <button class="btn" style="width:100%" onclick="addPost()">Post ✅</button>
    <button class="btn2" style="width:100%;margin-top:8px" onclick="closeModal('postModal')">Cancel</button>
  </div>
</div>
<input type="file" id="mediaIn" accept="image/*,video/*" style="display:none">
<input type="file" id="reelIn" accept="video/*" style="display:none">
<input type="file" id="coverIn" accept="image/*" style="display:none">
<input type="file" id="avatarIn" accept="image/*" style="display:none">
<script>
let users=[{name:'Sadia Afrin',bio:'Dhaka'},{name:'Rahim Uddin',bio:'Tongi'},{name:'Mim Akter',bio:'Dhaka'}];
let posts=[{name:'Md Najmus Sakib',text:'ছুটির দিনে নদীর ধারে উদাস মনে...',likes:45},{name:'Sadia Afrin',text:'Autrobook is amazing! ✨',likes:12}];
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
function openModal(id){let e=document.getElementById(id);if(e)e.style.display='flex';}
function closeModal(id){let e=document.getElementById(id);if(e)e.style.display='none';}
function showPage(p,el){
  document.querySelectorAll('.page').forEach(x=>{x.style.display='none';x.classList.remove('active');});
  let pg=document.getElementById('page-'+p); if(pg){pg.style.display='block';pg.classList.add('active');}
  else{let o=document.getElementById('page-other');o.style.display='block';}
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.fbB').forEach(x=>x.classList.remove('on'));
  if(el){el.classList.add('on');}
  window.scrollTo(0,0);
}
function openOther(name){
  document.querySelectorAll('.page').forEach(x=>x.style.display='none');
  let o=document.getElementById('page-other');o.style.display='block';
  document.getElementById('oName').innerText=name;
  document.getElementById('oBio').innerText='Profile of '+name;
  window.scrollTo(0,0);
}
function addPost(){
  let t=document.getElementById('postText').value.trim();
  if(!t) return toast('Write something!');
  posts.unshift({name:'Abir',text:t,likes:0});
  document.getElementById('postText').value='';
  closeModal('postModal'); renderFeedFallback(); showPage('feed'); toast('Post Published ✅');
}
function setTheme(theme){
  if(theme==='system'){document.documentElement.removeAttribute('data-theme');localStorage.setItem('autro_theme','system');}
  else{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('autro_theme',theme);}
  toast('Theme: '+theme+' ✅');
}
function resetTheme(){localStorage.removeItem('autro_theme');document.documentElement.removeAttribute('data-theme');toast('Theme Reset to System ✅');}
(function(){let saved=localStorage.getItem('autro_theme')||'system';if(saved==='system'){document.documentElement.removeAttribute('data-theme');}else{document.documentElement.setAttribute('data-theme',saved);}})();
async function loadBox(boxId,fileName,fallbackHTML){
  let box=document.getElementById(boxId); if(!box) return;
  try{
    let res=await fetch(fileName+'?v=26'); if(!res.ok) throw new Error('404');
    let html=await res.text();
    let temp=document.createElement('div'); temp.innerHTML=html;
    let scripts=temp.querySelectorAll('script');
    box.innerHTML=html;
    scripts.forEach(s=>{let ns=document.createElement('script'); ns.textContent=s.textContent; document.body.appendChild(ns);});
  }catch(e){ if(fallbackHTML) box.innerHTML=fallbackHTML; }
}
async function loadAll(){
  await loadBox('box-stories','stories.html',`<div class="stories"><div class="story" onclick="toast('Create Story')"><div style="height:100%;background:#555;display:flex;align-items:center;justify-content:center">➕</div><b>Your story</b></div><div class="story" onclick="toast('Story')"><img src="https://picsum.photos/300/500?1"><div class="sAva">S</div><b>Sadia</b></div><div class="story" onclick="toast('Story')"><img src="https://picsum.photos/300/500?2"><div class="sAva">R</div><b>Rahim</b></div><div class="story" onclick="toast('Story')"><img src="https://picsum.photos/300/500?3"><div class="sAva">M</div><b>Mim</b></div></div>`);
  await loadBox('box-feed','feed.html',`<div id="feedList"></div>`);
  await loadBox('box-reels','reels.html',`<div class="card"><h3>🎬 Reels</h3><div style="height:280px;background:#000;display:flex;align-items:center;justify-content:center;border-radius:12px">▶️ Demo Reel</div></div>`);
  await loadBox('box-friends','friends.html',`<div class="card"><h3>👥 Friends</h3><p>Sadia Afrin</p><button class="btn" onclick="toast('Accepted ✅')">Accept</button></div>`);
  await loadBox('box-groups','groups.html',`<div class="card"><h3>Groups</h3><p>Tongi Gaming</p></div>`);
  await loadBox('box-pages','pages.html',`<div class="card"><h3>Pages</h3><p>Autrobook Official</p></div>`);
  await loadBox('box-live','live.html',`<div class="card"><h3>🔴 Live</h3><button class="btn" onclick="toast('Live started 🔴')">Go Live</button></div>`);
  await loadBox('box-events','events.html',`<div class="card"><h3>📅 Events</h3><p>Gaming Tournament</p></div>`);
  await loadBox('box-autroai','autro-ai.html',`<div class="card"><h3>✨ Autro AI</h3><button class="btn2" onclick="toast('Hello Abir! 👋')">Ask AI</button></div>`);
  await loadBox('box-dating','dating.html',`<div class="card"><h3>❤️ Dating</h3></div>`);
  await loadBox('box-jobs','jobs.html',`<div class="card"><h3>💼 Jobs</h3></div>`);
  await loadBox('box-chat','chat.html',`<div class="card"><h3>💬 Chat</h3><p>Sadia: Hi Abir! 👋</p></div>`);
  await loadBox('box-podcast','podcast.html',`<div class="card"><h3>🎙️ Podcast</h3></div>`);
  await loadBox('box-shop','shop.html',`<div class="card"><h3>🛍️ Shop</h3></div>`);
  await loadBox('box-watch','watch.html',`<div class="card"><h3>📺 Watch</h3></div>`);
  await loadBox('box-noti','notifications.html',`<div class="card"><h3>🔔 Notifications</h3><p>Sadia liked your post ❤️</p></div>`);
  await loadBox('box-profile','profile.html',`<div class="card"><div style="display:flex;gap:12px"><div class="ava" style="width:70px;height:70px;font-size:28px">A</div><div><h2>Abir</h2><p>Tongi, Dhaka</p></div></div></div>`);
  renderFeedFallback();
}
function renderFeedFallback(){
  let fl=document.getElementById('feedList'); if(!fl) return;
  if(fl.innerHTML.trim().length>20) return;
  fl.innerHTML=posts.map(p=>`<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="ava">${p.name[0]}</div><div style="flex:1"><b>${p.name}</b><div style="font-size:12px;color:var(--sub)">Sep 19 • 🌍</div></div><span>•••</span><span>✖</span></div><p style="margin:10px 0">${p.text}</p><div style="height:200px;background:#333;border-radius:10px;display:flex;align-items:center;justify-content:center">📷 Photo</div><div class="post-actions"><button class="pa" onclick="toast('Liked ❤️')">❤️ Like (${p.likes})</button><button class="pa" onclick="toast('Comment')">💬 Comment</button><button class="pa" onclick="toast('Shared')">↗️ Share</button></div></div>`).join('');
}
loadAll();
</script>
<script src="main.js" onerror="console.log('main.js not found - built-in loader used')"></script>
</body>
</html>
