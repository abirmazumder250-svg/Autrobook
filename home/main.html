<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autrobook - Home</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="toast"></div>
<div id="box-header"></div>
<div id="box-search"></div>
<div class="tabs"><div class="tab on" data-p="feed">🏠 Home</div><div class="tab" data-p="reels">🎬 Reels</div><div class="tab" data-p="watch">📺 Watch</div><div class="tab" data-p="friends">👥 Friends</div><div class="tab" data-p="groups">👥 Groups</div><div class="tab" data-p="noti">🔔 Noti</div><div class="tab" data-p="profile">👤 Profile</div></div>
<div id="page-feed" class="page"><div id="box-stories"></div><div id="box-create"></div><div id="box-feed"></div><div id="box-saved"></div></div>
<div id="page-reels" class="page" style="display:none"><div id="box-reels"></div></div>
<div id="page-friends" class="page" style="display:none"><div id="box-friends"></div></div>
<div id="page-groups" class="page" style="display:none"><div id="box-groups"></div></div>
<div id="page-watch" class="page" style="display:none"><div id="box-watch"></div><div id="box-market"></div></div>
<div id="page-noti" class="page" style="display:none"><div id="box-noti"></div></div>
<div id="page-profile" class="page" style="display:none"><div id="box-profile"></div><div id="box-settings"></div></div>
<div id="page-other" class="page" style="display:none;padding:20px"><h2 id="oName">User</h2><p id="oBio"></p><button class="btn" onclick="toast('Followed ✅')">➕ Follow</button> <button class="btn2" onclick="showPage('feed')">⬅ Back</button><div id="oPosts"></div></div>
<div id="box-report"></div>
<div id="box-comments"></div>
<div id="box-scanner"></div>
<div id="box-comment-section"></div>
<div id="box-bottom"></div>
<input type="file" id="mediaIn" accept="image/*,video/*" style="display:none"><input type="file" id="reelIn" accept="video/*" style="display:none"><input type="file" id="coverIn" accept="image/*" style="display:none"><input type="file" id="avatarIn" accept="image/*" style="display:none">
<script src="scanner.js"></script>
<script src="comment-section.js"></script>
<script src="main.js"></script>
</body></html>
