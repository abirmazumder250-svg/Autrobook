<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Autro AI - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --blue:#1877f2; --brand:#4caf50; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;} 
.header{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);} 
.header b{flex:1;text-align:center;font-size:18px;} 
.chat-container{flex:1;overflow-y:auto;padding:16px;} 
.ai-msg, .user-msg{margin:8px 0;display:flex;gap:8px;} 
.ai-msg{align-items:flex-start;} 
.user-msg{justify-content:flex-end;} 
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;} 
.ai-bubble{background:var(--card);border-bottom-left-radius:4px;} 
.user-bubble{background:var(--blue);border-bottom-right-radius:4px;} 
.avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;} 
.avatar img{width:100%;height:100%;object-fit:cover;}
.input-area{display:flex;gap:8px;padding:12px;background:var(--card);border-top:1px solid var(--border);} 
.input-area input{flex:1;background:#3a3b3c;border:none;border-radius:20px;padding:10px 14px;color:var(--text);font-size:15px;} 
.input-area button{background:var(--blue);border:none;border-radius:50%;width:40px;height:40px;color:white;font-size:18px;cursor:pointer;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Autro AI Assistant</b>
</div>

<div class="chat-container" id="chatBox">
<div class="ai-msg">
<div class="avatar"><img src="images/logo.png"></div>
<div class="bubble ai-bubble">Hello! I'm Autro AI 👋<br>I can talk in any language. Ask me anything!</div>
</div>
</div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Ask Autro AI anything..." onkeypress="if(event.key==='Enter') sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>

<script>
let chatBox = document.getElementById('chatBox');
let chatHistory = [];

function sendMsg(){
let input = document.getElementById('userInput');
let text = input.value.trim();
if(text === '') return;

addMessage(text, 'user');
chatHistory.push({role: 'user', content: text});
input.value = '';

setTimeout(()=>{
let reply = getSmartReply(text);
addMessage(reply, 'ai');
chatHistory.push({role: 'ai', content: reply});
}, 500);
}

function addMessage(text, sender){
let msgDiv = document.createElement('div');
msgDiv.className = sender === 'user' ? 'user-msg' : 'ai-msg';
if(sender === 'ai'){
msgDiv.innerHTML = `<div class="avatar"><img src="images/logo.png"></div><div class="bubble ai-bubble">${text}</div>`;
}else{
msgDiv.innerHTML = `<div class="bubble user-bubble">${text}</div>`;
}
chatBox.appendChild(msgDiv);
chatBox.scrollTop = chatBox.scrollHeight;
}

function detectLanguage(text){
const banglaRegex = /[\u0980-\u09FF]/;
return banglaRegex.test(text) ? 'bn' : 'en';
}

function getSmartReply(userText){
let lang = detectLanguage(userText);
let lower = userText.toLowerCase();

// Bengali
if(lang === 'bn'){
if(lower.includes('হাই') || lower.includes('hello') || lower.includes('হ্যালো')) return "হাই! আমি ভালো আছি 😊 তুমি কেমন আছো?";
if(lower.includes('কি করো') || lower.includes('কি করছ')) return "আমি তোমার সাথে কথা বলছি। তোমাকে সাহায্য করতে চাই।";
if(lower.includes('নাম কি')) return "আমার নাম Autro AI। তোমাকে সাহায্য করার জন্য বানানো হয়েছে।";
if(lower.includes('ধন্যবাদ') || lower.includes('thanks')) return "তোমাকে স্বাগতম! আর কিছু জানতে চাও?";
if(lower.includes('কেমন আছো')) return "আমি ভালো আছি। তুমি কেমন আছো?";
if(lower.includes('help') || lower.includes('সাহায্য')) return "আমি Autrobook এর সব বিষয়ে সাহায্য করতে পারি। প্রোফাইল, পোস্ট, সেটিংস।";
return `তুমি বললে: "${userText}"। এটা নিয়ে আমি বলতে পারি যে, আমি সবসময় তোমাকে সাহায্য করতে প্রস্তুত। আরো কিছু জানতে চাও?`;
} 

// English
else {
if(lower.includes('hi') || lower.includes('hello')) return "Hi! I'm good 😊 How are you?";
if(lower.includes('what are you doing')) return "I'm chatting with you and ready to help!";
if(lower.includes('what is your name')) return "I'm Autro AI. Built to help you on Autrobook.";
if(lower.includes('thank')) return "You're welcome! Need anything else?";
if(lower.includes('how are you')) return "I'm doing great! How about you?";
if(lower.includes('help')) return "I can help with Profile, Posts, Settings and everything on Autrobook.";
return `You said: "${userText}". I understand. I'm here to help you with anything you need. What else?`;
}
}
</script>
</body> </html>
