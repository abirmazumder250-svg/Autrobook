<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autro AI - Autrobook</title>
<style>
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --blue:#1877f2; --brand:#4caf50; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;}
.header{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);}
.header b{flex:1;text-align:center;font-size:18px;}
.chat-container{flex:1;overflow-y:auto;padding:16px;}
.ai-msg, .user-msg{margin:8px 0;display:flex;gap:8px;}
.ai-msg{align-items:flex-start;}
.user-msg{justify-content:flex-end;}
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;white-space:pre-wrap;}
.ai-bubble{background:var(--card);border-bottom-left-radius:4px;}
.user-bubble{background:var(--blue);border-bottom-right-radius:4px;}
.avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#444;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.input-area{display:flex;gap:8px;padding:12px;background:var(--card);border-top:1px solid var(--border);}
.input-area input{flex:1;background:#3a3b3c;border:none;border-radius:20px;padding:10px 14px;color:var(--text);font-size:15px;outline:none;}
.input-area button{background:var(--blue);border:none;border-radius:50%;width:40px;height:40px;color:white;font-size:18px;cursor:pointer;}
.loading{opacity:0.6;}
</style>
</head>
<body>
<div class="header">
<span onclick="history.back()">←</span>
<b>Autro AI Assistant</b>
</div>

<div class="chat-container" id="chatBox">
<div class="ai-msg">
<div class="avatar"><img src="https://raw.githubusercontent.com/abirmazumder250/Autrobook/main/logo.png"></div>
<div class="bubble ai-bubble">Hello! I'm Autro AI 👋<br>আমি তোমার personal AI। যা জিজ্ঞেস করবা তাই উত্তর দিব।</div>
</div>
</div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Autro AI কে কিছু জিজ্ঞাসা করুন..." onkeypress="if(event.key==='Enter') sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>

<script>
let chatBox = document.getElementById('chatBox');
let chatHistory = [
{role: "system", content: "You are Autro AI, a helpful assistant for Autrobook social media. Reply in the same language user writes. Be friendly, helpful, and brief. Name is Autro AI."}
];

async function sendMsg(){
let input = document.getElementById('userInput');
let text = input.value.trim();
if(text === '') return;
addMessage(text, 'user');
chatHistory.push({role: "user", content: text});
input.value = '';
let loadingId = addMessage("Typing...", 'ai', true);
let reply = await getAIResponse(text);
document.getElementById(loadingId).remove();
addMessage(reply, 'ai');
chatHistory.push({role: "assistant", content: reply});
}

function addMessage(text, sender, isLoading=false){
let id = 'msg-' + Date.now();
let msgDiv = document.createElement('div');
msgDiv.id = id;
msgDiv.className = sender === 'user' ? 'user-msg' : 'ai-msg ' + (isLoading ? 'loading' : '');
if(sender === 'ai'){
msgDiv.innerHTML = `<div class="avatar"><img src="https://raw.githubusercontent.com/abirmazumder250/Autrobook/main/logo.png"></div><div class="bubble ai-bubble">${text}</div>`;
}else{
msgDiv.innerHTML = `<div class="bubble user-bubble">${text}</div>`;
}
chatBox.appendChild(msgDiv);
chatBox.scrollTop = chatBox.scrollHeight;
return id;
}

async function getAIResponse(userText){
  try {
    // তোমার Cloudflare Worker
    const workerURL = "https://autrobook.abirmazumder250.workers.dev"; 
    
    // আগের সব কথা সহ পাঠাচ্ছি
    let prompt = chatHistory.map(m => m.role + ": " + m.content).join("\n") + "\nuser: " + userText;

    const response = await fetch(workerURL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text: prompt })
    });

    const data = await response.json();
    return data.reply;

  } catch(e) {
    let lang = /[\u0980-\u09FF]/.test(userText) ? 'bn' : 'en';
    if(lang === 'bn') return `Error: Worker connect হয়নি। ${e.message}`;
    else return `Error: Worker not connected. ${e.message}`;
  }
}
</script>
</body>
</html>
