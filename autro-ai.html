<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Autro AI - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --blue:#1877f2; --brand:#4caf50; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;} 
.header{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);} 
.header b{flex:1;text-align:center;font-size:18px;} 
.chat-container{flex:1;overflow-y:auto;padding:16px;} 
.ai-msg, .user-msg{margin:8px 0;display:flex;gap:8px;} 
.ai-msg{align-items:flex-start;} 
.user-msg{justify-content:flex-end;} 
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;} 
.ai-bubble{background:var(--card);border-bottom-left-radius:4px;} 
.user-bubble{background:var(--blue);border-bottom-right-radius:4px;} 
.avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;background:#444;} 
.avatar img{width:100%;height:100%;object-fit:cover;}
.input-area{display:flex;gap:8px;padding:12px;background:var(--card);border-top:1px solid var(--border);} 
.input-area input{flex:1;background:#3a3b3c;border:none;border-radius:20px;padding:10px 14px;color:var(--text);font-size:15px;outline:none;} 
.input-area button{background:var(--blue);border:none;border-radius:50%;width:40px;height:40px;color:white;font-size:18px;cursor:pointer;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Autro AI Assistant</b>
</div>

<div class="chat-container" id="chatBox">
<div class="ai-msg">
<div class="avatar"><img src="https://raw.githubusercontent.com/abirmazumder250/Autrobook/main/logo.png"></div>
<div class="bubble ai-bubble">Hello! I'm Autro AI 👋<br>যা জিজ্ঞেস করবা তাই উত্তর দিব</div>
</div>
</div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Autro AI কে কিছু জিজ্ঞাসা করুন..." onkeypress="if(event.key==='Enter') sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>

<script>
let chatBox = document.getElementById('chatBox');

function sendMsg(){
let input = document.getElementById('userInput');
let text = input.value.trim();
if(text === '') return;

addMessage(text, 'user');
input.value = '';

setTimeout(()=>{
let reply = getAnswer(text);
addMessage(reply, 'ai');
}, 300);
}

function addMessage(text, sender){
let msgDiv = document.createElement('div');
msgDiv.className = sender === 'user' ? 'user-msg' : 'ai-msg';
if(sender === 'ai'){
msgDiv.innerHTML = `<div class="avatar"><img src="https://raw.githubusercontent.com/abirmazumder250/Autrobook/main/logo.png"></div><div class="bubble ai-bubble">${text}</div>`;
}else{
msgDiv.innerHTML = `<div class="bubble user-bubble">${text}</div>`;
}
chatBox.appendChild(msgDiv);
chatBox.scrollTop = chatBox.scrollHeight;
}

function isBangla(text){ return /[\u0980-\u09FF]/.test(text); }

function getAnswer(q){
q = q.toLowerCase().trim();

// Bangla
if(isBangla(q)){
if(q.includes('হাই') || q.includes('হ্যালো')) return "হাই ভাই! কেমন আছো? 😊";
if(q.includes('কি করো')) return "আমি তোমার সাথে আড্ডা দিচ্ছি। তুমি কি করো?";
if(q.includes('নাম কি')) return "আমার নাম Autro AI। তোমাকে সাহায্য করাই আমার কাজ।";
if(q.includes('খাইছো')) return "আমি তো AI ভাই, খাই না। তুমি খাইছো?";
if(q.includes('ভালো আছো')) return "আলহামদুলিল্লাহ ভালো। তুমি কেমন আছো?";
if(q.includes('কোথায় থাকো')) return "আমি Autrobook এর ভিতরেই থাকি 😄";
if(q.includes('সাহায্য')) return "হ্যাঁ বলো। প্রোফাইল, পোস্ট, সেটিংস সব বিষয়ে হেল্প করব।";
return `তোমার "${q}" প্রশ্নটা ভালো লাগছে। এটা নিয়ে আরো বিস্তারিত জানতে চাও?`;
}

// English
else{
if(q.includes('hi') || q.includes('hello')) return "Hey! How are you doing today? 😊";
if(q.includes('what are you doing')) return "Just talking with you bro. What's on your mind?";
if(q.includes('your name')) return "I'm Autro AI, your assistant on Autrobook.";
if(q.includes('eat') || q.includes('lunch')) return "I'm an AI, I don't eat. Have you eaten?";
if(q.includes('how are you')) return "I'm great! Thanks for asking. You?";
if(q.includes('where are you')) return "I'm living inside Autrobook 😄";
if(q.includes('help')) return "Sure! I can help with Profile, Posts, Settings and everything.";
return `That's an interesting question about "${q}". Want me to explain more?`;
}
}
</script>
</body> </html>
