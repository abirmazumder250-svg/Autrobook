<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Fan Engagement - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --blue:#1877f2; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);} 
.header{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);} 
.header b{flex:1;text-align:center;font-size:18px;} 
.section{padding:16px;} 
.section h2{font-size:20px;margin-bottom:6px;} 
.section p{color:#aaa;font-size:14px;margin-bottom:16px;} 
.badge-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);} 
.badge-left{display:flex;gap:12px;align-items:center;} 
.badge-icon{width:40px;height:40px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:20px;} 
.switch{position:relative;width:50px;height:28px;} 
.switch input{opacity:0;width:0;height:0;} 
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#555;transition:.4s;border-radius:28px;} 
.slider:before{position:absolute;content:"";height:20px;width:20px;left:4px;bottom:4px;background:white;transition:.4s;border-radius:50%;} 
input:checked + .slider{background:var(--blue);} 
input:checked + .slider:before{transform:translateX(22px);} 
.btn{background:var(--card);padding:14px;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;margin-top:16px;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Creator Dashboard</b>
<span>📊</span>
</div>

<div class="section">
<h2>Fan badges</h2>
<p>People who earn these badges can display them when they comment on your content to recognize their efforts.</p>

<div class="badge-item">
<div class="badge-left"><div class="badge-icon">💎</div><div><b>Top fan</b></div></div>
<label class="switch"><input type="checkbox" id="topFan" onchange="toggleTopFan()"><span class="slider"></span></label>
</div>

<div class="badge-item" id="risingItem" style="opacity:0.5">
<div class="badge-left"><div class="badge-icon">💎</div><div><b>Rising fan</b><p style="font-size:12px">Turn on top fan badges to use rising fan badges.</p></div></div>
<label class="switch"><input type="checkbox" id="risingFan" disabled><span class="slider"></span></label>
</div>
</div>

<div class="section">
<h2>Removed badges</h2>
<p>You have not removed any badges.</p>
</div>

<div class="section">
<div class="btn" onclick="alert('Fan engagement tools coming soon')">Fan engagement tools</div>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {};
document.getElementById('topFan').checked = currentUser.topFan || false;
if(currentUser.topFan) document.getElementById('risingItem').style.opacity = 1;

function toggleTopFan(){
currentUser.topFan = document.getElementById('topFan').checked;
localStorage.setItem('autrobook_user', JSON.stringify(currentUser));
document.getElementById('risingItem').style.opacity = currentUser.topFan ? 1 : 0.5;
document.getElementById('risingFan').disabled = !currentUser.topFan;
}
</script>
</body> </html>
