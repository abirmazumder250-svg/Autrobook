<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Card - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-color: #ffffff;
    --surface-color: #ffffff;
    --card-bg: #f8fafc;
    --input-bg: #f1f5f9;
    --text-color: #0f172a;
    --muted-color: #5f6368;
    --border-color: #e5e7eb;
    --hover-color: rgba(0, 0, 0, 0.06);
    --accent-color: #111827;
    --accent-hover: #1f2937;
    --btn-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #202124;
      --surface-color: #202124;
      --card-bg: #292a2d;
      --input-bg: #303134;
      --text-color: #f1f5f9;
      --muted-color: #9aa0a6;
      --border-color: #3c4043;
      --hover-color: rgba(255, 255, 255, 0.08);
      --accent-color: #e8eaed;
      --accent-hover: #ffffff;
      --btn-text: #202124;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #000000;
    color: #ffffff;
    overflow: hidden;
  }

  .reel-container {
    height: 100vh;
    width: 100vw;
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #000000;
  }

  video,
  .reel-image {
    height: 100%;
    width: 100%;
    object-fit: cover;
    display: block;
  }

  .reel-image {
    display: none;
  }

  /* Top Left Quality Badge */
  .quality-badge {
    position: absolute;
    top: 16px;
    left: 14px;
    background: rgba(32, 33, 36, 0.72);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    z-index: 12;
  }

  /* Top Right Controls */
  .top-right-controls {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 15;
  }

  .top-pill-btn {
    height: 36px;
    min-width: 36px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(32, 33, 36, 0.75);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    text-decoration: none;
  }

  /* Three Dots Dropdown Menu */
  .more-menu {
    position: absolute;
    top: 56px;
    right: 14px;
    width: 225px;
    background: #292a2d;
    border: 1px solid #3c4043;
    border-radius: 14px;
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 25;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
  }

  .more-menu.open {
    display: flex;
  }

  .more-menu-item {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: #f1f5f9;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    cursor: pointer;
  }

  .more-menu-item:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .more-menu-item.danger {
    color: #f87171;
  }

  /* Right Side Actions */
  .actions {
    position: absolute;
    right: 12px;
    bottom: 108px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    z-index: 12;
  }

  .action-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
    background: transparent;
    border: none;
    color: #ffffff;
  }

  .action-btn .icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(32, 33, 36, 0.68);
    border: 1px solid rgba(255, 255, 255, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }

  .action-btn.active .icon {
    background: rgba(255, 255, 255, 0.24);
    transform: scale(1.06);
  }

  .count-trigger {
    font-size: 12px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 8px;
  }

  .count-trigger:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  /* Bottom Info */
  .bottom-info {
    position: absolute;
    bottom: 18px;
    left: 14px;
    right: 74px;
    z-index: 12;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }

  .profile-header-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .author-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #ffffff;
  }

  .author-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    background: #303134;
    border: 1px solid rgba(255, 255, 255, 0.45);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .author-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .username {
    font-weight: 700;
    font-size: 14px;
  }

  .issue-pill {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(239, 68, 68, 0.88);
    color: #ffffff;
    display: none;
  }

  .small-follow-btn {
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.75);
    background: rgba(32, 33, 36, 0.72);
    color: #ffffff;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }

  .small-follow-btn.following {
    background: #ffffff;
    color: #202124;
    border-color: #ffffff;
  }

  .caption {
    font-size: 13.5px;
    margin-bottom: 5px;
    line-height: 1.35;
    word-break: break-word;
  }

  .audio-small {
    font-size: 11px;
    opacity: 0.82;
    margin-bottom: 3px;
  }

  .views-line {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.92;
  }

  /* React Popup */
  .react-popup {
    position: fixed;
    right: 64px;
    bottom: 114px;
    background: #292a2d;
    border: 1px solid #3c4043;
    padding: 8px 12px;
    border-radius: 999px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  .react-popup.show {
    display: flex;
  }

  .react-popup .emoji {
    font-size: 23px;
    cursor: pointer;
    transition: transform 0.14s ease;
  }

  .react-popup .emoji:hover {
    transform: scale(1.22);
  }

  /* Small Share Box with Small 'A' System Default Logo & Share/Copy Actions */
  .share-popover {
    position: fixed;
    right: 66px;
    bottom: 114px;
    width: 255px;
    background: var(--surface-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 52;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
  }

  .share-popover.open {
    display: flex;
  }

  .share-brand-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sys-default-a-logo {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--accent-color);
    color: var(--btn-text);
    font-size: 13px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    flex-shrink: 0;
  }

  .share-brand-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-color);
  }

  .share-link-preview {
    font-size: 11px;
    color: var(--muted-color);
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 6px 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .share-actions-grid {
    display: flex;
    gap: 6px;
  }

  .copy-link-action-btn {
    flex: 1;
    padding: 8px 10px;
    border-radius: 9px;
    border: none;
    background: var(--accent-color);
    color: var(--btn-text);
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    text-decoration: none;
  }

  .copy-link-action-btn.secondary {
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
  }

  /* Bottom Sheets */
  .bottom-sheet {
    position: fixed;
    left: 50%;
    transform: translate(-50%, 100%);
    bottom: 0;
    width: 100%;
    max-width: 680px;
    max-height: 82vh;
    background: var(--surface-color);
    color: var(--text-color);
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    border-top: 1px solid var(--border-color);
    z-index: 35;
    display: flex;
    flex-direction: column;
    transition: transform 0.24s ease;
  }

  .bottom-sheet.open {
    transform: translate(-50%, 0);
  }

  .sheet-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .sheet-title {
    font-size: 15px;
    font-weight: 700;
  }

  .sheet-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .comment-perm-select {
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    font-weight: 600;
    outline: none;
  }

  .close-sheet-btn {
    background: transparent;
    border: none;
    color: var(--text-color);
    font-size: 18px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
  }

  .sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .comment-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    user-select: none;
  }

  .comment-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted-color);
    gap: 8px;
  }

  .comment-author-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .comment-author {
    font-weight: 700;
    color: var(--text-color);
    text-decoration: none;
  }

  .comment-name-react-btn {
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 11px;
    cursor: pointer;
    line-height: 1.2;
  }

  .comment-name-react-btn.active {
    background: var(--accent-color);
    color: var(--btn-text);
    border-color: var(--accent-color);
  }

  .comment-body {
    font-size: 13.5px;
    line-height: 1.4;
    word-break: break-word;
  }

  .mention-tag {
    font-weight: 700;
    color: #2563eb;
  }

  @media (prefers-color-scheme: dark) {
    .mention-tag {
      color: #60a5fa;
    }
  }

  .comment-actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
  }

  .comment-left-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .c-action-btn {
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .c-action-btn.active {
    background: var(--accent-color);
    color: var(--btn-text);
    border-color: var(--accent-color);
  }

  .comment-more-wrap {
    position: relative;
  }

  .comment-dots-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
  }

  .comment-dots-menu {
    position: fixed;
    width: 165px;
    background: #292a2d;
    border: 1px solid #3c4043;
    border-radius: 12px;
    padding: 4px;
    display: none;
    flex-direction: column;
    z-index: 55;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  .comment-dots-menu.open {
    display: flex;
  }

  .comment-dots-item {
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #f1f5f9;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    cursor: pointer;
  }

  .comment-dots-item:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .comment-dots-item.danger {
    color: #f87171;
  }

  .comment-footer {
    position: relative;
    padding: 10px 14px 14px;
    border-top: 1px solid var(--border-color);
    background: var(--surface-color);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* @Mention Suggestion Box */
  .mention-dropdown {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 64px;
    max-height: 190px;
    overflow-y: auto;
    background: var(--surface-color);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
    display: none;
    flex-direction: column;
    z-index: 45;
  }

  .mention-dropdown.open {
    display: flex;
  }

  .mention-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 12px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-color);
    text-align: left;
    cursor: pointer;
    font-size: 13px;
  }

  .mention-item:last-child {
    border-bottom: none;
  }

  .mention-item:hover {
    background: var(--hover-color);
  }

  .comment-input-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .comment-input {
    flex: 1;
    min-width: 0;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    padding: 9px 13px;
    font-size: 13.5px;
    outline: none;
  }

  .round-tool-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }

  .round-tool-btn.active {
    background: var(--accent-color);
    color: var(--btn-text);
    border-color: var(--accent-color);
  }

  .round-tool-btn.primary {
    background: var(--accent-color);
    color: var(--btn-text);
    border-color: var(--accent-color);
  }

  .round-tool-btn.recording {
    background: #dc2626;
    color: #ffffff;
    border-color: #dc2626;
  }

  .voice-status {
    font-size: 12px;
    color: var(--muted-color);
    display: none;
    align-items: center;
    justify-content: space-between;
  }

  .voice-status.show {
    display: flex;
  }

  /* Reactor List Row */
  .reactor-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    text-decoration: none;
    color: var(--text-color);
  }

  .reactor-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .reactor-name {
    font-size: 13.5px;
    font-weight: 700;
  }

  .reactor-time {
    font-size: 11.5px;
    color: var(--muted-color);
  }

  /* Report Reason List */
  .reason-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    font-size: 13px;
    cursor: pointer;
  }

  .report-submit-btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent-color);
    color: var(--btn-text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .status-toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 65;
    background: #292a2d;
    color: #ffffff;
    border: 1px solid #3c4043;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    display: none;
  }

  .status-toast.show {
    display: block;
  }
</style>
</head>
<body>

<div class="reel-container" id="reelCard">
  <video id="reelVideo" loop playsinline></video>
  <img id="reelImage" class="reel-image" alt="Reel media">

  <div class="quality-badge" id="quality">HD</div>

  <div class="top-right-controls">
    <button type="button" class="top-pill-btn" id="soundBtn" title="Mute / Unmute">🔊</button>
    <button type="button" class="top-pill-btn" id="moreDotsBtn" title="More options" aria-label="More options">
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>
    <a href="index.html" class="top-pill-btn" title="Back to Feed"><i class="fa-solid fa-xmark"></i></a>
  </div>

  <!-- Top-Right Three Dots Menu -->
  <div class="more-menu" id="moreMenu">
    <button type="button" class="more-menu-item" id="menuSaveDraftBtn">
      <i class="fa-regular fa-bookmark"></i>
      <span>Save drafts</span>
    </button>
    <button type="button" class="more-menu-item" id="menuNotifyBtn">
      <i class="fa-regular fa-bell"></i>
      <span id="notifyMenuLabel">Notification on for this post</span>
    </button>
    <button type="button" class="more-menu-item" id="menuShareBtn">
      <i class="fa-solid fa-share"></i>
      <span>Share</span>
    </button>
    <button type="button" class="more-menu-item danger" id="menuReportBtn">
      <i class="fa-regular fa-flag"></i>
      <span>Report</span>
    </button>
  </div>

  <div class="actions">
    <div class="action-group">
      <button type="button" class="action-btn" id="likeBtn">
        <div class="icon" id="likeIcon">❤️</div>
      </button>
      <span class="count-trigger" id="likeCount" title="See who reacted">0</span>
    </div>

    <div class="action-group">
      <button type="button" class="action-btn" id="commentOpenBtn">
        <div class="icon"><i class="fa-regular fa-comment"></i></div>
      </button>
      <span class="count-trigger" id="commentCount">0</span>
    </div>

    <div class="action-group">
      <button type="button" class="action-btn" id="shareBtn">
        <div class="icon"><i class="fa-solid fa-share"></i></div>
      </button>
      <span class="count-trigger" id="shareLabelTrigger">Share</span>
    </div>
  </div>

  <!-- Small Share Box with 'A' System Default Logo + Share & Copy Link Actions -->
  <div class="share-popover" id="sharePopover">
    <div class="share-brand-row">
      <span class="sys-default-a-logo" aria-hidden="true">A</span>
      <span class="share-brand-title">AutroChat Share</span>
    </div>
    <div class="share-link-preview" id="shareLinkPreview">autrochat.html</div>
    <div class="share-actions-grid">
      <button type="button" class="copy-link-action-btn" id="copyAutroChatLinkBtn">

  function formatCount(num) {
    const n = Number(num || 0);
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  function formatLiveTime(isoDate) {
    const pastMs = new Date(isoDate || Date.now()).getTime();
    const diffSec = Math.max(1, Math.floor((Date.now() - pastMs) / 1000));

    if (diffSec < 60) return `${diffSec} sec${diffSec === 1 ? '' : 's'} ago`;
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return `${diffMin} min${diffMin === 1 ? '' : 's'} ago`;
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return `${diffHr} hour${diffHr === 1 ? '' : 's'} ago`;
    const diffDay = Math.floor(diffHr / 24);
    if (diffDay < 30) return `${diffDay} day${diffDay === 1 ? '' : 's'} ago`;
    const diffMonth = Math.floor(diffDay / 30);
    if (diffMonth < 12) return `${diffMonth} month${diffMonth === 1 ? '' : 's'} ago`;
    const diffYear = Math.floor(diffMonth / 12);
    return `${diffYear} year${diffYear === 1 ? '' : 's'} ago`;
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatCommentTextWithMentions(rawText) {
    const escaped = escapeHtml(rawText);
    return escaped.replace(/(^|\s)(@[A-Za-z0-9_.\u0980-\u09FF]+)/g, '$1<span class="mention-tag">$2</span>');
  }

  function playEffect(type) {
    if (!soundOn || !reelData.sound_enabled) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'enhance') {
        osc.type = 'triangle';
        const freq = Math.min(200, Math.max(100, 125 + (reelData.likes_count % 75)));
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(165, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(105, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      }
    } catch (e) {}
  }

  async function fetchProfileInfo(userId, fallbackName = 'User', fallbackAvatar = '') {

    let info = { name: fallbackName, avatar: fallbackAvatar, hasIssue: false };
    if (supabaseClient) {
      try {
        const { data } = await supabaseClient
          .from('profiles')
          .select('id, full_name, username, avatar_url, has_issue, is_restricted')
          .eq('id', userId)
          .maybeSingle();

        if (data) {
          info = {
            name: data.full_name || data.username || fallbackName,
            avatar: data.avatar_url || fallbackAvatar,
            hasIssue: Boolean(data.has_issue || data.is_restricted)
          };
        }
      } catch (e) {}
    }

    profileCache.set(userId, info);
    return info;
  }

          .select('friend_id, user_id')

          .limit(100);

        const friendIds = (friendsRows || [])
          .map((row) => (row.user_id === currentUserId ? row.friend_id : row.user_id))
          .filter(Boolean);

        if (friendIds.length) {
          const { data: friendProfiles } = await supabaseClient
            .from('profiles')
            .select('id, full_name, username, avatar_url, has_issue, is_restricted')
            .in('id', friendIds);

          (friendProfiles || []).forEach((p) => {
            const handle = p.username || (p.full_name || 'user').replace(/\s+/g, '_').toLowerCase();

              avatar_url: p.avatar_url || '',
              has_issue: Boolean(p.has_issue || p.is_restricted)

      }

      const { data: allProfiles } = await supabaseClient
        .from('profiles')
        .select('id, full_name, username, avatar_url, has_issue, is_restricted')
        .limit(100);

      (allProfiles || []).forEach((p) => {

  async function applyReelReaction(emoji) {
    const actorId = currentUserId || 'guest_user';
    const actorName = currentUserProfile.name || 'You';
    const actorAvatar = currentUserProfile.avatar || '';

    if (userReelReaction === emoji) {
      userReelReaction = null;
      reelData.likes_count = Math.max(0, (reelData.likes_count || 0) - 1);
      reelReactors = reelReactors.filter((r) => r.user_id !== actorId);
      playEffect('pop');
      notify('Reaction removed');

      if (supabaseClient && reelData.id) {
        try {
          await supabaseClient
            .from('reel_reactions')
            .delete()
            .eq('reel_id', reelData.id)
            .eq('user_id', actorId);
        } catch (e) {}
      }
    } else {
      const hadReaction = Boolean(userReelReaction);
      userReelReaction = emoji;
      if (!hadReaction) {
        reelData.likes_count = (reelData.likes_count || 0) + 1;
      }
      const nowIso = new Date().toISOString();
      reelReactors = reelReactors.filter((r) => r.user_id !== actorId);
      reelReactors.unshift({
        user_id: actorId,
        name: actorName,
        avatar: actorAvatar,
        emoji,
        reacted_at: nowIso
      });
      playEffect('enhance');
      notify(`Reacted with ${emoji}`);

      if (supabaseClient && reelData.id) {
        try {
          await supabaseClient
            .from('reel_reactions')
            .upsert({
              reel_id: reelData.id,
              user_id: actorId,
              user_name: actorName,
              user_avatar: actorAvatar,
              emoji,
              created_at: nowIso
            }, { onConflict: 'reel_id,user_id' });
        } catch (e) {}
      }
    }
    updateCounters();
    persistLocalReelState();
  }

  function updateMentionSuggestions() {
    const val = commentInput.value;
    const caret = commentInput.selectionStart ?? val.length;
    const beforeCaret = val.slice(0, caret);
    const match = beforeCaret.match(/(?:^|\s)@([^\s@]*)$/);

    if (!match) {
      mentionDropdown.classList.remove('open');
      return;
    }

    const query = (match[1] || '').toLowerCase();
    const pool = mentionableUsers.length
      ? mentionableUsers
      : [
          { id: reelData.user_id, name: reelData.author_name, handle: reelData.author_name.replace(/\s+/g, '_').toLowerCase(), avatar_url: reelData.author_avatar }
        ];

    const filtered = pool.filter((u) => {
      const n = (u.name || '').toLowerCase();
      const h = (u.handle || '').toLowerCase();
      return !query || n.includes(query) || h.includes(query);
    }).slice(0, 12);

    if (!filtered.length) {
      mentionDropdown.classList.remove('open');
      return;
    }

    mentionDropdown.innerHTML = filtered.map((u) => {
      const av = u.avatar_url
        ? `<img src="${escapeHtml(u.avatar_url)}" alt="${escapeHtml(u.name)}">`
        : `<i class="fa-regular fa-user"></i>`;
      return `
        <button type="button" class="mention-item" data-handle="${escapeHtml(u.handle)}">
          <span class="author-avatar" style="width:26px;height:26px;">${av}</span>
          <div>
            <div style="font-weight:700;">${escapeHtml(u.name)}</div>
            <div style="font-size:11.5px;color:var(--muted-color);">@${escapeHtml(u.handle)}</div>
          </div>
        </button>
      `;
    }).join('');

    mentionDropdown.querySelectorAll('.mention-item').forEach((item) => {
      item.addEventListener('click', () => {
        const handle = item.getAttribute('data-handle');
        const curVal = commentInput.value;
        const pos = commentInput.selectionStart ?? curVal.length;
        const left = curVal.slice(0, pos);
        const right = curVal.slice(pos);
        const replacedLeft = left.replace(/(?:^|\s)@([^\s@]*)$/, (full) => {
          const leadingSpace = full.startsWith(' ') ? ' ' : '';
          return `${leadingSpace}@${handle} `;
        });
        commentInput.value = replacedLeft + right;
        mentionDropdown.classList.remove('open');
        commentInput.focus();
      });
    });

    mentionDropdown.classList.add('open');
  }

  voiceRecordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      notify('Microphone not supported');
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      recordedVoiceUrl = '';
      recordedVoiceDuration = 0;

      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) audioChunks.push(ev.data);
      };
      mediaRecorder.onstop = () => {
        clearInterval(recordTimer);
        voiceRecordBtn.classList.remove('recording');
        stream.getTracks().forEach((t) => t.stop());
        if (audioChunks.length > 0) {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          recordedVoiceUrl = URL.createObjectURL(blob);
          voiceStatus.classList.add('show');
          voiceStatusText.textContent = `Voice recorded (${recordedVoiceDuration}s / ${MAX_VOICE_SECONDS}s max)`;
        }
      };

      mediaRecorder.start();
      voiceRecordBtn.classList.add('recording');
      voiceStatus.classList.add('show');
      voiceStatusText.textContent = `Recording... 0s / ${MAX_VOICE_SECONDS}s`;

      recordTimer = setInterval(() => {
        recordedVoiceDuration += 1;
        voiceStatusText.textContent = `Recording... ${recordedVoiceDuration}s / ${MAX_VOICE_SECONDS}s`;
        if (recordedVoiceDuration >= MAX_VOICE_SECONDS) {
          mediaRecorder.stop();
        }
      }, 1000);
    } catch (err) {
      notify('Microphone access denied');
    }
  });

    commentDotsMenu.classList.remove('open');
    const c = comments.find((x) => x.id === activeCommentMenuId);
    if (!c) return;
    openReportSheet({
      targetType: 'comment',
      targetId: c.id,
      targetOwnerId: c.user_id,
      targetOwnerName: c.author_name
    });
  });

  async function renderComments() {
    if (reelData.comment_setting === 'locked') {
      commentsList.innerHTML = `<div style="text-align:center;color:var(--muted-color);padding:24px;font-size:13px;">Comments are locked for this reel.</div>`;
      return;
    }

    if (!comments.length) {
      commentsList.innerHTML = `<div style="text-align:center;color:var(--muted-color);padding:24px;font-size:13px;">No comments yet.</div>`;
      return;
    }

    const enrichedComments = await Promise.all(
      comments.map(async (c) => {
        const p = await fetchProfileInfo(c.user_id, c.author_name, c.author_avatar);
        return { ...c, author_name: p.name, author_avatar: p.avatar, hasIssue: p.hasIssue };
      })
    );

    commentsList.innerHTML = enrichedComments.map((c) => {
      const voiceHtml = c.voice_url
        ? `<audio controls src="${escapeHtml(c.voice_url)}" style="width:100%;height:34px;"></audio>`
        : '';
      const textHtml = c.comment_text
        ? `<div class="comment-body">${formatCommentTextWithMentions(c.comment_text)}</div>`
        : '';
      const issueBadge = c.hasIssue ? `<span class="issue-pill" style="display:inline-block;">Issue</span>` : '';

      return `
        <div class="comment-card" data-cid="${escapeHtml(c.id)}">
          <div class="comment-top">
            <div class="comment-author-wrap">
              <a href="profile.html?user=${encodeURIComponent(c.user_id)}" class="comment-author">${escapeHtml(c.author_name)}</a>
              ${issueBadge}
              <button type="button" class="comment-name-react-btn ${c.userReaction ? 'active' : ''}" data-cid="${escapeHtml(c.id)}" title="React to comment">${escapeHtml(c.userReaction || '❤️')}</button>
            </div>
            <span class="live-comment-time" data-created="${escapeHtml(c.created_at)}">${escapeHtml(formatLiveTime(c.created_at))}</span>
          </div>
          ${textHtml}
          ${voiceHtml}
          <div class="comment-actions-row">
            <div class="comment-left-actions">
              <button type="button" class="c-action-btn c-react-btn ${c.userReaction ? 'active' : ''}" data-cid="${escapeHtml(c.id)}">
                <span>${escapeHtml(c.userReaction || '❤️')}</span>
                <span>${formatCount(c.likes_count)}</span>
              </button>
              <button type="button" class="c-action-btn c-dislike-btn ${c.userDisliked ? 'active' : ''}" data-cid="${escapeHtml(c.id)}">
                <i class="fa-regular fa-thumbs-down"></i>
                <span>${formatCount(c.dislikes_count)}</span>
              </button>
            </div>
            <div class="comment-more-wrap">
              <button type="button" class="comment-dots-btn" data-cid="${escapeHtml(c.id)}" data-owner="${escapeHtml(c.user_id)}" title="Comment options">
                <i class="fa-solid fa-ellipsis-vertical"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    commentsList.querySelectorAll('.comment-card').forEach((card) => {
      const cid = card.getAttribute('data-cid');
      let copyTimer = null;
      card.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button') || e.target.closest('a') || e.target.closest('audio')) return;
        copyTimer = setTimeout(() => {
          copyCommentText(cid);
        }, 500);
      });
      card.addEventListener('pointerup', () => clearTimeout(copyTimer));
      card.addEventListener('pointerleave', () => clearTimeout(copyTimer));
    });

    commentsList.querySelectorAll('.c-react-btn, .comment-name-react-btn').forEach((btn) => {
      const cid = btn.getAttribute('data-cid');
      let timer = null;
      let longPress = false;

      btn.addEventListener('pointerdown', () => {
        longPress = false;
        timer = setTimeout(() => {
          longPress = true;
          showReactionPopupAt(btn, 'comment', cid);
        }, 450);
      });

      btn.addEventListener('pointerup', () => {
        clearTimeout(timer);
        if (!longPress) {
          const item = comments.find((x) => x.id === cid);
          toggleCommentReaction(cid, (item && item.userReaction) || '❤️');
        }
      });

      btn.addEventListener('pointerleave', () => clearTimeout(timer));
    });

    commentsList.querySelectorAll('.c-dislike-btn').forEach((btn) => {
      btn.addEventListener('click', () => toggleCommentDislike(btn.getAttribute('data-cid')));
    });

    commentsList.querySelectorAll('.comment-dots-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openCommentDotsMenu(btn, btn.getAttribute('data-cid'), btn.getAttribute('data-owner'));
      });
    });
  }

  document.getElementById('sendCommentBtn').addEventListener('click', async () => {
    if (reelData.comment_setting === 'locked') {
      notify('Comments are locked');
      return;
    }

    const text = commentInput.value.trim();
    if (!text && !recordedVoiceUrl) {
      notify('Write a comment or record a voice note (max 30s)');
      return;
    }
    if (recordedVoiceDuration > MAX_VOICE_SECONDS) {
      notify('Voice comment cannot exceed 30 seconds');
      return;
    }

    const actorId = currentUserId || 'guest_user';
    const p = await fetchProfileInfo(actorId, currentUserProfile.name, currentUserProfile.avatar);

    const newComment = {
      id: 'c_' + Date.now(),
      user_id: actorId,
      author_name: p.name,
      author_avatar: p.avatar,
      comment_text: text,
      voice_url: recordedVoiceUrl,
      voice_duration: recordedVoiceDuration,
      likes_count: composerDraftReaction ? 1 : 0,
      dislikes_count: 0,
      userReaction: composerDraftReaction || null,
      userDisliked: false,
      created_at: new Date().toISOString()
    };

    comments.unshift(newComment);
    reelData.comments_count = comments.length;
    commentInput.value = '';
    mentionDropdown.classList.remove('open');
    composerDraftReaction = null;
    composerReactEmoji.textContent = '❤️';
    composerReactBtn.classList.remove('active');
    recordedVoiceUrl = '';
    recordedVoiceDuration = 0;
    voiceStatus.classList.remove('show');
    updateCounters();
    persistLocalReelState();
    await renderComments();
    playEffect('enhance');

    if (supabaseClient && reelData.id) {
      try {
        await supabaseClient.from('reel_comments').insert({
          reel_id: reelData.id,
          user_id: newComment.user_id,
          author_name: newComment.author_name,
          author_avatar: newComment.author_avatar,
          comment_text: newComment.comment_text,
          voice_url: newComment.voice_url,
          voice_duration: newComment.voice_duration,
          likes_count: newComment.likes_count,
          dislikes_count: newComment.dislikes_count,
          created_at: newComment.created_at
        });
      } catch (e) {}
    }
  });

  commentInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !mentionDropdown.classList.contains('open')) {
      e.preventDefault();
      document.getElementById('sendCommentBtn').click();
    }
  });

  // Live relative clock ticker every 1s for reel + comments
  setInterval(() => {
    viewsEl.textContent = `${formatCount(reelData.views_count)} views • ${formatLiveTime(reelData.created_at)}`;
    commentsList.querySelectorAll('.live-comment-time').forEach((el) => {
      const iso = el.getAttribute('data-created');
      if (iso) el.textContent = formatLiveTime(iso);
    });
  }, 1000);

  document.addEventListener('DOMContentLoaded', async () => {
    if (supabaseClient) {
      try {
        const { data } = await supabaseClient.auth.getUser();
        if (data && data.user) {
          currentUserId = data.user.id;
          const myProf = await fetchProfileInfo(
            currentUserId,
            data.user.user_metadata?.full_name || data.user.email || 'You',
            data.user.user_metadata?.avatar_url || ''
          );
          currentUserProfile = { name: myProf.name, avatar: myProf.avatar };
        }
      } catch (e) {}
    }

    await loadLiveFriendsAndUsers();
    await syncLiveReelFromSupabase();
    subscribeRealtimeUpdates();
    await renderReelInfo();
    await renderComments();
  });
</script>
</body>
