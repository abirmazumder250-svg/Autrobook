<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Reset Password - Autrobook</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{--bg:#18191a;--card:#242526;--text:#e4e6eb;--text2:#b0b3b8;--border:#3a3b3c;--brand:#2e7d32;}
body{background:var(--bg);color:var(--text);font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
.container{background:var(--card);padding:30px;border-radius:10px;width:90%;max-width:400px;box-shadow:0 0 20px #000;}
.logo{text-align:center;margin-bottom:20px;}
.logo div{width:80px;height:80px;background:var(--brand);border-radius:20px;margin:0 auto;display:flex;justify-content:center;align-items:center;font-size:50px;font-weight:bold;color:white;}
h2{text-align:center;margin-bottom:20px;}
input{width:100%;padding:12px;background:#3a3b3c;border:1px solid var(--border);border-radius:6px;color:var(--text);margin-bottom:15px;box-sizing:border-box;}
.btn{width:100%;padding:12px;background:var(--brand);color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:16px;}
.btn:disabled{background:#555;cursor:not-allowed;}
.link{text-align:center;margin-top:15px;color:var(--brand);cursor:pointer;text-decoration:none;display:block;}
.error{color:#e91e63;font-size:13px;margin-bottom:10px;text-align:center;}
.g-recaptcha{margin:15px 0;display:flex;justify-content:center;}
.hidden{display:none;}
</style>
</head>
<body>

<div class="container">
  <div class="logo"><div>A</div></div>
  
  <!-- LOGIN FORM -->
  <div id="loginForm">
    <h2>Login to Autrobook</h2>
    <div class="error" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="Email address">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
    <a class="link" onclick="showReset()">Forgot Password?</a>
  </div>

  <!-- RESET PASSWORD FORM -->
  <div id="resetForm" class="hidden">
    <h2>Reset Password</h2>
    <p style="color:var(--text2); font-size:14px; text-align:center;">Enter your Email :</p>
    <div class="error" id="resetError"></div>
    <input type="email" id="resetEmail" placeholder="Your email address">
    
    <!-- RECAPTCHA -->
    <div class="g-recaptcha" data-sitekey="6LdkLBwuAAAAACrAcDo-ocFxQQda8MUAgZirrIsj"></div>
    
    <button class="btn" id="otpBtn" onclick="sendOTP()">Verify & Send OTP</button>
    <a class="link" onclick="showLogin()">← Back to Login</a>
  </div>

  <!-- OTP VERIFY FORM -->
  <div id="otpForm" class="hidden">
    <h2>Enter OTP</h2>
    <p style="color:var(--text2); font-size:14px; text-align:center;">OTP sent to <span id="otpEmail"></span></p>
    <div class="error" id="otpError"></div>
    <input type="text" id="otpInput" placeholder="Enter 6 digit OTP" maxlength="6">
    <input type="password" id="newPassword" placeholder="New Password">
    <button class="btn" onclick="resetPassword()">Reset Password</button>
  </div>
</div>

<script>
let resetEmailGlobal = '';
let generatedOTP = '';

// Show/Hide Forms
function showReset(){
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('resetForm').classList.remove('hidden');
}
function showLogin(){
  document.getElementById('resetForm').classList.add('hidden');
  document.getElementById('otpForm').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
  grecaptcha.reset(); // reset captcha
}

// Dummy Login
function login(){
  let email = document.getElementById('loginEmail').value;
  let pass = document.getElementById('loginPassword').value;
  if(!email || !pass){ document.getElementById('loginError').innerText = 'Fill all fields'; return; }
  alert('Login Success! Redirecting...');
  // window.location.href = 'profile.html'
}

// Send OTP with reCAPTCHA check
function sendOTP(){
  let email = document.getElementById('resetEmail').value;
  let captcha = grecaptcha.getResponse();
  
  if(!email){ document.getElementById('resetError').innerText = 'Enter email'; return; }
  if(captcha.length == 0){ document.getElementById('resetError').innerText = 'Please verify reCAPTCHA'; return; }
  
  document.getElementById('otpBtn').disabled = true;
  document.getElementById('otpBtn').innerText = 'Sending...';
  
  // OTP Generate and Save to LocalStorage - Demo
  generatedOTP = Math.floor(100000 + Math.random() * 900000);
  resetEmailGlobal = email;
  localStorage.setItem('reset_otp', generatedOTP);
  localStorage.setItem('reset_email', email);
  
  setTimeout(()=>{
    document.getElementById('resetForm').classList.add('hidden');
    document.getElementById('otpForm').classList.remove('hidden');
    document.getElementById('otpEmail').innerText = email;
    alert('Demo OTP: ' + generatedOTP); // Remove this in production
    document.getElementById('otpBtn').disabled = false;
    document.getElementById('otpBtn').innerText = 'Verify & Send OTP';
  }, 1500);
}

// Verify OTP and Reset Password
function resetPassword(){
  let otp = document.getElementById('otpInput').value;
  let newPass = document.getElementById('newPassword').value;
  let savedOTP = localStorage.getItem('reset_otp');
  
  if(otp != savedOTP){ document.getElementById('otpError').innerText = 'Invalid OTP'; return; }
  if(newPass.length < 6){ document.getElementById('otpError').innerText = 'Password min 6 characters'; return; }
  
  // Here you will save new password to your DB
  alert('Password Reset Successful ✅');
  localStorage.removeItem('reset_otp');
  localStorage.removeItem('reset_email');
  showLogin();
}
</script>
</body>
</html>
