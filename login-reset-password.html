<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Autrobook</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{--bg:#0a1a0a;--card:#122212;--text:#e4e6eb;--text2:#8aa38a;--border:#1f3a1f;--brand:#2e7d32;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.container{background:var(--card);padding:30px 25px;border-radius:15px;width:100%;max-width:400px;}
.logo{text-align:center;margin-bottom:20px;}
.logo div{width:80px;height:80px;background:linear-gradient(135deg,#2e7d32,#1b5e20);border-radius:20px;margin:0 auto;display:flex;justify-content:center;align-items:center;font-size:50px;font-weight:bold;color:white;}
h2{text-align:center;margin-bottom:25px;font-size:24px;}
label{display:block;margin-bottom:8px;font-size:14px;color:var(--text2);}
input{width:100%;padding:14px;background:#0f1f0f;border:1px solid var(--border);border-radius:10px;color:var(--text);margin-bottom:18px;font-size:15px;}
.btn{width:100%;padding:14px;background:var(--brand);color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px;}
.btn:disabled{background:#555;}
.link{text-align:center;margin-top:18px;color:var(--brand);cursor:pointer;font-weight:bold;display:block;}
.error{color:#e91e63;font-size:13px;margin-bottom:10px;text-align:center;}
.success{color:#4caf50;font-size:13px;margin-bottom:10px;text-align:center;}
.g-recaptcha{margin:15px 0;display:flex;justify-content:center;transform:scale(0.9);}
.hidden{display:none;}
</style>
</head>
<body>

<div class="container">
  <div class="logo"><div>A</div></div>
  
  <!-- LOGIN FORM -->
  <div id="loginForm">
    <h2>Please Login</h2>
    <div class="error" id="loginError"></div>
    <div class="success" id="loginSuccess"></div>
    <label>Email Address :</label>
    <input type="email" id="loginEmail" placeholder="Enter your email">
    <label>Password :</label>
    <input type="password" id="loginPassword" placeholder="Enter your password">
    <button class="btn" id="loginBtn" onclick="login()">Login</button>
    <a class="link" onclick="showReset()">Forget password?</a>
    <a class="link" onclick="showSignup()">Signup New Account</a>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signupForm" class="hidden">
    <h2>Create Account</h2>
    <div class="error" id="signupError"></div>
    <label>Full Name :</label>
    <input type="text" id="signupName" placeholder="Enter your name">
    <label>Email Address :</label>
    <input type="email" id="signupEmail" placeholder="Enter your email">
    <label>Password :</label>
    <input type="password" id="signupPassword" placeholder="Min 6 characters">
    <button class="btn" id="signupBtn" onclick="signup()">Create Account</button>
    <a class="link" onclick="showLogin()">Already have account? Login</a>
  </div>

  <!-- RESET PASSWORD FORM -->
  <div id="resetForm" class="hidden">
    <h2>Reset Password</h2>
    <div class="error" id="resetError"></div>
    <div class="success" id="resetSuccess"></div>
    <label>Enter your Email :</label>
    <input type="email" id="resetEmail" placeholder="Your email address">
    <div class="g-recaptcha" data-sitekey="6LdkLBwuAAAAACrAcDo-ocFxQQda8MUAgZirrIsj"></div>
    <button class="btn" id="resetBtn" onclick="resetPassword()">Send Reset Link</button>
    <a class="link" onclick="showLogin()">← Back to Login</a>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // তোমার Firebase Config এখানে বসাও
  const firebaseConfig = {
    apiKey: "তোমার_API_KEY",
    authDomain: "autrobook.firebaseapp.com",
    projectId: "autrobook",
    storageBucket: "autrobook.appspot.com",
    messagingSenderId: "তোমার_SENDER_ID",
    appId: "তোমার_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.showReset = () => { hideAll(); document.getElementById('resetForm').classList.remove('hidden'); }
  window.showLogin = () => { hideAll(); document.getElementById('loginForm').classList.remove('hidden'); grecaptcha.reset(); }
  window.showSignup = () => { hideAll(); document.getElementById('signupForm').classList.remove('hidden'); }
  function hideAll(){ ['loginForm','signupForm','resetForm'].forEach(id=>document.getElementById(id).classList.add('hidden')); }

  // LOGIN
  window.login = async () => {
    let email = document.getElementById('loginEmail').value;
    let pass = document.getElementById('loginPassword').value;
    document.getElementById('loginError').innerText = '';
    document.getElementById('loginBtn').disabled = true;
    
    try{
      const userCredential = await signInWithEmailAndPassword(auth, email, pass);
      document.getElementById('loginSuccess').innerText = 'Login Success! Redirecting...';
      localStorage.setItem('autrobook_user', JSON.stringify({name:userCredential.user.displayName, email:userCredential.user.email, uid:userCredential.user.uid}));
      setTimeout(()=> window.location.href = 'profile.html', 1000);
    } catch(error){
      if(error.code == 'auth/user-not-found'){ document.getElementById('loginError').innerText = 'Email not found'; }
      else if(error.code == 'auth/wrong-password'){ document.getElementById('loginError').innerText = 'Wrong Password'; }
      else{ document.getElementById('loginError').innerText = error.message; }
    }
    document.getElementById('loginBtn').disabled = false;
  }

  // SIGNUP
  window.signup = async () => {
    let name = document.getElementById('signupName').value;
    let email = document.getElementById('signupEmail').value;
    let pass = document.getElementById('signupPassword').value;
    document.getElementById('signupError').innerText = '';
    document.getElementById('signupBtn').disabled = true;

    try{
      const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(userCredential.user, {displayName: name});
      alert('Account Created Successfully ✅');
      showLogin();
    } catch(error){
      if(error.code == 'auth/email-already-in-use'){ document.getElementById('signupError').innerText = 'Email already exists'; }
      else{ document.getElementById('signupError').innerText = error.message; }
    }
    document.getElementById('signupBtn').disabled = false;
  }

  // RESET PASSWORD
  window.resetPassword = async () => {
    let email = document.getElementById('resetEmail').value;
    let captcha = grecaptcha.getResponse();
    document.getElementById('resetError').innerText = '';
    document.getElementById('resetBtn').disabled = true;

    if(captcha.length == 0){ document.getElementById('resetError').innerText = 'Please verify reCAPTCHA'; document.getElementById('resetBtn').disabled = false; return; }

    try{
      await sendPasswordResetEmail(auth, email);
      document.getElementById('resetSuccess').innerText = 'Password reset link sent to your email ✅';
    } catch(error){
      if(error.code == 'auth/user-not-found'){ document.getElementById('resetError').innerText = 'Email not found in Firebase'; }
      else{ document.getElementById('resetError').innerText = error.message; }
    }
    document.getElementById('resetBtn').disabled = false;
  }
</script>
</body>
</html>
