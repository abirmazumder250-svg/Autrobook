<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Autrobook</title>
<style>
:root{ --bg: #0a1a0f; --card-bg: #13261a; --header-bg: #13261a; --text: #e4e6eb; --text-secondary: #7a9e80; --border: #1f3d2a; --brand: #4caf50; --hover: #1f3d2a; --verify: #1877f2; --danger:#f44336; }
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial;}
body{background:var(--bg); color:var(--text); padding-bottom:60px;}
.header{display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:var(--header-bg); position:sticky; top:0; z-index:10;}
.header span{font-size:22px; cursor:pointer;}
.cover{width:100%; height:200px; background:#1f3d2a; position:relative; cursor:pointer;}
.cover img{width:100%; height:100%; object-fit:cover;}
.cover.blur img{filter:blur(20px);}
.profile-pic-wrap{position:absolute; bottom:-65px; left:15px;}
.profile-pic{width:130px; height:130px; border-radius:50%; border:4px solid var(--bg); position:relative; cursor:pointer;}
.profile-pic img{width:100%; height:100%; border-radius:50%; object-fit:cover;}
.verify-badge{position:absolute; bottom:5px; right:5px; background:var(--verify); color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:16px; border:3px solid var(--bg); z-index:3;}
.profile-info{padding:80px 15px 15px;}
.profile-info h1{display:flex; align-items:center; gap:5px; font-size:24px;}
.profile-info p{color:var(--text-secondary); font-size:14px; margin:4px 0;}
.profile-buttons{display:flex; gap:10px; margin:15px 0;}
.btn{flex:1; padding:10px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
.btn-primary{background:var(--brand); color:white;}
.btn-secondary{background:var(--card-bg); color:var(--text);}
.btn-danger{background:var(--danger); color:white;}
.tabs{display:flex; justify-content:space-around; border-bottom:1px solid var(--border);}
.tabs div{padding:12px; flex:1; text-align:center; cursor:pointer;}
.tabs div.active{border-bottom:3px solid var(--brand); color:var(--brand);}
.post{background:var(--card-bg); margin:10px 0; padding:12px; border-radius:12px;}
.post-header{display:flex; align-items:center; gap:10px;}
.post-header img{width:40px; height:40px; border-radius:50%;}
.empty-state{text-align:center; padding:40px 20px; color:var(--text-secondary);}
.friend-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px;}
.friend-grid div{text-align:center; cursor:pointer;}
.friend-grid img{width:100%; border-radius:8px; aspect-ratio:1/1; object-fit:cover;}
.menu-list{display:none; position:absolute; right:0; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:5px 0; z-index:5; width:200px;}
.menu-list div{padding:10px; cursor:pointer;}
.menu-list div:hover{background:var(--hover);}
.img-viewer{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;}
.img-viewer img{max-width:90%; max-height:90%;}
.img-viewer span{position:absolute; top:20px; right:30px; font-size:40px; cursor:pointer; color:white;}
</style>
</head>
<body>
<div class="header">
<span onclick="window.location.href='home.html'">←</span>
<span>Autrobook</span>
<span onclick="window.location.href='main-settings.html'">⚙️</span>
</div>

<div id="profileContent"></div>

<div class="img-viewer" id="imgViewer">
<span onclick="document.getElementById('imgViewer').style.display='none'">×</span>
<img id="viewerImg">
</div>

<script>
const demoUsers = [
{id:1, name:"Rahim Khan", username:"rahim.khan", bio:"Web Developer | Dhaka", cover:"https://via.placeholder.com/600x200/4caf50", profilePic:"https://i.pravatar.cc/130?img=1", friends:[2,3], dob:"15 Jan 2000", dobPublic:true, locked:false, verified:true, posts:5},
{id:2, name:"Sadia Afrin", username:"sadia.a", bio:"Student | UI Designer", cover:"https://via.placeholder.com/600x200/2196f3", profilePic:"https://i.pravatar.cc/130?img=2", friends:[1,4], dob:"22 Mar 2001", dobPublic:false, locked:true, verified:true, posts:0},
{id:3, name:"Nayeem Hasan", username:"nayeem.h", bio:"Travel Lover ✈️", cover:"https://via.placeholder.com/600x200/ff9800", profilePic:"https://i.pravatar.cc/130?img=3", friends:[], dob:"10 Jul 1999", dobPublic:true, locked:false, verified:false, posts:0},
{id:4, name:"Fatema Begum", username:"fatema.b", bio:"Chef 🍛", cover:"https://via.placeholder.com/600x200/9c27b0", profilePic:"https://i.pravatar.cc/130?img=4", friends:[2], dob:"05 Dec 2002", dobPublic:false, locked:false, verified:true, posts:3},
{id:5, name:"Karim Uddin", username:"karim.u", bio:"Businessman", cover:"https://via.placeholder.com/600x200/f44336", profilePic:"https://i.pravatar.cc/130?img=5", friends:[], dob:"30 Apr 1998", dobPublic:true, locked:false, verified:false, posts:0}
];

let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {id:0, name:"You"};
let userId = new URLSearchParams(window.location.search).get('id');
let profileUser = demoUsers.find(u => u.id == userId);

if(!profileUser){
document.getElementById('profileContent').innerHTML = `<div class="empty-state"><h2>User Not Found</h2></div>`;
}

let following = JSON.parse(localStorage.getItem('following') || '[]');
let blocked = JSON.parse(localStorage.getItem('blocked') || '[]');
let isFollowing = following.includes(profileUser.id);
let isBlocked = blocked.includes(profileUser.id);

function viewImage(src){
document.getElementById('viewerImg').src = src;
document.getElementById('imgViewer').style.display = 'flex';
}

function getMutual(a,b){
let fa = demoUsers.find(u=>u.id==a)?.friends || [];
let fb = demoUsers.find(u=>u.id==b)?.friends || [];
return fa.filter(x => fb.includes(x)).length;
}

function loadProfile(){
if(isBlocked){
document.getElementById('profileContent').innerHTML = `
<div class="empty-state">
<h2>🚫 You blocked ${profileUser.name}</h2>
<p>You won't see each other's posts or profile</p>
<button class="btn btn-secondary" onclick="unblockUser()">Unblock</button>
</div>`;
return;
}

let mutualCount = getMutual(currentUser.id, profileUser.id);
let friendCount = profileUser.friends.length;
let postCount = profileUser.posts;

let html = `
<div class="cover ${profileUser.locked ? 'blur' : ''}" onclick="viewImage('${profileUser.cover}')">
<img src="${profileUser.cover}">
<div class="profile-pic-wrap">
<div class="profile-pic" onclick="event.stopPropagation(); viewImage('${profileUser.profilePic}')">
<img src="${profileUser.profilePic}">
${profileUser.verified ? '<div class="verify-badge">✓</div>' : ''}
</div>
</div>
</div>

<div class="profile-info">
<h1>${profileUser.name} ${profileUser.verified ? '<span style="color:var(--verify)">✓</span>' : ''}</h1>
<p>@${profileUser.username}</p>
<p>${profileUser.bio}</p>
${profileUser.dobPublic ? `<p>🎂 Born: ${profileUser.dob}</p>` : ''}
<p><b>${friendCount}</b> Friends · <b>${mutualCount}</b> Mutual · <b>${postCount}</b> Posts</p>

<div class="profile-buttons">
<button class="btn ${isFollowing ? 'btn-secondary' : 'btn-primary'}" onclick="toggleFollow()">${isFollowing ? 'Unfriend' : 'Follow'}</button>
<button class="btn btn-secondary">Message</button>
<div style="position:relative">
<button class="btn btn-secondary" onclick="toggleMenu('profileMenu')">⋯</button>
<div class="menu-list" id="profileMenu">
<div onclick="blockUser()">🚫 Block ${profileUser.name}</div>
<div onclick="alert('Report Sent ✅')">🚩 Report Profile</div>
</div>
</div>
</div>
</div>

<div class="tabs">
<div class="active" onclick="showTab('posts')">Posts</div>
<div onclick="showTab('about')">About</div>
<div onclick="showTab('friends')">Friends</div>
</div>

<div id="postsTab">${loadPosts()}</div>
<div id="aboutTab" style="display:none; padding:15px;">
<b>About ${profileUser.name}</b><br>
<p>${profileUser.bio}</p>
${profileUser.dobPublic ? `<p>🎂 Birthday: ${profileUser.dob}</p>` : '<p>Birthday: Only Me</p>'}
</div>
<div id="friendsTab" style="display:none;">${loadFriends()}</div>
`;

document.getElementById('profileContent').innerHTML = html;
}

function loadPosts(){
if(profileUser.posts === 0){
return `<div class="empty-state">
<p>📭 No posts yet</p>
<p>${profileUser.name} hasn't posted anything</p>
</div>`;
}

let posts = [];
for(let i=0; i<profileUser.posts; i++){
posts.push(`<div class="post"><div class="post-header"><img src="${profileUser.profilePic}"><div><b>${profileUser.name}</b><div style="font-size:12px; color:var(--text-secondary)">${i+1}d ago</div></div></div><p>Demo post #${i+1} from ${profileUser.name}</p></div>`);
}
return posts.join('');
}

function loadFriends(){
if(profileUser.friends.length === 0){
return `<div class="empty-state">
<p>👥 No friends yet</p>
<p>${profileUser.name} doesn't have any friends</p>
</div>`;
}

return `<div class="friend-grid">
${profileUser.friends.map(fid=>{
let f = demoUsers.find(u=>u.id==fid);
return `<div onclick="window.location.href='demo-profile.html?id=${f.id}'">
<img src="${f.profilePic}"><p>${f.name}</p>
</div>`
}).join('')}
</div>`;
}

function showTab(tab){
document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active'));
['postsTab','aboutTab','friendsTab'].forEach(id=>document.getElementById(id).style.display='none');
document.getElementById(tab+'Tab').style.display='block';
if(tab=='posts') document.querySelectorAll('.tabs div')[0].classList.add('active');
if(tab=='about') document.querySelectorAll('.tabs div')[1].classList.add('active');
if(tab=='friends') document.querySelectorAll('.tabs div')[2].classList.add('active');
}

function toggleFollow(){
if(isFollowing){
if(confirm('Unfriend '+profileUser.name+'?')){
following = following.filter(id => id != profileUser.id);
localStorage.setItem('following', JSON.stringify(following));
isFollowing = false;
alert('Unfriended ✅'); loadProfile();
}
} else{
following.push(profileUser.id);
localStorage.setItem('following', JSON.stringify(following));
isFollowing = true;
alert('Followed ✅'); loadProfile();
}
}

function blockUser(){
if(confirm('Block '+profileUser.name+'?')){
blocked.push(profileUser.id);
localStorage.setItem('blocked', JSON.stringify(blocked));
isBlocked = true;
alert('Blocked ✅'); loadProfile();
}
}

function unblockUser(){
blocked = blocked.filter(id => id != profileUser.id);
localStorage.setItem('blocked', JSON.stringify(blocked));
isBlocked = false;
alert('Unblocked ✅'); loadProfile();
}

function toggleMenu(id){
document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';
}

loadProfile();
</script>
</body>
</html>
