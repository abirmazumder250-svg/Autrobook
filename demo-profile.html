<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Profile - Autrobook</title> <style> 
:root{ --bg: #0a1a0f; --card-bg: #13261a; --header-bg: #13261a; --text: #e4e6eb; --text-secondary: #7a9e80; --border: #1f3d2a; --brand: #4caf50; --hover: #1f3d2a; --verify: #1877f2; --danger:#f44336; } 
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial;} 
body{background:var(--bg); color:var(--text); padding-bottom:60px; -webkit-user-select: none; user-select: none;} 
body.locked::after{content:""; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999;} 
.header{display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:var(--header-bg); position:sticky; top:0; z-index:10;} 
.header span{font-size:22px; cursor:pointer;} 
.cover{width:100%; height:200px; background:#1f3d2a; position:relative;} 
.cover img{width:100%; height:100%; object-fit:cover;} 
.cover.blur img{filter:blur(20px);} 
.profile-pic-wrap{position:absolute; bottom:-65px; left:15px;}
.profile-pic{width:130px; height:130px; border-radius:50%; border:4px solid var(--bg); position:relative; pointer-events:none;}
.profile-pic img{width:100%; height:100%; border-radius:50%; object-fit:cover;}
.profile-pic::after{content:""; position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; background:transparent; z-index:2;}
.verify-badge{position:absolute; bottom:5px; right:5px; background:var(--verify); color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:16px; border:3px solid var(--bg); z-index:3;}
.profile-info{padding:80px 15px 15px;} 
.profile-info h1{display:flex; align-items:center; gap:5px; font-size:24px;} 
.profile-info p{color:var(--text-secondary); font-size:14px;} 
.profile-buttons{display:flex; gap:10px; margin:15px 0;} 
.btn{flex:1; padding:10px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;} 
.btn-primary{background:var(--brand); color:white;} 
.btn-secondary{background:var(--card-bg); color:var(--text);} 
.btn-danger{background:var(--danger); color:white;}
.tabs{display:flex; justify-content:space-around; border-bottom:1px solid var(--border);} 
.tabs div{padding:12px; flex:1; text-align:center; cursor:pointer;} 
.tabs div.active{border-bottom:3px solid var(--brand); color:var(--brand);} 
.post{background:var(--card-bg); margin:10px 0; padding:12px; border-radius:12px;} 
.post-header{display:flex; align-items:center; gap:10px; justify-content:space-between;} 
.post-user{display:flex; align-items:center; gap:10px;} 
.post-header img{width:40px; height:40px; border-radius:50%;} 
.post-stats{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-secondary); padding:5px 0; border-bottom:1px solid var(--border);} 
.reaction-summary{display:flex; gap:3px; align-items:center;}
.post-actions{display:flex; justify-content:space-around; padding-top:8px; position:relative;} 
.post-actions button{background:none; border:none; color:var(--text-secondary); padding:8px; flex:1; cursor:pointer; border-radius:8px; position:relative;}
.react-box{display:none; position:absolute; bottom:45px; left:5px; background:var(--card-bg); padding:8px; border-radius:30px; box-shadow:0 4px 12px black; gap:8px; border:1px solid var(--border);} 
.react-box span{font-size:28px; cursor:pointer; transition:0.2s;} 
.react-box span:hover{transform:scale(1.4);}
.comment-section{display:none; padding-top:10px; border-top:1px solid var(--border);} 
.comment{display:flex; gap:8px; margin:10px 0;} 
.comment img{width:32px; height:32px; border-radius:50%;} 
.comment-box{flex:1; background:var(--bg); padding:8px 12px; border-radius:18px;} 
.comment-input{display:flex; gap:8px; margin-top:10px;} 
.comment-input input{flex:1; background:var(--bg); border:none; padding:10px; border-radius:20px; color:var(--text); outline:none;} 
.comment-input button{background:var(--brand); border:none; color:white; padding:8px 15px; border-radius:20px; cursor:pointer;} 
.friend-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px;} 
.friend-grid div{text-align:center; cursor:pointer;} 
.friend-grid img{width:100%; border-radius:8px; aspect-ratio:1/1; object-fit:cover;} 
.menu-list{display:none; position:absolute; right:0; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:5px 0; z-index:5; width:200px;} 
.menu-list div{padding:10px; cursor:pointer;} 
.menu-list div:hover{background:var(--hover);} 
</style> </head> <body> 
<div class="header"> <span onclick="window.location.href='home.html'">←</span> <span>Autrobook</span> <span onclick="window.location.href='main-settings.html'">⚙️</span> </div> 
<div id="profileContent"></div> 

<script> 
const REACTIONS = {like:'👍', love:'❤️', haha:'😆', wow:'😮', sad:'😢', angry:'😠'};
const demoUsers = [ 
{id:1, name:"Rahim Khan", username:"rahim.khan", bio:"Web Developer | Dhaka", cover:"https://via.placeholder.com/600x200/4caf50", img:1, friends:[2,3], dob:"15 Jan 2000", dobPublic:true, locked:false, verified:true}, 
{id:2, name:"Sadia Afrin", username:"sadia.a", bio:"Student | UI Designer", cover:"https://via.placeholder.com/600x200/2196f3", img:2, friends:[1,4], dob:"22 Mar 2001", dobPublic:false, locked:true, verified:true}, 
{id:3, name:"Nayeem Hasan", username:"nayeem.h", bio:"Travel Lover ✈️", cover:"https://via.placeholder.com/600x200/ff9800", img:3, friends:[1,5], dob:"10 Jul 1999", dobPublic:true, locked:false, verified:false}, 
{id:4, name:"Fatema Begum", username:"fatema.b", bio:"Chef 🍛", cover:"https://via.placeholder.com/600x200/9c27b0", img:4, friends:[2,5], dob:"05 Dec 2002", dobPublic:false, locked:false, verified:true}, 
{id:5, name:"Karim Uddin", username:"karim.u", bio:"Businessman", cover:"https://via.placeholder.com/600x200/f44336", img:5, friends:[3,4], dob:"30 Apr 1998", dobPublic:true, locked:true, verified:false} 
]; 

let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {id:0, name:"You", img:99}; 
let userId = new URLSearchParams(window.location.search).get('id'); 
let profileUser = demoUsers.find(u => u.id == userId); 
let following = JSON.parse(localStorage.getItem('following') || '[]'); 
let blocked = JSON.parse(localStorage.getItem('blocked') || '[]');
let isFollowing = following.includes(profileUser.id); 
let isBlocked = blocked.includes(profileUser.id);

if(profileUser.locked){ 
document.body.classList.add('locked'); 
document.addEventListener('contextmenu', e=>e.preventDefault()); 
} 

function getMutual(a,b){ 
let fa = demoUsers.find(u=>u.id==a)?.friends || []; 
let fb = demoUsers.find(u=>u.id==b)?.friends || []; 
return fa.filter(x => fb.includes(x)).length; 
} 

function loadProfile(){ 
if(isBlocked){
document.getElementById('profileContent').innerHTML = `
<div style="text-align:center; padding:50px;">
<h2>🚫 You blocked ${profileUser.name}</h2>
<p>You won't see each other's posts or profile</p>
<button class="btn btn-secondary" onclick="unblockUser()">Unblock</button>
</div>`;
return;
}

let mutual = getMutual(currentUser.id, profileUser.id); 
let html = ` 
<div class="cover ${profileUser.locked ? 'blur' : ''}"> 
<img src="${profileUser.cover}"> 
<div class="profile-pic-wrap">
<div class="profile-pic">
<img src="https://i.pravatar.cc/130?img=${profileUser.img}">
${profileUser.verified ? '<div class="verify-badge">✓</div>' : ''}
</div>
</div>
</div> 
<div class="profile-info"> 
<h1>${profileUser.name} ${profileUser.verified ? '<span style="color:var(--verify)">✓</span>' : ''}</h1> 
<p>@${profileUser.username}</p> 
<p>${profileUser.bio}</p> 
${profileUser.dobPublic ? `<p>🎂 Born: ${profileUser.dob}</p>` : ''} 
<p><b>${profileUser.friends.length}</b> Friends · <b>${mutual}</b> Mutual</p> 
<div class="profile-buttons"> 
<button class="btn ${isFollowing ? 'btn-secondary' : 'btn-primary'}" onclick="toggleFollow()">${isFollowing ? 'Unfriend' : 'Follow'}</button> 
<button class="btn btn-secondary">Message</button> 
<div style="position:relative">
<button class="btn btn-secondary" onclick="toggleMenu('profileMenu')">⋯</button> 
<div class="menu-list" id="profileMenu"> 
<div onclick="blockUser()">🚫 Block ${profileUser.name}</div> 
<div onclick="alert('Report Sent ✅')">🚩 Report Profile</div> 
</div> 
</div>
</div> 
</div> 
<div class="tabs"> 
<div class="active" onclick="showProfileTab('posts')">Posts</div> 
<div onclick="showProfileTab('about')">About</div> 
<div onclick="showProfileTab('friends')">Friends</div> 
</div> 
<div id="postsTab">${loadUserPosts()}</div> 
<div id="aboutTab" style="display:none; padding:15px;"> 
<b>About ${profileUser.name}</b><br> 
<p>${profileUser.bio}</p> 
${profileUser.dobPublic ? `<p>🎂 Birthday: ${profileUser.dob}</p>` : '<p>Birthday: Only Me</p>'} 
</div> 
<div id="friendsTab" style="display:none;"><div class="friend-grid"> 
${profileUser.friends.map(fid=>{let f=demoUsers.find(u=>u.id==fid); return `<div onclick="window.location.href='demo-profile.html?id=${f.id}'"><img src="https://i.pravatar.cc/100?img=${f.img}"><p>${f.name}</p></div>`}).join('')} 
</div></div> 
`; 
document.getElementById('profileContent').innerHTML = html; 
} 

function loadUserPosts(){ 
let posts = JSON.parse(localStorage.getItem('posts_demo_'+profileUser.id) || '[]'); 
if(posts.length==0){ 
posts = [ 
{text:"Today is a beautiful day ☀️", reactions:{}, comments:[]}, 
{text:"Working on new project", reactions:{}, comments:[]} 
]; 
} 
return posts.map((p,i)=>{ 
let reactionIcons = Object.values(p.reactions).slice(0,3).map(r=>REACTIONS[r]).join('');
let userReact = p.reactions[currentUser.name];
return` 
<div class="post"> 
<div class="post-header"> 
<div class="post-user"> 
<img src="https://i.pravatar.cc/40?img=${profileUser.img}"> 
<div><b>${profileUser.name} ${profileUser.verified ? '<span style="color:var(--verify)">✓</span>' : ''}</b><div style="font-size:12px; color:var(--text-secondary)">2h ago</div></div> 
</div> 
</div> 
<p>${p.text}</p> 
<div class="post-stats">
<div class="reaction-summary">${reactionIcons} <span>${Object.keys(p.reactions).length}</span></div>
<span>${p.comments.length} Comments</span>
</div> 
<div class="post-actions"> 
<button onmouseenter="showReact('reactD${i}')" onmouseleave="hideReact('reactD${i}')">
${userReact ? REACTIONS[userReact] : '👍'} Like 
<div class="react-box" id="reactD${i}"> 
${Object.keys(REACTIONS).map(k=>`<span onclick="likePost(${i},'${k}')">${REACTIONS[k]}</span>`).join('')}
</div> 
</button> 
<button onclick="toggleComment('cD${i}')">💬 Comment</button> 
<button>↗️ Share</button> 
</div> 
<div class="comment-section" id="cD${i}"> 
${p.comments.map(c=>`<div class="comment"><img src="https://i.pravatar.cc/32?img=${c.img}"><div class="comment-box"><b>${c.name}</b><br>${c.text}</div></div>`).join('')} 
<div class="comment-input"> 
<input type="text" placeholder="Write a comment..." id="inputD${i}" onkeypress="if(event.key=='Enter') addComment(${i})"> 
<button onclick="addComment(${i})">Send</button> 
<button onclick="startVoice(${i})">🎤</button> 
</div> 
</div> 
</div> 
`}).join(''); 
} 

function showProfileTab(tab){ 
document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active')); 
['postsTab','aboutTab','friendsTab'].forEach(id=>document.getElementById(id).style.display='none'); 
if(tab=='posts'){document.getElementById('postsTab').style.display='block'; document.querySelectorAll('.tabs div')[0].classList.add('active');} 
if(tab=='about'){document.getElementById('aboutTab').style.display='block'; document.querySelectorAll('.tabs div')[1].classList.add('active');} 
if(tab=='friends'){document.getElementById('friendsTab').style.display='block'; document.querySelectorAll('.tabs div')[2].classList.add('active');} 
} 

function toggleFollow(){ 
if(isFollowing){
if(confirm('Unfriend '+profileUser.name+'?')){
following = following.filter(id => id != profileUser.id);
localStorage.setItem('following', JSON.stringify(following));
isFollowing = false;
alert('Unfriended ✅');
loadProfile();
}
} 
else{
following.push(profileUser.id);
localStorage.setItem('following', JSON.stringify(following));
isFollowing = true;
alert('Followed ✅');
loadProfile();
}
} 

function blockUser(){
if(confirm('Block '+profileUser.name+'? They will not see your profile or posts')){
blocked.push(profileUser.id);
localStorage.setItem('blocked', JSON.stringify(blocked));
isBlocked = true;
alert('Blocked ✅');
loadProfile();
}
}

function unblockUser(){
blocked = blocked.filter(id => id != profileUser.id);
localStorage.setItem('blocked', JSON.stringify(blocked));
isBlocked = false;
alert('Unblocked ✅');
loadProfile();
}

function likePost(i,reaction){ 
let posts = JSON.parse(localStorage.getItem('posts_demo_'+profileUser.id) || '[]'); 
let prev = posts[i].reactions[currentUser.name];
if(prev == reaction){ delete posts[i].reactions[currentUser.name]; } 
else{ posts[i].reactions[currentUser.name] = reaction; }
localStorage.setItem('posts_demo_'+profileUser.id, JSON.stringify(posts)); 
loadProfile(); 
} 

function toggleComment(id){document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';} 
function showReact(id){document.getElementById(id).style.display='flex';} 
function hideReact(id){setTimeout(()=>{if(!document.getElementById(id).matches(':hover')) document.getElementById(id).style.display='none';},300);} 

function addComment(i){ 
let val = document.getElementById(`inputD${i}`).value; 
if(val){ 
let posts = JSON.parse(localStorage.getItem('posts_demo_'+profileUser.id) || '[]'); 
posts[i].comments.push({name:currentUser.name, text:val, img:currentUser.img}); 
localStorage.setItem('posts_demo_'+profileUser.id, JSON.stringify(posts)); 
document.getElementById(`inputD${i}`).value = '';
loadProfile(); 
} 
} 

function startVoice(i){ 
if(!('webkitSpeechRecognition' in window)){ alert('Voice not supported'); return; }
let recognition = new webkitSpeechRecognition();
recognition.lang = 'en-US';
recognition.onresult = function(e){
document.getElementById(`inputD${i}`).value = e.results[0][0].transcript;
addComment(i);
}
recognition.start();
} 

function toggleMenu(id){document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';} 
loadProfile(); 
</script> 
</body> 
</html>
