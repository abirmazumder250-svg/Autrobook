<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autro AI Assistant — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-page: #f5f5f5;
      --bg-card: #ffffff;
      --bg-soft: #efefef;
      --bg-user: #000000;
      --bg-ai: #f0f0f0;
      --text-main: #000000;
      --text-muted: #404040;
      --text-user: #ffffff;
      --text-ai: #000000;
      --border-color: #d4d4d4;
      --btn-bg: #000000;
      --btn-text: #ffffff;
      --accent-green: #059669;
      --shadow-soft: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #000000;
        --bg-card: #111111;
        --bg-soft: #1c1c1c;
        --bg-user: #ffffff;
        --bg-ai: #1a1a1a;
        --text-main: #ffffff;
        --text-muted: #d4d4d4;
        --text-user: #000000;
        --text-ai: #ffffff;
        --border-color: #2e2e2e;
        --btn-bg: #ffffff;
        --btn-text: #000000;
        --accent-green: #10b981;
        --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.65);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .back-btn,
    .clear-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-soft);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .back-btn:active,
    .clear-btn:active,
    .send-btn:active {
      transform: scale(0.96);
    }

    .assistant-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .au-logo-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #065f46, #059669);
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0.5px;
      overflow: hidden;
      flex-shrink: 0;
      user-select: none;
    }

    .au-logo-badge.header-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 13px;
      border: 1px solid var(--border-color);
    }

    .au-logo-badge.empty-badge {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      font-size: 20px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
    }

    .au-logo-badge img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }

    .au-logo-badge .au-text {
      position: relative;
      z-index: 1;
    }

    .assistant-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .assistant-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 440px;
      padding: 24px 16px;
    }

    .empty-state h2 {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      gap: 4px;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.58;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow-soft);
    }

    .message-row.user .message-bubble {
      background-color: var(--bg-user);
      color: var(--text-user);
      border-bottom-right-radius: 5px;
    }

    .message-row.assistant .message-bubble {
      background-color: var(--bg-ai);
      color: var(--text-ai);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 5px;
    }

    .message-meta {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 2px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-ai);
      opacity: 0.4;
      animation: bounceDot 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounceDot {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .composer-wrap {
      padding: 12px 14px;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-color);
    }

    .composer-form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .prompt-input {
      flex: 1;
      min-height: 44px;
      max-height: 130px;
      padding: 11px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-soft);
      color: var(--text-main);
      font-size: 14.5px;
      line-height: 1.4;
      resize: none;
      outline: none;
    }

    .prompt-input:focus {
      border-color: var(--text-main);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app-shell {
        border-left: none;
        border-right: none;
      }

      .message-row {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <a href="javascript:history.back()" class="back-btn" aria-label="Back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="assistant-title-wrap">
          <div class="au-logo-badge header-badge" aria-label="Autro AI Logo">
            <span class="au-text">AU</span>
            <img data-au-img alt="Autro AI" />
          </div>
          <div>
            <div class="assistant-title">Autro AI Assistant</div>
            <div class="assistant-sub" id="assistantSubtitle">Instant replies in all languages</div>
          </div>
        </div>
      </div>

      <button type="button" id="clearChatBtn" class="clear-btn" title="Clear chat">
        <i class="fa-solid fa-rotate-left"></i>
        <span>Clear</span>
      </button>
    </header>

    <main id="chatContainer" class="chat-container">
      <div id="emptyState" class="empty-state">
        <div class="au-logo-badge empty-badge" aria-label="Autro AI Assistant">
          <span class="au-text">AU</span>
          <img data-au-img alt="Autro AI Assistant" />
        </div>
        <h2>Autro AI Assistant</h2>
        <p>Ask anything in any language — Bengali, English, Hindi, Arabic, Spanish, or more.</p>
      </div>
    </main>

    <div class="composer-wrap">
      <form id="chatForm" class="composer-form">
        <textarea
          id="promptInput"
          class="prompt-input"
          rows="1"
          placeholder="Message Autro AI in any language..."
          required
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const API_ENDPOINT = '/api/autro-ai';
      const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

      // Load au.png cleanly with automatic fallback to AU badge
      const auCandidates = ['au.png', './au.png', '/au.png', 'assets/au.png', 'images/au.png'];
      document.querySelectorAll('img[data-au-img]').forEach((imgEl) => {
        let idx = 0;
        function tryNextSrc() {
          if (idx >= auCandidates.length) {
            imgEl.style.display = 'none';
            return;
          }
          imgEl.src = auCandidates[idx++];
        }
        imgEl.addEventListener('error', tryNextSrc);
        tryNextSrc();
      });

      let supabaseClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (_) {}

      const chatContainer = document.getElementById('chatContainer');
      const emptyState = document.getElementById('emptyState');
      const chatForm = document.getElementById('chatForm');
      const promptInput = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const clearChatBtn = document.getElementById('clearChatBtn');
      const assistantSubtitle = document.getElementById('assistantSubtitle');

      const conversationHistory = [];
      let currentUserProfile = {
        userId: '',
        fullName: '',
        username: '',
        email: '',
        bio: '',
        location: '',
        education: ''
      };

      function readCachedUserProfile() {
        const profile = {
          userId: '',
          fullName: '',
          username: '',
          email: '',
          bio: '',
          location: '',
          education: ''
        };
        try {
          const pRaw = localStorage.getItem('autro_account_profile') || localStorage.getItem('autrobook_user');
          if (pRaw) {
            const parsed = JSON.parse(pRaw);
            profile.userId = (parsed.id || parsed.user_id || '').trim();
            profile.fullName = (parsed.full_name || parsed.name || '').trim();
            profile.username = (parsed.username || '').trim();
            profile.email = (parsed.email || '').trim();
            profile.bio = (parsed.bio || parsed.about || '').trim();
            profile.location = (parsed.location || parsed.city || parsed.lives_in || '').trim();
            profile.education = (parsed.education || parsed.school || parsed.university || '').trim();
          }
          if (!profile.fullName) {
            profile.fullName = (localStorage.getItem('autro_profile_name') || '').trim();
          }
        } catch (_) {}
        return profile;
      }

      async function resolveCurrentUserProfile() {
        const cached = readCachedUserProfile();
        currentUserProfile = { ...currentUserProfile, ...cached };

        if (!supabaseClient) return currentUserProfile;

        try {
          let userId = currentUserProfile.userId || null;
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session && session.user) {
            userId = session.user.id;
            currentUserProfile.userId = userId;
            currentUserProfile.fullName =
              session.user.user_metadata?.full_name ||
              session.user.user_metadata?.name ||
              currentUserProfile.fullName;
            currentUserProfile.email = session.user.email || currentUserProfile.email;
          }

          if (userId) {
            const { data: profileRow } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('id', userId)
              .maybeSingle();

            if (profileRow) {
              if (profileRow.full_name) currentUserProfile.fullName = String(profileRow.full_name).trim();
              if (profileRow.username) currentUserProfile.username = String(profileRow.username).trim();
              if (profileRow.email) currentUserProfile.email = String(profileRow.email).trim();
              if (profileRow.bio) currentUserProfile.bio = String(profileRow.bio).trim();
              if (profileRow.location || profileRow.city || profileRow.lives_in) {
                currentUserProfile.location = String(profileRow.location || profileRow.city || profileRow.lives_in).trim();
              }
              if (profileRow.education || profileRow.university || profileRow.school) {
                currentUserProfile.education = String(profileRow.education || profileRow.university || profileRow.school).trim();
              }
            }
          }

          const clientKey = localStorage.getItem('autro_account_client_id');
          let settingsRow = null;

          if (userId) {
            const { data } = await supabaseClient
              .from('account_settings')
              .select('*')
              .eq('user_id', userId)
              .order('updated_at', { ascending: false })
              .limit(1)
              .maybeSingle();
            settingsRow = data;
          }

          if (!settingsRow && clientKey) {
            const { data } = await supabaseClient
              .from('account_settings')
              .select('*')
              .eq('account_key', clientKey)
              .order('updated_at', { ascending: false })
              .limit(1)
              .maybeSingle();
            settingsRow = data;
          }

          if (!settingsRow && !userId) {
            const { data: latestRows } = await supabaseClient
              .from('account_settings')
              .select('*')
              .order('updated_at', { ascending: false })
              .limit(1);
            if (Array.isArray(latestRows) && latestRows.length > 0) {
              settingsRow = latestRows[0];
            }
          }

          if (settingsRow) {
            if (settingsRow.full_name) currentUserProfile.fullName = String(settingsRow.full_name).trim();
            if (settingsRow.bio) currentUserProfile.bio = String(settingsRow.bio).trim();
            if (settingsRow.location || settingsRow.city || settingsRow.lives_in) {
              currentUserProfile.location = String(settingsRow.location || settingsRow.city || settingsRow.lives_in).trim();
            }
            if (settingsRow.education || settingsRow.university || settingsRow.school) {
              currentUserProfile.education = String(settingsRow.education || settingsRow.university || settingsRow.school).trim();
            }
          }

          if (assistantSubtitle && currentUserProfile.fullName) {
            assistantSubtitle.textContent = `Profile: ${currentUserProfile.fullName}`;
          }
        } catch (_) {}

        return currentUserProfile;
      }

      function formatTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function autoResizeTextarea() {
        promptInput.style.height = 'auto';
        promptInput.style.height = Math.min(promptInput.scrollHeight, 130) + 'px';
      }

      function appendMessage(role, text, metaLabel) {
        if (emptyState) {
          emptyState.style.display = 'none';
        }

        const row = document.createElement('div');
        row.className = `message-row ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = metaLabel || formatTime();

        row.appendChild(bubble);
        row.appendChild(meta);
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return { row, bubble, meta };
      }

      function appendTypingIndicator() {
        if (emptyState) {
          emptyState.style.display = 'none';
        }

        const row = document.createElement('div');
        row.className = 'message-row assistant';
        row.id = 'typingIndicatorRow';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = `
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        `;

        row.appendChild(bubble);
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return row;
      }

      function removeTypingIndicator() {
        const el = document.getElementById('typingIndicatorRow');
        if (el) el.remove();
      }

      async function sendMessage(userText) {
        const trimmed = userText.trim();
        if (!trimmed) return;

        appendMessage('user', trimmed, formatTime());
        conversationHistory.push({ role: 'user', text: trimmed });

        promptInput.value = '';
        autoResizeTextarea();
        sendBtn.disabled = true;

        const startTime = performance.now();
        appendTypingIndicator();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 9000);

        try {
          const userProfile = await resolveCurrentUserProfile();

          const response = await fetch(API_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              message: trimmed,
              profileName: userProfile.fullName,
              userProfile,
              history: conversationHistory.slice(-4)
            })
          });

          clearTimeout(timeoutId);
          const data = await response.json();
          removeTypingIndicator();

          const elapsedSec = ((performance.now() - startTime) / 1000).toFixed(2);

          if (!response.ok || !data.reply) {
            appendMessage(
              'assistant',
              data.error || 'Could not get a response right now.',
              `${elapsedSec}s`
            );
          } else {
            conversationHistory.push({ role: 'assistant', text: data.reply });
            appendMessage('assistant', data.reply, `Autro AI • ${elapsedSec}s`);
          }
        } catch (err) {
          clearTimeout(timeoutId);
          removeTypingIndicator();
          const msg = err.name === 'AbortError'
            ? 'Response took too long. Please try again.'
            : 'Network error while connecting to Autro AI.';
          appendMessage('assistant', msg, formatTime());
        } finally {
          sendBtn.disabled = false;
          promptInput.focus();
        }
      }

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        sendMessage(promptInput.value);
      });

      promptInput.addEventListener('input', autoResizeTextarea);

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(promptInput.value);
        }
      });

      clearChatBtn.addEventListener('click', () => {
        conversationHistory.length = 0;
        chatContainer.innerHTML = '';
        if (emptyState) {
          emptyState.style.display = 'block';
          chatContainer.appendChild(emptyState);
        }
      });

      resolveCurrentUserProfile();
    })();
  </script>
</body>
  </html>
