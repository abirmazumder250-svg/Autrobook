<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Archive - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);} 
.header{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);} 
.header b{flex:1;text-align:center;font-size:18px;} 
.btn-group{display:flex;gap:8px;padding:16px;} 
.btn{background:#3a3b3c;padding:8px 16px;border-radius:20px;border:none;color:var(--text);} 
.empty{text-align:center;padding:60px 20px;color:#aaa;} 
.card{background:var(--card);margin:16px;padding:16px;border-radius:8px;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Archive</b>
</div>

<div class="btn-group">
<button class="btn">📖 Story archive</button>
<button class="btn" onclick="alert('Trash')">🗑️ Trash</button>
</div>

<div class="card">
<b>Welcome to Archive</b>
<p style="color:#aaa;margin-top:8px">Moving posts to archive is a way for you to save things you no longer want to show on your profile. Only you can see them.</p>
</div>

<div class="empty">No items</div>

</body> </html>
