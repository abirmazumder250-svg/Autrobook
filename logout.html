<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logging out... - Autrobook</title>
<style>
:root{--bg:#0a1a0f;--brand:#4caf50;--text:#e4e6eb;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; height:100vh; text-align:center;}
.box h1{color:var(--brand); margin-bottom:10px;}
.loader{border:4px solid #1f3d2a; border-top:4px solid var(--brand); border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto;}
@keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}
</style>
</head>
<body>
<div class="box">
<h1>Autrobook</h1>
<div class="loader"></div>
<p>Logging out...</p>
</div>

<script>
// 1. Clear all user data from localStorage
localStorage.removeItem('autrobook_user');
localStorage.removeItem('autrobook_token');

// 2. Wait 1 second then redirect to login
setTimeout(() => {
  window.location.href = 'login.html';
}, 1000);
</script>
</body>
</html>
