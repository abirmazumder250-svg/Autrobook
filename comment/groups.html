<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Groups - Autrobook</title>
<style>
:root{--bg:#0a1a0a;--card:#122212;--text:#e4e6eb;--text2:#8aa38a;--border:#1f3a1f;--brand:#2e7d32;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial;}
body{background:var(--bg);color:var(--text);}
.header{position:sticky; top:0; background:var(--card); padding:15px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:15px;}
.header a{color:var(--brand); text-decoration:none; font-size:22px; font-weight:bold;}
.header h2{font-size:18px;}
.container{max-width:600px; margin:0 auto;}
.group{display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--border); gap:12px;}
.group-icon{width:55px; height:55px; background:linear-gradient(135deg,#2e7d32,#1b5e20); border-radius:12px; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:20px;}
.group-info{flex:1;}
.group-name{font-weight:700; font-size:15px; margin-bottom:3px;}
.group-members{color:var(--text2); font-size:13px;}
.btn{background:var(--brand); color:white; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px;}
.btn.joined{background:#1f3a1f; color:var(--text2);}
</style>
</head>
<body>
<div class="header">
<a href="../index.html">←</a>
<h2>Groups</h2>
</div>

<div class="container">
<div class="group">
<div class="group-icon">G</div>
<div class="group-info">
<div class="group-name">Web Developers BD</div>
<div class="group-members">12.5K members</div>
</div>
<button class="btn">Join</button>
</div>

<div class="group">
<div class="group-icon" style="background:linear-gradient(135deg,#1b5e20,#0a1a0a);">D</div>
<div class="group-info">
<div class="group-name">Dhaka Creators</div>
<div class="group-members">8.2K members</div>
</div>
<button class="btn joined">Joined</button>
</div>

<div class="group">
<div class="group-icon">T</div>
<div class="group-info">
<div class="group-name">Tech Talks</div>
<div class="group-members">5.1K members</div>
</div>
<button class="btn">Join</button>
</div>
</div>
</body>
</html>
