<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Friends - Autrobook</title>
<style>
:root{--bg:#0a1a0a;--card:#122212;--text:#e4e6eb;--text2:#8aa38a;--border:#1f3a1f;--brand:#2e7d32;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial;}
body{background:var(--bg);color:var(--text);}
.header{position:sticky; top:0; background:var(--card); padding:15px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:15px;}
.header a{color:var(--brand); text-decoration:none; font-size:20px; font-weight:bold;}
.header h2{font-size:18px;}
.tabs{display:flex; background:var(--card); border-bottom:1px solid var(--border);}
.tab{flex:1; padding:14px; text-align:center; background:none; border:none; color:var(--text2); font-weight:600; cursor:pointer;}
.tab.active{color:var(--brand); border-bottom:2px solid var(--brand);}
.container{max-width:600px; margin:0 auto;}
.friend{display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--border); gap:12px;}
.avatar{width:50px; height:50px; background:linear-gradient(135deg,#2e7d32,#1b5e20); border-radius:50%; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:18px;}
.friend-info{flex:1;}
.friend-name{font-weight:700; font-size:15px; margin-bottom:3px;}
.friend-status{color:var(--text2); font-size:13px;}
.btn{background:var(--brand); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px;}
.btn.secondary{background:#1f3a1f; color:var(--text);}
</style>
</head>
<body>
<div class="header">
<a href="index.html">←</a>
<h2>Friends</h2>
</div>

<div class="tabs">
<button class="tab active">All Friends</button>
<button class="tab">Requests</button>
<button class="tab">Suggestions</button>
</div>

<div class="container">
<div class="friend">
<div class="avatar">R</div>
<div class="friend-info">
<div class="friend-name">Rahim Khan</div>
<div class="friend-status">Active now</div>
</div>
<button class="btn secondary">Message</button>
</div>

<div class="friend">
<div class="avatar" style="background:linear-gradient(135deg,#1b5e20,#0a1a0a);">S</div>
<div class="friend-info">
<div class="friend-name">Sadia Ahmed</div>
<div class="friend-status">2h ago</div>
</div>
<button class="btn secondary">Message</button>
</div>

<div class="friend">
<div class="avatar">N</div>
<div class="friend-info">
<div class="friend-name">Nayeem Hasan</div>
<div class="friend-status">Yesterday</div>
</div>
<button class="btn">Add Friend</button>
</div>
</div>
</body>
</html>
