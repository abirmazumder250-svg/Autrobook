<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Comments - Autrobook</title>
<style>
:root{--bg:#0a1a0a;--card:#122212;--text:#e4e6eb;--text2:#8aa38a;--border:#1f3a1f;--brand:#2e7d32;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial;}
body{background:var(--bg);color:var(--text);padding-bottom:80px;}
.header{position:sticky; top:0; background:var(--card); padding:15px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:15px; z-index:10;}
.header a{color:var(--brand); text-decoration:none; font-size:22px; font-weight:bold;}
.header h2{font-size:18px;}
.container{max-width:600px; margin:0 auto; padding:20px;}
.comment-box{display:flex; gap:10px; margin-bottom:20px; position:sticky; bottom:0; background:var(--bg); padding:10px 0;}
.avatar{width:40px; height:40px; background:var(--brand); border-radius:50%; display:flex; justify-content:center; align-items:center; font-weight:bold; flex-shrink:0;}
.comment-input{flex:1; background:#0f1f0f; border:1.5px solid var(--border); border-radius:20px; padding:12px 16px; color:var(--text); outline:none;}
.comment-input:focus{border-color:var(--brand);}
.send-btn{background:var(--brand); color:white; border:none; padding:10px 16px; border-radius:20px; font-weight:700; cursor:pointer;}
.comment{padding:15px 0; border-bottom:1px solid var(--border);}
.comment-header{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.comment-user{font-weight:700; font-size:14px;}
.comment-time{color:var(--text2); font-size:12px;}
.comment-text{font-size:14px; line-height:1.5; margin-left:50px;}
</style>
</head>
<body>
<div class="header">
<a href="../index.html">←</a>
<h2>Comments</h2>
</div>

<div class="container">
<div class="comment-box">
<div class="avatar">A</div>
<input type="text" class="comment-input" id="commentInput" placeholder="Write a comment...">
<button class="send-btn" onclick="addComment()">Post</button>
</div>

<div id="commentsList">
<div class="comment">
<div class="comment-header">
<div class="avatar" style="width:35px; height:35px; font-size:14px;">R</div>
<div>
<div class="comment-user">Rahim Khan</div>
<div class="comment-time">2h ago</div>
</div>
</div>
<div class="comment-text">This is an amazing post bro! ❤️</div>
</div>

<div class="comment">
<div class="comment-header">
<div class="avatar" style="width:35px; height:35px; font-size:14px; background:#1b5e20;">S</div>
<div>
<div class="comment-user">Sadia Ahmed</div>
<div class="comment-time">5h ago</div>
</div>
</div>
<div class="comment-text">Nice work 👏 Keep it up</div>
</div>
</div>
</div>

<script>
function addComment(){
let input = document.getElementById('commentInput');
let text = input.value.trim();
if(text === "") return;

let commentsList = document.getElementById('commentsList');
let newComment = `
<div class="comment">
<div class="comment-header">
<div class="avatar" style="width:35px; height:35px; font-size:14px;">A</div>
<div>
<div class="comment-user">You</div>
<div class="comment-time">Just now</div>
</div>
</div>
<div class="comment-text">${text}</div>
</div>
`;
commentsList.innerHTML = newComment + commentsList.innerHTML;
input.value = "";
}
</script>
</body>
</html>
