<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pages - Autrobook</title>
<style>
:root{--bg:#0a1a0a;--card:#122212;--text:#e4e6eb;--text2:#8aa38a;--border:#1f3a1f;--brand:#2e7d32;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial;}
body{background:var(--bg);color:var(--text);}
.header{position:sticky; top:0; background:var(--card); padding:15px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:15px;}
.header a{color:var(--brand); text-decoration:none; font-size:22px; font-weight:bold;}
.header h2{font-size:18px;}
.container{max-width:600px; margin:0 auto;}
.page{display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--border); gap:12px;}
.page-logo{width:55px; height:55px; background:linear-gradient(135deg,#2e7d32,#1b5e20); border-radius:50%; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:20px;}
.page-info{flex:1;}
.page-name{font-weight:700; font-size:15px; margin-bottom:3px;}
.page-likes{color:var(--text2); font-size:13px;}
.btn{background:var(--brand); color:white; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px;}
.btn.liked{background:#1f3a1f; color:var(--text2);}
</style>
</head>
<body>
<div class="header">
<a href="../index.html">←</a>
<h2>Pages</h2>
</div>

<div class="container">
<div class="page">
<div class="page-logo">A</div>
<div class="page-info">
<div class="page-name">Autrobook Official</div>
<div class="page-likes">25K likes</div>
</div>
<button class="btn liked">Liked</button>
</div>

<div class="page">
<div class="page-logo" style="background:linear-gradient(135deg,#1b5e20,#0a1a0a);">C</div>
<div class="page-info">
<div class="page-name">Code With Abir</div>
<div class="page-likes">10.3K likes</div>
</div>
<button class="btn">Like</button>
</div>

<div class="page">
<div class="page-logo">N</div>
<div class="page-info">
<div class="page-name">News 24/7</div>
<div class="page-likes">42K likes</div>
</div>
<button class="btn">Like</button>
</div>
</div>
</body>
</html>
