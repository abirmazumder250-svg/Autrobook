<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Autrobook - Sign Up</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{ --brand:#0f5132; --brand-light:#198754; --bg:#1c1c1e; --card:#2c2c2e; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);min-height:100vh;color:white}
.top{padding:15px;display:flex;justify-content:space-between;align-items:center}
.back{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.translator-box{background:var(--card);padding:5px 10px;border-radius:10px;border:1px solid #555}
.logo{text-align:center;margin-bottom:30px}
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--brand);box-shadow:0 4px 15px rgba(15,81,50,0.4)}
.wrap{padding:0 20px 40px;max-width:450px;margin:0 auto}
h2{font-size:22px;margin-bottom:6px}
p.sub{color:#aaa;font-size:14px;margin-bottom:25px}
label{font-size:14px;color:#aaa;margin-bottom:6px;display:block}
input{width:100%;padding:16px;border-radius:15px;border:1px solid #555;background:transparent;color:white;font-size:16px;margin-bottom:15px;outline:none}
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.2)}
.pass-wrap{position:relative}
.eye{position:absolute;right:18px;top:16px;cursor:pointer;font-size:18px}
.camera-box{border:2px dashed var(--brand-light);border-radius:15px;padding:15px;text-align:center;margin-bottom:15px;background:var(--card)}
.camera-box video{width:100%;border-radius:10px;display:none;margin-bottom:10px}
.camera-box img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:10px auto;display:none;border:2px solid var(--brand-light)}
.camera-btn{padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-weight:bold;cursor:pointer;width:100%}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.6;background:#555}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px}
.msg.error{color:#ff8a8a}.msg.success{color:#8affa0}
.progress{display:flex;gap:6px;max-width:450px;margin:0 auto 25px;padding:0 20px}
.progress div{flex:1;height:5px;border-radius:10px;background:#333}
.progress div.active{background:var(--brand-light)}
.g-recaptcha{margin:15px 0;display:flex;justify-content:center;transform:scale(.95)}
.checkbox-row{display:flex;gap:8px;align-items:center;font-size:13px;color:#aaa;margin:10px 0}
.checkbox-row input{width:auto;margin:0}
.strength{font-size:12px;margin:-10px 0 12px;color:#aaa}
/* Google Translate Customization for Dark Theme */
.goog-te-combo {background: var(--card) !important; color: white !important; padding: 6px; border-radius: 8px; border: 1px solid #555; font-size: 14px; outline: none;}
.goog-logo-link, .goog-te-gadget span {display: none !important;}
.goog-te-gadget {color: transparent !important;}
body {top: 0 !important;}
</style>
</head>
<body>

<div class="top">
  <div class="back" onclick="location.href='signup-name.html'">←</div>
  <!-- Global Language Translator Widget -->
  <div class="translator-box" id="google_translate_element"></div>
</div>

<div class="logo"><img src="logo.png" alt="Autrobook" onerror="this.style.display='none'"></div>
<div class="progress"><div class="active"></div><div class="active"></div><div></div></div>
<div class="wrap">
<h2>Create Account</h2>
<p class="sub">Fill in your details to continue</p>
<p id="namePreview" style="color:#4CAF50;font-size:14px;margin-bottom:12px"></p>

<label>Date of Birth</label>
<input type="date" id="dob">

<label>Email</label>
<input type="email" id="email" placeholder="Enter your email" autocomplete="email">

<label>Password</label>
<div class="pass-wrap">
<input type="password" id="password" placeholder="Enter password (min 6 chars)" autocomplete="new-password" oninput="checkStrength()">
<span class="eye" onclick="togglePass()">👁️</span>
</div>
<div class="strength" id="strengthText"></div>

<label>Face Verification</label>
<div class="camera-box">
<video id="video" autoplay playsinline></video>
<img id="photo" />
<button class="camera-btn" id="cameraBtn" onclick="startCamera()">📷 Take Live Selfie</button>
<p style="color:#aaa;font-size:12px;margin-top:8px">Selfie is only for verification, no one will see it</p>
</div>

<!-- reCAPTCHA with your provided Site Key -->
<div class="g-recaptcha" data-sitekey="6LeifXoAAAAAAPOvZ1H6sH9T7UfUH8lpyhWakTze" data-callback="enableBtn" data-expired-callback="disableBtn"></div>
<p style="font-size:12px;color:#aaa;text-align:center">If reCAPTCHA doesn't load, tick below</p>
<div class="checkbox-row"><input type="checkbox" id="humanCheck" onchange="manualCaptcha()"> <span>I'm not a robot - Verify manually</span></div>

<div class="msg" id="msg"></div>
<button class="btn" id="nextBtn" onclick="goNext()" disabled>Sign Up</button>
<p style="text-align:center;margin-top:12px;font-size:13px;color:#aaa">Already have an account? <a href="index.html" style="color:#4CAF50;font-weight:bold">Login</a></p>
</div>

<!-- Google Translate Script -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,bn,hi,ar,es,fr,de,zh-CN,ja,ru,pt,it', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI",
authDomain: "autrobook-ad3d5.firebaseapp.com",
projectId: "autrobook-ad3d5",
storageBucket: "autrobook-ad3d5.firebasestorage.app",
messagingSenderId: "554222945815",
appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52",
measurementId: "G-Z8QM0NVR6W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let selfieData = ""; let stream = null;

document.addEventListener('DOMContentLoaded', () => {
  var nm = localStorage.getItem('signup_name') || '';
  if(nm) document.getElementById('namePreview').innerText = '👤 ' + nm;
});

window.enableBtn = () => { document.getElementById('nextBtn').disabled = false; }
window.disableBtn = () => { if(!document.getElementById('humanCheck').checked) document.getElementById('nextBtn').disabled = true; }
window.manualCaptcha = () => { document.getElementById('nextBtn').disabled = !document.getElementById('humanCheck').checked; }
window.togglePass = () => { const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password'; }

window.checkStrength = () => {
  const v = document.getElementById('password').value;
  const el = document.getElementById('strengthText');
  if(!v){ el.innerText=''; return; }
  if(v.length < 6) el.innerText = '❌ Password must be at least 6 characters';
  else if(v.length < 10) el.innerText = '🟡 Medium password';
  else el.innerText = '🟢 Strong password ✅';
}

function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;}

window.startCamera = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    const video = document.getElementById('video');
    video.srcObject = stream; video.style.display = 'block';
    document.getElementById('cameraBtn').innerText = '📸 Capture Photo';
    document.getElementById('cameraBtn').onclick = capturePhoto;
  }catch(e){ showMsg('Camera permission denied - Allow camera from browser settings','error'); }
}

function capturePhoto(){
  const video = document.getElementById('video');
  if(!video.videoWidth) return showMsg('Wait for camera to load...','error');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('photo').src = selfieData;
  document.getElementById('photo').style.display = 'block';
  video.style.display = 'none';
  if(stream){ stream.getTracks().forEach(track => track.stop()); }
  document.getElementById('cameraBtn').innerText = '🔄 Retake';
  document.getElementById('cameraBtn').onclick = window.startCamera;
  showMsg('Selfie captured!','success');
}
window.capturePhoto = capturePhoto;

window.goNext = async () => {
  const fn = localStorage.getItem('signup_firstName') || '';
  const sn = localStorage.getItem('signup_surname') || '';
  const dob = document.getElementById('dob').value;
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  let captcha = '';
  try{ captcha = window.grecaptcha ? grecaptcha.getResponse() : ''; }catch(e){ captcha=''; }
  const humanChecked = document.getElementById('humanCheck').checked;

  if(!dob) return showMsg('Please select your Date of Birth','error');
  const birth = new Date(dob); const today = new Date(); let age = today.getFullYear() - birth.getFullYear(); const m = today.getMonth() - birth.getMonth(); if(m<0 || (m===0 && today.getDate() < birth.getDate())) age--;
  if(age < 13) return showMsg('You must be at least 13 years old','error');
  if(!email) return showMsg('Please enter your email','error');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('Please enter a valid email','error');
  if(!pass || pass.length<6) return showMsg('Password must be at least 6 characters','error');
  if(!selfieData) return showMsg('Please take a live selfie','error');
  if(captcha.length == 0 && !humanChecked) return showMsg('Please verify you are not a robot','error');

  const btn=document.getElementById('nextBtn'); btn.disabled=true; btn.textContent='Creating...';
  const localUser = { name: (fn+' '+sn).trim(), firstName: fn, surname: sn, dob: dob, email: email, pass: pass, selfie: selfieData, time: Date.now() };
  try{
    const userCred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "users", userCred.user.uid), {
      firstName: fn, surname: sn, dob: dob, email: email, selfie: selfieData, createdAt: new Date()
    });
    var users=JSON.parse(localStorage.getItem('ab_users')||'[]');
    users.push(localUser); localStorage.setItem('ab_users',JSON.stringify(users));
    localStorage.setItem('autrobook_user',JSON.stringify(localUser));
    localStorage.setItem('ab_logged_in','1');
    localStorage.setItem('signup_step','done');
    showMsg('✅ Account Created! Redirecting...','success');
    setTimeout(()=>location.href='home.html',1200);
  } catch(error){
    if(error.code == 'auth/email-already-in-use'){ showMsg('This email already exists - Try Login', 'error'); btn.disabled=false; btn.textContent='Sign Up'; return; }
    if(error.code == 'auth/network-request-failed' || error.code == 'auth/invalid-api-key'){
      var users2=JSON.parse(localStorage.getItem('ab_users')||'[]');
      if(!users2.find(u=>u.email===email)) users2.push(localUser);
      localStorage.setItem('ab_users',JSON.stringify(users2));
      localStorage.setItem('autrobook_user',JSON.stringify(localUser));
      localStorage.setItem('ab_logged_in','1');
      showMsg('Network issue - Local Account Created ✅','success');
      setTimeout(()=>location.href='home.html',1200);
      return;
    }
    showMsg(error.message, 'error');
    btn.disabled=false; btn.textContent='Sign Up';
  }
}
</script>
</body>
</html>
