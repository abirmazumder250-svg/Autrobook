<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autrobook Signup</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --bg: #f4f4f4;
      --box: white;
      --text: #333;
      --border: #ddd;
      --btn: #007bff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --box: #1e1e1e;
        --text: #eee;
        --border: #444;
        --btn: #3390ff;
      }
    }
    body { 
      font-family: Arial, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      background: var(--bg); 
      margin: 0; 
      color: var(--text);
    }
    .box { 
      background: var(--box); 
      padding: 30px; 
      border-radius: 10px; 
      box-shadow: 0 0 15px rgba(0,0,0,0.2); 
      width: 320px; 
      text-align: center; 
    }
    input, button { 
      width: 90%; 
      padding: 12px; 
      margin: 10px 0; 
      border-radius: 5px; 
      border: 1px solid var(--border); 
      font-size: 16px; 
      background: var(--bg);
      color: var(--text);
    }
    button { 
      background: var(--btn); 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold;
    }
    button:disabled { background: #666; }
    h2 { color: var(--text); }
  </style>
</head>
<body>
  <div class="box">
    <h2>Create Account</h2>
    
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <button id="sendBtn" onclick="sendOTP()">Send OTP</button>
    
    <div id="otpBox" style="display:none;">
      <input type="text" id="otpInput" placeholder="Enter OTP">
      <button onclick="verifyOTP()">Verify & Continue</button>
    </div>
    <p id="msg"></p>
  </div>

<script>
  // 1. EmailJS Init
  (function(){
    emailjs.init("PoawEFe-OI5d9DyLb"); // Public Key
  })();

  let generatedOTP = "";

  // 2. Send OTP
  function sendOTP() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const msg = document.getElementById("msg");

    if(!name || !email){
      msg.innerText = "Please enter Name and Email";
      msg.style.color = "red";
      return;
    }

    // Generate 4 digit OTP
    generatedOTP = Math.floor(1000 + Math.random() * 9000);
    
    document.getElementById("sendBtn").disabled = true;
    msg.innerText = "Sending OTP...";
    msg.style.color = "var(--text)";

    // 3. Send Email via EmailJS
    emailjs.send("service_bk1amce", "template_lu3iasc", {
      to_email: email,  
      email: email,     
      name: name,
      otp: generatedOTP
    })
    .then(function(response) {
       msg.innerText = "✅ OTP sent to " + email;
       msg.style.color = "green";
       document.getElementById("otpBox").style.display = "block";
    }, function(error) {
       msg.innerText = "❌ Error: " + JSON.stringify(error);
       msg.style.color = "red";
       document.getElementById("sendBtn").disabled = false;
    });
  }

  // 4. Verify OTP
  function verifyOTP() {
    const userOTP = document.getElementById("otpInput").value;
    const msg = document.getElementById("msg");
    if(userOTP == generatedOTP){
      msg.innerText = "✅ Verified! Redirecting...";
      msg.style.color = "green";
      // Go to next page after verify
      // window.location.href = "signup-contact.html";
    } else {
      msg.innerText = "❌ Wrong OTP";
      msg.style.color = "red";
    }
  }
</script>
</body>
</html>
