<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign Up — Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  /* ===== SYSTEM DEFAULT THEME ===== */
  :root {
    --primary: #1b5e20;       /* Dark Green */
    --primary-hover: #144817;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #65676b;
    --border: #e4e6e9;
    --input-bg: #fafafa;
    --error: #c62828;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg: #0f1419;
      --card: #1a1f26;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2a3038;
      --input-bg: #0f1419;
      --error: #ef5350;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* ===== TOP NAVIGATION ===== */
  .top-bar {
    width: 100%;
    max-width: 480px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-btn {
    width: 40px;
    height: 40px;
    background: var(--card);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    border: 1px solid var(--border);
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .back-btn:hover { background: var(--border); }

  /* ===== LANGUAGE SELECTOR (Facebook Style) ===== */
  .lang-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: background 0.2s;
  }
  .lang-wrapper:hover { background: var(--border); }
  
  .lang-wrapper i.fa-globe {
    font-size: 14px;
    color: var(--muted);
    margin-right: 8px;
  }

  .lang-wrapper select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    padding-right: 20px; /* Space for arrow */
    font-family: inherit;
  }
  
  .lang-wrapper i.fa-chevron-down {
    position: absolute;
    right: 14px;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding: 0 20px;
    margin-top: 10px;
  }

  .logo {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    object-fit: contain;
    background: var(--card);
    padding: 8px;
    box-shadow: 0 4px 16px rgba(27, 94, 32, 0.15);
    margin-bottom: 16px;
  }

  h2 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  p.subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ===== PROGRESS BAR ===== */
  .progress-container {
    width: 100%;
    max-width: 440px;
    padding: 0 20px;
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
  }

  .progress-step {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
  }

  .progress-step.active {
    background: var(--primary);
  }

  /* ===== FORM ===== */
  .form-wrap {
    width: 100%;
    max-width: 440px;
    padding: 0 20px 40px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 15px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: all 0.2s;
  }

  input:focus {
    border-color: var(--primary);
    background: var(--card);
    box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.15);
  }

  input::placeholder { color: var(--muted); opacity: 0.7; }

  /* ===== BUTTON ===== */
  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(27, 94, 32, 0.3);
  }

  .btn:hover { background: var(--primary-hover); }
  .btn:active { transform: scale(0.98); }

  /* ===== ERROR ===== */
  .msg {
    text-align: center;
    font-size: 13px;
    color: var(--error);
    font-weight: 500;
    min-height: 20px;
    margin-bottom: 10px;
  }

  /* ===== FOOTER ===== */
  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .footer-text a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }

  .footer-text a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-bar">
    <div class="back-btn" onclick="location.href='welcome.html'">
      <i class="fas fa-arrow-left"></i>
    </div>

    <!-- SINGLE Facebook Style Language Dropdown -->
    <div class="lang-wrapper">
      <i class="fas fa-globe"></i>
      <select id="langSelect" onchange="changeLanguage()">
        <option value="en">English (US)</option>
        <option value="bd">বাংলা</option>
        <option value="in">हिन्दी</option>
        <option value="sa">العربية</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
      <i class="fas fa-chevron-down"></i>
    </div>
  </div>

  <!-- Logo & Header -->
  <div class="header">
    <img src="logo.png" alt="Autrobook Logo" class="logo" onerror="this.style.display='none'">
    <h2 data-key="title">What's your name?</h2>
    <p class="subtitle" data-key="subtitle">Enter the name you use in real life</p>
  </div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress-step active"></div>
    <div class="progress-step"></div>
    <div class="progress-step"></div>
  </div>

  <!-- Form -->
  <div class="form-wrap">
    <div class="form-group">
      <label data-key="firstName">First Name</label>
      <input type="text" id="firstName" data-placeholder="firstNamePlaceholder" autocomplete="given-name" placeholder="Enter your first name">
    </div>

    <div class="form-group">
      <label data-key="surname">Surname</label>
      <input type="text" id="surname" data-placeholder="surnamePlaceholder" autocomplete="family-name" placeholder="Enter your surname">
    </div>

    <div class="msg" id="msg"></div>
    
    <button class="btn" id="nextBtn" onclick="goNext()" data-key="next">Next</button>
    
    <p class="footer-text">
      <span data-key="haveAcc">Already have an account?</span> 
      <a href="login.html" data-key="loginLink">Log in</a>
    </p>
  </div>

  <script>
    // ===== MULTI-LANGUAGE SYSTEM =====
    let currentLang = localStorage.getItem('lang') || 'en';
    
    const translations = {
      en: { 
        title: "What's your name?", 
        subtitle: "Enter the name you use in real life", 
        firstName: "First Name", 
        surname: "Surname", 
        firstNamePlaceholder: "Enter your first name", 
        surnamePlaceholder: "Enter your surname", 
        next: "Next", 
        haveAcc: "Already have an account?", 
        loginLink: "Log in",
        err1: "Please enter your first name", 
        err2: "Please enter your surname" 
      },
      bd: { 
        title: "আপনার নাম কি?", 
        subtitle: "আপনি বাস্তব জীবনে যে নামটি ব্যবহার করেন তা লিখুন", 
        firstName: "প্রথম নাম", 
        surname: "পদবি", 
        firstNamePlaceholder: "আপনার প্রথম নাম লিখুন", 
        surnamePlaceholder: "আপনার পদবি লিখুন", 
        next: "পরবর্তী", 
        haveAcc: "ইতিমধ্যে একটি অ্যাকাউন্ট আছে?", 
        loginLink: "লগ ইন করুন",
        err1: "আপনার প্রথম নাম লিখুন", 
        err2: "আপনার পদবি লিখুন" 
      },
      in: { 
        title: "आपका नाम क्या है?", 
        subtitle: "वह नाम दर्ज करें जो आप वास्तविक जीवन में उपयोग करते हैं", 
        firstName: "पहचान का नाम", 
        surname: "उपनाम", 
        firstNamePlaceholder: "अपना पहला नाम दर्ज करें", 
        surnamePlaceholder: "अपना उपनाम दर्ज करें", 
        next: "आगे बढ़ें", 
        haveAcc: "क्या आपके पास पहले से खाता है?", 
        loginLink: "लॉग इन करें",
        err1: "कृपया अपना पहला नाम दर्ज करें", 
        err2: "कृपया अपना उपनाम दर्ज करें" 
      },
      sa: { 
        title: "ما هو اسمك؟", 
        subtitle: "أدخل الاسم الذي تستخدمه في الحياة الواقعية", 
        firstName: "الاسم الأول", 
        surname: "اللقب", 
        firstNamePlaceholder: "أدخل اسمك الأول", 
        surnamePlaceholder: "أدخل لقبك", 
        next: "التالي", 
        haveAcc: "هل لديك حساب بالفعل؟", 
        loginLink: "تسجيل الدخول",
        err1: "الرجاء إدخال اسمك الأول", 
        err2: "الرجاء إدخال لقبك" 
      },
      es: {
        title: "¿Cuál es tu nombre?",
        subtitle: "Ingresa el nombre que usas en la vida real",
        firstName: "Nombre",
        surname: "Apellido",
        firstNamePlaceholder: "Ingresa tu nombre",
        surnamePlaceholder: "Ingresa tu apellido",
        next: "Siguiente",
        haveAcc: "¿Ya tienes una cuenta?",
        loginLink: "Iniciar sesión",
        err1: "Por favor ingresa tu nombre",
        err2: "Por favor ingresa tu apellido"
      },
      fr: {
        title: "Quel est votre nom ?",
        subtitle: "Entrez le nom que vous utilisez dans la vie réelle",
        firstName: "Prénom",
        surname: "Nom de famille",
        firstNamePlaceholder: "Entrez votre prénom",
        surnamePlaceholder: "Entrez votre nom de famille",
        next: "Suivant",
        haveAcc: "Vous avez déjà un compte ?",
        loginLink: "Se connecter",
        err1: "Veuillez entrer votre prénom",
        err2: "Veuillez entrer votre nom de famille"
      }
    };

    function applyLanguage(lang){
      currentLang = lang; 
      localStorage.setItem('lang', lang);
      const dict = translations[lang] || translations.en;
      
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if(dict[key]) el.innerText = dict[key];
      });
      document.querySelectorAll('[data-placeholder]').forEach(el => {
        const key = el.getAttribute('data-placeholder');
        if(dict[key]) el.placeholder = dict[key];
      });
    }

    window.changeLanguage = () => { 
      applyLanguage(document.getElementById('langSelect').value); 
    }

    document.addEventListener('DOMContentLoaded', () => {
      const selectEl = document.getElementById('langSelect');
      if ([...selectEl.options].some(o => o.value === currentLang)) {
        selectEl.value = currentLang;
      }
      applyLanguage(currentLang);
      
      // Restore saved input if user went back
      if(localStorage.getItem('signup_firstName')) {
        document.getElementById('firstName').value = localStorage.getItem('signup_firstName');
      }
      if(localStorage.getItem('signup_surname')) {
        document.getElementById('surname').value = localStorage.getItem('signup_surname');
      }
    });

    function showMsg(t){ 
      document.getElementById('msg').textContent = t; 
    }

    window.goNext = () => {
      const dict = translations[currentLang] || translations.en;
      const fn = document.getElementById('firstName').value.trim();
      const sn = document.getElementById('surname').value.trim();
      
      if(!fn) return showMsg(dict.err1);
      if(!sn) return showMsg(dict.err2);
      
      // Save for next step
      localStorage.setItem('signup_firstName', fn);
      localStorage.setItem('signup_surname', sn);
      localStorage.setItem('signup_name', fn + ' ' + sn);
      
      // Redirect to Contact/Password page
      location.href = 'signup-contact.html';
    }
  </script>
</body>
</html>
