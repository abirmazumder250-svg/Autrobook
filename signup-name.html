<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#043D22">
<title>Sign Up — Autrobook</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --primary: #043D22;
  --primary-hover: #022a17;
  --bg: #f0f2f5;
  --card: #ffffff;
  --text: #050505;
  --muted: #65676b;
  --border: #dadde1;
  --input-bg: #ffffff;
  --error: #e41e3f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #043D22;
    --primary-hover: #022a17;
    --bg: #18191a;
    --card: #242526;
    --text: #e4e6eb;
    --muted: #b0b3b8;
    --border: #3a3b3c;
    --input-bg: #242526;
    --error: #f02849;
  }
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background-color:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}

.top-bar{width:100%;max-width:480px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.back-btn{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);cursor:pointer;border:1px solid var(--border)}
.back-btn:hover{background:var(--bg)}

.lang-wrapper{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 14px;cursor:pointer}
.lang-wrapper:hover{background:var(--bg)}
.lang-wrapper span{font-size:13.5px;font-weight:600;color:var(--text)}
.lang-wrapper i{font-size:12px;color:var(--muted);margin-left:8px}

.lang-modal-back{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:999}
.lang-modal{background:var(--card);width:90%;max-width:350px;border-radius:12px;padding:20px}
.lang-modal h3{margin-bottom:16px;font-size:16px;font-weight:600}
.lang-list{display:flex;flex-direction:column;gap:2px;max-height:400px;overflow-y:auto}
.lang-item{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:8px;cursor:pointer}
.lang-item:hover{background:var(--bg)}
.lang-item span{font-size:15px}
.lang-item input[type="radio"]{accent-color:var(--primary);width:18px;height:18px}
.lang-close{width:100%;padding:12px;margin-top:16px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}

.header{text-align:center;margin-bottom:28px;padding:0 20px;margin-top:10px}
.logo{width:72px;height:72px;border-radius:20px;object-fit:contain;background:var(--card);padding:8px;margin-bottom:16px;border:1px solid var(--border)}
h2{font-size:24px;font-weight:800;margin-bottom:6px}
p.subtitle{font-size:14px;color:var(--muted);line-height:1.5}

.progress-container{width:100%;max-width:440px;padding:0 20px;display:flex;gap:6px;margin-bottom:24px}
.progress-step{flex:1;height:4px;border-radius:2px;background:var(--border)}
.progress-step.active{background:var(--primary)}

.form-wrap{width:100%;max-width:440px;padding:0 20px 40px}
.form-group{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px}
input{width:100%;padding:15px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(4,61,34,0.15)}
input::placeholder{color:var(--muted);opacity:0.7}

.btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--primary);color:#ffffff;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:scale(0.98)}

.msg{text-align:center;font-size:13px;color:var(--error);font-weight:500;min-height:20px;margin-bottom:10px}
.footer-text{text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted)}
.footer-text a{color:var(--primary);font-weight:700;text-decoration:none}
.footer-text a:hover{text-decoration:underline}
.hide{display:none}
</style>
</head>
<body>

<div class="top-bar">
  <div class="back-btn" onclick="location.href='welcome.html'">
    <i class="fas fa-arrow-left"></i>
  </div>
  <div class="lang-wrapper" onclick="openLangModal()">
    <span id="langBtn">English - US</span>
    <i class="fas fa-chevron-down"></i>
  </div>
</div>

<div class="header">
  <img src="logo.png" alt="Autrobook Logo" class="logo" onerror="this.style.display='none'">
  <h2 data-key="title">What's your name?</h2>
  <p class="subtitle" data-key="subtitle">Enter the name you use in real life</p>
</div>

<div class="progress-container">
  <div class="progress-step active"></div>
  <div class="progress-step"></div>
</div>

<div class="form-wrap">
  <div class="form-group">
    <label data-key="firstName">First Name</label>
    <input type="text" id="firstName" data-placeholder="firstNamePlaceholder" autocomplete="given-name" placeholder="Enter your first name">
  </div>
  <div class="form-group">
    <label data-key="surname">Surname</label>
    <input type="text" id="surname" data-placeholder="surnamePlaceholder" autocomplete="family-name" placeholder="Enter your surname">
  </div>
  <div class="form-group">
    <label data-key="username">Username</label>
    <input type="text" id="username" data-placeholder="usernamePlaceholder" autocomplete="username" placeholder="Choose a username">
  </div>
  
  <div class="msg" id="msg"></div>
  <button class="btn" id="nextBtn" onclick="goNext()" data-key="next">Next</button>
  
  <p class="footer-text" id="loginFooter">
    <span data-key="haveAcc">Already have an account?</span> 
    <a href="login.html" data-key="loginLink">Log in</a>
  </p>
</div>

<div class="lang-modal-back" id="langModal" onclick="closeLangModal()">
  <div class="lang-modal" onclick="event.stopPropagation()">
    <h3 id="langTitle">Select Language</h3>
    <div class="lang-list" id="langList"></div>
    <button class="lang-close" onclick="closeLangModal()">Close</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const languages = [
  {code: 'en', name: 'English - US'},
  {code: 'bn', name: 'বাংলা - Bangladesh'},
  {code: 'hi', name: 'हिन्दी - India'},
  {code: 'es', name: 'Español - Spain'},
  {code: 'fr', name: 'Français - France'},
  {code: 'ar', name: 'Arabic - العربية'},
  {code: 'pt', name: 'Português - Portugal'},
  {code: 'de', name: 'Deutsch - Germany'},
  {code: 'id', name: 'Bahasa Indonesia'},
  {code: 'tr', name: 'Türkçe - Türkiye'}
];

const translations = {
  en: {title:"What's your name?",subtitle:"Enter the name you use in real life",firstName:"First Name",surname:"Surname",username:"Username",firstNamePlaceholder:"Enter your first name",surnamePlaceholder:"Enter your surname",usernamePlaceholder:"Choose a username",next:"Next",haveAcc:"Already have an account?",loginLink:"Log in",err1:"Please enter your first name",err2:"Please enter your surname",err3:"Please enter a username",langTitle:"Select Language",close:"Close"},
  bn: {title:"আপনার নাম কি?",subtitle:"আপনি বাস্তব জীবনে যে নামটি ব্যবহার করেন তা লিখুন",firstName:"প্রথম নাম",surname:"পদবি",username:"ইউজারনেম",firstNamePlaceholder:"আপনার প্রথম নাম লিখুন",surnamePlaceholder:"আপনার পদবি লিখুন",usernamePlaceholder:"একটি ইউজারনেম বেছে নিন",next:"পরবর্তী",haveAcc:"ইতিমধ্যে একটি অ্যাকাউন্ট আছে?",loginLink:"লগ ইন করুন",err1:"আপনার প্রথম নাম লিখুন",err2:"আপনার পদবি লিখুন",err3:"একটি ইউজারনেম লিখুন",langTitle:"ভাষা নির্বাচন করুন",close:"বন্ধ করুন"},
  hi: {title:"आपका नाम क्या है?",subtitle:"वह नाम दर्ज करें जो आप वास्तविक जीवन में उपयोग करते हैं",firstName:"पहला नाम",surname:"उपनाम",username:"उपयोगकर्ता नाम",firstNamePlaceholder:"अपना पहला नाम दर्ज करें",surnamePlaceholder:"अपना उपनाम दर्ज करें",usernamePlaceholder:"एक उपयोगकर्ता नाम चुनें",next:"आगे बढ़ें",haveAcc:"क्या आपके पास पहले से खाता है?",loginLink:"लॉग इन करें",err1:"कृपया अपना पहला नाम दर्ज करें",err2:"कृपया अपना उपनाम दर्ज करें",err3:"कृपया एक उपयोगकर्ता नाम दर्ज करें",langTitle:"भाषा चुनें",close:"बंद करें"},
  es: {title:"¿Cuál es tu nombre?",subtitle:"Ingresa el nombre que usas en la vida real",firstName:"Nombre",surname:"Apellido",username:"Nombre de usuario",firstNamePlaceholder:"Ingresa tu nombre",surnamePlaceholder:"Ingresa tu apellido",usernamePlaceholder:"Elige un nombre de usuario",next:"Siguiente",haveAcc:"¿Ya tienes una cuenta?",loginLink:"Iniciar sesión",err1:"Por favor ingresa tu nombre",err2:"Por favor ingresa tu apellido",err3:"Por favor ingresa un nombre de usuario",langTitle:"Seleccionar idioma",close:"Cerrar"},
  fr: {title:"Quel est votre nom ?",subtitle:"Entrez le nom que vous utilisez dans la vie réelle",firstName:"Prénom",surname:"Nom de famille",username:"Nom d'utilisateur",firstNamePlaceholder:"Entrez votre prénom",surnamePlaceholder:"Entrez votre nom de famille",usernamePlaceholder:"Choisissez un nom d'utilisateur",next:"Suivant",haveAcc:"Vous avez déjà un compte ?",loginLink:"Se connecter",err1:"Veuillez entrer votre prénom",err2:"Veuillez entrer votre nom de famille",err3:"Veuillez entrer un nom d'utilisateur",langTitle:"Choisir la langue",close:"Fermer"},
  ar: {title:"ما هو اسمك؟",subtitle:"أدخل الاسم الذي تستخدمه في الحياة الواقعية",firstName:"الاسم الأول",surname:"اللقب",username:"اسم المستخدم",firstNamePlaceholder:"أدخل اسمك الأول",surnamePlaceholder:"أدخل لقبك",usernamePlaceholder:"اختر اسم مستخدم",next:"التالي",haveAcc:"هل لديك حساب بالفعل؟",loginLink:"تسجيل الدخول",err1:"الرجاء إدخال اسمك الأول",err2:"الرجاء إدخال لقبك",err3:"الرجاء إدخال اسم مستخدم",langTitle:"اختر اللغة",close:"إغلاق"},
  pt: {title:"Qual é o seu nome?",subtitle:"Digite o nome que você usa na vida real",firstName:"Primeiro nome",surname:"Sobrenome",username:"Nome de usuário",firstNamePlaceholder:"Digite seu primeiro nome",surnamePlaceholder:"Digite seu sobrenome",usernamePlaceholder:"Escolha um nome de usuário",next:"Avançar",haveAcc:"Já tem uma conta?",loginLink:"Entrar",err1:"Digite seu primeiro nome",err2:"Digite seu sobrenome",err3:"Digite um nome de usuário",langTitle:"Selecionar idioma",close:"Fechar"},
  de: {title:"Wie ist Ihr Name?",subtitle:"Geben Sie den Namen ein, den Sie im wirklichen Leben verwenden",firstName:"Vorname",surname:"Nachname",username:"Benutzername",firstNamePlaceholder:"Geben Sie Ihren Vornamen ein",surnamePlaceholder:"Geben Sie Ihren Nachnamen ein",usernamePlaceholder:"Wählen Sie einen Benutzernamen",next:"Weiter",haveAcc:"Haben Sie bereits ein Konto?",loginLink:"Anmelden",err1:"Bitte geben Sie Ihren Vornamen ein",err2:"Bitte geben Sie Ihren Nachnamen ein",err3:"Bitte geben Sie einen Benutzernamen ein",langTitle:"Sprache auswählen",close:"Schließen"},
  id: {title:"Siapa nama Anda?",subtitle:"Masukkan nama yang Anda gunakan dalam kehidupan nyata",firstName:"Nama Depan",surname:"Nama Belakang",username:"Nama Pengguna",firstNamePlaceholder:"Masukkan nama depan Anda",surnamePlaceholder:"Masukkan nama belakang Anda",usernamePlaceholder:"Pilih nama pengguna",next:"Berikutnya",haveAcc:"Sudah punya akun?",loginLink:"Masuk",err1:"Silakan masukkan nama depan Anda",err2:"Silakan masukkan nama belakang Anda",err3:"Silakan masukkan nama pengguna",langTitle:"Pilih Bahasa",close:"Tutup"},
  tr: {title:"Adınız ne?",subtitle:"Gerçek hayatta kullandığınız adı girin",firstName:"Ad",surname:"Soyad",username:"Kullanıcı Adı",firstNamePlaceholder:"Adınızı girin",surnamePlaceholder:"Soyadınızı girin",usernamePlaceholder:"Bir kullanıcı adı seçin",next:"İleri",haveAcc:"Zaten bir hesabınız var mı?",loginLink:"Giriş Yap",err1:"Lütfen adınızı girin",err2:"Lütfen soyadınızı girin",err3:"Lütfen bir kullanıcı adı girin",langTitle:"Dil Seç",close:"Kapat"}
};

let currentLang = localStorage.getItem('autro_lang') || 'en';

document.addEventListener('DOMContentLoaded', async () => {
  buildLangList();
  applyLanguage();
  
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    document.getElementById('loginFooter').classList.add('hide');
  }

  if(localStorage.getItem('signup_firstName')) document.getElementById('firstName').value = localStorage.getItem('signup_firstName');
  if(localStorage.getItem('signup_surname')) document.getElementById('surname').value = localStorage.getItem('signup_surname');
  if(localStorage.getItem('signup_username')) document.getElementById('username').value = localStorage.getItem('signup_username');
});

function buildLangList(){
  const langList = document.getElementById('langList');
  langList.innerHTML = '';
  languages.forEach(lang => {
    const div = document.createElement('div');
    div.className = 'lang-item';
    div.innerHTML = `<span>${lang.name}</span><input type="radio" name="lang" value="${lang.code}" ${currentLang === lang.code ? 'checked' : ''}>`;
    div.onclick = () => selectLanguage(lang.code, lang.name);
    langList.appendChild(div);
  });
}

function openLangModal(){document.getElementById('langModal').style.display='flex'}
function closeLangModal(){document.getElementById('langModal').style.display='none'}

function selectLanguage(code, name){
  currentLang = code;
  localStorage.setItem('autro_lang', currentLang);
  document.getElementById('langBtn').innerText = name;
  applyLanguage();
  closeLangModal();
}

function applyLanguage(){
  const t = translations[currentLang];
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(t[key]) el.innerText = t[key];
  });
  document.querySelectorAll('[data-placeholder]').forEach(el => {
    const key = el.getAttribute('data-placeholder');
    if(t[key]) el.placeholder = t[key];
  });
}

function showMsg(t){document.getElementById('msg').textContent = t}

window.goNext = () => {
  const t = translations[currentLang];
  const fn = document.getElementById('firstName').value.trim();
  const sn = document.getElementById('surname').value.trim();
  const un = document.getElementById('username').value.trim();
  
  if(!fn) return showMsg(t.err1);
  if(!sn) return showMsg(t.err2);
  if(!un) return showMsg(t.err3);
  
  localStorage.setItem('signup_firstName', fn);
  localStorage.setItem('signup_surname', sn);
  localStorage.setItem('signup_username', un);
  localStorage.setItem('signup_name', fn + ' ' + sn);
  
  location.href = 'signup-contact.html';
}
</script>
</body>
</html>
