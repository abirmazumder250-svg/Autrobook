<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - What's your name?</title>
<style>
:root{ --brand:#0f5132; --brand-light:#198754; --bg:#1c1c1e; --card:#2c2c2e; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);min-height:100vh;color:white}
.top{padding:15px}
.back{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.lang-select{text-align:center;margin:5px 0 25px}
.lang-select select{padding:8px 12px;border-radius:10px;border:1px solid #555;background:var(--card);color:white;font-size:15px;font-weight:bold;cursor:pointer}
.logo{text-align:center;margin-bottom:30px}
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--brand);box-shadow:0 4px 15px rgba(15,81,50,0.4)}
.logo p{font-size:26px;font-weight:bold;margin-top:5px}
.wrap{padding:0 20px 30px;max-width:450px;margin:0 auto}
h2{font-size:22px;margin-bottom:6px}
p.sub{color:#aaa;font-size:14px;margin-bottom:25px;line-height:1.5}
.row{display:flex;gap:12px}
input{width:100%;padding:18px 20px;border-radius:18px;border:1px solid #555;background:transparent;color:white;font-size:17px;margin-bottom:15px;outline:none}
input::placeholder{color:#aaa}
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.2)}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:18px;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:.6;background:#555}
.btn-outline{width:100%;padding:15px;border:1px solid var(--brand-light);border-radius:30px;background:transparent;color:var(--brand-light);font-size:17px;font-weight:bold;cursor:pointer;margin-top:20px}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px}
.msg.error{color:#ff8a8a}.msg.success{color:#8affa0}
.footer{text-align:center;margin-top:20px;color:#ccc}
.progress{display:flex;gap:6px;max-width:450px;margin:0 auto 25px;padding:0 20px}
.progress div{flex:1;height:5px;border-radius:10px;background:#333}
.progress div.active{background:var(--brand-light)}
</style>
</head>
<body>
<div class="top"><div class="back" onclick="location.href='/'">←</div></div>
<div class="lang-select">
  <select id="langSelect" onchange="changeLanguage()">
    <option value="en">English (US)</option>
    <option value="bn">বাংলা</option>
    <option value="hi">हिन्दी</option>
    <option value="ar">العربية</option>
    <option value="es">Español</option>
  </select>
</div>
<div class="logo">
  <img src="logo.png" alt="Autrobook" onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='inline-flex'">
  <div id="fallbackLogo" style="display:none;width:80px;height:80px;background:var(--brand);border-radius:50%;align-items:center;justify-content:center;font-size:42px;font-weight:bold">A</div>
  <p>Autrobook</p>
</div>
<div class="progress"><div class="active"></div><div></div><div></div></div>
<div class="wrap">
  <h2 data-key="title">What's your name?</h2>
  <p class="sub" data-key="subtitle">Enter the name you use in real life. This will be shown on your Autrobook profile.</p>
  <div class="row">
    <input type="text" id="firstName" data-placeholder="firstname" autocomplete="given-name">
    <input type="text" id="surname" data-placeholder="surname" autocomplete="family-name">
  </div>
  <div class="msg" id="msg"></div>
  <button class="btn" id="nextBtn" onclick="goNext()" data-key="next">Next</button>
  <button class="btn-outline" onclick="location.href='/'" data-key="login">Already have an account?</button>
  <div class="footer">Autrobook</div>
</div>
<script>
const translations = {
  en: { title: "What's your name?", subtitle: "Enter the name you use in real life. This will be shown on your Autrobook profile.", firstname: "First name", surname: "Surname", next: "Next", login: "Already have an account?", err1: "Please enter your first name", err2: "First name is too short", err3: "Please enter your surname", err4: "Surname is too short", err5: "Name can only contain letters", success: "Saved! Going to next step..." },
  bn: { title: "তোমার নাম কি?", subtitle: "তুমি বাস্তবে যে নাম ব্যবহার করো সেটা লেখো। এটা তোমার Autrobook প্রোফাইলে দেখাবে।", firstname: "নামের প্রথম অংশ", surname: "পদবি", next: "পরবর্তী", login: "আগেই অ্যাকাউন্ট আছে?", err1: "প্রথম নাম লেখো", err2: "প্রথম নাম অনেক ছোট", err3: "পদবি লেখো", err4: "পদবি অনেক ছোট", err5: "নামে শুধু অক্ষর ব্যবহার করো", success: "সেভ হয়েছে! পরের ধাপে যাচ্ছি..." },
  hi: { title: "तुम्हारा नाम क्या है?", subtitle: "अपना असली नाम लिखो। यह तुम्हारे Autrobook प्रोफाइल पर दिखेगा।", firstname: "पहला नाम", surname: "उपनाम", next: "आगे", login: "पहले से अकाउंट है?", err1: "कृपया पहला नाम लिखो", err2: "पहला नाम बहुत छोटा है", err3: "कृपया उपनाम लिखो", err4: "उपनाम बहुत छोटा है", err5: "नाम में सिर्फ अक्षर हो सकते हैं", success: "सेव हो गया! अगले स्टेप पर जा रहे हैं..." },
  ar: { title: "ما اسمك؟", subtitle: "اكتب الاسم الذي تستخدمه في حياتك الحقيقية. سيظهر في ملفك على Autrobook.", firstname: "الاسم الأول", surname: "اسم العائلة", next: "التالي", login: "هل لديك حساب بالفعل؟", err1: "من فضلك اكتب اسمك الأول", err2: "الاسم الأول قصير جدا", err3: "من فضلك اكتب اسم العائلة", err4: "اسم العائلة قصير جدا", err5: "الاسم يمكن أن يحتوي على حروف فقط", success: "تم الحفظ! جاري الانتقال للخطوة التالية..." },
  es: { title: "¿Cómo te llamas?", subtitle: "Escribe el nombre que usas en la vida real. Se mostrará en tu perfil de Autrobook.", firstname: "Nombre", surname: "Apellido", next: "Siguiente", login: "¿Ya tienes una cuenta?", err1: "Escribe tu nombre", err2: "El nombre es muy corto", err3: "Escribe tu apellido", err4: "El apellido es muy corto", err5: "El nombre solo puede contener letras", success: "¡Guardado! Yendo al siguiente paso..." }
};
let currentLang = localStorage.getItem('lang') || 'en';
function applyLanguage(lang){
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  document.body.style.direction = (lang==='ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang] && translations[lang][key]){
      el.innerText = translations[lang][key];
    }
  });
  document.querySelectorAll('[data-placeholder]').forEach(el => {
    const key = el.getAttribute('data-placeholder');
    if(translations[lang] && translations[lang][key]){
      el.placeholder = translations[lang][key];
    }
  });
}
window.changeLanguage = () => { applyLanguage(document.getElementById('langSelect').value); }
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langSelect').value = currentLang;
  applyLanguage(currentLang);
});
const savedFN = localStorage.getItem('signup_firstName');
const savedSN = localStorage.getItem('signup_surname');
if(savedFN) document.getElementById('firstName').value = savedFN;
if(savedSN) document.getElementById('surname').value = savedSN;
function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;}
window.goNext = () => {
  const t = translations[currentLang] || translations.en;
  const firstName = document.getElementById('firstName').value.trim();
  const surname = document.getElementById('surname').value.trim();
  if(!firstName) return showMsg(t.err1,'error');
  if(firstName.length < 2) return showMsg(t.err2,'error');
  if(!surname) return showMsg(t.err3,'error');
  if(surname.length < 2) return showMsg(t.err4,'error');
  // Unicode letters allow - Bangla, Hindi, Arabic, English sob cholbe
  if(!/^[\p{L} ]+$/u.test(firstName+' '+surname)) return showMsg(t.err5,'error');
  if(/[0-9!@#$%^&*()_+=<>?\/\\|~`]/.test(firstName+surname)) return showMsg(t.err5,'error');
  
  localStorage.setItem('signup_firstName', firstName);
  localStorage.setItem('signup_surname', surname);
  localStorage.setItem('signup_name', firstName + ' ' + surname);
  localStorage.setItem('signup_step','contact');
  showMsg(t.success,'success');
  var btn=document.getElementById('nextBtn');
  btn.disabled=true;
  btn.innerText='...';
  setTimeout(()=>{
    window.location.href = 'signup.html';  // এখানে signup-contact থেকে signup করলাম
  }, 400);
}
document.addEventListener('keydown', e => { if(e.key === 'Enter') goNext(); });
</script>
</body>
</html>
