<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Autrobook - Sign Up (Name)</title>
<style>
:root{ --brand:#0f5132; --brand-light:#198754; --bg:#1c1c1e; --card:#2c2c2e; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);min-height:100vh;color:white}
.top{padding:15px}
.back{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.lang-select{text-align:center;margin:5px 0 25px;padding:0 20px}
.lang-select select{padding:10px 14px;border-radius:10px;border:1px solid #555;background:var(--card);color:white;font-size:14px;font-weight:bold;cursor:pointer;width:100%;max-width:320px;outline:none}
.logo{text-align:center;margin-bottom:30px}
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--brand);box-shadow:0 4px 15px rgba(15,81,50,0.4)}
.wrap{padding:0 20px 40px;max-width:450px;margin:0 auto}
h2{font-size:22px;margin-bottom:6px}
p.sub{color:#aaa;font-size:14px;margin-bottom:25px}
label{font-size:14px;color:#aaa;margin-bottom:6px;display:block}
input{width:100%;padding:16px;border-radius:15px;border:1px solid #555;background:transparent;color:white;font-size:16px;margin-bottom:15px;outline:none}
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.2)}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px;color:#ff8a8a}
.progress{display:flex;gap:6px;max-width:450px;margin:0 auto 25px;padding:0 20px}
.progress div{flex:1;height:5px;border-radius:10px;background:#333}
.progress div.active{background:var(--brand-light)}
</style>
</head>
<body>

<div class="top"><div class="back" onclick="location.href='index.html'">←</div></div>

<div class="lang-select">
<select id="langSelect" onchange="changeLanguage()">
  <option value="en">🇺🇸 United States (English)</option>
  <option value="bd">🇧🇩 Bangladesh (Bengali / English)</option>
  <option value="in">🇮🇳 India (English / Hindi)</option>
  <option value="gb">🇬🇧 United Kingdom (English)</option>
  <option value="ca">🇨🇦 Canada (English / French)</option>
  <option value="au">🇦🇺 Australia (English)</option>
  <option value="sa">🇸🇦 Saudi Arabia (Arabic)</option>
  <option value="ae">🇦🇪 United Arab Emirates (Arabic / English)</option>
  <option value="pk">🇵🇰 Pakistan (Urdu / English)</option>
  <option value="cn">🇨🇳 China (Chinese)</option>
  <option value="jp">🇯🇵 Japan (Japanese)</option>
  <option value="kr">🇰🇷 South Korea (Korean)</option>
  <option value="de">🇩🇪 Germany (German)</option>
  <option value="fr">🇫🇷 France (French)</option>
  <option value="es">🇦🇷 Spain / Latin America (Spanish)</option>
  <option value="it">🇮🇹 Italy (Italian)</option>
  <option value="br">🇧🇷 Brazil (Portuguese)</option>
  <option value="ru">🇷🇺 Russia (Russian)</option>
  <option value="tr">🇹🇷 Turkey (Turkish)</option>
</select>
</div>

<div class="logo"><img src="logo.png" alt="Autrobook" onerror="this.style.display='none'"></div>
<div class="progress"><div class="active"></div><div></div><div></div></div>
<div class="wrap">
<h2 data-key="title">What's your name?</h2>
<p class="sub" data-key="subtitle">Enter the name you use in real life</p>

<label data-key="firstName">First Name</label>
<input type="text" id="firstName" data-placeholder="firstNamePlaceholder" autocomplete="given-name" placeholder="Enter your first name">

<label data-key="surname">Surname</label>
<input type="text" id="surname" data-placeholder="surnamePlaceholder" autocomplete="family-name" placeholder="Enter your surname">

<div class="msg" id="msg"></div>
<button class="btn" id="nextBtn" onclick="goNext()" data-key="next">Next</button>
<p style="text-align:center;margin-top:12px;font-size:13px;color:#aaa"><span data-key="haveAcc">Already have an account?</span> <a href="index.html" style="color:#4CAF50;font-weight:bold" data-key="loginLink">Login</a></p>
</div>

<script>
let currentLang = localStorage.getItem('lang') || 'en';
const translations = {
  en: { 
    title: "What's your name?", 
    subtitle: "Enter the name you use in real life", 
    firstName: "First Name", 
    surname: "Surname", 
    firstNamePlaceholder: "Enter your first name", 
    surnamePlaceholder: "Enter your surname", 
    next: "Next", 
    haveAcc: "Already have an account?", 
    loginLink: "Login",
    err1: "Please enter your first name", 
    err2: "Please enter your surname" 
  },
  bd: { 
    title: "What's your name? (Bangladesh)", 
    subtitle: "Enter the name you use in real life", 
    firstName: "First Name", 
    surname: "Surname", 
    firstNamePlaceholder: "Enter your first name", 
    surnamePlaceholder: "Enter your surname", 
    next: "Next", 
    haveAcc: "Already have an account?", 
    loginLink: "Login",
    err1: "Please enter your first name", 
    err2: "Please enter your surname" 
  },
  in: { 
    title: "What's your name? (India)", 
    subtitle: "Enter the name you use in real life", 
    firstName: "First Name", 
    surname: "Surname", 
    firstNamePlaceholder: "Enter your first name", 
    surnamePlaceholder: "Enter your surname", 
    next: "Next", 
    haveAcc: "Already have an account?", 
    loginLink: "Login",
    err1: "Please enter your first name", 
    err2: "Please enter your surname" 
  },
  sa: { 
    title: "What's your name? (Saudi Arabia)", 
    subtitle: "Enter the name you use in real life", 
    firstName: "First Name", 
    surname: "Surname", 
    firstNamePlaceholder: "Enter your first name", 
    surnamePlaceholder: "Enter your surname", 
    next: "Next", 
    haveAcc: "Already have an account?", 
    loginLink: "Login",
    err1: "Please enter your first name", 
    err2: "Please enter your surname" 
  }
};

function applyLanguage(lang){
  currentLang = lang; 
  localStorage.setItem('lang', lang);
  const activeDict = translations[lang] || translations.en;
  
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(activeDict && activeDict[key]){ el.innerText = activeDict[key]; }
  });
  document.querySelectorAll('[data-placeholder]').forEach(el => {
    const key = el.getAttribute('data-placeholder');
    if(activeDict && activeDict[key]){ el.placeholder = activeDict[key]; }
  });
}

window.changeLanguage = () => { applyLanguage(document.getElementById('langSelect').value); }
document.addEventListener('DOMContentLoaded', () => {
  const selectEl = document.getElementById('langSelect');
  if ([...selectEl.options].some(o => o.value === currentLang)) {
    selectEl.value = currentLang;
  }
  applyLanguage(currentLang);
  
  if(localStorage.getItem('signup_firstName')) document.getElementById('firstName').value = localStorage.getItem('signup_firstName');
  if(localStorage.getItem('signup_surname')) document.getElementById('surname').value = localStorage.getItem('signup_surname');
});

function showMsg(t){ const el=document.getElementById('msg'); el.textContent=t; }

window.goNext = () => {
  const t = translations[currentLang] || translations.en;
  const fn = document.getElementById('firstName').value.trim();
  const sn = document.getElementById('surname').value.trim();
  
  if(!fn) return showMsg(t.err1);
  if(!sn) return showMsg(t.err2);
  
  localStorage.setItem('signup_firstName', fn);
  localStorage.setItem('signup_surname', sn);
  localStorage.setItem('signup_name', fn + ' ' + sn);
  
  location.href = 'signup-contact.html';
}
</script>
</body>
</html>
