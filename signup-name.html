<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3D20">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --primary: #0B3D20;
    --primary-hover: #072915;
    --dark-green-btn: #0B3D20;
    --dark-green-hover: #062413;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #050505;
    --muted: #65676b;
    --border: #dadde1;
    --input-bg: #ffffff;
    --error: #e41e3f;
    --success: #0B3D20;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --dark-green-btn: #0B3D20;
      --dark-green-hover: #0e4e29;
      --bg: #18191a;
      --card: #242526;
      --text: #ffffff;
      --muted: #b0b3b8;
      --border: #3a3b3c;
      --input-bg: #242526;
      --error: #f02849;
      --success: #10b981;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    max-width: 480px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    border: 1px solid var(--border);
    text-decoration: none;
    flex-shrink: 0;
  }

  .back-btn:hover {
    background: var(--bg);
  }

  .lang-selector-box {
    position: relative;
    display: inline-flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0 34px 0 14px;
    height: 38px;
    min-width: 200px;
    max-width: 265px;
    cursor: pointer;
  }

  .lang-selector-box select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-color: transparent;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    width: 100%;
    height: 100%;
    line-height: 36px;
    opacity: 1;
    visibility: visible;
  }

  .lang-selector-box select option {
    background-color: #ffffff;
    color: #050505;
  }

  @media (prefers-color-scheme: dark) {
    .lang-selector-box select option {
      background-color: #242526;
      color: #ffffff;
    }
  }

  .lang-selector-box .lang-caret {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 12px;
    color: var(--muted);
  }

  .header {
    text-align: center;
    margin-bottom: 18px;
    padding: 0 20px;
    margin-top: 6px;
  }

  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    object-fit: cover;
    margin: 0 auto 12px;
    display: block;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  h2 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--text);
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  .progress-container {
    width: 100%;
    max-width: 440px;
    padding: 0 20px;
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }

  .progress-step {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
  }

  .progress-step.active {
    background: var(--primary);
  }

  .form-wrap {
    width: 100%;
    max-width: 440px;
    padding: 0 20px 40px;
    position: relative;
    z-index: 10;
  }

  .form-group {
    margin-bottom: 16px;
    position: relative;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--primary);
  }

  input::placeholder {
    color: var(--muted);
    opacity: 0.7;
  }

  .faint-note {
    margin-top: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    opacity: 0.72;
    line-height: 1.4;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    margin-top: 10px;
    background: var(--dark-green-btn);
    color: #ffffff;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    position: relative;
    z-index: 10;
  }

  .btn:hover {
    background: var(--dark-green-hover);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .msg {
    text-align: center;
    font-size: 13px;
    color: var(--error);
    font-weight: 700;
    min-height: 12px;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .msg.success {
    color: var(--success);
  }

  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .footer-text a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }

  .footer-text a:hover {
    text-decoration: underline;
  }

  .hide {
    display: none !important;
  }
</style>
</head>

const memoryStore = new Map();

function safeGetStorage(key) {
  try {
    const ls = window.localStorage.getItem(key);
    if (ls !== null) return ls;
  } catch (e) {}
  try {
    const ss = window.sessionStorage.getItem(key);
    if (ss !== null) return ss;
  } catch (e) {}
  return memoryStore.has(key) ? memoryStore.get(key) : null;
}

function safeSetStorage(key, value) {
  memoryStore.set(key, String(value));
  try { window.localStorage.setItem(key, String(value)); } catch (e) {}
  try { window.sessionStorage.setItem(key, String(value)); } catch (e) {}
}

    firstName: "الاسم الأول",
    surname: "اللقب",
    username: "اسم المستخدم",
    firstNamePlaceholder: "أدخل اسمك الأول",
    surnamePlaceholder: "أدخل لقبك",
    usernamePlaceholder: "اختر اسم مستخدم",
    usernameHint: "معرّف فريد لحسابك على Autrobook (مثال: @your_handle)",
    handlePrefix: "معاينة اسم المستخدم:",
    next: "التالي",
    haveAcc: "هل لديك حساب بالفعل؟",
    loginLink: "تسجيل الدخول",
    err1: "الرجاء إدخال اسمك الأول",
    err2: "الرجاء إدخال لقبك",
    err3: "الرجاء إدخال اسم مستخدم"
  }
};

function buildAllTranslations() {
  const selectEl = document.getElementById('languageSelect');
  const map = Object.assign({}, BASE_TRANSLATIONS);
  if (!selectEl) return map;

  Array.from(selectEl.options).forEach(opt => {
    const code = opt.value;
    const base = code.split('-')[0];
    if (!map[code]) {
      map[code] = Object.assign({}, map[base] || map.en);
    }
  });
  return map;
}

const ALL_TRANSLATIONS = buildAllTranslations();
let currentLang = safeGetStorage('autro_lang') || safeGetStorage('lang') || 'en';

function goWelcome(event) {
  if (event) event.preventDefault();
  window.location.href = 'welcome.html';
}

function showMsg(text, isSuccess = false) {
  const msg = document.getElementById('msg');
  if (!msg) return;
  msg.textContent = text || '';
  msg.classList.toggle('success', Boolean(isSuccess));
}

function updateUsernameHint(customDefaultHint) {
  const hintEl = document.getElementById('usernameHint');
  const unInput = document.getElementById('username');
  if (!hintEl || !unInput) return;

  const t = ALL_TRANSLATIONS[currentLang] || ALL_TRANSLATIONS.en;
  const val = (unInput.value || '').trim().replace(/^@+/, '');
  if (val) {
    hintEl.textContent = `${t.handlePrefix} @${val}`;
  } else {
    hintEl.textContent = customDefaultHint || t.usernameHint;
  }
}

function applyLanguageUI(langCode, langLabel) {
  const t = ALL_TRANSLATIONS[langCode] || ALL_TRANSLATIONS.en;

  document.getElementById('titleHeading').textContent = t.title;
  document.getElementById('subtitleText').textContent = t.subtitle;
  document.getElementById('firstNameLabel').textContent = t.firstName;
  document.getElementById('surnameLabel').textContent = t.surname;
  document.getElementById('usernameLabel').textContent = t.username;
  document.getElementById('firstName').placeholder = t.firstNamePlaceholder;
  document.getElementById('surname').placeholder = t.surnamePlaceholder;
  document.getElementById('username').placeholder = t.usernamePlaceholder;
  document.getElementById('nextBtn').textContent = t.next;
  document.getElementById('haveAccText').textContent = t.haveAcc;
  document.getElementById('loginLink').textContent = t.loginLink;

  updateUsernameHint(t.usernameHint);

  const selectEl = document.getElementById('languageSelect');
  if (selectEl) {
    selectEl.setAttribute('data-active-lang', langCode);
    selectEl.setAttribute('data-active-label', langLabel || '');
  }
}

async function syncLanguageToSupabase(langCode, langName, isRtl) {
  if (!supabaseClient) return;

  try {
    await supabaseClient.auth.updateUser({
      data: {
        language: langCode,
        language_name: langName,
        dir: isRtl ? 'rtl' : 'ltr'
      }
    });
  } catch (e) {}

  try {
    await supabaseClient
      .from('language_preferences')
      .upsert({
        language: langCode,
        language_name: langName,
        dir: isRtl ? 'rtl' : 'ltr',
        updated_at: new Date().toISOString()
      }, { onConflict: 'language' });
  } catch (e) {}
}

function handleLanguageChange(fromUserAction = true) {
  const selectEl = document.getElementById('languageSelect');
  if (!selectEl) return;

  const opt = selectEl.options[selectEl.selectedIndex];
  const langCode = selectEl.value || 'en';
  const langName = opt ? opt.textContent.trim() : 'English (US)';
  const isRtl = opt && opt.getAttribute('data-dir') === 'rtl';

  currentLang = langCode;

  safeSetStorage('autro_lang', langCode);
  safeSetStorage('lang', langCode);
  safeSetStorage('autro_language', langCode);
  safeSetStorage('autro_language_name', langName);
  safeSetStorage('autro_language_dir', isRtl ? 'rtl' : 'ltr');

  document.documentElement.lang = langCode;
  document.documentElement.dir = isRtl ? 'rtl' : 'ltr';

  applyLanguageUI(langCode, langName);

  if (fromUserAction) {
    showMsg('');
    syncLanguageToSupabase(langCode, langName, isRtl);

    window.dispatchEvent(new CustomEvent('autro:languageChanged', {
      detail: { code: langCode, name: langName, rtl: isRtl }
    }));
  }
}

function initLanguageSelect() {
  const selectEl = document.getElementById('languageSelect');
  if (!selectEl) return;

  const exists = Array.from(selectEl.options).some(o => o.value === currentLang);
  selectEl.value = exists ? currentLang : 'en';

  selectEl.addEventListener('change', () => handleLanguageChange(true));
  selectEl.addEventListener('input', () => handleLanguageChange(true));

  handleLanguageChange(false);
}

function goNext() {
  const t = ALL_TRANSLATIONS[currentLang] || ALL_TRANSLATIONS.en;

  const fn = (document.getElementById('firstName').value || '').trim();
  const sn = (document.getElementById('surname').value || '').trim();
  const un = (document.getElementById('username').value || '').trim().replace(/^@+/, '');

  if (fn === '') return showMsg(t.err1 || "Please enter your first name");
  if (sn === '') return showMsg(t.err2 || "Please enter your surname");
  if (un === '') return showMsg(t.err3 || "Please enter a username");

  safeSetStorage('signup_firstName', fn);
  safeSetStorage('signup_surname', sn);
  safeSetStorage('signup_username', un);
  safeSetStorage('signup_name', fn + ' ' + sn);
  safeSetStorage('autro_lang', currentLang);

  window.location.href = 'signup-contact.html';
}

initLanguageSelect();

window.addEventListener('DOMContentLoaded', async () => {
  initLanguageSelect();

  if (safeGetStorage('signup_firstName')) {
    document.getElementById('firstName').value = safeGetStorage('signup_firstName');
  }
  if (safeGetStorage('signup_surname')) {
    document.getElementById('surname').value = safeGetStorage('signup_surname');
  }
  if (safeGetStorage('signup_username')) {
    document.getElementById('username').value = safeGetStorage('signup_username');
  }
  updateUsernameHint();

  try {
    if (supabaseClient) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('loginFooter').classList.add('hide');
      }
    }
  } catch (err) {
    console.log("Supabase skip:", err);
  }
});
</script>
