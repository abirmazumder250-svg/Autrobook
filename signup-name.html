<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Autrobook</title> 
<style> 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif} 
body{background:#1c1c1e;min-height:100vh;color:white} 
.top{padding:15px} 
.back{width:40px;height:40px;background:#2c2c2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer} 
.lang-select{text-align:center;margin:5px 0 25px}
.lang-select select{padding:8px 12px;border-radius:10px;border:1px solid #555;background:#2c2c2e;color:white;font-size:15px;font-weight:bold;cursor:pointer}
.logo{text-align:center;margin-bottom:30px} 
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:#0f5132} 
.logo p{font-size:26px;font-weight:bold;margin-top:5px} 
.wrap{padding:0 20px 30px;max-width:450px;margin:0 auto} 
h2{font-size:22px;margin-bottom:6px} 
p.sub{color:#aaa;font-size:14px;margin-bottom:25px;line-height:1.5} 
.row{display:flex;gap:12px} 
input{width:100%;padding:18px 20px;border-radius:18px;border:1px solid #555;background:transparent;color:white;font-size:17px;margin-bottom:15px;outline:none} 
input::placeholder{color:#aaa} 
input:focus{border-color:#1877f2} 
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:#1877f2;color:white;font-size:18px;font-weight:bold;cursor:pointer} 
.btn:disabled{opacity:.6;background:#555} 
.btn-outline{width:100%;padding:15px;border:1px solid #1877f2;border-radius:30px;background:transparent;color:#4a9cff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:80px} 
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px} 
.msg.error{color:#ff8a8a}.msg.success{color:#8affa0} 
.footer{text-align:center;margin-top:20px;color:#ccc} 
.progress{display:flex;gap:6px;max-width:450px;margin:0 auto 25px;padding:0 20px} 
.progress div{flex:1;height:5px;border-radius:10px;background:#333} 
.progress div.active{background:#1877f2} 
</style> 
</head> 
<body> 
<div class="top"><div class="back" onclick="location.href='/login.html'">←</div></div> 

<div class="lang-select">
<select id="langSelect" onchange="changeLanguage()">
  <option value="en">English (US)</option>
  <option value="bn">বাংলা</option>
  <option value="hi">हिन्दी</option>
  <option value="ar">العربية</option>
  <option value="es">Español</option>
</select>
</div>

<div class="logo"> 
<img src="logo.png" alt="Autrobook" onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='inline-flex'"> 
<div id="fallbackLogo" style="display:none;width:80px;height:80px;background:#0f5132;border-radius:50%;align-items:center;justify-content:center;font-size:42px;font-weight:bold">A</div> 
<p>Autrobook</p> 
</div> 
<div class="progress"><div class="active"></div><div></div><div></div></div> 
<div class="wrap"> 
<h2 data-key="title">What's your name?</h2> 
<p class="sub" data-key="subtitle">Enter the name you use in real life. This will be shown on your Autrobook profile.</p> 
<div class="row"> 
<input type="text" id="firstName" data-placeholder="firstname" autocomplete="given-name"> 
<input type="text" id="surname" data-placeholder="surname" autocomplete="family-name"> 
</div> 
<div class="msg" id="msg"></div> 
<button class="btn" id="nextBtn" onclick="goNext()" data-key="next">Next</button> 
<button class="btn-outline" onclick="location.href='/login.html'" data-key="login">Already have an account?</button> 
<div class="footer">Autrobook</div> 
</div> 

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; 
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; 
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// তোমার Firebase Config
const firebaseConfig = { 
  apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI", 
  authDomain: "autrobook-ad3d5.firebaseapp.com", 
  projectId: "autrobook-ad3d5", 
  storageBucket: "autrobook-ad3d5.firebasestorage.app", 
  messagingSenderId: "554222945815", 
  appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52", 
  measurementId: "G-Z8QM0NVR6W" 
}; 

const app = initializeApp(firebaseConfig); 
const auth = getAuth(app); 
const db = getFirestore(app);

const translations = {
  en: {
    title: "What's your name?", subtitle: "Enter the name you use in real life. This will be shown on your Autrobook profile.",
    firstname: "First name", surname: "Surname", next: "Next", login: "Already have an account?",
    err1: "Please enter your first name", err2: "First name is too short", err3: "Please enter your surname",
    err4: "Surname is too short", err5: "First name can only contain letters", err6: "Surname can only contain letters",
    success: "Saved! Going to next step..."
  },
  bn: {
    title: "আপনার নাম কি?", subtitle: "আপনি বাস্তব জীবনে যে নাম ব্যবহার করেন সেটি দিন। এটি আপনার Autrobook প্রোফাইলে দেখানো হবে।",
    firstname: "নামের প্রথম অংশ", surname: "নামের শেষ অংশ", next: "পরবর্তী", login: "ইতিমধ্যে অ্যাকাউন্ট আছে?",
    err1: "নামের প্রথম অংশ দিন", err2: "নাম খুব ছোট", err3: "নামের শেষ অংশ দিন",
    err4: "নাম খুব ছোট", err5: "নামে শুধু অক্ষর ব্যবহার করুন", err6: "নামে শুধু অক্ষর ব্যবহার করুন",
    success: "সেভ হয়েছে! পরের ধাপে যাচ্ছে..."
  },
  hi: {
    title: "आपका नाम क्या है?", subtitle: "अपने वास्तविक जीवन में इस्तेमाल होने वाला नाम दर्ज करें।",
    firstname: "पहला नाम", surname: "उपनाम", next: "आगे", login: "पहले से खाता है?"
  },
  ar: {
    title: "ما اسمك؟", subtitle: "أدخل الاسم الذي تستخدمه في الحياة الواقعية.",
    firstname: "الاسم الأول", surname: "اسم العائلة", next: "التالي", login: "هل لديك حساب بالفعل؟"
  },
  es: {
    title: "¿Cuál es tu nombre?", subtitle: "Ingresa el nombre que usas en la vida real.",
    firstname: "Nombre", surname: "Apellido", next: "Siguiente", login: "¿Ya tienes una cuenta?"
  }
};

let currentLang = localStorage.getItem('lang') || 'en';

function applyLanguage(lang){
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang] && translations[lang][key]){
      el.innerText = translations[lang][key];
    }
  });
  
  document.querySelectorAll('[data-placeholder]').forEach(el => {
    const key = el.getAttribute('data-placeholder');
    if(translations[lang] && translations[lang][key]){
      el.placeholder = translations[lang][key];
    }
  });
}

window.changeLanguage = () => {
  const lang = document.getElementById('langSelect').value;
  applyLanguage(lang);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langSelect').value = currentLang;
  applyLanguage(currentLang);
});

// If user came back, show old values
const savedFN = localStorage.getItem('signup_firstName'); 
const savedSN = localStorage.getItem('signup_surname'); 
if(savedFN) document.getElementById('firstName').value = savedFN; 
if(savedSN) document.getElementById('surname').value = savedSN; 

function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;} 

window.goNext = async () => { 
  const t = translations[currentLang];
  const firstName = document.getElementById('firstName').value.trim(); 
  const surname = document.getElementById('surname').value.trim(); 
  
  if(!firstName) return showMsg(t.err1,'error'); 
  if(firstName.length < 2) return showMsg(t.err2,'error'); 
  if(!surname) return showMsg(t.err3,'error'); 
  if(surname.length < 2) return showMsg(t.err4,'error'); 
  if(!/^[a-zA-Z\u0980-\u09FF\u0900-\u097F\u0600-\u06FF ]+$/.test(firstName)) return showMsg(t.err5,'error'); 
  if(!/^[a-zA-Z\u0980-\u09FF\u0900-\u097F\u0600-\u06FF ]+$/.test(surname)) return showMsg(t.err6,'error'); 

  const btn = document.getElementById('nextBtn'); 
  btn.disabled = true; 
  btn.textContent = '...'; 
  
  localStorage.setItem('signup_firstName', firstName); 
  localStorage.setItem('signup_surname', surname); 
  localStorage.setItem('signup_name', firstName + ' ' + surname); 
  localStorage.setItem('signup_lang', currentLang);

  showMsg(t.success,'success'); 
  setTimeout(()=>{ 
    window.location.href = '/signup-contact.html'; 
  }, 400); 
} 

document.addEventListener('keydown', e => { if(e.key === 'Enter') goNext(); }); 
</script> 
</body> 
</html>
