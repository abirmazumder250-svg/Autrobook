<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Autrobook - Sign Up (Name)</title>
<style>
:root{ --brand:#0f5132; --brand-light:#198754; --bg:#1c1c1e; --card:#2c2c2e; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);min-height:100vh;color:white}
.top{padding:15px}
.back{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.lang-select{text-align:center;margin:5px 0 25px}
.lang-select select{padding:8px 12px;border-radius:10px;border:1px solid #555;background:var(--card);color:white;font-size:15px;font-weight:bold;cursor:pointer}
.logo{text-align:center;margin-bottom:30px}
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--brand);box-shadow:0 4px 15px rgba(15,81,50,0.4)}
.wrap{padding:0 20px 40px;max-width:450px;margin:0 auto}
h2{font-size:22px;margin-bottom:6px}
p.sub{color:#aaa;font-size:14px;margin-bottom:25px}
label{font-size:14px;color:#aaa;margin-bottom:6px;display:block}
input{width:100%;padding:16px;border-radius:15px;border:1px solid #555;background:transparent;color:white;font-size:16px;margin-bottom:15px;outline:none}
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.2)}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px;color:#ff8a8a}
.progress{display:flex;gap:6px;max-width:450px;margin:0 auto 25px;padding:0 20px}
.progress div{flex:1;height:5px;border-radius:10px;background:#333}
.progress div.active{background:var(--brand-light)}
</style>
</head>
<body>

<div class="top"><div class="back" onclick="location.href='index.html'">←</div></div>

<div class="lang-select">
<select id="langSelect" onchange="changeLanguage()">
  <option value="en">English (US)</option>
  <option value="bn">বাংলা</option>
  <option value="hi">हिन्दी</option>
  <option value="ar">العربية</option>
  <option value="es">Español</option>
</select>
</div>

<div class="logo"><img src="logo.png" alt="Autrobook" onerror="this.style.display='none'"></div>
<div class="progress"><div class="active"></div><div></div><div></div></div>
<div class="wrap">
<h2 data-key="title">What's your name?</h2>
<p class="sub" data-key="subtitle">Enter the name you use in real life</p>

<label data-key="firstName">First Name</label>
<input type="text" id="firstName" data-placeholder="firstName" autocomplete="given-name">

<label data-key="surname">Surname</label>
<input type="text" id="surname" data-placeholder="surname" autocomplete="family-name">

<div class="msg" id="msg"></div>
<button class="btn" id="nextBtn" onclick="goNext()" data-key="next">Next</button>
<p style="text-align:center;margin-top:12px;font-size:13px;color:#aaa"><span data-key="haveAcc">Already have account?</span> <a href="index.html" style="color:#4CAF50;font-weight:bold">Login</a></p>
</div>

<script>
let currentLang = localStorage.getItem('lang') || 'en';
const translations = {
  en: { title:"What's your name?", subtitle:"Enter the name you use in real life", firstName:"First Name", surname:"Surname", next:"Next", haveAcc:"Already have account?", err1:"Enter your first name", err2:"Enter your surname" },
  bn: { title:"তোমার নাম কী?", subtitle:"তোমার আসল নামটি এখানে লিখো", firstName:"প্রথম নাম", surname:"শেষ নাম (পদবি)", next:"পরবর্তী", haveAcc:"আগেই অ্যাকাউন্ট আছে?", err1:"তোমার প্রথম নাম লিখো", err2:"তোমার শেষ নাম লিখো" },
  hi: { title:"आपका नाम क्या है?", subtitle:"वह नाम दर्ज करें जिसका आप वास्तविक जीवन में उपयोग करते हैं", firstName:"पहला नाम", surname:"उपनाम", next:"आगे", haveAcc:"पहले से अकाउंट है?", err1:"अपना पहला नाम दर्ज करें", err2:"अपना उपनाम दर्ज करें" },
  ar: { title:"ما هو اسمك؟", subtitle:"أدخل الاسم الذي تستخدمه في الحياة الواقعية", firstName:"الاسم الأول", surname:"اسم العائلة", next:"التالي", haveAcc:"هل لديك حساب؟", err1:"أدخل اسمك الأول", err2:"أدخل اسم عائلتك" },
  es: { title:"¿Cuál es tu nombre?", subtitle:"Ingresa el nombre que usas en la vida real", firstName:"Nombre", surname:"Apellido", next:"Siguiente", haveAcc:"¿Ya tienes cuenta?", err1:"Ingresa tu nombre", err2:"Ingresa tu apellido" }
};

function applyLanguage(lang){
  currentLang = lang; localStorage.setItem('lang', lang);
  document.body.style.direction = (lang==='ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang] && translations[lang][key]){ el.innerText = translations[lang][key]; }
  });
  document.querySelectorAll('[data-placeholder]').forEach(el => {
    const key = el.getAttribute('data-placeholder');
    if(translations[lang] && translations[lang][key]){ el.placeholder = translations[lang][key]; }
  });
}

window.changeLanguage = () => { applyLanguage(document.getElementById('langSelect').value); }
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langSelect').value = currentLang; applyLanguage(currentLang);
  
  // Restore if already typed
  if(localStorage.getItem('signup_firstName')) document.getElementById('firstName').value = localStorage.getItem('signup_firstName');
  if(localStorage.getItem('signup_surname')) document.getElementById('surname').value = localStorage.getItem('signup_surname');
});

function showMsg(t){ const el=document.getElementById('msg'); el.textContent=t; }

window.goNext = () => {
  const t = translations[currentLang] || translations.en;
  const fn = document.getElementById('firstName').value.trim();
  const sn = document.getElementById('surname').value.trim();
  
  if(!fn) return showMsg(t.err1);
  if(!sn) return showMsg(t.err2);
  
  localStorage.setItem('signup_firstName', fn);
  localStorage.setItem('signup_surname', sn);
  localStorage.setItem('signup_name', fn + ' ' + sn);
  
  location.href = 'signup-contact.html';
}
</script>
</body>
</html>
