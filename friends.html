<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Friends — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Friends CSS Link -->
  <link rel="stylesheet" href="css/friends.css">
</head>
<body>

  <!-- TOP NAV -->
  <header class="top-nav">
    <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
    <h2>Friends</h2>
    <div class="nav-actions">
      <button class="icon-btn"><i class="fas fa-search"></i></button>
    </div>
  </header>

  <div class="friends-container">
    
    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('requests', this)">Requests <span class="badge">2</span></button>
      <button class="tab-btn" onclick="switchTab('suggestions', this)">Suggestions</button>
      <button class="tab-btn" onclick="switchTab('all', this)">All Friends</button>
    </div>

    <!-- SEARCH BAR (Only visible in 'All Friends' tab) -->
    <div class="search-bar" id="friendSearchBar" style="display:none;">
      <i class="fas fa-search"></i>
      <input type="text" id="friendSearchInput" placeholder="Search friends..." oninput="filterFriends()">
    </div>

    <!-- CONTENT CONTAINER -->
    <div id="friendsContent">
      <!-- Content is dynamically rendered via JS -->
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bn-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i></div>
    <div class="bn-item active"><i class="fas fa-user-friends"></i></div>
    <div class="bn-item" onclick="window.location.href='groups.html'"><i class="fas fa-users"></i></div>
    <div class="bn-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i></div>
    <div class="bn-item" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i></div>
  </nav>

  <!-- Main JS Link -->
  <script src="js/friends.js"></script>
</body>
</html>
