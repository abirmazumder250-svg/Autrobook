<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   AUTROBOOK WELCOME — MODERN REDESIGN
   System theme · Dark green buttons · 2s logo animation
   ============================================================ */

:root{
  --green-900:#0d3b16;
  --green-800:#1b5e20;   /* ← PRIMARY BUTTON */
  --green-700:#2e7d32;
  --green-500:#43a047;
  --green-100:#e8f5e9;
  --green-50:#f1f8f2;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#1c1e21;
  --muted:#65676b;
  --border:#e4e6e9;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.12);
  --radius:20px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1419;
    --card:#1a1f26;
    --text:#e8eaed;
    --muted:#9aa0a6;
    --border:#2a3038;
    --green-100:#1c3320;
    --green-50:#0f1a12;
    --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  }
}

*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}

/* ===== DECORATIVE BACKGROUND ===== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(46,125,50,.12) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(46,125,50,.08) 0%, transparent 40%);
  pointer-events:none;
  z-index:0;
}

/* ===== ANIMATIONS ===== */
@keyframes logoPop{
  0%   { opacity:0; transform:scale(.2) rotate(-180deg); }
  55%  { opacity:1; transform:scale(1.15) rotate(12deg); }
  80%  { transform:scale(.95) rotate(-4deg); }
  100% { opacity:1; transform:scale(1) rotate(0deg); }
}

@keyframes glowPulse{
  0%,100% { box-shadow:0 0 24px rgba(46,125,50,.35), 0 0 60px rgba(46,125,50,.12); }
  50%     { box-shadow:0 0 36px rgba(46,125,50,.65), 0 0 80px rgba(46,125,50,.25); }
}

@keyframes fadeUp{
  from { opacity:0; transform:translateY(24px); }
  to   { opacity:1; transform:translateY(0); }
}

@keyframes slideIn{
  from { opacity:0; transform:translateX(-20px); }
  to   { opacity:1; transform:translateX(0); }
}

@keyframes shimmer{
  0%   { background-position:-200% 0; }
  100% { background-position:200% 0; }
}

/* ===== MAIN CARD ===== */
.card{
  position:relative;
  z-index:1;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:52px 44px 40px;
  max-width:440px;
  width:100%;
  text-align:center;
  border:1px solid var(--border);
  animation:fadeUp .7s ease-out .2s both;
}

/* ===== LOGO ===== */
.logo{
  width:112px;
  height:112px;
  margin:0 auto 24px;
  border-radius:28px;
  background:linear-gradient(145deg, var(--green-700), var(--green-900));
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  animation:
    logoPop 2s cubic-bezier(.34,1.56,.64,1) forwards,
    glowPulse 3s ease-in-out 2s infinite;
}
.logo::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,
    rgba(255,255,255,.15) 0%,
    transparent 40%,
    transparent 60%,
    rgba(255,255,255,.08) 100%);
  pointer-events:none;
}
.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:14px;
  position:relative;
  z-index:1;
}
.logo i{
  font-size:52px;
  color:#fff;
  position:relative;
  z-index:1;
}

/* ===== TEXT ===== */
h1{
  font-size:34px;
  font-weight:800;
  letter-spacing:-.5px;
  margin-bottom:10px;
  color:var(--text);
  animation:fadeUp .7s ease-out .8s both;
}
.tagline{
  font-size:14.5px;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:32px;
  animation:fadeUp .7s ease-out 1s both;
}

/* ===== BUTTONS ===== */
.actions{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:28px;
  animation:fadeUp .7s ease-out 1.2s both;
}

.btn{
  width:100%;
  padding:15px 20px;
  border-radius:14px;
  font-size:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  border:none;
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
  font-family:inherit;
}

/* PRIMARY — DARK GREEN */
.btn-primary{
  background:var(--green-800);
  color:#fff;
  box-shadow:0 4px 14px rgba(27,94,32,.3);
}
.btn-primary:hover{
  background:var(--green-700);
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(27,94,32,.4);
}
.btn-primary:active{
  transform:translateY(0) scale(.98);
}

/* SECONDARY — OUTLINED */
.btn-ghost{
  background:transparent;
  color:var(--green-800);
  border:2px solid var(--green-700);
  box-shadow:none;
}
@media (prefers-color-scheme: dark){
  .btn-ghost{ color:var(--green-500); border-color:var(--green-700); }
}
.btn-ghost:hover{
  background:var(--green-50);
  transform:translateY(-2px);
}
.btn-ghost:active{
  transform:translateY(0) scale(.98);
}

/* ===== 18+ BADGE ===== */
.age-badge{
  padding-top:22px;
  border-top:1px solid var(--border);
  animation:fadeUp .7s ease-out 1.4s both;
}

.badge-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg, var(--green-100), var(--green-50));
  color:var(--green-800);
  padding:9px 18px;
  border-radius:100px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.2px;
  border:1px solid var(--green-700);
  margin-bottom:10px;
}
@media (prefers-color-scheme: dark){
  .badge-pill{ color:var(--green-500); }
}
.badge-pill i{
  font-size:13px;
}

.badge-sub{
  display:block;
  font-size:11.5px;
  color:var(--muted);
  letter-spacing:.3px;
}

/* Feature dots row */
.feature-dots{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:18px;
  font-size:11px;
  color:var(--muted);
}
.feature-dots span{
  display:flex;
  align-items:center;
  gap:5px;
}
.feature-dots i{
  color:var(--green-700);
  font-size:10px;
}

/* ===== MOBILE ===== */
@media (max-width: 480px){
  .card{ padding:40px 26px 32px; }
  h1{ font-size:28px; }
  .logo{ width:92px; height:92px; border-radius:24px; }
  .logo i{ font-size:42px; }
  .btn{ padding:14px 16px; font-size:14px; }
  .feature-dots{ gap:12px; font-size:10.5px; }
}
</style>
</head>
<body>

<div class="card">

  <!-- Logo with 2s animation + glow -->
  <div class="logo">
    <img src="logo.png" alt="Autrobook Logo"
         onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-leaf\'></i>';">
  </div>

  <h1>Autrobook</h1>
  <p class="tagline">Connect. Create. Play. Everything you love in one calm, mindful space.</p>

  <div class="actions">
    <button class="btn btn-primary" onclick="go('signup-name.html')">
      <i class="fas fa-user-plus"></i> Create new account
    </button>
    <button class="btn btn-ghost" onclick="go('login.html')">
      <i class="fas fa-sign-in-alt"></i> I already have an account
    </button>
  </div>

  <!-- 18+ Free Social Media Badge -->
  <div class="age-badge">
    <div class="badge-pill">
      <i class="fas fa-shield-alt"></i> 18+ Free Social Media Platform
    </div>
    <span class="badge-sub">Safe · Mindful · Ad-free · No hidden fees</span>

    <div class="feature-dots">
      <span><i class="fas fa-check"></i> Free forever</span>
      <span><i class="fas fa-check"></i> No ads</span>
      <span><i class="fas fa-check"></i> Private</span>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
<script>if (getUser()) window.location.href = 'index.html';</script>
</body>
  </html>
