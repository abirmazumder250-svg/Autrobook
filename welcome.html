  <div class="accounts-list" id="accountsList"></div>

  <div class="btn-group">

    <button class="btn-create" onclick="window.location='login.html?mode=signup'">Create new account</button>
  </div>

  <div class="footer-meta">Autrobook</div>
</div>

<!-- Bottom Sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <button class="close-btn" onclick="closeSheet()">✕</button>
    <h3>Profiles</h3>
  </div>
  <button class="sheet-btn danger" onclick="removeAllAccounts()">Remove profiles from this device</button>
</div>

<script src="js/welcome.js"></script>
