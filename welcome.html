<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Autrobook</title>
<style>
  :root{
    --brand-green: #0f5132; /* Dark Green */
    --bg: #f4f6f8;
  }
  /* System Default Theme Support */
  @media (prefers-color-scheme: dark) {
    :root{
      --bg: #121212;
    }
    .welcome-card{
      background: #1e1e1e !important;
      color: #e0e0e0 !important;
    }
    .welcome-card p{
      color: #ccc !important;
    }
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .welcome-card{
    background: white;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  .welcome-card h1{
    color: var(--brand-green); /* Dark Green Text */
    font-size: 24px;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .welcome-card .subtitle{
    color: var(--brand-green); /* Dark Green Text */
    font-size: 13px;
    margin-bottom: 20px;
    opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .welcome-card p{
    color: #555;
    font-size: 15px;
    margin-bottom: 25px;
    line-height: 1.6;
  }
  .btn{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--brand-green); /* Dark Green Button */
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn:hover{
    background: #0b3d26;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="welcome-card">
    <h1>Welcome to Autrobook</h1>
    <p class="subtitle">Default theme</p>
    <p>You have successfully logged in and verified your account. <br>Click Continue to go to your Newsfeed.</p>
    <button class="btn" onclick="goToHome()">Continue</button>
  </div>

<script>
  // If user is not logged in, redirect to login page
  if(localStorage.getItem('ab_logged_in') !== '1'){
    window.location.href = 'login.html';
  }

  function goToHome(){
    // home folder er vitore home.html ache
    window.location.href = 'home/home.html'; 
  }
</script>

</body>
</html>
