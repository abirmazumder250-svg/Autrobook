<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="icon-btn" id="backBtn" onclick="showProfiles()"><i class="fas fa-arrow-left"></i></button><span></span>
    <!-- Theme Toggle Button -->
    <button class="icon-btn" onclick="toggleTheme()"><i id="themeIcon" class="fas fa-moon"></i></button>
  </div>
  
  <div class="lang" onclick="openLang()"><span id="langLabel">English (US)</span> <i class="fas fa-chevron-down" style="font-size:11px"></i></div>
  
  <div class="logo">
    <!-- আপনার লোগো ইমেজ এখানে দিন -->
    <img src="logo.png" alt="Autrobook" style="background:#043D22; padding:10px;">
    <h1>Autrobook</h1>
    <p data-i18n="tagline">Connect with friends • Safe • Mindful • Ad-free</p>
  </div>

  <div id="profileScreen">
    <div id="profileList"></div>
    <button class="use-another" data-i18n="use_another" onclick="showLogin(true)">Use another profile</button>
  </div>

  <div id="loginScreen" style="display:none">
    <div class="tabs">
      <button id="tabLogin" class="active" data-i18n="login_tab" onclick="switchTab('login')">Log In</button>
      <button id="tabSignup" data-i18n="signup_tab" onclick="switchTab('signup')">Create Account</button>
    </div>
    <div id="signupNameWrap" style="display:none"><input class="input" id="authName" type="text" data-i18n-ph="fullname" placeholder="Full Name"></div>
    <input class="input" id="authEmail" type="email" data-i18n-ph="email" placeholder="Mobile number or email">
    <input class="input" id="authPassword" type="password" data-i18n-ph="password" placeholder="Password">
    <div class="captcha"><div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d" data-callback="onCaptchaSuccess" data-expired-callback="onCaptchaExpired"></div></div>
    <p class="note" data-i18n="recaptcha">Protected by Google reCAPTCHA</p><br>
    <button class="btn-login" id="authSubmitBtn" data-i18n="login_btn" onclick="submitAuth()">Log in</button>
    <a class="link" data-i18n="forgot" onclick="forgotPassword()">Forgot password?</a>
    <button class="fp" id="fingerprintBtn" onclick="loginWithFingerprint()">👆 <span data-i18n="fingerprint">Log in with Fingerprint / Face ID</span></button>
    <p class="note" id="fpNote"></p>
    <a class="link" data-i18n="guest" onclick="continueAsGuest()">Continue as Guest 👀</a>
  </div>

  <div class="spacer"></div>

  <div class="footer">
    <button class="btn-create" data-i18n="create_new" onclick="showLogin();switchTab('signup')">Create new account</button>
    <div class="footer-small">
      <b data-i18n="footer1">18+ Free Social Media Platform</b><br>
      <span data-i18n="footer2">Stay Safe</span>
    </div>
  </div>
</div>

<!-- Language Modal -->
<div class="modal lang-modal" id="langModal">
  <div class="modal-card">
    <div class="lang-head"><b data-i18n="choose_lang">Choose Language</b><button onclick="closeLang()">×</button></div>
    <div class="lang-search"><input id="langSearch" placeholder="Search country / language..." oninput="filterLang()"></div>
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<!-- Remove Profile Modal -->
<div class="modal" id="mRemoveProfile">
  <div class="modal-card">
    <h3>Remove Profile?</h3>
    <p class="note" style="margin-top:8px">What do you want to do with this profile?</p>
    <button class="btn-grey" onclick="removeProfileOnly()">Remove from this device only</button>
    <button class="btn-danger" onclick="deleteAccountPermanently()">Delete Account Permanently</button>
    <a class="link" onclick="closeRemoveProfile()">Cancel</a>
  </div>
</div>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
