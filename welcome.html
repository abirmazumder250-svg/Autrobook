<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Autrobook</title>
<style>
  :root{
    --brand-green: #198754; /* Dark Green */
    --brand-green-hover: #157347;
    --bg: #f4f6f4;
    --card-bg: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --border-color: rgba(25, 135, 84, 0.12);
  }

  /* System Default Theme Support (Dark Mode) */
  @media (prefers-color-scheme: dark) {
    :root{
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(25, 135, 84, 0.25);
    }
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif}
  
  body{
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .welcome-card{
    background: var(--card-bg);
    padding: 36px 28px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
    border: 1px solid var(--border-color);
    transition: background 0.3s, border 0.3s;
  }

  /* Small Logo Styling */
  .logo-container {
    margin-bottom: 18px;
  }
  
  .logo-container img {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 4px 12px rgba(25, 135, 84, 0.15);
  }

  .welcome-card h1{
    color: var(--brand-green);
    font-size: 22px;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .welcome-card p{
    color: var(--text-muted);
    font-size: 14.5px;
    margin-bottom: 28px;
    line-height: 1.6;
  }

  .btn{
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--brand-green);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(25, 135, 84, 0.25);
  }

  .btn:hover{
    background: var(--brand-green-hover);
    transform: translateY(-1px);
  }

  .btn:active{
    transform: translateY(0);
  }
</style>
</head>
<body>
  <div class="welcome-card">
    <div class="logo-container">
      <img src="logo.png" alt="Autrobook Logo" onerror="this.style.display='none'">
    </div>
    <h1>Welcome to Autrobook</h1>
    <p>You have successfully logged in and verified your account. <br>Click Continue to go to your Newsfeed.</p>
    <button class="btn" onclick="goToHome()">Continue</button>
  </div>

<script>
  // If user is not logged in, redirect to login page
  if(localStorage.getItem('ab_logged_in') !== '1'){
    window.location.href = 'login.html';
  }

  function goToHome(){
    // home folder er vitore home.html ache
    window.location.href = 'home/home.html'; 
  }
</script>

</body>
</html>
