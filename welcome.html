<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<!-- reCAPTCHA v2 - SITE KEY BOSANO -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{--primary:#043D22;--bg:#f0f2f5;--card:#ffffff;--text:#1c1e21;--muted:#65676b;--border:#e4e6e9;--input-bg:#fafafa;--error:#c62828;--success:#2e7d32;--shadow:0 10px 40px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){:root{--primary:#2e7d32;--bg:#0f1419;--card:#1a1f26;--text:#e8eaed;--muted:#9aa0a6;--border:#2a3038;--input-bg:#0f1419;--error:#ef5350;--success:#66bb6a;--shadow:0 10px 40px rgba(0,0,0,.4)}}
*{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border-radius:20px;padding:28px;box-shadow:var(--shadow);border:1px solid var(--border)}
.logo-img{width:100%;max-width:260px;display:block;margin:0 auto;object-fit:contain}
.logo-box{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#043D22,#2e7d32);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;margin:0 auto}
h1{text-align:center;font-size:28px;margin:14px 0 4px}
.sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:14px 0 6px;text-transform:uppercase}
.field{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1.5px solid var(--border);border-radius:14px;padding:13px 14px}
.field:focus-within{border-color:var(--primary)}
.field i{color:var(--muted)}
.field input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;width:100%}
.field button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.forgot{display:block;text-align:right;color:#2e7d32;font-weight:700;font-size:14px;margin:10px 0 0;text-decoration:none}
.btn{width:100%;background:#043D22;color:#fff;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#032a17}
.btn:disabled{opacity:.6;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.bio-btn{width:64px;height:64px;border-radius:50%;background:#043D22;color:#fff;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto}
.msg{display:none;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;margin-top:12px;text-align:center}
.msg.err{display:block;background:#fdecea;color:#c62828}
.msg.ok{display:block;background:#e6f4ea;color:#2e7d32}
.captcha-box{margin-top:16px;display:flex;justify-content:center}
.demo{margin-top:16px;background:var(--input-bg);border:1px dashed var(--border);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
.demo b{color:var(--text)}
.links{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.links a{color:#2e7d32;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<!-- LOGO: logo.png -->
<img src="logo.png" class="logo-img" onerror="this.style.display='none';document.getElementById('logoIcon').style.display='flex'">
<div id="logoIcon" class="logo-box" style="display:none"><i class="fa-solid fa-right-to-bracket"></i></div>
<h1>Welcome back</h1>
<p class="sub">Log in to continue to Autrobook</p>

<form id="loginForm" onsubmit="doLogin(event)">
<label>Email Address</label>
<div class="field"><i class="fa-solid fa-envelope"></i><input id="email" type="email" placeholder="you@example.com" required></div>

<label>Password</label>
<div class="field"><i class="fa-solid fa-lock"></i><input id="password" type="password" placeholder="Enter your password" required><button type="button" onclick="togglePass()">👁️</button></div>

<a class="forgot" href="forgot.html">Forgot password?</a>

<!-- reCAPTCHA - SITE KEY -->
<div class="captcha-box">
<div class="g-recaptcha" data-sitekey="6Lck5SAuAAAAAJAip9tn4qoVcWnHp02-yusatinK"></div>
</div>

<div id="msg" class="msg"></div>

<button id="loginBtn" class="btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Log in</button>
</form>

<div class="divider">or use biometric</div>
<button class="bio-btn" onclick="bioLogin()">🖐️</button>

<div class="demo">
Demo Account<br>
<b>Email:</b> demo@autrobook.com<br>
<b>Password:</b> 123456<br>
<button onclick="fillDemo()" style="margin-top:8px;background:#043D22;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer">Use Demo Account</button>
</div>

<div class="links">Don't have an account? <a href="signup.html">Create account</a><br><br><a href="index.html">Continue as Guest →</a></div>
</div>
</div>

<script>
function showMsg(text,isError){var m=document.getElementById('msg');m.textContent=text;m.className='msg '+(isError?'err':'ok')}
function togglePass(){var p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}
function fillDemo(){document.getElementById('email').value='demo@autrobook.com';document.getElementById('password').value='123456';showMsg('Demo filled. Now tick reCAPTCHA and tap Log in.',false)}
function getUsers(){try{return JSON.parse(localStorage.getItem('autro_users')||'[]')}catch(e){return[]}}
function doLogin(e){
  e.preventDefault();
  var email=document.getElementById('email').value.trim().toLowerCase();
  var pass=document.getElementById('password').value;
  var btn=document.getElementById('loginBtn');
  if(!email||!pass){showMsg('Please enter email and password.',true);return}
  if(typeof grecaptcha==='undefined'){showMsg('reCAPTCHA loading... Please wait 2 sec and try again.',true);return}
  var token=grecaptcha.getResponse();
  if(!token){showMsg("Please tick 'I'm not a robot' first.",true);return}
  btn.disabled=true;btn.innerHTML='Verifying...';
  if(email==='demo@autrobook.com' && pass==='123456'){loginSuccess(email,'Demo User');return}
  var users=getUsers();
  var found=users.find(u=>(u.email||'').toLowerCase()===email);
  if(found){
    if(found.password===pass){loginSuccess(email,found.name||'User');return}
    showMsg('Wrong password. Try Forgot password?',true);btn.disabled=false;btn.innerHTML='Log in';grecaptcha.reset();return;
  }
  loginSuccess(email,email.split('@')[0]);
}
function loginSuccess(email,name){
  localStorage.setItem('autro_logged_in','1');
  localStorage.setItem('autro_user_email',email);
  localStorage.setItem('autro_user_name',name);
  showMsg('Login successful! Redirecting...',false);
  setTimeout(function(){window.location.href='index.html'},600);
}
function bioLogin(){
  showMsg('Biometric verified. Logging in...',false);
  setTimeout(function(){loginSuccess('demo@autrobook.com','Demo User')},500);
}
</script>
</body>
</html>
