<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{--primary:#043D22;--bg:#f0f2f5;--card:#fff;--text:#1c1e21;--muted:#65676b;--border:#e4e6e9;--input-bg:#fafafa;--error:#c62828;--success:#2e7d32;--shadow:0 10px 40px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){:root{--primary:#2e7d32;--bg:#0f1419;--card:#1a1f26;--text:#e8eaed;--muted:#9aa0a6;--border:#2a3038;--input-bg:#0f1419;--error:#ef5350;--success:#66bb6a}}
*{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border-radius:20px;padding:28px;box-shadow:var(--shadow);border:1px solid var(--border)}
.logo-img{width:100%;max-width:240px;display:block;margin:0 auto}
h1{text-align:center;font-size:28px;margin:14px 0 4px}
.sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
.field{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1.5px solid var(--border);border-radius:14px;padding:13px 14px}
.field:focus-within{border-color:var(--primary)}
.field input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;width:100%}
.field button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.forgot{display:block;text-align:right;color:#2e7d32;font-weight:700;font-size:14px;margin:10px 0 0;background:none;border:none;cursor:pointer}
.btn{width:100%;background:#043D22;color:#fff;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.6}
.btn-outline{width:100%;background:#e6f4ea;color:#043D22;border:2px solid #043D22;border-radius:14px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-green{width:100%;background:#043D22;color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
.msg{display:none;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;margin-top:12px;text-align:center}
.msg.err{display:block;background:#fdecea;color:#c62828}
.msg.ok{display:block;background:#e6f4ea;color:#2e7d32}
.captcha-box{margin-top:16px;display:flex;justify-content:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-card{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:24px;position:relative}
.close{position:absolute;right:16px;top:14px;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.links{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.links a{color:#2e7d32;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<img src="logo.png" class="logo-img" onerror="this.style.display='none'">
<h1>Autrobook</h1>
<p class="sub">Connect. Create. Play. Mindfully.</p>

<form onsubmit="doLogin(event)">
<label>Email / Username</label>
<div class="field"><input id="email" type="text" placeholder="Email or username" required></div>
<label>Password</label>
<div class="field"><input id="password" type="password" placeholder="Password" required><button type="button" onclick="togglePass()">👁️</button></div>
<button type="button" class="forgot" onclick="openForgot()">Forgot password?</button>

<div class="captcha-box"><div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d"></div></div>

<div id="msg" class="msg"></div>
<button id="loginBtn" class="btn" type="submit">Log In</button>
</form>

<button class="btn-outline" onclick="passkeyLogin()">👆 Use Fingerprint</button>
<button class="btn-green" onclick="location.href='signup.html'">Create New Account</button>
<div class="links"><a href="index.html">Continue as Guest →</a></div>
</div>
</div>

<div id="forgotModal" class="modal">
<div class="modal-card">
<button class="close" onclick="closeForgot()">×</button>
<div id="forgotStep1"><h2>Forgot Password?</h2><p style="color:#65676b;font-size:14px;margin:6px 0 14px">Enter your email.</p>
<label>Email</label><div class="field"><input id="forgotEmail" type="email" placeholder="you@example.com"></div>
<div id="forgotMsg" class="msg"></div><button class="btn" onclick="sendResetCode()">Send Reset Code</button></div>
<div id="forgotStep2" style="display:none"><h2>Enter Reset Code</h2><p style="color:#65676b;font-size:14px;margin:6px 0 14px">Demo Code: <b>123456</b></p>
<label>Reset Code</label><div class="field"><input id="resetCode" placeholder="123456"></div>
<label>New Password</label><div class="field"><input id="newPass" type="password" placeholder="New password"></div>
<div id="forgotMsg2" class="msg"></div><button class="btn" onclick="resetPassword()">Reset Password</button></div>
</div>
</div>

<script>
var captchaFailed=false;
window.addEventListener('load',function(){setTimeout(function(){var b=document.querySelector('.g-recaptcha');if(b&&(b.innerText.indexOf('ERROR')!==-1||!b.querySelector('iframe')))captchaFailed=true},3000)});
function showMsg(t,e){var m=document.getElementById('msg');m.textContent=t;m.className='msg '+(e?'err':'ok')}
function togglePass(){var p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}
function getUsers(){try{return JSON.parse(localStorage.getItem('autro_users')||'[]')}catch(e){return[]}}
function saveUsers(u){localStorage.setItem('autro_users',JSON.stringify(u))}
function doLogin(e){e.preventDefault();var email=document.getElementById('email').value.trim().toLowerCase();var pass=document.getElementById('password').value;var btn=document.getElementById('loginBtn');if(!email||!pass){showMsg('Please enter email and password.',true);return}
var token='';try{if(typeof grecaptcha!=='undefined')token=grecaptcha.getResponse()}catch(err){}
var box=document.querySelector('.g-recaptcha');var isErr=captchaFailed||(box&&box.innerText.indexOf('ERROR')!==-1);
if(!isErr&&!token){showMsg("Please tick 'I'm not a robot' first.",true);return}
btn.disabled=true;btn.innerHTML='Logging in...';
if(email==='demo@autrobook.com'&&pass==='123456'){loginSuccess(email,'Demo User');return}
var f=getUsers().find(u=>(u.email||'').toLowerCase()===email||(u.username||'').toLowerCase()===email);
if(f){if(f.password===pass){loginSuccess(email,f.name||'User');return}showMsg('Wrong password.',true);btn.disabled=false;btn.innerHTML='Log In';try{grecaptcha.reset()}catch(e){};return}
loginSuccess(email,email.split('@')[0])}
function loginSuccess(email,name){localStorage.setItem('autro_logged_in','1');localStorage.setItem('autro_user_email',email);localStorage.setItem('autro_user_name',name);showMsg('Login successful!',false);setTimeout(function(){window.location.href='index.html'},600)}
function openForgot(){document.getElementById('forgotModal').classList.add('open');document.getElementById('forgotStep1').style.display='block';document.getElementById('forgotStep2').style.display='none';var em=document.getElementById('email').value;if(em&&em.includes('@'))document.getElementById('forgotEmail').value=em}
function closeForgot(){document.getElementById('forgotModal').classList.remove('open')}
function sendResetCode(){var email=document.getElementById('forgotEmail').value.trim().toLowerCase();var m=document.getElementById('forgotMsg');if(!email){m.textContent='Please enter email.';m.className='msg err';return}localStorage.setItem('autro_reset_email',email);document.getElementById('forgotStep1').style.display='none';document.getElementById('forgotStep2').style.display='block'}
function resetPassword(){var code=document.getElementById('resetCode').value.trim();var np=document.getElementById('newPass').value;var m=document.getElementById('forgotMsg2');if(code!=='123456'){m.textContent='Wrong code. Demo code is 123456';m.className='msg err';return}if(!np||np.length<4){m.textContent='New password must be 4+ characters.';m.className='msg err';return}var email=localStorage.getItem('autro_reset_email');var users=getUsers();var f=users.find(u=>(u.email||'').toLowerCase()===email);if(!f){m.textContent='No account found. Please signup first.';m.className='msg err';return}f.password=np;saveUsers(users);m.textContent='Password changed!';m.className='msg ok';setTimeout(function(){closeForgot();document.getElementById('email').value=email;document.getElementById('password').value=np},1000)}
function bufToB64(b){return btoa(String.fromCharCode(...new Uint8Array(b)))}
function b64ToBuf(b64){var s=atob(b64);var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
async function passkeyLogin(){
var email=document.getElementById('email').value.trim().toLowerCase()||localStorage.getItem('autro_passkey_email')||'demo@autrobook.com';
if(!window.PublicKeyCredential){showMsg('Use Chrome for Fingerprint.',true);return}
var keys=JSON.parse(localStorage.getItem('autro_passkeys')||'{}');
try{
showMsg('Touch your fingerprint sensor...',false);
var ch=new Uint8Array(32);crypto.getRandomValues(ch);
var allow=[];if(keys[email])allow=[{id:b64ToBuf(keys[email]),type:'public-key',transports:['internal']}];
await navigator.credentials.get({publicKey:{challenge:ch,rpId:location.hostname,allowCredentials:allow,userVerification:'required',timeout:60000}});
loginSuccess(email,email.split('@')[0]);
}catch(err){
// Passkey na thakle - ekhanei baniye nibe, alada button lagbe na
if(!keys[email]){
if(!confirm('No Fingerprint found. Create now?')){showMsg('Fingerprint cancelled.',true);return}
try{
if(!email.includes('@'))email=prompt('Enter your Email for Passkey:','')||email;
showMsg('Touch your fingerprint sensor...',false);
var ch2=new Uint8Array(32);crypto.getRandomValues(ch2);
var cred=await navigator.credentials.create({publicKey:{challenge:ch2,rp:{name:'Autrobook',id:location.hostname},user:{id:new TextEncoder().encode(email),name:email,displayName:email},pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});
keys[email]=bufToB64(cred.rawId);localStorage.setItem('autro_passkeys',JSON.stringify(keys));localStorage.setItem('autro_passkey_email',email);
showMsg('✅ Fingerprint created! Tap Use Fingerprint again.',false);
}catch(e){showMsg('Fingerprint cancelled.',true)}
}else{showMsg('Fingerprint cancelled.',true)}
}}
</script>
</body>
</html>
