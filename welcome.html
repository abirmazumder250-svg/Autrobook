<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#043D22">
<title>Autrobook</title>
<link rel="stylesheet" href="css/welcome.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="switcher-wrap">
  <div class="top-bar">
    <select class="lang-select" id="langSelect" onchange="changeLanguage()">
      <option value="en">English - US</option>
      <option value="bn">বাংলা - Bangladesh</option>
      <option value="hi">हिन्दी - India</option>
      <option value="es">Español - Spain</option>
      <option value="fr">Français - France</option>
      <option value="ar">العربية - Arabic</option>
      <option value="pt">Português - Portugal</option>
      <option value="de">Deutsch - Germany</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="tr">Türkçe - Türkiye</option>
    </select>
    <button class="menu-btn" onclick="openSheet()">⋯</button>
  </div>

  <div class="logo-section">
    <div class="top-logo">
      <img src="logo.png" alt="Autrobook" onerror="this.src='data:image/svg+xml;base64,[STRIPPED]'">
    </div>
  </div>

  <div class="accounts-list" id="accountsList"></div>

  <div class="spacer"></div>

  <div class="btn-group">
    <button class="btn-other" id="btnOther" onclick="goToLogin()">Use another profile</button>
    <button class="btn-create" id="btnCreate" onclick="window.location='login.html?mode=signup'">Create new account</button>
  </div>

  <div class="footer-wrap">
    <div class="footer-meta">Autrobook</div>
    <div class="footer-tagline">18+ Free Social Media Platform</div>
  </div>
</div>

<!-- Bottom Sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <button class="close-btn" onclick="closeSheet()">✕</button>
    <h3 id="sheetTitle">Profiles</h3>
  </div>
  <button class="sheet-btn danger" id="btnRemove" onclick="removeAllAccounts()">Remove profiles from this device</button>
</div>

<script src="js/welcome.js"></script>
</body>
</html>
