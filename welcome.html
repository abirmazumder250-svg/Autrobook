<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Autrobook</title>
<style>
  :root{
    --brand-green: #0f5132; /* Dark Green */
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{
    background: #f4f6f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .welcome-card{
    background: white;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  .welcome-card h1{
    color: var(--brand-green); /* Dark Green Text */
    font-size: 22px;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .welcome-card .subtitle{
    color: var(--brand-green); /* Dark Green Text */
    font-size: 13px;
    margin-bottom: 20px;
    opacity: 0.8;
  }
  .welcome-card p{
    color: #555;
    font-size: 15px;
    margin-bottom: 25px;
  }
  .btn{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--brand-green); /* Dark Green Button, Red removed */
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn:hover{
    background: #0b3d26;
  }
</style>
</head>
<body>
<div class="welcome-card">
  <h1>Welcome to out Autrobook System</h1>
  <p class="subtitle">defalut theme</p>
  <p>You have successfully logged in / verified your account.</p>
  <button class="btn" onclick="goToHome()">Continue</button>
</div>

<script>
  // যদি ইউজার লগইন না করে সরাসরি পেজে ঢুকতে চায়
  if(localStorage.getItem('ab_logged_in') !== '1'){
    window.location.href = 'login.html';
  }

  function goToHome(){
    window.location.href = 'home.html'; // Home/Newsfeed এ পাঠাবে
  }
</script>
</body>
</html>
