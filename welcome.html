<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Welcome to Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{
  --primary:#043D22;
  --primary-light:#0b5d3b;
  --primary-glow:rgba(4,61,34,.25);
  --accent:#10b981;
  --bg:#f5f7f9;
  --bg-pattern:radial-gradient(circle at 20% 20%,rgba(4,61,34,.06),transparent 40%),
                radial-gradient(circle at 80% 80%,rgba(16,185,129,.06),transparent 40%);
  --card:#ffffff;
  --text:#0f1720;
  --muted:#6b7280;
  --border:#e5e7eb;
  --input-bg:#f9fafb;
  --error:#dc2626;
  --error-bg:#fef2f2;
  --success:#059669;
  --success-bg:#ecfdf5;
  --shadow:0 20px 60px rgba(4,61,34,.08),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --primary:#10b981;
    --primary-light:#34d399;
    --primary-glow:rgba(16,185,129,.25);
    --bg:#0a0f14;
    --bg-pattern:radial-gradient(circle at 20% 20%,rgba(16,185,129,.08),transparent 40%),
                  radial-gradient(circle at 80% 80%,rgba(16,185,129,.06),transparent 40%);
    --card:#131a22;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --border:#1e293b;
    --input-bg:#0a0f14;
    --error:#f87171;
    --error-bg:#3b1216;
    --success:#34d399;
    --success-bg:#0d2b21;
    --shadow:0 20px 60px rgba(0,0,0,.5);
  }
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);
  background-image:var(--bg-pattern);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow-x:hidden;
}
/* Floating decorative blobs */
body::before,body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(80px);
  opacity:.35;
  z-index:0;
  pointer-events:none;
}
body::before{
  width:400px;height:400px;
  background:radial-gradient(circle,var(--primary-light),transparent 70%);
  top:-150px;right:-150px;
}
body::after{
  width:350px;height:350px;
  background:radial-gradient(circle,var(--accent),transparent 70%);
  bottom:-120px;left:-120px;
}
.wrap{
  width:100%;
  max-width:440px;
  position:relative;
  z-index:1;
  animation:slideUp .5s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.card{
  background:var(--card);
  border-radius:24px;
  padding:36px 32px 32px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary));
  background-size:200% 100%;
  animation:gradientMove 4s linear infinite;
}
@keyframes gradientMove{
  0%{background-position:0% 50%}
  100%{background-position:200% 50%}
}

/* Logo */
.logo-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:8px;
}
.logo-img{
  width:56px;
  height:56px;
  object-fit:contain;
  border-radius:14px;
  box-shadow:0 4px 14px var(--primary-glow);
}
.logo-fallback{
  width:56px;
  height:56px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  display:none;
  align-items:center;
  justify-content:center;
  font-size:26px;
  color:#fff;
  box-shadow:0 4px 14px var(--primary-glow);
}
h1{
  text-align:center;
  font-size:26px;
  font-weight:800;
  color:var(--text);
  margin:12px 0 6px;
  letter-spacing:-.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
h1 .brand-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:20px;height:20px;
  border-radius:50%;
  background:linear-gradient(135deg,#111,#333);
  color:#fff;
  font-size:10px;
  box-shadow:0 0 0 2px var(--card),0 0 0 3px rgba(0,0,0,.08);
}
.sub{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:26px;
  line-height:1.5;
}

/* Labels */
label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin:16px 0 8px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

/* Input fields */
.field{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--input-bg);
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  transition:all .2s ease;
}
.field:focus-within{
  border-color:var(--primary);
  background:var(--card);
  box-shadow:0 0 0 4px var(--primary-glow);
}
.field > i{
  color:var(--muted);
  font-size:15px;
  width:18px;
  text-align:center;
  flex-shrink:0;
  transition:color .2s;
}
.field:focus-within > i{color:var(--primary)}
.field input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:var(--text);
  font-size:15px;
  font-weight:500;
  width:100%;
}
.field input::placeholder{color:var(--muted);font-weight:400;opacity:.7}
.field .toggle-pass{
  background:none;
  border:none;
  color:var(--muted);
  font-size:16px;
  cursor:pointer;
  padding:4px;
  transition:color .2s;
}
.field .toggle-pass:hover{color:var(--primary)}

/* Forgot link */
.forgot-row{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}
.forgot{
  color:var(--primary);
  font-weight:700;
  font-size:13px;
  background:none;
  border:none;
  cursor:pointer;
  padding:4px 0;
  transition:opacity .2s;
}
.forgot:hover{opacity:.75;text-decoration:underline}

/* Buttons */
.btn{
  width:100%;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:20px;
  transition:transform .15s,box-shadow .2s,opacity .2s;
  box-shadow:0 4px 14px var(--primary-glow);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px var(--primary-glow)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.65;cursor:not-allowed}

.btn-outline{
  width:100%;
  background:transparent;
  color:var(--primary);
  border:2px solid var(--primary);
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
  transition:background .2s,color .2s,transform .15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-outline:active{transform:scale(.99)}

/* Divider */
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:20px 0 8px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.divider::before,.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border);
}

/* Messages */
.msg{
  display:none;
  padding:12px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  margin-top:14px;
  text-align:center;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.msg.err{display:flex;background:var(--error-bg);color:var(--error);border:1px solid rgba(220,38,38,.2)}
.msg.ok{display:flex;background:var(--success-bg);color:var(--success);border:1px solid rgba(5,150,105,.2)}

/* Captcha */
.captcha-box{
  margin-top:18px;
  display:flex;
  justify-content:center;
  transform-origin:center;
  min-height:78px;
}

/* Links */
.links{
  text-align:center;
  margin-top:20px;
  font-size:14px;
  color:var(--muted);
}
.links a{
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:opacity .2s;
}
.links a:hover{opacity:.75;text-decoration:underline}

/* Modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:16px;
  animation:fadeIn .2s ease;
}
.modal.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:var(--card);
  width:100%;
  max-width:420px;
  border-radius:22px;
  padding:28px;
  position:relative;
  box-shadow:0 24px 70px rgba(0,0,0,.4);
  animation:modalIn .3s cubic-bezier(.16,1,.3,1);
  border:1px solid var(--border);
}
@keyframes modalIn{
  from{opacity:0;transform:scale(.94) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.modal-card h2{
  font-size:22px;
  font-weight:800;
  margin-bottom:6px;
  letter-spacing:-.4px;
  display:flex;
  align-items:center;
  gap:10px;
}
.modal-card h2 i{color:var(--primary);font-size:20px}
.modal-card p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:16px;
  line-height:1.5;
}
.modal-card p b{color:var(--primary);font-weight:800}
.close{
  position:absolute;
  right:16px;
  top:14px;
  border:none;
  background:var(--input-bg);
  width:32px;
  height:32px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .2s;
  line-height:1;
}
.close:hover{background:var(--error-bg);color:var(--error);transform:rotate(90deg)}

/* Footer */
.footer-note{
  text-align:center;
  margin-top:24px;
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.footer-note i{color:var(--primary);font-size:12px}

/* Responsive */
@media (max-width:480px){
  .card{padding:28px 22px 24px;border-radius:20px}
  h1{font-size:23px}
  .logo-img,.logo-fallback{width:48px;height:48px}
  .captcha-box{transform:scale(.92)}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <!-- LOGO -->
    <div class="logo-wrap">
      <img src="logo.png" alt="Autrobook" class="logo-img"
           onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'">
      <div class="logo-fallback"><i class="fas fa-leaf"></i></div>
    </div>

    <h1>Autrobook <span class="brand-badge"><i class="fas fa-check"></i></span></h1>
    <p class="sub">Connect. Create. Play. Mindfully.</p>

    <form onsubmit="doLogin(event)">

      <label>Email or Username</label>
      <div class="field">
        <i class="fas fa-user"></i>
        <input id="email" type="text" placeholder="you@example.com" required autocomplete="username">
      </div>

      <label>Password</label>
      <div class="field">
        <i class="fas fa-lock"></i>
        <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
        <button type="button" class="toggle-pass" onclick="togglePass()" title="Show password">
          <i class="fas fa-eye" id="eyeIcon"></i>
        </button>
      </div>

      <div class="forgot-row">
        <button type="button" class="forgot" onclick="openForgot()">Forgot password?</button>
      </div>

      <div class="captcha-box">
        <div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d"></div>
      </div>

      <div id="msg" class="msg"></div>

      <button id="loginBtn" class="btn" type="submit">
        <i class="fas fa-right-to-bracket"></i>
        <span>Log In</span>
      </button>
    </form>

    <div class="divider">or</div>

    <button class="btn-outline" onclick="passkeyLogin()">
      <i class="fas fa-fingerprint"></i>
      <span>Use Fingerprint</span>
    </button>

    <button class="btn" onclick="location.href='signup.html'" style="margin-top:12px">
      <i class="fas fa-user-plus"></i>
      <span>Create New Account</span>
    </button>

    <div class="links">
      <a href="index.html">
        <i class="fas fa-arrow-right"></i>
        Continue as Guest
      </a>
    </div>

  </div>

  <div class="footer-note">
    <i class="fas fa-shield-halved"></i>
    Protected by Autrobook Shield
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="forgotModal" class="modal">
  <div class="modal-card">
    <button class="close" onclick="closeForgot()">×</button>

    <div id="forgotStep1">
      <h2><i class="fas fa-key"></i> Forgot Password?</h2>
      <p>Enter your registered email address to receive a reset code.</p>
      <label>Email Address</label>
      <div class="field">
        <i class="fas fa-envelope"></i>
        <input id="forgotEmail" type="email" placeholder="you@example.com">
      </div>
      <div id="forgotMsg" class="msg"></div>
      <button class="btn" onclick="sendResetCode()">
        <i class="fas fa-paper-plane"></i>
        <span>Send Reset Code</span>
      </button>
    </div>

    <div id="forgotStep2" style="display:none">
      <h2><i class="fas fa-shield-halved"></i> Enter Reset Code</h2>
      <p>Demo code: <b>123456</b></p>
      <label>Reset Code</label>
      <div class="field">
        <i class="fas fa-hashtag"></i>
        <input id="resetCode" placeholder="123456" inputmode="numeric" maxlength="6">
      </div>
      <label>New Password</label>
      <div class="field">
        <i class="fas fa-lock"></i>
        <input id="newPass" type="password" placeholder="Enter new password">
      </div>
      <div id="forgotMsg2" class="msg"></div>
      <button class="btn" onclick="resetPassword()">
        <i class="fas fa-check"></i>
        <span>Reset Password</span>
      </button>
    </div>
  </div>
</div>

<script>
var captchaFailed = false;

window.addEventListener('load', function () {
  setTimeout(function () {
    var b = document.querySelector('.g-recaptcha');
    if (b && (b.innerText.indexOf('ERROR') !== -1 || !b.querySelector('iframe'))) {
      captchaFailed = true;
    }
  }, 3000);
});

function showMsg(t, e) {
  var m = document.getElementById('msg');
  m.innerHTML = (e ? '<i class="fas fa-circle-exclamation"></i> ' : '<i class="fas fa-circle-check"></i> ') + t;
  m.className = 'msg ' + (e ? 'err' : 'ok');
}

function togglePass() {
  var p = document.getElementById('password');
  var i = document.getElementById('eyeIcon');
  if (p.type === 'password') {
    p.type = 'text';
    i.className = 'fas fa-eye-slash';
  } else {
    p.type = 'password';
    i.className = 'fas fa-eye';
  }
}

function getUsers() {
  try { return JSON.parse(localStorage.getItem('autro_users') || '[]'); }
  catch (e) { return []; }
}
function saveUsers(u) {
  localStorage.setItem('autro_users', JSON.stringify(u));
}

function doLogin(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var pass = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');

  if (!email || !pass) {
    showMsg('Please enter email and password.', true);
    return;
  }

  var token = '';
  try { if (typeof grecaptcha !== 'undefined') token = grecaptcha.getResponse(); } catch (err) {}
  var box = document.querySelector('.g-recaptcha');
  var isErr = captchaFailed || (box && box.innerText.indexOf('ERROR') !== -1);

  if (!isErr && !token) {
    showMsg("Please tick 'I'm not a robot' first.", true);
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Logging in...</span>';

  if (email === 'demo@autrobook.com' && pass === '123456') {
    loginSuccess(email, 'Demo User');
    return;
  }

  var f = getUsers().find(u => (u.email || '').toLowerCase() === email || (u.username || '').toLowerCase() === email);

  if (f) {
    if (f.password === pass) {
      loginSuccess(email, f.name || 'User');
      return;
    }
    showMsg('Wrong password.', true);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-right-to-bracket"></i><span>Log In</span>';
    try { grecaptcha.reset(); } catch (e) {}
    return;
  }

  loginSuccess(email, email.split('@')[0]);
}

function loginSuccess(email, name) {
  localStorage.setItem('autro_logged_in', '1');
  localStorage.setItem('autro_user_email', email);
  localStorage.setItem('autro_user_name', name);
  showMsg('Login successful! Redirecting...', false);
  setTimeout(function () { window.location.href = 'index.html'; }, 700);
}

function openForgot() {
  document.getElementById('forgotModal').classList.add('open');
  document.getElementById('forgotStep1').style.display = 'block';
  document.getElementById('forgotStep2').style.display = 'none';
  var em = document.getElementById('email').value;
  if (em && em.includes('@')) document.getElementById('forgotEmail').value = em;
}
function closeForgot() {
  document.getElementById('forgotModal').classList.remove('open');
}
function sendResetCode() {
  var email = document.getElementById('forgotEmail').value.trim().toLowerCase();
  var m = document.getElementById('forgotMsg');
  if (!email) {
    m.innerHTML = '<i class="fas fa-circle-exclamation"></i> Please enter email.';
    m.className = 'msg err';
    return;
  }
  localStorage.setItem('autro_reset_email', email);
  document.getElementById('forgotStep1').style.display = 'none';
  document.getElementById('forgotStep2').style.display = 'block';
}
function resetPassword() {
  var code = document.getElementById('resetCode').value.trim();
  var np = document.getElementById('newPass').value;
  var m = document.getElementById('forgotMsg2');
  if (code !== '123456') {
    m.innerHTML = '<i class="fas fa-circle-exclamation"></i> Wrong code. Demo code is 123456';
    m.className = 'msg err';
    return;
  }
  if (!np || np.length < 4) {
    m.innerHTML = '<i class="fas fa-circle-exclamation"></i> New password must be 4+ characters.';
    m.className = 'msg err';
    return;
  }
  var email = localStorage.getItem('autro_reset_email');
  var users = getUsers();
  var f = users.find(u => (u.email || '').toLowerCase() === email);
  if (!f) {
    m.innerHTML = '<i class="fas fa-circle-exclamation"></i> No account found. Please sign up first.';
    m.className = 'msg err';
    return;
  }
  f.password = np;
  saveUsers(users);
  m.innerHTML = '<i class="fas fa-circle-check"></i> Password changed!';
  m.className = 'msg ok';
  setTimeout(function () {
    closeForgot();
    document.getElementById('email').value = email;
    document.getElementById('password').value = np;
  }, 1000);
}

/* ---------- Fingerprint / Passkey ---------- */
function bufToB64(b) { return btoa(String.fromCharCode(...new Uint8Array(b))); }
function b64ToBuf(b64) {
  var s = atob(b64);
  var a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a.buffer;
}

async function passkeyLogin() {
  var email = document.getElementById('email').value.trim().toLowerCase()
    || localStorage.getItem('autro_passkey_email')
    || 'demo@autrobook.com';

  if (!window.PublicKeyCredential) {
    showMsg('Use Chrome for fingerprint login.', true);
    return;
  }

  var keys = JSON.parse(localStorage.getItem('autro_passkeys') || '{}');

  try {
    showMsg('Touch your fingerprint sensor...', false);
    var ch = new Uint8Array(32);
    crypto.getRandomValues(ch);
    var allow = [];
    if (keys[email]) allow = [{ id: b64ToBuf(keys[email]), type: 'public-key', transports: ['internal'] }];
    await navigator.credentials.get({
      publicKey: {
        challenge: ch,
        rpId: location.hostname,
        allowCredentials: allow,
        userVerification: 'required',
        timeout: 60000
      }
    });
    loginSuccess(email, email.split('@')[0]);
  } catch (err) {
    if (!keys[email]) {
      if (!confirm('No fingerprint found. Create one now?')) {
        showMsg('Fingerprint cancelled.', true);
        return;
      }
      try {
        if (!email.includes('@')) {
          email = prompt('Enter your email for fingerprint login:', '') || email;
        }
        showMsg('Touch your fingerprint sensor...', false);
        var ch2 = new Uint8Array(32);
        crypto.getRandomValues(ch2);
        var cred = await navigator.credentials.create({
          publicKey: {
            challenge: ch2,
            rp: { name: 'Autrobook', id: location.hostname },
            user: { id: new TextEncoder().encode(email), name: email, displayName: email },
            pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
            timeout: 60000,
            attestation: 'none'
          }
        });
        keys[email] = bufToB64(cred.rawId);
        localStorage.setItem('autro_passkeys', JSON.stringify(keys));
        localStorage.setItem('autro_passkey_email', email);
        showMsg('Fingerprint created! Tap "Use Fingerprint" again.', false);
      } catch (e) {
        showMsg('Fingerprint cancelled.', true);
      }
    } else {
      showMsg('Fingerprint cancelled.', true);
    }
  }
}
</script>
