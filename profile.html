<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Autrobook</title>
<script>
// Auth Guard & Clickjacking Security
if (!localStorage.getItem('autrobook_user')) { window.location.replace('login.html'); }
if (window.top !== window.self) { window.top.location = window.self.location; }
</script>
<style>
:root { --bg: #18191a; --card: #242526; --hover: #3a3b3c; --text: #e4e6eb; --sub: #b0b3b8; --border: #3a3b3c; --brand: #4caf50; --blue: #1877f2; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 40px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
.header span { cursor: pointer; font-size: 20px; padding: 2px 8px; }
.header b { font-size: 18px; }
.container { max-width: 600px; margin: 0 auto; position: relative; }

/* Cover & Profile Picture Layering Fixed */
.cover-wrap { position: relative; height: 200px; background: linear-gradient(135deg, #1e293b, #0f172a); background-size: cover; background-position: center; }
.guard-badge { background: var(--brand); color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; position: absolute; top: 14px; left: 14px; display: none; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.cover-cam { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.75); padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; z-index: 10; border: 1px solid rgba(255,255,255,0.2); }
.profile-pic-wrap { position: relative; width: 124px; height: 124px; margin: -62px 0 0 16px; z-index: 20; }
.profile-pic { width: 124px; height: 124px; border-radius: 50%; border: 4px solid var(--bg); object-fit: cover; background: #3a3b3c; display: block; }
.cam-btn { position: absolute; bottom: 4px; right: 4px; background: var(--hover); border: 2px solid var(--bg); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; z-index: 25; }
.pro-badge { position: absolute; top: 4px; left: 0; background: var(--blue); color: white; padding: 3px 8px; font-size: 10px; font-weight: bold; border-radius: 6px; display: none; z-index: 25; }

/* Profile Details */
.profile-info { padding: 12px 16px 16px; background: var(--bg); }
.profile-info h2 { font-size: 24px; display: flex; align-items: center; gap: 6px; }
.verified-icon { color: var(--blue); font-size: 19px; }
.friend-count { color: var(--sub); font-size: 14px; margin: 4px 0; font-weight: bold; }
.bio-text { margin: 8px 0; font-size: 15px; line-height: 1.4; }
.location-info { color: var(--sub); font-size: 14px; margin-bottom: 14px; line-height: 1.5; }
.profile-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { padding: 10px 14px; border-radius: 8px; border: none; background: var(--hover); color: white; font-weight: bold; font-size: 14px; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 110px; }
.btn-primary { background: var(--blue); color: white; }
.btn-more { flex: 0 0 44px; padding: 10px; }

/* Tabs */
.tabs { display: flex; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-top: 8px; background: var(--bg); }
.tab { flex: 1; text-align: center; padding: 13px; cursor: pointer; font-weight: bold; font-size: 14px; color: var(--sub); }
.tab.active { border-bottom: 3px solid var(--brand); color: var(--brand); }
.tab-content { display: none; padding: 16px; }
.tab-content.active { display: block; }

/* Post Composer & Cards */
.composer { background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; }
.composer textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 14px; resize: none; outline: none; }
.composer button { margin-top: 8px; width: 100%; padding: 9px; background: var(--blue); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
.empty-post { text-align: center; padding: 40px 20px; color: var(--sub); font-size: 15px; }
.post-card { background: var(--card); margin-bottom: 12px; padding: 14px; border-radius: 10px; border: 1px solid var(--border); }
.post-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--sub); }
.post-header b { color: var(--text); font-size: 15px; }
.post-body { font-size: 15px; line-height: 1.45; white-space: pre-wrap; margin-bottom: 12px; }
.post-actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
.p-btn { flex: 1; padding: 7px; background: var(--hover); border: none; border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer; }

/* Photo Grid & About Card */
.photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.photo-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
.about-card { background: var(--card); padding: 16px; border-radius: 10px; border: 1px solid var(--border); line-height: 1.8; font-size: 14px; }
input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="header">
<span onclick="goBack()" title="Back">←</span>
<b>Autrobook</b>
<span onclick="window.location.href='profile-settings.html'" style="font-size:20px;" title="Settings">⚙️</span>
</div>

<div class="container">
<!-- Cover Photo -->
<div class="cover-wrap" id="coverBox">
<div class="guard-badge" id="guardBadge">🛡️ Guard On</div>
<div class="cover-cam" onclick="document.getElementById('coverUpload').click()">📷 Edit Cover</div>
<input type="file" id="coverUpload" accept="image/*" onchange="uploadCover(event)">
</div>

<!-- Profile Picture -->
<div class="profile-pic-wrap">
<img id="profilePic" class="profile-pic" alt="Profile">
<div class="pro-badge" id="proBadge">PRO</div>
<div class="cam-btn" onclick="document.getElementById('profileUpload').click()" title="Update Photo">📷</div>
<input type="file" id="profileUpload" accept="image/*" onchange="uploadProfile(event)">
</div>

<!-- Profile Info -->
<div class="profile-info">
<h2>
<span id="profileName">Abir Mazumder</span>
<span class="verified-icon" id="verifiedIcon" style="display:none">✓</span>
</h2>
<p class="friend-count" id="friendCount">26 friends</p>
<p class="bio-text" id="bio">Unofficial account ✅</p>
<p class="location-info" id="locationText">📍 Uttara · 🏠 Dhaka, Bangladesh · 🎓 Dhaka Central University</p>
<div class="profile-buttons" id="profileButtons"></div>
</div>

<input type="file" id="storyUpload" accept="image/*,video/*" onchange="uploadStory(event)">

<!-- Navigation Tabs -->
<div class="tabs">
<div class="tab active" onclick="openTab('posts', this)">All</div>
<div class="tab" onclick="openTab('photos', this)">Photos</div>
<div class="tab" onclick="openTab('reels', this)">Reels</div>
<div class="tab" onclick="openTab('about', this)">About</div>
</div>

<!-- All Posts Tab -->
<div id="posts" class="tab-content active">
<div class="composer">
<textarea id="newPostText" rows="2" placeholder="Write something on your profile..."></textarea>
<button onclick="createPost()">Post</button>
</div>
<div id="postsContainer"></div>
</div>

<!-- Photos Tab -->
<div id="photos" class="tab-content">
<div class="photo-grid" id="photosGrid"></div>
</div>

<!-- Reels Tab -->
<div id="reels" class="tab-content">
<div id="reelsContainer"></div>
</div>

<!-- About Tab -->
<div id="about" class="tab-content">
<div class="about-card" id="aboutDetails"></div>
</div>
</div>

<script> 
let storedUser = {};
try { storedUser = JSON.parse(localStorage.getItem('autrobook_user')) || {}; } catch (e) {}

let currentUser = {
name: storedUser.name || "Abir Mazumder",
email: storedUser.email || "",
profilePic: storedUser.profilePic || "",
coverPic: storedUser.coverPic || "",
bio: storedUser.bio || "Unofficial account ✅",
location: storedUser.location || "📍 Uttara · 🏠 Dhaka, Bangladesh · 🎓 Dhaka Central University",
professional: Boolean(storedUser.professional),
profileGuard: Boolean(storedUser.profileGuard),
verified: Boolean(storedUser.verified),
actionButton: storedUser.actionButton || "",
actionButtonLabel: storedUser.actionButtonLabel || "",
actionButtonValue: storedUser.actionButtonValue || ""
};

let userPosts = JSON.parse(localStorage.getItem('autrobook_user_posts') || '[]');
let userStories = JSON.parse(localStorage.getItem('autrobook_archived_stories') || '[]');

// Default avatar
const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='120' height='120' fill='%233a3b3c'/><circle cx='60' cy='45' r='22' fill='%23b0b3b8'/><path d='M25 105 C25 80, 95 80, 95 105' fill='%23b0b3b8'/></svg>";

function loadProfile() {
document.getElementById('profileName').textContent = currentUser.name;
document.getElementById('bio').textContent = currentUser.bio;
document.getElementById('locationText').textContent = currentUser.location;
document.getElementById('profilePic').src = currentUser.profilePic || defaultAvatar;

if(currentUser.coverPic){
document.getElementById('coverBox').style.backgroundImage = `url(${currentUser.coverPic})`;
}
if(currentUser.profileGuard){
document.getElementById('guardBadge').style.display = 'block';
}
if(currentUser.professional){
document.getElementById('proBadge').style.display = 'block';
}
if(currentUser.verified){
document.getElementById('verifiedIcon').style.display = 'inline';
}

// Action Button
const btnBox = document.getElementById('profileButtons');
if(currentUser.actionButtonLabel){
btnBox.innerHTML = `<button class="btn btn-primary">${currentUser.actionButtonLabel}</button><button class="btn btn-more">⋯</button>`;
} else {
btnBox.innerHTML = `<button class="btn">Edit Profile</button><button class="btn btn-more">⋯</button>`;
}

renderPosts();
renderPhotos();
renderReels();
renderAbout();
}

function openTab(tabId, el) {
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
el.classList.add('active');
document.getElementById(tabId).classList.add('active');
}

function createPost(){
const text = document.getElementById('newPostText').value.trim();
if(!text) return;
userPosts.unshift({id: Date.now(), text: text, likes: 0, time: 'Just now'});
localStorage.setItem('autrobook_user_posts', JSON.stringify(userPosts));
document.getElementById('newPostText').value = '';
logActivity('Created a new post');
renderPosts();
}

function renderPosts(){
const box = document.getElementById('postsContainer');
box.innerHTML = '';
if(userPosts.length === 0){
box.innerHTML = '<div class="empty-post">No posts yet</div>';
return;
}
userPosts.forEach(p => {
box.innerHTML += `
<div class="post-card">
<div class="post-header"><b>${currentUser.name}</b><span>${p.time}</span></div>
<div class="post-body">${p.text}</div>
<div class="post-actions">
<button class="p-btn" onclick="likePost(${p.id})">👍 Like ${p.likes > 0 ? '('+p.likes+')' : ''}</button>
<button class="p-btn">💬 Comment</button>
</div>
</div>`;
});
}

function likePost(id){
const post = userPosts.find(p => p.id === id);
if(post){ post.likes++; localStorage.setItem('autrobook_user_posts', JSON.stringify(userPosts)); renderPosts(); }
}

function renderPhotos(){
const grid = document.getElementById('photosGrid');
grid.innerHTML = '';
let photos = [];
if(currentUser.profilePic) photos.push(currentUser.profilePic);
if(currentUser.coverPic) photos.push(currentUser.coverPic);
userPosts.forEach(p => { if(p.image) photos.push(p.image); });
if(photos.length === 0){
grid.innerHTML = '<p style="text-align:center;color:var(--sub);">No photos yet</p>';
} else {
photos.forEach(src => {
grid.innerHTML += `<img src="${src}">`;
});
}
}

function renderReels(){
const box = document.getElementById('reelsContainer');
box.innerHTML = '';
if(userStories.length === 0){
box.innerHTML = '<p style="text-align:center;color:var(--sub);padding:20px;">You have no Reels/Story yet</p>';
} else {
box.innerHTML = `<p style="text-align:center;color:var(--brand);padding:20px;">You have ${userStories.length} story/reel item(s) saved in Archive.</p>`;
}
}

function renderAbout() {
const aboutBox = document.getElementById('aboutDetails');
aboutBox.innerHTML = `
<div>🎓 <b>Education:</b> Honours student at Dhaka Central University</div>
<div>🏠 <b>Lives in:</b> Dhaka, Bangladesh</div>
<div>📍 <b>From:</b> Uttara, Dhaka</div>
<div>🛡️ <b>Profile Guard:</b> ${currentUser.profileGuard ? 'Active' : 'Off'}</div>
<div>📋 <b>Quick Links:</b> <a href="activity-log.html" style="color:#1877f2;">Activity Log</a> · <a href="archive.html" style="color:#1877f2;">Archive</a> · <a href="creator-dashboard.html" style="color:#1877f2;">Creator Dashboard</a></div>
`;
}

function uploadProfile(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function() {
currentUser.profilePic = reader.result;
saveUser();
document.getElementById('profilePic').src = reader.result;
renderPhotos();
logActivity('Updated profile picture');
};
reader.readAsDataURL(file);
}

function uploadCover(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function() {
currentUser.coverPic = reader.result;
saveUser();
document.getElementById('coverBox').style.backgroundImage = `url(${reader.result})`;
renderPhotos();
logActivity('Updated cover photo');
};
reader.readAsDataURL(file);
}

function uploadStory(e) {
const file = e.target.files[0];
if (!file) return;
userStories.unshift({ id: Date.now(), content: 'Story media: ' + file.name, date: 'Today' });
localStorage.setItem('autrobook_archived_stories', JSON.stringify(userStories));
logActivity('Added a new story');
renderReels();
alert('Story uploaded and saved to Story Archive!');
}

function saveUser() {
const merged = Object.assign({}, storedUser, currentUser);
localStorage.setItem('autrobook_user', JSON.stringify(merged));
}

function logActivity(text) {
try {
let logs = JSON.parse(localStorage.getItem('autrobook_activity_logs') || '[]');
logs.unshift({ id: Date.now(), category: 'activity', text: text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
localStorage.setItem('autrobook_activity_logs', JSON.stringify(logs));
} catch (e) {}
}

function goBack() {
if (window.history.length > 1) history.back();
else window.location.href = 'home.html';
}

window.onload = loadProfile;
</script> 
</body>
</html>
