<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Profile - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --brand:#4caf50; --blue:#1877f2; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);overflow-x:hidden;} 
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:var(--card);position:sticky;top:0;z-index:9999;} 
.cover{height:200px;background:#222;position:relative;background-size:cover;background-position:center;z-index:1;} 
.profile-pic-wrap{position:absolute;bottom:-60px;left:16px;z-index:100;} 
.profile-pic{width:120px;height:120px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;background:#555;} 
.cam-btn{position:absolute;bottom:5px;right:5px;background:#3a3b3c;border:2px solid var(--bg);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;z-index:101;} 
.cover-cam{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:6px;font-size:14px;cursor:pointer;color:white;z-index:50;} 
.pro-badge{position:absolute;bottom:0;right:0;background:#1877f2;color:white;padding:2px 8px;font-size:10px;border-radius:4px;display:none;} 
.guard-badge{background:var(--brand);padding:4px 10px;border-radius:20px;font-size:12px;position:absolute;top:16px;right:16px;display:none;z-index:50;} 
.profile-info{padding:90px 16px 16px;position:relative;z-index:1000;background:var(--bg);} 
.profile-info h2{text-align:left;font-size:24px;display:flex;align-items:center;gap:8px;} 
.verified-icon{color:var(--blue);font-size:20px;} 
.friend-count{color:#aaa;font-size:14px;margin:4px 0;text-align:left;} 
.bio-text{margin:8px 0;text-align:left;} 
.location-info{color:#aaa;font-size:14px;text-align:left;margin-bottom:12px;} 
.profile-buttons{display:flex;gap:8px;align-items:center;margin-top:12px;position:relative;z-index:1001;} 
.btn{padding:10px 16px;border-radius:6px;border:none;background:#3a3b3c;color:white;font-weight:bold;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;} 
.btn-primary{background:var(--blue);color:white;} 
.tabs{display:flex;border-bottom:1px solid var(--border);margin-top:8px;background:var(--bg);position:relative;z-index:1000;} 
.tab{flex:1;text-align:center;padding:12px;cursor:pointer;} 
.tab.active{border-bottom:2px solid var(--brand);color:var(--brand);} 
.tab-content{display:none;padding:16px;background:var(--bg);position:relative;z-index:1000;} 
.tab-content.active{display:block;} 
.empty-post{text-align:center;padding:40px;color:#aaa;font-size:16px;} 
.post-card{background:var(--card);margin:12px 0;padding:12px;border-radius:8px;position:relative;z-index:100;} 
input[type="file"]{display:none;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Autrobook</b>
<span onclick="window.location.href='profile-settings.html'" style="font-size:22px;cursor:pointer">⚙️</span> 
</div>

<div class="cover">
<div class="guard-badge" id="guardBadge">🛡️ Guard On</div>
<div class="cover-cam" onclick="document.getElementById('coverUpload').click()">📷 Edit Cover</div>
<input type="file" id="coverUpload" accept="image/*" onchange="uploadCover(event)">
</div>

<div class="profile-pic-wrap">
<img id="profilePic" class="profile-pic">
<div class="pro-badge" id="proBadge">PRO</div>
<div class="cam-btn" onclick="document.getElementById('profileUpload').click()">📷</div>
<input type="file" id="profileUpload" accept="image/*" onchange="uploadProfile(event)">
</div>

<div class="profile-info">
<h2 id="profileName">Abir Mazumder <span class="verified-icon" id="verifiedIcon" style="display:none">✓</span></h2>
<p class="friend-count" id="friendCount">26 friends</p>
<p class="bio-text" id="bio">Unofficial account ✅</p>
<p class="location-info">📍 Uttara · 🏠 Abir · 🎓 Dhaka Central University</p>

<div class="profile-buttons" id="profileButtons">
</div>
</div>

<input type="file" id="storyUpload" accept="image/*,video/*" onchange="uploadStory(event)">

<div class="tabs">
<div class="tab active" onclick="openTab('posts')">All</div>
<div class="tab" onclick="openTab('photos')">Photos</div>
<div class="tab" onclick="openTab('reels')">Reels</div>
<div class="tab" onclick="openTab('about')">About</div>
</div>

<div id="posts" class="tab-content active">
<div id="postsContainer"><div class="empty-post">No Post Yet</div></div>
</div>
<div id="photos" class="tab-content"><p style="text-align:center;padding:20px;">No photos yet</p></div>
<div id="reels" class="tab-content"><p style="text-align:center;padding:20px;">No reels yet</p></div>
<div id="about" class="tab-content"><p style="text-align:center;padding:20px;">About Section</p></div>

<script> 
let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {
name:"Abir Mazumder",profilePic:"",coverPic:"",bio:"Unofficial account ✅",
professional:false,profileGuard:false,verified:false
};

window.onload = loadProfile;

function loadProfile(){
document.getElementById('profileName').innerText = currentUser.name;
document.getElementById('bio').innerText = currentUser.bio;
document.getElementById('profilePic').src = currentUser.profilePic || 'https://via.placeholder.com/120/555/fff';
document.querySelector('.cover').style.backgroundImage = `url(${currentUser.coverPic})`;
if(currentUser.professional) document.getElementById('proBadge').style.display='block';
if(currentUser.profileGuard) document.getElementById('guardBadge').style.display='block';
if(currentUser.verified) document.getElementById('verifiedIcon').style.display='inline';
loadButtons();
}

function loadButtons(){
let btnDiv = document.getElementById('profileButtons');
if(currentUser.professional){
btnDiv.innerHTML = `
<button class="btn btn-primary" onclick="window.location.href='dashboard.html'">📊 See Dashboard</button>
<button class="btn" onclick="alert('Create Menu')">+ Create</button>
`;
}else{
btnDiv.innerHTML = `
<button class="btn btn-primary" onclick="document.getElementById('storyUpload').click()">➕ Add to story</button>
<button class="btn" onclick="window.location.href='edit-profile.html'">✏️ Edit Profile</button>
`;
}
}

function openTab(tab){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
event.target.classList.add('active');
document.getElementById(tab).classList.add('active');
}

function uploadProfile(e){
let file = e.target.files[0];
let reader = new FileReader();
reader.onload = function(){
currentUser.profilePic = reader.result;
localStorage.setItem('autrobook_user', JSON.stringify(currentUser));
document.getElementById('profilePic').src = reader.result;
}
reader.readAsDataURL(file);
}

function uploadCover(e){
let file = e.target.files[0];
let reader = new FileReader();
reader.onload = function(){
currentUser.coverPic = reader.result;
localStorage.setItem('autrobook_user', JSON.stringify(currentUser));
document.querySelector('.cover').style.backgroundImage = `url(${reader.result})`;
}
reader.readAsDataURL(file);
}
</script> 
</body> </html>
