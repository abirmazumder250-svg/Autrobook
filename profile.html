<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Autrobook</title>
<style>
:root{--bg:#0a1a0f;--card:#13261a;--text:#e4e6eb;--text2:#7a9e80;--brand:#4caf50;--border:#1f3d2a;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg); color:var(--text);}
.header{display:flex; justify-content:space-between; padding:10px 15px; background:var(--card); position:sticky; top:0;}
.cover{width:100%; height:200px; background:url('https://via.placeholder.com/600x200') center/cover;}
.profile-pic{width:120px; height:120px; border-radius:50%; border:4px solid var(--bg); margin:-60px 0 0 15px; position:relative;}
.profile-pic img{width:100%; height:100%; border-radius:50%;}
.guard{position:absolute; bottom:5px; right:5px; background:var(--brand); border-radius:50%; padding:3px; font-size:12px;}
.name{padding:10px 15px;}
.name h2{display:flex; align-items:center; gap:5px;}
.verify{color:var(--brand); font-size:18px;}
.btns{display:flex; gap:10px; padding:0 15px 15px;}
.btns button{flex:1; padding:8px; border:none; border-radius:6px; background:var(--card); color:var(--text); cursor:pointer;}
.btns .primary{background:var(--brand); color:white;}
.card{background:var(--card); margin:10px; padding:15px; border-radius:10px;}
.card h3{margin-bottom:10px;}
.info{display:flex; gap:10px; margin:8px 0; color:var(--text2);}
</style>
</head>
<body>
<div class="header"><div>←</div><div>⋯</div></div>

<div class="cover"></div>
<div class="profile-pic">
<img src="https://via.placeholder.com/120">
<div class="guard">🛡️</div>
</div>

<div class="name">
<h2>Abir Mazumder <span class="verify">✔️</span></h2>
<p>@abir250</p>
</div>

<div class="btns">
<button class="primary" onclick="window.location.href='edit-profile.html'">Edit Profile</button>
<button>✉️ Message</button>
</div>

<div class="card">
<h3>About</h3>
<p>Digital Creator | Autrobook Founder</p>
<div class="info">🎓 Studied at Dhaka University</div>
<div class="info">🏫 Went to Govt. College</div>
<div class="info">❤️ In a relationship</div>
<div class="info">🎂 Born Jan 1, 2000</div>
<div class="info">📍 Tongi, Dhaka</div>
</div>

<div class="card">
<h3>Photos</h3>
</div>

</body>
</html>
