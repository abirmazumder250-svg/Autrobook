<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --dark-green: #0B3D20;
      --dark-green-hover: #072915;
      --accent-green: #0a7d3b;
      --accent-mint: #10b981;
      --dark-green-soft: rgba(11, 61, 32, 0.12);
      --bg: #ffffff;
      --surface: #f4f6f5;
      --card: #ffffff;
      --text: #000000;
      --muted: #3d4741;
      --border: #d6ddd8;
      --btn-sec: #e8ece9;
      --btn-sec-hover: #d8dfd9;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --dark-green-soft: rgba(16, 185, 129, 0.18);
        --bg: #000000;
        --surface: #0e120f;
        --card: #121713;
        --text: #ffffff;
        --muted: #b8c2bb;
        --border: #232c26;
        --btn-sec: #171e19;
        --btn-sec-hover: #212b24;
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.55);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.75);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 54px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .top-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .top-btn:hover {
      background: var(--surface);
    }

    .top-btn:active {
      transform: scale(0.95);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Cover Photo */
    .cover-wrap {
      position: relative;
      width: 100%;
      height: 215px;
      background: var(--surface);
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-img.has-img {
      display: block;
    }

    .cam-btn {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-sec);
      color: var(--text);
      border: 2px solid var(--bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      z-index: 5;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .cam-btn:hover {
      background: var(--btn-sec-hover);
    }

    .cam-btn:active {
      transform: scale(0.94);
    }

    .cover-cam {
      right: 14px;
      bottom: 12px;
    }

    /* Avatar + Thought Bubble */
    .avatar-section {
      position: relative;
      padding: 0 16px;
      margin-top: -78px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thought-bubble {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 7px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.18s ease, color 0.18s ease;
    }

    .thought-bubble:hover {
      border-color: var(--accent-mint);
      color: var(--text);
    }

    .avatar-box {
      position: relative;
      width: 144px;
      height: 144px;
      border-radius: 50%;
      background: var(--surface);
      border: 4px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      box-shadow: var(--shadow-md);
      transition: background 0.22s ease, padding 0.22s ease, box-shadow 0.22s ease;
    }

    /* Dark Green Story Ring when user has an active story */
    .avatar-box.has-story {
      padding: 4px;
      background: linear-gradient(135deg, var(--accent-mint), var(--accent-green), var(--dark-green));
      border-color: var(--bg);
      box-shadow: 0 0 0 2px var(--dark-green), 0 8px 24px rgba(10, 125, 59, 0.35);
      cursor: pointer;
    }

    .avatar-box.has-story .avatar-img {
      border: 3px solid var(--bg);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .avatar-img.has-img {
      display: block;
    }

    .avatar-cam {
      right: 4px;
      bottom: 4px;
    }

    /* Profile Header Info */
    .profile-meta {
      text-align: center;
      padding: 12px 16px 6px;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      min-height: 30px;
      letter-spacing: -0.3px;
    }

    .profile-username {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
      min-height: 18px;
    }

    .friends-count {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Primary Action Row */
    .action-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px 14px;
    }

    .btn-story {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--dark-green);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .btn-story:hover {
      background: var(--dark-green-hover);
    }

    .btn-story:active {
      transform: scale(0.98);
    }

    .btn-edit {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--btn-sec);
      color: var(--text);
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .btn-edit:hover {
      background: var(--btn-sec-hover);
    }

    .btn-edit:active {
      transform: scale(0.98);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 16px;
    }

    /* Sub Tabs */
    .sub-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
    }

    .sub-tab {
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .sub-tab.active {
      background: var(--dark-green-soft);
      color: var(--text);
    }

    @media (prefers-color-scheme: light) {
      .sub-tab.active {
        color: var(--dark-green);
      }
    }

    /* Sections */
    .section-block {
      padding: 16px 0;
      border-top: 6px solid var(--surface);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .section-link {
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
    }

    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 14.5px;
      color: var(--text);
      padding: 0 16px;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .detail-item i {
      width: 18px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      margin: 0 16px;
      color: var(--muted);
      font-size: 14px;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .empty-state i {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.65;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 0 16px;
    }

    .media-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: var(--surface);
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* Post Card (2nd Image Style) */
    .post-card {
      padding: 12px 0 6px;
      background: var(--card);
      border-top: 6px solid var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .post-card:first-child {
      border-top: none;
      padding-top: 4px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 10px;
      gap: 10px;
    }

    .post-author-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .post-author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
      border: 1.5px solid var(--accent-mint);
      flex-shrink: 0;
    }

    .post-author-fallback {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--dark-green);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .post-author-meta {
      min-width: 0;
    }

    .post-author-line {
      font-size: 14.5px;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }

    .post-author-name {
      font-weight: 700;
      color: var(--text);
    }

    .post-activity-text {
      font-weight: 400;
      color: var(--muted);
    }

    .post-submeta {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .post-more-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .post-more-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .post-card-text {
      padding: 0 14px 10px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-card-img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      background: var(--surface);
      cursor: pointer;
    }

    .post-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      font-size: 12.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .post-reactions-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .reaction-badges {
      display: inline-flex;
      align-items: center;
      margin-right: 2px;
    }

    .reaction-badge {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #ffffff;
      border: 1.5px solid var(--card);
      margin-left: -4px;
    }

    .reaction-badge:first-child {
      margin-left: 0;
    }

    .badge-heart {
      background: #ef4444;
    }

    .badge-care {
      background: #eab308;
    }

    .badge-like {
      background: var(--accent-green);
    }

    .post-stats-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .post-actions-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 3px 6px 0;
    }

    .post-action-btn {
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .post-action-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .post-action-btn.liked {
      color: var(--accent-mint);
    }

    /* Autrobook Studio Preview Modal */
    .studio-modal {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: var(--bg);
      color: var(--text);
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .studio-modal.open {
      display: flex;
    }

    .studio-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .studio-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .studio-back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .studio-back-btn:hover {
      background: var(--btn-sec-hover);
    }

    .studio-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .studio-save-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.45);
      background: var(--dark-green);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .studio-save-btn:hover {
      background: var(--accent-green);
    }

    .studio-save-btn:active {
      transform: scale(0.96);
    }

    .studio-save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .studio-privacy-row {
      padding: 12px 16px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .studio-privacy-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .studio-privacy-select {
      background: transparent;
      color: var(--text);
      border: none;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .studio-privacy-select option {
      background: var(--card);
      color: var(--text);
    }

    .studio-stage {
      position: relative;
      margin: 12px 16px;
      padding: 24px 16px;
      min-height: 270px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .studio-crop-badge {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 5;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .studio-crop-badge:hover {
      background: var(--btn-sec-hover);
    }

    .studio-frame-ring {
      position: relative;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #10b981, #0B3D20);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      transition: transform 0.22s ease, border-radius 0.22s ease, width 0.22s ease, height 0.22s ease, box-shadow 0.22s ease;
    }

    .studio-frame-ring.cover-mode {
      width: 100%;
      max-width: 340px;
      height: 192px;
      border-radius: 16px;
      padding: 4px;
    }

    .studio-frame-ring.framed {
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px #10b981, var(--shadow-md);
    }

    .studio-preview-photo {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      display: block;
      transition: transform 0.22s ease, filter 0.22s ease;
    }

    .studio-panel {
      margin: 0 16px 28px;
      padding: 16px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .studio-chips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .studio-chip {
      height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .studio-chip:hover {
      background: var(--btn-sec-hover);
    }

    .studio-chip.active {
      background: var(--dark-green);
      border-color: var(--accent-mint);
      color: #ffffff;
    }

    .studio-temp-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .studio-temp-row.visible {
      display: flex;
    }

    .studio-temp-select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    .studio-caption-box {
      width: 100%;
      min-height: 84px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.18s ease;
    }

    .studio-caption-box::placeholder {
      color: var(--muted);
    }

    .studio-caption-box:focus {
      border-color: var(--accent-mint);
    }

    .studio-feed-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .studio-checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--dark-green);
      cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;

  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let activeUserId = null;
    let hasActiveStory = false;
    let editorTarget = 'avatar';
    let editorSourceUrl = '';
    let restyleIndex = 0;
    let cropZoomIndex = 0;
    let isTemporary = false;
    let isFramed = false;

    const restyleFilters = [
      'none',
      'contrast(1.12) saturate(1.24)',
      'brightness(1.05) contrast(1.08) hue-rotate(8deg)',
      'sepia(0.2) contrast(1.06)'
    ];
    const cropScales = [1, 1.18, 1.35];

    function normalizeUsername(raw, name) {
      let val = (raw || '').toString().trim().replace(/^@+/, '').toLowerCase();
      if (!val && name) {
        val = name.toString().trim().toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      }
      val = val.replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      return val ? '@' + val : '';
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function setStoryRingActive(active) {
      hasActiveStory = Boolean(active);
      const box = document.getElementById('avatarBox');
      if (box) {
        box.classList.toggle('has-story', hasActiveStory);
      }
    }

    function handleAvatarBoxClick() {
      if (hasActiveStory) {
        window.location.href = 'story-card.html';
      }
    }

    function checkLocalStoryExists() {
      try {
        const keys = ['autro_stories', 'autrobook_stories', 'autro_active_story', 'autro_story_items'];
        for (const k of keys) {
          const raw = localStorage.getItem(k);
          if (!raw) continue;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return true;
          if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) return true;
        }
        if (localStorage.getItem('autro_has_story') === 'true') return true;
      } catch (e) {}
      return false;
    }

    async function refreshStoryRing(userId) {
      let active = checkLocalStoryExists();

      if (sb && userId) {
        try {
          const { count, error } = await sb
            .from('stories')
            .select('*', { count: 'exact', head: true })
            .eq('user_id', userId)
            .gt('expires_at', new Date().toISOString());
          if (!error && typeof count === 'number' && count > 0) {
            active = true;
          }
        } catch (e) {}
      }

      setStoryRingActive(active);
    }

    function setImageIfPresent(imgEl, url) {
      if (!imgEl) return;
      const cleanUrl = (url && typeof url === 'string') ? url.trim() : '';
      if (cleanUrl) {
        imgEl.src = cleanUrl;
        imgEl.classList.add('has-img');
      } else {
        imgEl.removeAttribute('src');
        imgEl.classList.remove('has-img');
      }
    }

    function applyEditorVisualState() {
      const ring = document.getElementById('editorFrameRing');
      const img = document.getElementById('editorPreviewImg');
      const scaleLabel = document.getElementById('cropScaleLabel');
      if (!ring || !img) return;

      ring.classList.toggle('cover-mode', editorTarget === 'cover');
      ring.classList.toggle('framed', isFramed);

      const scale = cropScales[cropZoomIndex % cropScales.length];
      const filterVal = restyleFilters[restyleIndex % restyleFilters.length];

      img.style.transform = `scale(${scale})`;
      img.style.filter = filterVal;
      if (scaleLabel) scaleLabel.textContent = `${scale.toFixed(1)}x`;

      document.getElementById('restyleChipBtn')?.classList.toggle('active', restyleIndex > 0);
      document.getElementById('temporaryChipBtn')?.classList.toggle('active', isTemporary);
      document.getElementById('frameChipBtn')?.classList.toggle('active', isFramed);
      document.getElementById('editorTempRow')?.classList.toggle('visible', isTemporary);
    }

    function openPreviewEditor(target, customUrl) {
      editorTarget = target === 'cover' ? 'cover' : 'avatar';
      const currentAvatar = document.getElementById('avatarImg')?.getAttribute('src') || '';
      const currentCover = document.getElementById('coverImg')?.getAttribute('src') || '';

      editorSourceUrl = customUrl || (editorTarget === 'cover' ? currentCover : currentAvatar);
      if (!editorSourceUrl) return;

      restyleIndex = 0;
      cropZoomIndex = 0;
      isTemporary = false;
      isFramed = false;

      document.getElementById('editorModalTitle').textContent = editorTarget === 'cover'
        ? 'Cover Preview'
        : 'Profile Photo Preview';
      document.getElementById('editorCaptionInput').placeholder = editorTarget === 'cover'
        ? 'Say something about your cover photo...'
        : 'Say something about your profile picture...';
      document.getElementById('editorCaptionInput').value = '';
      document.getElementById('shareToFeedCheckbox').checked = true;

      document.getElementById('editorPreviewImg').src = editorSourceUrl;
      applyEditorVisualState();
      document.getElementById('previewEditorModal').classList.add('open');
    }

    function closePreviewEditor() {
      document.getElementById('previewEditorModal').classList.remove('open');
    }

    function cycleCropZoom() {
      cropZoomIndex = (cropZoomIndex + 1) % cropScales.length;
      applyEditorVisualState();
    }

    function toggleRestyle() {
      restyleIndex = (restyleIndex + 1) % restyleFilters.length;
      applyEditorVisualState();
    }

    function toggleTemporary() {
      isTemporary = !isTemporary;
      applyEditorVisualState();
    }

    function toggleFrame() {
      isFramed = !isFramed;
      applyEditorVisualState();
    }

    function pickDifferentPhoto() {
      const inputId = editorTarget === 'cover' ? 'coverInput' : 'avatarInput';
      document.getElementById(inputId)?.click();
    }

    function handleFileSelected(event, target) {
      const file = event?.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target?.result || '';
        if (dataUrl) {
          openPreviewEditor(target, dataUrl);
        }
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    async function renderEditedPhotoToDataUrl() {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const isCover = editorTarget === 'cover';
          const canvas = document.createElement('canvas');
          canvas.width = isCover ? 1200 : 800;
          canvas.height = isCover ? 630 : 800;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            resolve(editorSourceUrl);
            return;
          }

          const filterVal = restyleFilters[restyleIndex % restyleFilters.length];
          ctx.filter = filterVal === 'none' ? 'none' : filterVal;

          const scale = cropScales[cropZoomIndex % cropScales.length];
          const imgRatio = img.width / img.height;
          const canvasRatio = canvas.width / canvas.height;

          let drawW = canvas.width;
          let drawH = canvas.height;
          if (imgRatio > canvasRatio) {
            drawW = canvas.height * imgRatio;
          } else {
            drawH = canvas.width / imgRatio;
          }

          drawW *= scale;
          drawH *= scale;

          const dx = (canvas.width - drawW) / 2;
          const dy = (canvas.height - drawH) / 2;
          ctx.drawImage(img, dx, dy, drawW, drawH);

          ctx.filter = 'none';
          if (isFramed) {
            ctx.lineWidth = Math.round(canvas.width * 0.03);
            ctx.strokeStyle = '#10b981';
            ctx.strokeRect(
              ctx.lineWidth / 2,
              ctx.lineWidth / 2,
              canvas.width - ctx.lineWidth,
              canvas.height - ctx.lineWidth
            );
          }

          try {
            resolve(canvas.toDataURL('image/jpeg', 0.88));
          } catch (e) {
            resolve(editorSourceUrl);
          }
        };
        img.onerror = () => resolve(editorSourceUrl);
        img.src = editorSourceUrl;
      });
    }

    async function savePreviewPhoto() {
      const saveBtn = document.getElementById('editorSaveBtn');
      if (saveBtn) saveBtn.disabled = true;

      try {
        const finalDataUrl = await renderEditedPhotoToDataUrl();
        const caption = (document.getElementById('editorCaptionInput')?.value || '').trim();
        const shareToFeed = Boolean(document.getElementById('shareToFeedCheckbox')?.checked);
        const privacy = document.getElementById('editorPrivacySelect')?.value || 'public';
        const tempDuration = isTemporary
          ? (document.getElementById('editorTempDuration')?.value || '7d')
          : null;

        let finalUrl = finalDataUrl;

        if (sb && activeUserId) {
          const bucket = editorTarget === 'cover' ? 'covers' : 'avatars';
          const filePath = `${activeUserId}/${editorTarget}-${Date.now()}.jpg`;
          try {
            const blob = await (await fetch(finalDataUrl)).blob();
            const { error: upErr } = await sb.storage
              .from(bucket)
              .upload(filePath, blob, { contentType: 'image/jpeg', upsert: true });

            if (!upErr) {
              const { data: pubData } = sb.storage.from(bucket).getPublicUrl(filePath);
              if (pubData?.publicUrl) {
                finalUrl = pubData.publicUrl;
              }
            }
          } catch (storageErr) {
            console.warn('Storage upload fallback to dataUrl:', storageErr);
          }

          const profilePatch = editorTarget === 'cover'
            ? { id: activeUserId, cover_url: finalUrl }
            : { id: activeUserId, avatar_url: finalUrl };

          try {
            await sb.from('profiles').upsert(profilePatch);
          } catch (profErr) {
            console.warn('Profile upsert error:', profErr);
          }

          if (shareToFeed) {
            const defaultPostText = editorTarget === 'cover'
              ? 'Updated cover photo'
              : 'Updated profile picture';
            const postContent = caption || defaultPostText;
            try {
              await sb.from('posts').insert({
                user_id: activeUserId,
                author_id: activeUserId,
                caption: postContent,
                content: postContent,
                media_url: finalUrl,
                image_url: finalUrl
              });
            } catch (postErr) {
              console.warn('Feed post insert error:', postErr);
            }
          }
        }

        const current = readStoredProfile();
        if (editorTarget === 'cover') {
          current.cover_url = finalUrl;
          current.cover_privacy = privacy;
          current.cover_temp_until = tempDuration;
          try { localStorage.setItem('autro_cover_url', finalUrl); } catch (e) {}
        } else {
          current.avatar_url = finalUrl;
          current.avatar_privacy = privacy;
          current.avatar_temp_until = tempDuration;
          try { localStorage.setItem('autro_avatar_url', finalUrl); } catch (e) {}
        }

        if (shareToFeed) {
          const localPosts = Array.isArray(current.posts) ? current.posts : [];
          localPosts.unshift({
            caption: caption || (editorTarget === 'cover' ? 'Updated cover photo' : 'Updated profile picture'),
            content: caption || (editorTarget === 'cover' ? 'Updated cover photo' : 'Updated profile picture'),
            media_url: finalUrl,
            image_url: finalUrl,
            created_at: new Date().toISOString()
          });
          current.posts = localPosts;
          current.posts_count = localPosts.length;
        }

        try {
          localStorage.setItem('autrobook_user', JSON.stringify(current));
        } catch (e) {}

        applyProfileData(current);
        if (sb && activeUserId) {
          await refreshLiveCounts(activeUserId);
        }
        closePreviewEditor();
      } finally {
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    function renderDetails(profile) {
      const container = document.getElementById('personalDetailsList');
      if (!container) return;
      const items = [];
      if (profile.location) items.push({ icon: 'fa-map-marker-alt', text: profile.location });
      if (profile.hometown) items.push({ icon: 'fa-home', text: profile.hometown });
      if (profile.dob) items.push({ icon: 'fa-cake-candles', text: profile.dob });
      if (profile.relationship) items.push({ icon: 'fa-heart', text: profile.relationship });
      if (profile.gender) items.push({ icon: 'fa-user', text: profile.gender });
      if (profile.language) items.push({ icon: 'fa-language', text: profile.language });

      if (!items.length) {
        container.innerHTML = '<div class="detail-item"><i class="fas fa-info-circle"></i><span>No personal details added yet</span></div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="detail-item">
          <i class="fas ${item.icon}"></i>
          <span>${escapeHtml(item.text)}</span>
        </div>
      `).join('');
    }

    function getPostImageUrl(post) {
      if (!post) return '';
      return String(post.media_url || post.image_url || '').trim();
    }

    function getPostText(post) {
      if (!post) return '';
      return String(post.caption || post.content || post.text || '').trim();
    }

    function formatShortDate(rawDate) {
      if (!rawDate) return 'Just now';
      const d = new Date(rawDate);
      if (Number.isNaN(d.getTime())) return 'Just now';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function renderPhotos(avatarUrl, coverUrl, posts) {
      const grid = document.getElementById('photosGrid');
      const empty = document.getElementById('photosEmptyState');
      if (!grid || !empty) return;

      const photos = [];
      if (avatarUrl && avatarUrl.trim()) photos.push({ type: 'avatar', src: avatarUrl.trim() });
      if (coverUrl && coverUrl.trim()) photos.push({ type: 'cover', src: coverUrl.trim() });
      if (Array.isArray(posts)) {
        posts.forEach(p => {
          const mediaSrc = getPostImageUrl(p);
          if (mediaSrc) {
            photos.push({ type: 'avatar', src: mediaSrc });
          }
        });
      }

      if (!photos.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = photos.map(p => {
        const safeSrc = escapeHtml(p.src);
        return `<img src="${safeSrc}" alt="Photo" onclick="openPreviewEditor('${p.type}', '${p.src.replace(/'/g, "\\'")}')">`;
      }).join('');
    }

    function togglePostLike(btnEl, countSpanId) {
      if (!btnEl) return;
      const isLiked = btnEl.classList.toggle('liked');
      const countEl = document.getElementById(countSpanId);
      if (countEl) {
        const current = Math.max(0, parseInt(countEl.textContent || '0', 10) || 0);
        countEl.textContent = String(isLiked ? current + 1 : Math.max(0, current - 1));
      }
    }

    function renderLivePosts(posts) {
      const listEl = document.getElementById('livePostsContainer');
      const emptyEl = document.getElementById('postsEmptyState');
      const countLabel = document.getElementById('postsCountLabel');

      const items = Array.isArray(posts) ? posts : [];
      if (countLabel) {
        countLabel.textContent = `${items.length} ${items.length === 1 ? 'post' : 'posts'}`;
      }

      if (!listEl || !emptyEl) return;

      if (!items.length) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';

      const stored = readStoredProfile();
      const authorName = (
        document.getElementById('displayName')?.textContent ||
        stored.full_name ||
        stored.name ||
        'Autrobook User'
      ).trim() || 'Autrobook User';
      const authorAvatar = (
        document.getElementById('avatarImg')?.getAttribute('src') ||
        stored.avatar_url ||
        stored.selfie_url ||
        ''
      ).trim();

      const avatarHtml = authorAvatar
        ? `<img src="${escapeHtml(authorAvatar)}" alt="${escapeHtml(authorName)}" class="post-author-avatar">`
        : `<span class="post-author-fallback"><i class="fas fa-user"></i></span>`;

      listEl.innerHTML = items.map((p, index) => {
        const rawText = getPostText(p);
        const mediaSrc = getPostImageUrl(p);
        const lowerText = rawText.toLowerCase();

        let activityLabel = 'shared a post.';
        let captionText = rawText;

        if (lowerText === 'updated profile picture') {
          activityLabel = 'updated his profile picture.';
          captionText = '';
        } else if (lowerText === 'updated cover photo') {
          activityLabel = 'updated his cover photo.';
          captionText = '';
        } else if (lowerText.startsWith('updated profile picture')) {
          activityLabel = 'updated his profile picture.';
          captionText = rawText.replace(/^updated profile picture[:\-\s]*/i, '').trim();
        } else if (lowerText.startsWith('updated cover photo')) {
          activityLabel = 'updated his cover photo.';
          captionText = rawText.replace(/^updated cover photo[:\-\s]*/i, '').trim();
        }

        const timeLabel = formatShortDate(p.created_at);
        const likesCount = Number(p.likes_count ?? p.reactions_count ?? 0);
        const commentsCount = Number(p.comments_count ?? 0);
        const viewsCount = Number(p.views_count ?? 0);
        const likeCountId = `post-like-count-${index}`;

        const captionHtml = captionText
          ? `<div class="post-card-text">${escapeHtml(captionText)}</div>`
          : '';

        const imgHtml = mediaSrc
          ? `<img src="${escapeHtml(mediaSrc)}" alt="Post image" class="post-card-img" onclick="openPreviewEditor('avatar', '${mediaSrc.replace(/'/g, "\\'")}')">`
          : '';

        return `
          <article class="post-card">
            <div class="post-header">
              <div class="post-author-wrap">
                ${avatarHtml}
                <div class="post-author-meta">
                  <div class="post-author-line">
                    <span class="post-author-name">${escapeHtml(authorName)}</span>
                    <span class="post-activity-text">${escapeHtml(activityLabel)}</span>
                  </div>
                  <div class="post-submeta">
                    <span>${escapeHtml(timeLabel)}</span>
                    <span>&middot;</span>
                    <i class="fas fa-globe-americas" style="font-size:11px;"></i>
                  </div>
                </div>
              </div>
              <button type="button" class="post-more-btn" title="More options">
                <i class="fas fa-ellipsis-h"></i>
              </button>
            </div>

            ${captionHtml}
            ${imgHtml}

            <div class="post-stats-row">
              <div class="post-reactions-left">
                <span class="reaction-badges">
                  <span class="reaction-badge badge-heart"><i class="fas fa-heart"></i></span>
                  <span class="reaction-badge badge-care"><i class="fas fa-face-smile"></i></span>
                  <span class="reaction-badge badge-like"><i class="fas fa-thumbs-up"></i></span>
                </span>
                <span id="${likeCountId}">${likesCount}</span>
              </div>
              <div class="post-stats-right">
                <span>${commentsCount} comments</span>
                <span>${viewsCount} views</span>
              </div>
            </div>

            <div class="post-actions-bar">
              <button type="button" class="post-action-btn" onclick="togglePostLike(this, '${likeCountId}')">
                <i class="far fa-thumbs-up"></i>
                <span>Like</span>
              </button>
              <button type="button" class="post-action-btn" onclick="switchSubTab('all', document.querySelector('.sub-tab'))">
                <i class="far fa-comment"></i>
                <span>Comment</span>
              </button>
              <button type="button" class="post-action-btn">
                <i class="fas fa-share"></i>
                <span>Share</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    function setFriendsDisplay(count) {
      const num = Math.max(0, Number(count || 0));
      document.getElementById('friendsCount').textContent = String(num);
      document.getElementById('friendsSectionCount').textContent = String(num);
      const emptyEl = document.getElementById('friendsEmptyState');
      if (emptyEl) {
        emptyEl.style.display = num > 0 ? 'none' : 'block';
      }
    }

    function readLocalFallbackPosts() {
      const map = new Map();
      const stored = readStoredProfile();
      const extraKeys = [
        'autro_instant_feed_posts',
        'autro_post_cards',
        'autro_posts',
        'autrobook_posts',
        'feed_posts'
      ];

      const collected = [
        ...(Array.isArray(stored.posts) ? stored.posts : [])
      ];

      extraKeys.forEach((key) => {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            collected.push(...parsed);
          } else if (parsed && Array.isArray(parsed.posts)) {
            collected.push(...parsed.posts);
          }
        } catch (e) {}
      });

      collected.forEach((item, idx) => {
        if (!item || typeof item !== 'object') return;
        const text = getPostText(item);
        const img = getPostImageUrl(item);
        if (!text && !img) return;
        const uniqueKey = item.id ? String(item.id) : `${text.slice(0, 24)}__${img.slice(-24)}__${item.created_at || idx}`;
        if (!map.has(uniqueKey)) {
          map.set(uniqueKey, item);
        }
      });

      return Array.from(map.values()).sort((a, b) => {
        const tA = new Date(a.created_at || 0).getTime() || 0;
        const tB = new Date(b.created_at || 0).getTime() || 0;
        return tB - tA;
      });
    }

    function mergeUniquePosts(dbPosts, localPosts) {
      const map = new Map();
      const all = [...(Array.isArray(dbPosts) ? dbPosts : []), ...(Array.isArray(localPosts) ? localPosts : [])];
      all.forEach((p, idx) => {
        if (!p || typeof p !== 'object') return;
        const text = getPostText(p);
        const img = getPostImageUrl(p);
        if (!text && !img) return;
        const key = p.id ? String(p.id) : `${text.slice(0, 24)}__${img.slice(-24)}__${p.created_at || idx}`;
        if (!map.has(key)) {
          map.set(key, p);
        }
      });
      return Array.from(map.values()).sort((a, b) => {
        const tA = new Date(a.created_at || 0).getTime() || 0;
        const tB = new Date(b.created_at || 0).getTime() || 0;
        return tB - tA;
      });
    }

    function applyProfileData(data) {
      const fullName = (data.full_name || data.name || '').toString().trim();
      const usernameFormatted = normalizeUsername(data.username, fullName);

      document.getElementById('displayName').textContent = fullName;
      document.getElementById('displayUsername').textContent = usernameFormatted;

      setFriendsDisplay(data.friends_count ?? 0);

      const postsArr = mergeUniquePosts(data.posts, readLocalFallbackPosts());
      const postsNum = postsArr.length > 0 ? postsArr.length : Number(data.posts_count || 0);
      document.getElementById('postsCountLabel').textContent = `${postsNum} ${postsNum === 1 ? 'post' : 'posts'}`;

      const thoughtEl = document.getElementById('thoughtBubble');
      if (thoughtEl && data.thought) {
        thoughtEl.textContent = data.thought;
      }

      const avatarUrl = data.avatar_url || data.selfie_url || '';
      const coverUrl = data.cover_url || '';

      setImageIfPresent(document.getElementById('avatarImg'), avatarUrl);
      setImageIfPresent(document.getElementById('coverImg'), coverUrl);
      renderPhotos(avatarUrl, coverUrl, postsArr);
      renderLivePosts(postsArr);
      renderDetails(data);
    }

    function readStoredProfile() {
      let stored = {};
      try {
        stored = JSON.parse(localStorage.getItem('autrobook_user') || '{}') || {};
      } catch (e) {}
      try {
        if (!stored.full_name && localStorage.getItem('signup_name')) {
          stored.full_name = localStorage.getItem('signup_name');
        }
        if (!stored.username && localStorage.getItem('signup_username')) {
          stored.username = localStorage.getItem('signup_username');
        }
        if (!stored.avatar_url && localStorage.getItem('autro_avatar_url')) {
          stored.avatar_url = localStorage.getItem('autro_avatar_url');
        }
        if (!stored.cover_url && localStorage.getItem('autro_cover_url')) {
          stored.cover_url = localStorage.getItem('autro_cover_url');
        }
      } catch (e) {}
      return stored;
    }

    async function refreshLiveCounts(userId) {
      await refreshStoryRing(userId);
      const localPosts = readLocalFallbackPosts();

      if (!sb) {
        renderLivePosts(localPosts);
        return;
      }

      let friendsTotal = 0;
      let dbPosts = [];

      if (userId) {
        try {
          const { data: rpcCounts, error: rpcErr } = await sb
            .rpc('get_profile_live_counts', { target_user_id: userId })
            .maybeSingle();

          if (!rpcErr && rpcCounts && typeof rpcCounts.friends_count !== 'undefined') {
            friendsTotal = Number(rpcCounts.friends_count || 0);
          } else {
            const { count, error } = await sb
              .from('friends')
              .select('*', { count: 'exact', head: true })
              .eq('status', 'accepted')
              .or(`user_id.eq.${userId},friend_id.eq.${userId}`);
            if (!error && typeof count === 'number') {
              friendsTotal = count;
            }
          }
        } catch (e) {
          console.warn('Friends count error:', e);
        }
      }

      try {
        const { data, error } = await sb
          .from('posts')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(50);
        if (!error && Array.isArray(data)) {
          dbPosts = userId
            ? data.filter(p => (!p.user_id && !p.author_id) || p.user_id === userId || p.author_id === userId)
            : data;
        }
      } catch (e) {
        console.warn('Posts fetch error:', e);
      }

      const finalPosts = mergeUniquePosts(dbPosts, localPosts);

      setFriendsDisplay(friendsTotal);
      renderLivePosts(finalPosts);

      const current = readStoredProfile();
      const avatarUrl = current.avatar_url || current.selfie_url || '';
      const coverUrl = current.cover_url || '';
      renderPhotos(avatarUrl, coverUrl, finalPosts);
    }

    function subscribeRealtime(userId) {
      if (!sb || !userId || typeof sb.channel !== 'function') return;
      try {
        sb.channel('autro-live-profile-' + userId)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'friends' }, () => refreshLiveCounts(userId))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => refreshLiveCounts(userId))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'stories' }, () => refreshStoryRing(userId))
          .subscribe();
      } catch (e) {
        console.warn('Realtime skipped:', e);
      }
    }

    async function loadProfile() {
      const localData = readStoredProfile();
      applyProfileData(localData);
      await refreshStoryRing(null);

      if (!sb) return;
      try {
        const { data: sessionData } = await sb.auth.getSession();
        const user = sessionData?.session?.user;
        if (!user) return;

        activeUserId = user.id;

        const { data: row } = await sb
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .maybeSingle();

        const merged = Object.assign({}, localData, row || {}, {
          full_name: (row && row.full_name) || user.user_metadata?.full_name || localData.full_name || '',
          username: (row && row.username) || user.user_metadata?.username || localData.username || '',
          avatar_url: (row && (row.avatar_url || row.selfie_url)) || localData.avatar_url || '',
          cover_url: (row && row.cover_url) || localData.cover_url || ''
        });

        try {
          localStorage.setItem('autrobook_user', JSON.stringify(merged));
        } catch (e) {}

        applyProfileData(merged);
        await refreshLiveCounts(user.id);
        subscribeRealtime(user.id);
      } catch (err) {
        console.warn('Profile fetch skipped:', err);
      }
    }

    function editThought() {
      const current = readStoredProfile();
      const next = prompt('Drop a thought...', current.thought || '');
      if (next === null) return;
      current.thought = next.trim();
      try {
        localStorage.setItem('autrobook_user', JSON.stringify(current));
      } catch (e) {}
      document.getElementById('thoughtBubble').textContent = current.thought || 'Drop a thought...';
    }

    function switchSubTab(panelName, btnEl) {
      document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      const target = document.getElementById('panel-' + panelName);
      if (target) target.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
