<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --dark-green: #0B3D20;
      --dark-green-hover: #072915;
      --accent-green: #0a7d3b;
      --accent-mint: #10b981;
      --dark-green-soft: rgba(11, 61, 32, 0.12);
      --bg: #ffffff;
      --surface: #f4f6f5;
      --card: #ffffff;
      --text: #000000;
      --muted: #3d4741;
      --border: #d6ddd8;
      --btn-sec: #e8ece9;
      --btn-sec-hover: #d8dfd9;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --dark-green-soft: rgba(16, 185, 129, 0.18);
        --bg: #000000;
        --surface: #0e120f;
        --card: #121713;
        --text: #ffffff;
        --muted: #b8c2bb;
        --border: #232c26;
        --btn-sec: #171e19;
        --btn-sec-hover: #212b24;
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.55);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.75);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 54px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .top-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .top-btn:hover {
      background: var(--surface);
    }

    .top-btn:active {
      transform: scale(0.95);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Cover Photo */
    .cover-wrap {
      position: relative;
      width: 100%;
      height: 215px;
      background: var(--surface);
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-img.has-img {
      display: block;
    }

    .cam-btn {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-sec);
      color: var(--text);
      border: 2px solid var(--bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      z-index: 5;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .cam-btn:hover {
      background: var(--btn-sec-hover);
    }

    .cam-btn:active {
      transform: scale(0.94);
    }

    .cover-cam {
      right: 14px;
      bottom: 12px;
    }

    /* Avatar + Thought Bubble */
    .avatar-section {
      position: relative;
      padding: 0 16px;
      margin-top: -78px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thought-bubble {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 7px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.18s ease, color 0.18s ease;
    }

    .thought-bubble:hover {
      border-color: var(--accent-mint);
      color: var(--text);
    }

    .avatar-box {
      position: relative;
      width: 144px;
      height: 144px;
      border-radius: 50%;
      background: var(--surface);
      border: 4px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      box-shadow: var(--shadow-md);
      transition: background 0.22s ease, padding 0.22s ease, box-shadow 0.22s ease;
    }

    .avatar-box.has-story {
      padding: 4px;
      background: linear-gradient(135deg, var(--accent-mint), var(--accent-green), var(--dark-green));
      border-color: var(--bg);
      box-shadow: 0 0 0 2px var(--dark-green), 0 8px 24px rgba(10, 125, 59, 0.35);
      cursor: pointer;
    }

    .avatar-box.has-story .avatar-img {
      border: 3px solid var(--bg);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .avatar-img.has-img {
      display: block;
    }

    .avatar-cam {
      right: 4px;
      bottom: 4px;
    }

    /* Profile Header Info */
    .profile-meta {
      text-align: center;
      padding: 12px 16px 6px;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      min-height: 30px;
      letter-spacing: -0.3px;
    }

    .profile-username {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
      min-height: 18px;
    }

    .friends-count {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Primary Action Row */
    .action-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px 14px;
    }

    .btn-story {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--dark-green);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .btn-story:hover {
      background: var(--dark-green-hover);
    }

    .btn-story:active {
      transform: scale(0.98);
    }

    .btn-edit {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--btn-sec);
      color: var(--text);
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .btn-edit:hover {
      background: var(--btn-sec-hover);
    }

    .btn-edit:active {
      transform: scale(0.98);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 16px;
    }

    /* Sub Tabs */
    .sub-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
    }

    .sub-tab {
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .sub-tab.active {
      background: var(--dark-green-soft);
      color: var(--text);
    }

    @media (prefers-color-scheme: light) {
      .sub-tab.active {
        color: var(--dark-green);
      }
    }

    /* Sections */
    .section-block {
      padding: 16px 0;
      border-top: 6px solid var(--surface);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .section-link {
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
    }

    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 14.5px;
      color: var(--text);
      padding: 0 16px;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .detail-item i {
      width: 18px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      margin: 0 16px;
      color: var(--muted);
      font-size: 14px;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .empty-state i {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.65;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 0 16px;
    }

    .media-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: var(--surface);
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* Post Card (Facebook Style) */
    .post-card {
      padding: 12px 0 6px;
      background: var(--card);
      border-top: 6px solid var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .post-card:first-child {
      border-top: none;
      padding-top: 4px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 10px;
      gap: 10px;
    }

    .post-author-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .post-author-avatar-link {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .post-author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
      border: 1.5px solid var(--accent-mint);
      flex-shrink: 0;
      display: block;
    }

    .post-author-fallback {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--dark-green);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .post-author-meta {
      min-width: 0;
    }

    .post-author-line {
      font-size: 14.5px;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }

    .post-author-name {
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .post-author-name:hover {
      text-decoration: underline;
    }

    .post-activity-text {
      font-weight: 400;
      color: var(--muted);
    }

    .post-submeta {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .post-more-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .post-more-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .post-card-text {
      padding: 0 14px 10px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-card-img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      background: var(--surface);
      cursor: pointer;
    }

    .post-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      font-size: 12.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .post-reactions-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text);
    }

    .post-stats-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    .post-actions-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 3px 6px 0;
    }

    .post-action-btn {
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .post-action-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .post-action-btn.active {
      color: var(--accent-mint);
      font-weight: 800;
    }

    /* Comments & Replies on Profile Posts */
    .comments-panel {
      border-top: 1px solid var(--border);
      padding: 10px 14px 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .comments-panel.open {
      display: flex;
    }

    .composer-line {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text-pill-input {
      flex: 1;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 13px;
      font-size: 13.5px;
      outline: none;
    }

    .text-pill-input::placeholder {
      color: var(--muted);
    }

    .pill-btn {
      background: var(--btn-sec);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .pill-btn:hover {
      background: var(--btn-sec-hover);
    }

    .pill-btn.solid {
      background: var(--dark-green);
      color: #ffffff;
    }

    .comment-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comment-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .comment-author-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .comment-author:hover {
      text-decoration: underline;
    }

    .comment-time {
      font-size: 11.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .comment-body {
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--text);
      word-break: break-word;
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .c-chip-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .c-chip-btn.active {
      background: var(--dark-green);
      color: #ffffff;
    }

    .replies-list {
      margin-left: 12px;
      padding-left: 10px;
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reply-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .reply-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .reply-author {
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .reply-time {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Reaction Popup, Share Menu, Dots Menu, Report Modal */
    .reaction-popup {
      position: fixed;
      z-index: 260;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 7px;
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      user-select: none;
      max-width: calc(100vw - 16px);
    }

    .reaction-popup.open {
      display: flex;
    }

    .reaction-emoji-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .reaction-emoji-btn:hover,
    .reaction-emoji-btn:active {
      background: var(--surface);
      transform: scale(1.22);
    }

    .share-menu,
    .dots-menu {
      position: fixed;
      z-index: 260;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 150px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .share-menu.open,
    .dots-menu.open {
      display: flex;
    }

    .share-menu-btn,
    .dots-menu-btn {
      background: transparent;
      color: var(--text);
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .share-menu-btn:hover,
    .dots-menu-btn:hover {
      background: var(--surface);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 320;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      max-width: 410px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reason-option {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .reason-option.selected {
      background: var(--dark-green);
      color: #ffffff;
      font-weight: 700;
    }

    .toast-pill {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dark-green);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 420;
      display: none;
    }

    /* Autrobook Studio Preview Modal */
    .studio-modal {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: var(--bg);
      color: var(--text);
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .studio-modal.open {
      display: flex;
    }

    .studio-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .studio-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    function playReactionSound() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(560, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (_) {}
    }

    function formatLiveElapsed(createdAtStr) {
      if (!createdAtStr) return '0s';
      const createdMs = new Date(createdAtStr).getTime();
      if (Number.isNaN(createdMs)) return '0s';
      const diffSec = Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}d`;
    }

    async function renderEditedPhotoToDataUrl() {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const isCover = editorTarget === 'cover';
          const canvas = document.createElement('canvas');
          canvas.width = isCover ? 1200 : 800;
          canvas.height = isCover ? 630 : 800;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            resolve(editorSourceUrl);
            return;
          }

          const filterVal = restyleFilters[restyleIndex % restyleFilters.length];
          ctx.filter = filterVal === 'none' ? 'none' : filterVal;

          const scale = cropScales[cropZoomIndex % cropScales.length];
          const imgRatio = img.width / img.height;
          const canvasRatio = canvas.width / canvas.height;

          let drawW = canvas.width;
          let drawH = canvas.height;
          if (imgRatio > canvasRatio) {
            drawW = canvas.height * imgRatio;
          } else {
            drawH = canvas.width / imgRatio;
          }

          drawW *= scale;
          drawH *= scale;

          const dx = (canvas.width - drawW) / 2;
          const dy = (canvas.height - drawH) / 2;
          ctx.drawImage(img, dx, dy, drawW, drawH);

          ctx.filter = 'none';
          if (isFramed) {
            ctx.lineWidth = Math.round(canvas.width * 0.03);
            ctx.strokeStyle = '#10b981';
            ctx.strokeRect(
              ctx.lineWidth / 2,
              ctx.lineWidth / 2,
              canvas.width - ctx.lineWidth,
              canvas.height - ctx.lineWidth
            );
          }

          try {
            resolve(canvas.toDataURL('image/jpeg', 0.88));
          } catch (e) {
            resolve(editorSourceUrl);
          }
        };
        img.onerror = () => resolve(editorSourceUrl);
        img.src = editorSourceUrl;
      });
    }

    async function savePreviewPhoto() {
      const saveBtn = document.getElementById('editorSaveBtn');
      if (saveBtn) saveBtn.disabled = true;

      try {
        const finalDataUrl = await renderEditedPhotoToDataUrl();
        const caption = (document.getElementById('editorCaptionInput')?.value || '').trim();
        const shareToFeed = Boolean(document.getElementById('shareToFeedCheckbox')?.checked);
        const privacy = document.getElementById('editorPrivacySelect')?.value || 'public';
        const tempDuration = isTemporary
          ? (document.getElementById('editorTempDuration')?.value || '7d')
          : null;

        let finalUrl = finalDataUrl;

        if (sb && activeUserId) {
          const bucket = editorTarget === 'cover' ? 'covers' : 'avatars';
          const filePath = `${activeUserId}/${editorTarget}-${Date.now()}.jpg`;
          try {
            const blob = await (await fetch(finalDataUrl)).blob();
            const { error: upErr } = await sb.storage
              .from(bucket)
              .upload(filePath, blob, { contentType: 'image/jpeg', upsert: true });

            if (!upErr) {
              const { data: pubData } = sb.storage.from(bucket).getPublicUrl(filePath);
              if (pubData?.publicUrl) {
                finalUrl = pubData.publicUrl;
              }
            }
          } catch (storageErr) {
            console.warn('Storage upload fallback to dataUrl:', storageErr);
          }

          const profilePatch = editorTarget === 'cover'
            ? { id: activeUserId, cover_url: finalUrl }
            : { id: activeUserId, avatar_url: finalUrl };

          try {
            await sb.from('profiles').upsert(profilePatch);
          } catch (profErr) {
            console.warn('Profile upsert error:', profErr);
          }

          if (shareToFeed) {
            const defaultPostText = editorTarget === 'cover'
              ? 'Updated cover photo'
              : 'Updated profile picture';
            const postContent = caption || defaultPostText;
            try {
              await sb.from('posts').insert({
                user_id: activeUserId,
                author_id: activeUserId,
                author_name: activeAuthorName || 'Autrobook User',
                caption: postContent,
                content: postContent,
                media_url: finalUrl,
                image_url: finalUrl
              });
            } catch (postErr) {
              console.warn('Feed post insert error:', postErr);
            }
          }
        }

        const current = readStoredProfile();
        if (editorTarget === 'cover') {
          current.cover_url = finalUrl;
          current.cover_privacy = privacy;
          current.cover_temp_until = tempDuration;
          try { localStorage.setItem('autro_cover_url', finalUrl); } catch (e) {}
        } else {
          current.avatar_url = finalUrl;
          current.avatar_privacy = privacy;
          current.avatar_temp_until = tempDuration;
          try { localStorage.setItem('autro_avatar_url', finalUrl); } catch (e) {}
        }

        if (shareToFeed) {
          const localPosts = Array.isArray(current.posts) ? current.posts : [];
          localPosts.unshift({
            id: `local-${Date.now()}`,
            user_id: activeUserId || null,
            author_name: activeAuthorName || current.full_name || 'Autrobook User',
            caption: caption || (editorTarget === 'cover' ? 'Updated cover photo' : 'Updated profile picture'),
            content: caption || (editorTarget === 'cover' ? 'Updated cover photo' : 'Updated profile picture'),
            media_url: finalUrl,
            image_url: finalUrl,
            created_at: new Date().toISOString()
          });
          current.posts = localPosts;
          current.posts_count = localPosts.length;
        }

        try {
          localStorage.setItem('autrobook_user', JSON.stringify(current));
        } catch (e) {}

        applyProfileData(current);
        if (sb && (viewedUserId || activeUserId)) {
          await refreshLiveCounts(viewedUserId || activeUserId);
        }
        closePreviewEditor();
      } finally {
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    async function applyReaction(target, emoji) {
      if (!target) return;

      if (target.type === 'post') {
        const post = renderedPostsModel.find(p => p.id === target.postId);
        if (!post) return;

        if (post.userReaction === emoji) {
          post.userReaction = null;
          post.reaction_count = Math.max(0, Number(post.reaction_count || 0) - 1);
          writeLocalReactionState(post.id, { emoji: null, count: post.reaction_count });
          if (activeUserId && sb && !String(post.id).startsWith('local-')) {
            await sb.from('post_reactions').delete().eq('post_id', post.id).eq('user_id', activeUserId);
          }
          await syncPostReactionCount(post.id, post.reaction_count);
          renderLivePosts(renderedPostsModel);
          showToast('Reaction undone');
          return;
        }

        if (!post.userReaction) {
          post.reaction_count = Number(post.reaction_count || 0) + 1;
        }
        post.userReaction = emoji;
        writeLocalReactionState(post.id, { emoji: post.userReaction, count: post.reaction_count });

        if (activeUserId && sb && !String(post.id).startsWith('local-')) {
          await sb.from('post_reactions').upsert(
            { post_id: post.id, user_id: activeUserId, reaction_emoji: emoji },
            { onConflict: 'post_id,user_id' }
          );
        }
        await syncPostReactionCount(post.id, post.reaction_count);
        renderLivePosts(renderedPostsModel);
      } else if (target.type === 'comment') {
        const list = commentsByPost.get(target.postId) || readLocalComments(target.postId);
        const cmt = list.find(c => c.id === target.commentId);
        if (!cmt) return;

        if (cmt.userReaction === emoji) {
          cmt.userReaction = null;
          cmt.like_count = Math.max(0, Number(cmt.like_count || 0) - 1);
          commentsByPost.set(target.postId, list);
          writeLocalComments(target.postId, list);
          renderLivePosts(renderedPostsModel);
          showToast('Reaction undone');
          return;
        }

        if (!cmt.userReaction) {
          cmt.like_count = Number(cmt.like_count || 0) + 1;
        }
        cmt.userReaction = emoji;
        commentsByPost.set(target.postId, list);
        writeLocalComments(target.postId, list);
        renderLivePosts(renderedPostsModel);
      }
    }

    async function toggleVoiceRecord(postId, recordBtn, statusLabel, clearBtn) {
      if (!isRecording) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          showToast('Voice recording is not supported on this browser.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceChunks = [];
          recordedVoiceUrl = '';
          recordedVoiceSec = 0;
          recordingPostId = postId;
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) voiceChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(voiceTimer);
            isRecording = false;
            recordBtn.textContent = '30s Voice';
            const blob = new Blob(voiceChunks, { type: 'audio/webm' });
            recordedVoiceUrl = URL.createObjectURL(blob);
            statusLabel.textContent = `Voice ready (${recordedVoiceSec}s)`;
            clearBtn.style.display = 'inline-block';
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.textContent = 'Stop';
          clearBtn.style.display = 'none';
          statusLabel.textContent = '0s / 30s';

          voiceTimer = setInterval(() => {
            recordedVoiceSec += 1;
            statusLabel.textContent = `${recordedVoiceSec}s / 30s`;
            if (recordedVoiceSec >= 30 && mediaRecorder && mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          }, 1000);
        } catch (_) {
          showToast('Microphone access is required for voice comment.');
        }
      } else if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

          });
        } catch (_) {}
      }

      closeReportModal();
      showToast(`Report ${actionType} sent`);
    }

    function normalizePostModel(rawPost, idx) {
      const localReactions = readLocalReactionState();
      const sharedSet = readSharedPostsSet();
      const id = rawPost.id || `local-prof-${idx}-${Date.now()}`;
      const locR = localReactions[id];
      const baseCount = Number(rawPost.reaction_count ?? rawPost.likes_count ?? rawPost.reactions_count ?? 0);
      const baseShare = Number(rawPost.share_count ?? rawPost.shares_count ?? 0);

      const prev = renderedPostsModel.find(x => x.id === id);

      return {
        id,
        user_id: rawPost.user_id || rawPost.author_id || viewedUserId || activeUserId || '',
        author_name: rawPost.author_name || '',
        caption: getPostText(rawPost),
        content: getPostText(rawPost),
        media_url: getPostImageUrl(rawPost),
        image_url: getPostImageUrl(rawPost),
        created_at: rawPost.created_at || new Date().toISOString(),
        reaction_count: Math.max(baseCount, Number(locR?.count || 0)),
        comment_count: Number(rawPost.comment_count ?? rawPost.comments_count ?? 0),
        share_count: Math.max(baseShare, Number(sharedSet[id] || 0)),
        view_count: Number(rawPost.view_count ?? rawPost.views_count ?? 0),
        userReaction: locR?.emoji ?? prev?.userReaction ?? null,
        _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, id) || Boolean(prev?._sharedOnce),
        _commentsOpen: Boolean(prev?._commentsOpen)
      };
    }

    function readLocalFallbackPosts() {
      const map = new Map();
      const stored = readStoredProfile();
      const extraKeys = [
        'autro_instant_feed_posts',
        'autro_post_cards',
        'autro_posts',
        'autrobook_posts',
        'feed_posts'
      ];

      const collected = [
        ...(Array.isArray(stored.posts) ? stored.posts : [])
      ];

      extraKeys.forEach((key) => {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            collected.push(...parsed);
          } else if (parsed && Array.isArray(parsed.posts)) {
            collected.push(...parsed.posts);
          }
        } catch (e) {}
      });

      collected.forEach((item, idx) => {
        if (!item || typeof item !== 'object') return;
        const text = getPostText(item);
        const img = getPostImageUrl(item);
        if (!text && !img) return;
        const uniqueKey = item.id ? String(item.id) : `${text.slice(0, 24)}__${img.slice(-24)}__${item.created_at || idx}`;
        if (!map.has(uniqueKey)) {
          map.set(uniqueKey, item);
        }
      });

      return Array.from(map.values()).sort((a, b) => {
        const tA = new Date(a.created_at || 0).getTime() || 0;
        const tB = new Date(b.created_at || 0).getTime() || 0;
        return tB - tA;
      });
    }

    function mergeUniquePosts(dbPosts, localPosts) {
      const map = new Map();
      const all = [...(Array.isArray(dbPosts) ? dbPosts : []), ...(Array.isArray(localPosts) ? localPosts : [])];
      all.forEach((p, idx) => {
        if (!p || typeof p !== 'object') return;
        const text = getPostText(p);
        const img = getPostImageUrl(p);
        if (!text && !img) return;
        const key = p.id ? String(p.id) : `${text.slice(0, 24)}__${img.slice(-24)}__${p.created_at || idx}`;
        if (!map.has(key)) {
          map.set(key, p);
        }
      });
      return Array.from(map.values()).sort((a, b) => {
        const tA = new Date(a.created_at || 0).getTime() || 0;
        const tB = new Date(b.created_at || 0).getTime() || 0;
        return tB - tA;
      });
    }

    function applyProfileData(data) {
      const fullName = (data.full_name || data.name || '').toString().trim();
      const usernameFormatted = normalizeUsername(data.username, fullName);

      if (fullName) {
        activeAuthorName = fullName;
        try { localStorage.setItem('autro_profile_name', fullName); } catch (e) {}
      }

      document.getElementById('displayName').textContent = fullName;
      document.getElementById('displayUsername').textContent = usernameFormatted;

      setFriendsDisplay(data.friends_count ?? 0);

      const postsArr = mergeUniquePosts(data.posts, readLocalFallbackPosts());
      const postsNum = postsArr.length > 0 ? postsArr.length : Number(data.posts_count || 0);
      document.getElementById('postsCountLabel').textContent = `${postsNum} ${postsNum === 1 ? 'post' : 'posts'}`;

      const thoughtEl = document.getElementById('thoughtBubble');
      if (thoughtEl && data.thought) {
        thoughtEl.textContent = data.thought;
      }

      const avatarUrl = data.avatar_url || data.selfie_url || '';
      const coverUrl = data.cover_url || '';

      setImageIfPresent(document.getElementById('avatarImg'), avatarUrl);
      setImageIfPresent(document.getElementById('coverImg'), coverUrl);
      renderPhotos(avatarUrl, coverUrl, postsArr);
      renderLivePosts(postsArr);
      renderDetails(data);
    }

    function readStoredProfile() {
      let stored = {};
      try {
        stored = JSON.parse(localStorage.getItem('autrobook_user') || '{}') || {};
      } catch (e) {}
      try {
        if (!stored.full_name && localStorage.getItem('signup_name')) {
          stored.full_name = localStorage.getItem('signup_name');
        }
        if (!stored.username && localStorage.getItem('signup_username')) {
          stored.username = localStorage.getItem('signup_username');
        }
        if (!stored.avatar_url && localStorage.getItem('autro_avatar_url')) {
          stored.avatar_url = localStorage.getItem('autro_avatar_url');
        }
        if (!stored.cover_url && localStorage.getItem('autro_cover_url')) {
          stored.cover_url = localStorage.getItem('autro_cover_url');
        }
      } catch (e) {}
      return stored;
    }

    async function refreshLiveCounts(userId) {
      await refreshStoryRing(userId);
      const localPosts = readLocalFallbackPosts();

      if (!sb) {
        renderLivePosts(localPosts);
        return;
      }

      let friendsTotal = 0;
      let dbPosts = [];

      if (userId) {
        try {
          const { data: rpcCounts, error: rpcErr } = await sb
            .rpc('get_profile_live_counts', { target_user_id: userId })
            .maybeSingle();

          if (!rpcErr && rpcCounts && typeof rpcCounts.friends_count !== 'undefined') {
            friendsTotal = Number(rpcCounts.friends_count || 0);
          } else {
            const { count, error } = await sb
              .from('friends')
              .select('*', { count: 'exact', head: true })
              .eq('status', 'accepted')
              .or(`user_id.eq.${userId},friend_id.eq.${userId}`);
            if (!error && typeof count === 'number') {
              friendsTotal = count;
            }
          }
        } catch (e) {
          console.warn('Friends count error:', e);
        }
      }

      try {
        const { data, error } = await sb
          .from('posts')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(50);
        if (!error && Array.isArray(data)) {
          dbPosts = userId
            ? data.filter(p => (!p.user_id && !p.author_id) || p.user_id === userId || p.author_id === userId)
            : data;
        }
      } catch (e) {
        console.warn('Posts fetch error:', e);
      }

      const finalPosts = mergeUniquePosts(dbPosts, localPosts);

      setFriendsDisplay(friendsTotal);
      renderLivePosts(finalPosts);

      const current = readStoredProfile();
      const avatarUrl = current.avatar_url || current.selfie_url || '';
      const coverUrl = current.cover_url || '';
      renderPhotos(avatarUrl, coverUrl, finalPosts);
    }

    function subscribeRealtime(userId) {
      if (!sb || !userId || typeof sb.channel !== 'function') return;
      try {
        sb.channel('autro-live-profile-' + userId)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'friends' }, () => refreshLiveCounts(userId))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => refreshLiveCounts(userId))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'stories' }, () => refreshStoryRing(userId))
          .subscribe();
      } catch (e) {
        console.warn('Realtime skipped:', e);
      }
    }

    async function loadProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const paramUserId = urlParams.get('user') || urlParams.get('id') || '';

      const localData = readStoredProfile();
      applyProfileData(localData);
      await refreshStoryRing(null);

      if (!sb) return;
      try {
        const { data: sessionData } = await sb.auth.getSession();
        const sessionUser = sessionData?.session?.user || null;
        if (sessionUser) {
          activeUserId = sessionUser.id;
        }

        const targetId = paramUserId || activeUserId;
        if (!targetId) return;
        viewedUserId = targetId;

        const { data: row } = await sb
          .from('profiles')
          .select('*')
          .eq('id', targetId)
          .maybeSingle();

        const isOwn = Boolean(activeUserId && targetId === activeUserId);
        const merged = Object.assign(
          {},
          isOwn ? localData : {},
          row || {},
          {
            full_name: (row && row.full_name) || (isOwn ? (sessionUser?.user_metadata?.full_name || localData.full_name) : '') || '',
            username: (row && row.username) || (isOwn ? (sessionUser?.user_metadata?.username || localData.username) : '') || '',
            avatar_url: (row && (row.avatar_url || row.selfie_url)) || (isOwn ? localData.avatar_url : '') || '',
            cover_url: (row && row.cover_url) || (isOwn ? localData.cover_url : '') || ''
          }
        );

        if (isOwn) {
          try {
            localStorage.setItem('autrobook_user', JSON.stringify(merged));
          } catch (e) {}
        }

        applyProfileData(merged);
        await refreshLiveCounts(targetId);
        subscribeRealtime(targetId);
      } catch (err) {
        console.warn('Profile fetch skipped:', err);
      }
    }

    function editThought() {
      const current = readStoredProfile();
      const next = prompt('Drop a thought...', current.thought || '');
      if (next === null) return;
      current.thought = next.trim();
      try {
        localStorage.setItem('autrobook_user', JSON.stringify(current));
      } catch (e) {}
      document.getElementById('thoughtBubble').textContent = current.thought || 'Drop a thought...';
    }

    function switchSubTab(panelName, btnEl) {
      document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      const target = document.getElementById('panel-' + panelName);
      if (target) target.classList.add('active');
    }

    document.getElementById('shareToChatOption').addEventListener('click', () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      sessionStorage.setItem('autro_shared_post_payload', JSON.stringify({
        postId: activeSharePost.id,
        url: postUrl,
        caption: activeSharePost.caption || '',
        assets: ['autro-chat.html', 'autro-chat.css', 'autro-chat.js']
      }));
      closeShareMenu();
      window.location.href = `autro-chat.html?share=${encodeURIComponent(postUrl)}&assets=autro-chat.html,autro-chat.css,autro-chat.js`;
    });

    document.getElementById('copyPostLinkOption').addEventListener('click', async () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(postUrl);
        } else {
          const tmp = document.createElement('textarea');
          tmp.value = postUrl;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand('copy');
          tmp.remove();
        }
        showToast('Link copied');
      } catch (_) {
        showToast('Could not copy link');
      }
      closeShareMenu();
    });

    document.getElementById('saveCommentOption').addEventListener('click', async () => {
      if (!activeCommentMenuData) return;
      const savedList = JSON.parse(localStorage.getItem('autro_saved_items') || '[]');
      savedList.unshift({
        type: 'comment',
        postId: activeCommentMenuData.postId,
        comment: activeCommentMenuData.comment,
        savedAt: new Date().toISOString()
      });
      localStorage.setItem('autro_saved_items', JSON.stringify(savedList));

      if (sb && activeUserId && !String(activeCommentMenuData.comment.id).startsWith('cmt-')) {
        try {
          await sb.from('saved_items').insert({
            user_id: activeUserId,
            post_id: String(activeCommentMenuData.postId).startsWith('local-') ? null : activeCommentMenuData.postId,
            comment_id: activeCommentMenuData.comment.id
          });
        } catch (_) {}
      }

      closeDotsMenu();
      showToast('Saved to save-item.html');
      window.location.href = 'save-item.html';
    });

    document.getElementById('reportCommentOption').addEventListener('click', openReportModal);
    document.getElementById('closeReportBtn').addEventListener('click', closeReportModal);
    document.getElementById('submitReportBtn').addEventListener('click', () => submitReportAction('Submit'));
    document.getElementById('sendReportBtn').addEventListener('click', () => submitReportAction('Send'));

    document.addEventListener('click', (e) => {
      if (ignoreNextDocumentClick) {
        ignoreNextDocumentClick = false;
        return;
      }
      const popup = document.getElementById('reactionPopup');
      if (popup.classList.contains('open') && !popup.contains(e.target)) {
        closeReactionPopup();
      }
      const sMenu = document.getElementById('shareMenu');
      if (sMenu.classList.contains('open') && !sMenu.contains(e.target)) {
        closeShareMenu();
      }
      const dMenu = document.getElementById('dotsMenu');
      if (dMenu.classList.contains('open') && !dMenu.contains(e.target)) {
        closeDotsMenu();
      }
    });

    setInterval(refreshLiveTimersOnly, 1000);
    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
  </html>
