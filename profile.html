<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Profile - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --brand:#4caf50; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;} 
body{background:var(--bg);color:var(--text);} 
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:var(--card);position:sticky;top:0;z-index:99;} 
.cover{height:180px;background:#222;position:relative;} 
.profile-pic{width:130px;height:130px;border-radius:50%;border:4px solid var(--bg);position:absolute;bottom:-65px;left:16px;object-fit:cover;background:#555;} 
.pro-badge{position:absolute;bottom:0;right:0;background:#1877f2;color:white;padding:2px 8px;font-size:10px;border-radius:4px;display:none;} 
.guard-badge{background:var(--brand);padding:4px 10px;border-radius:20px;font-size:12px;position:absolute;top:16px;right:16px;display:none;} 
.profile-info{padding:75px 16px 16px;} 
.btn{padding:8px 16px;border-radius:6px;border:none;background:var(--brand);color:white;font-weight:bold;cursor:pointer;width:100%;} 
.tabs{display:flex;border-bottom:1px solid var(--border);} 
.tab{flex:1;text-align:center;padding:12px;cursor:pointer;} 
.tab.active{border-bottom:2px solid var(--brand);color:var(--brand);} 
.post-card{background:var(--card);margin:12px 0;padding:12px;border-radius:8px;} 
.post-header{display:flex;align-items:center;gap:10px;position:relative;} 
.post-header img{width:40px;height:40px;border-radius:50%;background:#555;} 
.post-menu{margin-left:auto;font-size:20px;cursor:pointer;padding:5px;} 
.post-menu-list{position:absolute;right:10px;top:40px;background:#333;padding:8px;border-radius:8px;display:none;z-index:10;width:220px;box-shadow:0 2px 10px #000;} 
.post-menu-list div{padding:10px;cursor:pointer;border-radius:6px;font-size:14px;} 
.post-menu-list div:hover{background:#444;} 
.post-actions{display:flex;justify-content:space-around;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;} 
.post-actions button{background:none;border:none;color:var(--text);cursor:pointer;font-size:15px;flex:1;display:flex;align-items:center;justify-content:center;gap:5px;} 
.liked{color:#1877f2 !important;} 
.comment-box{display:flex;gap:8px;margin-top:10px;}
.comment-box input{flex:1;background:#3a3b3c;border:none;border-radius:20px;padding:8px 12px;color:var(--text);}
.comment-box button{background:var(--brand);border:none;border-radius:20px;padding:8px 15px;color:white;font-weight:bold;cursor:pointer;}
.comments{margin-top:10px;font-size:14px;}
.comments div{background:#3a3b3c;padding:8px;border-radius:8px;margin-top:5px;}
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Autrobook</b>
<span onclick="window.location.href='main-settings.html'" style="font-size:22px">⚙️</span> 
</div>

<div class="cover">
<div class="guard-badge" id="guardBadge">🛡️ Guard On</div>
<img id="profilePic" class="profile-pic">
<div class="pro-badge" id="proBadge">PRO</div>
</div>

<div class="profile-info">
<h2 id="profileName">Abir Mazumder</h2>
<p style="color:#aaa">@you</p>
<button class="btn" onclick="proModeAction()">Edit Profile</button>
</div>

<div class="tabs">
<div class="tab active">Posts</div>
<div class="tab">About</div>
<div class="tab">Friends</div>
</div>

<div id="postsContainer"></div>

<script> 
let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {name:"Abir Mazumder",profilePic:"",professional:false,profileGuard:false};
let myReactions = JSON.parse(localStorage.getItem('my_reactions')) || {};
let posts = JSON.parse(localStorage.getItem('posts')) || [{id:1,text:"সানি লিয়ন",time:"2h ago",comments:[]}];

window.onload = loadProfile;

function loadProfile(){
document.getElementById('profileName').innerText = currentUser.name;
document.getElementById('profilePic').src = currentUser.profilePic || 'https://via.placeholder.com/130/555/fff';
if(currentUser.professional) document.getElementById('proBadge').style.display='block';
if(currentUser.profileGuard) document.getElementById('guardBadge').style.display='block';
renderPosts();
}

function proModeAction(){
if(currentUser.professional){
window.location.href = 'dashboard.html'; // Pro হলে Dashboard
}else{
window.location.href = 'edit-profile.html'; // Pro না হলে Edit
}
}

function renderPosts(){
let html = '';
posts.forEach(post=>{
let isLiked = myReactions[post.id] ? 'liked' : '';
html += `
<div class="post-card" id="post-${post.id}">
  <div class="post-header">
    <img src="${currentUser.profilePic || 'https://via.placeholder.com/40/555/fff'}">
    <div><b>${currentUser.name}</b><div style="font-size:12px;color:#aaa">${post.time}</div></div>
    <div class="post-menu" onclick="event.stopPropagation();togglePostMenu(${post.id})">⋯</div>
    <div class="post-menu-list" id="menu-${post.id}">
      <div onclick="savePost(${post.id})">🔖 Save Post</div>
      <div onclick="toggleNotification(${post.id})">🔔 Turn on notifications</div>
      <div onclick="deletePost(${post.id})">🗑️ Delete Post</div>
    </div>
  </div>
  <div style="margin:10px 0">${post.text}</div>
  <div class="post-actions">
    <button class="${isLiked}" onclick="reactPost(${post.id}, this)">👍 Like</button>
    <button onclick="document.getElementById('comment-input-${post.id}').focus()">💬 Comment</button>
    <button>↗️ Share</button>
  </div>
  <div class="comments" id="comments-${post.id}">
    ${post.comments.map(c=>`<div><b>You:</b> ${c}</div>`).join('')}
  </div>
  <div class="comment-box">
    <input type="text" id="comment-input-${post.id}" placeholder="Write a comment...">
    <button onclick="addComment(${post.id})">Send</button>
  </div>
</div>`;
})
document.getElementById('postsContainer').innerHTML = html;
}

function reactPost(postId, btn){
if(myReactions[postId]){
myReactions[postId] = false;
btn.classList.remove('liked');
btn.innerHTML = '👍 Like';
}else{
myReactions[postId] = true;
btn.classList.add('liked');
btn.innerHTML = '❤️ Liked';
}
localStorage.setItem('my_reactions', JSON.stringify(myReactions));
}

function deletePost(postId){
if(confirm('Delete this post?')){
posts = posts.filter(p=>p.id!=postId);
localStorage.setItem('posts', JSON.stringify(posts));
renderPosts();
}
}

function addComment(postId){
let input = document.getElementById(`comment-input-${postId}`);
if(input.value.trim() === '') return;
let post = posts.find(p=>p.id==postId);
post.comments.push(input.value);
localStorage.setItem('posts', JSON.stringify(posts));
input.value = '';
renderPosts();
}

function togglePostMenu(postId){
document.querySelectorAll('.post-menu-list').forEach(m=>m.style.display='none');
let menu = document.getElementById(`menu-${postId}`);
menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function savePost(postId){ alert('Post Saved ✅'); }
function toggleNotification(postId){ alert('Notifications ON for this post'); }

document.body.onclick = ()=>{document.querySelectorAll('.post-menu-list').forEach(m=>m.style.display='none')}
</script> 
</body> </html>
