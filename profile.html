<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light dark;
      --dark-green: #0B3D20;
      --dark-green-hover: #072915;
      --dark-green-soft: rgba(11, 61, 32, 0.12);
      --bg: #ffffff;
      --surface: #f0f2f5;
      --card: #ffffff;
      --text: #050505;
      --muted: #65676b;
      --border: #dadde1;
      --btn-sec: #e4e6eb;
      --btn-sec-hover: #d8dadf;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --dark-green-soft: rgba(16, 185, 129, 0.14);
        --bg: #18191a;
        --surface: #242526;
        --card: #242526;
        --text: #e4e6eb;
        --muted: #b0b3b8;
        --border: #3a3b3c;
        --btn-sec: #3a3b3c;
        --btn-sec-hover: #4e4f50;
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.32);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 54px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .top-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .top-btn:hover {
      background: var(--surface);
    }

    .top-btn:active {
      transform: scale(0.95);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Cover Photo */
    .cover-wrap {
      position: relative;
      width: 100%;
      height: 215px;
      background: var(--surface);
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-img.has-img {
      display: block;
    }

    .cam-btn {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-sec);
      color: var(--text);
      border: 2px solid var(--bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      z-index: 5;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .cam-btn:hover {
      background: var(--btn-sec-hover);
    }

    .cam-btn:active {
      transform: scale(0.94);
    }

    .cover-cam {
      right: 14px;
      bottom: 12px;
    }

    .preview-chip-btn {
      position: absolute;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(11, 61, 32, 0.9);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      z-index: 6;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .preview-chip-btn.visible {
      display: inline-flex;
    }

    .preview-chip-btn:hover {
      background: var(--dark-green-hover);
    }

    .preview-chip-btn:active {
      transform: scale(0.96);
    }

    .cover-preview-btn {
      left: 14px;
      bottom: 12px;
    }

    .avatar-preview-btn {
      margin-top: 8px;
    }

    /* Avatar + Thought Bubble */
    .avatar-section {
      position: relative;
      padding: 0 16px;
      margin-top: -78px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thought-bubble {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 7px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.18s ease, color 0.18s ease;
    }

    .thought-bubble:hover {
      border-color: var(--dark-green);
      color: var(--text);
    }

    .avatar-box {
      position: relative;
      width: 144px;
      height: 144px;
      border-radius: 50%;
      background: var(--surface);
      border: 4px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      box-shadow: var(--shadow-md);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .avatar-img.has-img {
      display: block;
    }

    .avatar-cam {
      right: 4px;
      bottom: 4px;
    }

    /* Profile Header Info */
    .profile-meta {
      text-align: center;
      padding: 12px 16px 6px;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      min-height: 30px;
      letter-spacing: -0.3px;
    }

    .profile-username {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
      min-height: 18px;
    }

    .friends-count {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Primary Action Row */
    .action-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px 14px;
    }

    .btn-story {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--dark-green);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .btn-story:hover {
      background: var(--dark-green-hover);
    }

    .btn-story:active {
      transform: scale(0.98);
    }

    .btn-edit {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: var(--btn-sec);
      color: var(--text);
      font-size: 14.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .btn-edit:hover {
      background: var(--btn-sec-hover);
    }

    .btn-edit:active {
      transform: scale(0.98);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 16px;
    }

    /* Sub Tabs */
    .sub-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
    }

    .sub-tab {
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .sub-tab.active {
      background: var(--dark-green-soft);
      color: var(--text);
    }

    @media (prefers-color-scheme: light) {
      .sub-tab.active {
        color: var(--dark-green);
      }
    }

    /* Sections */
    .section-block {
      padding: 16px;
      border-top: 6px solid var(--surface);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .section-link {
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
    }

    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 14.5px;
      color: var(--text);
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .detail-item i {
      width: 18px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      font-size: 14px;
      background: var(--surface);
      border-radius: 12px;
    }

    .empty-state i {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.65;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .media-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: var(--surface);
      cursor: pointer;
      border-radius: 4px;
    }

    .post-card {
      padding: 14px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .post-card-text {
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-card-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
      display: block;
    }

    /* Photo Preview Modal */
    .preview-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .preview-modal-backdrop.open {
      display: flex;
    }

    .preview-modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
    }

    .preview-modal-title {
      font-size: 16px;
      font-weight: 700;
    }

    .preview-modal-close {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .preview-modal-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
      overflow: hidden;
    }

    .preview-modal-img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .preview-modal-actions {
      display: flex;
      gap: 10px;
    }

    .preview-action-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
    }

    .preview-btn-primary {
      background: var(--dark-green);
      color: #ffffff;
    }

    .preview-btn-secondary {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
    }

    .nav-item {
      color: var(--muted);
      font-size: 20px;
      text-decoration: none;
      padding: 8px 14px;
      transition: color 0.18s ease;
    }

    .nav-item.active {
      color: var(--dark-green);
    }

    @media (prefers-color-scheme: dark) {
      .nav-item.active {
        color: #2ecc71;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="top-bar">
    <a href="shortcut.html" class="top-btn" title="Shortcuts">
      <i class="fas fa-bars"></i>
    </a>
    <div class="top-right">
      <a href="edit-profile.html" class="top-btn" title="Edit Profile">
        <i class="fas fa-pen"></i>
      </a>
      <button type="button" class="top-btn" title="Search" onclick="focusPostSearch()">
        <i class="fas fa-search"></i>
      </button>
      <a href="profile-settings.html" class="top-btn" title="Profile Settings">
        <i class="fas fa-ellipsis-h"></i>
      </a>
    </div>
  </header>

  <!-- Cover Photo (Only shown when set) -->
  <div class="cover-wrap">
    <img id="coverImg" class="cover-img" alt="Cover">
    <button type="button" id="coverPreviewBtn" class="preview-chip-btn cover-preview-btn" onclick="openPhotoPreview('cover')">
      <i class="fas fa-eye"></i>
      <span>Preview</span>
    </button>
    <label for="coverInput" class="cam-btn cover-cam" title="Change Cover">
      <i class="fas fa-camera"></i>
    </label>
    <input type="file" id="coverInput" accept="image/*" hidden onchange="handleCoverUpload(event)">
  </div>

  <!-- Profile Avatar -->
  <div class="avatar-section">
    <div class="thought-bubble" id="thoughtBubble" onclick="editThought()">Drop a thought...</div>
    <div class="avatar-box">
      <img id="avatarImg" class="avatar-img" alt="Profile">
      <label for="avatarInput" class="cam-btn avatar-cam" title="Change Profile Photo">
        <i class="fas fa-camera"></i>
      </label>
      <input type="file" id="avatarInput" accept="image/*" hidden onchange="handleAvatarUpload(event)">
    </div>
    <button type="button" id="avatarPreviewBtn" class="preview-chip-btn avatar-preview-btn" onclick="openPhotoPreview('avatar')">
      <i class="fas fa-eye"></i>
      <span>Preview</span>
    </button>
  </div>

  <!-- Name, Username & Live Friends Count -->
  <div class="profile-meta">
    <div class="profile-name" id="displayName"></div>
    <div class="profile-username" id="displayUsername"></div>
    <div class="friends-count"><span id="friendsCount">0</span> friends</div>
  </div>

  <!-- Action Buttons -->
  <div class="action-row">
    <a href="create-story.html" class="btn-story">
      <i class="fas fa-plus-circle"></i>
      <span>Add to story</span>
    </a>
    <a href="edit-profile.html" class="btn-edit">
      <i class="fas fa-pen"></i>
      <span>Edit profile</span>
    </a>
  </div>

  <div class="divider"></div>

  <!-- Sub Tabs -->
  <div class="sub-tabs">
    <button type="button" class="sub-tab active" data-panel="all" onclick="switchSubTab('all', this)">All</button>
    <button type="button" class="sub-tab" data-panel="photos" onclick="switchSubTab('photos', this)">Photos</button>
    <button type="button" class="sub-tab" data-panel="reels" onclick="switchSubTab('reels', this)">Reels</button>
  </div>

  <!-- ALL PANEL -->
  <div id="panel-all" class="tab-panel active">
    <section class="section-block">
      <div class="section-head">
        <h2 class="section-title">Personal details</h2>
        <a href="edit-profile.html" class="top-btn" title="Edit details"><i class="fas fa-pen" style="font-size:15px;"></i></a>
      </div>
      <div class="detail-list" id="personalDetailsList"></div>
    </section>

    <section class="section-block">
      <div class="section-head">
        <h2 class="section-title">Friends</h2>
        <span class="section-link"><span id="friendsSectionCount">0</span> friends</span>
      </div>
      <div class="empty-state" id="friendsEmptyState">
        <i class="fas fa-user-friends"></i>
        No friends yet
      </div>
    </section>

    <section class="section-block">
      <div class="section-head">
        <h2 class="section-title">All posts</h2>
        <span class="section-link" id="postsCountLabel">0 posts</span>
      </div>
      <div id="livePostsContainer" style="display:flex;flex-direction:column;gap:12px;"></div>
      <div class="empty-state" id="postsEmptyState">
        <i class="fas fa-folder-open"></i>
        No posts available
      </div>
    </section>
  </div>

  <!-- PHOTOS PANEL -->
  <div id="panel-photos" class="tab-panel">
    <section class="section-block">
      <div class="section-head">
        <h2 class="section-title">Photos</h2>
      </div>
      <div class="media-grid" id="photosGrid"></div>
      <div class="empty-state" id="photosEmptyState">
        <i class="fas fa-images"></i>
        No photos available
      </div>
    </section>
  </div>

  <!-- REELS PANEL -->
  <div id="panel-reels" class="tab-panel">
    <section class="section-block">
      <div class="section-head">
        <h2 class="section-title">Reels</h2>
      </div>
      <div class="empty-state">
        <i class="fas fa-clapperboard"></i>
        No reels available
      </div>
    </section>
  </div>

  <!-- Photo Preview Modal -->
  <div id="photoPreviewModal" class="preview-modal-backdrop" onclick="closePhotoPreview(event)">
    <div class="preview-modal-top">
      <span id="previewModalTitle" class="preview-modal-title">Photo Preview</span>
      <button type="button" class="preview-modal-close" onclick="closePhotoPreview()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="preview-modal-body">
      <img id="previewModalImg" class="preview-modal-img" alt="Preview">
    </div>
    <div class="preview-modal-actions" onclick="event.stopPropagation()">
      <button type="button" id="previewChangeBtn" class="preview-action-btn preview-btn-primary" onclick="triggerPreviewChange()">
        <i class="fas fa-camera"></i>
        <span>Change Photo</span>
      </button>
      <a id="previewDownloadBtn" class="preview-action-btn preview-btn-secondary" download="autrobook-photo.jpg">
        <i class="fas fa-download"></i>
        <span>Save</span>
      </a>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" title="Home"><i class="fas fa-home"></i></a>
    <a href="reels.html" class="nav-item" title="Reels"><i class="fas fa-clapperboard"></i></a>
    <a href="friends.html" class="nav-item" title="Friends"><i class="fas fa-user-friends"></i></a>
    <a href="groups.html" class="nav-item" title="Groups"><i class="fas fa-users"></i></a>
    <a href="notifications.html" class="nav-item" title="Notifications"><i class="fas fa-bell"></i></a>
    <a href="profile.html" class="nav-item active" title="Profile"><i class="fas fa-user"></i></a>
  </nav>

  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    let sb = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let currentPreviewType = 'avatar';
    let activeUserId = null;

    function normalizeUsername(raw, name) {
      let val = (raw || '').toString().trim().replace(/^@+/, '').toLowerCase();
      if (!val && name) {
        val = name.toString().trim().toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      }
      val = val.replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      return val ? '@' + val : '';
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function setImageIfPresent(imgEl, url, previewBtnEl) {
      if (!imgEl) return;
      const cleanUrl = (url && typeof url === 'string') ? url.trim() : '';
      if (cleanUrl) {
        imgEl.src = cleanUrl;
        imgEl.classList.add('has-img');
        if (previewBtnEl) previewBtnEl.classList.add('visible');
      } else {
        imgEl.removeAttribute('src');
        imgEl.classList.remove('has-img');
        if (previewBtnEl) previewBtnEl.classList.remove('visible');
      }
    }

    function openPhotoPreview(type, customSrc) {
      currentPreviewType = type || 'avatar';
      const avatarSrc = document.getElementById('avatarImg')?.getAttribute('src') || '';
      const coverSrc = document.getElementById('coverImg')?.getAttribute('src') || '';

      let chosenSrc = customSrc || '';
      let titleText = 'Photo Preview';

      if (!chosenSrc) {
        if (currentPreviewType === 'cover') {
          chosenSrc = coverSrc;
          titleText = 'Cover Photo Preview';
        } else {
          chosenSrc = avatarSrc;
          titleText = 'Profile Photo Preview';
        }
      }

      if (!chosenSrc) return;

      document.getElementById('previewModalTitle').textContent = titleText;
      const modalImg = document.getElementById('previewModalImg');
      modalImg.src = chosenSrc;

      const downloadBtn = document.getElementById('previewDownloadBtn');
      downloadBtn.href = chosenSrc;
      downloadBtn.download = currentPreviewType === 'cover' ? 'autrobook-cover.jpg' : 'autrobook-profile.jpg';

      document.getElementById('photoPreviewModal').classList.add('open');
    }

    function closePhotoPreview(event) {
      if (event && event.target && event.target.id !== 'photoPreviewModal') return;
      document.getElementById('photoPreviewModal').classList.remove('open');
    }

    function triggerPreviewChange() {
      document.getElementById('photoPreviewModal').classList.remove('open');
      if (currentPreviewType === 'cover') {
        document.getElementById('coverInput')?.click();
      } else {
        document.getElementById('avatarInput')?.click();
      }
    }

    function renderDetails(profile) {
      const container = document.getElementById('personalDetailsList');
      if (!container) return;
      const items = [];
      if (profile.location) items.push({ icon: 'fa-map-marker-alt', text: profile.location });
      if (profile.hometown) items.push({ icon: 'fa-home', text: profile.hometown });
      if (profile.dob) items.push({ icon: 'fa-cake-candles', text: profile.dob });
      if (profile.relationship) items.push({ icon: 'fa-heart', text: profile.relationship });
      if (profile.gender) items.push({ icon: 'fa-user', text: profile.gender });
      if (profile.language) items.push({ icon: 'fa-language', text: profile.language });

      if (!items.length) {
        container.innerHTML = '<div class="detail-item"><i class="fas fa-info-circle"></i><span>No personal details added yet</span></div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="detail-item">
          <i class="fas ${item.icon}"></i>
          <span>${escapeHtml(item.text)}</span>
        </div>
      `).join('');
    }

    function renderPhotos(avatarUrl, coverUrl, posts) {
      const grid = document.getElementById('photosGrid');
      const empty = document.getElementById('photosEmptyState');
      if (!grid || !empty) return;

      const photos = [];
      if (avatarUrl && avatarUrl.trim()) photos.push({ type: 'avatar', src: avatarUrl.trim() });
      if (coverUrl && coverUrl.trim()) photos.push({ type: 'cover', src: coverUrl.trim() });
      if (Array.isArray(posts)) {
        posts.forEach(p => {
          if (p && p.image_url && String(p.image_url).trim()) {
            photos.push({ type: 'post', src: String(p.image_url).trim() });
          }
        });
      }

      if (!photos.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = photos.map(p => {
        const safeSrc = escapeHtml(p.src);
        return `<img src="${safeSrc}" alt="Photo" onclick="openPhotoPreview('${p.type}', '${p.src.replace(/'/g, "\\'")}')">`;
      }).join('');
    }

    function renderLivePosts(posts) {
      const listEl = document.getElementById('livePostsContainer');
      const emptyEl = document.getElementById('postsEmptyState');
      const countLabel = document.getElementById('postsCountLabel');

      const items = Array.isArray(posts) ? posts : [];
      if (countLabel) {
        countLabel.textContent = `${items.length} ${items.length === 1 ? 'post' : 'posts'}`;
      }

      if (!listEl || !emptyEl) return;

      if (!items.length) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      listEl.innerHTML = items.map(p => {
        const bodyText = p.content || p.caption || p.text || '';
        const imgHtml = p.image_url
          ? `<img src="${escapeHtml(p.image_url)}" alt="Post image" class="post-card-img" onclick="openPhotoPreview('post', '${String(p.image_url).replace(/'/g, "\\'")}')">`
          : '';
        return `
          <article class="post-card">
            <div class="post-card-text">${escapeHtml(bodyText)}</div>
            ${imgHtml}
          </article>
        `;
      }).join('');
    }

    function setFriendsDisplay(count) {
      const num = Math.max(0, Number(count || 0));
      document.getElementById('friendsCount').textContent = String(num);
      document.getElementById('friendsSectionCount').textContent = String(num);
      const emptyEl = document.getElementById('friendsEmptyState');
      if (emptyEl) {
        emptyEl.style.display = num > 0 ? 'none' : 'block';
      }
    }

    function applyProfileData(data) {
      const fullName = (data.full_name || data.name || '').toString().trim();
      const usernameFormatted = normalizeUsername(data.username, fullName);

      document.getElementById('displayName').textContent = fullName;
      document.getElementById('displayUsername').textContent = usernameFormatted;

      setFriendsDisplay(data.friends_count ?? 0);

      const postsArr = Array.isArray(data.posts) ? data.posts : [];
      const postsNum = postsArr.length > 0 ? postsArr.length : Number(data.posts_count || 0);
      document.getElementById('postsCountLabel').textContent = `${postsNum} ${postsNum === 1 ? 'post' : 'posts'}`;

      const thoughtEl = document.getElementById('thoughtBubble');
      if (thoughtEl && data.thought) {
        thoughtEl.textContent = data.thought;
      }

      const avatarUrl = data.avatar_url || data.selfie_url || '';
      const coverUrl = data.cover_url || '';

      setImageIfPresent(
        document.getElementById('avatarImg'),
        avatarUrl,
        document.getElementById('avatarPreviewBtn')
      );
      setImageIfPresent(
        document.getElementById('coverImg'),
        coverUrl,
        document.getElementById('coverPreviewBtn')
      );
      renderPhotos(avatarUrl, coverUrl, postsArr);
      renderLivePosts(postsArr);
      renderDetails(data);
    }

    function readStoredProfile() {
      let stored = {};
      try {
        stored = JSON.parse(localStorage.getItem('autrobook_user') || '{}') || {};
      } catch (e) {}
      try {
        if (!stored.full_name && localStorage.getItem('signup_name')) {
          stored.full_name = localStorage.getItem('signup_name');
        }
        if (!stored.username && localStorage.getItem('signup_username')) {
          stored.username = localStorage.getItem('signup_username');
        }
        if (!stored.avatar_url && localStorage.getItem('autro_avatar_url')) {
          stored.avatar_url = localStorage.getItem('autro_avatar_url');
        }
        if (!stored.cover_url && localStorage.getItem('autro_cover_url')) {
          stored.cover_url = localStorage.getItem('autro_cover_url');
        }
      } catch (e) {}
      return stored;
    }

    async function refreshLiveCounts(userId) {
      if (!sb || !userId) return;

      let friendsTotal = 0;
      let postsList = [];

      try {
        const { count, error } = await sb
          .from('friends')
          .select('*', { count: 'exact', head: true })
          .or(`user_id.eq.${userId},friend_id.eq.${userId}`);
        if (!error && typeof count === 'number') {
          friendsTotal = count;
        }
      } catch (e) {
        console.warn('Friends count error:', e);
      }

      try {
        const { data, error } = await sb
          .from('posts')
          .select('*')
          .eq('user_id', userId)
          .order('created_at', { ascending: false });
        if (!error && Array.isArray(data)) {
          postsList = data;
        }
      } catch (e) {
        console.warn('Posts fetch error:', e);
      }

      setFriendsDisplay(friendsTotal);
      renderLivePosts(postsList);

      const current = readStoredProfile();
      const avatarUrl = current.avatar_url || current.selfie_url || '';
      const coverUrl = current.cover_url || '';
      renderPhotos(avatarUrl, coverUrl, postsList);
    }

    function subscribeRealtime(userId) {
      if (!sb || !userId || typeof sb.channel !== 'function') return;
      try {
        sb.channel('autro-live-profile-' + userId)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'friends' }, () => refreshLiveCounts(userId))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => refreshLiveCounts(userId))
          .subscribe();
      } catch (e) {
        console.warn('Realtime skipped:', e);
      }
    }

    async function loadProfile() {
      const localData = readStoredProfile();
      applyProfileData(localData);

      if (!sb) return;
      try {
        const { data: sessionData } = await sb.auth.getSession();
        const user = sessionData?.session?.user;
        if (!user) return;

        activeUserId = user.id;

        const { data: row } = await sb
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .maybeSingle();

        const merged = Object.assign({}, localData, row || {}, {
          full_name: (row && row.full_name) || user.user_metadata?.full_name || localData.full_name || '',
          username: (row && row.username) || user.user_metadata?.username || localData.username || '',
          avatar_url: (row && (row.avatar_url || row.selfie_url)) || localData.avatar_url || '',
          cover_url: (row && row.cover_url) || localData.cover_url || ''
        });

        try {
          localStorage.setItem('autrobook_user', JSON.stringify(merged));
        } catch (e) {}

        applyProfileData(merged);
        await refreshLiveCounts(user.id);
        subscribeRealtime(user.id);
      } catch (err) {
        console.warn('Profile fetch skipped:', err);
      }
    }

    function handleAvatarUpload(event) {
      const file = event?.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const url = e.target.result || '';
        const current = readStoredProfile();
        current.avatar_url = url;
        try {
          localStorage.setItem('autrobook_user', JSON.stringify(current));
          localStorage.setItem('autro_avatar_url', url);
        } catch (err) {}
        applyProfileData(current);

        if (sb && activeUserId) {
          try {
            await sb.from('profiles').upsert({ id: activeUserId, avatar_url: url });
          } catch (err) {}
        }
      };
      reader.readAsDataURL(file);
    }

    function handleCoverUpload(event) {
      const file = event?.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const url = e.target.result || '';
        const current = readStoredProfile();
        current.cover_url = url;
        try {
          localStorage.setItem('autrobook_user', JSON.stringify(current));
          localStorage.setItem('autro_cover_url', url);
        } catch (err) {}
        applyProfileData(current);

        if (sb && activeUserId) {
          try {
            await sb.from('profiles').upsert({ id: activeUserId, cover_url: url });
          } catch (err) {}
        }
      };
      reader.readAsDataURL(file);
    }

    function editThought() {
      const current = readStoredProfile();
      const next = prompt('Drop a thought...', current.thought || '');
      if (next === null) return;
      current.thought = next.trim();
      try {
        localStorage.setItem('autrobook_user', JSON.stringify(current));
      } catch (e) {}
      document.getElementById('thoughtBubble').textContent = current.thought || 'Drop a thought...';
    }

    function switchSubTab(panelName, btnEl) {
      document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      const target = document.getElementById('panel-' + panelName);
      if (target) target.classList.add('active');
    }

    function focusPostSearch() {
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
