<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Profile - Autrobook</title> <style> 
:root{ --bg: #0a1a0f; --card-bg: #13261a; --header-bg: #13261a; --text: #e4e6eb; --text-secondary: #7a9e80; --border: #1f3d2a; --brand: #4caf50; --hover: #1f3d2a; } 
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial;} 
body{background:var(--bg); color:var(--text); padding-bottom:60px; -webkit-user-select: none; user-select: none;} 
body.locked::after{content:""; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:9998; pointer-events:none;} 
.header{display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:var(--header-bg); position:sticky; top:0; z-index:10;} 
.header span{font-size:22px; cursor:pointer;} 
.cover{width:100%; height:200px; background:#1f3d2a; position:relative;} 
.cover img{width:100%; height:100%; object-fit:cover;} 
.cover.blur img{filter:blur(20px);} 
.profile-pic{width:130px; height:130px; border-radius:50%; border:4px solid var(--bg); position:absolute; bottom:-65px; left:15px; object-fit:cover; background:#333;}
.profile-guard{position:absolute; bottom:-70px; right:20px; background:var(--brand); color:white; padding:5px 10px; border-radius:20px; font-size:12px; font-weight:bold;}
.profile-info{padding:80px 15px 15px;} 
.profile-info h1{font-size:24px;} 
.profile-info p{color:var(--text-secondary); font-size:14px;} 
.profile-buttons{display:flex; gap:10px; margin:15px 0;} 
.btn{flex:1; padding:10px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;} 
.btn-primary{background:var(--brand); color:white;} 
.btn-secondary{background:var(--card-bg); color:var(--text);} 
.professional-badge{background:#1877f2; color:white; padding:3px 8px; border-radius:5px; font-size:11px; margin-left:5px;}
.tabs{display:flex; justify-content:space-around; border-bottom:1px solid var(--border);} 
.tabs div{padding:12px; flex:1; text-align:center; cursor:pointer;} 
.tabs div.active{border-bottom:3px solid var(--brand); color:var(--brand);} 
.post-create{display:flex; gap:10px; padding:12px; background:var(--card-bg); margin:10px; border-radius:12px;} 
.post-create img{width:40px; height:40px; border-radius:50%; object-fit:cover;} 
.post-create input{flex:1; background:var(--bg); border:none; padding:10px; border-radius:20px; color:var(--text);} 
.post{background:var(--card-bg); margin:10px 0; padding:12px; border-radius:12px;} 
.post-header{display:flex; align-items:center; gap:10px; justify-content:space-between;} 
.post-user{display:flex; align-items:center; gap:10px;} 
.post-header img{width:40px; height:40px; border-radius:50%; object-fit:cover;} 
.post-stats{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-secondary); padding:5px 0; border-bottom:1px solid var(--border);} 
.reaction-summary{display:flex; gap:3px; align-items:center;} 
.post-actions{display:flex; justify-content:space-around; padding-top:8px; position:relative;} 
.post-actions button{background:none; border:none; color:var(--text-secondary); padding:8px; flex:1; cursor:pointer; border-radius:8px; position:relative;} 
.post-actions button.active{color:var(--brand);} 
.react-box{display:none; position:absolute; bottom:45px; left:5px; background:var(--card-bg); padding:8px; border-radius:30px; box-shadow:0 4px 12px black; gap:8px; border:1px solid var(--border); z-index:10;} 
.react-box span{font-size:28px; cursor:pointer; transition:0.2s;} 
.react-box span:hover{transform:scale(1.4);} 
.comment-section{display:none; padding-top:10px; border-top:1px solid var(--border);} 
.comment{display:flex; gap:8px; margin:10px 0;} 
.comment img{width:32px; height:32px; border-radius:50%; object-fit:cover;} 
.comment-box{flex:1; background:var(--bg); padding:8px 12px; border-radius:18px;} 
.comment-input{display:flex; gap:8px; margin-top:10px;} 
.comment-input input{flex:1; background:var(--bg); border:none; padding:10px; border-radius:20px; color:var(--text); outline:none;} 
.comment-input button{background:var(--brand); border:none; color:white; padding:8px 15px; border-radius:20px; cursor:pointer;} 
.friend-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px;} 
.friend-grid div{text-align:center; cursor:pointer;} 
.friend-grid img{width:100%; border-radius:8px; aspect-ratio:1/1; object-fit:cover;} 
.menu-list{display:none; position:absolute; right:0; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:5px 0; z-index:5; width:220px;} 
.menu-list div{padding:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;} 
.menu-list div:hover{background:var(--hover);} 
.switch{position:relative; display:inline-block; width:40px; height:22px;} 
.switch input{opacity:0; width:0; height:0;} 
.slider{position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#555; transition:.4s; border-radius:22px;} 
.slider:before{position:absolute; content:""; height:16px; width:16px; left:3px; bottom:3px; background-color:white; transition:.4s; border-radius:50%;} 
input:checked + .slider{background-color:var(--brand);} 
input:checked + .slider:before{transform:translateX(18px);} 
</style> </head> <body> 
<div class="header"> <span onclick="window.location.href='home.html'">←</span> <span>Autrobook</span> <span onclick="window.location.href='main-settings.html'">⚙️</span> </div> 
<div id="profileContent"></div> 
<script> 
const REACTIONS = {like:'👍', love:'❤️', haha:'😆', wow:'😮', sad:'😢', angry:'😠'}; 
const demoUsers = [ 
{id:1, name:"Rahim Khan", username:"rahim.khan", email:"rahim@gmail.com", bio:"Web Developer | Dhaka", cover:"https://via.placeholder.com/600x200/4caf50", profilePic:"", img:1, friends:[2,3], dob:"15 Jan 2000", dobPublic:true, locked:false}, 
{id:2, name:"Sadia Afrin", username:"sadia.a", email:"sadia@yahoo.com", bio:"Student | UI Designer", cover:"https://via.placeholder.com/600x200/2196f3", profilePic:"", img:2, friends:[1,4], dob:"22 Mar 2001", dobPublic:false, locked:true}, 
{id:3, name:"Nayeem Hasan", username:"nayeem.h", email:"nayeem@outlook.com", bio:"Travel Lover ✈️", cover:"https://via.placeholder.com/600x200/ff9800", profilePic:"", img:3, friends:[1,5], dob:"10 Jul 1999", dobPublic:true, locked:false}, 
{id:4, name:"Fatema Begum", username:"fatema.b", email:"fatema@gmail.com", bio:"Chef 🍛", cover:"https://via.placeholder.com/600x200/9c27b0", profilePic:"", img:4, friends:[2,5], dob:"05 Dec 2002", dobPublic:false, locked:false}, 
{id:5, name:"Karim Uddin", username:"karim.u", email:"karim@proton.com", bio:"Businessman", cover:"https://via.placeholder.com/600x200/f44336", profilePic:"", img:5, friends:[3,4], dob:"30 Apr 1998", dobPublic:true, locked:true} 
]; 

let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {id:0, name:"You", img:99, username:"you", email:"you@mail.com", bio:"", cover:"", profilePic:"", profileGuard:false, professional:false}; 
let userId = new URLSearchParams(window.location.search).get('id'); 
let profileUser;

function initProfile(){
if(userId && demoUsers.find(u => u.id == userId)){
    profileUser = {...demoUsers.find(u => u.id == userId)};
}else{
    profileUser = {...currentUser}; // copy so we can modify
}
applyGuardLock();
}

function applyGuardLock(){
if(profileUser.locked || profileUser.profileGuard){ 
document.body.classList.add('locked'); 
document.addEventListener('contextmenu', e=>e.preventDefault()); 
} else { 
document.body.classList.remove('locked');
document.removeEventListener('contextmenu', e=>e.preventDefault());
} 
}

let profileId = profileUser.id || 0; 
let following = JSON.parse(localStorage.getItem('following') || '[]'); 
let blocked = JSON.parse(localStorage.getItem('blocked') || '[]'); 
let isFollowing = following.includes(profileId); 
let isBlocked = blocked.includes(profileId); 
let isMyProfile = currentUser.id == profileId; 

function getMutual(a,b){ 
let fa = demoUsers.find(u=>u.id==a)?.friends || []; 
let fb = demoUsers.find(u=>u.id==b)?.friends || []; 
return fa.filter(x => fb.includes(x)).length; 
} 

function loadProfile(){ 
try{
if(isBlocked){ 
document.getElementById('profileContent').innerHTML = ` 
<div style="text-align:center; padding:50px;"> 
<h2>🚫 You blocked ${profileUser.name}</h2> 
<button class="btn btn-secondary" onclick="unblockUser()">Unblock</button> 
</div>`; 
return; 
} 
let mutual = getMutual(currentUser.id, profileId); 
let displayName = isMyProfile ? currentUser.name : profileUser.name;
let loginInfo = isMyProfile ? `@${currentUser.username || 'you'}` : `${profileUser.email || '@'+profileUser.username}`;
let bio = isMyProfile ? currentUser.bio : profileUser.bio;
let cover = isMyProfile ? currentUser.cover : profileUser.cover;
let profileImgSrc = isMyProfile ? (currentUser.profilePic || `https://i.pravatar.cc/130?img=${currentUser.img}`) : (profileUser.profilePic || `https://i.pravatar.cc/130?img=${profileUser.img}`);

let html = ` 
<div class="cover ${profileUser.locked || profileUser.profileGuard ? 'blur' : ''}"> 
<img src="${cover || 'https://via.placeholder.com/600x200/333'}"> 
<img src="${profileImgSrc}" class="profile-pic"> 
${profileUser.profileGuard ? '<div class="profile-guard">🛡️ Guard On</div>' : ''}
</div> 
<div class="profile-info"> 
<h1>${displayName} ${profileUser.professional ? '<span class="professional-badge">PRO</span>' : ''}</h1> 
<p>${loginInfo}</p> 
<p>${bio || 'No bio yet'}</p> 
${profileUser.dobPublic ? `<p>🎂 Born: ${profileUser.dob}</p>` : ''} 
<p><b>${profileUser.friends?.length || 0}</b> Friends · <b>${mutual}</b> Mutual</p> 
<div class="profile-buttons"> 
${!isMyProfile ? `<button class="btn ${isFollowing ? 'btn-secondary' : 'btn-primary'}" onclick="toggleFollow()">${isFollowing ? 'Unfriend' : 'Follow'}</button>` : '<button class="btn btn-primary" onclick="window.location.href=\'edit-profile.html\'">Edit Profile</button>'} 
${!isMyProfile ? '<button class="btn btn-secondary">Message</button>' : ''} 
<div style="position:relative"><button class="btn btn-secondary" onclick="toggleMenu('profileMenu')">⋯</button> 
<div class="menu-list" id="profileMenu"> 
<div onclick="copyProfileLink()">🔗 Copy Profile Link</div>
${isMyProfile ? `
<div onclick="event.stopPropagation()">🛡️ Profile Guard <label class="switch"><input type="checkbox" ${profileUser.profileGuard ? 'checked' : ''} onchange="toggleProfileGuard(this.checked)"><span class="slider"></span></label></div>
<div onclick="event.stopPropagation()">💼 Professional Mode <label class="switch"><input type="checkbox" ${profileUser.professional ? 'checked' : ''} onchange="toggleProfessional(this.checked)"><span class="slider"></span></label></div>
` : `<div onclick="blockUser()">🚫 Block ${profileUser.name}</div>
<div onclick="alert('Report Sent ✅')">🚩 Report Profile</div>`}
</div> </div> 
</div> 
</div> 
${isMyProfile ? ` 
<div class="post-create"> 
<img src="${currentUser.profilePic || `https://i.pravatar.cc/40?img=${currentUser.img}`}"> 
<input type="text" id="newPostText" placeholder="What's on your mind?" onkeypress="if(event.key=='Enter') createPost()"> 
<button onclick="createPost()">Post</button> 
</div>` : ''} 
<div class="tabs"> 
<div class="active" onclick="showProfileTab('posts')">Posts</div> 
<div onclick="showProfileTab('about')">About</div> 
<div onclick="showProfileTab('friends')">Friends</div> 
</div> 
<div id="postsTab">${loadUserPosts()}</div> 
<div id="aboutTab" style="display:none; padding:15px;"> 
<b>About ${displayName}</b><br> 
<p>${bio || 'No bio yet'}</p> 
<p>📧 Email: ${profileUser.email || 'Not set'}</p> 
${profileUser.dobPublic ? `<p>🎂 Birthday: ${profileUser.dob}</p>` : '<p>Birthday: Only Me</p>'} 
</div> 
<div id="friendsTab" style="display:none;"><div class="friend-grid"> 
${(profileUser.friends || []).map(fid=>{let f=demoUsers.find(u=>u.id==fid); return f ? `<div onclick="window.location.href='profile.html?id=${f.id}'"><img src="${f.profilePic || `https://i.pravatar.cc/100?img=${f.img}`}"><p>${f.name}</p></div>` : ''}).join('')} 
</div></div> 
`; 
document.getElementById('profileContent').innerHTML = html; 
}catch(e){
document.getElementById('profileContent').innerHTML = `<div style="padding:20px; text-align:center;"><h2>Error Loading Profile</h2><p>${e.message}</p></div>`;
}
} 

function loadUserPosts(){ 
let posts = JSON.parse(localStorage.getItem('posts_'+profileId) || '[]'); 
if(posts.length==0){ 
posts = [ {text:"No posts yet", reactions:{}, comments:[]} ]; 
} 
return posts.map((p,i)=>{ 
let reactionIcons = Object.values(p.reactions || {}).slice(0,3).map(r=>REACTIONS[r]).join(''); 
let userReact = (p.reactions || {})[currentUser.name]; 
let postProfilePic = isMyProfile ? (currentUser.profilePic || `https://i.pravatar.cc/40?img=${currentUser.img}`) : (profileUser.profilePic || `https://i.pravatar.cc/40?img=${profileUser.img}`);
return` 
<div class="post"> 
<div class="post-header"> 
<div class="post-user"> 
<img src="${postProfilePic}"> 
<div><b>${profileUser.name}</b><div style="font-size:12px; color:var(--text-secondary)">2h ago</div></div> 
</div> 
</div> 
<p>${p.text}</p> 
<div class="post-stats"> 
<div class="reaction-summary">${reactionIcons} <span>${Object.keys(p.reactions || {}).length}</span></div> 
<span>${(p.comments || []).length} Comments</span> 
</div> 
<div class="post-actions"> 
<button class="${userReact ? 'active' : ''}" onclick="toggleReactMenu('reactP${i}')"> 
${userReact ? REACTIONS[userReact] : '👍'} Like 
<div class="react-box" id="reactP${i}" onmouseleave="hideReact('reactP${i}')"> 
${Object.keys(REACTIONS).map(k=>`<span onclick="likePost(${i},'${k}')">${REACTIONS[k]}</span>`).join('')} 
</div> 
</button> 
<button onclick="toggleComment('cP${i}')">💬 Comment</button> 
<button>↗️ Share</button> 
</div> 
<div class="comment-section" id="cP${i}"> 
${(p.comments || []).map(c=>`<div class="comment"><img src="${c.profilePic || `https://i.pravatar.cc/32?img=${c.img}`}"><div class="comment-box"><b>${c.name}</b><br>${c.text}</div></div>`).join('')} 
<div class="comment-input"> 
<input type="text" placeholder="Write a comment..." id="inputP${i}" onkeypress="if(event.key=='Enter') addComment(${i})"> 
<button onclick="addComment(${i})">Send</button> 
</div> 
</div> 
</div> 
`}).join(''); 
} 

function createPost(){ 
let txt = document.getElementById('newPostText').value; 
if(txt){ 
let posts = JSON.parse(localStorage.getItem('posts_'+currentUser.id) || '[]'); 
posts.unshift({text:txt, reactions:{}, comments:[]}); 
localStorage.setItem('posts_'+currentUser.id, JSON.stringify(posts)); 
document.getElementById('newPostText').value=''; 
loadProfile(); 
} 
} 

function showProfileTab(tab){ 
document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active')); 
['postsTab','aboutTab','friendsTab'].forEach(id=>document.getElementById(id).style.display='none'); 
if(tab=='posts'){document.getElementById('postsTab').style.display='block'; document.querySelectorAll('.tabs div')[0].classList.add('active');} 
if(tab=='about'){document.getElementById('aboutTab').style.display='block'; document.querySelectorAll('.tabs div')[1].classList.add('active');} 
if(tab=='friends'){document.getElementById('friendsTab').style.display='block'; document.querySelectorAll('.tabs div')[2].classList.add('active');} 
} 

function toggleFollow(){ 
if(isFollowing){ 
if(confirm('Unfriend '+profileUser.name+'?')){ 
following = following.filter(id => id != profileId); 
localStorage.setItem('following', JSON.stringify(following)); 
isFollowing = false; 
alert('Unfriended ✅'); 
loadProfile(); 
} 
} 
else{ 
following.push(profileId); 
localStorage.setItem('following', JSON.stringify(following)); 
isFollowing = true; 
alert('Followed ✅'); 
loadProfile(); 
} 
} 

function blockUser(){ 
if(confirm('Block '+profileUser.name+'?')){ 
blocked.push(profileId); 
localStorage.setItem('blocked', JSON.stringify(blocked)); 
isBlocked = true; 
alert('Blocked ✅'); 
loadProfile(); 
} 
} 

function unblockUser(){ 
blocked = blocked.filter(id => id != profileId); 
localStorage.setItem('blocked', JSON.stringify(blocked)); 
isBlocked = false; 
alert('Unblocked ✅'); 
loadProfile(); 
} 

// FIXED: TOGGLE FUNCTIONS
function toggleProfileGuard(checked){
currentUser.profileGuard = checked;
profileUser.profileGuard = checked;
localStorage.setItem('autrobook_user', JSON.stringify(currentUser));
applyGuardLock();
alert(checked ? 'Profile Guard ON 🛡️' : 'Profile Guard OFF');
}

function toggleProfessional(checked){
currentUser.professional = checked;
profileUser.professional = checked;
localStorage.setItem('autrobook_user', JSON.stringify(currentUser));
alert(checked ? 'Professional Mode ON 💼' : 'Professional Mode OFF');
loadProfile();
}

function toggleReactMenu(id){
let box = document.getElementById(id);
box.style.display = box.style.display == 'flex' ? 'none' : 'flex';
}

function likePost(i,reaction){ 
let posts = JSON.parse(localStorage.getItem('posts_'+profileId) || '[]'); 
posts[i].reactions = posts[i].reactions || {};
let prev = posts[i].reactions[currentUser.name]; 
if(prev == reaction){ 
delete posts[i].reactions[currentUser.name]; 
} 
else{ 
posts[i].reactions[currentUser.name] = reaction; 
} 
localStorage.setItem('posts_'+profileId, JSON.stringify(posts)); 
loadProfile(); 
} 

function toggleComment(id){document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';} 
function hideReact(id){setTimeout(()=>{document.getElementById(id).style.display='none';},200);} 

function addComment(i){ 
let val = document.getElementById(`inputP${i}`).value; 
if(val){ 
let posts = JSON.parse(localStorage.getItem('posts_'+profileId) || '[]'); 
posts[i].comments = posts[i].comments || [];
posts[i].comments.push({name:currentUser.name, text:val, img:currentUser.img, profilePic: currentUser.profilePic}); 
localStorage.setItem('posts_'+profileId, JSON.stringify(posts)); 
document.getElementById(`inputP${i}`).value = ''; 
loadProfile(); 
} 
} 

function copyProfileLink(){
navigator.clipboard.writeText(window.location.href);
alert('Profile Link Copied ✅');
}

function toggleMenu(id){
let menu = document.getElementById(id);
menu.style.display = menu.style.display=='block'?'none':'block';
}

initProfile();
loadProfile(); 
</script> 
</body> 
</html>
