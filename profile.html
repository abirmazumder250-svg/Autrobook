window.onload = loadProfile;

function timeAgo(timestamp){
let seconds = Math.floor((Date.now() - timestamp)/1000);
if(seconds < 60) return "Just now";
let minutes = Math.floor(seconds/60);
if(minutes < 60) return minutes + "m ago";
let hours = Math.floor(minutes/60);
if(hours < 24) return hours + "h ago";
return Math.floor(hours/24) + "d ago";
}

function loadProfile(){
document.getElementById('profileName').innerText = currentUser.name;
document.getElementById('profilePic').src = currentUser.profilePic || 'https://via.placeholder.com/130/555/fff';
if(currentUser.professional) document.getElementById('proBadge').style.display='block';
if(currentUser.profileGuard) document.getElementById('guardBadge').style.display='block';
renderPosts();
}

function proModeAction(){
if(currentUser.professional){

}else{

}
}
