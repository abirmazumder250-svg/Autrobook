<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Sign Up - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{--primary:#043D22;--bg:#f0f2f5;--card:#fff;--text:#050505;--muted:#65676b;--border:#dadde1;--input-bg:#fff;--error:#e41e3f;--success:#2e7d32;--disabled:#9e9e9e}
@media (prefers-color-scheme:dark){:root{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--border:#3a3b3c;--input-bg:#242526;--error:#f02849;--success:#66bb6a;--disabled:#4b4c4f}}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;max-width:480px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.back-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);cursor:pointer;border:1px solid var(--border)}
.lang-wrapper{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 14px;cursor:pointer}
.lang-wrapper span{font-size:13.5px;font-weight:600}
.lang-wrapper i{font-size:12px;color:var(--muted);margin-left:8px}
.lang-modal-back{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999}
.lang-modal{background:var(--card);width:90%;max-width:380px;border-radius:16px;padding:24px}
.lang-modal h3{margin-bottom:20px;font-size:18px;font-weight:700}
.lang-list{display:flex;flex-direction:column;gap:4px;max-height:400px;overflow-y:auto}
.lang-item{display:flex;align-items:center;justify-content:space-between;padding:12px 8px;border-radius:8px;cursor:pointer}
.lang-item:hover{background:var(--bg)}
.lang-item span{font-size:15px;font-weight:500}
.lang-item input[type="radio"]{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;cursor:pointer;position:relative}
.lang-item input[type="radio"]:checked{border-color:var(--primary)}
.lang-item input[type="radio"]:checked::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;background:var(--primary);border-radius:50%}
.lang-close{width:100%;padding:14px;margin-top:20px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.header{text-align:center;margin-bottom:20px;padding:0 20px}
.logo{width:56px;height:56px;border-radius:14px;object-fit:cover;margin:0 auto 12px;display:block}
h2{font-size:24px;font-weight:800;margin-bottom:6px}
.subtitle{font-size:14px;color:var(--muted)}
.progress-container{width:100%;max-width:440px;padding:0 20px;display:flex;gap:6px;margin-bottom:24px}
.progress-step{flex:1;height:4px;border-radius:2px;background:var(--border)}
.progress-step.active{background:var(--primary)}
.form-wrap{width:100%;max-width:440px;padding:0 20px 40px;position:relative;z-index:10}
.form-group{margin-bottom:16px;position:relative}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
input[type="email"],input[type="password"],input[type="text"],input[type="number"]{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:var(--primary)}
.eye-icon{position:absolute;right:14px;top:50%;transform:translateY(15%);cursor:pointer;color:var(--muted);padding:10px;font-size:18px}
.dob-wrap{display:flex;gap:8px}
.dob-wrap input{text-align:center}
.verify-box{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;background:var(--input-bg);margin-bottom:18px}
.verify-box video{width:100%;border-radius:10px;display:none;margin-bottom:10px;transform:scaleX(-1)}
.verify-box img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin:10px auto;display:none;border:3px solid var(--primary)}
.verify-btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.verify-btn.verified{background:var(--success)!important}
.liveness-text{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:10px}
.fingerprint-btn{width:100%;padding:14px;margin-top:10px;border:1.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.fingerprint-btn.verified{border-color:var(--success);color:var(--success)}
.manual-captcha-row{display:flex;align-items:center;gap:12px;background:var(--input-bg);border:1.5px solid var(--border);padding:14px 16px;border-radius:12px;cursor:pointer;margin:8px 0 20px}
.manual-captcha-row input[type="checkbox"]{display:none}
.custom-checkbox{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center}
.manual-captcha-row input:checked~.custom-checkbox{background:var(--primary);border-color:var(--primary)}
.manual-captcha-row input:checked~.custom-checkbox::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;color:#fff;font-size:13px}
.manual-captcha-row span{font-size:14px;font-weight:600}
.btn{width:100%;padding:15px;border-radius:12px;font-size:15px;font-weight:700;border:none;margin-top:10px;background:var(--disabled);color:#fff;cursor:not-allowed}
.btn.active{background:var(--primary)!important;cursor:pointer}
.btn-secondary{width:100%;padding:15px;border-radius:12px;font-size:15px;font-weight:700;border:1.5px solid var(--border);background:transparent;color:var(--text);margin-top:10px;cursor:pointer}
.msg{text-align:center;font-size:13px;color:var(--error);font-weight:700;min-height:20px;margin-bottom:10px}
.footer-text{text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted)}
.footer-text a{color:var(--primary);font-weight:700;text-decoration:none}
.otp-timer{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.hide{display:none!important}
</style>
</head>
<body>

<div class="top-bar">
  <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
  <div class="lang-wrapper" onclick="openLangModal()">
    <span id="langBtn" data-i18n="langBtn">English - US</span> <i class="fas fa-chevron-down"></i>
  </div>
</div>

<div class="header">
  <img src="logo.png" alt="Autrobook" class="logo" onerror="this.style.display='none'">
  <h2 data-i18n="secureAcc">Secure Your Account</h2>
  <p class="subtitle" data-i18n="subtitle">Enter details and verify your identity</p>
</div>

<div class="progress-container">
  <div class="progress-step active"></div>
  <div class="progress-step active"></div>
</div>

<div class="form-wrap">
  <p id="namePreview" style="color:var(--primary);font-size:14px;font-weight:700;margin-bottom:16px;"></p>

  <div class="form-group">
    <label data-i18n="emailLabel">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" oninput="checkButtonState()">
  </div>

  <div class="form-group hide" id="otpGroup">
    <label data-i18n="otpLabel">Enter 6 Digit Code</label>
    <input type="text" id="otp" maxlength="6" placeholder="123456" oninput="checkButtonState()">
    <div class="otp-timer" id="otpTimer" data-i18n="otpTimer">Code expires in 60s</div>
  </div>

  <div class="form-group">
    <label data-i18n="dobLabel">Birthday</label>
    <div class="dob-wrap">
      <input type="number" id="day" placeholder="DD" oninput="checkButtonState()">
      <input type="number" id="month" placeholder="MM" oninput="checkButtonState()">
      <input type="number" id="year" placeholder="YYYY" oninput="checkButtonState()">
    </div>
  </div>

  <div class="form-group">
    <label data-i18n="passLabel">Password</label>
    <input type="password" id="password" placeholder="Create a strong password" oninput="checkButtonState()">
    <i class="fa-solid fa-eye eye-icon" id="togglePasswordIcon" onclick="togglePass()"></i>
  </div>

  <label data-i18n="securityLabel">Security Verification (Mandatory)</label>
  <div class="verify-box">
    <p class="liveness-text hide" id="livenessText" data-i18n="lookCam">Please look at the camera to verify</p>
    <video id="video" autoplay playsinline></video>
    <img id="photo" />
    <button type="button" class="verify-btn" id="cameraBtn" onclick="startCamera()">
      <i class="fas fa-camera"></i> <span data-i18n="liveSelfie">Live Selfie & Eye Scan</span>
    </button>
    <button type="button" class="fingerprint-btn" id="fingerprintBtn" onclick="registerFingerprint()">
      <i class="fas fa-fingerprint"></i> <span data-i18n="fingerprintBtn">Add Fingerprint (Optional)</span>
    </button>
    <div class="verify-status" id="verifyStatus" style="font-size:13px;font-weight:600;color:var(--muted);margin-top:10px;" data-i18n="verifyStatus">Verify using camera to proceed</div>
  </div>

  <div style="display:flex;justify-content:center;transform:scale(0.9);margin-bottom:8px;min-height:78px;">
    <div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d" data-callback="enableBtn"></div>
  </div>

  <label class="manual-captcha-row" for="humanCheck">
    <input type="checkbox" id="humanCheck" onchange="manualCaptcha()">
    <div class="custom-checkbox"></div>
    <span data-i18n="notRobot">I'm not a robot - Manual verification</span>
  </label>

  <div class="msg" id="msgDetails"></div>

  <button type="button" class="btn" id="sendOtpBtn" onclick="sendOTP()" disabled><span data-i18n="sendOtp">Send OTP</span></button>
  <button type="button" class="btn" id="signUpBtn" onclick="verifyOTPAndSignup()" disabled><span data-i18n="signUp">Sign Up</span></button>
  <button type="button" class="btn-secondary" onclick="goBack()"><span data-i18n="backBtn">← Back</span></button>
  <button type="button" class="btn-secondary" onclick="goCancel()" style="color:var(--error);border-color:var(--error);"><span data-i18n="cancelBtn">Cancel</span></button>

  <p class="footer-text">
    <span data-i18n="haveAcc">Already have an account?</span>
    <a href="login.html" data-i18n="login">Log in</a>
  </p>
</div>

<div class="lang-modal-back" id="langModal" onclick="closeLangModal()">
  <div class="lang-modal" onclick="event.stopPropagation()">
    <h3 data-i18n="selectLang">Select Language</h3>
    <div class="lang-list" id="langList"></div>
    <button class="lang-close" onclick="closeLangModal()" data-i18n="close">Close</button>
  </div>
</div>

// TRANSLATION HELPER
// ═══════════════════════════════════════════════════════════════
function t(key, vars) {
  const dict = i18n[currentLang] || i18n['en'];
  let str = dict[key] || i18n['en'][key] || key;
  if (vars) {
    Object.keys(vars).forEach(k => {
      str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
    });
  }
  return str;
}

function applyLanguage(langCode) {
  const dict = i18n[langCode] || i18n['en'];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.innerText = dict[key];
  });
  document.getElementById('langBtn').innerText = languageList.find(l => l.code === langCode)?.name || 'English';
  document.documentElement.lang = langCode;
  document.documentElement.dir = (langCode === 'ar') ? 'rtl' : 'ltr';
  localStorage.setItem('autro_lang', langCode);
  currentLang = langCode;
  // refresh dynamic texts
  updateNamePreview();
  if (otpSent) updateTimer();
}

function buildLangList() {
  const list = document.getElementById('langList'); list.innerHTML = '';
  languageList.forEach(lang => {
    const div = document.createElement('div');
    div.className = 'lang-item';
    div.innerHTML = `<span>${lang.name}</span><input type="radio" name="lang" ${currentLang === lang.code ? 'checked' : ''}>`;
    div.onclick = () => { applyLanguage(lang.code); closeLangModal(); };
    list.appendChild(div);
  });
}

function openLangModal() { document.getElementById('langModal').style.display = 'flex'; }
function closeLangModal() { document.getElementById('langModal').style.display = 'none'; }

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let selfieData = "";
let faceDescriptor = null;
let stream = null;
let livenessPassed = false;
let webauthnCredentialId = null;
let fingerprintRegistered = false;
let otpTimer = null;
let otpSeconds = 60;
let modelsLoaded = false;
let otpSent = false;

// ═══════════════════════════════════════════════════════════════
// WEBAUTHN FINGERPRINT (OPTIONAL)
// ═══════════════════════════════════════════════════════════════
async function registerFingerprint() {
  if (!window.PublicKeyCredential) {
    alert(t('WEBAUTHN_NOT_SUPPORTED'));
    return;
  }
  try {
    const challenge = new Uint8Array(32);
    window.crypto.getRandomValues(challenge);
    const credential = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: "Autrobook", id: window.location.hostname },
        user: {
          id: crypto.getRandomValues(new Uint8Array(16)),
          name: document.getElementById('email').value || "user@autrobook.com",
          displayName: "Autrobook User"
        },
        pubKeyCredParams: [{ type:"public-key", alg:-7 }, { type:"public-key", alg:-257 }],
        authenticatorSelection: { userVerification:"required", authenticatorAttachment:"platform" },
        timeout: 60000
      }
    });
    if (credential) {
      webauthnCredentialId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
      fingerprintRegistered = true;
      const btn = document.getElementById('fingerprintBtn');
      btn.classList.add('verified');
      btn.innerHTML = `<i class="fas fa-check-circle"></i> ${t('FINGERPRINT_ADDED')}`;
      btn.disabled = true;
      checkButtonState();
    }
  } catch (err) {
    console.error("WebAuthn failed:", err);
    alert(t('FINGERPRINT_FAILED'));
  }
}

// ═══════════════════════════════════════════════════════════════
// FACE API (LIVENESS)
// ═══════════════════════════════════════════════════════════════
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

function stopCamera(btn) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.getElementById('video').style.display = 'none';
  document.getElementById('livenessText').classList.add('hide');
  if (btn) {
    btn.innerHTML = `<i class="fas fa-camera"></i> <span>${t('liveSelfie')}</span>`;
    btn.disabled = false;
  }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('livenessText').classList.remove('hide');

    const btn = document.getElementById('cameraBtn');
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('SCANNING_FACE')}`;
    btn.disabled = true;

    if (!modelsLoaded) {
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      modelsLoaded = true;
    }

    let blinkCount = 0, lastEyeState = 'open', isCompleted = false;
    const interval = setInterval(async () => {
      if (isCompleted) return;
      const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
      if (detections) {
        const le = detections.landmarks.getLeftEye();
        const re = detections.landmarks.getRightEye();
        const ear = (getDistance(le[1], le[5]) + getDistance(le[2], le[4])) / (2 * getDistance(le[0], le[3]));
        if (ear < 0.25 && lastEyeState === 'open') { blinkCount++; lastEyeState = 'closed'; }
        if (ear > 0.25 && lastEyeState === 'closed') { lastEyeState = 'open'; }
        if (blinkCount >= 1) {
          isCompleted = true;
          clearInterval(interval);
          await capturePhotoAndDescriptor(video);
        }
      }
    }, 200);

    setTimeout(() => {
      if (!livenessPassed) {
        clearInterval(interval);
        alert(t('LIVENESS_FAILED'));
        stopCamera(btn);
      }
    }, 15000);
  } catch (err) {
    console.error(err);
    alert(t('CAMERA_DENIED'));
    stopCamera(document.getElementById('cameraBtn'));
  }
}

function getDistance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

async function capturePhotoAndDescriptor(video) {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0);

  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('photo').src = selfieData;
  document.getElementById('photo').style.display = 'block';
  document.getElementById('video').style.display = 'none';

  const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
  if (detection) faceDescriptor = Array.from(detection.descriptor);

  document.getElementById('livenessText').classList.add('hide');
  if (stream) stream.getTracks().forEach(t => t.stop());

  const btn = document.getElementById('cameraBtn');
  btn.innerHTML = `<i class="fas fa-check"></i> ${t('FACE_VERIFIED')}`;
  btn.classList.add('verified');
  btn.disabled = true;

  livenessPassed = true;
  checkButtonState();
}

// ═══════════════════════════════════════════════════════════════
// VALIDATION
// ═══════════════════════════════════════════════════════════════
function isValidDob(day, month, year) {
  const d = parseInt(day), m = parseInt(month), y = parseInt(year);
  if (!d || !m || !y) return false;
  if (d < 1 || d > 31 || m < 1 || m > 12) return false;
  const now = new Date().getFullYear();
  if (y < 1900 || y > now) return false;
  const dt = new Date(y, m - 1, d);
  return dt.getDate() === d && dt.getMonth() === m - 1 && dt.getFullYear() === y;
}

function checkButtonState() {
  const captcha = (typeof grecaptcha !== 'undefined' && grecaptcha.getResponse().length > 0);
  const manual = document.getElementById('humanCheck').checked;
  const isVerified = livenessPassed;  // Face only (fingerprint optional)

  const email = document.getElementById('email').value.trim();
  const day = document.getElementById('day').value;
  const month = document.getElementById('month').value;
  const year = document.getElementById('year').value;
  const pass = document.getElementById('password').value;

  const sendBtn = document.getElementById('sendOtpBtn');
  const signBtn = document.getElementById('signUpBtn');

  if (email.includes('@') && (captcha || manual)) {
    sendBtn.classList.add('active'); sendBtn.disabled = false;
  } else {
    sendBtn.classList.remove('active'); sendBtn.disabled = true;
  }

  const dobOk = year.length === 4 && isValidDob(day, month, year);
  if (otpSent && (captcha || manual) && isVerified && email && dobOk && pass.length >= 6) {
    signBtn.classList.add('active'); signBtn.disabled = false;
  } else {
    signBtn.classList.remove('active'); signBtn.disabled = true;
  }
}
window.enableBtn = () => checkButtonState();
window.manualCaptcha = () => checkButtonState();

// ═══════════════════════════════════════════════════════════════
// SEND OTP (translated)
// ═══════════════════════════════════════════════════════════════
async function sendOTP() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('sendOtpBtn');
  const msg = document.getElementById('msgDetails');
  msg.innerText = '';

  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('SENDING')}`;
  btn.disabled = true;

  try {
    const res = await fetch('/api/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, name: localStorage.getItem('signup_name') || 'User' })
    });
    const data = await res.json();

    // Already exists → login page
    if (data.alreadyExists) {
      msg.innerText = t(data.code);
      setTimeout(() => window.location.href = 'login.html', 2000);
      return;
    }

    if (!res.ok || !data.success) {
      msg.innerText = t(data.code) || t('SERVER_ERROR');
      btn.innerHTML = t('sendOtp');
      btn.classList.remove('active');
      btn.disabled = false;
      return;
    }

    otpSent = true;
    document.getElementById('otpGroup').classList.remove('hide');
    document.getElementById('otp').focus();

    otpSeconds = 60;
    if (otpTimer) clearInterval(otpTimer);
    otpTimer = setInterval(() => {
      otpSeconds--;
      updateTimer();
      if (otpSeconds <= 0) clearInterval(otpTimer);
    }, 1000);

    btn.innerHTML = `<i class="fas fa-check"></i> ${t('OTP_SENT')}`;
    setTimeout(() => {
      btn.innerHTML = t('RESEND_OTP');
      btn.classList.add('active');
      btn.disabled = false;
    }, 3000);

    checkButtonState();
  } catch (err) {
    msg.innerText = t('SERVER_ERROR');
    btn.innerHTML = t('sendOtp');
    btn.classList.remove('active');
    btn.disabled = false;
  }
}

function updateTimer() {
  const el = document.getElementById('otpTimer');
  if (otpSeconds > 0) {
    el.innerText = t('otpTimer', { s: otpSeconds });
  } else {
    el.innerText = t('CODE_EXPIRED_RESEND');
  }
}

// ═══════════════════════════════════════════════════════════════
// VERIFY OTP + SIGNUP (translated)
// ═══════════════════════════════════════════════════════════════
async function verifyOTPAndSignup() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const password = document.getElementById('password').value;
  const name = localStorage.getItem('signup_name') || 'User';
  const day = document.getElementById('day').value;
  const month = document.getElementById('month').value;
  const year = document.getElementById('year').value;
  const dob = `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;

  const btn = document.getElementById('signUpBtn');
  const msg = document.getElementById('msgDetails');
  msg.innerText = '';

  if (!isValidDob(day, month, year)) {
    msg.innerText = t('DOB_INVALID');
    return;
  }

  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('CREATING_ACCOUNT')}`;
  btn.disabled = true;

  try {
    const res = await fetch('/api/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email, otp, password,
        profile: {
          full_name: name, dob,
          selfieData, faceDescriptor,
          webauthnCredentialId
        }
      })
    });
    const data = await res.json();

    if (data.alreadyExists) {
      msg.innerText = t('ALREADY_EXISTS');
      setTimeout(() => window.location.href = 'login.html', 2000);
      return;
    }

    if (!res.ok || !data.success) {
      msg.innerText = t(data.code) || t('SERVER_ERROR');
      btn.innerHTML = t('signUp');
      btn.classList.add('active');
      btn.disabled = false;
      return;
    }

    // success → auto login
    const { error: signInErr } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (signInErr) {
      window.location.href = 'login.html?msg=signup_success';
      return;
    }
    window.location.href = 'index.html';

  } catch (err) {
    msg.innerText = t('SERVER_ERROR');
    btn.innerHTML = t('signUp');
    btn.classList.add('active');
    btn.disabled = false;
  }
}
