<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3D20">
<title>Sign Up - Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/auth.css">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  :root {
    --primary: #0B3D20;
    --primary-hover: #072915;
    --dark-green-btn: #0B3D20;
    --dark-green-hover: #062413;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #050505;
    --muted: #65676b;
    --border: #dadde1;
    --input-bg: #ffffff;
    --error: #e41e3f;
    --success: #0B3D20;
    --disabled: #9e9e9e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --dark-green-btn: #0B3D20;
      --dark-green-hover: #0e4e29;
      --bg: #18191a;
      --card: #242526;
      --text: #ffffff;
      --muted: #b0b3b8;
      --border: #3a3b3c;
      --input-bg: #242526;
      --error: #f02849;
      --success: #10b981;
      --disabled: #4b4c4f;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    max-width: 480px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    border: 1px solid var(--border);
    text-decoration: none;
    flex-shrink: 0;
  }

  .lang-selector-box {
    position: relative;
    display: inline-flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0 34px 0 14px;
    height: 38px;
    min-width: 195px;
    max-width: 260px;
    cursor: pointer;
  }

  .lang-selector-box select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-color: transparent;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    width: 100%;
    height: 100%;
    line-height: 36px;
    opacity: 1;
    visibility: visible;
  }

  .lang-selector-box select option {
    background-color: #ffffff;
    color: #050505;
  }

  @media (prefers-color-scheme: dark) {
    .lang-selector-box select option {
      background-color: #242526;
      color: #ffffff;
    }
  }

  .lang-selector-box .lang-caret {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 12px;
    color: var(--muted);
  }

  .lang-modal-back {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .lang-modal {
    background: var(--card);
    width: 90%;
    max-width: 380px;
    border-radius: 16px;
    padding: 24px;
  }

  .lang-modal h3 {
    margin-bottom: 16px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .lang-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 380px;
    overflow-y: auto;
  }

  .lang-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
  }

  .lang-item:hover {
    background: var(--bg);
  }

  .lang-item span {
    font-size: 15px;
    font-weight: 500;
  }

  .lang-item input[type="radio"] {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
  }

  .lang-item input[type="radio"]:checked {
    border-color: var(--primary);
  }

  .lang-item input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    background: var(--primary);
    border-radius: 50%;
  }

  .lang-close {
    width: 100%;
    padding: 13px;
    margin-top: 18px;
    background: var(--dark-green-btn);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .header {
    text-align: center;
    margin-bottom: 18px;
    padding: 0 20px;
  }

  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    object-fit: cover;
    margin: 0 auto 12px;
    display: block;
  }

  h2 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--text);
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
  }

  .progress-container {
    width: 100%;
    max-width: 440px;
    padding: 0 20px;
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }

  .progress-step {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
  }

  .progress-step.active {
    background: var(--primary);
  }

  .form-wrap {
    width: 100%;
    max-width: 440px;
    padding: 0 20px 40px;
    position: relative;
    z-index: 10;
  }

  .form-group {
    margin-bottom: 16px;
    position: relative;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }

  input:focus {
    border-color: var(--primary);
  }

  .eye-icon {
    position: absolute;
    right: 14px;
    top: 38px;
    cursor: pointer;
    color: var(--muted);
    padding: 6px;
    font-size: 17px;
  }

  .dob-wrap {
    display: flex;
    gap: 8px;
  }

  .dob-wrap input {
    text-align: center;
  }

  .verify-box {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    background: var(--input-bg);
    margin-bottom: 18px;
  }

  .verify-box video {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
    display: none;
    margin-bottom: 10px;
    transform: scaleX(-1);
    background: #000000;
  }

  .verify-box img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    margin: 10px auto;
    display: none;
    border: 3px solid var(--primary);
  }

  .verify-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--dark-green-btn);
    color: #ffffff;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .verify-btn:hover {
    background: var(--dark-green-hover);
  }

  .verify-btn.verified {
    background: var(--dark-green-btn) !important;
  }

  .liveness-text {
    font-size: 12.5px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .capture-now-btn {
    width: 100%;
    padding: 11px;
    margin-bottom: 10px;
    border: 1.5px solid var(--primary);
    border-radius: 10px;
    background: transparent;
    color: var(--primary);
    font-weight: 700;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .fingerprint-btn {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .fingerprint-btn.verified {
    border-color: var(--primary);
    color: var(--primary);
  }

  .manual-captcha-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    margin: 8px 0 18px;
  }

  .manual-captcha-row input[type="checkbox"] {
    display: none;
  }

  .custom-checkbox {
    width: 24px;
    height: 24px;
    border: 2px solid var(--muted);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .manual-captcha-row input:checked ~ .custom-checkbox {
    background: var(--dark-green-btn);
    border-color: var(--dark-green-btn);
  }

  .manual-captcha-row input:checked ~ .custom-checkbox::after {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    color: #ffffff;
    font-size: 13px;
  }

  .manual-captcha-row span {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    margin-top: 10px;
    background: var(--disabled);
    color: #ffffff;
    cursor: not-allowed;
    transition: background 0.2s, transform 0.1s;
  }

  .btn.active {
    background: var(--dark-green-btn) !important;
    cursor: pointer;
  }

  .btn.active:hover {
    background: var(--dark-green-hover) !important;
  }

  .btn.active:active {
    transform: scale(0.99);
  }

  .btn-secondary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    margin-top: 10px;
    cursor: pointer;
  }

  .msg {
    text-align: center;
    font-size: 13px;
    color: var(--error);
    font-weight: 700;
    min-height: 20px;
    margin-bottom: 10px;
    word-break: break-word;
  }

  .msg.success {
    color: var(--success);
  }

  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .footer-text a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }

  .otp-timer {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
  }

  .hide {
    display: none !important;
  }
</style>
</head>

<div class="header">
  <img src="logo.png" alt="Autrobook" class="logo" onerror="this.style.display='none'">
  <h2 id="titleHeading">Secure Your Account</h2>
  <p class="subtitle" id="subtitleText">Enter details, verify your identity, and confirm with a 6-digit email OTP code</p>
</div>

<div class="progress-container">
  <div class="progress-step active"></div>
  <div class="progress-step active"></div>
</div>

<div class="form-wrap">
  <p id="namePreview" style="color:var(--primary);font-size:14px;font-weight:700;margin-bottom:16px;"></p>

  <div class="form-group">
    <label for="email" id="emailLabel">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" oninput="checkButtonState()">
  </div>

  <div class="form-group hide" id="otpGroup">
    <label for="otp" id="otpLabel">6-Digit Email Verification Code (OTP)</label>
    <input type="text" id="otp" maxlength="6" inputmode="numeric" placeholder="Enter 6-digit OTP from email" oninput="checkButtonState()">
    <div class="otp-timer" id="otpTimer">Code expires in 60s</div>
  </div>

  <div class="form-group">
    <label id="dobLabel">Birthday</label>
    <div class="dob-wrap">
      <input type="number" id="day" placeholder="DD" min="1" max="31" oninput="checkButtonState()">
      <input type="number" id="month" placeholder="MM" min="1" max="12" oninput="checkButtonState()">
      <input type="number" id="year" placeholder="YYYY" min="1900" max="2026" oninput="checkButtonState()">
    </div>
  </div>

  <div class="form-group">
    <label for="password" id="passwordLabel">Create Password</label>
    <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" oninput="checkButtonState()">
    <i class="fa-solid fa-eye eye-icon" id="togglePasswordIcon" onclick="togglePass()"></i>
  </div>

  <label id="securityLabel">Security Verification (Mandatory)</label>
  <div class="verify-box">
    <p class="liveness-text hide" id="livenessText">Please look at the camera and blink clearly to verify</p>

function getDict(langCode, langLabel) {
  const baseCode = (langCode || 'en').split('-')[0];
  if (UI_STRINGS[langCode]) return UI_STRINGS[langCode];
  if (UI_STRINGS[baseCode]) return UI_STRINGS[baseCode];

  const labelText = langLabel || langCode || 'English';
  return Object.assign({}, UI_STRINGS.en, {
    heading: `${UI_STRINGS.en.heading} (${labelText})`,
    subtitle: `${UI_STRINGS.en.subtitle} — ${labelText}`
  });
}

} catch (e) {}

function setMessage(text, isSuccess = false) {
  const msg = document.getElementById('msgDetails');
  if (!msg) return;
  msg.textContent = text || '';
  msg.classList.toggle('success', Boolean(isSuccess));
}

function getSelectedLangLabel(langCode) {
  const selectEl = document.getElementById('languageSelect');
  if (!selectEl) return langCode;
  const opt = Array.from(selectEl.options).find(o => o.value === langCode);
  return opt ? opt.textContent.trim() : langCode;
}

function updateNamePreview() {
  let savedName = '';
  try {
    savedName = localStorage.getItem('signup_name') || '';
  } catch (e) {}
  const el = document.getElementById('namePreview');
  if (el && savedName) {
    const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
    el.textContent = dict.accountNamePrefix + savedName;
  }
}

function applyAppTranslation(langCode, langLabel) {
  const dict = getDict(langCode, langLabel || getSelectedLangLabel(langCode));
  const setText = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };
  const setPlaceholder = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.placeholder = val;
  };

  setText('titleHeading', dict.heading);
  setText('subtitleText', dict.subtitle);
  setText('emailLabel', dict.email);
  setPlaceholder('email', dict.emailPlaceholder);
  setText('otpLabel', dict.otp);
  setPlaceholder('otp', dict.otpPlaceholder);
  setText('dobLabel', dict.dob);
  setText('passwordLabel', dict.password);
  setPlaceholder('password', dict.passwordPlaceholder);
  setText('securityLabel', dict.security);
  setText('livenessText', dict.liveness);
  setText('cameraBtnText', dict.camera);
  setText('fingerprintBtnText', dict.fingerprint);
  setText('humanCheckText', dict.humanCheck);
  setText('backActionBtn', dict.back);
  setText('cancelActionBtn', dict.cancel);
  setText('langModalTitle', dict.modalTitle);
  setText('langCloseBtn', dict.closeBtn);

  if (!livenessPassed) {
    setText('verifyStatus', dict.verifyStatus);
  }
  if (!otpSent) {
    const sendBtn = document.getElementById('sendOtpBtn');
    if (sendBtn && !sendBtn.innerHTML.includes('fa-spinner')) {
      sendBtn.textContent = dict.sendOtp;
    }
  }
  const signBtn = document.getElementById('signUpBtn');
  if (signBtn && !signBtn.innerHTML.includes('fa-spinner')) {
    signBtn.textContent = dict.signUp;
  }

  const footer = document.getElementById('footerLoginText');
  if (footer) {
    footer.innerHTML = `${dict.alreadyHave} <a href="login.html" id="loginLink">${dict.logIn}</a>`;
  }

  updateNamePreview();
  updateTimer();
}

async function syncLanguageToSupabase(langCode, langName, isRtl) {
  if (!supabaseClient) return;

  const emailInput = document.getElementById('email');
  const emailVal = emailInput ? emailInput.value.trim() : '';

  try {
    await supabaseClient.auth.updateUser({
      data: {
        language: langCode,
        language_name: langName,
        dir: isRtl ? 'rtl' : 'ltr'
      }
    });
  } catch (e) {}

  try {
    const payload = {
      language: langCode,
      language_name: langName,
      dir: isRtl ? 'rtl' : 'ltr',
      updated_at: new Date().toISOString()
    };
    if (emailVal) {
      payload.email = emailVal;
    }
    await supabaseClient
      .from('language_preferences')
      .upsert(payload, { onConflict: 'email' });
  } catch (e) {}
}

function setActiveLanguage(langCode, langName, isRtl) {
  currentLang = langCode || 'en';
  const resolvedName = langName || getSelectedLangLabel(currentLang);
  const resolvedRtl = typeof isRtl === 'boolean' ? isRtl : false;

  try {
    localStorage.setItem('autro_lang', currentLang);
    localStorage.setItem('lang', currentLang);
    localStorage.setItem('autro_language', currentLang);
    localStorage.setItem('autro_language_name', resolvedName);
    localStorage.setItem('autro_language_dir', resolvedRtl ? 'rtl' : 'ltr');
    sessionStorage.setItem('lang', currentLang);
    sessionStorage.setItem('autro_language', currentLang);
  } catch (e) {}

  document.documentElement.lang = currentLang;
  document.documentElement.dir = resolvedRtl ? 'rtl' : 'ltr';

  const selectEl = document.getElementById('languageSelect');
  if (selectEl && selectEl.value !== currentLang) {
    const exists = Array.from(selectEl.options).some(o => o.value === currentLang);
    if (exists) selectEl.value = currentLang;
  }

  applyAppTranslation(currentLang, resolvedName);
  buildLangList();
  syncLanguageToSupabase(currentLang, resolvedName, resolvedRtl);
  setMessage('');

  window.dispatchEvent(new CustomEvent('autro:languageChanged', {
    detail: { code: currentLang, name: resolvedName, rtl: resolvedRtl }
  }));
}

function onLanguageSelectChange(selectEl) {
  if (!selectEl) return;
  const opt = selectEl.options[selectEl.selectedIndex];
  const langCode = selectEl.value || 'en';
  const langName = opt ? opt.textContent.trim() : 'English (US)';
  const isRtl = opt && opt.getAttribute('data-dir') === 'rtl';
  setActiveLanguage(langCode, langName, isRtl);
}

function buildLangList() {
  const list = document.getElementById('langList');
  const selectEl = document.getElementById('languageSelect');
  if (!list || !selectEl) return;

  list.innerHTML = '';
  Array.from(selectEl.options).forEach(opt => {
    const code = opt.value;
    const name = opt.textContent.trim();
    const isRtl = opt.getAttribute('data-dir') === 'rtl';

    const item = document.createElement('div');
    item.className = 'lang-item';
    item.innerHTML = `
      <span>${name}</span>
      <input type="radio" name="modalLang" value="${code}" ${currentLang === code ? 'checked' : ''}>
    `;
    item.addEventListener('click', () => {
      selectEl.value = code;
      setActiveLanguage(code, name, isRtl);
      closeLangModal();
    });
    list.appendChild(item);
  });
}

function openLangModal() {
  buildLangList();
  const modal = document.getElementById('langModal');
  if (modal) modal.style.display = 'flex';
}

function closeLangModal() {
  const modal = document.getElementById('langModal');
  if (modal) modal.style.display = 'none';
}

function restoreSavedLanguage() {
  const selectEl = document.getElementById('languageSelect');
  if (!selectEl) return;
  const match = Array.from(selectEl.options).some(o => o.value === currentLang);
  if (match) {
    selectEl.value = currentLang;
  } else {
    selectEl.value = 'en';
    currentLang = 'en';
  }
  const opt = selectEl.options[selectEl.selectedIndex];
  const langName = opt ? opt.textContent.trim() : 'English (US)';
  const isRtl = opt && opt.getAttribute('data-dir') === 'rtl';
  document.documentElement.lang = currentLang;
  document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
  applyAppTranslation(currentLang, langName);
  buildLangList();
}

async function registerFingerprint() {
  const btn = document.getElementById('fingerprintBtn');
  setMessage('');

  const isTopFrame = window.self === window.top;
  const isSecure = window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  if (!isTopFrame) {
    webauthnCredentialId = 'embedded_frame_fallback_' + Date.now();
    btn.classList.add('verified');
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Biometric Skipped (Embedded Frame)';
    setMessage('Fingerprint prompt is blocked inside embedded frames. You can still continue.', true);
    return;
  }

  if (!isSecure || !window.PublicKeyCredential || !navigator.credentials || typeof navigator.credentials.create !== 'function') {
    webauthnCredentialId = 'device_fallback_' + Date.now();
    btn.classList.add('verified');
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Fingerprint Fallback Ready';
    setMessage('WebAuthn fingerprint is not supported on this device/browser. Continuing without hardware passkey.', true);
    return;
  }

  try {
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Waiting for fingerprint...';
    const challenge = new Uint8Array(32);
    window.crypto.getRandomValues(challenge);
    const userId = new Uint8Array(16);
    window.crypto.getRandomValues(userId);
    const emailVal = document.getElementById('email').value.trim() || 'user@autrobook.com';
    let displayName = 'Autrobook User';
    try {
      displayName = localStorage.getItem('signup_name') || 'Autrobook User';
    } catch (e) {}

    const rpId = location.hostname || 'localhost';

    const credential = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'Autrobook', id: rpId },
        user: {
          id: userId,
          name: emailVal,
          displayName
        },
        pubKeyCredParams: [
          { type: 'public-key', alg: -7 },
          { type: 'public-key', alg: -257 }
        ],
        authenticatorSelection: {
          userVerification: 'preferred'
        },
        timeout: 60000,
        attestation: 'none'
      }
    });

    if (credential) {
      webauthnCredentialId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
      btn.classList.add('verified');
      btn.innerHTML = '<i class="fas fa-check-circle"></i> Fingerprint Registered';
      btn.disabled = true;
      setMessage('Fingerprint / Passkey registered successfully!', true);
    }
  } catch (err) {
    console.warn('Fingerprint setup fallback:', err);
    webauthnCredentialId = 'optional_skipped_' + Date.now();
    btn.classList.add('verified');
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Fingerprint Skipped (Optional)';
    setMessage('Fingerprint sensor not available or cancelled — optional step marked done.', true);
  }
}

function stopCamera(btn) {
  if (scanInterval) {
    clearInterval(scanInterval);
    scanInterval = null;
  }
  if (scanTimeout) {
    clearTimeout(scanTimeout);
    scanTimeout = null;
  }
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  const video = document.getElementById('video');
  const livenessEl = document.getElementById('livenessText');
  const captureNowBtn = document.getElementById('captureNowBtn');
  if (video) video.style.display = 'none';
  if (livenessEl) livenessEl.classList.add('hide');
  if (captureNowBtn) captureNowBtn.style.display = 'none';

  if (btn && !livenessPassed) {
    const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
    btn.innerHTML = `<i class="fas fa-camera"></i> <span id="cameraBtnText">${dict.camera}</span>`;
    btn.disabled = false;
  }
}

function getDistance(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

async function startCamera() {
  const btn = document.getElementById('cameraBtn');
  const statusEl = document.getElementById('verifyStatus');
  const captureNowBtn = document.getElementById('captureNowBtn');
  setMessage('');

  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    setMessage('Camera API is not available in this browser.');
    statusEl.textContent = 'Camera unavailable';
    return;
  }

  try {
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Opening camera...';
    btn.disabled = true;
    statusEl.textContent = 'Requesting camera permission...';

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
    } catch (firstErr) {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }

    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    await video.play();

    document.getElementById('livenessText').classList.remove('hide');
    captureNowBtn.style.display = 'flex';
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning face &amp; eyes...';
    statusEl.textContent = 'Loading eye & face scan models...';

    if (!window.faceapi) {
      statusEl.textContent = 'Camera ready — tap "Capture Selfie Now" to verify';
      return;
    }

    try {
      if (!modelsLoaded) {
        await Promise.race([
          Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
          ]),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Model load timeout')), 8000))
        ]);
        modelsLoaded = true;
      }
    } catch (modelErr) {
      console.warn('Face-API models fallback:', modelErr);
      statusEl.textContent = 'Eye scan model slow — tap "Capture Selfie Now" or blink';
      return;
    }

    statusEl.textContent = 'Blink your eyes once to complete verification';

    let blinkCount = 0;
    let lastEyeState = 'open';
    let completed = false;

    scanInterval = setInterval(async () => {
      if (completed || !video || video.readyState < 2) return;
      try {
        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 }))
          .withFaceLandmarks();

        if (detection && detection.landmarks) {
          const leftEye = detection.landmarks.getLeftEye();
          const rightEye = detection.landmarks.getRightEye();
          const earLeft = (getDistance(leftEye[1], leftEye[5]) + getDistance(leftEye[2], leftEye[4])) / (2 * getDistance(leftEye[0], leftEye[3]));
          const earRight = (getDistance(rightEye[1], rightEye[5]) + getDistance(rightEye[2], rightEye[4])) / (2 * getDistance(rightEye[0], rightEye[3]));
          const avgEar = (earLeft + earRight) / 2;

          if (avgEar < 0.25 && lastEyeState === 'open') {
            blinkCount++;
            lastEyeState = 'closed';
          } else if (avgEar >= 0.25 && lastEyeState === 'closed') {
            lastEyeState = 'open';
          }

          if (blinkCount >= 1) {
            completed = true;
            await capturePhotoAndDescriptor(video);
          }
        }
      } catch (frameErr) {
        console.warn('Frame scan skipped:', frameErr);
      }
    }, 240);

    scanTimeout = setTimeout(() => {
      if (!livenessPassed && !completed) {
        statusEl.textContent = 'Auto-blink timed out — tap "Capture Selfie Now" to finish';
      }
    }, 15000);
  } catch (err) {
    console.error('Camera error:', err);
    const reason = err && err.name === 'NotAllowedError'
      ? 'Camera permission denied. Please allow camera access in browser settings.'
      : 'Camera unavailable on this device or frame.';
    setMessage(reason);
    statusEl.textContent = reason;
    stopCamera(btn);
  }
}

async function capturePhotoAndDescriptor(video) {
  if (scanInterval) {
    clearInterval(scanInterval);
    scanInterval = null;
  }
  if (scanTimeout) {
    clearTimeout(scanTimeout);
    scanTimeout = null;
  }

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;

  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  const photoImg = document.getElementById('photo');
  photoImg.src = selfieData;
  photoImg.style.display = 'block';

  if (window.faceapi && modelsLoaded) {
    try {
      const fullDetection = await faceapi
        .detectSingleFace(photoImg, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();
      if (fullDetection && fullDetection.descriptor) {
        faceDescriptor = Array.from(fullDetection.descriptor);
      }
    } catch (e) {
      console.warn('Descriptor extraction warning:', e);
    }
  }

  document.getElementById('livenessText').classList.add('hide');
  document.getElementById('captureNowBtn').style.display = 'none';
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.style.display = 'none';

  const btn = document.getElementById('cameraBtn');
  btn.innerHTML = '<i class="fas fa-check"></i> Face Verified';
  btn.classList.add('verified');
  btn.disabled = true;

  document.getElementById('verifyStatus').textContent = 'Identity verified via live selfie';
  livenessPassed = true;
  setMessage('Live selfie captured and verified!', true);
  checkButtonState();
}

function isValidDob(day, month, year) {
  const d = parseInt(day, 10);
  const m = parseInt(month, 10);
  const y = parseInt(year, 10);
  if (!d || !m || !y) return false;
  if (d < 1 || d > 31 || m < 1 || m > 12) return false;
  const currentYear = new Date().getFullYear();
  if (y < 1900 || y > currentYear) return false;
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function hasHumanCheck() {
  const recaptchaToken = (typeof grecaptcha !== 'undefined' && typeof grecaptcha.getResponse === 'function')
    ? grecaptcha.getResponse()
    : '';
  const manualChecked = document.getElementById('humanCheck').checked;
  return Boolean(recaptchaToken) || manualChecked;
}

function checkButtonState() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const day = document.getElementById('day').value.trim();
  const month = document.getElementById('month').value.trim();
  const year = document.getElementById('year').value.trim();
  const password = document.getElementById('password').value;

  const humanOk = hasHumanCheck();
  const sendBtn = document.getElementById('sendOtpBtn');
  const signBtn = document.getElementById('signUpBtn');

  if (isValidEmail(email) && humanOk) {
    sendBtn.classList.add('active');
    sendBtn.disabled = false;
  } else {
    sendBtn.classList.remove('active');
    sendBtn.disabled = true;
  }

  const dobOk = year.length === 4 && isValidDob(day, month, year);
  if (otpSent && otp.length === 6 && humanOk && livenessPassed && isValidEmail(email) && dobOk && password.length >= 6) {
    signBtn.classList.add('active');
    signBtn.disabled = false;
  } else {
    signBtn.classList.remove('active');
    signBtn.disabled = true;
  }
}

window.enableBtn = () => checkButtonState();
window.manualCaptcha = () => checkButtonState();

function updateTimer() {
  const el = document.getElementById('otpTimer');
  if (!el) return;
  const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
  if (otpSeconds > 0) {
    el.textContent = `${dict.otpExpiresPrefix}${otpSeconds}s`;
  } else {
    el.textContent = dict.otpExpired;
  }
}

async function parseJsonSafe(res) {
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    return { message: text || `HTTP ${res.status}` };
  }
}

async function sendOTP() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('sendOtpBtn');
  const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
  setMessage('');

  if (!isValidEmail(email)) {
    setMessage('Please enter a valid email address.');
    return;
  }

  let signupName = 'User';
  try {
    signupName = localStorage.getItem('signup_name') || 'User';
  } catch (e) {}

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending OTP...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        name: signupName,
        lang: currentLang
      })
    });

    const data = await parseJsonSafe(res);

    if (data.alreadyExists) {
      setMessage('An account already exists with this email. Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
      return;
    }

    if (!res.ok || data.success === false) {
      const errMsg = data.message || data.error || data.code || `Failed to send OTP (HTTP ${res.status}).`;
      setMessage(errMsg);
      btn.innerHTML = dict.sendOtp;
      checkButtonState();
      return;
    }

    otpSent = true;
    document.getElementById('otpGroup').classList.remove('hide');
    document.getElementById('otp').focus();
    setMessage('6-digit OTP code sent to your email. Check Inbox or Spam.', true);

    otpSeconds = 60;
    updateTimer();
    if (otpTimer) clearInterval(otpTimer);
    otpTimer = setInterval(() => {
      otpSeconds--;
      updateTimer();
      if (otpSeconds <= 0) {
        clearInterval(otpTimer);
      }
    }, 1000);

    btn.innerHTML = '<i class="fas fa-check"></i> OTP Sent';
    setTimeout(() => {
      btn.innerHTML = 'Resend OTP';
      checkButtonState();
    }, 3000);

    checkButtonState();
  } catch (err) {
    console.error('Send OTP network/client error:', err);
    setMessage('Network or server error while sending OTP: ' + (err.message || 'Unknown error'));
    btn.innerHTML = dict.sendOtp;
    checkButtonState();
  }
}

async function verifyOTPAndSignup() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const password = document.getElementById('password').value;
  let name = 'User';
  try {
    name = localStorage.getItem('signup_name') || 'User';
  } catch (e) {}
  const day = document.getElementById('day').value.trim();
  const month = document.getElementById('month').value.trim();
  const year = document.getElementById('year').value.trim();

  const btn = document.getElementById('signUpBtn');
  const dict = getDict(currentLang, getSelectedLangLabel(currentLang));
  setMessage('');

  if (!isValidDob(day, month, year)) {
    setMessage('Please enter a valid birthday (DD / MM / YYYY).');
    return;
  }

  if (password.length < 6) {
    setMessage('Password must be at least 6 characters long.');
    return;
  }

  const dob = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        otp,
        password,
        profile: {
          full_name: name,
          dob,
          selfieData,
          faceDescriptor,
          webauthnCredentialId,
          language: currentLang
        }
      })
    });

    const data = await parseJsonSafe(res);

    if (data.alreadyExists) {
      setMessage('An account already exists with this email. Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
      return;
    }

    if (!res.ok || data.success === false) {
      const errMsg = data.message || data.error || data.code || `Signup failed (HTTP ${res.status}).`;
      setMessage(errMsg);
      btn.innerHTML = dict.signUp;
      checkButtonState();
      return;
    }

    if (supabaseClient) {
      const { error: signInErr } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (signInErr) {
        window.location.href = 'login.html?msg=signup_success';
        return;
      }
    }

    window.location.href = 'index.html';
  } catch (err) {
    console.error('Verify OTP / Signup error:', err);
    setMessage('Error completing sign up: ' + (err.message || 'Unknown error'));
    btn.innerHTML = dict.signUp;
    checkButtonState();
  }
}

function initPage() {
  const selectEl = document.getElementById('languageSelect');
  if (selectEl) {
    selectEl.addEventListener('change', () => onLanguageSelectChange(selectEl));
    selectEl.addEventListener('input', () => onLanguageSelectChange(selectEl));
  }
  restoreSavedLanguage();
  updateNamePreview();
  checkButtonState();
}

initPage();
document.addEventListener('DOMContentLoaded', initPage);
