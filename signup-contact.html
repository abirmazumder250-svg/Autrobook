<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign Up — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Google reCAPTCHA SDK -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ===== SYSTEM DEFAULT THEME ===== */
    :root {
      --primary: #1b5e20; --primary-hover: #144817;
      --bg: #f0f2f5; --card: #ffffff; --text: #1c1e21;
      --muted: #65676b; --border: #e4e6e9; --input-bg: #fafafa;
      --error: #c62828; --success: #2e7d32;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #2e7d32; --primary-hover: #1b5e20;
        --bg: #0f1419; --card: #1a1f26; --text: #e8eaed;
        --muted: #9aa0a6; --border: #2a3038; --input-bg: #0f1419;
        --error: #ef5350; --success: #66bb6a;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    .top-bar { width: 100%; max-width: 480px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text); cursor: pointer; border: 1px solid var(--border); }

    .header { text-align: center; margin-bottom: 20px; padding: 0 20px; }
    .logo { width: 64px; height: 64px; border-radius: 16px; object-fit: contain; background: var(--card); padding: 8px; box-shadow: 0 4px 12px rgba(27, 94, 32, 0.15); margin-bottom: 12px; }
    h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    p.subtitle { font-size: 14px; color: var(--muted); }

    .form-wrap { width: 100%; max-width: 440px; padding: 0 20px 40px; }
    .form-group { margin-bottom: 16px; position: relative; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 15px; outline: none; }
    input:focus { border-color: var(--primary); background: var(--card); }

    .eye-icon { position: absolute; right: 14px; top: 38px; cursor: pointer; color: var(--muted); }
    .strength-msg { font-size: 12px; font-weight: 600; margin-top: 6px; }

    /* Verification Box */
    .verify-box { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; background: var(--input-bg); margin-bottom: 18px; }
    .verify-box video { width: 100%; border-radius: 10px; display: none; margin-bottom: 10px; }
    .verify-box img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: none; border: 3px solid var(--primary); }
    .verify-options { display: flex; gap: 10px; margin-bottom: 12px; }
    .verify-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .verify-btn.fp-btn { background: var(--card); color: var(--primary); border: 2px solid var(--primary); }
    .verify-btn.verified { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
    .verify-status { font-size: 12.5px; color: var(--muted); font-weight: 500; }

    /* reCAPTCHA */
    .captcha-container { display: flex; justify-content: center; margin-bottom: 12px; }
    .checkbox-row { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin: 10px 0 20px; }
    .checkbox-row input { width: auto; margin: 0; }

    /* Buttons */
    .btn { width: 100%; padding: 15px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-top: 10px; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:disabled { background: #9e9e9e; cursor: not-allowed; }
    .footer-text { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--muted); }
    .footer-text a { color: var(--primary); font-weight: 700; text-decoration: none; }

    .step { display: none; }
    .otp-container { display: flex; justify-content: space-between; gap: 8px; margin: 20px 0; }
    .otp-digit { width: 48px; height: 55px; text-align: center; font-size: 24px; font-weight: 700; border-radius: 12px; border: 1.5px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; }
    .otp-digit:focus { border-color: var(--primary); }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="back-btn" onclick="location.href='signup-name.html'"><i class="fas fa-arrow-left"></i></div>
  </div>

  <div class="header">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <h2>Secure Your Account</h2>
    <p class="subtitle">Enter details and verify your identity</p>
  </div>

  <div class="form-wrap">
    <!-- STEP 1 -->
    <div id="stepDetails" class="step" style="display:block">
      <p id="namePreview" style="color:var(--primary); font-size:14px; font-weight:700; margin-bottom:16px;"></p>

      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="dob">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a strong password" oninput="checkStrength()">
        <i class="fas fa-eye eye-icon" onclick="togglePass()"></i>
        <div class="strength-msg" id="strengthText"></div>
      </div>

      <!-- Live Selfie & Fingerprint -->
      <label>Security Verification</label>
      <div class="verify-box">
        <video id="video" autoplay playsinline></video>
        <img id="photo" />
        
        <div class="verify-options">
          <button type="button" class="verify-btn" id="cameraBtn" onclick="startCamera()">
            <i class="fas fa-camera"></i> Live Selfie
          </button>
          <button type="button" class="verify-btn fp-btn" id="fpBtn" onclick="verifyFingerprint()">
            <i class="fas fa-fingerprint"></i> Fingerprint
          </button>
        </div>
        <div class="verify-status" id="verifyStatus">Verify using camera or fingerprint</div>
      </div>

      <!-- reCAPTCHA -->
      <div class="captcha-container">
        <div class="g-recaptcha" data-sitekey="6Lck5SAuAAAAAJaip9tn4qoVcWnHpO2-yusatinK" data-callback="enableBtn"></div>
      </div>
      
      <p style="font-size:12px; color:var(--muted); text-align:center;">If reCAPTCHA doesn't load, verify below</p>
      <div class="checkbox-row">
        <input type="checkbox" id="humanCheck" onchange="manualCaptcha()"> 
        <span>I'm not a robot - Manual verification</span>
      </div>

      <div class="msg" id="msgDetails" style="text-align:center; color:var(--error); font-size:13px; margin-bottom:10px;"></div>
      
      <button type="button" class="btn btn-primary" id="nextBtn" onclick="triggerEmailVerification()" disabled>
        Complete Sign Up
      </button>
      
      <p class="footer-text">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script>
    let selfieData = "";
    let fingerprintVerified = false;
    let stream = null;

    // ===== 1. UI HELPERS =====
    function showMsg(id, text, color = "var(--error)") {
      const el = document.getElementById(id);
      el.textContent = text;
      el.style.color = color;
    }

    function togglePass() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    function checkStrength() {
      const v = document.getElementById('password').value;
      const el = document.getElementById('strengthText');
      if (!v) { el.innerText = ''; return; }
      if (v.length < 6) { el.innerText = '❌ Weak (Min 6 chars)'; el.style.color = 'var(--error)'; }
      else if (v.length < 10) { el.innerText = '🟡 Medium'; el.style.color = '#f9a825'; }
      else { el.innerText = '🟢 Strong'; el.style.color = 'var(--success)'; }
    }

    // ===== 2. BUTTON ENABLE LOGIC =====
    function checkCanSubmit() {
      const captchaChecked = (typeof grecaptcha !== 'undefined' && grecaptcha.getResponse().length > 0);
      const manualChecked = document.getElementById('humanCheck').checked;
      
      // If either Captcha or Manual is checked, AND (Selfie OR Fingerprint is done)
      if ((captchaChecked || manualChecked) && (selfieData || fingerprintVerified)) {
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('nextBtn').style.background = 'var(--primary)';
      } else {
        document.getElementById('nextBtn').disabled = true;
        document.getElementById('nextBtn').style.background = '#9e9e9e';
      }
    }

    // Called by reCAPTCHA
    window.enableBtn = () => checkCanSubmit();
    window.manualCaptcha = () => checkCanSubmit();

    // ===== 3. LIVE SELFIE CAMERA =====
    window.startCamera = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        const video = document.getElementById('video');
        video.srcObject = stream; 
        video.style.display = 'block';
        
        const btn = document.getElementById('cameraBtn');
        btn.innerHTML = '<i class="fas fa-camera"></i> Capture';
        btn.onclick = capturePhoto;
      } catch (e) {
        showMsg('msgDetails', 'Camera permission denied.');
      }
    };

    window.capturePhoto = () => {
      const video = document.getElementById('video');
      if (!video.videoWidth) return showMsg('msgDetails', 'Wait for camera to load...');
      
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; 
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      selfieData = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('photo').src = selfieData;
      document.getElementById('photo').style.display = 'block';
      video.style.display = 'none';
      
      if (stream) { stream.getTracks().forEach(track => track.stop()); }
      
      const btn = document.getElementById('cameraBtn');
      btn.innerHTML = '<i class="fas fa-check"></i> Selfie Done';
      btn.classList.add('verified');
      
      document.getElementById('verifyStatus').innerText = "✅ Selfie captured successfully!";
      document.getElementById('verifyStatus').style.color = "var(--success)";
      
      checkCanSubmit(); // Unlock the button
    };

    // ===== 4. FINGERPRINT =====
    window.verifyFingerprint = async () => {
      if (!window.PublicKeyCredential) {
        return showMsg('msgDetails', 'Device does not support fingerprint.');
      }

      try {
        document.getElementById('verifyStatus').innerText = "Scanning fingerprint...";
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge,
            rp: { name: "Autrobook", id: window.location.hostname },
            user: {
              id: new TextEncoder().encode(document.getElementById('email').value || "user"),
              name: document.getElementById('email').value || "user@autrobook.com",
              displayName: "Autrobook User"
            },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
          }
        });

        if (credential) {
          fingerprintVerified = true;
          const btn = document.getElementById('fpBtn');
          btn.classList.add('verified');
          btn.innerHTML = '<i class="fas fa-check"></i> Verified';
          
          document.getElementById('verifyStatus').innerText = "✅ Fingerprint registered!";
          document.getElementById('verifyStatus').style.color = "var(--success)";
          
          checkCanSubmit(); // Unlock the button
        }
      } catch (err) {
        console.error(err);
        document.getElementById('verifyStatus').innerText = "❌ Fingerprint cancelled.";
        document.getElementById('verifyStatus').style.color = "var(--error)";
      }
    };

    // ===== 5. SUBMIT DATA =====
    window.triggerEmailVerification = () => {
      const dob = document.getElementById('dob').value;
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;

      if (!dob) return showMsg('msgDetails', 'Please select Date of Birth.');
      if (!email) return showMsg('msgDetails', 'Please enter Email Address.');
      if (pass.length < 6) return showMsg('msgDetails', 'Password must be at least 6 characters.');

      // Simulate loading
      const btn = document.getElementById('nextBtn');
      btn.innerText = "Processing...";
      btn.disabled = true;

      // Save details for next step (OTP)
      localStorage.setItem('signup_email', email);
      
      setTimeout(() => {
        alert("Success! OTP sent to " + email);
        window.location.href = 'verify-otp.html'; // Redirect to OTP page
      }, 1500);
    };

    // Initialize name display
    window.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('signup_name');
      if (name) document.getElementById('namePreview').innerText = '👤 ' + name;
    });
  </script>
</body>
</html>
