<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="color-scheme" content="light dark">
<title>Autrobook - Contact</title> 
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style> 
:root{
  --bg:#ffffff; --card:#f5f5f5; --text:#111; --text2:#666; --border:#ccc; --brand:#1877f2; --error:#d32f2f; --success:#2e7d32;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1c1e; --card:#2c2c2e; --text:#fff; --text2:#aaa; --border:#555; --brand:#1877f2;
  }
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial,sans-serif} 
body{background:var(--bg);min-height:100vh;color:var(--text)} 
.top{padding:15px} 
.back{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer} 
.lang{text-align:center;color:var(--text2);margin:5px 0 25px;font-size:15px} 
.logo{text-align:center;margin-bottom:40px} 
.logo-circle{width:80px;height:80px;background:var(--brand);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:42px;font-weight:bold;color:white} 
.wrap{padding:0 20px 30px;max-width:450px;margin:0 auto} 
h2{font-size:22px;margin-bottom:6px} 
p.sub{color:var(--text2);font-size:14px;margin-bottom:25px;line-height:1.5} 
input{width:100%;padding:18px 20px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:17px;margin-bottom:15px;outline:none} 
input::placeholder{color:var(--text2)} 
input:focus{border-color:var(--brand)} 
.pass-wrap{position:relative} 
.eye{position:absolute;right:18px;top:18px;cursor:pointer;font-size:18px;color:var(--text2)} 
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:var(--brand);color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px} 
.btn:disabled{opacity:.5;cursor:not-allowed} 
.btn-outline{width:100%;padding:15px;border:1px solid var(--brand);border-radius:30px;background:transparent;color:var(--brand);font-size:17px;font-weight:bold;cursor:pointer;margin-top:30px} 
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px} 
.msg.error{color:var(--error)}.msg.success{color:var(--success)} 
.info{text-align:center;color:var(--text2);font-size:14px;margin-top:20px;line-height:1.6} 
.footer{text-align:center;margin-top:20px;color:var(--text2);font-size:16px} 
.g-recaptcha{margin:15px 0;display:flex;justify-content:center; transform:scale(0.9);}
</style> 
</head> 
<body> 
<div class="top"><div class="back" onclick="location.href='/signup-name.html'">←</div></div> 
<div class="lang">English (US) ∨</div> 
<div class="logo"><div class="logo-circle">A</div></div> 
<div class="wrap"> 
<h2>What's your email?</h2> 
<p class="sub">Enter the email where you can be contacted. You'll use this to log in and recover your account.</p> 
<input type="email" id="email" placeholder="Mobile number or email" autocomplete="email"> 
<h2 style="margin-top:5px">Create password</h2> 
<p class="sub">Use at least 6 characters. Don't use your name or email.</p> 
<div class="pass-wrap"> 
<input type="password" id="password" placeholder="Password" autocomplete="new-password"> 
<span class="eye" onclick="togglePass()">👁️</span> 
</div> 

<div class="g-recaptcha" data-sitekey="6LfzSBwuAAAAAK4XcwjLp9vNWxGECgLc2YcNdwD5" data-callback="enableBtn" data-expired-callback="disableBtn"></div>

<div class="msg" id="msg"></div> 
<button class="btn" id="nextBtn" onclick="goNext()" disabled>Create Account</button> 
<div class="info" id="showName"></div> 
<button class="btn-outline" onclick="location.href='/login.html'">Already have an account?</button> 
<div class="footer">∞ Autrobook</div> 
</div> 

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; 
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; 

const firebaseConfig = { 
apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI", 
authDomain: "autrobook-ad3d5.firebaseapp.com", 
projectId: "autrobook-ad3d5", 
storageBucket: "autrobook-ad3d5.firebasestorage.app", 
messagingSenderId: "554222945815", 
appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52", 
measurementId: "G-Z8QM0NVR6W" 
}; 

const app = initializeApp(firebaseConfig); 
const auth = getAuth(app); 

const fn = localStorage.getItem('signup_firstName') || ''; 
const sn = localStorage.getItem('signup_surname') || ''; 
if(fn || sn){ document.getElementById('showName').textContent = 'Hi ' + fn + ' ' + sn } 

const savedEmail = localStorage.getItem('signup_email'); 
const savedPass = localStorage.getItem('signup_password'); 
if(savedEmail) document.getElementById('email').value = savedEmail; 
if(savedPass) document.getElementById('password').value = savedPass; 

window.enableBtn = () => { document.getElementById('nextBtn').disabled = false; }
window.disableBtn = () => { document.getElementById('nextBtn').disabled = true; }

function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;} 
function togglePass(){ const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password'; } 

window.goNext = async () => { 
const email=document.getElementById('email').value.trim().toLowerCase(); 
const pass=document.getElementById('password').value; 
const captcha = grecaptcha.getResponse();

if(!fn || !sn){ showMsg('Please complete the Name step first.','error'); setTimeout(()=>location.href='/signup-name.html',800); return; } 
if(!email) return showMsg('Enter your email','error'); 
if(!email.includes('@') || !email.includes('.')) return showMsg('Enter a valid email','error'); 
if(!pass) return showMsg('Enter a password','error'); 
if(pass.length<6) return showMsg('Password must be at least 6 characters','error'); 
if(pass.toLowerCase().includes(fn.toLowerCase()) && fn.length>2) return showMsg("Don't use your name in your password",'error'); 
if(captcha.length == 0) return showMsg('Please verify reCAPTCHA','error');

const btn=document.getElementById('nextBtn'); btn.disabled=true; btn.textContent='Creating...';

try{ 
await createUserWithEmailAndPassword(auth, email, pass); 
localStorage.setItem('signup_email', email); 
localStorage.setItem('signup_password', pass); 
showMsg('✅ Account Created! Redirecting to Login...','success'); 
setTimeout(()=>location.href='/login.html',1500);
} catch(error){ 
if(error.code == 'auth/email-already-in-use'){ showMsg('This email already exists. Try Login', 'error'); }
else{ showMsg(error.message, 'error'); } 
} 
btn.disabled=false; btn.textContent='Create Account';
} 
</script> 
</body> 
</html>
