<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> 
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f5132">
<title>Autrobook - Sign Up</title> 
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style> 
:root{
  --bg:#ffffff; --card:#f8f9fa; --text:#212529; --text2:#6c757d; --border:#dee2e6; --brand:#0f5132; --brand-light:#198754; --error:#dc3545; --success:#198754;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0f0a; --card:#121a12; --text:#e9ecef; --text2:#adb5bd; --border:#1f2a1f; --brand:#0f5132; --brand-light:#198754;
  }
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial,sans-serif} 
body{background:var(--bg);min-height:100vh;color:var(--text)} 
.top{padding:16px} 
.back{width:40px;height:40px;background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid var(--border)} 
.lang{text-align:center;color:var(--text2);margin:8px 0 20px;font-size:14px;font-weight:500} 
.logo{text-align:center;margin-bottom:20px} 
.logo-img{width:75px;height:75px;border-radius:20px;object-fit:cover;box-shadow:0 4px 15px rgba(15,81,50,0.3)} 
.wrap{padding:0 20px 40px;max-width:480px;margin:0 auto} 
h2{font-size:20px;margin-bottom:4px;font-weight:700;text-align:center} 
p.sub{color:var(--text2);font-size:13px;margin-bottom:20px;line-height:1.5;text-align:center} 
label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;font-weight:600}
input{width:100%;padding:14px 15px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:15px;margin-bottom:15px;outline:none;transition:0.2s}
input::placeholder{color:var(--text2)} 
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.1)} 
input[type="date"]{color-scheme: dark;}
.name-row{display:flex;gap:10px}
.name-row input{width:50%}
.pass-wrap{position:relative} 
.eye{position:absolute;right:15px;top:14px;cursor:pointer;font-size:18px;color:var(--text2)} 
.camera-box{border:2px dashed var(--brand-light);border-radius:14px;padding:16px;text-align:center;margin-bottom:16px;background:var(--card)}
.camera-box video{width:100%;border-radius:10px;display:none;margin-bottom:10px;max-height:250px}
.camera-box img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin:8px auto;display:none;border:3px solid var(--brand-light)}
.camera-btn{padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-weight:700;cursor:pointer;width:100%;font-size:15px}
.btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:0 4px 12px rgba(15,81,50,0.25)} 
.btn:disabled{opacity:.5;background:#555;cursor:not-allowed;box-shadow:none} 
.btn-outline{width:100%;padding:14px;border:1.5px solid var(--brand-light);border-radius:14px;background:transparent;color:var(--brand-light);font-size:15px;font-weight:700;cursor:pointer;margin-top:14px} 
.msg{text-align:center;font-size:13px;min-height:20px;margin-top:10px;font-weight:500} 
.msg.error{color:var(--error)}.msg.success{color:var(--success)} 
.footer{text-align:center;margin-top:20px;color:var(--text2);font-size:14px;font-weight:500} 
.g-recaptcha{margin:16px 0;display:flex;justify-content:center; transform:scale(0.92);}
</style> 
</head> 
<body> 
<div class="top"><div class="back" onclick="location.href='/'">←</div></div> 
<div class="lang">English (US) ∨</div> 
<div class="logo"><img src="/logo.png" alt="Autrobook" class="logo-img" onerror="this.src='https://placehold.co/75x75/0f5132/ffffff?text=A'"></div> 
<div class="wrap"> 
<h2>Create Autrobook Account</h2> 
<p class="sub">It's quick and easy.</p> 

<label>Full Name</label>
<div class="name-row">
<input type="text" id="firstName" placeholder="First name">
<input type="text" id="surname" placeholder="Surname">
</div>

<label>Date of Birth</label>
<input type="date" id="dob">

<label>Email</label>
<input type="email" id="email" placeholder="Enter your email" autocomplete="email"> 

<label>New Password</label>
<div class="pass-wrap"> 
<input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password"> 
<span class="eye" onclick="togglePass()">👁️</span> 
</div>

<label>Face Verification</label>
<div class="camera-box">
<video id="video" autoplay playsinline></video>
<img id="photo" />
<button class="camera-btn" id="cameraBtn" onclick="startCamera()">📷 Take Live Selfie</button>
</div>

<div class="g-recaptcha" data-sitekey="6LfzSBwuAAAAAK4XcwjLp9vNWxGECgLc2YcNdwD5" data-callback="enableBtn" data-expired-callback="disableBtn"></div>

<div class="msg" id="msg"></div> 
<button class="btn" id="nextBtn" onclick="goNext()" disabled>Sign Up</button> 
<button class="btn-outline" onclick="location.href='/login.html'">Already have an account?</button> 
<div class="footer">∞ Autrobook</div> 
</div> 

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; 
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; 
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { 
apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI", 
authDomain: "autrobook-ad3d5.firebaseapp.com", 
projectId: "autrobook-ad3d5", 
storageBucket: "autrobook-ad3d5.firebasestorage.app", 
messagingSenderId: "554222945815", 
appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52", 
measurementId: "G-Z8QM0NVR6W" 
}; 

const app = initializeApp(firebaseConfig); 
const auth = getAuth(app); 
const db = getFirestore(app);

let selfieData = "";
let stream = null;

window.enableBtn = () => { document.getElementById('nextBtn').disabled = false; }
window.disableBtn = () => { document.getElementById('nextBtn').disabled = true; }

function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;} 
function togglePass(){ const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password'; } 

window.startCamera = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('cameraBtn').innerText = '📸 Capture Photo';
    document.getElementById('cameraBtn').onclick = capturePhoto;
  }catch(e){ showMsg('Camera permission denied','error'); }
}

function capturePhoto(){
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('photo').src = selfieData;
  document.getElementById('photo').style.display = 'block';
  video.style.display = 'none';
  if(stream){ stream.getTracks().forEach(track => track.stop()); }
  document.getElementById('cameraBtn').innerText = '🔄 Retake Photo';
  document.getElementById('cameraBtn').onclick = startCamera;
  showMsg('Selfie captured!','success');
}

window.goNext = async () => { 
const fn=document.getElementById('firstName').value.trim();
const sn=document.getElementById('surname').value.trim();
const dob=document.getElementById('dob').value;
const email=document.getElementById('email').value.trim().toLowerCase(); 
const pass=document.getElementById('password').value; 
const captcha = grecaptcha.getResponse();

if(!fn) return showMsg('Enter First Name','error'); 
if(!sn) return showMsg('Enter Surname','error'); 
if(!dob) return showMsg('Select Date of Birth','error'); 
if(!email) return showMsg('Enter your email','error'); 
if(!email.includes('@')) return showMsg('Enter a valid email','error'); 
if(!pass || pass.length<6) return showMsg('Password min 6 characters','error'); 
if(!selfieData) return showMsg('Please take a selfie','error');
if(captcha.length == 0) return showMsg('Please verify reCAPTCHA','error');

const btn=document.getElementById('nextBtn'); btn.disabled=true; btn.textContent='Creating...';

try{ 
const userCred = await createUserWithEmailAndPassword(auth, email, pass); 
await setDoc(doc(db, "users", userCred.user.uid), {
  firstName: fn, surname: sn, dob: dob, email: email, selfie: selfieData, createdAt: new Date()
});

showMsg('✅ Account Created! Redirecting to Login...','success'); 
setTimeout(()=>location.href='/login.html',1500);
} catch(error){ 
if(error.code == 'auth/email-already-in-use'){ showMsg('This email already exists', 'error'); }
else{ showMsg(error.message, 'error'); } 
} 
btn.disabled=false; btn.textContent='Sign Up';
} 
</script> 
</body> 
</html>
