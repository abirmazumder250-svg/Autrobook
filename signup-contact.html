    META TAGS AND INITIAL SETUP
    ============================================================================

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#043D22">
    <title>Sign Up - Autrobook</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google reCAPTCHA (Test Key) -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <!-- Supabase for Authentication -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <!-- Face-API for Biometrics (Liveness & Face Descriptors) -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        /* 
        ============================================================================
        CSS VARIABLES FOR THEMING (LIGHT & DARK MODE)
        ============================================================================
        */
        :root {
            --primary: #043D22; 
            --primary-hover: #022a17;
            --bg: #f0f2f5; 
            --card: #ffffff; 
            --text: #050505; 
            --muted: #65676b;
            --border: #dadde1; 
            --input-bg: #ffffff; 
            --error: #e41e3f; 
            --success: #2e7d32; 
            --disabled: #9e9e9e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #18191a; 
                --card: #242526; 
                --text: #e4e6eb; 
                --muted: #b0b3b8;
                --border: #3a3b3c; 
                --input-bg: #242526; 
                --error: #f02849; 
                --success: #66bb6a; 
                --disabled: #4b4c4f;
            }
        }

        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 
        ============================================================================
        TOP NAVIGATION BAR
        ============================================================================
        */
        .top-bar {
            width: 100%;
            max-width: 480px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text);
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .lang-wrapper {
            display: inline-flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .lang-wrapper span {
            font-size: 13.5px;
            font-weight: 600;
        }

        .lang-wrapper i {
            font-size: 12px;
            color: var(--muted);
            margin-left: 8px;
        }

        /* 
        ============================================================================
        LANGUAGE MODAL (MATCHING YOUR SCREENSHOT)
        ============================================================================
        */
        .lang-modal-back {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .lang-modal {
            background: var(--card);
            width: 90%;
            max-width: 380px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .lang-modal h3 {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #000; /* Forced dark text to match screenshot */
        }
        @media (prefers-color-scheme: dark) { .lang-modal h3 { color: var(--text); } }

        .lang-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 400px;
            overflow-y: auto;
        }

        .lang-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            color: #000;
        }
        @media (prefers-color-scheme: dark) { .lang-item { color: var(--text); } }
        .lang-item:hover { background: var(--bg); }

        .lang-item span { font-size: 15px; font-weight: 500; }

        /* Custom Radio Button to match screenshot */
        .lang-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--muted);
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
        }
        .lang-item input[type="radio"]:checked {
            border-color: var(--primary);
        }
        .lang-item input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }

        .lang-close {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        /* 
        ============================================================================
        HEADER AND FORM STYLES
        ============================================================================
        */
        .header { text-align: center; margin-bottom: 20px; padding: 0 20px; }
        .logo { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; margin: 0 auto 12px; display: block; }
        h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: var(--muted); }

        .progress-container { width: 100%; max-width: 440px; padding: 0 20px; display: flex; gap: 6px; margin-bottom: 24px; }
        .progress-step { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
        .progress-step.active { background: var(--primary); }

        .form-wrap { width: 100%; max-width: 440px; padding: 0 20px 40px; position: relative; z-index: 10; }
        .form-group { margin-bottom: 16px; position: relative; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
        
        input[type="email"], input[type="password"], input[type="text"], input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: var(--primary); }

        /* Eye Icon for Password */
        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(15%);
            cursor: pointer;
            color: var(--muted);
            padding: 10px;
            font-size: 18px;
        }

        .dob-wrap { display: flex; gap: 8px; }
        .dob-wrap input { text-align: center; }

        /* 
        ============================================================================
        VERIFICATION AND BUTTON STYLES
        ============================================================================
        */
        .verify-box { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; background: var(--input-bg); margin-bottom: 18px; }
        .verify-box video { width: 100%; border-radius: 10px; display: none; margin-bottom: 10px; transform: scaleX(-1); }
        .verify-box img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: none; border: 3px solid var(--primary); }
        
        .verify-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .verify-btn.verified { background: var(--success) !important; }
        .liveness-text { font-size: 12px; color: var(--primary); font-weight: 600; margin-bottom: 10px; }

        /* Fingerprint Button */
        .fingerprint-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .fingerprint-btn:hover { background: var(--bg); }
        .fingerprint-btn.verified { border-color: var(--success); color: var(--success); }

        /* Manual Captcha */
        .manual-captcha-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--input-bg); border: 1.5px solid var(--border);
            padding: 14px 16px; border-radius: 12px; cursor: pointer;
            margin: 8px 0 20px; user-select: none;
        }
        .manual-captcha-row input[type="checkbox"] { display: none; }
        .custom-checkbox {
            width: 24px; height: 24px; border: 2px solid var(--muted);
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
        }
        .manual-captcha-row input:checked ~ .custom-checkbox { background: var(--primary); border-color: var(--primary); }
        .manual-captcha-row input:checked ~ .custom-checkbox::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: white; font-size: 13px; }
        .manual-captcha-row span { font-size: 14px; font-weight: 600; }

        .btn {
            width: 100%; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700;
            border: none; margin-top: 10px; background: var(--disabled); color: #fff; cursor: not-allowed;
        }
        .btn.active { background: var(--primary) !important; cursor: pointer; }
        .btn-secondary {
            width: 100%; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700;
            border: 1.5px solid var(--border); background: transparent; color: var(--text); margin-top: 10px; cursor: pointer;
        }
        
        .msg { text-align: center; font-size: 13px; color: var(--error); font-weight: 700; min-height: 20px; margin-bottom: 10px; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--muted); }
        .footer-text a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .otp-timer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
        .hide { display: none !important; }
    </style>
</head>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
        <div class="lang-wrapper" onclick="openLangModal()">
            <span id="langBtn" data-i18n="langBtn">English - US</span> <i class="fas fa-chevron-down"></i>
        </div>
    </div>

    <!-- HEADER -->
    <div class="header">
        <img src="logo.png" alt="Autrobook Logo" class="logo" onerror="this.style.display='none'">
        <h2 data-i18n="secureAcc">Secure Your Account</h2>
        <p class="subtitle" data-i18n="subtitle">Enter details and verify your identity</p>
    </div>

    <!-- PROGRESS -->
    <div class="progress-container">
        <div class="progress-step active"></div>
        <div class="progress-step active"></div>
    </div>

    <!-- MAIN FORM -->
    <div class="form-wrap">
        <p id="namePreview" style="color:var(--primary); font-size:14px; font-weight:700; margin-bottom:16px;"></p>
        
        <div class="form-group">
            <label data-i18n="emailLabel">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" oninput="checkButtonState()">
        </div>

        <div class="form-group hide" id="otpGroup">
            <label data-i18n="otpLabel">Enter 6 Digit Code</label>
            <input type="text" id="otp" maxlength="6" placeholder="123456" oninput="checkButtonState()">
            <div class="otp-timer" id="otpTimer" data-i18n="otpTimer">Code expires in 60s</div>
        </div>

        <div class="form-group">
            <label data-i18n="dobLabel">Birthday</label>
            <div class="dob-wrap">
                <input type="number" id="day" placeholder="DD" oninput="checkButtonState()">
                <input type="number" id="month" placeholder="MM" oninput="checkButtonState()">
                <input type="number" id="year" placeholder="YYYY" oninput="checkButtonState()">
            </div>
        </div>

        <div class="form-group">
            <label data-i18n="passLabel">Password</label>
            <input type="password" id="password" placeholder="Create a strong password" oninput="checkButtonState()">
            <!-- Password Eye Icon -->
            <i class="fa-solid fa-eye eye-icon" id="togglePasswordIcon" onclick="togglePass()"></i>
        </div>

        <label data-i18n="securityLabel">Security Verification (Mandatory)</label>
        <div class="verify-box">
            <p class="liveness-text hide" id="livenessText" data-i18n="lookCam">Please look at the camera to verify</p>
            <video id="video" autoplay playsinline></video>
            <img id="photo" />
            
            <!-- Camera / Face Scan Button -->
            <button type="button" class="verify-btn" id="cameraBtn" onclick="startCamera()">
                <i class="fas fa-camera"></i> <span data-i18n="liveSelfie">Live Selfie & Eye Scan</span>
            </button>
            
            <!-- WebAuthn Fingerprint Button -->
            <button type="button" class="fingerprint-btn" id="fingerprintBtn" onclick="registerFingerprint()">
                <i class="fas fa-fingerprint"></i> <span data-i18n="fingerprintBtn">Add Fingerprint (WebAuthn)</span>
            </button>
            
            <div class="verify-status" id="verifyStatus" style="font-size:13px; font-weight:600; color:var(--muted); margin-top:10px;" data-i18n="verifyStatus">Verify using camera & fingerprint to proceed</div>
        </div>

        <!-- Google reCAPTCHA -->
        <div style="display:flex; justify-content:center; transform:scale(0.9); margin-bottom:8px; min-height:78px;">
            <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI" data-callback="enableBtn"></div>
        </div>
        
        <!-- Manual Captcha Fallback -->
        <label class="manual-captcha-row" for="humanCheck">
            <input type="checkbox" id="humanCheck" onchange="manualCaptcha()">
            <div class="custom-checkbox"></div>
            <span data-i18n="notRobot">I'm not a robot - Manual verification</span>
        </label>

        <div class="msg" id="msgDetails"></div>
        
        <button type="button" class="btn" id="sendOtpBtn" onclick="sendOTP()" disabled><span data-i18n="sendOtp">Send OTP</span></button>
        <button type="button" class="btn" id="signUpBtn" onclick="verifyOTPAndSignup()" disabled><span data-i18n="signUp">Sign Up</span></button>
        
        <button type="button" class="btn-secondary" onclick="goBack()"><span data-i18n="backBtn">← Back</span></button>
        <button type="button" class="btn-secondary" onclick="goCancel()" style="color:var(--error); border-color:var(--error);"><span data-i18n="cancelBtn">Cancel</span></button>
        
        <p class="footer-text">
            <span data-i18n="haveAcc">Already have an account?</span> 
            <a href="login.html" data-i18n="login">Log in</a>
        </p>
    </div>

    <!-- LANGUAGE MODAL -->
    <div class="lang-modal-back" id="langModal" onclick="closeLangModal()">
        <div class="lang-modal" onclick="event.stopPropagation()">
            <h3 data-i18n="selectLang">Select Language</h3>
            <div class="lang-list" id="langList"></div>
            <button class="lang-close" onclick="closeLangModal()" data-i18n="close">Close</button>
        </div>
    </div>

            id: { langBtn: "Bahasa Indonesia", secureAcc: "Amankan Akun Anda", subtitle: "Masukkan detail dan verifikasi identitas Anda", emailLabel: "Alamat Email", otpLabel: "Masukkan Kode 6 Digit", otpTimer: "Kode kedaluwarsa dalam 60s", dobLabel: "Ulang tahun", passLabel: "Kata Sandi", securityLabel: "Verifikasi Keamanan (Wajib)", lookCam: "Silakan lihat kamera untuk memverifikasi", liveSelfie: "Selfie Langsung & Pindai Mata", fingerprintBtn: "Tambah Sidik Jari", verifyStatus: "Verifikasi menggunakan kamera & sidik jari", notRobot: "Saya bukan robot - Verifikasi manual", sendOtp: "Kirim OTP", signUp: "Daftar", backBtn: "← Kembali", cancelBtn: "Batal", haveAcc: "Sudah punya akun?", login: "Masuk", selectLang: "Pilih Bahasa", close: "Tutup" },
            tr: { langBtn: "Türkçe - Türkiye", secureAcc: "Hesabınızı Güvenceye Alın", subtitle: "Bilgileri girin ve kimliğinizi doğrulayın", emailLabel: "E-posta Adresi", otpLabel: "6 Haneli Kodu Girin", otpTimer: "Kodun süresi 60s içinde dolacak", dobLabel: "Doğum günü", passLabel: "Şifre", securityLabel: "Güvenlik Doğrulaması (Zorunlu)", lookCam: "Doğrulamak için lütfen kameraya bakın", liveSelfie: "Canlı Selfie ve Göz Taraması", fingerprintBtn: "Parmak İzi Ekle", verifyStatus: "Devam etmek için kamera ve parmak iziyle doğrulayın", notRobot: "Ben robot değilim - Manuel doğrulama", sendOtp: "OTP Gönder", signUp: "Kayıt Ol", backBtn: "← Geri", cancelBtn: "İptal", haveAcc: "Zaten hesabınız var mı?", login: "Giriş yap", selectLang: "Dil Seçin", close: "Kapat" }
        };

        const languageList = [
            { code: 'en', name: 'English - US' }, { code: 'bn', name: 'বাংলা - Bangladesh' },
            { code: 'hi', name: 'हिन्दी - India' }, { code: 'es', name: 'Español - Spain' },
            { code: 'fr', name: 'Français - France' }, { code: 'ar', name: 'Arabic - العربية' },
            { code: 'pt', name: 'Português - Portugal' }, { code: 'de', name: 'Deutsch - Germany' },
            { code: 'id', name: 'Bahasa Indonesia' }, { code: 'tr', name: 'Türkçe - Türkiye' }
        ];

        let currentLang = localStorage.getItem('autro_lang') || 'en';
        
        // State Variables
        let selfieData = "", faceDescriptor = null, stream = null, livenessPassed = false;
        let fingerprintRegistered = false, otpTimer = null, otpSeconds = 60;

        // ============================================================================
        // 3. TRANSLATION ENGINE
        // ============================================================================
        function applyLanguage(langCode) {
            const dict = i18n[langCode] || i18n['en'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });
            document.getElementById('langBtn').innerText = languageList.find(l => l.code === langCode)?.name || 'English';
            localStorage.setItem('autro_lang', langCode);
            currentLang = langCode;
        }

        function buildLangList() {
            const list = document.getElementById('langList');
            list.innerHTML = '';
            languageList.forEach(lang => {
                const div = document.createElement('div');
                div.className = 'lang-item';
                div.innerHTML = `<span>${lang.name}</span><input type="radio" name="lang" ${currentLang === lang.code ? 'checked' : ''}>`;
                div.onclick = () => { applyLanguage(lang.code); closeLangModal(); };
                list.appendChild(div);
            });
        }

        function openLangModal() { document.getElementById('langModal').style.display = 'flex'; }
        function closeLangModal() { document.getElementById('langModal').style.display = 'none'; }

        // ============================================================================
        // 4. NAVIGATION
        // ============================================================================
        function goBack() { window.location.href = 'signup-name.html'; }
        function goCancel() { window.location.href = 'welcome.html'; }

        // ============================================================================
        // 5. PASSWORD TOGGLE (EYE ICON)
        // ============================================================================
        function togglePass() {
            const p = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            if (p.type === 'password') {
                p.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                p.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ============================================================================
        // 6. WEBAUTHN FINGERPRINT (GOOGLE/APPLE STANDARD)
        // ============================================================================
        async function registerFingerprint() {
            if (!window.PublicKeyCredential) {
                alert("WebAuthn is not supported on this browser.");
                return;
            }

            try {
                // 1. Generate a random challenge
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                // 2. Request biometric prompt
                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "Autrobook", id: window.location.hostname },
                        user: {
                            id: new Uint8Array(16), // In production, use the Supabase user ID
                            name: document.getElementById('email').value || "user@autrobook.com",
                            displayName: "Autrobook User"
                        },
                        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
                        authenticatorSelection: { userVerification: "required", authenticatorAttachment: "platform" },
                        timeout: 60000
                    }
                });

                if (credential) {
                    // Convert ArrayBuffer to Base64 to save in Supabase
                    const rawId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
                    
                    fingerprintRegistered = true;
                    const btn = document.getElementById('fingerprintBtn');
                    btn.classList.add('verified');
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> Fingerprint Registered';
                    btn.disabled = true;
                    checkButtonState();
                    
                    // NOTE: You must save 'rawId' to Supabase when the user signs up.
                    // window.savedFingerprintId = rawId; 
                }
            } catch (err) {
                console.error("Fingerprint registration failed:", err);
                alert("Fingerprint setup cancelled or failed.");
            }
        }

        // ============================================================================
        // 7. FACE API (LIVENESS & DESCRIPTOR EXTRACTION)
        // ============================================================================
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('livenessText').classList.remove('hide');
                
                const btn = document.getElementById('cameraBtn');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning Face...';
                btn.disabled = true;

                // Load models if not loaded
                if (!faceapi.nets.tinyFaceDetector.isLoaded) {
                    await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/models');
                    await faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/models');
                    await faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/models');
                }

                // Liveness check (Blink detection)
                let blinkCount = 0, lastEyeState = 'open', isCompleted = false;
                const interval = setInterval(async () => {
                    if (isCompleted) return;
                    const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
                    
                    if (detections) {
                        const leftEye = detections.landmarks.getLeftEye();
                        const rightEye = detections.landmarks.getRightEye();
                        const ear = (getDistance(leftEye[1], leftEye[5]) + getDistance(leftEye[2], leftEye[4])) / (2 * getDistance(leftEye[0], leftEye[3]));
                        
                        if (ear < 0.25 && lastEyeState === 'open') { blinkCount++; lastEyeState = 'closed'; }
                        if (ear > 0.25 && lastEyeState === 'closed') { lastEyeState = 'open'; }

                        // If human blinked, take photo and extract Descriptor
                        if (blinkCount >= 1) {
                            isCompleted = true;
                            clearInterval(interval);
                            await capturePhotoAndDescriptor(video);
                        }
                    }
                }, 200);

                // Timeout
                setTimeout(() => {
                    if (!livenessPassed) {
                        clearInterval(interval);
                        alert("Liveness failed. Please blink.");
                        stopCamera(btn);
                    }
                }, 15000);

            } catch (err) {
                console.error(err);
                alert("Camera access denied.");
            }
        }

        function getDistance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

        async function capturePhotoAndDescriptor(video) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            
            selfieData = canvas.toDataURL('image/jpeg', 0.8);
            document.getElementById('photo').src = selfieData;
            document.getElementById('photo').style.display = 'block';
            document.getElementById('video').style.display = 'none';
            
            // Extract 128-float face descriptor for future matching
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            if (detection) {
                faceDescriptor = Array.from(detection.descriptor); // Save this to Supabase
            }

            document.getElementById('livenessText').classList.add('hide');
            if (stream) stream.getTracks().forEach(t => t.stop());
            
            const btn = document.getElementById('cameraBtn');
            btn.innerHTML = '<i class="fas fa-check"></i> Face Verified';
            btn.classList.add('verified');
            btn.disabled = true;

            livenessPassed = true;
            checkButtonState();
        }

        // ============================================================================
        // 8. FORM VALIDATION AND UI STATE
        // ============================================================================
        function checkButtonState() {
            const captcha = (typeof grecaptcha !== 'undefined' && grecaptcha.getResponse().length > 0);
            const manual = document.getElementById('humanCheck').checked;
            
            // To proceed, we require Face Liveness AND (Fingerprint OR Captcha)
            const isVerified = livenessPassed && fingerprintRegistered; 
            
            const email = document.getElementById('email').value.trim();
            const day = document.getElementById('day').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;
            const pass = document.getElementById('password').value;

            const sendBtn = document.getElementById('sendOtpBtn');
            const signBtn = document.getElementById('signUpBtn');

            if (email.includes('@')) {
                sendBtn.classList.add('active'); sendBtn.disabled = false;
            } else {
                sendBtn.classList.remove('active'); sendBtn.disabled = true;
            }

            if ((captcha || manual) && isVerified && email && day && month && year.length === 4 && pass.length >= 6) {
                signBtn.classList.add('active'); signBtn.disabled = false;
            } else {
                signBtn.classList.remove('active'); signBtn.disabled = true;
            }
        }

        window.enableBtn = () => checkButtonState();
        window.manualCaptcha = () => checkButtonState();

        // ============================================================================
        // 9. SUPABASE: OTP AND SIGNUP
        // ============================================================================
        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('sendOtpBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            const { error } = await supabaseClient.auth.signInWithOtp({ email: email });
            if (error) { alert(error.message); btn.innerHTML = "Send OTP"; return; }

            document.getElementById('otpGroup').classList.remove('hide');
            otpSeconds = 60;
            otpTimer = setInterval(() => {
                otpSeconds--;
                document.getElementById('otpTimer').innerText = `Code expires in ${otpSeconds}s`;
                if (otpSeconds <= 0) clearInterval(otpTimer);
            }, 1000);
        }

        async function verifyOTPAndSignup() {
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const password = document.getElementById('password').value;
            const name = localStorage.getItem('signup_name') || 'User';

            try {
                // 1. Verify OTP
                const { data, error } = await supabaseClient.auth.verifyOtp({ email, token: otp, type: 'email' });
                if (error) throw error;

                // 2. Set Password
                await supabaseClient.auth.updateUser({ password });

                // 3. Save all biometric data to Supabase 'profiles' table
                await supabaseClient.from('profiles').insert([{
                    id: data.user.id,
                    email: email,
                    full_name: name,
                    selfie_url: selfieData, // The base64 image
                    face_descriptor: faceDescriptor, // The 128-float array for matching
                    fingerprint_id: 'registered_webauthn', // Save the WebAuthn rawId here
                    status: 'verified'
                }]);

                // 4. Redirect to Index
                window.location.href = 'index.html'; 
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            applyLanguage(currentLang);
            buildLangList();
        });
    </script>
