<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> 
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f5132">
<title>Autrobook</title> 
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style> 
:root{
  --bg:#ffffff; --card:#f8f9fa; --text:#212529; --text2:#6c757d; --border:#dee2e6; --brand:#0f5132; --brand-light:#198754; --error:#dc3545; --success:#198754;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0a0f0a; --card:#121a12; --text:#e9ecef; --text2:#adb5bd; --border:#1f2a1f; --brand:#0f5132; --brand-light:#198754; }
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial,sans-serif} 
body{background:var(--bg);min-height:100vh;color:var(--text)} 
.lang-select{text-align:center;margin:8px 0 20px}
.lang-select select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.top{padding:16px} 
.back{width:40px;height:40px;background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid var(--border)} 
.logo{text-align:center;margin-bottom:20px} 
.logo-img{width:75px;height:75px;border-radius:20px;object-fit:cover;box-shadow:0 4px 15px rgba(15,81,50,0.3)} 
.wrap{padding:0 20px 40px;max-width:480px;margin:0 auto} 
h2{font-size:20px;margin-bottom:4px;font-weight:700;text-align:center} 
p.sub{color:var(--text2);font-size:13px;margin-bottom:20px;line-height:1.5;text-align:center} 
label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;font-weight:600}
input, select{width:100%;padding:14px 15px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:15px;margin-bottom:15px;outline:none}
input::placeholder{color:var(--text2)} 
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.1)} 
.name-row{display:flex;gap:10px}
.name-row input{width:50%}
.pass-wrap{position:relative} 
.eye{position:absolute;right:15px;top:14px;cursor:pointer;font-size:18px;color:var(--text2)} 
.camera-box{border:2px dashed var(--brand-light);border-radius:14px;padding:16px;text-align:center;margin-bottom:16px;background:var(--card)}
.camera-box video{width:100%;border-radius:10px;display:none;margin-bottom:10px;max-height:250px}
.camera-box img{width:90px;height:90px;border-radius:50%;object-fit:cover;margin:8px auto;display:none;border:3px solid var(--brand-light)}
.camera-btn{padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-weight:700;cursor:pointer;width:100%;font-size:15px}
.btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px} 
.btn:disabled{opacity:.5;background:#555;cursor:not-allowed} 
.btn-outline{width:100%;padding:14px;border:1.5px solid var(--brand-light);border-radius:14px;background:transparent;color:var(--brand-light);font-size:15px;font-weight:700;cursor:pointer;margin-top:14px} 
.msg{text-align:center;font-size:13px;min-height:20px;margin-top:10px;font-weight:500} 
.msg.error{color:var(--error)}.msg.success{color:var(--success)} 
.footer{text-align:center;margin-top:20px;color:var(--text2);font-size:14px;font-weight:600} 
.g-recaptcha{margin:16px 0;display:flex;justify-content:center; transform:scale(0.92);}
</style> 
</head> 
<body> 
<div class="top"><div class="back" onclick="location.href='/'">←</div></div> 

<div class="lang-select">
<select id="langSelect" onchange="changeLanguage()">
  <option value="en">English (US)</option>
  <option value="bn">বাংলা</option>
  <option value="hi">हिन्दी</option>
  <option value="ar">العربية</option>
  <option value="es">Español</option>
  <option value="fr">Français</option>
  <option value="id">Bahasa Indonesia</option>
  <option value="tr">Türkçe</option>
</select>
</div>

<div class="logo"><img src="/logo.png" alt="Autrobook" class="logo-img" onerror="this.style.display='none'"></div> 
<div class="wrap"> 
<h2 data-key="title">Create Autrobook Account</h2> 
<p class="sub" data-key="subtitle">It's quick and easy.</p> 

<label data-key="fullname">Full Name</label>
<div class="name-row">
<input type="text" id="firstName" data-placeholder="firstname">
<input type="text" id="surname" data-placeholder="surname">
</div>

<label data-key="dob">Date of Birth</label>
<input type="date" id="dob">

<label data-key="email">Email</label>
<input type="email" id="email" data-placeholder="email" autocomplete="email"> 

<label data-key="password">New Password</label>
<div class="pass-wrap"> 
<input type="password" id="password" data-placeholder="password" autocomplete="new-password"> 
<span class="eye" onclick="togglePass()">👁️</span> 
</div>

<label data-key="face">Face Verification</label>
<div class="camera-box">
<video id="video" autoplay playsinline></video>
<img id="photo" />
<button class="camera-btn" id="cameraBtn" onclick="startCamera()" data-key="cameraBtn">📷 Take Live Selfie</button>
</div>

<div class="g-recaptcha" data-sitekey="6LfzSBwuAAAAAK4XcwjLp9vNWxGECgLc2YcNdwD5" data-callback="enableBtn" data-expired-callback="disableBtn"></div>

<div class="msg" id="msg"></div> 
<button class="btn" id="nextBtn" onclick="goNext()" disabled data-key="signup">Sign Up</button> 
<button class="btn-outline" onclick="location.href='/login.html'" data-key="login">Already have an account?</button> 
<div class="footer">Autrobook</div> 
</div> 

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; 
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; 
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { 
apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI", 
authDomain: "autrobook-ad3d5.firebaseapp.com", 
projectId: "autrobook-ad3d5", 
storageBucket: "autrobook-ad3d5.firebasestorage.app", 
messagingSenderId: "554222945815", 
appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52", 
measurementId: "G-Z8QM0NVR6W" 
}; 

const app = initializeApp(firebaseConfig); 
const auth = getAuth(app); 
const db = getFirestore(app);

let selfieData = "";
let stream = null;
let currentLang = localStorage.getItem('lang') || 'en';

const translations = {
  en: {
    title: "Create Autrobook Account", subtitle: "It's quick and easy.", fullname: "Full Name",
    firstname: "First name", surname: "Surname", dob: "Date of Birth", email: "Enter your email",
    password: "Min 6 characters", face: "Face Verification", cameraBtn: "📷 Take Live Selfie",
    signup: "Sign Up", login: "Already have an account?",
    err1: "Enter First Name", err2: "Enter Surname", err3: "Select Date of Birth", err4: "Enter your email",
    err5: "Enter a valid email", err6: "Password min 6 characters", err7: "Please take a selfie",
    err8: "Please verify reCAPTCHA", success: "✅ Account Created! Redirecting to Login...",
    exist: "This email already exists", cameraErr: "Camera permission denied. Enable from App Settings"
  },
  bn: {
    title: "Autrobook অ্যাকাউন্ট তৈরি করুন", subtitle: "এটা দ্রুত এবং সহজ।", fullname: "পুরো নাম",
    firstname: "নামের প্রথম অংশ", surname: "নামের শেষ অংশ", dob: "জন্ম তারিখ", email: "আপনার ইমেইল দিন",
    password: "কমপক্ষে ৬ অক্ষর", face: "ফেস ভেরিফিকেশন", cameraBtn: "📷 লাইভ সেলফি তুলুন",
    signup: "সাইন আপ", login: "ইতিমধ্যে অ্যাকাউন্ট আছে?",
    err1: "নামের প্রথম অংশ দিন", err2: "নামের শেষ অংশ দিন", err3: "জন্ম তারিখ সিলেক্ট করুন", err4: "ইমেইল দিন",
    err5: "সঠিক ইমেইল দিন", err6: "পাসওয়ার্ড কমপক্ষে ৬ অক্ষর", err7: "সেলফি তুলুন",
    err8: "reCAPTCHA ভেরিফাই করুন", success: "✅ অ্যাকাউন্ট তৈরি হয়েছে! লগইনে যাচ্ছে...",
    exist: "এই ইমেইলটি আগে থেকেই আছে", cameraErr: "ক্যামেরা পারমিশন নেই। App Settings থেকে চালু করুন"
  },
  hi: {
    title: "Autrobook खाता बनाएं", subtitle: "यह तेज़ और आसान है।", fullname: "पूरा नाम",
    firstname: "पहला नाम", surname: "उपनाम", dob: "जन्म तिथि", email: "अपना ईमेल दर्ज करें",
    password: "कम से कम 6 अक्षर", face: "फेस वेरिफिकेशन", cameraBtn: "📷 लाइव सेल्फी लें",
    signup: "साइन अप", login: "पहले से खाता है?"
  },
  ar: {
    title: "إنشاء حساب Autrobook", subtitle: "الأمر سريع وسهل.", fullname: "الاسم الكامل",
    firstname: "الاسم الأول", surname: "اسم العائلة", dob: "تاريخ الميلاد", email: "أدخل بريدك الإلكتروني",
    password: "6 أحرف على الأقل", face: "التحقق من الوجه", cameraBtn: "📷 التقط صورة سيلفي",
    signup: "إنشاء حساب", login: "هل لديك حساب بالفعل؟"
  },
  es: {
    title: "Crear cuenta Autrobook", subtitle: "Es rápido y fácil.", fullname: "Nombre completo",
    firstname: "Nombre", surname: "Apellido", dob: "Fecha de nacimiento", email: "Ingresa tu correo",
    password: "Mínimo 6 caracteres", face: "Verificación facial", cameraBtn: "📷 Tomar selfie",
    signup: "Registrarse", login: "¿Ya tienes una cuenta?"
  }
};

function applyLanguage(lang){
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang] && translations[lang][key]){
      el.innerText = translations[lang][key];
    }
  });
  
  document.querySelectorAll('[data-placeholder]').forEach(el => {
    const key = el.getAttribute('data-placeholder');
    if(translations[lang] && translations[lang][key]){
      el.placeholder = translations[lang][key];
    }
  });
}

window.changeLanguage = () => {
  const lang = document.getElementById('langSelect').value;
  applyLanguage(lang);
}

// Load saved language
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langSelect').value = currentLang;
  applyLanguage(currentLang);
});

window.enableBtn = () => { document.getElementById('nextBtn').disabled = false; }
window.disableBtn = () => { document.getElementById('nextBtn').disabled = true; }

function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;} 
function togglePass(){ const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password'; } 

window.startCamera = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('cameraBtn').innerText = translations[currentLang].cameraBtn.replace('📷', '📸') + ' Capture';
    document.getElementById('cameraBtn').onclick = capturePhoto;
  }catch(e){ showMsg(translations[currentLang].cameraErr,'error'); }
}

function capturePhoto(){
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('photo').src = selfieData;
  document.getElementById('photo').style.display = 'block';
  video.style.display = 'none';
  if(stream){ stream.getTracks().forEach(track => track.stop()); }
  document.getElementById('cameraBtn').innerText = '🔄 Retake';
  document.getElementById('cameraBtn').onclick = startCamera;
  showMsg('Success','success');
}

window.goNext = async () => { 
const t = translations[currentLang];
const fn=document.getElementById('firstName').value.trim();
const sn=document.getElementById('surname').value.trim();
const dob=document.getElementById('dob').value;
const email=document.getElementById('email').value.trim().toLowerCase(); 
const pass=document.getElementById('password').value; 
const captcha = grecaptcha.getResponse();

if(!fn) return showMsg(t.err1,'error'); 
if(!sn) return showMsg(t.err2,'error'); 
if(!dob) return showMsg(t.err3,'error'); 
if(!email) return showMsg(t.err4,'error'); 
if(!email.includes('@')) return showMsg(t.err5,'error'); 
if(!pass || pass.length<6) return showMsg(t.err6,'error'); 
if(!selfieData) return showMsg(t.err7,'error');
if(captcha.length == 0) return showMsg(t.err8,'error');

const btn=document.getElementById('nextBtn'); btn.disabled=true; btn.textContent='...';

try{ 
const userCred = await createUserWithEmailAndPassword(auth, email, pass); 
await setDoc(doc(db, "users", userCred.user.uid), {
  firstName: fn, surname: sn, dob: dob, email: email, selfie: selfieData, lang: currentLang, createdAt: new Date()
});
showMsg(t.success,'success'); 
setTimeout(()=>location.href='/login.html',1500);
} catch(error){ 
if(error.code == 'auth/email-already-in-use'){ showMsg(t.exist, 'error'); }
else{ showMsg(error.message, 'error'); } 
} 
btn.disabled=false; btn.textContent=t.signup;
} 
</script> 
</body> 
</html>
