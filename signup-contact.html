<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> 
<title>Autrobook - Sign Up</title> 
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style> 
:root{ --brand:#0f5132; --brand-light:#198754; --bg:#1c1c1e; --card:#2c2c2e; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif} 
body{background:var(--bg);min-height:100vh;color:white} 
.top{padding:15px} 
.back{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer} 
.lang-select{text-align:center;margin:5px 0 25px}
.lang-select select{padding:8px 12px;border-radius:10px;border:1px solid #555;background:var(--card);color:white;font-size:15px;font-weight:bold;cursor:pointer}
.logo{text-align:center;margin-bottom:30px} 
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--brand);box-shadow:0 4px 15px rgba(15,81,50,0.4)} 
.wrap{padding:0 20px 40px;max-width:450px;margin:0 auto} 
h2{font-size:22px;margin-bottom:6px} 
p.sub{color:#aaa;font-size:14px;margin-bottom:25px} 
label{font-size:14px;color:#aaa;margin-bottom:6px;display:block}
input{width:100%;padding:16px;border-radius:15px;border:1px solid #555;background:transparent;color:white;font-size:16px;margin-bottom:15px;outline:none}
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.2)} 
.pass-wrap{position:relative} 
.eye{position:absolute;right:18px;top:16px;cursor:pointer;font-size:18px} 
.camera-box{border:2px dashed var(--brand-light);border-radius:15px;padding:15px;text-align:center;margin-bottom:15px;background:var(--card)}
.camera-box video{width:100%;border-radius:10px;display:none;margin-bottom:10px}
.camera-box img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:10px auto;display:none;border:2px solid var(--brand-light)}
.camera-btn{padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-weight:bold;cursor:pointer;width:100%}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px} 
.btn:disabled{opacity:.6;background:#555} 
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px} 
.msg.error{color:#ff8a8a}.msg.success{color:#8affa0} 
.progress{display:flex;gap:6px;max-width:450px;margin:0 auto 25px;padding:0 20px} 
.progress div{flex:1;height:5px;border-radius:10px;background:#333} 
.progress div.active{background:var(--brand-light)} 
.g-recaptcha{margin:15px 0;display:flex;justify-content:center}
</style> 
</head> 
<body> 
<div class="top"><div class="back" onclick="location.href='/signup-name.html'">←</div></div> 

<div class="lang-select">
<select id="langSelect" onchange="changeLanguage()">
  <option value="en">English (US)</option>
  <option value="bn">বাংলা</option>
</select>
</div>

<div class="logo"><img src="logo.png" alt="Autrobook"></div> 
<div class="progress"><div class="active"></div><div class="active"></div><div></div></div> 
<div class="wrap"> 
<h2 data-key="title">Create Account</h2> 
<p class="sub" data-key="subtitle">Fill in your details to continue</p> 

<label data-key="dob">Date of Birth</label>
<input type="date" id="dob">

<label data-key="email">Email</label>
<input type="email" id="email" data-placeholder="email"> 

<label data-key="password">Password</label>
<div class="pass-wrap"> 
<input type="password" id="password" data-placeholder="password"> 
<span class="eye" onclick="togglePass()">👁️</span> 
</div>

<label data-key="face">Face Verification</label>
<div class="camera-box">
<video id="video" autoplay playsinline></video>
<img id="photo" />
<button class="camera-btn" id="cameraBtn" onclick="startCamera()" data-key="cameraBtn">📷 Take Live Selfie</button>
</div>

<div class="g-recaptcha" data-sitekey="6LfzSBwuAAAAAK4XcwjLp9vNWxGECgLc2YcNdwD5" data-callback="enableBtn" data-expired-callback="disableBtn"></div>

<div class="msg" id="msg"></div> 
<button class="btn" id="nextBtn" onclick="goNext()" disabled data-key="signup">Sign Up</button> 
</div> 

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; 
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; 
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { 
apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI", 
authDomain: "autrobook-ad3d5.firebaseapp.com", 
projectId: "autrobook-ad3d5", 
storageBucket: "autrobook-ad3d5.firebasestorage.app", 
messagingSenderId: "554222945815", 
appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52", 
measurementId: "G-Z8QM0NVR6W" 
}; 

const app = initializeApp(firebaseConfig); 
const auth = getAuth(app); 
const db = getFirestore(app);

let selfieData = ""; let stream = null;
let currentLang = localStorage.getItem('lang') || 'en';
const translations = {
  en: {
    title: "Create Account", subtitle: "Fill in your details to continue", dob: "Date of Birth",
    email: "Email", password: "Password", face: "Face Verification", cameraBtn: "📷 Take Live Selfie",
    signup: "Sign Up", err1: "Select Date of Birth", err2: "Enter your email", err3: "Enter a valid email",
    err4: "Password min 6 characters", err5: "Please take a selfie", err6: "Please verify reCAPTCHA",
    success: "✅ Account Created! Redirecting...", exist: "This email already exists"
  }
};
function applyLanguage(lang){
  currentLang = lang; localStorage.setItem('lang', lang);
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang] && translations[lang][key]){ el.innerText = translations[lang][key]; }
  });
}
window.changeLanguage = () => { applyLanguage(document.getElementById('langSelect').value); }
document.addEventListener('DOMContentLoaded', () => { applyLanguage(currentLang); });

window.enableBtn = () => { document.getElementById('nextBtn').disabled = false; }
window.disableBtn = () => { document.getElementById('nextBtn').disabled = true; }
function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;} 
function togglePass(){ const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password'; } 

window.startCamera = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    const video = document.getElementById('video');
    video.srcObject = stream; video.style.display = 'block';
    document.getElementById('cameraBtn').innerText = '📸 Capture Photo';
    document.getElementById('cameraBtn').onclick = capturePhoto;
  }catch(e){ showMsg('Camera permission denied','error'); }
}
function capturePhoto(){
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('photo').src = selfieData;
  document.getElementById('photo').style.display = 'block';
  video.style.display = 'none';
  if(stream){ stream.getTracks().forEach(track => track.stop()); }
  document.getElementById('cameraBtn').innerText = '🔄 Retake';
  document.getElementById('cameraBtn').onclick = startCamera;
  showMsg('Selfie captured!','success');
}

window.goNext = async () => { 
  const t = translations[currentLang];
  const fn = localStorage.getItem('signup_firstName');
  const sn = localStorage.getItem('signup_surname');
  const dob = document.getElementById('dob').value;
  const email = document.getElementById('email').value.trim().toLowerCase(); 
  const pass = document.getElementById('password').value; 
  const captcha = grecaptcha.getResponse();

  if(!dob) return showMsg(t.err1,'error'); 
  if(!email) return showMsg(t.err2,'error'); 
  if(!email.includes('@')) return showMsg(t.err3,'error'); 
  if(!pass || pass.length<6) return showMsg(t.err4,'error'); 
  if(!selfieData) return showMsg(t.err5,'error');
  if(captcha.length == 0) return showMsg(t.err6,'error');

  const btn=document.getElementById('nextBtn'); btn.disabled=true; btn.textContent='Creating...';
  try{ 
    const userCred = await createUserWithEmailAndPassword(auth, email, pass); 
    await setDoc(doc(db, "users", userCred.user.uid), {
      firstName: fn, surname: sn, dob: dob, email: email, selfie: selfieData, lang: currentLang, createdAt: new Date()
    });
    showMsg(t.success,'success'); 
    setTimeout(()=>location.href='/login.html',1500);
  } catch(error){ 
    if(error.code == 'auth/email-already-in-use'){ showMsg(t.exist, 'error'); }
    else{ showMsg(error.message, 'error'); } 
  } 
  btn.disabled=false; btn.textContent=t.signup;
} 
</script> 
</body> 
</html>
