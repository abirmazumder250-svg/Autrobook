<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Contact</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#1c1c1e;min-height:100vh;color:white}
.top{padding:15px}
.back{width:40px;height:40px;background:#2c2c2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.lang{text-align:center;color:#999;margin:5px 0 25px;font-size:15px}
.logo{text-align:center;margin-bottom:40px}
.logo-circle{width:80px;height:80px;background:#0f5132;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:42px;font-weight:bold;color:white}
.wrap{padding:0 20px 30px;max-width:450px;margin:0 auto}
h2{font-size:22px;margin-bottom:6px}
p.sub{color:#aaa;font-size:14px;margin-bottom:25px;line-height:1.5}
input{width:100%;padding:18px 20px;border-radius:18px;border:1px solid #555;background:transparent;color:white;font-size:17px;margin-bottom:15px;outline:none}
input::placeholder{color:#aaa}
input:focus{border-color:#1877f2}
.pass-wrap{position:relative}
.eye{position:absolute;right:18px;top:18px;cursor:pointer;font-size:18px;color:#aaa}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:#1877f2;color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:5px}
.btn:disabled{opacity:.6}
.btn-outline{width:100%;padding:15px;border:1px solid #1877f2;border-radius:30px;background:transparent;color:#4a9cff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:80px}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px}
.msg.error{color:#ff8a8a}.msg.success{color:#8affa0}
.info{text-align:center;color:#999;font-size:14px;margin-top:20px;line-height:1.6}
.footer{text-align:center;margin-top:20px;color:#ccc;font-size:16px}
</style>
</head>
<body>

<div class="top"><div class="back" onclick="location.href='/signup-name.html'">←</div></div>
<div class="lang">English (US) ∨</div>
<div class="logo"><div class="logo-circle">A</div></div>

<div class="wrap">
<h2>What's your email?</h2>
<p class="sub">Enter the email where you can be contacted. You'll use this to log in and recover your account.</p>

<input type="email" id="email" placeholder="Mobile number or email" autocomplete="email">

<h2 style="margin-top:5px">Create password</h2>
<p class="sub">Use at least 6 characters. Don't use your name or email.</p>

<div class="pass-wrap">
<input type="password" id="password" placeholder="Password" autocomplete="new-password">
<span class="eye" onclick="togglePass()">👁️</span>
</div>

<div class="msg" id="msg"></div>

<button class="btn" id="nextBtn" onclick="goNext()">Next</button>

<div class="info" id="showName"></div>

<button class="btn-outline" onclick="location.href='/login.html'">Already have an account?</button>
<div class="footer">∞ Autrobook</div>
</div>

<script>
const fn = localStorage.getItem('signup_firstName') || '';
const sn = localStorage.getItem('signup_surname') || '';
if(fn || sn){
  document.getElementById('showName').textContent = 'Hi ' + fn + ' ' + sn + ' — Next step is Fingerprint + Face Verification';
}
const savedEmail = localStorage.getItem('signup_email');
const savedPass = localStorage.getItem('signup_password');
if(savedEmail) document.getElementById('email').value = savedEmail;
if(savedPass) document.getElementById('password').value = savedPass;

function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;}

function togglePass(){
  const p=document.getElementById('password');
  p.type = p.type==='password' ? 'text' : 'password';
}

async function goNext(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('password').value;

  if(!fn || !sn){
    showMsg('Please complete the Name step first.','error');
    setTimeout(()=>location.href='/signup-name.html',800);
    return;
  }
  if(!email) return showMsg('Enter your email','error');
  if(!email.includes('@') || !email.includes('.')) return showMsg('Enter a valid email','error');
  if(!pass) return showMsg('Enter a password','error');
  if(pass.length<6) return showMsg('Password must be at least 6 characters','error');
  if(pass.toLowerCase().includes(fn.toLowerCase()) && fn.length>2) return showMsg("Don't use your name in your password",'error');

  const btn=document.getElementById('nextBtn');
  btn.disabled=true; btn.textContent='Checking...';

  localStorage.setItem('signup_email', email);
  localStorage.setItem('signup_password', pass);
  showMsg('Saved! Going to verification...','success');
  setTimeout(()=>location.href='/varify-profile.html',500);
}
</script>
</body>
</html>
