<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign Up — Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<!-- Google reCAPTCHA SDK -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  /* ===== SYSTEM DEFAULT THEME ===== */
  :root {
    --primary: #1b5e20;
    --primary-hover: #144817;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #65676b;
    --border: #e4e6e9;
    --input-bg: #fafafa;
    --error: #c62828;
    --success: #2e7d32;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg: #0f1419;
      --card: #1a1f26;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2a3038;
      --input-bg: #0f1419;
      --error: #ef5350;
      --success: #66bb6a;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  body {
    background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; position: relative;
  }

  /* ===== TOP NAVIGATION ===== */
  .top-bar {
    width: 100%; max-width: 480px; padding: 16px 20px; display: flex;
    justify-content: space-between; align-items: center;
  }

  .back-btn {
    width: 40px; height: 40px; background: var(--card); border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 18px; color: var(--text);
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--border);
    transition: background 0.2s; flex-shrink: 0;
  }
  .back-btn:hover { background: var(--border); }

  /* ===== LANGUAGE SELECTOR ===== */
  .lang-wrapper {
    position: relative; display: inline-flex; align-items: center; background: var(--card);
    border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: background 0.2s;
  }
  .lang-wrapper:hover { background: var(--border); }
  .lang-wrapper i.fa-globe { font-size: 14px; color: var(--muted); margin-right: 8px; }
  .lang-wrapper select {
    appearance: none; -webkit-appearance: none; background: transparent; border: none;
    color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; outline: none;
    padding-right: 20px; font-family: inherit;
  }
  .lang-wrapper i.fa-chevron-down { position: absolute; right: 14px; font-size: 10px; color: var(--muted); pointer-events: none; }

  /* ===== PROGRESS BAR ===== */
  .progress-container { width: 100%; max-width: 440px; padding: 0 20px; display: flex; gap: 6px; margin-bottom: 24px; }
  .progress-step { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .progress-step.active { background: var(--primary); }

  /* ===== HEADER ===== */
  .header { text-align: center; margin-bottom: 24px; padding: 0 20px; }
  .logo { width: 72px; height: 72px; border-radius: 20px; object-fit: contain; background: var(--card); padding: 8px; box-shadow: 0 4px 16px rgba(27, 94, 32, 0.15); margin-bottom: 16px; }
  h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  p.subtitle { font-size: 14px; color: var(--muted); line-height: 1.5; }

  /* ===== FORM ===== */
  .form-wrap { width: 100%; max-width: 440px; padding: 0 20px 40px; }
  .form-group { margin-bottom: 18px; position: relative; }
  label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }

  input {
    width: 100%; padding: 15px 16px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 15px; outline: none; transition: all 0.2s;
  }
  input:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.15); }
  input::placeholder { color: var(--muted); opacity: 0.7; }

  .eye-icon { position: absolute; right: 16px; top: 38px; cursor: pointer; color: var(--muted); font-size: 16px; }
  .strength-msg { font-size: 12px; font-weight: 600; margin-top: 6px; margin-bottom: -10px; }

  /* ===== VERIFICATION BOX (Camera + Fingerprint) ===== */
  .verify-box { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; background: var(--input-bg); margin-bottom: 18px; }
  .verify-box video { width: 100%; border-radius: 10px; display: none; margin-bottom: 10px; }
  .verify-box img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: none; border: 3px solid var(--primary); }
  
  .verify-options { display: flex; gap: 10px; margin-bottom: 12px; }
  
  .verify-btn {
    flex: 1; padding: 12px; border: none; border-radius: 10px; background: var(--primary);
    color: white; font-weight: 600; cursor: pointer; transition: background 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .verify-btn:hover { background: var(--primary-hover); }
  .verify-btn.fp-btn { background: var(--card); color: var(--primary); border: 2px solid var(--primary); }
  .verify-btn.fp-btn:hover { background: var(--primary); color: white; }
  .verify-btn.verified { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
  
  .divider-text { font-size: 12px; color: var(--muted); font-weight: 600; margin: 10px 0; text-transform: uppercase; }

  /* reCAPTCHA */
  .captcha-container { display: flex; justify-content: center; margin-bottom: 16px; background: var(--card); padding: 4px; border-radius: 10px; }
  .checkbox-row { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin: 10px 0 20px; }
  .checkbox-row input { width: auto; margin: 0; accent-color: var(--primary); }

  /* ===== BUTTON ===== */
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px; background: var(--primary);
    color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s; box-shadow: 0 4px 14px rgba(27, 94, 32, 0.3);
  }
  .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27, 94, 32, 0.4); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn:disabled { background: #9e9e9e; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ===== ERROR / SUCCESS ===== */
  .msg { text-align: center; font-size: 13px; font-weight: 500; min-height: 20px; margin-bottom: 10px; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }

  .footer-text { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--muted); }
  .footer-text a { color: var(--primary); font-weight: 700; text-decoration: none; }
  .footer-text a:hover { text-decoration: underline; }

  .step { display: none; }

  /* ===== MODERN 6-DIGIT OTP BOX ===== */
  .otp-container { display: flex; justify-content: space-between; gap: 8px; margin: 20px 0; }
  .otp-digit {
    width: 48px; height: 55px; text-align: center; font-size: 24px; font-weight: 700;
    border-radius: 12px; border: 1.5px solid var(--border); background: var(--input-bg);
    color: var(--text); outline: none;
  }
  .otp-digit:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.15); }

  @media (max-width: 480px) {
    .form-wrap { padding: 0 16px 30px; }
    .otp-digit { width: 42px; height: 50px; font-size: 20px; }
    .verify-options { flex-direction: column; }
  }
</style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-bar">
    <div class="back-btn" onclick="location.href='signup-name.html'">
      <i class="fas fa-arrow-left"></i>
    </div>
    <div class="lang-wrapper">
      <i class="fas fa-globe"></i>
      <select id="langSelect" onchange="changeLanguage()">
        <option value="en">English (US)</option>
        <option value="bd">বাংলা</option>
        <option value="in">हिन्दी</option>
        <option value="sa">العربية</option>
      </select>
      <i class="fas fa-chevron-down"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <img src="logo.png" alt="Autrobook Logo" class="logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-leaf\' style=\'font-size:40px;color:var(--primary);\'></i>';">
    <h2 data-key="title">Secure Your Account</h2>
    <p class="subtitle" data-key="subtitle">Enter your details and verify your identity</p>
  </div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress-step active"></div>
    <div class="progress-step active"></div>
    <div class="progress-step active"></div>
  </div>

  <div class="form-wrap">
    <!-- STEP 1: DETAILS & SECURITY -->
    <div id="stepDetails" class="step" style="display:block">
      <p id="namePreview" style="color:var(--primary);font-size:14px;font-weight:700;margin-bottom:16px;"></p>

      <div class="form-group">
        <label data-key="dob">Date of Birth</label>
        <input type="date" id="dob">
      </div>

      <div class="form-group">
        <label data-key="email">Email Address</label>
        <input type="email" id="email" data-placeholder="emailPlaceholder" autocomplete="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label data-key="password">Password</label>
        <input type="password" id="password" data-placeholder="passPlaceholder" autocomplete="new-password" placeholder="Create a strong password" oninput="checkStrength()">
        <i class="fas fa-eye eye-icon" onclick="togglePass()"></i>
        <div class="strength-msg" id="strengthText"></div>
      </div>

      <!-- Verification: Selfie OR Fingerprint -->
      <label data-key="verifyTitle">Security Verification (Choose One)</label>
      <div class="verify-box">
        <video id="video" autoplay playsinline></video>
        <img id="photo" />
        
        <div class="verify-options">
          <button type="button" class="verify-btn" id="cameraBtn" onclick="startCamera()">
            <i class="fas fa-camera"></i> <span data-key="cameraBtn">Live Selfie</span>
          </button>
          
          <button type="button" class="verify-btn fp-btn" id="fpBtn" onclick="verifyFingerprint()">
            <i class="fas fa-fingerprint"></i> <span data-key="fpBtn">Fingerprint</span>
          </button>
        </div>

        <div id="verifyStatus" style="font-size:12.5px;color:var(--muted);font-weight:500;margin-top:8px;">
          <span data-key="verifyNote">Verify using either your camera or fingerprint sensor.</span>
        </div>
      </div>

      <!-- reCAPTCHA -->
      <div class="captcha-container">
        <div class="g-recaptcha" data-sitekey="6Leifx0uAAAAAP0vZ1H6sH9T7UfUH8lpyhWakTze" data-callback="enableBtn" data-expired-callback="disableBtn"></div>
      </div>
      <p style="font-size:12px;color:var(--muted);text-align:center;" data-key="captchaNote">If reCAPTCHA doesn't load, verify below</p>
      <div class="checkbox-row">
        <input type="checkbox" id="humanCheck" onchange="manualCaptcha()"> 
        <span data-key="human">I'm not a robot - Manual verification</span>
      </div>

      <div class="msg" id="msgDetails"></div>
      <button type="button" class="btn" id="nextBtn" onclick="triggerEmailVerification()" disabled data-key="signup">Complete Sign Up</button>
      
      <p class="footer-text">
        <span data-key="haveAcc">Already have an account?</span> 
        <a href="login.html" data-key="loginLink">Log in</a>
      </p>
    </div>

    <!-- STEP 2: EMAIL OTP -->
    <div id="stepOTP" class="step">
      <h2 style="text-align:center;margin-bottom:8px;">Verify Your Email</h2>
      <p style="font-size:13.5px;color:var(--muted);text-align:center;margin-bottom:20px;">
        Enter the 6-digit OTP sent to <br><span id="sentEmailTarget" style="color:var(--primary);font-weight:700;"></span>
      </p>
      
      <div class="otp-container" id="otpContainer">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" id="otp1" oninput="moveToNext(this, 'otp2')" onkeydown="moveToPrev(event, this, null)">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" id="otp2" oninput="moveToNext(this, 'otp3')" onkeydown="moveToPrev(event, this, 'otp1')">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" id="otp3" oninput="moveToNext(this, 'otp4')" onkeydown="moveToPrev(event, this, 'otp2')">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" id="otp4" oninput="moveToNext(this, 'otp5')" onkeydown="moveToPrev(event, this, 'otp3')">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" id="otp5" oninput="moveToNext(this, 'otp6')" onkeydown="moveToPrev(event, this, 'otp4')">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" id="otp6" oninput="moveToNext(this, null)" onkeydown="moveToPrev(event, this, 'otp5')">
      </div>

      <button class="btn" id="verifyOtpBtn" onclick="verifyEmailOTP()">Verify & Create Account</button>
      <button class="btn" id="resendBtn" onclick="resendEmailOTP()" style="background:var(--card);color:var(--text);border:1px solid var(--border);margin-top:10px;box-shadow:none;" disabled>Resend OTP (60s)</button>
      
      <div class="msg" id="msgOTP"></div>
    </div>
  </div>

  <script>
    // ===== SUPABASE CONFIG =====
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selfieData = ""; 
    let fingerprintVerified = false;
    let stream = null;
    let currentLang = localStorage.getItem('lang') || 'en';
    let resendTimer = null;

    // ===== TRANSLATIONS =====
    const translations = {
      en: { 
        title: "Secure Your Account", subtitle: "Enter your details and verify your identity", 
        dob: "Date of Birth", email: "Email Address", emailPlaceholder: "Enter your email", 
        password: "Password", passPlaceholder: "Create a strong password", 
        verifyTitle: "Security Verification (Choose One)",
        cameraBtn: "Live Selfie", fpBtn: "Fingerprint", 
        verifyNote: "Verify using either your camera or fingerprint sensor.",
        captchaNote: "If reCAPTCHA doesn't load, verify below", 
        human: "I'm not a robot - Manual verification", 
        signup: "Complete Sign Up", haveAcc: "Already have an account?", loginLink: "Log in",
        err1: "Please select your date of birth", errAge: "You must be at least 13 years old", 
        err2: "Please enter your email address", err3: "Please enter a valid email address", 
        err4: "Password must be at least 6 characters", err5: "Please verify your identity (Selfie or Fingerprint)", 
        err6: "Please verify you are not a robot", success: "✅ Account Created Successfully! Redirecting...", 
        weak: "Weak password (Add numbers/symbols)", medium: "Medium strength password", strong: "Strong password ✅" 
      },
      bd: { 
        title: "আপনার অ্যাকাউন্ট সুরক্ষিত করুন", subtitle: "আপনার তথ্য দিন এবং পরিচয় যাচাই করুন", 
        dob: "জন্ম তারিখ", email: "ইমেইল ঠিকানা", emailPlaceholder: "আপনার ইমেইল লিখুন", 
        password: "পাসওয়ার্ড", passPlaceholder: "একটি শক্তিশালী পাসওয়ার্ড তৈরি করুন", 
        verifyTitle: "নিরাপত্তা যাচাই (একটি বেছে নিন)",
        cameraBtn: "লাইভ সেলফি", fpBtn: "ফিঙ্গারপ্রিন্ট", 
        verifyNote: "আপনার ক্যামেরা বা ফিঙ্গারপ্রিন্ট সেন্সর ব্যবহার করে যাচাই করুন।",
        captchaNote: "যদি reCAPTCHA লোড না হয়, নিচে যাচাই করুন", 
        human: "আমি রোবট নই - ম্যানুয়াল যাচাই", 
        signup: "সাইন আপ সম্পূর্ণ করুন", haveAcc: "ইতিমধ্যে একটি অ্যাকাউন্ট আছে?", loginLink: "লগ ইন করুন",
        err1: "আপনার জন্ম তারিখ নির্বাচন করুন", errAge: "আপনার বয়স কমপক্ষে ১৩ বছর হতে হবে", 
        err2: "আপনার ইমেইল ঠিকানা লিখুন", err3: "সঠিক ইমেইল ঠিকানা লিখুন", 
        err4: "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে", err5: "অনুগ্রহ করে আপনার পরিচয় যাচাই করুন (সেলফি বা ফিঙ্গারপ্রিন্ট)", 
        err6: "আপনি রোবট নন তা যাচাই করুন", success: "✅ অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে! রিডাইরেক্ট করা হচ্ছে...", 
        weak: "দুর্বল পাসওয়ার্ড", medium: "মাঝারি পাসওয়ার্ড", strong: "শক্তিশালী পাসওয়ার্ড ✅" 
      }
    };

    function t(key) { return (translations[currentLang] && translations[currentLang][key]) || translations['en'][key]; }

    // ===== INITIALIZATION =====
    document.addEventListener('DOMContentLoaded', () => {
      const selectEl = document.getElementById('langSelect');
      if ([...selectEl.options].some(o => o.value === currentLang)) selectEl.value = currentLang;
      applyLanguage(currentLang);

      if(localStorage.getItem('signup_email')) document.getElementById('email').value = localStorage.getItem('signup_email');

      // OTP Auto-Paste
      const otpInputs = document.querySelectorAll('.otp-digit');
      otpInputs.forEach((input, index) => {
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
          pasteData.split('').forEach((char, i) => {
            if (otpInputs[i]) otpInputs[i].value = char;
          });
          if (pasteData.length > 0) {
            const focusIndex = Math.min(pasteData.length, 5);
            otpInputs[focusIndex].focus();
          }
        });
      });
    });

    function applyLanguage(lang){
      currentLang = lang; localStorage.setItem('lang', lang);
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if(t(key)) el.innerText = t(key);
      });
      document.querySelectorAll('[data-placeholder]').forEach(el => {
        const key = el.getAttribute('data-placeholder');
        if(t(key)) el.placeholder = t(key);
      });

      let fullName = localStorage.getItem('signup_name') || '';
      if(fullName) document.getElementById('namePreview').innerText = '👤 ' + fullName + ' (' + lang.toUpperCase() + ')';
    }

    window.changeLanguage = () => { applyLanguage(document.getElementById('langSelect').value); }

    // ===== CAPTCHA & BUTTONS =====
    window.enableBtn = () => { document.getElementById('nextBtn').disabled = false; }
    window.disableBtn = () => { if(!document.getElementById('humanCheck').checked) document.getElementById('nextBtn').disabled = true; }
    window.manualCaptcha = () => { document.getElementById('nextBtn').disabled = !document.getElementById('humanCheck').checked; }
    window.togglePass = () => { const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password'; }

    window.checkStrength = () => {
      const v = document.getElementById('password').value;
      const el = document.getElementById('strengthText');
      if(!v){ el.innerText=''; return; }
      if(v.length < 6) { el.innerText = '❌ ' + t('err4'); el.style.color = 'var(--error)'; }
      else if(v.length < 10) { el.innerText = '🟡 ' + t('medium'); el.style.color = '#f9a825'; }
      else { el.innerText = '🟢 ' + t('strong'); el.style.color = 'var(--success)'; }
    }

    // ===== CAMERA (SELFIE) =====
    window.startCamera = async () => {
      try{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
        const video = document.getElementById('video');
        video.srcObject = stream; video.style.display = 'block';
        document.getElementById('cameraBtn').innerHTML = '<i class="fas fa-camera"></i> Capture';
        document.getElementById('cameraBtn').onclick = capturePhoto;
      }catch(e){ showMsg('msgDetails', 'Camera permission denied', 'error'); }
    }

    window.capturePhoto = () => {
      const video = document.getElementById('video');
      if(!video.videoWidth) return showMsg('msgDetails', 'Wait for camera to load...', 'error');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      selfieData = canvas.toDataURL('image/jpeg', 0.8);
      
      document.getElementById('photo').src = selfieData;
      document.getElementById('photo').style.display = 'block';
      video.style.display = 'none';
      if(stream){ stream.getTracks().forEach(track => track.stop()); }
      
      document.getElementById('cameraBtn').innerHTML = '<i class="fas fa-sync"></i> Retake';
      document.getElementById('cameraBtn').onclick = window.startCamera;
      showMsg('msgDetails', 'Selfie captured successfully!', 'success');
    }

    window.verifyFingerprint = async () => {
      const btn = document.getElementById('fpBtn');
      const statusEl = document.getElementById('verifyStatus');

      if (!window.PublicKeyCredential) {
        showMsg('msgDetails', 'Device does not support fingerprint', 'error');
        return;
      }

      try {
        statusEl.innerText = "Scanning fingerprint...";
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        // Try to register/get a credential
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge,
            rp: { name: "Autrobook", id: window.location.hostname },
            user: {
              id: new TextEncoder().encode(document.getElementById('email').value || "user"),
              name: document.getElementById('email').value || "user@autrobook.com",
              displayName: "Autrobook User"
            },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
          }
        });

        if (credential) {
          // Real WebAuthn Credential Created!
          fingerprintVerified = true;
          btn.classList.add('verified');
          btn.innerHTML = '<i class="fas fa-check-circle"></i> Verified';
          statusEl.innerText = "✅ Fingerprint registered & verified!";
          statusEl.style.color = "var(--success)";
          showMsg('msgDetails', 'Fingerprint verified successfully!', 'success');
        }
      } catch (err) {
        console.error("Biometric Error:", err);
        fingerprintVerified = false;
        statusEl.innerText = "❌ Verification failed or cancelled.";
        statusEl.style.color = "var(--error)";
        showMsg('msgDetails', 'Fingerprint verification failed.', 'error');
      }
    };
