<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Messages — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Messages CSS Link -->
  <link rel="stylesheet" href="css/messages.css">
</head>
<body>

  <!-- ==================== CHAT LIST VIEW ==================== -->
  <div id="chatListView" class="view active">
    <!-- TOP NAV -->
    <header class="top-nav">
      <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
      <h2>Messages</h2>
      <div class="nav-actions">
        <button class="icon-btn" onclick="alert('New chat feature opened')"><i class="fas fa-edit"></i></button>
      </div>
    </header>

    <div class="messages-container">
      <!-- SEARCH -->
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="chatSearchInput" placeholder="Search messages..." oninput="filterChats()">
      </div>

      <!-- CHAT LIST -->
      <div class="chat-list" id="chatListContainer">
        <!-- Populated via JS -->
      </div>
    </div>
  </div>

  <!-- ==================== ACTIVE CHAT VIEW ==================== -->
  <div id="chatWindowView" class="view">
    <!-- CHAT HEADER -->
    <header class="chat-header">
      <button class="icon-btn" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
      <img id="activeChatAvatar" src="" alt="User" class="chat-avatar">
      <div class="chat-header-info">
        <h3 id="activeChatName">Name</h3>
        <p id="activeChatStatus">Active now</p>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" onclick="alert('Voice Call started')"><i class="fas fa-phone"></i></button>
        <button class="icon-btn" onclick="openModal('mChatSettings')"><i class="fas fa-cog"></i></button>
      </div>
    </header>

    <!-- MESSAGES AREA -->
    <div class="message-area" id="messageArea">
      <!-- Messages dynamically injected here -->
    </div>

    <!-- AI SMART REPLY SUGGESTION -->
    <div class="ai-suggestions" id="aiSuggestions">
      <button onclick="useAISuggestion('Sure, let\'s do it!')">Sure, let's do it!</button>
      <button onclick="useAISuggestion('I will call you later.')">I will call you later.</button>
    </div>

    <!-- INPUT AREA -->
    <div class="chat-input-area">
      <button class="icon-btn"><i class="fas fa-plus-circle" style="color:var(--primary);"></i></button>
      <div class="input-wrapper">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
        <i class="fas fa-smile input-icon" onclick="alert('Emoji picker')"></i>
      </div>
      <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bn-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i></div>
    <div class="bn-item" onclick="window.location.href='friends.html'"><i class="fas fa-user-friends"></i></div>
    <div class="bn-item" onclick="window.location.href='groups.html'"><i class="fas fa-users"></i></div>
    <div class="bn-item active"><i class="fas fa-comment-dots"></i></div>
    <div class="bn-item" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i></div>
  </nav>

  <!-- ==================== CHAT SETTINGS MODAL (EXCLUSIVE) ==================== -->
  <div class="modal-back" id="mChatSettings">
    <div class="modal">
      <h3>Chat Settings (Exclusive) <i class="fas fa-times" onclick="closeModal('mChatSettings')"></i></h3>
      
      <div class="setting-row" onclick="toggleExclusive(this, 'Ghost Typing')">
        <div class="setting-info">
          <h4>Ghost Typing</h4>
          <p>Hide "typing..." indicator</p>
        </div>
        <div class="toggle-switch"><div class="toggle-knob"></div></div>
      </div>

      <div class="setting-row" onclick="toggleExclusive(this, 'Secret Chat')">
        <div class="setting-info">
          <h4>Secret Chat (E2E)</h4>
          <p>End-to-end encrypted</p>
        </div>
        <div class="toggle-switch"><div class="toggle-knob"></div></div>
      </div>

      <div class="setting-row" onclick="toggleExclusive(this, 'Auto-Translate')">
        <div class="setting-info">
          <h4>Auto-Translate</h4>
          <p>Translate incoming messages</p>
        </div>
        <div class="toggle-switch"><div class="toggle-knob"></div></div>
      </div>

      <div class="setting-row" onclick="toggleExclusive(this, 'AI Smart Reply')">
        <div class="setting-info">
          <h4>AI Smart Reply</h4>
          <p>Show AI suggested replies</p>
        </div>
        <div class="toggle-switch active"><div class="toggle-knob"></div></div>
      </div>

      <button class="btn btn-primary" style="margin-top:16px;" onclick="closeModal('mChatSettings')">Save Settings</button>
    </div>
  </div>

  <!-- Main JS Link -->
  <script src="js/messages.js"></script>
</body>
</html>
