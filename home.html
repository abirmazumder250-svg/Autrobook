<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Home</title>
<style>
body{margin:0; background:#0a1a0f; color:#e4e6eb; font-family:Arial;}
.header{padding:15px; background:#13261a; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0;}
.logo{width:40px; height:40px; border-radius:10px;}
h2{color:#4caf50; margin:0; font-size:18px;}
.btn-post{padding:10px 20px; background:#2e7d32; color:white; border:none; border-radius:20px; font-weight:bold;}
.feed{padding:20px;}
.post-box{background:#13261a; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #1f3d2a;}
.post-box textarea{width:100%; background:transparent; border:none; color:#e4e6eb; font-size:15px; outline:none; resize:none;}
</style>
</head>
<body>

<div class="header">
<img src="logo.png" class="logo">
<h2>Autrobook</h2>
<button onclick="window.location.href='index.html'" style="background:transparent; color:#81c784; border:1px solid #2e7d32; padding:8px 15px; border-radius:20px;">Logout</button>
</div>

<div class="feed">
<div class="post-box">
<textarea rows="3" placeholder="What's on your mind?"></textarea>
<button class="btn-post" style="margin-top:10px;">Post</button>
</div>

<div class="post-box">
<b>Welcome Post</b>
<p>This is your Autrobook Home. Post system coming soon 🔥</p>
</div>
</div>

</body>
</html>
