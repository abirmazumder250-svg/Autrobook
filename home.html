<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--bg:#000;--card-bg:#18191a;--header-bg:#18191a;--text:#e4e6eb;--text-secondary:#b0b3b8;--border:#2f2f2f;--brand:#4caf50;--blue:#1877f2;--input-bg:#3a3b3c;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg);color:var(--text);padding-bottom:60px;}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 15px;background:var(--header-bg);position:sticky;top:0;z-index:10;}
.logo{font-size:26px;font-weight:bold;color:var(--brand);}
.header-icons{display:flex;gap:15px;font-size:22px;}
.tabs{display:flex;justify-content:space-around;background:var(--header-bg);border-bottom:1px solid var(--border);}
.tabs div{padding:12px;flex:1;text-align:center;cursor:pointer;font-size:15px;}
.tabs div.active{border-bottom:3px solid var(--brand);color:var(--brand);}
.searchBar{display:none;padding:10px;background:var(--card-bg);}
.searchBar input{width:100%;padding:10px;border-radius:20px;border:none;background:var(--input-bg);color:var(--text);outline:none;}
.stories{display:flex;gap:10px;padding:10px;overflow-x:auto;background:var(--card-bg);}
.story{width:110px;height:180px;background:#333;border-radius:12px;position:relative;flex-shrink:0;border:2px solid var(--brand);cursor:pointer;overflow:hidden;}
.story img{width:100%;height:100%;object-fit:cover;}
.story-add{width:110px;height:180px;background:var(--card-bg);border-radius:12px;position:relative;flex-shrink:0;border:2px dashed var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.story-add .plus{width:40px;height:40px;background:var(--brand);border-radius:50%;text-align:center;line-height:40px;font-size:24px;margin-bottom:8px;}
.story-name{position:absolute;bottom:5px;left:5px;font-size:12px;font-weight:bold;color:white;text-shadow:0 0 5px black;}
.post-create{display:flex;gap:10px;padding:12px;background:var(--card-bg);margin:10px;border-radius:12px;align-items:center;}
.post-create img{width:40px;height:40px;border-radius:50%;cursor:pointer;object-fit:cover;}
.post-create input{flex:1;background:var(--input-bg);border:none;padding:10px;border-radius:20px;color:var(--text);}
.post-create button{background:var(--brand);border:none;color:white;width:35px;height:35px;border-radius:50%;cursor:pointer;font-size:18px;}
.post{background:var(--card-bg);margin:10px 0;padding:12px;}
.post-user{display:flex;align-items:center;gap:10px;cursor:pointer;}
.post-user img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
.followBtn{background:var(--brand);color:#fff;border:none;padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;margin-left:auto;}
.post-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);padding:5px 0;border-bottom:1px solid var(--border);}
.post-actions{display:flex;justify-content:space-around;padding-top:8px;position:relative;}
.post-actions button{background:none;border:none;color:var(--text-secondary);padding:8px;flex:1;cursor:pointer;border-radius:8px;position:relative;}
.post-actions button.active{color:var(--brand);}
.react-box{display:none;position:absolute;bottom:45px;left:50%;transform:translateX(-50%);background:var(--card-bg);padding:10px 12px;border-radius:40px;box-shadow:0 4px 20px rgba(0,0,0,0.8);gap:12px;border:1px solid var(--border);z-index:100;}
.react-box span{font-size:32px;cursor:pointer;display:inline-block;}
.react-box span:hover{transform:scale(1.4);}
.comment-section{display:none;padding-top:10px;border-top:1px solid var(--border);}
.comment{display:flex;gap:8px;margin:10px 0;}
.comment img{width:32px;height:32px;border-radius:50%;object-fit:cover;}
.comment-box{flex:1;background:var(--input-bg);padding:8px 12px;border-radius:18px;font-size:14px;}
.comment-input{display:flex;gap:8px;margin-top:10px;}
.comment-input input{flex:1;background:var(--input-bg);border:none;padding:10px;border-radius:20px;color:var(--text);outline:none;}
.comment-input button{background:var(--brand);border:none;color:white;padding:8px 15px;border-radius:20px;cursor:pointer;}
.tag{color:var(--brand);cursor:pointer;font-weight:bold;}
.reels-container{height:100vh;background:black;overflow-y:scroll;scroll-snap-type:y mandatory;}
.feed-container{display:none;}
.reel{height:100vh;width:100%;position:relative;scroll-snap-align:start;background:black;}
.reel-video{width:100%;height:100%;object-fit:cover;}
.reel-user{position:absolute;bottom:140px;left:15px;display:flex;align-items:center;gap:10px;}
.reel-user img{width:40px;height:40px;border-radius:50%;border:2px solid white;object-fit:cover;}
.reel-user b{font-size:15px;color:white;}
.reel-desc{position:absolute;bottom:110px;left:15px;color:white;font-size:14px;}
.reel-stats{position:absolute;bottom:80px;left:15px;font-size:13px;color:white;display:flex;gap:15px;}
.reel-actions{position:absolute;right:15px;bottom:140px;display:flex;flex-direction:column;gap:20px;align-items:center;}
.reel-btn{display:flex;flex-direction:column;align-items:center;color:white;font-size:12px;cursor:pointer;}
.reel-btn span{font-size:32px;}
.reel-btn.active span{color:var(--brand);}
.reel-react-box{display:none;position:absolute;bottom:80px;right:10px;background:var(--card-bg);padding:10px 12px;border-radius:40px;gap:12px;z-index:10;}
.reel-react-box span{font-size:32px;cursor:pointer;}
.reel-comment-box{display:none;position:absolute;bottom:0;left:0;right:0;background:#18191a;padding:12px;max-height:50%;overflow-y:auto;z-index:20;border-radius:15px 15px 0 0;}
.reel-upload-btn{position:fixed;bottom:80px;right:20px;width:55px;height:55px;background:var(--brand);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;z-index:50;}
.bottom-nav{position:fixed;bottom:0;width:100%;background:#18191a;display:flex;justify-content:space-around;padding:6px 0 10px;border-top:1px solid #2f2f2f;z-index:99;}
.nav-item{position:relative;text-align:center;font-size:26px;color:#b0b3b8;cursor:pointer;flex:1;}
.nav-item.active{color:#fff;}
.nav-item img.profile-pic{width:28px;height:28px;border-radius:50%;border:2px solid #b0b3b8;object-fit:cover;}
.badge{position:absolute;top:0;right:30%;background:#ff3b30;color:white;font-size:11px;font-weight:700;border-radius:12px;padding:1px 5px;min-width:18px;text-align:center;border:2px solid #18191a;}
.badge.blue{background:#1877f2;}
.story-viewer{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;justify-content:center;align-items:center;flex-direction:column;}
.story-viewer img{max-width:100%;max-height:90%;border-radius:12px;}
.story-close{position:absolute;top:20px;right:20px;font-size:40px;color:white;cursor:pointer;z-index:1001;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:2000;justify-content:center;align-items:flex-start;padding-top:60px;}
.modalBox{background:#18191a;width:92%;max-width:420px;border-radius:14px;padding:16px;max-height:80vh;overflow-y:auto;}
.modalBox input,.modalBox textarea{width:100%;padding:10px;border-radius:8px;border:none;background:#3a3b3c;color:#fff;margin-bottom:10px;}
.modalBox button{background:var(--brand);border:none;color:#fff;padding:10px;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;margin-top:6px;}
.groupCard{background:#242526;padding:12px;border-radius:10px;margin-bottom:10px;}
</style>
</head>
<body>
<audio id="reactSound" src="https://cdn.freesound.org/previews/456/456588_9498993-lq.mp3"></audio>
<input type="file" id="reelInput" accept="video/*" style="display:none" onchange="uploadReel(event)">
<input type="file" id="storyInput" accept="image/*" style="display:none" onchange="uploadStory(event)">
<input type="file" id="postImgInput" accept="image/*" style="display:none">

<div class="header"><div class="logo">Autrobook</div><div class="header-icons"><span onclick="document.getElementById('storyInput').click()">+</span><span onclick="toggleSearch()">🔍</span><span onclick="window.location.href='main-settings.html'">⚙️</span></div></div>
<div class="searchBar" id="searchBar"><input id="searchInput" placeholder="Search posts, #hashtag, people..." oninput="doSearch(this.value)"></div>

<div class="tabs"><div class="active" onclick="showTab('reels')">🎬 Reels</div><div onclick="showTab('feed')">Home</div><div onclick="showTab('watch')">📺 Watch</div><div onclick="showTab('groups')">👥 Groups</div></div>

<div class="reels-container" id="reels"></div>
<div class="reel-upload-btn" onclick="document.getElementById('reelInput').click()">+</div>

<div class="feed-container" id="feed">
<div class="stories" id="storiesList"></div>
<div class="post-create"><img src="https://i.pravatar.cc/40?img=99" onclick="goProfile(currentUser.id)"><input type="text" id="caption" placeholder="What's on your mind? Use #tag" onkeypress="if(event.key=='Enter') createPost()"><button onclick="document.getElementById('postImgInput').click()">📷</button><button onclick="createPost()">✈️</button></div>
<div id="posts"></div>
</div>

<div class="feed-container" id="watchTab"><div style="padding:15px"><h3>📺 Watch - Only Videos</h3><p style="color:#aaa;font-size:13px">All Reels in one place</p></div><div id="watchList"></div></div>
<div class="feed-container" id="groupsTab"><div style="padding:15px"><h3>👥 Groups</h3><button onclick="openModal('groupModal')" style="background:#4caf50;border:none;color:#fff;padding:10px;border-radius:8px;width:100%;margin-top:10px">+ Create Group</button></div><div id="groupsList" style="padding:0 15px"></div></div>

<div class="story-viewer" id="storyViewer"><span class="story-close" onclick="closeStory()">×</span><img id="storyImg" src=""><div id="storyActions" style="margin-top:10px"></div></div>

<div class="modal" id="notiModal"><div class="modalBox"><h3>🔔 Notifications</h3><div id="notiList"></div><button onclick="closeModal('notiModal');clearNoti()">Mark All Read</button><button onclick="closeModal('notiModal')" style="background:#555">Close</button></div></div>
<div class="modal" id="groupModal"><div class="modalBox"><h3>Create Group</h3><input id="groupName" placeholder="Group Name"><textarea id="groupDesc" placeholder="Group Description"></textarea><button onclick="createGroup()">Create Group</button><button onclick="closeModal('groupModal')" style="background:#555">Cancel</button></div></div>
<div class="modal" id="groupPostModal"><div class="modalBox"><h3 id="groupPostTitle">Post in Group</h3><textarea id="groupPostText" placeholder="Write in group..."></textarea><button onclick="submitGroupPost()">Post</button><button onclick="closeModal('groupPostModal')" style="background:#555">Cancel</button></div></div>

<div class="bottom-nav">
<div class="nav-item active" onclick="showTab('reels')">🎬<span class="badge" id="reelBadge">5</span></div>
<div class="nav-item" onclick="showTab('feed')">🏠</div>
<div class="nav-item" onclick="showTab('groups')">👥</div>
<div class="nav-item" onclick="showTab('watch')">⭕</div>
<div class="nav-item" onclick="openNotifications()">🔔<span class="badge blue" id="notiBadge"></span></div>
<div class="nav-item" onclick="goProfile(currentUser.id)"><img src="https://i.pravatar.cc/28?img=99" class="profile-pic"></div>
</div>

<script>
// ===== CONFIGS =====
const firebaseConfig={apiKey:"AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI",authDomain:"autrobook-ad3d5.firebaseapp.com",projectId:"autrobook-ad3d5",storageBucket:"autrobook-ad3d5.firebasestorage.app",messagingSenderId:"554222945815",appId:"1:554222945815:web:0ba445f3f6ee6de6f1fe52",measurementId:"G-Z8QM0NVR6W"};
const CLOUD_NAME="zvaunhmb"; const CLOUD_API_KEY="533846653664189"; const UPLOAD_PRESET="Autrobook";
const JSONBIN_ID="6af3632bffd5d16053b77ed3"; const JSONBIN_KEY="PASTE_YOUR_JSONBIN_MASTER_KEY_HERE";
firebase.initializeApp(firebaseConfig); const db=firebase.firestore(); const auth=firebase.auth();

const REACTIONS={like:'👍',love:'❤️',haha:'😆',wow:'😮',sad:'😢',angry:'😠'};
if(!localStorage.getItem('autrobook_user')){ window.location.href='login.html'; }
let currentUser=JSON.parse(localStorage.getItem('autrobook_user'))||{name:"You",img:99,id:99,profilePic:""};
let myUid='guest'; let posts=[]; let stories=[]; let reels=[]; let groups=[]; let searchQuery=''; let followingList=JSON.parse(localStorage.getItem('following')||'[]');
let savedReels=JSON.parse(localStorage.getItem('saved_reels')||'[]');
let demoUsers=[{id:1,name:"Rahim Khan",img:1,profilePic:"",text:"Today is a beautiful day ☀️ #nature",reactions:{},comments:[]},{id:2,name:"Sadia Afrin",img:2,profilePic:"",text:"Love this new feature! #autrobook",reactions:{},comments:[]},{id:3,name:"Nayeem Hasan",img:3,profilePic:"",text:"Who wants to go for a trip? #travel",reactions:{},comments:[]}];
const defaultReels=[{id:'r1',name:"Rahim Khan",userId:1,img:1,views:12500,video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",desc:"4K Nature Video 🌿 #nature",reactions:{},comments:[]},{id:'r2',name:"Sadia Afrin",userId:2,img:2,views:45800,video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",desc:"Travel Vlog ✈️ #travel",reactions:{},comments:[]}];

// SAFETY
const BAD_WORDS=["sex","fuck","nude","porn","xxx","bitch","asshole"]; const RELIGION_WORDS=["allah","god","jesus","muhammad","quran","bible","hindu","muslim","christian","islam","church","mosque","temple","mock","insult","blasphemy","fake god","stupid religion"];
function hasBad(t){return BAD_WORDS.some(w=>t.toLowerCase().includes(w))} function hasReligion(t){return RELIGION_WORDS.some(w=>t.toLowerCase().includes(w))}
async function addStrike(reason,isReligion=false){ let ref=db.collection("users").doc(myUid); let snap=await ref.get(); let u=snap.exists?snap.data():{strikes:0}; u.strikes=(u.strikes||0)+1; u.name=currentUser.name; if(isReligion){u.restrictedUntil=Date.now()+90*24*60*60*1000; alert("AI: Religion Mock! 3 Months Restricted.");} else if(u.strikes>=4){u.disabled=true; alert("AI: 4 Strikes! ID Disabled.");} else if(u.strikes==3){u.restrictedUntil=Date.now()+90*24*60*60*1000; alert("Strike 3/4 - 3 Months");} else if(u.strikes==2){u.restrictedUntil=Date.now()+7*24*60*60*1000; alert("Strike 2/4 - 7 Days");} else alert("Strike 1/4 - Warning!"); await ref.set(u); location.reload(); }
async function syncToJsonBin(){ if(JSONBIN_KEY.includes("PASTE")) return; try{ await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":JSONBIN_KEY},body:JSON.stringify({posts,reels,lastSync:Date.now()})}); }catch(e){} }
async function uploadToCloudinary(file){ let fd=new FormData(); fd.append("file",file); fd.append("upload_preset",UPLOAD_PRESET); fd.append("api_key",CLOUD_API_KEY); let res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:"POST",body:fd}); let d=await res.json(); if(d.moderation && d.moderation[0].status=='rejected'){ await addStrike("AI: Nude/Violence"); return ''; } return d.secure_url; }
async function sendNoti(toUid,msg){ if(!toUid || toUid==myUid) return; await db.collection("notifications").add({toUserId:toUid,from:currentUser.name,msg,time:Date.now(),read:false}); }

function formatNum(n){ if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=1000) return (n/1000).toFixed(1)+'K'; return n; }
function goProfile(id){ window.location.href=`profile.html?id=${id}`; }
function playSound(){ let a=document.getElementById('reactSound'); a.currentTime=0; a.play().catch(()=>{}); }
function linkHashtags(t){ return t.replace(/#(\w+)/g,'<span class="tag" onclick="filterTag(\'$1\')">#$1</span>'); }
function filterTag(tag){ document.getElementById('searchInput').value='#'+tag; document.getElementById('searchBar').style.display='block'; doSearch('#'+tag); showTab('feed'); }
function toggleSearch(){ let b=document.getElementById('searchBar'); b.style.display=b.style.display=='block'?'none':'block'; }
function doSearch(q){ searchQuery=q.toLowerCase(); renderPosts(); renderReelsList(); }
function openModal(id){ document.getElementById(id).style.display='flex'; } function closeModal(id){ document.getElementById(id).style.display='none'; }
function followUser(uid,name,btn){ if(followingList.includes(uid)){ followingList=followingList.filter(x=>x!==uid); } else { followingList.push(uid); sendNoti(uid, currentUser.name+" started following you"); } localStorage.setItem('following',JSON.stringify(followingList)); renderPosts(); }

// POSTS - FIXED
function loadPosts(){ db.collection("posts").orderBy("time","desc").onSnapshot(snap=>{ posts=[]; snap.forEach(doc=>posts.push({fid:doc.id,...doc.data()})); renderPosts(); }); }
function renderPosts(){
  let all=[...posts,...demoUsers];
  if(searchQuery) all=all.filter(p=>(p.text||'').toLowerCase().includes(searchQuery) || (p.name||'').toLowerCase().includes(searchQuery));
  let html='';
  all.forEach((u,i)=>{
    let postId=u.fid || 'demo'+i; let isDemo=!u.fid;
    let reactionIcons=Object.values(u.reactions||{}).slice(0,3).map(r=>REACTIONS[r]).join('');
    let userReact=(u.reactions||{})[currentUser.name];
    let profileImg=u.profilePic||`https://i.pravatar.cc/40?img=${u.img||99}`;
    let isFollowing=followingList.includes(u.userId);
    html+=`<div class="post"><div class="post-user" onclick="goProfile('${u.userId||u.id||99}')"><img src="${profileImg}"><div><b>${u.name}</b><div style="font-size:12px;color:var(--text-secondary)">${u.time?new Date(u.time).toLocaleString():'1h ago'}</div></div>${u.userId && u.userId!=myUid?`<button class="followBtn" onclick="event.stopPropagation();followUser('${u.userId}','${u.name}')">${isFollowing?'Unfollow':'Follow'}</button>`:''}</div><p style="margin:10px 0;">${linkHashtags(u.text||'')}</p>${u.imgUrl?`<img src="${u.imgUrl}" style="width:100%;border-radius:10px;margin:8px 0">`:''}<div class="post-stats"><div>${reactionIcons} ${Object.keys(u.reactions||{}).length}</div><span>${(u.comments||[]).length} Comments • ${u.shares||0} Shares</span></div><div class="post-actions"><button class="${userReact?'active':''}" onclick="toggleReactBox('react-${postId}')">${userReact?REACTIONS[userReact]:'👍'} Like<div class="react-box" id="react-${postId}">${Object.keys(REACTIONS).map(k=>`<span onclick="event.stopPropagation();likePost('${postId}','${k}',${isDemo})">${REACTIONS[k]}</span>`).join('')}</div></button><button onclick="toggleCommentBox('${postId}')">💬 Comment</button><button onclick="sharePost('${postId}',${isDemo})">↗️ Share</button></div><div class="comment-section" id="comment-${postId}">${(u.comments||[]).map(c=>`<div class="comment"><img src="${c.profilePic||`https://i.pravatar.cc/32?img=99`}"><div class="comment-box"><b>${c.name}</b><br>${c.text}</div></div>`).join('')}<div class="comment-input"><input type="text" placeholder="Write a comment..." id="input-${postId}" onkeypress="if(event.key=='Enter') addComment('${postId}',${isDemo})"><button onclick="addComment('${postId}',${isDemo})">Send</button></div></div></div>`;
  });
  document.getElementById('posts').innerHTML=html||"<p style='padding:20px;text-align:center;color:#aaa'>No posts found</p>";
}
function toggleReactBox(id){ let el=document.getElementById(id); el.style.display=el.style.display=='flex'?'none':'flex'; }
function toggleCommentBox(postId){ let el=document.getElementById('comment-'+postId); el.style.display=el.style.display=='block'?'none':'block'; }
async function createPost(){
  let txt=document.getElementById('caption').value; if(!txt) return;
  if(hasReligion(txt)) return await addStrike("Religion Mock",true); if(hasBad(txt)) return await addStrike("Bad Word");
  let imgUrl=''; let file=document.getElementById('postImgInput').files[0]; if(file){ imgUrl=await uploadToCloudinary(file); if(!imgUrl) return; }
  await db.collection("posts").add({userId:myUid,name:currentUser.name,img:currentUser.img,profilePic:currentUser.profilePic||'',text:txt,imgUrl,reactions:{},comments:[],shares:0,time:Date.now()});
  document.getElementById('caption').value=''; document.getElementById('postImgInput').value=''; syncToJsonBin();
}
async function likePost(id,reaction,isDemo){
  playSound();
  if(isDemo){ let idx=parseInt(id.replace('demo','')); let p=demoUsers[idx]; p.reactions=p.reactions||{}; if(p.reactions[currentUser.name]==reaction) delete p.reactions[currentUser.name]; else p.reactions[currentUser.name]=reaction; renderPosts(); return; }
  let ref=db.collection("posts").doc(id); let d=(await ref.get()).data(); let reacts=d.reactions||{}; if(reacts[currentUser.name]==reaction) delete reacts[currentUser.name]; else { reacts[currentUser.name]=reaction; sendNoti(d.userId, currentUser.name+" reacted "+REACTIONS[reaction]+" on your post"); } await ref.update({reactions:reacts});
}
async function addComment(id,isDemo){
  let val=document.getElementById(`input-${id}`).value; if(!val) return;
  if(hasReligion(val)) return await addStrike("Religion Mock",true); if(hasBad(val)) return await addComment; if(hasBad(val)) return await addStrike("Bad Word");
  if(isDemo){ let idx=parseInt(id.replace('demo','')); demoUsers[idx].comments.push({name:currentUser.name,text:val}); renderPosts(); return; }
  let ref=db.collection("posts").doc(id); let d=(await ref.get()).data(); let comments=d.comments||[]; comments.push({name:currentUser.name,text:val,profilePic:currentUser.profilePic||''}); await ref.update({comments}); sendNoti(d.userId, currentUser.name+" commented on your post: "+val);
}
async function sharePost(id,isDemo){
  let url=location.href.split('#')[0]+'#post-'+id; navigator.clipboard.writeText(url);
  if(!isDemo){ let ref=db.collection("posts").doc(id); let d=(await ref.get()).data(); await ref.update({shares:(d.shares||0)+1}); }
  alert("Link copied! Share count updated ✅");
}

// REELS - FIXED
let reelObserver=null;
function loadReels(){ db.collection("reels").orderBy("time","desc").onSnapshot(snap=>{ let fb=[]; snap.forEach(doc=>fb.push({fid:doc.id,...doc.data()})); reels=fb.length>0?fb:defaultReels; renderReelsList(); renderWatch(); }); }
function renderReelsList(){
  let list=reels; if(searchQuery) list=list.filter(r=>(r.desc||'').toLowerCase().includes(searchQuery)||(r.name||'').toLowerCase().includes(searchQuery));
  let html='';
  list.forEach((r,i)=>{
    let rid=r.fid||r.id; let isDemo=!r.fid; let userReact=(r.reactions||{})[currentUser.name];
    let reactionIcons=Object.values(r.reactions||{}).slice(0,3).map(x=>REACTIONS[x]).join('');
    let profileImg=r.profilePic||`https://i.pravatar.cc/40?img=${r.img||99}`;
    let isSaved=savedReels.includes(rid);
    html+=`<div class="reel"><video class="reel-video" src="${r.video}" loop playsinline muted></video><div class="reel-user" onclick="goProfile('${r.userId}')"><img src="${profileImg}"><b>${r.name}</b></div><div class="reel-desc">${linkHashtags(r.desc||'')}</div><div class="reel-stats"><span>${reactionIcons} ${formatNum(Object.keys(r.reactions||{}).length)}</span><span>👁️ ${formatNum(r.views||0)}</span><span>💬 ${formatNum(r.comments?.length||0)}</span></div><div class="reel-actions"><div class="reel-btn ${userReact?'active':''}" onclick="toggleReelReact('reelReact-${rid}')"><span>${userReact?REACTIONS[userReact]:'❤️'}</span><div>Like</div></div><div class="reel-btn" onclick="toggleReelComments('${rid}',${isDemo})"><span>💬</span><div>${formatNum(r.comments?.length||0)}</div></div><div class="reel-btn" onclick="downloadVideo('${r.video}')"><span>⬇️</span><div>4K</div></div><div class="reel-btn ${isSaved?'active':''}" onclick="toggleSaveReel('${rid}')"><span>${isSaved?'🔖':'📌'}</span><div>Save</div></div></div><div class="reel-react-box" id="reelReact-${rid}">${Object.keys(REACTIONS).map(k=>`<span onclick="likeReel('${rid}','${k}',${isDemo})">${REACTIONS[k]}</span>`).join('')}</div><div class="reel-comment-box" id="reelComment-${rid}"><h4>Comments</h4><div id="reelCommentList-${rid}">${(r.comments||[]).map(c=>`<p style="margin:8px 0"><b>${c.name}:</b> ${c.text}</p>`).join('')||'<p style="color:#aaa">No comments yet</p>'}</div><div style="display:flex;gap:6px;margin-top:10px"><input id="reelInput-${rid}" placeholder="Write comment..." style="flex:1;padding:8px;border-radius:20px;border:none;background:#3a3b3c;color:#fff"><button onclick="addReelComment('${rid}',${isDemo})" style="background:#4caf50;border:none;color:#fff;padding:8px 12px;border-radius:20px">Send</button></div><button onclick="toggleReelComments('${rid}',${isDemo})" style="background:#555;border:none;color:#fff;padding:8px;border-radius:8px;width:100%;margin-top:8px">Close</button></div></div>`;
  });
  document.getElementById('reels').innerHTML=html; setupReelObserver();
}
function toggleReelReact(id){ let el=document.getElementById(id); el.style.display=el.style.display=='flex'?'none':'flex'; }
function toggleReelComments(rid,isDemo){ let el=document.getElementById('reelComment-'+rid); el.style.display=el.style.display=='block'?'none':'block'; }
async function likeReel(id,reaction,isDemo){
  playSound();
  if(isDemo){ let r=reels.find(x=>x.id==id); r.reactions=r.reactions||{}; if(r.reactions[currentUser.name]==reaction) delete r.reactions[currentUser.name]; else r.reactions[currentUser.name]=reaction; renderReelsList(); return; }
  let ref=db.collection("reels").doc(id); let d=(await ref.get()).data(); let reacts=d.reactions||{}; if(reacts[currentUser.name]==reaction) delete reacts[currentUser.name]; else { reacts[currentUser.name]=reaction; sendNoti(d.userId, currentUser.name+" reacted on your reel"); } await ref.update({reactions:reacts});
}
async function addReelComment(id,isDemo){
  let val=document.getElementById('reelInput-'+id).value; if(!val) return;
  if(hasReligion(val)) return await addStrike("Religion Mock",true); if(hasBad(val)) return await addStrike("Bad Word");
  if(isDemo){ let r=reels.find(x=>x.id==id); r.comments=r.comments||[]; r.comments.push({name:currentUser.name,text:val}); renderReelsList(); return; }
  let ref=db.collection("reels").doc(id); let d=(await ref.get()).data(); let comments=d.comments||[]; comments.push({name:currentUser.name,text:val}); await ref.update({comments}); sendNoti(d.userId, currentUser.name+" commented on your reel");
}
function setupReelObserver(){
  if(reelObserver) reelObserver.disconnect();
  reelObserver=new IntersectionObserver((entries)=>{ entries.forEach(e=>{ if(e.isIntersecting){ e.target.play().catch(()=>{}); e.target.muted=false; } else e.target.pause(); }); },{threshold:0.6});
  document.querySelectorAll('.reel-video').forEach(v=>reelObserver.observe(v));
}
function downloadVideo(url){ let a=document.createElement('a'); a.href=url; a.download='Autrobook_4K_Reel.mp4'; a.target='_blank'; a.click(); alert('4K Download Started ✅'); }
async function uploadReel(event){ let file=event.target.files[0]; if(!file) return; alert("Uploading Reel..."); let url=await uploadToCloudinary(file); if(!url) return; await db.collection("reels").add({name:currentUser.name,userId:myUid,img:currentUser.img,profilePic:currentUser.profilePic||'',views:0,video:url,desc:"My 4K Reel 🎥 #autrobook",reactions:{},comments:[],time:Date.now()}); syncToJsonBin(); alert("4K Reel Uploaded ✅"); }
function toggleSaveReel(id){ if(savedReels.includes(id)) savedReels=savedReels.filter(x=>x!=id); else { savedReels.push(id); alert('Saved 🔖'); } localStorage.setItem('saved_reels',JSON.stringify(savedReels)); renderReelsList(); }
function renderWatch(){ document.getElementById('watchList').innerHTML=reels.map(r=>`<div style="margin:10px;background:#18191a;border-radius:10px;overflow:hidden"><video src="${r.video}" style="width:100%;height:220px;object-fit:cover" controls muted></video><div style="padding:10px"><b>${r.name}</b><p>${r.desc}</p><span>👁️ ${formatNum(r.views||0)} • ❤️ ${Object.keys(r.reactions||{}).length}</span></div></div>`).join(''); }

// STORIES - FIXED + 24H AUTO DELETE
function loadStories(){ db.collection("stories").orderBy("time","desc").onSnapshot(snap=>{ stories=[]; snap.forEach(doc=>{ let s={fid:doc.id,...doc.data()}; if(Date.now()-s.time < 24*60*60*1000) stories.push(s); else db.collection("stories").doc(doc.id).delete(); }); renderStories(); }); }
function renderStories(){ let html=`<div class="story-add" onclick="document.getElementById('storyInput').click()"><div class="plus">+</div><div>Add Story</div></div>`; stories.forEach(s=>{ html+=`<div class="story" onclick="openStory('${s.img}','${s.fid}')"><img src="${s.img}"><div class="story-name">${s.name}</div></div>`; }); demoUsers.forEach(s=>{ let img=s.profilePic||`https://i.pravatar.cc/110?img=${s.img}`; html+=`<div class="story" onclick="openStory('${img}','demo')"><img src="${img}"><div class="story-name">${s.name}</div></div>`; }); document.getElementById('storiesList').innerHTML=html; }
async function uploadStory(event){ let file=event.target.files[0]; if(!file) return; let url=await uploadToCloudinary(file); if(!url) return; await db.collection("stories").add({img:url,name:currentUser.name,userId:myUid,time:Date.now()}); }
let currentStoryId=null; function openStory(img,fid){ currentStoryId=fid; document.getElementById('storyImg').src=img; document.getElementById('storyViewer').style.display='flex'; document.getElementById('storyActions').innerHTML = fid!='demo' ? `<button onclick="deleteStory('${fid}')" style="background:#ff3b30;border:none;color:#fff;padding:8px 15px;border-radius:8px">Delete My Story 🗑️</button>` : ''; }
async function deleteStory(fid){ if(!confirm("Delete story?")) return; await db.collection("stories").doc(fid).delete(); closeStory(); }
function closeStory(){ document.getElementById('storyViewer').style.display='none'; }

// GROUPS - NEW WORKING
function loadGroups(){ db.collection("groups").orderBy("time","desc").onSnapshot(snap=>{ groups=[]; snap.forEach(doc=>groups.push({fid:doc.id,...doc.data()})); renderGroups(); }); }
function renderGroups(){ document.getElementById('groupsList').innerHTML = groups.length? groups.map(g=>`<div class="groupCard"><b>${g.name}</b><p style="color:#aaa;font-size:13px">${g.desc||''}</p><p style="font-size:12px">👥 ${g.members?.length||1} members • ${g.posts?.length||0} posts • by ${g.creator}</p><button onclick="openGroupPost('${g.fid}','${g.name}')" style="background:#4caf50;border:none;color:#fff;padding:8px;border-radius:8px;width:100%;margin-top:8px">Post in Group</button>${(g.posts||[]).map(p=>`<div style="background:#18191a;padding:8px;border-radius:8px;margin-top:8px"><b>${p.name}:</b> ${p.text}</div>`).join('')}</div>`).join('') : "<p style='color:#aaa'>No groups yet. Create one!</p>"; }
async function createGroup(){ let name=document.getElementById('groupName').value; let desc=document.getElementById('groupDesc').value; if(!name) return alert("Group name needed"); await db.collection("groups").add({name,desc,creator:currentUser.name,creatorId:myUid,members:[myUid],posts:[],time:Date.now()}); closeModal('groupModal'); document.getElementById('groupName').value=''; }
let activeGroupId=null; function openGroupPost(gid,gname){ activeGroupId=gid; document.getElementById('groupPostTitle').innerText="Post in "+gname; openModal('groupPostModal'); }
async function submitGroupPost(){ let txt=document.getElementById('groupPostText').value; if(!txt) return; if(hasBad(txt)||hasReligion(txt)) return await addStrike("Bad content in group"); let ref=db.collection("groups").doc(activeGroupId); let d=(await ref.get()).data(); let posts2=d.posts||[]; posts2.push({name:currentUser.name,text:txt,time:Date.now()}); await ref.update({posts:posts2}); closeModal('groupPostModal'); document.getElementById('groupPostText').value=''; }

// NOTIFICATIONS - REAL
function loadNoti(){ db.collection("notifications").where("toUserId","==",myUid).orderBy("time","desc").limit(20).onSnapshot(snap=>{ let list=[]; snap.forEach(doc=>list.push({fid:doc.id,...doc.data()})); let unread=list.filter(n=>!n.read).length; let badge=document.getElementById('notiBadge'); badge.style.display=unread>0?'block':'none'; badge.innerText=unread>9?'9+':unread; document.getElementById('notiList').innerHTML=list.length?list.map(n=>`<div style="background:#242526;padding:10px;border-radius:8px;margin-bottom:8px"><b>${n.from}</b><p>${n.msg}</p><span style="font-size:11px;color:#aaa">${new Date(n.time).toLocaleString()}</span></div>`).join(''):"<p>No notifications</p>"; window._notiList=list; }); }
function openNotifications(){ openModal('notiModal'); }
async function clearNoti(){ let batch=db.batch(); (window._notiList||[]).forEach(n=>{ batch.update(db.collection("notifications").doc(n.fid),{read:true}); }); await batch.commit(); }

// TABS
function showTab(tab){
  document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(t=>t.classList.remove('active'));
  ['reels','feed','watchTab','groupsTab'].forEach(id=>document.getElementById(id).style.display='none');
  document.querySelector('.reel-upload-btn').style.display= tab=='reels' ? 'flex':'none';
  if(tab=='reels'){ document.getElementById('reels').style.display='block'; document.querySelectorAll('.tabs div')[0].classList.add('active'); document.querySelectorAll('.nav-item')[0].classList.add('active'); }
  if(tab=='feed'){ document.getElementById('feed').style.display='block'; document.querySelectorAll('.tabs div')[1].classList.add('active'); document.querySelectorAll('.nav-item')[1].classList.add('active'); }
  if(tab=='watch'){ document.getElementById('watchTab').style.display='block'; document.querySelectorAll('.tabs div')[2].classList.add('active'); document.querySelectorAll('.nav-item')[3].classList.add('active'); }
  if(tab=='groups'){ document.getElementById('groupsTab').style.display='block'; document.querySelectorAll('.tabs div')[3].classList.add('active'); document.querySelectorAll('.nav-item')[2].classList.add('active'); }
}
auth.signInAnonymously().then(cred=>{ myUid=cred.user.uid; loadPosts(); loadReels(); loadStories(); loadGroups(); loadNoti(); }).catch(()=>{ loadPosts(); loadReels(); loadStories(); loadGroups(); });
window.onload=function(){ document.querySelector('.nav-item img.profile-pic').src=currentUser.profilePic||`https://i.pravatar.cc/28?img=${currentUser.img}`; document.querySelector('.post-create img').src=currentUser.profilePic||`https://i.pravatar.cc/40?img=${currentUser.img}`; showTab('reels'); };
</script>
