<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook</title>
<style>
:root{ --bg: #0a1a0f; --card-bg: #13261a; --header-bg: #13261a; --text: #e4e6eb; --text-secondary: #7a9e80; --border: #1f3d2a; --brand: #4caf50; --hover: #1f3d2a; --input-bg: #0a1a0f; }
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial;} 
body{background:var(--bg); color:var(--text); padding-bottom:60px;} 
.header{display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:var(--header-bg); position:sticky; top:0; z-index:10;} 
.logo{font-size:24px; font-weight:bold; color:var(--brand);} 
.header-icons{display:flex; gap:15px; font-size:22px;} 
.header-icons span{cursor:pointer;}
.tabs{display:flex; justify-content:space-around; background:var(--header-bg); border-bottom:1px solid var(--border);} 
.tabs div{padding:12px; flex:1; text-align:center; cursor:pointer;} 
.tabs div.active{border-bottom:3px solid var(--brand); color:var(--brand);} 
.stories{display:flex; gap:10px; padding:10px; overflow-x:auto;} 
.story{width:110px; height:180px; background:var(--card-bg); border-radius:12px; position:relative; flex-shrink:0; border:2px solid var(--brand); cursor:pointer;} 
.story img{width:100%; height:100%; object-fit:cover; border-radius:10px;} 
.story .plus{position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:var(--brand); border-radius:50%; width:30px; height:30px; text-align:center; line-height:30px; font-size:20px; border:3px solid var(--card-bg);} 
.post-create{display:flex; gap:10px; padding:12px; background:var(--card-bg); margin:10px; border-radius:12px;} 
.post-create img{width:40px; height:40px; border-radius:50%; cursor:pointer;}
.post-create input{flex:1; background:var(--input-bg); border:none; padding:10px; border-radius:20px; color:var(--text);} 
.create-options{display:flex; justify-content:space-around; padding:8px; border-top:1px solid var(--border);} 
.create-options div{cursor:pointer; color:var(--text-secondary);} 
.post{background:var(--card-bg); margin:10px 0; padding:12px; border-radius:12px;} 
.post-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;} 
.post-user{display:flex; align-items:center; gap:10px; cursor:pointer;}
.post-user img{width:40px; height:40px; border-radius:50%;} 
.post-time{font-size:12px; color:var(--text-secondary);} 
.post img.post-img, .post video{width:100%; border-radius:8px; margin:10px 0;} 
.post-stats{display:flex; justify-content:space-between; font-size:13px; color:var(--text-secondary); padding:5px 0; border-bottom:1px solid var(--border);} 
.post-actions{display:flex; justify-content:space-around; padding-top:8px; position:relative;} 
.post-actions button{background:none; border:none; color:var(--text-secondary); font-size:15px; cursor:pointer; padding:8px; flex:1; border-radius:8px;} 
.react-box{display:none; position:absolute; bottom:45px; left:10px; background:var(--card-bg); padding:5px; border-radius:30px; box-shadow:0 2px 10px black; gap:5px;} 
.react-box span{font-size:24px; cursor:pointer; padding:5px;} 
.comment-section{display:none; padding-top:10px; border-top:1px solid var(--border);} 
.comment{display:flex; gap:8px; margin:10px 0;} 
.comment img{width:32px; height:32px; border-radius:50%;} 
.comment-box{flex:1; background:var(--input-bg); padding:8px 12px; border-radius:18px;} 
.comment-input{display:flex; gap:8px; margin-top:10px;} 
.comment-input input{flex:1; background:var(--input-bg); border:none; padding:10px; border-radius:20px; color:var(--text); outline:none;} 
.comment-input button{background:var(--brand); border:none; color:white; padding:8px 15px; border-radius:20px;} 
.menu{position:relative; cursor:pointer;} 
.menu-list{display:none; position:absolute; right:0; top:25px; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:5px 0; z-index:5; width:180px;} 
.menu-list div{padding:10px 15px; cursor:pointer;} 
/* Reels */ 
.reels-container{display:none; height:100vh; background:black; overflow-y:scroll; scroll-snap-type:y mandatory;} 
.reel{height:100vh; position:relative; scroll-snap-align:start;}
.reel-video{width:100%; height:100%; object-fit:cover;} 
.reel-actions{position:absolute; right:10px; bottom:100px; display:flex; flex-direction:column; gap:15px;} 
.reel-actions div{text-align:center; font-size:12px;} 
.reel-top{position:absolute; top:10px; right:10px; display:flex; gap:15px; font-size:20px;} 
.reel-user{position:absolute; bottom:80px; left:10px; display:flex; align-items:center; gap:10px;}
.reel-user img{width:40px; height:40px; border-radius:50%; border:2px solid var(--brand);}
/* Story Viewer */
.story-viewer{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:999;}
.story-viewer img{width:100%; height:100%; object-fit:contain;}
.story-header{position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center;}
.story-header img{width:40px; height:40px; border-radius:50%;}
.story-actions{position:absolute; bottom:20px; left:0; right:0; display:flex; justify-content:space-around;}
/* Share Popup */ 
.share-popup{display:none; position:fixed; bottom:0; left:0; width:100%; background:var(--card-bg); border-radius:20px 20px 0 0; padding:15px; z-index:99;} 
.share-popup div{padding:12px; cursor:pointer;} 
.bottom-nav{position:fixed; bottom:0; width:100%; background:var(--header-bg); display:flex; justify-content:space-around; padding:8px 0; border-top:1px solid var(--border);} 
.bottom-nav div{text-align:center; font-size:22px; color:var(--brand); cursor:pointer;}
.bottom-nav img{width:24px; height:24px; border-radius:50%;}
.overlay{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:98;} 
input[type=file]{display:none;}
</style>
</head>
<body>

<script>
if(!localStorage.getItem('autrobook_user')){ window.location.href = 'login.html'; }
let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {name:"You", img:99};
</script>

<div class="header"> 
<div class="logo">Autrobook</div> 
<div class="header-icons">
<span onclick="document.getElementById('storyInput').click()">+</span>
<span>🔍</span>
<span onclick="window.location.href='main-settings.html'">⚙️</span>
</div> 
</div> 

<input type="file" id="storyInput" accept="image/*" onchange="addStory(event)">

<!-- Tabs -->
<div class="tabs"> 
<div class="active" onclick="showTab('feed')">Home</div> 
<div onclick="showTab('reels')">🎬 Reels</div> 
</div> 

<div id="feed"> 
<!-- Stories -->
<div class="stories" id="storiesList"> 
<div class="story" onclick="document.getElementById('storyInput').click()">
<img src="https://i.pravatar.cc/110?img=99"><div class="plus">+</div>
</div> 
</div> 

<!-- Create Post -->
<div class="post-create"> 
<img src="https://i.pravatar.cc/40?img=99">
<input type="text" id="caption" placeholder="What's on your mind?"> 
</div> 
<div class="create-options"> 
<div onclick="document.getElementById('fileInput').click()">📷 Photo/Video</div> 
<div>😊 Feeling</div> 
</div> 
<input type="file" id="fileInput" accept="image/*,video/*"> 

<div id="posts"></div>
</div> 

<!-- Reels -->
<div class="reels-container" id="reels"> 
<div class="reel"><video class="reel-video" src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop playsinline></video></div>
</div> 

<!-- Story Viewer -->
<div class="story-viewer" id="storyViewer">
<div class="story-header">
<div style="display:flex; align-items:center; gap:10px;"><img id="storyUserImg"><b id="storyUserName"></b></div>
<div onclick="closeStory()">✕</div>
</div>
<img id="storyImg">
<div class="story-actions">
<button onclick="reactStory('❤️')">❤️</button>
<button onclick="alert('Reported')">🚩 Report</button>
<button onclick="alert('Muted 24h')">🔇 Mute</button>
</div>
</div>

<!-- Share Popup -->
<div class="overlay" id="overlay" onclick="closeShare()"></div> 
<div class="share-popup" id="sharePopup"> 
<div onclick="copyLink()">🔗 Copy Link</div> 
<div onclick="closeShare()">Cancel</div> 
</div> 

<!-- Bottom Nav -->
<div class="bottom-nav"> 
<div onclick="window.location.href='home.html'">🏠</div>
<div onclick="showTab('reels')">🎬</div>
<div onclick="alert('Friends Coming')">👥</div>
<div onclick="alert('Notifications Coming')">🔔</div>
<div onclick="window.location.href='demo-profile.html'"><img src="https://i.pravatar.cc/24?img=99"></div>
</div> 

<script> 
let userReact = {}; 
let stories = JSON.parse(localStorage.getItem('stories') || '[]');

const demoUsers = [
{name:"Rahim Khan", img:1, text:"Today is a beautiful day ☀️", postImg:"600x400/4caf50"},
{name:"Sadia Afrin", img:2, text:"Love this new feature of Autrobook!", postImg:"600x400/2196f3"},
{name:"Nayeem Hasan", img:3, text:"Who wants to go for a trip?", postImg:"600x400/ff9800"},
{name:"Fatema Begum", img:4, text:"Cooking Biriyani today 🍛", postImg:"600x400/9c27b0"},
{name:"Karim Uddin", img:5, text:"Neymar gave his private jet to his teammate", postImg:"600x400/f44336"}
];

// Load Stories
function loadStories(){
  let html = `<div class="story" onclick="document.getElementById('storyInput').click()"><img src="https://i.pravatar.cc/110?img=99"><div class="plus">+</div></div>`;
  stories.forEach((s,i)=>{
    html += `<div class="story" onclick="viewStory(${i})"><img src="${s.img}"></div>`;
  });
  demoUsers.forEach(u=>{
    html += `<div class="story" onclick="viewStoryDemo(${u.img})"><img src="https://i.pravatar.cc/110?img=${u.img}"></div>`;
  });
  document.getElementById('storiesList').innerHTML = html;
}
loadStories();

function addStory(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(ev){
    stories.unshift({img: ev.target.result, user: currentUser.name});
    localStorage.setItem('stories', JSON.stringify(stories));
    loadStories();
  }
  reader.readAsDataURL(file);
}

function viewStory(i){
  document.getElementById('storyViewer').style.display='block';
  document.getElementById('storyImg').src = stories[i].img;
  document.getElementById('storyUserName').innerText = stories[i].user;
  document.getElementById('storyUserImg').src = 'https://i.pravatar.cc/40?img=99';
}

function viewStoryDemo(img){
  document.getElementById('storyViewer').style.display='block';
  document.getElementById('storyImg').src = `https://i.pravatar.cc/400?img=${img}`;
  document.getElementById('storyUserName').innerText = demoUsers.find(u=>u.img==img).name;
  document.getElementById('storyUserImg').src = `https://i.pravatar.cc/40?img=${img}`;
}

function closeStory(){document.getElementById('storyViewer').style.display='none';}
function reactStory(emoji){alert(`Reacted ${emoji}`)}

function loadPosts(){
  let postsHTML = '';
  demoUsers.forEach((u, i)=>{
    postsHTML += `
    <div class="post">
    <div class="post-header">
    <div class="post-user"><img src="https://i.pravatar.cc/40?img=${u.img}"><div><b>${u.name}</b><div class="post-time">${i+1}h ago</div></div></div>
    <div class="menu" onclick="toggleMenu('menu${i}')">⋯<div class="menu-list" id="menu${i}"><div onclick="copyLink()">🔗 Copy Link</div><div onclick="alert('Report Post')">🚩 Report</div></div></div>
    </div>
    <p>${u.text}</p>
    <img src="https://via.placeholder.com/${u.postImg}" class="post-img">
    <div class="post-stats"><span id="reactCount${i}">0</span><span id="commentCount${i}">0 Comments</span></div>
    <div class="post-actions">
    <button onclick="toggleLike('like${i}','reactCount${i}')"><span id="like${i}">👍 Like</span></button>
    <button onclick="toggleComment('comment${i}')">💬 Comment</button>
    <button onclick="openShare()">↗️ Share</button>
    </div>
    <div class="comment-section" id="comment${i}">
    <div id="commentsList${i}"></div>
    <div class="comment-input">
    <input type="text" placeholder="Write a comment..." id="input${i}">
    <button onclick="sendComment(${i})">Send</button>
    <button onclick="voiceComment(${i})">🎤</button>
    </div>
    </div>
    </div>`
  });
  document.getElementById('posts').innerHTML = postsHTML;
}
loadPosts();

function sendComment(i){
  let val = document.getElementById(`input${i}`).value;
  if(val){
    document.getElementById(`commentsList${i}`).innerHTML += `<div class="comment"><img src="https://i.pravatar.cc/32?img=99"><div class="comment-box"><b>You</b><br>${val}</div></div>`;
    document.getElementById(`input${i}`).value='';
    let count = document.getElementById(`commentCount${i}`).innerText.split(' ')[0];
    document.getElementById(`commentCount${i}`).innerText = (parseInt(count)+1) + ' Comments';
  }
}

function voiceComment(i){
  alert('🎤 Recording... Hold to record voice comment');
}

function showTab(tab){ 
  document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active')); 
  if(tab=='feed'){ 
    document.getElementById('feed').style.display='block'; 
    document.getElementById('reels').style.display='none'; 
    document.querySelectorAll('.tabs div')[0].classList.add('active'); 
  }else{ 
    document.getElementById('feed').style.display='none'; 
    document.getElementById('reels').style.display='block'; 
    document.querySelectorAll('.tabs div')[1].classList.add('active'); 
  } 
} 
function toggleMenu(id){document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';} 
function toggleComment(id){document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';} 
function toggleLike(btnId,countId){ 
  let el = document.getElementById(btnId);
  if(el.innerHTML.includes('Like')){el.innerHTML='❤️ Liked'; document.getElementById(countId).innerHTML='1';} 
  else{el.innerHTML='👍 Like'; document.getElementById(countId).innerHTML='0';} 
} 
function openShare(){ document.getElementById('sharePopup').style.display='block'; document.getElementById('overlay').style.display='block'; } 
function closeShare(){ document.getElementById('sharePopup').style.display='none'; document.getElementById('overlay').style.display='none'; } 
function copyLink(){ navigator.clipboard.writeText(window.location.href); alert('Link Copied ✅'); closeShare(); } 
</script> 
</body> 
</html>
