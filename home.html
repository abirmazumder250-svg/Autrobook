<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook</title>
<style>
:root{ --bg: #0a1a0f; --card-bg: #13261a; --header-bg: #13261a; --text: #e4e6eb; --text-secondary: #7a9e80; --border: #1f3d2a; --brand: #4caf50; --hover: #1f3d2a; --input-bg: #0a1a0f; }
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial;} 
body{background:var(--bg); color:var(--text); padding-bottom:60px;} 
.header{display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:var(--header-bg); position:sticky; top:0; z-index:10;} 
.logo{font-size:24px; font-weight:bold; color:var(--brand);} 
.header-icons{display:flex; gap:15px; font-size:22px;} 
.tabs{display:flex; justify-content:space-around; background:var(--header-bg); border-bottom:1px solid var(--border);} 
.tabs div{padding:12px; flex:1; text-align:center; cursor:pointer;} 
.tabs div.active{border-bottom:3px solid var(--brand); color:var(--brand);} 
.stories{display:flex; gap:10px; padding:10px; overflow-x:auto;} 
.story{width:110px; height:180px; background:var(--card-bg); border-radius:12px; position:relative; flex-shrink:0; border:2px solid var(--brand); cursor:pointer;} 
.story img{width:100%; height:100%; object-fit:cover; border-radius:10px;} 
.story .plus{position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:var(--brand); border-radius:50%; width:30px; height:30px; text-align:center; line-height:30px; font-size:20px; border:3px solid var(--card-bg);} 
.post-create{display:flex; gap:10px; padding:12px; background:var(--card-bg); margin:10px; border-radius:12px;} 
.post-create img{width:40px; height:40px; border-radius:50%;} 
.post-create input{flex:1; background:var(--input-bg); border:none; padding:10px; border-radius:20px; color:var(--text);} 
.create-options{display:flex; justify-content:space-around; padding:8px; border-top:1px solid var(--border);} 
.create-options div{cursor:pointer; color:var(--text-secondary);} 
.post{background:var(--card-bg); margin:10px 0; padding:12px; border-radius:12px;} 
.post-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;} 
.post-user{display:flex; align-items:center; gap:10px;} 
.post-user img{width:40px; height:40px; border-radius:50%;} 
.post-time{font-size:12px; color:var(--text-secondary);} 
.post img.post-img, .post video{width:100%; border-radius:8px; margin:10px 0;} 
.post-stats{display:flex; justify-content:space-between; font-size:13px; color:var(--text-secondary); padding:5px 0; border-bottom:1px solid var(--border);} 
.post-actions{display:flex; justify-content:space-around; padding-top:8px; position:relative;} 
.post-actions button{background:none; border:none; color:var(--text-secondary); font-size:15px; cursor:pointer; padding:8px; flex:1; border-radius:8px;} 
.post-actions button:hover{background:var(--hover);} 
.react-box{display:none; position:absolute; bottom:45px; left:10px; background:var(--card-bg); padding:5px; border-radius:30px; box-shadow:0 2px 10px black; gap:5px;} 
.react-box span{font-size:24px; cursor:pointer; padding:5px;} 
.react-box span:hover{transform:scale(1.3);} 
.comment-section{display:none; padding-top:10px; border-top:1px solid var(--border);} 
.comment{display:flex; gap:8px; margin:10px 0;} 
.comment img{width:32px; height:32px; border-radius:50%;} 
.comment-box{flex:1; background:var(--input-bg); padding:8px 12px; border-radius:18px;} 
.comment-input{display:flex; gap:8px; margin-top:10px;} 
.comment-input input{flex:1; background:var(--input-bg); border:none; padding:10px; border-radius:20px; color:var(--text); outline:none;} 
.comment-input button{background:var(--brand); border:none; color:white; padding:8px 15px; border-radius:20px;} 
.menu{position:relative; cursor:pointer;} 
.menu-list{display:none; position:absolute; right:0; top:25px; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:5px 0; z-index:5; width:180px;} 
.menu-list div{padding:10px 15px; cursor:pointer;} 
.menu-list div:hover{background:var(--hover);} 
/* Reels */ 
.reels-container{display:none; height:100vh; background:black; position:relative;} 
.reel-video{width:100%; height:100%; object-fit:cover;} 
.reel-actions{position:absolute; right:10px; bottom:100px; display:flex; flex-direction:column; gap:15px;} 
.reel-actions div{text-align:center; font-size:12px;} 
.reel-top{position:absolute; top:10px; right:10px; display:flex; gap:15px; font-size:20px;} 
/* Share Popup */ 
.share-popup{display:none; position:fixed; bottom:0; left:0; width:100%; background:var(--card-bg); border-radius:20px 20px 0 0; padding:15px; z-index:99;} 
.share-popup div{padding:12px; cursor:pointer;} 
.share-popup div:hover{background:var(--hover);} 
.bottom-nav{position:fixed; bottom:0; width:100%; background:var(--header-bg); display:flex; justify-content:space-around; padding:8px 0; border-top:1px solid var(--border);} 
.bottom-nav div{text-align:center; font-size:22px; color:var(--brand);} 
.overlay{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:98;} 
</style>
</head>
<body>

<script>
// 1. LOGIN CHECK - Runs first
if(!localStorage.getItem('autrobook_user')){
  window.location.href = 'login.html';
}else{
  let user = JSON.parse(localStorage.getItem('autrobook_user'));
  console.log('Logged in as:', user.name);
}
</script>

<div class="header"> 
<div class="logo">Autrobook</div> 
<div class="header-icons">+ 🔍</div> 
</div> 

<!-- Tabs: Home / Reels -->
<div class="tabs"> 
<div class="active" onclick="showTab('feed')">Home</div> 
<div onclick="showTab('reels')">🎬 Reels</div> 
</div> 

<div id="feed"> 
<!-- Stories -->
<div class="stories"> 
<div class="story"><img src="https://via.placeholder.com/110x180/2e7d32/fff"><div class="plus">+</div></div> 
<div class="story"><img src="https://via.placeholder.com/110x180/1f3d2a/fff"></div> 
</div> 

<!-- Create Post with Caption + Photo/Video -->
<div class="post-create"> 
<img src="logo.png"> 
<input type="text" id="caption" placeholder="What's on your mind?"> 
</div> 
<div class="create-options"> 
<div onclick="document.getElementById('fileInput').click()">📷 Photo/Video</div> 
<div>😊 Feeling</div> 
</div> 
<input type="file" id="fileInput" style="display:none" accept="image/*,video/*"> 

<!-- Feed Post -->
<div class="post" id="post1"> 
<div class="post-header"> 
<div class="post-user"> 
<img src="https://via.placeholder.com/40"> 
<div><b>News Portal</b><div class="post-time">6h ago</div></div> 
</div> 
<div class="menu" onclick="toggleMenu('menu1')">⋯ 
<div class="menu-list" id="menu1"> 
<div onclick="copyLink()">🔗 Copy Link</div> 
<div onclick="alert('Report Post')">🚩 Report</div> 
<div onclick="alert('Not Interested')">❌ Not Interested</div>
<div onclick="logout()">🚪 Log Out</div> <!-- ADDED LOGOUT -->
</div> 
</div> 
</div> 
<p>Neymar gave his private jet to his teammate</p> 
<img src="https://via.placeholder.com/600x400" class="post-img"> 
<div class="post-stats"><span id="reactCount1">0</span><span>0 Comments 0 Shares</span></div> 
<div class="post-actions"> 
<button onmouseover="showReact('react1')" onmouseleave="hideReact('react1')" onclick="toggleLike('like1','reactCount1')"> 
<div class="react-box" id="react1"> 
<span onclick="setReact('like1','reactCount1','👍')">👍</span> 
<span onclick="setReact('like1','reactCount1','❤️')">❤️</span> 
<span onclick="setReact('like1','reactCount1','😆')">😆</span> 
<span onclick="setReact('like1','reactCount1','😢')">😢</span> 
<span onclick="setReact('like1','reactCount1','😠')">😠</span> 
</div> 
<span id="like1">👍 Like</span></button> 
<button onclick="toggleComment('comment1')">💬 Comment</button> 
<button onclick="openShare()">↗️ Share</button> 
</div> 
<div class="comment-section" id="comment1"> 
<div class="comment-input"> 
<input type="text" placeholder="Write a comment..."> 
<button>🎤</button><button>Send</button> 
</div> 
</div> 
</div> 
</div> 

<!-- Reels Section -->
<div class="reels-container" id="reels"> 
<video class="reel-video" src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop playsinline></video> 
<div class="reel-top"> 
<div onclick="downloadVideo()">⬇️</div> 
<div onclick="alert('Quality: 4K')">4K</div> 
<div onclick="alert('Report Reel')">🚩</div> 
</div> 
<div class="reel-actions"> 
<div>👍 1.2K</div> 
<div>💬 45</div> 
<div onclick="openShare()">↗️ Share</div> 
</div> 
</div> 

<!-- Share Popup -->
<div class="overlay" id="overlay" onclick="closeShare()"></div> 
<div class="share-popup" id="sharePopup"> 
<div onclick="copyLink()">🔗 Copy Link</div> 
<div onclick="sendToAutrochat()">✉️ Send in Autrochat</div> 
<div onclick="closeShare()">Cancel</div> 
</div> 

<!-- Bottom Nav -->
<div class="bottom-nav"> 
<div>🏠</div><div onclick="showTab('reels')">🎬</div><div>👥</div><div>🔔</div><div><img src="logo.png" style="width:24px; height:24px; border-radius:50%;"></div> 
</div> 

<script> 
let userReact = {}; 
function showTab(tab){ 
  document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active')); 
  if(tab=='feed'){ 
    document.getElementById('feed').style.display='block'; 
    document.getElementById('reels').style.display='none'; 
    document.querySelectorAll('.tabs div')[0].classList.add('active'); 
  }else{ 
    document.getElementById('feed').style.display='none'; 
    document.getElementById('reels').style.display='block'; 
    document.querySelectorAll('.tabs div')[1].classList.add('active'); 
  } 
} 
function toggleMenu(id){document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';} 
function toggleComment(id){document.getElementById(id).style.display = document.getElementById(id).style.display=='block'?'none':'block';} 
function showReact(id){document.getElementById(id).style.display='flex';} 
function hideReact(id){setTimeout(()=>{document.getElementById(id).style.display='none';},500);} 
function setReact(btnId,countId,emoji){ 
  document.getElementById(btnId).innerHTML = emoji+' React'; 
  document.getElementById(countId).innerHTML = '1'; 
  userReact[btnId]=emoji; 
} 
function toggleLike(btnId,countId){ 
  if(userReact[btnId]){document.getElementById(btnId).innerHTML='👍 Like'; document.getElementById(countId).innerHTML='0'; userReact[btnId]='';} 
  else{setReact(btnId,countId,'👍');} 
} 
function openShare(){ 
  document.getElementById('sharePopup').style.display='block'; 
  document.getElementById('overlay').style.display='block'; 
} 
function closeShare(){ 
  document.getElementById('sharePopup').style.display='none'; 
  document.getElementById('overlay').style.display='none'; 
} 
function copyLink(){ 
  navigator.clipboard.writeText(window.location.href); 
  alert('Link Copied ✅'); 
  closeShare(); 
} 
function sendToAutrochat(){ 
  alert('Will send in Autrochat later'); 
  closeShare(); 
} 
function downloadVideo(){ 
  alert('Downloading Reel...'); 
}

// 2. LOGOUT FUNCTION - ADDED
function logout(){
  localStorage.removeItem('autrobook_user');
  window.location.href = 'login.html';
}
</script> 
</body> 
  </html>
