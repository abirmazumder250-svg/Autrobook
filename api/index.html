<script>
  // Set this to match the version of the APK you are building
  const CURRENT_APP_VERSION = 1;

  async function checkForAppUpdate() {
    try {
      // Fetches update.json with a timestamp to prevent caching
      const response = await fetch('/update.json?t=' + new Date().getTime());
      const data = await response.json();

      if (data.latestVersion > CURRENT_APP_VERSION) {
        const userChoice = confirm(
          `New Update Available! (Version ${data.versionName})\n\nWhat's New:\n${data.changelog}\n\nDo you want to download and install it now?`
        );

        if (userChoice) {
          // Starts downloading the new APK immediately
          window.location.href = data.downloadUrl;
        }
      }
    } catch (error) {
      console.log("Update check failed:", error);
    }
  }

  // Runs the update check 2 seconds after the app loads
  window.addEventListener('load', () => {
    setTimeout(checkForAppUpdate, 2000);
  });
</script>
