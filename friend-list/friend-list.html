<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friends - Autrobook</title>
  <link rel="stylesheet" href="friend-list.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body id="friendBody">

  <div id="toast"></div>

  <!-- Header -->
  <div class="header">
    <span onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></span>
    <b>Friends (<span id="friendTotal">0</span>)</b>
  </div>

  <!-- Search Box -->
  <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search friends by name..." oninput="filterFriends()" />

  <!-- Tabs Group (All, Requests, Suggestions, Blocked) -->
  <div class="tab-group">
    <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">All Friends</button>
    <button class="tab-btn" id="tabReq" onclick="switchTab('requests')">Requests (<span id="reqCount">0</span>)</button>
    <button class="tab-btn" id="tabSugg" onclick="switchTab('suggestions')">Suggestions</button>
    <button class="tab-btn" id="tabBlocked" onclick="switchTab('blocked')">Blocked</button>
  </div>

  <!-- Friend List Container -->
  <div id="friendContainer"></div>

  <script src="friend-list.js"></script>
</body>
</html>
