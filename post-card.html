<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Post Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg-page: #000000;
      --bg-surface: #121212;
      --bg-soft: #242526;
      --bg-hover: #303234;
      --text-main: #e4e6eb;
      --text-muted: #b0b3b8;
      --border-line: rgba(255, 255, 255, 0.14);
      --invert-bg: #ffffff;
      --invert-fg: #000000;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-page: #ffffff;
        --bg-surface: #ffffff;
        --bg-soft: #f0f2f5;
        --bg-hover: #e4e6eb;
        --text-main: #050505;
        --text-muted: #65676b;
        --border-line: rgba(0, 0, 0, 0.12);
        --invert-bg: #050505;
        --invert-fg: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-line);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      text-decoration: none;
      color: var(--text-main);
      background: var(--bg-soft);
      border: 1px solid var(--border-line);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      background: var(--bg-hover);
    }

    .nav-btn.solid {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .feed-stream {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .fb-post {
      background: var(--bg-surface);
      border-bottom: 8px solid var(--bg-soft);
      padding-bottom: 6px;
    }

    .fb-post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
      gap: 10px;
    }

    .fb-author-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .fb-author-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      min-height: 18px;
    }

    .fb-live-time {
      font-size: 12.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .fb-views-right {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .fb-caption {
      padding: 2px 14px 10px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fb-caption.bold-text {
      font-weight: 700;
    }

    .fb-media {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
      border-top: 1px solid var(--border-line);
      border-bottom: 1px solid var(--border-line);
    }

    .fb-counts-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .fb-action-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border-line);
      margin: 0 8px;
      padding: 3px 0;
    }

    .fb-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      user-select: none;
      touch-action: manipulation;
    }

    .fb-action-btn:hover {
      background: var(--bg-soft);
      color: var(--text-main);
    }

    .fb-action-btn.active {
      color: var(--text-main);
      font-weight: 800;
    }

    .reaction-popup {
      position: fixed;
      z-index: 260;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 7px;
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      user-select: none;
      max-width: calc(100vw - 16px);
    }

    .reaction-popup.open {
      display: flex;
    }

    .reaction-emoji-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .reaction-emoji-btn:hover,
    .reaction-emoji-btn:active {
      background: var(--bg-soft);
      transform: scale(1.22);
    }

    .share-menu {
      position: fixed;
      z-index: 250;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 150px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .share-menu.open {
      display: flex;
    }

    .share-menu-btn {
      background: transparent;
      color: var(--text-main);
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .share-menu-btn:hover {
      background: var(--bg-soft);
    }

    .comments-panel {
      border-top: 1px solid var(--border-line);
      padding: 10px 14px 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .comments-panel.open {
      display: flex;
    }

    .composer-line {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text-pill-input {
      flex: 1;
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 18px;
      padding: 8px 13px;
      font-size: 13.5px;
      outline: none;
    }

    .text-pill-input::placeholder {
      color: var(--text-muted);
    }

    .pill-btn {
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .pill-btn:hover {
      background: var(--bg-hover);
    }

    .pill-btn.solid {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .comment-row {
      background: var(--bg-soft);
      border-radius: 10px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comment-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 700;
    }

    .comment-body {
      font-size: 13.5px;
      line-height: 1.4;
      word-break: break-word;
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .c-chip-btn {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .c-chip-btn.active {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .replies-list {
      margin-left: 12px;
      padding-left: 10px;
      border-left: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reply-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12.5px;
    }

    .dots-menu {
      position: fixed;
      z-index: 260;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 5px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 130px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .dots-menu.open {
      display: flex;
    }

    .dots-menu-btn {
      background: transparent;
      color: var(--text-main);
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .dots-menu-btn:hover {
      background: var(--bg-soft);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 320;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      max-width: 410px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reason-option {
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .reason-option.selected {
      background: var(--invert-bg);
      color: var(--invert-fg);
      font-weight: 700;
    }

    .toast-pill {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--invert-bg);
      color: var(--invert-fg);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 420;
      display: none;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-nav-group">
      <a href="index.html" class="nav-btn">
        <i class="fas fa-house"></i>
        <span>Feed</span>
      </a>
      <a href="create-post.html" class="nav-btn solid">
        <i class="fas fa-plus"></i>
        <span>Create Post</span>
      </a>
    </div>
  </header>

  <main id="feedStream" class="feed-stream"></main>

  <div id="reactionPopup" class="reaction-popup"></div>

  <div id="shareMenu" class="share-menu">
    <button type="button" class="share-menu-btn" id="shareToChatOption">
      <i class="fas fa-share"></i>
      <span>Share</span>
    </button>
    <button type="button" class="share-menu-btn" id="copyPostLinkOption">
      <i class="far fa-copy"></i>
      <span>Copy link</span>
    </button>
  </div>

  <div id="dotsMenu" class="dots-menu">
    <button type="button" class="dots-menu-btn" id="saveCommentOption">Save</button>
    <button type="button" class="dots-menu-btn" id="reportCommentOption">Report</button>
  </div>

  <div id="reportModal" class="modal-backdrop">
    <div class="modal-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>Report Comment</b>
        <button type="button" class="pill-btn" id="closeReportBtn">Close</button>
      </div>
      <div id="reportReasonsList" style="display:flex;flex-direction:column;gap:6px;"></div>
      <div class="composer-line" style="margin-top:6px;">
        <button type="button" class="pill-btn solid" id="submitReportBtn" style="flex:1;">Submit</button>
        <button type="button" class="pill-btn solid" id="sendReportBtn" style="flex:1;">Send</button>
      </div>
    </div>
  </div>

  <div id="toastPill" class="toast-pill"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

    const REACTIONS = ['❤️', '👍', '🥰', '😆', '😮', '😢', '😠'];
    const REPORT_REASONS = [
      'Spam or misleading promotion',
      'Hate speech or discriminatory content',
      'Harassment or personal attack',
      'Violence or physical threats',
      'Nudity or sexually explicit content',
      'False information or misinformation',
      'Scam or fraudulent activity',
      'Intellectual property or copyright violation',
      'Self-harm or dangerous behavior',
      'Violation of community standards'
    ];

    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (_) {}

    let activeUser = null;
    let activeAuthorName = '';
    let postsList = [];
    let commentsByPost = new Map();
    let activeReactionTarget = null;
    let activeSharePost = null;
    let activeCommentMenuData = null;
    let selectedReason = REPORT_REASONS[0];
    let audioCtx = null;
    let ignoreNextDocumentClick = false;

    let mediaRecorder = null;
    let voiceChunks = [];
    let recordedVoiceUrl = '';
    let recordedVoiceSec = 0;
    let recordingPostId = null;
    let isRecording = false;
    let voiceTimer = null;

    function showToast(msg) {
      const el = document.getElementById('toastPill');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._pcToast);
      window._pcToast = setTimeout(() => { el.style.display = 'none'; }, 2200);
    }

    function playReactionSound() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(560, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (_) {}
    }

    function formatLiveElapsed(createdAtStr) {
      if (!createdAtStr) return '0s';
      const createdMs = new Date(createdAtStr).getTime();
      if (Number.isNaN(createdMs)) return '0s';
      const diffSec = Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}d`;
    }

    function readLocalReactionState() {
      return JSON.parse(localStorage.getItem('autro_post_reactions_local') || '{}');
    }

    function writeLocalReactionState(postId, data) {
      const all = readLocalReactionState();
      all[postId] = data;
      localStorage.setItem('autro_post_reactions_local', JSON.stringify(all));
    }

    function readSharedPostsSet() {
      return JSON.parse(localStorage.getItem('autro_shared_posts_set') || '{}');
    }

    function markPostSharedLocal(postId, countVal) {
      const setObj = readSharedPostsSet();
      setObj[postId] = Number(countVal || 0);
      localStorage.setItem('autro_shared_posts_set', JSON.stringify(setObj));
    }

    function buildPostShareUrl(postId) {
      const base = `${window.location.origin}${window.location.pathname}`;
      return `${base}?post=${encodeURIComponent(postId)}`;
    }

    function openShareMenu(anchorBtn, postObj) {
      activeSharePost = postObj;
      ignoreNextDocumentClick = true;
      const menu = document.getElementById('shareMenu');
      const rect = anchorBtn.getBoundingClientRect();
      menu.classList.add('open');
      const mRect = menu.getBoundingClientRect();
      const left = Math.min(window.innerWidth - mRect.width - 10, Math.max(10, rect.left));
      const top = Math.max(10, rect.top - mRect.height - 8);
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function closeShareMenu() {
      document.getElementById('shareMenu').classList.remove('open');
    }

    function bindShareLongPress(btnEl, postObj) {
      let pressTimer = null;
      let wasLongPress = false;

      const startPress = () => {
        wasLongPress = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          wasLongPress = true;
          openShareMenu(btnEl, postObj);
        }, 380);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      btnEl.addEventListener('pointerdown', startPress);
      btnEl.addEventListener('pointerup', cancelPress);
      btnEl.addEventListener('pointerleave', cancelPress);
      btnEl.addEventListener('pointercancel', cancelPress);
      btnEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        wasLongPress = true;
        openShareMenu(btnEl, postObj);
      });

      btnEl.addEventListener('click', async (e) => {
        if (wasLongPress) {
          e.preventDefault();
          wasLongPress = false;
          return;
        }
        const sharedSet = readSharedPostsSet();
        if (postObj._sharedOnce || Object.prototype.hasOwnProperty.call(sharedSet, postObj.id)) {
          showToast('Already shared');
          return;
        }
        postObj._sharedOnce = true;
        postObj.share_count = Number(postObj.share_count || 0) + 1;
        markPostSharedLocal(postObj.id, postObj.share_count);

        if (sb && postObj.id && !String(postObj.id).startsWith('local-')) {
          try {
            await sb.from('posts').update({ share_count: postObj.share_count }).eq('id', postObj.id);
          } catch (_) {}
        }
        renderPostsStream();
        showToast('Shared');
      });
    }

    async function loadSessionAndProfile() {
      activeAuthorName = String(localStorage.getItem('autro_profile_name') || '').trim();
      if (!sb) return;
      try {
        const { data: { session } } = await sb.auth.getSession();
        activeUser = session?.user || null;
        if (!activeUser) return;
        const { data: prof } = await sb
          .from('profiles')
          .select('full_name')
          .eq('id', activeUser.id)
          .maybeSingle();
        const resolved = String(
          prof?.full_name ||
          activeUser.user_metadata?.full_name ||
          activeUser.user_metadata?.name ||
          activeAuthorName ||
          ''
        ).trim();
        if (resolved) {
          activeAuthorName = resolved;
          localStorage.setItem('autro_profile_name', resolved);
        }
      } catch (_) {}
    }

    function readLocalComments(postId) {
      const all = JSON.parse(localStorage.getItem('autro_comments_store') || '{}');
      return Array.isArray(all[postId]) ? all[postId] : [];
    }

    function writeLocalComments(postId, arr) {
      const all = JSON.parse(localStorage.getItem('autro_comments_store') || '{}');
      all[postId] = arr;
      localStorage.setItem('autro_comments_store', JSON.stringify(all));
    }

    async function syncPostReactionCount(postId, nextCount) {
      if (!sb || !postId || String(postId).startsWith('local-')) return;
      try {
        await sb
          .from('posts')
          .update({ reaction_count: Math.max(0, Number(nextCount || 0)) })
          .eq('id', postId);
      } catch (_) {}
    }

    async function applyReaction(target, emoji) {
      if (!target) return;

      if (target.type === 'post') {
        const post = postsList.find(p => p.id === target.postId);
        if (!post) return;

        if (post.userReaction === emoji) {
          post.userReaction = null;
          post.reaction_count = Math.max(0, Number(post.reaction_count || 0) - 1);
          writeLocalReactionState(post.id, {
            emoji: null,
            count: post.reaction_count
          });
          if (activeUser && sb && !String(post.id).startsWith('local-')) {
            await sb.from('post_reactions').delete().eq('post_id', post.id).eq('user_id', activeUser.id);
          }
          await syncPostReactionCount(post.id, post.reaction_count);
          renderPostsStream();
          showToast('Reaction undone');
          return;
        }

        if (!post.userReaction) {
          post.reaction_count = Number(post.reaction_count || 0) + 1;
        }
        post.userReaction = emoji;
        writeLocalReactionState(post.id, {
          emoji: post.userReaction,
          count: post.reaction_count
        });

        if (activeUser && sb && !String(post.id).startsWith('local-')) {
          await sb.from('post_reactions').upsert(
            { post_id: post.id, user_id: activeUser.id, reaction_emoji: emoji },
            { onConflict: 'post_id,user_id' }
          );
        }
        await syncPostReactionCount(post.id, post.reaction_count);
        renderPostsStream();
      } else if (target.type === 'comment') {
        const list = commentsByPost.get(target.postId) || readLocalComments(target.postId);
        const cmt = list.find(c => c.id === target.commentId);
        if (!cmt) return;

        if (cmt.userReaction === emoji) {
          cmt.userReaction = null;
          cmt.like_count = Math.max(0, Number(cmt.like_count || 0) - 1);
          commentsByPost.set(target.postId, list);
          writeLocalComments(target.postId, list);
          renderPostsStream();
          showToast('Reaction undone');
          return;
        }

        if (!cmt.userReaction) {
          cmt.like_count = Number(cmt.like_count || 0) + 1;
        }
        cmt.userReaction = emoji;
        commentsByPost.set(target.postId, list);
        writeLocalComments(target.postId, list);
        renderPostsStream();
      }
    }

    }

    function bindReactionButton(btnEl, target, fallbackEmoji) {
      let pressTimer = null;
      let wasLongPress = false;

      const startPress = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        wasLongPress = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          wasLongPress = true;
          openReactionPopup(btnEl, target);
        }, 360);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      btnEl.addEventListener('pointerdown', startPress);
      btnEl.addEventListener('pointerup', cancelPress);
      btnEl.addEventListener('pointerleave', cancelPress);
      btnEl.addEventListener('pointercancel', cancelPress);
      btnEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        wasLongPress = true;
        openReactionPopup(btnEl, target);
      });

      btnEl.addEventListener('click', (e) => {
        if (wasLongPress) {
          e.preventDefault();
          wasLongPress = false;
          return;
        }
        if (target.type === 'post') {
          const p = postsList.find(x => x.id === target.postId);
          if (!p) return;
          applyReaction(target, p.userReaction || fallbackEmoji);
        } else if (target.type === 'comment') {
          const list = commentsByPost.get(target.postId) || readLocalComments(target.postId);
          const c = list.find(x => x.id === target.commentId);
          if (!c) return;
          applyReaction(target, c.userReaction || fallbackEmoji);
        }
      });
    }

    async function toggleVoiceRecord(postId, recordBtn, statusLabel, clearBtn) {
      if (!isRecording) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          showToast('Voice recording is not supported on this browser.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceChunks = [];
          recordedVoiceUrl = '';
          recordedVoiceSec = 0;
          recordingPostId = postId;
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) voiceChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(voiceTimer);
            isRecording = false;
            recordBtn.textContent = '30s Voice';
            const blob = new Blob(voiceChunks, { type: 'audio/webm' });
            recordedVoiceUrl = URL.createObjectURL(blob);
            statusLabel.textContent = `Voice ready (${recordedVoiceSec}s)`;
            clearBtn.style.display = 'inline-block';
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.textContent = 'Stop';
          clearBtn.style.display = 'none';
          statusLabel.textContent = '0s / 30s';

          voiceTimer = setInterval(() => {
            recordedVoiceSec += 1;
            statusLabel.textContent = `${recordedVoiceSec}s / 30s`;
            if (recordedVoiceSec >= 30 && mediaRecorder && mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          }, 1000);
        } catch (_) {
          showToast('Microphone access is required for voice comment.');
        }
      } else if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

    async function loadPostsStream() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetPostId = urlParams.get('post');
      const localReactions = readLocalReactionState();
      const sharedSet = readSharedPostsSet();
      const map = new Map();

      if (sb) {
        try {
          const { data: rows, error } = await sb
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(30);

          if (!error && Array.isArray(rows)) {
            rows.forEach(r => {
              const locR = localReactions[r.id];
              const dbCount = Number(r.reaction_count || 0);
              const resolvedCount = Math.max(dbCount, Number(locR?.count || 0));
              const resolvedShare = Math.max(Number(r.share_count || 0), Number(sharedSet[r.id] || 0));

              map.set(r.id, {
                id: r.id,
                author_name: String(r.author_name || '').trim(),
                caption: String(r.caption || '').trim(),
                is_bold: Boolean(r.is_bold),
                media_url: String(r.media_url || '').trim(),
                is_video: String(r.media_type || '').startsWith('video'),
                reaction_count: resolvedCount,
                comment_count: Number(r.comment_count || 0),
                share_count: resolvedShare,
                view_count: Number(r.view_count || 0),
                created_at: r.created_at || new Date().toISOString(),
                userReaction: locR?.emoji || null,
                _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, r.id),
                _commentsOpen: Boolean(targetPostId && targetPostId === r.id)
              });
            });
          }

          if (activeUser && map.size > 0) {
            const { data: myReactions } = await sb
              .from('post_reactions')
              .select('post_id, reaction_emoji')
              .eq('user_id', activeUser.id)
              .in('post_id', Array.from(map.keys()));

            (myReactions || []).forEach(mr => {
              const p = map.get(mr.post_id);
              if (p) {
                p.userReaction = mr.reaction_emoji;
                writeLocalReactionState(p.id, {
                  emoji: p.userReaction,
                  count: p.reaction_count
                });
              }
            });
          }
        } catch (_) {}
      }

      if (map.size === 0) {
        const q1 = JSON.parse(localStorage.getItem('autro_instant_feed_posts') || '[]');
        const q2 = JSON.parse(localStorage.getItem('autro_post_cards') || '[]');
        [...q1, ...q2].forEach(item => {
          if (!item) return;
          const id = item.id || `local-${Math.random().toString(36).slice(2, 8)}`;
          const locR = localReactions[id];
          const baseCount = Number(item.reaction_count ?? item.reactions ?? 0);
          const baseShare = Number(item.share_count ?? item.shares ?? 0);

          map.set(id, {
            id,
            author_name: String(item.author_name || '').trim(),
            caption: String(item.caption || '').trim(),
            is_bold: Boolean(item.is_bold),
            media_url: String(item.media_url || '').trim(),
            is_video: Boolean(item.is_video),
            reaction_count: Math.max(baseCount, Number(locR?.count || 0)),
            comment_count: Number(item.comment_count ?? item.comments ?? 0),
            share_count: Math.max(baseShare, Number(sharedSet[id] || 0)),
            view_count: Number(item.view_count ?? item.views ?? 0),
            created_at: item.created_at || item.posted_at || new Date().toISOString(),
            userReaction: locR?.emoji || null,
            _sharedOnce: Object.prototype.hasOwnProperty.call(sharedSet, id),
            _commentsOpen: Boolean(targetPostId && targetPostId === id)
          });
        });
      }

      let arr = Array.from(map.values());
      if (targetPostId && map.has(targetPostId)) {
        const focused = map.get(targetPostId);
        arr = [focused, ...arr.filter(x => x.id !== targetPostId)];
      }

      postsList = arr;
      renderPostsStream();
    }

    function subscribeRealtimePosts() {
      if (!sb || typeof sb.channel !== 'function') return;
      try {
        sb.channel('autro-post-card-live')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, (payload) => {
            const row = payload.new || payload.old;
            if (!row || !row.id) return;
            if (payload.eventType === 'DELETE') {
              postsList = postsList.filter(p => p.id !== row.id);
              renderPostsStream();
              return;
            }
            const existing = postsList.find(p => p.id === row.id);
            if (existing) {
              existing.author_name = String(row.author_name ?? existing.author_name ?? '').trim();
              existing.caption = String(row.caption ?? existing.caption ?? '').trim();
              existing.reaction_count = Math.max(existing.reaction_count, Number(row.reaction_count ?? 0));
              existing.comment_count = Number(row.comment_count ?? existing.comment_count ?? 0);
              existing.share_count = Math.max(existing.share_count, Number(row.share_count ?? 0));
              existing.view_count = Math.max(existing.view_count, Number(row.view_count ?? 0));
              renderPostsStream();
            } else if (payload.eventType === 'INSERT') {
              postsList.unshift({
                id: row.id,
                author_name: String(row.author_name || '').trim(),
                caption: String(row.caption || '').trim(),
                is_bold: Boolean(row.is_bold),
                media_url: String(row.media_url || '').trim(),
                is_video: String(row.media_type || '').startsWith('video'),
                reaction_count: Number(row.reaction_count || 0),
                comment_count: Number(row.comment_count || 0),
                share_count: Number(row.share_count || 0),
                view_count: Number(row.view_count || 0),
                created_at: row.created_at || new Date().toISOString(),
                userReaction: null,
                _sharedOnce: false,
                _commentsOpen: false
              });
              renderPostsStream();
            }
          })
          .subscribe();
      } catch (_) {}
    }

    document.getElementById('shareToChatOption').addEventListener('click', () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      sessionStorage.setItem('autro_shared_post_payload', JSON.stringify({
        postId: activeSharePost.id,
        url: postUrl,
        caption: activeSharePost.caption || '',
        assets: ['autro-chat.html', 'autro-chat.css', 'autro-chat.js']
      }));
      closeShareMenu();
      window.location.href = `autro-chat.html?share=${encodeURIComponent(postUrl)}&assets=autro-chat.html,autro-chat.css,autro-chat.js`;
    });

    document.getElementById('copyPostLinkOption').addEventListener('click', async () => {
      if (!activeSharePost) return;
      const postUrl = buildPostShareUrl(activeSharePost.id);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(postUrl);
        } else {
          const tmp = document.createElement('textarea');
          tmp.value = postUrl;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand('copy');
          tmp.remove();
        }
        showToast('Link copied');
      } catch (_) {
        showToast('Could not copy link');
      }
      closeShareMenu();
    });

    document.getElementById('saveCommentOption').addEventListener('click', async () => {
      if (!activeCommentMenuData) return;
      const savedList = JSON.parse(localStorage.getItem('autro_saved_items') || '[]');
      savedList.unshift({
        type: 'comment',
        postId: activeCommentMenuData.postId,
        comment: activeCommentMenuData.comment,
        savedAt: new Date().toISOString()
      });
      localStorage.setItem('autro_saved_items', JSON.stringify(savedList));

      if (sb && activeUser && !String(activeCommentMenuData.comment.id).startsWith('cmt-')) {
        try {
          await sb.from('saved_items').insert({
            user_id: activeUser.id,
            post_id: String(activeCommentMenuData.postId).startsWith('local-') ? null : activeCommentMenuData.postId,
            comment_id: activeCommentMenuData.comment.id
          });
        } catch (_) {}
      }

      closeDotsMenu();
      showToast('Saved to save-item.html');
      window.location.href = 'save-item.html';
    });

    document.getElementById('reportCommentOption').addEventListener('click', openReportModal);
    document.getElementById('closeReportBtn').addEventListener('click', closeReportModal);
    document.getElementById('submitReportBtn').addEventListener('click', () => submitReportAction('Submit'));
    document.getElementById('sendReportBtn').addEventListener('click', () => submitReportAction('Send'));

    document.addEventListener('click', (e) => {
      if (ignoreNextDocumentClick) {
        ignoreNextDocumentClick = false;
        return;
      }
      const popup = document.getElementById('reactionPopup');
      if (popup.classList.contains('open') && !popup.contains(e.target)) {
        closeReactionPopup();
      }
      const sMenu = document.getElementById('shareMenu');
      if (sMenu.classList.contains('open') && !sMenu.contains(e.target)) {
        closeShareMenu();
      }
      const dMenu = document.getElementById('dotsMenu');
      if (dMenu.classList.contains('open') && !dMenu.contains(e.target)) {
        closeDotsMenu();
      }
    });

    setInterval(refreshLiveTimersOnly, 1000);

    window.addEventListener('DOMContentLoaded', async () => {
      await loadSessionAndProfile();
      await loadPostsStream();
      subscribeRealtimePosts();
    });
  </script>
</body>
