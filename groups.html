<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Groups — Autrobook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Groups CSS Link -->
  <link rel="stylesheet" href="css/groups.css">
</head>
<body>

  <!-- TOP NAV -->
  <header class="top-nav">
    <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
    <h2>Groups</h2>
    <div class="nav-actions">
      <button class="icon-btn" onclick="openModal('mCreateGroup')"><i class="fas fa-plus"></i></button>
    </div>
  </header>

  <div class="groups-container">
    
    <!-- SEARCH BAR -->
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="groupSearchInput" placeholder="Search groups..." oninput="filterGroups()">
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('myGroups', this)">Your Groups</button>
      <button class="tab-btn" onclick="switchTab('discover', this)">Discover</button>
    </div>

    <!-- CONTENT CONTAINER -->
    <div id="groupsContent">
      <!-- Content is dynamically rendered via JS -->
    </div>

  </div>

  <!-- FOOTER DYNAMIC YEAR -->
  <div class="footer-text">
    Live • @ <span id="dynamicYear"></span> Autrobook Version 1
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="bn-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i></div>
    <div class="bn-item" onclick="window.location.href='friends.html'"><i class="fas fa-user-friends"></i></div>
    <div class="bn-item active"><i class="fas fa-users"></i></div>
    <div class="bn-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i></div>
    <div class="bn-item" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i></div>
  </nav>

  <!-- ==================== CREATE GROUP MODAL ==================== -->
  <div class="modal-back" id="mCreateGroup">
    <div class="modal">
      <h3>Create Group <i class="fas fa-times" onclick="closeModal('mCreateGroup')"></i></h3>
      <div class="form-group">
        <label>Group Name</label>
        <input type="text" id="newGroupName" placeholder="Enter group name">
      </div>
      <div class="form-group">
        <label>Privacy</label>
        <select id="newGroupPrivacy">
          <option value="Public">Public (Anyone can join)</option>
          <option value="Private">Private (Only invited members)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Cover Photo</label>
        <input type="file" accept="image/*">
      </div>
      <button class="btn btn-primary" onclick="createGroup()"><i class="fas fa-users"></i> Create Group</button>
    </div>
  </div>

  <!-- Main JS Link -->
  <script src="js/groups.js"></script>
</body>
</html>
