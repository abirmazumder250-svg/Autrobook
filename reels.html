<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Reels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="reels.css">
<link rel="stylesheet" href="CommentSection.css">
<link rel="stylesheet" href="react.css">
<link rel="stylesheet" href="report.css">
</head>
<body>

<!-- BACK BUTTON -->
<button class="back-btn" onclick="goBackToHome()">← Back</button>

<!-- TOP BAR -->
<header class="reels-topbar">
  <div class="top-left">
    <h1 class="logo">Autrobook <span>Reels</span></h1>
  </div>
  <div class="top-right">
    <button class="theme-btn" onclick="toggleTheme()" title="Change Theme"><i class="fas fa-circle-half-stroke"></i></button>
    <button class="upload-btn" onclick="triggerAiUpload()"><i class="fas fa-plus"></i> Upload</button>
    <input type="file" id="reelUploadInput" accept="video/*" style="display:none;" onchange="handleReelUpload(event)">
  </div>
</header>

<!-- SEARCH -->
<div class="reels-search">
  <input type="text" id="reelSearchInput" placeholder="Search reels, people..." oninput="searchReels(this.value)">
  <button onclick="searchReels(document.getElementById('reelSearchInput').value)"><i class="fas fa-search"></i></button>
</div>

<!-- TABS -->
<div class="reels-tabs">
  <button class="tab-btn active" onclick="filterReels('all', this)">All Reels</button>
  <button class="tab-btn" onclick="filterReels('following', this)">Following</button>
  <button class="tab-btn" onclick="filterReels('saved', this)">Saved</button>
  <button class="tab-btn" onclick="filterReels('mine', this)">My Reels</button>
</div>

<!-- REELS FEED - JS RENDERS HERE -->
<main id="reelsContainer" class="reels-feed">
  <!-- Loading -->
  <div class="loading-card">Loading Reels...</div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html"><i class="fas fa-house"></i><span>Home</span></a>
  <a href="reels.html" class="active"><i class="fas fa-clapperboard"></i><span>Reels</span></a>
  <a href="CommentSection.html"><i class="fas fa-comment"></i><span>Comments</span></a>
  <a href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
  <a href="report.html"><i class="fas fa-flag"></i><span>Reports</span></a>
</nav>

<!-- THREE DOT OPTIONS MODAL -->
<div id="mReelOptions" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Reel Options</h3>
      <button class="close-btn" onclick="closeModal('mReelOptions')">✕</button>
    </div>

    <!-- Resolution + Sound - Controlled by reels.js -->
    <div class="option-group">
      <label>Resolution</label>
      <select id="resolutionScaler" onchange="changeResolutionProfile()">
        <option value="4K">4K Quad</option>
        <option value="8K">8K Cinema</option>
        <option value="16K">16K Neural</option>
      </select>
    </div>

    <div class="option-group switch-row">
      <label><i class="fas fa-volume-high"></i> Enhance Sound 200%</label>
      <label class="switch">
        <input type="checkbox" id="soundEnhanceToggle" onchange="toggleSoundEnhancement()">
        <span class="slider"></span>
      </label>
    </div>

    <div id="reelActionsMenu" class="menu-actions">
      <!-- JS fills this: Save / Download / Share / Report / Delete -->
    </div>
  </div>
</div>

<!-- REPORT MODAL - JS BUILDS CONTENT DYNAMICALLY -->
<div id="mReelReport" class="modal">
  <div class="modal-content">
    <h3>Report Reel</h3>
    <p>Select a reason.</p>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- SCRIPTS - ORDER MATTERS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/CommentSection.js"></script>
<script src="js/react.js"></script>
<script src="js/report.js"></script>
<script src="js/reels.js"></script>
</body>
</html>
