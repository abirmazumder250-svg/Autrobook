<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reels — Autrobook AI</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/reels.css">
</head>
<body>

<header class="topbar">
  <div class="brand" onclick="window.location.href='index.html'">
    <img src="logo.png" alt="Autrobook" class="logo-img" onerror="this.style.display='none'">
    <span class="brand-name">Autrobook</span>
  </div>
  <div class="top-title">AI Enhance Reels</div>
  <div class="top-actions">
    <button class="icon-btn" onclick="triggerAiUpload()" title="Upload & Enhance (4K-16K)"><i class="fas fa-wand-magic-sparkles"></i></button>
    <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
  </div>
</header>

<div class="reels-wrapper">
  <div class="reels-container" id="reelsContainer">
    <!-- Reels dynamically injected -->
  </div>
</div>

<!-- Context Options Modal -->
<div class="modal-back" id="mReelOptions">
  <div class="modal">
    <h3>Reel Options <i class="fas fa-times close-x" onclick="closeModal('mReelOptions')"></i></h3>
    
    <div class="enhance-menu-section">
      <h4><i class="fas fa-gear"></i> AI Media Controls</h4>
      <div class="enhance-control-row">
        <span>AI Resolution Scaler</span>
        <select id="resolutionScaler" onchange="changeResolutionProfile()">
          <option value="4K">4K Quad Ultra</option>
          <option value="8K">8K Cinema Profile</option>
          <option value="16K">16K Neural Reality</option>
        </select>
      </div>
      <div class="enhance-control-row">
        <span>Enhance Sound (100% - 200%)</span>
        <label class="switch">
          <input type="checkbox" id="soundEnhanceToggle" onchange="toggleSoundEnhancement()">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <div class="modal-actions-list" id="reelActionsMenu">
      
    </div>
  </div>
</div>

<!-- Reason Report Selection Modal -->
<div class="modal-back" id="mReelReport">
  <div class="modal">
    <h3>Report Content <i class="fas fa-times close-x" onclick="closeModal('mReelReport')"></i></h3>
    <div class="form-group">
      <label>Select a valid enforcement audit reason:</label>
      <select id="reelReportReason">
        <option value="Spam / Deceptive Accounts">Spam / Deceptive Accounts</option>
        <option value="Harassment / Hate Speech">Harassment / Bullying / Hate Speech</option>
        <option value="Nudity / Violence / Dangerous content">Nudity / Violence / Dangerous content</option>
      </select>
    </div>
    <button class="btn btn-primary w-100" onclick="submitReelReport()">Submit to Enforcement Review</button>
  </div>
</div>

<div id="toast" class="toast">Action updated</div>

<script src="js/reels.js"></script>
</body>
</html>
