<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Edit Profile - Autrobook</title> <style> 
:root{--bg:#0a1a0f;--card:#13261a;--text:#e4e6eb;--text2:#7a9e80;--brand:#4caf50;--border:#1f3d2a;} 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;} 
body{background:var(--bg); color:var(--text); padding-bottom:60px;} 
.header{display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:var(--card); position:sticky; top:0; z-index:10;} 
.header h2{font-size:18px;} 
.header button{background:var(--brand); border:none; color:white; padding:6px 12px; border-radius:6px; cursor:pointer;} 
.section{background:var(--card); margin:10px; padding:15px; border-radius:10px;} 
.section h3{margin-bottom:10px; font-size:16px;} 
.item{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);} 
.item:last-child{border:none;} 
.item input{flex:1; background:var(--bg); border:none; color:var(--text); padding:5px; outline:none;} 
.switch{width:40px; height:22px; background:#555; border-radius:20px; position:relative; cursor:pointer; transition:0.3s;} 
.switch.on{background:var(--brand);} 
.switch span{width:18px; height:18px; background:white; border-radius:50%; position:absolute; top:2px; left:2px; transition:0.3s;} 
.switch.on span{left:20px;} 
.upload{border:2px dashed var(--border); padding:20px; text-align:center; border-radius:8px; cursor:pointer; position:relative;} 
.upload img{width:100%; max-height:150px; object-fit:cover; border-radius:8px; margin-top:10px;} 
input[type=file]{display:none;} 
</style> </head> <body> 
<div class="header"> <div onclick="window.location.href='profile.html'">←</div> <h2>Edit Profile</h2> <button onclick="saveProfile()">Save</button> </div> 

<div class="section"> 
<h3>Profile Picture</h3> 
<div class="upload" onclick="document.getElementById('profileInput').click()"> 
📷 <span id="profileText">Change Profile Picture</span> 
<img id="profilePreview" style="display:none"> 
</div> 
<input type="file" id="profileInput" accept="image/*" onchange="previewImage(event,'profile')"> 

<h3 style="margin-top:15px;">Cover Photo</h3> 
<div class="upload" onclick="document.getElementById('coverInput').click()"> 
🖼️ <span id="coverText">Change Cover Photo</span> 
<img id="coverPreview" style="display:none"> 
</div> 
<input type="file" id="coverInput" accept="image/*" onchange="previewImage(event,'cover')"> 
</div> 

<div class="section"> 
<h3>Bio</h3> 
<input type="text" id="bio" placeholder="Write something about you..."> 
</div> 

<div class="section"> 
<div class="item"> 
<div><b>Profile Picture Guard</b><br><small style="color:var(--text2)">Prevent others from downloading</small></div> 
<div class="switch" id="guardSwitch" onclick="toggleGuard()"><span></span></div> 
</div> 
</div> 

<div class="section">
<div class="item">
<div><b>Professional Mode</b><br><small style="color:var(--text2)">Get PRO badge on profile</small></div>
<div class="switch" id="proSwitch" onclick="togglePro()"><span></span></div>
</div>
</div>

<div class="section"> 
<h3>Education</h3> 
<div class="item"><span>School/College</span><input type="text" id="school" placeholder="Add School"></div> 
<div class="item"><span>University</span><input type="text" id="university" placeholder="Add University"></div> 
</div> 

<div class="section"> 
<h3>Contact Info</h3> 
<div class="item"><span>Phone</span><input type="text" id="phone" placeholder="01XXXXXXXXX"></div> 
<div class="item"><span>Email</span><input type="text" id="email" placeholder="you@mail.com"></div> 
</div> 

<script> 
let currentUser = JSON.parse(localStorage.getItem('autrobook_user')) || {id:0, name:"You", img:99, username:"you", email:"you@mail.com", bio:"", cover:"", profilePic:"", profileGuard:false, professional:false};

window.onload = () => { 
document.getElementById('bio').value = currentUser.bio || ''; 
document.getElementById('school').value = currentUser.school || ''; 
document.getElementById('university').value = currentUser.university || ''; 
document.getElementById('phone').value = currentUser.phone || ''; 
document.getElementById('email').value = currentUser.email || ''; 

// Load Cover
if(currentUser.cover){ 
document.getElementById('coverPreview').src = currentUser.cover; 
document.getElementById('coverPreview').style.display = 'block'; 
document.getElementById('coverText').style.display = 'none'; 
} 

// Load Profile Pic
if(currentUser.profilePic){ 
document.getElementById('profilePreview').src = currentUser.profilePic; 
document.getElementById('profilePreview').style.display = 'block'; 
document.getElementById('profileText').style.display = 'none'; 
} 

// Load Toggle States
if(currentUser.profileGuard === true) document.getElementById('guardSwitch').classList.add('on'); 
if(currentUser.professional === true) document.getElementById('proSwitch').classList.add('on'); 
} 

function previewImage(event, type){ 
const file = event.target.files[0]; 
if(!file) return;
const reader = new FileReader(); 
reader.onload = function(e){ 
if(type=='profile'){ 
document.getElementById('profilePreview').src = e.target.result; 
document.getElementById('profilePreview').style.display = 'block'; 
document.getElementById('profileText').style.display = 'none'; 
currentUser.profilePic = e.target.result;
saveToLocal(); // instant save
} 
if(type=='cover'){ 
document.getElementById('coverPreview').src = e.target.result; 
document.getElementById('coverPreview').style.display = 'block'; 
document.getElementById('coverText').style.display = 'none'; 
currentUser.cover = e.target.result;
saveToLocal(); // instant save
} 
} 
reader.readAsDataURL(file); 
} 

function toggleGuard(){ 
document.getElementById('guardSwitch').classList.toggle('on'); 
currentUser.profileGuard = document.getElementById('guardSwitch').classList.contains('on');
saveToLocal(); // instant save
} 

function togglePro(){
document.getElementById('proSwitch').classList.toggle('on');
currentUser.professional = document.getElementById('proSwitch').classList.contains('on');
saveToLocal(); // instant save
}

function saveToLocal(){
localStorage.setItem('autrobook_user', JSON.stringify(currentUser));
}

function saveProfile(){ 
currentUser.bio = document.getElementById('bio').value; 
currentUser.school = document.getElementById('school').value; 
currentUser.university = document.getElementById('university').value; 
currentUser.phone = document.getElementById('phone').value; 
currentUser.email = document.getElementById('email').value; 

saveToLocal();
alert('Saved ✅'); 
window.location.href = 'profile.html'; 
} 
</script> 
</body> 
</html>
