<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends - Autrobook</title>
<style>
  :root{--bg:#18191a;--card:#242526;--text:#e4e6eb;--text2:#b0b3b8;--border:#3a3b3c;--brand:#1877f2;}
  body.light{--bg:#f0f2f5;--card:#ffffff;--text:#050505;--text2:#65676b;--border:#ddd;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
  body{background:var(--bg);color:var(--text); padding:10px;}
  .header{display:flex;align-items:center;gap:15px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:10;}
  .header b{font-size:20px; flex:1;}
  .friend-item{display:flex; gap:12px; padding:12px; background:var(--card); border-radius:8px; margin:8px 0; align-items:center;}
  .friend-item img{width:60px; height:60px; border-radius:50%; background:#555;}
  .btn{padding:6px 12px; background:var(--brand); color:white; border:none; border-radius:6px; cursor:pointer;}
  .btn-gray{background:#3a3b3c;}
  .no-data{text-align:center; padding:50px; color:var(--text2);}
</style>
</head>
<body>

<div class="header">
  <span onclick="history.back()" style="font-size:22px">←</span>
  <b>Friends</b>
  <span id="friendTotal">0</span>
</div>

<button class="btn" onclick="addFriend()" style="width:100%; margin:10px 0">➕ Add Test Friend</button>

<div id="friendList"></div>

<script>
function loadFriends(){
  let friends = JSON.parse(localStorage.getItem('my_friends') || '[]');
  document.getElementById('friendTotal').innerText = friends.length + ' Friends';
  
  const container = document.getElementById('friendList');
  
  if(friends.length == 0){
    container.innerHTML = `<div class="no-data">No friends yet<br>Add some friends</div>`;
    return;
  }
  
  container.innerHTML = friends.map((f,i)=>`
    <div class="friend-item">
      <img src="https://via.placeholder.com/60">
      <div style="flex:1">
        <b>${f.name}</b><br>
        <small style="color:var(--text2)">${timeAgo(f.time)}</small>
      </div>
      <button class="btn-gray" onclick="removeFriend(${i})">Remove</button>
    </div>
  `).join('');
}

function addFriend(){
  let friends = JSON.parse(localStorage.getItem('my_friends') || '[]');
  friends.push({name: 'Friend ' + (friends.length+1), time: Date.now()});
  localStorage.setItem('my_friends', JSON.stringify(friends));
  loadFriends();
}

function removeFriend(i){
  let friends = JSON.parse(localStorage.getItem('my_friends') || '[]');
  friends.splice(i,1);
  localStorage.setItem('my_friends', JSON.stringify(friends));
  loadFriends();
}

function timeAgo(t){ return Math.floor((Date.now()-t)/1000/60)+'m ago'; }

loadFriends();
if(localStorage.getItem('theme') == 'light'){document.body.classList.add('light');}
</script>
</body>
</html>
