<!-- ================= AUTROBOOK - stories.html - FULL ================= -->
<!-- Facebook Style Stories - View + Create + Delete + 24h -->

<!-- ===== STORIES ROW ===== -->
<div class="stories" id="storiesRow">
  <!-- My Story - Create -->
  <div class="story" onclick="createMyStory()" style="background:#fff;color:#050505">
    <div style="height:110px;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden">
      <img id="myStoryImg" src="" style="width:100%;height:100%;object-fit:cover;display:none">
      <span id="myStoryPlus" style="font-size:36px;color:#0F5132">➕</span>
    </div>
    <div style="padding:8px;text-align:center">
      <div style="width:32px;height:32px;background:#0F5132;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:-22px auto 4px;border:3px solid #fff;font-size:18px;position:relative">+</div>
      <b style="color:#050505;font-size:12px;position:static">Create Story</b>
    </div>
  </div>
  <div id="storiesList" style="display:flex;gap:10px"></div>
</div>

<!-- ===== STORY VIEWER MODAL ===== -->
<div id="storyViewer" class="modal" style="padding-top:0;align-items:center">
  <div style="width:100%;max-width:400px;height:92vh;background:#000;border-radius:14px;position:relative;overflow:hidden">
    <img id="storyViewImg" src="" style="width:100%;height:100%;object-fit:cover;display:none">
    <video id="storyViewVideo" src="" style="width:100%;height:100%;object-fit:cover;display:none" controls autoplay loop></video>
    <div id="storyViewText" style="position:absolute;top:45%;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:bold;padding:20px;display:none"></div>

    <!-- Top Bar -->
    <div style="position:absolute;top:0;left:0;right:0;padding:10px;display:flex;gap:8px;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);z-index:5">
      <div style="flex:1;height:4px;background:rgba(255,255,255,.4);border-radius:4px;overflow:hidden"><div id="storyProgress" style="height:100%;background:#fff;width:0%"></div></div>
      <div class="ava" id="storyViewAva" style="width:34px;height:34px;font-size:13px">S</div>
      <b id="storyViewName" style="color:#fff;font-size:13px;flex:1">Sadia</b>
      <span style="color:#fff;font-size:12px" id="storyViewTime">2h</span>
      <span onclick="closeStoryViewer()" style="color:#fff;font-size:22px;cursor:pointer;padding:0 6px">✖</span>
    </div>

    <!-- Bottom Bar -->
    <div style="position:absolute;bottom:0;left:0;right:0;padding:12px;display:flex;gap:8px;align-items:center;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);z-index:5">
      <input id="storyReplyIn" placeholder="Reply to story..." style="margin:0;background:rgba(255,255,255,.2);color:#fff;border:1px solid #fff" onkeydown="if(event.key==='Enter')sendStoryReply()">
      <span onclick="likeStory()" style="font-size:26px;cursor:pointer" id="storyLikeBtn">🤍</span>
      <span onclick="sendStoryReply()" style="font-size:22px;cursor:pointer">💬</span>
      <span onclick="deleteMyStory()" id="storyDeleteBtn" style="font-size:20px;cursor:pointer;display:none">🗑️</span>
      <span onclick="shareStory()" style="font-size:20px;cursor:pointer">↗️</span>
    </div>

    <!-- Left / Right Click -->
    <div onclick="prevStory()" style="position:absolute;left:0;top:50%;width:30%;height:60%;z-index:4;cursor:pointer"></div>
    <div onclick="nextStory()" style="position:absolute;right:0;top:50%;width:30%;height:60%;z-index:4;cursor:pointer"></div>
  </div>
</div>

<!-- ===== CREATE STORY MODAL ===== -->
<div id="createStoryModal" class="modal">
  <div class="mBox">
    <h3>➕ Create Story</h3>
    <div style="margin:10px 0">
      <div onclick="document.getElementById('storyFileIn').click()" style="height:180px;background:var(--input);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden">
        <img id="storyPreviewImg" src="" style="width:100%;height:100%;object-fit:cover;display:none">
        <span id="storyPreviewPlus" style="font-size:40px">📷</span>
        <p id="storyPreviewTxt" style="font-size:13px;color:var(--sub)">Tap to add Photo / Video</p>
      </div>
      <input type="file" id="storyFileIn" accept="image/*,video/*" style="display:none" onchange="previewStoryFile(this)">
    </div>
    <label>Story Text (Optional)</label>
    <input id="storyTextIn" placeholder="Write something... ✨">
    <label>Text Color</label>
    <div style="display:flex;gap:8px">
      <span class="chip on" onclick="setStoryColor('#ffffff',this)">White</span>
      <span class="chip" onclick="setStoryColor('#ffcc00',this)">Yellow</span>
      <span class="chip" onclick="setStoryColor('#ff3b30',this)">Red</span>
      <span class="chip" onclick="setStoryColor('#1877F2',this)">Blue</span>
      <span class="chip" onclick="setStoryColor('#0F5132',this)">Green</span>
    </div>
    <label>Background</label>
    <div style="display:flex;gap:8px">
      <span class="chip on" onclick="setStoryBg('linear-gradient(135deg,#0F5132,#000)',this)">Green</span>
      <span class="chip" onclick="setStoryBg('linear-gradient(135deg,#1877F2,#9B30FF)',this)">Blue-Purple</span>
      <span class="chip" onclick="setStoryBg('linear-gradient(135deg,#ff3b30,#ffcc00)',this)">Red-Yellow</span>
      <span class="chip" onclick="setStoryBg('#000',this)">Black</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="postStory()" style="flex:1">Post Story ✅</button>
      <button class="btn2" onclick="closeModal('createStoryModal')" style="flex:1">Cancel</button>
    </div>
    <p style="font-size:11px;color:var(--sub);margin-top:8px;text-align:center">Story 24 hours por auto delete hobe • Scanner check korbe</p>
  </div>
</div>

<script>
/* ===== STORIES LOGIC - stories.html ===== */
let storiesData = JSON.parse(localStorage.getItem('autro_stories') || '[]');
let currentStoryIndex = 0;
let storyTimer = null;
let storyColor = '#ffffff';
let storyBg = 'linear-gradient(135deg,#0F5132,#000)';
let storyFileData = '';

if(!storiesData.length){
  storiesData = [
    {name:'Sadia Afrin', img:'https://picsum.photos/300/500?1', text:'', type:'img', time:'2h', liked:false, views:125},
    {name:'Rahim Uddin', img:'https://picsum.photos/300/500?2', text:'', type:'img', time:'4h', liked:false, views:89},
    {name:'Mim Akter', img:'', text:'Good Morning! ✨', type:'text', time:'1h', liked:false, views:210},
    {name:'Arif Hossain', img:'https://picsum.photos/300/500?4', text:'Gaming Time 🎮', type:'img', time:'6h', liked:false, views:67},
    {name:'Nusrat Jahan', img:'https://picsum.photos/300/500?5', text:'', type:'img', time:'8h', liked:false, views:154}
  ];
  localStorage.setItem('autro_stories', JSON.stringify(storiesData));
}

function setStoryColor(c, el){
  storyColor = c;
  document.querySelectorAll('#createStoryModal .chip').forEach(ch=>ch.classList.remove('on'));
  if(el) el.classList.add('on');
}
function setStoryBg(b, el){
  storyBg = b;
  if(el) el.classList.add('on');
}

function renderStories(){
  let box = document.getElementById('storiesList');
  if(!box) return;
  box.innerHTML = storiesData.map((s,i)=>`
    <div class="story" onclick="openStoryViewer(${i})" style="${s.type==='text' ? `background:${storyBg}` : ''}">
      ${s.type==='text' ? `<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-weight:bold;font-size:16px;color:${storyColor}">${s.text}</div>` : `<img src="${s.img}">`}
      <div class="sAva">${s.name[0]}</div>
      <b>${s.name} • ${s.views} views</b>
    </div>
  `).join('');
  // My Story Img
  let my = storiesData.find(s=>s.name==='You');
  if(my && my.img){
    let mi = document.getElementById('myStoryImg');
    if(mi){ mi.src = my.img; mi.style.display='block'; document.getElementById('myStoryPlus').style.display='none'; }
  }
}

function createMyStory(){
  // Jodi amar story thake - View koro, na thakle Create koro
  let idx = storiesData.findIndex(s=>s.name==='You');
  if(idx >= 0){
    openStoryViewer(idx);
  } else {
    openModal('createStoryModal');
  }
}

function previewStoryFile(input){
  let file = input.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(e){
    storyFileData = e.target.result;
    let prev = document.getElementById('storyPreviewImg');
    prev.src = storyFileData;
    prev.style.display = 'block';
    document.getElementById('storyPreviewPlus').style.display = 'none';
    document.getElementById('storyPreviewTxt').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function postStory(){
  let txt = document.getElementById('storyTextIn').value.trim();
  if(!storyFileData && !txt){
    toast('Photo or Text dao! 📷');
    return;
  }
  // Scanner Check - Kharap word thakle block
  let bad = ['sex','porn','nude','xxx','kill','hate'];
  let check = (txt + ' ' + storyFileData).toLowerCase();
  if(bad.some(w=>check.includes(w))){
    toast('❌ Story blocked by Scanner! 24h Review');
    return;
  }
  let newStory = {
    name:'You',
    img: storyFileData || '',
    text: txt || '',
    type: storyFileData ? 'img' : 'text',
    time:'Just now',
    liked:false,
    views:1
  };
  // Purano You story delete kore notun ta upore boshao
  storiesData = storiesData.filter(s=>s.name!=='You');
  storiesData.unshift(newStory);
  localStorage.setItem('autro_stories', JSON.stringify(storiesData));
  storyFileData = '';
  document.getElementById('storyTextIn').value = '';
  document.getElementById('storyPreviewImg').style.display = 'none';
  document.getElementById('storyPreviewPlus').style.display = 'block';
  document.getElementById('storyPreviewTxt').style.display = 'block';
  closeModal('createStoryModal');
  renderStories();
  toast('Story Posted ✅');
}

function openStoryViewer(i){
  currentStoryIndex = i;
  let s = storiesData[i];
  if(!s) return;
  document.getElementById('storyViewer').style.display = 'flex';
  document.getElementById('storyViewName').innerText = s.name;
  document.getElementById('storyViewAva').innerText = s.name[0];
  document.getElementById('storyViewTime').innerText = s.time;
  document.getElementById('storyLikeBtn').innerText = s.liked ? '❤️' : '🤍';
  document.getElementById('storyDeleteBtn').style.display = (s.name==='You') ? 'block' : 'none';

  let imgEl = document.getElementById('storyViewImg');
  let vidEl = document.getElementById('storyViewVideo');
  let txtEl = document.getElementById('storyViewText');
  imgEl.style.display = 'none'; vidEl.style.display = 'none'; txtEl.style.display = 'none';
  vidEl.pause();

  if(s.type==='text'){
    txtEl.innerText = s.text;
    txtEl.style.display = 'block';
    txtEl.style.color = storyColor;
  } else if(s.img && s.img.includes('video')){
    vidEl.src = s.img; vidEl.style.display = 'block'; vidEl.play();
  } else {
    imgEl.src = s.img; imgEl.style.display = 'block';
  }

  // Progress + Auto Next - 5 sec
  let prog = document.getElementById('storyProgress');
  prog.style.width = '0%';
  clearInterval(storyTimer);
  let w = 0;
  storyTimer = setInterval(()=>{
    w += 2;
    prog.style.width = w + '%';
    if(w >= 100){ clearInterval(storyTimer); nextStory(); }
  }, 100);
  // Views baro
  s.views = (s.views||0) + 1;
  localStorage.setItem('autro_stories', JSON.stringify(storiesData));
  renderStories();
}

function nextStory(){
  clearInterval(storyTimer);
  if(currentStoryIndex < storiesData.length - 1){
    openStoryViewer(currentStoryIndex + 1);
  } else {
    closeStoryViewer();
  }
}
function prevStory(){
  clearInterval(storyTimer);
  if(currentStoryIndex > 0){
    openStoryViewer(currentStoryIndex - 1);
  }
}
function closeStoryViewer(){
  clearInterval(storyTimer);
  document.getElementById('storyViewer').style.display = 'none';
  let v = document.getElementById('storyViewVideo');
  if(v) v.pause();
}

function likeStory(){
  let s = storiesData[currentStoryIndex];
  if(!s) return;
  s.liked = !s.liked;
  document.getElementById('storyLikeBtn').innerText = s.liked ? '❤️' : '🤍';
  localStorage.setItem('autro_stories', JSON.stringify(storiesData));
  toast(s.liked ? '❤️ Liked' : 'Unliked');
}

function sendStoryReply(){
  let inp = document.getElementById('storyReplyIn');
  let txt = inp.value.trim();
  if(!txt){ toast('Reply lekho! 💬'); return; }
  toast('Reply sent ✅');
  inp.value = '';
}

function deleteMyStory(){
  let s = storiesData[currentStoryIndex];
  if(!s || s.name!=='You') return;
  if(!confirm('Story delete korba?')) return;
  storiesData.splice(currentStoryIndex, 1);
  localStorage.setItem('autro_stories', JSON.stringify(storiesData));
  closeStoryViewer();
  renderStories();
  toast('Story deleted 🗑️');
}

function shareStory(){
  let s = storiesData[currentStoryIndex];
  toast('Story shared ↗️ ' + (s ? s.name : ''));
}

// Load hole render koro
setTimeout(renderStories, 100);
</script>
