<!-- ================= AUTROBOOK - pages/06-reels-editor.html ================= -->
<!-- Create Reels Page -->

<div class="card">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:15px">
    <button onclick="navigateTo('pages/05-reels.html')" style="background:none !important;color:var(--text) !important;font-size:24px;padding:0">←</button>
    <h3 style="margin:0">Create Reel</h3>
  </div>

  <!-- Video Upload Area -->
  <div id="uploadArea" onclick="document.getElementById('videoInput').click()" 
       style="border:2px dashed var(--border);border-radius:12px;height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;background:var(--bg)">
    <div style="font-size:50px">🎬</div>
    <h4>Tap to upload video</h4>
    <p style="color:var(--text-secondary);font-size:14px">MP4, MOV. Max 60 seconds</p>
    <input type="file" id="videoInput" accept="video/*" style="display:none">
  </div>

  <!-- Video Preview -->
  <div id="videoPreview" style="display:none;position:relative">
    <video id="previewVideo" controls style="width:100%;border-radius:12px;max-height:500px;background:black"></video>
    <button onclick="removeVideo()" style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6) !important;padding:5px 10px;border-radius:50%">×</button>
    
    <!-- Quality Selector -->
    <div style="margin-top:10px">
      <label style="font-weight:600">Quality:</label>
      <select id="qualitySelect" style="margin-left:10px">
        <option value="1080p">1080p HD</option>
        <option value="4k">4K Ultra HD</option>
      </select>
    </div>
  </div>

  <!-- Caption + Settings -->
  <div id="reelSettings" style="display:none;margin-top:15px">
    <textarea id="reelCaption" placeholder="Write a caption... #trending" rows="3"></textarea>
    
    <div style="display:flex;gap:10px;margin-top:10px">
      <label style="display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="enhanceSound"> Enhance Sound 150%
      </label>
    </div>

    <button onclick="postReel()" style="width:100%;margin-top:15px">Post Reel</button>
  </div>

</div>

<script>
const videoInput = document.getElementById('videoInput');
const uploadArea = document.getElementById('uploadArea');
const videoPreview = document.getElementById('videoPreview');
const previewVideo = document.getElementById('previewVideo');
const reelSettings = document.getElementById('reelSettings');

videoInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(!file) return;
  
  const videoURL = URL.createObjectURL(file);
  previewVideo.src = videoURL;
  
  uploadArea.style.display = 'none';
  videoPreview.style.display = 'block';
  reelSettings.style.display = 'block';
});

function removeVideo() {
  previewVideo.src = '';
  videoInput.value = '';
  uploadArea.style.display = 'flex';
  videoPreview.style.display = 'none';
  reelSettings.style.display = 'none';
}

function postReel() {
  const caption = document.getElementById('reelCaption').value;
  const quality = document.getElementById('qualitySelect').value;
  const enhanceSound = document.getElementById('enhanceSound').checked;
  
  if(!previewVideo.src) {
    alert('Please select a video first!');
    return;
  }
  
  alert(`Reel Posted!\nCaption: ${caption}\nQuality: ${quality}\nEnhanced Sound: ${enhanceSound ? 'ON' : 'OFF'}`);
  
  // Navigate back to reels page
  navigateTo('pages/05-reels.html');
}
</script>
