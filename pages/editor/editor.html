<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CapCut Style Photo Editor</title>
    <link rel="stylesheet" href="../global/global.css">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <div class="editor-container">
        <div class="canvas-preview" id="photoPreview"></div>
        <div class="filter-toolbar">
            <button class="primary-btn" onclick="applyFilter('vivid')">Vivid</button>
            <button class="primary-btn" onclick="applyFilter('noir')">Noir</button>
            <button class="primary-btn" onclick="applyFilter('emerald')">Emerald</button>
        </div>
    </div>
    <script src="editor.js"></script>
</body>
</html>
