<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost Mode - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="ghost.css">
</head>
<body>
    <div class="ghost-container">
        <span class="ghost-icon">👻</span>
        <h2>Ghost Mode (Incognito)</h2>
        <p>Browse feeds, stories, and profiles completely anonymously without leaving any digital footprint.</p>
        
        <div class="toggle-wrapper">
            <span>Enable Ghost Status</span>
            <label class="switch">
                <input type="checkbox" id="ghostToggle" onchange="toggleGhostMode(this)">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="status-msg" id="ghostStatus">Status: Inactive (Standard Browsing)</div>
    </div>
    <script src="ghost.js"></script>
</body>
</html>
