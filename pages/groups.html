<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="groups.css">
</head>
<body>

    <div class="navbar">
        <h2>Autrobook Groups</h2>
        <button class="primary-btn" onclick="openCreateGroupModal()">+ Create Group</button>
    </div>

    <div class="groups-container">
        
        <!-- Group Header Cover Section -->
        <div class="group-header-card">
            <div class="group-cover-photo"></div>
            <div class="group-info-section">
                <div class="group-details">
                    <h1>Web Developers Community 💻</h1>
                    <p>12.5K Members · 45 posts a day</p>
                </div>
                <button class="primary-btn" id="joinGroupBtn" onclick="toggleGroupJoin()">Joined ✓</button>
            </div>
        </div>

        <!-- Group Navigation Tabs -->
        <div class="group-tabs">
            <button class="tab-btn active" onclick="switchGroupTab('discussion')">Discussion</button>
            <button class="tab-btn" onclick="switchGroupTab('members')">Members</button>
            <button class="tab-btn" onclick="switchGroupTab('media')">Media</button>
        </div>

        <!-- Create Post Box Inside Group -->
        <div class="card create-group-post">
            <div class="post-input-wrapper">
                <div class="avatar"></div>
                <input type="text" placeholder="Write something to this group..." id="groupPostInput">
            </div>
            <div class="group-post-actions">
                <button class="action-btn">📷 Photo/Video</button>
                <button class="action-btn" onclick="insertGroupSticker('🔥')">🔥 Sticker</button>
                <button class="primary-btn" onclick="submitGroupPost()">Post</button>
            </div>
        </div>

        <!-- Group Discussion Feed -->
        <div id="groupFeed" class="group-feed">
            <div class="card post-card">
                <div class="post-header">
                    <div class="avatar"></div>
                    <div>
                        <h4 class="author">Abir Mazumder</h4>
                        <span class="timestamp">3 hrs ago · 🌐 Public Group</span>
                    </div>
                </div>
                <div class="post-content">
                    Welcome everyone to the Autrobook Web Developers Group! Share your thoughts, code snippets, and voice comments here. 🚀
                </div>
                <div class="post-actions">
                    <button class="interaction-btn" onclick="playLikeSound()">👍 Like</button>
                    <button class="interaction-btn">💬 Comment</button>
                    <button class="interaction-btn">↩️ Share</button>
                </div>
            </div>
        </div>

    </div>

    <script src="groups.js"></script>
</body>
</html>
