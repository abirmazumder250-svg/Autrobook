<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Cricket - Autrobook</title>
    <style>
        body { background: #0d1b12; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .game-box { max-width: 400px; margin: 20px auto; background: #13261a; padding: 20px; border-radius: 12px; border: 1px solid #1f3d2a; }
        .pitch { height: 250px; background: #10b981; border-radius: 8px; position: relative; margin: 15px 0; overflow: hidden; }
        .ball { width: 16px; height: 16px; background: #fff; border-radius: 50%; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); transition: 0.1s; }
        .bat { width: 40px; height: 12px; background: #8b4513; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); border-radius: 4px; }
        .btn { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="game-box">
        <h2>🏏 Street Cricket</h2>
        <p>Score: <span id="score">0</span> | Wickets Left: <span id="wickets">3</span></p>
        <div class="pitch">
            <div class="ball" id="ball"></div>
            <div class="bat" id="bat"></div>
        </div>
        <button class="btn" onclick="hitBall()">HIT SHOT 💥</button>
        <p id="commentary" style="margin-top:10px; font-size:14px; color:#9ca3af;">Press Hit when the ball arrives!</p>
    </div>
<script>
let score = 0, wickets = 3;
function hitBall() {
    const ball = document.getElementById('ball');
    const com = document.getElementById('commentary');
    const runs = [0, 1, 2, 4, 6, "OUT!"];
    const outcome = runs[Math.floor(Math.random() * runs.length)];
    
    if (outcome === "OUT!") {
        wickets--;
        document.getElementById('wickets').textContent = wickets;
        com.textContent = "Oh no! Clean bowled! ❌";
        if(wickets === 0) { alert("Game Over! Final Score: " + score); location.reload(); }
    } else {
        score += outcome;
        document.getElementById('score').textContent = score;
        com.textContent = outcome === 6 ? "Massive! That's a 6! 🔥" : `Great shot! ${outcome} runs.`;
    }
}
</script>
</body>
</html>
