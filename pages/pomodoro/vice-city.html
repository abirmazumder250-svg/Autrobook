<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vice City Hub - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="vice-city.css">
</head>
<body>

    <div class="vice-container">
        <div class="vice-banner">
            <h1>🌴 GTA VICE CITY HUB 🌴</h1>
            <p>Welcome to the 80s neon vibe. Listen to Flash FM or explore retro posts!</p>
        </div>

        <!-- Radio Player Box -->
        <div class="card vice-card">
            <h3>📻 Flash FM - 80s Retro Radio</h3>
            <p style="font-size:13px; color:var(--text-secondary); margin-bottom:10px;">Vibe with classic retro synthwave while scrolling.</p>
            <audio controls style="width:100%;">
                <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Mini Retro Vibe Feed -->
        <div class="card vice-card">
            <h3>🕹️ Vice City Community Stream</h3>
            <input type="text" placeholder="Share your Vice City moment..." id="viceInput">
            <button class="primary-btn" style="margin-top:10px; width:100%; background:#db2777;" onclick="postViceVibe()">Broadcast Vibe 🌴</button>
        </div>
    </div>

    <script src="vice-city.js"></script>
</body>
</html>
