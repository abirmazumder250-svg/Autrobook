<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Focus Hub - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="pomodoro.css">
</head>
<body>
    <div class="pomodoro-container">
        <h2>🍅 Focus & Productivity Hub</h2>
        <p>Boost your workflow with synchronized study timers.</p>
        
        <div class="timer-display" id="timerDisplay">25:00</div>
        
        <div class="pomo-controls">
            <button class="primary-btn" onclick="startPomodoro()">Start Focus</button>
            <button class="primary-btn" style="background:var(--hover-bg); color:var(--text-primary);" onclick="resetPomodoro()">Reset</button>
        </div>
    </div>
    <script src="pomodoro.js"></script>
</body>
</html>
