<!-- ================= AUTROBOOK - pages/01-feed.html ================= -->
<!-- Home Feed with Stories + Posts + Comments -->

<div class="page feed-page">
  
  <!-- Stories Section -->
  <div class="card" style="padding:12px">
    <h3 style="margin:0 0 10px 0">Stories</h3>
    <div class="stories-container" style="display:flex;gap:12px;overflow-x:auto;padding:5px 0">
      <div class="story-card add-story" onclick="navigateTo('home/story-editor.html')" style="cursor:pointer">
        <div class="story-plus">+</div>
        <span>Add Story</span>
      </div>
      <div class="story-card" onclick="alert('Story Viewer Coming Soon!')">
        <img src="https://i.pravatar.cc/100?img=1" alt="User">
        <span>Sakib</span>
      </div>
      <div class="story-card" onclick="alert('Story Viewer Coming Soon!')">
        <img src="https://i.pravatar.cc/100?img=2" alt="User">
        <span>Rahim</span>
      </div>
      <div class="story-card" onclick="alert('Story Viewer Coming Soon!')">
        <img src="https://i.pravatar.cc/100?img=3" alt="User">
        <span>Karim</span>
      </div>
    </div>
  </div>

  <!-- Create Post Box -->
  <div class="card create-post">
    <img src="https://i.pravatar.cc/40?img=10" class="avatar">
    <input type="text" placeholder="What's on your mind?" onclick="navigateTo('pages/03-create-post.html')" readonly>
  </div>

  <!-- Post 1 -->
  <div class="card post" data-postid="1">
    <div class="post-header">
      <img src="https://i.pravatar.cc/40?img=1" class="avatar">
      <div>
        <h4>Sakib Al Hasan</h4>
        <span>2 hours ago</span>
      </div>
    </div>
    <p class="post-text">Just launched my new project Autrobook 🚀 Excited for this journey!</p>
    <img src="https://picsum.photos/600/400?random=1" class="post-image">
    <div class="post-actions">
      <button onclick="likePost(this)">👍 Like</button>
      <button onclick="toggleComment(1)">💬 Comment <span id="comment-count-1">2</span></button>
      <button onclick="sharePost()">📤 Share</button>
    </div>
    
    <!-- Comment Section -->
    <div id="comments-1" class="comment-section" style="display:none">
      <div class="comment-list">
        <div class="comment">
          <img src="https://i.pravatar.cc/30?img=5" class="avatar">
          <div>
            <b>Nayeem</b> Great work bro! 🔥
          </div>
        </div>
        <div class="comment">
          <img src="https://i.pravatar.cc/30?img=6" class="avatar">
          <div>
            <b>Sadia</b> Love this project
          </div>
        </div>
      </div>
      <div class="comment-input">
        <img src="https://i.pravatar.cc/30?img=10" class="avatar">
        <input type="text" id="comment-input-1" placeholder="Write a comment...">
        <button onclick="addComment(1)">Post</button>
      </div>
    </div>
  </div>

  <!-- Post 2 -->
  <div class="card post" data-postid="2">
    <div class="post-header">
      <img src="https://i.pravatar.cc/40?img=2" class="avatar">
      <div>
        <h4>Rahim Uddin</h4>
        <span>5 hours ago</span>
      </div>
    </div>
    <p class="post-text">Coding all night 🌙 Who else is a night owl?</p>
    <div class="post-actions">
      <button onclick="likePost(this)">👍 Like</button>
      <button onclick="toggleComment(2)">💬 Comment <span id="comment-count-2">0</span></button>
      <button onclick="sharePost()">📤 Share</button>
    </div>
    
    <!-- Comment Section -->
    <div id="comments-2" class="comment-section" style="display:none">
      <div class="comment-list"></div>
      <div class="comment-input">
        <img src="https://i.pravatar.cc/30?img=10" class="avatar">
        <input type="text" id="comment-input-2" placeholder="Write a comment...">
        <button onclick="addComment(2)">Post</button>
      </div>
    </div>
  </div>

</div>

<script>
function likePost(btn) {
  document.getElementById('like-sound').play();
  btn.style.color = 'var(--brand)';
  btn.innerText = '👍 Liked';
}

function toggleComment(postId) {
  const commentSection = document.getElementById('comments-' + postId);
  if(commentSection.style.display === 'none') {
    commentSection.style.display = 'block';
  } else {
    commentSection.style.display = 'none';
  }
}

function addComment(postId) {
  const input = document.getElementById('comment-input-' + postId);
  const text = input.value.trim();
  if(text === '') return;
  
  const commentList = document.querySelector('#comments-' + postId + ' .comment-list');
  const newComment = document.createElement('div');
  newComment.className = 'comment';
  newComment.innerHTML = `
    <img src="https://i.pravatar.cc/30?img=10" class="avatar">
    <div><b>You</b> ${text}</div>
  `;
  commentList.appendChild(newComment);
  
  // Update count
  const countSpan = document.getElementById('comment-count-' + postId);
  countSpan.innerText = parseInt(countSpan.innerText) + 1;
  
  input.value = '';
}

function sharePost() {
  alert('Share feature is coming soon!');
}
</script>
