<!-- ================= AUTROBOOK - pages/05-reels.html ================= -->
<!-- Reels / Short Videos with 4K + Download + Enhance Sound -->

<div id="reels-container" style="height: calc(100vh - 120px); overflow-y: scroll; scroll-snap-type: y mandatory;">
  
  <!-- Reel 1 -->
  <div class="reel-item" style="height: calc(100vh - 120px); position:relative; scroll-snap-align: start;">
    <video class="reel-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" loop playsinline></video>
    
    <!-- Quality Badge -->
    <div style="position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.6);color:white;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600">4K</div>
    
    <!-- Reel Overlay -->
    <div style="position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent, rgba(0,0,0,0.7))">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <img src="https://i.pravatar.cc/40?img=1" class="avatar">
        <span style="color:white;font-weight:600">Rahim</span>
        <button class="btn-small" onclick="followUser(this)">Follow</button>
      </div>
      <p style="color:white;margin:5px 0">#funny #comedy This is so funny 😂</p>
      <p style="color:white;font-size:14px">🎵 Original Sound - Rahim</p>
    </div>

    <!-- Right Side Actions -->
    <div style="position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:18px;align-items:center">
      <div class="reel-action" onclick="likeReel(this)">
        <div style="font-size:28px">❤️</div>
        <span style="color:white;font-size:12px">1.2K</span>
      </div>
      <div class="reel-action" onclick="commentReel()">
        <div style="font-size:28px">💬</div>
        <span style="color:white;font-size:12px">89</span>
      </div>
      <div class="reel-action" onclick="shareReel()">
        <div style="font-size:28px">📤</div>
        <span style="color:white;font-size:12px">Share</span>
      </div>
      <div class="reel-action" onclick="toggleSound(this)">
        <div style="font-size:28px" id="soundIcon1">🔊</div>
        <span style="color:white;font-size:12px">Sound</span>
      </div>
      <div class="reel-action" onclick="downloadReel('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'reel-1')">
        <div style="font-size:28px">⬇️</div>
        <span style="color:white;font-size:12px">Download</span>
      </div>
    </div>
  </div>

  <!-- Reel 2 -->
  <div class="reel-item" style="height: calc(100vh - 120px); position:relative; scroll-snap-align: start;">
    <video class="reel-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" loop playsinline></video>
    <div style="position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.6);color:white;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600">4K</div>
    
    <div style="position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent, rgba(0,0,0,0.7))">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <img src="https://i.pravatar.cc/40?img=2" class="avatar">
        <span style="color:white;font-weight:600">Sadia</span>
        <button class="btn-small" onclick="followUser(this)">Follow</button>
      </div>
      <p style="color:white;margin:5px 0">#dance #trending Dance Challenge 🔥</p>
      <p style="color:white;font-size:14px">🎵 Trending Audio</p>
    </div>

    <div style="position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:18px;align-items:center">
      <div class="reel-action" onclick="likeReel(this)">
        <div style="font-size:28px">❤️</div>
        <span style="color:white;font-size:12px">5.4K</span>
      </div>
      <div class="reel-action" onclick="commentReel()">
        <div style="font-size:28px">💬</div>
        <span style="color:white;font-size:12px">234</span>
      </div>
      <div class="reel-action" onclick="shareReel()">
        <div style="font-size:28px">📤</div>
        <span style="color:white;font-size:12px">Share</span>
      </div>
      <div class="reel-action" onclick="toggleSound(this)">
        <div style="font-size:28px" id="soundIcon2">🔊</div>
        <span style="color:white;font-size:12px">Sound</span>
      </div>
      <div class="reel-action" onclick="downloadReel('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', 'reel-2')">
        <div style="font-size:28px">⬇️</div>
        <span style="color:white;font-size:12px">Download</span>
      </div>
    </div>
  </div>

</div>

<script>
// Auto play video when in view
const reelVideos = document.querySelectorAll('.reel-video');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting) {
      entry.target.play();
      entry.target.volume = 1.0; // Full volume
    } else {
      entry.target.pause();
    }
  });
}, { threshold: 0.6 });

reelVideos.forEach(video => observer.observe(video));

function likeReel(el) {
  const heart = el.querySelector('div');
  const count = el.querySelector('span');
  if(heart.innerText === '❤️') {
    heart.innerText = '🤍';
    count.innerText = parseInt(count.innerText.replace('K','')) - 1 + 'K';
  } else {
    heart.innerText = '❤️';
    document.getElementById('like-sound').play();
    count.innerText = parseInt(count.innerText.replace('K','')) + 1 + 'K';
  }
}

function followUser(btn) {
  if(btn.innerText === 'Follow') {
    btn.innerText = 'Following';
    btn.style.background = 'var(--bg)';
  } else {
    btn.innerText = 'Follow';
    btn.style.background = 'var(--brand)';
  }
}

function toggleSound(el) {
  const video = el.closest('.reel-item').querySelector('.reel-video');
  const icon = el.querySelector('div');
  if(video.muted) {
    video.muted = false;
    video.volume = 1.5; // Enhanced Sound 150%
    icon.innerText = '🔊';
  } else {
    video.muted = true;
    icon.innerText = '🔇';
  }
}

function downloadReel(url, filename) {
  // Show loading
  alert('Preparing 4K Download...');
  
  fetch(url)
    .then(resp => resp.blob())
    .then(blob => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename + '-4K.mp4';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      alert('Download Started in 4K Quality!');
    })
    .catch(() => alert('Download failed. Try again!'));
}

function commentReel() {
  alert('Comment section coming soon!');
}

function shareReel() {
  if(navigator.share) {
    navigator.share({ title: 'Autrobook Reel', url: window.location.href });
  } else {
    alert('Link copied to clipboard!');
  }
}
</script>
