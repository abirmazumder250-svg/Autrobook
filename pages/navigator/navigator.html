<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation & Quick Menu - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="navigator.css">
</head>
<body>

    <div class="navigator-wrapper">
        <h2>🚀 Autrobook Navigation Hub</h2>
        <p class="subtitle">Quick access to all core features, modules, and settings.</p>

        <!-- Quick Links Grid -->
        <div class="nav-grid">
            <div class="nav-card" onclick="navigateToPage('../01-feed.html')">
                <span class="nav-icon">📰</span>
                <h3>Newsfeed</h3>
                <p>Explore posts, stories, and updates</p>
            </div>
            
            <div class="nav-card" onclick="navigateToPage('../groups/groups.html')">
                <span class="nav-icon">👥</span>
                <h3>Groups</h3>
                <p>Join communities and discussions</p>
            </div>

            <div class="nav-card" onclick="navigateToPage('../editor/editor.html')">
                <span class="nav-icon">✨</span>
                <h3>Photo Editor</h3>
                <p>CapCut style editing studio</p>
            </div>

            <div class="nav-card" onclick="navigateToPage('../zen/zen.html')">
                <span class="nav-icon">🧘</span>
                <h3>Zen Mode</h3>
                <p>Distraction-free environment</p>
            </div>
        </div>

        <!-- System Controls -->
        <div class="system-controls">
            <button class="primary-btn" onclick="toggleAppTheme()">🌓 Toggle Theme</button>
            <button class="primary-btn" style="background:var(--danger-color, #ef4444);" onclick="logoutUser()">🚪 Log Out</button>
        </div>
    </div>

    <script src="navigator.js"></script>
</body>
</html>
