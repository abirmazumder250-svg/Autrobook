<!-- ================= AUTROBOOK - pages/02-post-card.html ================= -->
<!-- Post Card with Comments + Reactions -->

<div class="card post-card" data-post-id="POST_ID_HERE">
  
  <!-- Post Header -->
  <div class="post-header">
    <img src="https://i.pravatar.cc/40?img=22" class="avatar" alt="User Avatar">
    <div class="post-user-info">
      <h4 class="post-username">Sarah Khan</h4>
      <span class="post-time">1 hour ago · 🌍 Public</span>
    </div>
    <div class="post-menu-wrapper">
      <button class="post-menu" onclick="togglePostMenu(this)">⋯</button>
      <!-- Post Menu Dropdown -->
      <div class="post-menu-dropdown hidden">
        <button onclick="savePost()">💾 Save Post</button>
        <button onclick="reportPost('POST_ID_HERE')">🚩 Report Post</button>
        <button onclick="toggleComments(this)" class="owner-only">🔒 Turn Off Comments</button>
      </div>
    </div>
  </div>

  <!-- Post Text -->
  <p class="post-text">Loving the new Autrobook UI! Built with HTML, CSS, JS only 🚀</p>

  <!-- Post Image/Video -->
  <img src="https://picsum.photos/600/400?random=55" class="post-image" alt="Post Media">

  <!-- Post Stats -->
  <div class="post-stats">
    <span id="like-count">👍 342 Likes</span>
    <span id="dislike-count">👎 12 Dislikes</span>
    <span id="comment-count-text">💬 28 Comments · 🔁 9 Shares</span>
  </div>

  <!-- Post Action Buttons -->
  <div class="post-actions">
    <button class="action-btn" onclick="reactPost(this, 'like')">👍 Like</button>
    <button class="action-btn" onclick="reactPost(this, 'dislike')">👎 Dislike</button>
    <button class="action-btn" onclick="toggleCommentsSection(this)">💬 Comment</button>
    <button class="action-btn" onclick="sharePost()">🔁 Share</button>
  </div>

  <!-- Comment Section -->
  <div class="comment-section">
    <!-- Comments will load from 07-comments.html -->
    <div id="comments-container"></div>
    
    <!-- Voice Comment Hint -->
    <small class="voice-hint">Hold 🎤 to record voice comment. Max 30 seconds</small>
    
    <!-- Comments Disabled Message -->
    <div class="comments-disabled hidden">🚫 Comments are turned off for this post</div>
  </div>
</div>

<!-- Report Modal -->
<div id="report-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Report</h3>
    <p>Why are you reporting this?</p>
    <button onclick="submitReport('Spam')">Spam</button>
    <button onclick="submitReport('Hate Speech')">Hate Speech</button>
    <button onclick="submitReport('Nudity')">Nudity</button>
    <button onclick="submitReport('Violence')">Violence</button>
    <button onclick="submitReport('False Information')">False Information</button>
    <button onclick="submitReport('Other')">Other</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
// Load Comments Component
loadComponent('comments-container', 'pages/07-comments.html');

// Toggle Post Menu
function togglePostMenu(btn) {
  const dropdown = btn.nextElementSibling;
  dropdown.classList.toggle('hidden');
}

// Toggle Comments Section
function toggleCommentsSection(btn) {
  const section = btn.closest('.post-card').querySelector('.comment-section');
  section.classList.toggle('hidden');
}

// Like/Dislike Reaction
function reactPost(btn, type) {
  btn.classList.add('pop');
  setTimeout(() => btn.classList.remove('pop'), 300);
  
  if(type === 'like') {
    btn.classList.toggle('like-active');
    alert('Liked!');
  }
  if(type === 'dislike') {
    btn.classList.toggle('dislike-active');
    alert('Disliked!');
  }
}

// Share Post
function sharePost() {
  navigator.clipboard.writeText(window.location.href);
  alert('Link copied to clipboard!');
}

// Save Post
function savePost() {
  alert('Post Saved!');
  closePostMenu();
}

// Report Post
function reportPost(postId) {
  document.getElementById('report-modal').classList.remove('hidden');
}

function submitReport(reason) {
  alert(`Reported: ${reason}`);
  closeModal();
  closePostMenu();
}

function closeModal() {
  document.getElementById('report-modal').classList.add('hidden');
}

function closePostMenu() {
  document.querySelectorAll('.post-menu-dropdown').forEach(d => d.classList.add('hidden'));
}

// Toggle Comments On/Off
function toggleComments(btn) {
  const section = btn.closest('.post-card').querySelector('.comment-section');
  const disabledMsg = btn.closest('.post-card').querySelector('.comments-disabled');
  section.classList.toggle('hidden');
  disabledMsg.classList.toggle('hidden');
  alert('Comments toggled');
}

// Voice Comment - Placeholder
function startVoiceComment(btn) {
  alert('Voice recording coming soon!');
  btn.classList.toggle('recording');
}
  </script>
