<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hungry Shark - Autrobook</title>
    <style>
        body { background: #000b18; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .game-box { max-width: 400px; margin: 20px auto; background: #07162c; padding: 20px; border-radius: 12px; border: 1px solid #1e3a5f; }
        .ocean { height: 220px; background: linear-gradient(#1e3a5f, #0d233a); border-radius: 8px; position: relative; margin: 15px 0; overflow: hidden; }
        .shark { font-size: 32px; position: absolute; bottom: 50px; left: 40%; transition: 0.2s; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="game-box">
        <h2>🦈 Hungry Shark Survival</h2>
        <p>Fish Eaten: <span id="fishEaten">0</span> | Health: <span id="health">100</span>%</p>
        <div class="ocean">
            <div class="shark" id="shark">🦈</div>
        </div>
        <button class="btn" onclick="eatFish()">CHOMP / EAT 🐟</button>
        <p id="sharkMsg" style="margin-top:10px; font-size:14px; color:#9ca3af;">Hunt small fish to stay alive!</p>
    </div>
<script>
let eaten = 0, health = 100;
function eatFish() {
    const msg = document.getElementById('sharkMsg');
    const prey = ["🐟 Small Fish (+10)", "🐠 Colorful Fish (+15)", "🦀 Crab (+5)"];
    const caught = prey[Math.floor(Math.random() * prey.length)];
    
    eaten++;
    health = Math.min(100, health + 10);
    document.getElementById('fishEaten').textContent = eaten;
    document.getElementById('health').textContent = health;
    msg.textContent = `Yum! Caught ${caught} 🌊`;
}
</script>
</body>
</html>
