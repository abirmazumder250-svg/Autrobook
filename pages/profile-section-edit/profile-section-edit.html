<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Edit Profile - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="profile-section-edit.css">
</head>
<body>

    <div class="edit-container">
        <h2>✏️ Edit Profile & Settings</h2>

        <div class="card">
            <h3>Basic Info</h3>
            <div class="input-group">
                <label>Bio</label>
                <textarea id="editBio" rows="2">Official Hindi, Punjabi Singer and Dancer | DM For Collabs ❤️</textarea>
            </div>

            <div class="input-group">
                <label>Relationship Status</label>
                <select id="editRel">
                    <option value="Single">Single</option>
                    <option value="In a relationship">In a relationship</option>
                    <option value="Married">Married</option>
                    <option value="Engaged">Engaged</option>
                </select>
            </div>

            <div class="input-group">
                <label>School</label>
                <input type="text" id="editSchool" value="Uttara High School & College">
            </div>

            <div class="input-group">
                <label>College / University</label>
                <input type="text" id="editUni" value="Dhaka Central University">
            </div>

            <div class="input-group">
                <label>Family Member / Tag Search</label>
                <input type="text" id="familySearch" placeholder="Search family member name..." oninput="searchFamily(this.value)">
                <div id="familySearchResults" class="search-suggestions"></div>
            </div>
        </div>

        <!-- Privacy & Protection Settings -->
        <div class="card">
            <h3>🛡️ Protection & Verification</h3>
            
            <div class="toggle-row">
                <span>Profile Picture Guard (Lock Avatar)</span>
                <input type="checkbox" id="guardToggle" onchange="toggleGuard(this)">
            </div>

            <div class="toggle-row">
                <span>Black Verification Badge (NID & Selfie Verification)</span>
                <input type="checkbox" id="badgeToggle" onchange="toggleVerificationModal(this)">
            </div>
        </div>

        <button class="primary-btn" style="width:100%; margin-top:15px;" onclick="saveProfileChanges()">Save All Changes</button>
    </div>

    <!-- Verification Modal -->
    <div class="modal" id="verificationModal" style="display:none;">
        <div class="modal-content">
            <h3>Official Account Verification</h3>
            <p style="font-size:13px; color:var(--text-secondary); margin-bottom:10px;">Upload NID Front, Back & Live Selfie for Verification Badge.</p>
            <input type="file" id="nidFront" class="file-input" placeholder="NID Front">
            <input type="file" id="nidBack" class="file-input" placeholder="NID Back">
            <input type="file" id="selfiePic" class="file-input" placeholder="Live Selfie">
            <button class="primary-btn" style="margin-top:10px;" onclick="submitVerification()">Submit for Review</button>
            <button class="secondary-btn" style="margin-top:6px;" onclick="document.getElementById('verificationModal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script src="profile-section-edit.js"></script>
</body>
</html>
