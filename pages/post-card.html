<div class="card post-card">
  
  <!-- Post Header -->
  <div class="post-header">
    <img src="https://i.pravatar.cc/40?img=11" class="avatar" alt="User Avatar">
    <div class="post-user-info">
      <h4 class="post-username">John Doe</h4>
      <span class="post-time">3 hours ago · 🌍 Public</span>
    </div>
    <button class="post-menu">⋯</button>
  </div>

  <!-- Post Text -->
  <p class="post-text">
    This is a sample post text. You can write anything here. #Autrobook #Coding
  </p>

  <!-- Post Image -->
  <img src="https://picsum.photos/600/400?random=20" class="post-image" alt="Post Image">

  <!-- Post Stats -->
  <div class="post-stats">
    <span>👍 120 Likes</span>
    <span>💬 15 Comments · 📤 3 Shares</span>
  </div>

  <!-- Post Actions -->
  <div class="post-actions">
    <button class="action-btn">👍 Like</button>
    <button class="action-btn">💬 Comment</button>
    <button class="action-btn">📤 Share</button>
  </div>

  <!-- Comment Section Placeholder -->
  <div class="comment-section">
    <input type="text" placeholder="Write a comment..." class="comment-input">
  </div>

</div>
