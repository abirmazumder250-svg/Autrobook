<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autrobook - Reels</title>
  <link rel="stylesheet" href="reels.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body id="reelsBody">

  <!-- Top Navigation Header -->
  <div class="reels-top-header">
    <h2>Reels</h2>
    <div class="reels-header-actions">
      <button onclick="openCameraStudio()"><i class="fa-solid fa-camera"></i></button>
      <button onclick="openSearchModal()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </div>

  <!-- Reels Main Container -->
  <div id="reelsContainer" class="reels-container">
    
    <!-- Reel Item 1 -->
    <div class="reel-item" data-reel-id="1">
      <video class="reel-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" loop playsinline></video>
      
      <!-- 4K & Sound Enhancement Badges -->
      <div class="reel-badges">
        <span class="badge-4k">4K Ultra</span>
        <span class="badge-audio" id="audioBadge1">🔊 Boosted 150%</span>
      </div>

      <!-- Double Tap Heart Animation Overlay -->
      <div class="double-tap-heart hidden" id="heartAnim1"><i class="fa-solid fa-heart"></i></div>

      <!-- Reel Bottom Meta -->
      <div class="reel-meta">
        <div class="reel-author-row">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Avatar" class="avatar" />
          <span class="author-name">Abir Mazumder</span>
          <button class="btn-follow" onclick="toggleFollow(this)">Follow</button>
        </div>
        <p class="reel-caption">#funny #autrobook #comedy This is hilarious! 😂🚀</p>
        <p class="reel-audio-title"><i class="fa-solid fa-music"></i> Original Audio - Abir Mazumder</p>
      </div>

      <!-- Right Side Action Buttons -->
      <div class="reel-actions-sidebar">
        <div class="action-btn-wrap" onclick="likeReel(1)">
          <div class="action-icon" id="likeIcon1"><i class="fa-regular fa-heart"></i></div>
          <span class="action-count" id="likeCount1">1.2K</span>
        </div>
        <div class="action-btn-wrap" onclick="openCommentDrawer(1)">
          <div class="action-icon"><i class="fa-solid fa-comment-dots"></i></div>
          <span class="action-count" id="commentCount1">89</span>
        </div>
        <div class="action-btn-wrap" onclick="openShareModal('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
          <div class="action-icon"><i class="fa-solid fa-share"></i></div>
          <span class="action-count">Share</span>
        </div>
        <div class="action-btn-wrap" onclick="toggleSound(1)">
          <div class="action-icon" id="soundIcon1"><i class="fa-solid fa-volume-high"></i></div>
          <span class="action-count">Sound</span>
        </div>
        <div class="action-btn-wrap" onclick="downloadReel('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', 'Autrobook-Reel-1')">
          <div class="action-icon"><i class="fa-solid fa-download"></i></div>
          <span class="action-count">Save</span>
        </div>
      </div>
    </div>

    <!-- Reel Item 2 -->
    <div class="reel-item" data-reel-id="2">
      <video class="reel-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" loop playsinline></video>
      
      <div class="reel-badges">
        <span class="badge-4k">4K Ultra</span>
        <span class="badge-audio" id="audioBadge2">🔊 Boosted 150%</span>
      </div>

      <div class="double-tap-heart hidden" id="heartAnim2"><i class="fa-solid fa-heart"></i></div>

      <div class="reel-meta">
        <div class="reel-author-row">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="Avatar" class="avatar" />
          <span class="author-name">Aovijit Halder</span>
          <button class="btn-follow" onclick="toggleFollow(this)">Follow</button>
        </div>
        <p class="reel-caption">#dance #trending Dance Challenge 🔥💃</p>
        <p class="reel-audio-title"><i class="fa-solid fa-music"></i> Trending Club Mix - DJ Ray</p>
      </div>

      <div class="reel-actions-sidebar">
        <div class="action-btn-wrap" onclick="likeReel(2)">
          <div class="action-icon" id="likeIcon2"><i class="fa-regular fa-heart"></i></div>
          <span class="action-count" id="likeCount2">5.4K</span>
        </div>
        <div class="action-btn-wrap" onclick="openCommentDrawer(2)">
          <div class="action-icon"><i class="fa-solid fa-comment-dots"></i></div>
          <span class="action-count" id="commentCount2">234</span>
        </div>
        <div class="action-btn-wrap" onclick="openShareModal('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
          <div class="action-icon"><i class="fa-solid fa-share"></i></div>
          <span class="action-count">Share</span>
        </div>
        <div class="action-btn-wrap" onclick="toggleSound(2)">
          <div class="action-icon" id="soundIcon2"><i class="fa-solid fa-volume-high"></i></div>
          <span class="action-count">Sound</span>
        </div>
        <div class="action-btn-wrap" onclick="downloadReel('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', 'Autrobook-Reel-2')">
          <div class="action-icon"><i class="fa-solid fa-download"></i></div>
          <span class="action-count">Save</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Comment Drawer Modal -->
  <div id="commentDrawer" class="drawer-overlay hidden">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3>Comments (<span id="drawerCommentCount">0</span>)</h3>
        <button onclick="closeCommentDrawer()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="comments-list" id="drawerCommentsList">
        <!-- Dynamic Comments -->
      </div>
      <div class="comment-input-area">
        <input type="text" id="reelCommentInput" placeholder="Write a comment..." />
        <select id="voiceFilterSelect">
          <option value="Normal">Normal Voice</option>
          <option value="Eco">Eco Effect</option>
          <option value="Deep">Deep Bass</option>
        </select>
        <button class="btn-dark-green" onclick="submitReelComment()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="reels.js"></script>
</body>
</html>
