<!-- ================= AUTROBOOK - pages/47-header.html ================= -->
<!-- Sticky Header with Logo, Search, Reels, Create -->

<header>
  <!-- Left: Logo -->
  <h2 onclick="navigateTo('pages/01-feed.html')" style="cursor:pointer">Autrobook</h2>
  
  <!-- Right: Actions -->
  <div style="display:flex;gap:12px;align-items:center">
    
    <!-- Search Icon -->
    <button onclick="toggleSearch()" style="background:none !important;color:var(--text) !important;font-size:22px;padding:8px">
      🔍
    </button>
    
    <!-- Reels Chip -->
    <span class="chip" onclick="navigateTo('pages/05-reels.html')" style="background:var(--brand);color:white;padding:6px 12px;border-radius:20px;font-weight:600;cursor:pointer">
      🎬 Reels
    </span>
    
    <!-- Create Post + Button -->
    <button onclick="navigateTo('pages/03-create-post.html')" style="padding:8px 14px;font-size:14px">
      + Create
    </button>
    
  </div>
</header>

<!-- Search Bar - Hidden by default -->
<div id="searchBar" class="hidden" style="padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border)">
  <input type="text" id="searchInput" placeholder="Search posts, users, hashtags..." onkeyup="searchPosts(event)">
</div>

<script>
function toggleSearch() {
  const searchBar = document.getElementById('searchBar');
  searchBar.classList.toggle('hidden');
  if(!searchBar.classList.contains('hidden')) {
    document.getElementById('searchInput').focus();
  }
}

function searchPosts(e) {
  if(e.key === 'Enter') {
    const query = e.target.value.trim();
    if(query !== '') {
      alert(`Searching for: ${query}`);
      // Later: navigateTo(`pages/09-search.html?q=${query}`);
    }
  }
}
    </script>
