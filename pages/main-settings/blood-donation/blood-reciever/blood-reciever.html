<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Receiver Request - Autrobook</title>
<link rel="stylesheet" href="blood-receiver.css">
</head>
<body>
<div id="toast"></div>

<div class="header">
  <div onclick="history.back()" style="font-size:22px;cursor:pointer">←</div>
  <h1>🏥 Blood Receiver Request & Verification</h1>
</div>

<div class="container">
  <div class="card">
    <h3>Request Urgent Blood</h3>
    <p>Submit patient and verification details to find matching verified donors immediately.</p>
    
    <label>Patient / Receiver Name</label>
    <input id="recName" placeholder="Full Name">
    
    <label>Address / Hospital Location</label>
    <input id="recAddress" placeholder="e.g. Dhaka Medical College / Uttara, Dhaka">
    
    <label>Required Blood Group</label>
    <select id="recGroup">
      <option value="A+">A (+ve)</option>
      <option value="A-">A (-ve)</option>
      <option value="B+">B (+ve)</option>
      <option value="B-">B (-ve)</option>
      <option value="O+">O (+ve)</option>
      <option value="O-">O (-ve)</option>
      <option value="AB+">AB (+ve)</option>
      <option value="AB-">AB (-ve)</option>
    </select>
    
    <label>Contact Phone Number</label>
    <input id="recPhone" placeholder="01XXXXXXXXX">

    <div class="verification-section">
      <h4>🔒 Patient/Attendant Verification</h4>
      <p style="font-size:11px; color:var(--text2); margin-bottom:8px;">Required to prevent fake or spam blood requests.</p>
      
      <label>NID Card (Front Side)</label>
      <input type="file" id="recNidFront" accept="image/*">

      <label>NID Card (Back Side)</label>
      <input type="file" id="recNidBack" accept="image/*">
    </div>

    <button class="btn" onclick="submitBloodRequest()">Submit Request & Find Donors</button>
  </div>

  <!-- Matching Donors Result Section -->
  <div id="matchingResult" style="margin-top:20px;"></div>
</div>

<script src="blood-receiver.js"></script>
</body>
</html>
