<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Donator Registration - Autrobook</title>
<link rel="stylesheet" href="blood-donator.css">
</head>
<body>
<div id="toast"></div>

<div class="header">
  <div onclick="history.back()" style="font-size:22px;cursor:pointer">←</div>
  <h1>🩸 Blood Donator Verification & Registration</h1>
</div>

<div class="container">
  <div class="card">
    <h3>Register as a Life Saver</h3>
    <p>Join the Autrobook Verified Blood Bank network to help people in urgent need.</p>
    
    <label>Full Name</label>
    <input id="donName" placeholder="Your Full Name">
    
    <label>Blood Group</label>
    <select id="donGroup">
      <option value="A+">A (+ve)</option>
      <option value="A-">A (-ve)</option>
      <option value="B+">B (+ve)</option>
      <option value="B-">B (-ve)</option>
      <option value="O+">O (+ve)</option>
      <option value="O-">O (-ve)</option>
      <option value="AB+">AB (+ve)</option>
      <option value="AB-">AB (-ve)</option>
    </select>
    
    <label>Contact Phone Number</label>
    <input id="donPhone" placeholder="01XXXXXXXXX">
    
    <label>District / Location</label>
    <input id="donLoc" placeholder="e.g. Dhaka, Tongi, Sylhet">

    <div class="verification-section">
      <h4>🔒 Verification Documents</h4>
      <p style="font-size:11px; color:var(--text2); margin-bottom:8px;">Required for identity safety and trusted donor badge.</p>
      
      <label>NID Card (Front Side)</label>
      <input type="file" id="nidFront" accept="image/*">

      <label>NID Card (Back Side)</label>
      <input type="file" id="nidBack" accept="image/*">

      <label>Clear Selfie / Portrait Photo</label>
      <input type="file" id="donSelfie" accept="image/*">
    </div>

    <button class="btn" onclick="registerDonor()">Register & Verify Donor</button>
  </div>
</div>

<script src="blood-donator.js"></script>
</body>
        </html>
