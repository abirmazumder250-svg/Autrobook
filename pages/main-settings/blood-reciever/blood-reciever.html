<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Receiver Request - Autrobook</title>
<link rel="stylesheet" href="blood-receiver.css">
</head>
<body>
<div id="toast"></div>

<div class="header">
  <div onclick="history.back()" style="font-size:22px;cursor:pointer">←</div>
  <h1>🏥 Blood Receiver Request & Search</h1>
</div>

<div class="container">
  <!-- Request Form Card -->
  <div class="card">
    <h3>Request Urgent Blood</h3>
    <p>Submit patient details and required blood group to find or broadcast emergency requests.</p>
    
    <label>Patient / Receiver Name</label>
    <input id="recName" placeholder="Full Name">
    
    <label>Address / Hospital Location</label>
    <input id="recAddress" placeholder="e.g. Dhaka Medical College, Ward 4">
    
    <label>Required Blood Group</label>
    <select id="recGroup">
      <option value="A+">A (+ve)</option>
      <option value="A-">A (-ve)</option>
      <option value="B+">B (+ve)</option>
      <option value="B-">B (-ve)</option>
      <option value="O+">O (+ve)</option>
      <option value="O-">O (-ve)</option>
      <option value="AB+">AB (+ve)</option>
      <option value="AB-">AB (-ve)</option>
    </select>
    
    <label>Contact Phone Number</label>
    <input id="recPhone" placeholder="01XXXXXXXXX">

    <div class="verification-section">
      <h4>🔒 Verification Documents</h4>
      <p style="font-size:11px; color:var(--text2); margin-bottom:8px;">Upload patient or attendant NID for safety & verification.</p>
      
      <label>NID Card (Front Side)</label>
      <input type="file" id="recNidFront" accept="image/*">

      <label>NID Card (Back Side)</label>
      <input type="file" id="recNidBack" accept="image/*">
    </div>

    <button class="btn" onclick="submitReceiverRequest()">Broadcast Blood Request 🚨</button>
  </div>

  <!-- Matched Donors / Search Section -->
  <div class="card" style="margin-top:20px;">
    <h3>Search Available Blood Donors</h3>
    <label>Filter by Blood Group</label>
    <select id="searchGroup" onchange="filterDonors()">
      <option value="">-- All Blood Groups --</option>
      <option value="A+">A (+ve)</option>
      <option value="A-">A (-ve)</option>
      <option value="B+">B (+ve)</option>
      <option value="B-">B (-ve)</option>
      <option value="O+">O (+ve)</option>
      <option value="O-">O (-ve)</option>
      <option value="AB+">AB (+ve)</option>
      <option value="AB-">AB (-ve)</option>
    </select>
    
    <div id="donorResults" style="margin-top:14px;"></div>
  </div>
</div>

<script src="blood-receiver.js"></script>
</body>
</html>
