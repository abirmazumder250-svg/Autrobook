<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missing Person Alert - Autrobook</title>
<link rel="stylesheet" href="missing-alert.css">
</head>
<body>
<div id="toast"></div>

<div class="header">
  <div onclick="history.back()" style="font-size:22px;cursor:pointer">←</div>
  <h1>🚨 Missing Person Alert Network</h1>
</div>

<div class="container">
  <div class="card">
    <h3>Report a Missing Person</h3>
    <p>Broadcast an emergency alert directly to the Autrobook Feed with "Suggested for You" priority.</p>
    
    <label>Missing Person Full Name</label>
    <input id="missName" placeholder="e.g. Rafiq Ahmed">
    
    <label>Age & Physical Description</label>
    <input id="missDesc" placeholder="e.g. 24 years old, height 5ft 8in, wearing white shirt">
    
    <label>Last Seen Location</label>
    <input id="missLoc" placeholder="e.g. Uttara Sector 7, Dhaka">

    <label>Emergency Contact Phone Number</label>
    <input id="missPhone" placeholder="01XXXXXXXXX">

    <label>Upload Person Photo (from Gallery)</label>
    <input type="file" id="missPhoto" accept="image/*">

    <button class="btn btn-danger" onclick="postMissingAlert()">Broadcast Emergency Alert 🚨</button>
  </div>

  <!-- Active Missing Alerts Preview -->
  <div style="margin-top:20px;">
    <h3 style="color:var(--brand); font-size:16px; margin-bottom:10px;">📢 Active Broadcasted Alerts</h3>
    <div id="activeAlertsList"></div>
  </div>
</div>

<script src="missing-alert.js"></script>
</body>
</html>
