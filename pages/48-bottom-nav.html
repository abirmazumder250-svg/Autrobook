<script>
// Set active nav item
function setActiveNav() {
  const currentPage = window.location.hash || 'pages/01-feed.html';
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.remove('active');
  });
  
  if(currentPage.includes('feed')) document.querySelectorAll('.nav-item')[0].classList.add('active');
  if(currentPage.includes('reels')) document.querySelectorAll('.nav-item')[1].classList.add('active');
  if(currentPage.includes('profile')) document.querySelectorAll('.nav-item')[4].classList.add('active');
}

function openNotifications() {
  alert('Notifications page coming soon!');
}

// Run on load
setActiveNav();
</script>
