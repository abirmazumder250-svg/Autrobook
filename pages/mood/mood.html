<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mood Tuner - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="mood.css">
</head>
<body>
    <div class="mood-container">
        <h2>🎭 Mood-Based Feed Tuner</h2>
        <p>Select your current vibe to dynamically tune your social experience.</p>
        
        <div class="mood-grid">
            <button class="mood-chip" onclick="setVibe('coding', '💻 Coding Focus')">💻 Coding Focus</button>
            <button class="mood-chip" onclick="setVibe('relaxed', '☕ Relaxed & Chill')">☕ Relaxed & Chill</button>
            <button class="mood-chip" onclick="setVibe('party', '🔥 High Energy')">🔥 High Energy</button>
            <button class="mood-chip" onclick="setVibe('bookworm', '📚 Deep Learning')">📚 Deep Learning</button>
        </div>
        
        <div class="current-vibe-box" id="activeVibe">Current Vibe: Default Feed</div>
    </div>
    <script src="mood.js"></script>
</body>
</html>
