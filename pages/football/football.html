<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Penalty Shootout - Autrobook</title>
    <style>
        body { background: #0d1b12; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .game-box { max-width: 400px; margin: 20px auto; background: #13261a; padding: 20px; border-radius: 12px; border: 1px solid #1f3d2a; }
        .goalpost { height: 200px; background: #1f3d2a; border: 4px solid #fff; border-bottom: none; position: relative; margin: 15px 0; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 10px; }
        .target-btn { background: rgba(16,185,129,0.3); border: 2px dashed #10b981; color: white; padding: 20px; cursor: pointer; border-radius: 6px; }
        .target-btn:hover { background: #10b981; }
    </style>
</head>
<body>
    <div class="game-box">
        <h2>⚽ Penalty Shootout</h2>
        <p>Goals Scored: <span id="goals">0</span></p>
        <div class="goalpost">
            <button class="target-btn" onclick="shoot(1)">Left</button>
            <button class="target-btn" onclick="shoot(2)">Center</button>
            <button class="target-btn" onclick="shoot(3)">Right</button>
        </div>
        <p id="fbMsg" style="font-size:14px; color:#9ca3af;">Choose a corner to shoot!</p>
    </div>
<script>
let goals = 0;
function shoot(direction) {
    const keeperDive = Math.floor(Math.random() * 3) + 1;
    const msg = document.getElementById('fbMsg');
    if (direction === keeperDive) {
        msg.textContent = "Saved by the Goalkeeper! 🧤❌";
        msg.style.color = "#ff3333";
    } else {
        goals++;
        document.getElementById('goals').textContent = goals;
        msg.textContent = "GOAL!! Absolute screamer! ⚽🔥";
        msg.style.color = "#4caf50";
    }
}
</script>
</body>
</html>
