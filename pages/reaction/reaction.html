<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autrobook Advanced Reactions</title>
  <link rel="stylesheet" href="reaction.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body id="reactionBody">

  <div class="reaction-demo-container">
    <h2>Autrobook Reaction Component Test</h2>
    <p>Long press or hover on the Like button to open the 6-reaction picker.</p>

    <!-- Sample Post Action Bar -->
    <div class="post-action-bar-demo">
      <div class="reaction-stats-preview">
        <span class="stacked-emojis">👍 ❤️ 😂</span>
        <span id="totalReactionCount" class="count-text">1.4K</span>
      </div>

      <div class="action-buttons-row">
        <!-- Main Action Like Button -->
        <button class="action-btn" id="mainLikeBtn" data-reacted="false">
          <i class="fa-regular fa-thumbs-up"></i>
          <span class="btn-text">Like</span>
        </button>
        <button class="action-btn"><i class="fa-regular fa-comment"></i> Comment</button>
        <button class="action-btn"><i class="fa-solid fa-share"></i> Share</button>
      </div>
    </div>
  </div>

  <!-- Floating 6-Reaction Picker Component -->
  <div id="reactionPicker" class="reaction-picker hidden">
    <div class="reaction-btn" data-reaction="like" title="Like">
      <span>👍</span>
      <small>Like</small>
    </div>
    <div class="reaction-btn" data-reaction="love" title="Love">
      <span>❤️</span>
      <small>Love</small>
    </div>
    <div class="reaction-btn" data-reaction="haha" title="Haha">
      <span>😂</span>
      <small>Haha</small>
    </div>
    <div class="reaction-btn" data-reaction="wow" title="Wow">
      <span>😮</span>
      <small>Wow</small>
    </div>
    <div class="reaction-btn" data-reaction="sad" title="Sad">
      <span>😢</span>
      <small>Sad</small>
    </div>
    <div class="reaction-btn" data-reaction="angry" title="Angry">
      <span>😡</span>
      <small>Angry</small>
    </div>
  </div>

  <script src="reaction.js"></script>
</body>
</html>
