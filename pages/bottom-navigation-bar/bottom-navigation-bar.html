<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autrobook Bottom Navigation</title>
  <link rel="stylesheet" href="bottom-navigation-bar.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- Bottom Navigation Bar (Facebook Dark Style) -->
  <nav class="bottom-nav" id="bottomNav">
    <!-- Home -->
    <div class="nav-item active" onclick="switchNavTab(this, 'pages/01-feed.html')">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </div>

    <!-- Reels -->
    <div class="nav-item" onclick="switchNavTab(this, 'pages/05-reels.html')">
      <i class="fa-solid fa-clapperboard"></i>
      <span>Reels</span>
    </div>

    <!-- Create Post Center Floating Button -->
    <div class="nav-item create-center" onclick="openCreateModal()">
      <div class="create-btn-circle">
        <i class="fa-solid fa-plus"></i>
      </div>
    </div>

    <!-- Notifications -->
    <div class="nav-item" onclick="openNotificationsModal()">
      <div class="icon-wrapper">
        <i class="fa-solid fa-bell"></i>
        <span class="notification-badge">3</span>
      </div>
      <span>Notify</span>
    </div>

    <!-- Profile -->
    <div class="nav-item" onclick="switchNavTab(this, 'pages/profile.html')">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="nav-avatar" alt="Profile" />
      <span>Profile</span>
    </div>
  </nav>

  <script src="bottom-navigation-bar.js"></script>
</body>
</html>
