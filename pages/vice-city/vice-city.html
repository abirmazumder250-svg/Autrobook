<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vice City Retro Hub - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="vice-city.css">
</head>
<body>

    <div class="vice-container">
        <!-- Retro Banner -->
        <div class="vice-banner">
            <h1>🌴 GTA VICE CITY RETRO HUB 🌴</h1>
            <p>Step into 1986 Vice City. Neon lights, fast cars, and pure nostalgia.</p>
        </div>

        <!-- Interactive Vibe / Quote Generator -->
        <div class="card vice-card">
            <h3>💬 Tommy Vercetti’s Vibe Quote</h3>
            <blockquote id="viceQuote" class="quote-box">
                "I poke my head out of the gutter for one freakin' second and fate shovels shit in my face."
            </blockquote>
            <button class="primary-btn" style="width:100%; margin-top:10px; background:#db2777;" onclick="changeViceQuote()">🔄 Next 80s Quote</button>
        </div>

        <!-- Retro Neon Feed Share -->
        <div class="card vice-card">
            <h3>🕹️ Broadcast Your Retro Status</h3>
            <input type="text" placeholder="What's your Vice City status today?" id="viceInput">
            <button class="primary-btn" style="margin-top:10px; width:100%; background:#059669;" onclick="postViceVibe()">Share to Neon Feed 🌴</button>
        </div>
    </div>

    <script src="vice-city.js"></script>
</body>
</html>
