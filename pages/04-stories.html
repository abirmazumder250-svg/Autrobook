<!-- Story Viewer Modal -->
<div id="storyViewer" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;justify-content:center;align-items:center">
  <div style="position:relative;width:100%;max-width:400px;height:90vh">
    <img id="storyImg" src="" style="width:100%;height:100%;object-fit:cover;border-radius:15px">
    
    <!-- Progress Bar -->
    <div style="position:absolute;top:10px;left:10px;right:10px;height:3px;background:rgba(255,255,255,0.3);border-radius:3px">
      <div id="storyProgress" style="height:100%;width:0%;background:white;border-radius:3px;transition:width 0.1s linear"></div>
    </div>
    
    <!-- User Info -->
    <div style="position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:10px;color:white">
      <img id="storyUserAvatar" src="" class="avatar" style="border:2px solid white">
      <span id="storyUserName" style="font-weight:600"></span>
    </div>
    
    <!-- Close Button -->
    <button onclick="closeStory()" style="position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.5);color:white;border:none;border-radius:50%;width:35px;height:35px;font-size:20px;cursor:pointer">×</button>
  </div>
</div>

  document.getElementById('storyViewer').style.display = 'flex';

    document.getElementById('storyProgress').style.width = progress + '%';
    if(progress >= 100) closeStory();
  }, 100);
