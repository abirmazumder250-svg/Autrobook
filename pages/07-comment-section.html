<!-- ================= AUTROBOOK - pages/07-comment-section.html ================= -->
<!-- Reusable Comment Section Component -->

<div class="comment-section-wrapper">
  <div class="post-stats">
    <span id="total-likes">24 Likes</span>
    <span id="total-comments">3 Comments</span>
  </div>

  <!-- Comment List -->
  <div class="comment-list" id="commentList">
    
    <!-- Comment 1 -->
    <div class="comment" data-commentid="1">
      <img src="https://i.pravatar.cc/30?img=5" class="avatar-small">
      <div style="flex:1">
        <div class="comment-body">
          <b>Nayeem</b> Great work bro! 🔥 This is amazing
        </div>
        <div class="comment-actions">
          <button onclick="likeComment(1)">Like</button>
          <button onclick="replyComment(1)">Reply</button>
          <span>2h</span>
        </div>
        
        <!-- Reply Section -->
        <div class="reply-list" id="replies-1">
          <div class="comment">
            <img src="https://i.pravatar.cc/30?img=1" class="avatar-small">
            <div class="comment-body">
              <b>Sakib</b> Thanks man! ❤️
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Comment 2 -->
    <div class="comment" data-commentid="2">
      <img src="https://i.pravatar.cc/30?img=6" class="avatar-small">
      <div style="flex:1">
        <div class="comment-body">
          <b>Sadia</b> Love this project. Keep it up!
        </div>
        <div class="comment-actions">
          <button onclick="likeComment(2)">Like</button>
          <button onclick="replyComment(2)">Reply</button>
          <span>1h</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Write Comment Box -->
  <div class="comment-input-wrapper">
    <img src="https://i.pravatar.cc/30?img=10" class="avatar-small">
    <input type="text" id="newCommentInput" placeholder="Write a comment...">
    <button onclick="postComment()">Post</button>
  </div>

  <!-- Reply Input - Hidden by default -->
  <div class="comment-input-wrapper hidden" id="replyBox">
    <img src="https://i.pravatar.cc/30?img=10" class="avatar-small">
    <input type="text" id="replyInput" placeholder="Write a reply...">
    <button onclick="postReply()">Reply</button>
    <button onclick="cancelReply()" class="secondary">Cancel</button>
  </div>

</div>

<script>
let replyToCommentId = null;

function postComment() {
  const input = document.getElementById('newCommentInput');
  const text = input.value.trim();
  if(text === '') return;
  
  const commentList = document.getElementById('commentList');
  const newId = Date.now();
  
  const newComment = document.createElement('div');
  newComment.className = 'comment';
  newComment.setAttribute('data-commentid', newId);
  newComment.innerHTML = `
    <img src="https://i.pravatar.cc/30?img=10" class="avatar-small">
    <div style="flex:1">
      <div class="comment-body">
        <b>You</b> ${text}
      </div>
      <div class="comment-actions">
        <button onclick="likeComment(${newId})">Like</button>
        <button onclick="replyComment(${newId})">Reply</button>
        <button onclick="deleteComment(${newId})" style="color:var(--danger)">Delete</button>
        <span>Just now</span>
      </div>
      <div class="reply-list" id="replies-${newId}"></div>
    </div>
  `;
  commentList.appendChild(newComment);
  
  updateCommentCount(1);
  input.value = '';
}

function replyComment(commentId) {
  replyToCommentId = commentId;
  document.getElementById('replyBox').classList.remove('hidden');
  document.getElementById('replyInput').focus();
  document.getElementById('replyInput').placeholder = `Reply to comment ${commentId}...`;
}

function postReply() {
  const input = document.getElementById('replyInput');
  const text = input.value.trim();
  if(text === '' || replyToCommentId === null) return;
  
  const replyList = document.getElementById('replies-' + replyToCommentId);
  const replyDiv = document.createElement('div');
  replyDiv.className = 'comment';
  replyDiv.innerHTML = `
    <img src="https://i.pravatar.cc/30?img=10" class="avatar-small">
    <div class="comment-body">
      <b>You</b> ${text}
    </div>
  `;
  replyList.appendChild(replyDiv);
  
  cancelReply();
}

function cancelReply() {
  replyToCommentId = null;
  document.getElementById('replyBox').classList.add('hidden');
  document.getElementById('replyInput').value = '';
}

function likeComment(commentId) {
  document.getElementById('like-sound').play();
  alert(`Liked comment ${commentId}`);
}

function deleteComment(commentId) {
  if(confirm('Delete this comment?')) {
    document.querySelector(`[data-commentid="${commentId}"]`).remove();
    updateCommentCount(-1);
  }
}

function updateCommentCount(change) {
  const countSpan = document.getElementById('total-comments');
  let count = parseInt(countSpan.innerText) + change;
  countSpan.innerText = count + ' Comments';
}
</script>
