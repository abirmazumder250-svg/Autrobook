<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autrobook - Menu</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="menu-sidebar.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="system-theme">

    <div class="menu-sidebar-container">
        <!-- Header / Profile Section -->
        <div class="menu-header">
            <div class="profile-info">
                <img src="../logo.png" alt="Profile" class="profile-avatar">
                <div>
                    <h3 id="username-display">Abir Mazumder</h3>
                    <a href="../profile.html" class="view-profile-link">See your profile</a>
                </div>
            </div>
            <button class="close-menu-btn" id="closeMenuBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Search Bar Feature -->
        <div class="menu-search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="menuSearchInput" placeholder="Search menu...">
        </div>

        <!-- Scrollable Menu Items -->
        <div class="menu-items-wrapper">
            
            <!-- Shortcuts Section -->
            <div class="menu-section-title">Your Shortcuts</div>
            <div class="shortcuts-grid">
                <a href="#" class="shortcut-item">
                    <img src="../logo.png" alt="Shortcut">
                    <span>তিতুমীরিয়ান</span>
                </a>
                <a href="#" class="shortcut-item">
                    <img src="../logo.png" alt="Shortcut">
                    <span>Rama Mitra</span>
                </a>
            </div>

            <div class="menu-divider"></div>

            <!-- Main Navigation Links -->
            <div class="menu-links-list">
                <a href="../friends.html" class="menu-link-item">
                    <i class="fa-solid fa-user-group"></i>
                    <span>Friends</span>
                    <span class="badge-count">4 online</span>
                </a>
                <a href="../creator-dashboard.html" class="menu-link-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Creator Dashboard</span>
                </a>
                <a href="../autro-ai.html" class="menu-link-item">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Meta AI / Autro AI</span>
                </a>
                <a href="../saved.html" class="menu-link-item">
                    <i class="fa-solid fa-bookmark"></i>
                    <span>Saved</span>
                </a>
                <a href="../memories.html" class="menu-link-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Memories</span>
                </a>
            </div>

            <!-- New Feature: Zen Mode & Preferences Toggles -->
            <div class="menu-divider"></div>
            <div class="menu-section-title">Preferences & Wellness</div>
            <div class="menu-links-list">
                <div class="menu-link-item toggle-item">
                    <span><i class="fa-solid fa-moon"></i> Zen Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="zenModeToggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <a href="../main-settings/main-settings.html" class="menu-link-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings & Privacy</span>
                </a>
                <a href="../help.html" class="menu-link-item">
                    <i class="fa-solid fa-circle-question"></i>
                    <span>Help & Support</span>
                </a>
            </div>

            <!-- Also from Meta / Ecosystem -->
            <div class="menu-divider"></div>
            <div class="menu-section-title">Also from Autro / Meta</div>
            <div class="menu-links-list">
                <a href="https://threads.net" target="_blank" class="menu-link-item">
                    <i class="fa-solid fa-at"></i>
                    <span>Threads</span>
                </a>
                <a href="https://instagram.com" target="_blank" class="menu-link-item">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </a>
            </div>

            <!-- Red Logout Button -->
            <div class="menu-logout-container">
                <a href="../logout.html" id="logoutBtn" class="logout-btn-red">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </a>
            </div>

        </div>
    </div>

    <script src="menu-sidebar.js"></script>
</body>
</html>
