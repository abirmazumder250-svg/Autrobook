<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Status - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="voice-status.css">
</head>
<body>
    <div class="voice-status-container">
        <h2>🎙️ Record Voice Status</h2>
        <p>Share your voice with your friends for 24 hours.</p>
        
        <div class="recorder-box">
            <button class="record-ring-btn" id="voiceStatusBtn" onclick="toggleVoiceStatusRecord()">🎙️</button>
            <span id="recordTimerStatus" style="font-weight: bold; color: var(--text-secondary);">Tap to start recording (Max 30s)</span>
        </div>

        <div class="status-feed" id="voiceFeed">
            <div class="voice-status-card">
                <div class="avatar"></div>
                <div class="voice-info">
                    <h4>Abir Mazumder</h4>
                    <audio controls style="width: 100%; height: 32px; margin-top: 6px;"></audio>
                </div>
            </div>
        </div>
    </div>
    <script src="voice-status.js"></script>
</body>
</html>
