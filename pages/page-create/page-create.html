<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Page - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="page-create.css">
</head>
<body>

    <div class="page-create-container">
        <div class="create-header">
            <h2>🚀 Create Your Autrobook Page</h2>
            <p>Build a professional community, business, or creator hub with advanced tools.</p>
        </div>

        <div class="card create-form-card">
            <!-- Page Name -->
            <div class="input-group">
                <label>Page Name *</label>
                <input type="text" id="pageName" placeholder="e.g. Tech Innovators & Creators">
            </div>

            <!-- Page Category -->
            <div class="input-group">
                <label>Category *</label>
                <select id="pageCategory">
                    <option value="community">Community & Public Figure</option>
                    <option value="tech">Technology & Coding</option>
                    <option value="business">Business & Brand</option>
                    <option value="entertainment">Gaming & Entertainment</option>
                </select>
            </div>

            <!-- Bio / Description -->
            <div class="input-group">
                <label>Bio & Description</label>
                <textarea id="pageBio" rows="3" placeholder="Tell people what your page is all about..."></textarea>
            </div>

            <!-- Advanced Premium Feature: AI Auto-Moderation Level -->
            <div class="input-group">
                <label>🤖 AI Auto-Moderation Level</label>
                <select id="aiModeration">
                    <option value="strict">Strict (Auto-filter spam & toxic comments)</option>
                    <option value="moderate">Moderate (Standard Protection)</option>
                    <option value="off">Off (Standard Community Rules)</option>
                </select>
            </div>

            <!-- Action Button -->
            <button class="primary-btn" style="width:100%; margin-top:10px;" onclick="createPage()">Create Page Now ✨</button>
        </div>
    </div>

    <script src="page-create.js"></script>
</body>
</html>
