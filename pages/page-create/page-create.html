<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Create Page - Autrobook</title>
    <link rel="stylesheet" href="../../global/global.css">
    <link rel="stylesheet" href="page-create.css">
</head>
<body>

    <div class="page-create-container">
        <div class="create-header">
            <h2>🚀 Create Advanced Autrobook Page</h2>
            <p>Build your community or creator studio with exclusive next-gen features.</p>
        </div>

        <div class="card create-form-card">
            <!-- Page Name -->
            <div class="input-group">
                <label>Page Name *</label>
                <input type="text" id="pageName" placeholder="e.g. Cyber Nexus & Creators">
            </div>

            <!-- Custom Page Handle / URL -->
            <div class="input-group">
                <label>Page Username / Handle *</label>
                <input type="text" id="pageHandle" placeholder="e.g. autrobook.com/cybernexus">
            </div>

            <!-- Page Category -->
            <div class="input-group">
                <label>Category *</label>
                <select id="pageCategory">
                    <option value="community">Community & Public Figure</option>
                    <option value="tech">Technology & Web Stack</option>
                    <option value="gaming">Gaming & Retro Hub</option>
                    <option value="business">Startup & Business</option>
                </select>
            </div>

            <!-- Bio / Description -->
            <div class="input-group">
                <label>Page Bio & Vision</label>
                <textarea id="pageBio" rows="3" placeholder="Tell people what your page stands for..."></textarea>
            </div>

            <!-- Advanced Feature 1: AI Auto-Moderation Level -->
            <div class="input-group">
                <label>🤖 AI Auto-Moderation Level</label>
                <select id="aiModeration">
                    <option value="strict">Strict (Auto-filter spam, hate speech & toxicity)</option>
                    <option value="moderate">Moderate (Standard Protection)</option>
                    <option value="off">Off (Standard Community Rules)</option>
                </select>
            </div>

            <!-- Advanced Feature 2: Ghost Mode Privacy for Page Admins -->
            <div class="input-group checkbox-group">
                <label class="switch-label">
                    <span>👻 Enable Admin Ghost Browsing Mode</span>
                    <input type="checkbox" id="adminGhostMode">
                    <span class="checkmark"></span>
                </label>
            </div>

            <!-- Action Button (Dark Green Theme) -->
            <button class="primary-btn" onclick="createAdvancedPage()">Create Page Now ✨</button>
        </div>
    </div>

    <script src="page-create.js"></script>
</body>
</html>
