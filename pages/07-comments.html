<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comments - Autrobook</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; font-family: Arial; padding: 10px; }
    .comment-section-wrapper { max-width: 680px; margin: 0 auto; background: white; border-radius: 8px; padding: 16px; }
    .post-stats { display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
    .comment { display: flex; gap: 8px; margin: 12px 0; }
    .reply-comment { margin-left: 44px; }
    .avatar-small { width: 32px; height: 32px; border-radius: 50%; }
    .comment-body { background: #f0f2f5; padding: 8px 12px; border-radius: 18px; display: inline-block; }
    .comment-author { font-weight: bold; font-size: 13px; }
    .comment-actions { display: flex; gap: 12px; margin-top: 4px; padding-left: 12px; }
    .comment-actions button { background: none; border: none; color: #65676b; font-size: 12px; font-weight: 600; cursor: pointer; }
    .comment-input-wrapper { display: flex; gap: 8px; align-items: center; border-top: 1px solid #ddd; padding-top: 12px; margin-top: 12px; }
    .comment-input-box { display: flex; flex: 1; background: #f0f2f5; border-radius: 20px; padding: 8px 12px; }
    .comment-input-box input { flex: 1; border: none; background: none; outline: none; }
    .comment-input-box button { background: #1877f2; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body>
<!-- ================= AUTROBOOK - pages/07-comments.html ================= -->
<!-- Comments + Reply Component -->

<div class="comment-section-wrapper">
  <!-- Comment Stats -->
  <div class="post-stats">
    <span id="comment-count">0 Comments</span>
    <span>Share</span>
  </div>

  <!-- Comment List -->
  <div id="comment-list" class="comment-list">
    <!-- Comments will load here dynamically -->
  </div>

  <!-- Comment Input -->
  <div class="comment-input-wrapper">
    <img src="https://i.pravatar.cc/32?img=10" class="avatar-small">
    <div class="comment-input-box">
      <input type="text" id="comment-input" placeholder="Write a comment..." onkeyup="handleCommentKey(event)">
      <button onclick="postComment()">Post</button>
    </div>
  </div>
</div>

<script>
let commentsData = [];
let replyingTo = null;

// Load sample comments
function loadComments() {
  commentsData = [
    {
      id: 1,
      author: 'Rahim Khan',
      avatar: 'https://i.pravatar.cc/32?img=1',
      text: 'This is awesome bro! 🔥',
      time: '2h',
      likes: 5,
      replies: [
        {
          id: 11,
          author: 'You',
          avatar: 'https://i.pravatar.cc/32?img=10',
          text: 'Thanks man!',
          time: '1h',
          likes: 1
        }
      ]
    },
    {
      id: 2,
      author: 'Fatima Ahmed',
      avatar: 'https://i.pravatar.cc/32?img=2',
      text: 'Love this post ❤️',
      time: '30m',
      likes: 3,
      replies: []
    }
  ];
  renderComments();
}

// Render all comments
function renderComments() {
  const commentList = document.getElementById('comment-list');
  commentList.innerHTML = '';
  
  commentsData.forEach(comment => {
    commentList.innerHTML += createCommentHTML(comment, false);
  });
  
  document.getElementById('comment-count').innerText = `${commentsData.length} Comments`;
}

// Create HTML for single comment
function createCommentHTML(comment, isReply) {
  const marginClass = isReply ? 'reply-comment' : '';
  const repliesHTML = comment.replies && comment.replies.length > 0 
    ? comment.replies.map(reply => createCommentHTML(reply, true)).join('')
    : '';
  
  return `
    <div class="comment ${marginClass}" id="comment-${comment.id}">
      <img src="${comment.avatar}" class="avatar-small">
      <div class="comment-content">
        <div class="comment-body">
          <strong>${comment.author}</strong>
          <p>${comment.text}</p>
        </div>
        <div class="comment-actions">
          <button onclick="likeComment(${comment.id})">Like ${comment.likes > 0 ? `(${comment.likes})` : ''}</button>
          <button onclick="replyTo(${comment.id}, '${comment.author}')">Reply</button>
          <span>${comment.time}</span>
        </div>
        <div class="reply-list">
          ${repliesHTML}
        </div>
      </div>
    </div>
  `;
}

// Post new comment
function postComment() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  
  if(text === '') return;
  
  const newComment = {
    id: Date.now(),
    author: 'You',
    avatar: 'https://i.pravatar.cc/32?img=10',
    text: text,
    time: 'now',
    likes: 0,
    replies: []
  };
  
  if(replyingTo) {
    // Add as reply
    const parent = findComment(commentsData, replyingTo);
    if(parent) {
      parent.replies.push(newComment);
      replyingTo = null;
      input.placeholder = 'Write a comment...';
    }
  } else {
    // Add as new comment
    commentsData.unshift(newComment);
  }
  
  input.value = '';
  renderComments();
}

// Reply to comment
function replyTo(id, authorName) {
  replyingTo = id;
  const input = document.getElementById('comment-input');
  input.placeholder = `Replying to ${authorName}...`;
  input.focus();
}

// Like comment
function likeComment(id) {
  const comment = findComment(commentsData, id);
  if(comment) {
    comment.likes += 1;
    renderComments();
  }
}

// Find comment by ID
function findComment(arr, id) {
  for(let item of arr) {
    if(item.id === id) return item;
    if(item.replies) {
      const found = findComment(item.replies, id);
      if(found) return found;
    }
  }
  return null;
}

// Enter key to post
function handleCommentKey(e) {
  if(e.key === 'Enter') {
    postComment();
  }
}

  loadComments(); // Auto load on page load
</script>
</body>
</html>
