<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notifications — Autrobook</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/notification.css">
</head>
<body>

<header class="topbar">
  <div class="brand" onclick="window.location.href='index.html'">
    <img src="logo.png" alt="Autrobook" class="logo-img" onerror="this.style.display='none'">
    <span class="brand-name">Autrobook</span>
  </div>
  <div class="top-title">Notifications</div>
  <div class="top-actions">
    <button class="icon-btn" onclick="triggerPlatformPingSound()" title="Test Interface Audio Core"><i class="fas fa-volume-high"></i></button>
    <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
  </div>
</header>

<div class="notif-wrapper">
  <div class="notif-box" id="notificationAuditBox">
    <!-- Active items loaded dynamic based on state entries -->
  </div>
</div>

<!-- Notification Context Menu Overlay -->
<div class="modal-back" id="mNotifOptions">
  <div class="modal">
    <h3>Notification Settings <i class="fas fa-times close-x" onclick="closeModal('mNotifOptions')"></i></h3>
    <div class="modal-actions-list" id="notifActionsMenu">
      <!-- Logic controls injected dynamically via javascript conditional context handlers -->
    </div>
  </div>
</div>

<!-- Notification Report Overlay -->
<div class="modal-back" id="mNotifReport">
  <div class="modal">
    <h3>Report Notification Target <i class="fas fa-times close-x" onclick="closeModal('mNotifReport')"></i></h3>
    <div class="form-group">
      <label>State reason for flagging this profile interaction:</label>
      <select id="notifReportReason">
        <option value="Spam / Unsolicited harassment">Spam / Unsolicited harassment</option>
        <option value="Abusive language / Threat vectors">Abusive language / Threat vectors</option>
        <option value="Inappropriate Profile Information">Inappropriate Profile Information</option>
      </select>
    </div>
    <button class="btn btn-primary w-100" onclick="submitNotifReport()">Submit Content Audit</button>
  </div>
</div>

<div id="toast" class="toast">Action updated</div>

<script src="js/notification.js"></script>
</body>
</html>
