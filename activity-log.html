<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Activity Log - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; --blue:#1877f2; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);} 
.header{display:flex;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);} 
.header b{flex:1;text-align:center;font-size:18px;} 
.card{background:var(--card);margin:16px;padding:16px;border-radius:8px;} 
.card b{font-size:18px;} 
.btn-group{display:flex;gap:8px;margin:16px;} 
.btn{background:#3a3b3c;padding:8px 16px;border-radius:20px;border:none;color:var(--text);} 
.accordion{padding:16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Activity log</b>
<span>🔍</span>
</div>

<div class="card">
<b>Welcome to activity log</b>
<p style="color:#aaa;margin-top:8px">Activity log is where you can view and manage your Autrobook activity, such as posts, tags, comments and likes.</p>
</div>

<div class="btn-group">
<button class="btn" onclick="window.location.href='archive.html'">📦 Archive</button>
<button class="btn" onclick="alert('Trash')">🗑️ Trash</button>
</div>

<div class="accordion">Your Autrobook activity <span>⌄</span></div>
<div class="accordion">Personal information <span>⌄</span></div>
<div class="accordion">Connections <span>⌄</span></div>
<div class="accordion">Security and login information <span>⌄</span></div>

</body> </html>
