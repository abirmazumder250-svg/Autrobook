<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Edit Highlights - Autrobook</title> <style> 
:root{ --bg:#18191a; --card:#242526; --text:#e4e6eb; --border:#3a3b3c; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;} 
body{background:var(--bg);color:var(--text);} 
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);} 
.header b{font-size:18px;} 
.highlight-item{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border);} 
.highlight-item img{width:60px;height:60px;border-radius:12px;object-fit:cover;} 
.add-btn{font-size:24px;cursor:pointer;} 
</style> </head> <body> 

<div class="header">
<span onclick="history.back()">←</span>
<b>Edit highlights</b>
<span class="add-btn" onclick="document.getElementById('highlightUpload').click()">+</span>
<input type="file" id="highlightUpload" accept="image/*" onchange="addHighlight(event)" style="display:none">
</div>

<div id="highlightsContainer"></div>

<script>
let highlights = JSON.parse(localStorage.getItem('highlights')) || [];
loadHighlights();

function loadHighlights(){
if(highlights.length === 0){
document.getElementById('highlightsContainer').innerHTML = '<p style="text-align:center;padding:40px;color:#aaa">No highlights yet</p>';
return;
}
let html = '';
highlights.forEach((h,i)=>{
html += `<div class="highlight-item">
<img src="${h.img}">
<div><b>${h.emoji}</b><div style="color:#aaa;font-size:14px">Updated ${h.date}<br>${h.count} item</div></div>
<span style="margin-left:auto;font-size:20px">⋮</span>
</div>`;
})
document.getElementById('highlightsContainer').innerHTML = html;
}

function addHighlight(e){
let file = e.target.files[0];
let reader = new FileReader();
reader.onload = function(){
let newHighlight = {
img: reader.result,
emoji: '🤷',
date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}),
count: 1
};
highlights.unshift(newHighlight);
localStorage.setItem('highlights', JSON.stringify(highlights));
loadHighlights();
}
reader.readAsDataURL(file);
}
</script>
</body> </html>
