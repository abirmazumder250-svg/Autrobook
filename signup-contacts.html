<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Autrobook - Sign Up</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{ --brand:#0f5132; --brand-light:#198754; --bg:#1c1c1e; --card:#2c2c2e; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);min-height:100vh;color:white}
.top{padding:15px}
.back{width:40px;height:40px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.lang-select{text-align:center;margin:5px 0 25px}
.lang-select select{padding:8px 12px;border-radius:10px;border:1px solid #555;background:var(--card);color:white;font-size:15px;font-weight:bold;cursor:pointer}
.logo{text-align:center;margin-bottom:30px}
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--brand);box-shadow:0 4px 15px rgba(15,81,50,0.4)}
.wrap{padding:0 20px 40px;max-width:450px;margin:0 auto}
h2{font-size:22px;margin-bottom:6px}
p.sub{color:#aaa;font-size:14px;margin-bottom:25px}
label{font-size:14px;color:#aaa;margin-bottom:6px;display:block}
input{width:100%;padding:16px;border-radius:15px;border:1px solid #555;background:transparent;color:white;font-size:16px;margin-bottom:15px;outline:none}
input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(25,135,84,0.2)}
.pass-wrap{position:relative}
.eye{position:absolute;right:18px;top:16px;cursor:pointer;font-size:18px}
.camera-box{border:2px dashed var(--brand-light);border-radius:15px;padding:15px;text-align:center;margin-bottom:15px;background:var(--card)}
.camera-box video{width:100%;border-radius:10px;display:none;margin-bottom:10px}
.camera-box img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:10px auto;display:none;border:2px solid var(--brand-light)}
.camera-btn{padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-weight:bold;cursor:pointer;width:100%}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.6;background:#555}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px}
.msg.error{color:#ff8a8a}.msg.success{color:#8affa0}
.progress{display:flex;gap:6px;max-width:450px;margin:0 auto 25px;padding:0 20px}
.progress div{flex:1;height:5px;border-radius:10px;background:#333}
.progress div.active{background:var(--brand-light)}
.g-recaptcha{margin:15px 0;display:flex;justify-content:center;transform:scale(.95)}
.checkbox-row{display:flex;gap:8px;align-items:center;font-size:13px;color:#aaa;margin:10px 0}
.checkbox-row input{width:auto;margin:0}
.strength{font-size:12px;margin:-10px 0 12px;color:#aaa}
</style>
</head>
<body>
<!-- ব্যাক লিংকের 404 এরর ঠিক করতে এটি index.html বা সঠিক ফাইলের নামে পরিবর্তন করা হয়েছে -->
<div class="top"><div class="back" onclick="location.href='index.html'">←</div></div>

<div class="lang-select">
<select id="langSelect" onchange="changeLanguage()">
  <option value="en">English (US)</option>
  <option value="bn">বাংলা</option>
  <option value="hi">हिन्दी</option>
  <option value="ar">العربية</option>
  <option value="es">Español</option>
</select>
</div>

<div class="logo"><img src="logo.png" alt="Autrobook" onerror="this.style.display='none'"></div>
<div class="progress"><div class="active"></div><div class="active"></div><div></div></div>
<div class="wrap">
<h2 data-key="title">Create Account</h2>
<p class="sub" data-key="subtitle">Fill in your details to continue</p>
<p id="namePreview" style="color:#4CAF50;font-size:14px;margin-bottom:12px"></p>

<label data-key="dob">Date of Birth</label>
<input type="date" id="dob">

<label data-key="email">Email</label>
<input type="email" id="email" data-placeholder="email" autocomplete="email">

<label data-key="password">Password</label>
<div class="pass-wrap">
<input type="password" id="password" data-placeholder="password" autocomplete="new-password" oninput="checkStrength()">
<span class="eye" onclick="togglePass()">👁️</span>
</div>
<div class="strength" id="strengthText"></div>

<label data-key="face">Face Verification</label>
<div class="camera-box">
<video id="video" autoplay playsinline></video>
<img id="photo" />
<button class="camera-btn" id="cameraBtn" onclick="startCamera()" data-key="cameraBtn">📷 Take Live Selfie</button>
<p style="color:#aaa;font-size:12px;margin-top:8px" data-key="faceNote">Selfie is only for verification, no one will see it</p>
</div>

<!-- নতুন সাইটকি এখানে আপডেট করা হয়েছে -->
<div class="g-recaptcha" data-sitekey="6LeifXoAAAAAAPOvZ1H6sH9T7UfUH8lpyhWakTze" data-callback="enableBtn" data-expired-callback="disableBtn"></div>
<p style="font-size:12px;color:#aaa;text-align:center" data-key="captchaNote">If reCAPTCHA doesn't load, tick below</p>
<div class="checkbox-row"><input type="checkbox" id="humanCheck" onchange="manualCaptcha()"> <span data-key="human">I'm not a robot - Verify manually</span></div>

<div class="msg" id="msg"></div>
<button class="btn" id="nextBtn" onclick="goNext()" disabled data-key="signup">Sign Up</button>
<p style="text-align:center;margin-top:12px;font-size:13px;color:#aaa"><span data-key="haveAcc">Already have account?</span> <a href="index.html" style="color:#4CAF50;font-weight:bold">Login</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI",
authDomain: "autrobook-ad3d5.firebaseapp.com",
projectId: "autrobook-ad3d5",
storageBucket: "autrobook-ad3d5.firebasestorage.app",
messagingSenderId: "554222945815",
appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52",
measurementId: "G-Z8QM0NVR6W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let selfieData = ""; let stream = null;
let currentLang = localStorage.getItem('lang') || 'en';
const translations = {
  en: { title:"Create Account", subtitle:"Fill in your details to continue", dob:"Date of Birth", email:"Email", password:"Password", face:"Face Verification", cameraBtn:"📷 Take Live Selfie", faceNote:"Selfie is only for verification, no one will see it", captchaNote:"If reCAPTCHA doesn't load, tick below", human:"I'm not a robot - Verify manually", signup:"Sign Up", haveAcc:"Already have account?", err1:"Select Date of Birth", errAge:"You must be at least 13 years old", err2:"Enter your email", err3:"Enter a valid email", err4:"Password min 6 characters", err5:"Please take a selfie", err6:"Please verify you are not a robot", success:"✅ Account Created! Redirecting...", exist:"This email already exists - Try Login", weak:"Weak password", medium:"Medium password", strong:"Strong password ✅" },
  bn: { title:"অ্যাকাউন্ট তৈরি করো", subtitle:"চালিয়ে যেতে তোমার তথ্য দাও", dob:"জন্ম তারিখ", email:"ইমেইল", password:"পাসওয়ার্ড", face:"ফেস ভেরিফিকেশন", cameraBtn:"📷 লাইভ সেলফি তোলো", faceNote:"সেলফি শুধু ভেরিফিকেশনের জন্য, কেউ দেখবে না", captchaNote:"reCAPTCHA লোড না হলে নিচে টিক দাও", human:"আমি রোবট না - ম্যানুয়ালি ভেরিফাই করলাম", signup:"সাইন আপ", haveAcc:"আগেই অ্যাকাউন্ট আছে?", err1:"জন্ম তারিখ দাও", errAge:"তোমার বয়স কমপক্ষে ১৩ হতে হবে", err2:"ইমেইল দাও", err3:"সঠিক ইমেইল দাও", err4:"পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে", err5:"সেলফি তোলো", err6:"প্রমাণ করো তুমি রোবট না", success:"✅ অ্যাকাউন্ট তৈরি! যাচ্ছি...", exist:"এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট আছে - Login করো", weak:"দুর্বল পাসওয়ার্ড", medium:"মাঝারি পাসওয়ার্ড", strong:"শক্ত পাসওয়ার্ড ✅" },
  hi: { title:"अकाउंट बनाओ", subtitle:"जारी रखने के लिए अपनी जानकारी भरो", dob:"जन्म तिथि", email:"ईमेल", password:"पासवर्ड", face:"फेस वेरिफिकेशन", cameraBtn:"📷 लाइव सेल्फी लो", faceNote:"सेल्फी सिर्फ वेरिफिकेशन के लिए है", captchaNote:"reCAPTCHA लोड न हो तो नीचे टिक करो", human:"मैं रोबोट नहीं हूँ", signup:"साइन अप", haveAcc:"पहले से अकाउंट है?", err1:"जन्म तिथि चुनो", errAge:"उम्र कम से कम 13 होनी चाहिए", err2:"ईमेल लिखो", err3:"सही ईमेल लिखो", err4:"पासवर्ड कम से कम 6 अक्षर का हो", err5:"सेल्फी लो", err6:"साबित करो तुम रोबोट नहीं हो", success:"✅ अकाउंट बन गया!", exist:"यह ईमेल पहले से है - Login करो", weak:"कमजोर पासवर्ड", medium:"मध्यम पासवर्ड", strong:"मजबूत पासवर्ड ✅" },
  ar: { title:"إنشاء حساب", subtitle:"املأ بياناتك للمتابعة", dob:"تاريخ الميلاد", email:"البريد الإلكتروني", password:"كلمة المرور", face:"التحقق من الوجه", cameraBtn:"📷 التقط سيلفي مباشر", faceNote:"السيلفي للتحقق فقط", captchaNote:"إذا لم يتم تحميل reCAPTCHA ضع علامة بالأسفل", human:"أنا لست روبوتا", signup:"اشتراك", haveAcc:"هل لديك حساب؟", err1:"اختر تاريخ الميلاد", errAge:"يجب أن يكون عمرك 13 على الأقل", err2:"اكتب بريدك", err3:"اكتب بريدا صحيحا", err4:"كلمة المرور 6 أحرف على الأقل", err5:"التقط سيلفي", err6:"أثبت أنك لست روبوتا", success:"✅ تم إنشاء الحساب!", exist:"هذا البريد موجود - سجل دخول", weak:"كلمة مرور ضعيفة", medium:"كلمة مرور متوسطة", strong:"كلمة مرور قوية ✅" },
  es: { title:"Crear Cuenta", subtitle:"Completa tus datos para continuar", dob:"Fecha de nacimiento", email:"Correo", password:"Contraseña", face:"Verificación facial", cameraBtn:"📷 Tomar Selfie en Vivo", faceNote:"La selfie es solo para verificación", captchaNote:"Si reCAPTCHA no carga, marca abajo", human:"No soy un robot", signup:"Registrarse", haveAcc:"¿Ya tienes cuenta?", err1:"Elige fecha de nacimiento", errAge:"Debes tener al menos 13 años", err2:"Escribe tu correo", err3:"Escribe un correo válido", err4:"Contraseña mínimo 6 caracteres", err5:"Toma una selfie", err6:"Demuestra que no eres robot", success:"✅ ¡Cuenta creada!", exist:"Este correo ya existe - Inicia sesión", weak:"Contraseña débil", medium:"Contraseña media", strong:"Contraseña fuerte ✅" }
};
function applyLanguage(lang){
  currentLang = lang; localStorage.setItem('lang', lang);
  document.body.style.direction = (lang==='ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang] && translations[lang][key]){ el.innerText = translations[lang][key]; }
  });
  document.querySelectorAll('[data-placeholder]').forEach(el => {
    const key = el.getAttribute('data-placeholder');
    if(translations[lang] && translations[lang][key]){ el.placeholder = translations[lang][key]; }
  });
  var nm = localStorage.getItem('signup_name') || '';
  if(nm) document.getElementById('namePreview').innerText = '👤 ' + nm;
}
window.changeLanguage = () => { applyLanguage(document.getElementById('langSelect').value); }
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langSelect').value = currentLang; applyLanguage(currentLang);
});
window.enableBtn = () => { document.getElementById('nextBtn').disabled = false; }
window.disableBtn = () => { if(!document.getElementById('humanCheck').checked) document.getElementById('nextBtn').disabled = true; }
window.manualCaptcha = () => { document.getElementById('nextBtn').disabled = !document.getElementById('humanCheck').checked; }
window.togglePass = () => { const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password'; }
window.checkStrength = () => {
  const t = translations[currentLang] || translations.en;
  const v = document.getElementById('password').value;
  const el = document.getElementById('strengthText');
  if(!v){ el.innerText=''; return; }
  if(v.length < 6) el.innerText = '❌ ' + t.err4;
  else if(v.length < 10) el.innerText = '🟡 ' + t.medium;
  else el.innerText = '🟢 ' + t.strong;
}
function showMsg(t,type){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+type;}
window.startCamera = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    const video = document.getElementById('video');
    video.srcObject = stream; video.style.display = 'block';
    document.getElementById('cameraBtn').innerText = '📸 Capture Photo';
    document.getElementById('cameraBtn').onclick = capturePhoto;
  }catch(e){ showMsg('Camera permission denied - Allow camera from browser settings','error'); }
}
function capturePhoto(){
  const video = document.getElementById('video');
  if(!video.videoWidth) return showMsg('Wait for camera to load...','error');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  selfieData = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('photo').src = selfieData;
  document.getElementById('photo').style.display = 'block';
  video.style.display = 'none';
  if(stream){ stream.getTracks().forEach(track => track.stop()); }
  document.getElementById('cameraBtn').innerText = '🔄 Retake';
  document.getElementById('cameraBtn').onclick = window.startCamera;
  showMsg('Selfie captured!','success');
}
window.capturePhoto = capturePhoto;
window.goNext = async () => {
  const t = translations[currentLang] || translations.en;
  const fn = localStorage.getItem('signup_firstName') || '';
  const sn = localStorage.getItem('signup_surname') || '';
  const dob = document.getElementById('dob').value;
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  let captcha = '';
  try{ captcha = window.grecaptcha ? grecaptcha.getResponse() : ''; }catch(e){ captcha=''; }
  const humanChecked = document.getElementById('humanCheck').checked;
  if(!dob) return showMsg(t.err1,'error');
  const birth = new Date(dob); const today = new Date(); let age = today.getFullYear() - birth.getFullYear(); const m = today.getMonth() - birth.getMonth(); if(m<0 || (m===0 && today.getDate() < birth.getDate())) age--;
  if(age < 13) return showMsg(t.errAge,'error');
  if(!email) return showMsg(t.err2,'error');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg(t.err3,'error');
  if(!pass || pass.length<6) return showMsg(t.err4,'error');
  if(!selfieData) return showMsg(t.err5,'error');
  if(captcha.length == 0 && !humanChecked) return showMsg(t.err6,'error');
  const btn=document.getElementById('nextBtn'); btn.disabled=true; btn.textContent='Creating...';
  const localUser = { name: (fn+' '+sn).trim(), firstName: fn, surname: sn, dob: dob, email: email, pass: pass, selfie: selfieData, lang: currentLang, time: Date.now() };
  try{
    const userCred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "users", userCred.user.uid), {
      firstName: fn, surname: sn, dob: dob, email: email, selfie: selfieData, lang: currentLang, createdAt: new Date()
    });
    var users=JSON.parse(localStorage.getItem('ab_users')||'[]');
    users.push(localUser); localStorage.setItem('ab_users',JSON.stringify(users));
    localStorage.setItem('autrobook_user',JSON.stringify(localUser));
    localStorage.setItem('ab_logged_in','1');
    localStorage.setItem('signup_step','done');
    showMsg(t.success,'success');
    setTimeout(()=>location.href='home.html',1200);
  } catch(error){
    if(error.code == 'auth/email-already-in-use'){ showMsg(t.exist, 'error'); btn.disabled=false; btn.textContent=t.signup; return; }
    if(error.code == 'auth/network-request-failed' || error.code == 'auth/invalid-api-key'){
      var users2=JSON.parse(localStorage.getItem('ab_users')||'[]');
      if(!users2.find(u=>u.email===email)) users2.push(localUser);
      localStorage.setItem('ab_users',JSON.stringify(users2));
      localStorage.setItem('autrobook_user',JSON.stringify(localUser));
      localStorage.setItem('ab_logged_in','1');
      showMsg('Network issue - Local Account Created ✅','success');
      setTimeout(()=>location.href='home.html',1200);
      return;
    }
    showMsg(error.message, 'error');
    btn.disabled=false; btn.textContent=t.signup;
  }
}
</script>
</body>
</html>
