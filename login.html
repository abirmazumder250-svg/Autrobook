<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Login & Sign Up</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: linear-gradient(135deg, #164a3b 0%, #2b6e58 50%, #1d5746 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; color: #ffffff; }
  .card { background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 18px; padding: 28px 22px; width: 100%; max-width: 390px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
  .logo { font-size: 32px; font-weight: bold; margin-bottom: 18px; }
  .tabs { display: flex; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tab { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; color: #d0e6df; }
  .tab.active { background: #ffffff; color: #164a3b; }
  .input-box { width: 100%; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 13px 14px; color: #ffffff; font-size: 15px; margin-bottom: 12px; outline: none; }
  .input-box::placeholder { color: #b5d1c8; }
  .phone-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .country-select { background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 12px 8px; color: #ffffff; font-size: 14px; font-weight: bold; outline: none; }
  .country-select option { background: #164a3b; color: #fff; }
  .phone-row .input-box { margin-bottom: 0; flex: 1; }
  .btn-main { width: 100%; background: #ffffff; color: #164a3b; border: none; border-radius: 10px; padding: 13px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 4px; }
  .btn-main:disabled { opacity: 0.6; }
  .btn-secondary { width: 100%; background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.4); border-radius: 10px; padding: 10px; font-size: 14px; margin-top: 10px; cursor: pointer; }
  .error-text { color: #ff8a80; font-size: 13px; margin-top: 14px; font-weight: bold; min-height: 18px; }
  .success-text { color: #a5d6a7; font-size: 13px; margin-top: 14px; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Autrobook</div>
  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchMode('login')">Login</div>
    <div class="tab" id="signupTab" onclick="switchMode('signup')">Sign Up</div>
  </div>

  <div id="step1">
    <input type="text" id="fullName" class="input-box" placeholder="Enter Your Full Name" style="display:none;">
    <div class="phone-row">
      <select id="countryCode" class="country-select">
        <option value="+880">🇧🇩 +880</option>
        <option value="+91">🇮🇳 +91</option>
        <option value="+966">🇸🇦 +966</option>
        <option value="+971">🇦🇪 +971</option>
        <option value="+60">🇲🇾 +60</option>
        <option value="+1">🇺🇸 +1</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+92">🇵🇰 +92</option>
      </select>
      <input type="tel" id="phoneNumber" class="input-box" placeholder="019XXXXXXXX" maxlength="15">
    </div>
    <div id="recaptcha-container"></div>
    <button class="btn-main" id="sendBtn" onclick="sendOTP()">Send SMS Code</button>
  </div>

  <div id="step2" style="display:none;">
    <p style="font-size:13px; margin-bottom:10px; color:#e0f2f1;">Enter the 6-digit SMS code sent to <b id="sentNumberText"></b></p>
    <input type="number" id="otpInput" class="input-box" placeholder="123456" style="text-align:center; letter-spacing:6px; font-size:18px; font-weight:bold;">
    <button class="btn-main" id="verifyBtn" onclick="verifyOTP()">Verify & Login</button>
    <button class="btn-secondary" onclick="resetStep()">Change Number</button>
  </div>
  <div id="statusText" class="error-text"></div>
</div>

<script type="module">
  // ✅ FIXED IMPORT - Full correct URL
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI",
    authDomain: "autrobook-ad3d5.firebaseapp.com",
    projectId: "autrobook-ad3d5",
    storageBucket: "autrobook-ad3d5.firebasestorage.app",
    messagingSenderId: "554222945815",
    appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52",
    measurementId: "G-Z8QM0NVR6W"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentMode = 'login';
  let confirmationResultGlobal = null;
  let verifier = null;

  // Recaptcha only when needed - not on page load
  function getVerifier(){
    if(!verifier){
      verifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
    }
    return verifier;
  }

  window.switchMode = function(mode) {
    currentMode = mode;
    const nameField = document.getElementById('fullName');
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    if (mode === 'signup') {
      loginTab.classList.remove('active'); signupTab.classList.add('active'); nameField.style.display = 'block';
    } else {
      signupTab.classList.remove('active'); loginTab.classList.add('active'); nameField.style.display = 'none';
    }
    document.getElementById('statusText').innerText = '';
  };

  window.sendOTP = async function() {
    const code = document.getElementById('countryCode').value;
    let rawNum = document.getElementById('phoneNumber').value.trim();
    const nameVal = document.getElementById('fullName').value.trim();
    const status = document.getElementById('statusText');
    const btn = document.getElementById('sendBtn');

    if (currentMode === 'signup' && !nameVal) { status.className = 'error-text'; status.innerText = 'Please enter your name for Sign Up.'; return; }
    if (rawNum.startsWith('0')) rawNum = rawNum.substring(1);
    if (rawNum.startsWith('880')) rawNum = rawNum.substring(3);
    if (!/^\d{7,14}$/.test(rawNum)) { status.className = 'error-text'; status.innerText = 'Please enter a valid SIM number.'; return; }

    const fullPhone = code + rawNum;
    btn.disabled = true; btn.innerText = 'Sending SMS...';
    status.className = 'success-text'; status.innerText = 'Sending OTP to ' + fullPhone + '...';

    try {
      confirmationResultGlobal = await signInWithPhoneNumber(auth, fullPhone, getVerifier());
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('sentNumberText').innerText = fullPhone;
      status.className = 'success-text'; status.innerText = 'SMS Code Sent! Check your phone inbox.';
    } catch (error) {
      console.log(error);
      status.className = 'error-text';
      // Friendly error message
      if(error.code === 'auth/invalid-phone-number') status.innerText = 'Invalid phone number format.';
      else if(error.code === 'auth/too-many-requests') status.innerText = 'Too many tries. Wait 10 minutes and try again.';
      else if(error.code === 'auth/captcha-check-failed') status.innerText = 'Captcha failed. Refresh page and try again.';
      else status.innerText = 'Firebase Error: ' + error.message;
      btn.disabled = false; btn.innerText = 'Send SMS Code';
      // Reset recaptcha so user can retry
      verifier = null;
      document.getElementById('recaptcha-container').innerHTML = '';
    }
  };

  window.verifyOTP = async function() {
    const otp = document.getElementById('otpInput').value.trim();
    const nameVal = document.getElementById('fullName').value.trim();
    const status = document.getElementById('statusText');
    const btn = document.getElementById('verifyBtn');
    if (otp.length !== 6) { status.className = 'error-text'; status.innerText = 'Please enter the 6-digit SMS code.'; return; }
    btn.disabled = true; btn.innerText = 'Verifying...';
    try {
      const result = await confirmationResultGlobal.confirm(otp);
      const user = result.user;

      // Save to Firestore + localStorage - so index.html can read it
      const userData = {
        name: nameVal || JSON.parse(localStorage.getItem('autrobook_user') || '{}').name || "User",
        phone: user.phoneNumber,
        uid: user.uid,
        id: user.uid,
        img: 99,
        profilePic: "",
        verifiedPhone: true
      };
      // If signup, save name to Firestore
      await setDoc(doc(db, "users", user.uid), { name: userData.name, phone: user.phoneNumber, strikes: 0 }, { merge: true });
      localStorage.setItem('autrobook_user', JSON.stringify(userData));

      status.className = 'success-text'; status.innerText = 'Verified! Redirecting to Autrobook...';
      setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    } catch (error) {
      status.className = 'error-text'; status.innerText = 'Invalid code. Please check your SMS and try again.';
      btn.disabled = false; btn.innerText = 'Verify & Login';
    }
  };

  window.resetStep = function() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendBtn').innerText = 'Send SMS Code';
    document.getElementById('statusText').innerText = '';
  };
</script>
</body>
</html>
