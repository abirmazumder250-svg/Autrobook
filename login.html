<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Login & Sign Up</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #164a3b 0%, #2b6e58 50%, #1d5746 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    color: #ffffff;
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 18px;
    padding: 28px 22px;
    width: 100%;
    max-width: 390px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  }
  .logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  .tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
    color: #d0e6df;
  }
  .tab.active {
    background: #ffffff;
    color: #164a3b;
  }
  .input-box {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 13px 14px;
    color: #ffffff;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
  }
  .input-box::placeholder { color: #b5d1c8; }
  .phone-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .country-select {
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 12px 8px;
    color: #ffffff;
    font-size: 14px;
    font-weight: bold;
    outline: none;
  }
  .country-select option { background: #164a3b; color: #fff; }
  .phone-row .input-box { margin-bottom: 0; flex: 1; }
  .btn-main {
    width: 100%;
    background: #ffffff;
    color: #164a3b;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 4px;
    transition: 0.2s;
  }
  .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary {
    width: 100%;
    background: transparent;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
    margin-top: 10px;
    cursor: pointer;
  }
  .error-text {
    color: #ff8a80;
    font-size: 13px;
    margin-top: 14px;
    font-weight: bold;
    min-height: 18px;
  }
  .success-text {
    color: #a5d6a7;
    font-size: 13px;
    margin-top: 14px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Autrobook</div>

  <!-- Login / Sign Up Switch Tabs -->
  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchMode('login')">Login</div>
    <div class="tab" id="signupTab" onclick="switchMode('signup')">Sign Up</div>
  </div>

  <!-- Step 1: Enter Name (for Sign Up) & SIM Number -->
  <div id="step1">
    <input type="text" id="fullName" class="input-box" placeholder="Enter Your Full Name" style="display:none;">
    
    <div class="phone-row">
      <select id="countryCode" class="country-select">
        <option value="+880">🇧🇩 +880</option>
        <option value="+91">🇮🇳 +91</option>
        <option value="+966">🇸🇦 +966</option>
        <option value="+971">🇦🇪 +971</option>
        <option value="+60">🇲🇾 +60</option>
        <option value="+1">🇺🇸 +1</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+92">🇵🇰 +92</option>
      </select>
      <input type="tel" id="phoneNumber" class="input-box" placeholder="019XXXXXXXX" maxlength="15">
    </div>

    <div id="recaptcha-container"></div>
    <button class="btn-main" id="sendBtn" onclick="sendOTP()">Send SMS Code</button>
  </div>

  <!-- Step 2: Enter 6-Digit SMS OTP -->
  <div id="step2" style="display:none;">
    <p style="font-size:13px; margin-bottom:10px; color:#e0f2f1;">
      Enter the 6-digit SMS code sent to <b id="sentNumberText"></b>
    </p>
    <input type="number" id="otpInput" class="input-box" placeholder="123456" style="text-align:center; letter-spacing:6px; font-size:18px; font-weight:bold;">
    <button class="btn-main" id="verifyBtn" onclick="verifyOTP()">Verify & Login</button>
    <button class="btn-secondary" onclick="resetStep()">Change Number</button>
  </div>

  <div id="statusText" class="error-text"></div>
</div>

<!-- Official Firebase v10.12.2 Modular SDKs -->
<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI",
    authDomain: "autrobook-ad3d5.firebaseapp.com",
    projectId: "autrobook-ad3d5",
    storageBucket: "autrobook-ad3d5.firebasestorage.app",
    messagingSenderId: "554222945815",
    appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52",
    measurementId: "G-Z8QM0NVR6W"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
    'size': 'invisible'
  });

  let currentMode = 'login';
  let confirmationResultGlobal = null;

  window.switchMode = function(mode) {
    currentMode = mode;
    const nameField = document.getElementById('fullName');
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');

    if (mode === 'signup') {
      loginTab.classList.remove('active');
      signupTab.classList.add('active');
      nameField.style.display = 'block';
    } else {
      signupTab.classList.remove('active');
      loginTab.classList.add('active');
      nameField.style.display = 'none';
    }
    document.getElementById('statusText').innerText = '';
  };

  window.sendOTP = async function() {
    const code = document.getElementById('countryCode').value;
    let rawNum = document.getElementById('phoneNumber').value.trim();
    const nameVal = document.getElementById('fullName').value.trim();
    const status = document.getElementById('statusText');
    const btn = document.getElementById('sendBtn');

    if (currentMode === 'signup' && !nameVal) {
      status.className = 'error-text';
      status.innerText = 'Please enter your name for Sign Up.';
      return;
    }

    // Remove leading 0 if user enters 019XXXXXXXX
    if (rawNum.startsWith('0')) {
      rawNum = rawNum.substring(1);
    }

    if (!/^\d{7,14}$/.test(rawNum)) {
      status.className = 'error-text';
      status.innerText = 'Please enter a valid SIM number.';
      return;
    }

    const fullPhone = code + rawNum;
    btn.disabled = true;
    btn.innerText = 'Sending SMS...';
    status.className = 'success-text';
    status.innerText = 'Sending OTP to ' + fullPhone + '...';

    try {
      confirmationResultGlobal = await signInWithPhoneNumber(auth, fullPhone, window.recaptchaVerifier);
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('sentNumberText').innerText = fullPhone;
      status.className = 'success-text';
      status.innerText = 'SMS Code Sent! Check your phone inbox.';
    } catch (error) {
      status.className = 'error-text';
      status.innerText = 'Firebase Error: ' + error.message;
      btn.disabled = false;
      btn.innerText = 'Send SMS Code';
    }
  };

  window.verifyOTP = async function() {
    const otp = document.getElementById('otpInput').value.trim();
    const nameVal = document.getElementById('fullName').value.trim();
    const status = document.getElementById('statusText');
    const btn = document.getElementById('verifyBtn');

    if (otp.length !== 6) {
      status.className = 'error-text';
      status.innerText = 'Please enter the 6-digit SMS code.';
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Verifying...';

    try {
      const result = await confirmationResultGlobal.confirm(otp);
      const user = result.user;

      let userData = JSON.parse(localStorage.getItem('autrobook_user')) || {};
      if (nameVal) userData.name = nameVal;
      userData.phone = user.phoneNumber;
      userData.uid = user.uid;
      userData.verifiedPhone = true;
      localStorage.setItem('autrobook_user', JSON.stringify(userData));

      status.className = 'success-text';
      status.innerText = 'Verified! Redirecting to Autrobook...';
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1000);
    } catch (error) {
      status.className = 'error-text';
      status.innerText = 'Invalid code. Please check your SMS and try again.';
      btn.disabled = false;
      btn.innerText = 'Verify & Login';
    }
  };

  window.resetStep = function() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendBtn').innerText = 'Send SMS Code';
    document.getElementById('statusText').innerText = '';
  };
</script>

</body>
</html>
