<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Autrobook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<!-- Google reCAPTCHA Script -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
/* ===== THEME ===== */
:root{
  --green-900:#0d3b16; --green-800:#1b5e20; --green-700:#2e7d32;
  --green-500:#43a047; --green-100:#e8f5e9; --green-50:#f1f8f2;
  --bg:#f0f2f5; --card:#fff; --text:#1c1e21; --muted:#65676b;
  --border:#e4e6e9; --danger:#c62828;
  --shadow-lg:0 20px 60px rgba(0,0,0,.12); --radius:20px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1419;--card:#1a1f26;--text:#e8eaed;--muted:#9aa0a6;
    --border:#2a3038;--green-100:#1c3320;--green-50:#0f1a12;
    --shadow-lg:0 20px 60px rgba(0,0,0,.5);}
}
*{margin:0;padding:0;box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
  position:relative;overflow:hidden;}
body::before{content:"";position:fixed;inset:0;
  background:radial-gradient(circle at 15% 20%,rgba(46,125,50,.12) 0%,transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(46,125,50,.08) 0%,transparent 40%);
  pointer-events:none;z-index:0;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes iconPop{0%{opacity:0;transform:scale(.3) rotate(-90deg);}
  60%{opacity:1;transform:scale(1.1) rotate(5deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
@keyframes fingerprintPulse{0%,100%{transform:scale(1);opacity:.8;}
  50%{transform:scale(1.08);opacity:1;}}

.card{position:relative;z-index:1;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);padding:40px 36px 32px;max-width:420px;width:100%;
  border:1px solid var(--border);animation:fadeUp .7s ease-out .2s both;}

.auth-header{text-align:center;margin-bottom:28px;animation:fadeUp .7s .4s both;}
.auth-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;
  background:linear-gradient(145deg,var(--green-700),var(--green-900));
  display:flex;align-items:center;justify-content:center;
  animation:iconPop .8s cubic-bezier(.34,1.56,.64,1) .3s both;
  box-shadow:0 8px 24px rgba(27,94,32,.3);}
.auth-icon i{font-size:30px;color:#fff;}
h2{font-size:23px;font-weight:800;margin-bottom:6px;}
.sub{font-size:13.5px;color:var(--muted);}

.form{animation:fadeUp .7s .6s both;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.input-wrap{position:relative;}
.input-wrap i.input-icon{position:absolute;left:16px;top:50%;
  transform:translateY(-50%);font-size:15px;color:var(--muted);pointer-events:none;}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;padding:13px 16px 13px 46px;font-size:14.5px;
  color:var(--text);outline:none;transition:border .15s,box-shadow .15s;font-family:inherit;}
.field input:focus{border-color:var(--green-700);
  box-shadow:0 0 0 3px rgba(46,125,50,.15);background:var(--card);}
.pass-toggle-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;
  font-size:14px;border-radius:6px;transition:background .15s;}
.pass-toggle-btn:hover{background:var(--border);}

.forgot-row{text-align:right;margin-top:-8px;margin-bottom:16px;}
.forgot-row a{font-size:12.5px;font-weight:600;color:var(--green-800);text-decoration:none;}
@media (prefers-color-scheme:dark){.forgot-row a{color:var(--green-500);}}
.forgot-row a:hover{text-decoration:underline;}

/* ===== RECAPTCHA BOX ===== */
.captcha-container{
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
  background: var(--card); 
  border-radius: 10px;
  overflow: hidden;
  padding: 4px;
}

/* ===== FINGERPRINT ===== */
.biometric-section{margin:20px 0;text-align:center;}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;
  font-size:12px;color:var(--muted);}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
.fingerprint-btn{width:76px;height:76px;margin:0 auto;border-radius:50%;
  background:linear-gradient(145deg,var(--green-800),var(--green-900));
  border:none;cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:34px;
  box-shadow:0 6px 20px rgba(27,94,32,.35);
  transition:transform .15s,box-shadow .2s;
  animation:fingerprintPulse 2.5s ease-in-out infinite;}
.fingerprint-btn:hover{transform:scale(1.05);
  box-shadow:0 8px 28px rgba(27,94,32,.5);}
.fingerprint-btn:active{transform:scale(.95);}
.fingerprint-btn.scanning{animation:none;
  background:linear-gradient(145deg,var(--green-500),var(--green-700));}
.fingerprint-btn.success{background:linear-gradient(145deg,#43a047,#2e7d32);}
.fingerprint-btn.error{background:linear-gradient(145deg,#c62828,#8e0000);}
.fingerprint-label{font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:500;}

/* ===== BUTTON ===== */
.btn{width:100%;padding:15px 20px;border-radius:12px;font-size:15px;
  font-weight:600;display:flex;align-items:center;justify-content:center;
  gap:10px;cursor:pointer;border:none;transition:transform .15s,box-shadow .2s,background .2s;
  font-family:inherit;}
.btn-primary{background:var(--green-800);color:#fff;
  box-shadow:0 4px 14px rgba(27,94,32,.3);}
.btn-primary:hover{background:var(--green-700);transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(27,94,32,.4);}
.btn-primary:active{transform:translateY(0) scale(.98);}
.btn-primary:disabled{background:#9e9e9e;cursor:not-allowed;transform:none;}

/* ===== ERROR ===== */
.err{background:rgba(198,40,40,.1);color:var(--danger);
  border:1px solid rgba(198,40,40,.25);padding:11px 14px;border-radius:10px;
  font-size:13px;margin-bottom:16px;display:none;align-items:center;
  gap:8px;line-height:1.4;}
.err.show{display:flex;}

/* ===== FOOTER ===== */
.footer{text-align:center;font-size:13.5px;color:var(--muted);
  animation:fadeUp .7s 1.1s both;}
.footer a{color:var(--green-800);font-weight:700;text-decoration:none;}
@media (prefers-color-scheme:dark){.footer a{color:var(--green-500);}}
.footer a:hover{text-decoration:underline;}

.badge-pill{display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--green-100),var(--green-50));
  color:var(--green-800);padding:7px 14px;border-radius:100px;
  font-size:11.5px;font-weight:700;border:1px solid var(--green-700);
  margin-top:18px;}
@media (prefers-color-scheme:dark){.badge-pill{color:var(--green-500);}}

@media (max-width:480px){
  .card{padding:32px 22px 24px;}
  h2{font-size:21px;}
  .auth-icon{width:60px;height:60px;}
  .auth-icon i{font-size:26px;}
  .fingerprint-btn{width:68px;height:68px;font-size:30px;}
}
</style>
</head>
<body>

<div class="card">

  <div class="auth-header">
    <div class="auth-icon"><i class="fas fa-sign-in-alt"></i></div>
    <h2>Welcome back</h2>
    <p class="sub">Log in to continue to Autrobook</p>
  </div>

  <div class="err" id="err">
    <i class="fas fa-exclamation-circle"></i>
    <span id="errMsg">Invalid credentials</span>
  </div>

  <div class="form">
    <div class="field">
      <label>Email address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope input-icon"></i>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input id="pass" type="password" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" class="pass-toggle-btn" onclick="togglePass(this)">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="forgot-row">
      <a href="forgot-password.html">Forgot password?</a>
    </div>

    <!-- ===== GOOGLE reCAPTCHA ===== -->
    <div class="captcha-container">
      <div class="g-recaptcha" 
           data-sitekey="6Lck5SAuAAAAAJaip9tn4qoVcWnHpO2-yusatinK" 
           data-theme="light">
      </div>
    </div>

    <button class="btn btn-primary" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> Log in
    </button>

    <!-- ===== FINGERPRINT ===== -->
    <div class="biometric-section">
      <div class="divider">or use biometric</div>
      <button class="fingerprint-btn" id="fingerprintBtn" title="Use fingerprint">
        <i class="fas fa-fingerprint"></i>
      </button>
      <div class="fingerprint-label" id="fingerprintLabel">Tap to use fingerprint</div>
    </div>
  </div>

  <div class="footer">
    New to Autrobook? <a href="signup-name.html">Create account</a>
  </div>

  <div style="text-align:center;">
    <div class="badge-pill">
      <i class="fas fa-shield-alt"></i> 18+ Free Social Media Platform
    </div>
  </div>

</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
/* ============================================================
   CONNECTED TO YOUR SUPABASE PROJECT
   ============================================================ */

// Your Supabase URL and Publishable Key
const SUPABASE_URL = 'https://gemyqaniztqrsilayblx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FuH8FWiYVK5CnylcjLDIKQ_exLB_Du_';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== PASSWORD TOGGLE =====
function togglePass(btn){
  const input = btn.parentElement.querySelector('input');
  const icon = btn.querySelector('i');
  if (input.type === 'password'){
    input.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}

// ===== ERROR HELPER =====
function showError(msg){
  document.getElementById('errMsg').textContent = msg;
  document.getElementById('err').classList.add('show');
}
function hideError(){
  document.getElementById('err').classList.remove('show');
}

// ===== LOGIN HANDLER WITH reCAPTCHA =====
document.getElementById('loginBtn').addEventListener('click', async () => {
  hideError();

  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('pass').value;
  
  // Get reCAPTCHA Response
  const recaptchaResponse = grecaptcha.getResponse();

  // Validation
  if (!email || !pass){
    showError('Please fill in all fields');
    return;
  }

  // reCAPTCHA Validation (Client-side check)
  if (recaptchaResponse.length === 0){
    showError('🤖 Please check the reCAPTCHA box.');
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

  try {
    // Supabase Login
    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: pass
    });

    if (error){
      showError(error.message || 'Invalid email or password');
      grecaptcha.reset(); // Reset captcha on fail
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log in';
      return;
    }

    // Success - Save user to local storage
    const user = {
      id: data.user.id,
      email: data.user.email,
      name: data.user.user_metadata?.full_name || data.user.email.split('@')[0],
      initials: (data.user.user_metadata?.full_name || 'U')
        .split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(),
      supabaseSession: data.session.access_token
    };

    saveUser(user);
    toast('✅ Welcome back!');
    setTimeout(() => go('index.html'), 500);

  } catch (err){
    console.error(err);
    showError('Network error. Please try again.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log in';
  }
});

// ===== FINGERPRINT (Native WebAuthn) =====
const fpBtn = document.getElementById('fingerprintBtn');
const fpLabel = document.getElementById('fingerprintLabel');

fpBtn.addEventListener('click', async () => {
  hideError();
  
  // Check if the device supports fingerprint (WebAuthn)
  if (!window.PublicKeyCredential) {
    showError('❌ Your device does not support fingerprint login.');
    return;
  }

  const storedUser = JSON.parse(localStorage.getItem('autrobook_biometric_user') || 'null');

  if (!storedUser){
    showError('❌ No fingerprint registered. Log in with password first, then enable it in Settings.');
    return;
  }

  fpBtn.classList.add('scanning');
  fpLabel.textContent = 'Waiting for fingerprint...';

  try {
    // Create a challenge for the native device authenticator
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    // Trigger the native OS fingerprint prompt
    const credential = await navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        timeout: 60000,
        userVerification: 'required',
        rpId: window.location.hostname
      }
    });

    if (credential){
      // Native fingerprint matched!
      fpBtn.classList.remove('scanning');
      fpBtn.classList.add('success');
      fpLabel.textContent = '✅ Fingerprint verified!';
      
      saveUser(storedUser);
      setTimeout(() => go('index.html'), 500);
    }
  } catch (err){
    // User cancelled or fingerprint failed
    fpBtn.classList.remove('scanning');
    fpBtn.classList.add('error');
    fpLabel.textContent = '❌ Fingerprint failed';
    showError('Fingerprint not recognized. Please use your password.');
    setTimeout(() => {
      fpBtn.classList.remove('error');
      fpLabel.textContent = 'Tap to use fingerprint';
    }, 2500);
  }
});

// Enter key navigation
document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pass').focus();
});
document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
