<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Log In</title>
<style>
body {
    margin:0; 
    background:#0a1a0f; 
    color:#e4e6eb; 
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
    min-height:100vh;
}
.logo {
    width:90px;
    height:90px;
    border-radius:20px;
    margin:50px 0 20px 0;
}
.tagline {
    color:#4caf50;
    font-size:13px;
    margin-bottom:30px;
}
input {
    width:90%;
    max-width:400px;
    padding:14px;
    margin:8px 0;
    background:#13261a;
    border:1px solid #1f3d2a;
    border-radius:8px;
    color:#e4e6eb;
    font-size:15px;
    outline:none;
}
input::placeholder{color:#7a9e80}
.btn {
    width:90%;
    max-width:400px;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
.btn-login {
    background:#2e7d32;
    color:white;
}
.btn-login:active{
    background:#1b5e20;
}
.btn-signup {
    background:transparent;
    color:#4caf50;
    border:1px solid #2e7d32;
}
.forgot {
    color:#81c784;
    text-decoration:none;
    font-size:14px;
    margin:10px 0 30px 0;
}
.footer {
    margin-top:auto;
    color:#556b5e;
    font-size:12px;
    text-align:center;
}
</style>
</head>
<body>

<img src="logo.png" class="logo">
<div class="tagline">18+ Free Social Media Platform</div>

<input type="text" placeholder="Mobile number or email">
<input type="password" placeholder="Password">

<button class="btn btn-login" onclick="alert('Login coming soon')">Log In</button>
<a href="#" class="forgot">Forgot password?</a>

<button class="btn btn-signup" onclick="window.location.href='signup.html'">Create new account</button>

<div class="footer">from Autrobook</div>

</body>
</html>
