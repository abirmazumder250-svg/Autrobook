<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0a1a0f;min-height:100vh;color:#e4e6eb;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .logo{text-align:center;margin-bottom:30px}
  .logo img{width:100px;height:100px;border-radius:22px;object-fit:cover;background:#0f5132;margin-bottom:10px}
  .logo p{font-size:18px;color:#4caf50;font-weight:bold}
  .wrap{width:100%;max-width:400px}
  .title{text-align:center;font-size:24px;font-weight:bold;margin-bottom:25px}
  .label{font-size:14px;color:#b0b3b8;margin-bottom:8px}
  input{width:100%;padding:16px 18px;border-radius:12px;border:1px solid #1f3d2a;background:#13261a;color:white;font-size:16px;margin-bottom:15px;outline:none}
  input:focus{border-color:#4caf50}
  .btn{width:100%;padding:16px;border:none;border-radius:12px;background:#2e7d32;color:white;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}
  .btn:disabled{background:#555}
  .forgot{text-align:center;margin:15px 0;font-size:15px;cursor:pointer;color:#4caf50;display:none}
  .msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px}
  .msg.error{color:#ff5252}.msg.success{color:#4caf50}
  .step{display:none}
  .otp-box{text-align:center;letter-spacing:10px;font-size:24px;font-weight:bold}
  .video-box{width:100%;border-radius:18px;overflow:hidden;background:#000;border:1px solid #1f3d2a;margin:15px 0;position:relative}
  .video-box video{width:100%;display:block}
  .face-frame{position:absolute;inset:15% 15%;border:2px dashed #4caf50;border-radius:50%;pointer-events:none}
  canvas{display:none}
  .back-link{text-align:center;color:#4caf50;margin-top:15px;cursor:pointer;font-size:14px}
</style>
</head>
<body>

<div class="logo">
  <img src="logo.png" alt="Autrobook">
  <p>18+ Free Social Media Platform</p>
</div>

<div class="wrap">
  <!-- STEP 1 : LOGIN -->
  <div id="step1" class="step" style="display:block">
    <div class="title">Please Login</div>
    <div class="label">Email Address :</div>
    <input type="email" id="email" placeholder="Enter your email">
    <div class="label">Password :</div>
    <input type="password" id="password" placeholder="Enter your password">
    <button class="btn" onclick="login()">Login</button>
    <div class="forgot" id="forgotLink" onclick="showForget()">Forget password?</div>
    <div class="msg" id="msg1"></div>
  </div>

  <!-- STEP 2 : FORGET OTP -->
  <div id="step2" class="step">
    <div class="title">Reset Password</div>
    <div class="label">Enter your Email :</div>
    <input type="email" id="resetEmail" placeholder="Your email address">
    <button class="btn" onclick="sendResetOTP()">Send OTP</button>
    <div class="back-link" onclick="backToLogin()">← Back to Login</div>
    <div class="msg" id="msg2"></div>
  </div>

  <!-- STEP 3 : VERIFY OTP -->
  <div id="step3" class="step">
    <div class="title">Enter OTP</div>
    <input type="text" id="otp" class="otp-box" placeholder="123456" maxlength="6">
    <button class="btn" onclick="verifyOTP()">Verify OTP</button>
    <div class="back-link" onclick="backToForget()">← Change Email</div>
    <div class="msg" id="msg3"></div>
  </div>

  <!-- STEP 4 : FACE VERIFICATION -->
  <div id="step4" class="step">
    <div class="title">Face Verification</div>
    <p style="text-align:center;font-size:13px;color:#aaa;margin-bottom:10px">Keep your face inside the circle</p>
    <div class="video-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="face-frame"></div>
    </div>
    <canvas id="canvas"></canvas>
    <button class="btn" onclick="captureFace()">📸 Verify Face & Login</button>
    <div class="msg" id="msg4"></div>
  </div>

</div>

<script>
// ✅ তোমার EmailJS Config এখানে বসানো হলো
const EMAILJS_SERVICE_ID = "service_bk1amce";
const EMAILJS_TEMPLATE_ID = "template_lu3iasc"; // EmailJS > Email Templates এ গিয়ে এটা বানাও
const EMAILJS_PUBLIC_KEY = "PoawEFe-OI5d9DyLb";
emailjs.init(EMAILJS_PUBLIC_KEY);

let generatedOTP = "";
let resetEmail = "";
let stream = null;

// Dummy check - Signup এর সময় Password এখানে Save হয়
function checkPassword(email, pass){
  const savedPass = localStorage.getItem('autrobook_pass_'+email);
  return savedPass && savedPass === pass;
}

function showStep(id){
  document.querySelectorAll('.step').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
}

function msg(id, t, ok){
  const el=document.getElementById(id);
  el.textContent=t;
  el.className='msg '+(ok?'success':'error');
}

// 1. LOGIN
function login(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  if(!email || !pass) return msg('msg1','Fill all fields','error');
  
  if(checkPassword(email, pass)){
    msg('msg1','Login Success! Redirecting...','success');
    saveSession(email);
    setTimeout(()=>location.href='home.html',1000);
  } else {
    msg('msg1','Email or Password not match','error');
    document.getElementById('forgotLink').style.display='block';
  }
}

// 2. SHOW FORGET
function showForget(){
  showStep('step2');
  document.getElementById('resetEmail').value = document.getElementById('email').value;
}
function backToLogin(){ showStep('step1'); }
function backToForget(){ showStep('step2'); }

// 3. SEND OTP
async function sendResetOTP(){
  resetEmail = document.getElementById('resetEmail').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(resetEmail)) return msg('msg2','Enter valid email','error');
  
  generatedOTP = String(Math.floor(100000 + Math.random()*900000));
  msg('msg2','Sending OTP...',true);
  
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: resetEmail, // Template এ {{to_email}} use করবা
      email: resetEmail,    // Template এ {{email}} use করবা 
      name: 'Autrobook User',
      otp: generatedOTP     // Template এ {{otp}} use করবা
    });
    msg('msg2','OTP sent to '+resetEmail,'success');
    showStep('step3');
  }catch(e){
    console.log(e);
    msg('msg2','Failed to send OTP: '+e.text,'error');
  }
}

// 4. VERIFY OTP
function verifyOTP(){
  const otp = document.getElementById('otp').value.trim();
  if(otp !== generatedOTP) return msg('msg3','Wrong OTP','error');
  msg('msg3','OTP Verified','success');
  showStep('step4');
  startCamera();
}

// 5. FACE VERIFICATION
async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    document.getElementById('video').srcObject = stream;
  } catch(e){
    msg('msg4','Camera permission needed','error');
  }
}

function captureFace(){
  const video=document.getElementById('video');
  const canvas=document.getElementById('canvas');
  if(!video.srcObject) return msg('msg4','Camera not started','error');
  
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  
  if(stream) stream.getTracks().forEach(t=>t.stop());
  msg('msg4','Face Verified ✅ Login Success','success');
  
  saveSession(resetEmail);
  setTimeout(()=>location.href='home.html',1200);
}

function saveSession(email){
  const userData = { 
    name: 'Autrobook User', 
    email: email, 
    uid: 'email_'+Date.now(),
    loginAt: Date.now() 
  };
  localStorage.setItem('autrobook_user', JSON.stringify(userData));
}
</script>
</body>
</html>
