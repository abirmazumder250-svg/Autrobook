<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="color-scheme" content="light dark"> 
<title>Autrobook - Login</title> 
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script> 
<script src="https://www.google.com/recaptcha/api.js" async defer></script> 
<style> 
:root{ color-scheme: light dark; } 
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif} 
body{ background: light-dark(#ffffff, #0a1a0f); min-height:100vh; color: light-dark(#111111, #e4e6eb); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; transition: background 0.3s, color 0.3s; } 
.logo{text-align:center;margin-bottom:25px} 
.logo img{ width:70px; height:70px; border-radius:18px; object-fit:cover; background: light-dark(#e8f5e9, #0f5132); margin-bottom:8px } 
.wrap{width:100%;max-width:400px} 
.title{text-align:center;font-size:24px;font-weight:bold;margin-bottom:20px} 
.label{font-size:14px;color: light-dark(#555, #b0b3b8);margin-bottom:8px} 
input{ width:100%; padding:16px 18px; border-radius:12px; border:1px solid light-dark(#ccc, #1f3d2a); background: light-dark(#f5f5f5, #13261a); color: light-dark(#111, white); font-size:16px; margin-bottom:15px; outline:none } 
input:focus{border-color:#4caf50} 
.btn{ width:100%; padding:16px; border:none; border-radius:12px; background:#2e7d32; color:white; font-size:17px; font-weight:bold; cursor:pointer; margin-top:10px } 
.btn:disabled{background:#555} 
.forgot{text-align:center;margin:15px 0;font-size:15px;cursor:pointer;color:#4caf50} 
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px} 
.msg.error{color:#ff5252} 
.msg.success{color:#4caf50} 
.step{display:none} 
.otp-box{text-align:center;letter-spacing:10px;font-size:24px;font-weight:bold} 
.video-box{ width:100%; border-radius:18px; overflow:hidden; background:#000; border:1px solid light-dark(#ccc, #1f3d2a); margin:15px 0; position:relative } 
.video-box video{width:100%;display:block} 
.face-frame{ position:absolute; inset:15% 15%; border:2px dashed #4caf50; border-radius:50%; pointer-events:none } 
canvas{display:none} 
.back-link{text-align:center;color:#4caf50;margin-top:15px;cursor:pointer;font-size:14px} 
.g-recaptcha{margin:10px 0;display:flex;justify-content:center;transform:scale(0.9)} 
.bottom-links{ text-align:center; margin-top:25px; display:flex; flex-direction:column; gap:12px; } 
.bottom-links span{ color:#4caf50; cursor:pointer; font-weight:bold; font-size:15px; } 
</style> 
</head> 
<body> 
<div class="logo"> 
<img src="logo.png" alt="Autrobook" onerror="this.src='https://via.placeholder.com/70/0a1a0f/4caf50?text=A'"> 
</div> 
<div class="wrap"> 
<!-- STEP 1 : LOGIN --> 
<div id="step1" class="step" style="display:block"> 
<div class="title">Please Login</div> 
<div class="label">Email Address :</div> 
<input type="email" id="email" placeholder="Enter your email"> 
<div class="label">Password :</div> 
<input type="password" id="password" placeholder="Enter your password"> 
<button class="btn" onclick="login()">Login</button> 
<div class="forgot" onclick="showForget()">Forget password?</div> 
<div class="msg" id="msg1"></div> 
<div class="bottom-links"> 
<span onclick="goSignup()">Signup New Account</span> 
<span onclick="selfieLogin()">Live Selfie Verification</span> 
</div> 
</div> 

<!-- STEP 2 : FORGET OTP + reCAPTCHA --> 
<div id="step2" class="step"> 
<div class="title">Reset Password</div> 
<div class="label">Enter your Email :</div> 
<input type="email" id="resetEmail" placeholder="Your email address"> 
<!-- নতুন v2 Site Key বসানো হলো -->
<div class="g-recaptcha" data-sitekey="6LfzSBwuAAAAAK4XcwjLp9vNWxGECgLc2YcNdwD5" data-callback="onCaptchaSuccess" data-expired-callback="onCaptchaExpired"></div> 
<button class="btn" id="sendOtpBtn" onclick="sendResetOTP()" disabled>Verify & Send OTP</button> 
<div class="back-link" onclick="backToLogin()">← Back to Login</div> 
<div class="msg" id="msg2"></div> 
</div> 

<!-- STEP 3 : VERIFY OTP --> 
<div id="step3" class="step"> 
<div class="title">Enter OTP</div> 
<p style="text-align:center;font-size:13px;color: light-dark(#666, #aaa)">OTP will expire in 2 minutes</p> 
<input type="text" id="otp" class="otp-box" placeholder="123456" maxlength="6"> 
<button class="btn" onclick="verifyOTP()">Verify OTP</button> 
<div class="back-link" onclick="backToForget()">← Change Email</div> 
<div class="msg" id="msg3"></div> 
</div> 

<!-- STEP 4 : LIVE SELFIE VERIFICATION --> 
<div id="step4" class="step"> 
<div class="title" id="faceTitle">Live Selfie Verification</div> 
<p style="text-align:center;font-size:13px;color: light-dark(#666, #aaa);margin-bottom:10px" id="faceSub">Keep your face inside the circle</p> 
<div class="video-box"> 
<video id="video" autoplay playsinline muted></video> 
<div class="face-frame"></div> 
</div> 
<canvas id="canvas"></canvas> 
<button class="btn" id="faceBtn" onclick="captureFace()">📸 Capture & Login</button> 
<div class="back-link" onclick="backToLogin()">← Back to Login</div> 
<div class="msg" id="msg4"></div> 
</div> 
</div> 

<script> 
const EMAILJS_SERVICE_ID = "service_bk1amce"; 
const EMAILJS_TEMPLATE_ID = "template_lu3iasc"; 
const EMAILJS_PUBLIC_KEY = "PoawEFe-OI5d9DyLb"; 
emailjs.init(EMAILJS_PUBLIC_KEY); 

let generatedOTP = ""; 
let resetEmail = ""; 
let stream = null; 
let otpTime = 0; 
let otpTries = 0; 
let captchaVerified = false; 

function onCaptchaSuccess(){ captchaVerified = true; document.getElementById('sendOtpBtn').disabled = false; } 
function onCaptchaExpired(){ captchaVerified = false; document.getElementById('sendOtpBtn').disabled = true; } 

function showStep(id){ document.querySelectorAll('.step').forEach(s=>s.style.display='none'); document.getElementById(id).style.display='block'; } 
function msg(id, t, ok){ const el=document.getElementById(id); el.textContent=t; el.className='msg '+(ok?'success':'error'); } 

function accountExists(email){ return localStorage.getItem('autrobook_pass_'+email) !== null; } 
function checkPassword(email, pass){ const savedPass = localStorage.getItem('autrobook_pass_'+email); return savedPass && savedPass === pass; } 

function login(){ 
const email = document.getElementById('email').value.trim(); 
const pass = document.getElementById('password').value; 
if(!email || !pass) return msg('msg1','Fill all fields','error'); 
if(!accountExists(email)){ msg('msg1','Account not found in Autrobook','error'); return; } 
if(checkPassword(email, pass)){ msg('msg1','Login Success! Redirecting...','success'); saveSession(email); setTimeout(()=>location.href='home.html',1000); } 
else { msg('msg1','Email or Password not match','error'); } 
} 

function selfieLogin(){ 
const email = document.getElementById('email').value.trim(); 
if(!email) return msg('msg1','First enter your Email Address','error'); 
if(!accountExists(email)) return msg('msg1','Account not found in Autrobook','error'); 
resetEmail = email; 
showStep('step4'); startCamera(); 
} 

function goSignup(){ window.location.href = 'signup.html'; } 
function showForget(){ showStep('step2'); document.getElementById('resetEmail').value = document.getElementById('email').value; } 
function backToLogin(){ showStep('step1'); grecaptcha.reset(); if(stream) stream.getTracks().forEach(t=>t.stop()); } 
function backToForget(){ showStep('step2'); } 

async function sendResetOTP(){ 
if(!captchaVerified) return msg('msg2','Please verify reCAPTCHA first','error'); 
resetEmail = document.getElementById('resetEmail').value.trim(); 
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(resetEmail)) return msg('msg2','Enter valid email','error'); 
if(!accountExists(resetEmail)) return msg('msg2','Account not found in Autrobook','error'); 
const lastSent = localStorage.getItem('otp_last_sent_'+resetEmail); 
if(lastSent && Date.now() - lastSent < 60000) return msg('msg2','Wait 1 minute before resending OTP','error'); 
generatedOTP = String(Math.floor(100000 + Math.random()*900000)); 
otpTime = Date.now(); otpTries = 0; 
localStorage.setItem('otp_last_sent_'+resetEmail, Date.now()); 
msg('msg2','Sending OTP...',true); 
try{ 
await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: resetEmail, email: resetEmail, name: 'Autrobook User', otp: generatedOTP }); 
msg('msg2','OTP sent to '+resetEmail,'success'); 
showStep('step3'); 
}catch(e){ msg('msg2','Failed to send OTP','error'); } 
} 

function verifyOTP(){ 
const otp = document.getElementById('otp').value.trim(); 
if(Date.now() - otpTime > 120000) return msg('msg3','OTP Expired. Resend new OTP','error'); 
otpTries++; 
if(otpTries > 3) return msg('msg3','Too many wrong attempts. Resend OTP','error'); 
if(otp !== generatedOTP) return msg('msg3',`Wrong OTP. ${3-otpTries} tries left`,'error'); 
msg('msg3','OTP Verified','success'); 
showStep('step4'); startCamera(); 
} 

async function startCamera(){ 
try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); document.getElementById('video').srcObject = stream; } 
catch(e){ msg('msg4','Camera permission needed','error'); } 
} 

function captureFace(){ 
const video=document.getElementById('video'); 
const canvas=document.getElementById('canvas'); 
if(!video.srcObject) return msg('msg4','Camera not started','error'); 
canvas.width=video.videoWidth; canvas.height=video.videoHeight; 
canvas.getContext('2d').drawImage(video,0,0); 
if(stream) stream.getTracks().forEach(t=>t.stop()); 
msg('msg4','Selfie Captured ✅ Login Success','success'); 
saveSession(resetEmail); 
setTimeout(()=>location.href='home.html',1200); 
} 

function saveSession(email){ 
const userData = { name: 'Autrobook User', email: email, uid: 'email_'+Date.now(), loginAt: Date.now() }; 
localStorage.setItem('autrobook_user', JSON.stringify(userData)); 
} 
</script> 
</body> 
</html>
