<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Autrobook</title>
<style>
:root{--bg:#0a1a0f;--card:#13261a;--text:#e4e6eb;--brand:#4caf50;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; height:100vh;}
.box{background:var(--card); padding:30px; border-radius:12px; width:90%; max-width:350px;}
.box h1{text-align:center; color:var(--brand); margin-bottom:20px;}
.box input{width:100%; padding:12px; margin:10px 0; background:var(--bg); border:1px solid #1f3d2a; border-radius:8px; color:var(--text);}
.box button{width:100%; padding:12px; background:var(--brand); border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer;}
</style>
</head>
<body>
<div class="box">
<h1>Autrobook</h1>
<input type="email" id="email" placeholder="Email or Phone">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Log In</button>
</div>

<script>
function login(){
  let email = document.getElementById('email').value;
  let password = document.getElementById('password').value;
  
  if(email && password){
    // After checking with Backend
    let user = {
      name: "Abir Mazumder",
      email: email,
      id: "12345",
      token: "fake_token_123"
    };
    
    // Save user data. It won't delete even if browser closes
    localStorage.setItem('autrobook_user', JSON.stringify(user));
    
    // Redirect to Home Page
    window.location.href = 'home.html';
  }else{
    alert('Please fill all fields');
  }
}

// If user is already logged in, redirect to Home directly
if(localStorage.getItem('autrobook_user')){
  window.location.href = 'home.html';
}
</script>
</body>
</html>
