<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#043D22">
<title>Log in - Autrobook</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="css/login.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="login-wrap">
  
  <div class="lang-top">
    <button class="lang-btn" id="langBtn" onclick="openLangModal()">English - US</button>
  </div>

  <div class="top-logo">
    <img src="logo.png" alt="Autrobook">
  </div>

  <form id="loginForm" class="login-form">
    <div class="input-group">
      <input type="text" id="email" placeholder="Username or email" required autocomplete="email">
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn-login" id="loginBtn">Log in</button>
    <a href="reset-password.html" class="link-forgot" id="forgotLink">Forgot password?</a>
  </form>

  <div class="g-recaptcha" data-sitekey="6LfVliMuAAAAALzEo5ntOmIqZNY40IcMa8dtLg_d"></div>

  <div id="errorMsg" class="error-msg"></div>

  <div class="divider"><span id="orText">or</span></div>

  <button class="btn-google" onclick="googleLogin()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.25-.164-1.84H9v3.481h4.844c-.209 1.131-.868 2.09-1.852 2.731v2.263h2.991c1.75-1.613 2.76-3.986 2.76-6.635z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.991-2.263c-.83.555-1.89.884-2.965.884-2.282 0-4.213-1.541-4.902-3.608H.945v2.267C2.43 16.36 5.486 18 9 18z"/><path fill="#FBBC05" d="M4.098 10.829A5.4 5.4 0 0 1 3.85 9c0-.63.11-1.24.248-1.829V4.904H.945A9.018 9.018 0 0 0 0 9c0 1.45.35 2.82.945 4.096l3.153-2.267z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.486 0 2.43 1.64.945 4.096l3.153 2.267C4.787 5.12 6.718 3.58 9 3.58z"/></svg>
    <span id="googleText">Continue with Google</span>
  </button>

  <button class="btn-create" id="btnCreate" onclick="window.location.href='signup-name.html'">Create new account</button>

  <div class="footer-meta">Autrobook</div>
  <div class="footer-sub" id="footerSub">18+ Free Social Media Platform</div>
</div>

<!-- Language Modal -->
<div class="lang-modal-back" id="langModal" onclick="closeLangModal()">
  <div class="lang-modal" onclick="event.stopPropagation()">
    <h3 id="langTitle">Select Language</h3>
    <div class="lang-list" id="langList"></div>
    <button class="lang-close" id="langClose" onclick="closeLangModal()">Close</button>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
