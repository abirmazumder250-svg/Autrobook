<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Autrobook - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{ color-scheme: light dark; --brand-green: #0f5132; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background: light-dark(#ffffff, #121212);
  min-height:100vh;
  color: light-dark(#111111, #e4e6eb);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; transition: background 0.3s, color 0.3s;
}
/* লোগোর উপরে ট্রান্সলেশন বার স্টাইল */
.lang-bar{
  margin-bottom: 20px;
  text-align: center;
}
.lang-bar select{
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid light-dark(#ccc, #2c2c2e);
  background: light-dark(#f5f5f5, #1c1c1e);
  color: light-dark(#111, white);
  font-size: 14px;
  cursor: pointer;
  outline: none;
}
.logo{text-align:center;margin-bottom:25px}
.logo img{
  width:70px; height:70px; border-radius:18px; object-fit:cover;
  background: light-dark(#e8f5e9, #1e3a2f); margin-bottom:8px
}
.wrap{width:100%;max-width:400px}
.title{text-align:center;font-size:24px;font-weight:bold;margin-bottom:20px}
.label{font-size:14px;color: light-dark(#555, #b0b3b8);margin-bottom:8px}
input{
  width:100%; padding:16px 18px; border-radius:12px;
  border:1px solid light-dark(#ccc, #2c2c2e);
  background: light-dark(#f5f5f5, #1c1c1e);
  color: light-dark(#111, white); font-size:16px; margin-bottom:15px; outline:none
}
input:focus{border-color:var(--brand-green)}
.btn{
  width:100%; padding:16px; border:none; border-radius:12px;
  background:var(--brand-green); color:white; font-size:17px; font-weight:bold; cursor:pointer; margin-top:10px
}
.btn:disabled{background:#555}
.forgot{text-align:center;margin:15px 0;font-size:15px;cursor:pointer;color:var(--brand-green)}
.msg{text-align:center;font-size:15px;font-weight:bold;min-height:20px;margin-top:10px}
.msg.error{color:#ff3333 !important;}
.msg.success{color:#4caf50}
.step{display:none}
.otp-box{text-align:center;letter-spacing:10px;font-size:24px;font-weight:bold}
.video-box{
  width:100%; border-radius:18px; overflow:hidden; background:#000;
  border:1px solid light-dark(#ccc, #2c2c2e); margin:15px 0; position:relative
}
.video-box video{width:100%;display:block}
.face-frame{ position:absolute; inset:15% 15%; border:2px dashed #198754; border-radius:50%; pointer-events:none }
canvas{display:none}
.back-link{text-align:center;color:var(--brand-green);margin-top:15px;cursor:pointer;font-size:14px}
.g-recaptcha{margin:10px 0;display:flex;justify-content:center;transform:scale(0.9)}
.bottom-links{ text-align:center; margin-top:25px; display:flex; flex-direction:column; gap:12px; }
.bottom-links span{ color:var(--brand-green); cursor:pointer; font-weight:bold; font-size:15px; }
</style>
</head>
<body>

<!-- লোগোর উপরে ট্রান্সলেশন বার (মালয়েশিয়া সহ) -->
<div class="lang-bar">
  <select id="langSelect" onchange="changeLanguage()">
    <option value="en">English (US)</option>
    <option value="ms">🇲🇾 Bahasa Melayu (Malaysia)</option>
    <option value="bn">বাংলা</option>
    <option value="hi">हिन्दी</option>
    <option value="ar">العربية</option>
    <option value="es">Español</option>
  </select>
</div>

<div class="logo">
  <img src="logo.png" alt="Autrobook" onerror="this.src='https://via.placeholder.com/70/1c1c1e/198754?text=A'">
</div>

<div class="wrap">
<!-- STEP 1 : LOGIN -->
<div id="step1" class="step" style="display:block">
  <div class="title" data-key="loginTitle">Please Login</div>
  <div class="label" data-key="emailLabel">Email Address :</div>
  <input type="email" id="email" placeholder="Enter your email">
  <div class="label" data-key="passLabel">Password :</div>
  <input type="password" id="password" placeholder="Enter your password">
  <button class="btn" onclick="login()" data-key="loginBtn">Login</button>
  <div class="forgot" onclick="showForget()" data-key="forgotText">Forget password?</div>
  <div class="msg" id="msg1"></div>
  <div class="bottom-links">
    <span onclick="goSignup()" data-key="signupText">Signup New Account</span>
    <span onclick="selfieLogin()" data-key="selfieText">Live Selfie Verification</span>
  </div>
</div>

<!-- STEP 2 : FORGET OTP + reCAPTCHA -->
<div id="step2" class="step">
  <div class="title">Reset Password</div>
  <div class="label">Enter your Email :</div>
  <input type="email" id="resetEmail" placeholder="Your email address">
  
  <div class="g-recaptcha" data-sitekey="6Leifx0uAAAAAP0vZ1H6sH9T7UfUH8lpyhWakTze" data-callback="onCaptchaSuccess" data-expired-callback="onCaptchaExpired"></div>
  
  <button class="btn" id="sendOtpBtn" onclick="sendResetOTP()" disabled>Verify & Send OTP</button>
  <div class="back-link" onclick="backToLogin()">← Back to Login</div>
  <div class="msg" id="msg2"></div>
</div>

<!-- STEP 3 : VERIFY OTP -->
<div id="step3" class="step">
  <div class="title">Enter OTP</div>
  <p style="text-align:center;font-size:13px;color: light-dark(#666, #aaa)" id="otpTimerText">OTP will expire in <span id="timer">02:00</span> minutes</p>
  <input type="text" id="otp" class="otp-box" placeholder="123456" maxlength="6">
  <button class="btn" onclick="verifyOTP()">Verify OTP</button>
  <div class="back-link" onclick="backToForget()">← Change Email</div>
  <div class="msg" id="msg3"></div>
</div>

<!-- STEP 4 : LIVE SELFIE VERIFICATION -->
<div id="step4" class="step">
  <div class="title" id="faceTitle">Live Selfie Verification</div>
  <p style="text-align:center;font-size:13px;color: light-dark(#666, #aaa);margin-bottom:10px" id="faceSub">Keep your face inside the circle</p>
  <div class="video-box">
    <video id="video" autoplay playsinline muted></video>
    <div class="face-frame"></div>
  </div>
  <canvas id="canvas"></canvas>
  <button class="btn" id="faceBtn" onclick="captureFace()">📸 Capture & Login</button>
  <div class="back-link" onclick="backToLogin()">← Back to Login</div>
  <div class="msg" id="msg4"></div>
</div>
</div>

<script>
const EMAILJS_SERVICE_ID = "service_bk1amce";
const EMAILJS_TEMPLATE_ID = "template_lu3iasc";
const EMAILJS_PUBLIC_KEY = "PoawEFe-OI5d9DyLb";
emailjs.init(EMAILJS_PUBLIC_KEY);

let generatedOTP = "";
let resetEmail = "";
let stream = null;
let otpTime = 0;
let otpTries = 0;
let captchaVerified = false;
let countdownInterval = null;

// মালয়েশিয়াসহ ভাষা ডিকশনারি
let currentLang = localStorage.getItem('lang') || 'en';
const translations = {
  en: { loginTitle: "Please Login", emailLabel: "Email Address :", passLabel: "Password :", loginBtn: "Login", forgotText: "Forget password?", signupText: "Signup New Account", selfieText: "Live Selfie Verification" },
  ms: { loginTitle: "Sila Log Masuk", emailLabel: "Alamat E-mel :", passLabel: "Kata Laluan :", loginBtn: "Log Masuk", forgotText: "Lupa kata laluan?", signupText: "Daftar Akaun Baru", selfieText: "Pengesahan Selfie Langsung" },
  bn: { loginTitle: "দয়া করে লগইন করুন", emailLabel: "ইমেইল ঠিকানা :", passLabel: "পাসওয়ার্ড :", loginBtn: "লগইন", forgotText: "পাসওয়ার্ড ভুলে গেছেন?", signup_text: "নতুন অ্যাকাউন্ট তৈরি করুন", selfieText: "লাইভ সেলফি ভেরিফিকেশন" },
  hi: { loginTitle: "कृपया लॉगिन करें", emailLabel: "ईमेल एड्रेस :", passLabel: "पासवर्ड :", loginBtn: "लॉगिन", forgotText: "पासवर्ड भूल गए?", signupText: "नया अकाउंट बनाएं", selfieText: "लाइव सेल्फी वेरिफिकेशन" },
  ar: { loginTitle: "الرجاء تسجيل الدخول", emailLabel: "عنوان البريد الإلكتروني :", passLabel: "كلمة المرور :", loginBtn: "تسجيل الدخول", forgotText: "هل نسيت كلمة المرور؟", signupText: "إنشاء حساب جديد", selfieText: "التحقق من السيلفي المباشر" },
  es: { loginTitle: "Por favor inicie sesión", emailLabel: "Correo Electrónico :", passLabel: "Contraseña :", loginBtn: "Iniciar Sesión", forgotText: "¿Olvidó su contraseña?", signupText: "Registrar Nueva Cuenta", selfieText: "Verificación Facial en Vivo" }
};

function applyLanguage(lang){
  currentLang = lang; localStorage.setItem('lang', lang);
  document.body.style.direction = (lang==='ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if(translations[lang] && translations[lang][key]){ el.innerText = translations[lang][key]; }
  });
}

window.changeLanguage = () => {
  applyLanguage(document.getElementById('langSelect').value);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langSelect').value = currentLang;
  applyLanguage(currentLang);
});

function onCaptchaSuccess(){
  captchaVerified = true;
  document.getElementById('sendOtpBtn').disabled = false;
}
function onCaptchaExpired(){
  captchaVerified = false;
  document.getElementById('sendOtpBtn').disabled = true;
}
function showStep(id){
  document.querySelectorAll('.step').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
}
function msg(id, t, ok){
  const el=document.getElementById(id);
  el.textContent=t;
  el.className='msg '+(ok?'success':'error');
}
function accountExists(email){
  return localStorage.getItem('autrobook_pass_'+email) !== null || (JSON.parse(localStorage.getItem('ab_users')||'[]')).find(u=>u.email===email);
}
function checkPassword(email, pass){
  const savedPass = localStorage.getItem('autrobook_pass_'+email);
  if(savedPass && savedPass === pass) return true;
  const users = JSON.parse(localStorage.getItem('ab_users')||'[]');
  const u = users.find(x=>x.email===email);
  return u && u.pass === pass;
}
function login(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  if(!email || !pass) return msg('msg1','Fill all fields','error');
  if(!accountExists(email)){
    msg('msg1','Your account not found in our history','error');
    return;
  }
  if(checkPassword(email, pass)){
    msg('msg1','Login Success! Redirecting...','success');
    saveSession(email);
    setTimeout(()=>location.href='home.html',1000);
  } else {
    msg('msg1','Email or Password not match','error');
  }
}
function selfieLogin(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email) return msg('msg1','First enter your Email Address','error');
  if(!accountExists(email)) return msg('msg1','Your account not found in our history','error');
  resetEmail = email;
  showStep('step4');
  startCamera();
}
function goSignup(){
  window.location.href = 'signup-name.html';
}
function showForget(){
  showStep('step2');
  document.getElementById('resetEmail').value = document.getElementById('email').value;
}
function backToLogin(){
  showStep('step1');
  try{ grecaptcha.reset(); }catch(e){}
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(countdownInterval) clearInterval(countdownInterval);
}
function backToForget(){
  showStep('step2');
  if(countdownInterval) clearInterval(countdownInterval);
}

function startOTPTimer() {
  if(countdownInterval) clearInterval(countdownInterval);
  let timeLeft = 120;
  const timerDisplay = document.getElementById('timer');
  
  countdownInterval = setInterval(() => {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;
    timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    
    if(timeLeft <= 0) {
      clearInterval(countdownInterval);
      timerDisplay.textContent = "00:00 (Expired)";
    }
    timeLeft--;
  }, 1000);
}

async function sendResetOTP(){
  if(!captchaVerified) return msg('msg2','Please verify reCAPTCHA first','error');
  resetEmail = document.getElementById('resetEmail').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(resetEmail)) return msg('msg2','Enter valid email','error');
  if(!accountExists(resetEmail)) return msg('msg2','Your account not found in our history','error');
  
  const lastSent = localStorage.getItem('otp_last_sent_'+resetEmail);
  if(lastSent && Date.now() - lastSent < 60000) return msg('msg2','Wait 1 minute before resending OTP','error');
  
  generatedOTP = String(Math.floor(100000 + Math.random()*900000));
  otpTime = Date.now();
  otpTries = 0;
  localStorage.setItem('otp_last_sent_'+resetEmail, Date.now());
  msg('msg2','Sending OTP...',true);
  
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: resetEmail,
      email: resetEmail,
      name: 'Autrobook User',
      otp: generatedOTP
    });
    msg('msg2','OTP sent to '+resetEmail,'success');
    showStep('step3');
    startOTPTimer();
  }catch(e){
    msg('msg2','Failed to send OTP','error');
  }
}
function verifyOTP(){
  const otp = document.getElementById('otp').value.trim();
  if(Date.now() - otpTime > 120000) return msg('msg3','OTP Expired. Resend new OTP','error');
  otpTries++;
  if(otpTries > 3) return msg('msg3','Too many wrong attempts. Resend OTP','error');
  if(otp !== generatedOTP) return msg('msg3',`Wrong OTP. ${3-otpTries} tries left`,'error');
  
  if(countdownInterval) clearInterval(countdownInterval);
  msg('msg3','OTP Verified','success');
  showStep('step4');
  startCamera();
}
async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    document.getElementById('video').srcObject = stream;
  } catch(e){
    msg('msg4','Camera permission needed','error');
  }
}
function captureFace(){
  const video=document.getElementById('video');
  const canvas=document.getElementById('canvas');
  if(!video.srcObject) return msg('msg4','Camera not started','error');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  msg('msg4','Selfie Captured ✅ Login Success','success');
  saveSession(resetEmail);
  setTimeout(()=>location.href='home.html',1200);
}
function saveSession(email){
  const userData = { name: 'Autrobook User', email: email, uid: 'email_'+Date.now(), loginAt: Date.now() };
  localStorage.setItem('autrobook_user', JSON.stringify(userData));
  localStorage.setItem('ab_logged_in', '1');
}
</script>
</body>
  </html>
