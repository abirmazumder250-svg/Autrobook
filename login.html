<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autrobook - Log in</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#1c1c1e;min-height:100vh;color:white}
.top{padding:15px}
.back{width:40px;height:40px;background:#2c2c2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.lang{text-align:center;color:#999;margin:5px 0 20px;font-size:15px}
.logo{text-align:center;margin-bottom:30px}
.logo img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:#0f5132}
.logo p{font-size:26px;font-weight:bold;margin-top:5px}
.wrap{padding:0 20px 30px;max-width:450px;margin:0 auto}
input{width:100%;padding:18px 20px;border-radius:18px;border:1px solid #555;background:transparent;color:white;font-size:17px;margin-bottom:15px;outline:none}
input::placeholder{color:#aaa}
input:focus{border-color:#1877f2}
.btn{width:100%;padding:16px;border:none;border-radius:30px;background:#1877f2;color:white;font-size:18px;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:.6;background:#555}
.btn-outline{width:100%;padding:15px;border:1px solid #1877f2;border-radius:30px;background:transparent;color:#4a9cff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:20px}
.btn-green{background:#00a400}
.forgot{text-align:center;margin:20px 0;font-size:17px;cursor:pointer}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px}
.msg.error{color:#ff8a8a}.msg.success{color:#8affa0}
.footer{text-align:center;margin-top:20px;color:#ccc}
.hint{text-align:center;color:#888;font-size:13px;margin-top:10px}
.step-title{text-align:center;font-size:16px;margin-bottom:15px;color:#ddd}
.otp-box{text-align:center;letter-spacing:8px;font-size:22px;font-weight:bold}
.video-box{width:100%;border-radius:18px;overflow:hidden;background:#000;border:1px solid #555;margin-bottom:15px;position:relative}
.video-box video{width:100%;display:block}
.face-frame{position:absolute;inset:15% 15%;border:2px dashed #4a9cff;border-radius:50%;pointer-events:none}
canvas{display:none}
.timer{color:#4a9cff;font-size:13px;text-align:center;margin:5px 0}
</style>
</head>
<body>
<div class="top"><div class="back" onclick="location.href='/index.html'">←</div></div>
<div class="lang">English (US) ∨</div>
<div class="logo"><img src="logo.png" alt="Autrobook"><p>Autrobook</p></div>

<div class="wrap">

<!-- STEP 1 : EMAIL -->
<div id="step1">
  <div class="step-title">Log in with Email OTP</div>
  <input type="email" id="email" placeholder="Email address" autocomplete="email">
  <input type="text" id="fullName" placeholder="Full Name (for Sign Up only)" style="display:none">
  <button class="btn" id="sendOtpBtn" onclick="sendEmailOTP()">Send Email OTP</button>
  <div class="forgot" onclick="toggleSignup()">New here? Create new account</div>
</div>

<!-- STEP 2 : OTP -->
<div id="step2" style="display:none">
  <div class="step-title">Enter 6-digit code sent to<br><b id="showEmail"></b></div>
  <input type="text" id="otp" class="otp-box" placeholder="123456" maxlength="6" inputmode="numeric">
  <button class="btn" id="verifyOtpBtn" onclick="verifyOTP()">Verify OTP</button>
  <div class="timer" id="timer"></div>
  <button class="btn-outline" onclick="sendEmailOTP(true)">Resend OTP</button>
  <div class="forgot" onclick="backToEmail()">Change Email</div>
</div>

<!-- STEP 3 : FACE VERIFICATION -->
<div id="step3" style="display:none">
  <div class="step-title">Face Verification<br><span style="font-size:13px;color:#aaa">মুখটা গোল দাগের ভিতরে রাখুন</span></div>
  <div class="video-box">
    <video id="video" autoplay playsinline muted></video>
    <div class="face-frame"></div>
  </div>
  <canvas id="canvas"></canvas>
  <button class="btn btn-green" id="faceBtn" onclick="captureFace()">📸 Verify Face & Login</button>
  <div class="forgot" onclick="skipFace()">Skip Face Verification</div>
</div>

<div class="msg" id="msg"></div>
<button class="btn-outline" onclick="location.href='/signup-name.html'" style="margin-top:60px">Create new account</button>
<div class="footer">∞ Autrobook</div>
</div>

<script>
// ============ EmailJS CONFIG - এখানে তোমারটা বসাও ============
const EMAILJS_PUBLIC_KEY = "YOUR_PUBLIC_KEY"; // EmailJS Dashboard > Account
const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID"; // e.g. service_xxxx
const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID"; // Template এ {{otp}} {{to_email}} থাকতে হবে
emailjs.init(EMAILJS_PUBLIC_KEY);

let generatedOTP = "";
let userEmail = "";
let isSignup = false;
let stream = null;
let timerInt = null;

function msg(t,ok){const el=document.getElementById('msg');el.textContent=t;el.className='msg '+(ok?'success':'error');}
function toggleSignup(){
  isSignup = !isSignup;
  document.getElementById('fullName').style.display = isSignup ? 'block' : 'none';
  document.querySelector('#step1 .forgot').textContent = isSignup ? 'Already have account? Login' : 'New here? Create new account';
}

// ===== 1. SEND EMAIL OTP =====
async function sendEmailOTP(isResend=false){
  userEmail = document.getElementById('email').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userEmail)) return msg('Enter a valid email','error');
  if(isSignup && !document.getElementById('fullName').value.trim()) return msg('Enter your full name','error');

  generatedOTP = String(Math.floor(100000 + Math.random()*900000));
  const btn = document.getElementById('sendOtpBtn');
  btn.disabled = true; btn.textContent = 'Sending OTP...';
  msg('Sending OTP to '+userEmail+'...', true);

  try{
    // EmailJS দিয়ে OTP পাঠানো - ফ্রি, মাসে 200টা
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: userEmail,
      otp: generatedOTP,
      to_name: document.getElementById('fullName').value.trim() || 'Autrobook User'
    });
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    document.getElementById('showEmail').textContent = userEmail;
    msg('OTP sent! Check your email inbox / spam.','success');
    startTimer();
  }catch(e){
    console.error(e);
    // Demo mode: যদি EmailJS সেট না থাকে, তাও OTP console এ দেখাবে
    msg('EmailJS not setup. Demo OTP: '+generatedOTP+' (Console এ দেখো)','error');
    console.log('DEMO OTP:', generatedOTP);
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    document.getElementById('showEmail').textContent = userEmail;
    startTimer();
  }
  btn.disabled=false; btn.textContent='Send Email OTP';
}

function startTimer(){
  let sec=60;
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    document.getElementById('timer').textContent = sec>0 ? 'Resend after '+sec+'s' : 'You can resend now';
    if(sec<=0) clearInterval(timerInt);
    sec--;
  },1000);
}

// ===== 2. VERIFY OTP =====
function verifyOTP(){
  const entered = document.getElementById('otp').value.trim();
  if(entered.length!==6) return msg('Enter 6-digit OTP','error');
  if(entered !== generatedOTP) return msg('Wrong OTP. Try again.','error');
  msg('OTP Verified! Now Face Verification','success');
  document.getElementById('step2').style.display='none';
  document.getElementById('step3').style.display='block';
  startCamera();
}
function backToEmail(){
  document.getElementById('step2').style.display='none';
  document.getElementById('step1').style.display='block';
}

// ===== 3. FACE VERIFICATION =====
async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    document.getElementById('video').srcObject = stream;
  }catch(e){ msg('Camera permission needed for Face Verification','error'); }
}

async function captureFace(){
  const video=document.getElementById('video');
  const canvas=document.getElementById('canvas');
  if(!video.srcObject) return msg('Camera not started','error');
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const faceImage = canvas.toDataURL('image/jpeg',0.8);

  // Face আছে কিনা চেক - Browser FaceDetector API
  let faceFound = true;
  try{
    if('FaceDetector' in window){
      const detector = new FaceDetector();
      const faces = await detector.detect(video);
      faceFound = faces.length>0;
    }
  }catch(e){ faceFound = true; } // API না থাকলে ছবি উঠলেই OK

  if(!faceFound) return msg('No face detected. মুখটা গোলের ভিতরে রাখুন','error');

  finishLogin(faceImage);
}

function skipFace(){ finishLogin(null); }

function finishLogin(faceImage){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  const name = document.getElementById('fullName').value.trim() || 'Autrobook User';
  const userData = {
    name: name, email: userEmail, phone: '', uid: 'email_'+Date.now(),
    id: 'email_'+Date.now(), img:99, profilePic:'', faceVerified: !!faceImage,
    faceImage: faceImage || '', verifiedEmail:true, loginAt: Date.now()
  };
  localStorage.setItem('autrobook_user', JSON.stringify(userData));
  msg('Face Verified! Welcome to Autrobook...','success');
  setTimeout(()=>location.href='/index.html',800);
}
</script>
</body>
</html>
