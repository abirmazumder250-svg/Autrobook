<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Autrobook</title>
<style>
:root{--bg:#0a1a0f;--card:#13261a;--text:#e4e6eb;--brand:#4caf50;--border:#1f3d2a;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
body{background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
.box{background:var(--card); padding:25px; border-radius:12px; width:100%; max-width:380px; border:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.box h1{text-align:center; color:var(--brand); margin-bottom:15px; font-size:28px;}
.tabs{display:flex; gap:10px; margin-bottom:20px;}
.tabs button{flex:1; padding:10px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; cursor:pointer; font-weight:bold;}
.tabs button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.box input{width:100%; padding:12px; margin:8px 0; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); outline:none;}
.box input:focus{border-color:var(--brand);}
.row{display:flex; gap:10px;}
.row input{width:50%;}
.box button.main-btn{width:100%; padding:12px; background:var(--brand); border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px; font-size:15px;}
.box button.main-btn:disabled{opacity:0.5; cursor:not-allowed;}
.otp-box{display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
.link{color:var(--brand); text-align:center; margin-top:15px; cursor:pointer; font-size:14px;}
.small{font-size:12px; color:#7a9e80; margin-top:5px;}
.otp-btns{display:flex; gap:10px; margin-top:8px;}
.otp-btns button{flex:1; padding:10px; background:#2196f3; border:none; color:white; border-radius:8px; cursor:pointer; font-weight:bold;}
.msg-box{margin-top:10px; font-size:13px; text-align:center; color:#ff5252;}
#recaptcha-container{margin-top:10px;}
</style>
</head>
<body>
<div class="box">
<h1>Autrobook</h1>
<div class="tabs">
<button id="loginTab" class="active" onclick="showTab('login')">Log In</button>
<button id="signupTab" onclick="showTab('signup')">Sign Up</button>
</div>

<!-- LOGIN FORM -->
<div id="loginForm">
<input type="text" id="loginPhone" placeholder="Phone: +8801XXXXXXXXX" autocomplete="tel">
<input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
<button class="main-btn" onclick="loginWithPassword()">Log In</button>
<button class="main-btn" style="background:#2196f3; margin-top:8px;" onclick="loginWithOTP()">Login with OTP</button>
</div>

<!-- SIGNUP FORM -->
<div id="signupForm" style="display:none;">
<div class="row">
<input type="text" id="firstName" placeholder="First Name">
<input type="text" id="lastName" placeholder="Last Name">
</div>
<input type="text" id="signupPhone" placeholder="Phone: +8801XXXXXXXXX">
<input type="email" id="signupEmail" placeholder="Email Address">
<input type="password" id="signupPassword" placeholder="New Password (Min 6 chars)">
<div class="otp-box" id="otpBox">
<input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric">
<div class="small" id="otpInfo"></div>
<div class="otp-btns">
<button type="button" id="sendSMSBtn" onclick="sendOTP()">Send SMS</button>
<button type="button" onclick="sendOTPCall()">Call Me</button>
</div>
<button class="main-btn" onclick="verifyOTP()">Verify & Sign Up</button>
</div>
<button class="main-btn" id="signupBtn" onclick="startSignup()">Create Account</button>
</div>

<div id="recaptcha-container"></div>
<div id="errorMsg" class="msg-box"></div>
<div class="link" onclick="resetPasswordDemo()">Forgot Password?</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// Firebase Config - তোমার দেওয়া
const firebaseConfig = {
apiKey: "AIzaSyBkT_BYBUagMck5z0bLSVRsL_uJs9KUaJI",
authDomain: "autrobook-ad3d5.firebaseapp.com",
projectId: "autrobook-ad3d5",
storageBucket: "autrobook-ad3d5.firebasestorage.app",
messagingSenderId: "554222945815",
appId: "1:554222945815:web:0ba445f3f6ee6de6f1fe52",
measurementId: "G-Z8QM0NVR6W"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Redirect if logged in
auth.onAuthStateChanged(user => {
if(user && localStorage.getItem('autrobook_user')) {
window.location.href = 'home.html';
}
});

if (window.top !== window.self) { window.top.location = window.self.location; }

let confirmationResult = null;
let signupData = {};
let recaptchaVerifier;

window.onload = () => {
recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
'size': 'invisible',
'callback': () => {}
});
}

function showError(msg, isSuccess = false) {
const el = document.getElementById('errorMsg');
el.style.color = isSuccess ? '#4caf50' : '#ff5252';
el.innerText = msg;
}

function showTab(tab) {
showError('');
document.getElementById('loginTab').classList.remove('active');
document.getElementById('signupTab').classList.remove('active');
document.getElementById('loginForm').style.display = 'none';
document.getElementById('signupForm').style.display = 'none';
if (tab === 'login') {
document.getElementById('loginTab').classList.add('active');
document.getElementById('loginForm').style.display = 'block';
} else {
document.getElementById('signupTab').classList.add('active');
document.getElementById('signupForm').style.display = 'block';
}
}

// Login with Password
function loginWithPassword() {
let phone = document.getElementById('loginPhone').value.trim();
let password = document.getElementById('loginPassword').value;
if (!phone || !password) { showError('Fill Phone and Password'); return; }

auth.signInWithEmailAndPassword(phone + "@autrobook.com", password)
.then((userCredential) => {
saveSession(userCredential.user);
}).catch((error) => {
showError(error.message);
});
}

// Login with OTP
function loginWithOTP() {
let phone = document.getElementById('loginPhone').value.trim();
if(!phone) { showError('Enter Phone Number first'); return; }
sendOTPFirebase(phone, "login");
}

// Start Signup
function startSignup() {
showError('');
let fn = document.getElementById('firstName').value.trim();
let ln = document.getElementById('lastName').value.trim();
let phone = document.getElementById('signupPhone').value.trim();
let email = document.getElementById('signupEmail').value.trim();
let pass = document.getElementById('signupPassword').value;

if (!fn || !ln || !phone || !email || !pass) { showError('Fill all fields'); return; }
if (pass.length < 6) { showError('Password min 6 chars'); return; }
if(!phone.startsWith('+880')) { showError('Phone format: +8801XXXXXXXXX'); return; }

signupData = { name: fn + ' ' + ln, email: email, password: pass, phone: phone };
document.getElementById('otpBox').style.display = 'block';
document.getElementById('signupBtn').style.display = 'none';
document.getElementById('otpInfo').innerText = 'OTP will be sent to: ' + phone;
}

// Send OTP via SMS
function sendOTP() {
sendOTPFirebase(signupData.phone, "signup");
}

function sendOTPCall() {
showError('Firebase Call Auth requires paid plan. Using SMS OTP.', true);
sendOTPFirebase(signupData.phone, "signup");
}

function sendOTPFirebase(phone, type) {
document.getElementById('sendSMSBtn').disabled = true;
auth.signInWithPhoneNumber(phone, recaptchaVerifier)
.then((result) => {
confirmationResult = result;
showError('OTP Sent to ' + phone, true);
document.getElementById('sendSMSBtn').disabled = false;
}).catch((error) => {
showError(error.message);
document.getElementById('sendSMSBtn').disabled = false;
});
}

// Verify OTP
function verifyOTP() {
let otp = document.getElementById('otpInput').value;
if(!confirmationResult) { showError('Send OTP first'); return; }

confirmationResult.confirm(otp).then((result) => {
const user = result.user;

// Create user in Firestore
db.collection("users").doc(user.uid).set({
name: signupData.name,
email: signupData.email,
phone: signupData.phone,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
});

saveSession(user);
}).catch((error) => {
showError('Invalid OTP: ' + error.message);
});
}

function saveSession(user) {
let sessionUser = {
name: user.displayName || signupData.name,
email: user.email,
phone: user.phoneNumber,
id: user.uid,
token: user.uid
};
localStorage.setItem('autrobook_user', JSON.stringify(sessionUser));
alert('Login Success ✅');
window.location.href = 'home.html';
}

function resetPasswordDemo() {
let email = prompt('Enter your Email to reset password:');
if (email) {
auth.sendPasswordResetEmail(email)
.then(() => alert('Password reset email sent!'))
.catch((error) => showError(error.message));
}
}
</script>
</body>
</html>
