<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d3b">
  <title>Autrobook — Safety First Social</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Global Core Icon Framework -->
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <!-- Core Modular Layout Component Stylesheet Links -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/search-bar.css">
  <link rel="stylesheet" href="css/friends.css">
  <link rel="stylesheet" href="css/groups.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/reels.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/notification.css">
</head>
<body>

<!-- TOPBAR ACCESSIBILITY COMPONENT -->
<header class="topbar">
  <div class="brand" onclick="scrollTopPage()">
    <img src="logo.png" alt="Autrobook" class="logo-img" onerror="this.style.display='none'">
    <span class="brand-name">Autrobook</span>
    <span class="vbadge" title="Official"><i class="fas fa-check"></i></span>
  </div>
  
  <!-- Optimized Structural Path Redirecting Directly To Your Unified Search Component -->
  <div class="search" onclick="window.location.href='search-bar.html'" style="cursor: pointer;">
    <i class="fas fa-search" style="color:var(--muted)"></i>
    <input placeholder="Search Autrobook..." aria-label="Search" id="globalSearch" readonly style="cursor: pointer;">
  </div>
  
  <div class="top-actions">
    <button class="icon-btn" onclick="window.location.href='notification.html'" title="Notifications">
      <i class="fas fa-bell"></i><span class="notif-dot" id="notifDot"></span>
    </button>
    <button class="icon-btn" onclick="toggleTheme()" title="Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
    <button class="icon-btn" onclick="window.location.href='settings.html'" title="Settings"><i class="fas fa-cog"></i></button>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR NAVIGATION CONTAINER -->
  <aside class="sidebar">
    <div class="side-card profile-mini">
      <div class="pm-row">
        <div class="avatar" onclick="window.location.href='profile.html'" style="cursor:pointer;"><i class="fas fa-user"></i></div>
        <div class="pm-info">
          <div class="pm-name" onclick="window.location.href='profile.html'" style="cursor:pointer;">
            <span>Abir Mazumder</span> 
            <span class="vbadge" style="background:#000; color:#fff;" title="Black Verified"><i class="fas fa-check"></i></span>
          </div>
          <div class="pm-sub" onclick="window.location.href='profile.html'">View profile →</div>
        </div>
      </div>
    </div>
    <div class="side-card">
      <div class="nav-item active" onclick="filterFeed('all')"><i class="fas fa-newspaper"></i> News Feed</div>
      <div class="nav-item" onclick="window.location.href='friends.html'"><i class="fas fa-users"></i> Friends</div>
      <div class="nav-item" onclick="window.location.href='groups.html'"><i class="fas fa-users-rectangle"></i> Groups</div>
      <div class="nav-item" onclick="window.location.href='games.html'"><i class="fas fa-gamepad"></i> Games</div>
      <div class="nav-item" onclick="window.location.href='reels.html'"><i class="fas fa-video"></i> Reels</div>
      <div class="nav-item" onclick="openModal('mMissing')"><i class="fas fa-user-magnifying-glass"></i> Missing Alerts</div>
      <div class="nav-item" onclick="openShield()"><i class="fas fa-shield-halved"></i> My Shield</div>
    </div>
    <div class="side-card sos-card" onclick="sosAlert()">
      <i class="fas fa-triangle-exclamation"></i>
      <div><b>Emergency SOS</b><br><small>Share live location</small></div>
    </div>
  </aside>

  <!-- HOME FEED MAIN AREA (Stories Header Explicitly Removed) -->
  <main class="feed">
    <!-- Clean Central Post Composer Element -->
    <div class="composer">
      <div class="composer-row" onclick="openModal('mComposer')">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="composer-input">What's on your mind, Abir?</div>
      </div>
      <div class="composer-actions">
        <button onclick="openModal('mComposer')"><i class="fas fa-video" style="color:#e74c3c;"></i> Live/Reel</button>
        <button onclick="openModal('mComposer')"><i class="fas fa-images" style="color:#2ecc71;"></i> Photo/Video</button>
      </div>
    </div>

    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" onclick="filterFeed('all', this)">All</button>
      <button class="filter-btn" onclick="filterFeed('posts', this)">Posts</button>
      <button class="filter-btn" onclick="filterFeed('missing', this)">Missing</button>
    </div>

    <!-- Dynamic Content Target Box for Global Application Processing Layers -->
    <div id="feedContainer">
      <!-- Injected context elements managed strictly under clean architecture scripts without comment nodes -->
    </div>
  </main>
</div>

<!-- COMPACT RESPONSIVE SCREEN BOTTOM VIEWPORT NAVIGATION -->
<nav class="bottom-nav">
  <div class="bn-item active" onclick="filterFeed('all')"><i class="fas fa-home"></i></div>
  <div class="bn-item" onclick="window.location.href='friends.html'"><i class="fas fa-users"></i></div>
  <div class="bn-item" onclick="openModal('mComposer')"><i class="fas fa-plus-circle"></i></div>
  <div class="bn-item" onclick="window.location.href='reels.html'"><i class="fas fa-video"></i></div>
  <div class="bn-item" onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i></div>
</nav>

<!-- COMPONENT MODAL OVERLAYS -->
<div class="modal-back" id="mComposer">
  <div class="modal">
    <h3>Create Post <i class="fas fa-times close-x" onclick="closeModal('mComposer')"></i></h3>
    <textarea id="postText" placeholder="What's on your mind?"></textarea>
    <button class="btn btn-primary w-100" onclick="publishPost()">Publish Post</button>
  </div>
</div>

<div class="modal-back" id="mReport">
  <div class="modal">
    <h3>Report Post <i class="fas fa-times close-x" onclick="closeModal('mReport')"></i></h3>
    <div class="form-group">
      <label>Select a reason</label>
      <select id="reportReason">
        <option value="spam">Spam or Fake Account</option>
        <option value="harassment">Harassment or Bullying</option>
        <option value="misinformation">False Information</option>
        <option value="violence">Violence or Dangerous Organizations</option>
      </select>
    </div>
    <button class="btn btn-primary w-100" onclick="submitReport()">Submit Report</button>
  </div>
</div>

<div id="toast" class="toast">Message sent!</div>

<!-- Global Application Script Dependencies Infrastructure -->
<script src="js/index.js"></script>
<script src="js/search-bar.js"></script>
<script src="js/friends.js"></script>
<script src="js/groups.js"></script>
<script src="js/games.js"></script>
<script src="js/reels.js"></script>
<script src="js/settings.js"></script>
<script src="js/profile.js"></script>
<script src="js/notification.js"></script>
</body>
    </html>
