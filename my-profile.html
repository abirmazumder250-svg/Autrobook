<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Autrobook</title>
<style>
  :root{--bg:#18191a;--card:#242526;--text:#e4e6eb;--text2:#b0b3b8;--border:#3a3b3c;--brand:#1877f2;--danger:#e91e63;}
  body.light{--bg:#f0f2f5;--card:#ffffff;--text:#050505;--text2:#65676b;--border:#ddd;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
  body{background:var(--bg);color:var(--text);}
  .cover{height:200px; background:#333; position:relative; background-size:cover; background-position:center;}
  .cover-btn{position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.6); color:white; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:13px;}
  .profile-header{padding:0 16px 16px; background:var(--card);}
  .avatar{width:130px; height:130px; border-radius:50%; border:4px solid var(--card); margin-top:-65px; background:#555; background-size:cover; background-position:center;}
  .profile-info h1{font-size:24px; margin-top:8px;}
  .profile-stats{color:var(--text2); font-size:15px; margin-top:4px; cursor:pointer;}
  .btn-row{display:flex; gap:8px; margin-top:12px;}
  .btn{flex:1; padding:8px; border-radius:6px; border:none; font-weight:bold; cursor:pointer;}
  .btn-primary{background:var(--brand); color:white;}
  .btn-gray{background:#3a3b3c; color:var(--text);}
  .section-card{background:var(--card); margin:10px 0; padding:16px; border-radius:8px;}
  .friend-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .friend-item{text-align:center; cursor:pointer;}
  .friend-item img{width:100%; aspect-ratio:1; border-radius:8px; background:#555; object-fit:cover;}
  .post-box{display:flex; gap:10px; padding:12px; background:var(--card); margin:10px 0; border-radius:8px;}
  .post-box img{width:40px; height:40px; border-radius:50%;}
  .post-box input{flex:1; background:var(--bg); border:none; border-radius:20px; padding:10px 15px; color:var(--text);}
  .post{background:var(--card); margin:10px 0; border-radius:8px;}
  .post-header{display:flex; align-items:center; gap:10px; padding:12px;}
  .post-header img{width:40px; height:40px; border-radius:50%;}
  .three-dot{margin-left:auto; font-size:20px; cursor:pointer; position:relative;}
  .menu{position:absolute; right:0; top:30px; background:var(--card); border:1px solid var(--border); border-radius:8px; display:none; z-index:10; min-width:150px;}
  .menu div{padding:10px 15px; cursor:pointer;} .menu div:hover{background:var(--bg);}
  .post-text{padding:0 12px 8px;}
  .post-img{width:100%;}
  .react-bar{display:flex; align-items:center; padding:8px 12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); gap:10px; font-size:13px; color:var(--text2);}
  .react-btns{display:flex; gap:20px; padding:4px 12px; position:relative;}
  .react-btn{cursor:pointer; padding:6px; display:flex; align-items:center; gap:5px;}
  .react-picker{display:none; position:absolute; bottom:35px; left:0; background:var(--card); padding:8px; border-radius:30px; box-shadow:0 0 10px #000; gap:8px; z-index:5;}
  .react-picker span{font-size:24px; cursor:pointer;} .react-picker span:hover{transform:scale(1.3);}
  .no-data{text-align:center; padding:40px 20px; color:var(--text2);}
  .see-all{float:right; color:var(--brand); font-size:14px; cursor:pointer;}
</style>
</head>
<body>

<!-- COVER -->
<div class="cover" id="cover">
  <label class="cover-btn" for="coverUpload">📷 Edit Cover</label>
  <input type="file" id="coverUpload" accept="image/*" style="display:none" onchange="changeCover(this)">
</div>

<!-- PROFILE HEADER -->
<div class="profile-header">
  <div class="avatar" id="avatar"></div>
  <label class="cover-btn" style="margin-top:-50px; margin-left:100px" for="avatarUpload">📷</label>
  <input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="changeAvatar(this)">
  
  <div class="profile-info">
    <h1 id="profileName">You</h1>
    <div class="profile-stats" id="profileStats" onclick="window.location.href='friend-list.html'">0 friends · 0 posts</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="addFriend()">+ Add Friend</button>
      <button class="btn btn-gray" onclick="window.location.href='edit-profile.html'">✏️ Edit profile</button>
    </div>
  </div>
</div>

<!-- FRIENDS SECTION -->
<div class="section-card">
  <b>Friends</b> <span id="friendCount" style="color:var(--text2)">0</span>
  <span class="see-all" onclick="window.location.href='friend-list.html'">See All</span>
  <div class="friend-grid" id="friendList"><div class="no-data">No friends yet</div></div>
</div>

<!-- POST BOX -->
<div class="post-box">
  <img src="" id="myAvatar">
  <input type="text" placeholder="What's on your mind?" onclick="addPost()">
</div>

<!-- POSTS -->
<div id="postsContainer"></div>

<audio id="reactSound" src="https://www.myinstants.com/media/sounds/facebook-pop.mp3"></audio>

<script>
const user = JSON.parse(localStorage.getItem('autrobook_user') || '{}');
document.getElementById('profileName').innerText = user.name || 'You';
document.getElementById('myAvatar').src = localStorage.getItem('my_avatar') || 'https://via.placeholder.com/40';
document.getElementById('avatar').style.backgroundImage = `url(${localStorage.getItem('my_avatar') || 'https://via.placeholder.com/130'})`;

function updateStats(){
  let friends = JSON.parse(localStorage.getItem('my_friends') || '[]');
  let posts = JSON.parse(localStorage.getItem('my_posts') || '[]');
  let friendText = friends.length == 0 ? 'No friends yet' : `${friends.length} friend${friends.length>1?'s':''}`;
  let postText = `${posts.length} post${posts.length>1?'s':''}`;
  document.getElementById('profileStats').innerText = `${friendText} · ${postText}`;
  document.getElementById('friendCount').innerText = friends.length;
  
  const friendDiv = document.getElementById('friendList');
  if(friends.length == 0){ friendDiv.innerHTML = `<div class="no-data">No friends yet</div>`;
  } else { friendDiv.innerHTML = friends.slice(0,6).map(f=>`<div class="friend-item"><img src="https://via.placeholder.com/100"><div style="font-size:13px">${f.name}</div></div>`).join(''); }
}

function loadPosts(){
  let posts = JSON.parse(localStorage.getItem('my_posts') || '[]');
  const container = document.getElementById('postsContainer');
  if(posts.length == 0){ container.innerHTML = `<div class="no-data"><h3>No posts available</h3></div>`; return; }
  
  container.innerHTML = posts.slice(0,5).map((p,i)=>`
    <div class="post">
      <div class="post-header">
        <img src="${localStorage.getItem('my_avatar') || 'https://via.placeholder.com/40'}">
        <div><b>${user.name || 'You'}</b><br><small style="color:var(--text2)">${timeAgo(p.time)}</small></div>
        <div class="three-dot" onclick="toggleMenu(${i})">⋯<div class="menu" id="menu${i}">
          <div onclick="togglePostNotif(${i})">${p.notif ? '🔕' : '🔔'} ${p.notif ? 'Turn off' : 'Turn on'} notifications</div>
          <div onclick="sharePost(${i})">↗️ Share</div><div onclick="editPost(${i})">✏️ Edit</div>
          <div onclick="deletePost(${i})" style="color:var(--danger)">🗑️ Delete</div>
        </div></div>
      </div>
      <div class="post-text">${p.text}</div>
      ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
      <div class="react-bar"><span>${getTotalReact(p.reacts)} reactions</span></div>
      <div class="react-btns">
        <div class="react-btn" onmouseenter="showPicker(${i})" onclick="addReact(${i},'like')"><span id="reactIcon${i}">${p.myReact || '👍'}</span> Like</div>
        <div class="react-picker" id="picker${i}" onmouseleave="hidePicker(${i})">
          <span onclick="addReact(${i},'like')">👍</span><span onclick="addReact(${i},'love')">❤️</span>
          <span onclick="addReact(${i},'care')">🥰</span><span onclick="addReact(${i},'haha')">😆</span>
          <span onclick="addReact(${i},'wow')">😮</span><span onclick="addReact(${i},'sad')">😢</span>
          <span onclick="addReact(${i},'angry')">😠</span>
        </div>
      </div>
    </div>
  `).join('');
}

function getTotalReact(r){ return Object.values(r||{}).reduce((a,b)=>a+b,0) || 0; }
function timeAgo(t){ let m = Math.floor((Date.now()-t)/1000/60); return m<60?m+'m ago':Math.floor(m/60)+'h ago'; }
function toggleMenu(i){ document.querySelectorAll('.menu').forEach(m=>m.style.display='none'); document.getElementById('menu'+i).style.display='block'; }

function addFriend(){
  let friends = JSON.parse(localStorage.getItem('my_friends') || '[]');
  friends.push({name: 'Friend ' + (friends.length+1), time: Date.now()});
  localStorage.setItem('my_friends', JSON.stringify(friends)); updateStats();
}
function addPost(){
  let text = prompt('What\'s on your mind?'); if(!text) return;
  let posts = JSON.parse(localStorage.getItem('my_posts') || '[]');
  posts.unshift({text, time:Date.now(), reacts:{}, img:null, notif:true});
  localStorage.setItem('my_posts', JSON.stringify(posts)); loadPosts(); updateStats();
}
function addReact(i, type){
  let posts = JSON.parse(localStorage.getItem('my_posts') || '[]');
  if(!posts[i].reacts) posts[i].reacts = {}; posts[i].reacts[type] = (posts[i].reacts[type]||0) + 1;
  posts[i].myReact = type=='like'?'👍':type=='love'?'❤️':type=='care'?'🥰':type=='haha'?'😆':type=='wow'?'😮':type=='sad'?'😢':'😠';
  localStorage.setItem('my_posts', JSON.stringify(posts)); document.getElementById('reactSound').play(); loadPosts();
}
function showPicker(i){ document.getElementById('picker'+i).style.display='flex'; }
function hidePicker(i){ document.getElementById('picker'+i).style.display='none'; }
function togglePostNotif(i){ let posts = JSON.parse(localStorage.getItem('my_posts') || '[]'); posts[i].notif = !posts[i].notif; localStorage.setItem('my_posts', JSON.stringify(posts)); loadPosts(); }
function sharePost(i){ navigator.clipboard.writeText(window.location.origin + '/post/' + i); alert('Post link copied ✅'); }
function editPost(i){ let posts = JSON.parse(localStorage.getItem('my_posts') || '[]'); let t = prompt('Edit:', posts[i].text); if(t){posts[i].text=t; localStorage.setItem('my_posts', JSON.stringify(posts)); loadPosts();}}
function deletePost(i){ if(confirm('Delete?')){let posts = JSON.parse(localStorage.getItem('my_posts') || '[]'); posts.splice(i,1); localStorage.setItem('my_posts', JSON.stringify(posts)); loadPosts(); updateStats();}}

function changeCover(input){ let file = input.files[0]; if(file){ let reader = new FileReader(); reader.onload = e => document.getElementById('cover').style.backgroundImage = `url(${e.target.result})`; reader.readAsDataURL(file); }}
function changeAvatar(input){ let file = input.files[0]; if(file){ let reader = new FileReader(); reader.onload = e => { localStorage.setItem('my_avatar', e.target.result); document.getElementById('avatar').style.backgroundImage = `url(${e.target.result})`; document.getElementById('myAvatar').src = e.target.result; }; reader.readAsDataURL(file); }}

window.onclick = () => document.querySelectorAll('.menu').forEach(m=>m.style.display='none');
updateStats(); loadPosts();
if(localStorage.getItem('theme') == 'light'){document.body.classList.add('light');}
</script>
</body>
</html>
